name: ACC ac-04359 Bidirectional MITM V4

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-ac04359-bidirectional-mitm-v4.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"
  ACSOLVERX_PIN: "6a12515fe1d95178a483b76d5553266e61122417"
  CID: "ac-04359"

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - name: Freeze live threshold
        run: |
          set -euo pipefail
          mkdir -p mitm_freeze
          python3 - <<'PY'
          import json,urllib.request
          from pathlib import Path
          u='https://server-9527.sair.foundation/api/acc/discoveries/snapshot?problem=ac'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r:o=json.loads(r.read().decode())
          d=o.get('data',o)
          row=next(x for x in d['items'] if x['challengeId']=='ac-04359')
          best=row['currentBestLength']
          assert isinstance(best,int),row
          Path('mitm_freeze/live_best.txt').write_text(str(best)+'\n')
          Path('mitm_freeze/live.json').write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          print('MITM_FREEZE',json.dumps({'live_best':best,'strict_bound':best-1},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acc-ac04359-mitm-freeze
          path: mitm_freeze/
          retention-days: 90

  search:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline-r1
            identity: baseline
            reps: 1
            rcap: 300000
            fcap: 300000
            matchcap: 30000
          - name: refined-r1
            identity: refined
            reps: 1
            rcap: 300000
            fcap: 300000
            matchcap: 30000
          - name: refined-r4
            identity: refined
            reps: 4
            rcap: 500000
            fcap: 500000
            matchcap: 50000
          - name: refined-r8
            identity: refined
            reps: 8
            rcap: 650000
            fcap: 650000
            matchcap: 60000
          - name: exact-r1
            identity: exact
            reps: 1
            rcap: 500000
            fcap: 500000
            matchcap: 5000
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - uses: actions/download-artifact@v4
        with:
          name: acc-ac04359-mitm-freeze
          path: /tmp/freeze

      - name: Fetch pinned verifier and GS-Sub substrate
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy==2.1.3' 'numba==0.63.1'
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet "$ACSOLVERX_PIN"
          sudo fallocate -l 8G /swapfile-mitm
          sudo chmod 600 /swapfile-mitm
          sudo mkswap /swapfile-mitm
          sudo swapon /swapfile-mitm

      - name: Hard-bound bidirectional search
        run: |
          set -o pipefail
          best=$(tr -d '[:space:]' < /tmp/freeze/live_best.txt)
          out="mitm_v4/${{ matrix.name }}"
          mkdir -p "$out"
          python3 mda/domains/andrews_curtis/bidirectional_mitm.py \
            --acc-root /tmp/acc \
            --acsolverx-root /tmp/acsolverx \
            --challenge-id "$CID" \
            --live-best "$best" \
            --identity "${{ matrix.identity }}" \
            --reps-per-key ${{ matrix.reps }} \
            --half-depth 8 \
            --bridge-max 4 \
            --reverse-label-cap ${{ matrix.rcap }} \
            --forward-label-cap ${{ matrix.fcap }} \
            --match-cap ${{ matrix.matchcap }} \
            --out-dir "$out" \
            | tee "$out.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-ac04359-mitm-v4-${{ matrix.name }}
          path: mitm_v4/
          retention-days: 90

  synthesize:
    needs: [freeze,search]
    if: always() && needs.freeze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover all search evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/freeze /tmp/search mitm_v4_final/raw
          gh run download "${{ github.run_id }}" -n acc-ac04359-mitm-freeze -D /tmp/freeze
          gh run download "${{ github.run_id }}" --pattern 'acc-ac04359-mitm-v4-*' -D /tmp/search || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports=[]; n=0
          for p in Path('/tmp/search').rglob('result.json'):
              try:r=json.loads(p.read_text())
              except Exception:continue
              reports.append(r)
              c=p.parent/'candidate.txt'
              if c.exists() and c.stat().st_size:
                  q=Path('mitm_v4_final/raw')/f'candidate_{n}.txt'
                  q.write_text(c.read_text()); n+=1
          Path('mitm_v4_final/search_results.json').write_text(json.dumps(reports,indent=2,sort_keys=True)+'\n')
          print('MITM_V4_RESULTS',json.dumps([{
            'identity':r.get('identity'),'reps':r.get('reps_per_key'),
            'status':r.get('status'),'length':r.get('length'),
            'rkeys':r.get('reverse_keys'),'fkeys':r.get('forward_keys'),
            'matches':r.get('match_attempts'),'meeting':r.get('meeting')
          } for r in reports],sort_keys=True))
          print('MITM_V4_CANDIDATES',n)
          PY

      - name: Fetch pinned verifier
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY" || { echo "SAIR_API_KEY secret missing"; exit 1; }
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"

      - name: Fortify and verify any strict candidates
        id: choose
        run: |
          set -euo pipefail
          n=$(find mitm_v4_final/raw -name '*.txt' -type f -size +0c | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "has_candidate=false" >> "$GITHUB_OUTPUT"
            echo "NO_STRICT_MITM_CANDIDATE"
            exit 0
          fi
          echo "has_candidate=true" >> "$GITHUB_OUTPUT"
          mkdir -p mitm_v4_final/fortify
          python3 acc_competitive/proof_atlas_fortify_v1.py \
            --acc-root /tmp/acc \
            --glob 'mitm_v4_final/raw/*.txt' \
            --out-dir mitm_v4_final/fortify \
            --reverse-depth 7 --reverse-cap 250000 \
            | tee mitm_v4_final/fortify.log
          best=$(tr -d '[:space:]' < /tmp/freeze/live_best.txt)
          python3 acc_competitive/peephole_superopt_v1.py \
            --acc-root /tmp/acc \
            --candidate-file mitm_v4_final/fortify/fortified_ac.txt \
            --challenge-id "$CID" \
            --frozen-best "$best" \
            --out-dir mitm_v4_final/superopt \
            --max-window 7 \
            | tee mitm_v4_final/superopt.log
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          acc=Path('/tmp/acc');sys.path.insert(0,str(acc/'competition/tools'))
          from verifier import core,stable_core
          man=json.loads((acc/'competition/tools/verifier/data/manifest.json').read_text())
          by={c['challenge_id']:c for c in man['challenges']}; lim=man['limits']
          line=next(x for x in Path('mitm_v4_final/superopt/pending_submission.txt').read_text().splitlines()
                    if x.startswith('ac-04359:'))
          m=list(json.loads(line.split(':',1)[1].strip()))
          c=by['ac-04359'];v=core.verify(c,m,c['move_spec_version'],lim);assert v['ok'],v
          live=int(Path('/tmp/freeze/live_best.txt').read_text())
          assert len(m)<live,(len(m),live)
          sid='sac-04359';sm=m+[16,15];sc=by[sid]
          sv=stable_core.verify(sc,sm,sc['move_spec_version'],lim);assert sv['ok'],sv
          Path('mitm_v4_final/final_candidates.txt').write_text(
              'ac-04359: '+json.dumps(m,separators=(',',':'))+'\n'+
              'sac-04359: '+json.dumps(sm,separators=(',',':'))+'\n')
          print('MITM_V4_FINAL',json.dumps({
            'ac_length':len(m),'stable_length':len(sm),'frozen_live':live,
            'hash':v.get('certificate_hash')
          },sort_keys=True))
          PY
          PYTHONPATH=/tmp/acc/competition/tools python3 -m verifier \
            --manifest /tmp/acc/competition/tools/verifier/data/manifest.json \
            --submission mitm_v4_final/final_candidates.txt

      - name: Fresh live gate and publish only strict records
        if: steps.choose.outputs.has_candidate == 'true'
        env:
          ACC_SUBMISSION_FILE: mitm_v4_final/final_candidates.txt
          ACC_SUBMIT_OUT: mitm_v4_final/publish
        run: |
          set -euo pipefail
          python3 acc_submit/submit_live_filtered.py | tee mitm_v4_final/publish.log

      - name: Emit typed terminal result
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def rd(p):
              p=Path(p);return json.loads(p.read_text()) if p.exists() else None
          rs=rd('mitm_v4_final/search_results.json') or []
          found=[r for r in rs if r.get('found')]
          if found:
              status='VERIFIED_STRICT_MITM_CANDIDATE'
          elif any(str(r.get('status','')).startswith('UNKNOWN_') for r in rs):
              status='UNKNOWN_SEARCH_NO_RECORD_YET'
          else:
              status='NO_STRICT_PATH_IN_TESTED_REPRESENTATION_SEARCH'
          out={
            'experiment':'ACC_AC04359_BIDIRECTIONAL_MITM_V4',
            'status':status,
            'frozen_live_best':int(Path('/tmp/freeze/live_best.txt').read_text()),
            'search_results':rs,
            'fortification':rd('mitm_v4_final/fortify/report.json'),
            'superopt':rd('mitm_v4_final/superopt/report.json'),
            'comparison':rd('mitm_v4_final/publish/comparison.json'),
            'pre_submit':rd('mitm_v4_final/publish/pre_submit_summary.json'),
            'post_submit':rd('mitm_v4_final/publish/post_submit_summary.json'),
          }
          Path('mitm_v4_final/report.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('MITM_V4_TERMINAL',json.dumps({
            'status':status,'found':len(found),
            'best_found':min([r['length'] for r in found],default=None)
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-ac04359-mitm-v4-final
          path: mitm_v4_final/
          retention-days: 90

# Public live data supplies only the record threshold. No competitor certificate
# is accessed. All transitions and final certificates are exact official moves.
