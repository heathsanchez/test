name: ACC ac-04359 Global Moat Completion V3

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-ac04359-moat-corridor-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"
  ACSOLVERX_PIN: "6a12515fe1d95178a483b76d5553266e61122417"
  CID: "ac-04359"

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - name: Freeze current live moat
        run: |
          set -euo pipefail
          mkdir -p freeze_v3
          python3 - <<'PY'
          import json,urllib.request
          from pathlib import Path
          u='https://server-9527.sair.foundation/api/acc/discoveries/snapshot?problem=ac'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r:o=json.loads(r.read().decode())
          d=o.get('data',o)
          row=next(x for x in d['items'] if x['challengeId']=='ac-04359')
          best=row['currentBestLength']; assert isinstance(best,int)
          Path('freeze_v3/live_best.txt').write_text(str(best)+'\n')
          Path('freeze_v3/live.json').write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          print('GLOBAL_MOAT_FREEZE',json.dumps({'live_best':best,'strict_bound':best-1},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acc-ac04359-global-v3-freeze
          path: freeze_v3/
          retention-days: 90

  bounded-search:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        identity: [baseline, refined]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - uses: actions/download-artifact@v4
        with:
          name: acc-ac04359-global-v3-freeze
          path: /tmp/freeze
      - name: Fetch pinned ground and substrate
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy==2.1.3' 'numba==0.63.1'
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet "$ACSOLVERX_PIN"
          sudo fallocate -l 10G /swapfile-moat
          sudo chmod 600 /swapfile-moat
          sudo mkswap /swapfile-moat
          sudo swapon /swapfile-moat
      - name: Complete existing strict-bound search
        run: |
          set -o pipefail
          best=$(tr -d '[:space:]' < /tmp/freeze/live_best.txt)
          out="global_v3/${{ matrix.identity }}"
          mkdir -p "$out"
          python3 -u mda/domains/andrews_curtis/shortest_moat_search.py \
            --acc-root /tmp/acc \
            --acsolverx-root /tmp/acsolverx \
            --challenge-id "$CID" \
            --live-best "$best" \
            --identity "${{ matrix.identity }}" \
            --node-cap 500000 \
            --reverse-depth 8 \
            --reverse-cap 750000 \
            --out-dir "$out" \
            | tee "$out.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-ac04359-global-v3-${{ matrix.identity }}
          path: global_v3/
          retention-days: 90

  publish:
    needs: [freeze,bounded-search]
    if: always() && needs.freeze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - name: Recover any verified strict candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/downloads global_v3_publish
          gh run download "${{ github.run_id }}" --pattern 'acc-ac04359-global-v3-*' -D /tmp/downloads || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('/tmp/downloads').rglob('candidate.txt'):
              for line in p.read_text().splitlines():
                  if line.startswith('ac-04359:'):
                      m=json.loads(line.split(':',1)[1].strip()); rows.append((len(m),line))
          rows.sort()
          if rows:
              Path('global_v3_publish/candidates.txt').write_text(rows[0][1]+'\n')
              print('GLOBAL_V3_CANDIDATE',rows[0][0])
          else:
              Path('global_v3_publish/candidates.txt').write_text('')
              print('GLOBAL_V3_NO_CANDIDATE')
          PY
      - name: Pinned replay and live strict publication
        if: hashFiles('global_v3_publish/candidates.txt') != ''
        env:
          ACC_SUBMISSION_FILE: global_v3_publish/candidates.txt
          ACC_SUBMIT_OUT: global_v3_publish/publish
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          if [ ! -s global_v3_publish/candidates.txt ]; then echo NO_CANDIDATE; exit 0; fi
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          PYTHONPATH=/tmp/acc/competition/tools python3 -m verifier \
            --manifest /tmp/acc/competition/tools/verifier/data/manifest.json \
            --submission global_v3_publish/candidates.txt
          python3 acc_submit/submit_live_filtered.py | tee global_v3_publish/publish.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-ac04359-global-v3-final
          path: global_v3_publish/
          retention-days: 90

# V2 exhausted exact local windows 7-9 and reverse-atlas salvage without
# shortening the 18-move seed. V3 changes only execution horizon: it completes
# the already-defined global strict-bound search. No representation/compiler
# growth is introduced. Every candidate is pinned-replayed and live-filtered.
