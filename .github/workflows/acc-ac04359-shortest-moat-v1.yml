name: ACC ac-04359 Shortest-Proof Moat V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-ac04359-shortest-moat-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"
  ACSOLVERX_PIN: "6a12515fe1d95178a483b76d5553266e61122417"
  SOURCE_RUN: "34825953902"
  CID: "ac-04359"

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Freeze live record and our fortified seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/source moat_freeze
          gh run download "$SOURCE_RUN" -n acc-mda-causal-strict-steal-publication -D /tmp/source
          seed=$(find /tmp/source -path '*/mda_causal_fortified/fortified_ac.txt' -print -quit)
          test -n "$seed"
          grep '^ac-04359:' "$seed" > moat_freeze/seed.txt
          python3 - <<'PY'
          import json,urllib.request
          from pathlib import Path
          u='https://server-9527.sair.foundation/api/acc/discoveries/snapshot?problem=ac'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r:o=json.loads(r.read().decode())
          d=o.get('data',o)
          row=next(x for x in d['items'] if x['challengeId']=='ac-04359')
          best=row['currentBestLength']
          assert isinstance(best,int)
          Path('moat_freeze/live.json').write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          Path('moat_freeze/live_best.txt').write_text(str(best)+'\n')
          line=Path('moat_freeze/seed.txt').read_text().strip()
          moves=json.loads(line.split(':',1)[1].strip())
          print('MOAT_FREEZE',json.dumps({'challenge':'ac-04359','live_best':best,'our_seed':len(moves)},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: acc-ac04359-moat-freeze
          path: moat_freeze/
          retention-days: 90

  bounded-search:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        identity: [baseline, refined]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - uses: actions/download-artifact@v4
        with:
          name: acc-ac04359-moat-freeze
          path: /tmp/freeze

      - name: Fetch pinned ground and substrate
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy==2.1.3' 'numba==0.63.1'
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet "$ACSOLVERX_PIN"
          sudo fallocate -l 10G /swapfile-moat
          sudo chmod 600 /swapfile-moat
          sudo mkswap /swapfile-moat
          sudo swapon /swapfile-moat

      - name: Search only below the frozen record
        run: |
          set -o pipefail
          best=$(tr -d '[:space:]' < /tmp/freeze/live_best.txt)
          out="moat_search/${{ matrix.identity }}"
          mkdir -p "$out"
          python3 mda/domains/andrews_curtis/shortest_moat_search.py \
            --acc-root /tmp/acc \
            --acsolverx-root /tmp/acsolverx \
            --challenge-id "$CID" \
            --live-best "$best" \
            --identity "${{ matrix.identity }}" \
            --node-cap 500000 \
            --reverse-depth 8 \
            --reverse-cap 750000 \
            --out-dir "$out" \
            | tee "$out.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-ac04359-bounded-${{ matrix.identity }}
          path: moat_search/
          retention-days: 90

  synthesize-publish:
    needs: [freeze,bounded-search]
    if: always() && needs.freeze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover seed and bounded-search candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/freeze /tmp/cands/raw /tmp/downloads
          gh run download "${{ github.run_id }}" -n acc-ac04359-moat-freeze -D /tmp/freeze
          cp /tmp/freeze/seed.txt /tmp/cands/raw/seed.txt
          gh run download "${{ github.run_id }}" --pattern 'acc-ac04359-bounded-*' -D /tmp/downloads || true
          python3 - <<'PY'
          from pathlib import Path
          n=0
          for p in Path('/tmp/downloads').rglob('candidate.txt'):
              if p.exists() and p.stat().st_size:
                  q=Path('/tmp/cands/raw')/f'search_{n}.txt'
                  q.write_text(p.read_text()); n+=1
          print('RECOVERED_SEARCH_CANDIDATES',n)
          PY
          cat /tmp/cands/raw/*.txt

      - name: Fetch pinned official verifier
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY" || { echo "SAIR_API_KEY secret missing"; exit 1; }
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          sudo fallocate -l 10G /swapfile-final
          sudo chmod 600 /swapfile-final
          sudo mkswap /swapfile-final
          sudo swapon /swapfile-final

      - name: Fortify all routes and exact-superoptimize the shortest
        run: |
          set -euo pipefail
          mkdir -p moat_final
          python3 acc_competitive/proof_atlas_fortify_v1.py \
            --acc-root /tmp/acc \
            --glob '/tmp/cands/raw/*.txt' \
            --out-dir moat_final/atlas \
            --reverse-depth 8 --reverse-cap 750000 \
            | tee moat_final/atlas.log
          best=$(tr -d '[:space:]' < /tmp/freeze/live_best.txt)
          python3 acc_competitive/peephole_superopt_v1.py \
            --acc-root /tmp/acc \
            --candidate-file moat_final/atlas/fortified_ac.txt \
            --challenge-id "$CID" \
            --frozen-best "$best" \
            --out-dir moat_final/superopt \
            --max-window 9 \
            | tee moat_final/superopt.log

      - name: Build stable derivative and official-verify pair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          acc=Path('/tmp/acc');sys.path.insert(0,str(acc/'competition/tools'))
          from verifier import core,stable_core
          man=json.loads((acc/'competition/tools/verifier/data/manifest.json').read_text())
          by={c['challenge_id']:c for c in man['challenges']};lim=man['limits']
          lines=Path('moat_final/superopt/pending_submission.txt').read_text().splitlines()
          line=next(x for x in lines if x.startswith('ac-04359:'))
          moves=list(json.loads(line.split(':',1)[1].strip()))
          c=by['ac-04359'];v=core.verify(c,moves,c['move_spec_version'],lim);assert v['ok'],v
          sid='sac-04359';sm=moves+[16,15];sc=by[sid]
          sv=stable_core.verify(sc,sm,sc['move_spec_version'],lim);assert sv['ok'],sv
          Path('moat_final/final_candidates.txt').write_text(
            'ac-04359: '+json.dumps(moves,separators=(',',':'))+'\n'+
            'sac-04359: '+json.dumps(sm,separators=(',',':'))+'\n')
          print('MOAT_FINAL_CANDIDATE',json.dumps({'ac':len(moves),'stable':len(sm),'hash':v['certificate_hash']},sort_keys=True))
          PY
          PYTHONPATH=/tmp/acc/competition/tools python3 -m verifier \
            --manifest /tmp/acc/competition/tools/verifier/data/manifest.json \
            --submission moat_final/final_candidates.txt

      - name: Live filter and publish only a strict record
        env:
          ACC_SUBMISSION_FILE: moat_final/final_candidates.txt
          ACC_SUBMIT_OUT: moat_final/publish
        run: |
          set -euo pipefail
          python3 acc_submit/submit_live_filtered.py | tee moat_final/publish.log

      - name: Emit terminal result
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def read(p):
              p=Path(p); return json.loads(p.read_text()) if p.exists() else None
          r={
            'experiment':'ACC_AC04359_SHORTEST_PROOF_MOAT_V1',
            'frozen_live_best':int(Path('/tmp/freeze/live_best.txt').read_text()),
            'atlas':read('moat_final/atlas/report.json'),
            'superopt':read('moat_final/superopt/report.json'),
            'pre_submit':read('moat_final/publish/pre_submit_summary.json'),
            'post_submit':read('moat_final/publish/post_submit_summary.json'),
            'comparison':read('moat_final/publish/comparison.json'),
          }
          Path('moat_final/report.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('MOAT_TERMINAL',json.dumps(r,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-ac04359-shortest-moat-final
          path: moat_final/
          retention-days: 90

# Competitor submissions are private during the competition. This workflow uses
# only our own verified paths, public challenge state/methods, and the official
# verifier. Publication is strict-live-record only.
