name: ACC Atlas Fiber Refinement V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-atlas-fiber-refinement-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - name: Fetch pinned ACC, newest Proof Atlas, prior quotient rows, and live authority
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          mkdir -p /tmp/atlas /tmp/prior fiber/input

          AID="$(gh api 'repos/heathsanchez/test/actions/artifacts?name=acc-proof-atlas-state&per_page=1' --jq '.artifacts[0].id // empty')"
          test -n "$AID"
          gh api "repos/heathsanchez/test/actions/artifacts/$AID/zip" > /tmp/atlas.zip
          unzip -q /tmp/atlas.zip -d /tmp/atlas
          ATLAS="$(find /tmp/atlas -name proof_atlas.sqlite -print -quit)"
          test -n "$ATLAS"
          cp "$ATLAS" fiber/input/proof_atlas.sqlite

          PID="$(gh api 'repos/heathsanchez/test/actions/artifacts?name=acc-atlas-product-depth4-v1&per_page=1' --jq '.artifacts[0].id // empty')"
          test -n "$PID"
          gh api "repos/heathsanchez/test/actions/artifacts/$PID/zip" > /tmp/prior.zip
          unzip -q /tmp/prior.zip -d /tmp/prior
          PRIOR="$(find /tmp/prior -path '*/product/rows.json' -o -name rows.json | head -1)"
          test -n "$PRIOR"
          cp "$PRIOR" fiber/input/prior_rows.json

          python3 - <<'PY'
          import json,sqlite3,urllib.request
          from pathlib import Path
          db=sqlite3.connect('fiber/input/proof_atlas.sqlite')
          print('ATLAS_STATES',db.execute('select count(*) from atlas').fetchone()[0]); db.close()
          u='https://server-9527.sair.foundation/api/acc/discoveries/snapshot?problem=ac'
          req=urllib.request.Request(u,headers={'Accept':'application/json','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r:o=json.loads(r.read().decode())
          Path('fiber/input/snapshot_ac.json').write_text(json.dumps(o))
          d=o.get('data',o); items=d.get('items',[])
          uns=sum(x.get('status')!='solved' or (x.get('kTeams') or 0)==0 for x in items)
          print('LIVE_AC',json.dumps({'rows':len(items),'unsolved':uns},sort_keys=True))
          PY
      - name: Qualify cycle-type-distinct fiber refinement through depth 5
        run: |
          set -euo pipefail
          python3 acc_competitive/atlas_fiber_refinement_v1.py \
            --acc-root /tmp/acc \
            --atlas fiber/input/proof_atlas.sqlite \
            --snapshot-ac fiber/input/snapshot_ac.json \
            --prior-rows fiber/input/prior_rows.json \
            --radius4-cert acc_competitive/atlas_exact_radius4_exhausted_v1.json \
            --out-dir fiber/out \
            --max-depth 5 \
            | tee fiber/refinement.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-atlas-fiber-refinement-v1
          path: fiber/
          retention-days: 90
          if-no-files-found: warn
