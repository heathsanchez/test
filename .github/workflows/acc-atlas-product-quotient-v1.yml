name: ACC Atlas Product Quotient V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-atlas-product-quotient-v1.yml"
      - "acc_competitive/atlas_product_quotient_v1.py"
      - "acc_competitive/atlas_product_exact_lift_v1.py"
      - "acc_competitive/atlas_large_quotient_bridge_v2.py"
      - "acc_competitive/finite_group_pdb_v1.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - name: Fetch pinned ACC, newest Proof Atlas, and live AC authority
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          mkdir -p /tmp/atlas productq/input
          ID="$(gh api 'repos/heathsanchez/test/actions/artifacts?name=acc-proof-atlas-state&per_page=1' --jq '.artifacts[0].id // empty')"
          test -n "$ID"
          gh api "repos/heathsanchez/test/actions/artifacts/$ID/zip" > /tmp/atlas.zip
          unzip -q /tmp/atlas.zip -d /tmp/atlas
          ATLAS="$(find /tmp/atlas -name proof_atlas.sqlite -print -quit)"
          test -n "$ATLAS"
          cp "$ATLAS" productq/input/proof_atlas.sqlite
          python3 - <<'PY'
          import json,sqlite3,urllib.request
          from pathlib import Path
          db=sqlite3.connect('productq/input/proof_atlas.sqlite')
          print('ATLAS_STATES',db.execute('select count(*) from atlas').fetchone()[0]);db.close()
          u='https://server-9527.sair.foundation/api/acc/discoveries/snapshot?problem=ac'
          req=urllib.request.Request(u,headers={'Accept':'application/json','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r:o=json.loads(r.read().decode())
          Path('productq/input/snapshot_ac.json').write_text(json.dumps(o))
          d=o.get('data',o);items=d.get('items',[])
          uns=sum(x.get('status')!='solved' or (x.get('kTeams') or 0)==0 for x in items)
          print('LIVE_AC',json.dumps({'rows':len(items),'unsolved':uns},sort_keys=True))
          PY
      - name: Recompute independent S6-S7 guard on identical inputs
        run: |
          set -euo pipefail
          python3 acc_competitive/atlas_large_quotient_bridge_v2.py \
            --acc-root /tmp/acc \
            --atlas productq/input/proof_atlas.sqlite \
            --snapshot-ac productq/input/snapshot_ac.json \
            --attempted acc_competitive/competitive_attempted_seed_v1.json \
            --exclude acc_competitive/atlas_unsolved_v2_exhausted.json \
            --out-dir productq/independent \
            --max-depth 3 \
            > productq/independent.log
          tail -n 20 productq/independent.log
      - name: Qualify synchronized product quotient
        run: |
          set -euo pipefail
          python3 acc_competitive/atlas_product_quotient_v1.py \
            --acc-root /tmp/acc \
            --atlas productq/input/proof_atlas.sqlite \
            --snapshot-ac productq/input/snapshot_ac.json \
            --attempted acc_competitive/competitive_attempted_seed_v1.json \
            --exclude acc_competitive/atlas_unsolved_v2_exhausted.json \
            --prior-rows productq/independent/rows.json \
            --out-dir productq/product \
            --max-depth 3 \
            | tee productq/product.log
      - name: Exact-lift every quotient witness through depth 3
        run: |
          set -euo pipefail
          python3 acc_competitive/atlas_product_exact_lift_v1.py \
            --acc-root /tmp/acc \
            --atlas productq/input/proof_atlas.sqlite \
            --product-rows productq/product/rows.json \
            --out productq/exact_lift.json \
            | tee productq/exact_lift.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-atlas-product-quotient-v1
          path: productq/
          retention-days: 90
          if-no-files-found: warn
