name: ACC Atomic-Cost Representative Search V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-atomic-cost-v1.yml"
      - "andrews_curtis/solver_v4_gssub_atomic.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"
  ACSOLVERX_PIN: "6a12515fe1d95178a483b76d5553266e61122417"

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Fetch pinned competition authority
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"

      - name: Freeze fresh ACC state and MathGraph position
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          python3 acc_competitive/competitive_scout_v2.py \
            --acc-root /tmp/acc \
            --out-dir acc_competitive/atomic_scout \
            --attack-count 2 \
            --defend-fraction 0 \
            --mechanism-id gssub-v4-atomic-representative \
            --shards 1 \
            | tee acc_competitive/atomic_scout.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          xs=json.loads(Path('acc_competitive/atomic_scout/mathgraph_status.json').read_text())
          counts={}
          for x in xs: counts[x['status']]=counts.get(x['status'],0)+1
          snap=json.loads(Path('acc_competitive/atomic_scout/snapshot_ac.json').read_text())
          d=snap.get('data',snap); m={x['challengeId']:x for x in d['items']}
          targets={cid:{'status':m[cid].get('status'),'best':m[cid].get('currentBestLength'),'kTeams':m[cid].get('kTeams')} for cid in ('ac-01910','ac-04501')}
          print('LIVE_ACC_STATE',json.dumps({'mathgraph':counts,'targets':targets},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: acc-atomic-scout-v1
          path: |
            acc_competitive/atomic_scout/
            acc_competitive/atomic_scout.log
          retention-days: 90

  search:
    needs: scout
    strategy:
      fail-fast: false
      matrix:
        target: [ac-01910, ac-04501]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover frozen live snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/scout
          gh run download "${{ github.run_id }}" -n acc-atomic-scout-v1 -D /tmp/scout
          snap=$(find /tmp/scout -name snapshot_ac.json -print -quit)
          test -n "$snap"
          cp "$snap" /tmp/snapshot_ac.json

      - name: Prepare pinned search and verifier authority
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy==2.1.3' 'numba==0.63.1'
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet "$ACSOLVERX_PIN"
          SWAP=/swapfile-extra-acc-atomic
          sudo fallocate -l 8G "$SWAP"
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"

      - name: Search exact representatives by official atomic cost
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -o pipefail
          out="acc_competitive/atomic_search/${{ matrix.target }}"
          mkdir -p "$out"
          python3 andrews_curtis/solver_v4_gssub_atomic.py \
            --acc-root /tmp/acc \
            --acsolverx-root /tmp/acsolverx \
            --out-dir "$out" \
            --target-id "${{ matrix.target }}" \
            --snapshot-ac-file /tmp/snapshot_ac.json \
            --max-nodes 400000 \
            --max-quotient-total 100 \
            --reverse-depth 7 \
            --reverse-cap 250000 \
            --representatives-per-quotient 12 \
            --search-seconds 6000 \
            | tee "$out.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-atomic-search-${{ matrix.target }}
          path: |
            acc_competitive/atomic_search/
          retention-days: 90

  consolidate_publish:
    needs: [scout, search]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover live scout and atomic-search evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/scout /tmp/searches
          gh run download "${{ github.run_id }}" -n acc-atomic-scout-v1 -D /tmp/scout
          gh run download "${{ github.run_id }}" --pattern 'acc-atomic-search-*' -D /tmp/searches || true
          find /tmp/searches -name report.json -print | sort
          find /tmp/searches -name submission_v4.txt -print | sort

      - name: Fetch pinned official verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"

      - name: Merge only strict pinned-verifier-clean AC candidates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          best={}
          for p in Path('/tmp/searches').rglob('submission_v4.txt'):
              for line in p.read_text().splitlines():
                  m=re.match(r'^(ac-[^:]+):\s*(\[.*\])$',line.strip())
                  if not m: continue
                  cid=m.group(1); moves=json.loads(m.group(2))
                  if cid not in best or len(moves)<len(best[cid]): best[cid]=moves
          out=Path('acc_competitive/atomic_raw_ac.txt')
          out.write_text(''.join(f"{cid}: {json.dumps(m,separators=(',',':'))}\n" for cid,m in sorted(best.items())))
          print('ATOMIC_VERIFIED_STRICT_CANDIDATES',len(best),{k:len(v) for k,v in sorted(best.items())})
          PY

      - name: Salvage mechanism-change near-misses through proof atlas
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/atomic_atlas
          if [ ! -s acc_competitive/atomic_raw_ac.txt ]; then
            echo "NO_ATOMIC_STRICT_CANDIDATES"
            : > acc_competitive/atomic_atlas/fortified_ac.txt
            exit 0
          fi
          python3 acc_competitive/proof_atlas_fortify_v1.py \
            --acc-root /tmp/acc \
            --glob 'acc_competitive/atomic_raw_ac.txt' \
            --out-dir acc_competitive/atomic_atlas \
            --reverse-depth 7 --reverse-cap 250000 \
            | tee acc_competitive/atomic_atlas.log

      - name: Peephole salvage atomic margins
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/atomic_peephole
          if [ ! -s acc_competitive/atomic_atlas/fortified_ac.txt ]; then
            echo "NO_ATOMIC_ATLAS_CANDIDATES"
            : > acc_competitive/atomic_peephole/fortified_ac.txt
            exit 0
          fi
          python3 acc_competitive/batch_peephole_fortify_v1.py \
            --acc-root /tmp/acc \
            --input acc_competitive/atomic_atlas/fortified_ac.txt \
            --out-dir acc_competitive/atomic_peephole \
            --thin-win-frac 0.25 --near-miss-frac 0.10 --max-window 6 --max-path 6000 \
            | tee acc_competitive/atomic_peephole.log

      - name: Fresh-recheck, quota-gate, publish scoring rows only
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          mkdir -p acc_competitive/atomic_publish
          if [ ! -s acc_competitive/atomic_peephole/fortified_ac.txt ]; then
            echo "NO_ATOMIC_VERIFIED_CANDIDATES_TO_PUBLISH"
            exit 0
          fi
          python3 andrews_curtis/continuous_aggregate_v5.py \
            --acc-root /tmp/acc \
            --glob 'acc_competitive/atomic_peephole/fortified_ac.txt' \
            --out-dir acc_competitive/atomic_publish \
            --cycle 1 \
            | tee acc_competitive/atomic_publish.log

      - name: Atomic residual summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          def J(p):
              q=Path(p); return json.loads(q.read_text()) if q.exists() else {}
          statuses=list(Path('/tmp/scout').rglob('mathgraph_status.json'))
          xs=json.loads(statuses[0].read_text()) if statuses else []
          counts={}
          for x in xs: counts[x['status']]=counts.get(x['status'],0)+1
          reports=[]
          for p in sorted(Path('/tmp/searches').rglob('report.json')):
              r=J(p)
              reports.append({
                'challenge_id':r.get('challenge_id'),
                'live_best':r.get('live_best'),
                'candidate_length':r.get('candidate_length'),
                'verified':r.get('verified'),
                'search_code':(r.get('search') or {}).get('code'),
                'nodes':(r.get('search') or {}).get('nodes'),
                'quotient_keys_seen':(r.get('search') or {}).get('quotient_keys_seen'),
                'exact_states_seen':(r.get('search') or {}).get('exact_states_seen'),
              })
          pub=J('acc_competitive/atomic_publish/report.json')
          summary={
            'phase':'atomic-cost representative-aware GS-Sub search',
            'mathgraph_live_status':counts,
            'targets':reports,
            'fresh_rows_published':pub.get('selected_rows',0),
            'published_strict_improvements':pub.get('selected_strict_improvements',0),
            'published_scoring_ties':pub.get('selected_scoring_ties',0),
            'daily_submissions_remaining_pre':pub.get('daily_submissions_remaining_pre'),
            'submission_id':pub.get('submission_id'),
            'terminal_status':pub.get('terminal_status'),
          }
          Path('acc_competitive/atomic_controller_report.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('ATOMIC_CONTROLLER',json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-atomic-cost-v1
          path: |
            acc_competitive/atomic_controller_report.json
            acc_competitive/atomic_raw_ac.txt
            acc_competitive/atomic_atlas/
            acc_competitive/atomic_atlas.log
            acc_competitive/atomic_peephole/
            acc_competitive/atomic_peephole.log
            acc_competitive/atomic_publish/
            acc_competitive/atomic_publish.log
            /tmp/scout/
            /tmp/searches/
          retention-days: 90
