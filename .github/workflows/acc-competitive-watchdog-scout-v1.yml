name: ACC Competitive Watchdog Scout V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-competitive-watchdog-scout-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
    steps:
      - name: Fresh frontier and authenticated quota
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          KEY=os.environ['SAIR_API_KEY']
          PUB='https://server-9527.sair.foundation'
          API='https://api.sair.foundation/api/public/v1'

          def get(url, auth=False):
              h={'Accept':'application/json','User-Agent':'Mozilla/5.0'}
              if auth: h['Authorization']=f'Bearer {KEY}'
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())
          def data(o): return o.get('data',o) if isinstance(o,dict) else o
          def snap(problem):
              o=get(f'{PUB}/api/acc/discoveries/snapshot?problem={problem}')
              d=data(o)
              out={}
              for x in d['items']:
                  cid=x.get('problemId') or x.get('challengeId')
                  if cid:
                      out[cid]=x
              return out
          def stamp(rec):
              for k in ('receivedAt','updatedAt','createdAt','submittedAt','created','timestamp','submitted'):
                  s=rec.get(k) if isinstance(rec,dict) else None
                  if not isinstance(s,str) or not s.strip(): continue
                  try:
                      t=s.strip().replace('Z','+00:00')
                      dt=datetime.fromisoformat(t)
                      if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
                      return dt.astimezone(timezone.utc)
                  except Exception: pass
              return None

          ac=snap('ac'); sac=snap('stable_ac')
          mine=data(get(f'{API}/competitions/acc/submissions/mine?limit=100',auth=True))
          comp=data(get(f'{API}/competitions/acc',auth=True))
          items=mine.get('items',[]) if isinstance(mine,dict) else []
          lim=None
          for k in ('dailySubmissions','dailySubmissionLimit','submissionsPerDay'):
              v=comp.get(k) if isinstance(comp,dict) else None
              if isinstance(v,int): lim=v; break
          if lim is None: lim=40
          today=datetime.now(timezone.utc).date()
          stamps=[stamp(x) for x in items]
          used=sum(x is not None and x.date()==today for x in stamps)
          remaining=max(0,lim-used)

          ours={}
          for sub in items:
              for rr in sub.get('results',[]) if isinstance(sub,dict) else []:
                  if not rr.get('ok'): continue
                  cid=rr.get('challenge_id'); n=rr.get('length')
                  if cid and isinstance(n,int): ours[cid]=min(n,ours.get(cid,n))
          unique=tied=lost=0
          for cid,n in ours.items():
              row=(ac if cid.startswith('ac-') else sac).get(cid)
              if not row or row.get('status')!='solved' or not isinstance(row.get('currentBestLength'),int): continue
              best=row['currentBestLength']; kt=row.get('kTeams')
              if n==best and kt==1: unique+=1
              elif n==best: tied+=1
              elif n>best: lost+=1
          focus=['ac-00676','ac-01921','ac-02986','ac-03665','ac-01910','ac-04501']
          targets={cid:{'best':ac[cid].get('currentBestLength'),'kTeams':ac[cid].get('kTeams'),'status':ac[cid].get('status')} for cid in focus if cid in ac}
          out={'utc':datetime.now(timezone.utc).isoformat(),'quota':{'used':used,'remaining':remaining,'limit':lim},'standing':{'unique':unique,'tied':tied,'lost':lost},'targets':targets}
          print('ACC_WATCHDOG',json.dumps(out,sort_keys=True))
          open('acc_watchdog.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acc-competitive-watchdog-scout-v1
          path: acc_watchdog.json
          retention-days: 30
