name: ACC Current Tail Harvest V1

on:
  push:
    branches:
      - acc-competitive-residual-v1
    paths:
      - ".github/workflows/acc-current-tail-harvest-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Fetch current public snapshots and select fresh long tail
        id: select
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/tail_freeze
          python3 - <<'PY'
          import urllib.request,json,pathlib,os
          B='https://server-9527.sair.foundation'
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          out=pathlib.Path('acc_competitive/tail_freeze')
          def get(path):
              req=urllib.request.Request(B+path,headers=H)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())
          for problem in ('ac','stable_ac'):
              obj=get('/api/acc/discoveries/snapshot?problem='+problem)
              (out/f'snapshot_{problem}.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          ac=json.loads((out/'snapshot_ac.json').read_text())
          items=ac.get('data',ac)['items']
          attempted=set(json.loads(pathlib.Path('acc_competitive/competitive_attempted_seed_v1.json').read_text()))
          prepared=json.loads(pathlib.Path('acc_competitive/PREPARED_RESET_MANIFEST_2026-09-12.json').read_text())
          attempted.update(x['challenge_id'] for x in prepared.get('pending_acquisitions',[]))
          rows=[x for x in items if x.get('status')=='solved' and x.get('kTeams')==1
                and isinstance(x.get('currentBestLength'),int) and x['currentBestLength']>=2500
                and x['challengeId'] not in attempted]
          rows.sort(key=lambda x:(-x['currentBestLength'],x['challengeId']))
          rows=rows[:36]
          ids=[x['challengeId'] for x in rows]
          (out/'selected.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('targets='+json.dumps(ids,separators=(',',':'))+'\n')
          print('TAIL_TARGETS',json.dumps({'count':len(ids),'targets':[(x['challengeId'],x['currentBestLength']) for x in rows]}))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: acc-current-tail-freeze
          path: acc_competitive/tail_freeze/
          retention-days: 30

  search:
    needs: build
    if: ${{ needs.build.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        target: ${{ fromJSON(needs.build.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - uses: actions/download-artifact@v4
        with:
          name: acc-current-tail-freeze
          path: /tmp/freeze
      - name: Fetch pinned repositories
        run: |
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet 6a12515fe1d95178a483b76d5553266e61122417
      - name: Install runtime
        run: python3 -m pip install --quiet "numpy==2.1.3" "numba==0.63.1"
      - name: Freeze one target
        run: |
          mkdir -p acc_competitive/tail_target
          printf '["%s"]\n' "${{ matrix.target }}" > acc_competitive/tail_target/id.json
      - name: One proven baseline search
        run: |
          set -o pipefail
          AC_SNAP="$(find /tmp/freeze -name snapshot_ac.json | head -1)"
          ST_SNAP="$(find /tmp/freeze -name snapshot_stable_ac.json | head -1)"
          python3 andrews_curtis/solver_v2_gssub.py \
            --acc-root /tmp/acc \
            --acsolverx-root /tmp/acsolverx \
            --out-dir "acc_competitive/out_tail_${{ matrix.target }}" \
            --target-ids-file acc_competitive/tail_target/id.json \
            --include-solved \
            --snapshot-ac-file "$AC_SNAP" \
            --snapshot-stable-file "$ST_SNAP" \
            --defer-live-filter \
            --max-targets 1 \
            --max-nodes 500000 \
            --max-quotient-total 100 \
            --reverse-depth 7 \
            --reverse-cap 250000 \
            --compiler-beam 16 \
            --depth-weight 0 \
            --search-seconds 1800 \
            | tee "acc_competitive/tail_${{ matrix.target }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-tail-${{ matrix.target }}
          path: |
            acc_competitive/out_tail_${{ matrix.target }}/
            acc_competitive/tail_${{ matrix.target }}.log
          retention-days: 90
          if-no-files-found: warn

  pool:
    needs: [build,search]
    if: always() && needs.build.result == 'success' && needs.search.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - uses: actions/download-artifact@v4
        with:
          name: acc-current-tail-freeze
          path: /tmp/freeze
      - uses: actions/download-artifact@v4
        with:
          pattern: acc-tail-*
          path: acc_competitive/tail_downloads
          merge-multiple: false
      - name: Fetch pinned verifier
        run: |
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736
      - name: Build verifier-clean pending pool
        run: |
          AC_SNAP="$(find /tmp/freeze -name snapshot_ac.json | head -1)"
          ST_SNAP="$(find /tmp/freeze -name snapshot_stable_ac.json | head -1)"
          python3 acc_competitive/offline_candidate_pool_v1.py \
            --acc-root /tmp/acc \
            --glob 'acc_competitive/tail_downloads/**/submission_v2.txt' \
            --snapshot-ac "$AC_SNAP" \
            --snapshot-stable "$ST_SNAP" \
            --out-dir acc_competitive/current_tail_pool \
            | tee acc_competitive/current_tail_pool.log
      - uses: actions/upload-artifact@v4
        with:
          name: acc-current-tail-pool
          path: |
            acc_competitive/current_tail_pool/
            acc_competitive/current_tail_pool.log
          retention-days: 90
