name: ACC Fake-Surface Screen V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - '.github/workflows/acc-fake-surface-screen-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sources
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/SAIRcompetition/Andrews-Curtis.git official
          git -C official checkout -q 99a65377c5c4f412cd9af7b8d31c41464a855736
          cp official/competition/problems/stable_ac.jsonl stable_ac.jsonl
          curl -fsSLo fsac.py https://raw.githubusercontent.com/SauersML/group-approximation/5080b7d3bb4ddd1de98d28c7f8904f48a87be463/experiments/andrews-curtis-fake-surfaces/fsac.py
          sha256sum stable_ac.jsonl fsac.py official/competition/tools/verifier/data/stable_move_spec.json | tee source-sha256.txt
      - name: Compile exact recursive elimination certificates
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, json, time
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('fsac_pinned', 'fsac.py')
          fsac = importlib.util.module_from_spec(spec); spec.loader.exec_module(fsac)
          move_spec=json.loads(Path('official/competition/tools/verifier/data/stable_move_spec.json').read_text())
          inv_map={}; mul_map={}; conj_map={}; destab_map={}
          for m in move_spec['moves']:
              c=m['category']
              if c=='inversion': inv_map[m['relator']]=m['id']
              elif c=='multiplication': mul_map[(m['relator'],m['other'],bool(m['invert_other']))]=m['id']
              elif c=='conjugation': conj_map[(m['relator'],m['conjugator'])]=m['id']
              elif c=='destabilization': destab_map[m['relator']]=m['id']
          assert destab_map[0]==15 and destab_map[1]==16

          tok={'x':1,'x^-1':-1,'y':2,'y^-1':-2}; prefix='Presentation: <x, y | '; suffix='>.'
          def word(s):
              s=s.strip(); return [] if s=='1' else [tok[t] for t in s.split()]
          def parse(desc):
              assert desc.startswith(prefix) and desc.endswith(suffix)
              parts=desc[len(prefix):-len(suffix)].split(' = 1; ')
              assert len(parts)==2 and parts[1].endswith(' = 1')
              return [word(parts[0]),word(parts[1][:-4])]
          def compile_cert(cert):
              out=[]; saw_destab=False
              for mv in cert:
                  op=mv[0]
                  if op=='destab': saw_destab=True; continue
                  assert not saw_destab, 'non-destab macro after destab'
                  if op=='inv':
                      out.append(inv_map[mv[1]])
                  elif op=='conj':
                      _,i,u=mv
                      out.extend(conj_map[(i,a)] for a in reversed(u))
                  elif op=='mulc':
                      _,j,i,u,s=mv
                      out.extend(conj_map[(i,a)] for a in reversed(u))
                      if s==-1: out.append(inv_map[i])
                      out.append(mul_map[(j,i,False)])
                      if s==-1: out.append(inv_map[i])
                      out.extend(conj_map[(i,-a)] for a in u)
                  else: raise ValueError(mv)
              assert saw_destab
              out += [destab_map[1],destab_map[0]]
              return out

          positives=[]; lines=[]; t0=time.time()
          for line in Path('stable_ac.jsonl').read_text().splitlines():
              o=json.loads(line); rels=parse(o['description']); cert=fsac.trivialize(rels,2)
              if cert is None: continue
              assert fsac.verify(rels,2,cert)
              moves=compile_cert(cert)
              positives.append({'challenge_id':o['challenge_id'],'macro_count':len(cert),'official_move_count':len(moves),'moves':moves})
              lines.append(f"{o['challenge_id']}: {json.dumps(moves,separators=(',',':'))}")
          Path('compiled_submission.txt').write_text('\n'.join(lines)+'\n')
          Path('compile_result.json').write_text(json.dumps({'status':'COMPILED','count':len(positives),'elapsed_seconds':round(time.time()-t0,3),'positives':positives},indent=2)+'\n')
          print('COMPILED',len(positives),'min_len',min(p['official_move_count'] for p in positives),'max_len',max(p['official_move_count'] for p in positives))
          PY
      - name: Pinned official verifier replay
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=official/competition/tools python3 -m verifier \
            --manifest official/competition/tools/verifier/data/manifest.json \
            --submission compiled_submission.txt --pretty | tee verifier.json
      - name: Fresh live strict-improvement gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          def get(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode())
          def data(o):return o.get('data',o) if isinstance(o,dict) else o
          comp=json.loads(Path('compile_result.json').read_text())
          verdict=json.loads(Path('verifier.json').read_text())
          vr={str(x.get('challenge_id')):x for x in verdict.get('results',[])}
          live=data(get('https://server-9527.sair.foundation/api/acc/discoveries/snapshot?problem=stable_ac'))
          lm={str(x.get('problemId') or x.get('challengeId')):x for x in live['items'] if x.get('problemId') or x.get('challengeId')}
          improvements=[]; solved_not_better=[]; unsolved=[]
          for p in comp['positives']:
              cid=p['challenge_id']; v=vr.get(cid,{})
              if not v.get('ok'): raise AssertionError(f'official verifier missing/rejected {cid}: {v}')
              n=v.get('length',p['official_move_count']); row=lm.get(cid,{})
              best=row.get('currentBestLength') if row.get('status')=='solved' and row.get('kTeams')!=0 else None
              rec={'challenge_id':cid,'candidate_len':n,'live_best':best,'gain':None if best is None else best-n,'kTeams':row.get('kTeams')}
              if best is None: unsolved.append(rec)
              elif n < best: improvements.append(rec)
              else: solved_not_better.append(rec)
          improvements.sort(key=lambda x:(-(x['gain'] or 0),x['candidate_len'],x['challenge_id']))
          result={'status':'PASS','utc':datetime.now(timezone.utc).isoformat(),'official_verified':len(comp['positives']),
                  'live_unsolved_candidates':unsolved,'strict_improvements':improvements,
                  'strict_improvement_count':len(improvements),'non_improving_count':len(solved_not_better)}
          Path('result.json').write_text(json.dumps(result,indent=2)+'\n')
          cand_ids={x['challenge_id'] for x in improvements+unsolved}
          out=[]
          for line in Path('compiled_submission.txt').read_text().splitlines():
              if line.split(':',1)[0] in cand_ids: out.append(line)
          Path('candidate_submission.txt').write_text('\n'.join(out)+('\n' if out else ''))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acc-fake-surface-screen-v1
          path: |
            result.json
            compile_result.json
            compiled_submission.txt
            candidate_submission.txt
            verifier.json
            source-sha256.txt
          retention-days: 90
