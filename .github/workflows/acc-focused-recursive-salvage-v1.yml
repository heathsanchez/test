name: ACC Focused Recursive Salvage V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-focused-recursive-salvage-v1.yml"
      - "andrews_curtis/solver_v24_gssub_focused_recursive_salvage.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"
  ACSOLVERX_PIN: "6a12515fe1d95178a483b76d5553266e61122417"

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - name: Freeze fresh live ACC state and authenticated quota
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          python3 acc_competitive/competitive_scout_v2.py \
            --acc-root /tmp/acc \
            --out-dir acc_competitive/focused_recursive_scout \
            --attack-count 1 --defend-fraction 0 \
            --mechanism-id gssub-v24-focused-recursive-salvage --shards 1 \
            | tee acc_competitive/focused_recursive_scout.log
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'andrews_curtis')
          from solver_v2_gssub import api,data_obj
          from continuous_aggregate_v5 import quota_state
          snap=json.loads(Path('acc_competitive/focused_recursive_scout/snapshot_ac.json').read_text())
          d=snap.get('data',snap); rows={x['challengeId']:x for x in d['items']}
          row=rows['ac-03665']
          print('LIVE_ACC_STATE',json.dumps({'target':{'best':row.get('currentBestLength'),'kTeams':row.get('kTeams'),'status':row.get('status')},'quota':quota_state(api,data_obj)},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acc-focused-recursive-scout-v1
          path: |
            acc_competitive/focused_recursive_scout/
            acc_competitive/focused_recursive_scout.log
          retention-days: 90

  search_compile:
    needs: scout
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: r5-d7-b72
            rounds: 3
            surgery_depth: 7
            surgery_beam: 72
            hit_cap: 12
            exact_per_key: 4
          - tag: r5-d9-b48
            rounds: 3
            surgery_depth: 9
            surgery_beam: 48
            hit_cap: 16
            exact_per_key: 4
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - name: Recover frozen live snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/scout
          gh run download "${{ github.run_id }}" -n acc-focused-recursive-scout-v1 -D /tmp/scout
          snap=$(find /tmp/scout -name snapshot_ac.json -print -quit)
          test -n "$snap"
          cp "$snap" /tmp/snapshot_ac.json
      - name: Prepare pinned search and verifier authority
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy==2.1.3' 'numba==0.63.1'
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet "$ACSOLVERX_PIN"
          sudo fallocate -l 8G /swapfile-focused-recursive
          sudo chmod 600 /swapfile-focused-recursive
          sudo mkswap /swapfile-focused-recursive
          sudo swapon /swapfile-focused-recursive
      - name: Deepen only the verified strict-lower-bound bridge family
        env:
          ACC_WEIGHTED_BASELINE_DEPTH_WEIGHT: "0.010"
          ACC_REJOIN_LOOKAHEAD: "8"
          ACC_REJOIN_PROBE_BEAM: "96"
          ACC_REJOIN_PROBE_CAP: "0"
          ACC_V24_FINAL_RANKS: "5"
          ACC_SUFFIX_SURGERY_ROUNDS: "${{ matrix.rounds }}"
          ACC_SUFFIX_SURGERY_DEPTH: "${{ matrix.surgery_depth }}"
          ACC_SUFFIX_SURGERY_BEAM: "${{ matrix.surgery_beam }}"
          ACC_SUFFIX_SURGERY_EXACT_PER_KEY: "${{ matrix.exact_per_key }}"
          ACC_SUFFIX_SURGERY_HIT_CAP: "${{ matrix.hit_cap }}"
        run: |
          set -o pipefail
          export ACC_REJOIN_STRICT_CEILING=$(python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/snapshot_ac.json').read_text()); d=d.get('data',d)
          rows={x['challengeId']:x for x in d['items']}
          print(rows['ac-03665']['currentBestLength'])
          PY
          )
          test "$ACC_REJOIN_STRICT_CEILING" -gt 0
          echo STRICT_CEILING_EXCLUSIVE="$ACC_REJOIN_STRICT_CEILING"
          out="acc_competitive/focused_recursive_salvage/ac-03665/${{ matrix.tag }}"
          mkdir -p "$out"
          python3 andrews_curtis/solver_v24_gssub_focused_recursive_salvage.py \
            --acc-root /tmp/acc \
            --acsolverx-root /tmp/acsolverx \
            --out-dir "$out" \
            --target-id ac-03665 \
            --snapshot-ac-file /tmp/snapshot_ac.json \
            --prefix-depth 8 \
            --overhead-weight 8.0 \
            --prefix-beam 192 --exact-per-key 4 --prefix-count 12 --prefix-seconds 480 \
            --suffix-max-nodes 120000 --max-quotient-total 100 \
            --reverse-depth 7 --reverse-cap 250000 \
            --strict-beam 384 --near-beam 160 \
            --compile-seconds 1500 --near-compile-seconds 240 \
            --near-miss-frac 0.10 \
            | tee "$out.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-focused-recursive-ac-03665-${{ matrix.tag }}
          path: acc_competitive/focused_recursive_salvage/ac-03665/${{ matrix.tag }}/
          retention-days: 90

  consolidate_publish:
    needs: [scout, search_compile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - name: Recover focused recursive evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/searches
          gh run download "${{ github.run_id }}" --pattern 'acc-focused-recursive-ac-*' -D /tmp/searches || true
          find /tmp/searches -name report.json -print | sort || true
      - name: Fetch pinned official verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
      - name: Merge shortest pinned-verifier-clean candidates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          best={}
          for p in Path('/tmp/searches').rglob('candidate_any.txt'):
              for line in p.read_text().splitlines():
                  m=re.match(r'^(ac-[^:]+):\s*(\[.*\])$',line.strip())
                  if not m: continue
                  cid=m.group(1); moves=json.loads(m.group(2))
                  if cid not in best or len(moves)<len(best[cid]): best[cid]=moves
          Path('acc_competitive/focused_recursive_raw_ac.txt').write_text(''.join(f"{cid}: {json.dumps(m,separators=(',',':'))}\n" for cid,m in sorted(best.items())))
          print('FOCUSED_RECURSIVE_VERIFIED_CANDIDATES',len(best),{k:len(v) for k,v in sorted(best.items())})
          PY
      - name: Salvage verifier-clean near misses after deeper recursive search
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/focused_recursive_atlas acc_competitive/focused_recursive_peephole
          if [ ! -s acc_competitive/focused_recursive_raw_ac.txt ]; then
            : > acc_competitive/focused_recursive_peephole/fortified_ac.txt
            echo NO_FOCUSED_RECURSIVE_CANDIDATES
            exit 0
          fi
          python3 acc_competitive/proof_atlas_fortify_v1.py \
            --acc-root /tmp/acc --glob 'acc_competitive/focused_recursive_raw_ac.txt' \
            --out-dir acc_competitive/focused_recursive_atlas --reverse-depth 7 --reverse-cap 250000
          if [ ! -s acc_competitive/focused_recursive_atlas/fortified_ac.txt ]; then
            : > acc_competitive/focused_recursive_peephole/fortified_ac.txt
            exit 0
          fi
          python3 acc_competitive/batch_peephole_fortify_v1.py \
            --acc-root /tmp/acc \
            --input acc_competitive/focused_recursive_atlas/fortified_ac.txt \
            --out-dir acc_competitive/focused_recursive_peephole \
            --thin-win-frac 0.25 --near-miss-frac 0.10 --max-window 6 --max-path 6000
      - name: Fresh live recheck quota gate and strict-only publication
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          if [ ! -s acc_competitive/focused_recursive_peephole/fortified_ac.txt ]; then
            echo NO_FOCUSED_RECURSIVE_VERIFIED_CANDIDATES_TO_PUBLISH
            exit 0
          fi
          mkdir -p acc_competitive/focused_recursive_publish
          python3 andrews_curtis/continuous_aggregate_strict_v1.py \
            --acc-root /tmp/acc \
            --glob 'acc_competitive/focused_recursive_peephole/fortified_ac.txt' \
            --out-dir acc_competitive/focused_recursive_publish --cycle 1 \
            | tee acc_competitive/focused_recursive_publish.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('acc_competitive/focused_recursive_publish/report.json').read_text())
          if r.get('quota_reason') not in ('ok','daily_quota_exhausted'): raise SystemExit(f"unsafe quota state: {r.get('quota_reason')}")
          if r.get('selected_scoring_ties',0): raise SystemExit('tie selected for publication')
          if r.get('selected_rows',0) != r.get('selected_strict_improvements',0)+r.get('selected_unsolved',0): raise SystemExit('noncompetitive row selected')
          print('STRICT_RESULT',json.dumps({'used':r.get('daily_submissions_used_pre'),'remaining':r.get('daily_submissions_remaining_pre'),'selected_rows':r.get('selected_rows'),'strict':r.get('selected_strict_improvements'),'submission_id':r.get('submission_id'),'terminal':r.get('terminal_status')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-focused-recursive-salvage-v1
          path: |
            acc_competitive/focused_recursive_raw_ac.txt
            acc_competitive/focused_recursive_atlas/
            acc_competitive/focused_recursive_peephole/
            acc_competitive/focused_recursive_publish/
            /tmp/searches/
          retention-days: 90
