name: ACC Fresh Transport Reproduction V1

on:
  push:
    branches:
      - acc-competitive-residual-v1
    paths:
      - ".github/workflows/acc-fresh-transport-reproduction-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover latest verified Proof Atlas
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas
          ID="$(gh api 'repos/heathsanchez/test/actions/artifacts?name=acc-proof-atlas-state&per_page=1' --jq '.artifacts[0].id // empty')"
          [ -n "$ID" ] || { echo "No proof atlas"; exit 1; }
          gh api "repos/heathsanchez/test/actions/artifacts/$ID/zip" > /tmp/atlas.zip
          unzip -q /tmp/atlas.zip -d /tmp/atlas
          test -n "$(find /tmp/atlas -name proof_atlas.sqlite -print -quit)"

      - name: Freeze fresh 04546 transport residual
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/fresh_transport_04546
          python3 - <<'PY'
          import json, pathlib, urllib.request
          BASE='https://server-9527.sair.foundation'
          HEADERS={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          def fetch(problem):
              req=urllib.request.Request(BASE+f'/api/acc/discoveries/snapshot?problem={problem}',headers=HEADERS)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())
          def rowmap(obj):
              data=obj.get('data',obj)
              return {(x.get('problemId') or x.get('challengeId')):x for x in data['items']}
          ac=fetch('ac'); stable=fetch('stable_ac')
          am=rowmap(ac); sm=rowmap(stable)
          aid='ac-04546'; sid='sac-04546'
          a=am[aid]; s=sm[sid]
          ab=a.get('currentBestLength'); sb=s.get('currentBestLength')
          assert a.get('status')=='solved' and s.get('status')=='solved'
          assert isinstance(ab,int) and isinstance(sb,int)
          slack=sb-ab-2
          row={'challenge_id':aid,'stable_challenge_id':sid,'ac_best':ab,'stable_best':sb,
               'transport_slack':slack,'source_bound_exclusive':max(ab,sb-2),
               'ac_kTeams':a.get('kTeams'),'stable_kTeams':s.get('kTeams')}
          print('FRESH_TRANSPORT_WINDOW',json.dumps(row,sort_keys=True))
          if slack <= 0:
              raise SystemExit('Fresh transport window has closed; stop without search')
          root=pathlib.Path('acc_competitive/fresh_transport_04546')
          (root/'snapshot_ac.json').write_text(json.dumps(ac,indent=2,sort_keys=True)+'\n')
          (root/'snapshot_stable.json').write_text(json.dumps(stable,indent=2,sort_keys=True)+'\n')
          (root/'targets.json').write_text(json.dumps([aid],indent=2)+'\n')
          (root/'rows.json').write_text(json.dumps([row],indent=2,sort_keys=True)+'\n')
          PY

      - name: Fetch pinned official verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736
          test "$(git -C /tmp/acc rev-parse HEAD)" = "99a65377c5c4f412cd9af7b8d31c41464a855736"

      - name: Transport-aware symmetry-orbit Atlas connector
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/fresh_transport_04546/orbit_out
          python3 acc_competitive/transport_orbit_atlas_connector_v1.py \
            --acc-root /tmp/acc \
            --atlas "$(find /tmp/atlas -name proof_atlas.sqlite | head -1)" \
            --snapshot-ac acc_competitive/fresh_transport_04546/snapshot_ac.json \
            --snapshot-stable acc_competitive/fresh_transport_04546/snapshot_stable.json \
            --target-ids-file acc_competitive/fresh_transport_04546/targets.json \
            --out-dir acc_competitive/fresh_transport_04546/orbit_out \
            --connector-depth 5 \
            --node-cap 250000 \
            | tee acc_competitive/fresh_transport_04546/orbit_search.log

      - name: Recheck live record for any verified candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          p=pathlib.Path('acc_competitive/fresh_transport_04546/orbit_out/results.json')
          rows=json.loads(p.read_text())
          wins=[r for r in rows if r.get('strict_win')]
          if not wins:
              print('NO_VERIFIED_CANDIDATE')
              raise SystemExit(0)
          BASE='https://server-9527.sair.foundation'; HEADERS={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          def fetch(problem):
              req=urllib.request.Request(BASE+f'/api/acc/discoveries/snapshot?problem={problem}',headers=HEADERS)
              with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode())
          def rowmap(obj):
              data=obj.get('data',obj);return {(x.get('problemId') or x.get('challengeId')):x for x in data['items']}
          am=rowmap(fetch('ac')); sm=rowmap(fetch('stable_ac'))
          pending=pathlib.Path('acc_competitive/fresh_transport_04546/orbit_out/pending_submission.txt')
          lines=pending.read_text().splitlines() if pending.exists() else []
          keep=[]
          for r in wins:
              ac_now=am[r['challenge_id']]['currentBestLength']; st_now=sm[r['stable_challenge_id']]['currentBestLength']
              ac_ok=bool(r.get('ac_strict_win') and r['source_length'] < ac_now)
              st_ok=bool(r.get('stable_strict_win') and r['stable_length'] < st_now)
              print('LIVE_RECHECK',json.dumps({'challenge_id':r['challenge_id'],'ac_now':ac_now,'stable_now':st_now,'source_length':r.get('source_length'),'stable_length':r.get('stable_length'),'ac_publishable':ac_ok,'stable_publishable':st_ok},sort_keys=True))
              if ac_ok:keep += [x for x in lines if x.startswith(r['challenge_id']+':')]
              if st_ok:keep += [x for x in lines if x.startswith(r['stable_challenge_id']+':')]
          pending.write_text('\n'.join(keep)+('\n' if keep else ''))
          PY

      - name: Summarize orbit residual
        run: |
          set -euo pipefail
          cat acc_competitive/fresh_transport_04546/orbit_out/report.json
          cat acc_competitive/fresh_transport_04546/orbit_out/results.json
          echo '--- pending ---'
          cat acc_competitive/fresh_transport_04546/orbit_out/pending_submission.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-fresh-transport-04546-orbit
          path: |
            acc_competitive/fresh_transport_04546/
          retention-days: 90
          if-no-files-found: warn
