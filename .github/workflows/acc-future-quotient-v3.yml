name: ACC Future Quotient V3

on:
  push:
    branches: [acc-future-quotient-v3]
    paths:
      - "acc_competitive/future_quotient_v3.py"
      - ".github/workflows/acc-future-quotient-v3.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-future-quotient-v3

      - name: Bind exact V2 representation artifact
        run: |
          set -euo pipefail
          mkdir -p fq3/input
          META="$(gh api 'repos/heathsanchez/test/actions/artifacts?name=acc-future-quotient-v2-input&per_page=1')"
          ID="$(printf '%s' "$META" | jq -r '.artifacts[0].id // empty')"
          DIGEST="$(printf '%s' "$META" | jq -r '.artifacts[0].digest // empty')"
          test -n "$ID"
          printf '%s
' "$ID" > fq3/input/v2_artifact_id.txt
          printf '%s
' "$DIGEST" > fq3/input/v2_artifact_digest.txt
          gh api "repos/heathsanchez/test/actions/artifacts/$ID/zip" > /tmp/v2.zip
          unzip -q /tmp/v2.zip -d /tmp/v2
          ATLAS="$(find /tmp/v2 -name proof_atlas.sqlite -print -quit)"
          INDEX="$(find /tmp/v2 -name future_quotient.sqlite -print -quit)"
          test -n "$ATLAS"
          test -n "$INDEX"
          cp "$ATLAS" fq3/input/proof_atlas.sqlite
          cp "$INDEX" fq3/input/future_quotient.sqlite
          cp "$(find /tmp/v2 -name quotient_report.json -print -quit)" fq3/input/v2_quotient_report.json
          echo "FQ3_REUSE V2_ARTIFACT=$ID DIGEST=$DIGEST"

      - name: Freeze fresh six largest AC-to-Stable slack gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path

          H={'Accept':'application/json','User-Agent':'Mozilla/5.0'}
          def get(problem):
              u='https://server-9527.sair.foundation/api/acc/discoveries/snapshot?problem='+problem
              req=urllib.request.Request(u,headers=H)
              with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode())
          def rows(o):
              d=o.get('data',o)
              return {str(x.get('problemId') or x.get('challengeId')):x for x in d['items']
                      if x.get('problemId') or x.get('challengeId')}

          ao=get('ac'); so=get('stable_ac'); ac=rows(ao); st=rows(so)
          gates=[]
          for cid,a in ac.items():
              if not cid.startswith('ac-') or a.get('status')!='solved':continue
              sid='sac-'+cid[3:]; s=st.get(sid)
              if not s or s.get('status')!='solved':continue
              ab=a.get('currentBestLength'); sb=s.get('currentBestLength')
              if type(ab) is not int or type(sb) is not int:continue
              slack=sb-(ab+2)
              if slack<=0:continue
              gates.append({'challenge_id':cid,'stable_challenge_id':sid,
                            'ac_best':ab,'stable_best':sb,'stable_slack':slack,
                            'source_bound_exclusive':sb-2,
                            'ac_kTeams':a.get('kTeams'),'stable_kTeams':s.get('kTeams')})
          gates.sort(key=lambda x:(-x['stable_slack'],-x['stable_best'],x['challenge_id']))
          gates=gates[:6]
          assert gates
          root=Path('fq3/input')
          root.joinpath('snapshot_ac.json').write_text(json.dumps(ao,indent=2,sort_keys=True)+'\n')
          root.joinpath('snapshot_stable.json').write_text(json.dumps(so,indent=2,sort_keys=True)+'\n')
          root.joinpath('targets.json').write_text(json.dumps(gates,indent=2,sort_keys=True)+'\n')
          for i,g in enumerate(gates):
              root.joinpath(f'target_{i}.json').write_text(json.dumps([g['challenge_id']],indent=2)+'\n')
          root.joinpath('freeze.json').write_text(json.dumps({
              'utc':datetime.now(timezone.utc).isoformat(),'gates':gates},indent=2,sort_keys=True)+'\n')
          print('FQ3_GATES',json.dumps(gates,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: acc-future-quotient-v3-input
          path: fq3/input/
          retention-days: 90

  search:
    needs: freeze
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slot: [0,1,2,3,4,5]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-future-quotient-v3
      - uses: actions/download-artifact@v4
        with:
          name: acc-future-quotient-v3-input
          path: /tmp/fq3
      - name: Fetch pinned official verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          test "$(git -C /tmp/acc rev-parse HEAD)" = "$OFFICIAL_PIN"

      - name: Search with lazy two-step refinement and exact policy rollout
        run: |
          set -o pipefail
          mkdir -p "fq3/search_${{ matrix.slot }}"
          python3 acc_competitive/future_quotient_v3.py             --acc-root /tmp/acc             --atlas /tmp/fq3/proof_atlas.sqlite             --index /tmp/fq3/future_quotient.sqlite             --snapshot-ac /tmp/fq3/snapshot_ac.json             --snapshot-stable /tmp/fq3/snapshot_stable.json             --targets "/tmp/fq3/target_${{ matrix.slot }}.json"             --out-dir "fq3/search_${{ matrix.slot }}"             --node-cap 120000             --time-cap 1200             --rollout-attempt-cap 2000             --min-policy-purity 0.75             | tee "fq3/search_${{ matrix.slot }}.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-future-quotient-v3-search-${{ matrix.slot }}
          path: |
            fq3/search_${{ matrix.slot }}/
            fq3/search_${{ matrix.slot }}.log
          retention-days: 90
          if-no-files-found: warn

  qualify_and_publish:
    needs: search
    if: always() && needs.search.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-future-quotient-v3
      - uses: actions/download-artifact@v4
        with:
          pattern: acc-future-quotient-v3-search-*
          path: fq3/downloads
          merge-multiple: false

      - name: Pool only exact verifier candidates
        run: |
          set -euo pipefail
          mkdir -p fq3/final
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          best={}; reports=[]; failures=Counter()
          for p in Path('fq3/downloads').rglob('candidate_batch.txt'):
              for line in p.read_text().splitlines():
                  if ':' not in line:continue
                  cid,raw=line.split(':',1)
                  try:m=list(json.loads(raw.strip()))
                  except Exception:continue
                  if cid not in best or len(m)<len(best[cid]):best[cid]=m
          for p in Path('fq3/downloads').rglob('report.json'):
              try:r=json.loads(p.read_text())
              except Exception:continue
              reports.append(r);failures.update(r.get('rollout_failure_histogram',{}))
          Path('fq3/final/candidate_batch.txt').write_text(''.join(
              f"{cid}: {json.dumps(m,separators=(',',':'))}\n" for cid,m in sorted(best.items())))
          summary={
              'candidate_rows':len(best),
              'search_reports':len(reports),
              'strict_winning_targets':sum(int(r.get('strict_winning_targets',0)) for r in reports),
              'nodes_popped':sum(int(r.get('nodes_popped',0)) for r in reports),
              'future_class_hits':sum(int(r.get('future_class_hits',0)) for r in reports),
              'refined_two_step_contacts':sum(int(r.get('refined_two_step_contacts',0)) for r in reports),
              'rollout_attempts':sum(int(r.get('rollout_attempts',0)) for r in reports),
              'rollout_successes':sum(int(r.get('rollout_successes',0)) for r in reports),
              'rollout_failure_histogram':dict(sorted(failures.items())),
          }
          Path('fq3/final/pool_report.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          Path('fq3/final/search_reports.json').write_text(json.dumps(reports,indent=2,sort_keys=True)+'\n')
          print('FQ3_POOL',json.dumps(summary,sort_keys=True))
          PY

      - name: Pinned official replay of every candidate
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          test "$(git -C /tmp/acc rev-parse HEAD)" = "$OFFICIAL_PIN"
          if [ ! -s fq3/final/candidate_batch.txt ]; then
            echo NO_FQ3_CANDIDATES
            exit 0
          fi
          PYTHONPATH=/tmp/acc/competition/tools python3 -m verifier             --manifest /tmp/acc/competition/tools/verifier/data/manifest.json             --submission fq3/final/candidate_batch.txt --pretty             | tee fq3/final/pinned_verifier.json
          touch fq3/final/PINNED_VERIFIER_PASS

      - name: Immediate live record and quota gate, then publish strict rows only
        run: |
          set -euo pipefail
          if [ ! -f fq3/final/PINNED_VERIFIER_PASS ]; then
            echo NO_VERIFIED_FQ3_CANDIDATES
            exit 0
          fi
          ACC_SUBMISSION_FILE=fq3/final/candidate_batch.txt           ACC_SUBMIT_OUT=fq3/final/publish           python3 acc_submit/submit_live_filtered.py             | tee fq3/final/publish.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-future-quotient-v3-final
          path: fq3/final/
          retention-days: 90
          if-no-files-found: warn
