name: ACC Live Authority Refresh V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-live-authority-refresh-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fresh ACC authority snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          KEY=os.environ['SAIR_API_KEY']
          PUB='https://server-9527.sair.foundation'
          API='https://api.sair.foundation/api/public/v1'

          def get(url, auth=False):
              h={'Accept':'application/json','User-Agent':'Mozilla/5.0'}
              if auth:
                  h['Authorization']=f'Bearer {KEY}'
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())

          def data(o):
              return o.get('data',o) if isinstance(o,dict) else o

          def snap(problem):
              d=data(get(f'{PUB}/api/acc/discoveries/snapshot?problem={problem}'))
              out={}
              for x in d['items']:
                  cid=x.get('problemId') or x.get('challengeId')
                  if cid:
                      out[str(cid)]=x
              return out

          def stamp(rec):
              for k in ('receivedAt','updatedAt','createdAt','submittedAt','created','timestamp','submitted'):
                  s=rec.get(k) if isinstance(rec,dict) else None
                  if not isinstance(s,str) or not s.strip():
                      continue
                  try:
                      dt=datetime.fromisoformat(s.strip().replace('Z','+00:00'))
                      if dt.tzinfo is None:
                          dt=dt.replace(tzinfo=timezone.utc)
                      return dt.astimezone(timezone.utc)
                  except Exception:
                      pass
              return None

          ac=snap('ac')
          sac=snap('stable_ac')
          mine=data(get(f'{API}/competitions/acc/submissions/mine?limit=100',auth=True))
          comp=data(get(f'{API}/competitions/acc',auth=True))
          items=mine.get('items',[]) if isinstance(mine,dict) else []

          lim=None
          for k in ('dailySubmissions','dailySubmissionLimit','submissionsPerDay'):
              v=comp.get(k) if isinstance(comp,dict) else None
              if isinstance(v,int):
                  lim=v; break
          if lim is None: lim=40
          today=datetime.now(timezone.utc).date()
          used=sum((t:=stamp(x)) is not None and t.date()==today for x in items)

          ours={}
          for sub in items:
              for rr in sub.get('results',[]) if isinstance(sub,dict) else []:
                  if not rr.get('ok'): continue
                  cid=rr.get('challenge_id') or rr.get('problemId') or rr.get('challengeId')
                  n=rr.get('length')
                  if cid and isinstance(n,int):
                      cid=str(cid); ours[cid]=min(n,ours.get(cid,n))

          unique=tied=lost=0
          for cid,n in ours.items():
              row=(ac if cid.startswith('ac-') else sac).get(cid)
              if not row or row.get('status')!='solved' or not isinstance(row.get('currentBestLength'),int): continue
              best=row['currentBestLength']; kt=row.get('kTeams')
              if n==best and kt==1: unique+=1
              elif n==best: tied+=1
              elif n>best: lost+=1

          def unsolved(rows):
              return sum(x.get('status')!='solved' or x.get('kTeams')==0 for x in rows.values())

          # Current source-witness frontier: any Stable row for which the official
          # generic +2 lift of the *live AC incumbent length* would be a strict gain.
          # This is only an opportunity census; no row is publishable without the exact AC witness.
          lift=[]
          for cid,a in ac.items():
              if a.get('status')!='solved' or not isinstance(a.get('currentBestLength'),int): continue
              sid='sac-'+cid[3:]
              s=sac.get(sid)
              if not s: continue
              cand=a['currentBestLength']+2
              sb=s.get('currentBestLength') if s.get('status')=='solved' else None
              if sb is None or cand < sb:
                  lift.append({'ac':cid,'ac_best':a['currentBestLength'],'stable':sid,'stable_best':sb,'lift_len':cand,'gain':None if sb is None else sb-cand})
          lift.sort(key=lambda x:(0 if x['stable_best'] is None else 1, -(x['gain'] or 0), x['lift_len'], x['ac']))

          watch_ids=['ac-09825','sac-09825','ac-00145','sac-00145','ac-01575','sac-01575']
          watch={}
          for cid in watch_ids:
              row=(ac if cid.startswith('ac-') else sac).get(cid,{})
              watch[cid]={'status':row.get('status'),'best':row.get('currentBestLength'),'kTeams':row.get('kTeams')}

          live={'schema':'acc-live-authority-refresh-v1','utc':datetime.now(timezone.utc).isoformat(),
                'quota':{'used':used,'remaining':max(0,lim-used),'limit':lim},
                'standing':{'unique':unique,'tied':tied,'lost':lost},
                'ac':{'rows':len(ac),'unsolved':unsolved(ac)},
                'stable_ac':{'rows':len(sac),'unsolved':unsolved(sac)},
                'strict_ac_plus_2_stable_opportunities':len(lift),
                'top_lift_opportunities':lift[:50],
                'watch':watch}
          raw=(json.dumps(live,sort_keys=True,separators=(',',':'))+'\n').encode()
          live['sha256']=hashlib.sha256(raw).hexdigest()
          Path('acc_live_authority_refresh.json').write_text(json.dumps(live,indent=2,sort_keys=True)+'\n')
          print('ACC_LIVE_AUTHORITY_REFRESH',json.dumps(live,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: acc-live-authority-refresh-v1
          path: acc_live_authority_refresh.json
          if-no-files-found: error
