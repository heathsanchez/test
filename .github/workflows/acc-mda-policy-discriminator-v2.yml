name: ACC MDA Policy Discriminator V2

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-mda-policy-discriminator-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"
  ACSOLVERX_PIN: "6a12515fe1d95178a483b76d5553266e61122417"
  CYCLE1_RUN: "34754206724"
  CYCLE2_RUN: "34755708007"
  V5_RUN: "34790205664"
  PRIOR_MDA_RUN: "34796578203"

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Fetch pinned ground
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"

      - name: Freeze fresh economic authority
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          mkdir -p mda/evidence/andrews_curtis/policy_v2_freeze
          python3 acc_competitive/competitive_scout_v2.py \
            --acc-root /tmp/acc \
            --out-dir mda/evidence/andrews_curtis/policy_v2_freeze \
            --competitive-wins acc_competitive/competitive_wins_seed_v1.json \
            --competitive-attempted acc_competitive/competitive_attempted_seed_v1.json \
            --attack-count 1 --defend-fraction 0 --shards 1 \
            --mechanism-id mda-policy-v2-freeze \
            | tee mda/evidence/andrews_curtis/policy_v2_freeze.log

      - name: Recover historical responsiveness and prior target membership
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/history/c1 /tmp/history/c2 /tmp/v5 /tmp/prior
          gh run download "$CYCLE1_RUN" -n acc-number-one-controller-v1-recovered -D /tmp/history/c1
          gh run download "$CYCLE2_RUN" -n acc-number-one-controller-v1 -D /tmp/history/c2
          gh run download "$V5_RUN" -n acc-v5-frontier-freeze -D /tmp/v5
          gh run download "$PRIOR_MDA_RUN" -n acc-mda-prospective-freeze -D /tmp/prior

      - name: Freeze eight unseen responsive losses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json
          from pathlib import Path
          root=Path('mda/evidence/andrews_curtis/policy_v2_freeze')
          snap=json.load(open(root/'snapshot_ac.json')); d=snap.get('data',snap)
          live={x['challengeId']:x for x in d['items']}
          ours=json.load(open(root/'mathgraph_status.json'))
          held=set()
          for x in ours:
              if x.get('status') not in ('unique_hold','tied_hold'): continue
              q=x['challenge_id']; held.add(q if q.startswith('ac-') else 'ac-'+q[4:] if q.startswith('sac-') else q)
          excluded=set(held)
          for pat in ('/tmp/v5/**/selection.json','/tmp/prior/**/selection.json'):
              for fn in glob.glob(pat,recursive=True):
                  for x in json.load(open(fn)):
                      excluded.add(x['challenge_id'] if isinstance(x,dict) else str(x))
          best={}
          for fn in glob.glob('/tmp/history/**/attack_outcomes.json',recursive=True):
              for r in json.load(open(fn)):
                  cid=r.get('challenge_id'); al=r.get('atomic_length')
                  if not cid or cid in excluded or not isinstance(al,int): continue
                  row=live.get(cid,{})
                  lb=row.get('currentBestLength')
                  if row.get('status')!='solved' or not isinstance(lb,int) or lb<=0: continue
                  rec={'challenge_id':cid,'historical_candidate':al,'historical_nodes':r.get('nodes'),
                       'frozen_live_best':lb,'frozen_kTeams':row.get('kTeams'),'gap_moves':al-lb,
                       'relative_gap':(al-lb)/lb,
                       'selection_basis':'unseen historically verifier-responsive loss; ranked by frozen relative live gap'}
                  if cid not in best or al<best[cid]['historical_candidate']: best[cid]=rec
          rows=sorted(best.values(),key=lambda r:(r['relative_gap'],r['gap_moves'],r['historical_nodes'] or 10**18,r['challenge_id']))
          sel=rows[:8]; assert len(sel)==8,sel
          (root/'selection.json').write_text(json.dumps(sel,indent=2,sort_keys=True)+'\n')
          (root/'probe_freeze.json').write_text(json.dumps({
              'experiment':'ACC_MDA_POLICY_DISCRIMINATOR_V2','repo_sha':'${{ github.sha }}',
              'candidate_frontier':[{'policy':'current','beams':[64]},{'policy':'mask3','beams':[64]}],
              'targets':[x['challenge_id'] for x in sel],'selection_is_pre_candidate':True,
              'beam16_contracted_from_prior_causal_ablation':True,'growth_beyond_retained_language_authorized':False,
              'authority_horizon':'OPEN'},indent=2,sort_keys=True)+'\n')
          print('MDA_POLICY_V2_FREEZE',json.dumps(sel,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: acc-mda-policy-v2-freeze
          path: mda/evidence/andrews_curtis/policy_v2_freeze/
          retention-days: 90

  probe:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3,4,5,6,7]
        policy: [current, mask3]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover immutable encounter
        id: case
        env:
          GH_TOKEN: ${{ github.token }}
          IDX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/freeze
          gh run download "${{ github.run_id }}" -n acc-mda-policy-v2-freeze -D /tmp/freeze
          sel=$(find /tmp/freeze -name selection.json -print -quit)
          ac=$(find /tmp/freeze -name snapshot_ac.json -print -quit)
          st=$(find /tmp/freeze -name snapshot_stable.json -print -quit)
          cp "$ac" /tmp/snapshot_ac.json; cp "$st" /tmp/snapshot_stable.json
          python3 - "$sel" "$IDX" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))[int(sys.argv[2])]
          open('/tmp/cid','w').write(x['challenge_id'])
          print('MDA_POLICY_V2_CASE',json.dumps(x,sort_keys=True))
          PY
          echo "cid=$(cat /tmp/cid)" >> "$GITHUB_OUTPUT"

      - name: Add swap
        run: |
          set -euo pipefail
          SWAP="/swapfile-${{ matrix.index }}-${{ matrix.policy }}"
          sudo fallocate -l 8G "$SWAP"; sudo chmod 600 "$SWAP"; sudo mkswap "$SWAP"; sudo swapon "$SWAP"

      - name: Fetch pinned dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy==2.1.3' 'numba==0.63.1'
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet "$ACSOLVERX_PIN"

      - name: Replay protected consequences
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/acc/competition/tools python3 -m verifier \
            --manifest /tmp/acc/competition/tools/verifier/data/manifest.json \
            --submission mda/domains/andrews_curtis/replay/protected_cases/scoring_holds_submission70.txt

      - name: Run retained policy at retained beam only
        run: |
          set -o pipefail
          out="mda/evidence/andrews_curtis/policy_v2_runs/i${{ matrix.index }}_${{ matrix.policy }}"
          mkdir -p "$out"
          python3 acc_competitive/v5_frontier_separator_v1.py \
            --acc-root /tmp/acc --acsolverx-root /tmp/acsolverx \
            --target-id "${{ steps.case.outputs.cid }}" --role responsive_loss \
            --policy "${{ matrix.policy }}" \
            --snapshot-ac /tmp/snapshot_ac.json --snapshot-stable /tmp/snapshot_stable.json \
            --out-dir "$out" --max-nodes 200000 --max-quotient-total 100 \
            --reverse-depth 7 --reverse-cap 250000 --beams 64 \
            | tee "$out.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-mda-policy-v2-${{ matrix.index }}-${{ matrix.policy }}
          path: mda/evidence/andrews_curtis/policy_v2_runs/
          retention-days: 90

  synthesize:
    needs: [freeze, probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover frozen evidence and candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/freeze /tmp/runs mda/evidence/andrews_curtis/policy_v2_result/candidate_pool
          gh run download "${{ github.run_id }}" -n acc-mda-policy-v2-freeze -D /tmp/freeze
          gh run download "${{ github.run_id }}" --pattern 'acc-mda-policy-v2-*' -D /tmp/runs || true
          i=0
          while IFS= read -r f; do cp "$f" "mda/evidence/andrews_curtis/policy_v2_result/candidate_pool/candidate_${i}.txt"; i=$((i+1)); done < <(find /tmp/runs -name candidate_ac.txt -type f | sort)
          echo "RAW_RESULTS=$(find /tmp/runs -name result.json | wc -l) CANDIDATES=$i"

      - name: Synthesize retained-language consequences
        run: |
          set -euo pipefail
          sel=$(find /tmp/freeze -name selection.json -print -quit)
          python3 mda/domains/andrews_curtis/prospective_discriminator.py \
            --glob '/tmp/runs/**/result.json' --selection "$sel" \
            --out-dir mda/evidence/andrews_curtis/policy_v2_result \
            | tee mda/evidence/andrews_curtis/policy_v2_result.log

      - name: Fetch pinned verifier ground
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"

      - name: Replay and salvage all verified candidates
        run: |
          set -euo pipefail
          mkdir -p mda/evidence/andrews_curtis/policy_v2_atlas mda/evidence/andrews_curtis/policy_v2_peephole
          src=mda/evidence/andrews_curtis/policy_v2_result/best_ac.txt
          if [ ! -s "$src" ]; then : > mda/evidence/andrews_curtis/policy_v2_peephole/fortified_ac.txt; echo NO_VERIFIED_CANDIDATES; exit 0; fi
          PYTHONPATH=/tmp/acc/competition/tools python3 -m verifier \
            --manifest /tmp/acc/competition/tools/verifier/data/manifest.json --submission "$src"
          python3 acc_competitive/proof_atlas_fortify_v1.py \
            --acc-root /tmp/acc --glob "$src" --out-dir mda/evidence/andrews_curtis/policy_v2_atlas \
            --reverse-depth 7 --reverse-cap 250000
          python3 acc_competitive/batch_peephole_fortify_v1.py \
            --acc-root /tmp/acc --input mda/evidence/andrews_curtis/policy_v2_atlas/fortified_ac.txt \
            --out-dir mda/evidence/andrews_curtis/policy_v2_peephole \
            --thin-win-frac 1.0 --near-miss-frac 1.0 --max-window 5 --max-path 20000

      - name: Fresh live record recheck and strict-only publication
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          mkdir -p mda/evidence/andrews_curtis/policy_v2_live
          if [ ! -s mda/evidence/andrews_curtis/policy_v2_peephole/fortified_ac.txt ]; then echo NO_PATHS_TO_PUBLISH; exit 0; fi
          python3 andrews_curtis/continuous_aggregate_v5.py \
            --acc-root /tmp/acc --glob 'mda/evidence/andrews_curtis/policy_v2_peephole/fortified_ac.txt' \
            --out-dir mda/evidence/andrews_curtis/policy_v2_live --cycle 9 \
            | tee mda/evidence/andrews_curtis/policy_v2_live.log

      - name: Final scoped report
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          def J(p):
              q=Path(p); return json.loads(q.read_text()) if q.exists() else {}
          dev=J('mda/evidence/andrews_curtis/policy_v2_result/report.json')
          pub=J('mda/evidence/andrews_curtis/policy_v2_live/report.json')
          out={'experiment':'ACC_MDA_POLICY_DISCRIMINATOR_V2','developmental_status':dev.get('status'),
               'pareto_frontier':dev.get('pareto_frontier'),'causal_ablations':dev.get('causal_ablations'),
               'causally_retained_components':dev.get('causally_retained_components'),
               'completed_policy_cases':dev.get('completed_policy_cases'),'missing_cases':dev.get('missing_cases'),
               'fresh_rows_published':pub.get('selected_rows',0),'published_strict':pub.get('selected_strict_improvements',0),
               'submission_id':pub.get('submission_id'),'quota_used_pre':pub.get('daily_submissions_used_pre'),
               'quota_remaining_pre':pub.get('daily_submissions_remaining_pre'),
               'claim_boundary':'Fresh prospective current-vs-mask3 discriminator at causally retained beam64 only; no new search/compiler mechanism.'}
          Path('mda/evidence/andrews_curtis/policy_v2_final.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('ACC_MDA_POLICY_V2_FINAL',json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-mda-policy-v2-final
          path: mda/evidence/andrews_curtis/
          retention-days: 90
