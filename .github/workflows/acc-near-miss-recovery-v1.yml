name: ACC Optimized Near-Miss Recovery V1

on:
  push:
    branches:
      - acc-competitive-residual-v1
    paths:
      - ".github/workflows/acc-near-miss-recovery-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target:
          - ac-07632
          - ac-02523
          - ac-06430
          - ac-03086
          - ac-05585
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - name: Fetch pinned repositories
        run: |
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet 6a12515fe1d95178a483b76d5553266e61122417
      - name: Install runtime
        run: python3 -m pip install --quiet "numpy==2.1.3" "numba==0.63.1"
      - name: Freeze target
        run: |
          mkdir -p acc_competitive/near_miss
          printf '["%s"]\n' "${{ matrix.target }}" > "acc_competitive/near_miss/${{ matrix.target }}.json"
      - name: Recompile near-miss with signed exact-state beam
        run: |
          set -o pipefail
          python3 andrews_curtis/solver_v2_gssub.py \
            --acc-root /tmp/acc \
            --acsolverx-root /tmp/acsolverx \
            --out-dir "acc_competitive/out_near_miss_${{ matrix.target }}" \
            --target-ids-file "acc_competitive/near_miss/${{ matrix.target }}.json" \
            --include-solved \
            --max-targets 1 \
            --max-nodes 120000 \
            --max-quotient-total 80 \
            --reverse-depth 7 \
            --reverse-cap 250000 \
            --compiler-beam 8 \
            --search-seconds 1500 \
            | tee "acc_competitive/near_miss_${{ matrix.target }}.log"
      - name: Upload candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-near-miss-${{ matrix.target }}
          path: |
            acc_competitive/out_near_miss_${{ matrix.target }}/
            acc_competitive/near_miss_${{ matrix.target }}.log
          retention-days: 90
          if-no-files-found: warn

  submit:
    needs: recover
    if: always() && needs.recover.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - uses: actions/download-artifact@v4
        with:
          pattern: acc-near-miss-*
          path: acc_competitive/near_miss_downloads
          merge-multiple: false
      - name: Fetch pinned official verifier
        run: |
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736
      - name: Live-filter and submit recovered records
        run: |
          set -o pipefail
          python3 andrews_curtis/continuous_aggregate_v4.py \
            --acc-root /tmp/acc \
            --glob 'acc_competitive/near_miss_downloads/**/submission_v2.txt' \
            --out-dir acc_competitive/near_miss_aggregate \
            --cycle 1 \
            | tee acc_competitive/near_miss_aggregate.log
      - name: Upload authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-near-miss-recovery-v1
          path: |
            acc_competitive/near_miss_aggregate/
            acc_competitive/near_miss_aggregate.log
          retention-days: 90
          if-no-files-found: warn
