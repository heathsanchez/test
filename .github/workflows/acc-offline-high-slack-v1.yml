name: ACC Offline High-Slack Escalation V1

on:
  push:
    branches:
      - acc-competitive-residual-v1
    paths:
      - ".github/workflows/acc-offline-high-slack-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        target:
          - ac-01684
          - ac-01821
          - ac-09388
          - ac-01501
          - ac-09633
          - ac-03773
          - ac-03723
        depth_weight: ["0","0.03","0.10"]
        quotient_cap: [80,100]
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover last authoritative frozen competition snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/scout
          gh api repos/heathsanchez/test/actions/artifacts/10291997930/zip > /tmp/scout.zip
          unzip -q /tmp/scout.zip -d /tmp/scout
          find /tmp/scout -name snapshot_ac.json -o -name snapshot_stable.json

      - name: Fetch pinned repositories
        run: |
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet 6a12515fe1d95178a483b76d5553266e61122417

      - name: Install runtime
        run: python3 -m pip install --quiet "numpy==2.1.3" "numba==0.63.1"

      - name: Freeze target
        run: |
          mkdir -p acc_competitive/high_slack
          printf '["%s"]\n' "${{ matrix.target }}" > "acc_competitive/high_slack/${{ matrix.target }}.json"

      - name: Deep diversified offline search
        run: |
          set -euo pipefail
          AC_SNAP="$(find /tmp/scout -name snapshot_ac.json | head -1)"
          ST_SNAP="$(find /tmp/scout -name snapshot_stable.json | head -1)"
          TAG="${{ matrix.target }}-w${{ matrix.depth_weight }}-q${{ matrix.quotient_cap }}"
          python3 andrews_curtis/solver_v2_gssub.py \
            --acc-root /tmp/acc \
            --acsolverx-root /tmp/acsolverx \
            --out-dir "acc_competitive/out_high_slack_${TAG}" \
            --target-ids-file "acc_competitive/high_slack/${{ matrix.target }}.json" \
            --include-solved \
            --snapshot-ac-file "$AC_SNAP" \
            --snapshot-stable-file "$ST_SNAP" \
            --defer-live-filter \
            --max-targets 1 \
            --max-nodes 500000 \
            --max-quotient-total "${{ matrix.quotient_cap }}" \
            --reverse-depth 7 \
            --reverse-cap 250000 \
            --compiler-beam 16 \
            --depth-weight "${{ matrix.depth_weight }}" \
            --search-seconds 1900 \
            | tee "acc_competitive/high_slack_${TAG}.log"

      - name: Upload search evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-high-slack-${{ matrix.target }}-w${{ matrix.depth_weight }}-q${{ matrix.quotient_cap }}
          path: |
            acc_competitive/out_high_slack_*/
            acc_competitive/high_slack_*.log
          retention-days: 90
          if-no-files-found: warn

  pool:
    needs: search
    if: always() && needs.search.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - uses: actions/download-artifact@v4
        with:
          pattern: acc-high-slack-*
          path: acc_competitive/high_slack_downloads
          merge-multiple: false
      - name: Recover frozen snapshots
        run: |
          mkdir -p /tmp/scout
          gh api repos/heathsanchez/test/actions/artifacts/10291997930/zip > /tmp/scout.zip
          unzip -q /tmp/scout.zip -d /tmp/scout
      - name: Fetch pinned official verifier
        run: |
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736
      - name: Build verifier-clean pending pool with zero SAIR API calls
        run: |
          AC_SNAP="$(find /tmp/scout -name snapshot_ac.json | head -1)"
          ST_SNAP="$(find /tmp/scout -name snapshot_stable.json | head -1)"
          python3 acc_competitive/offline_candidate_pool_v1.py \
            --acc-root /tmp/acc \
            --glob 'acc_competitive/high_slack_downloads/**/submission_v2.txt' \
            --snapshot-ac "$AC_SNAP" \
            --snapshot-stable "$ST_SNAP" \
            --out-dir acc_competitive/high_slack_pool \
            | tee acc_competitive/high_slack_pool.log
      - name: Upload pending pool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-offline-high-slack-pool
          path: |
            acc_competitive/high_slack_pool/
            acc_competitive/high_slack_pool.log
          retention-days: 90
          if-no-files-found: warn
