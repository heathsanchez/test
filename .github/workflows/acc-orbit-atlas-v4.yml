name: ACC Orbit Atlas V4

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-orbit-atlas-v4.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
      V3_RUN_ID: "34734591469"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Download V3 atlas and frozen 32-target control
        run: |
          set -euo pipefail
          mkdir -p /tmp/v3
          gh run download "$V3_RUN_ID" -R "$GITHUB_REPOSITORY" -n acc-compounding-frontier-v3 -D /tmp/v3
          test -s /tmp/v3/compound_v3_atlas/proof_atlas.sqlite
          test -s /tmp/v3/compound_v3_next/targets.json
          test -s /tmp/v3/compound_v3_next/snapshot_ac.json

      - name: Fetch pinned official verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736

      - name: Frozen causal replay through symmetry quotient
        run: |
          set -euo pipefail
          python3 acc_competitive/orbit_atlas_connector_v1.py \
            --acc-root /tmp/acc \
            --atlas /tmp/v3/compound_v3_atlas/proof_atlas.sqlite \
            --snapshot-ac /tmp/v3/compound_v3_next/snapshot_ac.json \
            --target-ids-file /tmp/v3/compound_v3_next/targets.json \
            --out-dir acc_competitive/orbit_v4_causal \
            --connector-depth 5 --node-cap 180000 \
            | tee acc_competitive/orbit_v4_causal.log

      - name: Freeze live score-harvest frontier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,urllib.request
          B='https://server-9527.sair.foundation';H={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          def get(p):
              u=f'{B}/api/acc/discoveries/snapshot?problem={p}'
              with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=60) as r:return json.loads(r.read().decode())
          out=pathlib.Path('acc_competitive/orbit_v4_live');out.mkdir(parents=True,exist_ok=True)
          live=get('ac');d=live.get('data',live)
          prior=set(json.loads(pathlib.Path('/tmp/v3/compound_v3_next/targets.json').read_text()))|{'ac-08551'}
          rows=[x for x in d['items'] if x.get('status')=='solved' and x.get('kTeams')==1
                and isinstance(x.get('currentBestLength'),int) and x['currentBestLength']>=700
                and x['challengeId'] not in prior]
          # Priority = exposed point ownership first, then largest headroom.
          rows.sort(key=lambda x:(-x['currentBestLength'],x['challengeId']))
          rows=rows[:64]
          (out/'snapshot_ac.json').write_text(json.dumps(live,indent=2,sort_keys=True)+'\n')
          (out/'targets.json').write_text(json.dumps([x['challengeId'] for x in rows])+'\n')
          (out/'selection.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          print('ORBIT_V4_HARVEST_TARGETS',json.dumps([(x['challengeId'],x['currentBestLength']) for x in rows]))
          PY

      - name: Decide whether quotient transport earned harvest expansion
        id: gate
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('acc_competitive/orbit_v4_causal/report.json'))
          print('expand=' + ('true' if d.get('orbit_hits',0)>0 else 'false'))
          print('causal_hits='+str(d.get('orbit_hits',0)))
          print('causal_wins='+str(d.get('wins',0)))
          PY

      - name: Expand only if transport actually intersects learned territory
        if: steps.gate.outputs.expand == 'true'
        run: |
          set -euo pipefail
          python3 acc_competitive/orbit_atlas_connector_v1.py \
            --acc-root /tmp/acc \
            --atlas /tmp/v3/compound_v3_atlas/proof_atlas.sqlite \
            --snapshot-ac acc_competitive/orbit_v4_live/snapshot_ac.json \
            --target-ids-file acc_competitive/orbit_v4_live/targets.json \
            --out-dir acc_competitive/orbit_v4_harvest \
            --connector-depth 5 --node-cap 180000 \
            | tee acc_competitive/orbit_v4_harvest.log

      - name: Assemble strict candidates and fortify shortest proofs
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/orbit_v4_candidates
          : > acc_competitive/orbit_v4_candidates/raw.txt
          [ -s acc_competitive/orbit_v4_causal/pending_submission.txt ] && cat acc_competitive/orbit_v4_causal/pending_submission.txt >> acc_competitive/orbit_v4_candidates/raw.txt || true
          [ -s acc_competitive/orbit_v4_harvest/pending_submission.txt ] && cat acc_competitive/orbit_v4_harvest/pending_submission.txt >> acc_competitive/orbit_v4_candidates/raw.txt || true
          if [ -s acc_competitive/orbit_v4_candidates/raw.txt ]; then
            python3 acc_competitive/proof_atlas_fortify_v1.py \
              --acc-root /tmp/acc \
              --glob 'acc_competitive/orbit_v4_candidates/raw.txt' \
              --out-dir acc_competitive/orbit_v4_fortified \
              --prior-atlas /tmp/v3/compound_v3_atlas/proof_atlas.sqlite \
              --reverse-depth 7 --reverse-cap 300000 \
              | tee acc_competitive/orbit_v4_fortified.log
            cp acc_competitive/orbit_v4_fortified/fortified_ac.txt acc_competitive/orbit_v4_candidates/final.txt
          else
            : > acc_competitive/orbit_v4_candidates/final.txt
          fi

      - name: One packed live-filtered publication call only for strict wins
        run: |
          set -euo pipefail
          python3 andrews_curtis/continuous_aggregate_v4.py \
            --acc-root /tmp/acc \
            --glob 'acc_competitive/orbit_v4_candidates/final.txt' \
            --out-dir acc_competitive/orbit_v4_publish \
            --cycle 4 \
            | tee acc_competitive/orbit_v4_publish.log

      - name: Emit terminal score-economics report
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          def read(p):
              p=pathlib.Path(p);return json.loads(p.read_text()) if p.exists() else {}
          c=read('acc_competitive/orbit_v4_causal/report.json')
          h=read('acc_competitive/orbit_v4_harvest/report.json')
          f=read('acc_competitive/orbit_v4_fortified/report.json')
          p=read('acc_competitive/orbit_v4_publish/report.json')
          r={
            'experiment':'ACC_ORBIT_ATLAS_V4',
            'causal_targets':c.get('targets',0),'causal_orbit_hits':c.get('orbit_hits',0),'causal_wins':c.get('wins',0),
            'effective_orbit_upper_bound':c.get('effective_orbit_upper_bound',0),
            'harvest_targets':h.get('targets',0),'harvest_orbit_hits':h.get('orbit_hits',0),'harvest_wins':h.get('wins',0),
            'harvest_total_margin':h.get('total_margin',0),
            'fortified_candidates':f.get('optimized_candidates',0),'fortify_moves_saved':f.get('moves_saved',0),
            'published_rows':p.get('selected_rows',0),'published_ac':p.get('selected_ac',0),'published_stable':p.get('selected_stable',0),
            'submission_id':p.get('submission_id'),'terminal_status':p.get('terminal_status'),'failed_rows':p.get('failed_rows'),
            'publication_policy':'ONE_PACKED_CALL_STRICT_LIVE_WINS_ONLY'
          }
          pathlib.Path('acc_competitive/orbit_v4_report.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('ORBIT_V4',json.dumps(r,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-orbit-atlas-v4
          path: |
            acc_competitive/orbit_v4_causal/
            acc_competitive/orbit_v4_causal.log
            acc_competitive/orbit_v4_live/
            acc_competitive/orbit_v4_harvest/
            acc_competitive/orbit_v4_harvest.log
            acc_competitive/orbit_v4_candidates/
            acc_competitive/orbit_v4_fortified/
            acc_competitive/orbit_v4_fortified.log
            acc_competitive/orbit_v4_publish/
            acc_competitive/orbit_v4_publish.log
            acc_competitive/orbit_v4_report.json
          retention-days: 90
          if-no-files-found: warn
