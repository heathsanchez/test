name: ACC Proof Track Coordinate Quotient V1

on:
  push:
    branches:
      - acc-proof-track-orbit-v1
    paths:
      - 'mda/domains/andrews_curtis/proof_track/CoordinateQuotient.lean'
      - '.github/workflows/acc-proof-track-coordinate-quotient-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned official ACC repository
        run: |
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/official-acc
          git -C /tmp/official-acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned Lean
        working-directory: /tmp/official-acc/competition/tools/lean
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          lake exe cache get
          lake build
      - name: Check rank-independent coordinate quotient
        run: |
          cp mda/domains/andrews_curtis/proof_track/ReachabilityEquivalence.lean /tmp/official-acc/competition/tools/lean/ReachabilityEquivalence.lean
          cp mda/domains/andrews_curtis/proof_track/FunnelCore.lean /tmp/official-acc/competition/tools/lean/FunnelCore.lean
          cp mda/domains/andrews_curtis/proof_track/TwistCommutatorLayer.lean /tmp/official-acc/competition/tools/lean/TwistCommutatorLayer.lean
          cp mda/domains/andrews_curtis/proof_track/TwistGeneratedLayer.lean /tmp/official-acc/competition/tools/lean/TwistGeneratedLayer.lean
          cp mda/domains/andrews_curtis/proof_track/TwistCommutatorEquality.lean /tmp/official-acc/competition/tools/lean/TwistCommutatorEquality.lean
          cp mda/domains/andrews_curtis/proof_track/MultiSourceTwistLayer.lean /tmp/official-acc/competition/tools/lean/MultiSourceTwistLayer.lean
          cp mda/domains/andrews_curtis/proof_track/CoordinateQuotient.lean /tmp/official-acc/competition/tools/lean/CoordinateQuotient.lean
          cd /tmp/official-acc/competition/tools/lean
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/ReachabilityEquivalence.olean ReachabilityEquivalence.lean
          lake env lean -o .lake/build/lib/lean/FunnelCore.olean FunnelCore.lean
          lake env lean -o .lake/build/lib/lean/TwistCommutatorLayer.olean TwistCommutatorLayer.lean
          lake env lean -o .lake/build/lib/lean/TwistGeneratedLayer.olean TwistGeneratedLayer.lean
          lake env lean -o .lake/build/lib/lean/TwistCommutatorEquality.olean TwistCommutatorEquality.lean
          lake env lean -o .lake/build/lib/lean/MultiSourceTwistLayer.olean MultiSourceTwistLayer.lean
          lake env lean CoordinateQuotient.lean
