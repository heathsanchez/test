name: ACC Parameterized Funnel Family V1

on:
  push:
    branches:
      - acc-proof-track-orbit-v1
    paths:
      - 'mda/domains/andrews_curtis/proof_track/funnel_family_test.py'
      - '.github/workflows/acc-proof-track-funnel-family-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned official ACC repository
        run: |
          git clone https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/official-acc
          cd /tmp/official-acc
          git checkout 99a65377c5c4f412cd9af7b8d31c41464a855736
      - name: Replay frozen family grid
        run: |
          python3 mda/domains/andrews_curtis/proof_track/funnel_family_test.py \
            /tmp/official-acc mda/evidence/andrews_curtis/funnel_family_v1
      - uses: actions/upload-artifact@v4
        with:
          name: acc-funnel-family-v1
          path: mda/evidence/andrews_curtis/funnel_family_v1/
