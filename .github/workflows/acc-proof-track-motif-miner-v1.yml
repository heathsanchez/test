name: ACC Proof Track Motif Miner V1

on:
  push:
    branches:
      - acc-proof-track-orbit-v1
    paths:
      - 'mda/domains/andrews_curtis/proof_track/theorem_motif_miner.py'
      - '.github/workflows/acc-proof-track-motif-miner-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned official ACC repository
        run: |
          git clone https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/official-acc
          cd /tmp/official-acc
          git checkout 99a65377c5c4f412cd9af7b8d31c41464a855736
      - name: Mine recurrent verified route motifs
        run: |
          python3 mda/domains/andrews_curtis/proof_track/theorem_motif_miner.py \
            /tmp/official-acc acc_submit/v1_verified_submission.txt \
            mda/evidence/andrews_curtis/proof_track_motif_miner
      - uses: actions/upload-artifact@v4
        with:
          name: acc-proof-track-motif-miner-v1
          path: mda/evidence/andrews_curtis/proof_track_motif_miner/
