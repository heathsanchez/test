name: ACC Quotient Skeleton Sweep V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-quotient-skeleton-sweep-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"
  ACSOLVERX_PIN: "6a12515fe1d95178a483b76d5553266e61122417"

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Fetch pinned competition authority
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"

      - name: Freeze fresh ACC state
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          python3 acc_competitive/competitive_scout_v2.py \
            --acc-root /tmp/acc \
            --out-dir acc_competitive/skeleton_scout \
            --attack-count 2 \
            --defend-fraction 0 \
            --mechanism-id gssub-v3-quotient-skeleton-sweep \
            --shards 1 \
            | tee acc_competitive/skeleton_scout.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          xs=json.loads(Path('acc_competitive/skeleton_scout/mathgraph_status.json').read_text())
          counts={}
          for x in xs: counts[x['status']]=counts.get(x['status'],0)+1
          snap=json.loads(Path('acc_competitive/skeleton_scout/snapshot_ac.json').read_text())
          d=snap.get('data',snap); m={x['challengeId']:x for x in d['items']}
          targets={cid:{'status':m[cid].get('status'),'best':m[cid].get('currentBestLength'),'kTeams':m[cid].get('kTeams')} for cid in ('ac-01910','ac-04501')}
          print('LIVE_ACC_STATE',json.dumps({'mathgraph':counts,'targets':targets},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: acc-skeleton-scout-v1
          path: |
            acc_competitive/skeleton_scout/
            acc_competitive/skeleton_scout.log
          retention-days: 90

  sweep:
    needs: scout
    strategy:
      fail-fast: false
      matrix:
        cid: [ac-01910, ac-04501]
        depth_weight: [0.25, 0.75, 2.0, 6.0]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover frozen live snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/scout
          gh run download "${{ github.run_id }}" -n acc-skeleton-scout-v1 -D /tmp/scout
          snap=$(find /tmp/scout -name snapshot_ac.json -print -quit)
          test -n "$snap"
          cp "$snap" /tmp/snapshot_ac.json

      - name: Prepare pinned search and verifier authority
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy==2.1.3' 'numba==0.63.1'
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet "$ACSOLVERX_PIN"
          SWAP=/swapfile-extra-acc-skeleton
          sudo fallocate -l 8G "$SWAP"
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"

      - name: Search alternate quotient skeleton and compile exactly
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          printf '["%s"]\n' '${{ matrix.cid }}' > /tmp/targets.json
          out="acc_competitive/skeleton_sweep/${{ matrix.cid }}/w-${{ matrix.depth_weight }}"
          mkdir -p "$out"
          python3 andrews_curtis/solver_v3_gssub_carry.py \
            --acc-root /tmp/acc \
            --acsolverx-root /tmp/acsolverx \
            --out-dir "$out" \
            --target-ids-file /tmp/targets.json \
            --include-solved --defer-live-filter \
            --snapshot-ac-file /tmp/snapshot_ac.json \
            --max-targets 1 \
            --max-nodes 250000 \
            --max-quotient-total 100 \
            --reverse-depth 7 \
            --reverse-cap 250000 \
            --compiler-beam 128 \
            --depth-weight "${{ matrix.depth_weight }}" \
            --search-seconds 3000 \
            | tee "$out.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-skeleton-${{ matrix.cid }}-w-${{ matrix.depth_weight }}
          path: |
            acc_competitive/skeleton_sweep/
          retention-days: 90

  consolidate_publish:
    needs: [scout, sweep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover sweep evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/scout /tmp/sweeps
          gh run download "${{ github.run_id }}" -n acc-skeleton-scout-v1 -D /tmp/scout
          gh run download "${{ github.run_id }}" --pattern 'acc-skeleton-ac-*' -D /tmp/sweeps || true
          find /tmp/sweeps -name search_results.json -print | sort
          find /tmp/sweeps -name submission_v2.txt -print | sort

      - name: Fetch pinned official verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"

      - name: Merge shortest verifier-clean candidate per target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          best={}
          for p in Path('/tmp/sweeps').rglob('submission_v2.txt'):
              for line in p.read_text().splitlines():
                  m=re.match(r'^(ac-[^:]+):\s*(\[.*\])$',line.strip())
                  if not m: continue
                  cid=m.group(1); moves=json.loads(m.group(2))
                  if cid not in best or len(moves)<len(best[cid]): best[cid]=moves
          out=Path('acc_competitive/skeleton_raw_ac.txt')
          out.write_text(''.join(f"{cid}: {json.dumps(m,separators=(',',':'))}\n" for cid,m in sorted(best.items())))
          print('SKELETON_VERIFIED_CANDIDATES',len(best),{k:len(v) for k,v in sorted(best.items())})
          PY

      - name: Salvage post-mechanism near misses through proof atlas
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/skeleton_atlas
          if [ ! -s acc_competitive/skeleton_raw_ac.txt ]; then
            echo "NO_SKELETON_VERIFIED_CANDIDATES"
            : > acc_competitive/skeleton_atlas/fortified_ac.txt
            exit 0
          fi
          python3 acc_competitive/proof_atlas_fortify_v1.py \
            --acc-root /tmp/acc \
            --glob 'acc_competitive/skeleton_raw_ac.txt' \
            --out-dir acc_competitive/skeleton_atlas \
            --reverse-depth 7 --reverse-cap 250000 \
            | tee acc_competitive/skeleton_atlas.log

      - name: Peephole salvage thin atomic margins
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/skeleton_peephole
          if [ ! -s acc_competitive/skeleton_atlas/fortified_ac.txt ]; then
            echo "NO_SKELETON_ATLAS_CANDIDATES"
            : > acc_competitive/skeleton_peephole/fortified_ac.txt
            exit 0
          fi
          python3 acc_competitive/batch_peephole_fortify_v1.py \
            --acc-root /tmp/acc \
            --input acc_competitive/skeleton_atlas/fortified_ac.txt \
            --out-dir acc_competitive/skeleton_peephole \
            --thin-win-frac 0.25 --near-miss-frac 0.10 --max-window 6 --max-path 6000 \
            | tee acc_competitive/skeleton_peephole.log

      - name: Fresh-recheck, quota-gate, publish strict rows only
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          mkdir -p acc_competitive/skeleton_publish
          if [ ! -s acc_competitive/skeleton_peephole/fortified_ac.txt ]; then
            echo "NO_SKELETON_VERIFIED_CANDIDATES_TO_PUBLISH"
            exit 0
          fi
          python3 andrews_curtis/continuous_aggregate_v5.py \
            --acc-root /tmp/acc \
            --glob 'acc_competitive/skeleton_peephole/fortified_ac.txt' \
            --out-dir acc_competitive/skeleton_publish \
            --cycle 1 \
            | tee acc_competitive/skeleton_publish.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('acc_competitive/skeleton_publish/report.json')
          r=json.loads(p.read_text())
          if r.get('quota_reason') not in ('ok','daily_quota_exhausted'):
              raise SystemExit(f"unsafe quota state: {r.get('quota_reason')}")
          if r.get('selected_scoring_ties',0):
              raise SystemExit('tie selected for publication')
          if r.get('selected_rows',0) != r.get('selected_strict_improvements',0):
              raise SystemExit('non-strict row selected for publication')
          print('STRICT_QUOTA_GATE_OK',json.dumps({'used':r.get('daily_submissions_used_pre'),'remaining':r.get('daily_submissions_remaining_pre'),'strict':r.get('selected_strict_improvements'),'submission_id':r.get('submission_id')},sort_keys=True))
          PY

      - name: Skeleton residual summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('/tmp/sweeps').rglob('search_results.json'):
              try: rows.extend(json.loads(p.read_text()))
              except Exception: pass
          compact=[]
          for r in rows:
              comp=r.get('compile') or {}
              compact.append({'challenge_id':r.get('challenge_id'),'live_best':r.get('live_best'),'quotient_steps':comp.get('quotient_steps'),'atomic_length':r.get('atomic_length'),'atomic_per_quotient_step':comp.get('atomic_per_quotient_step'),'verified':bool((r.get('ac_verdict') or {}).get('ok'))})
          compact.sort(key=lambda x:(x.get('challenge_id') or '', x.get('atomic_length') if isinstance(x.get('atomic_length'),int) else 10**18))
          pubp=Path('acc_competitive/skeleton_publish/report.json')
          pub=json.loads(pubp.read_text()) if pubp.exists() else {}
          summary={'phase':'quotient-skeleton portfolio with exact carry compilation','candidates':compact,'fresh_rows_published':pub.get('selected_rows',0),'published_strict_improvements':pub.get('selected_strict_improvements',0),'daily_submissions_remaining_pre':pub.get('daily_submissions_remaining_pre'),'submission_id':pub.get('submission_id'),'terminal_status':pub.get('terminal_status')}
          Path('acc_competitive/skeleton_controller_report.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('SKELETON_CONTROLLER',json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-quotient-skeleton-sweep-v1
          path: |
            acc_competitive/skeleton_controller_report.json
            acc_competitive/skeleton_raw_ac.txt
            acc_competitive/skeleton_atlas/
            acc_competitive/skeleton_atlas.log
            acc_competitive/skeleton_peephole/
            acc_competitive/skeleton_peephole.log
            acc_competitive/skeleton_publish/
            acc_competitive/skeleton_publish.log
            /tmp/scout/
            /tmp/sweeps/
          retention-days: 90
