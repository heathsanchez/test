name: ACC Reset Publisher Kick

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acc-reset-publisher-kick.yml'

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch reset publisher once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run acc-reset-publisher.yml --ref main --repo heathsanchez/test

# one-shot kick after missed scheduled publication
