name: ACC Reset Publisher

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: acc-reset-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout competitive branch
        uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Refresh live authority before any fixed-point exit
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          KEY=os.environ['SAIR_API_KEY']
          PUB='https://server-9527.sair.foundation'
          API='https://api.sair.foundation/api/public/v1'

          def get(url, auth=False):
              h={'Accept':'application/json','User-Agent':'Mozilla/5.0'}
              if auth:
                  h['Authorization']=f'Bearer {KEY}'
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())

          def data(o):
              return o.get('data',o) if isinstance(o,dict) else o

          def snap(problem):
              d=data(get(f'{PUB}/api/acc/discoveries/snapshot?problem={problem}'))
              out={}
              for x in d['items']:
                  cid=x.get('problemId') or x.get('challengeId')
                  if cid:
                      out[str(cid)]=x
              return out

          def stamp(rec):
              for k in ('receivedAt','updatedAt','createdAt','submittedAt','created','timestamp','submitted'):
                  s=rec.get(k) if isinstance(rec,dict) else None
                  if not isinstance(s,str) or not s.strip():
                      continue
                  try:
                      dt=datetime.fromisoformat(s.strip().replace('Z','+00:00'))
                      if dt.tzinfo is None:
                          dt=dt.replace(tzinfo=timezone.utc)
                      return dt.astimezone(timezone.utc)
                  except Exception:
                      pass
              return None

          ac=snap('ac')
          sac=snap('stable_ac')
          mine=data(get(f'{API}/competitions/acc/submissions/mine?limit=100',auth=True))
          comp=data(get(f'{API}/competitions/acc',auth=True))
          items=mine.get('items',[]) if isinstance(mine,dict) else []

          lim=None
          for k in ('dailySubmissions','dailySubmissionLimit','submissionsPerDay'):
              v=comp.get(k) if isinstance(comp,dict) else None
              if isinstance(v,int):
                  lim=v
                  break
          if lim is None:
              lim=40
          today=datetime.now(timezone.utc).date()
          used=sum((t is not None and t.date()==today) for t in (stamp(x) for x in items))

          ours={}
          for sub in items:
              for rr in sub.get('results',[]) if isinstance(sub,dict) else []:
                  if not rr.get('ok'):
                      continue
                  cid=rr.get('challenge_id') or rr.get('problemId') or rr.get('challengeId')
                  n=rr.get('length')
                  if cid and isinstance(n,int):
                      cid=str(cid)
                      ours[cid]=min(n,ours.get(cid,n))

          unique=tied=lost=0
          for cid,n in ours.items():
              row=(ac if cid.startswith('ac-') else sac).get(cid)
              if not row or row.get('status')!='solved' or not isinstance(row.get('currentBestLength'),int):
                  continue
              best=row['currentBestLength']; kt=row.get('kTeams')
              if n==best and kt==1:
                  unique+=1
              elif n==best:
                  tied+=1
              elif n>best:
                  lost+=1

          def census(rows):
              vals=list(rows.values())
              unsolved=sum(1 for x in vals if x.get('status')!='solved' or x.get('kTeams')==0)
              singleton=[x for x in vals if x.get('status')=='solved' and x.get('kTeams')==1 and isinstance(x.get('currentBestLength'),int)]
              singleton.sort(key=lambda x:(-x['currentBestLength'], str(x.get('problemId') or x.get('challengeId') or '')))
              return {
                  'rows':len(vals),
                  'unsolved':unsolved,
                  'singleton_records':len(singleton),
                  'top_singletons':[{
                      'id':str(x.get('problemId') or x.get('challengeId')),
                      'best':x.get('currentBestLength'),
                      'kTeams':x.get('kTeams')
                  } for x in singleton[:25]],
              }

          out={
              'utc':datetime.now(timezone.utc).isoformat(),
              'quota':{'used':used,'remaining':max(0,lim-used),'limit':lim},
              'standing':{'unique':unique,'tied':tied,'lost':lost},
              'ac':census(ac),
              'stable_ac':census(sac),
          }
          print('ACC_LIVE_AUTHORITY',json.dumps(out,sort_keys=True))
          open('acc_live_authority.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Gather verifier-clean pending pools
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/reset_inputs /tmp/pending
          # No hard-coded stale candidates: only current reusable offline pools.
          for NAME in acc-fresh-frontier-v2-pool acc-offline-high-slack-pool acc-depth-cost-sweep-v1 acc-family-bridge-v1 acc-peephole-recovery-v1 acc-peephole-recovery-v2 acc-peephole-recovery-v3 acc-current-tail-pool acc-atlas-connector-pool acc-official-bestfirst-pool; do
            ID="$(gh api "repos/heathsanchez/test/actions/artifacts?name=$NAME&per_page=1" --jq '.artifacts[0].id // empty')"
            if [ -n "$ID" ]; then
              echo "Downloading $NAME artifact $ID"
              gh api "repos/heathsanchez/test/actions/artifacts/$ID/zip" > "/tmp/$NAME.zip"
              mkdir -p "/tmp/pending/$NAME"
              unzip -q "/tmp/$NAME.zip" -d "/tmp/pending/$NAME"
            fi
          done
          python3 - <<'PY'
          import hashlib, pathlib
          roots=pathlib.Path('/tmp/pending'); outs=[]
          for p in sorted(roots.rglob('*'), key=lambda q: str(q)):
              if p.is_file() and p.name in ('submission_v2.txt','pending_submission.txt'):
                  txt=p.read_text().strip()
                  if txt: outs.append(txt); print('SOURCE',p)
          out=pathlib.Path('acc_competitive/reset_inputs/all.txt')
          out.write_text(('\n'.join(outs)+'\n') if outs else '')
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          pathlib.Path('acc_competitive/reset_inputs/input.sha256').write_text(digest+'\n')
          print('PENDING_SOURCE_FILES',len(outs)); print('PENDING_LINES',sum(len(x.splitlines()) for x in outs)); print('INPUT_SHA256',digest)
          PY

      - name: Recover prior proof atlas if available
        run: |
          set -euo pipefail
          mkdir -p /tmp/prior_atlas
          ID="$(gh api 'repos/heathsanchez/test/actions/artifacts?name=acc-proof-atlas-state&per_page=1' --jq '.artifacts[0].id // empty')"
          if [ -n "$ID" ]; then
            gh api "repos/heathsanchez/test/actions/artifacts/$ID/zip" > /tmp/prior_atlas.zip
            unzip -q /tmp/prior_atlas.zip -d /tmp/prior_atlas
          fi

      - name: Stop at certified stale fixed point
        id: source_gate
        run: |
          set -euo pipefail
          CURRENT="acc_competitive/reset_inputs/input.sha256"
          PRIOR="$(find /tmp/prior_atlas -name exhausted_input.sha256 2>/dev/null | head -1 || true)"
          if [ -n "$PRIOR" ] && cmp -s "$CURRENT" "$PRIOR"; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            echo "EXHAUSTED_INPUT_FIXED_POINT $(cat "$CURRENT")"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
            echo "NEW_OR_UNCERTIFIED_INPUT $(cat "$CURRENT")"
          fi

      - name: Fetch pinned official verifier
        if: steps.source_gate.outputs.unchanged != 'true'
        run: |
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736

      - name: Fortify every candidate through shared proof atlas
        if: steps.source_gate.outputs.unchanged != 'true'
        run: |
          set -euo pipefail
          if [ ! -s acc_competitive/reset_inputs/all.txt ]; then echo "No pending candidates."; exit 0; fi
          PRIOR="$(find /tmp/prior_atlas -name proof_atlas.sqlite 2>/dev/null | head -1 || true)"
          ARGS=(--acc-root /tmp/acc --glob 'acc_competitive/reset_inputs/all.txt' --out-dir acc_competitive/fortified --reverse-depth 7 --reverse-cap 250000)
          if [ -n "$PRIOR" ]; then ARGS+=(--prior-atlas "$PRIOR"); fi
          python3 acc_competitive/proof_atlas_fortify_v1.py "${ARGS[@]}" | tee acc_competitive/fortify.log

      - name: Superoptimize before any POST
        if: steps.source_gate.outputs.unchanged != 'true'
        run: |
          set -euo pipefail
          if [ ! -s acc_competitive/fortified/fortified_ac.txt ]; then echo "No fortified candidates."; exit 0; fi
          python3 acc_competitive/batch_peephole_fortify_v1.py --acc-root /tmp/acc \
            --input acc_competitive/fortified/fortified_ac.txt --out-dir acc_competitive/peephole_fortified \
            --thin-win-frac 0.25 --near-miss-frac 0.10 --max-window 5 --max-path 6000 \
            | tee acc_competitive/batch_peephole.log

      - name: Fresh live strict-only quota gate and publish one packed batch
        if: steps.source_gate.outputs.unchanged != 'true'
        run: |
          set -euo pipefail
          if [ ! -s acc_competitive/peephole_fortified/fortified_ac.txt ]; then echo "No fortified candidates."; exit 0; fi
          python3 andrews_curtis/continuous_aggregate_v5.py --acc-root /tmp/acc \
            --glob 'acc_competitive/peephole_fortified/fortified_ac.txt' \
            --out-dir acc_competitive/reset_publish_out --cycle 0 | tee acc_competitive/reset_publish.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('acc_competitive/reset_publish_out/report.json')
          if not p.exists():
              raise SystemExit('missing publication report')
          r=json.loads(p.read_text())
          if r.get('quota_reason') not in ('ok','daily_quota_exhausted'):
              raise SystemExit(f"unsafe quota state: {r.get('quota_reason')}")
          if r.get('selected_scoring_ties',0):
              raise SystemExit('tie selected for publication')
          if r.get('selected_rows',0) != r.get('selected_strict_improvements',0):
              raise SystemExit('non-strict row selected for publication')
          print('STRICT_QUOTA_GATE_OK', json.dumps({
              'used': r.get('daily_submissions_used_pre'),
              'remaining': r.get('daily_submissions_remaining_pre'),
              'strict': r.get('selected_strict_improvements'),
              'submission_id': r.get('submission_id')
          }, sort_keys=True))
          # Records are monotone: once this exact input has no strict win under
          # a proved quota state, replaying it cannot become competitive later.
          # Persist the exhaustion certificate only for the zero-strict case;
          # quota-blocked strict candidates remain eligible for a later retry.
          if not r.get('quota_blocked') and r.get('selected_strict_improvements',0) == 0:
              src=Path('acc_competitive/reset_inputs/input.sha256')
              dst=Path('acc_competitive/fortified/exhausted_input.sha256')
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text(src.read_text())
              print('EXHAUSTION_CERTIFIED', src.read_text().strip())
          PY

      - name: Persist compounding proof atlas
        if: ${{ always() && steps.source_gate.outputs.unchanged != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: acc-proof-atlas-state
          path: |
            acc_competitive/fortified/proof_atlas.sqlite
            acc_competitive/fortified/fortification.json
            acc_competitive/fortified/report.json
            acc_competitive/fortified/exhausted_input.sha256
          retention-days: 90
          if-no-files-found: warn

      - name: Upload reset authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-reset-publisher-authority
          path: |
            acc_live_authority.json
            acc_competitive/reset_inputs/
            acc_competitive/reset_publish_out/
            acc_competitive/fortified/
            acc_competitive/peephole_fortified/
            acc_competitive/fortify.log
            acc_competitive/batch_peephole.log
            acc_competitive/reset_publish.log
          retention-days: 90
          if-no-files-found: warn
