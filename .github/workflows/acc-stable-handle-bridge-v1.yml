name: ACC Stable Handle Bridge V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-stable-handle-bridge-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Pin official verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          test "$(git -C /tmp/acc rev-parse HEAD)" = "$OFFICIAL_PIN"

      - name: Recover owned AC witnesses and search shallow Stable handle bridges
        run: |
          set -euo pipefail
          mkdir -p handle
          PYTHONPATH=/tmp/acc/competition/tools python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          from verifier import stable_core

          BASE='https://api.sair.foundation/api/public/v1'; KEY=os.environ['SAIR_API_KEY']
          H={'Authorization':f'Bearer {KEY}','Accept':'application/json','User-Agent':'Mozilla/5.0'}
          def req(path,accept='application/json'):
              h=dict(H); h['Accept']=accept
              r=urllib.request.Request(BASE+path,headers=h)
              try:
                  with urllib.request.urlopen(r,timeout=60) as z:return z.status,dict(z.headers.items()),z.read()
              except urllib.error.HTTPError as e:return e.code,dict(e.headers.items()),e.read()
          def js(path):
              st,hd,raw=req(path)
              if not 200<=st<300: raise RuntimeError(f'GET {path} HTTP {st}: {raw[:500]!r}')
              return json.loads(raw.decode())
          def data(o): return o.get('data',o) if isinstance(o,dict) else o
          def find_int(x,key):
              if isinstance(x,dict):
                  if type(x.get(key)) is int:return x[key]
                  for v in x.values():
                      z=find_int(v,key)
                      if z is not None:return z
              elif isinstance(x,list):
                  for v in x:
                      z=find_int(v,key)
                      if z is not None:return z
              return None

          spec=js('/competitions/acc/submission-spec')
          maxsol=find_int(spec,'maxSolutions') or 100
          stable=data(js('/competitions/acc/discoveries/snapshot?problem=stable_ac'))
          smap={(x.get('problemId') or x.get('challengeId')):x for x in stable['items']}

          items=[];cursor=None;pages=0
          while True:
              q={'limit':'100'}
              if cursor:q['cursor']=cursor
              d=data(js('/competitions/acc/submissions/mine?'+urllib.parse.urlencode(q)))
              items += d.get('items',[]) if isinstance(d,dict) else []
              cursor=d.get('nextCursor') if isinstance(d,dict) else None;pages+=1
              if not cursor or pages>=100:break

          pat=re.compile(r'^\s*(ac-[0-9]+)\s*:\s*(\[[^\n#]*\])',re.M)
          owned={}; download_errors=[]
          for rec in items:
              if not isinstance(rec,dict) or not rec.get('submissionId'):continue
              subid=str(rec['submissionId'])
              st,hd,raw=req('/competitions/acc/submissions/'+urllib.parse.quote(subid,safe='')+'/download','text/plain')
              if st!=200:
                  download_errors.append({'submissionId':subid,'http':st});continue
              try:txt=raw.decode('utf-8-sig')
              except Exception:continue
              for m in pat.finditer(txt):
                  cid=m.group(1)
                  try:moves=json.loads(m.group(2))
                  except Exception:continue
                  if not isinstance(moves,list) or not all(type(x) is int for x in moves):continue
                  prev=owned.get(cid)
                  if prev is None or len(moves)<len(prev['moves']):
                      owned[cid]={'moves':moves,'submissionId':subid,'receivedAt':rec.get('receivedAt')}

          manifest=json.load(open('/tmp/acc/competition/tools/verifier/data/manifest.json'))
          cmap={c['challenge_id']:c for c in manifest['challenges']}

          # Distinct residual from the exhausted terminal compiler:
          # exactly one rank-2 -> rank-3 stabilization, <=2 moves that
          # genuinely touch the fresh handle r2/g3, then one destabilization
          # back to rank 2.  We accept only an exact reconnect to a *later*
          # state of the owned AC witness, so every bridge has an executable
          # semantic oracle and a quantified move saving.
          handle_moves=[]
          for row in stable_core.MOVE_TABLE:
              mid=row['id']; cat=row['category']
              if mid <= 22: continue
              touches = row.get('relator') == 2 or row.get('other') == 2 or abs(row.get('conjugator',0)) == 3
              if touches: handle_moves.append(mid)
          destabilizers=(15,16,17)
          assert 14 not in handle_moves and all(m >= 23 for m in handle_moves)

          all_bridges=[]; best_by_sid={}; replay_errors=[]; prefixes_tested=0; states_expanded=0
          for cid,h in sorted(owned.items()):
              sid='sac-'+cid[3:]
              ch=cmap.get(sid); live=smap.get(sid)
              if not ch or not live:continue
              moves=h['moves']
              state=tuple(tuple(w) for w in ch['initial_relators'])
              states=[state]
              ok=True
              for p,m in enumerate(moves):
                  state,reason=stable_core.apply_move(state,m)
                  if reason is not None:
                      replay_errors.append({'cid':cid,'move_index':p,'move':m,'reason':reason});ok=False;break
                  states.append(state)
              if not ok:continue
              future={}
              for j,s in enumerate(states): future.setdefault(s,[]).append(j)
              # Cheapest useful screen: last 32 prefixes, reconnect no more
              # than 10 AC moves ahead.  A <=4-move bridge must skip >=5.
              start=max(0,len(moves)-32)
              local_best=None
              for i in range(start,len(moves)+1):
                  prefixes_tested += 1
                  s1,reason=stable_core.apply_move(states[i],14)
                  if reason is not None:continue
                  layers=[(s1,())]
                  seen={(s1,0)}
                  for depth in range(0,3):
                      next_layers=[]
                      for cur,seq in layers:
                          states_expanded += 1
                          # Close the handle now by any legal rank-3 destabilization.
                          for dm in destabilizers:
                              out,why=stable_core.apply_move(cur,dm)
                              if why is not None or len(out)!=2:continue
                              for j in future.get(out,()):
                                  if not (i < j <= min(len(moves),i+10)):continue
                                  bridge=[14]+list(seq)+[dm]
                                  saving=(j-i)-len(bridge)
                                  if saving <= 0:continue
                                  rec={'cid':cid,'sid':sid,'i':i,'j':j,'bridge':bridge,
                                       'replaced_moves':moves[i:j],'bridge_len':len(bridge),
                                       'replaced_len':j-i,'saving':saving,
                                       'source_len':len(moves),'source_submissionId':h['submissionId']}
                                  all_bridges.append(rec)
                                  key=(-saving,len(bridge),i,j,bridge)
                                  if local_best is None or key < local_best[0]: local_best=(key,rec)
                          if depth==2:continue
                          for hm in handle_moves:
                              inv=stable_core.INVERSE_MOVE[hm]
                              if seq and inv is not None and seq[-1]==inv:continue
                              out,why=stable_core.apply_move(cur,hm)
                              if why is not None or len(out)!=3:continue
                              # Avoid explosive detours irrelevant to local compression.
                              if sum(map(len,out)) > 220:continue
                              tag=(out,depth+1)
                              if tag in seen:continue
                              seen.add(tag);next_layers.append((out,seq+(hm,)))
                      layers=next_layers
                  if local_best is not None:
                      rec=dict(local_best[1])
                      cand=moves[:rec['i']]+rec['bridge']+moves[rec['j']:]+[16,15]
                      rec['moves']=cand;rec['candidate_len']=len(cand)
                      rec['naive_len']=len(moves)+2
                      rec['stable_status']=live.get('status');rec['stable_best']=live.get('currentBestLength')
                      rec['stable_kTeams']=live.get('kTeams')
                      prev=best_by_sid.get(sid)
                      if prev is None or (rec['candidate_len'],-rec['saving']) < (prev['candidate_len'],-prev['saving']):
                          best_by_sid[sid]=rec

          candidates=[]
          for sid,rec in best_by_sid.items():
              b=rec['stable_best']; st=rec['stable_status']
              if st!='solved' or not isinstance(b,int) or rec['candidate_len']<b:candidates.append(rec)
          candidates.sort(key=lambda c:(0 if c['stable_status']!='solved' or c['stable_best'] is None else 1,
                                        0 if c['stable_best'] is None else -(c['stable_best']-c['candidate_len']),
                                        c['candidate_len'],c['sid']))
          selected=candidates[:maxsol]
          summary={'history_pages':pages,'history_items':len(items),'owned_ac_witnesses':len(owned),
                   'download_errors':download_errors,'replay_errors':replay_errors,
                   'handle_moves':handle_moves,'prefixes_tested':prefixes_tested,'states_expanded':states_expanded,
                   'semantic_bridges':len(all_bridges),'witnesses_with_bridge':len(best_by_sid),
                   'strict_live_gains':len(candidates),'selected':len(selected),'maxSolutions':maxsol,
                   'best_bridge_saving':max([x['saving'] for x in all_bridges],default=0)}
          Path('handle/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          Path('handle/all_bridges.json').write_text(json.dumps(all_bridges,indent=2,sort_keys=True)+'\n')
          Path('handle/best_by_sid.json').write_text(json.dumps(best_by_sid,indent=2,sort_keys=True)+'\n')
          Path('handle/candidates.json').write_text(json.dumps(candidates,indent=2,sort_keys=True)+'\n')
          Path('handle/candidate_batch.txt').write_text(''.join(c['sid']+': '+json.dumps(c['moves'],separators=(',',':'))+'\n' for c in selected))
          print('ACC_STABLE_HANDLE_BRIDGE',json.dumps({**summary,'targets':[{'id':c['sid'],'candidate':c['candidate_len'],'live':c['stable_best'],'saving':c['saving']} for c in selected]},sort_keys=True))
          PY

      - name: Pinned official candidate replay
        run: |
          set -euo pipefail
          if [ ! -s handle/candidate_batch.txt ]; then echo NO_HANDLE_GAIN_CANDIDATES; exit 0; fi
          PYTHONPATH=/tmp/acc/competition/tools python3 -m verifier \
            --manifest /tmp/acc/competition/tools/verifier/data/manifest.json \
            --submission handle/candidate_batch.txt
          touch handle/PINNED_VERIFIER_PASS
          echo ACC_STABLE_HANDLE_BATCH_VERIFIED

      - name: Immediate live and quota filter
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          BASE='https://api.sair.foundation/api/public/v1';KEY=os.environ['SAIR_API_KEY']
          H={'Authorization':f'Bearer {KEY}','Accept':'application/json','User-Agent':'Mozilla/5.0'}
          def js(path):
              req=urllib.request.Request(BASE+path,headers=H)
              with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode())
          def data(o):return o.get('data',o) if isinstance(o,dict) else o
          def find_daily(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k in ('dailySubmissions','dailySubmissionLimit','submissionsPerDay') and type(v) is int:return v
                  for v in x.values():
                      z=find_daily(v)
                      if z is not None:return z
              elif isinstance(x,list):
                  for v in x:
                      z=find_daily(v)
                      if z is not None:return z
              return None
          def stamp(rec):
              for k in ('receivedAt','createdAt','updatedAt','submittedAt','created','timestamp','submitted'):
                  s=rec.get(k) if isinstance(rec,dict) else None
                  if not isinstance(s,str) or not s:continue
                  try:
                      dt=datetime.fromisoformat(s.replace('Z','+00:00'))
                      if dt.tzinfo is None:dt=dt.replace(tzinfo=timezone.utc)
                      return dt.astimezone(timezone.utc)
                  except Exception:pass
              return None
          src=Path('handle/candidate_batch.txt');dst=Path('handle/publish_batch.txt');dst.write_text('')
          verified=Path('handle/PINNED_VERIFIER_PASS').exists() and src.exists() and src.stat().st_size>0
          stable=data(js('/competitions/acc/discoveries/snapshot?problem=stable_ac'))
          smap={(x.get('problemId') or x.get('challengeId')):x for x in stable['items']}
          keep=[];decisions=[]
          if verified:
              for line in src.read_text().splitlines():
                  cid,raw=line.split(':',1);moves=json.loads(raw.strip());row=smap.get(cid,{})
                  status=row.get('status');best=row.get('currentBestLength')
                  improves=status!='solved' or not isinstance(best,int) or len(moves)<best
                  decisions.append({'id':cid,'candidate_len':len(moves),'live_status':status,'live_best':best,'keep':improves})
                  if improves:keep.append(line)
          me=data(js('/competitions/acc/me'));spec=js('/competitions/acc/submission-spec');limit=find_daily(spec)
          items=[];cursor=None;pages=0
          while True:
              q={'limit':'100'}
              if cursor:q['cursor']=cursor
              d=data(js('/competitions/acc/submissions/mine?'+urllib.parse.urlencode(q)))
              items += d.get('items',[]) if isinstance(d,dict) else []
              cursor=d.get('nextCursor') if isinstance(d,dict) else None;pages+=1
              if not cursor or pages>=100:break
          today=datetime.now(timezone.utc).date();used=sum((t:=stamp(x)) is not None and t.date()==today for x in items)
          can_submit=bool(me.get('canSubmit')) if isinstance(me,dict) else False
          quota_ok=isinstance(limit,int) and used<limit
          gate={'verified':verified,'candidate_rows':len(decisions),'publishable_rows':len(keep),
                'canSubmit':can_submit,'quota_used':used,'quota_limit':limit,
                'quota_remaining':max(0,limit-used) if isinstance(limit,int) else None,'decisions':decisions}
          Path('handle/prepublish_gate.json').write_text(json.dumps(gate,indent=2,sort_keys=True)+'\n')
          print('ACC_STABLE_HANDLE_PREPUBLISH',json.dumps({k:v for k,v in gate.items() if k!='decisions'},sort_keys=True))
          if verified and keep and can_submit and quota_ok:dst.write_text('\n'.join(keep)+'\n')
          PY

      - name: Publish only live strict gains
        run: |
          set -euo pipefail
          if [ ! -s handle/publish_batch.txt ]; then echo NO_PUBLISHABLE_HANDLE_GAINS; exit 0; fi
          ACC_SUBMISSION_FILE=handle/publish_batch.txt \
          ACC_SUBMIT_OUT=handle/publish \
          python3 acc_submit/submit_live_filtered.py | tee handle/publish.log

      - name: Post-live gain audit
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          BASE='https://api.sair.foundation/api/public/v1';KEY=os.environ['SAIR_API_KEY']
          H={'Authorization':f'Bearer {KEY}','Accept':'application/json','User-Agent':'Mozilla/5.0'}
          def js(path):
              req=urllib.request.Request(BASE+path,headers=H)
              with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode())
          def data(o):return o.get('data',o) if isinstance(o,dict) else o
          stable=data(js('/competitions/acc/discoveries/snapshot?problem=stable_ac'))
          smap={(x.get('problemId') or x.get('challengeId')):x for x in stable['items']}
          ids=[];p=Path('handle/publish_batch.txt')
          if p.exists():ids=[ln.split(':',1)[0] for ln in p.read_text().splitlines() if ':' in ln]
          rows={cid:{'status':smap.get(cid,{}).get('status'),'best':smap.get(cid,{}).get('currentBestLength'),
                     'kTeams':smap.get(cid,{}).get('kTeams')} for cid in ids}
          Path('handle/post_live.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          print('ACC_STABLE_HANDLE_POST_LIVE',json.dumps(rows,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-stable-handle-bridge-v1
          path: handle/
          retention-days: 90
          if-no-files-found: warn
