name: ACC Standing Check

on:
  push:
    branches:
      - andrews-curtis-development-v1
    paths:
      - ".github/workflows/acc-standing-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
      ACC_STATUS_OUT: acc_status/out

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require API key
        run: test -n "$SAIR_API_KEY"

      - name: Poll published ACC standing
        run: python3 acc_status/check_live_standing.py | tee acc_status/standing.log

      - name: Publish summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p=pathlib.Path("acc_status/out/standing_summary.json")
          print("# ACC standing")
          if p.exists():
              d=json.loads(p.read_text())
              print(f"- Team: `{d.get('teamNumber')}`")
              for problem,row in d.get("published",{}).items():
                  print(f"- {problem}: rank **{row.get('rank')}**, score **{row.get('score')}**, scoring challenges **{row.get('currentBestCount')}**, snapshot `{row.get('generatedAt')}`")
          else:
              print("- No standing summary produced.")
          PY

      - name: Upload standing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-standing-evidence
          path: |
            acc_status/out/
            acc_status/standing.log
          if-no-files-found: warn
