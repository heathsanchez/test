name: ACC Strict Record Steal V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-strict-record-steal-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_PIN: "99a65377c5c4f412cd9af7b8d31c41464a855736"
  ACSOLVERX_PIN: "6a12515fe1d95178a483b76d5553266e61122417"

jobs:
  attack:
    strategy:
      fail-fast: false
      matrix:
        cid:
          - ac-00676
          - ac-04501
          - ac-02986
          - ac-01921
          - ac-10049
          - ac-01910
          - ac-03665
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Prepare pinned search and verifier authority
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy==2.1.3' 'numba==0.63.1'
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet "$ACSOLVERX_PIN"
          SWAP=/swapfile-extra-acc-strict
          sudo fallocate -l 8G "$SWAP"
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"

      - name: Search one fresh strict-record target
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          printf '["%s"]\n' '${{ matrix.cid }}' > /tmp/targets.json
          out="acc_competitive/strict_record_steal/${{ matrix.cid }}"
          mkdir -p "$out"
          python3 andrews_curtis/solver_v2_gssub.py \
            --acc-root /tmp/acc \
            --acsolverx-root /tmp/acsolverx \
            --out-dir "$out" \
            --target-ids-file /tmp/targets.json \
            --include-solved --defer-live-filter \
            --max-targets 1 \
            --max-nodes 250000 \
            --max-quotient-total 100 \
            --reverse-depth 7 \
            --reverse-cap 250000 \
            --compiler-beam 16 \
            --depth-weight 0 \
            --search-seconds 3000 \
            | tee "$out.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-strict-steal-${{ matrix.cid }}
          path: |
            acc_competitive/strict_record_steal/
          retention-days: 90

  consolidate_publish:
    needs: attack
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover strict-record evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/strict
          gh run download "${{ github.run_id }}" --pattern 'acc-strict-steal-*' -D /tmp/strict || true
          find /tmp/strict -name search_results.json -print | sort
          find /tmp/strict -name submission_v2.txt -print | sort

      - name: Fetch pinned official verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet "$OFFICIAL_PIN"

      - name: Merge pinned-verifier-clean AC candidates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          best={}
          for p in Path('/tmp/strict').rglob('submission_v2.txt'):
              for line in p.read_text().splitlines():
                  m=re.match(r'^(ac-[^:]+):\s*(\[.*\])$',line.strip())
                  if not m: continue
                  cid=m.group(1); moves=json.loads(m.group(2))
                  if cid not in best or len(moves)<len(best[cid]): best[cid]=moves
          out=Path('acc_competitive/strict_raw_ac.txt')
          out.write_text(''.join(f"{cid}: {json.dumps(m,separators=(',',':'))}\n" for cid,m in sorted(best.items())))
          print('STRICT_VERIFIED_AC_CANDIDATES',len(best))
          PY

      - name: Compile candidates into proof atlas
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/strict_atlas
          if [ ! -s acc_competitive/strict_raw_ac.txt ]; then
            echo "NO_STRICT_VERIFIED_CANDIDATES"
            : > acc_competitive/strict_atlas/fortified_ac.txt
            exit 0
          fi
          python3 acc_competitive/proof_atlas_fortify_v1.py \
            --acc-root /tmp/acc \
            --glob 'acc_competitive/strict_raw_ac.txt' \
            --out-dir acc_competitive/strict_atlas \
            --reverse-depth 7 --reverse-cap 250000 \
            | tee acc_competitive/strict_atlas.log

      - name: Peephole salvage every verified route
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/strict_peephole
          if [ ! -s acc_competitive/strict_atlas/fortified_ac.txt ]; then
            echo "NO_STRICT_ATLAS_CANDIDATES"
            : > acc_competitive/strict_peephole/fortified_ac.txt
            exit 0
          fi
          python3 acc_competitive/batch_peephole_fortify_v1.py \
            --acc-root /tmp/acc \
            --input acc_competitive/strict_atlas/fortified_ac.txt \
            --out-dir acc_competitive/strict_peephole \
            --thin-win-frac 0.25 --near-miss-frac 0.10 --max-window 5 --max-path 6000 \
            | tee acc_competitive/strict_peephole.log

      - name: Fresh-recheck, quota-gate, and publish only scoring rows
        env:
          SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          mkdir -p acc_competitive/strict_publish
          if [ ! -s acc_competitive/strict_peephole/fortified_ac.txt ]; then
            echo "NO_STRICT_VERIFIED_CANDIDATES_TO_PUBLISH"
            exit 0
          fi
          python3 andrews_curtis/continuous_aggregate_v5.py \
            --acc-root /tmp/acc \
            --glob 'acc_competitive/strict_peephole/fortified_ac.txt' \
            --out-dir acc_competitive/strict_publish \
            --cycle 1 \
            | tee acc_competitive/strict_publish.log

      - name: Strict-lane summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('acc_competitive/strict_publish/report.json')
          rep=json.loads(p.read_text()) if p.exists() else {
            'selected_rows':0,'submission_id':None,'terminal_status':None
          }
          print('STRICT_RECORD_STEAL_RESULT',json.dumps(rep,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-strict-record-steal-v1
          path: |
            acc_competitive/strict_raw_ac.txt
            acc_competitive/strict_atlas/
            acc_competitive/strict_atlas.log
            acc_competitive/strict_peephole/
            acc_competitive/strict_peephole.log
            acc_competitive/strict_publish/
            acc_competitive/strict_publish.log
            /tmp/strict/
          retention-days: 90
