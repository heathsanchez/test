name: ACC Submission Corpus Schema V1

on:
  push:
    branches: [acc-competitive-residual-v1]
    paths:
      - ".github/workflows/acc-submission-corpus-schema-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect authenticated submission-history schema without exposing values
        run: |
          set -euo pipefail
          test -n "$SAIR_API_KEY"
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          key=os.environ['SAIR_API_KEY']
          url='https://api.sair.foundation/api/public/v1/competitions/acc/submissions/mine?limit=100'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {key}','Accept':'application/json','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r: obj=json.loads(r.read().decode())
          d=obj.get('data',obj)
          items=d.get('items',[]) if isinstance(d,dict) else []

          def shape(x,depth=0):
              if depth>3: return type(x).__name__
              if isinstance(x,dict): return {k:shape(v,depth+1) for k,v in sorted(x.items())}
              if isinstance(x,list): return {'type':'list','count':len(x),'item':shape(x[0],depth+1) if x else None}
              if isinstance(x,str): return {'type':'str','length':len(x)}
              return type(x).__name__

          schemas=[]
          seen=set()
          for it in items:
              if not isinstance(it,dict): continue
              sig=tuple(sorted(it.keys()))
              if sig in seen: continue
              seen.add(sig); schemas.append(shape(it))
          result={
              'history_items':len(items),
              'distinct_top_level_schemas':len(schemas),
              'schemas':schemas,
              'top_level_data_keys':sorted(d.keys()) if isinstance(d,dict) else [],
          }
          Path('acc_submission_history_schema.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('ACC_SUBMISSION_HISTORY_SCHEMA',json.dumps(result,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: acc-submission-corpus-schema-v1
          path: acc_submission_history_schema.json
          retention-days: 30
