name: ACC Transport Atlas Connector V1

on:
  push:
    branches:
      - acc-competitive-residual-v1
    paths:
      - ".github/workflows/acc-transport-atlas-connector-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1

      - name: Recover latest verified Proof Atlas
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas
          ID="$(gh api 'repos/heathsanchez/test/actions/artifacts?name=acc-proof-atlas-state&per_page=1' --jq '.artifacts[0].id // empty')"
          [ -n "$ID" ] || { echo "No proof atlas"; exit 1; }
          gh api "repos/heathsanchez/test/actions/artifacts/$ID/zip" > /tmp/atlas.zip
          unzip -q /tmp/atlas.zip -d /tmp/atlas
          test -n "$(find /tmp/atlas -name proof_atlas.sqlite -print -quit)"

      - name: Freeze fresh transport-slack targets
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/transport_atlas_freeze
          python3 - <<'PY'
          import json,pathlib,urllib.request
          BASE='https://server-9527.sair.foundation'
          HEADERS={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          def fetch(problem):
              req=urllib.request.Request(BASE+f'/api/acc/discoveries/snapshot?problem={problem}',headers=HEADERS)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())
          def items(obj):
              data=obj.get('data',obj)
              rows=data['items']
              if rows:
                  print('SNAPSHOT_FIELDS',sorted(rows[0].keys()))
              return rows
          def cid(row):
              return row.get('problemId') or row.get('challengeId')

          ac=fetch('ac'); stable=fetch('stable_ac')
          ac_items=items(ac); stable_items=items(stable)
          stable_map={cid(x):x for x in stable_items if cid(x)}
          attempted=set(json.loads(pathlib.Path('acc_competitive/competitive_attempted_seed_v1.json').read_text()))
          wins=set(json.loads(pathlib.Path('acc_competitive/competitive_wins_seed_v1.json').read_text()))
          rows=[]
          for a in ac_items:
              aid=cid(a)
              if not aid or not aid.startswith('ac-') or aid in attempted or aid in wins:
                  continue
              sid='sac-'+aid[3:]
              s=stable_map.get(sid)
              if s is None or a.get('status')!='solved' or s.get('status')!='solved':
                  continue
              ab=a.get('currentBestLength'); sb=s.get('currentBestLength')
              if not isinstance(ab,int) or not isinstance(sb,int):
                  continue
              slack=sb-ab-2
              if slack<=0:
                  continue
              rows.append({
                  'challenge_id':aid,
                  'stable_challenge_id':sid,
                  'ac_best':ab,
                  'stable_best':sb,
                  'transport_slack':slack,
                  'source_bound_exclusive':max(ab,sb-2),
                  'ac_kTeams':a.get('kTeams'),
                  'stable_kTeams':s.get('kTeams'),
              })
          rows.sort(key=lambda x:(-x['transport_slack'],x['ac_best'],x['challenge_id']))
          rows=rows[:12]
          if not rows:
              raise SystemExit('No fresh positive transport-slack targets')
          root=pathlib.Path('acc_competitive/transport_atlas_freeze')
          (root/'snapshot_ac.json').write_text(json.dumps(ac,indent=2,sort_keys=True)+'\n')
          (root/'snapshot_stable.json').write_text(json.dumps(stable,indent=2,sort_keys=True)+'\n')
          (root/'selected.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          ids=[x['challenge_id'] for x in rows]
          for shard in range(4):
              (root/f'shard_{shard}.json').write_text(json.dumps(ids[shard::4],indent=2)+'\n')
          print('TRANSPORT_ATLAS_TARGETS',json.dumps(rows,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: acc-transport-atlas-freeze
          path: acc_competitive/transport_atlas_freeze/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: acc-transport-atlas-state
          path: /tmp/atlas/
          retention-days: 1

  search:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - uses: actions/download-artifact@v4
        with:
          name: acc-transport-atlas-freeze
          path: /tmp/freeze
      - uses: actions/download-artifact@v4
        with:
          name: acc-transport-atlas-state
          path: /tmp/atlas
      - name: Fetch pinned official verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736
      - name: Search exact radius-4 connectors into Proof Atlas
        run: |
          set -euo pipefail
          mkdir -p "acc_competitive/transport_atlas_${{ matrix.shard }}"
          python3 acc_competitive/transport_atlas_connector_v1.py \
            --acc-root /tmp/acc \
            --atlas "$(find /tmp/atlas -name proof_atlas.sqlite | head -1)" \
            --snapshot-ac "$(find /tmp/freeze -name snapshot_ac.json | head -1)" \
            --snapshot-stable "$(find /tmp/freeze -name snapshot_stable.json | head -1)" \
            --target-ids-file "$(find /tmp/freeze -name 'shard_${{ matrix.shard }}.json' | head -1)" \
            --out-dir "acc_competitive/transport_atlas_${{ matrix.shard }}" \
            --connector-depth 4 \
            --node-cap 250000 \
            | tee "acc_competitive/transport_atlas_${{ matrix.shard }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-transport-atlas-shard-${{ matrix.shard }}
          path: |
            acc_competitive/transport_atlas_${{ matrix.shard }}/
            acc_competitive/transport_atlas_${{ matrix.shard }}.log
          retention-days: 90
          if-no-files-found: warn

  pool:
    needs: search
    if: always() && needs.search.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-competitive-residual-v1
      - uses: actions/download-artifact@v4
        with:
          pattern: acc-transport-atlas-shard-*
          path: acc_competitive/transport_atlas_downloads
          merge-multiple: false
      - name: Pool pinned-verified connector results
        run: |
          set -euo pipefail
          mkdir -p acc_competitive/transport_atlas_pool
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('acc_competitive/transport_atlas_downloads')
          rows=[]; best={}
          for p in root.rglob('results.json'):
              rows.extend(json.loads(p.read_text()))
          for p in root.rglob('pending_submission.txt'):
              for line in p.read_text().splitlines():
                  if ':' not in line: continue
                  cid,raw=line.split(':',1)
                  try: moves=list(json.loads(raw.strip()))
                  except Exception: continue
                  if cid not in best or len(moves)<len(best[cid]):
                      best[cid]=moves
          rows.sort(key=lambda x:x['challenge_id'])
          out=pathlib.Path('acc_competitive/transport_atlas_pool')
          (out/'results.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          (out/'pending_submission.txt').write_text(
              '\n'.join(f'{cid}: {json.dumps(m,separators=(",",":"))}' for cid,m in sorted(best.items()))+('\n' if best else ''))
          report={
              'targets':len(rows),
              'winning_targets':sum(bool(r.get('strict_win')) for r in rows),
              'ac_wins':sum(bool(r.get('ac_strict_win')) for r in rows),
              'stable_wins':sum(bool(r.get('stable_strict_win')) for r in rows),
              'exact_radius_exhausted':sum(r.get('obstruction')=='exact_radius_exhausted' for r in rows),
              'node_cap_hits':sum(r.get('obstruction')=='node_cap' for r in rows),
              'pending_rows':len(best),
          }
          (out/'report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('TRANSPORT_ATLAS_POOL',json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acc-transport-atlas-pool
          path: acc_competitive/transport_atlas_pool/
          retention-days: 90
