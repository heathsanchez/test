name: V3 closed-lambda application separator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-control.yml'
  workflow_dispatch:

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Build frozen baseline and candidate
        run: |
          set -euxo pipefail
          BASE=3d7585c21242f29fdaa48ae9a16e16c6afe42238
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/kernel
          cd /tmp/kernel
          git worktree add --detach /tmp/base "$BASE"
          git worktree add --detach /tmp/cand "$BASE"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/cand/src/eval.rs')
          s = p.read_text()

          old1 = """                let clo_env = clo.env;
                let clo_body = clo.body;
                let new_env = value::env_extend(self.arena, clo_env, a);
                return self.eval(depth, new_env, clo_body);"""
          new1 = """                let clo_env = clo.env;
                let clo_body = clo.body;
                if self.ctx.num_loose_bvars(clo_body) == 0 {
                    return self.eval(depth, clo_env, clo_body);
                }
                let new_env = value::env_extend(self.arena, clo_env, a);
                return self.eval(depth, new_env, clo_body);"""
          assert s.count(old1) == 1, ('app-site', s.count(old1))
          s = s.replace(old1, new1, 1)

          old2 = """                let clo_env = clo.env;
                let clo_body = clo.body;
                let env = value::env_extend(self.arena, clo_env, a);
                self.eval(depth, env, clo_body)"""
          new2 = """                let clo_env = clo.env;
                let clo_body = clo.body;
                if self.ctx.num_loose_bvars(clo_body) == 0 {
                    return self.eval(depth, clo_env, clo_body);
                }
                let env = value::env_extend(self.arena, clo_env, a);
                self.eval(depth, env, clo_body)"""
          assert s.count(old2) == 1, ('apply-site', s.count(old2))
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY

          for A in base cand; do
            cd /tmp/$A
            cargo test --locked
            cargo build --release --locked
            cp target/release/sokonanoda /tmp/$A-bin
          done

          cat >/tmp/checker.json <<'EOF'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1,"print_success_message":false}
          EOF

      - name: Build pinned Arena tests
        run: |
          set -euxo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena.git /tmp/arena
          cd /tmp/arena
          git checkout --detach f0fe3b379dbce91537417b529140d0ca250f271c
          for T in perf/app-lam perf/beta-ladder perf/let-ladder perf/grind-ring-5; do
            nix develop -c ./lka.py build-test "$T"
          done

      - name: Semantic equality gate
        run: |
          set -euxo pipefail
          cd /tmp/arena
          for T in app-lam beta-ladder let-ladder grind-ring-5; do
            /tmp/base-bin /tmp/checker.json < _build/tests/perf/$T.ndjson > /tmp/base-$T.out 2>/tmp/base-$T.err
            /tmp/cand-bin /tmp/checker.json < _build/tests/perf/$T.ndjson > /tmp/cand-$T.out 2>/tmp/cand-$T.err
            cmp /tmp/base-$T.out /tmp/cand-$T.out
          done
          echo SEMANTIC_EQUALITY_OK

      - name: Callgrind separator
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          cd /tmp/arena
          for T in app-lam beta-ladder let-ladder grind-ring-5; do
            valgrind --tool=callgrind --callgrind-out-file=/tmp/base-$T.cg /tmp/base-bin /tmp/checker.json < _build/tests/perf/$T.ndjson >/dev/null 2>/tmp/base-$T.vg
            valgrind --tool=callgrind --callgrind-out-file=/tmp/cand-$T.cg /tmp/cand-bin /tmp/checker.json < _build/tests/perf/$T.ndjson >/dev/null 2>/tmp/cand-$T.vg
          done
          python3 - <<'PY'
          from pathlib import Path
          def ir(path):
              for line in Path(path).read_text(errors='ignore').splitlines():
                  if line.startswith('summary:'):
                      return int(line.split()[1])
              raise RuntimeError(path)
          ratios = {}
          for t in ['app-lam','beta-ladder','let-ladder','grind-ring-5']:
              b = ir(f'/tmp/base-{t}.cg')
              c = ir(f'/tmp/cand-{t}.cg')
              d = (c-b)/b
              ratios[t] = d
              print(f'{t} base={b} cand={c} delta={d:.6%}')
          target = min(ratios['app-lam'], ratios['beta-ladder'])
          guard = max(ratios['let-ladder'], ratios['grind-ring-5'])
          if target <= -0.03 and guard <= 0.005:
              decision = 'PROMOTE__CLOSED_LAMBDA_APPLICATION_ELISION'
          elif target <= -0.005 and guard <= 0.005:
              decision = 'REAL_GAIN__ESCALATE_FULL_ARENA'
          else:
              decision = 'KILL__CLOSED_LAMBDA_ELISION_NOT_MATERIAL'
          print('DECISION=' + decision)
          PY
