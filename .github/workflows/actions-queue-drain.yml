name: Actions Queue Drain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-queue-drain.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-queue-drain-control
  cancel-in-progress: true

jobs:
  drain:
    runs-on: macos-14
    timeout-minutes: 10
    env:
      KEEP_RUN_ID: '32689113520'
    steps:
      - name: Cancel stale queued and running jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ['REPO']
          token=os.environ['GH_TOKEN']
          this_id=int(os.environ['THIS_RUN_ID'])
          keep_id=int(os.environ['KEEP_RUN_ID'])
          headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'queue-drain-control',
          }

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          def post(url):
              req=urllib.request.Request(url,method='POST',headers=headers,data=b'')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  if e.code in (409,422): return e.code
                  raise

          victims=[]
          survivors=[]
          for status in ('in_progress','queued','pending','waiting'):
              url=f'https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100'
              data=get(url)
              for run in data.get('workflow_runs',[]):
                  rid=int(run['id'])
                  row=(rid,run.get('name'),run.get('status'),run.get('event'),run.get('head_branch'))
                  if rid in (this_id,keep_id):
                      survivors.append(row)
                  else:
                      victims.append(row)

          seen=set()
          victims=[r for r in victims if not (r[0] in seen or seen.add(r[0]))]
          print(f'queue_drain this={this_id} keep={keep_id} victims={len(victims)}')
          for row in victims:
              rid,name,status,event,branch=row
              code=post(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/cancel')
              print('cancel',rid,code,status,event,branch,name)

          time.sleep(10)
          print('kept:')
          for row in survivors:
              print(row)
          PY

