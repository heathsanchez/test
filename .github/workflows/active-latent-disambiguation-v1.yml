name: Active Latent Disambiguation V1
on:
  push:
    paths:
      - experiments/active_latent_disambiguation_v1/TRIGGER
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: active-latent-disambiguation-v1
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen benchmark
        run: python experiments/active_latent_disambiguation_v1/validate.py
      - name: Run protected active-disambiguation benchmark
        run: python experiments/active_latent_disambiguation_v1/run.py
      - name: Score externally
        run: python experiments/active_latent_disambiguation_v1/score.py experiments/active_latent_disambiguation_v1/answers.json | tee experiments/active_latent_disambiguation_v1/score_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: active-latent-disambiguation-v1-protected
          path: |
            experiments/active_latent_disambiguation_v1/answers.json
            experiments/active_latent_disambiguation_v1/run_metadata.json
            experiments/active_latent_disambiguation_v1/scores.json
            experiments/active_latent_disambiguation_v1/score_output.txt
          retention-days: 30
