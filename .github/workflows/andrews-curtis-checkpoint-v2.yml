name: Andrews-Curtis Checkpoint Transfer V2

on:
  push:
    branches:
      - andrews-curtis-development-v2
    paths:
      - ".github/workflows/andrews-curtis-checkpoint-v2.yml"
      - "andrews_curtis/solver_v2_checkpoint.py"
      - "andrews_curtis/solver_v2_gssub.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"

    steps:
      - name: Checkout MathGraph experiment
        uses: actions/checkout@v4

      - name: Require SAIR key
        run: test -n "$SAIR_API_KEY"

      - name: Fetch pinned official ACC
        run: |
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736
          test "$(git -C /tmp/acc rev-parse HEAD)" = "99a65377c5c4f412cd9af7b8d31c41464a855736"

      - name: Fetch pinned ACSolverX with public checkpoint
        run: |
          git clone --quiet https://github.com/Math-AI-Caltech/ACSolverX.git /tmp/acsolverx
          git -C /tmp/acsolverx checkout --quiet 6a12515fe1d95178a483b76d5553266e61122417
          test "$(git -C /tmp/acsolverx rev-parse HEAD)" = "6a12515fe1d95178a483b76d5553266e61122417"
          test -d /tmp/acsolverx/ppo_checkpoints/610model/1000/solve_data

      - name: Install checkpoint runtime
        run: |
          python3 -m pip install --quiet             "numpy==2.1.3"             "jax==0.6.0"             "jaxlib==0.6.0"             "orbax-checkpoint==0.11.16"

      - name: Syntax check
        run: |
          python3 -m py_compile             andrews_curtis/solver_v2_gssub.py             andrews_curtis/solver_v2_checkpoint.py

      - name: Compile public 610-solve history into official ACC moves
        run: |
          set -o pipefail
          python3 andrews_curtis/solver_v2_checkpoint.py             --acc-root /tmp/acc             --acsolverx-root /tmp/acsolverx             --out-dir andrews_curtis/out_v2_checkpoint             --checkpoint-name 610model             --checkpoint-step 1000             --ms-prefix 634             --max-compile 180             --compile-seconds 900             --reverse-depth 7             --reverse-cap 250000             --submit | tee andrews_curtis/v2_checkpoint.log

      - name: Write checkpoint-transfer summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p=pathlib.Path("andrews_curtis/out_v2_checkpoint/report_checkpoint_v2.json")
          print("# ACC public checkpoint transfer V2")
          if not p.exists():
              print("- No report produced; inspect log.")
          else:
              d=json.loads(p.read_text())
              print(f"- Checkpoint solves in first {d['checkpoint_prefix']}: **{d['checkpoint_solved_prefix']}**")
              print(f"- Mapped into scored pool: **{d['mapped_to_scored_pool']}**")
              print(f"- Still unsolved when run began: **{d['mapped_unsolved_at_start']}**")
              print(f"- Compile attempts: **{d['compile_attempts']}**")
              print(f"- Official-verifier AC solves: **{d['verified_ac']}**")
              print(f"- Competitive API rows: **{d['competitive_rows']}**")
              print(f"- Submission ID: **{d['submission_id']}**")
              for s in d.get("solutions", []):
                  print(f"- `{s['ac_id']}`: checkpoint {s['checkpoint_steps']} S-moves -> AC {s['ac_length']} official moves; Stable {s['stable_length']}")
          PY

      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andrews-curtis-checkpoint-v2
          path: |
            andrews_curtis/out_v2_checkpoint/
            andrews_curtis/v2_checkpoint.log
          if-no-files-found: warn
