name: Andrews-Curtis Loop Erasure V3

on:
  push:
    branches:
      - andrews-curtis-development-v2
    paths:
      - ".github/workflows/andrews-curtis-loop-erasure-v3.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  loop-erase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch shortened submission artifact
        run: |
          mkdir -p /tmp/acc122
          gh api repos/heathsanchez/test/actions/artifacts/10280942798/zip > /tmp/acc122.zip
          unzip -q /tmp/acc122.zip -d /tmp/acc122
          test -f /tmp/acc122/out_shorten_v3/submission.txt
      - name: Fetch pinned official verifier
        run: |
          git clone --quiet https://github.com/SAIRcompetition/Andrews-Curtis.git /tmp/acc
          git -C /tmp/acc checkout --quiet 99a65377c5c4f412cd9af7b8d31c41464a855736
      - name: Erase exact-state loops and submit strict improvements
        run: |
          set -o pipefail
          python3 andrews_curtis/shorten_loops_v3.py \
            --acc-root /tmp/acc \
            --input /tmp/acc122/out_shorten_v3/submission.txt \
            --out-dir andrews_curtis/out_loop_v3 \
            --submit | tee andrews_curtis/loop_v3.log
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,pathlib
          p=pathlib.Path("andrews_curtis/out_loop_v3/report.json")
          print("# ACC Exact-State Loop Erasure V3")
          if p.exists():
              d=json.loads(p.read_text())
              print(f"- Improved AC paths: **{d['improved_ac_paths']}**")
              print(f"- AC moves removed: **{d['total_ac_moves_saved']}**")
              print(f"- Selected rows: **{d['selected_rows']}**")
              print(f"- Submission ID: **{d.get('submission_id')}**")
          else: print("- No report.")
          PY
      - name: Upload loop-erasure authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-loop-erasure-v3
          path: |
            andrews_curtis/out_loop_v3/
            andrews_curtis/loop_v3.log
          if-no-files-found: warn
