name: ARC Robotics Cross-Domain Compounding V1

on:
  push:
    branches:
      - arc-robotics-cross-domain-compounding-v1
    paths:
      - 'experiments/arc_robotics_cross_domain_v1/**'
      - '.github/workflows/arc-robotics-cross-domain-v1.yml'
      - 'docs/superpowers/specs/2026-09-17-arc-robotics-cross-domain-compounding-design.md'
      - 'docs/superpowers/plans/2026-09-17-arc-robotics-cross-domain-compounding.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run frozen unit tests
        run: python -m unittest discover -s experiments/arc_robotics_cross_domain_v1 -p 'test_*.py' -v

      - name: Run sealed experiment
        run: python -m experiments.arc_robotics_cross_domain_v1.run

      - name: Validate sealed packet
        run: python -m experiments.arc_robotics_cross_domain_v1.validate

      - name: Score frozen causal prediction
        run: python -m experiments.arc_robotics_cross_domain_v1.score

      - name: Hash evidence packet
        if: always()
        run: |
          set -e
          cd experiments/arc_robotics_cross_domain_v1
          : > evidence_hashes.txt
          for f in PRECOMMIT.md core.py run.py score.py validate.py answers.json run_metadata.json capability.json scores.json; do
            if [ -f "$f" ]; then sha256sum "$f" >> evidence_hashes.txt; fi
          done
          cat evidence_hashes.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-robotics-cross-domain-v1
          path: |
            experiments/arc_robotics_cross_domain_v1/PRECOMMIT.md
            experiments/arc_robotics_cross_domain_v1/answers.json
            experiments/arc_robotics_cross_domain_v1/run_metadata.json
            experiments/arc_robotics_cross_domain_v1/capability.json
            experiments/arc_robotics_cross_domain_v1/scores.json
            experiments/arc_robotics_cross_domain_v1/evidence_hashes.txt
          if-no-files-found: warn
