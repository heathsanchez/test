name: ARC Robotics Cross-Domain Compounding V1

on:
  push:
    branches:
      - arc-robotics-cross-domain-compounding-v1
    paths:
      - 'experiments/arc_robotics_cross_domain_v1/**'
      - '.github/workflows/arc-robotics-cross-domain-v1.yml'
      - 'docs/superpowers/specs/2026-09-17-arc-robotics-cross-domain-compounding-design.md'
      - 'docs/superpowers/plans/2026-09-17-arc-robotics-cross-domain-compounding.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen unit tests
        run: python -m unittest experiments.arc_robotics_cross_domain_v1.test_core -v
