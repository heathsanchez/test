name: ARC3 Developmental Kernel Probe

on:
  push:
    paths:
      - 'scripts/arc3_developmental_kernel.py'
      - '.github/workflows/arc3-developmental-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ls20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official ARC-AGI-3 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'arc-agi==0.9.6' 'arcengine>=0.9' 'numpy>=1.24'

      - name: Run observation-only developmental kernel on public ls20
        run: |
          set -o pipefail
          mkdir -p arc3-results
          python scripts/arc3_developmental_kernel.py             --game ls20             --max-actions 400             --seed 0             --out arc3-results/ls20-developmental-result.json             2>&1 | tee arc3-results/run.log

      - name: Hash result packet
        if: always()
        run: |
          mkdir -p arc3-results
          sha256sum scripts/arc3_developmental_kernel.py > arc3-results/hashes.txt
          if [ -f arc3-results/ls20-developmental-result.json ]; then sha256sum arc3-results/ls20-developmental-result.json >> arc3-results/hashes.txt; fi
          if [ -f arc3-results/run.log ]; then sha256sum arc3-results/run.log >> arc3-results/hashes.txt; fi
          cat arc3-results/hashes.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-developmental-kernel-ls20
          path: arc3-results/
          if-no-files-found: warn
