name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Probe Level2 dynamics
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/level2_dynamics_probe.py | tee arc3_level2_probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-level2-probe
          path: arc3_level2_probe.log
