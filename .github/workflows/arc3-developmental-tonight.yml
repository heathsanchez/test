name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Run true-root phase-22 cost-dominance search
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/developmental_ls20_v11_true_phase22.py | tee arc3_developmental_v11_true_phase22.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-developmental-v11-true-phase22
          path: |
            arc3_developmental_v11_true_phase22.log
            arc3_developmental_v11_true_phase22_result.json
