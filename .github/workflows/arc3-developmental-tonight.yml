name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  goal-kernel:
    strategy:
      fail-fast: false
      matrix:
        first_action: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Test environmental vs GOAL consequence
        shell: bash
        env:
          ARC_SHARD_ACTION: ${{ matrix.first_action }}
        run: |
          set -o pipefail
          python experiments/arc3_tonight/developmental_ls20_v31b_goal_kernel_collision_probe.py | tee arc3_v31b_goal_kernel_${ARC_SHARD_ACTION}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-v31b-goal-kernel-${{ matrix.first_action }}
          path: |
            arc3_v31b_goal_kernel_*.log
            arc3_v31b_goal_kernel_collision_probe_*.json
