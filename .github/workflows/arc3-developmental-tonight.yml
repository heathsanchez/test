name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Run Level2 resource quotient BFS
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/developmental_ls20_v10_resource_quotient_bfs.py | tee arc3_v10_resource_quotient.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-v10-resource-quotient
          path: |
            arc3_v10_resource_quotient.log
            arc3_developmental_v10_resource_quotient_result.json
