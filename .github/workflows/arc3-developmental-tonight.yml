name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Run consequence-earned event-window realization
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/developmental_ls20_v7_windows.py | tee arc3_developmental_v7_windows.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-developmental-v7-windows
          path: |
            arc3_developmental_v7_windows.log
            arc3_developmental_v7_windows_result.json
