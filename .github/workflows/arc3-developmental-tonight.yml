name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Run self-learned search policy on Level4
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/developmental_ls20_v16_self_learned_search_level4.py | tee arc3_v16_self_learned_search.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-v16-self-learned-search
          path: |
            arc3_v16_self_learned_search.log
            arc3_developmental_v16_self_learned_search_level4_result.json
