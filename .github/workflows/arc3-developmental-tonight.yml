name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Run consequence-qualified observation genesis
        run: python experiments/arc3_tonight/developmental_ls20_v3.py | tee arc3_developmental_v3.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-developmental-v3
          path: |
            arc3_developmental_v3.log
            arc3_developmental_v3_result.json
