name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Run scalar resource-count ledger on Level4
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/developmental_ls20_v23_scalar_resource_count_ledger.py | tee arc3_v23_scalar_resource.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-v23-scalar-resource
          path: |
            arc3_v23_scalar_resource.log
            arc3_developmental_v22_scalar_resource_count_ledger_result.json
