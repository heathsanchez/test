name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  finite-goal-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify finite GOAL-evaluation kernel
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/minimal_goal_evaluation_kernel.py | tee minimal_goal_evaluation_kernel.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-goal-evaluation-kernel
          path: |
            minimal_goal_evaluation_kernel.log
            minimal_goal_evaluation_kernel_result.json
