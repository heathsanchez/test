name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Run living directed Level4 frontier closure
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/developmental_ls20_v28_living_directed_frontier.py | tee arc3_v28_living_directed_frontier.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-v28-living-directed-frontier
          path: |
            arc3_v28_living_directed_frontier.log
            arc3_developmental_v28_living_directed_frontier_result.json
