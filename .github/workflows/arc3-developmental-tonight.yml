name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Replay exact Level4 collision policy
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/developmental_ls20_v20b_collision_memory_genesis.py | tee arc3_v20b_collision_memory.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-v20b-collision-memory
          path: |
            arc3_v20b_collision_memory.log
            arc3_developmental_v20_collision_memory_result.json
