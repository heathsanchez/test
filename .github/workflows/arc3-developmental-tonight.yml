name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Probe whole-capability transfer into Level4
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/level4_whole_capability_transfer_probe.py | tee arc3_level4_whole_transfer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-level4-whole-transfer
          path: arc3_level4_whole_transfer.log
