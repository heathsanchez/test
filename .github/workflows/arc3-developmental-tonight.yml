name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Diagnose second Level4 collision
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/developmental_ls20_v24_second_collision_diagnosis.py | tee arc3_v24_second_collision.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-v24-second-collision
          path: |
            arc3_v24_second_collision.log
            arc3_developmental_v24_second_collision_result.json
