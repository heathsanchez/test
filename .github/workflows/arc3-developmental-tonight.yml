name: ARC3 developmental run
on:
  push:
    branches: [arc3-developmental-tonight]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC SDK
        run: python -m pip install --upgrade pip && pip install arc-agi
      - name: Run continuous self-optimizing ledger kernel
        shell: bash
        run: |
          set -o pipefail
          python experiments/arc3_tonight/developmental_ls20_v14_continuous_self_optimizer.py | tee arc3_v14_continuous_self_optimizer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-v14-continuous-self-optimizer
          path: |
            arc3_v14_continuous_self_optimizer.log
            arc3_developmental_v14_continuous_self_optimizer_result.json
