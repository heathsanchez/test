name: ARC400 Frame Development Operator V12

on:
  pull_request:
  workflow_dispatch:

jobs:
  frame-development:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ARC-AGI
        run: git clone --depth 1 https://github.com/fchollet/ARC-AGI.git ARC-AGI
      - name: Run constrained frame-development experiment
        run: |
          rm -rf results/arc400-frame-development-operator-v12
          mkdir -p results/arc400-frame-development-operator-v12
          python3 scripts/arc400_frame_development_operator_v12.py \
            --arc-root ARC-AGI \
            --out-dir results/arc400-frame-development-operator-v12 \
            --seed 1729
      - uses: actions/upload-artifact@v4
        with:
          name: arc400-frame-development-operator-v12
          path: results/arc400-frame-development-operator-v12/
