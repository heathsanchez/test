name: ARC400 Full Frozen Registry V7
on:
  pull_request:
  workflow_dispatch:
jobs:
  full-registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ARC-AGI
        run: git clone --depth 1 https://github.com/fchollet/ARC-AGI.git ARC-AGI
      - name: Run full frozen-registry certification
        run: |
          rm -rf results/arc400-full-registry-v7
          mkdir -p results/arc400-full-registry-v7
          python3 scripts/arc400_full_registry_v7.py \
            --arc-root ARC-AGI \
            --out-dir results/arc400-full-registry-v7 \
            --seed 1729
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc400-full-registry-v7
          path: results/arc400-full-registry-v7/
