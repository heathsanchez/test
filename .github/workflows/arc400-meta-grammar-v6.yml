name: ARC400 Meta Grammar V6
on:
  pull_request:
  workflow_dispatch:
jobs:
  meta-grammar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ARC-AGI
        run: git clone --depth 1 https://github.com/fchollet/ARC-AGI.git ARC-AGI
      - name: Run residual-driven grammar development
        run: |
          rm -rf results/arc400-meta-grammar-v6
          mkdir -p results/arc400-meta-grammar-v6
          python3 scripts/arc400_meta_grammar_development_v6.py \
            --arc-root ARC-AGI \
            --out-dir results/arc400-meta-grammar-v6 \
            --seed 1729 --max-refines 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc400-meta-grammar-v6
          path: results/arc400-meta-grammar-v6/
