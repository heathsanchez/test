name: ARC400 Meta Rule Synthesis V8
on:
  pull_request:
  workflow_dispatch:
jobs:
  meta-rule:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ARC-AGI
        run: git clone --depth 1 https://github.com/fchollet/ARC-AGI.git ARC-AGI
      - name: Synthesize and audit residual-to-constructor laws
        run: |
          rm -rf results/arc400-meta-rule-synthesis-v8
          mkdir -p results/arc400-meta-rule-synthesis-v8
          python3 scripts/arc400_meta_rule_synthesis_v8.py \
            --arc-root ARC-AGI \
            --out-dir results/arc400-meta-rule-synthesis-v8 \
            --seed 1729
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc400-meta-rule-synthesis-v8
          path: results/arc400-meta-rule-synthesis-v8/
