name: ARC400 Program Synthesis V5

on:
  push:
    branches: [arc50-developmental-test-20260821]
    paths:
      - '.github/workflows/arc400-program-synthesis-v5.yml'
      - 'scripts/arc400_program_synthesis_v5.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/arc400-program-synthesis-v5.yml'
      - 'scripts/arc400_program_synthesis_v5.py'
  workflow_dispatch:

jobs:
  synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ARC-AGI
        run: git clone --depth 1 https://github.com/fchollet/ARC-AGI.git ARC-AGI
      - name: Run lower-level program synthesis transfer test
        run: |
          rm -rf results/arc400-program-synthesis-v5
          mkdir -p results/arc400-program-synthesis-v5
          python3 scripts/arc400_program_synthesis_v5.py \
            --arc-root ARC-AGI \
            --out-dir results/arc400-program-synthesis-v5 \
            --seed 1729
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc400-program-synthesis-v5
          path: results/arc400-program-synthesis-v5/
