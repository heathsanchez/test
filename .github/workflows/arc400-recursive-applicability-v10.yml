name: ARC400 Recursive Applicability V10

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/arc400_recursive_applicability_v10.py'
      - '.github/workflows/arc400-recursive-applicability-v10.yml'

jobs:
  recursive-applicability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ARC-AGI
        run: git clone --depth 1 https://github.com/fchollet/ARC-AGI.git ARC-AGI
      - name: Learn applicability and recursively refine residual representation
        run: |
          rm -rf results/arc400-recursive-applicability-v10
          mkdir -p results/arc400-recursive-applicability-v10
          python3 scripts/arc400_recursive_applicability_v10.py \
            --arc-root ARC-AGI \
            --out-dir results/arc400-recursive-applicability-v10 \
            --seed 1729
      - uses: actions/upload-artifact@v4
        with:
          name: arc400-recursive-applicability-v10
          path: results/arc400-recursive-applicability-v10/
