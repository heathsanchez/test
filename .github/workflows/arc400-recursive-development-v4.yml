name: ARC400 Recursive Development V4

on:
  push:
    branches: [arc50-developmental-test-20260821]
    paths:
      - '.github/workflows/arc400-recursive-development-v4.yml'
      - 'scripts/arc400_recursive_development_v4.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/arc400-recursive-development-v4.yml'
      - 'scripts/arc400_recursive_development_v4.py'
  workflow_dispatch:

jobs:
  arc400-recursive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ARC-AGI
        run: git clone --depth 1 https://github.com/fchollet/ARC-AGI.git ARC-AGI
      - name: Run recursive developmental protocol
        run: |
          rm -rf results/arc400-recursive-v4
          mkdir -p results/arc400-recursive-v4
          python3 scripts/arc400_recursive_development_v4.py \
            --arc-root ARC-AGI \
            --out-dir results/arc400-recursive-v4 \
            --seed 1729 --max-refines 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc400-recursive-v4
          path: results/arc400-recursive-v4/
