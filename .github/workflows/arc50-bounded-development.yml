name: ARC50 Bounded Development

on:
  push:
    branches: [arc50-developmental-test-20260821]
    paths:
      - '.github/workflows/arc50-bounded-development.yml'
      - 'scripts/arc50_bounded_development.py'
      - 'scripts/arc50_developmental_v3.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/arc50-bounded-development.yml'
      - 'scripts/arc50_bounded_development.py'
      - 'scripts/arc50_developmental_v3.py'
  workflow_dispatch:

jobs:
  arc50:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ARC-AGI
        run: git clone --depth 1 https://github.com/fchollet/ARC-AGI.git ARC-AGI
      - name: Run smoke-gated frozen vs developmental 50-task protocol
        run: |
          rm -rf results/arc50-bounded-development
          mkdir -p results/arc50-bounded-development
          python3 scripts/arc50_developmental_v3.py \
            --arc-root ARC-AGI \
            --out-dir results/arc50-bounded-development \
            --n 50 --seed 1729
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc50-bounded-development
          path: results/arc50-bounded-development/
