name: V40 Eval case-boundary separator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arena-v40-eval-case-boundaries.yml'
  workflow_dispatch:

concurrency:
  group: v40-eval-case-boundaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ARENA_REV: aaa6aedd3a4f4de88bf825319a8a050e572c9cce
  KERNEL_REV: 3d7585c21242f29fdaa48ae9a16e16c6afe42238
  V39_DIAG_IR: '889136764415'

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}/contents/.run-status/v40.json"
          DATA=$(printf '{"run_id":%s,"job":"atlas","sha":"%s","ref":"%s","url":"https://github.com/%s/actions/runs/%s"}' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          CONTENT=$(printf '%s' "$DATA" | base64 -w0)
          OLD_SHA=$(gh api "$API" --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT "$API" -f message="Record V40 run $GITHUB_RUN_ID" -f content="$CONTENT" -f sha="$OLD_SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message="Record V40 run $GITHUB_RUN_ID" -f content="$CONTENT" >/dev/null
          fi
          echo "$DATA"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Callgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
          valgrind --version

      - name: Fetch frozen Arena and MathGraph source
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          git clone https://github.com/leanprover/lean-kernel-arena.git arena
          git -C arena checkout "$ARENA_REV"
          grep -q "$KERNEL_REV" arena/checkers/mathgraph.yaml

      - name: Build Mathlib workload
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: ./lka.py build-test mathlib

      - name: Materialize exact submitted MathGraph source
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          mkdir -p _build/checkers/mathgraph
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git _build/checkers/mathgraph/src
          git -C _build/checkers/mathgraph/src checkout "$KERNEL_REV"
          cat > _build/checkers/mathgraph/src/config.json <<'EOF'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 4
          }
          EOF
          ./lka.py build-test init-prelude

      - name: Apply frozen diagnostic case-boundary intervention
        run: python3 experiments/lean_kernel_arena/v40_patch.py

      - name: Build x86-64-v2 PGO diagnostic twin
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          SRC="$PWD/_build/checkers/mathgraph/src"
          ROOT="$PWD"
          cd "$SRC"
          rm -rf target-v40 pgo-v40
          mkdir -p pgo-v40
          export CARGO_TARGET_DIR="$SRC/target-v40"
          RUSTFLAGS="-C target-cpu=x86-64-v2 -C debuginfo=1 -Cprofile-generate=$SRC/pgo-v40" cargo build --release
          "$CARGO_TARGET_DIR/release/sokonanoda" config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
          llvm-profdata merge -o "$SRC/pgo-v40/merged.profdata" "$SRC/pgo-v40"
          rm -rf "$CARGO_TARGET_DIR"
          RUSTFLAGS="-C target-cpu=x86-64-v2 -C debuginfo=1 -Cprofile-use=$SRC/pgo-v40/merged.profdata" cargo build --release
          test -x "$CARGO_TARGET_DIR/release/sokonanoda"
          printf '%s\n' "$CARGO_TARGET_DIR/release/sokonanoda" > "$ROOT/../diag-bin-v40.txt"
          printf '%s\n' "$SRC/config.json" > "$ROOT/../diag-cfg-v40.txt"

      - name: Full Mathlib semantic equivalence gate
        run: |
          set -euxo pipefail
          BIN=$(cat diag-bin-v40.txt)
          CFG=$(cat diag-cfg-v40.txt)
          "$BIN" "$CFG" < arena/_build/tests/mathlib.ndjson > v40.stdout
          test $? -eq 0
          test ! -s v40.stdout

      - name: Profile full Mathlib with explicit case boundaries
        run: |
          set -euxo pipefail
          mkdir -p results/v40
          BIN=$(cat diag-bin-v40.txt)
          CFG=$(cat diag-cfg-v40.txt)
          valgrind --tool=callgrind --cache-sim=no --branch-sim=no --collect-jumps=no \
            --callgrind-out-file=results/v40/callgrind.out \
            "$BIN" "$CFG" < arena/_build/tests/mathlib.ndjson > /dev/null
          callgrind_annotate --inclusive=yes --threshold=0.00 results/v40/callgrind.out > results/v40/callgrind-inclusive.txt
          callgrind_annotate --inclusive=no --threshold=0.01 results/v40/callgrind.out > results/v40/callgrind-self.txt

      - name: Derive frozen V40 verdict
        run: python3 experiments/lean_kernel_arena/v40_verdict.py

      - uses: actions/upload-artifact@v4
        with:
          name: v40-eval-case-boundaries
          path: results/v40/
          if-no-files-found: error
