name: V40 Eval case-boundary separator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arena-v40-eval-case-boundaries.yml'
  workflow_dispatch:

concurrency:
  group: v40-eval-case-boundaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARENA_REV: aaa6aedd3a4f4de88bf825319a8a050e572c9cce
  KERNEL_REV: 3d7585c21242f29fdaa48ae9a16e16c6afe42238
  V39_DIAG_IR: '889136764415'

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Callgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
          valgrind --version
      - name: Fetch frozen Arena and MathGraph source
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          git clone https://github.com/leanprover/lean-kernel-arena.git arena
          git -C arena checkout "$ARENA_REV"
          grep -q "$KERNEL_REV" arena/checkers/mathgraph.yaml
      - name: Build Mathlib workload
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: ./lka.py build-test mathlib
      - name: Materialize exact submitted MathGraph source
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          mkdir -p _build/checkers/mathgraph
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git _build/checkers/mathgraph/src
          git -C _build/checkers/mathgraph/src checkout "$KERNEL_REV"
          cat > _build/checkers/mathgraph/src/config.json <<'EOF'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 4
          }
          EOF
          ./lka.py build-test init-prelude
      - name: Apply frozen diagnostic case-boundary intervention
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('arena/_build/checkers/mathgraph/src/src/eval.rs')
          s=p.read_text()

          anchor="const FAIL_DEPTH: u8 = 7;\n"
          wrappers=r'''

#[inline(never)]
fn v40_diag_app<R>(f: impl FnOnce() -> R) -> R { f() }
#[inline(never)]
fn v40_diag_var<R>(f: impl FnOnce() -> R) -> R { f() }
#[inline(never)]
fn v40_diag_sort<R>(f: impl FnOnce() -> R) -> R { f() }
#[inline(never)]
fn v40_diag_const<R>(f: impl FnOnce() -> R) -> R { f() }
#[inline(never)]
fn v40_diag_lambda<R>(f: impl FnOnce() -> R) -> R { f() }
#[inline(never)]
fn v40_diag_pi<R>(f: impl FnOnce() -> R) -> R { f() }
#[inline(never)]
fn v40_diag_let<R>(f: impl FnOnce() -> R) -> R { f() }
#[inline(never)]
fn v40_diag_proj<R>(f: impl FnOnce() -> R) -> R { f() }
#[inline(never)]
fn v40_diag_literal<R>(f: impl FnOnce() -> R) -> R { f() }
'''
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+wrappers)
          needle="    fn eval_no_cache(&mut self, depth: u32, env: E<'t>, e: ExprPtr<'t>) -> V<'t> {"
          assert s.count(needle)==1
          s=s.replace(needle,"    #[inline(never)]\n"+needle)
          start="        if let Expr::App { fun, arg, .. } = first {\n"
          end="            return self.apply(depth, f, a);\n        }\n        match first {\n"
          assert s.count(start)==1 and s.count(end)==1
          s=s.replace(start,start+"            return v40_diag_app(|| {\n",1)
          s=s.replace(end,"            self.apply(depth, f, a)\n            });\n        }\n        match first {\n",1)
          reps={
          '''            Expr::Var { dbj_idx, .. } => {\n                let v = env.lookup(dbj_idx).expect("eval: loose bvar");\n                self.force_thunk(depth, v)\n            }''': '''            Expr::Var { dbj_idx, .. } => v40_diag_var(|| {\n                let v = env.lookup(dbj_idx).expect("eval: loose bvar");\n                self.force_thunk(depth, v)\n            })''',
          '''            Expr::Sort { level, .. } => {\n                let level = match env.lsub() {\n                    Some(ls) => self.ctx.subst_level(level, ls.ks, ls.vs),\n                    None => level,\n                };\n                value::mk_sort(self.arena, self.ctx.simplify(level))\n            }''': '''            Expr::Sort { level, .. } => v40_diag_sort(|| {\n                let level = match env.lsub() {\n                    Some(ls) => self.ctx.subst_level(level, ls.ks, ls.vs),\n                    None => level,\n                };\n                value::mk_sort(self.arena, self.ctx.simplify(level))\n            })''',
          '''            Expr::Const { name, levels, .. } => {\n                let levels = match env.lsub() {\n                    Some(ls) => self.ctx.subst_levels(levels, ls.ks, ls.vs),\n                    None => levels,\n                };\n                self.eval_const(name, levels)\n            }''': '''            Expr::Const { name, levels, .. } => v40_diag_const(|| {\n                let levels = match env.lsub() {\n                    Some(ls) => self.ctx.subst_levels(levels, ls.ks, ls.vs),\n                    None => levels,\n                };\n                self.eval_const(name, levels)\n            })''',
          '''            Expr::Lambda { binder_name, binder_style, binder_type, body, .. } =>\n                value::mk_lam(self.arena, binder_name, binder_style, binder_type, Closure::mk_eval(env, body)),''': '''            Expr::Lambda { binder_name, binder_style, binder_type, body, .. } =>\n                v40_diag_lambda(|| value::mk_lam(self.arena, binder_name, binder_style, binder_type, Closure::mk_eval(env, body))),''',
          '''            Expr::Pi { binder_name, binder_style, binder_type, body, .. } => {\n                let dom = match self.ctx.read_expr_ref(binder_type) {\n                    Expr::Var { .. }\n                    | Expr::Sort { .. }\n                    | Expr::Const { .. }\n                    | Expr::NatLit { .. }\n                    | Expr::StringLit { .. } => self.eval(depth, env, binder_type),\n                    _ => self.mk_thunk_hc(env, binder_type),\n                };\n                value::mk_pi(self.arena, binder_name, binder_style, dom, Closure::mk_eval(env, body))\n            }''': '''            Expr::Pi { binder_name, binder_style, binder_type, body, .. } => v40_diag_pi(|| {\n                let dom = match self.ctx.read_expr_ref(binder_type) {\n                    Expr::Var { .. }\n                    | Expr::Sort { .. }\n                    | Expr::Const { .. }\n                    | Expr::NatLit { .. }\n                    | Expr::StringLit { .. } => self.eval(depth, env, binder_type),\n                    _ => self.mk_thunk_hc(env, binder_type),\n                };\n                value::mk_pi(self.arena, binder_name, binder_style, dom, Closure::mk_eval(env, body))\n            })''',
          '''            Expr::Let { .. } => {\n                let mut env = env;\n                let mut cursor = e;\n                while let Expr::Let { data: &crate::expr::LetData { val, body, .. }, .. } = self.ctx.read_expr(cursor) {\n                    let vv = self.eval(depth, env, val);\n                    env = value::env_extend(self.arena, env, vv);\n                    cursor = body;\n                }\n                self.eval(depth, env, cursor)\n            }''': '''            Expr::Let { .. } => v40_diag_let(|| {\n                let mut env = env;\n                let mut cursor = e;\n                while let Expr::Let { data: &crate::expr::LetData { val, body, .. }, .. } = self.ctx.read_expr(cursor) {\n                    let vv = self.eval(depth, env, val);\n                    env = value::env_extend(self.arena, env, vv);\n                    cursor = body;\n                }\n                self.eval(depth, env, cursor)\n            })''',
          '''            Expr::Proj { ty_name, idx, structure, .. } => {\n                let vs = self.eval(depth, env, structure);\n                self.do_proj(depth, ty_name, idx, vs)\n            }''': '''            Expr::Proj { ty_name, idx, structure, .. } => v40_diag_proj(|| {\n                let vs = self.eval(depth, env, structure);\n                self.do_proj(depth, ty_name, idx, vs)\n            })''',
          '''            Expr::NatLit { ptr, .. } => value::mk_natlit(self.arena, ptr),\n            Expr::StringLit { ptr, .. } => value::mk_strlit(self.arena, ptr),''': '''            Expr::NatLit { ptr, .. } => v40_diag_literal(|| value::mk_natlit(self.arena, ptr)),\n            Expr::StringLit { ptr, .. } => v40_diag_literal(|| value::mk_strlit(self.arena, ptr)),'''
          }
          for a,b in reps.items():
              if s.count(a)!=1:
                  raise SystemExit(f'PATCH_MISS count={s.count(a)} fragment={a[:80]!r}')
              s=s.replace(a,b,1)
          p.write_text(s)
          print('V40 patch applied: explicit noinline case boundaries; semantics intended unchanged')
          PY
      - name: Build x86-64-v2 PGO diagnostic twin
        working-directory: arena
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          SRC="$PWD/_build/checkers/mathgraph/src"
          ROOT="$PWD"
          cd "$SRC"
          rm -rf target-v40 pgo-v40
          mkdir -p pgo-v40
          export CARGO_TARGET_DIR="$SRC/target-v40"
          RUSTFLAGS="-C target-cpu=x86-64-v2 -C debuginfo=1 -Cprofile-generate=$SRC/pgo-v40" cargo build --release
          "$CARGO_TARGET_DIR/release/sokonanoda" config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
          llvm-profdata merge -o "$SRC/pgo-v40/merged.profdata" "$SRC/pgo-v40"
          rm -rf "$CARGO_TARGET_DIR"
          RUSTFLAGS="-C target-cpu=x86-64-v2 -C debuginfo=1 -Cprofile-use=$SRC/pgo-v40/merged.profdata" cargo build --release
          test -x "$CARGO_TARGET_DIR/release/sokonanoda"
          printf '%s\n' "$CARGO_TARGET_DIR/release/sokonanoda" > "$ROOT/../diag-bin-v40.txt"
          printf '%s\n' "$SRC/config.json" > "$ROOT/../diag-cfg-v40.txt"
      - name: Full Mathlib semantic equivalence gate
        run: |
          set -euxo pipefail
          BIN=$(cat diag-bin-v40.txt)
          CFG=$(cat diag-cfg-v40.txt)
          "$BIN" "$CFG" < arena/_build/tests/mathlib.ndjson > v40.stdout
          test $? -eq 0
          test ! -s v40.stdout
      - name: Profile full Mathlib with explicit case boundaries
        run: |
          set -euxo pipefail
          mkdir -p results/v40
          BIN=$(cat diag-bin-v40.txt)
          CFG=$(cat diag-cfg-v40.txt)
          valgrind --tool=callgrind --cache-sim=no --branch-sim=no --collect-jumps=no \
            --callgrind-out-file=results/v40/callgrind.out \
            "$BIN" "$CFG" < arena/_build/tests/mathlib.ndjson > /dev/null
          callgrind_annotate --inclusive=yes --threshold=0.00 results/v40/callgrind.out > results/v40/callgrind-inclusive.txt
          callgrind_annotate --inclusive=no --threshold=0.01 results/v40/callgrind.out > results/v40/callgrind-self.txt
      - name: Derive frozen V40 verdict
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          selftxt=Path('results/v40/callgrind-self.txt').read_text(errors='replace')
          m=re.search(r'^\s*([0-9,]+)\s+\(100\.0%\)\s+PROGRAM TOTALS',selftxt,re.M)
          if not m: raise SystemExit('NO_PROGRAM_TOTALS')
          total=int(m.group(1).replace(',',''))
          baseline=int(os.environ['V39_DIAG_IR'])
          perturb=100*(total-baseline)/baseline
          perturb_ok=abs(perturb)<=3.0
          txt=Path('results/v40/callgrind-inclusive.txt').read_text(errors='replace')
          names=['app','var','sort','const','lambda','pi','let','proj','literal']
          rows={}
          for name in names:
              pat=re.compile(r'^\s*([0-9,]+)\s+\([^\n]*\)\s+.*v40_diag_'+name+r'[^\n]*$',re.M)
              vals=[int(x.replace(',','')) for x in pat.findall(txt)]
              if vals:
                  v=max(vals)
                  rows[name]={'inclusive_ir':v,'whole_pct':100*v/total}
          material={k:v for k,v in rows.items() if v['whole_pct']>=0.5}
          observable=len(rows)>=5 and bool(material)
          if observable and perturb_ok:
              verdict='CASE_BOUNDARIES_OBSERVED'
              nxt='rank case families by whole-Mathlib mass; freeze smallest A/B intervention only for a case with plausible >=5% whole-program opportunity'
          elif observable:
              verdict='CASE_BOUNDARIES_OBSERVED_BUT_PERTURBED'
              nxt='use ranking qualitatively only; build lower-overhead boundary mechanism before intervention'
          else:
              verdict='CASE_BOUNDARIES_STILL_HIDDEN'
              nxt='stop Callgrind boundary attempts; use explicit counters plus controlled per-case exclusion/sham measurements'
          out={'verdict':verdict,'program_total_ir':total,'v39_baseline_ir':baseline,
               'perturbation_pct':perturb,'perturbation_ok':perturb_ok,
               'inclusive_case_rows':rows,'material_cases_ge_0_5pct':material,'frozen_next':nxt}
          Path('results/v40/verdict.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v40-eval-case-boundaries
          path: results/v40/
          if-no-files-found: error
