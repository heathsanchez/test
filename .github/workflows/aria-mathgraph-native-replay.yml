name: MathGraph Check - independent native receipt replay

on:
  push:
    branches:
      - aria-mathgraph-check-native-receipt-replay-20261014
    paths:
      - 'research/aria_scaling_trust/**'
      - '.github/workflows/aria-mathgraph-native-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original fixture parser dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Download exact retained original GitHub Actions archives
        shell: bash
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest=research/aria_scaling_trust
          for id in 11862929149 11864308701; do
            curl --fail --location --retry 3 --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_READ_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/heathsanchez/test/actions/artifacts/${id}/zip" \
              -o "${dest}/mathgraph_native_${id}.zip"
          done
          sha256sum "${dest}"/mathgraph_native_*.zip
      - name: Independently rerun original source-native regressions and mutation controls
        shell: bash
        run: |
          set -euo pipefail
          python research/aria_scaling_trust/native_bridge_replay.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/aria_scaling_trust/mathgraph_check_native_bridge_replay_result.json')
          r = json.loads(p.read_text())
          assert len(r['native_replays']) == 4
          assert len(r['adversarial_rejections']) == 10
          assert r['independent_consumer_status'] == 'WARRANTED_BOUNDED_OFFLINE_HISTORICAL_COUNTERFACTUAL'
          assert r['action_authorization'] == 'NONE'
          assert r['customer_adoption'] == 'UNKNOWN'
          assert r['source_revision_current_freshness'] == 'NOT_CHECKED'
          print('REQUALIFIED_EXACT_HISTORICAL_BOUNDARY; NO_LIVE_APP_OR_CUSTOMER_CLAIM')
          PY
      - name: Preserve bounded qualification report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aria-mathgraph-native-receipt-replay
          path: research/aria_scaling_trust/mathgraph_check_native_bridge_replay_result.json
          retention-days: 30
