name: Behavioral Floor V46 Prefreeze

on:
  push:
    branches:
      - behavioral-floor-v46
  workflow_dispatch:

jobs:
  prefreeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          python -m py_compile             experiments/behavioral_floor_v46/basis.py             experiments/behavioral_floor_v46/kernel.py

      - name: Behavioral-floor smoke
        working-directory: experiments/behavioral_floor_v46
        run: |
          python - <<'PY'
          from itertools import product
          from basis import Trace, World
          from kernel import Kernel

          def words(a,d):
              out=[()]
              for n in range(1,d+1):
                  out.extend(product(range(a),repeat=n))
              return out

          def make_world():
              # Two-state parity process hidden from the kernel.
              trans=((1,0,0),(0,1,1))
              out=(0,1)
              def consequence(seq):
                  s=0
                  for token in seq:
                      s=trans[s][token]
                  return out[s]
              traces=tuple(
                  Trace(tuple(h),consequence(h))
                  for h in words(3,8)
              )
              return World("smoke",3,4,4,traces,True)

          r=Kernel().synthesize(make_world())
          print(r)
          assert r["status"]=="VERIFIED"
          assert r["floor_future_depth"]==0
          assert r["state_count"]==2
          assert r["token_class_count"]==2
          assert sorted(sorted(c) for c in r["token_classes"])==[[0],[1,2]]
          assert r["pairwise_distinguishability_complete"] is True
          PY
