name: Yeast reference encoding exposed calibration
on:
  push:
    branches: ['research/biology-2021-consensus-encoding-calibration-20261020']
    paths: 
      - research/biology_2021_consensus_encoding/**
      - .github/workflows/biology-2021-consensus-encoding.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exposed-native-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'openpyxl==3.1.5'
      - run: python research/biology_2021_consensus_encoding/calibrate.py
