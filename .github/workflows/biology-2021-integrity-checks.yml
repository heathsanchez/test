name: Biology 2021 integrity checks
on:
  push:
    branches:
      - research/biology-environment-v3-20261020
    paths:
      - '.github/workflows/biology-2021-integrity-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'openpyxl==3.1.5' 'numpy==2.1.3' 'scikit-learn==1.6.1'
      - run: cd research/biology_environment_v3 && python test_protocol.py
