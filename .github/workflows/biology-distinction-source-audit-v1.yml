name: Independent yeast V1a source audit
on:
  push:
    branches: [research/biology-distinction-audit-v1-20261019]
    paths:
      - 'research/biology_operational_distinction_audit_v1/**'
      - '.github/workflows/biology-distinction-source-audit-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent numpy pinned
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3'
      - name: Fetch immutable original V1a evidence receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/yeast-first-receipt
          gh run download 39218737278 --repo heathsanchez/test --name biology-operational-distinction-v1-receipt --dir /tmp/yeast-first-receipt
          sha256sum /tmp/yeast-first-receipt/sealed_predictions.json
      - name: Independent source parser, separation, and representation audit
        run: |
          python research/biology_operational_distinction_audit_v1/independent_source_audit.py \
            --receipts /tmp/yeast-first-receipt --out out/biology_source_audit_v1
      - name: Retain audited receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeast-source-independent-audit-v1
          path: out/biology_source_audit_v1/source_audit.json
          if-no-files-found: warn