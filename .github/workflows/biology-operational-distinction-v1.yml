name: Frozen yeast operational distinction V1
on:
  push:
    branches:
      - research/biology-operational-distinction-v1-20261019
    paths:
      - 'research/biology_operational_distinction_v1/**'
      - '.github/workflows/biology-operational-distinction-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-data-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stable scientific packages
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3' 'scikit-learn==1.6.1'
      - name: Frozen source-bound yeast assay
        run: python research/biology_operational_distinction_v1/experiment.py --output out/biology_operational_distinction_v1 --cache data/biology_operational_distinction_v1
      - name: Retain authentic selection and outcome receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biology-operational-distinction-v1-receipt
          path: out/biology_operational_distinction_v1/
          if-no-files-found: warn