name: Branch Conditioned Grain Dynamics V29
on:
  push:
    branches: [branch-conditioned-grain-dynamics-v29]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify frozen V29 core
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=6e4529b21e8ddc420d4069e807865bb9a1b0b10e
          git merge-base --is-ancestor "$FREEZE" HEAD
          git diff --exit-code "$FREEZE" HEAD --             experiments/branch_conditioned_grain_dynamics_v29/PROTOCOL.md             experiments/branch_conditioned_grain_dynamics_v29/basis.py             experiments/branch_conditioned_grain_dynamics_v29/kernel.py
      - name: Syntax
        run: python -m py_compile experiments/branch_conditioned_grain_dynamics_v29/{basis.py,kernel.py,challenge_pack.py,run.py}
      - name: Run V29
        shell: bash
        run: |
          set -o pipefail
          cd experiments/branch_conditioned_grain_dynamics_v29
          python -u run.py 2>&1 | tee run.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          cd experiments/branch_conditioned_grain_dynamics_v29
          test -f evidence.json
          python - <<'PY'
          import json
          e=json.load(open("evidence.json"))
          print("VERDICT",e["verdict"]); print("FULL_PASS",e["full_pass"])
          for k,v in e["gates"].items(): print(f"GATE {k}={v}")
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-conditioned-grain-dynamics-v29-evidence
          path: |
            experiments/branch_conditioned_grain_dynamics_v29/evidence.json
            experiments/branch_conditioned_grain_dynamics_v29/run.log
            experiments/branch_conditioned_grain_dynamics_v29/FREEZE.json
            experiments/branch_conditioned_grain_dynamics_v29/PROTOCOL.md
          if-no-files-found: error
