name: Chollet composed G observation probe
on:
  push:
    branches: [chollet-verified-compose-e-f-g-v1]
    paths:
      - ".github/workflows/chollet_compounding_g_probe.yml"
  workflow_dispatch:
jobs:
  inspect-order-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Start pinned WebArena shopping-admin fixture
        run: |
          set -euo pipefail
          git clone https://github.com/ServiceNow/webarena-verified.git upstream
          (cd upstream && git checkout 6473f72db5dcefc97b5725b59e734504edc28a21)
          docker pull am1n3e/webarena-verified-shopping_admin
          docker run -d --name wa-admin -p 7780:80 am1n3e/webarena-verified-shopping_admin
          for i in $(seq 1 150); do
            s=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:7780/admin || true)
            if [ "$s" = 200 ] || [ "$s" = 302 ]; then break; fi
            sleep 2
          done
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install browser
        run: |
          python -m pip install playwright
          playwright install --with-deps chromium
      - name: Inspect generic order-view representation without evaluator labels
        run: |
          mkdir -p artifacts/compose_g_probe
          python - <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from playwright.async_api import async_playwright
          import sys
          sys.path.insert(0,"scripts")
          from webarena_customer_count_representation_synth import live_table,expose_customer_email,advance,clean,status_class
          async def go():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              ctx=await browser.new_context(extra_http_headers={"X-M2-Admin-Auto-Login":"admin:admin1234"})
              page=await ctx.new_page()
              await page.goto("http://localhost:7780/admin/sales/order/",wait_until="networkidle",timeout=120000)
              await expose_customer_email(page)
              table,headers=await live_table(page)
              rows=table.locator("tbody tr")
              preview=[]
              for i in range(min(await rows.count(),20)):
                row=rows.nth(i)
                cells=row.locator("td")
                ix={k:headers.index(next(h for h in headers if h.lower()==k)) for k in ("id","status","customer email")}
                vals={k:clean(await cells.nth(j).inner_text()) for k,j in ix.items()}
                links=await row.locator("a[href]").evaluate_all("(els)=>els.map(x=>({text:x.innerText,href:x.href}))")
                preview.append({"id":vals["id"],"status":vals["status"],"email":vals["customer email"],"links":links[:6],"html_excerpt":(await row.inner_html())[:350]})
              (Path("artifacts/compose_g_probe")/"grid_preview.json").write_text(json.dumps({"headers":headers,"rows":preview},indent=2))
              sample=next((r for r in preview if status_class(r["status"])=="cancelled"),preview[0])
              links=[v["href"] for v in sample["links"] if "/sales/order/view/" in v["href"]]
              urls=links+["http://localhost:7780/admin/sales/order/view/order_id/"+re.sub(r"\D","",sample["id"])+"/"]
              detail=[]
              for url in urls:
                try:
                  rsp=await page.goto(url,wait_until="networkidle",timeout=90000)
                  body=(await page.locator("body").inner_text())[:11000]
                  details={"url":url,"status":rsp.status if rsp else None,"landed":page.url,"table_count":await page.locator("table").count(),"tables":[],"body":body}
                  for j in range(min(await page.locator("table").count(),12)):
                    tab=page.locator("table").nth(j)
                    details["tables"].append({"cls":await tab.get_attribute("class"),"text":(await tab.inner_text())[:2200],"html":(await tab.inner_html())[:1000]})
                  detail.append(details)
                except Exception as e:
                  detail.append({"url":url,"error":repr(e)})
              (Path("artifacts/compose_g_probe")/"detail_preview.json").write_text(json.dumps(detail,indent=2))
              print(json.dumps({"headers":headers,"sample_id":sample["id"],"sample_status":sample["status"],"links":sample["links"],"detail_summary":[{"url":d["url"],"status":d.get("status"),"landed":d.get("landed"),"tables":[{"cls":t["cls"],"text":t["text"][:300]} for t in d.get("tables",[])]} for d in detail]},indent=2))
              await browser.close()
          asyncio.run(go())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-g-probe
          path: artifacts/compose_g_probe
