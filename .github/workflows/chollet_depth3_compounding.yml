name: Chollet depth-3 verifier compounding

on:
  workflow_dispatch:
  push:
    branches: [chollet-depth3-compounding-v5]
    paths:
      - ".github/workflows/chollet_depth3_compounding.yml"

jobs:
  depth3:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      UPSTREAM_SHA: 6473f72db5dcefc97b5725b59e734504edc28a21
      A_RUN: "37567480458"
      A_FREEZE: "ea0c264a1d2b5e2001cdd32fa5904cce9ded87dc50797805e6f192e2f87d9f2e"
      A_CODE: "135be75255d17c6de537c1f5e6d1a214b62626d636a928370470ae3180591314"
      B_RUN: "37580930811"
      B_FREEZE: "3f2a9c420aa16db713f200da5e9e85435c1dec0878e41bfef748c32ee543ff56"
      B_CODE: "68e3df4741726f45c9fcf8f29b084325d3dbbf46cc1b44ff6cda14fae120d5df"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen A and B code
        run: |
          ROOT=artifacts/chollet_depth3
          mkdir -p "$ROOT"
          test "$(sha256sum scripts/webarena_multibit_verifier_transfer.py | awk '{print $1}')" = "$A_CODE"
          test "$(sha256sum scripts/webarena_shopping_admin_review_counts.py | awk '{print $1}')" = "$B_CODE"
          cat > "$ROOT/prior_authorities.json" <<JSON
          {
            "A":{"run":$A_RUN,"freeze":"$A_FREEZE","training_replayed":false},
            "B":{"run":$B_RUN,"freeze":"$B_FREEZE","training_replayed":false}
          }
          JSON

      - name: Checkout pinned evaluator authority
        run: |
          git clone https://github.com/ServiceNow/webarena-verified.git upstream
          cd upstream
          git checkout "$UPSTREAM_SHA"

      - name: Start Shopping Admin and Shopping
        run: |
          ROOT=artifacts/chollet_depth3
          docker pull am1n3e/webarena-verified-shopping_admin
          docker pull am1n3e/webarena-verified-shopping
          docker image inspect am1n3e/webarena-verified-shopping_admin --format '{{index .RepoDigests 0}}' > "$ROOT/admin_image_digest.txt"
          docker image inspect am1n3e/webarena-verified-shopping --format '{{index .RepoDigests 0}}' > "$ROOT/shopping_image_digest.txt"
          docker run -d --name wa-admin -p 7780:80 am1n3e/webarena-verified-shopping_admin
          docker run -d --name wa-shopping -p 7770:80 am1n3e/webarena-verified-shopping
          for i in $(seq 1 120); do
            a=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:7780/admin || true)
            s=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:7770 || true)
            if { [ "$a" = "200" ] || [ "$a" = "302" ]; } && { [ "$s" = "200" ] || [ "$s" = "302" ]; }; then exit 0; fi
            sleep 2
          done
          docker logs wa-admin || true
          docker logs wa-shopping || true
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install evaluator and browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./upstream[examples]" playwright
          playwright install --with-deps chromium

      - name: Prepare candidate-facing no-answer corpus
        run: |
          ROOT=artifacts/chollet_depth3
          cp upstream/assets/dataset/webarena-verified.json "$ROOT/full_authority.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/chollet_depth3")
          tasks=json.loads((root/"full_authority.json").read_text())
          stripped=[{k:v for k,v in t.items() if k not in {"eval","reference_url"}} for t in tasks]
          (root/"full_no_eval.json").write_text(json.dumps(stripped,indent=2)+"\n")
          split={
            "A":{"training_task":193,"replayed":False,"preservation":[194,195,196,197]},
            "B":{"training_tasks":[11,348],"replayed":False,"preservation":[12,13,14,15,344,345,346,347]},
            "C":{"training_task":163,"held_out":[164,165,166,167],"policies":["semantic_low_star_extraction","always_not_found"]},
            "candidate_task_file_contains_eval":False
          }
          (root/"depth3_split.json").write_text(json.dumps(split,indent=2)+"\n")
          print(json.dumps(split,indent=2))
          PY
          cat > "$ROOT/config.json" <<'JSON'
          {
            "environments": {
              "__SHOPPING_ADMIN__":{"urls":["http://localhost:7780/admin"],"active_url_idx":0},
              "__SHOPPING__":{"urls":["http://localhost:7770"],"active_url_idx":0}
            }
          }
          JSON
          sha256sum scripts/webarena_shopping_low_reviews.py > "$ROOT/c_code.sha256"

      - name: Generate C training candidates
        run: |
          ROOT=artifacts/chollet_depth3
          python scripts/webarena_shopping_low_reviews.py             --task-id 163 --task-file "$ROOT/full_no_eval.json"             --base-url http://localhost:7770 --output-dir "$ROOT/c_train/semantic"
          mkdir -p "$ROOT/c_train/not_found/163"
          cat > "$ROOT/c_train/not_found/163/agent_response.json" <<'JSON'
          {"task_type":"RETRIEVE","status":"NOT_FOUND_ERROR","retrieved_data":null,"error_details":null}
          JSON

      - name: Select and freeze C from task 163 only
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from webarena_verified.api import WebArenaVerified
          from webarena_verified.types.config import WebArenaVerifiedConfig
          from webarena_verified.types.tracing import NetworkTrace
          root=Path("artifacts/chollet_depth3")
          wa=WebArenaVerified(config=WebArenaVerifiedConfig.from_file(root/"config.json"))
          empty=NetworkTrace.model_construct(is_playwright=False,src_file=Path("<no-network-evaluator>"),events=())
          results={}
          passing=[]
          for policy,folder in (("semantic_low_star_extraction","semantic"),("always_not_found","not_found")):
              p=root/"c_train"/folder/"163"/"agent_response.json"
              r=wa.evaluate_task(task_id=163,agent_response=p,network_trace=empty)
              d=r.model_dump(mode="json",exclude_none=True)
              (p.parent/"eval_result.json").write_text(json.dumps(d,indent=2)+"\n")
              row={"score":float(r.score),"status":r.status.value}
              results[policy]=row
              if row["score"]==1.0 and row["status"]=="success":
                  passing.append(policy)
          assert passing==["semantic_low_star_extraction"], {"passing":passing,"results":results}
          frozen={
            "epistemic_state":"CANDIDATE_FROZEN_AFTER_C_TRAINING",
            "A_training_replayed":False,
            "B_training_replayed":False,
            "C_training_task":163,
            "C_selected_policy":passing[0],
            "C_training_results":results,
            "C_code_sha256":(root/"c_code.sha256").read_text().split()[0],
            "held_out_answers_observed_before_C_freeze":False
          }
          frozen["C_freeze_sha256"]=hashlib.sha256(json.dumps(frozen,sort_keys=True).encode()).hexdigest()
          (root/"capability_c_frozen.json").write_text(json.dumps(frozen,indent=2)+"\n")
          print(json.dumps(frozen,indent=2))
          PY

      - name: Execute frozen C and baseline on untouched siblings
        run: |
          ROOT=artifacts/chollet_depth3
          for id in 164 165 166 167; do
            python scripts/webarena_shopping_low_reviews.py               --task-id "$id" --task-file "$ROOT/full_no_eval.json"               --base-url http://localhost:7770 --output-dir "$ROOT/c_heldout/selected"
            mkdir -p "$ROOT/c_heldout/baseline_not_found/$id"
            cat > "$ROOT/c_heldout/baseline_not_found/$id/agent_response.json" <<'JSON'
          {"task_type":"RETRIEVE","status":"NOT_FOUND_ERROR","retrieved_data":null,"error_details":null}
          JSON
          done

      - name: Reclose frozen B after C without B training
        run: |
          ROOT=artifacts/chollet_depth3
          for id in 12 13 14 15 344 345 346 347; do
            python scripts/webarena_shopping_admin_review_counts.py               --task-id "$id" --task-file "$ROOT/full_no_eval.json"               --base-url http://localhost:7780/admin --output-dir "$ROOT/b_preservation"
          done

      - name: Reclose frozen A after C without A training
        run: |
          ROOT=artifacts/chollet_depth3
          python scripts/webarena_multibit_verifier_transfer.py observe             --base-url http://localhost:7780/admin --output "$ROOT/a_snapshot.json"
          for id in 194 195 196 197; do
            python scripts/webarena_multibit_verifier_transfer.py compute               --snapshot "$ROOT/a_snapshot.json"               --task-id "$id" --task-file "$ROOT/full_no_eval.json"               --recency newest --status-binding semantic --aggregation sum               --output-dir "$ROOT/a_preservation"
          done

      - name: Qualify depth-3 compounding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from webarena_verified.api import WebArenaVerified
          from webarena_verified.types.config import WebArenaVerifiedConfig
          from webarena_verified.types.tracing import NetworkTrace
          root=Path("artifacts/chollet_depth3")
          c_frozen=json.loads((root/"capability_c_frozen.json").read_text())
          wa=WebArenaVerified(config=WebArenaVerifiedConfig.from_file(root/"config.json"))
          empty=NetworkTrace.model_construct(is_playwright=False,src_file=Path("<no-network-evaluator>"),events=())

          def score(base, ids):
              results={}
              for task_id in ids:
                  p=base/str(task_id)/"agent_response.json"
                  r=wa.evaluate_task(task_id=task_id,agent_response=p,network_trace=empty)
                  d=r.model_dump(mode="json",exclude_none=True)
                  (p.parent/"eval_result.json").write_text(json.dumps(d,indent=2)+"\n")
                  results[str(task_id)]={"score":float(r.score),"status":r.status.value}
              return {"results":results,"success_count":sum(v["score"]==1.0 and v["status"]=="success" for v in results.values())}

          A=score(root/"a_preservation",(194,195,196,197))
          B=score(root/"b_preservation",(12,13,14,15,344,345,346,347))
          C=score(root/"c_heldout"/"selected",(164,165,166,167))
          C0=score(root/"c_heldout"/"baseline_not_found",(164,165,166,167))

          a_contracts={}
          for task_id in (194,195,196,197):
              ev=json.loads((root/"a_preservation"/str(task_id)/"candidate_evidence.json").read_text())
              a_contracts[str(task_id)]=ev["protected_response_shape_contract"]
          a_contracts_green=all(x["passes"] for x in a_contracts.values())

          seal={
            "epistemic_state":"WARRANTED_BOUNDED" if (
              A["success_count"]==4 and B["success_count"]==8 and C["success_count"]==4
              and C0["success_count"]<4 and a_contracts_green
            ) else "REJECTED",
            "experiment":"depth-3 sequential verifier-selected capability compounding across two web environments",
            "upstream_commit":"6473f72db5dcefc97b5725b59e734504edc28a21",
            "A":{"authority_run":37567480458,"training_replayed":False,"preservation":A},
            "B":{"authority_run":37580930811,"training_replayed":False,"preservation":B},
            "C":{
              "training_task":163,
              "selected_policy":c_frozen["C_selected_policy"],
              "freeze_sha256":c_frozen["C_freeze_sha256"],
              "held_out":C,
              "baseline_not_found":C0
            },
            "combined_post_C_success_count":A["success_count"]+B["success_count"]+C["success_count"],
            "combined_post_C_task_count":16,
            "claims":{
              "depth3_sequential_verifier_compounding_outside_math_code":{
                "state":"WARRANTED_BOUNDED" if (
                  A["success_count"]==4 and B["success_count"]==8 and C["success_count"]==4 and C0["success_count"]<4
                ) else "REJECTED",
                "boundary":"A payment semantics -> B review-filter semantics -> C Shopping low-star semantics"
              },
              "open_ended_nonmath_scaling":{
                "state":"UNKNOWN",
                "boundary":"three bounded acquisitions still do not establish arbitrary-depth growth"
              }
            }
          }
          (root/"depth3_result.json").write_text(json.dumps(seal,indent=2)+"\n")
          print(json.dumps(seal,indent=2))
          assert A["success_count"]==4, seal
          assert B["success_count"]==8, seal
          assert C["success_count"]==4, seal
          assert C0["success_count"]<4, seal
          assert a_contracts_green, seal
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chollet-depth3-verifier-compounding
          path: artifacts/chollet_depth3
