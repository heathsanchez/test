name: Chollet depth5 qualification
on:
  push:
    branches: [chollet-depth5-representation-fix-v8]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone https://github.com/ServiceNow/webarena-verified.git upstream && cd upstream && git checkout 6473f72db5dcefc97b5725b59e734504edc28a21
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "./upstream[examples]"
      - name: Recover preserved artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/heathsanchez/test/actions/artifacts/11467013627/zip > /tmp/depth5.zip
          mkdir -p artifacts/chollet_depth5
          unzip -o /tmp/depth5.zip -d artifacts/chollet_depth5
      - run: python scripts/qualify_depth5_preserved_artifact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chollet-depth5-qualified
          path: artifacts/chollet_depth5
