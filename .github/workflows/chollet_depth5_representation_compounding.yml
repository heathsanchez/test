name: Chollet depth5 representation compounding
on:
  workflow_dispatch:
  push:
    branches: [chollet-representation-invention-v7]
    paths: [".github/workflows/chollet_depth5_representation_compounding.yml"]
jobs:
  reclose:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify frozen lineage
        run: |
          mkdir -p artifacts/chollet_depth5
          test "$(sha256sum scripts/webarena_multibit_verifier_transfer.py | awk '{print $1}')" = "135be75255d17c6de537c1f5e6d1a214b62626d636a928370470ae3180591314"
          test "$(sha256sum scripts/webarena_shopping_admin_review_counts.py | awk '{print $1}')" = "68e3df4741726f45c9fcf8f29b084325d3dbbf46cc1b44ff6cda14fae120d5df"
          test "$(sha256sum scripts/webarena_shopping_low_reviews.py | awk '{print $1}')" = "21336c9036db67603ed4b809bcff8aebcecdf7663b223c0b049611de2d063a61"
          git diff --exit-code 94116303cf81aae92251cf8caa588bc084d104dd -- scripts/webarena_gitlab_star_relation_synth.py
          git diff --exit-code ae877cefddc2e2335805c396a8bf1f88a4063b94 -- scripts/webarena_customer_count_representation_synth.py
          cat > artifacts/chollet_depth5/lineage.json <<'JSON'
          {
            "A":{"run":37567480458,"training_replayed":false},
            "B":{"run":37580930811,"training_replayed":false},
            "C":{"run":37581305395,"training_replayed":false},
            "D":{"run":37585043969,"freeze":"1f7ab62c923a28748d653f138511876cc70fcc561453a7e2dd028a37f8e38ab5","training_replayed":false},
            "E":{"run":37587112851,"freeze":"66930dc2ea50b944564c46e12d531b6daca8d609cb2495b21152078a3c87267d","training_replayed":false}
          }
          JSON
      - run: |
          git clone https://github.com/ServiceNow/webarena-verified.git upstream
          cd upstream && git checkout 6473f72db5dcefc97b5725b59e734504edc28a21
      - name: Start all environments
        run: |
          docker pull am1n3e/webarena-verified-shopping_admin
          docker pull am1n3e/webarena-verified-shopping
          docker pull am1n3e/webarena-verified-gitlab
          docker run -d --name wa-admin -p 7780:80 am1n3e/webarena-verified-shopping_admin
          docker run -d --name wa-shopping -p 7770:80 am1n3e/webarena-verified-shopping
          docker run -d --name wa-gitlab -p 8023:8023 am1n3e/webarena-verified-gitlab
          for i in $(seq 1 240); do
            a=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:7780/admin || true)
            s=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:7770 || true)
            g=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8023/users/sign_in || true)
            if { [ "$a" = "200" ] || [ "$a" = "302" ]; } && { [ "$s" = "200" ] || [ "$s" = "302" ]; } && [ "$g" = "200" ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "./upstream[examples]" playwright
          playwright install --with-deps chromium
      - name: Prepare no-answer corpus
        run: |
          ROOT=artifacts/chollet_depth5
          cp upstream/assets/dataset/webarena-verified.json "$ROOT/full_authority.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("artifacts/chollet_depth5")
          t=json.loads((r/"full_authority.json").read_text())
          (r/"full_no_eval.json").write_text(json.dumps([{k:v for k,v in x.items() if k not in {"eval","reference_url"}} for x in t],indent=2)+"\n")
          PY
          cat > "$ROOT/config.json" <<'JSON'
          {"environments":{"__SHOPPING_ADMIN__":{"urls":["http://localhost:7780/admin"],"active_url_idx":0},"__SHOPPING__":{"urls":["http://localhost:7770"],"active_url_idx":0},"__GITLAB__":{"urls":["http://localhost:8023"],"active_url_idx":0}}}
          JSON
      - name: Reclose E without task63
        run: |
          ROOT=artifacts/chollet_depth5
          python scripts/webarena_customer_count_representation_synth.py observe --base-url http://localhost:7780/admin --output "$ROOT/e_obs.json"
          cat > "$ROOT/e_rep.json" <<'JSON'
          {"representation_type":"grouped_row_count","group_key":"customer email","measure":"row_count","source_row_semantics":"one row per order","induced_from":{"output_entity_phrase":"customer email","matched_header":"Customer Email","header_similarity":1.0,"measure_phrase":"number of orders"}}
          JSON
          for id in 62 64 65; do
            python scripts/webarena_customer_count_representation_synth.py compute --task-id "$id" --task-file "$ROOT/full_no_eval.json" --observation "$ROOT/e_obs.json" --representation "$ROOT/e_rep.json" --output-dir "$ROOT/e"
          done
      - name: Reclose D without tasks171_170
        run: |
          ROOT=artifacts/chollet_depth5
          python scripts/webarena_gitlab_star_relation_synth.py observe --base-url http://localhost:8023 --output "$ROOT/d_obs.json"
          echo '{"LESS":"lt","LEAST":"min"}' > "$ROOT/d_binding.json"
          for id in 168 169 172; do
            python scripts/webarena_gitlab_star_relation_synth.py compute --task-id "$id" --task-file "$ROOT/full_no_eval.json" --observation "$ROOT/d_obs.json" --binding "$ROOT/d_binding.json" --output-dir "$ROOT/d"
          done
      - name: Reclose C B A without training
        run: |
          ROOT=artifacts/chollet_depth5
          for id in 164 165 166 167; do python scripts/webarena_shopping_low_reviews.py --task-id "$id" --task-file "$ROOT/full_no_eval.json" --base-url http://localhost:7770 --output-dir "$ROOT/c"; done
          for id in 12 13 14 15 344 345 346 347; do python scripts/webarena_shopping_admin_review_counts.py --task-id "$id" --task-file "$ROOT/full_no_eval.json" --base-url http://localhost:7780/admin --output-dir "$ROOT/b"; done
          python scripts/webarena_multibit_verifier_transfer.py observe --base-url http://localhost:7780/admin --output "$ROOT/a_obs.json"
          for id in 194 195 196 197; do python scripts/webarena_multibit_verifier_transfer.py compute --snapshot "$ROOT/a_obs.json" --task-id "$id" --task-file "$ROOT/full_no_eval.json" --recency newest --status-binding semantic --aggregation sum --output-dir "$ROOT/a"; done
      - name: Score depth5 protected future
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from webarena_verified.api import WebArenaVerified
          from webarena_verified.types.config import WebArenaVerifiedConfig
          from webarena_verified.types.tracing import NetworkTrace
          r=Path("artifacts/chollet_depth5"); wa=WebArenaVerified(config=WebArenaVerifiedConfig.from_file(r/"config.json")); e=NetworkTrace.model_construct(is_playwright=False,src_file=Path("<none>"),events=())
          def score(g,ids):
            rr={}
            for tid in ids:
              x=wa.evaluate_task(task_id=tid,agent_response=r/g/str(tid)/"agent_response.json",network_trace=e); rr[str(tid)]={"score":float(x.score),"status":x.status.value}
            return {"results":rr,"success_count":sum(v["score"]==1 and v["status"]=="success" for v in rr.values())}
          A=score("a",(194,195,196,197)); B=score("b",(12,13,14,15,344,345,346,347)); C=score("c",(164,165,166,167)); D=score("d",(168,169,172)); E=score("e",(62,64,65))
          counts=(A["success_count"],B["success_count"],C["success_count"],D["success_count"],E["success_count"])
          result={
            "epistemic_state":"WARRANTED_BOUNDED" if counts==(4,8,4,3,3) else "REJECTED",
            "experiment":"depth5 no-revisit retention after induced grouped-count representation",
            "A":A,"B":B,"C":C,"D":D,"E":E,
            "training_replayed":{"A":false,"B":false,"C":false,"D":false,"E":false},
            "combined_success_count":sum(counts),"combined_task_count":22,
            "claims":{
              "depth5_sequential_compounding_with_representation_invention":{"state":"WARRANTED_BOUNDED" if counts==(4,8,4,3,3) else "REJECTED"},
              "open_ended_nonmath_scaling":{"state":"UNKNOWN"}
            }
          }
          (r/"result.json").write_text(json.dumps(result,indent=2)+"\n"); print(json.dumps(result,indent=2)); assert result["epistemic_state"]=="WARRANTED_BOUNDED",result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: chollet-depth5-representation-compounding, path: artifacts/chollet_depth5}
