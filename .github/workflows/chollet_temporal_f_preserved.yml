name: Chollet temporal F preserved qualification
on:
  push:
    branches: [chollet-temporal-representation-v9]
    paths:
      - ".github/workflows/chollet_temporal_f_preserved.yml"
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone https://github.com/ServiceNow/webarena-verified.git upstream && cd upstream && git checkout 6473f72db5dcefc97b5725b59e734504edc28a21
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "./upstream[examples]"
      - name: Recover F evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/heathsanchez/test/actions/artifacts/11517940519/zip > /tmp/f.zip
          mkdir -p artifacts/chollet_depth6
          unzip -o /tmp/f.zip -d artifacts/chollet_depth6
      - run: python scripts/qualify_temporal_f_preserved_artifact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chollet-temporal-f-qualified
          path: artifacts/chollet_depth6
