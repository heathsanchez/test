name: Nucleus CI

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tests_py/**'
      - 'scripts/**'
      - 'evidence/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'arena.py'
      - 'arena-flags.json'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify qualified runtime identity
        run: python3 scripts/verify_source_import.py
      - name: Rust regression tests
        run: python3 scripts/test.py
      - name: Python tooling tests
        run: python3 -m unittest discover -s tests_py
      - name: Build the frozen public entry point
        run: cargo build --locked --release --features diagnostics
      - name: Exercise the public launcher
        run: python3 arena.py < tests/fixtures/good-beta-definition.ndjson
