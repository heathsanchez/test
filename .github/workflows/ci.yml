name: Nucleus standalone qualification

on:
  push:
    branches: [research/nucleus-standalone-preview-20261126]

permissions:
  contents: write
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_MIN_STACK: '67108864'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify the frozen source and Python tests
        run: |
          set -euo pipefail
          python3 scripts/verify_source_import.py
          python3 -m unittest discover -s tests_py 2>&1 | tee "$RUNNER_TEMP/nucleus-python-tests.log"
      - name: Rust regression tests
        run: |
          set -euo pipefail
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/nucleus-rust-tests.log"
      - name: Build the original release configuration
        run: |
          set -euo pipefail
          cargo build --locked --release --features diagnostics
          python3 arena.py < tests/fixtures/good-beta-definition.ndjson
      - name: Replay all 356 recorded beta inputs
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/15053582604/zip > "$RUNNER_TEMP/nucleus-original-qualification.zip"
          python3 scripts/replay_recorded_beta.py --archive "$RUNNER_TEMP/nucleus-original-qualification.zip" --out "$RUNNER_TEMP/nucleus-migration-replay.json"
      - name: Reconstruct the preserved source history
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/nucleus-history"
          git clone --single-branch --branch research/nucleus-beta-entry-20261126 https://github.com/heathsanchez/test.git "$history"
          test "$(git -C "$history" rev-parse HEAD)" = 578697991a903ab78d344aa71165d465bef3c3d7
          git clone https://github.com/newren/git-filter-repo.git "$RUNNER_TEMP/filter-repo"
          git -C "$RUNNER_TEMP/filter-repo" checkout --detach d7b75aca907380f608892cc289e616f195427b99
          (cd "$history" && python3 "$RUNNER_TEMP/filter-repo/git-filter-repo" --subdirectory-filter metatron-kernel --force)
          test "$(git -C "$history" rev-parse HEAD)" = 3b6c43d90e46d453d75d7e7b643fa168814372b9
          test "$(git -C "$history" rev-parse HEAD^{tree})" = d55d582a0c32276fc981a713867999faf730c6f2
          test "$(git -C "$history" rev-list --count HEAD)" = 720
          git -C "$history" branch -M main
          git -C "$history" tag source-import-2026-11-26
          rsync -a --exclude='.git/' --exclude='target/' --exclude='.migration/' "$GITHUB_WORKSPACE/" "$history/"
          cp .migration/final-ci.yml "$history/.github/workflows/ci.yml"
          cp "$RUNNER_TEMP/nucleus-migration-replay.json" "$history/evidence/standalone-migration-20261126.json"
          NUCLEUS_HISTORY="$history" python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['NUCLEUS_HISTORY'])
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          replay = json.loads((temp / 'nucleus-migration-replay.json').read_text())
          assert replay['input_count'] == 356 and replay['changed_verdicts'] == []
          assert replay['counts'] == {'accept': 59, 'reject': 51, 'unknown': 246}
          assert replay['format_3_2_counts'] == {'accept': 29, 'reject': 34, 'unknown': 75}
          tests = (temp / 'nucleus-rust-tests.log').read_text()
          passed = sum(int(n) for n in re.findall(r'test result: ok\. (\d+) passed;', tests))
          assert passed > 0
          pytests = (temp / 'nucleus-python-tests.log').read_text()
          assert 'Ran 29 tests' in pytests and 'OK' in pytests
          run = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          doc = root / 'docs/QUALIFICATION.md'
          receipt = (f'Fresh standalone verification passed in [Actions run]({run}):\n\n'
                     f'- {passed} Rust tests and 29 Python tests passed.\n'
                     '- The original release build and public launcher passed.\n'
                     '- All 356 exact beta inputs preserved their raw exit codes: '
                     '59 ACCEPT, 51 REJECT, 246 UNKNOWN.\n'
                     '- All 138 renovation outcomes were preserved: '
                     '29 ACCEPT, 34 REJECT, 75 UNKNOWN.\n'
                     '- The 28 runtime files and the 720-commit source extraction matched their recorded identities.\n\n'
                     'Per-input results are recorded in '
                     '[the migration receipt](../evidence/standalone-migration-20261126.json). '
                     'The separate 212-input legacy qualification remains inherited from the original source run; '
                     'it is not counted as a new standalone replay.\n')
          marker = 'Standalone execution results will be recorded here after verification.\n'
          assert marker in doc.read_text()
          doc.write_text(doc.read_text().replace(marker, receipt))
          imported = (root / '.git/filter-repo/commit-map').read_text().splitlines()[1:]
          mapped = [line.split() for line in imported if line.split()[1] != '0' * 40]
          expected = 'original_commit\tstandalone_commit\n' + ''.join('\t'.join(line) + '\n' for line in mapped)
          assert (root / 'docs/history-map.tsv').read_text() == expected
          subprocess.run(['python3', 'scripts/verify_source_import.py'], cwd=root, check=True)
          print('STANDALONE_MIGRATION', json.dumps({'rust_tests_passed': passed, 'python_tests_passed': 29, 'beta_inputs': 356, 'history_commits': 720, 'run': run}, sort_keys=True))
          PY
          git -C "$history" config user.name 'github-actions[bot]'
          git -C "$history" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$history" add -A
          git -C "$history" commit -m 'Prepare Nucleus standalone source and verified migration'
          test "$(git -C "$history" rev-parse HEAD:src)" = 362242c265ee2b1758645c78ad141ad78bf6f8c2
          git -C "$history" bundle create "$RUNNER_TEMP/nucleus-standalone.bundle" main source-import-2026-11-26
          sha256sum "$RUNNER_TEMP/nucleus-standalone.bundle" > "$RUNNER_TEMP/nucleus-standalone.bundle.sha256"
          gh auth setup-git
          git -C "$history" remote add origin https://github.com/heathsanchez/test.git
          git -C "$history" push origin HEAD:refs/heads/research/nucleus-standalone-20261126
          git -C "$history" rev-parse HEAD > "$RUNNER_TEMP/nucleus-standalone-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-standalone-migration
          path: |
            ${{ runner.temp }}/nucleus-migration-replay.json
            ${{ runner.temp }}/nucleus-rust-tests.log
            ${{ runner.temp }}/nucleus-python-tests.log
            ${{ runner.temp }}/nucleus-standalone.bundle
            ${{ runner.temp }}/nucleus-standalone.bundle.sha256
            ${{ runner.temp }}/nucleus-standalone-head.txt
          if-no-files-found: error
          retention-days: 90
