name: Collatz symbolic absolute cone compiler

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-absolute-cone-symbolic.yml"
      - "experiments/collatz_absolute_cone_symbolic.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-absolute-cone-symbolic
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        k: [20,24,28,32]
    name: symbolic-k${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile symbolic cone
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -march=native -std=c++20 experiments/collatz_absolute_cone_symbolic.cpp -o /tmp/sym
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/sym ${{ matrix.k }} 512 5000000 | tee results/census.txt
          grep -Eq "VERIFIED_SYMBOLIC_CONE_SHELL_CLOSED|SYMBOLIC_CONE_FRONTIER_RETAINED" results/census.txt
      - name: Parse symbolic field
        run: |
          python - <<'PY'
          import json,re
          K=int("${{ matrix.k }}")
          s=open("results/census.txt").read()
          m=re.search(
            rf"CONE_SYMBOLIC_RESULT K={K} H=512 total_odd=(\d+) "
            r"closed_t0=(\d+) uniform_closed=(\d+) singleton_closed=(\d+) "
            r"singleton_hard=(\d+) frontier_states=(\d+) frontier_represented=(\d+) "
            r"last_t=(\d+) truncated=(\d+)",s)
          assert m,s[-8000:]
          vals=list(map(int,m.groups()))
          keys=["total_odd","closed_t0","uniform_closed","singleton_closed",
                "singleton_hard","frontier_states","frontier_represented",
                "last_t","truncated"]
          out={"K":K,**dict(zip(keys,vals))}
          tm=open("results/time-memory.txt").read().strip().split()
          out["wall_seconds"]=float(tm[0]); out["max_rss_kb"]=int(tm[1])
          out["frontier_fraction"]=out["frontier_represented"]/out["total_odd"]
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("SYMBOLIC_CONE_CELL",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symbolic-cone-k${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: compile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: symbolic-cone-k*
          path: gathered
      - name: Aggregate symbolic curve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("symbolic-cone-k*"):
              p=d/"summary.json"; assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda x:x["K"])
          assert [x["K"] for x in rows]==[20,24,28,32],rows
          out={"kind":"symbolic_absolute_cone_curve","rows":rows}
          Path("symbolic-cone-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("SYMBOLIC_CONE_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: symbolic-cone-field
          path: symbolic-cone-field.json
          retention-days: 30
