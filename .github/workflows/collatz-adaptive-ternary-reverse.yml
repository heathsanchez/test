name: Collatz adaptive ternary reverse

on:
  push:
    branches: [collatz-valuation-quotient-v1]
    paths:
      - ".github/workflows/collatz-adaptive-ternary-reverse.yml"
      - "experiments/collatz_adaptive_ternary_reverse.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-adaptive-ternary-reverse
  cancel-in-progress: true

jobs:
  adaptive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { depth: 8, rb: 0, macro: 4, emax: 5 }
          - { depth: 8, rb: 1, macro: 4, emax: 5 }
          - { depth: 10, rb: 1, macro: 4, emax: 5 }
          - { depth: 10, rb: 1, macro: 6, emax: 5 }
          - { depth: 12, rb: 1, macro: 4, emax: 5 }
    name: adaptive-d${{ matrix.depth }}-r${{ matrix.rb }}-m${{ matrix.macro }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_adaptive_ternary_reverse.cpp             -o /tmp/adaptive_reverse
      - name: Run adaptive exact quotient
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/adaptive_reverse ${{ matrix.depth }} ${{ matrix.rb }} ${{ matrix.macro }} ${{ matrix.emax }}             | tee results/census.txt
          grep -q "FINAL_GATE=ADAPTIVE_REVERSE_D${{ matrix.depth }}_R${{ matrix.rb }}_M${{ matrix.macro }}_E${{ matrix.emax }}" results/census.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-d${{ matrix.depth }}-r${{ matrix.rb }}-m${{ matrix.macro }}
          path: results
          retention-days: 30
