name: Collatz affine admission foundry V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_affine_admission_foundry_v0.py'
      - '.github/workflows/collatz-affine-admission-foundry-v0.yml'
  workflow_dispatch:
jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-affine-admission-foundry-v0
          python experiments/collatz_affine_admission_foundry_v0.py | tee evidence/collatz-affine-admission-foundry-v0/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-affine-admission-foundry-v0
          path: evidence/collatz-affine-admission-foundry-v0
