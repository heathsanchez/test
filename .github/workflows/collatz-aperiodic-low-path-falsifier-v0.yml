name: Collatz Aperiodic Low Path Falsifier
on:
  push:
    branches: [collatz-three-quarter-future7-cylinder-v0]
jobs:
  falsify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python experiments/collatz_aperiodic_low_path_falsifier_v0.py | tee /tmp/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-aperiodic-low-path-falsifier-v0
          path: /tmp/result.json
