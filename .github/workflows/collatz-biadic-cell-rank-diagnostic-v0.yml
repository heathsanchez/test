name: Collatz bi-adic cell rank diagnostic V0

on:
  push:
    branches:
      - collatz-biadic-cell-rank-diagnostic-v0
    paths:
      - 'experiments/collatz_biadic_cell_rank_diagnostic_v0.py'
      - '.github/workflows/collatz-biadic-cell-rank-diagnostic-v0.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact preselected-band rank diagnostic
        run: |
          set -o pipefail
          mkdir -p evidence/collatz-biadic-cell-rank-diagnostic-v0
          python experiments/collatz_biadic_cell_rank_diagnostic_v0.py             --lo 46593 --hi 47103 --K 128             --output evidence/collatz-biadic-cell-rank-diagnostic-v0/result.json             | tee evidence/collatz-biadic-cell-rank-diagnostic-v0/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-biadic-cell-rank-diagnostic-v0
          path: evidence/collatz-biadic-cell-rank-diagnostic-v0
          if-no-files-found: error
