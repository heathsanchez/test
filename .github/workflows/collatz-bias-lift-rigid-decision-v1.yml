name: Collatz Bias Lift Rigid Decision V1
on:
  push:
    branches: [collatz-bias-lift-rigid-decision-v1]
    paths:
      - 'experiments/collatz_bias_lift_rigid_decision_v1.py'
      - '.github/workflows/collatz-bias-lift-rigid-decision-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact decision audit
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-bias-lift-rigid-decision-v1
          python -u experiments/collatz_bias_lift_rigid_decision_v1.py | tee evidence/collatz-bias-lift-rigid-decision-v1/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-bias-lift-rigid-decision-v1
          path: evidence/collatz-bias-lift-rigid-decision-v1
