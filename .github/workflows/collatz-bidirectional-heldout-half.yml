name: Collatz bidirectional heldout half
on:
  workflow_dispatch:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - '.github/workflows/collatz-bidirectional-heldout-half.yml'
jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_bidirectional_cover_probe.py --lo 8193 --N 16383 --K 120 --maxepisodes 4 --maxsteps 28 --Rmax 20 --Smax 12 | tee /tmp/bidirectional-heldout-half.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bidirectional-heldout-half
          path: /tmp/bidirectional-heldout-half.txt
