name: Collatz bigint H512 grammar across shells

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-bigint-h512-across-k.yml"
      - "experiments/collatz_shell_forward_reverse_bigint.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-bigint-h512-across-k
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        k: [20,22,24,26,28]
    name: bigint-k${{ matrix.k }}-f512-r8
    steps:
      - uses: actions/checkout@v4

      - name: Install arbitrary-precision headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev

      - name: Generate frozen q14 universal bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY

      - name: Run exact arbitrary-precision H512 grammar
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_shell_forward_reverse_bigint.cpp -o /tmp/big
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/big ${{ matrix.k }} results/q14-bank.txt 8 512             | tee results/census.txt
          grep -q "VERIFIED_BIGINT_SHELL_FORWARD_REVERSE_COALESCENCE" results/census.txt

      - name: Freeze exact shell result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          K=int("${{ matrix.k }}")
          s=open("results/census.txt").read()
          m=re.search(
              rf"BIG_SHELL_FORWARD_REVERSE_RESULT K={K} reverse_depth=8 forward_h=512 "
              r"universal_residual=(\d+) shell_forward=(\d+) "
              r"shell_reverse=(\d+) shell_hard=(\d+) controls=(\d+)",s)
          assert m,s[-9000:]
          u,fw,rv,hard,controls=map(int,m.groups())
          assert fw+rv+hard==u
          tm=open("results/time-memory.txt").read().strip().split()
          out={
              "kind":"bigint_h512_shell_transfer",
              "K":K,"forward_h":512,"reverse_depth":8,
              "universal_residual":u,
              "shell_forward":fw,"shell_reverse":rv,
              "shell_closed":fw+rv,"shell_hard":hard,
              "closure_fraction":(fw+rv)/u if u else 1.0,
              "controls":controls,
              "wall_seconds":float(tm[0]) if tm else None,
              "max_rss_kb":int(tm[1]) if len(tm)>1 else None,
              "arithmetic":"boost_cpp_int",
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("BIGINT_H512_SHELL_TRANSFER",json.dumps(out,separators=(",",":")))
          assert hard==0,(K,hard)
          print("EXACT_SHELL_CLOSED_BIGINT",K)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigint-h512-shell-k${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: shell
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bigint-h512-shell-k*
          path: gathered
      - name: Aggregate exact transfer
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("bigint-h512-shell-k*"):
              p=d/"summary.json"; assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda r:r["K"])
          assert [r["K"] for r in rows]==[20,22,24,26,28],rows
          assert all(r["shell_hard"]==0 for r in rows),rows
          out={
              "kind":"exact_bigint_h512_transfer_across_shells",
              "rows":rows,
              "all_closed":True,
              "new_search_calls":0,
          }
          Path("bigint-h512-across-k-field.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("BIGINT_H512_ACROSS_K_FIELD",
                json.dumps(out,separators=(",",":"),sort_keys=True))
          print("FROZEN_H512_GRAMMAR_EXACTLY_CLOSES_ALL_TESTED_SHELLS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bigint-h512-across-k-field
          path: bigint-h512-across-k-field.json
          retention-days: 30
