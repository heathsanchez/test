name: Collatz exact bigint H512 across consecutive shells

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-bigint-h512-consecutive-shells.yml"
      - "experiments/collatz_shell_forward_reverse_bigint.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-bigint-h512-consecutive-shells
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        k: [20,21,22,23,24,25,26,27,28]
    name: bigint-k${{ matrix.k }}-f512-r8
    steps:
      - uses: actions/checkout@v4

      - name: Install arbitrary precision headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev

      - name: Generate frozen q14 universal bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY

      - name: Run exact frozen F512 R8 grammar
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_shell_forward_reverse_bigint.cpp -o /tmp/big
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/big ${{ matrix.k }} results/q14-bank.txt 8 512             | tee results/census.txt
          grep -q "VERIFIED_BIGINT_SHELL_FORWARD_REVERSE_COALESCENCE" results/census.txt

      - name: Record exact shell result
        run: |
          python - <<'PY'
          import json,re
          K=int("${{ matrix.k }}")
          s=open("results/census.txt").read()
          m=re.search(
              rf"BIG_SHELL_FORWARD_REVERSE_RESULT K={K} reverse_depth=8 forward_h=512 "
              r"universal_residual=(\d+) shell_forward=(\d+) "
              r"shell_reverse=(\d+) shell_hard=(\d+) controls=(\d+)",s)
          assert m,s[-8000:]
          u,fw,rv,hard,controls=map(int,m.groups())
          assert fw+rv+hard==u
          odd=1<<(K-1)
          tm=open("results/time-memory.txt").read().strip().split()
          out={
              "kind":"exact_bigint_f512_r8_shell",
              "K":K,"forward_h":512,"reverse_depth":8,
              "universal_residual":u,
              "shell_forward":fw,"shell_reverse":rv,
              "shell_closed":fw+rv,"shell_hard":hard,
              "closed_fraction_of_universal":(fw+rv)/u if u else 1.0,
              "hard_fraction_of_odd":hard/odd,
              "controls":controls,
              "wall_seconds":float(tm[0]),"max_rss_kb":int(tm[1]),
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("BIGINT_CONSECUTIVE_SHELL_RESULT",json.dumps(out,separators=(",",":")))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigint-f512-shell-k${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: shell
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bigint-f512-shell-k*
          path: gathered
      - name: Aggregate consecutive shell certificate curve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("bigint-f512-shell-k*"):
              p=d/"summary.json"; assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda x:x["K"])
          assert [x["K"] for x in rows]==list(range(20,29)),rows
          out={
              "kind":"exact_bigint_f512_r8_consecutive_shells",
              "rows":rows,
              "all_closed":all(x["shell_hard"]==0 for x in rows),
              "closed_shells":[x["K"] for x in rows if x["shell_hard"]==0],
              "open_shells":[x["K"] for x in rows if x["shell_hard"]!=0],
          }
          Path("bigint-f512-consecutive-shells-field.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("BIGINT_F512_CONSECUTIVE_SHELLS_FIELD",
                json.dumps(out,separators=(",",":"),sort_keys=True))
          if out["all_closed"]:
              print("ALL_K20_TO_K28_SHELLS_EXACTLY_CLOSED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bigint-f512-consecutive-shells-field
          path: bigint-f512-consecutive-shells-field.json
          retention-days: 30
