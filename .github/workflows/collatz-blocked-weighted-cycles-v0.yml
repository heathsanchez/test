name: Collatz blocked weighted cycles V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_blocked_weighted_cycles_v0.py'
      - '.github/workflows/collatz-blocked-weighted-cycles-v0.yml'
  workflow_dispatch:
jobs:
  cycles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-blocked-weighted-cycles-v0
          python experiments/collatz_blocked_weighted_cycles_v0.py | tee evidence/collatz-blocked-weighted-cycles-v0/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-blocked-weighted-cycles-v0
          path: evidence/collatz-blocked-weighted-cycles-v0
