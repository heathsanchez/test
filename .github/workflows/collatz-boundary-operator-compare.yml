name: Collatz boundary operator comparison

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-boundary-operator-compare.yml"
      - "experiments/collatz_boundary_operator_compare.py"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare exact boundary operators
        run: |
          set -euo pipefail
          python experiments/collatz_boundary_operator_compare.py | tee comparison.txt
          grep -q "VERIFIED_BOUNDARY_OPERATOR_COMPARISON" comparison.txt
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-operator-comparison
          path: comparison.txt
          retention-days: 30
