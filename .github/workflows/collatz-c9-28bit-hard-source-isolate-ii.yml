name: Collatz C9 28-bit hard-source isolate II
on:
  push:
    branches: [collatz-rigid-component-termination-v1]
    paths:
      - '.github/workflows/collatz-c9-28bit-hard-source-isolate-ii.yml'
  workflow_dispatch:
jobs:
  isolate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "h10", lo: 218261501, hi: 218262012}
          - {name: "h11", lo: 218262013, hi: 218262524}
          - {name: "h12", lo: 218262525, hi: 218263036}
          - {name: "h13", lo: 218263037, hi: 218263548}
          - {name: "h30", lo: 218265597, hi: 218266108}
          - {name: "h31", lo: 218266109, hi: 218266620}
          - {name: "h32", lo: 218266621, hi: 218267132}
          - {name: "h33", lo: 218267133, hi: 218267646}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Isolate exact hard-source subrange
        run: |
          set -euo pipefail
          python -u experiments/collatz_c9_compounding_sweep.py --lo "${{ matrix.lo }}" --hi "${{ matrix.hi }}" --H 512 --guard 10000 | tee "/tmp/${{ matrix.name }}.txt"
          grep -Eq '^PASS_ALL_LIVE_HIGH_FUEL_ENDPOINTS_COMPILED$|^SEPARATOR_UNRESOLVED_LIVE_HIGH_FUEL_ENDPOINT' "/tmp/${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: c9-28bit-hard2-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.txt
