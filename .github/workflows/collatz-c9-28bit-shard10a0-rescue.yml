name: Collatz C9 28-bit shard10a0 nano-rescue
on:
  push:
    branches: [collatz-rigid-component-termination-v1]
    paths:
      - '.github/workflows/collatz-c9-28bit-shard10a0-rescue.yml'
  workflow_dispatch:
jobs:
  rescue:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "10a00", lo: 218103809, hi: 218234879}
          - {name: "10a01", lo: 218234880, hi: 218365950}
          - {name: "10a02", lo: 218365951, hi: 218497021}
          - {name: "10a03", lo: 218497022, hi: 218628095}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Nano rescue exact range
        run: |
          set -euo pipefail
          python -u experiments/collatz_c9_compounding_sweep.py --lo "${{ matrix.lo }}" --hi "${{ matrix.hi }}" --H 512 --guard 10000 | tee "/tmp/${{ matrix.name }}.txt"
          grep -Eq '^PASS_ALL_LIVE_HIGH_FUEL_ENDPOINTS_COMPILED$|^SEPARATOR_UNRESOLVED_LIVE_HIGH_FUEL_ENDPOINT' "/tmp/${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: c9-28bit-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.txt
