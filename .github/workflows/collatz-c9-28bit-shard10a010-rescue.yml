name: Collatz C9 28-bit shard10a010 femto-rescue
on:
  push:
    branches: [collatz-rigid-component-termination-v1]
    paths:
      - '.github/workflows/collatz-c9-28bit-shard10a010-rescue.yml'
  workflow_dispatch:
jobs:
  rescue:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "10a0100", lo: 218234880, hi: 218243070}
          - {name: "10a0101", lo: 218243071, hi: 218251261}
          - {name: "10a0102", lo: 218251262, hi: 218259452}
          - {name: "10a0103", lo: 218259453, hi: 218267646}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Femto rescue exact range
        run: |
          set -euo pipefail
          python -u experiments/collatz_c9_compounding_sweep.py --lo "${{ matrix.lo }}" --hi "${{ matrix.hi }}" --H 512 --guard 10000 | tee "/tmp/${{ matrix.name }}.txt"
          grep -Eq '^PASS_ALL_LIVE_HIGH_FUEL_ENDPOINTS_COMPILED$|^SEPARATOR_UNRESOLVED_LIVE_HIGH_FUEL_ENDPOINT' "/tmp/${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: c9-28bit-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.txt
