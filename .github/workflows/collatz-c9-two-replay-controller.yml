name: Collatz C9 two-replay controller
on:
  push:
    branches: [collatz-rigid-component-termination-v1]
    paths:
      - 'experiments/collatz_c9_two_replay_controller.py'
      - '.github/workflows/collatz-c9-two-replay-controller.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact two-replay controller
        run: |
          set -euo pipefail
          python -u experiments/collatz_c9_two_replay_controller.py --q-limit 16384 | tee /tmp/c9-controller.txt
          grep -q '^PASS_C9_TWO_REPLAY_LIFT_CONTROLLER$' /tmp/c9-controller.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c9-two-replay-controller
          path: /tmp/c9-controller.txt
