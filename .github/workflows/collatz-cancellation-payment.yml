name: Collatz Cancellation Payment
on:
  push:
    branches: [collatz-cancellation-payment-20260930]
    paths: ['.github/workflows/collatz-cancellation-payment.yml']
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned parent
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake build CollatzFinal
      - name: Qualify cancellation payment and exact plateau family
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-cancellation-payment
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/GuardedDyadicSwitch.olean formal/Collatz/GuardedDyadicSwitch.lean > evidence/collatz-cancellation-payment/parent.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/CancellationPayment.olean formal/Collatz/CancellationPayment.lean | tee evidence/collatz-cancellation-payment/payment.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/SourceCylinderExit.olean formal/Collatz/SourceCylinderExit.lean > evidence/collatz-cancellation-payment/source-lift.log
          lake env lean -DautoImplicit=false formal/Collatz/PaymentWitness.lean | tee evidence/collatz-cancellation-payment/witness.log
          python experiments/collatz_cancellation_payment_20260930.py > evidence/collatz-cancellation-payment/audit.json
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('evidence/collatz-cancellation-payment')
          for name in ('payment.log','witness.log'):
              s=(root/name).read_text()
              assert 'sorryAx' not in s and 'Lean.ofReduceBool' not in s
          r=json.loads((root/'audit.json').read_text())
          assert r['certificate_sha256']=='56d3ffb5d6552eb339e643422f853915bbfcd9956e7c53b371ba562aa9198541'
          for name in ('CancellationPayment.lean','PaymentWitness.lean'):
              s=Path('formal/Collatz',name).read_text()
              assert not re.search(r'\b(sorry|admit|axiom|unsafe)\b',s)
          print('ARBITRARY_FINITE_PLATEAUS_AND_EXACT_PAYMENT_CONE_REJECTION_QUALIFIED')
          assert 'plateau_cell_not_minimal_bad' in (root/'payment.log').read_text()
          print('PLATEAU_FAMILY_EXCLUDED_FROM_MINIMAL_BAD_SOURCES')
          print('GLOBAL_COLLATZ_UNKNOWN')
          PY
          git rev-parse HEAD > evidence/collatz-cancellation-payment/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-cancellation-payment
          path: evidence/collatz-cancellation-payment
