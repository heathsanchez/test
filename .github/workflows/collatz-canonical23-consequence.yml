name: Collatz canonical 23 consequence compiler

on:
  push:
    branches: [collatz-valuation-quotient-v1]
    paths:
      - ".github/workflows/collatz-canonical23-consequence.yml"
      - "experiments/collatz_canonical23_consequence.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-canonical23-consequence
  cancel-in-progress: true

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { depth: 12, refine: 0 }
          - { depth: 12, refine: 1 }
          - { depth: 12, refine: 2 }
          - { depth: 16, refine: 1 }
          - { depth: 16, refine: 2 }
          - { depth: 20, refine: 1 }
          - { depth: 20, refine: 2 }
    name: canonical-d${{ matrix.depth }}-r${{ matrix.refine }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_canonical23_consequence.cpp -o /tmp/canonical23
      - name: Run canonical exact quotient
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/canonical23 ${{ matrix.depth }} ${{ matrix.refine }}             | tee results/census.txt
          grep -q "EXACT_ALL_ODD_N_GT_1_PARTITION" results/census.txt
          grep -q "FINAL_GATE=CANONICAL23_D${{ matrix.depth }}_R${{ matrix.refine }}" results/census.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-d${{ matrix.depth }}-r${{ matrix.refine }}
          path: results
          retention-days: 30
