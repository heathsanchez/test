name: Collatz Case-B scale quotient
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - experiments/collatz_case_b_scale_quotient_v0.py
      - .github/workflows/collatz-case-b-scale-quotient.yml
permissions:
  contents: read
jobs:
  quotient:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/collatz_case_b_scale_quotient_v0.py
