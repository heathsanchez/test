name: Collatz Coalescence Record Census V1
on:
  push:
    branches: [collatz-coalescence-descent-v1]
    paths:
      - 'experiments/collatz_coalescence_record_census_v1.py'
      - '.github/workflows/collatz-coalescence-record-census-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run exact source-order census
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-coalescence-record-census-v1
          git rev-parse HEAD > evidence/collatz-coalescence-record-census-v1/commit.txt
          python -u experiments/collatz_coalescence_record_census_v1.py | tee evidence/collatz-coalescence-record-census-v1/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-coalescence-record-census-v1
          path: evidence/collatz-coalescence-record-census-v1
          if-no-files-found: error
