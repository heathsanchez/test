name: Collatz coalescent macro fixpoint

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-coalescent-macro-fixpoint.yml"
      - "experiments/collatz_macro_fixpoint_coalescence.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-coalescent-macro-fixpoint
  cancel-in-progress: true

jobs:
  fixpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        k: [20,22,24]
    name: coalescent-b${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate frozen q14 donor bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY

      - name: Run exact coalescent macro fixpoint
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_macro_fixpoint_coalescence.cpp             -o /tmp/coalescent
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/coalescent ${{ matrix.k }} results/q14-bank.txt             | tee results/census.txt
          grep -q "VERIFIED_COALESCENT_EXHAUSTIVE_MACRO_FIXPOINT" results/census.txt

      - name: Record exact result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          K=int("${{ matrix.k }}")
          s=open("results/census.txt").read()
          m=re.search(
              rf"COALESCENT_FIXPOINT_DONE K={K} final_live=(\d+) "
              r"total_coalesce=(\d+) total_descent=(\d+) "
              r"total_bridge=(\d+) total_deep_o=(\d+) total_macro=(\d+)",s)
          assert m,s[-6000:]
          live,coal,des,bridge,deep_o,macro=map(int,m.groups())
          refs={20:15889,22:52231,24:173180}
          assert live<=refs[K],(K,live,refs[K])
          tm=open("results/time-memory.txt").read().strip().split()
          out={
              "kind":"coalescent_exhaustive_macro_fixpoint",
              "K":K,
              "live":live,
              "noncoalescent_fixpoint_reference":refs[K],
              "improvement":refs[K]-live,
              "total_coalesce":coal,
              "total_macro":macro,
              "wall_seconds":float(tm[0]) if tm else None,
              "max_rss_kb":int(tm[1]) if len(tm)>1 else None,
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("COALESCENT_MACRO_FIXPOINT_RESULT",
                json.dumps(out,separators=(",",":")))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coalescent-fixpoint-b${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: fixpoint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coalescent-fixpoint-b*
          path: gathered

      - name: Aggregate coalescent curve
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("coalescent-fixpoint-b*"):
              p=d/"summary.json"
              assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda r:r["K"])
          assert [r["K"] for r in rows]==[20,22,24],rows
          out={"kind":"coalescent_macro_fixpoint_curve","rows":rows}
          Path("coalescent-macro-fixpoint-field.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("COALESCENT_MACRO_FIXPOINT_FIELD",
                json.dumps(out,separators=(",",":"),sort_keys=True))
          # Exact negative result: once the live reverse-macro fixpoint is
          # reached, no same-depth affine duplicates remain at B20/B22/B24.
          assert all(r["improvement"]==0 for r in rows),rows
          assert all(r["total_coalesce"]==0 for r in rows),rows
          print("COALESCENCE_EXHAUSTED_AT_MACRO_FIXPOINT")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: coalescent-macro-fixpoint-field
          path: coalescent-macro-fixpoint-field.json
          retention-days: 30
