name: Collatz coefficient dynamics
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'formal/Collatz/CoefficientDynamics.lean'
      - '.github/workflows/collatz-coefficient-dynamics.yml'
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile coefficient dynamics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-coefficient-dynamics .lake/build/lib/lean/Collatz
          lake build CollatzFinal
          lake env lean --version | tee evidence/collatz-coefficient-dynamics/toolchain.txt
          for module in SourceProduct SourceProductAffine CoefficientCrossing; do
            lake env lean -DautoImplicit=false -o ".lake/build/lib/lean/Collatz/$module.olean" "formal/Collatz/$module.lean" | tee "evidence/collatz-coefficient-dynamics/$module.log"
          done
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' formal/Collatz/CoefficientDynamics.lean
          lake env lean -DautoImplicit=false formal/Collatz/CoefficientDynamics.lean | tee evidence/collatz-coefficient-dynamics/CoefficientDynamics.log
          ! grep -E 'sorryAx|Lean.ofReduceBool' evidence/collatz-coefficient-dynamics/*.log
          git rev-parse HEAD > evidence/collatz-coefficient-dynamics/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-coefficient-dynamics
          path: evidence/collatz-coefficient-dynamics
          if-no-files-found: error
