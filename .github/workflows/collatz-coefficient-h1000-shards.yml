name: Collatz Coefficient H1000 Shards

on:
  push:
    paths:
      - ".github/workflows/collatz-coefficient-h1000-shards.yml"
  workflow_dispatch:

concurrency:
  group: collatz-coefficient-h1000-shards
  cancel-in-progress: true

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: 0
            lo: "2392312122059207475200"
            hi: "2580230076993379166224"
          - shard: 1
            lo: "2580230076993379166225"
            hi: "2768148031927550857250"
          - shard: 2
            lo: "2768148031927550857251"
            hi: "2956065986861722548275"
          - shard: 3
            lo: "2956065986861722548276"
            hi: "3143983941795894239301"
    name: coeff1000-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check python-sat
      - name: Exact coefficient persistence to 1000
        run: |
          mkdir -p results
          python experiments/collatz_coefficient_cnf.py \
            --bits 72 \
            --lower "${{ matrix.lo }}" \
            --upper "${{ matrix.hi }}" \
            --horizon 1000 \
            --checkpoints 1000 \
            --replay-limit 10000 \
            --out results/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-coeff1000-${{ matrix.shard }}
          path: results/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
