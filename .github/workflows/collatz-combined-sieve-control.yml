name: Collatz composed-sieve swarm control

on:
  push:
    paths:
      - ".github/workflows/collatz-combined-sieve-control.yml"
      - "experiments/collatz_vslice_combined_scan.cpp"
      - "experiments/collatz_vslice_prefix_sieve_scan.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-combined-sieve-control
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build exact p24 and composed kernels
        run: |
          g++ -O3 -march=native -fopenmp -DBLOCK_BITS=10 -DPREFIX_BITS=24 \
            experiments/collatz_vslice_prefix_sieve_scan.cpp -o /tmp/p24
          g++ -O3 -march=native -fopenmp -DBLOCK_BITS=10 -DPREFIX_BITS=24 -DSTRONG_BITS=22 \
            experiments/collatz_vslice_combined_scan.cpp -o /tmp/combined
      - name: Protect exact 920 record
        run: |
          set -o pipefail
          mkdir -p results
          N=2874993894540242321407
          /tmp/combined 30 5000 1 0 "$N" "$N" | tee results/record.txt
          grep -q "BEST first_descent_or_survival=920 seed=$N" results/record.txt
          grep -q "STATUS COMBINED_SIEVES_AND_SCAN_CLOSED" results/record.txt
          echo COMBINED_RECORD_CONTROL_OK
      - name: Compare sealed large micro-worlds
        run: |
          set -o pipefail
          export OMP_NUM_THREADS=4
          L=2392312122059207475200
          for K in 10 8; do
            U=$(python - <<PY
          L=$L
          K=$K
          GLOBAL_U=3143983941795894239301
          target=1<<26
          print(min(GLOBAL_U,L+target*(1<<(K+1))))
          PY
            )
            /usr/bin/time -f '%e' -o results/p24-k$K.time \
              /tmp/p24 $K 5000 1 0 "$L" "$U" > results/p24-k$K.txt
            /usr/bin/time -f '%e' -o results/combined-k$K.time \
              /tmp/combined $K 5000 1 0 "$L" "$U" > results/combined-k$K.txt
          done
          python - <<'PY'
          import json,re
          rows=[]
          for k in (10,8):
              p=open(f"results/p24-k{k}.txt").read()
              c=open(f"results/combined-k{k}.txt").read()
              assert "STATUS PREFIX_SIEVE_AND_SCAN_CLOSED" in p,p[-4000:]
              assert "STATUS COMBINED_SIEVES_AND_SCAN_CLOSED" in c,c[-4000:]
              ph=re.search(r"full_count=(\d+) merge_killed=(\d+) transfer_killed=(\d+) explicit_count=(\d+)",p)
              ch=re.search(r"full_count=(\d+) merge_killed=(\d+) transfer_killed=(\d+) prefix_live=(\d+)",c)
              cc=re.search(r"COMBINED_COUNTS prefix_live=(\d+) strong_killed_after_prefix=(\d+) explicit=(\d+)",c)
              assert ph and ch and cc
              full,pm,pt,pex=map(int,ph.groups())
              cfull,cm,ct,cpl=map(int,ch.groups())
              pl,strong,explicit=map(int,cc.groups())
              assert (full,pm,pt,pex)==(cfull,cm,ct,cpl)
              assert pl==pex
              assert strong+explicit==pex,(k,strong,explicit,pex)
              ptime=float(open(f"results/p24-k{k}.time").read())
              ctime=float(open(f"results/combined-k{k}.time").read())
              rows.append({
                  "k":k,"full":full,
                  "p24_explicit":pex,
                  "combined_strong_killed":strong,
                  "combined_explicit":explicit,
                  "explicit_reduction_factor":pex/explicit if explicit else float("inf"),
                  "p24_seconds":ptime,"combined_seconds":ctime,
                  "speedup":ptime/ctime if ctime else float("inf"),
              })
          print("COMBINED_SIEVE_COMPARISON",json.dumps(rows,separators=(",",":")))
          assert all(r["combined_explicit"] < r["p24_explicit"] for r in rows),rows
          print("COMBINED_SIEVE_EXACT_CONTROL_OK")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-combined-sieve-control
          path: results
          if-no-files-found: error
          retention-days: 30
