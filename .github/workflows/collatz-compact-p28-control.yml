name: Collatz compact p28 consequence-language control

on:
  push:
    paths:
      - ".github/workflows/collatz-compact-p28-control.yml"
      - "experiments/collatz_vslice_compact_p28_scan.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-compact-p28-control
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        k: [15,10,8]
    name: compact-p28-k${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
      - name: Build retained and compact scanners
        run: |
          g++ -O3 -march=native -fopenmp \
            -DBLOCK_BITS=10 -DPREFIX_BITS=24 -DCOAL_BITS=16 \
            experiments/collatz_vslice_fused_scan.cpp -o /tmp/p24
          g++ -O3 -march=native -fopenmp \
            -DBLOCK_BITS=10 -DBASE_BITS=24 -DDEEP_BITS=28 -DCOAL_BITS=16 \
            experiments/collatz_vslice_deep_fused_scan.cpp -o /tmp/p28-old
          g++ -O3 -march=native -fopenmp \
            -DBLOCK_BITS=10 -DBASE_BITS=24 -DDEEP_BITS=28 -DCOAL_BITS=16 \
            experiments/collatz_vslice_compact_p28_scan.cpp -o /tmp/p28-compact

      - name: Cross-check exact p28 census and protected record
        run: |
          set -o pipefail
          mkdir -p results
          K="${{ matrix.k }}"
          N=2874993894540242321407
          /tmp/p28-compact 30 5000 1 0 "$N" "$N" | tee results/record.txt
          grep -q "BEST first_descent_or_survival=920 seed=$N" results/record.txt
          grep -q "STATUS COMPACT_P28_COAL_PREDQ7_SCAN_CLOSED" results/record.txt
          case "$K" in
            15) grep -q "p28_live_classes=46777401" results/record.txt ;;
            10) grep -q "p28_live_classes=28311176" results/record.txt ;;
            8)  grep -q "p28_live_classes=19085390" results/record.txt ;;
          esac

      - name: Benchmark sealed 2^30-seed world
        run: |
          set -o pipefail
          export OMP_NUM_THREADS=4
          K="${{ matrix.k }}"
          L=2392312122059207475200
          U=$(python - <<PY
          L=$L
          K=$K
          GLOBAL_U=3143983941795894239301
          target=1<<30
          print(min(GLOBAL_U,L+target*(1<<(K+1))))
          PY
          )
          /usr/bin/time -f '%e' -o results/p24.time \
            /tmp/p24 "$K" 5000 1 0 "$L" "$U" > results/p24.txt
          /usr/bin/time -f '%e' -o results/old.time \
            /tmp/p28-old "$K" 5000 1 0 "$L" "$U" > results/old.txt
          /usr/bin/time -f '%e' -o results/compact.time \
            /tmp/p28-compact "$K" 5000 1 0 "$L" "$U" > results/compact.txt
          python - <<'PY'
          import json,re
          k=int("${{ matrix.k }}")
          a=open("results/p24.txt").read()
          b=open("results/old.txt").read()
          c=open("results/compact.txt").read()
          assert "STATUS PREFIX_COAL_PREDQ7_SIEVE_AND_SCAN_CLOSED" in a
          assert "STATUS DEEP_PREFIX_COAL_PREDQ7_SIEVE_AND_SCAN_CLOSED" in b
          assert "STATUS COMPACT_P28_COAL_PREDQ7_SCAN_CLOSED" in c
          ma=re.search(r"COALESCENCE_EXTRA_KILLED (\d+) PREDQ7_KILLED_AFTER_COALESCENCE (\d+) EXPLICIT (\d+)",a)
          mb=re.search(r"DEEP_PREFIX_LIVE (\d+) COALESCENCE_KILLED (\d+) PREDQ7_KILLED (\d+) EXPLICIT (\d+)",b)
          mc=re.search(r"COMPACT_P28_LIVE (\d+) COALESCENCE_KILLED (\d+) PREDQ7_KILLED (\d+) EXPLICIT (\d+)",c)
          assert ma and mb and mc,(a[-2000:],b[-2000:],c[-2000:])
          old=tuple(map(int,mb.groups()))
          compact=tuple(map(int,mc.groups()))
          assert compact==old,(old,compact)
          at=float(open("results/p24.time").read())
          bt=float(open("results/old.time").read())
          ct=float(open("results/compact.time").read())
          row={
            "k":k,
            "p24_explicit":int(ma.group(3)),
            "p28_explicit":old[3],
            "p24_seconds":at,
            "old_p28_seconds":bt,
            "compact_p28_seconds":ct,
            "compact_vs_old_speedup":bt/ct if ct else None,
            "compact_vs_p24_speedup":at/ct if ct else None,
          }
          print("COMPACT_P28_COMPARISON",json.dumps(row,separators=(",",":")))
          print("COMPACT_P28_EXACT_CONTROL_OK")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-p28-k${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: compact-p28-k*
          path: gathered
      - name: Aggregate compact p28 economics
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[]
          for d in sorted(Path("gathered").glob("compact-p28-k*")):
              c=(d/"compact.txt").read_text()
              k=int(re.search(r" k=(\d+) ",c).group(1))
              a=(d/"p24.txt").read_text()
              b=(d/"old.txt").read_text()
              ma=re.search(r"COALESCENCE_EXTRA_KILLED (\d+) PREDQ7_KILLED_AFTER_COALESCENCE (\d+) EXPLICIT (\d+)",a)
              mb=re.search(r"DEEP_PREFIX_LIVE (\d+) COALESCENCE_KILLED (\d+) PREDQ7_KILLED (\d+) EXPLICIT (\d+)",b)
              mc=re.search(r"COMPACT_P28_LIVE (\d+) COALESCENCE_KILLED (\d+) PREDQ7_KILLED (\d+) EXPLICIT (\d+)",c)
              assert ma and mb and mc and tuple(mb.groups())==tuple(mc.groups())
              at=float((d/"p24.time").read_text())
              bt=float((d/"old.time").read_text())
              ct=float((d/"compact.time").read_text())
              rows.append({
                "k":k,"p24_explicit":int(ma.group(3)),"p28_explicit":int(mc.group(4)),
                "p24_seconds":at,"old_p28_seconds":bt,"compact_p28_seconds":ct,
                "compact_vs_old_speedup":bt/ct if ct else None,
                "compact_vs_p24_speedup":at/ct if ct else None,
              })
          assert len(rows)==3,rows
          out={"kind":"compact_p28_consequence_language_production","rows":sorted(rows,key=lambda x:-x["k"])}
          Path("compact-p28-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("COMPACT_P28_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: compact-p28-field
          path: compact-p28-field.json
          retention-days: 30
