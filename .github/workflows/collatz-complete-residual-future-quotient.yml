name: Collatz complete residual future quotient

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-complete-residual-future-quotient.yml"
      - "experiments/collatz_complete_residual_future_quotient.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-complete-residual-future-quotient
  cancel-in-progress: true

jobs:
  quotient:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        k: [20,22,24]
    name: quotient-b${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and minimize
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -march=native -std=c++20 experiments/collatz_complete_residual_future_quotient.cpp -o /tmp/q
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/q ${{ matrix.k }} | tee results/census.txt
          grep -q "VERIFIED_COMPLETE_RESIDUAL_FUTURE_QUOTIENT" results/census.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-residual-future-b${{ matrix.k }}
          path: results
          retention-days: 30
