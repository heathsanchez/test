name: Collatz complete reverse grammar

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-complete-reverse-grammar.yml"
      - "experiments/collatz_complete_reverse_grammar.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-complete-reverse-grammar
  cancel-in-progress: true

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        k: [24,26,28]
    name: complete-b${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate q14 bridge bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY

      - name: Exhaust complete infinite E O language
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20 experiments/collatz_complete_reverse_grammar.cpp -o /tmp/complete
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/complete ${{ matrix.k }} results/q14-bank.txt | tee results/census.txt
          grep -q "VERIFIED_COMPLETE_FINITE_REVERSE_EO_GRAMMAR" results/census.txt

      - name: Score exact complete grammar
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          K=int("${{ matrix.k }}")
          deep_o={24:238727,26:837599,28:2741655}
          h16={24:173280,26:604877,28:1984609}
          frozen={24:173280,26:605265,28:1986750}
          s=Path("results/census.txt").read_text()
          m=re.search(
              rf"COMPLETE_REVERSE_GRAMMAR_DONE K={K} final_live=(\d+) "
              r"total_descent=(\d+) total_bridge=(\d+) total_deep_o=(\d+) "
              r"total_grammar=(\d+) search_nodes=(\d+) memo_hits=(\d+) "
              r"e_cases=(\d+) o_run_cases=(\d+) coefficient_prunes=(\d+) "
              r"max_nodes_one_family=(\d+) max_blocks=(\d+) max_word_steps=(\d+) "
              r"controls=(\d+)",s)
          assert m,s[-8000:]
          vals=list(map(int,m.groups()))
          (live,des,bridge,deepo,grammar,nodes,memo,e,o,prunes,mx,blocks,steps,controls)=vals
          denom=deep_o[K]-h16[K]
          gain=deep_o[K]-live
          out={
              "kind":"complete_reverse_grammar",
              "K":K,
              "complete_live":live,
              "deep_o_baseline_live":deep_o[K],
              "H16_live":h16[K],
              "frozen_B24_live":frozen[K],
              "gain_vs_deep_o":gain,
              "fraction_of_H16_gain":gain/denom,
              "delta_vs_H16_live":live-h16[K],
              "delta_vs_frozen_live":live-frozen[K],
              "grammar_closures":grammar,
              "search_nodes":nodes,
              "memo_hits":memo,
              "max_nodes_one_family":mx,
              "max_blocks":blocks,
              "max_word_steps":steps,
              "controls":controls,
          }
          Path("results/summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print("COMPLETE_REVERSE_GRAMMAR_FIELD",json.dumps(out,separators=(",",":")))
          assert live<=deep_o[K]
          # Complete grammar contains every H16 continuation word from the
          # same retained bridge, so it cannot close fewer families than H16.
          assert live<=h16[K],(K,live,h16[K])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-reverse-grammar-b${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: complete
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: complete-reverse-grammar-b*
          path: gathered
      - name: Aggregate exact complete grammar
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("complete-reverse-grammar-b*"):
              p=d/"summary.json"; assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda r:r["K"])
          assert [r["K"] for r in rows]==[24,26,28],rows
          out={"kind":"complete_reverse_grammar_curve","rows":rows}
          Path("complete-reverse-grammar-field.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("COMPLETE_REVERSE_GRAMMAR_CURVE",json.dumps(out,separators=(",",":"),sort_keys=True))
          print("VERIFIED_COMPLETE_REVERSE_GRAMMAR_CURVE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: complete-reverse-grammar-field
          path: complete-reverse-grammar-field.json
          retention-days: 30
