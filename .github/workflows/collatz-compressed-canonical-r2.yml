name: Collatz compressed canonical R2

on:
  push:
    branches: [collatz-valuation-quotient-v1]
    paths:
      - ".github/workflows/collatz-compressed-canonical-r2.yml"
      - "experiments/collatz_compressed_canonical_r2.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-compressed-canonical-r2
  cancel-in-progress: true

jobs:
  compressed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { depth: 12, validate: 12 }
          - { depth: 16, validate: 12 }
          - { depth: 18, validate: 12 }
          - { depth: 20, validate: 12 }
          - { depth: 22, validate: 12 }
    name: compressed-d${{ matrix.depth }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_compressed_canonical_r2.cpp -o /tmp/compressed
      - name: Run exact compressed compiler
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/compressed ${{ matrix.depth }} ${{ matrix.validate }}             | tee results/census.txt
          grep -q "VERIFIED_COMPRESSED_CANONICAL_R2_THROUGH_D${{ matrix.validate }}" results/census.txt
          grep -q "FINAL_GATE=COMPRESSED_CANONICAL_R2_D${{ matrix.depth }}_V${{ matrix.validate }}" results/census.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compressed-d${{ matrix.depth }}
          path: results
          retention-days: 30
