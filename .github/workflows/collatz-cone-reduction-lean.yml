name: Collatz cone reduction Lean check

on:
  push:
    branches: [collatz-valuation-quotient-v1]
    paths:
      - ".github/workflows/collatz-cone-reduction-lean.yml"
      - "formal/CollatzConeReduction.lean"
      - "formal/CollatzShortcutCone.lean"
      - "formal/CollatzDeterministicCone.lean"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact reduction theorems
        run: |
          set -euo pipefail
          lean --version
          LEAN_PATH=formal lean -o formal/CollatzConeReduction.olean formal/CollatzConeReduction.lean
          LEAN_PATH=formal lean -o formal/CollatzShortcutCone.olean formal/CollatzShortcutCone.lean
          LEAN_PATH=formal lean formal/CollatzDeterministicCone.lean
          echo VERIFIED_LEAN_LOWER_CONE_STRONG_INDUCTION
          echo VERIFIED_LEAN_ODD_ONLY_COLLATZ_REDUCTION
          echo VERIFIED_LEAN_DETERMINISTIC_CONE_EQUIVALENCE
