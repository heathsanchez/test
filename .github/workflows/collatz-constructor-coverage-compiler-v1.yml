name: Collatz Constructor Coverage Compiler V1
on:
  push:
    branches: [collatz-constructor-coverage-compiler-v1]
    paths:
      - 'experiments/collatz_constructor_coverage_compiler_v1.py'
      - '.github/workflows/collatz-constructor-coverage-compiler-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile exact lower-source constructors
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-constructor-coverage-compiler-v1
          git rev-parse HEAD > evidence/collatz-constructor-coverage-compiler-v1/commit.txt
          python -u experiments/collatz_constructor_coverage_compiler_v1.py             | tee evidence/collatz-constructor-coverage-compiler-v1/result.json
          grep -q '"status": "BOUNDED_CONSTRUCTOR_COVERAGE_WITH_RECORD_SETTER_RESIDUAL"'             evidence/collatz-constructor-coverage-compiler-v1/result.json
          grep -q '"global_collatz": "UNKNOWN"'             evidence/collatz-constructor-coverage-compiler-v1/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-constructor-coverage-compiler-v1
          path: evidence/collatz-constructor-coverage-compiler-v1
          if-no-files-found: error
