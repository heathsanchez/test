name: Collatz Constructor Coverage Q18 Residual V1
on:
  push:
    branches: [collatz-constructor-coverage-q18-v1]
    paths:
      - 'experiments/collatz_constructor_coverage_q18_residual_v1.py'
      - '.github/workflows/collatz-constructor-coverage-q18-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit Q18 protected residual
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-constructor-coverage-q18-v1
          git rev-parse HEAD > evidence/collatz-constructor-coverage-q18-v1/commit.txt
          python -u experiments/collatz_constructor_coverage_q18_residual_v1.py             | tee evidence/collatz-constructor-coverage-q18-v1/result.json
          grep -q '"status": "Q18_PROTECTED_RESIDUAL_AUDIT"'             evidence/collatz-constructor-coverage-q18-v1/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-constructor-coverage-q18-v1
          path: evidence/collatz-constructor-coverage-q18-v1
          if-no-files-found: error
