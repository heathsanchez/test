name: Collatz coupled DAG v1
on:
  push:
    branches: [collatz-coupled-dag-v1]
    paths:
      - 'experiments/collatz_coupled_dag_v1.py'
      - '.github/workflows/collatz-coupled-dag-v1.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact coupled DAG probe
        run: python experiments/collatz_coupled_dag_v1.py --depth 12
