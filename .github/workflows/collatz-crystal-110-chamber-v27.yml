name: Collatz Crystal 110 Chamber V27

on:
  push:
    branches: [collatz-crystal-110-chamber-v27]
    paths:
      - 'experiments/collatz_crystal_110_chamber_v27.py'
      - '.github/workflows/collatz-crystal-110-chamber-v27.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Qualify V26 adversary against 12/19 chamber
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-110-chamber-v27
          python -u experiments/collatz_crystal_110_chamber_v27.py \
            | tee evidence/collatz-crystal-110-chamber-v27/result.json
          python - <<'PY'
          import json
          p='evidence/collatz-crystal-110-chamber-v27/result.json'
          d=json.load(open(p))
          assert d['schema']=='COLLATZ_CRYSTAL_110_CHAMBER_V27'
          a=d['trajectory_audit']
          assert a['first_lower_source_predecessor'] is None
          assert a['closest_reverse_predecessor']['source_gap'] > 0
          assert a['first_existing_exit']['kind']=='S'
          assert a['first_existing_exit']['ordinary_depth']==525
          assert d['global_collatz']=='UNKNOWN'
          print('V27_CLOSEST_GAP', a['closest_reverse_predecessor']['source_gap'])
          print('V27_FIRST_EXIT', a['first_existing_exit'])
          print('V27_VERDICT', d['scientific_verdict'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-110-chamber-v27
          path: evidence/collatz-crystal-110-chamber-v27
          if-no-files-found: error
