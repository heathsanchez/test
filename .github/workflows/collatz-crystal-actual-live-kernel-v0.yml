name: Collatz Crystal actual live kernel V0
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_crystal_actual_live_kernel_v0.py'
      - 'experiments/collatz_crystal_future_quotient_v1.py'
      - '.github/workflows/collatz-crystal-actual-live-kernel-v0.yml'
permissions: {contents: read}
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          cd experiments
          python -u collatz_crystal_actual_live_kernel_v0.py | tee /tmp/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-actual-live-kernel-v0
          path: /tmp/result.txt
