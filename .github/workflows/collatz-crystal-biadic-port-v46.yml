name: Collatz Crystal Biadic Port V46

on:
  push:
    branches: [collatz-crystal-biadic-port-v46]
    paths:
      - 'experiments/collatz_crystal_biadic_port_v46.py'
      - 'experiments/collatz_crystal_nearest_centre_v45.py'
      - '.github/workflows/collatz-crystal-biadic-port-v46.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  biadic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compose nearest-centre and dyadic-port state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-biadic-port-v46
          python experiments/collatz_crystal_biadic_port_v46.py \
            | tee evidence/collatz-crystal-biadic-port-v46/result.json
          grep -q '"schema": "COLLATZ_CRYSTAL_BIADIC_PORT_V46"' \
            evidence/collatz-crystal-biadic-port-v46/result.json
          git rev-parse HEAD \
            | tee evidence/collatz-crystal-biadic-port-v46/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-biadic-port-v46
          path: evidence/collatz-crystal-biadic-port-v46
          if-no-files-found: error
