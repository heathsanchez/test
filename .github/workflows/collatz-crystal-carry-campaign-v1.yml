name: Collatz Crystal Carry Campaign V1
on:
  push:
    branches: [collatz-crystal-carry-campaign-v1]
    paths: ['experiments/collatz_crystal_carry_campaign_v1.py','experiments/test_collatz_crystal_carry_campaign_v1.py','.github/workflows/collatz-crystal-carry-campaign-v1.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Campaign tests
        run: python -m unittest experiments/test_collatz_crystal_carry_campaign_v1.py -v
      - name: Stateful Crystal cycles
        run: |
          mkdir -p evidence/collatz-crystal-carry-campaign-v1
          python -u experiments/collatz_crystal_carry_campaign_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/result.json
          python -u experiments/collatz_crystal_macro_productivity_adaptive_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/productivity.json
          python -u experiments/collatz_crystal_equality_credit_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/equality-credit.json
          python -u experiments/collatz_crystal_two_equality_symbolic_v0.py | tee evidence/collatz-crystal-carry-campaign-v1/two-equality-symbolic.json
          python -u experiments/collatz_crystal_two_equality_integer_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/two-equality-integer.json
          python -u experiments/collatz_crystal_carry_realization_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/carry-realization.json
          python -u experiments/collatz_crystal_equality_local_law_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/equality-local-law.json
          python -u experiments/collatz_crystal_language_equality_id_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/language-equality-id.json
          python -u experiments/collatz_crystal_equality_id_refined_v2.py | tee evidence/collatz-crystal-carry-campaign-v1/equality-id-refined.json
          python -u experiments/collatz_crystal_fixed_origin_hit_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/fixed-origin-hit.json
          python -u experiments/collatz_crystal_origin_separator_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/origin-separator.json
          python -u experiments/collatz_crystal_singleton_residual_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/singleton-residual.json
          python -u experiments/collatz_crystal_singleton_theorem_falsifier_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/singleton-theorem.json
          python -u experiments/collatz_crystal_singleton_affine_margin_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/singleton-affine-margin.json
          python -u experiments/collatz_crystal_deficit_one_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/deficit-one.json
          python -u experiments/collatz_crystal_fixed_source_map_bank_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/fixed-source-map-bank.json
          python -u experiments/collatz_crystal_global_map_bank_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/global-map-bank.json
          python -u experiments/collatz_crystal_predecessor_gap_v1.py | tee evidence/collatz-crystal-carry-campaign-v1/predecessor-gap.json
          git rev-parse HEAD > evidence/collatz-crystal-carry-campaign-v1/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-carry-campaign-v1
          path: evidence/collatz-crystal-carry-campaign-v1
          if-no-files-found: error
