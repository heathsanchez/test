name: Collatz Crystal Carry Excursion Affine V1

on:
  push:
    branches: [collatz-crystal-carry-excursion-affine-v1]
    paths:
      - 'experiments/collatz_crystal_carry_excursion_affine_v1.py'
      - 'experiments/collatz_crystal_carry_excursion_center_v1.py'
      - '.github/workflows/collatz-crystal-carry-excursion-affine-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact carry-excursion Crystal audits
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-carry-excursion-affine-v1
          git rev-parse HEAD > evidence/collatz-crystal-carry-excursion-affine-v1/commit.txt

          python -u experiments/collatz_crystal_carry_excursion_center_v1.py \
            | tee evidence/collatz-crystal-carry-excursion-affine-v1/center.json
          grep -q '"status": "BOUNDED_SINGLE_EXCURSION_CENTER_SEPARATOR_SURVIVES"' \
            evidence/collatz-crystal-carry-excursion-affine-v1/center.json

          python -u experiments/collatz_crystal_carry_excursion_affine_v1.py \
            | tee evidence/collatz-crystal-carry-excursion-affine-v1/cycles.json
          grep -q '"status": "BOUNDED_AFFINE_CYCLE_SEPARATOR_SURVIVES"' \
            evidence/collatz-crystal-carry-excursion-affine-v1/cycles.json
          grep -q '"global_collatz": "UNKNOWN"' \
            evidence/collatz-crystal-carry-excursion-affine-v1/cycles.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-carry-excursion-affine-v1
          path: evidence/collatz-crystal-carry-excursion-affine-v1
          if-no-files-found: error
          retention-days: 90
