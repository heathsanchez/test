name: Collatz Crystal Consequence Quotient V1
on:
  push:
    branches: [collatz-crystal-consequence-quotient-v1]
    paths:
      - 'experiments/collatz_crystal_consequence_quotient_v1.py'
      - '.github/workflows/collatz-crystal-consequence-quotient-v1.yml'
permissions: {contents: read}
jobs:
  crystal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -u experiments/collatz_crystal_consequence_quotient_v1.py | tee result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-crystal-consequence-quotient-v1
          path: result.json
