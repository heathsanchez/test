name: Collatz Crystal Cost-Aware Chamber V27

on:
  push:
    branches: [collatz-crystal-cost-aware-chamber-v27]
    paths:
      - 'experiments/collatz_crystal_cost_aware_chamber_v27.py'
      - '.github/workflows/collatz-crystal-cost-aware-chamber-v27.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Qualify cost-aware chamber and V26 exit
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-cost-aware-chamber-v27
          python -u experiments/collatz_crystal_cost_aware_chamber_v27.py \
            | tee evidence/collatz-crystal-cost-aware-chamber-v27/result.json
          python - <<'PY'
          import json
          p='evidence/collatz-crystal-cost-aware-chamber-v27/result.json'
          d=json.load(open(p))
          assert d['schema']=='COLLATZ_CRYSTAL_COST_AWARE_CHAMBER_V27'
          c=d['cost_aware_chamber']
          assert c['identity_contexts']==27469
          assert c['recurrent_identity_sccs']==1
          assert c['largest_recurrent_identity_scc']==3302
          z=d['corridor_110_minus5']
          assert z['best_cost']==18
          assert z['in_recurrent_identity_scc'] is True
          e=d['v26_natural_adversary']['first_simple_ordinary_exit']
          assert e['kind']=='M1'
          assert e['depth']==518
          assert e['lower_source'] < d['v26_natural_adversary']['source']
          assert d['global_collatz']=='UNKNOWN'
          print('V27_SCC', c['largest_recurrent_identity_scc'])
          print('V27_110', z)
          print('V27_EXIT', e)
          print('V27_NEXT', d['next_residual'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-cost-aware-chamber-v27
          path: evidence/collatz-crystal-cost-aware-chamber-v27
          if-no-files-found: error
