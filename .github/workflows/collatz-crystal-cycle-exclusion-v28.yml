name: Collatz Crystal Cycle Exclusion V28

on:
  push:
    branches: [collatz-crystal-cycle-exclusion-v28]
    paths:
      - 'experiments/collatz_crystal_cycle_exclusion_v28.py'
      - '.github/workflows/collatz-crystal-cycle-exclusion-v28.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Certify recurrent cycle weights
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-cycle-exclusion-v28
          PYTHONPATH=experiments python -u experiments/collatz_crystal_cycle_exclusion_v28.py \
            | tee evidence/collatz-crystal-cycle-exclusion-v28/result.json
          python - <<'PY'
          import json
          p='evidence/collatz-crystal-cycle-exclusion-v28/result.json'
          d=json.load(open(p))
          assert d['schema']=='COLLATZ_CRYSTAL_CYCLE_EXCLUSION_V28'
          c=d['cycle_weight_certificate']
          assert d['recurrent_identity_scc']['states']==3302
          assert c['all_reduced_costs_nonnegative'] is True
          assert c['sharp_ratio']=='q/k = 12/19'
          assert d['coefficient_consequence']['eventually_periodic_positive_natural_tail']=='EXCLUDED'
          assert d['global_collatz']=='UNKNOWN'
          print('V28_SCC',d['recurrent_identity_scc'])
          print('V28_CYCLE_CERT',c)
          print('V28_CONSEQUENCE',d['coefficient_consequence'])
          print('V28_NEXT',d['next_residual'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-cycle-exclusion-v28
          path: evidence/collatz-crystal-cycle-exclusion-v28
          if-no-files-found: error
