name: Collatz Crystal Dynamic Owner Separator V43

on:
  push:
    branches: [collatz-crystal-dynamic-owner-separator-v43]
    paths:
      - 'experiments/collatz_crystal_dynamic_owner_separator_v43.py'
      - 'experiments/collatz_crystal_phase_normalized_return_v40.py'
      - 'experiments/collatz_crystal_parameter_quotient_v25.py'
      - '.github/workflows/collatz-crystal-dynamic-owner-separator-v43.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dynamic owner/carry separator and held-out challenge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-dynamic-owner-separator-v43
          python experiments/collatz_crystal_dynamic_owner_separator_v43.py \
            | tee evidence/collatz-crystal-dynamic-owner-separator-v43/result.json
          grep -q '"schema": "COLLATZ_CRYSTAL_DYNAMIC_OWNER_SEPARATOR_V43"' \
            evidence/collatz-crystal-dynamic-owner-separator-v43/result.json
          git rev-parse HEAD \
            | tee evidence/collatz-crystal-dynamic-owner-separator-v43/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-dynamic-owner-separator-v43
          path: evidence/collatz-crystal-dynamic-owner-separator-v43
          if-no-files-found: error
