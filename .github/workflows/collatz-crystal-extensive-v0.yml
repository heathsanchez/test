name: Collatz Crystal extensive V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_crystal_extensive_v0.py'
      - '.github/workflows/collatz-crystal-extensive-v0.yml'
  workflow_dispatch:
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Crystal-style Collatz campaign
        run: |
          mkdir -p evidence/collatz-crystal-extensive-v0
          python experiments/collatz_crystal_extensive_v0.py | tee evidence/collatz-crystal-extensive-v0/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-extensive-v0
          path: evidence/collatz-crystal-extensive-v0
          if-no-files-found: error
