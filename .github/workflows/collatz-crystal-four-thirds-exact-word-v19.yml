name: Collatz Crystal Four Thirds Exact Word V19

on:
  push:
    branches: [collatz-crystal-four-thirds-exact-word-v19, collatz-crystal-four-thirds-constructor-v20]
    paths:
      - 'formal/Collatz/FourThirdsAdmission.lean'
      - 'formal/Collatz/FourThirdsConstructor.lean'
      - 'lakefile.lean'
      - 'experiments/collatz_crystal_four_thirds_exact_word_v19.py'
      - 'experiments/collatz_crystal_four_thirds_constructor_v20.cpp'
      - '.github/workflows/collatz-crystal-four-thirds-exact-word-v19.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Recheck V18 affine admission authority
        run: |
          set -euo pipefail
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' formal/Collatz/FourThirdsAdmission.lean
          lake build CollatzFinal
          lake env lean -DautoImplicit=false formal/Collatz/FourThirdsAdmission.lean | tee /tmp/v19-lean.log
          ! grep -E 'sorryAx|Lean.ofReduceBool' /tmp/v19-lean.log

      - name: Run exact-word consequence prune
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-four-thirds-exact-word-v19
          python -u experiments/collatz_crystal_four_thirds_exact_word_v19.py             | tee evidence/collatz-crystal-four-thirds-exact-word-v19/result.json
          python - <<'PY'
          import json
          d=json.load(open('evidence/collatz-crystal-four-thirds-exact-word-v19/result.json'))
          assert d['declared_boundary']['source_census'] is False
          assert d['declared_boundary']['post_boundary_trajectory_search'] is False
          assert d['declared_boundary']['near_resonant_types']==315
          assert d['raw_candidate_endpoints']==114495
          assert d['bias_envelope_rejections']==2
          assert d['candidate_endpoints']==114493
          assert d['exact_bias_words']==0
          assert d['failure_counts']=={
            'B_NONPOS':2,
            'POSITION_GE_K':10,
            'RESIDUAL':10,
            'TERM_GT_B':114471,
          }
          assert d['generic_q52_plus_all_TERM_GT_B_on_declared_boundary'] is True
          assert d['max_TERM_GT_B_peel_step']==68
          assert d['next_residual']['universal']=='UNKNOWN'
          assert d['next_residual']['survival_branch_still_open'] is True
          assert d['global_collatz']=='UNKNOWN'
          print('V19_CANDIDATES',d['candidate_endpoints'])
          print('V19_EXACT_WORDS',d['exact_bias_words'])
          print('V19_FAILURES',d['failure_counts'])
          print('V19_EXCEPTIONS',d['exceptional_non_TERM_GT_B_types'])
          print('V19_MAX_PEEL',d['max_TERM_GT_B_peel_step'],d['max_TERM_GT_B_witness'])
          print('V19_RESIDUAL',d['next_residual'])
          PY

      - name: Run V20 source-ordered constructor compiler
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-four-thirds-constructor-v20
          g++ -O3 -std=c++17 experiments/collatz_crystal_four_thirds_constructor_v20.cpp -o /tmp/v20
          /tmp/v20 | tee evidence/collatz-crystal-four-thirds-constructor-v20/result.json
          python - <<'PY'
          import json
          d=json.load(open('evidence/collatz-crystal-four-thirds-constructor-v20/result.json'))
          assert d['tested_odd_sources']==524287
          assert d['direct_exit_sources']==85143
          assert d['quarter_splice_sources']==237022
          assert d['weighted_lower_merge_sources']==202122
          assert d['budget_violations']==0
          assert d['censored']==0
          assert d['bounded_v20_residual']==0
          assert d['universal_status']=='UNKNOWN'
          assert d['global_collatz']=='UNKNOWN'
          print('V20_CONSTRUCTORS',d['direct_exit_sources'],d['quarter_splice_sources'],d['weighted_lower_merge_sources'])
          print('V20_CLASSES',d['minimal_bad_source_classes'])
          print('V20_RESIDUAL',d['bounded_v20_residual'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: collatz-crystal-four-thirds-exact-word-v19
          path: evidence/collatz-crystal-four-thirds-exact-word-v19
