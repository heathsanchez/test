name: Collatz Crystal future quotient V1
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_crystal_future_quotient_v1.py'
      - 'experiments/test_collatz_crystal_future_quotient_v1.py'
      - 'experiments/test_collatz_crystal_separator_refinement_v1.py'
      - '.github/workflows/collatz-crystal-future-quotient-v1.yml'
      - 'formal/Collatz/CrystalFutureCertificate.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Future quotient tests
        run: |
          cd experiments
          python -m unittest -v test_collatz_crystal_future_quotient_v1.py test_collatz_crystal_separator_refinement_v1.py
      - name: Replay qualified Collatz future separator
        run: |
          python experiments/collatz_stateful_future_kernel_v0.py --lo 3 --hi 8191 --K 128 --output /tmp/future.json >/tmp/future.log
          python -c "import json;d=json.load(open('/tmp/future.json'));assert d['representations']['CONTROL']['future_kernel_classes']>0;assert d['representations']['V3_VECTOR']['future_kernel_classes']==0;assert len(d['incomplete_sources'])==0;print('PASS_BOUNDED_V3_SEPARATOR_REPLAY')"
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Crystal finite certificate Lean gate
        run: |
          if command -v lake >/dev/null 2>&1; then
            lake env lean formal/Collatz/CrystalFutureCertificate.lean
          else
            echo "lake unavailable"; exit 1
          fi
      - name: Reject universal promotion without proof authorities
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/collatz-crystal-future-quotient-v1/result.json')
          if p.exists():
              d=json.loads(p.read_text())
              if d.get('status') == 'UNIVERSAL_RANK_CERTIFIED':
                  assert d.get('normalization_authority')
                  assert d.get('progress_authority')
          PY
