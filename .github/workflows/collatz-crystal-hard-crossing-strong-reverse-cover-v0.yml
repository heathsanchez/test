name: Collatz Crystal hard-crossing strong reverse cover
on:
  push:
    branches: [collatz-crystal-zero-loss-tail-v1]
jobs:
  cover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -u experiments/collatz_crystal_hard_crossing_strong_reverse_cover_v0.py | tee /tmp/out.json
      - uses: actions/upload-artifact@v4
        with: {name: collatz-crystal-hard-crossing-strong-reverse-cover-v0, path: /tmp/out.json}
