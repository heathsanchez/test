name: Collatz Crystal K Density Tradeoff V32

on:
  push:
    branches: [collatz-crystal-k-density-tradeoff-v32]
    paths:
      - 'experiments/collatz_crystal_k_density_tradeoff_v32.py'
      - '.github/workflows/collatz-crystal-k-density-tradeoff-v32.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Certify K-density tradeoff
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-k-density-tradeoff-v32
          python -u experiments/collatz_crystal_k_density_tradeoff_v32.py \
            | tee evidence/collatz-crystal-k-density-tradeoff-v32/result.json
          python - <<'PY'
          import json
          p='evidence/collatz-crystal-k-density-tradeoff-v32/result.json'
          d=json.load(open(p))
          assert d['schema']=='COLLATZ_CRYSTAL_K_DENSITY_TRADEOFF_V32'
          assert d['graph']['states']==27469
          assert d['graph']['non_B_edges']==38991
          assert d['tradeoff_certificate']['cycle_inequality']=='19*q - 12*k + 19*D >= 0'
          assert d['sharpness']['coefficient_18_rejected'] is True
          assert d['sharpness']['cycle_length']==49
          assert d['sharpness']['odd_steps']==29
          assert d['sharpness']['K_drop']==2
          assert d['sharpness']['weight_c18']==-1
          assert d['sharpness']['weight_c19']==1
          assert d['global_collatz']=='UNKNOWN'
          print('V32_TRADEOFF',d['tradeoff_certificate'])
          print('V32_SHARP',d['sharpness'])
          print('V32_NEXT',d['next_residual'])
          print('V32_CERT',d['certificate_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-k-density-tradeoff-v32
          path: evidence/collatz-crystal-k-density-tradeoff-v32
          if-no-files-found: error
