name: Collatz Crystal K Rewind V31

on:
  push:
    branches: [collatz-crystal-k-rewind-v31]
    paths:
      - 'experiments/collatz_crystal_k_rewind_v31.py'
      - '.github/workflows/collatz-crystal-k-rewind-v31.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Certify complete K rewind alphabet
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-k-rewind-v31
          python -u experiments/collatz_crystal_k_rewind_v31.py \
            | tee evidence/collatz-crystal-k-rewind-v31/result.json
          python - <<'PY'
          import json
          p='evidence/collatz-crystal-k-rewind-v31/result.json'
          d=json.load(open(p))
          assert d['schema']=='COLLATZ_CRYSTAL_K_REWIND_V31'
          assert d['chamber']['contexts']==27469
          assert d['chamber']['K_transitions']==4282
          assert d['lower_cost_rewinds']['count']==3832
          assert d['same_cost_rewinds']['count']==450
          assert d['strict_rewind_certificate']['endpoint_floor']==86
          assert d['lower_cost_rewinds']['cost_drop_histogram']=={
              '1':3702,'2':107,'3':13,'4':9,'5':1}
          assert d['same_cost_rewinds']['delta_histogram']=={
              '2':369,'4':66,'6':6,'8':9}
          assert d['universal_status']=='UNKNOWN'
          assert d['global_collatz']=='UNKNOWN'
          print('V31_K',d['chamber'])
          print('V31_LOWER',d['lower_cost_rewinds'])
          print('V31_SAME',d['same_cost_rewinds'])
          print('V31_STRICT',d['strict_rewind_certificate'])
          print('V31_NEXT',d['next_residual'])
          print('V31_CERT',d['certificate_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-k-rewind-v31
          path: evidence/collatz-crystal-k-rewind-v31
          if-no-files-found: error
