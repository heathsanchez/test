name: Collatz Crystal Nearest Centre V45

on:
  push:
    branches: [collatz-crystal-nearest-centre-v45]
    paths:
      - 'experiments/collatz_crystal_nearest_centre_v45.py'
      - 'experiments/collatz_crystal_owner8_prospective_v44.py'
      - 'experiments/collatz_crystal_dynamic_owner_separator_v43.py'
      - '.github/workflows/collatz-crystal-nearest-centre-v45.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  centre:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Nearest-centre residual diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-nearest-centre-v45
          python experiments/collatz_crystal_nearest_centre_v45.py \
            | tee evidence/collatz-crystal-nearest-centre-v45/result.json
          grep -q '"schema": "COLLATZ_CRYSTAL_NEAREST_CENTRE_V45"' \
            evidence/collatz-crystal-nearest-centre-v45/result.json
          git rev-parse HEAD \
            | tee evidence/collatz-crystal-nearest-centre-v45/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-nearest-centre-v45
          path: evidence/collatz-crystal-nearest-centre-v45
          if-no-files-found: error
