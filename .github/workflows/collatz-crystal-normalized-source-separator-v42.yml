name: Collatz Crystal Normalized Source Separator V42

on:
  push:
    branches: [collatz-crystal-normalized-source-separator-v42]
    paths:
      - 'experiments/collatz_crystal_normalized_source_separator_v42.py'
      - 'experiments/collatz_crystal_phase_normalized_return_v40.py'
      - 'experiments/collatz_crystal_parameter_quotient_v25.py'
      - 'experiments/collatz_q0_rigid_recharge_audit.py'
      - 'experiments/collatz_q0_coalescence_component_audit.py'
      - '.github/workflows/collatz-crystal-normalized-source-separator-v42.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fit on train motifs and test held-out motifs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-normalized-source-separator-v42
          python experiments/collatz_crystal_normalized_source_separator_v42.py \
            | tee evidence/collatz-crystal-normalized-source-separator-v42/result.json
          grep -q '"schema": "COLLATZ_CRYSTAL_NORMALIZED_SOURCE_SEPARATOR_V42"' \
            evidence/collatz-crystal-normalized-source-separator-v42/result.json
          git rev-parse HEAD | tee evidence/collatz-crystal-normalized-source-separator-v42/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-normalized-source-separator-v42
          path: evidence/collatz-crystal-normalized-source-separator-v42
          if-no-files-found: error
