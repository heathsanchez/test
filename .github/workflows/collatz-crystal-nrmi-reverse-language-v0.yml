name: Collatz Crystal NRMI reverse language
on:
  push:
    branches: [collatz-crystal-zero-loss-tail-v1]
jobs:
  nrmi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -u experiments/collatz_crystal_nrmi_reverse_language_v0.py | tee /tmp/out.json
      - uses: actions/upload-artifact@v4
        with: {name: collatz-crystal-nrmi-reverse-language-v0, path: /tmp/out.json}
