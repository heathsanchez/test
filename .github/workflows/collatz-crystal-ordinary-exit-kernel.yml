name: Collatz Crystal ordinary-exit kernel
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_crystal_ordinary_exit_kernel_v0.py'
      - '.github/workflows/collatz-crystal-ordinary-exit-kernel.yml'
permissions: {contents: read}
jobs:
  crystal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run actual-path protected-future kernel
        run: |
          set -euo pipefail
          cd experiments
          python collatz_crystal_ordinary_exit_kernel_v0.py --N 8191 --K 256 | tee /tmp/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-ordinary-exit-kernel
          path: /tmp/result.json
          if-no-files-found: error
