name: Collatz Crystal Origin Theorem Audit V1
on:
  push:
    branches: [collatz-crystal-origin-theorem-audit-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -u experiments/collatz_crystal_origin_theorem_audit_v1.py | tee result.json
      - uses: actions/upload-artifact@v4
        with: {name: collatz-crystal-origin-theorem-audit-v1, path: result.json}
