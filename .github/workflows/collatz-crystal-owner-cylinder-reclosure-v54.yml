name: Collatz Crystal owner cylinder reclosure V54

on:
  workflow_dispatch:
  push:
    branches:
      - collatz-crystal-owner-cylinder-reclosure-v54
    paths:
      - 'experiments/collatz_crystal_owner_cylinder_reclosure_v54.py'
      - 'experiments/test_collatz_crystal_owner_cylinder_reclosure_v54.py'
      - '.github/workflows/collatz-crystal-owner-cylinder-reclosure-v54.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest experiments/test_collatz_crystal_owner_cylinder_reclosure_v54.py -v
      - name: Exact depth-9 reclosure
        run: |
          mkdir -p evidence/collatz-crystal-owner-cylinder-reclosure-v54
          python experiments/collatz_crystal_owner_cylinder_reclosure_v54.py \
            --depth 9 --block-cap 128 \
            > evidence/collatz-crystal-owner-cylinder-reclosure-v54/result.json
      - name: Verify frozen residual and epistemic boundary
        run: |
          python - <<'PY'
          import json
          p='evidence/collatz-crystal-owner-cylinder-reclosure-v54/result.json'
          d=json.load(open(p))
          assert d['verdict']=='EXACT_CYLINDER_FRONTIER_SURVIVES'
          assert d['frontier']==64
          assert d['incremental_owner_closures']==0
          assert [g['count'] for g in d['residual_owner_groups']]==[61,3]
          assert d['universal_status']=='UNKNOWN'
          assert d['global_collatz']=='UNKNOWN'
          print('PASS_EXACT_NEGATIVE_RECLOSURE_GATE',d['certificate_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-crystal-owner-cylinder-reclosure-v54
          path: evidence/collatz-crystal-owner-cylinder-reclosure-v54/result.json
