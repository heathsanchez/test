name: Collatz Crystal Owner8 Prospective V44

on:
  push:
    branches: [collatz-crystal-owner8-prospective-v44]
    paths:
      - 'experiments/collatz_crystal_owner8_prospective_v44.py'
      - 'experiments/collatz_crystal_dynamic_owner_separator_v43.py'
      - 'experiments/collatz_crystal_phase_normalized_return_v40.py'
      - 'experiments/collatz_crystal_parameter_quotient_v25.py'
      - '.github/workflows/collatz-crystal-owner8-prospective-v44.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  prospective:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen owner8 prospective challenge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-owner8-prospective-v44
          python experiments/collatz_crystal_owner8_prospective_v44.py \
            | tee evidence/collatz-crystal-owner8-prospective-v44/result.json
          grep -q '"schema": "COLLATZ_CRYSTAL_OWNER8_PROSPECTIVE_V44"' \
            evidence/collatz-crystal-owner8-prospective-v44/result.json
          git rev-parse HEAD \
            | tee evidence/collatz-crystal-owner8-prospective-v44/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-owner8-prospective-v44
          path: evidence/collatz-crystal-owner8-prospective-v44
          if-no-files-found: error
