name: Collatz Crystal Paired Source Order V37b

on:
  push:
    branches: [collatz-crystal-biadic-ranked-normalization-v37]
    paths:
      - 'experiments/collatz_crystal_paired_source_order_v37b.py'
      - '.github/workflows/collatz-crystal-paired-source-order-v37b.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact paired-family source-order search
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-paired-source-order-v37b
          python -u experiments/collatz_crystal_paired_source_order_v37b.py \
            | tee evidence/collatz-crystal-paired-source-order-v37b/result.json
          python - <<'PY'
          import json
          d=json.load(open('evidence/collatz-crystal-paired-source-order-v37b/result.json'))
          assert d['schema']=='COLLATZ_CRYSTAL_PAIRED_SOURCE_ORDER_V37B'
          assert d['family']['factor']==6561
          assert d['universal_status']=='UNKNOWN'
          assert d['global_collatz']=='UNKNOWN'
          print('V37B_COUNTS',json.dumps(d['depth_counts'],sort_keys=True))
          print('V37B_EXITS',json.dumps(d['exit_totals'],sort_keys=True))
          print('V37B_LIVE',d['final_live_cells'])
          print('V37B_FIRST_LIVE',json.dumps(d['first_live_cells'][:20],sort_keys=True))
          print('V37B_VERDICT',d['scientific_verdict'])
          print('V37B_CERT',d['certificate_sha256'])
          PY
          git rev-parse HEAD > evidence/collatz-crystal-paired-source-order-v37b/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-paired-source-order-v37b
          path: evidence/collatz-crystal-paired-source-order-v37b
          if-no-files-found: error
