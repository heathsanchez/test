name: Collatz Crystal Phase Normalized Return V40

on:
  push:
    branches: [collatz-crystal-phase-normalized-return-v40]
    paths:
      - 'experiments/collatz_crystal_phase_normalized_return_v40.py'
      - 'experiments/collatz_q0_rigid_recharge_audit.py'
      - 'experiments/collatz_q0_coalescence_component_audit.py'
      - 'experiments/collatz_crystal_parameter_quotient_v25.py'
      - 'experiments/collatz_crystal_post_p36_adversary_v26.py'
      - '.github/workflows/collatz-crystal-phase-normalized-return-v40.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Phase-normalized same-anchor return audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-phase-normalized-return-v40
          python experiments/collatz_crystal_phase_normalized_return_v40.py \
            | tee evidence/collatz-crystal-phase-normalized-return-v40/result.json
          grep -q '"schema": "COLLATZ_CRYSTAL_PHASE_NORMALIZED_RETURN_V40"' \
            evidence/collatz-crystal-phase-normalized-return-v40/result.json
          git rev-parse HEAD | tee evidence/collatz-crystal-phase-normalized-return-v40/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-phase-normalized-return-v40
          path: evidence/collatz-crystal-phase-normalized-return-v40
          if-no-files-found: error
