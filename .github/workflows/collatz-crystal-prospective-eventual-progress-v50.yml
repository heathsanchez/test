name: Collatz Crystal Prospective Eventual Progress V50

on:
  push:
    branches: [collatz-crystal-prospective-eventual-progress-v50]
    paths:
      - 'experiments/collatz_crystal_prospective_eventual_progress_v50.py'
      - 'experiments/collatz_crystal_phase_normalized_return_v40.py'
      - 'experiments/collatz_crystal_paradoxical_return_audit_v45.py'
      - '.github/workflows/collatz-crystal-prospective-eventual-progress-v50.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  prospective:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prospective eventual-progress challenge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-prospective-eventual-progress-v50
          PYTHONPATH=experiments python experiments/collatz_crystal_prospective_eventual_progress_v50.py \
            | tee evidence/collatz-crystal-prospective-eventual-progress-v50/result.json
          python - <<'PY'
          import json
          p='evidence/collatz-crystal-prospective-eventual-progress-v50/result.json'
          d=json.load(open(p))
          assert d['schema']=='COLLATZ_CRYSTAL_PROSPECTIVE_EVENTUAL_PROGRESS_V50'
          assert d['global_collatz']=='UNKNOWN'
          print('V50_VERDICT', d['verdict'])
          print('V50_STATS', d['stats'])
          print('V50_MAX_WAIT', d['max_wait_returns'], d['max_wait_depth'])
          print('V50_MAX_RATIO', d['max_fixed_point_over_v23_floor'])
          print('V50_CERT', d['certificate_sha256'])
          PY
          git rev-parse HEAD \
            | tee evidence/collatz-crystal-prospective-eventual-progress-v50/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-prospective-eventual-progress-v50
          path: evidence/collatz-crystal-prospective-eventual-progress-v50
          if-no-files-found: error
