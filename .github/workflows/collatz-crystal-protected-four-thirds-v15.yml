name: Collatz Crystal Protected Four Thirds V15

on:
  push:
    branches: [collatz-crystal-protected-four-thirds-v15]
    paths:
      - 'formal/Collatz/ProtectedFourThirds.lean'
      - 'lakefile.lean'
      - '.github/workflows/collatz-crystal-protected-four-thirds-v15.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Qualify protected four-thirds semantics
        run: |
          set -euo pipefail
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' formal/Collatz/ProtectedFourThirds.lean
          lake build CollatzFinal
          lake env lean -DautoImplicit=false formal/Collatz/ProtectedFourThirds.lean | tee /tmp/protected.log
          ! grep -E 'sorryAx|Lean.ofReduceBool' /tmp/protected.log
