name: Collatz Crystal Return Defect Transport V54

on:
  push:
    branches: [collatz-crystal-return-defect-transport-v54]
    paths:
      - 'formal/Collatz/ReturnDefectTransport.lean'
      - 'formal/Collatz/AffineBudget.lean'
      - 'lakefile.lean'
      - '.github/workflows/collatz-crystal-return-defect-transport-v54.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Qualify return defect transport algebra
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-return-defect-transport-v54
          lake env lean --version | tee evidence/collatz-crystal-return-defect-transport-v54/toolchain.txt
          lake build CollatzFinal
          f=formal/Collatz/ReturnDefectTransport.lean
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' "$f"; then
            echo "Forbidden source token in $f" >&2
            exit 1
          fi
          lake env lean -DautoImplicit=false "$f" \
            | tee evidence/collatz-crystal-return-defect-transport-v54/ReturnDefectTransport.lean.log
          grep -q "returnDefect_transport" evidence/collatz-crystal-return-defect-transport-v54/ReturnDefectTransport.lean.log
          grep -q "returnDefect_self_scale" evidence/collatz-crystal-return-defect-transport-v54/ReturnDefectTransport.lean.log
          grep -q "returnInjection_self" evidence/collatz-crystal-return-defect-transport-v54/ReturnDefectTransport.lean.log
          ! grep -E 'sorryAx|Lean.ofReduceBool' evidence/collatz-crystal-return-defect-transport-v54/ReturnDefectTransport.lean.log
          git rev-parse HEAD > evidence/collatz-crystal-return-defect-transport-v54/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-return-defect-transport-v54
          path: evidence/collatz-crystal-return-defect-transport-v54
          if-no-files-found: error
