name: Collatz Crystal Return Phase Separator V44

on:
  push:
    branches: [collatz-crystal-return-phase-separator-v44]
    paths:
      - 'experiments/collatz_crystal_return_phase_separator_v44.py'
      - '.github/workflows/collatz-crystal-return-phase-separator-v44.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Minimum return-phase separator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-return-phase-separator-v44
          PYTHONPATH=experiments python experiments/collatz_crystal_return_phase_separator_v44.py \
            | tee evidence/collatz-crystal-return-phase-separator-v44/result.json
          python - <<'PY'
          import json
          p='evidence/collatz-crystal-return-phase-separator-v44/result.json'
          d=json.load(open(p))
          assert d['schema']=='COLLATZ_CRYSTAL_RETURN_PHASE_SEPARATOR_V44'
          assert d['global_collatz']=='UNKNOWN'
          print('V44_VERDICT',d['verdict'])
          print('V44_FEATURE',d['selected_phase_feature'])
          print('V44_HOLDOUT',d['holdout'])
          print('V44_CERT',d['certificate_sha256'])
          PY
          git rev-parse HEAD > evidence/collatz-crystal-return-phase-separator-v44/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-return-phase-separator-v44
          path: evidence/collatz-crystal-return-phase-separator-v44
          if-no-files-found: error
