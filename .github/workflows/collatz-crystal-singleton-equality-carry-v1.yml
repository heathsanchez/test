name: Collatz Crystal singleton equality carry V1
on:
  push:
    branches: [collatz-crystal-singleton-equality-carry-v1]
    paths:
      - 'experiments/collatz_24bit_live_origin_histogram_v1.cpp'
      - 'experiments/collatz_crystal_singleton_equality_carry_24bit_v1.py'
      - '.github/workflows/collatz-crystal-singleton-equality-carry-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  crystal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact-integer build dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - name: Extract exact 24-bit live-origin histogram
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-singleton-equality-carry-v1
          g++ -O3 -std=c++17 experiments/collatz_24bit_live_origin_histogram_v1.cpp -o /tmp/hist
          /tmp/hist | tee evidence/collatz-crystal-singleton-equality-carry-v1/histogram.json
      - name: Stress-test equality credit
        run: |
          set -euo pipefail
          python -u experiments/collatz_crystal_singleton_equality_carry_24bit_v1.py \
            evidence/collatz-crystal-singleton-equality-carry-v1/histogram.json \
            | tee evidence/collatz-crystal-singleton-equality-carry-v1/result.json
          git rev-parse HEAD > evidence/collatz-crystal-singleton-equality-carry-v1/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-singleton-equality-carry-v1
          path: evidence/collatz-crystal-singleton-equality-carry-v1
          if-no-files-found: error
