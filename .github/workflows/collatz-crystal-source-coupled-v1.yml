name: Collatz Crystal Source-Coupled V1
on:
  push:
    branches: [collatz-crystal-source-coupled-v1]
    paths:
      - 'experiments/crystal_source_coupled_v1/**'
      - '.github/workflows/collatz-crystal-source-coupled-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crystal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact bounded Crystal census
        run: |
          set -euo pipefail
          mkdir -p evidence/crystal-source-coupled-v1
          python -m unittest discover -s experiments/crystal_source_coupled_v1 -v | tee evidence/crystal-source-coupled-v1/tests.log
          python experiments/crystal_source_coupled_v1/crystal_source_coupled.py | tee evidence/crystal-source-coupled-v1/result.json
          git rev-parse HEAD > evidence/crystal-source-coupled-v1/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-source-coupled-v1
          path: evidence/crystal-source-coupled-v1
          if-no-files-found: error
