name: Collatz Crystal Source-Coupled Audit
on:
  push:
    branches: [collatz-crystal-source-coupled-v1]
    paths:
      - 'experiments/crystal_source_coupled_v1/**'
      - '.github/workflows/collatz-crystal-source-coupled-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crystal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record exact head before tests
        run: |
          mkdir -p evidence/crystal-source-coupled-v1
          git rev-parse HEAD > evidence/crystal-source-coupled-v1/commit.txt
          python --version > evidence/crystal-source-coupled-v1/python.txt
      - name: Independent index and semantic regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/crystal_source_coupled_v1 -v 2>&1 | tee evidence/crystal-source-coupled-v1/tests.log
      - name: Replay frozen V4 cohort with exact shared suffixes
        shell: bash
        run: |
          set -euo pipefail
          python -u experiments/crystal_source_coupled_v1/crystal_source_coupled.py --output-dir evidence/crystal-source-coupled-v1 2>&1 | tee evidence/crystal-source-coupled-v1/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-source-coupled-audit
          path: evidence/crystal-source-coupled-v1
          if-no-files-found: error
