name: Collatz Crystal stationary reverse-cone join
on:
  push:
    branches: [collatz-crystal-zero-loss-tail-v1]
jobs:
  join:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -u experiments/collatz_crystal_stationary_reverse_cone_join_v0.py | tee /tmp/out.json
      - uses: actions/upload-artifact@v4
        with: {name: collatz-crystal-stationary-reverse-cone-join-v0, path: /tmp/out.json}
