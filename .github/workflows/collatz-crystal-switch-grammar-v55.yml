name: Collatz Crystal Switch Grammar V55

on:
  push:
    branches: [collatz-crystal-switch-grammar-v55]
    paths:
      - 'experiments/collatz_crystal_switch_grammar_v55.py'
      - 'experiments/collatz_crystal_nonpositive_budget_kernel_v53.py'
      - '.github/workflows/collatz-crystal-switch-grammar-v55.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact switch grammar audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-switch-grammar-v55
          PYTHONPATH=experiments python -u experiments/collatz_crystal_switch_grammar_v55.py \
            | tee evidence/collatz-crystal-switch-grammar-v55/result.json
          python - <<'PY'
          import json
          p='evidence/collatz-crystal-switch-grammar-v55/result.json'
          d=json.load(open(p))
          assert d['schema']=='COLLATZ_CRYSTAL_SWITCH_GRAMMAR_V55'
          assert d['global_collatz']=='UNKNOWN'
          print('V55_VERDICT',d['verdict'])
          print('V55_STATS',d['stats'])
          print('V55_MINKEYS',d['minimal_rank_functional_key_projections'])
          print('V55_H',d['h_histogram'])
          print('V55_CERT',d['certificate_sha256'])
          PY
          git rev-parse HEAD > evidence/collatz-crystal-switch-grammar-v55/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-switch-grammar-v55
          path: evidence/collatz-crystal-switch-grammar-v55
          if-no-files-found: error
