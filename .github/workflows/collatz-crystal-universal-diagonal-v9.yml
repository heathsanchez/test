name: Collatz Crystal Universal Diagonal V9

on:
  push:
    branches: [collatz-crystal-universal-diagonal-v9]
    paths:
      - 'formal/Collatz/UniversalDiagonal.lean'
      - '.github/workflows/collatz-crystal-universal-diagonal-v9.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prove unconditional post-diagonal entry
        run: |
          set -euo pipefail
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' formal/Collatz/UniversalDiagonal.lean
          lake build CollatzFinal
          lake env lean -DautoImplicit=false formal/Collatz/UniversalDiagonal.lean
