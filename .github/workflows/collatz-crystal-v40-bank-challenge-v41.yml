name: Collatz Crystal V40 Bank Challenge V41

on:
  push:
    branches: [collatz-crystal-v40-bank-challenge-v41]
    paths:
      - 'experiments/collatz_crystal_v40_bank_challenge_v41.py'
      - 'experiments/collatz_crystal_phase_normalized_return_v40.py'
      - 'experiments/collatz_crystal_parameter_quotient_v25.py'
      - 'experiments/collatz_q0_rigid_recharge_audit.py'
      - 'experiments/collatz_q0_coalescence_component_audit.py'
      - '.github/workflows/collatz-crystal-v40-bank-challenge-v41.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  challenge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adversarial V25 x Q3 return-bank challenge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-crystal-v40-bank-challenge-v41
          python experiments/collatz_crystal_v40_bank_challenge_v41.py \
            | tee evidence/collatz-crystal-v40-bank-challenge-v41/result.json
          grep -q '"schema": "COLLATZ_CRYSTAL_V40_BANK_CHALLENGE_V41"' \
            evidence/collatz-crystal-v40-bank-challenge-v41/result.json
          git rev-parse HEAD | tee evidence/collatz-crystal-v40-bank-challenge-v41/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-crystal-v40-bank-challenge-v41
          path: evidence/collatz-crystal-v40-bank-challenge-v41
          if-no-files-found: error
