name: Collatz Crystal zero-loss tail V1
on:
  push:
    branches: [collatz-crystal-zero-loss-tail-v1]
  workflow_dispatch:
jobs:
  adversary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Zero-loss tail adversary
        run: |
          set -euo pipefail
          python -u experiments/collatz_crystal_zero_loss_tail_v1.py --source-bits 20 --depth 1024 --start-depth 60 | tee /tmp/zero-loss.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-crystal-zero-loss-tail-v1
          path: /tmp/zero-loss.json
