name: Collatz targeted deep reverse continuations

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-deep-reverse-continuations.yml"
      - "experiments/collatz_live_recursive_deep_continuations.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-deep-reverse-continuations
  cancel-in-progress: true

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        h: [1,2,3,4,5,6]
    name: deep-h${{ matrix.h }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate frozen q14 donor bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import (
              enumerate_first_contractions,sparse_quotient
          )
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY

      - name: Run exact continuation search through B24
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_live_recursive_deep_continuations.cpp             -o /tmp/deep
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/deep 24 results/q14-bank.txt ${{ matrix.h }}             | tee results/census.txt
          grep -q "VERIFIED_TARGETED_DEEP_REVERSE_CONTINUATIONS" results/census.txt

      - name: Record exact result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          H=int("${{ matrix.h }}")
          s=open("results/census.txt").read()
          m=re.search(
              r"DEEP_CONT_DONE K=24 H=(\d+) final_live=(\d+) "
              r"total_descent=(\d+) total_bridge=(\d+) "
              r"total_deep_o=(\d+) total_deep_cont=(\d+) "
              r"controls=(\d+)",s)
          assert m,s[-5000:]
          vals=list(map(int,m.groups()))
          h,live,des,bridge,deep_o,deep_cont,controls=vals
          assert h==H
          # Deep-O-only B24 frozen baseline.
          assert live <= 238727,(H,live)
          hist={}
          for z in re.finditer(r"DEEP_CONT_HIST extra=(\d+) closed=(\d+)",s):
              hist[str(int(z.group(1)))]=int(z.group(2))
          tm=open("results/time-memory.txt").read().strip().split()
          out={
              "kind":"targeted_deep_reverse_continuations",
              "K":24,"H":H,
              "final_live":live,
              "deep_o_baseline_live":238727,
              "extra_reduction":238727-live,
              "extra_relative_reduction":1-live/238727,
              "total_deep_cont":deep_cont,
              "controls":controls,
              "hist":hist,
              "wall_seconds":float(tm[0]) if tm else None,
              "max_rss_kb":int(tm[1]) if len(tm)>1 else None,
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("TARGETED_DEEP_CONTINUATION_RESULT",
                json.dumps(out,separators=(",",":")))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-cont-h${{ matrix.h }}
          path: results
          retention-days: 30

  aggregate:
    needs: deep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deep-cont-h*
          path: gathered

      - name: Aggregate continuation value curve
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("deep-cont-h*"):
              p=d/"summary.json"
              assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda r:r["H"])
          assert [r["H"] for r in rows]==[1,2,3,4,5,6],rows
          # More search may only add exact closures, never resurrect a class.
          for a,b in zip(rows,rows[1:]):
              assert b["final_live"] <= a["final_live"],(a,b)
          best=min(rows,key=lambda r:r["final_live"])
          out={"kind":"targeted_deep_reverse_continuation_curve",
               "rows":rows,"best":best}
          Path("deep-continuation-field.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("TARGETED_DEEP_CONTINUATION_FIELD",
                json.dumps(out,separators=(",",":"),sort_keys=True))
          assert best["total_deep_cont"]>0,best
          assert best["final_live"]<238727,best
          print("GENERAL_DEEP_CONTINUATIONS_ADD_NEW_CLOSURE")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: deep-continuation-field
          path: deep-continuation-field.json
          retention-days: 30
