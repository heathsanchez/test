name: Collatz deep reverse continuation extension

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-deep-reverse-extension.yml"
      - "experiments/collatz_live_recursive_deep_continuations.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-deep-reverse-extension
  cancel-in-progress: true

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        h: [7,8,9,10,11,12,14,16]
    name: deep-h${{ matrix.h }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate frozen q14 donor bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY

      - name: Run exact continuation extension through B24
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_live_recursive_deep_continuations.cpp             -o /tmp/deep
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/deep 24 results/q14-bank.txt ${{ matrix.h }}             | tee results/census.txt
          grep -q "VERIFIED_TARGETED_DEEP_REVERSE_CONTINUATIONS" results/census.txt

      - name: Record exact result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          H=int("${{ matrix.h }}")
          s=open("results/census.txt").read()
          m=re.search(
              r"DEEP_CONT_DONE K=24 H=(\d+) final_live=(\d+) "
              r"total_descent=(\d+) total_bridge=(\d+) "
              r"total_deep_o=(\d+) total_deep_cont=(\d+) controls=(\d+)",s)
          assert m,s[-5000:]
          h,live,des,bridge,deep_o,deep_cont,controls=map(int,m.groups())
          assert h==H
          assert live<=183982,(H,live)
          hist={str(int(z.group(1))):int(z.group(2))
                for z in re.finditer(r"DEEP_CONT_HIST extra=(\d+) closed=(\d+)",s)}
          tm=open("results/time-memory.txt").read().strip().split()
          out={
              "kind":"targeted_deep_reverse_continuation_extension",
              "K":24,"H":H,"final_live":live,
              "h6_reference_live":183982,
              "deep_o_reference_live":238727,
              "reduction_vs_h6":183982-live,
              "total_reduction_vs_deep_o":238727-live,
              "relative_reduction_vs_deep_o":1-live/238727,
              "total_deep_cont":deep_cont,
              "controls":controls,"hist":hist,
              "wall_seconds":float(tm[0]) if tm else None,
              "max_rss_kb":int(tm[1]) if len(tm)>1 else None,
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("DEEP_CONT_EXTENSION_RESULT",json.dumps(out,separators=(",",":")))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-extension-h${{ matrix.h }}
          path: results
          retention-days: 30

  aggregate:
    needs: deep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deep-extension-h*
          path: gathered

      - name: Aggregate extension curve
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("deep-extension-h*"):
              p=d/"summary.json"
              assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda r:r["H"])
          assert [r["H"] for r in rows]==[7,8,9,10,11,12,14,16],rows
          prev=183982
          for r in rows:
              assert r["final_live"]<=prev,(prev,r)
              prev=r["final_live"]
          best=min(rows,key=lambda r:r["final_live"])
          out={"kind":"deep_reverse_extension_curve","rows":rows,"best":best}
          Path("deep-reverse-extension-field.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("DEEP_REVERSE_EXTENSION_FIELD",
                json.dumps(out,separators=(",",":"),sort_keys=True))
          print("DEEP_REVERSE_EXTENSION_MONOTONIC_OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: deep-reverse-extension-field
          path: deep-reverse-extension-field.json
          retention-days: 30
