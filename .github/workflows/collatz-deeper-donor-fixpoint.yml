name: Collatz deeper donor residual fixpoint

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-deeper-donor-fixpoint.yml"
      - "experiments/collatz_macro_fixpoint.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-deeper-donor-fixpoint
  cancel-in-progress: true

jobs:
  donor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        q: [14,16,18,20]
    name: donor-q${{ matrix.q }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate sparse exact predecessor bank
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/bank-time-memory.txt             python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          Q=int("${{ matrix.q }}")
          certs=enumerate_first_contractions(Q)
          killed,total,selected,redundant=sparse_quotient(certs,Q)
          with open("results/bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          print("DEEPER_DONOR_BANK",
                f"Q={Q}",f"first={len(certs)}",
                f"selected={len(selected)}",f"killed={killed}/{total}")
          Path("results/bank-summary.json").write_text(
              __import__("json").dumps({
                "Q":Q,"first":len(certs),"selected":len(selected),
                "killed":killed,"total":total
              },indent=2)+"\n")
          PY

      - name: Run exact B24 macro fixpoint
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_macro_fixpoint.cpp -o /tmp/fixpoint
          /usr/bin/time -f '%e %M' -o results/fixpoint-time-memory.txt             /tmp/fixpoint 24 results/bank.txt | tee results/census.txt
          grep -q "VERIFIED_EXHAUSTIVE_REVERSE_MACRO_FIXPOINT" results/census.txt

      - name: Record conditioned residual gain
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          Q=int("${{ matrix.q }}")
          s=open("results/census.txt").read()
          m=re.search(r"LIVE_RECURSIVE_DONE K=24 final_live=(\d+)",s)
          assert m,s[-6000:]
          live=int(m.group(1))
          bank=json.load(open("results/bank-summary.json"))
          bt=open("results/bank-time-memory.txt").read().strip().split()
          ft=open("results/fixpoint-time-memory.txt").read().strip().split()
          out={
              "kind":"deeper_donor_conditioned_fixpoint",
              "K":24,"Q":Q,"live":live,
              "q14_reference_live":173180,
              "conditional_gain":173180-live,
              "conditional_reduction_fraction":1-live/173180,
              "bank_selected":bank["selected"],
              "bank_first":bank["first"],
              "bank_seconds":float(bt[0]) if bt else None,
              "bank_rss_kb":int(bt[1]) if len(bt)>1 else None,
              "fixpoint_seconds":float(ft[0]) if ft else None,
              "fixpoint_rss_kb":int(ft[1]) if len(ft)>1 else None,
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("DEEPER_DONOR_FIXPOINT_RESULT",
                json.dumps(out,separators=(",",":")))
          if Q==14:
              assert live==173180,(live,173180)
          else:
              assert live<=173180,(Q,live)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deeper-donor-q${{ matrix.q }}
          path: results
          retention-days: 30

  aggregate:
    needs: donor
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deeper-donor-q*
          path: gathered

      - name: Aggregate conditioned donor curve
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("deeper-donor-q*"):
              p=d/"summary.json"
              assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda r:r["Q"])
          assert [r["Q"] for r in rows]==[14,16,18,20],rows
          for a,b in zip(rows,rows[1:]):
              assert b["live"]<=a["live"],(a,b)
          best=min(rows,key=lambda r:r["live"])
          out={"kind":"deeper_donor_conditioned_curve","rows":rows,"best":best}
          Path("deeper-donor-field.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("DEEPER_DONOR_FIXPOINT_FIELD",
                json.dumps(out,separators=(",",":"),sort_keys=True))
          print("DEEPER_DONOR_CONDITIONED_TEST_COMPLETE")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: deeper-donor-fixpoint-field
          path: deeper-donor-field.json
          retention-days: 30
