name: Collatz direct deterministic shell cone extension

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-direct-shell-cone-extended.yml"
      - "experiments/collatz_direct_shell_cone.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-direct-shell-cone-extended
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        k: [22,23,24,25]
    name: direct-cone-k${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
      - name: Run exact direct maximal cone
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -march=native -std=c++20 experiments/collatz_direct_shell_cone.cpp -o /tmp/direct
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/direct ${{ matrix.k }} 512 | tee results/census.txt
          grep -q "VERIFIED_DIRECT_SHELL_DETERMINISTIC_CONE" results/census.txt
      - name: Parse
        run: |
          python - <<'PY'
          import json,re
          K=int("${{ matrix.k }}")
          s=open("results/census.txt").read()
          m=re.search(
              rf"DIRECT_SHELL_CONE_RESULT K={K} H=512 checked=(\d+) "
              r"direct=(\d+) cone=(\d+) hard=(\d+) overflow=(\d+) "
              r"max_f=(\d+) max_f_seed=(\d+) max_r=(\d+) max_r_seed=(\d+)",s)
          assert m,s[-4000:]
          vals=list(map(int,m.groups()))
          keys=["checked","direct","cone","hard","overflow","max_f","max_f_seed","max_r","max_r_seed"]
          out={"K":K,**dict(zip(keys,vals))}
          assert out["checked"]==(1<<(K-1))
          assert out["direct"]+out["cone"]+out["hard"]==out["checked"]
          assert out["overflow"]==0
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("DIRECT_SHELL_CONE_EXTENDED_CELL",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-shell-cone-ext-k${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: shell
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: direct-shell-cone-ext-k*
          path: gathered
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("direct-shell-cone-ext-k*"):
              p=d/"summary.json"; assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda x:x["K"])
          assert [x["K"] for x in rows]==[22,23,24,25],rows
          out={"kind":"direct_shell_deterministic_cone_extended","rows":rows,
               "all_closed":all(x["hard"]==0 for x in rows)}
          Path("direct-shell-cone-extended-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("DIRECT_SHELL_CONE_EXTENDED_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: direct-shell-cone-extended-field
          path: direct-shell-cone-extended-field.json
          retention-days: 30
