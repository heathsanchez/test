name: Collatz direct shell reverse tree

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-direct-shell-reverse.yml"
      - "experiments/collatz_direct_shell_reverse.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-direct-shell-reverse
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        depth: [0,1,2,4,6,8]
    name: direct-shell-depth${{ matrix.depth }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate frozen q14 universal bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY
      - name: Run exact direct shell reverse tree
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_direct_shell_reverse.cpp -o /tmp/direct-shell
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/direct-shell 24 results/q14-bank.txt ${{ matrix.depth }}             | tee results/census.txt
          grep -q "VERIFIED_DIRECT_SHELL_REVERSE_TREE_SCOUT" results/census.txt
      - name: Parse result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          D=int("${{ matrix.depth }}")
          s=open("results/census.txt").read()
          m=re.search(
              r"DIRECT_SHELL_RESULT K=24 macro_depth=(\d+) "
              r"universal_residual=(\d+) shell_direct=(\d+) "
              r"shell_reverse=(\d+) shell_hard=(\d+) controls=(\d+)",s)
          assert m,s[-6000:]
          d,u,direct,rev,hard,controls=map(int,m.groups())
          assert d==D and u==173180 and direct+rev+hard==u
          hist={str(int(z.group(1))):int(z.group(2))
                for z in re.finditer(r"DIRECT_SHELL_MACRO_DEPTH blocks=(\d+) closed=(\d+)",s)}
          init={str(int(z.group(1))):int(z.group(2))
                for z in re.finditer(r"DIRECT_SHELL_INITIAL_O r=(\d+) closed=(\d+)",s)}
          tm=open("results/time-memory.txt").read().strip().split()
          out={
            "kind":"direct_shell_reverse_tree",
            "K":24,"depth":D,"universal_residual":u,
            "shell_closed":direct+rev,"shell_reverse":rev,"shell_hard":hard,
            "closed_fraction":(direct+rev)/u,
            "macro_depth_hist":hist,"initial_o_hist":init,
            "controls":controls,
            "wall_seconds":float(tm[0]),"max_rss_kb":int(tm[1]),
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("DIRECT_SHELL_REVERSE_RESULT",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-shell-depth${{ matrix.depth }}
          path: results
          retention-days: 30

  aggregate:
    needs: shell
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: direct-shell-depth*
          path: gathered
      - name: Aggregate direct shell curve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("direct-shell-depth*"):
              p=d/"summary.json"
              assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda r:r["depth"])
          assert [r["depth"] for r in rows]==[0,1,2,4,6,8],rows
          prev=173180
          for r in rows:
              assert r["shell_hard"]<=prev,(prev,r)
              prev=r["shell_hard"]
          out={"kind":"direct_shell_reverse_curve","rows":rows,"best":rows[-1]}
          Path("direct-shell-reverse-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("DIRECT_SHELL_REVERSE_FIELD",json.dumps(out,separators=(",",":")))
          print("DIRECT_SHELL_REVERSE_MONOTONIC_OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: direct-shell-reverse-field
          path: direct-shell-reverse-field.json
          retention-days: 30
