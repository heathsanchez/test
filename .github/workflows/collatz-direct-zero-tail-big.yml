name: Collatz exact direct zero-tail census

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-direct-zero-tail-big.yml"
      - "experiments/collatz_direct_zero_tail_big.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-direct-zero-tail-big
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { k: 12, h: 1024 }
          - { k: 16, h: 1024 }
          - { k: 20, h: 1024 }
          - { k: 24, h: 1024 }
    name: direct-zero-tail-b${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run exact big-integer tail
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -march=native -std=c++20 experiments/collatz_direct_zero_tail_big.cpp -o /tmp/dzt
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/dzt ${{ matrix.k }} ${{ matrix.h }} | tee results/census.txt
          grep -q "VERIFIED_EXACT_DIRECT_ZERO_TAIL_CENSUS" results/census.txt
      - name: Record
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          K=int("${{ matrix.k }}");H=int("${{ matrix.h }}")
          s=Path("results/census.txt").read_text()
          m=re.search(
            rf"DIRECT_ZERO_TAIL_RESULT K={K} H={H} residual=(\d+) closed=(\d+) "
            r"unresolved=(\d+) max_extra_steps=(-?\d+) max_witness_b=(\d+) "
            r"slope_wait_cases=(\d+) max_first_boundary_descent=(-?\d+)",s)
          assert m,s[-8000:]
          vals=list(map(int,m.groups()))
          keys=["residual","closed","unresolved","max_extra_steps","max_witness_b",
                "slope_wait_cases","max_first_boundary_descent"]
          out={"kind":"direct_zero_tail_big","K":K,"H":H,**dict(zip(keys,vals))}
          Path("results/summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print("DIRECT_ZERO_TAIL_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-zero-tail-b${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: census
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: direct-zero-tail-b*
          path: gathered
      - name: Aggregate exact tail curve
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("direct-zero-tail-b*"):
            p=d/"summary.json";assert p.exists(),d
            rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda x:x["K"])
          assert [r["K"] for r in rows]==[12,16,20,24]
          print("DIRECT_ZERO_TAIL_CURVE",json.dumps(rows,separators=(",",":")))
          if all(r["unresolved"]==0 for r in rows):
            print("DIRECT_ZERO_TAIL_CLOSED_THROUGH_B24")
          else:
            print("DIRECT_ZERO_TAIL_RESIDUAL_PERSISTS")
          print("VERIFIED_DIRECT_ZERO_TAIL_CURVE")
          PY
