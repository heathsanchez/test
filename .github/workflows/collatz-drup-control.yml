name: Collatz DRUP proof control

on:
  push:
    paths:
      - ".github/workflows/collatz-drup-control.yml"
      - "experiments/collatz_coefficient_drup.py"
  workflow_dispatch:

concurrency:
  group: collatz-drup-control
  cancel-in-progress: true

jobs:
  proof-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned proof tools
        run: |
          python -m pip install --disable-pip-version-check \
            python-sat==1.9.dev15 \
            dratify==0.1.5
      - name: Generate exact H183 refutation
        run: |
          python experiments/collatz_coefficient_drup.py \
            --bits 20 --lower 524288 --upper 1048575 \
            --horizon 183 --out-dir results/drup-control
      - name: Independently replay DRUP proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from dratify import parse_dimacs, check_proof
          p=Path('results/drup-control')
          s=json.loads((p/'summary.json').read_text())
          assert s['status']=='UNSAT', s
          formula=parse_dimacs((p/'problem.cnf').read_text())
          result=check_proof(formula,(p/'proof.drup').read_text())
          assert result.ok and result.reached_empty, result
          print('INDEPENDENT_DRUP_CONTROL_OK', s['vars'], s['clauses'], s['proof_lines'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-drup-control
          path: results/drup-control
          if-no-files-found: error
