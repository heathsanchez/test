name: Collatz DRUP proof control

on:
  push:
    paths:
      - ".github/workflows/collatz-drup-control.yml"
  workflow_dispatch:

concurrency:
  group: collatz-drup-control
  cancel-in-progress: true

jobs:
  proof-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check python-sat==1.9.dev15
      - name: Build pinned independent DRAT checker
        run: |
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout 2e5e29cb0019d5cfd547d4208dca1b3ec290349f
          make -C /tmp/drat-trim
      - name: Generate exact H183 refutation
        run: |
          python experiments/collatz_coefficient_drup.py \
            --bits 20 --lower 524288 --upper 1048575 \
            --horizon 183 --out-dir results/drup-control
      - name: Independently replay DRUP proof
        run: |
          /tmp/drat-trim/drat-trim \
            results/drup-control/problem.cnf \
            results/drup-control/proof.drup | tee results/drup-control/check.log
          grep -q "s VERIFIED" results/drup-control/check.log
          echo INDEPENDENT_DRATTRIM_CONTROL_OK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-drup-control
          path: results/drup-control
          if-no-files-found: error
