name: Collatz duality residual census

on:
  push:
    branches: [collatz-valuation-quotient-v1]
    paths:
      - ".github/workflows/collatz-duality-residual-census.yml"
      - "experiments/collatz_duality_residual_census.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-duality-residual-census
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        depth: [17, 18, 19, 20]
    name: census-d${{ matrix.depth }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_duality_residual_census.cpp -o /tmp/census
      - name: Run exact residual census
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/census ${{ matrix.depth }} 0 | tee results/census.txt
          grep -q "VERIFIED_DUALITY_RESIDUAL_CENSUS_D${{ matrix.depth }}" results/census.txt
          grep -q "FINAL_GATE=DUALITY_RESIDUAL_CENSUS_D${{ matrix.depth }}" results/census.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duality-residual-census-d${{ matrix.depth }}
          path: results
          retention-days: 30
