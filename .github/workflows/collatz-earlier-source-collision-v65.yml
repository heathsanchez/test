name: Collatz earlier source collision V65
on:
  push:
    branches: [collatz-earlier-source-collision-v65]
    paths:
      - formal/Collatz/EarlierSourceCollision.lean
      - experiments/collatz_earlier_source_collision_v65.py
      - experiments/collatz_compiled_collision_reclosure_v66.py
      - .github/workflows/collatz-earlier-source-collision-v65.yml
  pull_request:
    branches: [main]
    paths:
      - formal/Collatz/EarlierSourceCollision.lean
      - experiments/collatz_earlier_source_collision_v65.py
      - experiments/collatz_compiled_collision_reclosure_v66.py
      - .github/workflows/collatz-earlier-source-collision-v65.yml
permissions: {contents: read, actions: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check exit-semantic contraction
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p evidence/collatz-earlier-source-collision-v65
          lake build Collatz.OrdinaryExitReduction Collatz.EventualMacroProgress
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/GuardedExitObligation.olean formal/Collatz/GuardedExitObligation.lean > evidence/collatz-earlier-source-collision-v65/obligation-parent.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/EarlierSourceCollision.olean formal/Collatz/EarlierSourceCollision.lean | tee evidence/collatz-earlier-source-collision-v65/proof.log
          cat > /tmp/consumer.lean <<'LEAN'
          import Collatz.EarlierSourceCollision
          open CollatzFinal CollatzFinal.SourceProduct
          #check ordinaryExit_iff_earlierSourceCollision
          #check exitObligation_iff_eventual_earlierSourceCollision
          #check collatz_of_universal_earlierSourceCollision
          example : EarlierSourceCollision 4 3 := by
            exact (ordinaryExit_iff_earlierSourceCollision (by decide)).mp
              (Or.inr (Or.inl (by decide)))
          LEAN
          lake env lean /tmp/consumer.lean | tee evidence/collatz-earlier-source-collision-v65/consumer.log
      - name: Scope and proof-boundary audit
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/collatz-earlier-source-collision-v65/result.json
          import hashlib,json,re
          from pathlib import Path
          src=Path('formal/Collatz/EarlierSourceCollision.lean').read_text()
          assert not re.search(r'\b(sorry|admit|axiom|unsafe)\b',src)
          proof=Path('evidence/collatz-earlier-source-collision-v65/proof.log').read_text()
          assert 'sorryAx' not in proof and 'Lean.ofReduceBool' not in proof
          for n in [
              'ordinaryExit_iff_earlierSourceCollision',
              'earlierSourceCollision_forward',
              'exitObligation_iff_eventual_earlierSourceCollision',
              'collatz_of_universal_earlierSourceCollision',
              'no_ordinaryExit_iff_no_earlierSourceCollision']:
              assert n in proof
          result={
            'schema':'COLLATZ_EARLIER_SOURCE_COLLISION_V65',
            'status':'WARRANTED_CONTRACTION_IF_GATE_GREEN',
            'merged_exit_labels':['terminal','direct_descent','lower_source_merge'],
            'single_protected_exit':'exists p,b with 0<p<source and shortcut^b(p)=current',
            'qed_seam':'every n>1 eventually collides with an earlier positive source orbit',
            'global_collatz':'UNKNOWN',
            'qed':False,
            'next_residual':'universal eventual earlier-source collision; search/proof machinery must establish this relation rather than inventing new semantic coordinates'
          }
          result['certificate_sha256']=hashlib.sha256(json.dumps(result,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-earlier-source-collision-v65-formal
          path: evidence/collatz-earlier-source-collision-v65

  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: collatz-guard-bank-reconciliation-v61
          run-id: 36830138059
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qualified-state
      - name: Exact protected-quotient collision pilot
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-earlier-source-collision-v65-pilot
          python3 experiments/collatz_earlier_source_collision_v65.py \
            --state qualified-state/state.json \
            > evidence/collatz-earlier-source-collision-v65-pilot/result.json
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/collatz-earlier-source-collision-v65-pilot/result.json'))
          assert d['input_cells']==128
          assert d['global_collatz']=='UNKNOWN' and not d['qed']
          assert d['protected_present']==['original_source','current_endpoint']
          print('V65_PILOT', 'closures=',d['closures'],
                'reverse_states=',d['reverse_states'],
                'max_reverse_word=',d['max_reverse_word'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-earlier-source-collision-v65-pilot
          path: evidence/collatz-earlier-source-collision-v65-pilot

  reclose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: collatz-guard-bank-reconciliation-v61
          run-id: 36830138059
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qualified-state
      - uses: actions/download-artifact@v4
        with:
          name: collatz-earlier-source-collision-v65-pilot
          run-id: 36840748839
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: discovery-pilot
      - name: Compile V65 discoveries and reclose held-out V61 residual
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-compiled-collision-reclosure-v66
          python3 experiments/collatz_compiled_collision_reclosure_v66.py \
            --state qualified-state/state.json \
            --pilot discovery-pilot/result.json \
            > evidence/collatz-compiled-collision-reclosure-v66/result.json
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/collatz-compiled-collision-reclosure-v66/result.json'))
          assert d['input_residual_cells']==14934
          assert d['heldout_cells']==14806
          assert d['global_collatz']=='UNKNOWN' and not d['qed']
          print('V66_RECLOSURE',
                'calibration=',d['calibration_closures'],
                'heldout=',d['heldout_closures'],
                'total=',d['total_closures'],
                'remaining=',d['remaining_cells'],
                'word_tests=',d['word_tests'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-compiled-collision-reclosure-v66
          path: evidence/collatz-compiled-collision-reclosure-v66
