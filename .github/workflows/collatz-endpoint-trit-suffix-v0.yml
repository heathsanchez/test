name: Collatz endpoint trit suffix V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_endpoint_trit_suffix_v0.py'
      - '.github/workflows/collatz-endpoint-trit-suffix-v0.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-endpoint-trit-suffix-v0
          python experiments/collatz_endpoint_trit_suffix_v0.py | tee evidence/collatz-endpoint-trit-suffix-v0/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-endpoint-trit-suffix-v0
          path: evidence/collatz-endpoint-trit-suffix-v0
