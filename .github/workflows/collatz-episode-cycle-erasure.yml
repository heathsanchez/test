name: Collatz bounded episode cycle erasure

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-episode-cycle-erasure.yml"
      - "experiments/collatz_episode_cycle_erasure.py"
      - "experiments/collatz_odd_episode_grammar.py"
  workflow_dispatch:

concurrency:
  group: collatz-episode-cycle-erasure
  cancel-in-progress: true

jobs:
  erase:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { r: 8,  p: 14, e: 256 }
          - { r: 12, p: 16, e: 384 }
          - { r: 16, p: 18, e: 512 }
    name: erase-r${{ matrix.r }}-p${{ matrix.p }}
    steps:
      - uses: actions/checkout@v4
      - name: Run exact online cycle erasure
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             python experiments/collatz_episode_cycle_erasure.py               --max-r ${{ matrix.r }}               --precision ${{ matrix.p }}               --max-episodes ${{ matrix.e }}               --out results/erasure.json             | tee results/census.txt
          grep -q "VERIFIED_BOUNDED_EPISODE_CYCLE_ERASURE" results/census.txt

      - name: Freeze exact controls
        run: |
          python - <<'PY'
          import json
          r=json.load(open("results/erasure.json"))
          assert r["proof_status"]=="exact_bounded_cycle_erasure_not_global_proof"
          assert r["base_cases"]==1
          assert r["unresolved"]==0,r
          assert r["max_spine"]>=1
          assert 0 <= r["erased_episode_fraction"] <= 1
          print("EPISODE_CYCLE_ERASURE_GATES_OK",
                r["max_r"],r["precision"],r["max_delay"],
                r["max_spine"],r["max_return_cycles"],
                r["erased_episode_fraction"],
                r["nonbase_positive_integer_return_cycles"])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-erasure-r${{ matrix.r }}-p${{ matrix.p }}
          path: results
          retention-days: 30

  aggregate:
    needs: erase
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: episode-erasure-r*
          path: gathered
      - name: Aggregate compression curve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("episode-erasure-r*"):
              p=d/"erasure.json"; assert p.exists(),d
              r=json.loads(p.read_text())
              tm=(d/"time-memory.txt").read_text().strip().split()
              rows.append({
                "max_r":r["max_r"],"precision":r["precision"],
                "max_delay":r["max_delay"],"max_spine":r["max_spine"],
                "max_return_cycles":r["max_return_cycles"],
                "erased_episode_fraction":r["erased_episode_fraction"],
                "mean_return_cycle_count":r["mean_return_cycle_count"],
                "nonbase_positive_integer_return_cycles":r["nonbase_positive_integer_return_cycles"],
                "unresolved":r["unresolved"],
                "wall_seconds":float(tm[0]),"max_rss_kb":int(tm[1]),
              })
          rows.sort(key=lambda z:z["precision"])
          assert len(rows)==3 and all(z["unresolved"]==0 for z in rows),rows
          out={"kind":"bounded_episode_cycle_erasure_curve","rows":rows}
          Path("episode-cycle-erasure-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("EPISODE_CYCLE_ERASURE_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: episode-cycle-erasure-field
          path: episode-cycle-erasure-field.json
          retention-days: 30
