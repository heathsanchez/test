name: Collatz episode pullback precision

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-episode-pullback-precision.yml"
      - "experiments/collatz_episode_pullback_precision.py"
      - "experiments/collatz_odd_episode_grammar.py"
  workflow_dispatch:

concurrency:
  group: collatz-episode-pullback-precision
  cancel-in-progress: true

jobs:
  pullback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { r: 8, p: 14, e: 256 }
          - { r: 12, p: 16, e: 384 }
          - { r: 16, p: 18, e: 512 }
    name: pullback-r${{ matrix.r }}-p${{ matrix.p }}
    steps:
      - uses: actions/checkout@v4
      - name: Run exact pullback analysis
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             python experiments/collatz_episode_pullback_precision.py               --max-r ${{ matrix.r }}               --precision ${{ matrix.p }}               --max-episodes ${{ matrix.e }}               --out results/pullback.json             | tee results/census.txt
          grep -q "VERIFIED_EXACT_EPISODE_PULLBACK_PRECISION" results/census.txt
      - name: Freeze exact gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open("results/pullback.json"))
          assert r["proof_status"]=="exact_bounded_pullback_not_global_proof"
          assert r["base_cases"]==1
          assert r["unresolved"]==0,r
          assert r["min_D_per_episode"]>=2.0,r["min_D_per_episode"]
          print("EPISODE_PULLBACK_GATES_OK",
                r["max_r"],r["precision"],r["max_delay"],
                r["max_cumulative_D"],r["min_D_per_episode"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-pullback-r${{ matrix.r }}-p${{ matrix.p }}
          path: results
          retention-days: 30

  aggregate:
    needs: pullback
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: episode-pullback-r*
          path: gathered
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("episode-pullback-r*"):
              p=d/"pullback.json"; assert p.exists(),d
              r=json.loads(p.read_text())
              tm=(d/"time-memory.txt").read_text().strip().split()
              rows.append({
                "max_r":r["max_r"],"precision":r["precision"],
                "max_delay":r["max_delay"],
                "max_cumulative_D":r["max_cumulative_D"],
                "mean_final_D":r["mean_final_D"],
                "min_D_per_episode":r["min_D_per_episode"],
                "unresolved":r["unresolved"],
                "wall_seconds":float(tm[0]),"max_rss_kb":int(tm[1]),
              })
          rows.sort(key=lambda z:z["precision"])
          assert len(rows)==3 and all(z["unresolved"]==0 for z in rows),rows
          out={"kind":"episode_pullback_precision_curve","rows":rows}
          Path("episode-pullback-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("EPISODE_PULLBACK_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: episode-pullback-field
          path: episode-pullback-field.json
          retention-days: 30
