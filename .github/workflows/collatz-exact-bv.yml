name: Exact Collatz BitVec

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/collatz-exact-bv.yml"
      - "experiments/collatz_exact_bv.py"

jobs:
  exact-bv:
    name: bv-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact solver
        run: python -m pip install --disable-pip-version-check z3-solver
      - name: Solve bit-vector shard exactly
        run: |
          mkdir -p results
          python experiments/collatz_exact_bv.py \
            --shards 8 \
            --shard-index ${{ matrix.shard }} \
            --max-horizon 1000 \
            --checkpoints 500,700,800,900,1000 \
            --timeout-ms 900000 \
            --out results/bv-${{ matrix.shard }}.json
      - name: Upload exact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collatz-exact-bv-${{ matrix.shard }}
          path: results/bv-${{ matrix.shard }}.json
          if-no-files-found: warn
