name: Collatz Exact Low Word Self Repeat
on:
  push:
    branches: [collatz-three-quarter-future7-cylinder-v0]
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python experiments/collatz_exact_low_word_self_repeat_v1.py | tee /tmp/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-exact-low-word-self-repeat-v1
          path: /tmp/result.json
