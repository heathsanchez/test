name: Collatz Farey rung2 handoff V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_farey_rung2_handoff_v0.py'
      - '.github/workflows/collatz-farey-rung2-handoff-v0.yml'
  workflow_dispatch:
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-farey-rung2-handoff-v0
          python experiments/collatz_farey_rung2_handoff_v0.py | tee evidence/collatz-farey-rung2-handoff-v0/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-farey-rung2-handoff-v0
          path: evidence/collatz-farey-rung2-handoff-v0
