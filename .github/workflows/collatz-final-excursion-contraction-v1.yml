name: Collatz Final Excursion Contraction V1
on:
  push:
    branches: [collatz-final-excursion-contraction-v1]
    paths:
      - 'formal/Collatz/FinalExcursionContraction.lean'
      - '.github/workflows/collatz-final-excursion-contraction-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reject placeholders
        run: |
          set -euo pipefail
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' formal/Collatz/FinalExcursionContraction.lean
      - name: Check theorem
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-final-excursion-contraction-v1
          lake env lean -DautoImplicit=false formal/Collatz/FinalExcursionContraction.lean | tee evidence/collatz-final-excursion-contraction-v1/theorems.log
          ! grep -q 'sorryAx' evidence/collatz-final-excursion-contraction-v1/theorems.log
          git rev-parse HEAD > evidence/collatz-final-excursion-contraction-v1/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-final-excursion-contraction-v1
          path: evidence/collatz-final-excursion-contraction-v1
          if-no-files-found: error
