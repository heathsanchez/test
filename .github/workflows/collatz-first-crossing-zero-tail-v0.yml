name: Collatz first crossing zero tail V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_first_crossing_zero_tail_v0.py'
      - 'experiments/collatz_crystal_campaign_state_v1.json'
      - '.github/workflows/collatz-first-crossing-zero-tail-v0.yml'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-first-crossing-zero-tail-v0
          python experiments/collatz_first_crossing_zero_tail_v0.py | tee evidence/collatz-first-crossing-zero-tail-v0/result.json
          cp experiments/collatz_crystal_campaign_state_v1.json evidence/collatz-first-crossing-zero-tail-v0/state.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-first-crossing-zero-tail-v0
          path: evidence/collatz-first-crossing-zero-tail-v0
