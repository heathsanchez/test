name: Collatz first-descent boundary Lean check

on:
  push:
    branches: [collatz-valuation-quotient-v1]
    paths:
      - ".github/workflows/collatz-first-descent-boundary-lean.yml"
      - "formal/CollatzFirstDescentBoundary.lean"
      - "formal/CollatzCanonicalConsequence.lean"
      - "formal/CollatzConeReduction.lean"
      - "formal/CollatzShortcutCone.lean"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check first-descent boundary
        run: |
          set -euo pipefail
          lean --version
          LEAN_PATH=formal lean -o formal/CollatzConeReduction.olean formal/CollatzConeReduction.lean
          LEAN_PATH=formal lean -o formal/CollatzShortcutCone.olean formal/CollatzShortcutCone.lean
          LEAN_PATH=formal lean -o formal/CollatzCanonicalConsequence.olean formal/CollatzCanonicalConsequence.lean
          LEAN_PATH=formal lean formal/CollatzFirstDescentBoundary.lean
          echo VERIFIED_LEAN_COLLATZ_FIRST_DESCENT_BOUNDARY
