name: Collatz first-resonance cheap fiber V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_first_resonance_fiber_cheap_v0.py'
      - '.github/workflows/collatz-first-resonance-fiber-cheap-v0.yml'
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python experiments/collatz_first_resonance_fiber_cheap_v0.py | tee result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-first-resonance-fiber-cheap-v0
          path: result.json
