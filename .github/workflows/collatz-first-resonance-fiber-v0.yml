name: Collatz first-resonance fiber V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_first_resonance_fiber_v0.py'
      - '.github/workflows/collatz-first-resonance-fiber-v0.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact source-endpoint fiber census
        run: |
          mkdir -p evidence/collatz-first-resonance-fiber-v0
          python experiments/collatz_first_resonance_fiber_v0.py --max-depth 14 --output evidence/collatz-first-resonance-fiber-v0/result.json | tee evidence/collatz-first-resonance-fiber-v0/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-first-resonance-fiber-v0
          path: evidence/collatz-first-resonance-fiber-v0
