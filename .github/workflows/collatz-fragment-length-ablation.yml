name: Collatz fragment length ablation
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_fragment_length_ablation.py'
      - '.github/workflows/collatz-fragment-length-ablation.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fragment length ablation
        run: python -u experiments/collatz_fragment_length_ablation.py | tee /tmp/fragment-length-ablation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fragment-length-ablation
          path: /tmp/fragment-length-ablation.txt
