name: Collatz fragment residual characterization
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_fragment_residual_characterization.py'
      - '.github/workflows/collatz-fragment-residual-characterization.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_fragment_residual_characterization.py | tee /tmp/fragment-residual.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fragment-residual-characterization
          path: /tmp/fragment-residual.txt
