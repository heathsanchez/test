name: Collatz RIGID fragment transfer
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_fragment_transfer_probe.py'
      - '.github/workflows/collatz-fragment-transfer-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_fragment_transfer_probe.py --train-hi 4095 --held-hi 8191 --K 80 --maxfrag 5 | tee /tmp/fragment-transfer.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fragment-transfer-probe
          path: /tmp/fragment-transfer.txt
