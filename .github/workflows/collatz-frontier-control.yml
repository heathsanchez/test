name: Collatz exact frontier control

on:
  push:
    paths:
      - ".github/workflows/collatz-frontier-control.yml"
  workflow_dispatch:

concurrency:
  group: collatz-frontier-control
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check python-sat==1.9.dev15
      - name: Recover exact 20-bit horizon boundary
        run: |
          mkdir -p results
          python experiments/collatz_coefficient_frontier.py \
            --bits 20 --lower 524288 --upper 1048575 \
            --max-horizon 183 \
            --out results/frontier-control.json
          python - <<'PY'
          import json
          x=json.load(open('results/frontier-control.json'))
          assert x['closed'] is True, x
          assert x['last_sat_horizon']==182, x
          assert x['first_unsat_horizon']==183, x
          assert x['extremal_seed']=='1027431', x
          assert x['extremal_replay']['first_contract']==183, x
          print('EXACT_FRONTIER_CONTROL_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-frontier-control
          path: results/frontier-control.json
