name: Collatz full local contracting chamber V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_full_local_contracting_chamber_v0.py'
      - '.github/workflows/collatz-full-local-contracting-chamber-v0.yml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-full-local-contracting-chamber-v0
          python experiments/collatz_full_local_contracting_chamber_v0.py | tee evidence/collatz-full-local-contracting-chamber-v0/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-full-local-contracting-chamber-v0
          path: evidence/collatz-full-local-contracting-chamber-v0
