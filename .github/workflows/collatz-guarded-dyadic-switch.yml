name: Collatz Guarded Dyadic Switch
on:
  push:
    branches: [collatz-guarded-dyadic-switch-20260930]
    paths: ['.github/workflows/collatz-guarded-dyadic-switch.yml']
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and build parent authority
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake build CollatzFinal
      - name: Kernel requalify exact dyadic switch cases and infinite-chain exclusion
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-guarded-dyadic-switch-20260930
          lake env lean --version | tee evidence/collatz-guarded-dyadic-switch-20260930/toolchain.txt
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/GuardedDyadicSwitch.olean formal/Collatz/GuardedDyadicSwitch.lean | tee evidence/collatz-guarded-dyadic-switch-20260930/dyadic.log
          lake env lean -DautoImplicit=false formal/Collatz/GuardedDyadicSwitchTest.lean | tee evidence/collatz-guarded-dyadic-switch-20260930/consumer.log
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('evidence/collatz-guarded-dyadic-switch-20260930')
          s=(p/'dyadic.log').read_text()
          assert 'sorryAx' not in s and 'Lean.ofReduceBool' not in s
          for name in ('dyadic_order_exists','dyadic_order_unique','dyadic_sum_unequal','dyadic_equal_sum_even','dyadic_switch_unequal','dyadic_switch_equal','dyadic_switch_zero_injection','fixed_centre_exhaustion','return_zero_defect_fixed_point','equal_order_cancellation_unbounded','return_switch_unequal','shared_centre_return_exhaustion'):
              assert name in s, name
          source=Path('formal/Collatz/GuardedDyadicSwitch.lean').read_text()
          assert not re.search(r'\b(sorry|admit|axiom|unsafe)\b',source)
          print('UNIVERSAL_SIGNED_DYADIC_SWITCH_CASES_KERNEL_CHECKED')
          print('SHARED_CENTRE_NONZERO_INFINITE_CHAIN_EXCLUDED')
          print('EQUAL_ORDER_CANCELLATION_UNBOUNDED_ALGEBRAICALLY')
          print('GLOBAL_COLLATZ_UNKNOWN')
          PY
          git rev-parse HEAD > evidence/collatz-guarded-dyadic-switch-20260930/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-guarded-dyadic-switch-20260930
          path: evidence/collatz-guarded-dyadic-switch-20260930
