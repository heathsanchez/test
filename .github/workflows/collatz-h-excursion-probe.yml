name: Collatz h-excursion probe
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_h_excursion_probe.py'
      - '.github/workflows/collatz-h-excursion-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_h_excursion_probe.py --lo 3 --hi 32767 --K 128 | tee /tmp/h-excursion.txt
      - uses: actions/upload-artifact@v4
        with:
          name: h-excursion-probe
          path: /tmp/h-excursion.txt
