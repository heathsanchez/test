name: Collatz H1000 Kissat portfolio

on:
  push:
    paths:
      - ".github/workflows/collatz-h1000-kissat.yml"
  workflow_dispatch:

concurrency:
  group: collatz-h1000-kissat
  cancel-in-progress: true

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: 0
            lo: "2392312122059207475200"
            hi: "2580230076993379166224"
          - shard: 1
            lo: "2580230076993379166225"
            hi: "2768148031927550857250"
          - shard: 2
            lo: "2768148031927550857251"
            hi: "2956065986861722548275"
          - shard: 3
            lo: "2956065986861722548276"
            hi: "3143983941795894239301"
    name: kissat-h1000-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact CNF dependency
        run: python -m pip install --disable-pip-version-check python-sat==1.9.dev15
      - name: Build pinned Kissat 4.0.4
        run: |
          git clone https://github.com/arminbiere/kissat.git /tmp/kissat
          git -C /tmp/kissat checkout 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd /tmp/kissat
          ./configure
          make -j2
      - name: Emit exact H1000 shard CNF
        run: |
          mkdir -p results/shard-${{ matrix.shard }}
          python experiments/collatz_coefficient_cnf_emit.py \
            --bits 72 \
            --lower "${{ matrix.lo }}" \
            --upper "${{ matrix.hi }}" \
            --horizon 1000 \
            --out-dir results/shard-${{ matrix.shard }}
      - name: Solve exact H1000 separator
        id: solve
        run: |
          set +e
          /tmp/kissat/build/kissat \
            results/shard-${{ matrix.shard }}/problem.cnf \
            | tee results/shard-${{ matrix.shard }}/kissat.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 10 ] && [ "$rc" -ne 20 ]; then
            echo "Unexpected Kissat exit code $rc"
            exit "$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Exact SAT witness replay or UNSAT marker
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from experiments.collatz_coefficient_cnf import replay

          shard = "${{ matrix.shard }}"
          lo = int("${{ matrix.lo }}")
          hi = int("${{ matrix.hi }}")
          rc = int("${{ steps.solve.outputs.rc }}")
          d = Path(f"results/shard-{shard}")
          log = (d/"kissat.log").read_text(errors="replace")
          out = {"shard": int(shard), "lower": str(lo), "upper": str(hi),
                 "horizon": 1000, "solver": "kissat-4.0.4",
                 "solver_commit": "8af8e56f174b778aef3aa45af9f739b2a5f492c2"}

          if rc == 10:
              lits = set()
              for line in log.splitlines():
                  if line.startswith("v "):
                      for tok in line.split()[1:]:
                          v = int(tok)
                          if v > 0: lits.add(v)
              n = sum((1 << i) for i in range(72) if (i + 2) in lits)
              assert lo <= n <= hi, (n, lo, hi)
              rep = replay(n, 10000)
              assert rep["first_contract"] is None or rep["first_contract"] > 1000, (n, rep)
              out.update(status="SAT", witness=str(n), replay=rep)
              print("KISSAT_EXACT_WITNESS", json.dumps(out, separators=(",",":")))
          else:
              assert "s UNSATISFIABLE" in log, "Kissat exit 20 without UNSAT marker"
              out.update(status="UNSAT",
                         note="search verdict only; final acceptance requires independent DRAT certificate")
              print("KISSAT_SEARCH_UNSAT", json.dumps(out, separators=(",",":")))

          (d/"result.json").write_text(json.dumps(out, indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-kissat-h1000-${{ matrix.shard }}
          path: |
            results/shard-${{ matrix.shard }}/metadata.json
            results/shard-${{ matrix.shard }}/kissat.log
            results/shard-${{ matrix.shard }}/result.json
          if-no-files-found: warn
