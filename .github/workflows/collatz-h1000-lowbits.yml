name: Collatz H1000 low-bit partition

on:
  push:
    paths:
      - ".github/workflows/collatz-h1000-lowbits.yml"
  workflow_dispatch:

concurrency:
  group: collatz-h1000-lowbits
  cancel-in-progress: true

jobs:
  exact-lowbits:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check python-sat==1.9.dev15
      - name: Cover all low-4 residue classes exactly
        run: |
          mkdir -p results
          python experiments/collatz_coefficient_residue_split.py \
            --bits 72 \
            --lower 2392312122059207475200 \
            --upper 3143983941795894239301 \
            --horizon 1000 \
            --split-bits 4 \
            --replay-limit 10000 \
            --out results/lowbits-h1000.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-h1000-lowbits
          path: results/lowbits-h1000.json
          if-no-files-found: warn
