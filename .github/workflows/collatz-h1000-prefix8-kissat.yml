name: Collatz H1000 lawful prefix8 partition

on:
  push:
    paths:
      - ".github/workflows/collatz-h1000-prefix8-kissat.yml"
      - "experiments/collatz_prefix_residues.py"
      - "experiments/collatz_coefficient_cnf_emit.py"
      - "experiments/collatz_coefficient_cnf_v2.py"
      - "experiments/collatz_coefficient_cnf.py"
  workflow_dispatch:

concurrency:
  group: collatz-h1000-prefix8-kissat
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      residues: ${{ steps.partition.outputs.residues }}
      count: ${{ steps.partition.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile exact lawful prefix quotient
        id: partition
        run: |
          mkdir -p results
          python experiments/collatz_prefix_residues.py --bits 8 --out results/prefix8.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open("results/prefix8.json"))
          assert d["lawful_count"] == 19, d
          assert d["eliminated_count"] == 237, d
          print("residues="+json.dumps(d["residues"],separators=(",",":")))
          print("count="+str(d["lawful_count"]))
          PY
      - name: Build pinned Kissat 4.0.4 once
        run: |
          git clone https://github.com/arminbiere/kissat.git /tmp/kissat
          git -C /tmp/kissat checkout 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd /tmp/kissat
          ./configure
          make -j2
          mkdir -p "$GITHUB_WORKSPACE/results/tool"
          cp build/kissat "$GITHUB_WORKSPACE/results/tool/kissat"
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-prefix8-kissat-tool
          path: |
            results/tool/kissat
            results/prefix8.json
          retention-days: 1

  control:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check python-sat==1.9.dev15
      - uses: actions/download-artifact@v4
        with:
          name: collatz-prefix8-kissat-tool
          path: tool
      - run: chmod +x tool/tool/kissat
      - name: Protected exact boundary under fixed prefix residue
        run: |
          mkdir -p results/control-182 results/control-183
          python experiments/collatz_coefficient_cnf_emit.py \
            --bits 20 --lower 524288 --upper 1048575 --horizon 182 \
            --low-bits 8 --low-value 103 --out-dir results/control-182
          python experiments/collatz_coefficient_cnf_emit.py \
            --bits 20 --lower 524288 --upper 1048575 --horizon 183 \
            --low-bits 8 --low-value 103 --out-dir results/control-183

          set +e
          tool/tool/kissat results/control-182/problem.cnf | tee results/control-182/kissat.log
          rc182=${PIPESTATUS[0]}
          tool/tool/kissat results/control-183/problem.cnf | tee results/control-183/kissat.log
          rc183=${PIPESTATUS[0]}
          set -e

          test "$rc182" -eq 10
          test "$rc183" -eq 20
          grep -q "s SATISFIABLE" results/control-182/kissat.log
          grep -q "s UNSATISFIABLE" results/control-183/kissat.log

          python - <<'PY'
          from pathlib import Path
          from experiments.collatz_coefficient_cnf import replay
          lits=set()
          for line in Path("results/control-182/kissat.log").read_text().splitlines():
              if line.startswith("v "):
                  for tok in line.split()[1:]:
                      v=int(tok)
                      if v>0:
                          lits.add(v)
          n=sum((1<<i) for i in range(20) if (i+2) in lits)
          assert 524288 <= n <= 1048575, n
          assert n % 256 == 103, n
          rep=replay(n,5000)
          assert rep["first_contract"] is None or rep["first_contract"] > 182, (n,rep)
          print("PREFIX8_CONTROL_SAT",n,rep)
          print("PREFIX8_CONTROL_BOUNDARY 182 SAT / 183 UNSAT")
          PY

  residue:
    needs: [prepare, control]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix:
        residue: ${{ fromJSON(needs.prepare.outputs.residues) }}
    name: prefix8-${{ matrix.residue }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check python-sat==1.9.dev15
      - uses: actions/download-artifact@v4
        with:
          name: collatz-prefix8-kissat-tool
          path: tool
      - run: chmod +x tool/tool/kissat
      - name: Emit exact fixed-prefix H1000 CNF
        run: |
          mkdir -p results/r-${{ matrix.residue }}
          python experiments/collatz_coefficient_cnf_emit.py \
            --bits 72 \
            --lower 2392312122059207475200 \
            --upper 3143983941795894239301 \
            --horizon 1000 \
            --low-bits 8 \
            --low-value ${{ matrix.residue }} \
            --out-dir results/r-${{ matrix.residue }}
      - name: Solve exact fixed-prefix separator
        id: solve
        run: |
          set +e
          tool/tool/kissat \
            results/r-${{ matrix.residue }}/problem.cnf \
            | tee results/r-${{ matrix.residue }}/kissat.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 10 ] && [ "$rc" -ne 20 ]; then
            echo "Unexpected Kissat exit code $rc"
            exit "$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Exact witness replay or UNSAT marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.collatz_coefficient_cnf import replay

          residue=int("${{ matrix.residue }}")
          rc=int("${{ steps.solve.outputs.rc }}")
          d=Path(f"results/r-{residue}")
          log=(d/"kissat.log").read_text(errors="replace")
          out={
              "residue": residue,
              "modulus": 256,
              "lower": "2392312122059207475200",
              "upper": "3143983941795894239301",
              "horizon": 1000,
              "solver": "kissat-4.0.4",
              "solver_commit": "8af8e56f174b778aef3aa45af9f739b2a5f492c2",
          }

          if rc == 10:
              lits=set()
              for line in log.splitlines():
                  if line.startswith("v "):
                      for tok in line.split()[1:]:
                          v=int(tok)
                          if v>0:
                              lits.add(v)
              n=sum((1<<i) for i in range(72) if (i+2) in lits)
              assert 2392312122059207475200 <= n <= 3143983941795894239301, n
              assert n % 256 == residue, (n,residue)
              rep=replay(n,10000)
              assert rep["first_contract"] is None or rep["first_contract"] > 1000, (n,rep)
              out.update(status="SAT",witness=str(n),replay=rep)
              print("PREFIX8_EXACT_WITNESS",json.dumps(out,separators=(",",":")))
          else:
              assert "s UNSATISFIABLE" in log
              out.update(status="UNSAT",
                         note="search verdict; final proof acceptance remains DRAT-gated")
              print("PREFIX8_SEARCH_UNSAT",json.dumps(out,separators=(",",":")))

          (d/f"result-{residue}.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-prefix8-${{ matrix.residue }}
          path: |
            results/r-${{ matrix.residue }}/metadata.json
            results/r-${{ matrix.residue }}/kissat.log
            results/r-${{ matrix.residue }}/result-${{ matrix.residue }}.json
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    needs: [prepare, residue]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: collatz-prefix8-*
          path: gathered
          merge-multiple: true
      - name: Aggregate exact quotient coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path("gathered").rglob("result-*.json"))
          rows=[json.loads(p.read_text()) for p in files]
          statuses={}
          for r in rows:
              statuses[r["status"]]=statuses.get(r["status"],0)+1
          summary={
              "kind":"collatz_h1000_prefix8_aggregate",
              "expected_lawful_classes":19,
              "completed_results":len(rows),
              "status_counts":statuses,
              "sat_witnesses":[r.get("witness") for r in rows if r["status"]=="SAT"],
              "all_lawful_classes_unsat":len(rows)==19 and statuses.get("UNSAT",0)==19,
          }
          Path("gathered/summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print("PREFIX8_AGGREGATE",json.dumps(summary,separators=(",",":")))
          if len(rows) != 19:
              raise SystemExit(f"incomplete quotient coverage: {len(rows)}/19")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-prefix8-aggregate
          path: gathered/summary.json
          retention-days: 30
