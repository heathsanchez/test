name: Collatz H16 deep scaling B32 B34

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-h16-b32-b34.yml"
      - "experiments/collatz_live_recursive_deep_continuations.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
      - "experiments/collatz_global_constructor_product.py"
  workflow_dispatch:

concurrency:
  group: collatz-h16-b32-b34
  cancel-in-progress: true

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        k: [32,34]
    name: h16-b${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate frozen q14 donor bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY

      - name: Run frozen H16 recursion
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_live_recursive_deep_continuations.cpp             -o /tmp/deep
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/deep ${{ matrix.k }} results/q14-bank.txt 16             | tee results/census.txt
          grep -q "VERIFIED_TARGETED_DEEP_REVERSE_CONTINUATIONS" results/census.txt

      - name: Record frontier and product residual
        run: |
          set -euo pipefail
          K=${{ matrix.k }}
          python - <<'PY'
          import json,re
          K=int("${{ matrix.k }}")
          s=open("results/census.txt").read()
          m=re.search(
              rf"DEEP_CONT_DONE K={K} H=16 final_live=(\d+) "
              r"total_descent=(\d+) total_bridge=(\d+) "
              r"total_deep_o=(\d+) total_deep_cont=(\d+) controls=(\d+)",s)
          assert m,s[-8000:]
          live,des,bridge,deep_o,deep_cont,controls=map(int,m.groups())
          odd_total=1<<(K-1)
          tm=open("results/time-memory.txt").read().strip().split()
          out={
              "kind":"h16_deep_scaling",
              "K":K,"final_live":live,"odd_total":odd_total,
              "odd_live_fraction":live/odd_total,
              "total_descent":des,"total_bridge":bridge,
              "total_deep_o":deep_o,"total_deep_cont":deep_cont,
              "controls":controls,
              "wall_seconds":float(tm[0]) if tm else None,
              "max_rss_kb":int(tm[1]) if len(tm)>1 else None,
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("H16_DEEP_FRONTIER",json.dumps(out,separators=(",",":")))
          PY

          LIVE=$(python - <<'PY'
          import json
          print(json.load(open("results/summary.json"))["final_live"])
          PY
          )
          python experiments/collatz_global_constructor_product.py             --two-bits "$K" --two-live "$LIVE"             --q 14 --q-killed 2233499             --out results/product.json | tee results/product.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h16-deep-b${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: scale
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: h16-deep-b*
          path: gathered

      - name: Aggregate exact deep curve
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("h16-deep-b*"):
              s=json.loads((d/"summary.json").read_text())
              p=json.loads((d/"product.json").read_text())
              s["product_residual_fraction"]=p["mixed_residual_fraction"]
              s["product_residual_fraction_exact"]=p["mixed_residual_fraction_exact"]
              rows.append(s)
          rows.sort(key=lambda r:r["K"])
          assert [r["K"] for r in rows]==[32,34],rows
          # Compare to frozen B30 H16 density.
          assert rows[0]["odd_live_fraction"] < 0.012941548600792885,rows[0]
          assert rows[1]["odd_live_fraction"] < rows[0]["odd_live_fraction"],rows
          out={"kind":"h16_b32_b34_curve","rows":rows}
          Path("h16-b32-b34-field.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("H16_B32_B34_FIELD",json.dumps(out,separators=(",",":"),sort_keys=True))
          print("H16_B34_DENSITY_CONTRACTION_OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: h16-b32-b34-field
          path: h16-b32-b34-field.json
          retention-days: 30
