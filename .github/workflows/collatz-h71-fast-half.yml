name: Collatz frozen H71 fast half
on:
  workflow_dispatch:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - '.github/workflows/collatz-h71-fast-half.yml'
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_h71_fast_gate.py --lo 8193 --hi 16383 --H 71 --K 130 | tee /tmp/h71-fast-half.txt
      - uses: actions/upload-artifact@v4
        with:
          name: h71-fast-half
          path: /tmp/h71-fast-half.txt
