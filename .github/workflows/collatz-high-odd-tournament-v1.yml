name: Collatz High-Odd Tournament V1
on:
  push:
    branches: [collatz-high-odd-tournament-v1]
    paths:
      - 'experiments/collatz_high_odd_tournament_v1.cpp'
      - '.github/workflows/collatz-high-odd-tournament-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exact high-odd census
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-high-odd-tournament-v1
          git rev-parse HEAD > evidence/collatz-high-odd-tournament-v1/commit.txt
          g++ -O3 -std=c++17 experiments/collatz_high_odd_tournament_v1.cpp -o /tmp/highodd
          /usr/bin/time -v /tmp/highodd 16777216 1024 2> evidence/collatz-high-odd-tournament-v1/time.txt | tee evidence/collatz-high-odd-tournament-v1/result.json
          grep -q '"universal_status":"UNKNOWN"' evidence/collatz-high-odd-tournament-v1/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-high-odd-tournament-v1
          path: evidence/collatz-high-odd-tournament-v1
          if-no-files-found: error
