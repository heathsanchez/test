name: Collatz hybrid split12 assumption frontier

on:
  push:
    paths:
      - ".github/workflows/collatz-hybrid-split12.yml"
      - "experiments/collatz_hybrid_residue_split.py"
      - "experiments/collatz_hybrid_adaptive.py"
      - "experiments/collatz_prefix_residues.py"
  workflow_dispatch:

concurrency:
  group: collatz-hybrid-split12
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      parents: ${{ steps.partition.outputs.parents }}
    steps:
      - uses: actions/checkout@v4
      - id: partition
        name: Freeze lawful prefix quotients
        run: |
          mkdir -p results
          python experiments/collatz_prefix_residues.py --bits 8 --out results/prefix8.json
          python experiments/collatz_prefix_residues.py --bits 12 --out results/prefix12.json
          python experiments/collatz_transfer_farey.py | tee results/transfer.txt
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p8=json.load(open("results/prefix8.json"))
          p12=json.load(open("results/prefix12.json"))
          assert p8["lawful_count"] == 19, p8
          assert p12["lawful_count"] == 226, p12
          assert {r & 255 for r in p12["residues"]} == set(p8["residues"])
          print("parents="+json.dumps(p8["residues"],separators=(",",":")))
          print("PREFIX_QUOTIENT_OK parents=19 children=226")
          PY

  control:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check python-sat==1.9.dev15
      - name: Protected split boundary
        run: |
          mkdir -p results
          python experiments/collatz_hybrid_residue_split.py \
            --bits 20 \
            --lower 524288 \
            --upper 1048575 \
            --horizon 182 \
            --parent-bits 8 \
            --parent-value 103 \
            --split-bits 12 \
            --protected-control \
            --out results/control-182.json
          python experiments/collatz_hybrid_residue_split.py \
            --bits 20 \
            --lower 524288 \
            --upper 1048575 \
            --horizon 183 \
            --parent-bits 8 \
            --parent-value 103 \
            --split-bits 12 \
            --protected-control \
            --out results/control-183.json
          python - <<'PY'
          import json
          a=json.load(open("results/control-182.json"))
          b=json.load(open("results/control-183.json"))
          assert a["status"] == "SAT", a
          assert b["status"] == "UNSAT", b
          sats=[r for r in a["results"] if r["status"]=="SAT"]
          assert any(r.get("witness")=="1027431" for r in sats), sats
          exact=[r for r in sats if r.get("witness")=="1027431"][0]
          assert exact["child"] == 3431, exact
          assert b["sat_child_count"] == 0, b
          print("HYBRID_SPLIT12_CONTROL_OK witness=1027431 child=3431 boundary=182/183")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-split12-control
          path: results/control-*.json
          retention-days: 30

  parent:
    needs: [prepare, control]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        parent: ${{ fromJSON(needs.prepare.outputs.parents) }}
    name: split12-parent-${{ matrix.parent }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check python-sat==1.9.dev15
      - name: Exact H803 lawful-child partition with assumption reuse
        run: |
          mkdir -p results
          python experiments/collatz_hybrid_residue_split.py \
            --bits 72 \
            --lower 2392312122059207475200 \
            --upper 3143983941795894239301 \
            --horizon 803 \
            --parent-bits 8 \
            --parent-value ${{ matrix.parent }} \
            --split-bits 12 \
            --replay-limit 5000 \
            --out results/split12-${{ matrix.parent }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-split12-${{ matrix.parent }}
          path: results/split12-${{ matrix.parent }}.json
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    needs: [parent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: collatz-split12-*
          path: gathered
          merge-multiple: true
      - name: Aggregate exact H803 split coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path("gathered").glob("split12-*.json"))
          rows=[json.loads(p.read_text()) for p in files]
          completed_children=sum(r["lawful_child_count"] for r in rows)
          sat=[]
          unsat_parents=[]
          for r in rows:
              if r["status"]=="UNSAT":
                  unsat_parents.append(r["parent_value"])
              for x in r["results"]:
                  if x["status"]=="SAT":
                      sat.append({
                          "parent":r["parent_value"],
                          "child":x["child"],
                          "witness":x["witness"],
                          "first_descent":x["replay"]["first_descent"],
                      })
          summary={
              "kind":"collatz_h803_hybrid_split12_aggregate",
              "completed_parents":len(rows),
              "completed_lawful_children":completed_children,
              "expected_parents":19,
              "expected_lawful_children":226,
              "unsat_parents":sorted(unsat_parents),
              "sat_children":sat,
              "all_h803_unsat":len(rows)==19 and completed_children==226 and not sat,
          }
          Path("gathered/summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print("SPLIT12_AGGREGATE",json.dumps(summary,separators=(",",":")))
          if len(rows)!=19:
              raise SystemExit(f"incomplete parent coverage: {len(rows)}/19")
          if completed_children!=226:
              raise SystemExit(f"incomplete child coverage: {completed_children}/226")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-split12-aggregate
          path: gathered/summary.json
          retention-days: 30
