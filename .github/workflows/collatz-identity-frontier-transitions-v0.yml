name: Collatz identity frontier transitions V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_identity_frontier_transitions_v0.py'
      - '.github/workflows/collatz-identity-frontier-transitions-v0.yml'
  workflow_dispatch:
jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-identity-frontier-transitions-v0
          python experiments/collatz_identity_frontier_transitions_v0.py | tee evidence/collatz-identity-frontier-transitions-v0/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-identity-frontier-transitions-v0
          path: evidence/collatz-identity-frontier-transitions-v0
