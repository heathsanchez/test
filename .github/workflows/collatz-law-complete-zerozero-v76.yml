name: Collatz law-complete zero-zero V76
on:
  push:
    branches: [collatz-law-complete-zerozero-v76]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collatz-law-complete-zerozero-v76
          run-id: 36991028110
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v76

      - name: Verify exact law-only zero-zero separator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp parent-v76/result.json evidence/result.json
          python3 - <<'PY' | tee evidence/qualification.json
          from fractions import Fraction
          import hashlib, json

          d=json.load(open('evidence/result.json'))
          payload=dict(d)
          claimed=payload.pop('certificate_sha256')
          got=hashlib.sha256(
              json.dumps(payload,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          assert claimed==got=='a454615f59287582397d881e793cf9eea3505c26eba559e49bced05592e387f3'
          assert d['schema']=='COLLATZ_LAW_COMPLETE_ZEROZERO_V76'
          assert d['parent_v75_qualification_sha256']=='678569748525ba669343247a900f2b27276d1977ae4e0a6c4fa1374f87479796'
          assert d['source_keys_retained'] is False
          assert d['observed_adjacency_retained'] is False
          assert d['zero_zero_paths']==1
          assert d['zero_zero_status']=='FEASIBLE_IN_LAW_COMPLETE_OVERAPPROX'
          assert d['exhaustive_if_absent'] is False
          assert not d['qed'] and d['global_collatz']=='UNKNOWN'

          w=d['first_zero_zero_witness']
          expected=[
              [2187,1785,2048,11],
              [2187,1417,1024,10],
              [81,43,64,6],
              [729,857,512,9],
          ]
          assert w['anchor']==1
          assert w['laws']==expected
          assert w['precisions']==[15,27,28]
          assert w['interval_widths']==[12,1]
          assert w['natural_congruence_witness']==23797

          def centre(L):
              A,B,P,D=L
              assert A%2==1 and P==1<<D and P!=A
              return Fraction(B,P-A)
          def advance(comp,L):
              Abar,Bbar,Pbar=comp
              A,B,P,_=L
              return A*Abar, A*Bbar+B*Pbar, P*Pbar
          def pull(comp,c):
              Abar,Bbar,Pbar=comp
              return (Pbar*c-Bbar)/Abar
          def v2z(x):
              x=abs(x)
              assert x
              return (x & -x).bit_length()-1
          def rat_v2(q):
              assert q
              return v2z(q.numerator)-v2z(q.denominator)
          def residue(q,bits):
              if bits==0: return 0
              mod=1<<bits
              den=q.denominator%mod
              assert den&1
              return (q.numerator*pow(den,-1,mod))%mod
          def zero_interval(q,lo,hi):
              rr=residue(q,hi)
              return ((rr>>lo)&((1<<(hi-lo))-1))==0

          L0,L1,L2,L3=[tuple(x) for x in expected]
          c0,c1,c2,c3=map(centre,(L0,L1,L2,L3))
          comp1=advance((1,0,1),L0)
          C0=c0
          C1=pull(comp1,c1)
          comp2=advance(comp1,L1)
          C2=pull(comp2,c2)
          comp3=advance(comp2,L2)
          C3=pull(comp3,c3)
          p0=rat_v2(C0-C1)
          p1=rat_v2(C1-C2)
          p2=rat_v2(C2-C3)
          assert [p0,p1,p2]==[15,27,28]
          assert zero_interval(C1,p0,p1)
          assert zero_interval(C2,p1,p2)
          rr=residue(C2,p2+1)
          assert (rr^(1<<p2))==23797

          result={
              'schema':'COLLATZ_LAW_COMPLETE_ZEROZERO_V76_QUALIFICATION',
              'status':'WARRANTED_BOUNDED_LAW_ONLY_INSUFFICIENT',
              'parent_result_sha256':claimed,
              'source_keys_retained':False,
              'observed_adjacency_retained':False,
              'first_witness_anchor':1,
              'first_witness_precisions':[15,27,28],
              'first_witness_interval_widths':[12,1],
              'natural_congruence_witness':23797,
              'global_collatz':'UNKNOWN',
              'qed':False,
          }
          result['certificate_sha256']=hashlib.sha256(
              json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          git rev-parse HEAD > evidence/commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-law-complete-zerozero-v76-qualified
          path: evidence
          if-no-files-found: error
