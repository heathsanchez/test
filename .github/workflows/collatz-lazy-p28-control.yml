name: Collatz lazy p28 veto control

on:
  push:
    paths:
      - ".github/workflows/collatz-lazy-p28-control.yml"
      - "experiments/collatz_vslice_lazy_p28_scan.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-lazy-p28-control
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        k: [15,10,8]
    name: lazy-p28-k${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
      - name: Build retained, old p28, and lazy p28
        run: |
          g++ -O3 -march=native -fopenmp -DBLOCK_BITS=10 -DPREFIX_BITS=24 -DCOAL_BITS=16 \
            experiments/collatz_vslice_fused_scan.cpp -o /tmp/p24
          g++ -O3 -march=native -fopenmp -DBLOCK_BITS=10 -DBASE_BITS=24 -DDEEP_BITS=28 -DCOAL_BITS=16 \
            experiments/collatz_vslice_deep_fused_scan.cpp -o /tmp/p28-old
          g++ -O3 -march=native -fopenmp -DBLOCK_BITS=10 -DPREFIX_BITS=24 -DCOAL_BITS=16 \
            experiments/collatz_vslice_lazy_p28_scan.cpp -o /tmp/p28-lazy

      - name: Protect record
        run: |
          mkdir -p results
          N=2874993894540242321407
          /tmp/p28-lazy 30 5000 1 0 "$N" "$N" | tee results/record.txt
          grep -q "BEST first_descent_or_survival=920 seed=$N" results/record.txt
          grep -q "STATUS LAZY_P28_VETO_SCAN_CLOSED" results/record.txt

      - name: Benchmark sealed 2^30-seed world
        run: |
          set -o pipefail
          export OMP_NUM_THREADS=4
          K="${{ matrix.k }}"
          L=2392312122059207475200
          U=$(python - <<PY
          L=$L
          K=$K
          GLOBAL_U=3143983941795894239301
          target=1<<30
          print(min(GLOBAL_U,L+target*(1<<(K+1))))
          PY
          )
          /usr/bin/time -f '%e' -o results/p24.time /tmp/p24 "$K" 5000 1 0 "$L" "$U" > results/p24.txt
          /usr/bin/time -f '%e' -o results/old.time /tmp/p28-old "$K" 5000 1 0 "$L" "$U" > results/old.txt
          /usr/bin/time -f '%e' -o results/lazy.time /tmp/p28-lazy "$K" 5000 1 0 "$L" "$U" > results/lazy.txt
          python - <<'PY'
          import json,re
          k=int("${{ matrix.k }}")
          a=open("results/p24.txt").read()
          b=open("results/old.txt").read()
          c=open("results/lazy.txt").read()
          assert "STATUS PREFIX_COAL_PREDQ7_SIEVE_AND_SCAN_CLOSED" in a
          assert "STATUS DEEP_PREFIX_COAL_PREDQ7_SIEVE_AND_SCAN_CLOSED" in b
          assert "STATUS LAZY_P28_VETO_SCAN_CLOSED" in c
          ma=re.search(r"COALESCENCE_EXTRA_KILLED (\d+) PREDQ7_KILLED_AFTER_COALESCENCE (\d+) EXPLICIT (\d+)",a)
          mb=re.search(r"DEEP_PREFIX_LIVE (\d+) COALESCENCE_KILLED (\d+) PREDQ7_KILLED (\d+) EXPLICIT (\d+)",b)
          mc=re.search(r"LAZY_P28_COUNTS COALESCENCE_KILLED (\d+) PREDQ7_KILLED (\d+) P28_VETOED_AFTER_Q7 (\d+) EXPLICIT (\d+)",c)
          assert ma and mb and mc,(a[-2000:],b[-2000:],c[-2000:])
          p24_exp=int(ma.group(3))
          old_exp=int(mb.group(4))
          lazy_exp=int(mc.group(4))
          assert lazy_exp==old_exp,(old_exp,lazy_exp)
          at=float(open("results/p24.time").read())
          bt=float(open("results/old.time").read())
          ct=float(open("results/lazy.time").read())
          row={"k":k,"p24_explicit":p24_exp,"p28_explicit":lazy_exp,
               "p24_seconds":at,"old_p28_seconds":bt,"lazy_p28_seconds":ct,
               "lazy_vs_old_speedup":bt/ct if ct else None,
               "lazy_vs_p24_speedup":at/ct if ct else None}
          print("LAZY_P28_COMPARISON",json.dumps(row,separators=(",",":")))
          print("LAZY_P28_EXACT_CONTROL_OK")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazy-p28-k${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lazy-p28-k*
          path: gathered
      - name: Aggregate lazy veto economics
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[]
          for d in sorted(Path("gathered").glob("lazy-p28-k*")):
              a=(d/"p24.txt").read_text()
              b=(d/"old.txt").read_text()
              c=(d/"lazy.txt").read_text()
              k=int(re.search(r" k=(\d+) ",c).group(1))
              ma=re.search(r"COALESCENCE_EXTRA_KILLED (\d+) PREDQ7_KILLED_AFTER_COALESCENCE (\d+) EXPLICIT (\d+)",a)
              mb=re.search(r"DEEP_PREFIX_LIVE (\d+) COALESCENCE_KILLED (\d+) PREDQ7_KILLED (\d+) EXPLICIT (\d+)",b)
              mc=re.search(r"LAZY_P28_COUNTS COALESCENCE_KILLED (\d+) PREDQ7_KILLED (\d+) P28_VETOED_AFTER_Q7 (\d+) EXPLICIT (\d+)",c)
              assert ma and mb and mc and int(mb.group(4))==int(mc.group(4))
              at=float((d/"p24.time").read_text())
              bt=float((d/"old.time").read_text())
              ct=float((d/"lazy.time").read_text())
              rows.append({"k":k,"p24_explicit":int(ma.group(3)),"p28_explicit":int(mc.group(4)),
                           "p24_seconds":at,"old_p28_seconds":bt,"lazy_p28_seconds":ct,
                           "lazy_vs_old_speedup":bt/ct if ct else None,
                           "lazy_vs_p24_speedup":at/ct if ct else None})
          assert len(rows)==3,rows
          out={"kind":"lazy_p28_veto_on_retained_scheduler","rows":sorted(rows,key=lambda x:-x["k"])}
          Path("lazy-p28-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("LAZY_P28_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lazy-p28-field
          path: lazy-p28-field.json
          retention-days: 30
