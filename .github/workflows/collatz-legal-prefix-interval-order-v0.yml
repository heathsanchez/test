name: Collatz legal prefix interval order V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_legal_prefix_interval_order_v0.py'
      - '.github/workflows/collatz-legal-prefix-interval-order-v0.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-legal-prefix-interval-order-v0
          python experiments/collatz_legal_prefix_interval_order_v0.py | tee evidence/collatz-legal-prefix-interval-order-v0/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-legal-prefix-interval-order-v0
          path: evidence/collatz-legal-prefix-interval-order-v0
