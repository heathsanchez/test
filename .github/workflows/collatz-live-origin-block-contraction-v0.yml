name: Collatz first coefficient return V1
on:
  push:
    branches: [collatz-first-coefficient-return-v1]
    paths:
      - 'experiments/collatz_live_origin_block_contraction_v0.py'
      - '.github/workflows/collatz-live-origin-block-contraction-v0.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  block:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          set -euo pipefail
          python -u experiments/collatz_live_origin_block_contraction_v0.py | tee /tmp/block.json
          python -u experiments/collatz_live_origin_exit_hazard_v0.py | tee /tmp/hazard.json
          python -u experiments/collatz_crystal_single_source_resource_v1.py | tee /tmp/single-source.json
          python -u experiments/collatz_crystal_macro_obligation_v1.py | tee /tmp/macro-obligation.json
          python -u experiments/collatz_first_coefficient_return_v1.py | tee /tmp/first-coefficient-return.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-live-origin-block-contraction-v0
          path: |
            /tmp/block.json
            /tmp/hazard.json
            /tmp/single-source.json
            /tmp/macro-obligation.json
            /tmp/first-coefficient-return.json
