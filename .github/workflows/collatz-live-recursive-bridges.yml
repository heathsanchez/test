name: Collatz live-only recursive bridge sieve

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-live-recursive-bridges.yml"
      - "experiments/collatz_live_recursive_bridges.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-live-recursive-bridges
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate exact retained q14 reverse bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import (
              enumerate_first_contractions,sparse_quotient
          )
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          print("Q14_BANK_READY",
                f"selected={len(selected)} killed={killed}/{total}")
          PY

      - name: Run exact live-only recursive sieve to B32
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_live_recursive_bridges.cpp             -o /tmp/live
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/live 32 results/q14-bank.txt | tee results/census.txt
          grep -q "VERIFIED_LIVE_ONLY_RECURSIVE_BRIDGE_SIEVE" results/census.txt

      - name: Verify exact weakening and compounding controls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          s=open("results/census.txt").read()
          rows=[]
          for m in re.finditer(
              r"LIVE_RECURSIVE_LEVEL k=(\d+) parents=(\d+) "
              r"descent=(\d+) bridge=(\d+) live=(\d+) "
              r"odd_live_fraction=([0-9.eE+-]+)",s):
              rows.append({
                "k":int(m.group(1)),
                "parents":int(m.group(2)),
                "descent":int(m.group(3)),
                "bridge":int(m.group(4)),
                "live":int(m.group(5)),
                "odd_live_fraction":float(m.group(6)),
              })
          assert len(rows)==32,len(rows)
          by={r["k"]:r for r in rows}

          # Exact match to the old descent-only live recursion before the first
          # bridge can fire.  Coalescence is intentionally omitted in both.
          refs={1:1,2:1,3:2,4:3,5:4,6:8,7:13,8:19}
          for k,v in refs.items():
              assert by[k]["live"]==v,(k,by[k],v)
              assert by[k]["bridge"]==0,(k,by[k])

          # First known bridge resonance must appear at k=9.
          assert by[9]["bridge"]>0,by[9]

          # Previous exact descent-only live recursion at B32 left 41,347,483
          # states.  Compiled bridges must strictly improve that sound system.
          assert by[32]["live"] < 41347483,by[32]

          done=re.search(
              r"LIVE_RECURSIVE_DONE K=32 final_live=(\d+) "
              r"total_descent=(\d+) total_bridge=(\d+) "
              r"bridge_controls=(\d+)",s)
          assert done
          final_live,total_descent,total_bridge,controls=map(int,done.groups())
          assert final_live==by[32]["live"]
          assert total_bridge>0 and controls>0

          tm=open("results/time-memory.txt").read().strip().split()
          out={
            "kind":"live_only_recursive_bridge_sieve",
            "K":32,
            "final_live":final_live,
            "odd_live_fraction":by[32]["odd_live_fraction"],
            "descent_only_reference_live":41347483,
            "relative_reduction_vs_descent_only":1-final_live/41347483,
            "total_descent":total_descent,
            "total_bridge":total_bridge,
            "bridge_controls":controls,
            "wall_seconds":float(tm[0]) if tm else None,
            "max_rss_kb":int(tm[1]) if len(tm)>1 else None,
            "levels":rows,
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("LIVE_RECURSIVE_BRIDGE_FIELD",
                json.dumps(out,separators=(",",":")))
          print("LIVE_RECURSIVE_BRIDGE_COMPOUNDING_OK")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-recursive-bridge-b32
          path: results
          retention-days: 30
