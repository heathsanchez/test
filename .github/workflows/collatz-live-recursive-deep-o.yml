name: Collatz live recursive deep O constructors

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-live-recursive-deep-o.yml"
      - "experiments/collatz_live_recursive_deep_o.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-live-recursive-deep-o
  cancel-in-progress: true

jobs:
  deep-o:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate frozen q14 first-contraction bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import (
              enumerate_first_contractions,sparse_quotient
          )
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          print("Q14_BANK_READY",len(selected))
          PY

      - name: Run exact deep-O compiled recursion to B34
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_live_recursive_deep_o.cpp             -o /tmp/deepo
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/deepo 34 results/q14-bank.txt | tee results/census.txt
          grep -q "VERIFIED_LIVE_ONLY_RECURSIVE_DEEP_O_SIEVE" results/census.txt

      - name: Compare with frozen first-contraction baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          s=open("results/census.txt").read()
          rows=[]
          for m in re.finditer(
              r"LIVE_RECURSIVE_LEVEL k=(\d+) parents=(\d+) "
              r"descent=(\d+) bridge=(\d+) deep_o=(\d+) "
              r"live=(\d+) odd_live_fraction=([0-9.eE+-]+)",s):
              rows.append({
                  "k":int(m.group(1)),
                  "parents":int(m.group(2)),
                  "descent":int(m.group(3)),
                  "bridge":int(m.group(4)),
                  "deep_o":int(m.group(5)),
                  "live":int(m.group(6)),
                  "odd_live_fraction":float(m.group(7)),
              })
          assert len(rows)==34,len(rows)
          by={r["k"]:r for r in rows}

          done=re.search(
              r"LIVE_RECURSIVE_DONE K=34 final_live=(\d+) "
              r"total_descent=(\d+) total_bridge=(\d+) "
              r"total_deep_o=(\d+) bridge_controls=(\d+) "
              r"deep_o_controls=(\d+)",s)
          assert done,s[-4000:]
          vals=list(map(int,done.groups()))
          final_live,total_descent,total_bridge,total_deep_o,bc,oc=vals
          assert final_live==by[34]["live"]

          baseline=121528197
          assert total_deep_o>0,(total_deep_o,rows)
          assert final_live < baseline,(final_live,baseline)

          tm=open("results/time-memory.txt").read().strip().split()
          out={
              "kind":"live_recursive_deep_o",
              "K":34,
              "baseline_first_contraction_live":baseline,
              "final_live":final_live,
              "new_relative_reduction":1-final_live/baseline,
              "odd_live_fraction":by[34]["odd_live_fraction"],
              "total_descent":total_descent,
              "total_bridge":total_bridge,
              "total_deep_o":total_deep_o,
              "bridge_controls":bc,
              "deep_o_controls":oc,
              "wall_seconds":float(tm[0]) if tm else None,
              "max_rss_kb":int(tm[1]) if len(tm)>1 else None,
              "levels":rows,
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("LIVE_RECURSIVE_DEEP_O_FIELD",
                json.dumps(out,separators=(",",":")))
          print("DEEP_O_ADDS_COMPOSED_CLOSURE_OK")
          PY

      - name: Certify q14 product residual
        run: |
          LIVE=$(python - <<'PY'
          import json
          print(json.load(open("results/summary.json"))["final_live"])
          PY
          )
          python experiments/collatz_global_constructor_product.py             --two-bits 34 --two-live "$LIVE"             --q 14 --q-killed 2233499             --out results/product.json | tee results/product.txt
          python - <<'PY'
          import json
          r=json.load(open("results/product.json"))
          print("DEEP_O_Q14_PRODUCT_RESIDUAL",
                r["mixed_residual_fraction_exact"],
                r["mixed_residual_fraction"])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-recursive-deep-o-b34
          path: results
          retention-days: 30
