name: Collatz macro depth five scaling

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-macro-depth5-scaling.yml"
      - "experiments/collatz_reverse_macro_grammar.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
      - "experiments/collatz_global_constructor_product.py"
  workflow_dispatch:

concurrency:
  group: collatz-macro-depth5-scaling
  cancel-in-progress: true

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        k: [30,34]
    name: macro5-b${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare q14 bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY

      - name: Run macro depth five
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_reverse_macro_grammar.cpp -o /tmp/macro
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/macro ${{ matrix.k }} results/q14-bank.txt 5             | tee results/census.txt
          grep -q "VERIFIED_REVERSE_MACRO_GRAMMAR_SIEVE" results/census.txt

      - name: Record exact frontier and product
        run: |
          set -euo pipefail
          K=${{ matrix.k }}
          python - <<'PY'
          import json,re
          K=int("${{ matrix.k }}")
          refs={
              30:{"deep_o":9590847,"h16":6947941},
              34:{"deep_o":120420841,"h16":85313088},
          }
          s=open("results/census.txt").read()
          m=re.search(
              rf"LIVE_RECURSIVE_DONE K={K} final_live=(\d+) "
              r"total_descent=(\d+) total_bridge=(\d+) "
              r"total_deep_o=(\d+) total_macro=(\d+) "
              r"bridge_controls=(\d+) deep_o_controls=(\d+) "
              r"macro_controls=(\d+)",s)
          assert m,s[-10000:]
          live,des,bridge,do,macro,bc,dc,mc=map(int,m.groups())
          base=refs[K]["deep_o"]; h16=refs[K]["h16"]
          gain=base-live; h16gain=base-h16
          tm=open("results/time-memory.txt").read().strip().split()
          out={
              "kind":"macro_depth5_scaling",
              "K":K,"live":live,
              "deep_o_baseline":base,
              "h16_reference":h16,
              "gain":gain,
              "gain_vs_h16":h16-live,
              "fraction_of_h16_gain":gain/h16gain,
              "direct_macro_closures":macro,
              "controls":mc,
              "wall_seconds":float(tm[0]) if tm else None,
              "max_rss_kb":int(tm[1]) if len(tm)>1 else None,
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("MACRO5_SCALING_RESULT",json.dumps(out,separators=(",",":")))
          PY

          LIVE=$(python - <<'PY'
          import json
          print(json.load(open("results/summary.json"))["live"])
          PY
          )
          python experiments/collatz_global_constructor_product.py             --two-bits "$K" --two-live "$LIVE"             --q 14 --q-killed 2233499             --out results/product.json | tee results/product.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro5-b${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: scale
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macro5-b*
          path: gathered
      - name: Aggregate macro5 scaling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("macro5-b*"):
              s=json.loads((d/"summary.json").read_text())
              p=json.loads((d/"product.json").read_text())
              s["product_residual_fraction"]=p["mixed_residual_fraction"]
              s["product_residual_fraction_exact"]=p["mixed_residual_fraction_exact"]
              rows.append(s)
          rows.sort(key=lambda r:r["K"])
          assert [r["K"] for r in rows]==[30,34],rows
          out={"kind":"macro_depth5_scaling_curve","rows":rows}
          Path("macro5-scaling-field.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("MACRO5_SCALING_FIELD",json.dumps(out,separators=(",",":"),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: macro5-scaling-field
          path: macro5-scaling-field.json
          retention-days: 30
