name: Collatz minimal-candidate descent records
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_minimal_candidate_descent_records.py'
      - '.github/workflows/collatz-minimal-candidate-descent-records.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_minimal_candidate_descent_records.py | tee /tmp/descent-records.txt
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-candidate-descent-records
          path: /tmp/descent-records.txt
