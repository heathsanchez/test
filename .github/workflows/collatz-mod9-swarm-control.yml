name: Collatz mod9-predecessor swarm control

on:
  push:
    paths:
      - ".github/workflows/collatz-mod9-swarm-control.yml"
      - "experiments/collatz_predecessor_mod9.py"
      - "experiments/collatz_vslice_prefix_mod9_scan.cpp"
      - "experiments/collatz_vslice_prefix_sieve_scan.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-mod9-swarm-control
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact mod9 predecessor theorem
        run: |
          python experiments/collatz_predecessor_mod9.py | tee /tmp/mod9.txt
          grep -q "VERIFIED_SHORTCUT_COLLATZ_MOD9_PREDECESSOR_SIEVE" /tmp/mod9.txt
      - name: Build exact p24 candidates
        run: |
          g++ -O3 -march=native -fopenmp -DBLOCK_BITS=10 -DPREFIX_BITS=24             experiments/collatz_vslice_prefix_sieve_scan.cpp -o /tmp/p24
          g++ -O3 -march=native -fopenmp -DBLOCK_BITS=10 -DPREFIX_BITS=24             experiments/collatz_vslice_prefix_mod9_scan.cpp -o /tmp/mod9
      - name: Protect exact 920 record
        run: |
          set -o pipefail
          mkdir -p results
          N=2874993894540242321407
          /tmp/mod9 30 5000 1 0 "$N" "$N" | tee results/record.txt
          grep -q "BEST first_descent_or_survival=920 seed=$N" results/record.txt
          grep -q "STATUS PREFIX_MOD9_SIEVE_AND_SCAN_CLOSED" results/record.txt
          echo MOD9_RECORD_CONTROL_OK
      - name: Compare exact large sealed worlds
        run: |
          set -o pipefail
          export OMP_NUM_THREADS=4
          L=2392312122059207475200
          for K in 15 10 8; do
            U=$(python - <<PY
          L=$L
          K=$K
          GLOBAL_U=3143983941795894239301
          target=1<<26
          print(min(GLOBAL_U,L+target*(1<<(K+1))))
          PY
            )
            /usr/bin/time -f '%e' -o results/p24-k$K.time               /tmp/p24 $K 5000 1 0 "$L" "$U" > results/p24-k$K.txt
            /usr/bin/time -f '%e' -o results/mod9-k$K.time               /tmp/mod9 $K 5000 1 0 "$L" "$U" > results/mod9-k$K.txt
          done
          python - <<'PY'
          import json,re
          rows=[]
          for k in (15,10,8):
              a=open(f"results/p24-k{k}.txt").read()
              b=open(f"results/mod9-k{k}.txt").read()
              assert "STATUS PREFIX_SIEVE_AND_SCAN_CLOSED" in a,a[-4000:]
              assert "STATUS PREFIX_MOD9_SIEVE_AND_SCAN_CLOSED" in b,b[-4000:]
              ah=re.search(r"full_count=(\d+).*explicit_count=(\d+)",a)
              ascan=re.search(r"SCANNED (\d+).*overflows=(\d+)",a)
              bh=re.search(r"full_count=(\d+).*explicit_count=(\d+)",b)
              bk=re.search(r"MOD9_KILLED (\d+) EXPLICIT (\d+)",b)
              bscan=re.search(r"SCANNED (\d+).*overflows=(\d+)",b)
              assert ah and ascan and bh and bk and bscan
              full,pex=map(int,ah.groups())
              bfull,bprefix=map(int,bh.groups())
              mod9,explicit=map(int,bk.groups())
              assert full==bfull and pex==bprefix
              assert mod9+explicit==pex,(k,mod9,explicit,pex)
              assert int(ascan.group(1))==pex
              assert int(bscan.group(1))==explicit
              at=float(open(f"results/p24-k{k}.time").read())
              bt=float(open(f"results/mod9-k{k}.time").read())
              rows.append({
                  "k":k,"full":full,"p24_explicit":pex,
                  "mod9_killed_after_p24":mod9,"combined_explicit":explicit,
                  "explicit_reduction_factor":pex/explicit if explicit else float("inf"),
                  "p24_seconds":at,"mod9_seconds":bt,
                  "speedup":at/bt if bt else float("inf"),
              })
          print("MOD9_SWARM_COMPARISON",json.dumps(rows,separators=(",",":")))
          assert all(r["combined_explicit"] < r["p24_explicit"] for r in rows),rows
          print("MOD9_SWARM_EXACT_CONTROL_OK")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-mod9-swarm-control
          path: results
          if-no-files-found: error
          retention-days: 30
