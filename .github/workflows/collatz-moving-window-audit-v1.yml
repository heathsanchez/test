name: Collatz moving-window audit V1
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - experiments/collatz_moving_polynomial_window_macro_v0.py
      - .github/workflows/collatz-moving-window-audit-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/collatz_moving_polynomial_window_macro_v0.py
