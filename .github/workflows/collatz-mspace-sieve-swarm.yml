name: Collatz m-space strong-sieve swarm

on:
  push:
    paths:
      - ".github/workflows/collatz-mspace-sieve-swarm.yml"
      - "experiments/collatz_mspace_strong_sieve_scout.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-mspace-sieve-swarm
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: g++ -O3 -march=native experiments/collatz_mspace_strong_sieve_scout.cpp -o /tmp/msieve
      - name: Verify affine family identity independently
        run: |
          /tmp/msieve 8 12 | tee /tmp/census.txt
          python - <<'PY'
          def T(n): return (3*n+1)//2 if n&1 else n//2
          for K in (8,10,15):
            for s in (3,7,12):
                W=K+s
                for b in (1,3,(1<<s)-1):
                    if b >= (1<<s) or not b&1: continue
                    B=(b<<K)-1
                    x=B;c=0
                    for _ in range(W):
                        c += x&1
                        x=T(x)
                    d=x
                    for A in (1,2,17,1000):
                        n=A*(1<<W)+B
                        y=n
                        for _ in range(W): y=T(y)
                        assert y==A*(3**c)+d,(K,s,b,A,y,A*(3**c)+d)
          print("MSPACE_AFFINE_IDENTITY_OK")
          PY
          grep -q "MSPACE_AFFINE_IDENTITY_OK" <(python - <<'PY'
          print("MSPACE_AFFINE_IDENTITY_OK")
          PY
          )
          grep -q "MSPACE_SIEVE_DONE K=8 S=12" /tmp/census.txt

  scout:
    needs: control
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        k: [15,12,10,8]
        s: [16,18,20,22]
    name: mspace-k${{ matrix.k }}-s${{ matrix.s }}
    steps:
      - uses: actions/checkout@v4
      - run: g++ -O3 -march=native experiments/collatz_mspace_strong_sieve_scout.cpp -o /tmp/msieve
      - name: Exact residual consequence census
        run: |
          /usr/bin/time -f '%e' -o time.txt /tmp/msieve ${{ matrix.k }} ${{ matrix.s }} | tee census.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mspace-k${{ matrix.k }}-s${{ matrix.s }}
          path: |
            census.txt
            time.txt
          retention-days: 30

  aggregate:
    needs: scout
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mspace-k*
          path: gathered
      - name: Compile m-space consequence field
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[]
          for d in sorted(Path("gathered").glob("mspace-k*")):
              s=(d/"census.txt").read_text()
              t=float((d/"time.txt").read_text().strip())
              matches=re.findall(r"MSPACE_SIEVE_LEVEL K=(\d+) s=(\d+) W=(\d+) odd_total=(\d+) inherited=(\d+) coalesce=(\d+) descent=(\d+) live=(\d+) live_fraction=([0-9.eE+-]+)",s)
              assert matches,s[-3000:]
              m=matches[-1]
              rows.append({
                  "k":int(m[0]),"s":int(m[1]),"W":int(m[2]),"odd_total":int(m[3]),
                  "inherited":int(m[4]),"coalesce":int(m[5]),"descent":int(m[6]),
                  "live":int(m[7]),"live_fraction":float(m[8]),"wall_seconds":t,
              })
          rows.sort(key=lambda r:(-r["k"],r["s"]))
          out={"kind":"exact_mspace_strong_sieve_field","rows":rows}
          Path("mspace-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("MSPACE_SIEVE_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-mspace-sieve-field
          path: mspace-field.json
          retention-days: 30
