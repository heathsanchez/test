name: Collatz natural bar falsifier V69
on:
  push:
    branches: [collatz-natural-bar-falsifier-v69]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collatz-class-merger-ledger-v67
          run-id: 36843884976
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v67

      - name: Verify warranted V67 parent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def check(path, expected):
              d=json.load(open(path))
              claimed=d.pop('certificate_sha256')
              got=hashlib.sha256(json.dumps(d,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              assert claimed==got==expected
              return d
          r=check('parent-v67/result.json','5aeae16666a406e0e9ba9330224d6bcd1ee632194a45f0b3b9f6b10587f999cb')
          q=check('parent-v67/qualification.json','1b4a484af5d2858907b8c572054494f2344bd5d530d35ea4751cc8ed06ed17b6')
          assert q['status']=='WARRANTED_BOUNDED'
          assert q['kernel_checked_whole_cell_mergers']==121
          assert r['remaining_cells']==14813
          assert r['remaining_residues'][0]==30
          print('V67_PARENT_VERIFIED; FIRST_RESIDUAL_R30')
          PY

      - name: Kernel-check inherited first consequential split
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p evidence
          lake build CollatzFinal > evidence/spine.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/SourceCylinderExit.olean formal/Collatz/SourceCylinderExit.lean >/dev/null
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/GuardedExitObligation.olean formal/Collatz/GuardedExitObligation.lean >/dev/null
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/EarlierSourceCollision.olean formal/Collatz/EarlierSourceCollision.lean >/dev/null
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/R30FirstSplit.olean formal/Collatz/R30FirstSplit.lean | tee evidence/r30-first-split.log
          ! grep -q 'sorryAx' evidence/r30-first-split.log
          ! grep -q 'Lean.ofReduceBool' evidence/r30-first-split.log
          grep -q 'r30_depth22_first_split_merger' evidence/r30-first-split.log

      - name: Reclose r30 and falsify fixed zero-bar bounds
        run: |
          set -euo pipefail
          python3 experiments/collatz_natural_bar_falsifier_v69.py > evidence/result.json
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/result.json'))
          r=d['r30_reclosure']
          assert r['depth36_total_equivalent_slots']==262144
          assert r['depth36_closed_equivalent_slots']==167926
          assert r['depth36_survivors']==94218
          assert d['zero_tail_calibration_depth30']['max_zero_wait']==152
          assert d['zero_tail_deeper_depth34']['max_zero_wait']==245
          assert d['depth34_survivors_exceeding_B152']==18
          f=d['fixed_bound_B245']
          assert f['verdict']=='REJECTED'
          assert f['falsifier_residue']==38208274462
          assert f['no_close_through_depth']==281
          assert f['first_close_depth']==284
          assert f['required_zero_wait']==248
          assert f['kind']=='S'
          assert d['new_merger_constructors']==0
          assert d['new_state_coordinates']==0
          assert not d['qed'] and d['global_collatz']=='UNKNOWN'
          print('PASS_R30_RECLOSURE; REJECT_B152; REJECT_B245; STRUCTURAL_NATURAL_BAR_STILL_UNKNOWN')
          PY
          git rev-parse HEAD > evidence/commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-natural-bar-falsifier-v69
          path: evidence
          if-no-files-found: error
