name: Collatz Natural Zero Tail Bridge
on:
  push:
    branches: [collatz-natural-zero-tail-bridge-20260930]
    paths:
      - 'formal/Collatz/NaturalZeroTailBridge.lean'
      - '.github/workflows/collatz-natural-zero-tail-bridge.yml'
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and build parent
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake build CollatzFinal
      - name: Kernel-check natural zero-tail bridge
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DautoImplicit=false formal/Collatz/NaturalZeroTailBridge.lean | tee /tmp/bridge.log
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/bridge.log').read_text()
          src=Path('formal/Collatz/NaturalZeroTailBridge.lean').read_text()
          assert 'sorryAx' not in s and 'Lean.ofReduceBool' not in s
          assert not re.search(r'\b(sorry|admit|axiom|unsafe)\b',src)
          print('NATURAL_ZERO_TAIL_BRIDGE_KERNEL_CHECKED')
          print('GLOBAL_COLLATZ_UNKNOWN')
          PY
