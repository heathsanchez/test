name: Collatz Crystal no-exit late boundary V1
on:
  push:
    branches: [collatz-crystal-noexit-late-boundary-v1]
    paths:
      - 'experiments/collatz_24bit_late_source_extract_v0.cpp'
      - 'experiments/collatz_noexit_late_boundary_v0.py'
      - 'experiments/collatz_reverse_predecessor_tree.py'
      - '.github/workflows/collatz-noexit-late-boundary-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact-integer build dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - name: Extract exact 24-bit late sources
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 experiments/collatz_24bit_late_source_extract_v0.cpp -o /tmp/late
          /tmp/late | tee /tmp/late.json
      - name: Compose Q14/Q18 reverse exits on actual prefixes
        run: |
          set -euo pipefail
          python -u experiments/collatz_noexit_late_boundary_v0.py /tmp/late.json | tee /tmp/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-noexit-late-boundary-v0
          path: |
            /tmp/late.json
            /tmp/result.json
