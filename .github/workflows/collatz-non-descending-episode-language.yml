name: Collatz non-descending episode language

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-non-descending-episode-language.yml"
      - "experiments/collatz_non_descending_episode_language.py"
      - "experiments/collatz_odd_episode_grammar.py"
  workflow_dispatch:

concurrency:
  group: collatz-non-descending-episode-language
  cancel-in-progress: true

jobs:
  language:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { r: 8,  p: 14, e: 256 }
          - { r: 12, p: 16, e: 384 }
          - { r: 16, p: 18, e: 512 }
          - { r: 20, p: 18, e: 512 }
    name: language-r${{ matrix.r }}-p${{ matrix.p }}
    steps:
      - uses: actions/checkout@v4
      - name: Run exact bounded non-descending language
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             python experiments/collatz_non_descending_episode_language.py               --max-r ${{ matrix.r }}               --precision ${{ matrix.p }}               --max-episodes ${{ matrix.e }}               --out results/language.json             | tee results/census.txt
          grep -q "VERIFIED_BOUNDED_NON_DESCENDING_EPISODE_LANGUAGE" results/census.txt
          grep -q "NON_DESCENDING_R2_SELF_CONTROLS" results/census.txt

      - name: Freeze exact countdown controls
        run: |
          python - <<'PY'
          import json
          r=json.load(open("results/language.json"))
          assert r["proof_status"]=="exact_bounded_residual_language_not_global_proof"
          for z in r["r2_self_controls"]:
              assert z["observed_repeats"]==z["k"],z
              assert z["required_v2_m_plus_1"]==3*z["k"]+1,z
          print("NON_DESCENDING_LANGUAGE_GATES_OK",
                r["max_r"],r["precision"],r["max_delay"],
                r["unresolved_at_episode_cap"])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: non-desc-language-r${{ matrix.r }}-p${{ matrix.p }}
          path: results
          retention-days: 30

  aggregate:
    needs: language
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: non-desc-language-r*
          path: gathered
      - name: Aggregate delay and prefix curve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("non-desc-language-r*"):
              p=d/"language.json"; assert p.exists(),d
              r=json.loads(p.read_text())
              tm=(d/"time-memory.txt").read_text().strip().split()
              top=[]
              for z in r["top_prefixes"][:40]:
                  top.append({"length":z["length"],"word":z["word"],"count":z["count"]})
              rows.append({
                  "max_r":r["max_r"],
                  "precision":r["precision"],
                  "cases":r["total_cases"],
                  "max_delay":r["max_delay"],
                  "unresolved":r["unresolved_at_episode_cap"],
                  "hardest":r["hardest"][:20],
                  "top_prefixes":top,
                  "wall_seconds":float(tm[0]) if tm else None,
                  "max_rss_kb":int(tm[1]) if len(tm)>1 else None,
              })
          rows.sort(key=lambda z:(z["max_r"],z["precision"]))
          assert [(z["max_r"],z["precision"]) for z in rows]==[
              (8,14),(12,16),(16,18),(20,18)],rows
          out={"kind":"bounded_non_descending_episode_language_curve","rows":rows}
          Path("non-descending-episode-language-field.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("NON_DESCENDING_EPISODE_LANGUAGE_FIELD",
                json.dumps(out,separators=(",",":"),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: non-descending-episode-language-field
          path: non-descending-episode-language-field.json
          retention-days: 30
