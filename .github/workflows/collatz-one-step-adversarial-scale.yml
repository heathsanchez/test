name: Collatz adversarial one-step scaling

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-one-step-adversarial-scale.yml"
      - "experiments/collatz_one_step_adversarial_scale.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-one-step-adversarial-scale
  cancel-in-progress: true

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        k: [32,64,128,192,256,384,512,768,1024]
    name: adversarial-k${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bigint headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev
      - name: Run exact adversarial scale search
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -march=native -std=c++20 experiments/collatz_one_step_adversarial_scale.cpp -o /tmp/adv
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/adv ${{ matrix.k }} | tee results/census.txt
          grep -q "ADVERSARIAL_ONE_STEP_SCALE_COMPLETE" results/census.txt
      - name: Parse
        run: |
          python - <<'PY'
          import json,re
          K=int("${{ matrix.k }}")
          s=open("results/census.txt").read()
          m=re.search(
              rf"ADVERSARIAL_ONE_STEP_SCALE_RESULT K={K} seeds=(\d+) "
              r"search_H=(\d+) failures=(\d+) worst_f=(-?\d+) "
              r"worst_index=(-?\d+) minimal_c=(-?\d+) ratio=([-0-9.eE+]+)",s)
          assert m,s[-3000:]
          seeds,H,fail,wf,wi,c,ratio=m.groups()
          tm=open("results/time-memory.txt").read().strip().split()
          out={"K":K,"seeds":int(seeds),"search_H":int(H),"failures":int(fail),
               "worst_f":int(wf),"worst_index":int(wi),"minimal_c":int(c),
               "worst_f_over_K":float(ratio),
               "wall_seconds":float(tm[0]),"max_rss_kb":int(tm[1]),
               "proof_status":"structured_falsification_only"}
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("ADVERSARIAL_ONE_STEP_SCALE_CELL",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adversarial-one-step-k${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: scale
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: adversarial-one-step-k*
          path: gathered
      - name: Aggregate scale field
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("adversarial-one-step-k*"):
              p=d/"summary.json"; assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda x:x["K"])
          expected=[32,64,128,192,256,384,512,768,1024]
          assert [x["K"] for x in rows]==expected,rows
          out={"kind":"adversarial_one_step_scaling","rows":rows,
               "max_ratio":max(x["worst_f_over_K"] for x in rows),
               "max_minimal_c":max(x["minimal_c"] for x in rows)}
          Path("adversarial-one-step-scale-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("ADVERSARIAL_ONE_STEP_SCALE_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adversarial-one-step-scale-field
          path: adversarial-one-step-scale-field.json
          retention-days: 30
