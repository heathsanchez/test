name: Collatz Origin-48 24-bit falsifier
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths: ['.github/workflows/collatz-origin48-24bit-falsifier.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test exact Origin-48 envelope on 24-bit source window
        run: |
          cd experiments
          python -u collatz_live_origin_bridge_v1.py --source-bits 24 --depth 512 --symbolic-depth 18 | tee /tmp/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: collatz-origin48-24bit-falsifier, path: /tmp/result.json}

# trigger
