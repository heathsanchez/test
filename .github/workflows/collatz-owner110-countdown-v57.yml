name: Collatz Owner 110 Countdown V57
on:
  push:
    branches: [collatz-owner110-countdown-v57]
    paths:
      - 'formal/Collatz/Owner110Countdown.lean'
      - '.github/workflows/collatz-owner110-countdown-v57.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Qualify all-depth 110 countdown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-owner110-countdown-v57
          lake env lean --version | tee evidence/collatz-owner110-countdown-v57/toolchain.txt
          lake build CollatzFinal
          f=formal/Collatz/Owner110Countdown.lean
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' "$f"; then
            echo "Forbidden source token in $f" >&2
            exit 1
          fi
          lake env lean -DautoImplicit=false "$f" \
            | tee evidence/collatz-owner110-countdown-v57/Owner110Countdown.lean.log
          grep -q "owner110_chain_pow_two_dvd" evidence/collatz-owner110-countdown-v57/Owner110Countdown.lean.log
          grep -q "owner110_no_chain_self_bound" evidence/collatz-owner110-countdown-v57/Owner110Countdown.lean.log
          ! grep -E 'sorryAx|Lean.ofReduceBool' evidence/collatz-owner110-countdown-v57/Owner110Countdown.lean.log
          git rev-parse HEAD > evidence/collatz-owner110-countdown-v57/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-owner110-countdown-v57
          path: evidence/collatz-owner110-countdown-v57
          if-no-files-found: error
