name: Collatz P37 rejection semantics V1
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'formal/Collatz/P37Rejection.lean'
      - '.github/workflows/collatz-p37-rejection-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact theorem and example
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-p37-rejection-v1
          git rev-parse HEAD > evidence/collatz-p37-rejection-v1/commit.txt
          lake env lean --version > evidence/collatz-p37-rejection-v1/toolchain.txt
          lake build CollatzFinal
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' formal/Collatz
          for module in SourceProduct SourceProductAffine CoefficientCrossing; do
            lake env lean -DautoImplicit=false -o ".lake/build/lib/lean/Collatz/$module.olean" "formal/Collatz/$module.lean" > "evidence/collatz-p37-rejection-v1/$module.log"
          done
          lake env lean -DautoImplicit=false formal/Collatz/P37Rejection.lean | tee evidence/collatz-p37-rejection-v1/P37Rejection.log
          ! grep -R 'sorryAx\|Lean.ofReduceBool' evidence/collatz-p37-rejection-v1/*.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/collatz-p37-rejection-v1')
          report={
            'status':'WARRANTED_LEAN_SEMANTIC_AUDIT',
            'parent_head':'5242a12a17fadf50a028fde5eb7817230971e6bf',
            'head':(p/'commit.txt').read_text().strip(),
            'theorem':'off_type_excludes_parent_residual',
            'scope':'same-source off-type first-crossing certificates reject the parent, rather than providing residual successors',
            'not_proved':['a witness-changing P37 induction rule','universal live-origin bound','universal canonical M>=0 exclusion'],
            'global_collatz':'UNKNOWN'
          }
          (p/'result.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-p37-rejection-v1
          path: evidence/collatz-p37-rejection-v1
          if-no-files-found: error
