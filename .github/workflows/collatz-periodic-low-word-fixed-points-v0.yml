name: Collatz Periodic Low Word Fixed Points
on:
  push:
    branches: [collatz-three-quarter-future7-cylinder-v0]
jobs:
  fixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python experiments/collatz_periodic_low_word_fixed_points_v0.py | tee /tmp/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-periodic-low-word-fixed-points-v0
          path: /tmp/result.json
