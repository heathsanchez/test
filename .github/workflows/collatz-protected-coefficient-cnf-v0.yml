name: Collatz protected coefficient CNF V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_protected_coefficient_cnf_v0.py'
      - '.github/workflows/collatz-protected-coefficient-cnf-v0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  symbolic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install python-sat
      - name: Compiled protected continuation query
        run: python -u experiments/collatz_protected_coefficient_cnf_v0.py --bits 48 --horizon 128 --out evidence/collatz-protected-coefficient-cnf-v0/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-protected-coefficient-cnf-v0
          path: evidence/collatz-protected-coefficient-cnf-v0
          if-no-files-found: error
