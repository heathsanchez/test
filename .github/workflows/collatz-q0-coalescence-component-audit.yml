name: Collatz q0 coalescence component audit
on:
  push:
    branches: [collatz-rigid-component-termination-v1]
    paths:
      - 'experiments/collatz_q0_coalescence_component_audit.py'
      - '.github/workflows/collatz-q0-coalescence-component-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: q0 coalescence component audit
        run: |
          set -euo pipefail
          python -u experiments/collatz_q0_coalescence_component_audit.py --N 65535 --H 512 | tee /tmp/q0-coalescence.txt
          grep -q '^ANCHOR_27_DIRECT_CERT t=59 endpoint=23$' /tmp/q0-coalescence.txt
          grep -Eq '^OBSERVED_SINGLE_RIGID_COALESCENCE_COMPONENT_ANCHORED_AT_27$|^SEPARATOR_OUTSIDE_27_COMPONENT' /tmp/q0-coalescence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q0-coalescence-component-audit
          path: /tmp/q0-coalescence.txt
