name: Collatz q0 concrete recharge cycle separator
on:
  workflow_dispatch:
  push:
    branches: [collatz-rigid-component-termination-v1]
    paths:
      - 'experiments/collatz_q0_rigid_recharge_audit.py'
      - '.github/workflows/collatz-q0-concrete-recharge-cycle.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact shard containing first union SCC
        run: |
          set -euo pipefail
          python -u experiments/collatz_q0_rigid_recharge_audit.py --source-lo 16387 --source-N 20481 --depth 128 | tee /tmp/concrete-cycle.txt
          grep -q '^CONCRETE_PATTERN_CYCLES' /tmp/concrete-cycle.txt
          grep -q '^CONCRETE_ALL_RECHARGE_CYCLES' /tmp/concrete-cycle.txt
      - uses: actions/upload-artifact@v4
        with:
          name: concrete-recharge-cycle-separator
          path: /tmp/concrete-cycle.txt
