name: Collatz q0 repeatable cycle separator
on:
  workflow_dispatch:
  push:
    branches: [collatz-rigid-component-termination-v1]
    paths:
      - '.github/workflows/collatz-q0-repeatable-cycle-separator.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact cycle-rich shard
        run: |
          set -euo pipefail
          python -u experiments/collatz_q0_rigid_recharge_audit.py --source-lo 16387 --source-N 20481 --depth 128 | tee /tmp/repeatable-cycle.txt
          grep -q '^CONCRETE_PATTERN_CYCLE_FUEL' /tmp/repeatable-cycle.txt
          grep -Eq '^CONCRETE_REPEATABLE_PATTERN_CYCLES 0$|^CONCRETE_REPEATABLE_PATTERN_CYCLE_SEPARATOR' /tmp/repeatable-cycle.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q0-repeatable-cycle-separator
          path: /tmp/repeatable-cycle.txt
