name: Collatz q0 RIGID recharge scale
on:
  push:
    branches: [collatz-rigid-component-termination-v1]
    paths:
      - '.github/workflows/collatz-q0-rigid-recharge-scale.yml'
  workflow_dispatch:
jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scale exact RIGID recharge intersection
        run: |
          set -euo pipefail
          python -u experiments/collatz_q0_rigid_recharge_audit.py --source-N 1023 --depth 40 | tee /tmp/q0-rigid-recharge-scale.txt
          grep -Eq '^OBSERVED_NO_RECURRENT_RIGID_RECHARGE$|^SEPARATOR_RECURRENT_RIGID_RECHARGE$' /tmp/q0-rigid-recharge-scale.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q0-rigid-recharge-scale
          path: /tmp/q0-rigid-recharge-scale.txt
