name: Collatz Q14 height kernel V0
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths: ['experiments/collatz_q14_height_kernel_v0.py','.github/workflows/collatz-q14-height-kernel-v0.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: cd experiments && python collatz_q14_height_kernel_v0.py | tee /tmp/result.json
      - uses: actions/upload-artifact@v4
        with: {name: collatz-q14-height-kernel-v0, path: /tmp/result.json}
