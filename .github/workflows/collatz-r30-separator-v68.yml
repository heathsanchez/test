name: Collatz r30 separator V68
on:
  push:
    branches: [collatz-r30-separator-v68]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collatz-class-merger-ledger-v67
          run-id: 36843884976
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v67

      - name: Install pinned Lean and kernel-check first split
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          mkdir -p evidence
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal | tee evidence/spine.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/SourceCylinderExit.olean formal/Collatz/SourceCylinderExit.lean > evidence/source-cylinder.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/GuardedExitObligation.olean formal/Collatz/GuardedExitObligation.lean > evidence/guarded-obligation.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/EarlierSourceCollision.olean formal/Collatz/EarlierSourceCollision.lean > evidence/earlier-collision.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/R30FirstSplit.olean formal/Collatz/R30FirstSplit.lean | tee evidence/first-split-proof.log

      - name: Exhaust unsplit grammar and locate first consequential split
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/collatz_r30_separator_v68.py --parent-dir parent-v67 > evidence/result.json
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json,re
          from pathlib import Path
          d=json.load(open('evidence/result.json'))
          u=d['unsplit_uniform_reverse_exhaustion']
          s=d['minimal_reused_constructor_split']
          assert u['fixed_prefixes']==78
          assert u['exact_reverse_states']==8325986
          assert u['nonexpanding_candidates']==77
          assert u['identity_candidates']==77
          assert u['strict_lower_source_candidates']==0
          assert u['verdict']=='REJECT_UNSPLIT_UNIFORM_AFFINE_REVERSE_GRAMMAR'
          assert [x['closed'] for x in s['refinement'][:4]]==[0,0,0,0]
          assert s['first_consequential_depth']==22
          assert s['extra_parameter_bits']==4
          assert s['next_four_bit_value']==14
          assert s['child']['r']==3670046
          assert s['child']['kind']=='D'
          assert s['child']['k']==81
          assert not d['qed'] and d['global_collatz']=='UNKNOWN'
          proof=Path('evidence/first-split-proof.log').read_text()
          assert 'sorryAx' not in proof and 'Lean.ofReduceBool' not in proof
          assert 'r30_depth22_first_split_merger' in proof
          result={
            'schema':'COLLATZ_R30_SEPARATOR_V68_QUALIFICATION',
            'status':'WARRANTED_BOUNDED',
            'negative_boundary':'exact Python integer exhaustion of the declared unsplit uniform-affine reverse grammar; not a universal no-merger theorem',
            'exact_reverse_states':u['exact_reverse_states'],
            'strict_lower_source_candidates':0,
            'kernel_checked_first_split_merger':True,
            'first_consequential_depth':22,
            'extra_parameter_bits':4,
            'closed_child_residue':3670046,
            'remaining_siblings_at_depth22':15,
            'global_collatz':'UNKNOWN',
            'qed':False
          }
          result['certificate_sha256']=hashlib.sha256(
              json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          git rev-parse HEAD > evidence/commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-r30-separator-v68
          path: evidence
          if-no-files-found: error
