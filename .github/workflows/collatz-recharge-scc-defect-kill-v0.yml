name: Collatz recharge SCC defect kill V0
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths: ['experiments/collatz_recharge_scc_defect_kill_v0.py','.github/workflows/collatz-recharge-scc-defect-kill-v0.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: cd experiments && python collatz_recharge_scc_defect_kill_v0.py
