name: Collatz recharge SCC holdout V0
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths: ['experiments/collatz_recharge_scc_holdout_v0.py','.github/workflows/collatz-recharge-scc-holdout-v0.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: cd experiments && python -u collatz_recharge_scc_holdout_v0.py | tee /tmp/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: collatz-recharge-scc-holdout-v0, path: /tmp/result.txt}
