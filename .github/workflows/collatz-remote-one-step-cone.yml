name: Collatz remote one-step cone falsification

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-remote-one-step-cone.yml"
      - "experiments/collatz_remote_one_step_cone.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-remote-one-step-cone
  cancel-in-progress: true

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        k: [32,64,128,256,512,1024]
    name: remote-k${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bigint headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev
      - name: Run exact remote falsification sample
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -march=native -std=c++20 experiments/collatz_remote_one_step_cone.cpp -o /tmp/remote
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/remote ${{ matrix.k }} 5000 | tee results/census.txt
          grep -q "REMOTE_ONE_STEP_CONE_FALSIFICATION_COMPLETE" results/census.txt
      - name: Parse
        run: |
          python - <<'PY'
          import json,re
          K=int("${{ matrix.k }}")
          s=open("results/census.txt").read()
          m=re.search(
              rf"REMOTE_ONE_STEP_CONE_RESULT K={K} samples=(\d+) "
              r"direct=(\d+) cone=(\d+) hard=(\d+) worst_f=(-?\d+)",s)
          assert m,s[-4000:]
          samples,direct,cone,hard,worst=map(int,m.groups())
          assert direct+cone+hard==samples
          tm=open("results/time-memory.txt").read().strip().split()
          out={"K":K,"samples":samples,"direct":direct,"cone":cone,
               "hard":hard,"worst_f":worst,
               "wall_seconds":float(tm[0]),"max_rss_kb":int(tm[1]),
               "proof_status":"falsification_only"}
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("REMOTE_ONE_STEP_CONE_CELL",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-one-step-k${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: falsify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: remote-one-step-k*
          path: gathered
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("remote-one-step-k*"):
              p=d/"summary.json"; assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda x:x["K"])
          assert [x["K"] for x in rows]==[32,64,128,256,512,1024],rows
          out={"kind":"remote_one_step_cone_falsification","rows":rows,
               "total_samples":sum(x["samples"] for x in rows),
               "total_hard":sum(x["hard"] for x in rows)}
          Path("remote-one-step-cone-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("REMOTE_ONE_STEP_CONE_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: remote-one-step-cone-field
          path: remote-one-step-cone-field.json
          retention-days: 30
