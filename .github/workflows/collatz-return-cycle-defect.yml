name: Collatz return-cycle defect countdown

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-return-cycle-defect.yml"
      - "experiments/collatz_return_cycle_defect.py"
      - "experiments/collatz_odd_episode_grammar.py"
  workflow_dispatch:

concurrency:
  group: collatz-return-cycle-defect
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { max_r: 8,  precision: 12, cap: 256 }
          - { max_r: 12, precision: 14, cap: 384 }
          - { max_r: 16, precision: 16, cap: 512 }
    name: defect-r${{ matrix.max_r }}-p${{ matrix.precision }}
    steps:
      - uses: actions/checkout@v4
      - name: Run exact return-cycle defect census
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             python experiments/collatz_return_cycle_defect.py               --max-r ${{ matrix.max_r }}               --precision ${{ matrix.precision }}               --cap ${{ matrix.cap }}               --out results/summary.json             | tee results/census.txt
          grep -q "VERIFIED_RETURN_CYCLE_DEFECT_CENSUS" results/census.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-defect-r${{ matrix.max_r }}-p${{ matrix.precision }}
          path: results
          retention-days: 30

  aggregate:
    needs: census
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: return-defect-r*
          path: gathered
      - name: Aggregate rank verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("return-defect-r*"):
              p=d/"summary.json"; assert p.exists(),d
              r=json.loads(p.read_text())
              tm=(d/"time-memory.txt").read_text().strip().split()
              r["wall_seconds"]=float(tm[0]) if tm else None
              r["max_rss_kb"]=int(tm[1]) if len(tm)>1 else None
              rows.append(r)
          rows.sort(key=lambda r:(r["max_r"],r["precision"]))
          out={
              "kind":"return_cycle_defect_countdown_field",
              "rows":rows,
              "candidate_holds_all":all(
                  r["candidate_repeated_signature_defect_strictly_decreases"]
                  for r in rows
              ),
              "first_counterexamples":[
                  {"max_r":r["max_r"],"precision":r["precision"],
                   "seed":r["first_bad_seed"],"witness":r["first_bad"]}
                  for r in rows if r["first_bad"] is not None
              ],
          }
          Path("return-cycle-defect-field.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("RETURN_CYCLE_DEFECT_FIELD",
                json.dumps(out,separators=(",",":"),sort_keys=True))
          if out["candidate_holds_all"]:
              print("VARYING_CYCLE_DEFECT_RANK_SURVIVES_BOUNDED_FALSIFICATION")
          else:
              print("VARYING_CYCLE_DEFECT_RANK_REJECTED_BY_EXACT_COUNTEREXAMPLE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: return-cycle-defect-field
          path: return-cycle-defect-field.json
          retention-days: 30
