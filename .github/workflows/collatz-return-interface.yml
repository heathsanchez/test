name: Collatz exact return interface
on:
  push:
    branches: [collatz-forward-witness-audit-v1, collatz-return-resonance-v1]
    paths:
      - experiments/collatz_return_interface.py
      - experiments/collatz_return_interface_verify.py
      - experiments/collatz_frozen_return_generator.py
      - experiments/test_collatz_return_interface.py
      - .github/workflows/collatz-return-interface.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reproduce exact interface and frozen transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 --version | tee results/runtime.txt
          g++ --version >> results/runtime.txt
          g++ -O2 -std=c++20 -Wall -Wextra -Werror experiments/collatz_export_boundaries.cpp -o /tmp/export-boundaries
          for k in 12 16 20 24; do
            /tmp/export-boundaries "$k" > "results/b${k}.csv"
          done
          python3 experiments/test_collatz_witness_compiler.py
          python3 experiments/test_collatz_return_interface.py
          python3 experiments/collatz_return_interface_verify.py --out results/verification.json
          python3 experiments/collatz_return_interface.py results/b12.csv results/b16.csv results/b20.csv results/b24.csv --out results/census.json
          python3 experiments/collatz_frozen_return_generator.py results/b12.csv results/b16.csv results/b20.csv results/b24.csv --out results/frozen.json
          python3 experiments/collatz_frozen_return_generator.py results/b12.csv results/b16.csv results/b20.csv results/b24.csv --lineage-holdout --out results/holdout.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          mapping={'verification':'return_interface_verification','census':'return_interface_results','frozen':'frozen_return_generator','holdout':'frozen_return_lineage_holdout'}
          for generated, committed in mapping.items():
              actual=json.loads(Path('results/'+generated+'.json').read_text())
              expected=json.loads(Path('experiments/results/'+committed+'.json').read_text())
              assert actual==expected, generated
          a=json.load(open('results/frozen.json'))
          assert a['frozen_operator_count']==134
          assert [r['counts']['novel_closed_without_fallback'] for r in a['results']]==[2,7,48]
          assert all(r['counts']['novel_baseline_direct_closure']==0 for r in a['results'])
          b=json.load(open('results/holdout.json'))
          assert b['training_roots']==100 and b['held_out_root_count']==44
          assert [r['counts']['novel_closed_without_fallback'] for r in b['results']]==[1,0,9]
          print('VERIFIED_EXACT_RETURN_INTERFACE_AND_FROZEN_TRANSFER_NOT_GLOBAL_CLOSURE')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: collatz-return-interface
          path: results
          retention-days: 30
