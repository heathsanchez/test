name: Collatz return path-min probe
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_return_path_min_probe.py'
      - '.github/workflows/collatz-return-path-min-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_return_path_min_probe.py --lo 3 --hi 8191 --K 80 | tee /tmp/return-path-min.txt
      - uses: actions/upload-artifact@v4
        with:
          name: return-path-min-probe
          path: /tmp/return-path-min.txt
