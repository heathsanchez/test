name: Collatz reverse centre semantics V0

on:
  push:
    branches:
      - collatz-reverse-centre-semantics-v0
    paths:
      - 'experiments/collatz_reverse_centre_semantics_v0.py'
      - '.github/workflows/collatz-reverse-centre-semantics-v0.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact reverse-centre audit
        run: |
          mkdir -p evidence/collatz-reverse-centre-semantics-v0
          python experiments/collatz_reverse_centre_semantics_v0.py             --lo 46081 --hi 46591 --K 128             --output evidence/collatz-reverse-centre-semantics-v0/result.json             | tee evidence/collatz-reverse-centre-semantics-v0/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-reverse-centre-semantics-v0
          path: evidence/collatz-reverse-centre-semantics-v0
          if-no-files-found: error
