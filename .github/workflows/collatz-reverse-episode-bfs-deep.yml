name: Collatz reverse-episode BFS deep
on:
  workflow_dispatch:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - '.github/workflows/collatz-reverse-episode-bfs-deep.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_reverse_episode_bfs_probe.py --lo 3 --hi 8191 --K 80 --maxepisodes 6 --maxsteps 40 --Rmax 24 --Smax 16 | tee /tmp/reverse-episode-bfs-deep.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-episode-bfs-deep
          path: /tmp/reverse-episode-bfs-deep.txt
