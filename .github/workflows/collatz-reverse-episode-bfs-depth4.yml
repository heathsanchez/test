name: Collatz reverse-episode BFS depth4
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - '.github/workflows/collatz-reverse-episode-bfs-depth4.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_universal_reverse_episode_bfs.py --lo 4097 --hi 8191 --K 80 --L 4 --R 14 --S 14 | tee /tmp/reverse-bfs-depth4.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-episode-bfs-depth4
          path: /tmp/reverse-bfs-depth4.txt
