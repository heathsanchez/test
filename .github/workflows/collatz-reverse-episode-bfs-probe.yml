name: Collatz reverse-episode BFS probe
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_reverse_episode_bfs_probe.py'
      - '.github/workflows/collatz-reverse-episode-bfs-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_reverse_episode_bfs_probe.py --lo 3 --hi 8191 --K 80 --maxepisodes 4 --maxsteps 28 --Rmax 20 --Smax 12 | tee /tmp/reverse-episode-bfs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-episode-bfs-probe
          path: /tmp/reverse-episode-bfs.txt
