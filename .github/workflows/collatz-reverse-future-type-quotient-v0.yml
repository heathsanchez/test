name: Collatz reverse future type quotient V0
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths: ['experiments/collatz_reverse_future_type_quotient_v0.py','.github/workflows/collatz-reverse-future-type-quotient-v0.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: cd experiments && python collatz_reverse_future_type_quotient_v0.py | tee /tmp/result.json
      - uses: actions/upload-artifact@v4
        with: {name: collatz-reverse-future-type-quotient-v0, path: /tmp/result.json}
