name: Collatz reverse odd cone
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'formal/Collatz/ReverseOddCone.lean'
      - 'formal/Collatz/HardFirstCrossing.lean'
      - '.github/workflows/collatz-reverse-odd-cone.yml'
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile arbitrary reverse-odd cone barrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-reverse-odd-cone .lake/build/lib/lean/Collatz
          lake build CollatzFinal
          lake env lean --version | tee evidence/collatz-reverse-odd-cone/toolchain.txt
          for module in SourceProduct SourceProductAffine CoefficientCrossing CoefficientDynamics SurvivalDeficit FirstCrossingRigidity OrdinaryExitReduction OrdinaryInverseOdd HardFirstCrossing; do
            lake env lean -DautoImplicit=false -o ".lake/build/lib/lean/Collatz/$module.olean" "formal/Collatz/$module.lean" | tee "evidence/collatz-reverse-odd-cone/$module.log"
          done
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' formal/Collatz/ReverseOddCone.lean
          lake env lean -DautoImplicit=false formal/Collatz/ReverseOddCone.lean | tee evidence/collatz-reverse-odd-cone/ReverseOddCone.log
          ! grep -E 'sorryAx|Lean.ofReduceBool' evidence/collatz-reverse-odd-cone/*.log
          git rev-parse HEAD > evidence/collatz-reverse-odd-cone/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-reverse-odd-cone
          path: evidence/collatz-reverse-odd-cone
          if-no-files-found: error
