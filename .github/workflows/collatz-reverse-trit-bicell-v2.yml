name: Collatz reverse-trit bicell V2

on:
  push:
    branches: [collatz-reverse-trit-bicell-v2]
    paths:
      - 'experiments/collatz_reverse_trit_bicell_v2.py'
      - '.github/workflows/collatz-reverse-trit-bicell-v2.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact Q2-prefix residual compiler
        run: |
          mkdir -p evidence/collatz-reverse-trit-bicell-v2
          python experiments/collatz_reverse_trit_bicell_v2.py             --max-q2-depth 10             --output evidence/collatz-reverse-trit-bicell-v2/result.json             | tee evidence/collatz-reverse-trit-bicell-v2/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-reverse-trit-bicell-v2
          path: evidence/collatz-reverse-trit-bicell-v2
          if-no-files-found: error
