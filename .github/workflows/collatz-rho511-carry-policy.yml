name: Collatz rho511 carry policy
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - experiments/collatz_rho511_carry_policy_v0.py
      - .github/workflows/collatz-rho511-carry-policy.yml
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/collatz_rho511_carry_policy_v0.py
