name: Collatz rigid lift v1
on:
  push:
    branches: [collatz-rigid-lift-v1]
    paths:
      - 'experiments/collatz_rigid_lift_v1.py'
      - '.github/workflows/collatz-rigid-lift-v1.yml'
  workflow_dispatch:
jobs:
  local-lift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exact local lift qualification
        run: |
          set -euo pipefail
          python experiments/collatz_rigid_lift_v1.py --levels 20 --reps 1000 | tee /tmp/lift.txt
          grep -q 'PASS_MINUS_ONE_LOCAL_LIFT' /tmp/lift.txt
          grep -q 'MISSING_THEOREM hereditary_rigid_lift_forces_unique_minus_one_lift' /tmp/lift.txt
