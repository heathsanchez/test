name: Collatz ROS Full Live Audit
on:
  push:
    branches: [collatz-ros-full-live-audit-20260930]
    paths:
      - 'experiments/collatz_ros_full_live_audit_20260930.py'
      - 'evidence/collatz-ros-full-live-audit-20260930/**'
      - '.github/workflows/collatz-ros-full-live-audit-20260930.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Reproduce parent and full-live audit
        run: |
          PYTHONPATH=experiments python -u experiments/collatz_ros_full_live_audit_20260930.py evidence/collatz-ros-full-live-audit-20260930/hosted
      - name: Check deterministic result and independent exact natural witness
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('evidence/collatz-ros-full-live-audit-20260930')
          expected=json.loads((d/'local-result.json').read_text())
          actual=json.loads((d/'hosted/result.json').read_text())
          assert actual==expected
          assert actual['global_collatz']=='UNKNOWN'
          assert actual['macro_start_relative_audit']['local_progress_does_not_yet_beat_macro_start']==1244
          w=json.loads((d/'exact-origin-overshoot.json').read_text())
          n=int(w['source'])
          T=lambda x:(3*x+1)//2 if x&1 else x//2
          ys=[n]
          for _ in range(w['first_exit_depth']): ys.append(T(ys[-1]))
          def ex(y):
              return (0<y<n) or (y%8==5 and y<=4*n) or (y%3==2 and 0<(2*y-1)//3<n)
          assert not any(ex(y) for y in ys[:-1])
          assert ex(ys[-1])
          Ptot=Atot=1
          Btot=0
          origin=int(w['origin_owner'])
          for z in w['returns']:
              a,b=z['depth']
              m0,m1=int(z['m0']),int(z['m1'])
              assert ys[a]==4*m0-1 and ys[b]==4*m1-1
              A,bias=1,0
              for k in range(a,b):
                  if ys[k]&1: A*=3; bias=3*bias+(1<<(k-a))
              P=1<<(b-a)
              assert (bias+P-A)%4==0
              B=(bias+P-A)//4
              assert (A,B,P)==tuple(int(z[key]) for key in ('A','B','P'))
              assert P*m1==A*m0+B
              Atot,Btot,Ptot=A*Atot,A*Btot+B*Ptot,Ptot*P
              assert int(z['cumulative_origin_budget'])==(Ptot-Atot)*origin-Btot
              assert z['local_descent']==(m1<m0)
              assert z['macro_start_descent']==(m1<origin)
          assert w['returns'][1]['local_descent'] and not w['returns'][1]['macro_start_descent']
          assert w['returns'][2]['macro_start_descent']
          print('FULL_LIVE_AUDIT_REPRODUCED',actual['certificate_sha256'])
          print('EXACT_SOURCE_ORIGIN_OVERSHOOT_VERIFIED')
          print('GLOBAL_COLLATZ_UNKNOWN')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-ros-full-live-audit-20260930
          path: evidence/collatz-ros-full-live-audit-20260930
          if-no-files-found: error
