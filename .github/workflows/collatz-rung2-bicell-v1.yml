name: Collatz rung2 bicell V1
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_rung2_bicell_v1.py'
      - '.github/workflows/collatz-rung2-bicell-v1.yml'
  workflow_dispatch:
jobs:
  bicell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-rung2-bicell-v1
          python experiments/collatz_rung2_bicell_v1.py | tee evidence/collatz-rung2-bicell-v1/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-rung2-bicell-v1
          path: evidence/collatz-rung2-bicell-v1
