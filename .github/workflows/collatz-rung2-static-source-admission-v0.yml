name: Collatz rung2 static source admission V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_rung2_static_source_admission_v0.py'
      - '.github/workflows/collatz-rung2-static-source-admission-v0.yml'
  workflow_dispatch:
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-rung2-static-source-admission-v0
          python experiments/collatz_rung2_static_source_admission_v0.py | tee evidence/collatz-rung2-static-source-admission-v0/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-rung2-static-source-admission-v0
          path: evidence/collatz-rung2-static-source-admission-v0
