name: Collatz shared normalized capability

on:
  push:
    branches: [collatz-shared-normalized-capability-v1]
    paths:
      - ".github/workflows/collatz-shared-normalized-verify.yml"
      - "experiments/collatz_zero_ternary_normalized_shared.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-shared-normalized-capability
  cancel-in-progress: true

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build shared solver with warnings fatal
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -std=c++20 -Wall -Wextra -Werror \
            experiments/collatz_zero_ternary_normalized_shared.cpp -o /tmp/shared_nzt
      - name: Differentially verify shared value function
        run: |
          set -euo pipefail
          /usr/bin/time -f '%e %M' -o results/equivalence-time-memory.txt \
            /tmp/shared_nzt --verify 8 4 | tee results/equivalence.txt
          grep -q "VERIFIED_SHARED_EQUIVALENCE" results/equivalence.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-normalized-equivalence
          path: results
          retention-days: 30

  scout-b12-r8:
    needs: equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build shared solver with warnings fatal
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -std=c++20 -Wall -Wextra -Werror \
            experiments/collatz_zero_ternary_normalized_shared.cpp -o /tmp/shared_nzt
      - name: Run bounded shared B12 scout
        run: |
          set -euo pipefail
          /usr/bin/time -f '%e %M' -o results/scout-time-memory.txt \
            /tmp/shared_nzt 12 8 | tee results/scout.txt
          grep -q "VERIFIED_SHARED_NORMALIZED_SCOUT" results/scout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-normalized-b12-r8
          path: results
          retention-days: 30

  scout-b12-r64:
    needs: scout-b12-r8
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build shared solver with warnings fatal
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -std=c++20 -Wall -Wextra -Werror \
            experiments/collatz_zero_ternary_normalized_shared.cpp -o /tmp/shared_nzt
      - name: Run full shared B12 refinement range
        run: |
          set -euo pipefail
          /usr/bin/time -f '%e %M' -o results/scout-time-memory.txt \
            /tmp/shared_nzt 12 64 | tee results/scout.txt
          grep -q "VERIFIED_SHARED_NORMALIZED_SCOUT" results/scout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-normalized-b12-r64
          path: results
          retention-days: 30
