name: Collatz bit-length shell closure

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-shell-boundary-closure.yml"
      - "experiments/collatz_shell_boundary_closure.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-shell-boundary-closure
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        depth: [0,1,2,3,4,6,8]
    name: shell-depth${{ matrix.depth }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate frozen q14 donor bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY

      - name: Build universal residual then test actual a=1 shell
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_shell_boundary_closure.cpp             -o /tmp/shell
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/shell 24 results/q14-bank.txt ${{ matrix.depth }}             | tee results/census.txt
          grep -q "VERIFIED_SHELL_BOUNDARY_CLOSURE_SCOUT" results/census.txt

      - name: Record exact shell residual
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          D=int("${{ matrix.depth }}")
          s=open("results/census.txt").read()
          m=re.search(
              r"SHELL_BOUNDARY_RESULT K=24 shell_macro_depth=(\d+) "
              r"universal_residual=(\d+) shell_direct=(\d+) "
              r"shell_base=(\d+) shell_macro=(\d+) "
              r"shell_hard=(\d+) controls=(\d+)",s)
          assert m,s[-7000:]
          depth,univ,direct,base,macro,hard,controls=map(int,m.groups())
          assert depth==D
          assert univ==173180,(univ,173180)
          assert direct+base+macro+hard==univ
          hist={str(int(z.group(1))):int(z.group(2))
                for z in re.finditer(r"SHELL_MACRO_DEPTH blocks=(\d+) closed=(\d+)",s)}
          tm=open("results/time-memory.txt").read().strip().split()
          out={
              "kind":"bit_length_shell_closure",
              "K":24,"shell_macro_depth":D,
              "universal_residual":univ,
              "shell_direct":direct,
              "shell_base":base,
              "shell_macro":macro,
              "shell_hard":hard,
              "shell_closed":univ-hard,
              "shell_residual_fraction_of_universal":hard/univ,
              "macro_depth_hist":hist,
              "controls":controls,
              "wall_seconds":float(tm[0]) if tm else None,
              "max_rss_kb":int(tm[1]) if len(tm)>1 else None,
          }
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("SHELL_BOUNDARY_FIELD",json.dumps(out,separators=(",",":")))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-boundary-depth${{ matrix.depth }}
          path: results
          retention-days: 30

  aggregate:
    needs: shell
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shell-boundary-depth*
          path: gathered

      - name: Aggregate shell closure curve
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("shell-boundary-depth*"):
              p=d/"summary.json"
              assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda r:r["shell_macro_depth"])
          assert [r["shell_macro_depth"] for r in rows]==[0,1,2,3,4,6,8],rows
          prev=173180
          for r in rows:
              assert r["shell_hard"]<=prev,(prev,r)
              prev=r["shell_hard"]
          out={"kind":"bit_length_shell_closure_curve","rows":rows,"best":rows[-1]}
          Path("shell-boundary-field.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("SHELL_BOUNDARY_CURVE",
                json.dumps(out,separators=(",",":"),sort_keys=True))
          print("BIT_LENGTH_SHELL_REFRAME_TEST_COMPLETE")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: shell-boundary-field
          path: shell-boundary-field.json
          retention-days: 30
