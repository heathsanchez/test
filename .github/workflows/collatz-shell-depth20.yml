name: Collatz shell closure to depth twenty

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-shell-depth20.yml"
      - "experiments/collatz_shell_boundary_closure.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-shell-depth20
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        depth: [14,16,18,20]
    name: shell-depth${{ matrix.depth }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate frozen q14 donor bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY
      - name: Run exact shell closure
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20 experiments/collatz_shell_boundary_closure.cpp -o /tmp/shell
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/shell 24 results/q14-bank.txt ${{ matrix.depth }} | tee results/census.txt
          grep -q "VERIFIED_SHELL_BOUNDARY_CLOSURE_SCOUT" results/census.txt
      - name: Record result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          D=int("${{ matrix.depth }}")
          s=open("results/census.txt").read()
          m=re.search(
              r"SHELL_BOUNDARY_RESULT K=24 shell_macro_depth=(\d+) "
              r"universal_residual=(\d+) shell_direct=(\d+) shell_base=(\d+) "
              r"shell_macro=(\d+) shell_hard=(\d+) controls=(\d+)",s)
          assert m,s[-5000:]
          d,u,di,ba,ma,ha,co=map(int,m.groups())
          assert d==D and u==173180 and di+ba+ma+ha==u
          hist={str(int(z.group(1))):int(z.group(2))
                for z in re.finditer(r"SHELL_MACRO_DEPTH blocks=(\d+) closed=(\d+)",s)}
          tm=open("results/time-memory.txt").read().strip().split()
          out={"depth":D,"universal_residual":u,"shell_closed":di+ba+ma,
               "shell_hard":ha,"closed_fraction":(di+ba+ma)/u,
               "hist":hist,"controls":co,
               "wall_seconds":float(tm[0]),"max_rss_kb":int(tm[1])}
          open("results/summary.json","w").write(json.dumps(out,indent=2)+"\n")
          print("SHELL_DEPTH20_RESULT",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-depth20-${{ matrix.depth }}
          path: results
          retention-days: 30
  aggregate:
    needs: shell
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shell-depth20-*
          path: gathered
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("shell-depth20-*"):
              p=d/"summary.json"
              assert p.exists(),d
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda r:r["depth"])
          assert [r["depth"] for r in rows]==[14,16,18,20],rows
          prev=141410
          for r in rows:
              assert r["shell_hard"]<=prev,(prev,r)
              prev=r["shell_hard"]
          out={"kind":"shell_depth20_curve","rows":rows,"best":rows[-1]}
          Path("shell-depth20-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("SHELL_DEPTH20_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shell-depth20-field
          path: shell-depth20-field.json
          retention-days: 30
