name: Collatz late rescue program vocabulary

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-shell-rescue-programs.yml"
      - "experiments/collatz_shell_rescue_program_profile.cpp"
      - "experiments/collatz_reverse_predecessor_sparse.py"
  workflow_dispatch:

concurrency:
  group: collatz-shell-rescue-programs
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        k: [20,22,24,26,28]
    name: rescue-k${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate frozen q14 universal bank
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("experiments").resolve()))
          from collatz_reverse_predecessor_sparse import enumerate_first_contractions,sparse_quotient
          certs=enumerate_first_contractions(14)
          killed,total,selected,redundant=sparse_quotient(certs,14)
          assert (killed,total,len(selected))==(2233499,4782969,3265)
          with open("results/q14-bank.txt","w") as f:
              for c in selected:
                  f.write(f"{c.o} {c.steps} {c.c} {c.residue}\n")
          PY

      - name: Profile first successful H512 programs
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_shell_rescue_program_profile.cpp -o /tmp/profile
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/profile ${{ matrix.k }} results/q14-bank.txt 8 512             | tee results/census.txt
          grep -q "VERIFIED_SHELL_RESCUE_PROGRAM_VOCABULARY" results/census.txt

      - name: Freeze late rescue language
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          K=int("${{ matrix.k }}")
          expected={20:6,22:29,24:114,26:382,28:1615}[K]
          s=Path("results/census.txt").read_text()
          m=re.search(r"SHELL_RESCUE_VOCAB unique=(\d+) total=(\d+)",s)
          assert m,s[-8000:]
          unique,total=map(int,m.groups())
          assert total==expected,(K,total,expected)
          rows=[]
          for z in re.finditer(r"^SHELL_RESCUE_PROGRAM count=(\d+) key=(.*)$",s,re.M):
              rows.append({"count":int(z.group(1)),"key":z.group(2)})
          assert len(rows)==unique,(K,len(rows),unique)
          tm=Path("results/time-memory.txt").read_text().strip().split()
          out={
              "kind":"late_rescue_program_vocabulary",
              "K":K,"forward_cut":128,"forward_h":512,"reverse_depth":8,
              "f128_hard":expected,
              "rescue_total":total,"rescue_unique":unique,
              "compression":total/unique if unique else None,
              "programs":rows,
              "wall_seconds":float(tm[0]) if tm else None,
              "max_rss_kb":int(tm[1]) if len(tm)>1 else None,
          }
          Path("results/summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print("LATE_RESCUE_PROGRAM_FIELD",json.dumps(out,separators=(",",":")))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late-rescue-k${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: profile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: late-rescue-k*
          path: gathered

      - name: Compare rescue language across shells
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          byk={}
          for d in Path("gathered").glob("late-rescue-k*"):
              p=d/"summary.json"; assert p.exists(),d
              r=json.loads(p.read_text()); rows.append(r); byk[r["K"]]=r
          rows.sort(key=lambda r:r["K"])
          assert [r["K"] for r in rows]==[20,22,24,26,28],rows

          sets={k:set(x["key"] for x in r["programs"]) for k,r in byk.items()}
          union=set().union(*sets.values())
          common=set.intersection(*sets.values())
          pair=[]
          for a,b in zip([20,22,24,26],[22,24,26,28]):
              inter=sets[a]&sets[b]
              pair.append({
                  "a":a,"b":b,
                  "unique_a":len(sets[a]),"unique_b":len(sets[b]),
                  "intersection":len(inter),
                  "jaccard":len(inter)/len(sets[a]|sets[b]) if sets[a]|sets[b] else 1.0,
                  "fraction_b_reused":len(inter)/len(sets[b]) if sets[b] else 1.0,
              })

          # Program-shape quotient drops the absolute forward index while
          # retaining direct/reverse type, initial O-run and macro path.
          def shape(key):
              parts=key.split(":")
              if parts[0]=="F":
                  return "F"
              return "R:"+":".join(parts[2:])
          shapes={k:set(shape(x["key"]) for x in r["programs"]) for k,r in byk.items()}
          shape_union=set().union(*shapes.values())
          shape_common=set.intersection(*shapes.values())
          shape_pair=[]
          for a,b in zip([20,22,24,26],[22,24,26,28]):
              inter=shapes[a]&shapes[b]
              shape_pair.append({
                  "a":a,"b":b,
                  "unique_a":len(shapes[a]),"unique_b":len(shapes[b]),
                  "intersection":len(inter),
                  "fraction_b_reused":len(inter)/len(shapes[b]) if shapes[b] else 1.0,
              })

          out={
              "kind":"late_rescue_program_transfer",
              "rows":[{k:r[k] for k in ["K","f128_hard","rescue_unique","compression"]} for r in rows],
              "literal_union":len(union),
              "literal_common_all":len(common),
              "literal_pair_transfer":pair,
              "shape_union":len(shape_union),
              "shape_common_all":len(shape_common),
              "shape_pair_transfer":shape_pair,
          }
          Path("late-rescue-program-transfer.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("LATE_RESCUE_PROGRAM_TRANSFER",json.dumps(out,separators=(",",":"),sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: late-rescue-program-transfer
          path: late-rescue-program-transfer.json
          retention-days: 30
