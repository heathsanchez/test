name: Collatz simple rho selection
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - experiments/collatz_simple_rho_selection_v0.py
      - .github/workflows/collatz-simple-rho-selection.yml
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/collatz_simple_rho_selection_v0.py
