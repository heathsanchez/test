name: Collatz source admission separator V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_source_admission_separator_v0.py'
      - '.github/workflows/collatz-source-admission-separator-v0.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-source-admission-separator-v0
          python experiments/collatz_source_admission_separator_v0.py | tee evidence/collatz-source-admission-separator-v0/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-source-admission-separator-v0
          path: evidence/collatz-source-admission-separator-v0
