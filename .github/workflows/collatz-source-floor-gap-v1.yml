name: Collatz source floor gap V1
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'formal/Collatz/FirstCrossingBias.lean'
      - 'experiments/collatz_source_floor_gap_v1.*'
      - 'evidence/collatz-source-floor-gap-v1/result.json'
      - '.github/workflows/collatz-source-floor-gap-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay-and-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Two independently indexed exact source-cap replays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-source-floor-gap-v1
          python -S experiments/collatz_source_floor_gap_v1.py > evidence/collatz-source-floor-gap-v1/replay.json
          g++ -O2 -std=c++17 experiments/collatz_source_floor_gap_v1.cpp -o /tmp/collatz-source-cap
          /tmp/collatz-source-cap > evidence/collatz-source-floor-gap-v1/cpp-result.json
          python -S - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/collatz-source-floor-gap-v1')
          actual=json.loads((p/'replay.json').read_text())
          assert actual==json.loads((p/'result.json').read_text())
          cpp=json.loads((p/'cpp-result.json').read_text())
          cap=actual['finite_caps']
          assert cpp['types']==cap['possible_first_crossing_types']
          assert cpp['max_cap']==cap['max_nondescending_source_cap']
          assert cpp['j']==cap['maximizing_record']['j']
          assert cpp['q']==cap['maximizing_record']['q']
          assert cpp['global_collatz']==actual['global_collatz']=='UNKNOWN'
          print('PASS: exact Python/C++ source-cap agreement and P37 counterexamples')
          PY
          git rev-parse HEAD > evidence/collatz-source-floor-gap-v1/commit.txt
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check elementary all-depth source bound against actual affine bridge
        shell: bash
        run: |
          set -euo pipefail
          lake build CollatzFinal
          lake env lean --version > evidence/collatz-source-floor-gap-v1/toolchain.txt
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' formal/Collatz
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/SourceProduct.olean formal/Collatz/SourceProduct.lean > evidence/collatz-source-floor-gap-v1/source-product.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/SourceProductAffine.olean formal/Collatz/SourceProductAffine.lean > evidence/collatz-source-floor-gap-v1/affine.log
          lake env lean -DautoImplicit=false formal/Collatz/FirstCrossingBias.lean | tee evidence/collatz-source-floor-gap-v1/bias.log
          lake env lean -DautoImplicit=false formal/Collatz/CoefficientCrossing.lean | tee evidence/collatz-source-floor-gap-v1/crossing.log
          ! grep -R 'sorryAx\|Lean.ofReduceBool' evidence/collatz-source-floor-gap-v1/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-source-floor-gap-v1
          path: evidence/collatz-source-floor-gap-v1
          if-no-files-found: error
