name: Collatz stable-tail cycle erasure

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-stable-tail-cycle-erasure.yml"
      - "experiments/collatz_stable_tail_cycle_erasure.py"
      - "experiments/collatz_odd_episode_grammar.py"
  workflow_dispatch:

concurrency:
  group: collatz-stable-tail-cycle-erasure
  cancel-in-progress: true

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { r: 8,  p: 12 }
          - { r: 12, p: 14 }
          - { r: 16, p: 16 }
    name: stable-cycle-r${{ matrix.r }}-p${{ matrix.p }}
    steps:
      - uses: actions/checkout@v4
      - name: Run exact stable-tail cycle erasure
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             python experiments/collatz_stable_tail_cycle_erasure.py               --max-r ${{ matrix.r }}               --precision ${{ matrix.p }}               --episode-cap 256               --out results/summary.json             | tee results/census.txt
          grep -q "STABLE_PULLBACK_TAIL_DECOMPOSED_INTO_SPINE_PLUS_RETURN_CYCLES" results/census.txt
          grep -q "VERIFIED_STABLE_TAIL_CYCLE_ERASURE" results/census.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-tail-cycle-r${{ matrix.r }}-p${{ matrix.p }}
          path: results
          retention-days: 30

  aggregate:
    needs: stable
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stable-tail-cycle-r*
          path: gathered
      - name: Aggregate stable-tail structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("stable-tail-cycle-r*"):
              p=d/"summary.json"; assert p.exists(),d
              r=json.loads(p.read_text())
              assert r["unresolved"]==0,r
              tm=(d/"time-memory.txt").read_text().strip().split()
              rows.append({
                  "max_r":r["max_r"],"precision":r["precision"],
                  "cases":r["cases"],
                  "stabilized_cases":r["stabilized_cases"],
                  "max_stable_tail_episodes":r["max_stable_tail_episodes"],
                  "max_stable_loop_erased_spine":r["max_stable_loop_erased_spine"],
                  "record_cycles":r["max_stable_return_cycles_on_record_case"],
                  "record_erased_steps":r["max_cycle_erased_steps_on_record_case"],
                  "distinct_return_signatures":r["distinct_observed_return_signatures"],
                  "record_case":r["record_case"],
                  "wall_seconds":float(tm[0]),"max_rss_kb":int(tm[1]),
              })
          rows.sort(key=lambda z:z["precision"])
          assert [z["precision"] for z in rows]==[12,14,16],rows
          out={"kind":"stable_tail_cycle_erasure_curve","rows":rows}
          Path("stable-tail-cycle-erasure-field.json").write_text(json.dumps(out,indent=2)+"\n")
          print("STABLE_TAIL_CYCLE_ERASURE_FIELD",json.dumps(out,separators=(",",":")))
          print("STABLE_TAIL_CYCLE_ERASURE_CURVE_GREEN")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stable-tail-cycle-erasure-field
          path: stable-tail-cycle-erasure-field.json
          retention-days: 30
