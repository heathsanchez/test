name: Collatz stateful future kernel V0

on:
  push:
    branches:
      - collatz-stateful-future-kernel-v0
    paths:
      - 'experiments/collatz_stateful_future_kernel_v0.py'
      - 'experiments/test_collatz_stateful_future_kernel_v0.py'
      - '.github/workflows/collatz-stateful-future-kernel-v0.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact unit and small-corpus controls
        run: |
          python -m unittest discover -s experiments -p 'test_collatz_stateful_future_kernel_v0.py' -v
      - name: Frozen bounded stateful future-kernel experiment
        run: |
          mkdir -p evidence/collatz-stateful-future-kernel-v0
          python experiments/collatz_stateful_future_kernel_v0.py \
            --lo 3 --hi 8191 --K 128 \
            --output evidence/collatz-stateful-future-kernel-v0/result.json \
            | tee evidence/collatz-stateful-future-kernel-v0/run.log
      - name: Prospective disjoint holdout transfer
        run: |
          python experiments/collatz_stateful_future_kernel_v0.py \
            --lo 8193 --hi 32767 --K 128 \
            --output evidence/collatz-stateful-future-kernel-v0/holdout.json \
            | tee evidence/collatz-stateful-future-kernel-v0/holdout.log
      - name: Compare frozen and holdout consequence
        run: |
          python - <<'PY'
          import json
          train=json.load(open('evidence/collatz-stateful-future-kernel-v0/result.json'))
          hold=json.load(open('evidence/collatz-stateful-future-kernel-v0/holdout.json'))
          for d in (train,hold):
              assert d['schema']=='COLLATZ_STATEFUL_FUTURE_KERNEL_V0'
              assert d['transport_audit']['active_fuel_consumption_checks'] > 0
          def row(d):
              return {
                  'verdict':d['verdict'],
                  'incomplete':len(d['incomplete_sources']),
                  'completed_sources':d['counts'].get('completed_sources',0),
                  'control_kernel':d['representations']['CONTROL']['future_kernel_classes'],
                  'own_fuel_kernel':d['representations']['OWN_FUEL']['future_kernel_classes'],
                  'own_v23_kernel':d['representations']['OWN_V23']['future_kernel_classes'],
                  'v2_vector_kernel':d['representations']['V2_VECTOR']['future_kernel_classes'],
                  'v3_vector_kernel':d['representations']['V3_VECTOR']['future_kernel_classes'],
                  'v23_vector_kernel':d['representations']['V23_VECTOR']['future_kernel_classes'],
                  'certificate':d['closure_certificate'],
              }
          tr=row(train); ho=row(hold)
          print('FROZEN',json.dumps(tr,sort_keys=True))
          print('HOLDOUT',json.dumps(ho,sort_keys=True))
          if (tr['incomplete']==0 and ho['incomplete']==0 and
              tr['control_kernel']>0 and ho['control_kernel']>0 and
              tr['own_v23_kernel']==0 and ho['own_v23_kernel']==0):
              print('TRANSFER_VERDICT PASS_PROSPECTIVE_LOCAL_V23_KERNEL_COLLAPSE')
          elif (tr['incomplete']==0 and ho['incomplete']==0 and
                tr['control_kernel']>0 and ho['control_kernel']>0 and
                tr['v3_vector_kernel']==0 and ho['v3_vector_kernel']==0):
              print('TRANSFER_VERDICT PASS_PROSPECTIVE_V3_VECTOR_KERNEL_COLLAPSE')
          elif (tr['incomplete']==0 and ho['incomplete']==0 and
                tr['control_kernel']>0 and ho['control_kernel']>0 and
                tr['v23_vector_kernel']==0 and ho['v23_vector_kernel']==0):
              print('TRANSFER_VERDICT PASS_PROSPECTIVE_V23_VECTOR_KERNEL_COLLAPSE')
          else:
              print('TRANSFER_VERDICT RESIDUAL_OR_INCOMPLETE')
          PY
      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: collatz-stateful-future-kernel-v0
          path: evidence/collatz-stateful-future-kernel-v0
          if-no-files-found: error
