name: Collatz strong induction base below 2^20

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-strong-induction-base.yml"
      - "experiments/collatz_strong_induction_base_b20.cpp"
  workflow_dispatch:

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact induction base
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -march=native -std=c++20             experiments/collatz_strong_induction_base_b20.cpp -o /tmp/base
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/base | tee results/census.txt
          grep -q "VERIFIED_COLLATZ_STRONG_INDUCTION_BASE_BELOW_2_20" results/census.txt
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-induction-base-b20
          path: results
          retention-days: 30
