name: Collatz switch-state rank probe
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_switch_state_rank_probe.py'
      - '.github/workflows/collatz-switch-state-rank-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_switch_state_rank_probe.py --K 128 | tee /tmp/switch-rank.txt
      - uses: actions/upload-artifact@v4
        with:
          name: switch-state-rank-probe
          path: /tmp/switch-rank.txt
