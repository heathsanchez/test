name: Collatz synthetic multi-episode bank
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_synthetic_multi_episode_bank.py'
      - '.github/workflows/collatz-synthetic-multi-episode-bank.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_synthetic_multi_episode_bank.py --lo 3 --hi 8191 --K 80 --Lmax 2 --Dmax 18 --R0max 20 | tee /tmp/multi-episode-bank.txt
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-multi-episode-bank
          path: /tmp/multi-episode-bank.txt
