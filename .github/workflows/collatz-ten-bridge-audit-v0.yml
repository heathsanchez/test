name: Collatz ten bridge audit V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_ten_bridge_audit_v0.py'
      - '.github/workflows/collatz-ten-bridge-audit-v0.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact bridge falsifiers
        run: |
          mkdir -p evidence/collatz-ten-bridge-audit-v0
          python experiments/collatz_ten_bridge_audit_v0.py | tee evidence/collatz-ten-bridge-audit-v0/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-ten-bridge-audit-v0
          path: evidence/collatz-ten-bridge-audit-v0
