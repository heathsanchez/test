name: Collatz ThreeQuarter Future7 Cylinder Compiler
on:
  push:
    branches: [collatz-three-quarter-future7-cylinder-v0]
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/collatz_three_quarter_future7_cylinder_v0.py | tee /tmp/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-three-quarter-future7-cylinder-v0
          path: /tmp/result.json
