name: Collatz trie reverse profile

on:
  push:
    branches: [collatz-valuation-quotient-v1]
    paths:
      - ".github/workflows/collatz-trie-reverse-profile.yml"
      - "experiments/collatz_trie_reverse_profile.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-trie-reverse-profile
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { depth: 8, refine: 2 }
          - { depth: 10, refine: 2 }
          - { depth: 12, refine: 2 }
    name: profile-d${{ matrix.depth }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_trie_reverse_profile.cpp -o /tmp/profile
      - name: Run correlation
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/profile ${{ matrix.depth }} ${{ matrix.refine }}             | tee results/census.txt
          grep -q "VERIFIED_TRIE_REVERSE_PROFILE_CORRELATION" results/census.txt
          grep -q "FINAL_GATE=TRIE_REVERSE_PROFILE_D${{ matrix.depth }}_R${{ matrix.refine }}" results/census.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-d${{ matrix.depth }}
          path: results
          retention-days: 30
