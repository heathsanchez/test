name: Collatz two block stateful lift V0
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'experiments/collatz_two_block_stateful_lift_v0.py'
      - 'experiments/collatz_crystal_campaign_state_v1.json'
      - '.github/workflows/collatz-two-block-stateful-lift-v0.yml'
  workflow_dispatch:
jobs:
  lift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p evidence/collatz-two-block-stateful-lift-v0
          python experiments/collatz_two_block_stateful_lift_v0.py | tee evidence/collatz-two-block-stateful-lift-v0/result.json
          cp experiments/collatz_crystal_campaign_state_v1.json evidence/collatz-two-block-stateful-lift-v0/state.json
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-two-block-stateful-lift-v0
          path: evidence/collatz-two-block-stateful-lift-v0
