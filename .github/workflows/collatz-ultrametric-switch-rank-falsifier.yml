name: Collatz ultrametric switch rank falsifier
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths: ['experiments/collatz_ultrametric_switch_rank_falsifier_v0.py','.github/workflows/collatz-ultrametric-switch-rank-falsifier.yml']
permissions: {contents: read}
jobs:
  falsify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: cd experiments && python -u collatz_ultrametric_switch_rank_falsifier_v0.py | tee /tmp/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: collatz-ultrametric-switch-rank-falsifier, path: /tmp/result.json}
