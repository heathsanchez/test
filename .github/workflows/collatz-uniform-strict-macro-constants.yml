name: Collatz uniform strict macro constants
on:
  workflow_dispatch:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - experiments/collatz_uniform_strict_macro_constants_v0.py
      - .github/workflows/collatz-uniform-strict-macro-constants.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/collatz_uniform_strict_macro_constants_v0.py
