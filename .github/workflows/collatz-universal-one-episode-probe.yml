name: Collatz universal one-episode probe
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_universal_one_episode_probe.py'
      - '.github/workflows/collatz-universal-one-episode-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_universal_one_episode_probe.py --lo 4097 --hi 8191 --K 80 --R 20 --S 20 | tee /tmp/one-episode.txt
      - uses: actions/upload-artifact@v4
        with:
          name: universal-one-episode-probe
          path: /tmp/one-episode.txt
