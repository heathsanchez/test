name: Collatz universal reverse-episode BFS
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_universal_reverse_episode_bfs.py'
      - '.github/workflows/collatz-universal-reverse-episode-bfs.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          for L in 1 2 3; do
            echo "=== DEPTH $L ==="
            python -u experiments/collatz_universal_reverse_episode_bfs.py --lo 4097 --hi 8191 --K 80 --L "$L" --R 20 --S 20 | grep -E 'RANGE|COUNTS|CLOSED|HARD|STATUS'
          done | tee /tmp/reverse-episode-bfs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: universal-reverse-episode-bfs
          path: /tmp/reverse-episode-bfs.txt
