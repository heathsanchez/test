name: Collatz universal source product V1
on:
  push:
    branches: [collatz-universal-source-product-v1]
    paths:
      - 'formal/Collatz/**'
      - 'experiments/source_product_v1/**'
      - '.github/workflows/collatz-universal-source-product-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theorem-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build existing kernel
        run: lake build CollatzFinal
      - name: Check universal normalization and positive-source regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/source-product-v1
          git rev-parse HEAD > evidence/source-product-v1/commit.txt
          lake env lean --version > evidence/source-product-v1/toolchain.txt
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' formal/Collatz
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/SourceProduct.olean formal/Collatz/SourceProduct.lean | tee evidence/source-product-v1/proof.log
          lake env lean -DautoImplicit=false formal/Collatz/NormalizationRegression.lean | tee evidence/source-product-v1/regression.log
          ! grep -q 'sorryAx' evidence/source-product-v1/proof.log
      - name: Check full affine provenance
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DautoImplicit=false formal/Collatz/SourceProductAffine.lean | tee evidence/source-product-v1/affine.log
          ! grep -q 'sorryAx' evidence/source-product-v1/affine.log
      - name: Check zero-tail subkernel reduction
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/SourceProductZeroTail.olean formal/Collatz/SourceProductZeroTail.lean | tee evidence/source-product-v1/zero-tail.log
          lake env lean -DautoImplicit=false formal/Collatz/ZeroTailEquivalenceRegression.lean | tee evidence/source-product-v1/zero-tail-equivalence.log
          ! grep -q 'sorryAx' evidence/source-product-v1/zero-tail.log
      - name: Independent exact replay tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/source_product_v1 -v 2>&1 | tee evidence/source-product-v1/python-tests.log
          python experiments/source_product_v1/source_product.py > evidence/source-product-v1/result.json
          cp experiments/source_product_v1/residual.json evidence/source-product-v1/residual.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-universal-source-product-v1
          path: evidence/source-product-v1
          if-no-files-found: error
