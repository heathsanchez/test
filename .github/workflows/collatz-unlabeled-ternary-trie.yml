name: Collatz unlabeled ternary trie scout

on:
  push:
    branches: [collatz-valuation-quotient-v1]
    paths:
      - ".github/workflows/collatz-unlabeled-ternary-trie.yml"
      - "experiments/collatz_unlabeled_ternary_trie.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-unlabeled-ternary-trie
  cancel-in-progress: true

jobs:
  trie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { depth: 8, refine: 2 }
          - { depth: 10, refine: 2 }
          - { depth: 12, refine: 2 }
    name: unlabeled-d${{ matrix.depth }}-r${{ matrix.refine }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20             experiments/collatz_unlabeled_ternary_trie.cpp -o /tmp/utrie
      - name: Run unlabeled trie scout
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/utrie ${{ matrix.depth }} ${{ matrix.refine }}             | tee results/census.txt
          grep -q "VERIFIED_UNLABELED_TERNARY_TRIE_SCOUT" results/census.txt
          grep -q "FINAL_GATE=UNLABELED_TRIE_QUOTIENT_D${{ matrix.depth }}_R${{ matrix.refine }}" results/census.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unlabeled-d${{ matrix.depth }}-r${{ matrix.refine }}
          path: results
          retention-days: 30
