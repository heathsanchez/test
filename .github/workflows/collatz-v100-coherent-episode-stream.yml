name: Collatz V100 coherent actual episode stream
on:
  push:
    branches: [collatz-v99-coherent-episode-stream-v100]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: collatz-v99-actual-episode-horizon
          run-id: 37876535855
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v99
      - name: Verify V99 qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          q=json.load(open("parent-v99/qualification.json"))
          claimed=q.pop("certificate_sha256")
          computed=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          assert claimed==computed=="9de3b1d3785366f3dfaa2dd8d3f2f39cc50d4d0ecfccc7e2da2b45f2d7d62793"
          assert q["status"]=="WARRANTED_FORMAL_ALL_FINITE_EPISODE_HORIZONS"
          print("V99_PARENT_VERIFIED")
          PY
      - name: Kernel check coherent source-coupled episode stream
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p evidence
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal > evidence/spine.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/GuardedDyadicSwitch.olean formal/Collatz/GuardedDyadicSwitch.lean > evidence/dyadic.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/SameCentreMacro.olean formal/Collatz/SameCentreMacro.lean > evidence/same.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/DistinctCentreSwitch.olean formal/Collatz/DistinctCentreSwitch.lean > evidence/distinct.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/EpisodeDeterminism.olean formal/Collatz/EpisodeDeterminism.lean > evidence/determinism.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ActualEpisode.olean formal/Collatz/ActualEpisode.lean > evidence/actual.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/EpisodeBridge.olean formal/Collatz/EpisodeBridge.lean > evidence/bridge.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ActualEpisodeChain.olean formal/Collatz/ActualEpisodeChain.lean > evidence/chain.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ActualReturnAdmission.olean formal/Collatz/ActualReturnAdmission.lean > evidence/admission.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ActualEpisodeHorizon.olean formal/Collatz/ActualEpisodeHorizon.lean > evidence/horizon.log
          lake env lean -DautoImplicit=false formal/Collatz/CoherentEpisodeStream.lean | tee evidence/v100.log
          ! grep -Eq 'sorryAx|Lean.ofReduceBool|error:' evidence/v100.log
          grep -q 'episode_stream_matches_actual_shortcut' evidence/v100.log
          grep -q 'episode_stream_compiles_chain' evidence/v100.log
          grep -q 'episode_stream_return_admitted' evidence/v100.log
          git rev-parse HEAD > evidence/commit.txt
      - name: Seal coherent stream qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/qualification.json
          import json,hashlib
          r={
            "schema":"COLLATZ_V99_COHERENT_EPISODE_STREAM_V100",
            "status":"WARRANTED_FORMAL_COHERENT_ACTUAL_EPISODE_STREAM",
            "parent_v99_qualification_sha256":"9de3b1d3785366f3dfaa2dd8d3f2f39cc50d4d0ecfccc7e2da2b45f2d7d62793",
            "one_total_episode_step_for_valid_states":True,
            "same_stream_exact_shortcut_at_all_indices":True,
            "same_stream_actual_chain_at_all_indices":True,
            "repeated_initial_anchor_produces_source_admitted_certificate":True,
            "universal_repeated_anchor_or_progress":False,
            "global_collatz":"UNKNOWN","qed":False,
            "residual":"Classify the one coherent actual no-exit stream: recurring anchors must force consequential rank/exit or nonterminal periodicity; perpetually fresh anchors need genuinely independent fixed-source constraints."
          }
          r["certificate_sha256"]=hashlib.sha256(json.dumps(r,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          print(json.dumps(r,sort_keys=True,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v100-coherent-episode-stream
          path: evidence/
          if-no-files-found: error
