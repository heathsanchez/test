name: Collatz V105 source-capped actual return
on:
  push:
    branches: [collatz-v104-source-capped-return-v105]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: collatz-v104-positive-source-three-way
          run-id: 37880919531
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v104
      - name: Verify V104 immutable authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          q=json.load(open("parent-v104/qualification.json"))
          claimed=q.pop("certificate_sha256")
          computed=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          assert claimed==computed=="d81f279f5d044a3961bd3582af0fc2e3eb15b5fb484fa0daa90fd4925866141c"
          assert q["status"]=="WARRANTED_FORMAL_ALL_POSITIVE_SOURCE_THREE_WAY"
          print("V104_PARENT_VERIFIED")
          PY
      - name: Kernel-check minimal-bad source-capped actual return consequence
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p evidence
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal > evidence/spine.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/GuardedDyadicSwitch.olean formal/Collatz/GuardedDyadicSwitch.lean > evidence/dyadic.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/SameCentreMacro.olean formal/Collatz/SameCentreMacro.lean > evidence/same.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/DistinctCentreSwitch.olean formal/Collatz/DistinctCentreSwitch.lean > evidence/distinct.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/EpisodeDeterminism.olean formal/Collatz/EpisodeDeterminism.lean > evidence/determinism.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ActualEpisode.olean formal/Collatz/ActualEpisode.lean > evidence/actual.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/EpisodeBridge.olean formal/Collatz/EpisodeBridge.lean > evidence/bridge.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ActualEpisodeChain.olean formal/Collatz/ActualEpisodeChain.lean > evidence/chain.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ActualReturnAdmission.olean formal/Collatz/ActualReturnAdmission.lean > evidence/admission.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ActualEpisodeHorizon.olean formal/Collatz/ActualEpisodeHorizon.lean > evidence/horizon.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/CoherentEpisodeStream.olean formal/Collatz/CoherentEpisodeStream.lean > evidence/stream.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ShiftedActualReturn.olean formal/Collatz/ShiftedActualReturn.lean > evidence/v101.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/FreshAnchorBoundary.olean formal/Collatz/FreshAnchorBoundary.lean > evidence/v102.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/RealCycleReturnFrontier.olean formal/Collatz/RealCycleReturnFrontier.lean > evidence/v103.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/PositiveSourceThreeWay.olean formal/Collatz/PositiveSourceThreeWay.lean > evidence/v104.log
          lake env lean -DautoImplicit=false formal/Collatz/SourceCappedReturn.lean | tee evidence/v105.log
          ! grep -Eq 'sorryAx|Lean.ofReduceBool|error:' evidence/v105.log
          grep -q 'minimal_bad_excludes_source_capped_return_descent' evidence/v105.log
          grep -q 'minimal_bad_source_capped_admitted_return_strict_ascent' evidence/v105.log
          git rev-parse HEAD > evidence/commit.txt
      - name: Seal source-cap consequence certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          result={
            "schema":"COLLATZ_V104_SOURCE_CAPPED_RETURN_V105",
            "status":"WARRANTED_FORMAL_SOURCE_CAPPED_RETURN_ASCENT",
            "parent_v104_qualification_sha256":"d81f279f5d044a3961bd3582af0fc2e3eb15b5fb484fa0daa90fd4925866141c",
            "executed_return_defect_equals_scaled_owner_change":True,
            "source_capped_actual_owner_descent_implies_ordinary_exit":True,
            "minimal_bad_source_capped_nonzero_admitted_return_strictly_ascends":True,
            "actual_nonterminal_positive_cycles_excluded":False,
            "return_nonzero_progress_universally_proved":False,
            "unbounded_fresh_anchor_impossible":False,
            "global_collatz":"UNKNOWN",
            "qed":False,
            "residual":"The source cap is essential: nonzero admitted returns starting above the original bad source can descend locally without proving ordinary exit. Prove unconditional source-relative event progress for all return positions or remove fresh/unbounded anchors and nonterminal periodic orbits."
          }
          result["certificate_sha256"]=hashlib.sha256(json.dumps(result,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          print(json.dumps(result,sort_keys=True,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v105-source-capped-return
          path: evidence/
          if-no-files-found: error
