name: Collatz V118 affine F transport bank
on:
  push:
    branches: [collatz-v115-affine-F-transport-bank-v118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-symbolic-bank:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exact lawful reverse-bank and source-coupled collision replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 research/collatz_F_transport_bank.py > evidence/v118-exact.json
          python3 research/collatz_v118_deep_F_critical_pair.py > evidence/v118-deep-F.json
          python3 -m research.collatz_v118_source11_frontier > evidence/v118-source11.json
          python3 - <<'PY'
          import json
          r=json.load(open("evidence/v118-exact.json"))
          assert r["schema"]=="COLLATZ_F_TRANSPORT_REVERSE_AFFINE_BANK"
          assert r["original_q7_source_certified"]==1013
          assert r["F_reverse_certified"]==333
          assert r["F_new_outside_q7"]==49
          assert r["F_overlap"]==284
          assert r["remaining_outside_union"]==1125
          assert len(r["F_word_types_novel"])==17
          assert len(r["novel_witnesses"])==49
          assert r["sample"]["n"]==10251
          assert r["sample"]["p"]==7199
          assert r["sample"]["common_endpoint"]==17300
          assert r["global_collatz"]=="UNKNOWN" and r["qed"] is False
          q=json.load(open("evidence/v118-deep-F.json"))
          assert q["schema"]=="COLLATZ_DEEP_F_15_STEP_SOURCE_COHERENT_MERGER"
          assert q["source_clock"]==15 and q["predecessor_clock"]==24
          assert q["no_direct_descent_prefix_length"]==15
          assert q["no_source_capped_hit_prefix_length"]==15
          assert len(q["exact_prefix_records"])==15
          assert len(q["regressions"])==5
          assert q["global_collatz"]=="UNKNOWN" and q["qed"] is False
          c=json.load(open("evidence/v118-source11.json"))
          assert c["schema"]=="COLLATZ_V118_NEW_SOURCE_11_MOD16_F_MERGER"
          assert c["new_old_CRT_residue_classes_vs_V112"]==93
          assert c["candidate_remaining_after_V118"]==164346
          assert len(c["residual_dyadic_residues"])==31
          assert len(c["newly_covered_old_CRT_classes"])==93
          assert len(c["exact_prefix"])==4
          assert c["global_collatz"]=="UNKNOWN" and c["qed"] is False
          print("V118_SOURCE_GUARDED_CONDITIONAL_F_BANK_REPLAY_PASS_GLOBAL_UNKNOWN")
          PY
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v118-F-reverse-bank-exact
          path: evidence/
          if-no-files-found: error
  lean-generic-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check affine F transport schema and source-45 witness
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p evidence .lake/build/lib/lean/Collatz
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal > evidence/spine.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/SourceProductAffine.olean formal/Collatz/SourceProductAffine.lean > evidence/affine.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/CylinderCoalescence.olean formal/Collatz/CylinderCoalescence.lean > evidence/v108.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ReverseAffineMerger.olean formal/Collatz/ReverseAffineMerger.lean > evidence/v109.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/Q7SourceMerger.olean formal/Collatz/Q7SourceMerger.lean > evidence/v110.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ScaledReverseMerger.olean formal/Collatz/ScaledReverseMerger.lean > evidence/v112.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ThreeCongruenceMerger.olean formal/Collatz/ThreeCongruenceMerger.lean > evidence/v113.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/NineCongruenceMerger.olean formal/Collatz/NineCongruenceMerger.lean > evidence/v114.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/ParityCollisionBridge.olean formal/Collatz/ParityCollisionBridge.lean > evidence/v115.log
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/AffineFTransportBank.olean formal/Collatz/AffineFTransportBank.lean | tee evidence/v118-lean.log
          lake env lean -DautoImplicit=false formal/Collatz/DeepFCollision.lean | tee evidence/v118-deep-lean.log
          lake env lean -DautoImplicit=false formal/Collatz/Source11Mod16Merger.lean | tee evidence/v118-source11-lean.log
          ! grep -Eq 'sorryAx|Lean.ofReduceBool|error:' evidence/v118-lean.log evidence/v118-deep-lean.log evidence/v118-source11-lean.log
          grep -q 'source_11_mod16_parity_collision' evidence/v118-source11-lean.log
          grep -q 'source_11_mod16_45_mod729_lower_merge' evidence/v118-source11-lean.log
          grep -q 'deep_F_collision_3391' evidence/v118-deep-lean.log
          grep -q 'deep_F_new_lower_merge' evidence/v118-deep-lean.log
          grep -q 'affine_F_transport_lower_merge' evidence/v118-lean.log
          grep -q 'source_45_reverse_word' evidence/v118-lean.log
          grep -q 'source_45_lower_merge_of_odd_run_even_odd' evidence/v118-lean.log
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v118-F-transport-Lean
          path: evidence/
          if-no-files-found: error
