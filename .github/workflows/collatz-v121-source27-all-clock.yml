name: Collatz V121 source-27 all-clock F obstruction
on:
  push:
    branches: [collatz-v120-source27-late-join-separator]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-all-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check complete 34-state closure and actual late join
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence .lake/build/lib/lean/Collatz
          python3 - <<'PY'
          import json,hashlib
          values=set(range(1,27))|{29,32,35,38,40,44,53,80}
          def T(n): return n//2 if n%2==0 else (3*n+1)//2
          assert len(values)==34 and max(values)==80
          assert all(T(v) in values for v in values)
          assert all(p in values for p in range(1,27))
          assert 83 not in values
          v=27
          for _ in range(59): v=T(v)
          assert v==23
          r=dict(schema="COLLATZ_V121_SOURCE27_FINITE_ORBIT_CLOSURE",
            status="BOUNDED_EXACT_PLUS_ALL_CLOCK_INDUCTIVE_LEMMA",
            states=len(values),largest_state=max(values),
            forbidden_F_endpoint=83,
            late_join_source=27,late_join_target=23,late_join_clock=59,
            universal_collatz=False,global_collatz="UNKNOWN",qed=False)
          open("evidence/finite-check.json","w").write(json.dumps(r,sort_keys=True,indent=2)+"\n")
          print("FINITE_CLOSED_ORBIT_SOURCE27_F_ENDPOINT_ABSENT")
          PY
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal > evidence/spine.log 2>&1
          for module in SourceProductAffine CylinderCoalescence FirstResidualRefinement; do
            lake env lean -DautoImplicit=false -o ".lake/build/lib/lean/Collatz/${module}.olean" "formal/Collatz/${module}.lean" > "evidence/${module}.log" 2>&1
          done
          lake env lean -DautoImplicit=false formal/Collatz/Source27AllClockSeparator.lean 2>&1 | tee evidence/source27-lean.log
          python3 - <<'PY'
          import re,json,subprocess,pathlib,hashlib
          text=pathlib.Path("evidence/source27-lean.log").read_text()
          assert not re.search(r"sorryAx|Lean\.ofReduceBool|error:",text)
          axioms={}
          for name,body in re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",text,re.S):
            x=[s.strip() for s in body.split(",") if s.strip()]
            assert set(x)<={"propext","Classical.choice","Quot.sound"},(name,x)
            axioms[name]=x
          for name in re.findall(r"'([^']+)' does not depend on any axioms",text):
            axioms[name]=[]
          required=["no_smaller_positive_source_hits_F27","F27_has_no_earlier_positive_preimage",
             "source27_later_joins_23","source27_F_obstruction_and_late_join"]
          assert all("CollatzFinal.SourceProduct."+k in axioms for k in required),axioms
          d=dict(schema="COLLATZ_V121_SOURCE27_ALL_CLOCK_CERTIFICATE",
            status="WARRANTED_FORMAL_FINITE_CLOSURE_AND_LATE_JOIN",
            named_axioms=axioms,all_positive_sources_covered=False,
            global_collatz="UNKNOWN",qed=False,
            commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            lean_log_sha256=hashlib.sha256(text.encode()).hexdigest())
          open("evidence/qualification.json","w").write(json.dumps(d,sort_keys=True,indent=2)+"\n")
          print("V121_SOURCE27_ALL_CLOCK_LEAN_PASS_GLOBAL_UNKNOWN")
          PY
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v121-source27-all-clock-separator
          path: evidence/
          if-no-files-found: error
