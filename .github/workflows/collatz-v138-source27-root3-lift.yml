name: Collatz V138 source27 primitive root3 future lift
on:
  push:
    branches: [collatz-v138-source27-primitive-root-lift]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-root-lift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify all-offset root3 source and original-source direct coverage simultaneously
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m research.collatz_v138_source27_root_lift > evidence/v138-exact.json
          python3 - <<'PY'
          import json,hashlib,pathlib,subprocess
          p=pathlib.Path('evidence/v138-exact.json')
          j=json.loads(p.read_text())
          assert j['schema']=='COLLATZ_V138_PRIMITIVE_SOURCE27_ROOT3_LIFT'
          assert j['source_slope']==2**66
          assert j['earlier_slope']==2*3**39
          assert j['source_clock']==66 and j['earlier_clock']==1
          assert j['source_odd_count_66']==40 and j['earlier_odd_count_1']==1
          assert j['common_endpoint_slope']==3**40
          assert j['old_v120_direct_descent_clock']==59
          assert j['v120_original_source_subfamily_factor']==128
          assert j['exact_affine_prefix_source'][-1]==j['exact_affine_prefix_earlier'][-1]
          assert j['root3_future_source_guaranteed_positive']
          assert j['entire_original_V120_CRT_family_closed'] is False
          assert j['global_collatz']=='UNKNOWN' and j['qed'] is False
          q={'schema':'COLLATZ_V138_EXACT_ROOT_REPRESENTATIVE_COALESCENCE',
             'status':'WARRANTED_EXACT_AFFINE_ROOT_REPRESENTATION',
             'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'exact_file_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
             'no_new_original_source_coverage_claim':True,
             'universal_Collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v138-exact-seal.json').write_text(json.dumps(q,indent=2,sort_keys=True)+'\n')
          print('V138_SOURCE27_ROOT3_CHART_EXACT_AND_OLD_CYLINDER_OVERLAP_PASS')
          PY
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v138-exact
          path: evidence/
          if-no-files-found: error
  formal-lift:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check V133→V136 source27 root lift and original V120 subfamily boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence .lake/build/lib/lean/Collatz
          test "$(git hash-object formal/Collatz/RootChartOverlapCompiler.lean)" = c35bde45d11aad51f46e6e8beced5322acd43e9b
          test "$(git hash-object formal/Collatz/Root23LateJoinReclosure.lean)" = b2aea7066186caf01a6be6743579ad27894edb75
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal > evidence/spine.log 2>&1
          for module in SourceProductAffine CylinderCoalescence LawfulFutureJoin RelationalRootMerger RootChartOverlapCompiler FirstResidualRefinement Root23LateJoinReclosure CanonicalCrossPowerChart ReducedThreePowerCharts ChartMultiplierCompleteness; do
            lake env lean -DautoImplicit=false -o ".lake/build/lib/lean/Collatz/${module}.olean" "formal/Collatz/${module}.lean" > "evidence/${module}.log" 2>&1
          done
          lake env lean -DautoImplicit=false formal/Collatz/Source27PrimitiveRootLift.lean 2>&1 | tee evidence/v138-lean.log
          python3 - <<'PY'
          import json,hashlib,re,pathlib,subprocess
          log=pathlib.Path('evidence/v138-lean.log').read_text()
          assert not re.search(r'sorryAx|Lean\.ofReduceBool|error:',log)
          axioms={}
          for n,a in re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",log,re.S):
            vals=[q.strip() for q in a.split(',') if q.strip()]
            assert set(vals)<={'propext','Quot.sound','Classical.choice'},(n,vals)
            axioms[n]=vals
          for n in re.findall(r"'([^']+)' does not depend on any axioms",log):
            axioms[n]=[]
          targets=['source27ReducedRoot3','source27_reduced_root3_source',
              'source27_reduced_root3_earlier','source27_reduced_root3_law',
              'source27_reduced_root3_earlier_is_three_root',
              'source27_reduced_root3_lower_merge',
              'source27_reduced_root3_is_old_dyadic_subfamily',
              'source27_root_and_previous_direct_descent_coexist']
          assert all('CollatzFinal.'+n in axioms for n in targets),axioms
          q={'schema':'COLLATZ_V138_FORMAL_SOURCE27_ROOT3_LIFT',
             'status':'WARRANTED_FORMAL_STRICT_ROOT3_COALESCENT_ALL_OFFSETS',
             'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'named_axioms':axioms,
             'lean_log_sha256':hashlib.sha256(log.encode()).hexdigest(),
             'derived_from_v133_true_base_clocks':True,
             'derived_from_v136_reduced_slope_semantics':True,
             'old_v120_source_family_not_mistaken_as_new_coverage':True,
             'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v138-formal-seal.json').write_text(json.dumps(q,indent=2,sort_keys=True)+'\n')
          print('V138_ALL_OFFSET_SOURCE27_ROOT3_LEAN_WARRANTED_NOT_QED')
          PY
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v138-formal
          path: evidence/
          if-no-files-found: error
  final-seal:
    needs: [exact-root-lift,formal-lift]
    runs-on: ubuntu-24.04
    if: success()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: collatz-v138-exact
          path: evidence/exact
      - uses: actions/download-artifact@v4
        with:
          name: collatz-v138-formal
          path: evidence/formal
      - name: Reconcile exact full-offset root certificate and no coverage inflation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          a=json.loads(pathlib.Path('evidence/exact/v138-exact-seal.json').read_text())
          b=json.loads(pathlib.Path('evidence/formal/v138-formal-seal.json').read_text())
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert a['source_commit']==b['source_commit']==sha
          assert a['no_new_original_source_coverage_claim']
          assert b['old_v120_source_family_not_mistaken_as_new_coverage']
          assert b['status']=='WARRANTED_FORMAL_STRICT_ROOT3_COALESCENT_ALL_OFFSETS'
          assert a['universal_Collatz']==b['global_collatz']=='UNKNOWN'
          assert a['qed'] is b['qed'] is False
          seal={'schema':'COLLATZ_V138_SOURCE27_ROOT3_FUTURE_REPRESENTATIVE',
             'status':'WARRANTED_FORMAL_ALL_OFFSET_LATE_ROOT3_JOIN',
             'source_commit':sha,
             'source_family':'27+2^66*t',
             'strictly_earlier_odd_three_root':'3+2*3^39*t',
             'source_clock':66,'earlier_clock':1,
             'previous_source_clock':59,
             'not_new_source_cylinder_coverage':True,
             'original_fixed_source27_earliest_clock_preserved':True,
             'universal_event_producer':'UNKNOWN',
             'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v138-final-seal.json').write_text(json.dumps(seal,indent=2,sort_keys=True)+'\n')
          print('V138_VERIFIED_ROOT3_CONSEQUENCE_NOT_GLOBAL_QED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-v138-final
          path: evidence/v138-final-seal.json
          if-no-files-found: error
