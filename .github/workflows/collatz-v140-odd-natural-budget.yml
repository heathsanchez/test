name: Collatz V140 finite 2-adic odd budget (not global closure)
on:
  push:
    branches: [collatz-v140-perpetual-odd-natural-exclusion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Replay finite source budgets and unbounded-horizon Mersenne controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m research.collatz_v140_source_coupled_odd_budget > evidence/v140-exact.json
          python3 - <<'PY'
          import json,pathlib,hashlib,subprocess
          p=pathlib.Path('evidence/v140-exact.json')
          d=json.loads(p.read_text())
          assert d['schema']=='COLLATZ_V140_SOURCE_COUPLED_ODD_BUDGET_EXACT'
          assert d['finite_natural_sources']==10001
          assert d['first_even_clock_equals_budget_for_all_tested']
          assert len(d['mersenne_negative_controls'])==9
          assert d['mersenne_negative_controls'][-1]['K']==256
          assert d['arbitrarily_long_finite_odd_prefixes_preserved']
          assert not d['all_parity_alternating_divergent_orbits_excluded']
          assert d['global_collatz']=='UNKNOWN' and d['qed'] is False
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          e={'schema':'COLLATZ_V140_EXACT_SEAL',
            'source_commit':sha,'status':'WARRANTED_BOUNDED_EXACT_VALUATION_REPLAY',
            'exact_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'no_all_odd_forever_claim_from_finite_samples':True,
            'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v140-exact-seal.json').write_text(
             json.dumps(e,sort_keys=True,indent=2)+'\n')
          PY
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v140-exact
          path: evidence/
          if-no-files-found: error

  formal-odd-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check V140 source-coupled odd exhaustion, finite shadow separation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence .lake/build/lib/lean/Collatz
          test "$(git hash-object formal/Collatz/SourceProductAffine.lean)" = 97a32acc490465c3bb0cd528e42100a6bbfd2f61
          test "$(git hash-object formal/Collatz/SourceProduct.lean)" = 9c65ed7a67eded1ad7e9c68ba086f584dbce5f87
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal > evidence/spine.log 2>&1
          lake env lean -DautoImplicit=false -o .lake/build/lib/lean/Collatz/SourceProductAffine.olean formal/Collatz/SourceProductAffine.lean > evidence/affine.log 2>&1
          lake env lean -DautoImplicit=false formal/Collatz/PerpetualOddNaturalExclusion.lean 2>&1 | tee evidence/v140-lean.log
          python3 - <<'PY'
          import re,pathlib,hashlib,json,subprocess
          p=pathlib.Path('evidence/v140-lean.log')
          log=p.read_text()
          assert not re.search(r'sorryAx|Lean\.ofReduceBool|error:',log),log[-3000:]
          axs={}
          for name,values in re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",log,re.S):
            vals=[v.strip() for v in values.split(',') if v.strip()]
            assert set(vals)<={'propext','Classical.choice','Quot.sound'},(name,vals)
            axs[name]=vals
          for name in re.findall(r"'([^']+)' does not depend on any axioms",log):
            axs[name]=[]
          targets=['positive_odd_step_normal_form',
                   'positive_natural_twopower_odd_factor',
                   'general_odd_prefix_exact',
                   'three_power_odd_mod_two',
                   'every_natural_shortcut_orbit_reaches_even',
                   'no_perpetual_odd_tail_from_any_natural']
          for name in targets:
            assert 'CollatzFinal.SourceProduct.'+name in axs,name
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          seal={'schema':'COLLATZ_V140_FORMAL_SOURCE_ODD_BUDGET',
                'status':'WARRANTED_FORMAL_NO_PERPETUAL_ODD_NATURAL_TAIL',
                'source_commit':sha,
                'axioms':axs,
                'lean_log_sha256':hashlib.sha256(log.encode()).hexdigest(),
                'all_natural_sources_odd_forever_ruled_out':True,
                'all_natural_sources_converge_to_one':False,
                'nonterminal_cycles_or_unbounded_mixed_parity_ruled_out':False,
                'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v140-formal-seal.json').write_text(
               json.dumps(seal,sort_keys=True,indent=2)+'\n')
          PY
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v140-formal
          path: evidence/
          if-no-files-found: error

  final-seal:
    needs: [exact-budget,formal-odd-budget]
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: collatz-v140-exact
          path: evidence/exact
      - uses: actions/download-artifact@v4
        with:
          name: collatz-v140-formal
          path: evidence/formal
      - name: Seal all-source odd exhaustion and protected negative continuations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          exact=json.loads(pathlib.Path('evidence/exact/v140-exact-seal.json').read_text())
          formal=json.loads(pathlib.Path('evidence/formal/v140-formal-seal.json').read_text())
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert exact['source_commit']==formal['source_commit']==sha
          assert formal['status']=='WARRANTED_FORMAL_NO_PERPETUAL_ODD_NATURAL_TAIL'
          assert formal['all_natural_sources_odd_forever_ruled_out']
          assert exact['no_all_odd_forever_claim_from_finite_samples']
          assert not formal['all_natural_sources_converge_to_one']
          assert exact['global_collatz']==formal['global_collatz']=='UNKNOWN'
          assert exact['qed'] is formal['qed'] is False
          result={'schema':'COLLATZ_V140_ODD_GHOST_SOURCE_BOUNDARY',
             'status':'WARRANTED_FORMAL_PERPETUAL_ODD_NATURAL_EXCLUSION',
             'source_commit':sha,'builds_on':'V139_FORMAL_CYCLE_OR_UNBOUNDED_DICHOTOMY',
             'perpetually_all_odd_positive_nat_stream':'REJECTED',
             'unbounded_mixed_parity_stream':'UNKNOWN',
             'positive_nonterminal_cycle':'UNKNOWN',
             'operational_controller':'V134_UNCHANGED',
             'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v140-final-seal.json').write_text(
             json.dumps(result,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-v140-final
          path: evidence/v140-final-seal.json
          if-no-files-found: error

  run-status-receipt:
    needs: [exact-budget,formal-odd-budget,final-seal]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Write exact SHA run receipt even on Lean failures
        uses: actions/github-script@v7
        with:
          script: |
            const stages={exact:'${{ needs.exact-budget.result }}',
                          formal:'${{ needs.formal-odd-budget.result }}',
                          final:'${{ needs.final-seal.result }}'};
            const qualified=Object.values(stages).every(x=>x==='success');
            const data={
              schema:'COLLATZ_V140_CI_RECEIPT',source_commit:context.sha,
              run_id:context.runId,
              run_url:context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId,
              stages,qualified,
              status:qualified?'WARRANTED_FORMAL_NO_PERPETUAL_ODD_NATURAL':'NOT_WARRANTED',
              global_collatz:'UNKNOWN',qed:false
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,
              branch:'collatz-v140-perpetual-odd-natural-exclusion',
              path:'research/ci_seals/collatz_v140_'+context.sha+'.json',
              message:'CI receipt: V140 source-coupled odd exhaustion '+context.sha.slice(0,12),
              content:Buffer.from(JSON.stringify(data,null,2)+'\n').toString('base64')
            });
