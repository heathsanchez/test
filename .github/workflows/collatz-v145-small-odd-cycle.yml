name: Collatz V145 two/four odd nonterminal period exclusions
on:
  push:
    branches: [collatz-v145-small-odd-cycle-inequality]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-inequality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exact multiplicative bound and terminal countercontrols
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m research.collatz_v145_small_odd_cycle_exact > evidence/v145-exact.json
          python3 - <<'PY'
          import json,pathlib,hashlib,subprocess
          p=pathlib.Path('evidence/v145-exact.json')
          x=json.loads(p.read_text())
          assert x['schema']=='COLLATZ_V145_SMALL_ODD_PERIOD_MULTIPLIER'
          assert x['finite_sources']==1999
          assert x['finite_prefix_snapshots_checked']>10000
          assert x['zero_feasible_periods_at_oddcounts']==[1,2,4]
          assert x['feasible_period_clock_counts_first15']['3']==[5] or x['feasible_period_clock_counts_first15'][3]==[5]
          assert x['terminal_cycle_excluded_from_no_one_premise']
          assert x['finite_search_not_universal_warrant']
          assert not x['true_positive_nonterminal_cycle_excluded_completely']
          assert not x['unbounded_positive_orbit_excluded']
          assert x['global_collatz']=='UNKNOWN' and x['qed'] is False
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          data={'schema':'COLLATZ_V145_EXACT_INEQUALITY_RECEIPT',
            'status':'WARRANTED_FINITE_EXACT_MULTIPLIER_CONTROLS',
            'source_commit':sha,
            'data_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'arbitrary_clock_results_require_separate_lean':True,
            'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v145-exact-seal.json').write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          PY
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v145-exact
          path: evidence/
          if-no-files-found: error
  formal-period-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-verify source-coupled prefix multiplier and nonterminal period gaps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence .lake/build/lib/lean/Collatz
          test "$(git hash-object formal/Collatz/OneOddCycleObstruction.lean)" = 1a926a7b0e7793fa9406b9d93bb1d01c5def0556
          test "$(git hash-object formal/Collatz/ParityCycleResidual.lean)" = c6ff15b2a5aac17754ea315cb5c90507eae394b0
          test "$(git hash-object formal/Collatz/ActualOrbitDichotomy.lean)" = e5f90f9ae369a3704f609ac776b3cbbbe16ce4ca
          test "$(git hash-object formal/Collatz/PerpetualOddNaturalExclusion.lean)" = f8889bfe73567b5a4a7383a7a9223be32da342be
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal > evidence/spine.log 2>&1
          for module in GuardedDyadicSwitch SameCentreMacro DistinctCentreSwitch EpisodeDeterminism ActualEpisode EpisodeBridge ActualEpisodeChain ActualReturnAdmission ActualEpisodeHorizon CoherentEpisodeStream ShiftedActualReturn FreshAnchorBoundary ActualOrbitDichotomy; do
            lake env lean -DautoImplicit=false -o ".lake/build/lib/lean/Collatz/${module}.olean" "formal/Collatz/${module}.lean" > "evidence/${module}.log" 2>&1
          done
          for module in SourceProductAffine PerpetualOddNaturalExclusion ParityCycleResidual OneOddCycleObstruction; do
            lake env lean -DautoImplicit=false -o ".lake/build/lib/lean/Collatz/${module}.olean" "formal/Collatz/${module}.lean" > "evidence/${module}.log" 2>&1
          done
          lake env lean -DautoImplicit=false formal/Collatz/SmallOddCycleMultiplierBarrier.lean 2>&1 | tee evidence/v145-lean.log
          python3 - <<'PY'
          import re,json,subprocess,hashlib,pathlib
          log=pathlib.Path('evidence/v145-lean.log').read_text()
          assert not re.search(r'sorryAx|Lean\.ofReduceBool|error:',log),log[-4000:]
          axioms={}
          for name,inside in re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",log,re.S):
            vals=[v.strip() for v in inside.split(',') if v.strip()]
            assert set(vals)<={'propext','Quot.sound','Classical.choice'},(name,vals)
            axioms[name]=vals
          for name in re.findall(r"'([^']+)' does not depend on any axioms",log):
            axioms[name]=[]
          names=[
            'never_one_prefix_multiplicative_bound',
            'nonterminal_period_multiplicative_upper_bound',
            'power_two_above_nine_at_least_sixteen',
            'power_two_above_eighty_one_at_least_128',
            'never_one_positive_period_cannot_have_two_odds',
            'never_one_positive_period_cannot_have_four_odds',
            'minimal_positive_bad_never_hits_one',
            'least_positive_bad_future_period_not_two_or_four_odds']
          for name in names:
            assert 'CollatzFinal.SourceProduct.'+name in axioms,name
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          data={'schema':'COLLATZ_V145_FORMAL_NONTERMINAL_SMALL_ODD_CYCLE_BARRIER',
            'status':'WARRANTED_FORMAL_TWO_AND_FOUR_ODD_PERIOD_EXCLUSION',
            'source_commit':sha,
            'named_axioms':axioms,
            'lean_log_sha256':hashlib.sha256(log.encode()).hexdigest(),
            'all_positive_period_clocks_in_declared_no_terminal_domain':True,
            'least_positive_bad_future_periods_with_2_or4_odds_excluded':True,
            'no_counterexample_orbit_constructed':True,
            'other_nonterminal_cycles_excluded':False,
            'unbounded_no_merge_orbits_excluded':False,
            'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v145-formal-seal.json').write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          PY
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v145-formal
          path: evidence/
          if-no-files-found: error
  final-seal:
    needs: [exact-inequality,formal-period-gap]
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: collatz-v145-exact
          path: evidence/exact
      - uses: actions/download-artifact@v4
        with:
          name: collatz-v145-formal
          path: evidence/formal
      - name: Reconcile exact and Lean evidence with full counterexample scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,pathlib,json
          a=json.loads(pathlib.Path('evidence/exact/v145-exact-seal.json').read_text())
          b=json.loads(pathlib.Path('evidence/formal/v145-formal-seal.json').read_text())
          h=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert a['source_commit']==b['source_commit']==h
          assert b['status']=='WARRANTED_FORMAL_TWO_AND_FOUR_ODD_PERIOD_EXCLUSION'
          assert b['least_positive_bad_future_periods_with_2_or4_odds_excluded']
          assert not b['other_nonterminal_cycles_excluded']
          assert not b['unbounded_no_merge_orbits_excluded']
          assert a['global_collatz']==b['global_collatz']=='UNKNOWN'
          assert a['qed'] is b['qed'] is False
          data={'schema':'COLLATZ_V145_QUALIFIED_NONTERMINAL_SMALL_ODD_CYCLE',
            'status':'WARRANTED_FORMAL_TWO_AND_FOUR_ODD_CYCLE_EXCLUSION',
            'source_commit':h,
            'new_exclusions':['2 odd visits','4 odd visits'],
            'prior_exclusions':['0 odd visits','1 odd visit'],
            'residuals':['nonterminal positive cycles with other odd visit counts',
                         'source attached unbounded no merge actual orbit'],
            'controller':'V134_UNCHANGED',
            'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v145-final-seal.json').write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-v145-final
          path: evidence/v145-final-seal.json
          if-no-files-found: error
  run-status-receipt:
    needs: [exact-inequality, formal-period-gap,final-seal]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Write same source CI outcome even if Lean fails
        uses: actions/github-script@v7
        with:
          script: |
            const stages={
              exact:'${{ needs.exact-inequality.result }}',
              formal:'${{ needs.formal-period-gap.result }}',
              final:'${{ needs.final-seal.result }}'};
            const qualified=Object.values(stages).every(x=>x==='success');
            const result={
              schema:'COLLATZ_V145_CI_RECEIPT',
              source_commit:context.sha,
              run_id:context.runId,
              run_url:context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId,
              stages,qualified,
              status:qualified?'WARRANTED_FORMAL_SMALL_ODD_CYCLE_EXCLUSIONS':'NOT_WARRANTED',
              global_collatz:'UNKNOWN',qed:false};
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,
              branch:'collatz-v145-small-odd-cycle-inequality',
              path:'research/ci_seals/collatz_v145_'+context.sha+'.json',
              message:'CI receipt: V145 source-coupled cycle inequalities '+context.sha.slice(0,12),
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64')
            });
