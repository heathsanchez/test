name: Collatz V155 universal future-class QED frontier
on:
  push:
    branches: [collatz-v155-universal-future-class-qed-frontier]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Source-attached exact future-class controls and toy negative separator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m research.collatz_v155_future_class_audit > evidence/v155-exact.json
          python3 - <<'PY'
          import pathlib,json,hashlib,subprocess
          p=pathlib.Path('evidence/v155-exact.json')
          d=json.loads(p.read_text())
          assert d['schema']=='COLLATZ_V155_EXACT_FUTURE_CLASS_SEPARATOR'
          assert d['actual_shortcut_tested_sources']==20000
          assert d['actual_tested_all_reached_terminal']
          assert d['all_sampled_fixed_dyadic_resolutions_fail_to_separate_toy_basins']
          assert d['synthetic_toy_not_collatz']
          assert not d['actual_collatz_global_terminal_class_proved']
          assert not d['no_second_class_exclusion_proved']
          assert d['global_collatz']=='UNKNOWN' and d['qed'] is False
          h=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          seal={'schema':'COLLATZ_V155_EXACT_SEAL','source_commit':h,
            'data_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'status':'WARRANTED_BOUNDED_CLASS_AND_SYNTHETIC_ALL_K_RESIDUE_CONTROLS',
            'actual_collatz_qed':False,'global_collatz':'UNKNOWN'}
          pathlib.Path('evidence/v155-exact-seal.json').write_text(json.dumps(seal,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v155-exact
          path: evidence/
          if-no-files-found: error

  formal-class-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check all-positive future class and actual least-bad alternative
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence .lake/build/lib/lean/Collatz
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal > evidence/spine.log 2>&1
          for module in GuardedDyadicSwitch SameCentreMacro DistinctCentreSwitch EpisodeDeterminism ActualEpisode EpisodeBridge ActualEpisodeChain ActualReturnAdmission ActualEpisodeHorizon CoherentEpisodeStream ShiftedActualReturn FreshAnchorBoundary ActualOrbitDichotomy; do
            lake env lean -DautoImplicit=false -o ".lake/build/lib/lean/Collatz/${module}.olean" "formal/Collatz/${module}.lean" > "evidence/${module}.log" 2>&1
          done
          lake env lean -DautoImplicit=false formal/Collatz/UniversalFutureClassFrontier.lean 2>&1 | tee evidence/v155-lean.log
          python3 - <<'PY'
          import re,json,pathlib,hashlib,subprocess
          log=pathlib.Path('evidence/v155-lean.log').read_text()
          assert not re.search(r'sorryAx|Lean\.ofReduceBool|error:',log),log[-10000:]
          axioms={}
          for name,inside in re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",log,re.S):
            aa=[z.strip() for z in inside.split(',') if z.strip()]
            assert set(aa)<={'propext','Classical.choice','Quot.sound'},(name,aa)
            axioms[name]=aa
          for name in re.findall(r"'([^']+)' does not depend on any axioms",log):
            axioms[name]=[]
          targets=[
            'v155_future_meet_refl','v155_future_meet_symm','v155_future_meet_trans',
            'v155_future_meets_one_iff_good','v155_single_class_iff_collatz',
            'v155_zero_tail_kernel_empty_iff_single_class',
            'v155_failure_has_actual_second_class_obstruction',
            'v155_even_scale_label','v155_fixed_dyadic_future_labels_collapse']
          for t in targets:
            assert 'CollatzFinal.SourceProduct.'+t in axioms,t
          h=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          seal={'schema':'COLLATZ_V155_FORMAL_CLASS_FRONTIER',
            'source_commit':h,'axioms':axioms,
            'status':'WARRANTED_FORMAL_CLASS_EQUIVALENCE_AND_FINITE_DYADIC_NO_GO',
            'lean_log_sha256':hashlib.sha256(log.encode()).hexdigest(),
            'full_collatz_unproved':True,
            'new_universal_irreducibility_theorem_not_proved':True,
            'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v155-formal-seal.json').write_text(json.dumps(seal,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v155-formal
          path: evidence/
          if-no-files-found: error

  final-seal:
    needs: [exact-separator,formal-class-frontier]
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: collatz-v155-exact
          path: evidence/exact
      - uses: actions/download-artifact@v4
        with:
          name: collatz-v155-formal
          path: evidence/formal
      - name: Independently seal theorem scope and exact negative boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          a=json.loads(pathlib.Path('evidence/exact/v155-exact-seal.json').read_text())
          b=json.loads(pathlib.Path('evidence/formal/v155-formal-seal.json').read_text())
          h=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert a['source_commit']==b['source_commit']==h
          assert b['status']=='WARRANTED_FORMAL_CLASS_EQUIVALENCE_AND_FINITE_DYADIC_NO_GO'
          assert b['full_collatz_unproved'] and b['new_universal_irreducibility_theorem_not_proved']
          assert a['global_collatz']==b['global_collatz']=='UNKNOWN'
          assert b['qed'] is False
          seal={'schema':'COLLATZ_V155_FINAL','source_commit':h,
            'status':'WARRANTED_FORMAL_CANONICAL_FUTURE_CLASS_AND_SOURCE_LOCKED_OBSTRUCTION_NOT_QED',
            'all_trajectories':'EXACT_UNIVERSAL_SOURCE_PRODUCT',
            'equivalent_criteria':['single positive future class','zero-tail post-fixed kernel empty','Collatz'],
            'no_qed_from_equivalence':True,
            'least_bad_alternative':['actual nonterminal cycle','unbounded no-descent orbit'],
            'proven_distinction':'fixed dyadic source-residue class labels respecting real even-halving collapse',
            'remaining':'prove true Collatz-specific exclusion of both live alternatives',
            'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v155-final.json').write_text(json.dumps(seal,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-v155-final
          path: evidence/v155-final.json
          if-no-files-found: error
