name: Collatz V177 universally lifted source-attached meeting compiler
on:
  push:
    branches: [collatz-v177-universal-meeting-affine-compiler]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-all-offset-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Exact real all-offset clocks and G7 dual-basin control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 research/collatz_v177_parallel_affine_audit.py > evidence/v177-exact.json
          python3 - <<'PY'
          import pathlib,json,hashlib,subprocess
          p=pathlib.Path('evidence/v177-exact.json')
          r=json.loads(p.read_text())
          assert r['schema']=='COLLATZ_V177_ALL_OFFSET_TWO_CLOCK_CERTIFICATE_COMPILER'
          assert len(r['bases'])==4
          assert r['bases'][0]['n_source_slope']==384
          assert r['bases'][0]['p_source_slope']==54
          assert r['real_source_cap_23_3_verified']
          assert r['generic_G7_affine_compiler_still_allows_two_real_positive_future_classes']
          assert not r['new_terminal_class_overlap_proved']
          assert not r['all_scale_certified_population_contraction_proved']
          assert r['global_collatz']=='UNKNOWN' and r['qed'] is False
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          seal={'schema':'COLLATZ_V177_EXACT','source_commit':sha,
                'result_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                'scope':'BOUNDED_FOUR_BASE_REPLAY_PLUS_DUAL_BASIN_CONTROL',
                'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v177-exact-seal.json').write_text(
             json.dumps(seal,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v177-exact
          path: evidence/
          if-no-files-found: error
  formal-infinite-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check all-source affine and source-capped all-offset family
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence .lake/build/lib/lean/Collatz
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal > evidence/spine.log 2>&1
          for module in GuardedDyadicSwitch SameCentreMacro DistinctCentreSwitch EpisodeDeterminism ActualEpisode EpisodeBridge ActualEpisodeChain ActualReturnAdmission ActualEpisodeHorizon CoherentEpisodeStream ShiftedActualReturn FreshAnchorBoundary ActualOrbitDichotomy UniversalFutureClassFrontier SourceProductAffine SourceCentreTransportSeparator RationalCentreObservationQuotient PerpetualOddNaturalExclusion ParityCycleResidual ActualRationalCentreDrift SourceRelativeReverseComparison DensityAmplificationClosure ZeroTailTernarySieve SourceLockedDyadicFutureLift BinaryTernaryClassMassTransfer; do
            lake env lean -DautoImplicit=false -o ".lake/build/lib/lean/Collatz/${module}.olean" "formal/Collatz/${module}.lean" > "evidence/${module}.log" 2>&1
          done
          lake env lean -DautoImplicit=false formal/Collatz/ParallelMeetingAffineCompiler.lean 2>&1 | tee evidence/v177-lean.log
          python3 - <<'PY'
          import pathlib,re,json,hashlib,subprocess
          log=pathlib.Path('evidence/v177-lean.log').read_text()
          assert not re.search(r'sorryAx|Lean\.ofReduceBool|error:',log),log[-16000:]
          ax={}
          for name,inside in re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",log,re.S):
            aa=[x.strip() for x in inside.split(',') if x.strip()]
            assert set(aa)<={'propext','Classical.choice','Quot.sound'},(name,aa)
            ax[name]=aa
          for name in re.findall(r"'([^']+)' does not depend on any axioms",log):
            ax[name]=[]
          for t in ('v177_parallel_source_affine_meeting',
                    'v177_infinite_source_capped_meetings',
                    'v177_root23_recompiled_from_single_meeting',
                    'v177_slope_lift_excludes_least_positive_bad',
                    'v177_root23_progression_excludes_minimal_bad'):
            assert 'CollatzFinal.SourceProduct.'+t in ax,t
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          seal={'schema':'COLLATZ_V177_FORMAL','source_commit':sha,
                'axioms':ax,
                'lean_sha256':hashlib.sha256(pathlib.Path(
                   'formal/Collatz/ParallelMeetingAffineCompiler.lean').read_bytes()).hexdigest(),
                'scope':'GENUINE_TWO_CLOCK_ALL_OFFSET_MEETING_AND_SLOPE_GUARDED_LOWER_MERGE',
                'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v177-formal-seal.json').write_text(
            json.dumps(seal,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v177-formal
          path: evidence/
          if-no-files-found: error
  final-source-seal:
    needs: [exact-all-offset-audit,formal-infinite-family]
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v177-exact
          path: evidence/exact
      - uses: actions/download-artifact@v4
        with:
          name: v177-formal
          path: evidence/formal
      - name: Protect exact source and scope of infinite family
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,subprocess
          a=json.loads(pathlib.Path('evidence/exact/v177-exact-seal.json').read_text())
          b=json.loads(pathlib.Path('evidence/formal/v177-formal-seal.json').read_text())
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert a['source_commit']==b['source_commit']==sha
          assert a['qed'] is b['qed'] is False
          assert a['global_collatz']==b['global_collatz']=='UNKNOWN'
          assert a['scope']=='BOUNDED_FOUR_BASE_REPLAY_PLUS_DUAL_BASIN_CONTROL'
          out={'schema':'COLLATZ_V177_FINAL','source_commit':sha,
               'status':'WARRANTED_FORMAL_ALL_OFFSET_TWO_CLOCK_FAMILY_BUT_NO_CERTIFICATE_MASS_GAIN',
               'all_scale_new_certified_mass':'UNKNOWN',
               'global_collatz':'UNKNOWN','qed':False}
          pathlib.Path('evidence/v177-final.json').write_text(
            json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v177-final
          path: evidence/v177-final.json
          if-no-files-found: error
