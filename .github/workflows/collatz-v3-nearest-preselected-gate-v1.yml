name: Collatz V3 nearest preselected gate V1

on:
  push:
    branches:
      - collatz-v3-nearest-preselected-gate-v1
    paths:
      - '.github/workflows/collatz-v3-nearest-preselected-gate-v1.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze candidate implementation
        run: |
          git diff --exit-code fdc3c4f28fabaa3454c78c9ad16633b96462c4ff -- \
            experiments/collatz_stateful_future_kernel_v0.py \
            experiments/test_collatz_stateful_future_kernel_v0.py
          echo "CANDIDATE_FROZEN_AT fdc3c4f28fabaa3454c78c9ad16633b96462c4ff"
      - name: Exact preselected-band gate
        run: |
          mkdir -p evidence/collatz-v3-nearest-preselected-gate-v1
          python experiments/collatz_stateful_future_kernel_v0.py \
            --lo 46081 --hi 46591 --K 128 \
            --output evidence/collatz-v3-nearest-preselected-gate-v1/result.json \
            | tee evidence/collatz-v3-nearest-preselected-gate-v1/run.log
      - name: Judge frozen nearest-centre separator
        run: |
          python - <<'PY'
          import json
          d=json.load(open('evidence/collatz-v3-nearest-preselected-gate-v1/result.json'))
          r=d['representations']
          row={
            'incomplete':len(d['incomplete_sources']),
            'completed_sources':d['counts'].get('completed_sources',0),
            'control_kernel':r['CONTROL']['future_kernel_classes'],
            'v3_max_kernel':r['V3_MAX']['future_kernel_classes'],
            'v3_nearest_kernel':r['V3_NEAREST']['future_kernel_classes'],
            'v3_nearest_set_kernel':r['V3_NEAREST_SET']['future_kernel_classes'],
            'v3_multiset_kernel':r['V3_MULTISET']['future_kernel_classes'],
            'v3_vector_kernel':r['V3_VECTOR']['future_kernel_classes'],
            'certificate':d['closure_certificate'],
          }
          print('PRESELECTED',json.dumps(row,sort_keys=True))
          assert row['incomplete']==0
          assert row['control_kernel']>0
          if row['v3_nearest_kernel']==0:
              print('PRESELECTED_VERDICT PASS_V3_NEAREST_KERNEL_COLLAPSE')
          else:
              print('PRESELECTED_VERDICT RESIDUAL_V3_NEAREST')
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-v3-nearest-preselected-gate-v1
          path: evidence/collatz-v3-nearest-preselected-gate-v1
          if-no-files-found: error
