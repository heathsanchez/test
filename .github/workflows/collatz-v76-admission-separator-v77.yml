name: Collatz V76 admission separator V77
on:
  push:
    branches: [collatz-v76-admission-separator-v77]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: 8d03454ac42dc476dc23b57fad8a280b31c3b71b
          path: frozen-v60

      - uses: actions/download-artifact@v4
        with:
          name: collatz-law-complete-zerozero-v76-qualified
          run-id: 36991392141
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v76

      - name: Verify V76 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          q=json.load(open('parent-v76/qualification.json'))
          claimed=q.pop('certificate_sha256')
          got=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got=='236b6feca88c68b81d2cacbccaff851449cb55f16c1c81c47b80933b9326f0db'
          assert q['status']=='WARRANTED_BOUNDED_LAW_ONLY_INSUFFICIENT'
          assert q['first_witness_anchor']==1
          assert q['first_witness_precisions']==[15,27,28]
          assert q['natural_congruence_witness']==23797
          print('V76_AUTHORITY_VERIFIED')
          PY

      - name: Intersect V76 witness with frozen V53 admission
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          V60_EXPERIMENTS_DIR="$GITHUB_WORKSPACE/frozen-v60/experiments" \
            python3 experiments/collatz_v76_admission_separator_v77.py > evidence/result.json
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          d=json.load(open('evidence/result.json'))
          assert d['schema']=='COLLATZ_V76_ADMISSION_SEPARATOR_V77'
          assert d['parent_v76_qualification_sha256']=='236b6feca88c68b81d2cacbccaff851449cb55f16c1c81c47b80933b9326f0db'
          assert d['anchor']==1
          assert d['witness_laws']==[
            [2187,1785,2048,11],
            [2187,1417,1024,10],
            [81,43,64,6],
            [729,857,512,9],
          ]
          allowed={
            'OBSERVED_EDGE_ADMISSION',
            'SOURCE_LINEAGE_COHERENCE',
            'KEY_OR_TEMPORAL_ADJACENCY_COHERENCE',
            'WITNESS_REALIZED_IN_FROZEN_V53',
          }
          assert d['minimum_admission_separator'] in allowed
          assert not d['qed'] and d['global_collatz']=='UNKNOWN'
          result={
            'schema':'COLLATZ_V76_ADMISSION_SEPARATOR_V77_QUALIFICATION',
            'status':'WARRANTED_BOUNDED',
            'minimum_admission_separator':d['minimum_admission_separator'],
            'witness_edge_row_counts':d['witness_edge_row_counts'],
            'witness_edge_unique_lineage_counts':d['witness_edge_unique_lineage_counts'],
            'common_source_t_anchor_lineages_across_all_three_edges':d['common_source_t_anchor_lineages_across_all_three_edges'],
            'exact_composed_three_edge_paths':d['exact_composed_three_edge_paths'],
            'first_failed_edge_index':d['first_failed_edge_index'],
            'global_collatz':'UNKNOWN',
            'qed':False,
          }
          result['certificate_sha256']=hashlib.sha256(
            json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          git rev-parse HEAD > evidence/commit.txt
          git -C frozen-v60 rev-parse HEAD > evidence/frozen-v60-commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v76-admission-separator-v77
          path: evidence
          if-no-files-found: error
