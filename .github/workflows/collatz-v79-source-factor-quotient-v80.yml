name: Collatz V79 source-factor quotient V80
on:
  push:
    branches: [collatz-v79-source-factor-quotient-v80]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: 8d03454ac42dc476dc23b57fad8a280b31c3b71b
          path: frozen-v60

      - uses: actions/download-artifact@v4
        with:
          name: collatz-v78-source-bit-separator-v79
          run-id: 36994268573
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v79

      - name: Verify V79 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          q=json.load(open('parent-v79/qualification.json'))
          claimed=q.pop('certificate_sha256')
          got=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got=='d382875d5083c6d3e2254744e2dde40688f6c0296f35a29a2257e3f205394f7f'
          assert q['minimum_low_source_bits']==44
          assert q['exact_t_collision_states']==0
          print('V79_AUTHORITY_VERIFIED')
          PY

      - name: Tournament native source factors and key subsets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          V60_EXPERIMENTS_DIR="$GITHUB_WORKSPACE/frozen-v60/experiments" \
            python3 experiments/collatz_v79_source_factor_quotient_v80.py > evidence/result.json
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          d=json.load(open('evidence/result.json'))
          assert d['schema']=='COLLATZ_V79_SOURCE_FACTOR_QUOTIENT_V80'
          assert d['parent_v79_qualification_sha256']=='d382875d5083c6d3e2254744e2dde40688f6c0296f35a29a2257e3f205394f7f'
          assert not d['qed'] and d['global_collatz']=='UNKNOWN'
          result={
            'schema':'COLLATZ_V79_SOURCE_FACTOR_QUOTIENT_V80_QUALIFICATION',
            'status':'WARRANTED_BOUNDED',
            'transition_rows':d['transition_rows'],
            'first_sufficient_ternary_precision_q':d['first_sufficient_ternary_precision_q'],
            'first_sufficient_k_low_bits':d['first_sufficient_k_low_bits'],
            'exact_factor_status':d['exact_factor_status'],
            'global_collatz':'UNKNOWN',
            'qed':False,
          }
          result['certificate_sha256']=hashlib.sha256(
            json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          git rev-parse HEAD > evidence/commit.txt
          git -C frozen-v60 rev-parse HEAD > evidence/frozen-v60-commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v79-source-factor-quotient-v80
          path: evidence
          if-no-files-found: error
