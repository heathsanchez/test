name: Collatz V80 fresh interface V81
on:
  push:
    branches: [collatz-v80-fresh-interface-v81]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: 8d03454ac42dc476dc23b57fad8a280b31c3b71b
          path: frozen-v60

      - uses: actions/download-artifact@v4
        with:
          name: collatz-v79-source-factor-quotient-v80
          run-id: 36994764543
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v80

      - name: Verify V80 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          q=json.load(open('parent-v80/qualification.json'))
          claimed=q.pop('certificate_sha256')
          got=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got=='f792cbf3e654b40066a8d9bd18aeceada78d958a5839a7497f1411decc0a11f9'
          assert q['status']=='WARRANTED_BOUNDED'
          assert q['first_sufficient_ternary_precision_q']==6
          assert q['exact_factor_status']['a_exact']['minimum_key_coordinates_if_zero']==2
          print('V80_AUTHORITY_VERIFIED')
          PY

      - name: Prospectively qualify frozen interface on fresh motifs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          V60_EXPERIMENTS_DIR="$GITHUB_WORKSPACE/frozen-v60/experiments" \
            PYTHONPATH="$GITHUB_WORKSPACE/experiments:$GITHUB_WORKSPACE/frozen-v60/experiments" \
            python3 -u experiments/collatz_v80_fresh_interface_v81.py > evidence/result.json
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          d=json.load(open('evidence/result.json'))
          assert d['schema']=='COLLATZ_V80_FRESH_INTERFACE_V81'
          assert d['parent_v80_qualification_sha256']=='f792cbf3e654b40066a8d9bd18aeceada78d958a5839a7497f1411decc0a11f9'
          assert len(d['fresh_motifs'])==4 and len(set(d['fresh_motifs']))==4
          assert d['old_transition_rows']==5487
          assert not d['qed'] and d['global_collatz']=='UNKNOWN'
          status=(
              'WARRANTED_BOUNDED_FRESH_INTERFACE_ZEROZERO'
              if d['status']=='FRESH_INTERFACE_AND_ZEROZERO_SURVIVE'
              else 'WARRANTED_BOUNDED_FRESH_INTERFACE_ONLY'
              if d['status']=='FRESH_INTERFACE_SURVIVES_ZEROZERO_RESIDUAL'
              else 'REJECTED_FRESH_INTERFACE'
          )
          result={
            'schema':'COLLATZ_V80_FRESH_INTERFACE_V81_QUALIFICATION',
            'status':status,
            'fresh_motifs':d['fresh_motifs'],
            'fresh_A_sources':d['fresh_A']['sources'],
            'fresh_B_sources':d['fresh_B']['sources'],
            'fresh_A_transition_rows':d['fresh_A_transition_rows'],
            'fresh_B_transition_rows':d['fresh_B_transition_rows'],
            'hard_separator_count':d['hard_separator_count'],
            'fresh_A_collision_states':d['functionality']['fresh_A']['collision_states'],
            'fresh_B_collision_states':d['functionality']['fresh_B']['collision_states'],
            'combined_collision_states':d['functionality']['old_plus_A_plus_B']['collision_states'],
            'transport_A_conflicts':d['transport']['A']['conflicted'],
            'transport_B_conflicts':d['transport']['B']['conflicted'],
            'interface_survives':d['interface_survives'],
            'zero_zero_paths':(
                None if d['zerozero_reclosure'] is None
                else d['zerozero_reclosure']['zero_zero_paths']
            ),
            'global_collatz':'UNKNOWN',
            'qed':False,
          }
          result['certificate_sha256']=hashlib.sha256(
            json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          git rev-parse HEAD > evidence/commit.txt
          git -C frozen-v60 rev-parse HEAD > evidence/frozen-v60-commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v80-fresh-interface-v81
          path: evidence
          if-no-files-found: error
