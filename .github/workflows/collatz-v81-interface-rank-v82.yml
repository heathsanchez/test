name: Collatz V81 interface rank V82
on:
  push:
    branches: [collatz-v81-interface-rank-v82]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: 8d03454ac42dc476dc23b57fad8a280b31c3b71b
          path: frozen-v60

      - uses: actions/download-artifact@v4
        with:
          name: collatz-v80-fresh-interface-v81
          run-id: 37437716076
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v81

      - name: Verify V81 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          q=json.load(open('parent-v81/qualification.json'))
          claimed=q.pop('certificate_sha256')
          got=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got=='cf152e580fce5a4a46ba8c98a2b83a16aacf91ee794a521bdf8eb6a20968c4cf'
          assert q['status']=='WARRANTED_BOUNDED_FRESH_INTERFACE_ZEROZERO'
          assert q['interface_survives'] and q['zero_zero_paths']==0
          print('V81_AUTHORITY_VERIFIED')
          PY

      - name: Compute exact interface SCCs and elimination rank
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          V60_EXPERIMENTS_DIR="$GITHUB_WORKSPACE/frozen-v60/experiments" \
            PYTHONPATH="$GITHUB_WORKSPACE/experiments:$GITHUB_WORKSPACE/frozen-v60/experiments" \
            python3 -u experiments/collatz_v81_interface_rank_v82.py > evidence/result.json
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          d=json.load(open('evidence/result.json'))
          assert d['schema']=='COLLATZ_V81_INTERFACE_RANK_V82'
          assert d['parent_v81_run']==37437716076
          assert d['transition_rows']==11579
          assert not d['qed'] and d['global_collatz']=='UNKNOWN'
          result={
            'schema':'COLLATZ_V81_INTERFACE_RANK_V82_QUALIFICATION',
            'status':('WARRANTED_BOUNDED_ACYCLIC_INTERFACE' if d['recurrent_sccs']==0
                      else 'WARRANTED_BOUNDED_RECURRENT_INTERFACE_RESIDUAL'),
            'transition_rows':d['transition_rows'],
            'interface_states':d['interface_states'],
            'residual_edges':d['residual_edges'],
            'recurrent_sccs':d['recurrent_sccs'],
            'largest_recurrent_scc':d['largest_recurrent_scc'],
            'recurrent_nodes':d['recurrent_nodes'],
            'leftover_states':d['leftover_states'],
            'max_elimination_rank':d['max_elimination_rank'],
            'terminal_state_kinds':d['terminal_state_kinds'],
            'global_collatz':'UNKNOWN',
            'qed':False,
          }
          result['certificate_sha256']=hashlib.sha256(
            json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          git rev-parse HEAD > evidence/commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v81-interface-rank-v82
          path: evidence
          if-no-files-found: error
