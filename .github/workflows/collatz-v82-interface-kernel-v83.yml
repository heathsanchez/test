name: Collatz V82 interface kernel V83
on:
  push:
    branches: [collatz-v82-interface-kernel-v83]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: 8d03454ac42dc476dc23b57fad8a280b31c3b71b
          path: frozen-v60

      - uses: actions/download-artifact@v4
        with:
          name: collatz-v81-lexicographic-closeout-v82
          run-id: 37438739158
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v82

      - name: Verify V82 formal authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          q=json.load(open('parent-v82/qualification.json'))
          claimed=q.pop('certificate_sha256')
          got=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got=='5edd997c728da944f16f3462f3c89c1aa36e32a7947910aeb8f3aac27e608ce4'
          assert q['status']=='WARRANTED_FORMAL_INTERFACE'
          assert q['positive_collatz_closeout'] is True
          assert q['instantiated_collatz_progress'] is False
          print('V82_AUTHORITY_VERIFIED')
          PY

      - name: Rebuild V81 authority and close interface kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          V60_EXPERIMENTS_DIR="$GITHUB_WORKSPACE/frozen-v60/experiments" \
            PYTHONPATH="$GITHUB_WORKSPACE/experiments:$GITHUB_WORKSPACE/frozen-v60/experiments" \
            python3 -u experiments/collatz_v82_interface_kernel_v83.py > evidence/result.json
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          d=json.load(open('evidence/result.json'))
          assert d['schema']=='COLLATZ_V82_INTERFACE_KERNEL_V83'
          assert d['parent_v81_qualification_sha256']=='cf152e580fce5a4a46ba8c98a2b83a16aacf91ee794a521bdf8eb6a20968c4cf'
          assert not d['qed'] and d['global_collatz']=='UNKNOWN'
          if d['status']=='FINITE_INTERFACE_KERNEL_ACYCLIC':
              assert d['recurrent_sccs']==0
              assert d['leftover_nodes']==0
              assert not d['edge_rank_violations']
              status='WARRANTED_BOUNDED_FINITE_MACRO_RANK'
          else:
              assert d['recurrent_sccs']>0
              status='WARRANTED_BOUNDED_RECURRENT_INTERFACE_CELL'
          result={
            'schema':'COLLATZ_V82_INTERFACE_KERNEL_V83_QUALIFICATION',
            'status':status,
            'combined_transition_rows':d['combined_transition_rows'],
            'interface_nodes':d['interface_nodes'],
            'deduplicated_residual_edges':d['deduplicated_residual_edges'],
            'recurrent_sccs':d['recurrent_sccs'],
            'largest_recurrent_scc':d['largest_recurrent_scc'],
            'leftover_nodes':d['leftover_nodes'],
            'max_rank':d['max_rank'],
            'rank_sha256':d['rank_sha256'],
            'first_cycle':d['first_cycle'],
            'global_collatz':'UNKNOWN',
            'qed':False,
          }
          result['certificate_sha256']=hashlib.sha256(
            json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          git rev-parse HEAD > evidence/commit.txt
          git -C frozen-v60 rev-parse HEAD > evidence/frozen-v60-commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v82-interface-kernel-v83
          path: evidence
          if-no-files-found: error
