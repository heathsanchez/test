name: Collatz V84 source precision closeout V85
on:
  push:
    branches: [collatz-v84-source-precision-closeout-v85]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collatz-v83-universal-residual-v84
          run-id: 37525795961
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v84

      - name: Verify V84 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          q=json.load(open('parent-v84/qualification.json'))
          claimed=q.pop('certificate_sha256')
          got=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got=='c862303c1d250dc4660ac2827850126c56bebc733ef2a6ea1ed9295c241402fe'
          assert q['status']=='WARRANTED_FORMAL_RESIDUAL_DECOMPOSITION'
          assert q['actual_affine_fixed_iff_periodic'] is True
          print('V84_AUTHORITY_VERIFIED')
          PY

      - name: Kernel-check source precision macro closeout
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p evidence
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal | tee evidence/spine.log
          lake env lean -DautoImplicit=false \
            -o .lake/build/lib/lean/Collatz/BiadicLexicographicCloseout.olean \
            formal/Collatz/BiadicLexicographicCloseout.lean \
            > evidence/lex-closeout-build.log
          lake env lean -DautoImplicit=false \
            -o .lake/build/lib/lean/Collatz/UniversalMacroResidual.olean \
            formal/Collatz/UniversalMacroResidual.lean \
            > evidence/universal-residual-build.log
          lake env lean -DautoImplicit=false \
            -o .lake/build/lib/lean/Collatz/GuardedExitObligation.olean \
            formal/Collatz/GuardedExitObligation.lean \
            > evidence/guarded-exit-build.log
          lake env lean -DautoImplicit=false \
            -o .lake/build/lib/lean/Collatz/ProtectedFutureQuotient.olean \
            formal/Collatz/ProtectedFutureQuotient.lean \
            > evidence/protected-future-build.log
          lake env lean -DautoImplicit=false formal/Collatz/SourcePrecisionMacroCloseout.lean \
            | tee evidence/source-precision-closeout.log
          ! grep -q 'sorryAx' evidence/source-precision-closeout.log
          ! grep -q 'Lean.ofReduceBool' evidence/source-precision-closeout.log
          grep -q 'collatz_of_source_precision_macro_classification' evidence/source-precision-closeout.log
          grep -q 'collatz_of_source_precision_macro_or_affine_fixed' evidence/source-precision-closeout.log
          git rev-parse HEAD > evidence/commit.txt

      - name: Seal qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          result={
            'schema':'COLLATZ_V84_SOURCE_PRECISION_CLOSEOUT_V85_QUALIFICATION',
            'status':'WARRANTED_FORMAL_MACRO_CLOSEOUT',
            'parent_v84_qualification_sha256':'c862303c1d250dc4660ac2827850126c56bebc733ef2a6ea1ed9295c241402fe',
            'switch_compiles_to_major_decrease':True,
            'same_precision_reserve_compiles_to_minor_decrease':True,
            'affine_fixed_compiles_to_periodic_obstruction':True,
            'global_collatz':'UNKNOWN',
            'qed':False,
            'remaining_obligations':[
              'instantiate source precision and defect reserve on arbitrary ZeroTailLive states',
              'prove universal eventual classified macro event',
              'exclude PositivePeriodic endpoints on ZeroTailLive states',
            ],
          }
          result['certificate_sha256']=hashlib.sha256(
            json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v84-source-precision-closeout-v85
          path: evidence
          if-no-files-found: error
