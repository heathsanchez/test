name: Collatz V85 episode source precision V86
on:
  push:
    branches: [collatz-v85-episode-source-precision-v86]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collatz-v84-source-precision-closeout-v85
          run-id: 37550586164
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v85

      - name: Verify V85 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          q=json.load(open('parent-v85/qualification.json'))
          claimed=q.pop('certificate_sha256')
          got=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got=='298da1d97da94cd29a81382ffd2f5d715c66e3ee109e59b261d9f69ae1043b8d'
          assert q['status']=='WARRANTED_FORMAL_MACRO_CLOSEOUT'
          print('V85_AUTHORITY_VERIFIED')
          PY

      - name: Kernel-check episode source precision
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p evidence
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal | tee evidence/spine.log
          lake env lean -DautoImplicit=false formal/Collatz/EpisodeSourcePrecision.lean \
            | tee evidence/episode-source-precision.log
          ! grep -q 'sorryAx' evidence/episode-source-precision.log
          ! grep -q 'Lean.ofReduceBool' evidence/episode-source-precision.log
          grep -q 'episode_anchor_source_equation' evidence/episode-source-precision.log
          grep -q 'episode_anchor_source_mod_zero' evidence/episode-source-precision.log
          git rev-parse HEAD > evidence/commit.txt

      - name: Seal qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          result={
            'schema':'COLLATZ_V85_EPISODE_SOURCE_PRECISION_V86_QUALIFICATION',
            'status':'WARRANTED_FORMAL_SOURCE_PRECISION_BRIDGE',
            'parent_v85_qualification_sha256':'298da1d97da94cd29a81382ffd2f5d715c66e3ee109e59b261d9f69ae1043b8d',
            'episode_anchor_exists':True,
            'reachable_exact_affine':True,
            'episode_anchor_source_equation':True,
            'episode_anchor_source_mod_zero':True,
            'global_collatz':'UNKNOWN',
            'qed':False,
            'remaining_obligations':[
              'turn successive source-congruence certificates into the canonical switch precision/refinement event',
              'derive same-centre defect reserve event source-admittedly',
              'exclude PositivePeriodic endpoints on ZeroTailLive states',
            ],
          }
          result['certificate_sha256']=hashlib.sha256(
            json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v85-episode-source-precision-v86
          path: evidence
          if-no-files-found: error
