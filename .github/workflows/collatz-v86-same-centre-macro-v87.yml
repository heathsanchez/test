name: Collatz V86 same-centre macro V87
on:
  push:
    branches: [collatz-v86-same-centre-macro-v87]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collatz-v85-episode-source-precision-v86
          run-id: 37552900438
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v86

      - name: Verify V86 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          q=json.load(open('parent-v86/qualification.json'))
          claimed=q.pop('certificate_sha256')
          got=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got=='cbc1eeab2582f6c09b36745bf872d319832bf7bd9aeae089cf195333332a1ae5'
          assert q['status']=='WARRANTED_FORMAL_SOURCE_PRECISION_BRIDGE'
          print('V86_AUTHORITY_VERIFIED')
          PY

      - name: Kernel-check same-centre macro classification
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p evidence
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal | tee evidence/spine.log
          lake env lean -DautoImplicit=false \
            -o .lake/build/lib/lean/Collatz/GuardedDyadicSwitch.olean \
            formal/Collatz/GuardedDyadicSwitch.lean \
            > evidence/guarded-dyadic-build.log
          lake env lean -DautoImplicit=false formal/Collatz/SameCentreMacro.lean \
            | tee evidence/same-centre-macro.log
          ! grep -q 'sorryAx' evidence/same-centre-macro.log
          ! grep -q 'Lean.ofReduceBool' evidence/same-centre-macro.log
          grep -q 'same_centre_return_classification' evidence/same-centre-macro.log
          git rev-parse HEAD > evidence/commit.txt

      - name: Seal qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          result={
            'schema':'COLLATZ_V86_SAME_CENTRE_MACRO_V87_QUALIFICATION',
            'status':'WARRANTED_FORMAL_SAME_CENTRE_CLASSIFICATION',
            'parent_v86_qualification_sha256':'cbc1eeab2582f6c09b36745bf872d319832bf7bd9aeae089cf195333332a1ae5',
            'same_centre_nonzero_defect_reserve_drop':True,
            'same_centre_pulled_precision_preserved':True,
            'same_centre_zero_defect_fixed':True,
            'global_collatz':'UNKNOWN',
            'qed':False,
            'remaining_obligations':[
              'prove source-admitted return-event production on arbitrary ZeroTailLive states',
              'compile distinct-centre admissibility into strict source-precision gain',
              'exclude PositivePeriodic endpoints on ZeroTailLive states',
            ],
          }
          result['certificate_sha256']=hashlib.sha256(
            json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v86-same-centre-macro-v87
          path: evidence
          if-no-files-found: error
