name: Collatz V87 distinct-centre switch V88
on:
  push:
    branches: [collatz-v87-distinct-centre-switch-v88]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collatz-v86-same-centre-macro-v87
          run-id: 37553076019
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v87

      - name: Verify V87 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          q=json.load(open('parent-v87/qualification.json'))
          claimed=q.pop('certificate_sha256')
          got=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got=='c1e511c7332d15d66b87e4d9f04e98d5b818aead3a0c5c04812b1a2cb83d9c05'
          assert q['status']=='WARRANTED_FORMAL_SAME_CENTRE_CLASSIFICATION'
          print('V87_AUTHORITY_VERIFIED')
          PY

      - name: Kernel-check separated distinct-centre switch
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p evidence
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal | tee evidence/spine.log
          lake env lean -DautoImplicit=false \
            -o .lake/build/lib/lean/Collatz/GuardedDyadicSwitch.olean \
            formal/Collatz/GuardedDyadicSwitch.lean \
            > evidence/guarded-dyadic-build.log
          lake env lean -DautoImplicit=false \
            -o .lake/build/lib/lean/Collatz/SameCentreMacro.olean \
            formal/Collatz/SameCentreMacro.lean \
            > evidence/same-centre-build.log
          lake env lean -DautoImplicit=false formal/Collatz/DistinctCentreSwitch.lean \
            | tee evidence/distinct-centre-switch.log
          ! grep -q 'sorryAx' evidence/distinct-centre-switch.log
          ! grep -q 'Lean.ofReduceBool' evidence/distinct-centre-switch.log
          grep -q 'separated_admissible_switch_old_order' evidence/distinct-centre-switch.log
          grep -q 'separated_admissible_switch_precision_gain' evidence/distinct-centre-switch.log
          git rev-parse HEAD > evidence/commit.txt

      - name: Seal qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          result={
            'schema':'COLLATZ_V87_DISTINCT_CENTRE_SWITCH_V88_QUALIFICATION',
            'status':'WARRANTED_FORMAL_DISTINCT_CENTRE_GAIN',
            'parent_v87_qualification_sha256':'c1e511c7332d15d66b87e4d9f04e98d5b818aead3a0c5c04812b1a2cb83d9c05',
            'pair_injection_identity':True,
            'admissible_separated_switch_old_order_exact':True,
            'admissible_separated_switch_precision_gain':True,
            'global_collatz':'UNKNOWN',
            'qed':False,
            'remaining_obligations':[
              'prove every source-admitted distinct-centre return transition is separated or affine-fixed',
              'prove source-admitted return-event production on arbitrary ZeroTailLive states',
              'exclude PositivePeriodic endpoints on ZeroTailLive states',
            ],
          }
          result['certificate_sha256']=hashlib.sha256(
            json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v87-distinct-centre-switch-v88
          path: evidence
          if-no-files-found: error
