name: Collatz V88 switch admission audit V89
on:
  push:
    branches: [collatz-v88-switch-admission-audit-v89]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: 8d03454ac42dc476dc23b57fad8a280b31c3b71b
          path: frozen-v60

      - uses: actions/download-artifact@v4
        with:
          name: collatz-v87-distinct-centre-switch-v88
          run-id: 37553452903
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v88

      - name: Verify V88 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          q=json.load(open('parent-v88/qualification.json'))
          claimed=q.pop('certificate_sha256')
          got=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got=='79b4d17de53a7e7f532440e253728c6a18164cdb741fe0058e48f1bc9ecd898d'
          assert q['status']=='WARRANTED_FORMAL_DISTINCT_CENTRE_GAIN'
          print('V88_AUTHORITY_VERIFIED')
          PY

      - name: Rebuild V81 authority and audit every actual switch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          V60_EXPERIMENTS_DIR="$GITHUB_WORKSPACE/frozen-v60/experiments" \
            PYTHONPATH="$GITHUB_WORKSPACE/experiments:$GITHUB_WORKSPACE/frozen-v60/experiments" \
            python3 -u experiments/collatz_v88_switch_admission_audit_v89.py \
            > evidence/result.json
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          d=json.load(open('evidence/result.json'))
          assert d['schema']=='COLLATZ_V88_SWITCH_ADMISSION_AUDIT_V89'
          assert d['parent_v88_qualification_sha256']=='79b4d17de53a7e7f532440e253728c6a18164cdb741fe0058e48f1bc9ecd898d'
          assert d['authority']['v81_interface_survives'] is True
          assert not d['qed'] and d['global_collatz']=='UNKNOWN'
          if d['first_violation'] is None:
              assert d['stats'].get('violations',0)==0
              status='WARRANTED_BOUNDED_V88_PREMISE_ON_V81_AUTHORITY'
          else:
              status='WARRANTED_BOUNDED_V88_SEPARATOR'
          result={
            'schema':'COLLATZ_V88_SWITCH_ADMISSION_AUDIT_V89_QUALIFICATION',
            'status':status,
            'combined_rows':d['authority']['combined_rows'],
            'distinct_centre_edges':d['stats'].get('distinct_centre_edges',0),
            'new_zero_defect':d['stats'].get('new_zero_defect',0),
            'violations':d['stats'].get('violations',0),
            'first_violation':d['first_violation'],
            'global_collatz':'UNKNOWN',
            'qed':False,
          }
          result['certificate_sha256']=hashlib.sha256(
            json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          git rev-parse HEAD > evidence/commit.txt
          git -C frozen-v60 rev-parse HEAD > evidence/frozen-v60-commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v88-switch-admission-audit-v89
          path: evidence
          if-no-files-found: error
