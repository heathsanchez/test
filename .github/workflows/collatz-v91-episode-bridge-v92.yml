name: Collatz V91 episode bridge V92
on:
  push:
    branches: [collatz-v91-episode-bridge-v92]
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collatz-v90-actual-episode-v91
          run-id: 37554931777
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent-v91

      - name: Verify V91 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          q=json.load(open('parent-v91/qualification.json'))
          claimed=q.pop('certificate_sha256')
          got=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got=='ef2283abf35177fc3ff18fc32d62342f75f025b32f57d1501a9ea492c8a2be49'
          assert q['status']=='WARRANTED_FORMAL_ACTUAL_EPISODE'
          print('V91_AUTHORITY_VERIFIED')
          PY

      - name: Kernel-check actual/algebraic episode bridge
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p evidence
          lake env lean --version | tee evidence/toolchain.txt
          lake build CollatzFinal | tee evidence/spine.log
          lake env lean -DautoImplicit=false \
            -o .lake/build/lib/lean/Collatz/GuardedDyadicSwitch.olean \
            formal/Collatz/GuardedDyadicSwitch.lean \
            > evidence/guarded-dyadic-build.log
          lake env lean -DautoImplicit=false \
            -o .lake/build/lib/lean/Collatz/EpisodeDeterminism.olean \
            formal/Collatz/EpisodeDeterminism.lean \
            > evidence/episode-determinism-build.log
          lake env lean -DautoImplicit=false \
            -o .lake/build/lib/lean/Collatz/ActualEpisode.olean \
            formal/Collatz/ActualEpisode.lean \
            > evidence/actual-episode-build.log
          lake env lean -DautoImplicit=false formal/Collatz/EpisodeBridge.lean \
            | tee evidence/episode-bridge.log
          ! grep -q 'sorryAx' evidence/episode-bridge.log
          ! grep -q 'Lean.ofReduceBool' evidence/episode-bridge.log
          grep -q 'naturalEpisode_to_algebraic' evidence/episode-bridge.log
          grep -q 'actual_algebraic_episode_exists' evidence/episode-bridge.log
          grep -q 'actual_algebraic_episode_unique' evidence/episode-bridge.log
          git rev-parse HEAD > evidence/commit.txt

      - name: Seal qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/qualification.json
          import hashlib,json
          result={
            'schema':'COLLATZ_V91_EPISODE_BRIDGE_V92_QUALIFICATION',
            'status':'WARRANTED_FORMAL_EPISODE_BRIDGE',
            'parent_v91_qualification_sha256':'ef2283abf35177fc3ff18fc32d62342f75f025b32f57d1501a9ea492c8a2be49',
            'natural_to_algebraic_bridge':True,
            'actual_algebraic_episode_exists':True,
            'actual_algebraic_episode_unique':True,
            'global_collatz':'UNKNOWN',
            'qed':False,
            'remaining_obligations':[
              'compose unique actual episodes into same-anchor first-return certificates',
              'prove distinct first-return cylinder separation or cancellation refinement universally',
              'classify infinite fresh-anchor continuation using V86 source congruences',
              'exclude PositivePeriodic endpoints on ZeroTailLive states',
            ],
          }
          result['certificate_sha256']=hashlib.sha256(
            json.dumps(result,sort_keys=True,separators=(',',':')).encode()
          ).hexdigest()
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-v91-episode-bridge-v92
          path: evidence
          if-no-files-found: error
