name: Collatz verified pre-q0 certificate filter
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_verified_preq0_certificate_filter.py'
      - '.github/workflows/collatz-verified-preq0-filter.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_verified_preq0_certificate_filter.py | tee /tmp/preq0-filter.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-preq0-filter
          path: /tmp/preq0-filter.txt
