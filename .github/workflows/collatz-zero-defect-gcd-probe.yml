name: Collatz zero-defect gcd probe
on:
  push:
    branches: [collatz-final-bridge-probes-v1]
    paths:
      - 'experiments/collatz_zero_defect_gcd_probe.py'
      - '.github/workflows/collatz-zero-defect-gcd-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -u experiments/collatz_zero_defect_gcd_probe.py | tee /tmp/zero-defect-gcd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zero-defect-gcd-probe
          path: /tmp/zero-defect-gcd.txt
