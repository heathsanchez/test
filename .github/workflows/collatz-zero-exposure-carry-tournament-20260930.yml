name: Collatz Zero-Exposure Carry Tournament
on:
  push:
    branches: [collatz-zero-exposure-carry-tournament-20260930]
    paths:
      - 'experiments/collatz_zero_exposure_carry_tournament_20260930.py'
      - '.github/workflows/collatz-zero-exposure-carry-tournament-20260930.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run source-relative carry tournament
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-zero-exposure-carry-tournament-20260930
          PYTHONPATH=experiments python -u experiments/collatz_zero_exposure_carry_tournament_20260930.py             | tee evidence/collatz-zero-exposure-carry-tournament-20260930/result.json
          python - <<'PY'
          import json
          d=json.load(open('evidence/collatz-zero-exposure-carry-tournament-20260930/result.json'))
          assert d['global_collatz']=='UNKNOWN'
          print('VERDICT',d['verdict'])
          for k in ('train','heldout','union'):
              z=d[k]
              print(k.upper(),'ROWS',z['rows'],'LEX',z['lex'][:10])
              print(k.upper(),'SCALAR_STRICT',
                    {n:v for n,v in z['scalar'].items() if v['strict_down'] or v['strict_up']})
          print('CERT',d['certificate_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-zero-exposure-carry-tournament-20260930
          path: evidence/collatz-zero-exposure-carry-tournament-20260930
          if-no-files-found: error
