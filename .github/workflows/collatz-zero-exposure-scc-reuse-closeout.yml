name: Collatz Zero-Exposure SCC Reuse Closeout
on:
  push:
    branches: [collatz-zero-exposure-scc-separator-20260930]
    paths:
      - '.github/workflows/collatz-zero-exposure-scc-reuse-closeout.yml'
permissions: {contents: read}
jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Requalify historical SCC compatibility and cycle kill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/collatz-zero-exposure-scc-reuse-closeout
          PYTHONPATH=experiments python experiments/collatz_recharge_scc_compatibility_v0.py             | tee evidence/collatz-zero-exposure-scc-reuse-closeout/compatibility.json
          PYTHONPATH=experiments python experiments/collatz_recharge_scc_composition_v0.py             | tee evidence/collatz-zero-exposure-scc-reuse-closeout/composition.json
          PYTHONPATH=experiments python experiments/collatz_recharge_scc_defect_kill_v0.py             | tee evidence/collatz-zero-exposure-scc-reuse-closeout/defect-kill.json
          python - <<'PY'
          import json
          base='evidence/collatz-zero-exposure-scc-reuse-closeout/'
          c=json.load(open(base+'compatibility.json'))
          x=json.load(open(base+'composition.json'))
          d=json.load(open(base+'defect-kill.json'))
          assert c['simultaneously_admissible'] is False
          assert x['verdict']=='NO_SYMBOLIC_TWO_MAP_CYCLE'
          assert x['cycle_class_count']==0
          assert d['verdict']=='SOLE_SYMBOLIC_RECHARGE_SCC_NOT_INFINITELY_REPEATABLE'
          print('ZERO_EXPOSURE_SCC_SYMBOLICALLY_KILLED')
          print('CYCLE_FIXED_POINT',x['cycle_map']['fixed_point'])
          print('GLOBAL_COLLATZ_UNKNOWN')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-zero-exposure-scc-reuse-closeout
          path: evidence/collatz-zero-exposure-scc-reuse-closeout
          if-no-files-found: error
