name: Collatz deterministic zero-tail closure

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-zero-tail-complete.yml"
      - "experiments/collatz_zero_tail_complete_closure.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-zero-tail-complete
  cancel-in-progress: true

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { k: 12, h: 512 }
          - { k: 16, h: 512 }
          - { k: 20, h: 512 }
          - { k: 24, h: 512 }
    name: zero-tail-b${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -march=native -std=c++20 experiments/collatz_zero_tail_complete_closure.cpp -o /tmp/ztail
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/ztail ${{ matrix.k }} ${{ matrix.h }} | tee results/census.txt
          grep -q "VERIFIED_ZERO_TAIL_CLOSURE_CENSUS" results/census.txt
      - name: Record
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          K=int("${{ matrix.k }}");H=int("${{ matrix.h }}")
          s=Path("results/census.txt").read_text()
          m=re.search(
            rf"ZERO_TAIL_RESULT K={K} H={H} residual=(\d+) closed=(\d+) "
            r"unresolved=(\d+) max_extra_steps=(-?\d+) max_witness_b=(\d+) "
            r"boundary_d_below_at_close=(\d+) reverse_family_close=(\d+) "
            r"search_nodes=(\d+) memo_hits=(\d+) e_cases=(\d+) "
            r"o_run_cases=(\d+) prunes=(\d+) max_nodes_family=(\d+)",s)
          assert m,s[-8000:]
          vals=list(map(int,m.groups()))
          keys=["residual","closed","unresolved","max_extra_steps","max_witness_b",
                "boundary_d_below","reverse_family_close","nodes","memo","e_cases",
                "o_runs","prunes","max_nodes_family"]
          out={"kind":"zero_tail_complete_closure","K":K,"H":H,**dict(zip(keys,vals))}
          Path("results/summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print("ZERO_TAIL_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-tail-b${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: tail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zero-tail-b*
          path: gathered
      - name: Aggregate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("zero-tail-b*"):
            p=d/"summary.json";assert p.exists(),d
            rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda x:x["K"])
          assert [r["K"] for r in rows]==[12,16,20,24]
          print("ZERO_TAIL_CURVE",json.dumps(rows,separators=(",",":")))
          if all(r["unresolved"]==0 for r in rows):
            print("ZERO_TAIL_CLOSED_THROUGH_B24")
          else:
            print("ZERO_TAIL_RESIDUAL_PERSISTS")
          print("VERIFIED_ZERO_TAIL_CURVE")
          PY
