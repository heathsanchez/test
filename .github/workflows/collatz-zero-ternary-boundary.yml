name: Collatz zero-ternary boundary closure

on:
  push:
    branches: [collatz-global-residual-closure-v1]
    paths:
      - ".github/workflows/collatz-zero-ternary-boundary.yml"
      - "experiments/collatz_zero_ternary_boundary.cpp"
  workflow_dispatch:

concurrency:
  group: collatz-zero-ternary-boundary
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { k: 12, r: 12 }
          - { k: 16, r: 16 }
          - { k: 20, r: 20 }
          - { k: 24, r: 24 }
    name: zero-ternary-b${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -O3 -march=native -std=c++20 experiments/collatz_zero_ternary_boundary.cpp -o /tmp/zt
          /usr/bin/time -f '%e %M' -o results/time-memory.txt             /tmp/zt ${{ matrix.k }} ${{ matrix.r }} | tee results/census.txt
          grep -q "VERIFIED_ZERO_TERNARY_BOUNDARY_SCOUT" results/census.txt
      - name: Record
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          K=int("${{ matrix.k }}");R=int("${{ matrix.r }}")
          s=Path("results/census.txt").read_text()
          m=re.search(
            rf"ZERO_TERNARY_RESULT K={K} R={R} residual=(\d+) closed=(\d+) "
            r"unresolved=(\d+) max_required_r=(-?\d+) search_nodes=(\d+) "
            r"memo_hits=(\d+) e_cases=(\d+) o_run_cases=(\d+) "
            r"coefficient_prunes=(\d+) max_nodes_family=(\d+)",s)
          assert m,s[-8000:]
          vals=list(map(int,m.groups()))
          keys=["residual","closed","unresolved","max_required_r","nodes",
                "memo","e_cases","o_runs","prunes","max_nodes_family"]
          out={"kind":"zero_ternary_boundary","K":K,"R":R,**dict(zip(keys,vals))}
          Path("results/summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print("ZERO_TERNARY_FIELD",json.dumps(out,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-ternary-b${{ matrix.k }}
          path: results
          retention-days: 30

  aggregate:
    needs: scout
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zero-ternary-b*
          path: gathered
      - name: Aggregate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in Path("gathered").glob("zero-ternary-b*"):
            p=d/"summary.json";assert p.exists(),d
            rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda x:x["K"])
          assert [r["K"] for r in rows]==[12,16,20,24]
          print("ZERO_TERNARY_BOUNDARY_CURVE",json.dumps(rows,separators=(",",":")))
          if all(r["unresolved"]==0 for r in rows):
            print("ZERO_TERNARY_BOUNDARY_CLOSED_THROUGH_B24")
          else:
            print("ZERO_TERNARY_BOUNDARY_RESIDUAL_PERSISTS")
          print("VERIFIED_ZERO_TERNARY_BOUNDARY_CURVE")
          PY
