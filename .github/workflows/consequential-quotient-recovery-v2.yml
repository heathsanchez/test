name: Consequential Quotient Recovery V2

on:
  push:
    branches: [consequential-quotient-recovery-v2]
    paths:
      - "experiments/consequential_quotient_recovery_v2/**"
      - ".github/workflows/consequential-quotient-recovery-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msi_authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        name: Checkout experiment
      - uses: actions/checkout@v4
        name: Checkout frozen MSI
        with:
          repository: heathsanchez/Minimal-Sufficient-Interface
          ref: 5d448c0ecc82ff3945d009963064ebbb67d2f308
          path: vendor/MSI
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Recheck MSI behavioural congruence and blind separator recovery
        working-directory: vendor/MSI
        run: |
          set -euo pipefail
          lean lean/BehaviouralCongruence.lean
          python -m unittest             tests.test_counterexample_composition_discovery.CounterexampleCompositionDiscovery.test_system_is_not_given_composite_separator_identity

  vdn_authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        name: Checkout frozen MathGraph
        with:
          repository: metalogiclabs/mathgraph
          ref: e80fed62b6e58d2f4b62e2ceb012646c60dd1e28
          path: vendor/MathGraph
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Recheck future-sufficiency universal property
        working-directory: vendor/MathGraph/verified-developmental-navigation/lean
        run: |
          set -euo pipefail
          lake build

  veritile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Checkout experiment
      - uses: actions/checkout@v4
        name: Checkout frozen VeriTile
        with:
          repository: Lizn-zn/VeriTile
          ref: 95a01f598e2cd1cac4052e5e5ff9145c658e18db
          path: vendor/VeriTile
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build minimal frozen VeriTile surface
        working-directory: vendor/VeriTile
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake build VeriTile.Triton.Math.Softmax
      - name: Compile maximality recovery
        run: |
          set -euo pipefail
          cp experiments/veritile_gauge_transfer_v2/MathGraphGaugeCapability.lean             vendor/VeriTile/VeriTile/MathGraphGaugeCapability.lean
          cp experiments/normalization_gauge_quotient_v4/MathGraphNormalizationQuotient.lean             vendor/VeriTile/VeriTile/MathGraphNormalizationQuotient.lean
          cp experiments/consequential_quotient_recovery_v2/MathGraphObservationKernel.lean             vendor/VeriTile/VeriTile/MathGraphObservationKernel.lean
          cp experiments/consequential_quotient_recovery_v2/VeriTileRecovery.lean             vendor/VeriTile/VeriTile/MathGraphVeriTileRecovery.lean
          cd vendor/VeriTile
          mkdir -p .lake/build/lib/lean/VeriTile
          lake env lean -o .lake/build/lib/lean/VeriTile/MathGraphGaugeCapability.olean             VeriTile/MathGraphGaugeCapability.lean
          lake env lean -o .lake/build/lib/lean/VeriTile/MathGraphNormalizationQuotient.olean             VeriTile/MathGraphNormalizationQuotient.lean
          lake env lean -o .lake/build/lib/lean/VeriTile/MathGraphObservationKernel.olean             VeriTile/MathGraphObservationKernel.lean
          lake env lean VeriTile/MathGraphVeriTileRecovery.lean

  qlf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Checkout experiment
      - uses: actions/checkout@v4
        name: Checkout frozen QLF
        with:
          repository: rchain-community/quantum-logical-framework
          ref: 888a4303846000ace1c7ef4c62a8d3e99110d979
          path: vendor/QLF
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build QLF StateSpace
        working-directory: vendor/QLF
        run: |
          set -euo pipefail
          lake exe cache get
          lake build QLF_StateSpace
      - name: Compile maximality recovery
        run: |
          set -euo pipefail
          cp experiments/consequential_quotient_cross_domain_v1/MathGraphConsequentialQuotient.lean             vendor/QLF/lean/MathGraphConsequentialQuotient.lean
          cp experiments/consequential_quotient_cross_domain_v1/QLFBornAdapter.lean             vendor/QLF/lean/MathGraphQLFBornAdapter.lean
          cp experiments/consequential_quotient_recovery_v2/MathGraphObservationKernel.lean             vendor/QLF/lean/MathGraphObservationKernel.lean
          cp experiments/consequential_quotient_recovery_v2/QLFRecovery.lean             vendor/QLF/lean/MathGraphQLFRecovery.lean
          cd vendor/QLF
          lake env lean -o .lake/build/lib/lean/MathGraphConsequentialQuotient.olean             lean/MathGraphConsequentialQuotient.lean
          lake env lean -o .lake/build/lib/lean/MathGraphQLFBornAdapter.olean             lean/MathGraphQLFBornAdapter.lean
          lake env lean -o .lake/build/lib/lean/MathGraphObservationKernel.olean             lean/MathGraphObservationKernel.lean
          lake env lean lean/MathGraphQLFRecovery.lean

  pythia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Checkout experiment
      - uses: actions/checkout@v4
        name: Checkout frozen Pythia
        with:
          repository: athanor-ai/pythia
          ref: 65404339b5c6fe8004d91fdd9c0c14ceb0bf7cd3
          path: vendor/Pythia
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Pythia information ratio
        working-directory: vendor/Pythia
        run: |
          set -euo pipefail
          lake exe cache get
          lake build Pythia.Finance.Portfolio.InformationRatio
      - name: Compile maximality recovery
        run: |
          set -euo pipefail
          cp experiments/consequential_quotient_cross_domain_v1/MathGraphConsequentialQuotient.lean             vendor/Pythia/Pythia/MathGraphConsequentialQuotient.lean
          cp experiments/consequential_quotient_cross_domain_v1/PythiaAdapter.lean             vendor/Pythia/Pythia/MathGraphPythiaAdapter.lean
          cp experiments/consequential_quotient_recovery_v2/MathGraphObservationKernel.lean             vendor/Pythia/Pythia/MathGraphObservationKernel.lean
          cp experiments/consequential_quotient_recovery_v2/PythiaRecovery.lean             vendor/Pythia/Pythia/MathGraphPythiaRecovery.lean
          cd vendor/Pythia
          mkdir -p .lake/build/lib/lean/Pythia
          lake env lean -o .lake/build/lib/lean/Pythia/MathGraphConsequentialQuotient.olean             Pythia/MathGraphConsequentialQuotient.lean
          lake env lean -o .lake/build/lib/lean/Pythia/MathGraphPythiaAdapter.olean             Pythia/MathGraphPythiaAdapter.lean
          lake env lean -o .lake/build/lib/lean/Pythia/MathGraphObservationKernel.olean             Pythia/MathGraphObservationKernel.lean
          lake env lean Pythia/MathGraphPythiaRecovery.lean

  seal:
    runs-on: ubuntu-latest
    needs: [msi_authority, vdn_authority, veritile, qlf, pythia]
    steps:
      - uses: actions/checkout@v4
      - name: Emit recovery evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          g=Path("experiments/consequential_quotient_recovery_v2/MathGraphObservationKernel.lean")
          ev={
            "schema":"metalogic.consequential-quotient-recovery.v2",
            "epistemic_state":"CANDIDATE",
            "ros_lineage":{
              "msi_revision":"5d448c0ecc82ff3945d009963064ebbb67d2f308",
              "mathgraph_vdn_revision":"e80fed62b6e58d2f4b62e2ceb012646c60dd1e28",
              "msi_authority":"greatest observation-compatible behavioural congruence + finite separator recovery",
              "vdn_authority":"FutureEq greatest future-sufficient relation + separator forces split"
            },
            "generic_observation_kernel_sha256":hashlib.sha256(g.read_bytes()).hexdigest(),
            "results":[
              {"domain":"VeriTile valid ratio states","relation":"GaugeEq","maximal_safe_relation":"PASS"},
              {"domain":"QLF nonzero-total weight states","relation":"WeightGaugeEq","maximal_safe_relation":"PASS"},
              {"domain":"Pythia positive-tracking-error states","relation":"PositiveScaleEq","maximal_safe_relation":"PASS"}
            ],
            "closed_residual":"minimum quotient optimality on these three admissible instances",
            "remaining_boundary":{
              "finite_relation_recovery":"WARRANTED by pinned MSI authority",
              "dynamic_future_recovery":"WARRANTED by pinned MSI/VDN authority",
              "open_ended_symbolic_relation_synthesis":"UNKNOWN"
            }
          }
          Path("evidence/consequential-quotient-recovery-v2.json").write_text(json.dumps(ev,indent=2,sort_keys=True)+"\n")
          print(json.dumps(ev,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: consequential-quotient-recovery-v2
          path: evidence/consequential-quotient-recovery-v2.json
          if-no-files-found: error
