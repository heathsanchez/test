name: Controller Replay V1

on:
  push:
    paths:
      - 'experiments/controller_replay_v1/**'
      - '.github/workflows/controller-replay-v1.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen replay
        run: python experiments/controller_replay_v1/run.py
