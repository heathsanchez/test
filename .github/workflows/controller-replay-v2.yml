name: Controller Replay V2

on:
  push:
    paths:
      - 'experiments/controller_replay_v2/**'
      - '.github/workflows/controller-replay-v2.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V2 replay
        run: python experiments/controller_replay_v2/replay.py
