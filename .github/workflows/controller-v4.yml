name: Research Controller V4

on:
  push:
    paths:
      - 'experiments/controller_v4/**'
      - '.github/workflows/controller-v4.yml'
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V4 controller invariants
        run: python experiments/controller_v4/test_controller.py
