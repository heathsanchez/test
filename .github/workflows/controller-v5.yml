name: Research Controller V5

on:
  push:
    paths:
      - 'experiments/controller_v5/**'
      - '.github/workflows/controller-v5.yml'
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V5 controller invariants
        run: python experiments/controller_v5/test_controller.py
