name: Research Controller V6

on:
  push:
    paths:
      - 'experiments/controller_v6/**'
      - '.github/workflows/controller-v6.yml'
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V6 controller invariants
        run: python experiments/controller_v6/test_controller.py
