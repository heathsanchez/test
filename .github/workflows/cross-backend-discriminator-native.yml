name: Cross-implementation discriminator — OPA and gojq original native witnesses
on:
  push:
    branches:
      - mathgraph-cross-backend-generator-20261014-v1
    paths:
      - 'research/cross_backend_discriminator/**'
      - '.github/workflows/cross-backend-discriminator-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: open-policy-agent/opa
          ref: d231b0381efd880597db736efdd74e6681000b54
          path: source/opa/head
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: itchyny/gojq
          ref: 50778c1da45c3f36fb08dab4ba06020115e542e4
          path: source/gojq/head
          fetch-depth: 3
          persist-credentials: false
      - name: Freeze exact original sources; make local base worktrees only
        run: |
          set -euo pipefail
          git -C source/opa/head worktree add --detach ../base 37030a09d6088821a473f486fd75dd81ef394b74
          git -C source/gojq/head worktree add --detach ../base 86e392aeece0e75849c5c82567f1190525f4b28b
          test "$(git -C source/opa/base rev-parse HEAD)" = 37030a09d6088821a473f486fd75dd81ef394b74
          test "$(git -C source/opa/head rev-parse HEAD)" = d231b0381efd880597db736efdd74e6681000b54
          test "$(git -C source/gojq/base rev-parse HEAD)" = 86e392aeece0e75849c5c82567f1190525f4b28b
          test "$(git -C source/gojq/head rev-parse HEAD)" = 50778c1da45c3f36fb08dab4ba06020115e542e4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Qualify source-independent generator controls
        run: |
          set -euo pipefail
          python3 -m unittest -v research/cross_backend_discriminator/test_discriminator.py
          jq --version
      - name: Build original OPA topdown/Wasm binaries and original gojq CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-bin"
          (cd source/opa/base && go build -tags=opa_wasm -o "$RUNNER_TEMP/native-bin/opa-base" .)
          (cd source/opa/head && go build -tags=opa_wasm -o "$RUNNER_TEMP/native-bin/opa-head" .)
          (cd source/gojq/base && go build -o "$RUNNER_TEMP/native-bin/gojq-base" ./cmd/gojq)
          (cd source/gojq/head && go build -o "$RUNNER_TEMP/native-bin/gojq-head" ./cmd/gojq)
      - name: Execute same unchanged generator on OPA, then fresh second family gojq
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross-backend"
          python3 research/cross_backend_discriminator/discriminator.py --manifest research/cross_backend_discriminator/opa.json --bin-dir "$RUNNER_TEMP/native-bin" --out "$RUNNER_TEMP/cross-backend/opa.json"
          python3 research/cross_backend_discriminator/discriminator.py --manifest research/cross_backend_discriminator/gojq.json --bin-dir "$RUNNER_TEMP/native-bin" --out "$RUNNER_TEMP/cross-backend/gojq.json"
      - name: Mandatory source withdrawal and reference-removal negative controls
        run: |
          set -euo pipefail
          python3 research/cross_backend_discriminator/discriminator.py --manifest research/cross_backend_discriminator/gojq.json --bin-dir "$RUNNER_TEMP/native-bin" --ablate reference --out "$RUNNER_TEMP/cross-backend/gojq-ablation.json"
          python3 research/cross_backend_discriminator/discriminator.py --manifest research/cross_backend_discriminator/gojq.json --bin-dir "$RUNNER_TEMP/native-bin" --withdraw --out "$RUNNER_TEMP/cross-backend/gojq-withdrawal.json"
          python3 - "$RUNNER_TEMP/cross-backend" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1])
          a=json.loads((p/'gojq-ablation.json').read_text())
          w=json.loads((p/'gojq-withdrawal.json').read_text())
          assert a['result']=='UNKNOWN_REQUIRED_BACKEND_REMOVED'
          assert w['result']=='STALE_EVIDENCE_WITHDRAWN'
          assert a['action_authorization']==w['action_authorization']=='NONE'
          print("GENERIC_ABLATION_AND_TYPED_WITHDRAWAL_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-cross-backend-native-evidence
          path: ${{ runner.temp }}/cross-backend/
          if-no-files-found: ignore
