name: Frozen cross-backend source-native Go contrast

on:
  push:
    branches:
      - research/cross-backend-witness-heldout-20261014
    paths:
      - research/aria_scaling_trust/cross_backend_20261014/**
      - .github/workflows/cross-backend-howlframe-source-native-20261014.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-original-source:
    name: Protected source-native test contrast on Go ${{ matrix.go }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21.13', '1.23.9']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover touched Go tests, preserve untouched older tests, replay and ablate
        run: python3 research/aria_scaling_trust/cross_backend_20261014/requirement_conflict.py
      - name: Compare unchanged MathGraph Check v0 with the real native test conflict
        run: node research/aria_scaling_trust/cross_backend_20261014/check_v0_vs_native.mjs
      - name: Preserve all native source/verifier commands and the first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: howlframe-source-native-protected-conflict-${{ matrix.go }}
          path: research/aria_scaling_trust/cross_backend_20261014/native_evidence/
          if-no-files-found: warn
          retention-days: 90
