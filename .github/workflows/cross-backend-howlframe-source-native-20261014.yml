name: Frozen cross-backend source-native Go contrast

on:
  push:
    branches:
      - research/cross-backend-witness-heldout-20261014
    paths:
      - research/aria_scaling_trust/cross_backend_20261014/**
      - .github/workflows/cross-backend-howlframe-source-native-20261014.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-original-source:
    name: Original HowlFrame Go source-derived tests and causal ablation
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.9'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select original tests from exact contributor source and replay
        run: python3 research/aria_scaling_trust/cross_backend_20261014/source_native_contrast.py
      - name: Preserve all native source/verifier commands and the first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: howlframe-external-source-native-contrast
          path: research/aria_scaling_trust/cross_backend_20261014/native_evidence/
          if-no-files-found: warn
          retention-days: 90
