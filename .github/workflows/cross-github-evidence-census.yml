name: Cross-GitHub evidence census
on:
  push:
    branches:
      - research/cross-github-evidence-census-20261015
    paths:
      - tools/cross_github_evidence_census.py
      - .github/workflows/cross-github-evidence-census.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_TREES_PER_REPO: "20"
      MAX_CONTENT_FILES: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory repositories, branches and evidence
        run: python tools/cross_github_evidence_census.py
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-github-evidence-census
          path: evidence-census/
          if-no-files-found: warn
          retention-days: 30
