name: Current Arena sokonanoda Callgrind hotspot

on:
  push:
    paths:
      - '.github/workflows/current-arena-callgrind.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      SOKO_PIN: 28c03d0103e004610e4d47a4828965efb2b70af9
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Install profiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/current-callgrind
          curl --fail --location --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" \
            -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Checkout current official sokonanoda pin
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda.git current
          git -C current checkout -q "$SOKO_PIN"
          cat > current/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          git -C current rev-parse HEAD > results/current-callgrind/sokonanoda-pin.txt

      - name: Build current checker with symbols
        run: |
          set -euo pipefail
          (cd current && RUSTFLAGS='-C debuginfo=1 -C target-cpu=x86-64' cargo build --release)
          test -x current/target/release/sokonanoda

      - name: Frozen semantic replay
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          good=sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          bad=sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          gp=br=0
          for p in good:
              with p.open('rb') as f:
                  r=subprocess.run(['current/target/release/sokonanoda','current/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              gp+=r.returncode==0
          for p in bad:
              with p.open('rb') as f:
                  r=subprocess.run(['current/target/release/sokonanoda','current/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              br+=r.returncode!=0
          out={'good_pass':gp,'good_total':len(good),'bad_reject':br,'bad_total':len(bad)}
          pathlib.Path('results/current-callgrind/semantics.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if gp!=len(good) or br!=len(bad): raise SystemExit('semantic failure')
          PY

      - name: Profile current dominant frozen case
        run: |
          set -euo pipefail
          CASE=$(find arena-tests/good -type f -name '*grind-ring-5*.ndjson' | head -1)
          test -n "$CASE"
          echo "$CASE" > results/current-callgrind/case.txt
          valgrind --tool=callgrind --collect-jumps=yes \
            --callgrind-out-file=results/current-callgrind/callgrind.out \
            current/target/release/sokonanoda current/config.json \
            < "$CASE" >/dev/null 2>results/current-callgrind/valgrind.stderr
          callgrind_annotate --inclusive=no --threshold=0.01 results/current-callgrind/callgrind.out \
            > results/current-callgrind/self.txt
          callgrind_annotate --inclusive=yes --threshold=0.01 results/current-callgrind/callgrind.out \
            > results/current-callgrind/inclusive.txt
          head -220 results/current-callgrind/self.txt > results/current-callgrind/top-self.txt
          head -220 results/current-callgrind/inclusive.txt > results/current-callgrind/top-inclusive.txt
          grep -E 'prune_env|key_env|eval|unify|force|infer|quote|iota|apply|spine|intern_frame|canonical|hash|lookup|FxHash|HashTable|whnf|conv|reduce|rec' \
            results/current-callgrind/self.txt | head -220 > results/current-callgrind/hot-matches.txt || true
          cat results/current-callgrind/top-self.txt

      - name: Upload current profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-arena-sokonanoda-callgrind
          path: results/current-callgrind/
