name: Developmental Checker Lineage V10

on:
  pull_request:
    branches: [agent/developmental-checker-repair-v9]
    paths:
      - '.github/workflows/developmental-checker-lineage-v10.yml'
      - 'scripts/patch_v10_lineage.py'
      - 'scripts/run_developmental_checker_span_v8.py'
      - 'scripts/patch_v8a_runner.py'
      - 'scripts/patch_v9_runner.py'
      - 'scripts/patch_developmental_checker_trace.py'
  workflow_dispatch:

jobs:
  propagated-lineage-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/developmental-checker-lineage-v10
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct baseline and trace checker
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/metalogiclabs/mathgraph-lean-kernel.git base
          cp -a base trace
          python3 scripts/patch_developmental_checker_trace.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1}' > base/config.json
          cp base/config.json trace/config.json
          git -C base rev-parse HEAD | tee results/developmental-checker-lineage-v10/kernel_commit.txt
      - name: Build baseline checker
        shell: bash
        run: |
          set -euo pipefail
          (cd base && RUSTFLAGS='-C target-cpu=native' cargo build --release)
      - name: Run propagated value-lineage separator
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/run_developmental_checker_span_v8.py scripts/run_developmental_checker_span_v10.py
          python3 scripts/patch_v8a_runner.py
          cp scripts/run_developmental_checker_span_v8.py scripts/run_developmental_checker_span_v9.py
          python3 scripts/patch_v9_runner.py
          cp scripts/run_developmental_checker_span_v9.py scripts/run_developmental_checker_span_v10.py
          python3 scripts/patch_v10_lineage.py
          python3 scripts/run_developmental_checker_span_v10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developmental-checker-lineage-v10
          path: results/developmental-checker-lineage-v10/
