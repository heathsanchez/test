name: Developmental Checker Live V1

on:
  workflow_dispatch:
  push:
    branches: [agent/developmental-checker-live-v1]
    paths:
      - '.github/workflows/developmental-checker-live-v1.yml'
      - 'scripts/patch_developmental_checker_trace.py'
      - 'scripts/run_developmental_checker_trace.py'

jobs:
  live-trace-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen Arena corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/developmental-checker-live-v1
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct binary and trace arms
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/metalogiclabs/mathgraph-lean-kernel.git baseline
          cp -a baseline trace
          python3 scripts/patch_developmental_checker_trace.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1}' > baseline/config.json
          cp baseline/config.json trace/config.json
          git -C baseline rev-parse HEAD | tee results/developmental-checker-live-v1/kernel_commit.txt

      - name: Build both checker arms
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          (cd trace && RUSTFLAGS='-C target-cpu=native' cargo build --release)

      - name: Run semantic identity and live trace gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_developmental_checker_trace.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developmental-checker-live-v1
          path: results/developmental-checker-live-v1/
