name: Developmental controller pilot v2 semantic JOIN

on:
  push:
    branches:
      - developmental-controller-pilot-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  semantic-join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install baseline dependencies
        run: python -m pip install -q scikit-learn
      - name: Run semantic JOIN microbenchmark
        run: python experiments/developmental_controller_pilot_v2_semantic_join.py
      - uses: actions/upload-artifact@v4
        with:
          name: developmental-controller-pilot-v2-semantic-join
          path: developmental_controller_pilot_v2_result.json
