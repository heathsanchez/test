name: Developmental Controller Pilot v2b Semantic JOIN
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/developmental_controller_pilot_v2b_blind_join_freeze.py'
      - 'experiments/developmental_controller_pilot_v2b_semantic_join_eval.py'
      - '.github/workflows/developmental-controller-pilot-v2b-semantic-join.yml'
  workflow_dispatch:
jobs:
  semantic-join-v2b:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install scikit-learn
      - name: Run sealed semantic JOIN evaluation
        working-directory: experiments
        run: python developmental_controller_pilot_v2b_semantic_join_eval.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developmental-controller-pilot-v2b-result
          path: experiments/developmental_controller_pilot_v2b_result.json
