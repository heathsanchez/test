name: Developmental controller pilot v7 dense sealed stage1

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  packet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate dense sealed packet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python experiments/developmental_controller_pilot_v7_dense_sealed_stage1.py
      - uses: actions/upload-artifact@v4
        with:
          name: developmental-controller-v7-dense-sealed-packet
          path: v7_dense_sealed_packet.json
