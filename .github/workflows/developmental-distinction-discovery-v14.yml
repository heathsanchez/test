name: Developmental Distinction Discovery V14

on:
  push:
    branches: [agent/developmental-distinction-discovery-v14]
    paths:
      - '.github/workflows/developmental-distinction-discovery-v14.yml'
      - 'scripts/run_developmental_distinction_discovery_v14.py'
      - 'scripts/patch_v14_structured_panic.py'
      - 'scripts/patch_developmental_checker_trace.py'
  pull_request:
    branches: [agent/developmental-checker-common-boundary-v4b]
    paths:
      - '.github/workflows/developmental-distinction-discovery-v14.yml'
      - 'scripts/run_developmental_distinction_discovery_v14.py'
      - 'scripts/patch_v14_structured_panic.py'
      - 'scripts/patch_developmental_checker_trace.py'
  workflow_dispatch:

jobs:
  discover-minimal-distinction:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/developmental-distinction-discovery-v14
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct baseline and trace checker
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/metalogiclabs/mathgraph-lean-kernel.git base
          cp -a base trace
          python3 scripts/patch_developmental_checker_trace.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1}' > base/config.json
          cp base/config.json trace/config.json
          git -C base rev-parse HEAD | tee results/developmental-distinction-discovery-v14/kernel_commit.txt
      - name: Build baseline and trace checker
        shell: bash
        run: |
          set -euo pipefail
          (cd base && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          (cd trace && RUSTFLAGS='-C target-cpu=native' cargo build --release)
      - name: Run split-then-quotient self-discovery game
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_v14_structured_panic.py
          python3 scripts/run_developmental_distinction_discovery_v14.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developmental-distinction-discovery-v14
          path: results/developmental-distinction-discovery-v14/
