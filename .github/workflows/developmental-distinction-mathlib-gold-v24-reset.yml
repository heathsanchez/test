name: Developmental Distinction Mathlib Gold V24 Reset

on:
  push:
    branches: [agent/developmental-distinction-mathlib-gold-v24-reset]
  pull_request:
    branches: [agent/developmental-distinction-external-gold-v23]
  workflow_dispatch:

jobs:
  mathlib-module-gold-reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Freeze V24 protocol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/developmental-distinction-mathlib-gold-v24-reset
          cat > results/developmental-distinction-mathlib-gold-v24-reset/predeclared_modules.txt <<'EOF'
          Mathlib.Data.List.Basic
          Mathlib.Data.Nat.Basic
          Mathlib.Data.Fin.Basic
          Mathlib.Data.Option.Basic
          Mathlib.Data.Sum.Basic
          Mathlib.Data.Vector.Basic
          Mathlib.Algebra.Group.Basic
          Mathlib.Algebra.Ring.Basic
          Mathlib.Algebra.Order.Ring.Basic
          Mathlib.Order.Basic
          Mathlib.Order.Lattice
          Mathlib.Logic.Basic
          Mathlib.SetTheory.Cardinal.Basic
          Mathlib.Data.Multiset.Basic
          Mathlib.Data.Fintype.Basic
          Mathlib.Tactic
          EOF
          sha256sum results/developmental-distinction-mathlib-gold-v24-reset/predeclared_modules.txt | tee results/developmental-distinction-mathlib-gold-v24-reset/module_manifest_sha256.txt
          cat > results/developmental-distinction-mathlib-gold-v24-reset/protocol.json <<'EOF'
          {
            "arena_commit": "ac93af578a3152dc973f3871885f580a39841f7a",
            "mathlib_ref": "v4.29.1",
            "mathlib_commit": "5e932f97dd25535344f80f9dd8da3aab83df0fe6",
            "frozen_feature": "final_depth_step",
            "frozen_rule": {"NONE":"INFER_APP","U":"PROJECTION","F":"IOTA"},
            "gold_per_family": 5,
            "selection": "source path plus family eligibility only; feature inspected only after selected paths are frozen"
          }
          EOF
          sha256sum results/developmental-distinction-mathlib-gold-v24-reset/protocol.json | tee results/developmental-distinction-mathlib-gold-v24-reset/protocol_sha256.txt

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Export frozen Mathlib modules once
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena.git arena-src
          git -C arena-src checkout ac93af578a3152dc973f3871885f580a39841f7a
          git clone --branch v4.29.1 https://github.com/leanprover-community/mathlib4.git arena-src/_v24_mathlib
          git -C arena-src/_v24_mathlib checkout 5e932f97dd25535344f80f9dd8da3aab83df0fe6
          git -C arena-src/_v24_mathlib rev-parse HEAD | tee results/developmental-distinction-mathlib-gold-v24-reset/mathlib_commit.txt
          cp results/developmental-distinction-mathlib-gold-v24-reset/predeclared_modules.txt arena-src/v24_modules.txt
          mkdir -p arena-tests/good
          (
            cd arena-src
            nix develop -c python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          import lka

          root = Path.cwd()
          work = root / '_v24_mathlib'
          out = root.parent / 'arena-tests' / 'good'
          out.mkdir(parents=True, exist_ok=True)
          modules = [x.strip() for x in (root / 'v24_modules.txt').read_text().splitlines() if x.strip()]
          toolchain = lka.get_lean_toolchain(work)
          if not toolchain:
              raise SystemExit('no lean-toolchain in pinned Mathlib checkout')
          print('toolchain=', toolchain, flush=True)
          exporter = lka.setup_lean4export(toolchain)
          if exporter is None:
              raise SystemExit('lean4export setup failed')
          records=[]
          for i,module in enumerate(modules,1):
              name=f'v24_mathlib_{i:02d}'
              print(f'V24_EXPORT {i:02d}/{len(modules)} {module}', flush=True)
              r=lka.run_cmd(['lake','build',module], cwd=work, print_on_failure=True)
              if r.returncode != 0:
                  raise SystemExit(f'lake build failed: {module}')
              dest=out/f'{name}.ndjson'
              if not lka.run_lean4export(exporter,module,None,cwd=work,out_file=dest):
                  raise SystemExit(f'lean4export failed: {module}')
              records.append({'index':i,'module':module,'file':dest.name,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'bytes':dest.stat().st_size})
          (root.parent/'results/developmental-distinction-mathlib-gold-v24-reset/export_manifest.json').write_text(json.dumps(records,indent=2,sort_keys=True))
          PY
          )
          test "$(find arena-tests/good -name '*.ndjson' | wc -l)" -eq 16
          sha256sum arena-tests/good/*.ndjson > results/developmental-distinction-mathlib-gold-v24-reset/export_sha256.txt

      - name: Reconstruct frozen checker pair
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/metalogiclabs/mathgraph-lean-kernel.git base
          cp -a base trace
          python3 scripts/patch_developmental_checker_trace.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":1}' > base/config.json
          cp base/config.json trace/config.json
          git -C base rev-parse HEAD | tee results/developmental-distinction-mathlib-gold-v24-reset/kernel_commit.txt

      - name: Build frozen checker pair
        shell: bash
        run: |
          set -euo pipefail
          (cd base && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          (cd trace && RUSTFLAGS='-C target-cpu=native' cargo build --release)

      - name: Run unchanged V23 frozen evaluator on V24 corpus
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results/developmental-distinction-external-gold-v23
          python3 scripts/run_developmental_distinction_external_gold_v23_direct.py
          cp -a results/developmental-distinction-external-gold-v23 results/developmental-distinction-mathlib-gold-v24-reset/evaluator
          cat results/developmental-distinction-mathlib-gold-v24-reset/evaluator/summary.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developmental-distinction-mathlib-gold-v24-reset
          path: results/developmental-distinction-mathlib-gold-v24-reset/
