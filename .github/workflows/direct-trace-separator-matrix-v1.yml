name: Direct trace separator matrix v1

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/direct-trace-separator-matrix-v1.yml'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clone frozen corpus
        run: |
          git clone -q https://github.com/YanbiaoLab/Order5-Austin-Law-Proofs.git /tmp/austin
          cd /tmp/austin
          git checkout -q b984287a1e5283e67b3709fe1e43f7734b360342

      - name: Interpret direct Code models against all 130 laws
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/direct_matrix.py <<'PY'
          import json,re,pathlib,itertools,collections,sys
          root=pathlib.Path('/tmp/austin')
          idx=json.loads((root/'proofs/index.json').read_text())
          formulas={e['equation']:e['formula'] for e in idx['equations']}

          # Constructor tree: ('e',), ('k',x), ('p',x,y)
          E=('e',)
          def K(x): return ('k',x)
          def P(x,y): return ('p',x,y)

          tok_re=re.compile(r'[A-Za-z_][A-Za-z0-9_]*|[()]')
          def parse_prefix_terms(s, nterms=3):
              toks=tok_re.findall(s); i=0
              def term():
                  nonlocal i
                  if i>=len(toks): raise ValueError('EOF')
                  t=toks[i]; i+=1
                  if t=='(':
                      q=term()
                      if i>=len(toks) or toks[i]!=')': raise ValueError(('missing )',toks[i:i+10],s))
                      i+=1; return q
                  if t=='p': return ('p',term(),term())
                  if t=='k': return ('k',term())
                  if t=='e': return ('e',)
                  # identifiers are pattern variables
                  return ('v',t)
              out=[term() for _ in range(nterms)]
              return out,toks[i:]

          def match(pat, val, env):
              if pat[0]=='v':
                  n=pat[1]
                  if n in env: return env[n]==val
                  env[n]=val; return True
              if pat[0]!=val[0]: return False
              if pat[0]=='e': return True
              if pat[0]=='k': return match(pat[1],val[1],env)
              return match(pat[1],val[1],env) and match(pat[2],val[2],env)

          def inst(pat,env):
              if pat[0]=='v': return env[pat[1]]
              if pat[0]=='e': return E
              if pat[0]=='k': return K(inst(pat[1],env))
              return P(inst(pat[1],env),inst(pat[2],env))

          def get_code_rules(s):
              i=s.index('inductive Code')
              # direct family has constructors before def CodeCases or first theorem
              ends=[x for x in [s.find('\ndef CodeCases',i),s.find('\ntheorem code_cases',i),s.find('\ntheorem code_shape',i)] if x>=0]
              j=min(ends) if ends else s.find('\ntheorem ',i)
              block=s[i:j]
              # Constructor fragments start at | and continue to next | or block end.
              starts=[m.start() for m in re.finditer(r'(?m)^\s*\|\s*[A-Za-z_][A-Za-z0-9_]*',block)]
              rules=[]
              errors=[]
              for a,b in zip(starts,starts[1:]+[len(block)]):
                  frag=block[a:b]
                  m=re.search(r':\s*Code\s+(.+)',frag,re.S)
                  if not m: continue
                  rhs=m.group(1).strip()
                  try:
                      ts,rest=parse_prefix_terms(rhs,3)
                      # Ignore binder/type tokens before : Code; after three terms there should be no meaningful syntax.
                      bad=[x for x in rest if x not in [')']]
                      if bad: errors.append((frag.strip().replace('\n',' ')[:500],bad[:20]))
                      rules.append(tuple(ts))
                  except Exception as ex:
                      errors.append((frag.strip().replace('\n',' ')[:500],repr(ex)))
              return rules,errors,block

          # Order-5 formula parser from corpus strings.
          def parse_formula(formula):
              rhs=formula.split('=',1)[1].replace(' ','')
              i=0
              def atom():
                  nonlocal i
                  if i<len(rhs) and rhs[i] in 'xyzw':
                      x=('v',rhs[i]); i+=1; return x
                  if i<len(rhs) and rhs[i]=='(':
                      i+=1; q=expr()
                      assert rhs[i]==')',(formula,i,rhs[i:])
                      i+=1; return q
                  raise ValueError((formula,i,rhs[i:]))
              def expr():
                  nonlocal i
                  q=atom()
                  while i<len(rhs) and rhs[i]=='◇':
                      i+=1; q=('o',q,atom())
                  return q
              q=expr(); assert i==len(rhs),(formula,i,rhs[i:]); return q

          asts={n:parse_formula(f) for n,f in formulas.items()}

          def model_from_rules(rules):
              def code(a,b):
                  outs=[]
                  for pa,pb,po in rules:
                      env={}
                      if match(pa,a,env) and match(pb,b,env):
                          outs.append(inst(po,env))
                  if not outs: return None
                  if any(o!=outs[0] for o in outs[1:]):
                      raise RuntimeError(('nonfunctional ground code',a,b,outs))
                  return outs[0]
              def op(a,b):
                  o=code(a,b)
                  return P(a,b) if o is None else o
              return op,code

          def ev(ast,env,op):
              if ast[0]=='v': return env[ast[1]]
              return op(ev(ast[1],env,op),ev(ast[2],env,op))

          pool=[E,K(E),K(K(E)),K(K(K(E)))]
          rows=[]; unsupported=[]
          for e in idx['equations']:
              ip=e.get('infinite_model_proof')
              if not ip: continue
              p=root/ip['path']; s=p.read_text(errors='replace')
              if 'inductive Code' not in s: continue
              # Match audit definition of direct family.
              i=s.index('inductive Code'); j=s.find('\ntheorem ',i)
              pre=s[i:j if j>=0 else i+8000]
              if 'inductive Step' in pre or re.search(r'\bStep\b',pre):
                  continue
              rules,errs,block=get_code_rules(s)
              if errs or not rules:
                  unsupported.append({'equation':e['equation'],'errors':errs,'rule_count':len(rules),'block':block[:2000]})
                  continue
              op,code=model_from_rules(rules)
              source=e['equation']; source_ast=asts[source]
              vars_=sorted(set(re.findall(r'[xyzw]',e['formula'])), key='xyzw'.index)
              # Validate source on a nontrivial finite probe grid; a failure means semantics extraction is wrong.
              src_bad=None
              for xs in itertools.product(pool,repeat=len(vars_)):
                  env=dict(zip(vars_,xs))
                  if env['x']!=ev(source_ast,env,op):
                      src_bad={v:pool.index(env[v]) for v in vars_}; break
              if src_bad is not None:
                  unsupported.append({'equation':source,'errors':['source_probe_failed',src_bad],'rules':rules})
                  continue

              refs=[]; survivors=[]
              witnesses={}
              for t in idx['equations']:
                  n=t['equation']; ast=asts[n]
                  vs=sorted(set(re.findall(r'[xyzw]',t['formula'])), key='xyzw'.index)
                  w=None
                  for xs in itertools.product(pool,repeat=len(vs)):
                      env=dict(zip(vs,xs))
                      if env['x']!=ev(ast,env,op):
                          w={v:pool.index(env[v]) for v in vs}; break
                  if w is None: survivors.append(n)
                  else: refs.append(n); witnesses[n]=w
              rows.append({
                  'source':source,
                  'rule_count':len(rules),
                  'refuted_count':len(refs),
                  'survivors':survivors,
                  'refuted':refs,
                  'witnesses':witnesses,
              })
              print('ROW',source,'rules',len(rules),'refuted',len(refs),'survivors',','.join(survivors))

          out={
            'corpus_commit':'b984287a1e5283e67b3709fe1e43f7734b360342',
            'probe_pool':['e','k(e)','k(k(e))','k(k(k(e)))'],
            'rows':rows,
            'unsupported':unsupported,
          }
          pathlib.Path('/tmp/direct_matrix.json').write_text(json.dumps(out,indent=2))
          print('SUPPORTED_ROWS',len(rows))
          print('UNSUPPORTED',len(unsupported))
          print('SOURCE_ONLY_ROWS',sum(r['survivors']==[r['source']] for r in rows))
          print('REFUTATION_TOTAL',sum(r['refuted_count'] for r in rows))
          if unsupported:
              for u in unsupported: print('UNSUPPORTED_ROW',u['equation'],str(u['errors'])[:800])
          PY
          python3 /tmp/direct_matrix.py | tee /tmp/direct_matrix.log

      - uses: actions/upload-artifact@v4
        with:
          name: direct-trace-separator-matrix-v1
          path: |
            /tmp/direct_matrix.json
            /tmp/direct_matrix.log
