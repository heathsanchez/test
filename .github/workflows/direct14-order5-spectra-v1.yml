name: Direct-14 complete order-5 spectra v1

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/direct14-order5-spectra-v1.yml'
  workflow_dispatch:

jobs:
  spectra:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Freeze sources
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/teorth/equational_theories.git /tmp/etp
          cd /tmp/etp
          git checkout -q bb5a9b5fe78c376ce1725529f235f8d574630b9f
          sed 's/^EQ_SIZE = 4$/EQ_SIZE = 5/' scripts/generate_eqs_list.py > /tmp/generate5.py
          python3 /tmp/generate5.py > /tmp/order5_all.txt 2>/tmp/generate.log
          test "$(wc -l < /tmp/order5_all.txt)" -eq 62576
          git clone -q https://github.com/YanbiaoLab/Order5-Austin-Law-Proofs.git /tmp/austin
          cd /tmp/austin
          git checkout -q b984287a1e5283e67b3709fe1e43f7734b360342

      - name: Compute exact finite-universe spectra
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/d14
          cat > /tmp/d14/run.py <<'PY'
          import json,re,pathlib,itertools,time
          root=pathlib.Path('/tmp/austin')
          idx=json.loads((root/'proofs/index.json').read_text())
          index_by_id={int(e['equation'].replace('Equation','')):e for e in idx['equations']}
          lines=pathlib.Path('/tmp/order5_all.txt').read_text().splitlines()

          E=('e',)
          def K(x):return ('k',x)
          def P(x,y):return ('p',x,y)
          tok_re=re.compile(r'[A-Za-z_][A-Za-z0-9_]*|[()]')
          def parse_prefix(s,n=3):
              toks=tok_re.findall(s);i=0
              def term():
                  nonlocal i
                  if i>=len(toks):raise ValueError('EOF')
                  t=toks[i];i+=1
                  if t=='(':
                      q=term();assert toks[i]==')';i+=1;return q
                  if t=='p':return ('p',term(),term())
                  if t=='k':return ('k',term())
                  if t=='e':return E
                  if t in {'q','r'}:raise ValueError(('unsupported',t))
                  return ('v',t)
              out=[term() for _ in range(n)]
              return out,toks[i:]
          def match(p,v,e):
              if p[0]=='v':
                  if p[1] in e:return e[p[1]]==v
                  e[p[1]]=v;return True
              if p[0]!=v[0]:return False
              if p[0]=='e':return True
              if p[0]=='k':return match(p[1],v[1],e)
              return match(p[1],v[1],e) and match(p[2],v[2],e)
          def inst(p,e):
              if p[0]=='v':return e[p[1]]
              if p[0]=='e':return E
              if p[0]=='k':return K(inst(p[1],e))
              return P(inst(p[1],e),inst(p[2],e))
          def rules_from(s):
              i=s.index('inductive Code')
              ends=[x for x in [s.find('\ndef CodeCases',i),s.find('\ntheorem code_cases',i),s.find('\ntheorem code_shape',i)] if x>=0]
              j=min(ends) if ends else s.find('\ntheorem ',i)
              b=s[i:j]
              starts=[m.start() for m in re.finditer(r'(?m)^\s*\|\s*[A-Za-z_][A-Za-z0-9_]*',b)]
              rr=[]
              for a,z in zip(starts,starts[1:]+[len(b)]):
                  f=b[a:z];m=re.search(r':\s*Code\s+(.+)',f,re.S)
                  if not m:continue
                  q,rest=parse_prefix(m.group(1).strip(),3)
                  if rest:raise ValueError(('rest',rest,f[:300]))
                  rr.append(tuple(q))
              return rr
          def makeop(rr):
              def op(a,b):
                  outs=[]
                  for pa,pb,po in rr:
                      e={}
                      if match(pa,a,e) and match(pb,b,e):outs.append(inst(po,e))
                  if not outs:return P(a,b)
                  assert all(x==outs[0] for x in outs),('nonfunctional',a,b,outs)
                  return outs[0]
              return op

          # Generic equation AST uses ('v',name), ('o',l,r).
          def pterm(s):
              s=s.replace(' ','');i=0
              def atom():
                  nonlocal i
                  if i<len(s) and s[i].isalpha():
                      j=i+1
                      while j<len(s) and s[j].isalnum():j+=1
                      q=('v',s[i:j]);i=j;return q
                  if i<len(s) and s[i]=='(':
                      i+=1;q=expr();assert s[i]==')';i+=1;return q
                  raise ValueError((s,i))
              def expr():
                  nonlocal i
                  q=atom()
                  while i<len(s) and s[i]=='◇':
                      i+=1;q=('o',q,atom())
                  return q
              q=expr();assert i==len(s);return q
          def peq(s):
              a,b=s.split('=',1);return pterm(a),pterm(b)
          universe=[peq(s) for s in lines]
          def vars_of(t):
              if t[0]=='v':return {t[1]}
              return vars_of(t[1])|vars_of(t[2])
          def ev(t,e,op):
              return e[t[1]] if t[0]=='v' else op(ev(t[1],e,op),ev(t[2],e,op))

          # Canonicalize up to variable renaming and side exchange.
          def ser(t,m,nextid):
              if t[0]=='v':
                  n=t[1]
                  if n not in m:m[n]=len(m)
                  return ('v',m[n])
              return ('o',ser(t[1],m,nextid),ser(t[2],m,nextid))
          def canon(eq):
              a,b=eq
              out=[]
              for x,y in [(a,b),(b,a)]:
                  m={}
                  out.append((ser(x,m,0),ser(y,m,0)))
              return min(out,key=repr)
          cmap={}
          for n,e in enumerate(universe,1):
              c=canon(e)
              if c in cmap:raise SystemExit(f'CANON_COLLISION {n} {cmap[c]}')
              cmap[c]=n
          print('CANON_MAP_PASS',len(cmap))

          def subst(t,m):
              if t[0]=='v':return ('v',m[t[1]])
              return ('o',subst(t[1],m),subst(t[2],m))
          def variable_minors(eq):
              vs=sorted(vars_of(eq[0])|vars_of(eq[1]))
              labels=['x','y','z','w','u','v'][:len(vs)]
              ids=set()
              for choices in itertools.product(labels,repeat=len(vs)):
                  m=dict(zip(vs,choices))
                  c=canon((subst(eq[0],m),subst(eq[1],m)))
                  if c in cmap:ids.add(cmap[c])
              return ids

          pool2=[E,K(E)]
          pool3=[E,K(E),K(K(E))]
          pool5=[E,K(E),K(K(E)),K(K(K(E))),K(K(K(K(E))))]
          rows=[];unsupported=[]
          for ent in idx['equations']:
              ip=ent.get('infinite_model_proof')
              if not ip:continue
              s=(root/ip['path']).read_text(errors='replace')
              if 'inductive Code' not in s:continue
              i=s.index('inductive Code');j=s.find('\ntheorem ',i);pre=s[i:j if j>=0 else i+8000]
              if 'inductive Step' in pre or re.search(r'\bStep\b',pre):continue
              try:rr=rules_from(s);op=makeop(rr)
              except Exception as ex:
                  unsupported.append((ent['equation'],repr(ex)));continue
              src=int(ent['equation'].replace('Equation',''))
              # numbering cross-check
              if src>len(universe):
                  unsupported.append((ent['equation'],'outside generated universe'));continue
              src_ast=universe[src-1]
              survivors=[];witnesses={}
              t0=time.time()
              for n,(l,r) in enumerate(universe,1):
                  vs=sorted(vars_of(l)|vars_of(r));w=None
                  for pool in (pool2,pool3):
                      for xs in itertools.product(pool,repeat=len(vs)):
                          e=dict(zip(vs,xs))
                          if ev(l,e,op)!=ev(r,e,op):
                              w={v:pool.index(e[v]) for v in vs};break
                      if w is not None:break
                  if w is None:survivors.append(n)
                  else:witnesses[str(n)]=w
              final=[]
              for n in survivors:
                  l,r=universe[n-1];vs=sorted(vars_of(l)|vars_of(r));w=None
                  for xs in itertools.product(pool5,repeat=len(vs)):
                      e=dict(zip(vs,xs))
                      if ev(l,e,op)!=ev(r,e,op):
                          w={v:pool5.index(e[v]) for v in vs};break
                  if w is None:final.append(n)
                  else:witnesses[str(n)]=w
              minors=variable_minors(src_ast)
              expected={1}|minors
              exact=set(final)==expected
              row={'source':src,'rule_count':len(rr),'refuted_count':len(universe)-len(final),
                   'survivors':final,'minor_ids':sorted(minors),'exact_minor_spectrum':exact,
                   'extra_survivors':sorted(set(final)-expected),'missing_expected':sorted(expected-set(final)),
                   'elapsed':time.time()-t0}
              rows.append(row)
              print('SOURCE',src,'REFUTED',row['refuted_count'],'SURVIVORS',final,
                    'MINORS',sorted(minors),'EXACT_MINOR_SPECTRUM',exact)
          out={'universe':62576,'rows':rows,'unsupported':unsupported}
          pathlib.Path('/tmp/d14/spectra.json').write_text(json.dumps(out,indent=2))
          print('SUPPORTED',len(rows),'UNSUPPORTED',len(unsupported))
          print('EXACT_MINOR_SPECTRA',sum(r['exact_minor_spectrum'] for r in rows),'OF',len(rows))
          for u in unsupported:print('UNSUPPORTED',u)
          PY
          python3 /tmp/d14/run.py | tee /tmp/d14/run.log
          sha256sum /tmp/d14/spectra.json | tee /tmp/d14/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: direct14-order5-spectra-v1
          path: /tmp/d14/
