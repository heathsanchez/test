name: Dispatch V40

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-v40.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch V40 on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run arena-v40-eval-case-boundaries.yml --ref main

# trigger after reconnect
