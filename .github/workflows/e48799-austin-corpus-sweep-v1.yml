name: E48799 Austin corpus separation sweep v1

on:
  push:
    branches:
      - e48799-austin-corpus-sweep-v1
    paths:
      - '.github/workflows/e48799-austin-corpus-sweep-v1.yml'
      - 'experiments/e48799_austin_corpus_sweep_v1/**'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reproduce Lean environment
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          cd /tmp/mathlib4
          git checkout 0df444a360eaa60ab8c11dca51a86af692955474
          lake exe cache get

      - name: Generate all 130 target refutations
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/e48799
          base64 -d experiments/e48799_austin_corpus_sweep_v1/model_prefix.b64 > /tmp/e48799/Sweep.lean
          echo '5e5aa33767281caeb935f73f2ba8c1cf5a2c36e453040dd6a2c3ab7e4377a843  /tmp/e48799/Sweep.lean' | sha256sum -c -
          python3 - <<'PY'
          import json, re, urllib.request
          from itertools import product
          from pathlib import Path

          INDEX = "https://raw.githubusercontent.com/YanbiaoLab/Order5-Austin-Law-Proofs/b984287a1e5283e67b3709fe1e43f7734b360342/proofs/index.json"
          idx = json.load(urllib.request.urlopen(INDEX))

          def L(n): return ("L", n)
          def R(n): return ("R", n)
          def A(p):
              if p[0] == "L": return L(p[1] + 1)
              if p[1] == 0: return L(1)
              return L(0)
          def B(p):
              if p[0] == "L":
                  return R(0) if p[1] == 0 else L(p[1] - 1)
              return R(p[1] + 1)
          def C(p):
              if p[0] == "L": return L(p[1] + 1)
              return L(0) if p[1] == 0 else R(p[1] - 1)
          def op(x,y):
              if y[0] == "L":
                  return B(x) if y[1] == 0 else x
              return C(x) if y[1] == 0 else A(x)

          def parse_formula(formula):
              s = formula.split("=",1)[1].replace(" ","")
              i = 0
              def atom():
                  nonlocal i
                  if i < len(s) and s[i] in "xyzw":
                      x = ("v", s[i]); i += 1; return x
                  if i < len(s) and s[i] == "(":
                      i += 1
                      x = expr()
                      assert s[i] == ")", (formula, i, s[i:])
                      i += 1
                      return x
                  raise ValueError((formula, i, s[i:]))
              def expr():
                  nonlocal i
                  x = atom()
                  while i < len(s) and s[i] == "◇":
                      i += 1
                      x = ("o", x, atom())
                  return x
              out = expr()
              assert i == len(s), (formula, i, s[i:])
              return out

          def ev(ast, env):
              return env[ast[1]] if ast[0] == "v" else op(ev(ast[1],env), ev(ast[2],env))

          def lit(p):
              side,n = p
              return f"(Sum.inl {n} : Sum Nat Nat)" if side == "L" else f"(Sum.inr {n} : Sum Nat Nat)"

          def lean_ast(ast, env=None):
              if ast[0] == "v":
                  return ast[1] if env is None else lit(env[ast[1]])
              return f"(op {lean_ast(ast[1],env)} {lean_ast(ast[2],env)})"

          vals = [L(0),L(1),L(2),R(0),R(1),R(2)]
          rows, generated = [], []

          for e in idx["equations"]:
              n = e["equation"].replace("Equation","")
              ast = parse_formula(e["formula"])
              vars_ = sorted(set(re.findall(r"[xyzw]",e["formula"])), key="xyzw".index)
              witness = None
              for xs in product(vals, repeat=len(vars_)):
                  env = dict(zip(vars_,xs))
                  if env["x"] != ev(ast,env):
                      witness = env.copy()
                      break
              assert witness is not None, f"unexpected survivor E{n}"
              rows.append({
                  "equation":n,
                  "dual":e["dual"].replace("Equation",""),
                  "table":e["table"],
                  "witness":{v:witness[v][0]+str(witness[v][1]) for v in vars_}
              })
              qvars = " ".join(vars_)
              target = lean_ast(ast)
              concrete = lean_ast(ast,witness)
              args = " ".join(lit(witness[v]) for v in vars_)
              lhs = lit(witness["x"])
              generated.append(f"""
          def CorpusLaw{n} : Prop :=
            ∀ {qvars} : Sum Nat Nat, x = {target}

          theorem corpus_not_{n} : ¬ CorpusLaw{n} := by
            intro h
            have hh := h {args}
            have hne : {lhs} ≠ {concrete} := by
              decide
            exact hne hh
          """)

          Path("/tmp/e48799/manifest.json").write_text(json.dumps({
              "source_model":"E48799 structural Sum Nat Nat model",
              "corpus_commit":"b984287a1e5283e67b3709fe1e43f7734b360342",
              "total":130,
              "refuted":130,
              "survivors":[],
              "rows":rows,
          },indent=2))

          with open("/tmp/e48799/Sweep.lean","a",encoding="utf-8") as f:
              f.write("\nnamespace E48799Model\nset_option maxRecDepth 100000\nset_option maxHeartbeats 20000000\n")
              f.write("\n".join(generated))
              f.write("""
          #print axioms source48799
          #print axioms corpus_not_4916
          #print axioms corpus_not_11116
          #print axioms corpus_not_28770
          #print axioms corpus_not_21866
          end E48799Model
          """)

          print("TOTAL 130")
          print("REFUTED 130")
          print("SURVIVORS []")
          PY

      - name: Lean kernel check 130 nonimplications
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/e48799/Sweep.lean /tmp/mathlib4/E48799AustinCorpusSweep.lean
          cd /tmp/mathlib4
          lake env lean E48799AustinCorpusSweep.lean | tee /tmp/e48799/lean.log
          grep -q 'E48799Model.source48799' /tmp/e48799/lean.log
          grep -q 'E48799Model.corpus_not_11116' /tmp/e48799/lean.log
          ! grep -q 'sorryAx' /tmp/e48799/lean.log
          ! grep -q '_native.native_decide' /tmp/e48799/lean.log
          echo 'PASS: E48799 model satisfies E48799 and refutes all 130 Austin corpus laws'

      - name: Publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: e48799-austin-corpus-sweep-v1
          path: |
            /tmp/e48799/manifest.json
            /tmp/e48799/Sweep.lean
            /tmp/e48799/lean.log
