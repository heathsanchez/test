name: E48799 complete order-5 consequence spectrum v1

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/e48799-order5-consequence-spectrum-v1.yml'
  workflow_dispatch:

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install elan
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Freeze enumeration and E48799 model
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/teorth/equational_theories.git /tmp/etp
          cd /tmp/etp
          git checkout -q bb5a9b5fe78c376ce1725529f235f8d574630b9f
          sed 's/^EQ_SIZE = 4$/EQ_SIZE = 5/' scripts/generate_eqs_list.py > /tmp/generate5.py
          python3 /tmp/generate5.py > /tmp/order5_all.txt 2>/tmp/generate.log
          test "$(wc -l < /tmp/order5_all.txt)" -eq 62576
          test "$(sed -n '48799p' /tmp/order5_all.txt)" = 'x ◇ y = ((x ◇ y) ◇ y) ◇ (y ◇ y)'
          curl -fsSL https://raw.githubusercontent.com/heathsanchez/test/e48799-austin-corpus-sweep-v1/experiments/e48799_austin_corpus_sweep_v1/model_prefix.b64 -o /tmp/e48799.b64
          base64 -d /tmp/e48799.b64 > /tmp/model.lean
          echo '5e5aa33767281caeb935f73f2ba8c1cf5a2c36e453040dd6a2c3ab7e4377a843  /tmp/model.lean' | sha256sum -c -

      - name: Generate shard certificates
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/e48799proof
          python3 - <<'PY'
          import os,itertools,pathlib,json
          shard=int(os.environ['SHARD'])
          lines=pathlib.Path('/tmp/order5_all.txt').read_text().splitlines()
          survivors={1,48545,48799}

          def L(n):return ('L',n)
          def R(n):return ('R',n)
          def A(p):
              if p[0]=='L':return L(p[1]+1)
              return L(1) if p[1]==0 else L(0)
          def B(p):
              if p[0]=='L':return R(0) if p[1]==0 else L(p[1]-1)
              return R(p[1]+1)
          def C(p):
              if p[0]=='L':return L(p[1]+1)
              return L(0) if p[1]==0 else R(p[1]-1)
          def op(x,y):
              if y[0]=='L':return B(x) if y[1]==0 else x
              return C(x) if y[1]==0 else A(x)

          def parse_term(s):
              s=s.replace(' ','');i=0
              def atom():
                  nonlocal i
                  if i<len(s) and s[i].isalpha():
                      j=i+1
                      while j<len(s) and s[j].isalnum():j+=1
                      q=('v',s[i:j]);i=j;return q
                  if i<len(s) and s[i]=='(':
                      i+=1;q=expr();assert s[i]==')';i+=1;return q
                  raise ValueError((s,i,s[i:i+10]))
              def expr():
                  nonlocal i
                  q=atom()
                  while i<len(s) and s[i]=='◇':
                      i+=1;q=('o',q,atom())
                  return q
              q=expr();assert i==len(s);return q
          def peq(s):
              a,b=s.split('=',1);return parse_term(a),parse_term(b)
          def vars_of(t):
              if t[0]=='v':return {t[1]}
              return vars_of(t[1])|vars_of(t[2])
          def ev(t,e):
              return e[t[1]] if t[0]=='v' else op(ev(t[1],e),ev(t[2],e))
          def lit(p):
              return f'(Sum.inl {p[1]} : Sum Nat Nat)' if p[0]=='L' else f'(Sum.inr {p[1]} : Sum Nat Nat)'
          def lean(t,e=None):
              if t[0]=='v':return t[1] if e is None else lit(e[t[1]])
              return f'(op {lean(t[1],e)} {lean(t[2],e)})'

          vals=[L(0),L(1),L(2),R(0),R(1),R(2)]
          selected=[]
          for n,s in enumerate(lines,1):
              if n in survivors or n%8!=shard:continue
              l,r=peq(s);vs=sorted(vars_of(l)|vars_of(r));w=None
              for xs in itertools.product(vals,repeat=len(vs)):
                  env=dict(zip(vs,xs))
                  if ev(l,env)!=ev(r,env):w=env.copy();break
              if w is None:raise SystemExit(f'NO_WITNESS {n} {s}')
              selected.append((n,l,r,vs,w))

          prefix=pathlib.Path('/tmp/model.lean').read_text()
          for ci in range(0,len(selected),600):
              chunk=selected[ci:ci+600]
              out=[prefix,'\nnamespace E48799Model\nset_option maxRecDepth 100000\nset_option maxHeartbeats 100000000\n']
              for n,l,r,vs,w in chunk:
                  q=' '.join(vs);args=' '.join(lit(w[v]) for v in vs)
                  out.append(f'''
          def O5_{n} : Prop := ∀ {q} : Sum Nat Nat, {lean(l)} = {lean(r)}
          theorem o5_not_{n} : ¬ O5_{n} := by
            intro h
            have hh := h {args}
            simpa [op, A, B, C] using hh
          ''')
              if chunk:
                  out.append(f'#print axioms o5_not_{chunk[0][0]}\n#print axioms o5_not_{chunk[-1][0]}\n')
              out.append('\nend E48799Model\n')
              pathlib.Path(f'/tmp/e48799proof/shard{shard}_chunk{ci//600:02}.lean').write_text(''.join(out))

          meta={'shard':shard,'count':len(selected),'survivors':sorted(survivors)}
          pathlib.Path(f'/tmp/e48799proof/shard_{shard}.json').write_text(json.dumps(meta,indent=2))
          print('SHARD',shard,'NEGATIVE_COUNT',len(selected))

          if shard==0:
              p=prefix+'''
          namespace E48799Model
          theorem entails_48545 : ∀ x : Sum Nat Nat,
              op x x = op (op (op x x) x) (op x x) := by
            intro x
            exact source48799 x x

          theorem entails_48799 : ∀ x y : Sum Nat Nat,
              op x y = op (op (op x y) y) (op y y) := by
            intro x y
            exact source48799 x y

          #print axioms entails_48545
          #print axioms entails_48799
          end E48799Model
          '''
              pathlib.Path('/tmp/e48799proof/Positive.lean').write_text(p)
          PY

      - name: Reproduce Lean environment
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none -q https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          cd /tmp/mathlib4
          git checkout -q 0df444a360eaa60ab8c11dca51a86af692955474
          lake exe cache get

      - name: Kernel check shard
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euxo pipefail
          : > /tmp/e48799proof/shard_${SHARD}.log
          cd /tmp/mathlib4
          for f in /tmp/e48799proof/shard${SHARD}_chunk*.lean; do
            lake env lean "$f" 2>&1 | tee -a /tmp/e48799proof/shard_${SHARD}.log
          done
          if [ "${SHARD}" = "0" ]; then
            lake env lean /tmp/e48799proof/Positive.lean 2>&1 | tee -a /tmp/e48799proof/shard_${SHARD}.log
          fi
          ! grep -q 'sorryAx' /tmp/e48799proof/shard_${SHARD}.log
          ! grep -q '_native.native_decide' /tmp/e48799proof/shard_${SHARD}.log
          echo "PASS_SHARD_${SHARD}" | tee /tmp/e48799proof/PASS_${SHARD}

      - uses: actions/upload-artifact@v4
        with:
          name: e48799-o5-spectrum-shard-${{ matrix.shard }}
          path: |
            /tmp/e48799proof/shard_*.json
            /tmp/e48799proof/shard_*.log
            /tmp/e48799proof/PASS_*
            /tmp/e48799proof/Positive.lean

  authority:
    needs: prove
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e48799-o5-spectrum-shard-*
          path: /tmp/all
          merge-multiple: true
      - name: Bind complete authority
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('/tmp/all')
          metas=[json.loads(p.read_text()) for p in sorted(root.glob('shard_*.json'))]
          assert len(metas)==8
          total=sum(m['count'] for m in metas)
          assert total==62573,total
          for i in range(8):assert (root/f'PASS_{i}').exists(),i
          out={
            'claim':'Complete canonical consequence spectrum of E48799 through operation order 5',
            'universe_size':62576,
            'entailed_canonical_ids':[1,48545,48799],
            'nontrivial_entailed_ids':[48545,48799],
            'kernel_checked_nonimplications':62573,
            'etp_generator_commit':'bb5a9b5fe78c376ce1725529f235f8d574630b9f',
            'source_model':'released structural E48799 Sum Nat Nat model',
          }
          (root/'AUTHORITY.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          sha256sum /tmp/all/AUTHORITY.json /tmp/all/shard_*.json /tmp/all/PASS_* | tee /tmp/all/AUTHORITY_SHA256SUMS
          echo COMPLETE_E48799_ORDER5_CONSEQUENCE_SPECTRUM_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: e48799-complete-order5-spectrum-authority-v1
          path: |
            /tmp/all/AUTHORITY.json
            /tmp/all/AUTHORITY_SHA256SUMS
