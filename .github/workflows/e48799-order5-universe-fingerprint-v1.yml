name: E48799 order-5 universe fingerprint v1

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/e48799-order5-universe-fingerprint-v1.yml'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Freeze ETP enumeration
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/teorth/equational_theories.git /tmp/etp
          cd /tmp/etp
          git checkout -q bb5a9b5fe78c376ce1725529f235f8d574630b9f
          sed 's/^EQ_SIZE = 4$/EQ_SIZE = 5/' scripts/generate_eqs_list.py > /tmp/generate5.py
          python3 /tmp/generate5.py > /tmp/order5_all.txt 2>/tmp/generate.log
          test "$(wc -l < /tmp/order5_all.txt)" -eq 62576
          echo "E48799_CANONICAL=$(sed -n '48799p' /tmp/order5_all.txt)"

      - name: Sweep exact E48799 structural model
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import itertools,json,pathlib,re

          def L(n): return ('L',n)
          def R(n): return ('R',n)
          def A(p):
              if p[0]=='L': return L(p[1]+1)
              if p[1]==0: return L(1)
              return L(0)
          def B(p):
              if p[0]=='L': return R(0) if p[1]==0 else L(p[1]-1)
              return R(p[1]+1)
          def C(p):
              if p[0]=='L': return L(p[1]+1)
              return L(0) if p[1]==0 else R(p[1]-1)
          def op(x,y):
              if y[0]=='L': return B(x) if y[1]==0 else x
              return C(x) if y[1]==0 else A(x)

          def parse_term(s):
              s=s.replace(' ','');i=0
              def atom():
                  nonlocal i
                  if i<len(s) and s[i].isalpha():
                      j=i+1
                      while j<len(s) and s[j].isalnum(): j+=1
                      q=('v',s[i:j]);i=j;return q
                  if i<len(s) and s[i]=='(':
                      i+=1;q=expr();assert s[i]==')';i+=1;return q
                  raise ValueError((s,i,s[i:i+10]))
              def expr():
                  nonlocal i
                  q=atom()
                  while i<len(s) and s[i]=='◇':
                      i+=1;q=('o',q,atom())
                  return q
              q=expr();assert i==len(s);return q
          def peq(s):
              a,b=s.split('=',1); return parse_term(a),parse_term(b)
          def vars_of(t):
              if t[0]=='v': return {t[1]}
              return vars_of(t[1])|vars_of(t[2])
          def ev(t,e):
              return e[t[1]] if t[0]=='v' else op(ev(t[1],e),ev(t[2],e))

          vals=[L(0),L(1),L(2),R(0),R(1),R(2)]
          lines=pathlib.Path('/tmp/order5_all.txt').read_text().splitlines()
          rows=[];surv=[]
          for n,s in enumerate(lines,1):
              l,r=peq(s);vs=sorted(vars_of(l)|vars_of(r));w=None
              for xs in itertools.product(vals,repeat=len(vs)):
                  env=dict(zip(vs,xs))
                  if ev(l,env)!=ev(r,env):
                      w={v:env[v][0]+str(env[v][1]) for v in vs};break
              if w is None: surv.append(n)
              rows.append({'equation':n,'formula':s,'refuted':w is not None,'witness':w})
          out={
             'claim':'E48799 structural model fingerprint over complete canonical identity universe through operation order 5',
             'universe_size':len(lines),
             'refuted_count':sum(x['refuted'] for x in rows),
             'survivor_count':len(surv),
             'survivors':surv,
             'survivor_formulas':{str(n):lines[n-1] for n in surv},
             'rows':rows,
             'model_source':'E48799 structural Sum Nat Nat model from released Equation48799_TO_51430_FALSE_R10.1.1_FULL_PROOF',
             'etp_generator_commit':'bb5a9b5fe78c376ce1725529f235f8d574630b9f',
          }
          pathlib.Path('/tmp/e48799_fingerprint.json').write_text(json.dumps(out,indent=2))
          print('UNIVERSE',len(lines))
          print('REFUTED',out['refuted_count'])
          print('SURVIVOR_COUNT',len(surv))
          for n in surv: print('SURVIVOR',n,lines[n-1])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: e48799-order5-universe-fingerprint-v1
          path: /tmp/e48799_fingerprint.json
