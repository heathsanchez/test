name: E6878 bounded provenance refinement v1

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/e6878-bounded-provenance-refinement-v1.yml'
  workflow_dispatch:

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Compute future-observational refinements
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from functools import lru_cache
          from collections import defaultdict,Counter
          import json,pathlib

          E=('e',)
          def K(a):return ('k',a)
          def P(a,b):return ('p',a,b)
          def Q(a,b):return ('q',a,b)
          def R(a,b):return ('r',a,b)
          def sz(t):
            if t[0]=='e':return 0
            if t[0]=='k':return sz(t[1])+1
            return sz(t[1])+sz(t[2])+2
          def st(t):
            if t[0]=='e':return 'e'
            if t[0]=='k':return 'k('+st(t[1])+')'
            return t[0]+'('+st(t[1])+','+st(t[2])+')'

          def rr0(a,b):
            if b[0]=='p' and b[1]==a:
              t=b[2]
              if t[0]=='p':
                l,r=t[1],t[2]
                if l[0]=='p' and r[0]=='p' and r[2]==a and l[2]==r[1]:return l[2]
          def rr1(a,b):
            if b[0]=='p' and b[2]==a:return R(a,b[1])
          def rr2(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2][0]=='q' and t[2][2]==a:return t[2][1]
          def rr3(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2]==a:return Q(a,Q(a,Q(t[1],a)))
          def rr4(a,b):
            if b==Q(a,a):return Q(a,Q(a,a))
          def rr5(a,b):
            if a[0]=='q' and b[0]=='q' and b[1]==a:return a[1]
          def rr6(a,b):return Q(a,b)
          rules=[rr0,rr1,rr2,rr3,rr4,rr5,rr6]
          @lru_cache(None)
          def ev(a,b):
            for i,r in enumerate(rules):
              o=r(a,b)
              if o is not None:return o
            raise AssertionError

          def blockedQ(a,b):return rr0(a,b) is not None or rr2(a,b) is not None
          def blockedR(a,b):return rr0(a,b) is not None or rr2(a,b) is not None or rr5(a,b) is not None
          @lru_cache(None)
          def nf(t):
            if t[0]=='e':return True
            if t[0]=='k':return nf(t[1])
            if t[0]=='p':return False
            if t[0]=='q':return nf(t[1]) and nf(t[2]) and not blockedQ(t[1],t[2])
            if t[0]=='r':return nf(t[1]) and nf(t[2]) and not blockedR(t[1],t[2])
            return False

          def erase(t):
            if t[0]=='e':return ('v',0)
            if t[0]=='k':return ('v',sz(t))
            if t[0] in ('p','q'):return ('f',erase(t[1]),erase(t[2]))
            if t[0]=='r':return ('f',erase(t[1]),('f',erase(t[2]),erase(t[1])))
          def es(t):
            if t[0]=='v':return 'v'+str(t[1])
            return '('+es(t[1])+'*'+es(t[2])+')'

          by={0:{E}}
          max_state=7
          for n in range(1,max_state+1):
            cur={K(x) for x in by.get(n-1,set())}
            for i in range(n-1):
              j=n-2-i
              for a in by.get(i,set()):
                for b in by.get(j,set()):
                  for t in (Q(a,b),R(a,b)):
                    if nf(t):cur.add(t)
            by[n]=cur

          states=sorted(set().union(*by.values()),key=lambda t:(sz(t),st(t)))
          contexts=[t for t in states if sz(t)<=3]
          print('STATES',len(states),'CONTEXTS',len(contexts))

          @lru_cache(None)
          def sig(t,d):
            if d==0:return ('E',erase(t))
            prev=sig(t,d-1)
            fut=[]
            for c in contexts:
              fut.append(('R',sig(ev(t,c),d-1)))
              fut.append(('L',sig(ev(c,t),d-1)))
            return (prev,tuple(fut))

          rows=[]
          for d in range(4):
            buckets=defaultdict(list)
            for t in states:buckets[sig(t,d)].append(t)
            raw=defaultdict(list)
            for t in states:raw[erase(t)].append(t)
            raw_coll=[ts for ts in raw.values() if len(ts)>1]
            split_raw=0
            examples=[]
            for ts in raw_coll:
              parts=defaultdict(list)
              for t in ts:parts[sig(t,d)].append(t)
              if len(parts)>1:
                split_raw+=1
                if len(examples)<8:
                  examples.append({
                    'erasure':es(erase(ts[0])),
                    'states':[st(t) for t in ts[:12]],
                    'parts':[[st(t) for t in xs[:8]] for xs in parts.values()]
                  })
            row={
              'depth':d,'class_count':len(buckets),
              'raw_erasure_class_count':len(raw),
              'raw_collision_classes':len(raw_coll),
              'raw_collision_classes_split':split_raw,
              'max_class':max(map(len,buckets.values())),
              'examples':examples
            }
            rows.append(row)
            print('DEPTH',d,'CLASSES',len(buckets),'RAW',len(raw),
                  'COLLISION_RAW',len(raw_coll),'SPLIT_RAW',split_raw,
                  'MAXCLASS',row['max_class'])

          # Which constructor-head distinctions account for depth-1 splits?
          headpairs=Counter()
          raw=defaultdict(list)
          for t in states:raw[erase(t)].append(t)
          for ts in raw.values():
            if len(ts)<2:continue
            parts=defaultdict(list)
            for t in ts:parts[sig(t,1)].append(t)
            if len(parts)>1:
              heads=tuple(sorted(set(t[0] for t in ts)))
              headpairs[heads]+=1
          print('DEPTH1_SPLIT_HEADSETS',dict(headpairs))

          pathlib.Path('/tmp/refinement.json').write_text(json.dumps({
            'state_size_bound':max_state,
            'context_size_bound':3,
            'state_count':len(states),
            'context_count':len(contexts),
            'depths':rows,
            'depth1_split_headsets':{str(k):v for k,v in headpairs.items()}
          },indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: e6878-bounded-provenance-refinement-v1
          path: /tmp/refinement.json
