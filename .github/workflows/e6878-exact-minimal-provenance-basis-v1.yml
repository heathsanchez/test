name: E6878 exact minimal provenance basis v1

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/e6878-exact-minimal-provenance-basis-v1.yml'
  workflow_dispatch:

jobs:
  minimize:
    strategy:
      fail-fast: false
      matrix:
        orientation: [original, opposite]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exact subset search
        env:
          ORIENTATION: ${{ matrix.orientation }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from functools import lru_cache
          from collections import defaultdict
          from itertools import combinations,product
          import os,json,pathlib

          orientation=os.environ['ORIENTATION']
          E=('e',)
          def K(a):return ('k',a)
          def P(a,b):return ('p',a,b)
          def Q(a,b):return ('q',a,b)
          def R(a,b):return ('r',a,b)
          def sz(t):
            if t[0]=='e':return 0
            if t[0]=='k':return sz(t[1])+1
            return sz(t[1])+sz(t[2])+2
          def st(t):
            if t[0]=='e':return 'e'
            if t[0]=='k':return 'k('+st(t[1])+')'
            return t[0]+'('+st(t[1])+','+st(t[2])+')'
          def r0(a,b):
            if b[0]=='p' and b[1]==a:
              t=b[2]
              if t[0]=='p':
                l,r=t[1],t[2]
                if l[0]=='p' and r[0]=='p' and r[2]==a and l[2]==r[1]:return l[2]
          def r1(a,b):
            if b[0]=='p' and b[2]==a:return R(a,b[1])
          def r2(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2][0]=='q' and t[2][2]==a:return t[2][1]
          def r3(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2]==a:return Q(a,Q(a,Q(t[1],a)))
          def r4(a,b):
            if b==Q(a,a):return Q(a,Q(a,a))
          def r5(a,b):
            if a[0]=='q' and b[0]=='q' and b[1]==a:return a[1]
          def r6(a,b):return Q(a,b)
          rules=[r0,r1,r2,r3,r4,r5,r6]
          @lru_cache(None)
          def base_ev(a,b):
            for r in rules:
              o=r(a,b)
              if o is not None:return o
            raise AssertionError
          def ev(a,b):return base_ev(a,b) if orientation=='original' else base_ev(b,a)
          def blockedQ(a,b):return r0(a,b) is not None or r2(a,b) is not None
          def blockedR(a,b):return r0(a,b) is not None or r2(a,b) is not None or r5(a,b) is not None
          @lru_cache(None)
          def nf(t):
            if t[0]=='e':return True
            if t[0]=='k':return nf(t[1])
            if t[0]=='p':return False
            if t[0]=='q':return nf(t[1]) and nf(t[2]) and not blockedQ(t[1],t[2])
            if t[0]=='r':return nf(t[1]) and nf(t[2]) and not blockedR(t[1],t[2])
            return False
          def erase(t):
            if t[0]=='e':return ('v',0)
            if t[0]=='k':return ('v',sz(t))
            if t[0] in ('p','q'):return ('f',erase(t[1]),erase(t[2]))
            return ('f',erase(t[1]),('f',erase(t[2]),erase(t[1])))
          def tag_at(t,path):
            cur=t
            for bit in path:
              if cur[0]=='e':return '∅'
              if cur[0]=='k':
                if bit:return '∅'
                cur=cur[1]
              else:cur=cur[1] if bit==0 else cur[2]
            return cur[0]

          # Declared sensor language: constructor tag at paths length <=2.
          sensors=[(),(0,),(1,),(0,0),(0,1),(1,0),(1,1)]
          by={0:{E}}
          for n in range(1,7):
            cur={K(x) for x in by.get(n-1,set())}
            for i in range(n-1):
              j=n-2-i
              for a in by.get(i,set()):
                for b in by.get(j,set()):
                  for t in (Q(a,b),R(a,b)):
                    if nf(t):cur.add(t)
            by[n]=cur
          states=sorted(set().union(*by.values()),key=lambda t:(sz(t),st(t)))
          contexts=[t for t in states if sz(t)<=4]

          def verify(selected):
            def abs_(t):return (erase(t),tuple(tag_at(t,p) for p in selected))
            buckets=defaultdict(list)
            for t in states:buckets[abs_(t)].append(t)
            for xs in buckets.values():
              if len(xs)<2:continue
              for i in range(len(xs)):
                for j in range(i+1,len(xs)):
                  a,b=xs[i],xs[j]
                  for c in contexts:
                    if abs_(ev(a,c))!=abs_(ev(b,c)):
                      return False,(a,b,c,'right')
                    if abs_(ev(c,a))!=abs_(ev(c,b)):
                      return False,(a,b,c,'left')
            return True,None

          tested=[]
          winners=[]
          minimum=None
          for k in range(len(sensors)+1):
            for sel in combinations(sensors,k):
              ok,res=verify(sel)
              tested.append({'sensors':[list(p) for p in sel],'pass':ok})
              if ok:
                winners.append(sel)
            if winners:
              minimum=k
              break
          assert minimum is not None
          print('MINIMUM_SENSOR_COUNT',minimum)
          for w in winners:
            print('MINIMAL_BASIS',w)
          # Strong removal ablation for each coordinate of first winner.
          first=winners[0]
          ablations=[]
          for p in first:
            weak=tuple(x for x in first if x!=p)
            ok,res=verify(weak)
            ablations.append({'removed':list(p),'pass':ok,
              'residual':None if res is None else {'a':st(res[0]),'b':st(res[1]),'c':st(res[2]),'side':res[3]}})
            print('REMOVE',p,'PASS',ok)
            assert not ok
          pathlib.Path('/tmp/result.json').write_text(json.dumps({
            'orientation':orientation,'state_count':len(states),'context_count':len(contexts),
            'sensor_language':[list(p) for p in sensors],
            'minimum_sensor_count':minimum,
            'minimal_bases':[[list(p) for p in w] for w in winners],
            'tested_subset_count':len(tested),
            'coordinate_ablations':ablations
          },indent=2))
          PY

      - name: Assert exact minimum
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          assert d['minimum_sensor_count']==3,d
          print('EXACT_MINIMAL_PROVENANCE_BASIS_PASS',d['orientation'])
          print('MINIMAL_BASES',d['minimal_bases'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: e6878-exact-minimal-provenance-${{ matrix.orientation }}-v1
          path: /tmp/result.json
