name: E6878 future-continuation quotient genesis v1

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/e6878-future-continuation-quotient-v1.yml'
  workflow_dispatch:

jobs:
  develop:
    strategy:
      fail-fast: false
      matrix:
        horizon:
          - {name: medium, state_max: 6, context_max: 4, max_sensors: 48, max_depth: 14}
          - {name: large, state_max: 7, context_max: 5, max_sensors: 64, max_depth: 16}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Residual-generate future continuation sensors
        env:
          HORIZON: ${{ matrix.horizon.name }}
          STATE_MAX: ${{ matrix.horizon.state_max }}
          CONTEXT_MAX: ${{ matrix.horizon.context_max }}
          MAX_SENSORS: ${{ matrix.horizon.max_sensors }}
          MAX_DEPTH: ${{ matrix.horizon.max_depth }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from functools import lru_cache
          from collections import defaultdict
          import os,json,pathlib,time

          horizon=os.environ['HORIZON']
          STATE_MAX=int(os.environ['STATE_MAX'])
          CONTEXT_MAX=int(os.environ['CONTEXT_MAX'])
          MAX_SENSORS=int(os.environ['MAX_SENSORS'])
          MAX_DEPTH=int(os.environ['MAX_DEPTH'])

          E=('e',)
          def K(a): return ('k',a)
          def P(a,b): return ('p',a,b)
          def Q(a,b): return ('q',a,b)
          def R(a,b): return ('r',a,b)

          @lru_cache(None)
          def sz(t):
            if t[0]=='e': return 0
            if t[0]=='k': return sz(t[1])+1
            return sz(t[1])+sz(t[2])+2

          @lru_cache(None)
          def st(t):
            if t[0]=='e': return 'e'
            if t[0]=='k': return 'k('+st(t[1])+')'
            return t[0]+'('+st(t[1])+','+st(t[2])+')'

          def r0(a,b):
            if b[0]=='p' and b[1]==a:
              t=b[2]
              if t[0]=='p':
                l,r=t[1],t[2]
                if l[0]=='p' and r[0]=='p' and r[2]==a and l[2]==r[1]: return l[2]
          def r1(a,b):
            if b[0]=='p' and b[2]==a: return R(a,b[1])
          def r2(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2][0]=='q' and t[2][2]==a: return t[2][1]
          def r3(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2]==a: return Q(a,Q(a,Q(t[1],a)))
          def r4(a,b):
            if b==Q(a,a): return Q(a,Q(a,a))
          def r5(a,b):
            if a[0]=='q' and b[0]=='q' and b[1]==a: return a[1]
          def r6(a,b): return Q(a,b)
          rules=(r0,r1,r2,r3,r4,r5,r6)

          @lru_cache(None)
          def ev(a,b):
            for r in rules:
              o=r(a,b)
              if o is not None: return o
            raise AssertionError

          def blockedQ(a,b): return r0(a,b) is not None or r2(a,b) is not None
          def blockedR(a,b): return r0(a,b) is not None or r2(a,b) is not None or r5(a,b) is not None

          @lru_cache(None)
          def nf(t):
            if t[0]=='e': return True
            if t[0]=='k': return nf(t[1])
            if t[0]=='p': return False
            if t[0]=='q': return nf(t[1]) and nf(t[2]) and not blockedQ(t[1],t[2])
            if t[0]=='r': return nf(t[1]) and nf(t[2]) and not blockedR(t[1],t[2])
            return False

          @lru_cache(None)
          def erase(t):
            if t[0]=='e': return ('v',0)
            if t[0]=='k': return ('v',sz(t))
            if t[0] in ('p','q'): return ('f',erase(t[1]),erase(t[2]))
            return ('f',erase(t[1]),('f',erase(t[2]),erase(t[1])))

          by={0:{E}}
          for n in range(1,STATE_MAX+1):
            cur={K(x) for x in by.get(n-1,set())}
            for i in range(n-1):
              j=n-2-i
              for a in by.get(i,set()):
                for b in by.get(j,set()):
                  for t in (Q(a,b),R(a,b)):
                    if nf(t): cur.add(t)
            by[n]=cur
          states=sorted(set().union(*by.values()), key=lambda t:(sz(t),st(t)))
          contexts=[t for t in states if sz(t)<=CONTEXT_MAX]
          actions=[('L',c) for c in contexts]+[('R',c) for c in contexts]
          actions.sort(key=lambda ac:(ac[0],sz(ac[1]),st(ac[1])))

          @lru_cache(None)
          def step(t,ai):
            side,c=actions[ai]
            return ev(c,t) if side=='L' else ev(t,c)

          @lru_cache(None)
          def run_sensor(t,sensor):
            cur=t
            for ai in sensor:
              cur=step(cur,ai)
            return cur

          obs_ids={}
          def obs_id(t):
            x=erase(t)
            if x not in obs_ids: obs_ids[x]=len(obs_ids)
            return obs_ids[x]

          vector_cache={}
          def obs_vector(sensor):
            v=vector_cache.get(sensor)
            if v is None:
              v=tuple(obs_id(run_sensor(t,sensor)) for t in states)
              vector_cache[sensor]=v
            return v

          def partition(sensors):
            vecs=[obs_vector(q) for q in sensors]
            buckets={}
            class_of=[None]*len(states)
            next_id=0
            for i in range(len(states)):
              key=tuple(v[i] for v in vecs)
              cid=buckets.get(key)
              if cid is None:
                cid=next_id; next_id+=1; buckets[key]=cid
              class_of[i]=cid
            return class_of,next_id

          def splits(vec,class_of):
            first={}
            for i,cid in enumerate(class_of):
              x=vec[i]
              if cid in first:
                if first[cid][0]!=x:
                  return first[cid][1],i
              else:
                first[cid]=(x,i)
            return None

          def candidate_order(sensors):
            seen=set(sensors)
            for q in sorted(sensors,key=lambda q:(len(q),q)):
              for ai in range(len(actions)):
                cand=(ai,)+q
                if cand in seen or len(cand)>MAX_DEPTH: continue
                yield cand,ai,q

          sensors=[()]
          rejected=set()
          history=[]
          t0=time.time()
          status='UNKNOWN'
          terminal_residual=None

          for iteration in range(MAX_SENSORS):
            class_of,nclasses=partition(sensors)
            print('ITER',iteration,'SENSORS',len(sensors),'CLASSES',nclasses,
                  'MAX_SENSOR_DEPTH',max(map(len,sensors)),'ELAPSED',round(time.time()-t0,2))
            found=None
            for cand,ai,parent in candidate_order(sensors):
              if cand in rejected: continue
              vec=obs_vector(cand)
              w=splits(vec,class_of)
              if w is None:
                rejected.add(cand)
                continue
              i,j=w
              found=(cand,ai,parent,i,j,vec[i],vec[j])
              break
            if found is None:
              status='STABLE_BOUNDED_OPERATIONAL_QUOTIENT'
              break

            cand,ai,parent,i,j,vi,vj=found
            side,c=actions[ai]
            rec={
              'iteration':iteration,
              'classes_before':nclasses,
              'new_sensor':[{'side':actions[x][0],'context':st(actions[x][1])} for x in cand],
              'new_sensor_depth':len(cand),
              'witness_left':st(states[i]),
              'witness_right':st(states[j]),
              'prefix_action':{'side':side,'context':st(c)},
              'parent_sensor':[{'side':actions[x][0],'context':st(actions[x][1])} for x in parent],
              'observed_outputs_differ':True
            }
            history.append(rec)
            print('GENESIS_SENSOR_DEPTH',len(cand),'WITNESS',rec['witness_left'],'||',rec['witness_right'],
                  'PREFIX',side,st(c))
            sensors.append(cand)
          else:
            terminal_residual='MAX_SENSOR_BUDGET_REACHED'

          class_of,nclasses=partition(sensors)

          # Exact stability replay over the generated sensor basis:
          # same profile => every one-step action has the same profile.
          stable=True
          stable_witness=None
          buckets=defaultdict(list)
          for i,cid in enumerate(class_of): buckets[cid].append(i)
          for xs in buckets.values():
            if len(xs)<2: continue
            for ai in range(len(actions)):
              successor_profiles={}
              for i in xs:
                s=step(states[i],ai)
                prof=tuple(obs_id(run_sensor(s,q)) for q in sensors)
                if prof not in successor_profiles:
                  successor_profiles[prof]=i
                if len(successor_profiles)>1:
                  items=list(successor_profiles.items())
                  i0=items[0][1]; i1=items[1][1]
                  stable=False
                  stable_witness={
                    'left':st(states[i0]),'right':st(states[i1]),
                    'action':{'side':actions[ai][0],'context':st(actions[ai][1])}
                  }
                  break
              if not stable: break
            if not stable: break

          if stable and status!='STABLE_BOUNDED_OPERATIONAL_QUOTIENT':
            status='STABLE_BOUNDED_OPERATIONAL_QUOTIENT'
          if not stable and terminal_residual is None:
            terminal_residual='GENERATED_BASIS_NOT_STABLE'

          # One-removal causal ablation of the last generated sensor.
          removal=None
          if len(sensors)>1:
            weak=sensors[:-1]
            weak_class,weak_n=partition(weak)
            weak_stable=True
            weak_w=None
            wb=defaultdict(list)
            for i,cid in enumerate(weak_class): wb[cid].append(i)
            for xs in wb.values():
              if len(xs)<2: continue
              for ai in range(len(actions)):
                prof0=None;i0=None
                for i in xs:
                  ss=step(states[i],ai)
                  prof=tuple(obs_id(run_sensor(ss,q)) for q in weak)
                  if prof0 is None: prof0=prof;i0=i
                  elif prof!=prof0:
                    weak_stable=False
                    weak_w={'left':st(states[i0]),'right':st(states[i]),
                            'action':{'side':actions[ai][0],'context':st(actions[ai][1])}}
                    break
                if not weak_stable: break
              if not weak_stable: break
            removal={'removed_sensor_depth':len(sensors[-1]),
                     'stable_after_removal':weak_stable,
                     'witness':weak_w,
                     'classes_after_removal':weak_n}

          result={
            'horizon':horizon,
            'state_max_size':STATE_MAX,
            'context_max_size':CONTEXT_MAX,
            'state_count':len(states),
            'context_count':len(contexts),
            'action_count':len(actions),
            'initial_erasure_classes':partition([()])[1],
            'status':status,
            'stable_replay':stable,
            'stable_replay_witness':stable_witness,
            'final_class_count':nclasses,
            'sensor_count':len(sensors),
            'max_sensor_depth':max(map(len,sensors)),
            'history':history,
            'last_sensor_removal_ablation':removal,
            'terminal_residual':terminal_residual,
            'elapsed_seconds':round(time.time()-t0,3),
            'method':'Residual-generated distinguishing continuations. Start from ordinary erasure; whenever two currently identified states have successor profiles separated by an already admitted sensor, prepend that action to the sensor and retain the resulting continuation. Stop only when the induced quotient is stable under every declared left/right context.'
          }
          pathlib.Path('/tmp/result.json').write_text(json.dumps(result,indent=2))
          print(json.dumps({k:result[k] for k in ['horizon','state_count','context_count','initial_erasure_classes','status','stable_replay','final_class_count','sensor_count','max_sensor_depth','last_sensor_removal_ablation','terminal_residual','elapsed_seconds']},indent=2))

          if status=='STABLE_BOUNDED_OPERATIONAL_QUOTIENT':
            assert stable
            print('E6878_FUTURE_CONTINUATION_QUOTIENT_PASS',horizon)
          else:
            print('E6878_FUTURE_CONTINUATION_QUOTIENT_RESIDUAL',horizon,status,terminal_residual)
          PY

      - name: Publish exact bounded authority
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/out
          cp /tmp/result.json /tmp/out/
          cat > /tmp/out/AUTHORITY.json <<JSON
          {
            "classification": "FINITE_EXHAUSTIVE_OVER_DECLARED_HORIZON",
            "horizon": "${{ matrix.horizon.name }}",
            "claim": "Starting only from ordinary term erasure, residual-separated future continuations are generated and retained until the induced E6878 abstraction is stable under every declared left/right context, or an explicit bounded residual is returned. This tests future-response profiles rather than constructor-tag guesses.",
            "austin_model_commit": "b984287a1e5283e67b3709fe1e43f7734b360342",
            "state_max_size": ${{ matrix.horizon.state_max }},
            "context_max_size": ${{ matrix.horizon.context_max }}
          }
          JSON
          sha256sum /tmp/out/* | tee /tmp/out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: e6878-future-continuation-quotient-${{ matrix.horizon.name }}-v1
          path: /tmp/out/
