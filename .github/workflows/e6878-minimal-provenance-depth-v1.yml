name: E6878 minimal provenance depth v1

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/e6878-minimal-provenance-depth-v1.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search abstraction ladder
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from functools import lru_cache
          from collections import defaultdict
          import json,pathlib

          E=('e',)
          def K(a):return ('k',a)
          def P(a,b):return ('p',a,b)
          def Q(a,b):return ('q',a,b)
          def R(a,b):return ('r',a,b)
          def sz(t):
            if t[0]=='e':return 0
            if t[0]=='k':return sz(t[1])+1
            return sz(t[1])+sz(t[2])+2
          def st(t):
            if t[0]=='e':return 'e'
            if t[0]=='k':return 'k('+st(t[1])+')'
            return t[0]+'('+st(t[1])+','+st(t[2])+')'

          def r0(a,b):
            if b[0]=='p' and b[1]==a:
              t=b[2]
              if t[0]=='p':
                l,r=t[1],t[2]
                if l[0]=='p' and r[0]=='p' and r[2]==a and l[2]==r[1]:return l[2]
          def r1(a,b):
            if b[0]=='p' and b[2]==a:return R(a,b[1])
          def r2(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2][0]=='q' and t[2][2]==a:return t[2][1]
          def r3(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2]==a:return Q(a,Q(a,Q(t[1],a)))
          def r4(a,b):
            if b==Q(a,a):return Q(a,Q(a,a))
          def r5(a,b):
            if a[0]=='q' and b[0]=='q' and b[1]==a:return a[1]
          def r6(a,b):return Q(a,b)
          rules=[r0,r1,r2,r3,r4,r5,r6]
          @lru_cache(None)
          def ev(a,b):
            for r in rules:
              o=r(a,b)
              if o is not None:return o
            raise AssertionError
          def blockedQ(a,b):return r0(a,b) is not None or r2(a,b) is not None
          def blockedR(a,b):return r0(a,b) is not None or r2(a,b) is not None or r5(a,b) is not None
          @lru_cache(None)
          def nf(t):
            if t[0]=='e':return True
            if t[0]=='k':return nf(t[1])
            if t[0]=='p':return False
            if t[0]=='q':return nf(t[1]) and nf(t[2]) and not blockedQ(t[1],t[2])
            if t[0]=='r':return nf(t[1]) and nf(t[2]) and not blockedR(t[1],t[2])
            return False

          def erase(t):
            if t[0]=='e':return ('v',0)
            if t[0]=='k':return ('v',sz(t))
            if t[0] in ('p','q'):return ('f',erase(t[1]),erase(t[2]))
            if t[0]=='r':return ('f',erase(t[1]),('f',erase(t[2]),erase(t[1])))

          # d=0: ordinary-term erasure only.
          # d>0: retain constructor head and recursively d-1 provenance levels,
          # while always retaining extensional erasure as the first component.
          @lru_cache(None)
          def abstraction(t,d):
            ext=erase(t)
            if d==0:return ('ext',ext)
            if t[0]=='e':return ('prov',ext,'e')
            if t[0]=='k':return ('prov',ext,'k',abstraction(t[1],d-1))
            return ('prov',ext,t[0],
                    abstraction(t[1],d-1),abstraction(t[2],d-1))

          by={0:{E}}
          maxsz=6
          for n in range(1,maxsz+1):
            cur={K(x) for x in by.get(n-1,set())}
            for i in range(n-1):
              j=n-2-i
              for a in by.get(i,set()):
                for b in by.get(j,set()):
                  for t in (Q(a,b),R(a,b)):
                    if nf(t):cur.add(t)
            by[n]=cur
          states=sorted(set().union(*by.values()),key=lambda t:(sz(t),st(t)))
          contexts=[t for t in states if sz(t)<=4]
          print('STATES',len(states),'CONTEXTS',len(contexts))

          results=[]
          for d in range(0,6):
            buckets=defaultdict(list)
            for t in states:buckets[abstraction(t,d)].append(t)
            collision=[xs for xs in buckets.values() if len(xs)>1]
            violations=[]
            checked=0
            # Necessary right/left congruence over bounded contexts.
            for xs in collision:
              for i in range(len(xs)):
                for j in range(i+1,len(xs)):
                  a,b=xs[i],xs[j]
                  for c in contexts:
                    checked+=2
                    oa,ob=ev(a,c),ev(b,c)
                    if abstraction(oa,d)!=abstraction(ob,d):
                      violations.append({
                        'side':'right','a':st(a),'b':st(b),'c':st(c),
                        'out_a':st(oa),'out_b':st(ob)
                      }); break
                    oa,ob=ev(c,a),ev(c,b)
                    if abstraction(oa,d)!=abstraction(ob,d):
                      violations.append({
                        'side':'left','a':st(a),'b':st(b),'c':st(c),
                        'out_a':st(oa),'out_b':st(ob)
                      }); break
                  if violations:break
                if violations:break
              if violations:break
            row={
              'depth':d,'class_count':len(buckets),'collision_classes':len(collision),
              'checked_transitions_until_first_violation':checked,
              'bounded_congruent':not violations,
              'first_violation':violations[0] if violations else None
            }
            results.append(row)
            print('DEPTH',d,'CLASSES',len(buckets),'COLLISIONS',len(collision),
                  'CONGRUENT',not violations,'CHECKED',checked)
            if violations:print('VIOLATION',json.dumps(violations[0]))
          pathlib.Path('/tmp/results.json').write_text(json.dumps({
            'state_size_bound':maxsz,'context_size_bound':4,
            'state_count':len(states),'context_count':len(contexts),
            'results':results
          },indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: e6878-minimal-provenance-depth-v1
          path: /tmp/results.json
