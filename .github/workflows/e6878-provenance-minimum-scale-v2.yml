name: E6878 provenance minimum scale v2

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/e6878-provenance-minimum-scale-v2.yml'
  workflow_dispatch:

jobs:
  scale:
    strategy:
      fail-fast: false
      matrix:
        orientation: [original, opposite]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Test larger bounded horizon
        env:
          ORIENTATION: ${{ matrix.orientation }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from functools import lru_cache
          from collections import defaultdict
          from itertools import combinations
          import os,json,pathlib
          orientation=os.environ['ORIENTATION']
          E=('e',)
          def K(a):return ('k',a)
          def Q(a,b):return ('q',a,b)
          def R(a,b):return ('r',a,b)
          def P(a,b):return ('p',a,b)
          def sz(t):
            if t[0]=='e':return 0
            if t[0]=='k':return sz(t[1])+1
            return sz(t[1])+sz(t[2])+2
          def st(t):
            if t[0]=='e':return'e'
            if t[0]=='k':return'k('+st(t[1])+')'
            return t[0]+'('+st(t[1])+','+st(t[2])+')'
          def r0(a,b):
            if b[0]=='p' and b[1]==a:
              t=b[2]
              if t[0]=='p':
                l,r=t[1],t[2]
                if l[0]=='p' and r[0]=='p' and r[2]==a and l[2]==r[1]:return l[2]
          def r1(a,b):
            if b[0]=='p' and b[2]==a:return R(a,b[1])
          def r2(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2][0]=='q' and t[2][2]==a:return t[2][1]
          def r3(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2]==a:return Q(a,Q(a,Q(t[1],a)))
          def r4(a,b):
            if b==Q(a,a):return Q(a,Q(a,a))
          def r5(a,b):
            if a[0]=='q' and b[0]=='q' and b[1]==a:return a[1]
          def r6(a,b):return Q(a,b)
          rules=[r0,r1,r2,r3,r4,r5,r6]
          @lru_cache(None)
          def base(a,b):
            for r in rules:
              o=r(a,b)
              if o is not None:return o
            raise AssertionError
          def ev(a,b):return base(a,b) if orientation=='original' else base(b,a)
          def bq(a,b):return r0(a,b)is not None or r2(a,b)is not None
          def br(a,b):return r0(a,b)is not None or r2(a,b)is not None or r5(a,b)is not None
          @lru_cache(None)
          def nf(t):
            if t[0]=='e':return True
            if t[0]=='k':return nf(t[1])
            if t[0]=='p':return False
            if t[0]=='q':return nf(t[1]) and nf(t[2]) and not bq(t[1],t[2])
            return nf(t[1]) and nf(t[2]) and not br(t[1],t[2])
          def erase(t):
            if t[0]=='e':return ('v',0)
            if t[0]=='k':return ('v',sz(t))
            if t[0] in ('p','q'):return ('f',erase(t[1]),erase(t[2]))
            return ('f',erase(t[1]),('f',erase(t[2]),erase(t[1])))
          def tag(t,p):
            cur=t
            for b in p:
              if cur[0]=='e':return '∅'
              if cur[0]=='k':
                if b:return '∅'
                cur=cur[1]
              else:cur=cur[1] if b==0 else cur[2]
            return cur[0]
          sensors=[(),(0,),(1,),(0,0),(0,1),(1,0),(1,1)]
          by={0:{E}}
          for n in range(1,8):
            cur={K(x) for x in by.get(n-1,set())}
            for i in range(n-1):
              j=n-2-i
              for a in by.get(i,set()):
                for b in by.get(j,set()):
                  for t in (Q(a,b),R(a,b)):
                    if nf(t):cur.add(t)
            by[n]=cur
          states=sorted(set().union(*by.values()),key=lambda t:(sz(t),st(t)))
          contexts=[t for t in states if sz(t)<=5]
          print('STATES',len(states),'CONTEXTS',len(contexts))

          def verify(sel):
            def A(t):return(erase(t),tuple(tag(t,p) for p in sel))
            buckets=defaultdict(list)
            for t in states:buckets[A(t)].append(t)
            for xs in buckets.values():
              if len(xs)<2:continue
              for i in range(len(xs)):
                for j in range(i+1,len(xs)):
                  a,b=xs[i],xs[j]
                  for c in contexts:
                    if A(ev(a,c))!=A(ev(b,c)):return False
                    if A(ev(c,a))!=A(ev(c,b)):return False
            return True

          weaker=[]
          for k in range(3):
            for sel in combinations(sensors,k):
              ok=verify(sel)
              weaker.append((sel,ok))
              print('WEAKER',sel,'PASS',ok)
              assert not ok
          chosen=((),(0,),(1,))
          ok=verify(chosen)
          print('CHOSEN',chosen,'PASS',ok)
          assert ok
          # compression statistics
          raw=len({erase(t) for t in states})
          chosen_classes=len({(erase(t),tuple(tag(t,p) for p in chosen)) for t in states})
          print('RAW_CLASSES',raw,'CHOSEN_CLASSES',chosen_classes,'FULL_STATES',len(states))
          pathlib.Path('/tmp/result.json').write_text(json.dumps({
            'orientation':orientation,'state_count':len(states),'context_count':len(contexts),
            'all_subsets_below_3_fail':True,'chosen_basis':[list(p) for p in chosen],
            'chosen_pass':ok,'raw_classes':raw,'chosen_classes':chosen_classes
          },indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: e6878-provenance-minimum-scale-${{ matrix.orientation }}-v2
          path: /tmp/result.json
