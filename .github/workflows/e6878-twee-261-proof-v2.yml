name: E6878 Twee 2.6.1 proof search v2

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/e6878-twee-261-proof-v2.yml'
  workflow_dispatch:

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        goal: [r2, r5]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install Twee 2.6.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -LfsS https://github.com/nick8325/twee/releases/download/2.6.1/twee-2.6.1-linux-amd64.tar.gz -o /tmp/twee.tgz
          echo 'fe5159baa57bf31e68a2948bf87f5f8e0cd0c824ab6ef08fb819ff1f6a6cb21c  /tmp/twee.tgz' | sha256sum -c -
          mkdir /tmp/twee261
          tar -xzf /tmp/twee.tgz -C /tmp/twee261
          find /tmp/twee261 -type f -name twee -exec cp {} /tmp/twee \;
          chmod +x /tmp/twee
          /tmp/twee --version || true

      - name: Write obligation
        env:
          GOAL: ${{ matrix.goal }}
        shell: bash
        run: |
          set -euxo pipefail
          case "$GOAL" in
            r2) G='f(A,f(A,f(B,f(C,A)))) = C' ;;
            r5) G='f(f(A,B),f(f(A,B),C)) = A' ;;
          esac
          cat > /tmp/problem.p <<EOF
          fof(source,axiom,![X,Y,Z]: f(Y,f(Y,f(f(Z,X),f(X,Y)))) = X).
          fof(goal,conjecture,![A,B,C]: $G).
          EOF

      - name: Search with current Twee
        env:
          GOAL: ${{ matrix.goal }}
        shell: bash
        run: |
          set +e
          timeout 600s /tmp/twee /tmp/problem.p > /tmp/twee.txt 2>&1
          rc=$?
          set -e
          echo "TWEE_RC=$rc"
          grep -E 'Proof|Theorem|Conjecture|RESULT|Success|Failure' /tmp/twee.txt | tail -80 || true
          tail -80 /tmp/twee.txt
          mkdir -p /tmp/out
          cp /tmp/problem.p /tmp/twee.txt /tmp/out/
          echo "$rc" > /tmp/out/rc.txt

      - uses: actions/upload-artifact@v4
        with:
          name: e6878-twee261-${{ matrix.goal }}
          path: /tmp/out/
