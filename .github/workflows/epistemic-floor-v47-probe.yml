name: Epistemic Floor V47 Probe

on:
  push:
    branches:
      - epistemic-floor-v47
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen core
        run: |
          set -euo pipefail
          FREEZE=ff5f6dfabdc9704296208f84ea9fc727bbf10b24
          git merge-base --is-ancestor "$FREEZE" HEAD
          changed="$(git diff --name-only "$FREEZE"..HEAD --             experiments/epistemic_floor_v47/PROTOCOL.md             experiments/epistemic_floor_v47/basis.py             experiments/epistemic_floor_v47/kernel.py             experiments/epistemic_floor_v47/FREEZE.json)"
          test -z "$changed" || { echo "$changed"; exit 1; }

      - name: Probe hidden epistemic challenges
        working-directory: experiments/epistemic_floor_v47
        run: |
          python probe.py
