name: Epistemic Floor V47b Prefreeze

on:
  push:
    branches:
      - epistemic-floor-v47b
  workflow_dispatch:

jobs:
  prefreeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          python -m py_compile             experiments/epistemic_floor_v47b/basis.py             experiments/epistemic_floor_v47b/kernel.py

      - name: Corrected floor and version-space smoke
        working-directory: experiments/epistemic_floor_v47b
        run: |
          python - <<'PY'
          from itertools import product
          from basis import Sample, World
          from kernel import Kernel

          def words(a,d):
              out=[()]
              for n in range(1,d+1):
                  out.extend(product(range(a),repeat=n))
              return tuple(out)

          # Closed four-state toy: two hidden bits, output AND.
          universe=words(2,5)
          def y(h):
              state=0
              for token in h:
                  state ^= (2 if token==0 else 1)
              return 1 if state==3 else 0

          samples=tuple(Sample(h,y(h)) for h in universe)
          closed=World(
              "four_closed",
              2,2,3,2,
              samples,
              universe,
              True,
          )
          rc=Kernel().synthesize(closed)
          print("four_closed",rc)
          assert rc["status"]=="VERIFIED_IDENTIFIABLE_BEHAVIORAL_FLOOR"
          assert rc["completion_count"]==1
          assert rc["floor_future_depth"]==1
          assert rc["state_count"]==4

          # Same positive table, all OPEN: must not be forced to the hidden floor.
          openw=World(
              "four_open",
              2,2,3,2,
              samples,
              (),
              True,
          )
          ro=Kernel().synthesize(openw)
          print("four_open",ro["status"],ro.get("witness_a",{}),ro.get("witness_b",{}))
          assert ro["status"]=="UNKNOWN_IDENTIFIABILITY"
          assert ro["witness_a"]["state_count"]!=ro["witness_b"]["state_count"] or ro["witness_a"]["floor_status"]!=ro["witness_b"]["floor_status"]
          PY
