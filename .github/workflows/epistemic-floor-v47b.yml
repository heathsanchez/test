name: Epistemic Floor Genesis V47b

on:
  push:
    branches:
      - epistemic-floor-v47b
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V47b core
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=9156211c3da2bb120aab513eef83ae303fa83556
          git merge-base --is-ancestor "$FREEZE" HEAD
          changed="$(git diff --name-only "$FREEZE"..HEAD --             experiments/epistemic_floor_v47b/PROTOCOL.md             experiments/epistemic_floor_v47b/basis.py             experiments/epistemic_floor_v47b/kernel.py             experiments/epistemic_floor_v47b/FREEZE.json)"
          if [ -n "$changed" ]; then
            echo "Frozen V47b core changed after scientific freeze:"
            echo "$changed"
            exit 1
          fi

      - name: Syntax check
        run: |
          python -m py_compile             experiments/epistemic_floor_v47b/basis.py             experiments/epistemic_floor_v47b/kernel.py             experiments/epistemic_floor_v47b/challenge_pack.py             experiments/epistemic_floor_v47b/run.py

      - name: Run frozen V47b final boss
        working-directory: experiments/epistemic_floor_v47b
        run: |
          set -o pipefail
          python run.py | tee run.log

      - name: Evidence summary
        if: always()
        working-directory: experiments/epistemic_floor_v47b
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence.json")
          if not p.exists():
              print("No evidence.json produced")
              raise SystemExit(1)
          e=json.loads(p.read_text())
          print("verdict:",e.get("verdict"))
          print("full_pass:",e.get("full_pass"))
          print("closure_critical_count:",e.get("closure_critical_count"))
          print("closure_noncritical_count:",e.get("closure_noncritical_count"))
          for k,v in sorted(e.get("gates",{}).items()):
              print(k,v)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-floor-v47b-evidence
          path: |
            experiments/epistemic_floor_v47b/evidence.json
            experiments/epistemic_floor_v47b/run.log
            experiments/epistemic_floor_v47b/FREEZE.json
            experiments/epistemic_floor_v47b/PROTOCOL.md
