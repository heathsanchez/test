name: Epistemic Kernel Frontier V1

on:
  push:
    paths:
      - "experiments/epistemic_kernel_frontier_v1/FROZEN_CANDIDATE.md"
      - "scripts/epistemic_kernel_frontier_v1.py"
      - ".github/workflows/epistemic-kernel-frontier-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove frozen candidate unchanged
        run: |
          set -euxo pipefail
          git diff --exit-code 2e9654e5c6b2d38de3ef7abcdcf0dbfc3a95a3ba --             experiments/epistemic_kernel_frontier_v1/FROZEN_CANDIDATE.md
          echo "EKF_V1_FROZEN_UNCHANGED"
      - name: Run exhaustive frontier audit
        run: |
          set -o pipefail
          python scripts/epistemic_kernel_frontier_v1.py | tee epistemic-kernel-frontier-v1.log
          grep -F "SURVIVED_EPISTEMIC_KERNEL_FRONTIER_V1" epistemic-kernel-frontier-v1.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epistemic-kernel-frontier-v1
          path: epistemic-kernel-frontier-v1.log
