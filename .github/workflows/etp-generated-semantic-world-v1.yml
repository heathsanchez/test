name: ETP generated semantic world universal property v1

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/etp-generated-semantic-world-v1.yml'
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: etp-universal-semantic-compiler-interface-v1
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 34538388152

      - name: Install elan
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Freeze ETP
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/teorth/equational_theories.git /tmp/etp
          cd /tmp/etp
          git checkout -q bb5a9b5fe78c376ce1725529f235f8d574630b9f
          lake exe cache get
          lake build equational_theories.Preorder equational_theories.Homomorphisms
          cp /tmp/base/SemanticCompiler.lean /tmp/etp/GeneratedSemanticWorld.lean

      - name: Add generatedness and unique universal lift
        shell: bash
        run: |
          cat >> /tmp/etp/GeneratedSemanticWorld.lean <<'LEAN'

          open FreeMagma
          open Law
          open SemanticCompiler

          namespace GeneratedSemanticWorld

          namespace SemanticCompiler.Certificate

          def Generated
              {Γ : Ctx Nat} (C : Certificate Γ) : Prop :=
            ∀ c : C.Carrier, ∃ t : FreeMagma Nat, C.canonical t = c

          theorem hom_canonical
              {Γ : Ctx Nat} (C : Certificate Γ)
              {G : Type} [Magma G]
              (f : @MagmaHom C.Carrier G C.instMagma inferInstance)
              (t : FreeMagma Nat) :
              f (C.canonical t) =
                FreeMagma.evalInMagma (fun n => f (C.gen n)) t := by
            letI : Magma C.Carrier := C.instMagma
            induction t with
            | Leaf n => rfl
            | Fork a b iha ihb =>
                change
                  f (C.canonical a ◇ C.canonical b) =
                    FreeMagma.evalInMagma
                      (fun n => f (C.gen n)) (.Fork a b)
                rw [f.map_op]
                simp only [FreeMagma.evalInMagma]
                rw [iha, ihb]

          theorem hom_ext_on_generators
              {Γ : Ctx Nat} (C : Certificate Γ)
              (hgenerated : C.Generated)
              {G : Type} [Magma G]
              (f g : @MagmaHom C.Carrier G C.instMagma inferInstance)
              (hgen : ∀ n, f (C.gen n) = g (C.gen n)) :
              f = g := by
            apply MagmaHom.ext
            intro c
            rcases hgenerated c with ⟨t, rfl⟩
            rw [C.hom_canonical f t, C.hom_canonical g t]
            apply congrArg (fun ρ : Nat → G => FreeMagma.evalInMagma ρ t)
            funext n
            exact hgen n

          /--
          Once the retained semantic world is generated by its supplied variables,
          the previously established extension into every Γ-model is unique.
          This is the free-algebra universal property on the chosen generators.
          -/
          theorem unique_lift
              {Γ : Ctx Nat} (C : Certificate Γ)
              (hgenerated : C.Generated)
              {G : Type} [Magma G]
              (hΓ : G ⊧ Γ) (ρ : Nat → G) :
              ∃! f : @MagmaHom C.Carrier G C.instMagma inferInstance,
                ∀ n, f (C.gen n) = ρ n := by
            let f := C.lift hΓ ρ
            refine ⟨f, C.lift_gen hΓ ρ, ?_⟩
            intro g hg
            apply C.hom_ext_on_generators hgenerated g f
            intro n
            exact (hg n).trans (C.lift_gen hΓ ρ n).symm

          theorem free_world_decides_all_consequences
              {Γ : Ctx Nat} (C : Certificate Γ)
              (_hgenerated : C.Generated)
              (F : NatMagmaLaw) :
              Γ ⊧ F ↔ C.canonical F.lhs = C.canonical F.rhs :=
            C.models_iff_canonical_eq F

          #print axioms hom_canonical
          #print axioms hom_ext_on_generators
          #print axioms unique_lift
          #print axioms free_world_decides_all_consequences

          end SemanticCompiler.Certificate
          end GeneratedSemanticWorld
          LEAN

      - name: Kernel check
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/etp
          lake env lean GeneratedSemanticWorld.lean 2>&1 | tee /tmp/generated.log
          ! grep -q sorryAx /tmp/generated.log
          ! grep -q _native.native_decide /tmp/generated.log
          grep -q SemanticCompiler.Certificate.unique_lift /tmp/generated.log
          echo GENERATED_SEMANTIC_WORLD_UNIVERSAL_PROPERTY_PASS

      - name: Publish authority
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/out
          cp /tmp/etp/GeneratedSemanticWorld.lean /tmp/out/
          cp /tmp/generated.log /tmp/out/
          cat > /tmp/out/AUTHORITY.json <<'JSON'
          {
            "claim": "A consequence-complete semantic compiler world that is generated by its variables has the unique generator-preserving homomorphism property into every Γ-model: the free-algebra universal property.",
            "etp_commit": "bb5a9b5fe78c376ce1725529f235f8d574630b9f",
            "interpretation": "dream endpoint = develop a free semantic world for the theory; consequence becomes equality in that world",
            "trust_guards": ["no sorryAx","no _native.native_decide"]
          }
          JSON
          sha256sum /tmp/out/* | tee /tmp/out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: etp-generated-semantic-world-v1
          path: /tmp/out/
