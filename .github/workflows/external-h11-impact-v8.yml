name: External H11 Impact V8
on:
  push:
    branches:
      - research/h11-impact-independence-v8-20261022
  pull_request:
    paths:
      - 'research/h11_impact_v8/**'
      - '.github/workflows/external-h11-impact-v8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-external-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact independent H11 source
        uses: actions/checkout@v4
        with:
          repository: python-hyper/h11
          ref: 62c5068c971579d61fa1b55373390e12f25fd856
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upstream test requirements
        run: |
          python -m pip install pytest==9.0.3
          python -m pip install -e ./upstream
      - name: Run authentic source change, native mutation, and coverage-aware selector
        run: |
          python -m py_compile research/h11_impact_v8/experiment.py research/h11_impact_v8/trace_test.py
          python research/h11_impact_v8/experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-h11-impact-v8-evidence
          path: research/h11_impact_v8/result.json
          if-no-files-found: warn
