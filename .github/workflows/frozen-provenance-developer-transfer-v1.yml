name: Frozen provenance developer transfer v1

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/frozen-provenance-developer-transfer-v1.yml'
  workflow_dispatch:

jobs:
  develop:
    strategy:
      fail-fast: false
      matrix:
        orientation: [original, opposite]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Run frozen residual-driven developer
        env:
          ORIENTATION: ${{ matrix.orientation }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from functools import lru_cache
          from collections import defaultdict
          import os,json,pathlib

          orientation=os.environ['ORIENTATION']
          E=('e',)
          def K(a):return ('k',a)
          def P(a,b):return ('p',a,b)
          def Q(a,b):return ('q',a,b)
          def R(a,b):return ('r',a,b)
          def sz(t):
            if t[0]=='e':return 0
            if t[0]=='k':return sz(t[1])+1
            return sz(t[1])+sz(t[2])+2
          def st(t):
            if t[0]=='e':return 'e'
            if t[0]=='k':return 'k('+st(t[1])+')'
            return t[0]+'('+st(t[1])+','+st(t[2])+')'
          def r0(a,b):
            if b[0]=='p' and b[1]==a:
              t=b[2]
              if t[0]=='p':
                l,r=t[1],t[2]
                if l[0]=='p' and r[0]=='p' and r[2]==a and l[2]==r[1]:return l[2]
          def r1(a,b):
            if b[0]=='p' and b[2]==a:return R(a,b[1])
          def r2(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2][0]=='q' and t[2][2]==a:return t[2][1]
          def r3(a,b):
            if b[0]=='q' and b[1]==a:
              t=b[2]
              if t[0]=='q' and t[2]==a:return Q(a,Q(a,Q(t[1],a)))
          def r4(a,b):
            if b==Q(a,a):return Q(a,Q(a,a))
          def r5(a,b):
            if a[0]=='q' and b[0]=='q' and b[1]==a:return a[1]
          def r6(a,b):return Q(a,b)
          rules=[r0,r1,r2,r3,r4,r5,r6]
          @lru_cache(None)
          def base_ev(a,b):
            for r in rules:
              o=r(a,b)
              if o is not None:return o
            raise AssertionError
          def ev(a,b):
            return base_ev(a,b) if orientation=='original' else base_ev(b,a)

          def blockedQ(a,b):return r0(a,b) is not None or r2(a,b) is not None
          def blockedR(a,b):return r0(a,b) is not None or r2(a,b) is not None or r5(a,b) is not None
          @lru_cache(None)
          def nf(t):
            if t[0]=='e':return True
            if t[0]=='k':return nf(t[1])
            if t[0]=='p':return False
            if t[0]=='q':return nf(t[1]) and nf(t[2]) and not blockedQ(t[1],t[2])
            if t[0]=='r':return nf(t[1]) and nf(t[2]) and not blockedR(t[1],t[2])
            return False
          def erase(t):
            if t[0]=='e':return ('v',0)
            if t[0]=='k':return ('v',sz(t))
            if t[0] in ('p','q'):return ('f',erase(t[1]),erase(t[2]))
            if t[0]=='r':return ('f',erase(t[1]),('f',erase(t[2]),erase(t[1]))
            )
          @lru_cache(None)
          def abstraction(t,d):
            ext=erase(t)
            if d==0:return ('ext',ext)
            if t[0]=='e':return ('prov',ext,'e')
            if t[0]=='k':return ('prov',ext,'k',abstraction(t[1],d-1))
            return ('prov',ext,t[0],abstraction(t[1],d-1),abstraction(t[2],d-1))

          by={0:{E}}
          for n in range(1,7):
            cur={K(x) for x in by.get(n-1,set())}
            for i in range(n-1):
              j=n-2-i
              for a in by.get(i,set()):
                for b in by.get(j,set()):
                  for t in (Q(a,b),R(a,b)):
                    if nf(t):cur.add(t)
            by[n]=cur
          states=sorted(set().union(*by.values()),key=lambda t:(sz(t),st(t)))
          contexts=[t for t in states if sz(t)<=4]

          def verify(depth):
            buckets=defaultdict(list)
            for t in states:buckets[abstraction(t,depth)].append(t)
            for xs in buckets.values():
              if len(xs)<2:continue
              for i in range(len(xs)):
                for j in range(i+1,len(xs)):
                  a,b=xs[i],xs[j]
                  for c in contexts:
                    oa,ob=ev(a,c),ev(b,c)
                    if abstraction(oa,depth)!=abstraction(ob,depth):
                      return False,{'side':'right','a':st(a),'b':st(b),'c':st(c),
                                   'out_a':st(oa),'out_b':st(ob)}
                    oa,ob=ev(c,a),ev(c,b)
                    if abstraction(oa,depth)!=abstraction(ob,depth):
                      return False,{'side':'left','a':st(a),'b':st(b),'c':st(c),
                                   'out_a':st(oa),'out_b':st(ob)}
            return True,None

          # FROZEN CONTROLLER: no law- or orientation-specific branching.
          history=[]
          admitted=None
          for depth in range(6):
            ok,residual=verify(depth)
            history.append({'depth':depth,'pass':ok,'residual':residual})
            print('VERIFY_DEPTH',depth,'PASS',ok)
            if residual:print('RESIDUAL',json.dumps(residual))
            if ok:
              admitted=depth
              break
          assert admitted is not None
          print('ADMITTED_DEPTH',admitted)
          # causal/minimality ablation: immediately weaker retained state must fail.
          if admitted>0:
            weak_ok,weak_residual=verify(admitted-1)
            assert not weak_ok
            print('REMOVAL_ABLATION_DEPTH',admitted-1,'PASS_REJECTED',not weak_ok)
          else:
            weak_residual=None
          out={'orientation':orientation,'state_count':len(states),'context_count':len(contexts),
               'admitted_depth':admitted,'history':history,
               'removal_ablation_residual':weak_residual}
          pathlib.Path('/tmp/result.json').write_text(json.dumps(out,indent=2))
          PY

      - name: Assert prospective transfer criterion
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/result.json'))
          assert d['admitted_depth']==2, d
          assert d['history'][0]['pass'] is False
          assert d['history'][1]['pass'] is False
          assert d['history'][2]['pass'] is True
          print('FROZEN_PROVENANCE_DEVELOPER_TRANSFER_PASS',d['orientation'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: frozen-provenance-developer-${{ matrix.orientation }}-v1
          path: /tmp/result.json
