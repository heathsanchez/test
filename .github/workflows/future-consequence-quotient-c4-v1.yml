name: Future Consequence Quotient C4 V1

on:
  workflow_dispatch:
  push:
    branches: [future-consequence-quotient-c4-v1]
    paths:
      - 'experiments/future_consequence_quotient_c4_v1/**'
      - '.github/workflows/future-consequence-quotient-c4-v1.yml'

jobs:
  theorem:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify generic kernel
        run: |
          lean experiments/future_consequence_quotient_c4_v1/FutureConsequenceKernel.lean 2>&1 | tee /tmp/kernel.log
          ! grep -q sorry /tmp/kernel.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-consequence-kernel-lean
          path: /tmp/kernel.log
          retention-days: 90

  c4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen C4 repair qualification
        run: python experiments/future_consequence_quotient_c4_v1/run.py
      - name: Freeze hashes
        run: |
          cd experiments/future_consequence_quotient_c4_v1
          sha256sum PROTOCOL.md FutureConsequenceKernel.lean run.py results/evidence.json results/future_trace.json > results/SHA256SUMS
          git rev-parse HEAD > results/RUN_COMMIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-consequence-quotient-c4-v1
          path: experiments/future_consequence_quotient_c4_v1/results
          retention-days: 90
