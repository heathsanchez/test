name: G2 V3 exposed residual-string witness selector and native finite composition
on:
  push:
    branches:
      - research/g2-deerflow-residual-witness-v3-20261019
    paths:
      - .github/workflows/g2-deer-residual-witness-v3.yml
      - research/unified_consequence_runtime/G2_DEER_RESIDUAL_WITNESS_V3_PRE_NATIVE.json
      - research/unified_consequence_runtime/test_g2_deer_residual_witness_v3.py
      - research/unified_consequence_runtime/g2_deer_residual_witness_v3.py
      - research/unified_consequence_runtime/g2_deer_v3_native_receipt_independent_audit_v1.py
      - research/unified_consequence_runtime/G2_DEER_V3_INDEPENDENT_AUDIT_MANIFEST.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  precommitted-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original frozen V2 algorithm and new pre-native discriminator protocol
        shell: bash
        run: |
          set -euo pipefail
          cmp research/unified_consequence_runtime/G2_DEER_RESIDUAL_WITNESS_V3_PRE_NATIVE.json \
            <(git show 8668a7621533254e9ae939ba6266438bf1ba4057:research/unified_consequence_runtime/G2_DEER_RESIDUAL_WITNESS_V3_PRE_NATIVE.json)
          cmp research/unified_consequence_runtime/g2_deer_import_composition_v2.py \
            <(git show 45f5b07cde363d9716a76e94c2fdcdb50f8c094e:research/unified_consequence_runtime/g2_deer_import_composition_v2.py)
      - name: Run original 18 plus 8 new residual-choice controls
        run: python -B -m unittest -v research.unified_consequence_runtime.test_g2_deer_import_composition_v2 research.unified_consequence_runtime.test_g2_deer_residual_witness_v3
  exposed-source-native:
    needs: precommitted-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.1'
      - name: Run original authenticated author tests through pre-frozen witness filter, full finite masks and physical ablation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN python -B -m research.unified_consequence_runtime.g2_deer_residual_witness_v3 evidence/g2-deer-v3-exposed
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/g2-deer-v3-exposed/RESULT.json').read_text())
          assert r['science']=='EXPOSED_ONLY_NOT_G2'
          assert r['G2']==r['G4']=='UNKNOWN'
          assert r['original_future_status']=='OPENED_PRIOR_TO_THIS_EXPERIMENT'
          assert r['status']!='UNKNOWN_EXECUTION_APPARATUS',r.get('error')
          print('V3_NATIVE_SCIENTIFIC_STATUS',r['status'],'G2',r['G2'])
          PY
      - name: Preserve original and every native JUnit receipt even if RED or UNKNOWN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-v3-original-source-residual-choice-subset-evidence
          retention-days: 90
          path: evidence/g2-deer-v3-exposed/
          if-no-files-found: warn

  independently-reconstruct-every-native-source-mask:
    needs: exposed-source-native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: g2-v3-original-source-residual-choice-subset-evidence
          path: evidence/g2-deer-v3-exposed
      - name: Independently pin author test and producer source, without rerunning repaired tests
        shell: bash
        run: |
          set -euo pipefail
          cmp research/unified_consequence_runtime/g2_deer_residual_witness_v3.py \
            <(git show 0b1760d14caca27a55aadfa1450898bcd7cec5fd:research/unified_consequence_runtime/g2_deer_residual_witness_v3.py)
          cmp research/unified_consequence_runtime/g2_deer_import_composition_v2.py \
            <(git show 45f5b07cde363d9716a76e94c2fdcdb50f8c094e:research/unified_consequence_runtime/g2_deer_import_composition_v2.py)
          cmp research/unified_consequence_runtime/G2_DEER_V3_INDEPENDENT_AUDIT_MANIFEST.json \
            <(git show cf60b46b544201b6cd86e220c0979cee587da192:research/unified_consequence_runtime/G2_DEER_V3_INDEPENDENT_AUDIT_MANIFEST.json)
          python -B -m py_compile research/unified_consequence_runtime/g2_deer_v3_native_receipt_independent_audit_v1.py
      - name: Rebuild original Git source, all strict regex patches and every native JUnit protected case
        shell: bash
        run: |
          set -euo pipefail
          python -B research/unified_consequence_runtime/g2_deer_v3_native_receipt_independent_audit_v1.py evidence/g2-deer-v3-exposed
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('evidence/g2-deer-v3-exposed/INDEPENDENT_AUDIT.json').read_text())
          assert a['status']=='WARRANTED_BOUNDED_EXPOSED_IMPORT_DERIVED_NATIVE_FINITE_COMPOSITION'
          assert a['complete_native_subset_masks']==4 and a['full_author_passed']==83
          assert a['G2']==a['G4']=='UNKNOWN'
          PY
      - name: Preserve independent source/JUnit audit, including negative failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-deer-v3-same-run-independent-source-audit
          retention-days: 90
          path: |
            evidence/g2-deer-v3-exposed/
            research/unified_consequence_runtime/g2_deer_v3_native_receipt_independent_audit_v1.py
          if-no-files-found: warn
