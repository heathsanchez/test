name: G2 Deer-flow V3 independent original Git and finite native JUnit audit
on:
  push:
    branches:
      - research/g2-deerflow-v3-independent-receipt-audit-20261019
    paths:
      - .github/workflows/g2-deer-v3-independent-audit.yml
      - research/unified_consequence_runtime/g2_deer_v3_native_receipt_independent_audit_v1.py
      - research/unified_consequence_runtime/G2_DEER_V3_INDEPENDENT_AUDIT_MANIFEST.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-audit-original-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: g2-v3-original-source-residual-choice-subset-evidence
          run-id: 39167546376
          github-token: \${{ github.token }}
          path: evidence/g2-deer-v3-exposed
      - name: Verify exact external science source and immutable independent acceptance authority
        shell: bash
        run: |
          set -euo pipefail
          cmp research/unified_consequence_runtime/G2_DEER_V3_INDEPENDENT_AUDIT_MANIFEST.json \
              <(git show cf60b46b544201b6cd86e220c0979cee587da192:research/unified_consequence_runtime/G2_DEER_V3_INDEPENDENT_AUDIT_MANIFEST.json)
          cmp research/unified_consequence_runtime/g2_deer_residual_witness_v3.py \
              <(git show 0b1760d14caca27a55aadfa1450898bcd7cec5fd:research/unified_consequence_runtime/g2_deer_residual_witness_v3.py)
          cmp research/unified_consequence_runtime/g2_deer_import_composition_v2.py \
              <(git show 45f5b07cde363d9716a76e94c2fdcdb50f8c094e:research/unified_consequence_runtime/g2_deer_import_composition_v2.py)
          python -B -m py_compile research/unified_consequence_runtime/g2_deer_v3_native_receipt_independent_audit_v1.py
      - name: Independently reconstruct source edit and all actual original native JUnit subset consequences
        shell: bash
        run: |
          set -euo pipefail
          python -B research/unified_consequence_runtime/g2_deer_v3_native_receipt_independent_audit_v1.py evidence/g2-deer-v3-exposed
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('evidence/g2-deer-v3-exposed/INDEPENDENT_AUDIT.json').read_text())
          assert d['status']=='WARRANTED_BOUNDED_EXPOSED_IMPORT_DERIVED_NATIVE_FINITE_COMPOSITION'
          assert d['G2']==d['G4']=='UNKNOWN'
          assert d['complete_native_subset_masks']==4
          assert d['full_author_passed']==83
          assert d['causal_source_edits']==2
          PY
      - name: Archive independent read-only certificate and original raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-deerflow-v3-independent-source-native-receipt-audit
          retention-days: 90
          path: |
            evidence/g2-deer-v3-exposed/
            research/unified_consequence_runtime/g2_deer_v3_native_receipt_independent_audit_v1.py
          if-no-files-found: warn
