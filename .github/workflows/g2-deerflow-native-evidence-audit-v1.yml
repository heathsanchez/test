name: G2 source-distinct Deer-flow original native evidence independent audit
on:
  push:
    branches:
      - research/g2-native-receipt-audit-v1-20261019
    paths:
      - .github/workflows/g2-deerflow-native-evidence-audit-v1.yml
      - research/unified_consequence_runtime/g2_deerflow_native_receipt_audit_v1.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-original-author-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact prior original native receipt archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/g2-deerflow-independent-native
          curl --fail --location --silent --show-error --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output evidence/g2-deerflow-independent-native/original.zip \
            https://api.github.com/repos/heathsanchez/test/actions/artifacts/12149513902/zip
      - name: Independently audit ZIP JUnit role frozen source code and uv lock without rerunning original tests
        run: |
          set -euo pipefail
          python -B research/unified_consequence_runtime/g2_deerflow_native_receipt_audit_v1.py \
            evidence/g2-deerflow-independent-native/original.zip \
            evidence/g2-deerflow-independent-native/INDEPENDENT_AUDIT.json
          python - <<'PY'
          import json
          d=json.load(open('evidence/g2-deerflow-independent-native/INDEPENDENT_AUDIT.json'))
          assert d['status']=='WARRANTED_BOUNDED_AUTHENTIC_FUTURE_FAILURE_WITH_UNRUN_METHOD'
          assert d['original_failures']==2 and d['original_passes']==2
          assert d['G2']=='UNKNOWN'
          PY
      - name: Archive independent read-only evidence and source identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-deerflow-original-native-independent-receipt
          path: evidence/g2-deerflow-independent-native/
          retention-days: 90
          if-no-files-found: warn
