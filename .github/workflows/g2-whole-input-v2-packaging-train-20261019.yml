name: G2 whole-input regex V2 - Packaging training before schedule source
on:
  push:
    branches:
      - research/g2-regex-boundary-schedule-transfer-20261019
    paths:
      - .github/workflows/g2-whole-input-v2-packaging-train-20261019.yml
permissions:
  contents: read
jobs:
  pretrained-boundary-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen metadata-future and byte-source preflight
        run: |
          set -euo pipefail
          F=research/unified_consequence_runtime/
          git merge-base --is-ancestor d659a652607b82fe79adf77f4582408602c5d951 HEAD
          cmp "$F"g2_whole_input_regex_syntax_v2.py <(git show 21008fedf462ebd3ffc9b616f7c06d355c70abbe:"$F"g2_whole_input_regex_syntax_v2.py)
          cmp "$F"g2_packaging_whole_input_v2_train.py <(git show 418a0fa5e662bb8465f0032fdbb6b8a77a1cb497:"$F"g2_packaging_whole_input_v2_train.py)
          cmp "$F"g2_packaging_boundary_genesis_v1.py <(git show e78097f11a83564684acdbc68f8e822aef495b25:"$F"g2_packaging_boundary_genesis_v1.py)
          python -B -m py_compile "$F"g2_whole_input_regex_syntax_v2.py "$F"g2_packaging_whole_input_v2_train.py
          mkdir -p evidence/g2-regex-v2-packaging-train
          echo 'FUTURE dbader/schedule PR666 ORIGINAL_SOURCE_UNOPENED; METADATA_ONLY' > evidence/g2-regex-v2-packaging-train/FUTURE_SEAL.txt
          sha256sum "$F"g2_whole_input_regex_syntax_v2.py > evidence/g2-regex-v2-packaging-train/GENERATOR_SHA256.txt
          git rev-parse HEAD > evidence/g2-regex-v2-packaging-train/HEAD.txt
      - name: Independent source-native original failure and prospective syntax-V2 generation
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -B research/unified_consequence_runtime/g2_packaging_whole_input_v2_train.py "$GITHUB_WORKSPACE/evidence/g2-regex-v2-packaging-train/training"
      - name: No false future claim
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/g2-regex-v2-packaging-train')
          o=p/'training/RESULT.json'
          r=json.loads(o.read_text()) if o.is_file() else {}
          assert (p/'FUTURE_SEAL.txt').is_file()
          assert r.get('future','SCHEDULE_SEALED_UNOPENED')=='SCHEDULE_SEALED_UNOPENED'
          assert not r.get('future_source_visited',False)
          assert r.get('G2','UNKNOWN')=='UNKNOWN'
          s={'status':r.get('status','UNKNOWN_NO_RESULT'),
             'train_candidate_count':len(r.get('candidates',[])),
             'future':'SCHEDULE_SEALED_UNOPENED','G2':'UNKNOWN',
             'archive_audit':'NOT_EXECUTED'}
          (p/'BOUNDARY.json').write_text(json.dumps(s,indent=2)+'\n')
          print(json.dumps(s))
          if r.get('status') in ('UNKNOWN_TRAINING_APPARATUS','UNKNOWN_NO_RESULT','UNKNOWN_TRAINING_NATIVE_NOT_ADMITTED'):
              raise SystemExit('UNKNOWN_APPARATUS')
          PY
      - name: Preserve native logs and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-regex-v2-packaging-training-before-schedule
          retention-days: 90
          if-no-files-found: warn
          path: |
            evidence/g2-regex-v2-packaging-train/
            research/unified_consequence_runtime/G2_REGEX_BOUNDARY_SCHEDULE_MATCHED_V1_FROZEN_PROTOCOL.md
            research/unified_consequence_runtime/g2_whole_input_regex_syntax_v2.py
            research/unified_consequence_runtime/g2_packaging_whole_input_v2_train.py
