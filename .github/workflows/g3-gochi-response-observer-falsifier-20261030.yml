name: G3 go-chi native operation-grammar falsifier (preregistered 2026-10-30)
on:
  push:
    branches: [research/g3-gochi-response-observer-falsifier-20261030]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native-operator-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Freeze and verify source identities before native inspection
        shell: bash
        run: |
          set -euo pipefail
          OLD_SHA=ae6be7469132cf471ca099d8c7bda4010c4ff7b2
          HEAD_SHA=562e4d80c1b198e95418fd1598949a0fe478a2a1
          git clone -q --no-checkout https://github.com/go-chi/chi.git "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" fetch -q origin refs/pull/1174/head:refs/pull/1174/head
          test "$(git -C "$RUNNER_TEMP/source" rev-parse refs/pull/1174/head)" = "$HEAD_SHA"
          git -C "$RUNNER_TEMP/source" cat-file -e "$OLD_SHA^{commit}"
          git -C "$RUNNER_TEMP/source" worktree add -q --detach "$RUNNER_TEMP/base" "$OLD_SHA"
          git -C "$RUNNER_TEMP/source" worktree add -q --detach "$RUNNER_TEMP/head" "$HEAD_SHA"
          test "$(git -C "$RUNNER_TEMP/base" rev-parse HEAD)" = "$OLD_SHA"
          test "$(git -C "$RUNNER_TEMP/head" rev-parse HEAD)" = "$HEAD_SHA"
          echo "PINNED_ORIGINAL_A=$OLD_SHA"
          echo "PINNED_CONTRIBUTOR_A=$HEAD_SHA"
      - name: Run unchanged preexisting typed Go source method
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go run research/mgcheck_nonregex_20261015/nonregex_method.go \
            --old "$RUNNER_TEMP/base" --head "$RUNNER_TEMP/head" \
            --old-sha ae6be7469132cf471ca099d8c7bda4010c4ff7b2 \
            --head-sha 562e4d80c1b198e95418fd1598949a0fe478a2a1 \
            --out g3-gochi-A-result.json > g3-gochi-A-log.txt
          code=$?
          set -e
          echo "FROZEN_OLD_OPERATION_EXIT=$code"
          test -f g3-gochi-A-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("g3-gochi-A-result.json").read_text())
          assert data["schema"]=="mgcheck.nonregex-source-program-synthesis.v1"
          assert data["source_identity"]=="EXACT_NATIVE_GIT_HEAD_CHECKED"
          assert data["old_sha"]=="ae6be7469132cf471ca099d8c7bda4010c4ff7b2"
          assert data["head_sha"]=="562e4d80c1b198e95418fd1598949a0fe478a2a1"
          assert data["L7"]=="UNKNOWN_METHOD_LANGUAGE_NOT_INVENTED"
          accepted={
              "REJECTED_NO_CHANGED_SOURCE_FUNCTION",
              "UNKNOWN_NO_NATIVE_SEPARATOR",
              "WARRANTED_BOUNDED_NONREGEX_NATIVE_DIVERGENCE",
          }
          assert data["status"] in accepted, data["status"]
          if data["status"]=="REJECTED_NO_CHANGED_SOURCE_FUNCTION":
              assert data["changed_string_input_functions"]==0
              assert data["native_function_executions"]==0
          print("FROZEN_OLD_METHOD_STATUS="+data["status"])
          print("CHANGED_ELIGIBLE_FUNCTIONS=",data.get("changed_string_input_functions"))
          print("CANDIDATE_PROGRAMS=",data.get("attempted_programs"))
          print("NATIVE_FUNCTION_EXECUTIONS=",data.get("native_function_executions"))
          print("NEW_OPERATION_INVENTION=UNKNOWN_NOT_ATTEMPTED")
          print("PROSPECTIVE_G3=UNKNOWN_NOT_ESTABLISHED")
          PY
      - name: Wrong source pin refuses admission
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go run research/mgcheck_nonregex_20261015/nonregex_method.go \
            --old "$RUNNER_TEMP/base" --head "$RUNNER_TEMP/head" \
            --old-sha ae6be7469132cf471ca099d8c7bda4010c4ff7b2 \
            --head-sha 0000000000000000000000000000000000000000 \
            --out g3-gochi-A-wrong-sha.json > /dev/null
          code=$?
          set -e
          test "$code" -ne 0
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("g3-gochi-A-wrong-sha.json").read_text())
          assert data["status"]=="UNKNOWN_SOURCE_IDENTITY",data
          print("WRONG_SOURCE_SHA_RETURNED_UNKNOWN")
          PY
      - name: Run frozen future-relative protocol quotient on native original and contributor
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP/base"
            go run "$GITHUB_WORKSPACE/research/g3_http_protocol_v1/protocol_probe.go" --out "$GITHUB_WORKSPACE/g3-gochi-A-protocol-base.json"
          ) > g3-gochi-A-protocol-base.log
          (
            cd "$RUNNER_TEMP/head"
            go run "$GITHUB_WORKSPACE/research/g3_http_protocol_v1/protocol_probe.go" --out "$GITHUB_WORKSPACE/g3-gochi-A-protocol-head.json"
          ) > g3-gochi-A-protocol-head.log
          python - <<'PY'
          import json
          from pathlib import Path
          for kind in ("base", "head"):
              r=json.loads(Path(f"g3-gochi-A-protocol-{kind}.json").read_text())
              assert r["schema"]=="mgcheck.http-writer-protocol-future-quotient.v1"
              assert r["injected_observer"] is False
              assert len(r["families"])==3
              assert all(f["prefixes"]>0 and f["reference_classes"]>0 for f in r["families"])
              print("NATIVE_PROTOCOL",kind,"VIOLATING_EQUIVALENCE_CLASSES",r["total_violating_classes"])
              print("DIRECT_BASELINE",kind,[(f["carrier"],f["direct_mismatches"],f["downstream_only_mismatches"],f["direct_trace_count"],f["direct_first_mismatch"]) for f in r["families"]])
              for f in r["families"]:
                  print("NATIVE_PROTOCOL_FAMILY",kind,f["carrier"],f["violating_classes"],f["witnesses"][:1])
          print("HUMAN_DECLARED_GRAMMAR=NOT_AUTONOMOUS_INVENTION")
          print("G3_STRICT=UNKNOWN")
          PY
      - name: Deliberately corrupted observer must create quotient violation
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP/head"
            go run "$GITHUB_WORKSPACE/research/g3_http_protocol_v1/protocol_probe.go" --inject-bad-observer --out "$GITHUB_WORKSPACE/g3-gochi-A-protocol-control.json"
          ) > g3-gochi-A-protocol-control.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("g3-gochi-A-protocol-control.json").read_text())
          assert r["schema"]=="mgcheck.http-writer-protocol-future-quotient.v1"
          assert r["injected_observer"] is True
          assert r["status"]=="INJECTED_OBSERVER_NEGATIVE_CONTROL_ONLY"
          assert r["total_violating_classes"]>0,r
          print("CORRUPTED_ORACLE_REJECTED=YES")
          PY
      - name: Independent correct and defective wrappers challenge the same checker
        shell: bash
        run: |
          set -euo pipefail
          for mode in toy_good toy_bad_flush toy_bad_empty_readerfrom; do
            (
              cd "$RUNNER_TEMP/head"
              go run "$GITHUB_WORKSPACE/research/g3_http_protocol_v1/protocol_probe.go" --wrapper-mode "$mode" --out "$GITHUB_WORKSPACE/g3-gochi-A-${mode}.json"
            ) > "g3-gochi-A-${mode}.log"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          data={}
          for mode in ("toy_good","toy_bad_flush","toy_bad_empty_readerfrom"):
              r=json.loads(Path(f"g3-gochi-A-{mode}.json").read_text())
              assert r["schema"]=="mgcheck.http-writer-protocol-future-quotient.v1"
              assert r["wrapper_mode"]==mode and r["injected_observer"] is False
              data[mode]=r
              print("INDEPENDENT_TOY",mode,"VIOLATING_CLASSES",r["total_violating_classes"],"DIRECT_BASELINE_MISMATCHES",sum(f["direct_mismatches"] for f in r["families"]),"DOWNSTREAM_ONLY_MISMATCHES",sum(f["downstream_only_mismatches"] for f in r["families"]))
          assert data["toy_good"]["total_violating_classes"]==0,"false-positive on good toy"
          assert sum(f["direct_mismatches"] for f in data["toy_good"]["families"])==0,"false-positive from simple baseline on good toy"
          assert sum(f["downstream_only_mismatches"] for f in data["toy_good"]["families"])==0,"false-positive downstream on good toy"
          assert data["toy_bad_flush"]["total_violating_classes"]>0,"missed flush bug"
          assert sum(f["direct_mismatches"] for f in data["toy_bad_flush"]["families"])>0,"simple baseline missed flush bug"
          assert data["toy_bad_empty_readerfrom"]["total_violating_classes"]>0,"missed empty-read bug"
          assert sum(f["direct_mismatches"] for f in data["toy_bad_empty_readerfrom"]["families"])>0,"simple baseline missed empty-read bug"
          print("SAME_ENGINE_INDEPENDENT_CONTROLS_PASS=YES")
          PY
      - name: Independent native witness replay and forged-witness rejection
        shell: bash
        run: |
          set -euo pipefail
          for kind in base head; do
            (
              cd "$RUNNER_TEMP/$kind"
              go run "$GITHUB_WORKSPACE/research/g3_http_protocol_v1/protocol_replay.go" --input "$GITHUB_WORKSPACE/g3-gochi-A-protocol-${kind}.json"
            ) > "g3-gochi-A-replay-${kind}.log"
            sed -n '1,3p' "g3-gochi-A-replay-${kind}.log"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("g3-gochi-A-protocol-base.json").read_text())
          for fam in data["families"]:
              if fam["witnesses"]:
                  w=fam["witnesses"][0]
                  w["second_trace"]=w["first_trace"]
                  break
          else:
              raise AssertionError("no genuine original witness")
          Path("g3-gochi-A-forged-witness.json").write_text(json.dumps(data))
          PY
          set +e
          (
            cd "$RUNNER_TEMP/base"
            go run "$GITHUB_WORKSPACE/research/g3_http_protocol_v1/protocol_replay.go" --input "$GITHUB_WORKSPACE/g3-gochi-A-forged-witness.json"
          ) > g3-gochi-A-forged-replay.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q FORGED_ g3-gochi-A-forged-replay.log
          echo "FORGED_WITNESS_REJECTED=YES"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-gochi-A-frozen-old-grammar-falsifier
          path: |
            g3-gochi-A-result.json
            g3-gochi-A-log.txt
            g3-gochi-A-wrong-sha.json
            g3-gochi-A-protocol-*.json
            g3-gochi-A-protocol-*.log
            g3-gochi-A-toy_*.json
            g3-gochi-A-toy_*.log
            g3-gochi-A-replay-*.log
            g3-gochi-A-forged-witness.json
            g3-gochi-A-forged-replay.log
          if-no-files-found: warn

  future-quotient-transfer-C:
    name: Frozen HTTP protocol grammar transfer to preregistered C
    needs: native-operator-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Pin C original and contributor before source-native execution
        shell: bash
        run: |
          set -euo pipefail
          OLD_SHA=167e1e3bd039d060696b99c8da4e876ae04f42c1
          HEAD_SHA=0599655dced847a1095e9031c619c772f7a7ef63
          git clone -q --no-checkout https://github.com/go-chi/chi.git "$RUNNER_TEMP/source-C"
          git -C "$RUNNER_TEMP/source-C" fetch -q origin refs/pull/1213/head:refs/pull/1213/head
          test "$(git -C "$RUNNER_TEMP/source-C" rev-parse refs/pull/1213/head)" = "$HEAD_SHA"
          git -C "$RUNNER_TEMP/source-C" cat-file -e "$OLD_SHA^{commit}"
          git -C "$RUNNER_TEMP/source-C" worktree add -q --detach "$RUNNER_TEMP/base-C" "$OLD_SHA"
          git -C "$RUNNER_TEMP/source-C" worktree add -q --detach "$RUNNER_TEMP/head-C" "$HEAD_SHA"
          test "$(git -C "$RUNNER_TEMP/base-C" rev-parse HEAD)" = "$OLD_SHA"
          test "$(git -C "$RUNNER_TEMP/head-C" rev-parse HEAD)" = "$HEAD_SHA"
          echo "PREREG_C_BASE_SHA=$OLD_SHA"
          echo "PREREG_C_HEAD_SHA=$HEAD_SHA"
          echo "SOURCE_PATCH_INSPECTION=NOT_PERFORMED"
      - name: Transfer frozen operation, observers and trace bounds unchanged
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP/base-C"
            go run "$GITHUB_WORKSPACE/research/g3_http_protocol_v1/protocol_probe.go" --out "$GITHUB_WORKSPACE/g3-gochi-C-base.json"
          ) > g3-gochi-C-base.log
          (
            cd "$RUNNER_TEMP/head-C"
            go run "$GITHUB_WORKSPACE/research/g3_http_protocol_v1/protocol_probe.go" --out "$GITHUB_WORKSPACE/g3-gochi-C-head.json"
          ) > g3-gochi-C-head.log
          python - <<'PY'
          import json
          from pathlib import Path
          for kind in ("base","head"):
              r=json.loads(Path(f"g3-gochi-C-{kind}.json").read_text())
              assert r["schema"]=="mgcheck.http-writer-protocol-future-quotient.v1"
              assert r["wrapper_mode"]=="native" and r["injected_observer"] is False
              assert len(r["families"])==3
              assert all(f["prefixes"]>0 and f["reference_classes"]>0 for f in r["families"])
              print("FROZEN_C",kind,"VIOLATING_CLASSES",r["total_violating_classes"])
              print("DIRECT_BASELINE_C",kind,[(f["carrier"],f["direct_mismatches"],f["downstream_only_mismatches"],f["direct_trace_count"],f["direct_first_mismatch"]) for f in r["families"]])
              for f in r["families"]:
                  print("FROZEN_C_FAMILY",kind,f["carrier"],f["violating_classes"])
                  for w in f["witnesses"][:4]:
                      print("FROZEN_C_WITNESS",kind,f["carrier"],w)
          print("C_PR_TITLES_KNOWN=YES")
          print("G3_OPERATION_GRAMMAR_INVENTION=UNKNOWN")
          PY
      - name: Independent native replay of C original witness and C contributor
        shell: bash
        run: |
          set -euo pipefail
          for kind in base head; do
            (
              cd "$RUNNER_TEMP/${kind}-C"
              go run "$GITHUB_WORKSPACE/research/g3_http_protocol_v1/protocol_replay.go" --input "$GITHUB_WORKSPACE/g3-gochi-C-${kind}.json"
            ) > "g3-gochi-C-replay-${kind}.log"
            sed -n '1,3p' "g3-gochi-C-replay-${kind}.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-gochi-C-frozen-protocol-transfer
          path: |
            g3-gochi-C-*.json
            g3-gochi-C-*.log
          if-no-files-found: warn
