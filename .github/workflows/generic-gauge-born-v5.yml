name: Generic Gauge Born V5

on:
  push:
    branches: [generic-gauge-born-v5]
    paths:
      - "experiments/generic_gauge_born_v5/**"
      - ".github/workflows/generic-gauge-born-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generic-gauge-born-v5
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Checkout experiment

      - uses: actions/checkout@v4
        name: Checkout frozen QLF
        with:
          repository: rchain-community/quantum-logical-framework
          ref: 888a4303846000ace1c7ef4c62a8d3e99110d979
          path: vendor/QLF

      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build pinned QLF StateSpace dependency surface
        working-directory: vendor/QLF
        run: |
          set -euo pipefail
          lake exe cache get
          lake build QLF_StateSpace

      - name: Compile generic quotient capability
        run: |
          set -euo pipefail
          cp experiments/generic_gauge_born_v5/MathGraphGenericGauge.lean             vendor/QLF/lean/MathGraphGenericGauge.lean
          cd vendor/QLF
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/MathGraphGenericGauge.olean             lean/MathGraphGenericGauge.lean

      - name: Ablation must fail without generic capability
        run: |
          set -euo pipefail
          cp vendor/QLF/lean/QLF_StateSpace.lean /tmp/QLF_StateSpace_Ablation.lean
          cat experiments/generic_gauge_born_v5/BornTransferAppend.lean             >> /tmp/QLF_StateSpace_Ablation.lean
          set +e
          (cd vendor/QLF && lake env lean /tmp/QLF_StateSpace_Ablation.lean)             > /tmp/ablation-v5.log 2>&1
          rc=$?
          set -e
          cat /tmp/ablation-v5.log
          if [ "$rc" -eq 0 ]; then exit 1; fi
          grep -q "MathGraphGenericGauge\|observe_eq_of_gauge" /tmp/ablation-v5.log
          echo "ABLATION_RC=$rc" >> "$GITHUB_ENV"

      - name: Transfer generic quotient into rational Born probability
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("vendor/QLF/lean/QLF_StateSpace.lean")
          s=p.read_text()
          needle="import Mathlib\n"
          assert needle in s
          s=s.replace(needle,needle+"import MathGraphGenericGauge\n",1)
          s+=Path("experiments/generic_gauge_born_v5/BornTransferAppend.lean").read_text()
          p.write_text(s)
          PY
          cd vendor/QLF
          lake env lean lean/QLF_StateSpace.lean

      - name: Emit evidence
        env:
          QLF_ROOT: vendor/QLF
          EVIDENCE_OUT: evidence/generic-gauge-born-v5.json
        run: python experiments/generic_gauge_born_v5/audit.py

      - uses: actions/upload-artifact@v4
        name: Upload evidence
        with:
          name: generic-gauge-born-v5
          path: |
            evidence/generic-gauge-born-v5.json
            /tmp/ablation-v5.log
          if-no-files-found: error
