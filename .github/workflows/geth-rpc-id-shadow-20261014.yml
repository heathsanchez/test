name: MathGraph Geth RPC ID shadow qualification
on:
  push:
    branches: [research/geth-rpc-id-shadow-check-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rpc-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
      - name: Checkout upstream Geth and exact PR head
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ethereum/go-ethereum.git geth
          cd geth
          git fetch origin refs/pull/35599/head:refs/heads/mathgraph-pr
          git rev-parse refs/heads/mathgraph-pr
          test "$(git rev-parse refs/heads/mathgraph-pr)" = "ae4936f24e5d2123c602fdd640347fb1b99fea4b"
          git rev-parse origin/master > ../master.sha
          git checkout --detach refs/heads/mathgraph-pr
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: geth/go.mod
          cache: false
      - name: Write independent test fixture
        shell: bash
        run: |
          cp fixtures/geth_rpc_id_boundary_test.go geth/rpc/mathgraph_response_id_boundary_test.go
      - name: Baseline on master (expected negative control)
        shell: bash
        run: |
          set -euo pipefail
          cd geth
          git checkout --detach origin/master
          echo "MASTER_SHA=$(git rev-parse HEAD)"
          set +e
          go test ./rpc -run '^TestMathGraphHTTPResponseIDBoundary$' -count=1 -v > ../master.log 2>&1
          code=$?
          set -e
          cat ../master.log
          if [ "$code" -eq 0 ]; then
            echo "Unexpected: master passes all regression cases"; exit 1
          fi
          grep -q 'FAIL: TestMathGraphHTTPResponseIDBoundary/mismatched' ../master.log || { echo "Missing expected baseline mismatch failure"; exit 1; }
      - name: PR head targeted regression
        shell: bash
        run: |
          set -euo pipefail
          cd geth
          git checkout --detach mathgraph-pr
          test "$(git rev-parse HEAD)" = "ae4936f24e5d2123c602fdd640347fb1b99fea4b"
          go test ./rpc -run '^TestMathGraphHTTPResponseIDBoundary$' -count=1 -v | tee ../pr.log
      - name: PR head valid response-ID header positive control
        shell: bash
        run: |
          set -euo pipefail
          cd geth
          go test ./rpc -run '^TestMathGraphHeaderContextWithValidResponseIDs$' -count=1 -v | tee ../header-positive.log
      - name: PR head existing RPC tests
        shell: bash
        run: |
          set -euo pipefail
          cd geth
          set +e
          go test ./rpc/... -count=1 > ../rpc-suite.log 2>&1
          code=$?
          set -e
          cat ../rpc-suite.log
          if [ "$code" -ne 0 ]; then
            grep -q 'FAIL: TestNewContextWithHeaders' ../rpc-suite.log || exit "$code"
            echo "KNOWN_MOCK_ID_REGRESSION_REPRODUCED"
          fi
      - name: Correct legacy ID-less test fixture and rerun full suite
        shell: bash
        run: |
          set -euo pipefail
          cd geth
          python3 - <<'PY'
          from pathlib import Path
          p=Path("rpc/http_test.go")
          s=p.read_text()
          a=s.index("func TestNewContextWithHeaders(")
          b=s.index("\nfunc ",a+5)
          section=s[a:b]
          old='\t\t_, _ = writer.Write([]byte(`{}`))'
          new='''\t\tvar req struct { ID json.RawMessage `json:"id"` }
\t\tif err := json.NewDecoder(request.Body).Decode(&req); err != nil {
\t\t\tt.Errorf("decode request: %v", err)
\t\t\treturn
\t\t}
\t\t_, _ = fmt.Fprintf(writer, `{"jsonrpc":"2.0","id":%s}`, req.ID)'''
          assert section.count(old)==1
          p.write_text(s[:a]+section.replace(old,new)+s[b:])
          PY
          gofmt -w rpc/http_test.go
          go test ./rpc/... -count=1 | tee ../rpc-corrected.log
          git diff -- rpc/http_test.go > ../fixture-only.patch
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geth-rpc-id-shadow-evidence
          path: |
            master.sha
            master.log
            pr.log
            header-positive.log
            rpc-suite.log
            rpc-corrected.log
            fixture-only.patch
          if-no-files-found: warn
