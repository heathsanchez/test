name: MathGraph Geth RPC ID shadow qualification
on:
  push:
    branches: [research/geth-rpc-id-shadow-check-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rpc-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
      - name: Checkout upstream Geth and exact PR head
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ethereum/go-ethereum.git geth
          cd geth
          git fetch origin refs/pull/35599/head:refs/heads/mathgraph-pr
          git rev-parse refs/heads/mathgraph-pr
          test "$(git rev-parse refs/heads/mathgraph-pr)" = "ae4936f24e5d2123c602fdd640347fb1b99fea4b"
          git rev-parse origin/master > ../master.sha
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: geth/go.mod
          cache: false
      - name: Write independent test fixture
        shell: bash
        run: |
          cp fixtures/geth_rpc_id_boundary_test.go geth/rpc/mathgraph_response_id_boundary_test.go
      - name: Baseline on master (expected negative control)
        shell: bash
        run: |
          set -euo pipefail
          cd geth
          git checkout --detach origin/master
          echo "MASTER_SHA=$(git rev-parse HEAD)"
          set +e
          go test ./rpc -run '^TestMathGraphHTTPResponseIDBoundary$' -count=1 -v > ../master.log 2>&1
          code=$?
          set -e
          cat ../master.log
          if [ "$code" -eq 0 ]; then
            echo "Unexpected: master passes all regression cases"; exit 1
          fi
          grep -q 'FAIL: TestMathGraphHTTPResponseIDBoundary/mismatched' ../master.log || { echo "Missing expected baseline mismatch failure"; exit 1; }
      - name: PR head targeted regression
        shell: bash
        run: |
          set -euo pipefail
          cd geth
          git checkout --detach mathgraph-pr
          test "$(git rev-parse HEAD)" = "ae4936f24e5d2123c602fdd640347fb1b99fea4b"
          go test ./rpc -run '^TestMathGraphHTTPResponseIDBoundary$' -count=1 -v | tee ../pr.log
      - name: PR head existing RPC tests
        shell: bash
        run: |
          set -euo pipefail
          cd geth
          go test ./rpc/... -count=1 | tee ../rpc-suite.log
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geth-rpc-id-shadow-evidence
          path: |
            master.sha
            master.log
            pr.log
            rpc-suite.log
          if-no-files-found: warn
