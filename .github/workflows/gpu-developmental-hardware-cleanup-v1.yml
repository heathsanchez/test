name: GPU Developmental Hardware Cleanup V1

on:
  push:
    branches:
      - gpu-developmental-hardware-v1
    paths:
      - ".github/workflows/gpu-developmental-hardware-cleanup-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_ENDPOINT_ID: vdfomnmrpkt7x0

    steps:
      - name: Delete benchmark Serverless endpoint through Runpod REST API
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/runpod-delete-body.txt -w '%{http_code}' \
            -X DELETE "https://rest.runpod.io/v1/endpoints/$RUNPOD_ENDPOINT_ID" \
            -H "Authorization: Bearer $RUNPOD_API_KEY")"
          cat /tmp/runpod-delete-body.txt || true
          if [ "$status" = "204" ] || [ "$status" = "404" ]; then
            echo "RUNPOD_ENDPOINT_CLEANUP=PASS status=$status"
          else
            echo "::error::Runpod endpoint deletion returned HTTP $status"
            exit 1
          fi
