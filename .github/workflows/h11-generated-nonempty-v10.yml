name: Generated H11 Nonempty Warrant V10
on:
  push:
    branches:
      - research/h11-generated-nonempty-law-v10-20261022
  pull_request:
    paths:
      - 'research/h11_generated_nonempty_v10/**'
      - '.github/workflows/h11-generated-nonempty-v10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pinned external h11 upstream
        uses: actions/checkout@v4
        with:
          repository: python-hyper/h11
          ref: 62c5068c971579d61fa1b55373390e12f25fd856
          path: upstream
          persist-credentials: false
      - name: Original MathGraph warrant resolver
        uses: actions/checkout@v4
        with:
          repository: metalogiclabs/mathgraph
          ref: e48f094fa400c77ab07404645f6e12cfba7ebf45
          path: mathgraph_pinned
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native upstream runtime and test runner
        run: |
          python -m pip install pytest==9.0.3
          python -m pip install -e ./upstream
      - name: Execute generated rewrites, finite oracle, real warrant and falsifiers
        run: |
          python -m py_compile research/h11_generated_nonempty_v10/experiment.py research/h11_generated_nonempty_v10/tracer.py
          python research/h11_generated_nonempty_v10/experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h11-generated-nonempty-v10
          path: research/h11_generated_nonempty_v10/result.json
          if-no-files-found: warn
