name: heterogeneous mutual inductive differential

on:
  push:
    branches:
      - heterogeneous-mutual-differential
  workflow_dispatch:

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare focused Arena witnesses
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          cat experiments/heterogeneous-mutual-cases.lean >> arena/tutorial/Tutorial.lean
          cat experiments/mutual-minimal-cases.lean >> arena/tutorial/Tutorial.lean
          cat experiments/mutual-constructor-boundary-cases.lean >> arena/tutorial/Tutorial.lean
          cat experiments/mutual-constructor-refinement-cases.lean >> arena/tutorial/Tutorial.lean
          cd arena
          nix develop -c ./lka.py build-test tutorial
          nix develop -c ./lka.py build-checker ind-models

      - name: Run ind-models verbosely on decisive witnesses
        run: |
          set -uo pipefail
          cd arena
          BIN="$PWD/_build/checkers/ind-models/src/.lake/build/bin/lean-inductive-models"
          if [ ! -x "$BIN" ]; then
            BIN=$(find _build/checkers/ind-models -type f -path '*/.lake/build/bin/lean-inductive-models' -print -quit)
          fi
          echo "BIN=$BIN"
          tests=(
            good/154_levelEqMaxControl_B.fromA.ndjson
            good/155_levelEqImaxControl_B.fromA.ndjson
            good/156_levelEqParamIdem_B.fromA.ndjson
            good/157_levelEqParamAbsorb_B.fromA.ndjson
            good/162_minParamIdem_B.rec.ndjson
            good/166_ctorBoundaryNullary_B.mk.ndjson
            good/169_ctorBoundaryScc_B.fromA.ndjson
            good/170_ctorRefineSameNullary_B.mk.ndjson
            good/171_ctorRefineMaxZeroNullary_B.mk.ndjson
            good/175_ctorRefineOnlyB_B.mk.ndjson
          )
          : > /tmp/ind-models-diagnostic.txt
          for t in "${tests[@]}"; do
            echo "===== $t =====" | tee -a /tmp/ind-models-diagnostic.txt
            LEAN_INDUCTIVE_MODELS_PLANNER_LEVEL_TRACE=1 \
            LEAN_INDUCTIVE_MODELS_OUTPUT_BACKEND_TRACE=1 \
              "$BIN" --type-check-input --no-output "_build/tests/tutorial/$t" \
              >>/tmp/ind-models-diagnostic.txt 2>&1
            rc=$?
            echo "EXIT=$rc" | tee -a /tmp/ind-models-diagnostic.txt
          done
          cat /tmp/ind-models-diagnostic.txt

      - name: Probe level algebra directly
        run: |
          set -euxo pipefail
          cd arena/_build/checkers/ind-models/src
          cat > LevelProbe.lean <<'EOF'
          import InductiveModels.LevelAlgebra
          open Lean InductiveModels.LevelAlgebra
          def main : IO Unit := do
            let u := Level.param `u
            let v := Level.param `v
            let pairs := [
              ("idem", Level.max u u, u),
              ("absorb", Level.max u (Level.max u v), Level.max u v),
              ("maxzero", Level.max u Level.zero, u)
            ]
            for (name, a, b) in pairs do
              IO.println s!"{name}: levelEquiv={repr (levelEquiv a b)} normalizeEq={a.normalize == b.normalize}"
          EOF
          lake env lean --run LevelProbe.lean

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ind-models-mutual-diagnostic
          path: /tmp/ind-models-diagnostic.txt
