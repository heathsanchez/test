name: heterogeneous mutual inductive differential

on:
  push:
    branches:
      - heterogeneous-mutual-differential
  workflow_dispatch:

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Arena
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena
          sed -i 's/^rev: .*/rev: 2de1895a52d21ad266b77002defe3e6bc69bbcfd/' arena/checkers/mathgraph.yaml
          cat experiments/heterogeneous-mutual-cases.lean >> arena/tutorial/Tutorial.lean

      - name: Build generated tutorial tests
        run: |
          set -euxo pipefail
          cd arena
          nix develop -c ./lka.py build-test tutorial
          find _build/tests/tutorial -type f | grep -E 'hetero|homogeneousMutualControl|levelEq' || true

      - name: Build and run checker differential
        run: |
          set -uo pipefail
          cd arena
          checkers=(official mathgraph sokonanoda nanoda lean4lean ind-models)
          : > checker-build-status.txt
          for c in "${checkers[@]}"; do
            echo "===== BUILD $c ====="
            if nix develop -c ./lka.py build-checker "$c"; then
              echo "$c build=ok" | tee -a checker-build-status.txt
              nix develop -c ./lka.py run --checker "$c" --test 'tutorial/*' || true
            else
              echo "$c build=FAILED" | tee -a checker-build-status.txt
            fi
          done

      - name: Summarize target verdicts
        run: |
          set -euxo pipefail
          cd arena
          python3 -c "import json,pathlib; targets=('hetero','homogeneousMutualControl','levelEq'); rows=sorted((d.get('checker'),d.get('test'),d.get('status'),d.get('exit_code'),d.get('error')) for p in pathlib.Path('_results').glob('*.json') for d in [json.loads(p.read_text())] if any(x in d.get('test','') for x in targets)); print('=== TARGET VERDICTS ==='); [print('\t'.join('' if x is None else str(x) for x in r)) for r in rows]; print('=== BUILD STATUS ==='); print(pathlib.Path('checker-build-status.txt').read_text()); assert rows"
