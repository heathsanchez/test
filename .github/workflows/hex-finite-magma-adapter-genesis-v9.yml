name: Hex Finite Magma Adapter Genesis V9

on:
  push:
    branches:
      - hex-v9-magma-adapter-genesis
  workflow_dispatch:

permissions:
  contents: read

jobs:
  magma:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Exhaust finite magma adapter grammar
        run: |
          python3 experiments/hex_finite_magma_adapter_genesis_v9/run.py

      - name: Generate held-out order-3 magma Lean obligations
        run: |
          python3 experiments/hex_finite_magma_adapter_genesis_v9/generate_lean.py

      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          cd experiments/hex_finite_magma_adapter_genesis_v9
          lean --version
          lake --version

      - name: Resolve pinned HexGraphIso dependency
        working-directory: experiments/hex_finite_magma_adapter_genesis_v9
        run: lake update

      - name: Build pinned Hex tactic closure
        working-directory: experiments/hex_finite_magma_adapter_genesis_v9
        run: lake build HexGraphIso.Tactic

      - name: Kernel-check V9 held-out magma transfer
        working-directory: experiments/hex_finite_magma_adapter_genesis_v9
        run: |
          set -o pipefail
          lake env lean Generated.lean 2>&1 | tee results/lean.log

      - name: Seal V9 evidence
        working-directory: experiments/hex_finite_magma_adapter_genesis_v9
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path(".")
          e=json.loads((root/"results/evidence.json").read_text())
          e["generation"]=json.loads((root/"results/generation.json").read_text())
          e["lean_kernel_check"]="PASS"
          e["final_verdict"]="VERIFIED_FINITE_MAGMA_ADAPTER_GENESIS_AND_TRANSFER"
          files=[
              "PROTOCOL.md","run.py","generate_lean.py","Generated.lean",
              "lakefile.toml","lean-toolchain","lake-manifest.json",
              "results/selected_adapter.json"
          ]
          e["sealed_files"]={
              f:hashlib.sha256((root/f).read_bytes()).hexdigest()
              for f in files if (root/f).exists()
          }
          (root/"results/final_evidence.json").write_text(
              json.dumps(e,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(e,indent=2,sort_keys=True))
          PY
          sha256sum PROTOCOL.md run.py generate_lean.py Generated.lean lakefile.toml lean-toolchain lake-manifest.json results/selected_adapter.json > results/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hex-finite-magma-adapter-genesis-v9-evidence
          path: experiments/hex_finite_magma_adapter_genesis_v9/results/
          if-no-files-found: error
