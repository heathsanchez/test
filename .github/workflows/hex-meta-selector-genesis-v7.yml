name: Hex Meta Selector Genesis V7

on:
  push:
    branches:
      - hex-macro-generalization-selection-v6
    paths:
      - "experiments/hex_meta_selector_genesis_v7/**"
      - ".github/workflows/hex-meta-selector-genesis-v7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Synthesize meta rule from generic selector language
        run: python3 experiments/hex_meta_selector_genesis_v7/run.py

      - name: Generate held-out three-relation Lean obligations
        run: python3 experiments/hex_meta_selector_genesis_v7/generate_lean.py

      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          cd experiments/hex_meta_selector_genesis_v7
          lean --version
          lake --version

      - name: Resolve pinned Hex dependency
        working-directory: experiments/hex_meta_selector_genesis_v7
        run: lake update

      - name: Build Hex tactic closure
        working-directory: experiments/hex_meta_selector_genesis_v7
        run: lake build HexGraphIso.Tactic

      - name: Kernel-check V7 held-out transfer
        working-directory: experiments/hex_meta_selector_genesis_v7
        run: |
          set -o pipefail
          lake env lean Generated.lean 2>&1 | tee results/lean.log

      - name: Seal V7 evidence
        working-directory: experiments/hex_meta_selector_genesis_v7
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path(".")
          e=json.loads((root/"results/evidence.json").read_text())
          e["generation"]=json.loads((root/"results/generation.json").read_text())
          e["lean_kernel_check"]="PASS"
          e["final_verdict"]="VERIFIED_META_RULE_GENESIS_AND_TRANSFER"
          files=["PROTOCOL.md","run.py","generate_lean.py","Generated.lean",
                 "lakefile.toml","lean-toolchain","lake-manifest.json",
                 "results/selected_program.json"]
          e["sealed_files"]={
            f:hashlib.sha256((root/f).read_bytes()).hexdigest()
            for f in files if (root/f).exists()
          }
          (root/"results/final_evidence.json").write_text(
            json.dumps(e,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(e,indent=2,sort_keys=True))
          PY
          sha256sum PROTOCOL.md run.py generate_lean.py Generated.lean lakefile.toml lean-toolchain lake-manifest.json results/selected_program.json > results/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hex-meta-selector-genesis-v7-evidence
          path: experiments/hex_meta_selector_genesis_v7/results/
          if-no-files-found: error
