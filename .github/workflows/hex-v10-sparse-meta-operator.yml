name: Hex V10 Sparse Meta Operator

on:
  push:
    branches:
      - hex-v10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Construct selector table from staged residuals
        run: python3 experiments/hex_v10_sparse_operator/run.py

      - name: Generate held-out six-relation Lean obligations
        run: python3 experiments/hex_v10_sparse_operator/generate_lean.py

      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          cd experiments/hex_v10_sparse_operator
          elan override set leanprover/lean4:v4.34.0-rc2
          lean --version
          lake --version

      - name: Resolve pinned HexGraphIso dependency
        working-directory: experiments/hex_v10_sparse_operator
        run: lake update

      - name: Build pinned Hex tactic closure
        working-directory: experiments/hex_v10_sparse_operator
        run: lake build HexGraphIso.Tactic

      - name: Kernel-check V10 held-out transfer
        working-directory: experiments/hex_v10_sparse_operator
        run: |
          set -o pipefail
          lake env lean Generated.lean 2>&1 | tee results/lean.log

      - name: Seal V10 evidence
        working-directory: experiments/hex_v10_sparse_operator
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path(".")
          e=json.loads((root/"results/evidence.json").read_text())
          e["generation"]=json.loads((root/"results/generation.json").read_text())
          e["lean_kernel_check"]="PASS"
          e["final_verdict"]="VERIFIED_SPARSE_META_OPERATOR_GENESIS_AND_TRANSFER"
          files=["PROTOCOL.md","run.py","generate_lean.py","Generated.lean",
                 "lakefile.toml","lake-manifest.json","results/constructed_table.json"]
          e["sealed_files"]={
              f:hashlib.sha256((root/f).read_bytes()).hexdigest()
              for f in files if (root/f).exists()
          }
          (root/"results/final_evidence.json").write_text(
              json.dumps(e,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(e,indent=2,sort_keys=True))
          PY
          sha256sum PROTOCOL.md run.py generate_lean.py Generated.lean lakefile.toml lake-manifest.json results/constructed_table.json > results/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hex-v10-sparse-meta-operator-evidence
          path: experiments/hex_v10_sparse_operator/results/
          if-no-files-found: error
