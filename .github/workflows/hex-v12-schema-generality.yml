name: Hex V12 Schema Generality

on:
  push:
    branches:
      - hex-v12
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Download exact V10 and V11 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p experiments/hex_v12_schema_generality/prior_v10
          mkdir -p experiments/hex_v12_schema_generality/prior_v11

          curl -L             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/heathsanchez/test/actions/artifacts/10310401999/zip             -o /tmp/v10.zip
          echo "96059633cf1a53b94e5d631d1a4822413e2cab7b361cef50e8d3a05ed98c8f87  /tmp/v10.zip" | sha256sum -c -
          unzip -q /tmp/v10.zip -d experiments/hex_v12_schema_generality/prior_v10

          curl -L             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/heathsanchez/test/actions/artifacts/10309829989/zip             -o /tmp/v11.zip
          echo "8b6c677598df6ab5cb5f034900a66a010bde19798b8fcbd9da9d3ccfd312f907  /tmp/v11.zip" | sha256sum -c -
          unzip -q /tmp/v11.zip -d experiments/hex_v12_schema_generality/prior_v11

          test -f experiments/hex_v12_schema_generality/prior_v10/final_evidence.json
          test -f experiments/hex_v12_schema_generality/prior_v11/final_evidence.json

      - name: Select repair-schema generality by consequence
        run: python3 experiments/hex_v12_schema_generality/run.py

      - name: Generate held-out eight-relation Lean obligations
        run: python3 experiments/hex_v12_schema_generality/generate_lean.py

      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          cd experiments/hex_v12_schema_generality
          elan override set leanprover/lean4:v4.34.0-rc2
          lean --version
          lake --version

      - name: Resolve pinned HexGraphIso dependency
        working-directory: experiments/hex_v12_schema_generality
        run: lake update

      - name: Build pinned Hex tactic closure
        working-directory: experiments/hex_v12_schema_generality
        run: lake build HexGraphIso.Tactic

      - name: Kernel-check V12 held-out transfer
        working-directory: experiments/hex_v12_schema_generality
        run: |
          set -o pipefail
          lake env lean Generated.lean 2>&1 | tee results/lean.log

      - name: Seal V12 evidence
        working-directory: experiments/hex_v12_schema_generality
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path(".")
          e=json.loads((root/"results/evidence.json").read_text())
          e["generation"]=json.loads((root/"results/generation.json").read_text())
          e["lean_kernel_check"]="PASS"
          e["prior_v10_artifact_id"]=10310401999
          e["prior_v11_artifact_id"]=10309829989
          e["final_verdict"]="VERIFIED_REPAIR_SCHEMA_GENERALITY_SELECTION_AND_TRANSFER"
          files=["PROTOCOL.md","run.py","generate_lean.py","Generated.lean",
                 "lakefile.toml","lake-manifest.json",
                 "results/selected_schema.json","results/final_policy.json"]
          e["sealed_files"]={
              f:hashlib.sha256((root/f).read_bytes()).hexdigest()
              for f in files if (root/f).exists()
          }
          (root/"results/final_evidence.json").write_text(
              json.dumps(e,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(e,indent=2,sort_keys=True))
          PY
          sha256sum PROTOCOL.md run.py generate_lean.py Generated.lean lakefile.toml lake-manifest.json results/selected_schema.json results/final_policy.json > results/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hex-v12-schema-generality-evidence
          path: experiments/hex_v12_schema_generality/results/
          if-no-files-found: error
