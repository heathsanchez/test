name: Hex V20 Incidence Theorem

on:
  push:
    branches:
      - hex-v20-incidence-theorem
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          cd experiments/hex_v20_incidence_theorem
          elan override set leanprover/lean4:v4.34.0-rc2
      - name: Resolve Hex
        working-directory: experiments/hex_v20_incidence_theorem
        run: lake update
      - name: Build pinned Hex theorem dependency
        working-directory: experiments/hex_v20_incidence_theorem
        run: lake build HexGraphIso.Iso
      - name: Check theorem
        working-directory: experiments/hex_v20_incidence_theorem
        run: |
          set -o pipefail
          lake env lean Main.lean 2>&1 | tee theorem.log
      - name: Seal theorem evidence
        working-directory: experiments/hex_v20_incidence_theorem
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path(".")
          ev={
            "verdict":"VERIFIED_GENERAL_INCIDENCE_ISOMORPHISM_THEOREM",
            "lean_kernel_check":"PASS",
            "theorem":"sourceIso_iff_incIso",
            "scope":"arbitrary carrier types and arbitrary finite arity for a single relation",
            "main_sha256":hashlib.sha256((root/"Main.lean").read_bytes()).hexdigest()
          }
          (root/"final_evidence.json").write_text(json.dumps(ev,indent=2,sort_keys=True)+"\n")
          print(json.dumps(ev,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hex-v20-incidence-theorem-evidence
          path: |
            experiments/hex_v20_incidence_theorem/final_evidence.json
            experiments/hex_v20_incidence_theorem/theorem.log
            experiments/hex_v20_incidence_theorem/Main.lean
