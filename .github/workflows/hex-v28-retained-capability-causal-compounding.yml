name: Hex V28 Retained Capability Causal Compounding

on:
  push:
    branches:
      - hex-v28-retained-capability-causal-compounding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compound:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exhaust cold family, replay warm capability, and run ablations
        run: python3 experiments/hex_v28_retained_capability_causal_compounding/run.py

      - name: Seal V28 evidence
        working-directory: experiments/hex_v28_retained_capability_causal_compounding
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path(".")
          e = json.loads((root/"results/evidence.json").read_text())
          e["sealed_files"] = {
              f: hashlib.sha256((root/f).read_bytes()).hexdigest()
              for f in ["PROTOCOL.md","run.py"]
          }
          (root/"results/final_evidence.json").write_text(
              json.dumps(e, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(e, indent=2, sort_keys=True))
          PY
          sha256sum PROTOCOL.md run.py results/evidence.json results/final_evidence.json > results/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hex-v28-retained-capability-causal-compounding-evidence
          path: experiments/hex_v28_retained_capability_causal_compounding/results/
          if-no-files-found: error
