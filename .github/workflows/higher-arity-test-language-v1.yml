name: Higher Arity Test Language V1

on:
  push:
    paths:
      - "experiments/higher_arity_test_language_v1/FROZEN_CANDIDATE.md"
      - "scripts/higher_arity_test_language_v1.py"
      - ".github/workflows/higher-arity-test-language-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove frozen candidate unchanged
        run: |
          set -euxo pipefail
          git diff --exit-code 08dcf4e4934c99a2e9eb46a5e3d0a1a57e876d74 --             experiments/higher_arity_test_language_v1/FROZEN_CANDIDATE.md
          echo "HIGHER_ARITY_V1_FROZEN_UNCHANGED"
      - name: Run higher-arity suite
        run: |
          set -o pipefail
          python scripts/higher_arity_test_language_v1.py | tee higher-arity-test-language-v1.log
          grep -F "SURVIVED_HIGHER_ARITY_TEST_LANGUAGE_V1" higher-arity-test-language-v1.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: higher-arity-test-language-v1
          path: higher-arity-test-language-v1.log
