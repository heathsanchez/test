name: Interaction Quotient Controller V1

on:
  push:
    branches: [interaction-quotient-controller-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run interaction quotient qualification
        shell: bash
        run: |
          set -o pipefail
          python -m unittest open_development.tests.test_interaction_quotient_controller -v 2>&1 | tee interaction-quotient-controller-v1.log

      - name: Run interaction and continuation breakers
        shell: bash
        run: |
          set -o pipefail
          python -m unittest \
            open_development.tests.test_interaction_space_breakers \
            open_development.tests.test_continuation_invariant_breakers -v 2>&1 | tee interaction-breakers-v1.log

      - name: Run full Open Development regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s open_development/tests -v 2>&1 | tee open-development-regression.log

      - name: Preserve Lean core gate
        shell: bash
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          bash open_development/lean/check.sh 2>&1 | tee lean-core.log

      - name: Record exact authority
        shell: bash
        run: |
          {
            echo "INTERACTION_QUOTIENT_CONTROLLER_V1_COMPLETE"
            echo "source_commit=$(git rev-parse HEAD)"
            sha256sum interaction-quotient-controller-v1.log
            sha256sum interaction-breakers-v1.log
            sha256sum open-development-regression.log
            sha256sum lean-core.log
          } | tee interaction-quotient-controller-authority.txt

      - uses: actions/upload-artifact@v4
        with:
          name: interaction-quotient-controller-v1
          path: |
            interaction-quotient-controller-v1.log
            interaction-breakers-v1.log
            open-development-regression.log
            lean-core.log
            interaction-quotient-controller-authority.txt
          if-no-files-found: error
