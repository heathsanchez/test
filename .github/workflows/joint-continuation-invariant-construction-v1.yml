name: Joint Continuation Invariant Construction V1
on: {workflow_dispatch: {}, push: {branches: [joint-continuation-invariant-construction-v1]}}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python experiments/joint_continuation_invariant_construction_v1/run.py
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -o pipefail
          lean experiments/joint_continuation_invariant_construction_v1/JointConstruction.lean 2>&1 | tee /tmp/joint.log
          ! grep -q sorry /tmp/joint.log
      - run: |
          cd experiments/joint_continuation_invariant_construction_v1
          sha256sum PROTOCOL.md JointConstruction.lean run.py results/evidence.json results/snapshot.json > results/SHA256SUMS
          git rev-parse HEAD > results/RUN_COMMIT
          cp /tmp/joint.log results/
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: joint-continuation-invariant-construction-v1, path: experiments/joint_continuation_invariant_construction_v1/results, retention-days: 90}
