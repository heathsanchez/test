name: Korovin Batch Transfer V8
on:
  workflow_dispatch:
  push:
    branches: [experiment/korovin-batch-transfer-v8]
    paths:
      - '.github/workflows/korovin-batch-transfer-v8.yml'
      - 'experiments/korovin_full_v8/**'
  pull_request:
    branches: [experiment/korovin-public-synthetic-v7]
    paths:
      - '.github/workflows/korovin-batch-transfer-v8.yml'
      - 'experiments/korovin_full_v8/**'
jobs:
  frozen-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Freeze inherited and V8 source hashes
        run: |
          mkdir -p experiments/korovin_full_v8/results
          sha256sum \
            experiments/korovin_full_v5/{worlds.py,theory.py} \
            experiments/korovin_full_v6/certify.py \
            experiments/korovin_full_v8/{PRECOMMIT.md,run.py} \
            | tee experiments/korovin_full_v8/results/SOURCE_SHA256.txt
      - name: Generate all eight indexed worlds and run frozen batch
        run: python experiments/korovin_full_v8/run.py
      - name: Determinism replay
        run: |
          cp experiments/korovin_full_v8/results/RESULT.json /tmp/r1.json
          python experiments/korovin_full_v8/run.py
          cmp /tmp/r1.json experiments/korovin_full_v8/results/RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korovin-batch-transfer-v8
          path: experiments/korovin_full_v8/results/
