name: Korovin Distinction Synthesis V4
on:
  workflow_dispatch:
  push:
    branches: [experiment/korovin-distinction-synthesis-v4]
    paths:
      - '.github/workflows/korovin-distinction-synthesis-v4.yml'
      - 'experiments/korovin_full_v4/**'
  pull_request:
    branches: [experiment/korovin-representation-program-v3]
    paths:
      - '.github/workflows/korovin-distinction-synthesis-v4.yml'
      - 'experiments/korovin_full_v4/**'
jobs:
  frozen-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Freeze source hashes
        run: |
          mkdir -p experiments/korovin_full_v4/results
          sha256sum experiments/korovin_full_v4/{PRECOMMIT.md,worlds.py,constructor.py,verifier.py,run.py} | tee experiments/korovin_full_v4/results/SOURCE_SHA256.txt
      - name: Run frozen distinction synthesis
        run: python experiments/korovin_full_v4/run.py
      - name: Determinism replay
        run: |
          cp experiments/korovin_full_v4/results/RESULT.json /tmp/r1.json
          python experiments/korovin_full_v4/run.py
          cmp /tmp/r1.json experiments/korovin_full_v4/results/RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korovin-distinction-synthesis-v4
          path: experiments/korovin_full_v4/results/
