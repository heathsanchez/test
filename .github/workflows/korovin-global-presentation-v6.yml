name: Korovin Global Presentation Certificate V6
on:
  workflow_dispatch:
  push:
    branches: [experiment/korovin-global-presentation-v6]
    paths:
      - '.github/workflows/korovin-global-presentation-v6.yml'
      - 'experiments/korovin_full_v6/**'
      - 'experiments/korovin_full_v5/**'
  pull_request:
    branches: [experiment/korovin-usable-theory-v5]
    paths:
      - '.github/workflows/korovin-global-presentation-v6.yml'
      - 'experiments/korovin_full_v6/**'
jobs:
  frozen-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Freeze source hashes
        run: |
          mkdir -p experiments/korovin_full_v6/results
          sha256sum \
            experiments/korovin_full_v5/{worlds.py,theory.py} \
            experiments/korovin_full_v6/{PRECOMMIT.md,certify.py,run.py} \
            | tee experiments/korovin_full_v6/results/SOURCE_SHA256.txt
      - name: Run global presentation certificate
        run: python experiments/korovin_full_v6/run.py
      - name: Determinism replay
        run: |
          cp experiments/korovin_full_v6/results/RESULT.json /tmp/r1.json
          python experiments/korovin_full_v6/run.py
          cmp /tmp/r1.json experiments/korovin_full_v6/results/RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korovin-global-presentation-v6
          path: experiments/korovin_full_v6/results/
