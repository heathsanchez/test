name: Korovin Object Reinvention Full V2

on:
  workflow_dispatch:
  push:
    branches: [main, experiment/korovin-object-reinvention-full-v2]
    paths:
      - '.github/workflows/korovin-object-reinvention-full-v2.yml'
      - 'experiments/korovin_full_v2/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/korovin-object-reinvention-full-v2.yml'
      - 'experiments/korovin_full_v2/**'

jobs:
  frozen-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze source hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/korovin_full_v2/results
          sha256sum experiments/korovin_full_v2/{PRECOMMIT.md,worlds.py,constructor.py,verifier.py,run.py} \
            | tee experiments/korovin_full_v2/results/SOURCE_SHA256.txt
      - name: Run frozen full reinvention gate
        run: python experiments/korovin_full_v2/run.py
      - name: Repeat for determinism
        shell: bash
        run: |
          set -euo pipefail
          cp experiments/korovin_full_v2/results/RESULT.json /tmp/result1.json
          python experiments/korovin_full_v2/run.py
          cmp /tmp/result1.json experiments/korovin_full_v2/results/RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korovin-object-reinvention-full-v2
          path: experiments/korovin_full_v2/results/
