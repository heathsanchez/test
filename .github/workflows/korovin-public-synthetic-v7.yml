name: Korovin Public Synthetic Unnamed Object V7
on:
  workflow_dispatch:
  push:
    branches: [experiment/korovin-public-synthetic-v7]
    paths:
      - '.github/workflows/korovin-public-synthetic-v7.yml'
      - 'experiments/korovin_full_v7/**'
  pull_request:
    branches: [experiment/korovin-global-presentation-v6]
    paths:
      - '.github/workflows/korovin-public-synthetic-v7.yml'
      - 'experiments/korovin_full_v7/**'
jobs:
  frozen-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Freeze inherited and V7 source hashes
        run: |
          mkdir -p experiments/korovin_full_v7/results
          sha256sum \
            experiments/korovin_full_v5/{worlds.py,theory.py} \
            experiments/korovin_full_v6/certify.py \
            experiments/korovin_full_v7/{PRECOMMIT.md,run.py} \
            | tee experiments/korovin_full_v7/results/SOURCE_SHA256.txt
      - name: Generate world once and run frozen public validation
        run: python experiments/korovin_full_v7/run.py
      - name: Determinism replay
        run: |
          cp experiments/korovin_full_v7/results/RESULT.json /tmp/r1.json
          python experiments/korovin_full_v7/run.py
          cmp /tmp/r1.json experiments/korovin_full_v7/results/RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korovin-public-synthetic-v7
          path: experiments/korovin_full_v7/results/
