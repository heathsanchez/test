name: Korovin Usable Theory Formation V5
on:
  workflow_dispatch:
  push:
    branches: [experiment/korovin-usable-theory-v5]
    paths:
      - '.github/workflows/korovin-usable-theory-v5.yml'
      - 'experiments/korovin_full_v5/**'
  pull_request:
    branches: [experiment/korovin-distinction-synthesis-v4]
    paths:
      - '.github/workflows/korovin-usable-theory-v5.yml'
      - 'experiments/korovin_full_v5/**'
jobs:
  frozen-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Freeze source hashes
        run: |
          mkdir -p experiments/korovin_full_v5/results
          sha256sum experiments/korovin_full_v5/{PRECOMMIT.md,worlds.py,theory.py,run.py} | tee experiments/korovin_full_v5/results/SOURCE_SHA256.txt
      - name: Run frozen theory formation gate
        run: python experiments/korovin_full_v5/run.py
      - name: Determinism replay
        run: |
          cp experiments/korovin_full_v5/results/RESULT.json /tmp/r1.json
          python experiments/korovin_full_v5/run.py
          cmp /tmp/r1.json experiments/korovin_full_v5/results/RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korovin-usable-theory-v5
          path: experiments/korovin_full_v5/results/
