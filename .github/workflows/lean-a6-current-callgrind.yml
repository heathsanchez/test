name: Lean A6 current Callgrind hotspot profile

on:
  push:
    paths:
      - '.github/workflows/lean-a6-current-callgrind.yml'
      - 'scripts/patch_a6.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Install profiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a6 results/a6-callgrind
          mkdir -p arena-tests artifact results/a6-callgrind
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct A6
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout -q "$SOKO_PIN"
          python3 scripts/patch_a6.py
          git -C a6 diff --check
          git -C a6 diff > results/a6-callgrind/a6.patch
          cat > a6/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON

      - name: Build A6 with symbols
        shell: bash
        run: |
          set -euo pipefail
          (cd a6 && RUSTFLAGS='-C debuginfo=1 -C target-cpu=native' cargo build --release)

      - name: Frozen semantic replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          good=sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          bad=sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          gp=br=0; failures=[]
          for p in good:
              with p.open('rb') as f:
                  r=subprocess.run(['a6/target/release/sokonanoda','a6/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if r.returncode==0: gp+=1
              elif len(failures)<20: failures.append(['good',str(p),r.returncode])
          for p in bad:
              with p.open('rb') as f:
                  r=subprocess.run(['a6/target/release/sokonanoda','a6/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if r.returncode!=0: br+=1
              elif len(failures)<20: failures.append(['bad',str(p),r.returncode])
          out={'good_pass':gp,'good_total':len(good),'bad_reject':br,'bad_total':len(bad),'failures':failures}
          pathlib.Path('results/a6-callgrind/semantics.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if gp!=len(good) or br!=len(bad): raise SystemExit('semantic failure')
          PY

      - name: Profile dominant frozen case
        shell: bash
        run: |
          set -euo pipefail
          CASE=$(find arena-tests/good -type f -name '*grind-ring-5*.ndjson' | head -1)
          test -n "$CASE"
          echo "$CASE" > results/a6-callgrind/case.txt
          valgrind --tool=callgrind --collect-jumps=yes             --callgrind-out-file=results/a6-callgrind/callgrind.out             a6/target/release/sokonanoda a6/config.json             < "$CASE" >/dev/null 2>results/a6-callgrind/valgrind.stderr
          callgrind_annotate --inclusive=no --threshold=0.01 results/a6-callgrind/callgrind.out             > results/a6-callgrind/self.txt
          callgrind_annotate --inclusive=yes --threshold=0.01 results/a6-callgrind/callgrind.out             > results/a6-callgrind/inclusive.txt
          head -180 results/a6-callgrind/self.txt > results/a6-callgrind/top-self.txt
          head -180 results/a6-callgrind/inclusive.txt > results/a6-callgrind/top-inclusive.txt
          grep -E 'prune_env|key_env|eval|unify|force|infer|quote|iota|apply|spine|intern_frame|canonical|hash|lookup|FxHash|HashTable'             results/a6-callgrind/self.txt | head -160 > results/a6-callgrind/hot-matches.txt || true
          cat results/a6-callgrind/top-self.txt

      - name: Upload profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-a6-current-callgrind-hotspot
          path: results/a6-callgrind/
