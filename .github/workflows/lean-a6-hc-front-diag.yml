name: Lean A6 hash-cons front-cache locality

on:
  push:
    paths:
      - '.github/workflows/lean-a6-hc-front-diag.yml'
      - 'scripts/patch_a6_hc_front_diag.py'
      - 'scripts/patch_a6.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a6 results/hc-front diagnostics/hc-front
          mkdir -p arena-tests artifact results/hc-front diagnostics/hc-front
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct diagnostic A6
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout -q "$SOKO_PIN"
          python3 scripts/patch_a6.py
          python3 scripts/patch_a6_hc_front_diag.py
          git -C a6 diff --check
          git -C a6 diff > diagnostics/hc-front/diagnostic.patch
          cat > a6/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          (cd a6 && RUSTFLAGS="-C target-cpu=native" cargo build --release)
          test -x a6/target/release/sokonanoda

      - name: Freeze development cases
        shell: bash
        run: |
          set -euo pipefail
          find arena-tests/good -type f -name '*grind-ring-5*.ndjson' | sort > diagnostics/hc-front/grind.txt
          find arena-tests/good -type f -name '*app-lam*.ndjson' | sort > diagnostics/hc-front/app-lam.txt
          find arena-tests/good -type f -name '*shift-cascade*.ndjson' | sort > diagnostics/hc-front/shift.txt
          printf '%s
' arena-tests/good/init-prelude.ndjson > diagnostics/hc-front/init.txt
          test "$(wc -l < diagnostics/hc-front/grind.txt)" -eq 1
          test "$(wc -l < diagnostics/hc-front/app-lam.txt)" -eq 1
          test "$(wc -l < diagnostics/hc-front/shift.txt)" -eq 1
          test -f arena-tests/good/init-prelude.ndjson

      - name: Measure exact front-cache locality
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          names=['canon','spine','rigid','unfold']
          rx={
            n: re.compile(rf'HC_FRONT_{n.upper()} total=(\d+) map_hit=(\d+) map_miss=(\d+) dm1=(\d+) dm4=(\d+)')
            for n in names
          }
          cases={
            'grind-ring-5':pathlib.Path(pathlib.Path('diagnostics/hc-front/grind.txt').read_text().strip()),
            'init-prelude':pathlib.Path('arena-tests/good/init-prelude.ndjson'),
            'app-lam':pathlib.Path(pathlib.Path('diagnostics/hc-front/app-lam.txt').read_text().strip()),
            'shift-cascade':pathlib.Path(pathlib.Path('diagnostics/hc-front/shift.txt').read_text().strip()),
          }
          out={}
          for label,p in cases.items():
            with p.open('rb') as f:
              r=subprocess.run(
                ['a6/target/release/sokonanoda','a6/config.json'],
                stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                env={**os.environ,'SOKONANODA_HC_FRONT_DIAG':'1'},
              )
            if r.returncode:
              raise SystemExit(f'{label} rc={r.returncode}: {r.stderr.decode(errors="replace")[-1500:]}')
            err=r.stderr.decode(errors='replace')
            row={}
            for n in names:
              m=rx[n].search(err)
              if not m:
                raise SystemExit(f'missing {n} telemetry for {label}: {err[-2500:]}')
              total,hit,miss,dm1,dm4=map(int,m.groups())
              row[n]={
                'total':total,'map_hit':hit,'map_miss':miss,'dm1':dm1,'dm4':dm4,
                'map_hit_rate':hit/total if total else 0,
                'dm1_capture_of_map_hits':dm1/hit if hit else 0,
                'dm4_capture_of_map_hits':dm4/hit if hit else 0,
              }
            out[label]=row
          # aggregate four cases
          agg={n:{k:0 for k in ['total','map_hit','map_miss','dm1','dm4']} for n in names}
          for row in out.values():
            for n in names:
              for k in agg[n]: agg[n][k]+=row[n][k]
          for n,x in agg.items():
            x['map_hit_rate']=x['map_hit']/x['total'] if x['total'] else 0
            x['dm1_capture_of_map_hits']=x['dm1']/x['map_hit'] if x['map_hit'] else 0
            x['dm4_capture_of_map_hits']=x['dm4']/x['map_hit'] if x['map_hit'] else 0
          result={'cases':out,'aggregate':agg}
          pathlib.Path('results/hc-front/result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Frozen semantic replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          good=sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          bad=sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          gp=br=0
          for p in good:
            with p.open('rb') as f:
              r=subprocess.run(['a6/target/release/sokonanoda','a6/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            gp += r.returncode == 0
          for p in bad:
            with p.open('rb') as f:
              r=subprocess.run(['a6/target/release/sokonanoda','a6/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            br += r.returncode != 0
          out={'good_pass':gp,'good_total':len(good),'bad_reject':br,'bad_total':len(bad)}
          pathlib.Path('results/hc-front/semantics.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if gp!=len(good) or br!=len(bad):
            raise SystemExit('semantic diagnostic regression')
          PY

      - name: Upload locality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-a6-hash-cons-front-locality
          path: |
            results/hc-front/
            diagnostics/hc-front/
