name: Lean A6 prehashed authoritative spine interner

on:
  push:
    paths:
      - '.github/workflows/lean-a6-prehashed-spine.yml'
      - 'scripts/patch_a6_prehashed_spine.py'
      - 'scripts/patch_a6_prehashed_spine_control.py'
      - 'scripts/patch_a6.py'
      - 'A6_PREHASHED_SPINE_INTERNER_PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/prehashed-spine diagnostics/prehashed-spine
          curl --fail --location --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" \
            -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Freeze development and held-out manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('arena-tests/good')
          dev=[root/x for x in ['perf/grind-ring-5.ndjson','init-prelude.ndjson','perf/app-lam.ndjson','perf/shift-cascade.ndjson']]
          if any(not p.exists() for p in dev): raise SystemExit('missing development case')
          all_good=sorted(root.rglob('*.ndjson'))
          dev_abs={p.resolve() for p in dev}
          held=sorted([p for p in all_good if p.resolve() not in dev_abs],key=lambda p:(-p.stat().st_size,str(p)))[:24]
          if len(held)!=24: raise SystemExit('heldout count')
          pathlib.Path('diagnostics/prehashed-spine/development.txt').write_text('\n'.join(map(str,dev))+'\n')
          pathlib.Path('diagnostics/prehashed-spine/heldout.txt').write_text('\n'.join(map(str,held))+'\n')
          pathlib.Path('results/prehashed-spine/manifests.json').write_text(json.dumps({'development':list(map(str,dev)),'heldout':list(map(str,held))},indent=2)+'\n')
          PY

      - name: Reconstruct frozen arms
        run: |
          set -euo pipefail
          for arm in a0 prehashed hashcontrol; do
            git clone -q https://github.com/intgrah/sokonanoda.git "$arm"
            git -C "$arm" checkout -q "$SOKO_PIN"
            rm -rf a6 && cp -a "$arm" a6
            python3 scripts/patch_a6.py
            case "$arm" in
              prehashed) python3 scripts/patch_a6_prehashed_spine.py ;;
              hashcontrol) python3 scripts/patch_a6_prehashed_spine_control.py ;;
              a0) ;;
            esac
            git -C a6 diff --check
            git -C a6 diff > "diagnostics/prehashed-spine/$arm.patch"
            rm -rf "$arm" && mv a6 "$arm"
            cat > "$arm/config.json" <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          done
          test -s diagnostics/prehashed-spine/prehashed.patch
          test -s diagnostics/prehashed-spine/hashcontrol.patch
          grep -q 'HashTable<S' prehashed/src/util.rs
          grep -q 'spine_hc_hash' prehashed/src/eval.rs

      - name: Arena-style PGO build all arms
        run: |
          set -euo pipefail
          rustup component add llvm-tools-preview
          LLVM_PROFDATA=$(find "$(rustc --print sysroot)" -type f -name llvm-profdata | head -1)
          test -x "$LLVM_PROFDATA"
          TRAIN="$PWD/arena-tests/good/init-prelude.ndjson"
          for arm in a0 prehashed hashcontrol; do
            rm -rf "$arm/pgo"; mkdir -p "$arm/pgo"
            (cd "$arm" && RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release)
            "$arm/target/release/sokonanoda" "$arm/config.json" < "$TRAIN" >/dev/null 2>/dev/null || true
            "$LLVM_PROFDATA" merge -o "$arm/pgo/merged.profdata" "$arm/pgo"
            (cd "$arm" && RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release)
            test -x "$arm/target/release/sokonanoda"
          done

      - name: Full frozen semantic gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          good=sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          bad=sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          if len(good)!=103 or len(bad)!=58: raise SystemExit((len(good),len(bad)))
          out={}
          for arm in ['a0','prehashed','hashcontrol']:
            gp=br=0; failures=[]
            for p in good:
              with p.open('rb') as f:r=subprocess.run([f'{arm}/target/release/sokonanoda',f'{arm}/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              if r.returncode==0:gp+=1
              elif len(failures)<15:failures.append({'kind':'good_rejected','case':str(p),'rc':r.returncode,'stderr':r.stderr.decode(errors='replace')[-1000:]})
            for p in bad:
              with p.open('rb') as f:r=subprocess.run([f'{arm}/target/release/sokonanoda',f'{arm}/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              if r.returncode!=0:br+=1
              elif len(failures)<15:failures.append({'kind':'bad_accepted','case':str(p)})
            out[arm]={'good_pass':gp,'bad_reject':br,'failures':failures}
          pathlib.Path('results/prehashed-spine/semantics.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          if any(x['good_pass']!=103 or x['bad_reject']!=58 for x in out.values()):raise SystemExit('semantic rejection')
          PY

      - name: Development paired CPU economics
        id: perf
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,random,resource,statistics,subprocess
          arms=['a0','prehashed','hashcontrol'];cases=[pathlib.Path(x) for x in pathlib.Path('diagnostics/prehashed-spine/development.txt').read_text().splitlines() if x]
          def one(a,p):
            before=resource.getrusage(resource.RUSAGE_CHILDREN)
            with p.open('rb') as f:r=subprocess.run([f'{a}/target/release/sokonanoda',f'{a}/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            after=resource.getrusage(resource.RUSAGE_CHILDREN)
            if r.returncode:raise SystemExit(f'{a} {p} {r.returncode}')
            return (after.ru_utime-before.ru_utime)+(after.ru_stime-before.ru_stime)
          for a in arms:
            for p in cases:one(a,p)
          by={};rows=[]
          for rep in range(30):
            order=arms.copy();random.Random(117000+rep).shuffle(order);by[rep]={}
            for a in order:
              total=0.0;per={}
              for p in cases:
                cpu=one(a,p);total+=cpu;per[str(p)]=cpu
              by[rep][a]=total;rows.append({'rep':rep,'arm':a,'cpu_s':total,'per_case_cpu_s':per})
          def pair(c,b):
            ds=[];wins=0
            for rep in range(30):
              cv=by[rep][c];bv=by[rep][b];ds.append(100*(cv/bv-1));wins+=cv<bv
            return {'median_delta_pct':statistics.median(ds),'wins':wins,'losses':30-wins,'deltas_pct':ds}
          out={'summary':{a:{'median_cpu_s':statistics.median(by[r][a] for r in range(30))} for a in arms},'prehashed_vs_a0':pair('prehashed','a0'),'prehashed_vs_hashcontrol':pair('prehashed','hashcontrol'),'hashcontrol_vs_a0':pair('hashcontrol','a0'),'rows':rows}
          pathlib.Path('results/prehashed-spine/development-performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2,sort_keys=True))
          PY

      - name: Classify development gate
        id: dev
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          p=json.loads(pathlib.Path('results/prehashed-spine/development-performance.json').read_text())
          a=p['prehashed_vs_a0'];c=p['prehashed_vs_hashcontrol']
          a_ok=a['median_delta_pct']<0 and a['wins']>=18
          c_ok=c['median_delta_pct']<0
          proceed=a_ok and c_ok
          verdict='PREHASHED_SPINE_PROCEED_HELDOUT' if proceed else 'PREHASHED_SPINE_STOP_DEVELOPMENT'
          out={'verdict':verdict,'a0_gate':a_ok,'prehash_control_gate':c_ok,'prehashed_vs_a0':a,'prehashed_vs_hashcontrol':c,'hashcontrol_vs_a0':p['hashcontrol_vs_a0']}
          pathlib.Path('results/prehashed-spine/development-verdict.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"proceed={'true' if proceed else 'false'}\n")
          PY

      - name: Disjoint held-out paired CPU gate
        if: steps.dev.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,random,resource,statistics,subprocess
          arms=['a0','prehashed','hashcontrol'];cases=[pathlib.Path(x) for x in pathlib.Path('diagnostics/prehashed-spine/heldout.txt').read_text().splitlines() if x]
          def run(a):
            before=resource.getrusage(resource.RUSAGE_CHILDREN)
            for p in cases:
              with p.open('rb') as f:r=subprocess.run([f'{a}/target/release/sokonanoda',f'{a}/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if r.returncode:raise SystemExit(f'{a} {p} {r.returncode}')
            after=resource.getrusage(resource.RUSAGE_CHILDREN);return (after.ru_utime-before.ru_utime)+(after.ru_stime-before.ru_stime)
          for a in arms:run(a)
          by={};rows=[]
          for rep in range(30):
            order=arms.copy();random.Random(131000+rep).shuffle(order);by[rep]={}
            for a in order:
              cpu=run(a);by[rep][a]=cpu;rows.append({'rep':rep,'arm':a,'cpu_s':cpu})
          def pair(c,b):
            ds=[];wins=0
            for rep in range(30):
              cv=by[rep][c];bv=by[rep][b];ds.append(100*(cv/bv-1));wins+=cv<bv
            return {'median_delta_pct':statistics.median(ds),'wins':wins,'losses':30-wins,'deltas_pct':ds}
          out={'summary':{a:{'median_cpu_s':statistics.median(by[r][a] for r in range(30))} for a in arms},'prehashed_vs_a0':pair('prehashed','a0'),'prehashed_vs_hashcontrol':pair('prehashed','hashcontrol'),'rows':rows}
          pathlib.Path('results/prehashed-spine/heldout-performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2,sort_keys=True))
          PY

      - name: Classify held-out gate
        if: steps.dev.outputs.proceed == 'true'
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('results/prehashed-spine/heldout-performance.json').read_text())
          a=p['prehashed_vs_a0'];c=p['prehashed_vs_hashcontrol']
          net=a['median_delta_pct']<0 and a['wins']>=18
          control=c['median_delta_pct']<0
          v='PREHASHED_SPINE_PROCEED_MATHLIB' if net and control else 'PREHASHED_SPINE_STOP_HELDOUT'
          out={'verdict':v,'net_gate':net,'control_gate':control,'prehashed_vs_a0':a,'prehashed_vs_hashcontrol':c}
          pathlib.Path('results/prehashed-spine/heldout-verdict.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-a6-prehashed-spine-interner
          path: |
            results/prehashed-spine/
            diagnostics/prehashed-spine/
            A6_PREHASHED_SPINE_INTERNER_PROTOCOL.md
