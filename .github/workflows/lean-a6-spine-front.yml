name: Lean A6 spine front-cache gate

on:
  push:
    paths:
      - '.github/workflows/lean-a6-spine-front.yml'
      - 'scripts/patch_a6_spine_front.py'
      - 'scripts/patch_a6_spine_front_ablation.py'
      - 'scripts/patch_a6.py'
      - 'A6_HASH_CONS_FRONT_CACHE_PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a0 front ablation results/spine-front diagnostics/spine-front
          mkdir -p arena-tests artifact results/spine-front diagnostics/spine-front
          curl --fail --location --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" \
            -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Freeze development and held-out manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('arena-tests/good')
          wanted=[
            'perf/grind-ring-5.ndjson',
            'init-prelude.ndjson',
            'perf/app-lam.ndjson',
            'perf/shift-cascade.ndjson',
          ]
          dev=[root/x for x in wanted]
          missing=[str(p) for p in dev if not p.exists()]
          if missing: raise SystemExit(f'missing dev cases {missing}')
          all_good=sorted(root.rglob('*.ndjson'))
          dev_abs={p.resolve() for p in dev}
          remaining=[p for p in all_good if p.resolve() not in dev_abs]
          held=sorted(remaining,key=lambda p:(-p.stat().st_size,str(p)))[:24]
          if len(held)!=24 or set(dev)&set(held): raise SystemExit('bad heldout freeze')
          pathlib.Path('diagnostics/spine-front/development.txt').write_text('\n'.join(map(str,dev))+'\n')
          pathlib.Path('diagnostics/spine-front/heldout.txt').write_text('\n'.join(map(str,held))+'\n')
          pathlib.Path('results/spine-front/manifests.json').write_text(json.dumps({
            'development':list(map(str,dev)),
            'heldout':list(map(str,held)),
            'heldout_rule':'remove four frozen development cases; descending bytes; path tie-break; first 24',
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Reconstruct frozen arms
        shell: bash
        run: |
          set -euo pipefail
          for arm in a0 front ablation; do
            git clone -q https://github.com/intgrah/sokonanoda.git "$arm"
            git -C "$arm" checkout -q "$SOKO_PIN"
            rm -rf a6 && cp -a "$arm" a6
            python3 scripts/patch_a6.py
            case "$arm" in
              front) python3 scripts/patch_a6_spine_front.py ;;
              ablation) python3 scripts/patch_a6_spine_front_ablation.py ;;
              a0) ;;
            esac
            git -C a6 diff --check
            git -C a6 diff > "diagnostics/spine-front/$arm.patch"
            rm -rf "$arm" && mv a6 "$arm"
            cat > "$arm/config.json" <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          done
          test -s diagnostics/spine-front/front.patch
          test -s diagnostics/spine-front/ablation.patch
          grep -q 'SPINE_FRONT_LEN' front/src/util.rs
          grep -q '_front_hit' ablation/src/eval.rs

      - name: Arena-style PGO build all arms
        shell: bash
        run: |
          set -euo pipefail
          rustup component add llvm-tools-preview
          LLVM_PROFDATA=$(find "$(rustc --print sysroot)" -type f -name llvm-profdata | head -1)
          test -x "$LLVM_PROFDATA"
          TRAIN="$PWD/arena-tests/good/init-prelude.ndjson"
          for arm in a0 front ablation; do
            rm -rf "$arm/pgo"; mkdir -p "$arm/pgo"
            (cd "$arm" && RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release)
            "$arm/target/release/sokonanoda" "$arm/config.json" < "$TRAIN" >/dev/null 2>/dev/null || true
            "$LLVM_PROFDATA" merge -o "$arm/pgo/merged.profdata" "$arm/pgo"
            (cd "$arm" && RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release)
            test -x "$arm/target/release/sokonanoda"
          done

      - name: Full frozen semantic gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          good=sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          bad=sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          if len(good)!=103 or len(bad)!=58:
            raise SystemExit(f'frozen corpus mismatch good={len(good)} bad={len(bad)}')
          out={'arms':{}}
          for arm in ['a0','front','ablation']:
            exe=pathlib.Path(arm)/'target/release/sokonanoda'; cfg=pathlib.Path(arm)/'config.json'
            gp=br=0; failures=[]
            for p in good:
              with p.open('rb') as f:
                r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              if r.returncode==0: gp+=1
              elif len(failures)<20:
                failures.append({'kind':'good_rejected','case':str(p),'rc':r.returncode,'stderr':r.stderr.decode(errors='replace')[-1200:]})
            for p in bad:
              with p.open('rb') as f:
                r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              if r.returncode!=0: br+=1
              elif len(failures)<20: failures.append({'kind':'bad_accepted','case':str(p)})
            out['arms'][arm]={'good_pass':gp,'good_total':len(good),'bad_reject':br,'bad_total':len(bad),'failures':failures}
          pathlib.Path('results/spine-front/semantics.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          for arm,x in out['arms'].items():
            if x['good_pass']!=x['good_total'] or x['bad_reject']!=x['bad_total']:
              raise SystemExit(f'SEMANTIC_REJECTION {arm}')
          PY

      - name: Development paired CPU economics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,random,resource,statistics,subprocess
          arms=['a0','front','ablation']
          cases=[pathlib.Path(x) for x in pathlib.Path('diagnostics/spine-front/development.txt').read_text().splitlines() if x]

          def run_case(arm,p):
            before=resource.getrusage(resource.RUSAGE_CHILDREN)
            with p.open('rb') as f:
              r=subprocess.run([f'{arm}/target/release/sokonanoda',f'{arm}/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            after=resource.getrusage(resource.RUSAGE_CHILDREN)
            if r.returncode: raise SystemExit(f'{arm} {p} rc={r.returncode}')
            return (after.ru_utime-before.ru_utime)+(after.ru_stime-before.ru_stime)

          for arm in arms:
            for p in cases: run_case(arm,p)

          rows=[]; totals={}
          for rep in range(30):
            order=arms.copy(); random.Random(47000+rep).shuffle(order); totals[rep]={}
            for arm in order:
              total=0.0; per={}
              for p in cases:
                cpu=run_case(arm,p); total+=cpu; per[str(p)]=cpu
              totals[rep][arm]=total
              rows.append({'rep':rep,'arm':arm,'cpu_s':total,'per_case_cpu_s':per})

          def pair(c,b):
            ds=[]; wins=0
            for rep in range(30):
              cv=totals[rep][c]; bv=totals[rep][b]
              ds.append(100*(cv/bv-1)); wins+=cv<bv
            return {'median_delta_pct':statistics.median(ds),'wins':wins,'losses':30-wins,'deltas_pct':ds}

          out={
            'summary':{a:{'median_cpu_s':statistics.median(totals[r][a] for r in range(30))} for a in arms},
            'front_vs_ablation':pair('front','ablation'),
            'front_vs_a0':pair('front','a0'),
            'rows':rows,
          }
          pathlib.Path('results/spine-front/development-performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2,sort_keys=True))
          PY

      - name: Classify development gate
        id: dev
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,os
          p=json.loads(pathlib.Path('results/spine-front/development-performance.json').read_text())
          fa=p['front_vs_ablation']; f0=p['front_vs_a0']
          causal=fa['median_delta_pct']<0 and fa['wins']>=18
          net=f0['median_delta_pct']<0
          proceed=causal and net
          verdict='SPINE_FRONT_PROCEED_HELDOUT' if proceed else 'SPINE_FRONT_STOP_DEVELOPMENT'
          out={'verdict':verdict,'causal_gate':causal,'net_gate':net,'front_vs_ablation':fa,'front_vs_a0':f0}
          pathlib.Path('results/spine-front/development-verdict.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"proceed={'true' if proceed else 'false'}\n")
          PY

      - name: Disjoint held-out paired CPU gate
        if: steps.dev.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,random,resource,statistics,subprocess
          arms=['a0','front','ablation']
          cases=[pathlib.Path(x) for x in pathlib.Path('diagnostics/spine-front/heldout.txt').read_text().splitlines() if x]

          def run_arm(arm):
            before=resource.getrusage(resource.RUSAGE_CHILDREN)
            for p in cases:
              with p.open('rb') as f:
                r=subprocess.run([f'{arm}/target/release/sokonanoda',f'{arm}/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if r.returncode: raise SystemExit(f'{arm} {p} rc={r.returncode}')
            after=resource.getrusage(resource.RUSAGE_CHILDREN)
            return (after.ru_utime-before.ru_utime)+(after.ru_stime-before.ru_stime)

          for arm in arms: run_arm(arm)
          rows=[]; by={}
          for rep in range(30):
            order=arms.copy(); random.Random(88000+rep).shuffle(order); by[rep]={}
            for arm in order:
              cpu=run_arm(arm); by[rep][arm]=cpu; rows.append({'rep':rep,'arm':arm,'cpu_s':cpu})
          def pair(c,b):
            ds=[]; wins=0
            for rep in range(30):
              cv=by[rep][c]; bv=by[rep][b]; ds.append(100*(cv/bv-1)); wins+=cv<bv
            return {'median_delta_pct':statistics.median(ds),'wins':wins,'losses':30-wins,'deltas_pct':ds}
          out={
            'summary':{a:{'median_cpu_s':statistics.median(by[r][a] for r in range(30))} for a in arms},
            'front_vs_ablation':pair('front','ablation'),
            'front_vs_a0':pair('front','a0'),
            'rows':rows,
          }
          pathlib.Path('results/spine-front/heldout-performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2,sort_keys=True))
          PY

      - name: Classify held-out gate
        if: steps.dev.outputs.proceed == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('results/spine-front/heldout-performance.json').read_text())
          fa=p['front_vs_ablation']; f0=p['front_vs_a0']
          causal=fa['median_delta_pct']<0 and fa['wins']>=18
          net=f0['median_delta_pct']<0 and f0['wins']>=18
          verdict='SPINE_FRONT_PROCEED_MATHLIB' if causal and net else 'SPINE_FRONT_STOP_HELDOUT'
          out={'verdict':verdict,'causal_gate':causal,'net_gate':net,'front_vs_ablation':fa,'front_vs_a0':f0}
          pathlib.Path('results/spine-front/heldout-verdict.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload spine front-cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-a6-spine-front-cache
          path: |
            results/spine-front/
            diagnostics/spine-front/
            A6_HASH_CONS_FRONT_CACHE_PROTOCOL.md
