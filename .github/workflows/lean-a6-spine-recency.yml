name: Lean A6 spine recency cache gate

on:
  push:
    paths:
      - 'A6_SPINE_RECENCY_SELECTED_K.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Read frozen K
        run: |
          set -euo pipefail
          K=$(tr -d '[:space:]' < A6_SPINE_RECENCY_SELECTED_K.txt)
          case "$K" in 1|2|4|8|16) ;; *) echo "invalid K=$K"; exit 1;; esac
          echo "K=$K" >> "$GITHUB_ENV"
          echo "frozen_k=$K"

      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/spine-recent diagnostics/spine-recent
          curl --fail --location --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" \
            -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Freeze development and held-out manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('arena-tests/good')
          dev=[root/x for x in ['perf/grind-ring-5.ndjson','init-prelude.ndjson','perf/app-lam.ndjson','perf/shift-cascade.ndjson']]
          if any(not p.exists() for p in dev): raise SystemExit('missing dev case')
          all_good=sorted(root.rglob('*.ndjson'))
          dev_abs={p.resolve() for p in dev}
          held=sorted([p for p in all_good if p.resolve() not in dev_abs],key=lambda p:(-p.stat().st_size,str(p)))[:24]
          pathlib.Path('diagnostics/spine-recent/development.txt').write_text('\n'.join(map(str,dev))+'\n')
          pathlib.Path('diagnostics/spine-recent/heldout.txt').write_text('\n'.join(map(str,held))+'\n')
          pathlib.Path('results/spine-recent/manifests.json').write_text(json.dumps({'development':list(map(str,dev)),'heldout':list(map(str,held))},indent=2)+'\n')
          PY

      - name: Reconstruct frozen arms
        run: |
          set -euo pipefail
          for arm in a0 recent ablation; do
            git clone -q https://github.com/intgrah/sokonanoda.git "$arm"
            git -C "$arm" checkout -q "$SOKO_PIN"
            rm -rf a6 && cp -a "$arm" a6
            python3 scripts/patch_a6.py
            case "$arm" in
              recent) python3 scripts/patch_a6_spine_recent.py --k "$K" ;;
              ablation) python3 scripts/patch_a6_spine_recent_ablation.py --k "$K" ;;
              a0) ;;
            esac
            git -C a6 diff --check
            git -C a6 diff > "diagnostics/spine-recent/$arm.patch"
            rm -rf "$arm" && mv a6 "$arm"
            cat > "$arm/config.json" <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          done
          test -s diagnostics/spine-recent/recent.patch
          test -s diagnostics/spine-recent/ablation.patch

      - name: Arena-style PGO build all arms
        run: |
          set -euo pipefail
          rustup component add llvm-tools-preview
          LLVM_PROFDATA=$(find "$(rustc --print sysroot)" -type f -name llvm-profdata | head -1)
          TRAIN="$PWD/arena-tests/good/init-prelude.ndjson"
          for arm in a0 recent ablation; do
            rm -rf "$arm/pgo"; mkdir -p "$arm/pgo"
            (cd "$arm" && RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release)
            "$arm/target/release/sokonanoda" "$arm/config.json" < "$TRAIN" >/dev/null 2>/dev/null || true
            "$LLVM_PROFDATA" merge -o "$arm/pgo/merged.profdata" "$arm/pgo"
            (cd "$arm" && RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release)
          done

      - name: Full frozen semantic gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          good=sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          bad=sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          if len(good)!=103 or len(bad)!=58: raise SystemExit((len(good),len(bad)))
          out={}
          for arm in ['a0','recent','ablation']:
            gp=br=0
            for p in good:
              with p.open('rb') as f:r=subprocess.run([f'{arm}/target/release/sokonanoda',f'{arm}/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              gp+=r.returncode==0
            for p in bad:
              with p.open('rb') as f:r=subprocess.run([f'{arm}/target/release/sokonanoda',f'{arm}/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              br+=r.returncode!=0
            out[arm]={'good_pass':gp,'bad_reject':br}
          pathlib.Path('results/spine-recent/semantics.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if any(x['good_pass']!=103 or x['bad_reject']!=58 for x in out.values()): raise SystemExit('semantic rejection')
          PY

      - name: Development paired CPU economics
        id: perf
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,random,resource,statistics,subprocess
          arms=['a0','recent','ablation']; cases=[pathlib.Path(x) for x in pathlib.Path('diagnostics/spine-recent/development.txt').read_text().splitlines() if x]
          def one(arm,p):
            before=resource.getrusage(resource.RUSAGE_CHILDREN)
            with p.open('rb') as f:r=subprocess.run([f'{arm}/target/release/sokonanoda',f'{arm}/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            after=resource.getrusage(resource.RUSAGE_CHILDREN)
            if r.returncode: raise SystemExit(f'{arm} {p} rc={r.returncode}')
            return (after.ru_utime-before.ru_utime)+(after.ru_stime-before.ru_stime)
          for a in arms:
            for p in cases:one(a,p)
          rows=[]; by={}
          for rep in range(30):
            order=arms.copy(); random.Random(62000+rep).shuffle(order); by[rep]={}
            for a in order:
              total=sum(one(a,p) for p in cases); by[rep][a]=total; rows.append({'rep':rep,'arm':a,'cpu_s':total})
          def pair(c,b):
            ds=[];wins=0
            for rep in range(30):
              cv=by[rep][c];bv=by[rep][b];ds.append(100*(cv/bv-1));wins+=cv<bv
            return {'median_delta_pct':statistics.median(ds),'wins':wins,'deltas_pct':ds}
          out={'summary':{a:{'median_cpu_s':statistics.median(by[r][a] for r in range(30))} for a in arms},'recent_vs_ablation':pair('recent','ablation'),'recent_vs_a0':pair('recent','a0'),'rows':rows}
          pathlib.Path('results/spine-recent/development-performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2,sort_keys=True))
          PY

      - name: Classify development gate
        id: dev
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          p=json.loads(pathlib.Path('results/spine-recent/development-performance.json').read_text())
          ca=p['recent_vs_ablation'];n=p['recent_vs_a0']
          causal=ca['median_delta_pct']<0 and ca['wins']>=18
          net=n['median_delta_pct']<0
          proceed=causal and net
          v='SPINE_RECENT_PROCEED_HELDOUT' if proceed else 'SPINE_RECENT_STOP_DEVELOPMENT'
          out={'verdict':v,'K':int(__import__('os').environ['K']),'causal_gate':causal,'net_gate':net,'recent_vs_ablation':ca,'recent_vs_a0':n}
          pathlib.Path('results/spine-recent/development-verdict.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"proceed={'true' if proceed else 'false'}\n")
          PY

      - name: Disjoint held-out paired CPU gate
        if: steps.dev.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,random,resource,statistics,subprocess
          arms=['a0','recent','ablation'];cases=[pathlib.Path(x) for x in pathlib.Path('diagnostics/spine-recent/heldout.txt').read_text().splitlines() if x]
          def run(a):
            before=resource.getrusage(resource.RUSAGE_CHILDREN)
            for p in cases:
              with p.open('rb') as f:r=subprocess.run([f'{a}/target/release/sokonanoda',f'{a}/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if r.returncode:raise SystemExit(f'{a} {p} rc={r.returncode}')
            after=resource.getrusage(resource.RUSAGE_CHILDREN);return (after.ru_utime-before.ru_utime)+(after.ru_stime-before.ru_stime)
          for a in arms:run(a)
          by={};rows=[]
          for rep in range(30):
            order=arms.copy();random.Random(99000+rep).shuffle(order);by[rep]={}
            for a in order:
              cpu=run(a);by[rep][a]=cpu;rows.append({'rep':rep,'arm':a,'cpu_s':cpu})
          def pair(c,b):
            ds=[];wins=0
            for rep in range(30):
              cv=by[rep][c];bv=by[rep][b];ds.append(100*(cv/bv-1));wins+=cv<bv
            return {'median_delta_pct':statistics.median(ds),'wins':wins,'deltas_pct':ds}
          out={'recent_vs_ablation':pair('recent','ablation'),'recent_vs_a0':pair('recent','a0'),'summary':{a:{'median_cpu_s':statistics.median(by[r][a] for r in range(30))} for a in arms},'rows':rows}
          pathlib.Path('results/spine-recent/heldout-performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2,sort_keys=True))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-a6-spine-recency-cache
          path: |
            results/spine-recent/
            diagnostics/spine-recent/
            A6_SPINE_RECENCY_PROTOCOL.md
            A6_SPINE_RECENCY_SELECTED_K.txt
