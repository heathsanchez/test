name: Lean A6 spine scale separator

on:
  push:
    paths:
      - '.github/workflows/lean-a6-spine-scale-diag.yml'
      - 'scripts/patch_a6_spine_scale_diag.py'
      - 'scripts/patch_a6.py'
      - 'A6_ADAPTIVE_SPINE_REPRESENTATION_PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/spine-scale diagnostics/spine-scale
          curl --fail --location --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" \
            -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct scale diagnostic
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout -q 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          python3 scripts/patch_a6.py
          python3 scripts/patch_a6_spine_scale_diag.py
          git -C a6 diff --check
          git -C a6 diff > diagnostics/spine-scale/diagnostic.patch
          cat > a6/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          (cd a6 && RUSTFLAGS="-C target-cpu=native" cargo build --release)

      - name: Freeze exact diagnostic manifests
        run: |
          cat > diagnostics/spine-scale/development.json <<'JSON'
          {
            "positive": [
              "arena-tests/good/perf/grind-ring-5.ndjson",
              "arena-tests/good/init-prelude.ndjson"
            ],
            "control": [
              "arena-tests/good/perf/app-lam.ndjson",
              "arena-tests/good/perf/shift-cascade.ndjson"
            ]
          }
          JSON
          cat > diagnostics/spine-scale/heldout.txt <<'EOF'
          arena-tests/good/undecidability/alg-conv-trans-acc-right.ndjson
          arena-tests/good/undecidability/alg-conv-trans-acc-left.ndjson
          arena-tests/good/undecidability/subject-reduction-redex.ndjson
          arena-tests/good/tutorial/080_RBTree.id_spec.ndjson
          arena-tests/good/tutorial/079_listRecReduction.ndjson
          arena-tests/good/tutorial/069_rbTreeRef.ndjson
          arena-tests/good/tutorial/043_rbTreeDef.ndjson
          arena-tests/good/tutorial/121_accRecReduction.ndjson
          arena-tests/good/tutorial/078_nRecReduction.ndjson
          arena-tests/good/tutorial/108_structEta.ndjson
          arena-tests/good/tutorial/119_rtreeRecReduction.ndjson
          arena-tests/good/tutorial/076_boolRecEqns.ndjson
          arena-tests/good/tutorial/077_prodRecEqns.ndjson
          arena-tests/good/tutorial/096_projRed.ndjson
          arena-tests/good/undecidability/alg-conv-trans-quot-right.ndjson
          arena-tests/good/tutorial/087_projProp1.ndjson
          arena-tests/good/tutorial/089_projProp3.ndjson
          arena-tests/good/tutorial/073_typeSingletonRecReduction.ndjson
          arena-tests/good/tutorial/127_quotLiftReduction.ndjson
          arena-tests/good/tutorial/128_quotIndReduction.ndjson
          arena-tests/good/tutorial/120_accRecType.ndjson
          arena-tests/good/tutorial/126_quotSoundType.ndjson
          arena-tests/good/tutorial/093_projDataIndexRec.ndjson
          arena-tests/good/tutorial/075_sortElimProp2Rec.ndjson
          EOF

      - name: Measure baseline spine scale and freeze threshold
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          dev=json.loads(pathlib.Path('diagnostics/spine-scale/development.json').read_text())
          held=[x for x in pathlib.Path('diagnostics/spine-scale/heldout.txt').read_text().splitlines() if x]
          cases=dev['positive']+dev['control']+held
          if len(cases)!=28 or len(set(cases))!=28:
              raise SystemExit('manifest non-vacuity failure')
          for p in cases:
              if not pathlib.Path(p).exists(): raise SystemExit(f'missing {p}')
          rx=re.compile(r'SPINE_SCALE total=(\d+) hit=(\d+) miss=(\d+) peak_len=(\d+)')
          rows={}
          for p in cases:
              with open(p,'rb') as f:
                  r=subprocess.run(
                      ['a6/target/release/sokonanoda','a6/config.json'],
                      stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                      env={**os.environ,'SOKONANODA_SPINE_SCALE_DIAG':'1'},
                  )
              if r.returncode:
                  raise SystemExit(f'{p} rc={r.returncode}: {r.stderr.decode(errors="replace")[-1500:]}')
              m=rx.search(r.stderr.decode(errors='replace'))
              if not m: raise SystemExit(f'missing scale telemetry {p}')
              total,hit,miss,peak=map(int,m.groups())
              rows[p]={
                  'total':total,'hit':hit,'miss':miss,'peak_len':peak,
                  'hit_rate':hit/total if total else 0,
              }
          pos=[rows[p]['peak_len'] for p in dev['positive']]
          ctl=[rows[p]['peak_len'] for p in dev['control']]
          separated=min(pos)>max(ctl)
          threshold=max(ctl)+1 if separated else None
          out={
              'feature':'peak_len',
              'positive_cases':dev['positive'],
              'control_cases':dev['control'],
              'rows':rows,
              'positive_peaks':pos,
              'control_peaks':ctl,
              'separated':separated,
              'threshold_rule':'max(control_peaks)+1 if min(positive_peaks)>max(control_peaks)',
              'selected_threshold':threshold,
              'heldout_activation_prediction':{
                  'count':sum(rows[p]['peak_len']>=threshold for p in held) if threshold is not None else None,
                  'cases':[p for p in held if threshold is not None and rows[p]['peak_len']>=threshold],
              },
          }
          pathlib.Path('results/spine-scale/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Frozen semantic replay
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          good=sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          bad=sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          gp=br=0
          for p in good:
              with p.open('rb') as f:
                  r=subprocess.run(['a6/target/release/sokonanoda','a6/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              gp+=r.returncode==0
          for p in bad:
              with p.open('rb') as f:
                  r=subprocess.run(['a6/target/release/sokonanoda','a6/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              br+=r.returncode!=0
          out={'good_pass':gp,'good_total':len(good),'bad_reject':br,'bad_total':len(bad)}
          pathlib.Path('results/spine-scale/semantics.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if gp!=len(good) or br!=len(bad): raise SystemExit('semantic diagnostic regression')
          PY

      - name: Upload scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-a6-spine-scale-separator
          path: |
            results/spine-scale/
            diagnostics/spine-scale/
            A6_ADAPTIVE_SPINE_REPRESENTATION_PROTOCOL.md
