name: Lean consequence quotient demo

on:
  push:
    paths:
      - '.github/workflows/lean-consequence-quotient-demo.yml'
      - 'scripts/patch_consequence_quotient_discovery.py'
      - 'scripts/patch_a6.py'
      - 'scripts/patch_a6_e0035_no_frame_intern.py'
      - 'CONSEQUENCE_QUOTIENT_DEMO.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  consequence-quotient:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426

    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen external Lean Kernel Arena oracle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip results/cq-demo diagnostics/cq-demo
          mkdir -p arena-tests artifact results/cq-demo diagnostics/cq-demo
          printf 'repo_commit=%s\n' "$GITHUB_SHA" | tee diagnostics/cq-demo/provenance.txt
          printf 'sokonanoda_pin=%s\n' "$SOKO_PIN" | tee -a diagnostics/cq-demo/provenance.txt
          printf 'arena_artifact=%s\n' "$ARENA_ARTIFACT" | tee -a diagnostics/cq-demo/provenance.txt
          curl --fail --location --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" \
            -o tests.zip
          unzip -t tests.zip > diagnostics/cq-demo/artifact_zip_test.txt
          unzip -q tests.zip -d artifact
          test -f artifact/lean-arena-tests.tar.gz
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          find arena-tests/good -type f -name '*.ndjson' | sort > diagnostics/cq-demo/good_manifest.txt
          find arena-tests/bad -type f -name '*.ndjson' | sort > diagnostics/cq-demo/bad_manifest.txt
          test -s diagnostics/cq-demo/good_manifest.txt
          test -s diagnostics/cq-demo/bad_manifest.txt
          printf 'good=%s\nbad=%s\n' \
            "$(wc -l < diagnostics/cq-demo/good_manifest.txt)" \
            "$(wc -l < diagnostics/cq-demo/bad_manifest.txt)" \
            | tee -a diagnostics/cq-demo/provenance.txt

      - name: Reconstruct discovery quotient and ablation arms
        shell: bash
        run: |
          set -euo pipefail
          for arm in discover quotient ablation; do
            git clone -q https://github.com/intgrah/sokonanoda.git "$arm"
            git -C "$arm" checkout -q "$SOKO_PIN"

            rm -rf a6
            cp -a "$arm" a6
            python3 scripts/patch_a6.py

            case "$arm" in
              discover)
                python3 scripts/patch_consequence_quotient_discovery.py
                ;;
              quotient)
                ;;
              ablation)
                python3 scripts/patch_a6_e0035_no_frame_intern.py
                ;;
            esac

            git -C a6 diff --check
            git -C a6 diff > "diagnostics/cq-demo/$arm.patch"
            test -s "diagnostics/cq-demo/$arm.patch"
            rm -rf "$arm"
            mv a6 "$arm"

            cat > "$arm/config.json" <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          done

          cmp --silent quotient/config.json ablation/config.json
          cmp --silent quotient/config.json discover/config.json
          grep -q 'CQ_DISCOVERY_REPEAT_SIGNATURES' discover/src/eval.rs
          grep -q 'return e;' quotient/src/eval.rs
          grep -q 'E0035 causal ablation' ablation/src/eval.rs

      - name: Build all arms identically
        shell: bash
        run: |
          set -euo pipefail
          for arm in discover quotient ablation; do
            echo "=== BUILD $arm ===" | tee "diagnostics/cq-demo/$arm-build.log"
            (
              cd "$arm"
              RUSTFLAGS="-C target-cpu=native" cargo build --release
            ) 2>&1 | tee -a "diagnostics/cq-demo/$arm-build.log"
            test -x "$arm/target/release/sokonanoda"
          done

      - name: Discover candidate equivalence without reuse
        shell: bash
        run: |
          set -euo pipefail
          find arena-tests/good -type f -name '*grind-ring-5*.ndjson' | sort > diagnostics/cq-demo/discovery_candidates.txt
          test "$(wc -l < diagnostics/cq-demo/discovery_candidates.txt)" -eq 1
          CASE=$(cat diagnostics/cq-demo/discovery_candidates.txt)
          printf '%s\n' "$CASE" > diagnostics/cq-demo/discovery_case.txt

          SOKONANODA_CQ_DISCOVERY=1 \
            discover/target/release/sokonanoda discover/config.json \
            < "$CASE" \
            > diagnostics/cq-demo/discovery_stdout.txt \
            2> diagnostics/cq-demo/discovery_stderr.txt

          python3 - <<'PY'
          import json, pathlib, re

          text = pathlib.Path('diagnostics/cq-demo/discovery_stderr.txt').read_text(errors='replace')
          m = re.search(r'CQ_DISCOVERY calls=(\d+) repeat_signatures=(\d+) new_signatures=(\d+)', text)
          if not m:
              raise SystemExit('missing CQ_DISCOVERY telemetry')
          calls, repeats, new = map(int, m.groups())
          if calls <= 0 or new <= 0 or repeats <= 0:
              raise SystemExit(f'non-vacuity failure: calls={calls} repeats={repeats} new={new}')
          if repeats + new != calls:
              raise SystemExit(f'accounting failure: calls={calls} repeats={repeats} new={new}')

          case = pathlib.Path('diagnostics/cq-demo/discovery_case.txt').read_text().strip()
          discovery = {
              'discovery_case': case,
              'calls': calls,
              'repeat_signatures': repeats,
              'new_signatures': new,
              'repeat_fraction': repeats / calls,
              'performance_seen_before_prediction': False,
              'candidate_equivalence': 'same(mask, ordered slot identities, level-substitution identity)',
          }
          pathlib.Path('results/cq-demo/discovery.json').write_text(json.dumps(discovery, indent=2, sort_keys=True) + '\n')

          prediction = {
              'frozen_before_performance': True,
              'prediction': 'Repeated exact projected-frame signatures are safe to share and should reduce protected evaluation cost if reuse has computational value.',
              'compiled_change': 'Return the canonical interned frame for a repeated signature.',
              'causal_ablation': 'Preserve frame contents but allocate a fresh equal frame for every request.',
              'discovery_case_excluded_from_heldout_performance': True,
              'primary_metric': 'paired CPU seconds',
              'positive_result_rule': 'full frozen semantic oracle passes; quotient median paired CPU delta < 0; quotient wins at least 12 of 15 paired repetitions',
          }
          pathlib.Path('results/cq-demo/prediction.json').write_text(json.dumps(prediction, indent=2, sort_keys=True) + '\n')
          print(json.dumps(discovery, indent=2, sort_keys=True))
          print(json.dumps(prediction, indent=2, sort_keys=True))
          PY

      - name: External semantic gate before performance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess

          arms = ['quotient', 'ablation']
          good = sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          bad = sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          if not good or not bad:
              raise SystemExit(f'non-vacuity failure: good={len(good)} bad={len(bad)}')

          out = {
              'oracle': 'frozen Lean Kernel Arena good/bad corpus artifact 8931227426',
              'arms': {},
          }

          for arm in arms:
              exe = pathlib.Path(arm) / 'target/release/sokonanoda'
              cfg = pathlib.Path(arm) / 'config.json'
              gp = br = 0
              failures = []

              for p in good:
                  with p.open('rb') as f:
                      r = subprocess.run([str(exe), str(cfg)], stdin=f, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                  if r.returncode == 0:
                      gp += 1
                  elif len(failures) < 20:
                      failures.append({'kind': 'good_rejected', 'case': str(p), 'rc': r.returncode, 'stderr_tail': r.stderr.decode(errors='replace')[-1000:]})

              for p in bad:
                  with p.open('rb') as f:
                      r = subprocess.run([str(exe), str(cfg)], stdin=f, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                  if r.returncode != 0:
                      br += 1
                  elif len(failures) < 20:
                      failures.append({'kind': 'bad_accepted', 'case': str(p), 'rc': r.returncode})

              out['arms'][arm] = {
                  'good_pass': gp,
                  'good_total': len(good),
                  'bad_reject': br,
                  'bad_total': len(bad),
                  'failures': failures,
              }

          pathlib.Path('results/cq-demo/semantics.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, indent=2, sort_keys=True))

          for arm in arms:
              x = out['arms'][arm]
              if x['good_pass'] != x['good_total'] or x['bad_reject'] != x['bad_total']:
                  raise SystemExit(f'external semantic gate failed for {arm}')
          PY

      - name: Freeze deterministic held-out workload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib

          discovery = pathlib.Path('diagnostics/cq-demo/discovery_case.txt').read_text().strip()
          discovery_path = pathlib.Path(discovery).resolve()
          good = [p for p in pathlib.Path('arena-tests/good').rglob('*.ndjson') if p.resolve() != discovery_path]
          if len(good) < 24:
              raise SystemExit(f'need at least 24 held-out good cases, found {len(good)}')

          # Selection uses only frozen file size and path; no quotient/ablation timing is read.
          workload = sorted(good, key=lambda p: (-p.stat().st_size, str(p)))[:24]
          if any('grind-ring-5' in p.name for p in workload):
              raise SystemExit('discovery case leaked into held-out workload')

          manifest = [str(p) for p in workload]
          pathlib.Path('diagnostics/cq-demo/heldout_manifest.txt').write_text('\n'.join(manifest) + '\n')
          pathlib.Path('results/cq-demo/heldout_selection.json').write_text(json.dumps({
              'selection_rule': '24 largest frozen good cases by byte size, deterministic path tie-break, discovery case excluded',
              'performance_observed_during_selection': False,
              'cases': manifest,
          }, indent=2, sort_keys=True) + '\n')
          print('\n'.join(manifest))
          PY

      - name: Paired held-out performance and causal ablation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, random, resource, statistics, subprocess, time

          arms = ['quotient', 'ablation']
          workload = [pathlib.Path(x) for x in pathlib.Path('diagnostics/cq-demo/heldout_manifest.txt').read_text().splitlines() if x.strip()]
          if not workload:
              raise SystemExit('empty held-out workload')

          rows = []
          by_rep = {}

          for rep in range(15):
              order = arms.copy()
              random.Random(rep).shuffle(order)
              by_rep[rep] = {}
              for arm in order:
                  exe = pathlib.Path(arm) / 'target/release/sokonanoda'
                  cfg = pathlib.Path(arm) / 'config.json'
                  before = resource.getrusage(resource.RUSAGE_CHILDREN)
                  start = time.perf_counter()
                  for p in workload:
                      with p.open('rb') as f:
                          r = subprocess.run([str(exe), str(cfg)], stdin=f, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      if r.returncode != 0:
                          raise SystemExit(f'{arm} failed held-out case {p}: rc={r.returncode}')
                  wall = time.perf_counter() - start
                  after = resource.getrusage(resource.RUSAGE_CHILDREN)
                  cpu = (after.ru_utime - before.ru_utime) + (after.ru_stime - before.ru_stime)
                  row = {'rep': rep, 'arm': arm, 'cpu_s': cpu, 'wall_s': wall}
                  rows.append(row)
                  by_rep[rep][arm] = row

          summary = {}
          for arm in arms:
              summary[arm] = {
                  'median_cpu_s': statistics.median(r['cpu_s'] for r in rows if r['arm'] == arm),
                  'median_wall_s': statistics.median(r['wall_s'] for r in rows if r['arm'] == arm),
              }

          paired_cpu_pct = []
          paired_wall_pct = []
          q_cpu_wins = 0
          q_wall_wins = 0
          for rep in range(15):
              q = by_rep[rep]['quotient']
              a = by_rep[rep]['ablation']
              paired_cpu_pct.append(100.0 * (q['cpu_s'] / a['cpu_s'] - 1.0))
              paired_wall_pct.append(100.0 * (q['wall_s'] / a['wall_s'] - 1.0))
              q_cpu_wins += q['cpu_s'] < a['cpu_s']
              q_wall_wins += q['wall_s'] < a['wall_s']

          perf = {
              'primary_metric': 'paired CPU seconds',
              'repetitions': 15,
              'heldout_case_count': len(workload),
              'summary': summary,
              'median_paired_cpu_delta_pct_quotient_vs_ablation': statistics.median(paired_cpu_pct),
              'median_paired_wall_delta_pct_quotient_vs_ablation': statistics.median(paired_wall_pct),
              'quotient_cpu_wins': q_cpu_wins,
              'quotient_wall_wins': q_wall_wins,
              'paired_cpu_delta_pct': paired_cpu_pct,
              'paired_wall_delta_pct': paired_wall_pct,
              'rows': rows,
          }
          pathlib.Path('results/cq-demo/performance.json').write_text(json.dumps(perf, indent=2, sort_keys=True) + '\n')
          print(json.dumps(perf, indent=2, sort_keys=True))
          PY

      - name: Classify the demonstration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib

          discovery = json.loads(pathlib.Path('results/cq-demo/discovery.json').read_text())
          semantics = json.loads(pathlib.Path('results/cq-demo/semantics.json').read_text())
          perf = json.loads(pathlib.Path('results/cq-demo/performance.json').read_text())

          semantic_ok = all(
              x['good_pass'] == x['good_total'] and x['bad_reject'] == x['bad_total']
              for x in semantics['arms'].values()
          )
          discovery_ok = discovery['repeat_signatures'] > 0
          median_delta = perf['median_paired_cpu_delta_pct_quotient_vs_ablation']
          robust_win = median_delta < 0 and perf['quotient_cpu_wins'] >= 12

          if not semantic_ok:
              verdict = 'SEMANTIC_REJECTION'
          elif discovery_ok and robust_win:
              verdict = 'VERIFIED_CAUSAL_QUOTIENT_GAIN'
          else:
              verdict = 'VERIFIED_EQUIVALENCE_NO_HELDOUT_GAIN'

          result = {
              'verdict': verdict,
              'discovery_repeat_signatures': discovery['repeat_signatures'],
              'discovery_repeat_fraction': discovery['repeat_fraction'],
              'external_semantic_gate': semantic_ok,
              'heldout_median_paired_cpu_delta_pct': median_delta,
              'heldout_quotient_cpu_wins_of_15': perf['quotient_cpu_wins'],
              'claim_boundary': 'Demonstrates the discover->predict->compile->verify->holdout->ablate protocol; does not claim frame interning itself is novel.',
          }
          pathlib.Path('results/cq-demo/verdict.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          pathlib.Path('results/cq-demo/VERDICT.txt').write_text(verdict + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))

          if not semantic_ok:
              raise SystemExit('semantic rejection')
          PY

      - name: Upload complete evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-consequence-quotient-demo
          path: |
            results/cq-demo/
            diagnostics/cq-demo/
            CONSEQUENCE_QUOTIENT_DEMO.md
