name: Lean separate consequential Pi cache

on:
  push:
    paths:
      - '.github/workflows/lean-consequential-pi-cache.yml'
      - 'scripts/patch_cq_pi_eval_cache.py'
      - 'scripts/patch_cq_pi_eval_cache_ablation.py'
      - 'scripts/patch_a6.py'
      - 'NOVEL_CONSEQUENCE_QUOTIENT_V3.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pi-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
      SHADOW_RUN: 34915583025
      HELDOUT_SHADOW_HITS: 602
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen external Arena oracle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a0 quotient ablation results/pi-cache diagnostics/pi-cache
          mkdir -p arena-tests artifact results/pi-cache diagnostics/pi-cache
          {
            echo "repo_commit=$GITHUB_SHA"
            echo "sokonanoda_pin=$SOKO_PIN"
            echo "arena_artifact=$ARENA_ARTIFACT"
            echo "shadow_run=$SHADOW_RUN"
            echo "heldout_shadow_hits=$HELDOUT_SHADOW_HITS"
          } | tee diagnostics/pi-cache/provenance.txt
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          test -f artifact/lean-arena-tests.tar.gz
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct frozen arms
        shell: bash
        run: |
          set -euo pipefail
          for arm in a0 quotient ablation; do
            git clone -q https://github.com/intgrah/sokonanoda.git "$arm"
            git -C "$arm" checkout -q "$SOKO_PIN"
            rm -rf a6
            cp -a "$arm" a6
            python3 scripts/patch_a6.py
            case "$arm" in
              quotient) python3 scripts/patch_cq_pi_eval_cache.py ;;
              ablation) python3 scripts/patch_cq_pi_eval_cache_ablation.py ;;
              a0) ;;
            esac
            git -C a6 diff --check
            git -C a6 diff > "diagnostics/pi-cache/$arm.patch"
            test -s "diagnostics/pi-cache/$arm.patch"
            rm -rf "$arm"
            mv a6 "$arm"
            cat > "$arm/config.json" <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          done
          cmp --silent a0/config.json quotient/config.json
          cmp --silent a0/config.json ablation/config.json
          grep -Fq 'cq_pi_eval_cache' quotient/src/util.rs
          grep -Fq 'return v;' quotient/src/eval.rs
          grep -Fq 'let _ = self.tc_cache.cq_pi_eval_cache.get(qkey);' ablation/src/eval.rs
          if grep -Fq 'canonicalize_for_spine(raw)' quotient/src/eval.rs; then
            echo "forbidden eager canonicalization" >&2
            exit 1
          fi

      - name: Build all arms identically
        shell: bash
        run: |
          set -euo pipefail
          for arm in a0 quotient ablation; do
            echo "=== BUILD $arm ===" | tee "diagnostics/pi-cache/$arm-build.log"
            (
              cd "$arm"
              RUSTFLAGS="-C target-cpu=native" cargo build --release
            ) 2>&1 | tee -a "diagnostics/pi-cache/$arm-build.log"
            test -x "$arm/target/release/sokonanoda"
          done

      - name: External semantic gate before timing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          arms=['a0','quotient','ablation']
          good=sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          bad=sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          if len(good)!=103 or len(bad)!=58:
              raise SystemExit(f'frozen oracle cardinality changed: good={len(good)} bad={len(bad)}')
          out={'oracle_artifact':8931227426,'arms':{}}
          for arm in arms:
              exe=pathlib.Path(arm)/'target/release/sokonanoda'
              cfg=pathlib.Path(arm)/'config.json'
              gp=br=0; failures=[]
              for p in good:
                  with p.open('rb') as f:
                      r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
                  if r.returncode==0: gp+=1
                  elif len(failures)<20:
                      failures.append({'kind':'good_rejected','case':str(p),'rc':r.returncode,'stderr_tail':r.stderr.decode(errors='replace')[-1000:]})
              for p in bad:
                  with p.open('rb') as f:
                      r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
                  if r.returncode!=0: br+=1
                  elif len(failures)<20:
                      failures.append({'kind':'bad_accepted','case':str(p)})
              out['arms'][arm]={'good_pass':gp,'good_total':len(good),'bad_reject':br,'bad_total':len(bad),'failures':failures}
          pathlib.Path('results/pi-cache/semantics.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          for arm,x in out['arms'].items():
              if x['good_pass']!=x['good_total'] or x['bad_reject']!=x['bad_total']:
                  raise SystemExit(f'SEMANTIC_REJECTION {arm}')
          PY

      - name: Freeze held-out workload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          discovery=sorted(pathlib.Path('arena-tests/good').rglob('*grind-ring-5*.ndjson'))
          if len(discovery)!=1: raise SystemExit(len(discovery))
          d=discovery[0].resolve()
          good=[p for p in pathlib.Path('arena-tests/good').rglob('*.ndjson') if p.resolve()!=d]
          held=sorted(good,key=lambda p:(-p.stat().st_size,str(p)))[:24]
          if len(held)!=24 or any(p.resolve()==d for p in held): raise SystemExit('bad heldout')
          manifest=[str(p) for p in held]
          pathlib.Path('diagnostics/pi-cache/heldout_manifest.txt').write_text('\n'.join(manifest)+'\n')
          result={
            'selection_rule':'24 largest frozen good cases by byte size, path tie-break; grind-ring-5 excluded',
            'shadow_run':34915583025,
            'performance_observed_during_selection':False,
            'cases':manifest,
          }
          pathlib.Path('results/pi-cache/heldout_selection.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Paired held-out causal benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,random,resource,statistics,subprocess,time
          arms=['a0','quotient','ablation']
          workload=[pathlib.Path(x) for x in pathlib.Path('diagnostics/pi-cache/heldout_manifest.txt').read_text().splitlines() if x]

          for arm in arms:
              exe=pathlib.Path(arm)/'target/release/sokonanoda'
              cfg=pathlib.Path(arm)/'config.json'
              for p in workload:
                  with p.open('rb') as f:
                      r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  if r.returncode!=0: raise SystemExit(f'warmup failure {arm} {p}: {r.returncode}')

          rows=[]; by_rep={}
          for rep in range(15):
              order=arms.copy(); random.Random(rep).shuffle(order); by_rep[rep]={}
              for arm in order:
                  exe=pathlib.Path(arm)/'target/release/sokonanoda'
                  cfg=pathlib.Path(arm)/'config.json'
                  before=resource.getrusage(resource.RUSAGE_CHILDREN)
                  start=time.perf_counter()
                  for p in workload:
                      with p.open('rb') as f:
                          r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      if r.returncode!=0: raise SystemExit(f'{arm} failed {p}: {r.returncode}')
                  wall=time.perf_counter()-start
                  after=resource.getrusage(resource.RUSAGE_CHILDREN)
                  cpu=(after.ru_utime-before.ru_utime)+(after.ru_stime-before.ru_stime)
                  row={'rep':rep,'arm':arm,'cpu_s':cpu,'wall_s':wall}
                  rows.append(row); by_rep[rep][arm]=row

          summary={arm:{
            'median_cpu_s':statistics.median(r['cpu_s'] for r in rows if r['arm']==arm),
            'median_wall_s':statistics.median(r['wall_s'] for r in rows if r['arm']==arm),
          } for arm in arms}

          def paired(candidate,control,metric):
              ds=[]; wins=0
              for rep in range(15):
                  c=by_rep[rep][candidate][metric]; b=by_rep[rep][control][metric]
                  ds.append(100.0*(c/b-1.0)); wins+=c<b
              return {'median_delta_pct':statistics.median(ds),'wins':wins,'deltas_pct':ds}

          perf={
            'primary_metric':'paired CPU seconds',
            'repetitions':15,
            'heldout_case_count':len(workload),
            'summary':summary,
            'quotient_vs_ablation_cpu':paired('quotient','ablation','cpu_s'),
            'quotient_vs_a0_cpu':paired('quotient','a0','cpu_s'),
            'quotient_vs_ablation_wall':paired('quotient','ablation','wall_s'),
            'quotient_vs_a0_wall':paired('quotient','a0','wall_s'),
            'rows':rows,
          }
          pathlib.Path('results/pi-cache/performance.json').write_text(json.dumps(perf,indent=2,sort_keys=True)+'\n')
          print(json.dumps(perf,indent=2,sort_keys=True))
          PY

      - name: Classify frozen V3 experiment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          sem=json.loads(pathlib.Path('results/pi-cache/semantics.json').read_text())
          perf=json.loads(pathlib.Path('results/pi-cache/performance.json').read_text())
          semantic_ok=all(x['good_pass']==x['good_total'] and x['bad_reject']==x['bad_total'] for x in sem['arms'].values())
          qa=perf['quotient_vs_ablation_cpu']; q0=perf['quotient_vs_a0_cpu']
          causal=qa['median_delta_pct']<0 and qa['wins']>=12
          net=q0['median_delta_pct']<0 and q0['wins']>=10
          if not semantic_ok:
              verdict='SEMANTIC_REJECTION'
          elif causal and net:
              verdict='VERIFIED_SEPARATE_CONSEQUENTIAL_PI_CACHE_GAIN'
          elif causal:
              verdict='VERIFIED_PI_CACHE_CAUSAL_BUT_NET_NEGATIVE'
          else:
              verdict='VERIFIED_PI_SHADOW_OPPORTUNITY_NO_CAUSAL_GAIN'
          result={
            'verdict':verdict,
            'shadow_run':34915583025,
            'heldout_shadow_hits':602,
            'external_semantic_gate':semantic_ok,
            'quotient_vs_ablation_cpu_median_delta_pct':qa['median_delta_pct'],
            'quotient_vs_ablation_cpu_wins_of_15':qa['wins'],
            'quotient_vs_a0_cpu_median_delta_pct':q0['median_delta_pct'],
            'quotient_vs_a0_cpu_wins_of_15':q0['wins'],
            'claim_boundary':'Separate consequential cache identity for Pi only; raw Env operational state unchanged.',
          }
          pathlib.Path('results/pi-cache/verdict.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          pathlib.Path('results/pi-cache/VERDICT.txt').write_text(verdict+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if not semantic_ok: raise SystemExit(verdict)
          PY

      - name: Upload complete V3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-separate-consequential-pi-cache
          path: |
            results/pi-cache/
            diagnostics/pi-cache/
            NOVEL_CONSEQUENCE_QUOTIENT_V3.md
