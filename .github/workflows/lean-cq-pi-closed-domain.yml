name: Lean closed consequential Pi-domain reuse

on:
  push:
    paths:
      - '.github/workflows/lean-cq-pi-closed-domain.yml'
      - 'scripts/patch_cq_pi_closed_domain_dm.py'
      - 'scripts/patch_cq_pi_closed_domain_dm_ablation.py'
      - 'scripts/patch_a6.py'
      - 'NOVEL_CONSEQUENCE_QUOTIENT_V6.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dm:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen external Arena oracle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a0 quotient ablation results/pi-closed diagnostics/pi-closed
          mkdir -p arena-tests artifact results/pi-closed diagnostics/pi-closed
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct frozen arms
        shell: bash
        run: |
          set -euo pipefail
          for arm in a0 quotient ablation; do
            git clone -q https://github.com/intgrah/sokonanoda.git "$arm"
            git -C "$arm" checkout -q "$SOKO_PIN"
            rm -rf a6 && cp -a "$arm" a6
            python3 scripts/patch_a6.py
            case "$arm" in
              quotient) python3 scripts/patch_cq_pi_closed_domain_dm.py ;;
              ablation) python3 scripts/patch_cq_pi_closed_domain_dm_ablation.py ;;
              a0) ;;
            esac
            git -C a6 diff --check
            git -C a6 diff > "diagnostics/pi-closed/$arm.patch"
            rm -rf "$arm" && mv a6 "$arm"
            cat > "$arm/config.json" <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          done
          grep -Fq 'CQ_PI_DM_LEN' quotient/src/util.rs\n          grep -Fq 'domain.is_closed()' quotient/src/eval.rs
          grep -Fq 'cq_env_eq' quotient/src/eval.rs
          grep -Fq 'std::hint::black_box(domain)' quotient/src/eval.rs
          grep -Fq '_cached_domain = std::hint::black_box(domain)' ablation/src/eval.rs

      - name: Build all arms identically
        shell: bash
        run: |
          set -euo pipefail
          for arm in a0 quotient ablation; do
            (cd "$arm" && RUSTFLAGS="-C target-cpu=native" cargo build --release)
            test -x "$arm/target/release/sokonanoda"
          done

      - name: External semantic gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          good=sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          bad=sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          if len(good)!=103 or len(bad)!=58: raise SystemExit((len(good),len(bad)))
          out={'arms':{}}
          for arm in ['a0','quotient','ablation']:
              exe=pathlib.Path(arm)/'target/release/sokonanoda'; cfg=pathlib.Path(arm)/'config.json'
              gp=br=0; failures=[]
              for p in good:
                  with p.open('rb') as f:
                      r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
                  if r.returncode==0: gp+=1
                  elif len(failures)<20: failures.append({'kind':'good_rejected','case':str(p),'rc':r.returncode,'stderr':r.stderr.decode(errors='replace')[-1000:]})
              for p in bad:
                  with p.open('rb') as f:
                      r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
                  if r.returncode!=0: br+=1
                  elif len(failures)<20: failures.append({'kind':'bad_accepted','case':str(p)})
              out['arms'][arm]={'good_pass':gp,'bad_reject':br,'failures':failures}
          pathlib.Path('results/pi-closed/semantics.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          for arm,x in out['arms'].items():
              if x['good_pass']!=103 or x['bad_reject']!=58: raise SystemExit(f'SEMANTIC_REJECTION {arm}')
          PY

      - name: Freeze held-out workload
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json
          ds=sorted(pathlib.Path('arena-tests/good').rglob('*grind-ring-5*.ndjson'))
          if len(ds)!=1: raise SystemExit(len(ds))
          d=ds[0].resolve()
          good=[p for p in pathlib.Path('arena-tests/good').rglob('*.ndjson') if p.resolve()!=d]
          held=sorted(good,key=lambda p:(-p.stat().st_size,str(p)))[:24]
          pathlib.Path('diagnostics/pi-closed/heldout.txt').write_text('\n'.join(map(str,held))+'\n')
          pathlib.Path('results/pi-closed/heldout.json').write_text(json.dumps({'cases':list(map(str,held))},indent=2)+'\n')
          PY

      - name: Paired held-out benchmark
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,random,resource,statistics,subprocess,time
          arms=['a0','quotient','ablation']
          cases=[pathlib.Path(x) for x in pathlib.Path('diagnostics/pi-closed/heldout.txt').read_text().splitlines() if x]
          for arm in arms:
              exe=pathlib.Path(arm)/'target/release/sokonanoda'; cfg=pathlib.Path(arm)/'config.json'
              for p in cases:
                  with p.open('rb') as f: r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  if r.returncode: raise SystemExit(f'warmup {arm} {p} {r.returncode}')
          rows=[]; by={}
          for rep in range(15):
              order=arms.copy(); random.Random(rep).shuffle(order); by[rep]={}
              for arm in order:
                  exe=pathlib.Path(arm)/'target/release/sokonanoda'; cfg=pathlib.Path(arm)/'config.json'
                  before=resource.getrusage(resource.RUSAGE_CHILDREN); start=time.perf_counter()
                  for p in cases:
                      with p.open('rb') as f: r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      if r.returncode: raise SystemExit(f'{arm} {p} {r.returncode}')
                  wall=time.perf_counter()-start; after=resource.getrusage(resource.RUSAGE_CHILDREN)
                  cpu=(after.ru_utime-before.ru_utime)+(after.ru_stime-before.ru_stime)
                  row={'rep':rep,'arm':arm,'cpu_s':cpu,'wall_s':wall}; rows.append(row); by[rep][arm]=row
          def pair(c,b,m):
              ds=[]; wins=0
              for rep in range(15):
                  cv=by[rep][c][m]; bv=by[rep][b][m]; ds.append(100*(cv/bv-1)); wins+=cv<bv
              return {'median_delta_pct':statistics.median(ds),'wins':wins,'deltas_pct':ds}
          out={
            'summary':{a:{'median_cpu_s':statistics.median(r['cpu_s'] for r in rows if r['arm']==a),'median_wall_s':statistics.median(r['wall_s'] for r in rows if r['arm']==a)} for a in arms},
            'quotient_vs_ablation_cpu':pair('quotient','ablation','cpu_s'),
            'quotient_vs_a0_cpu':pair('quotient','a0','cpu_s'),
            'quotient_vs_ablation_wall':pair('quotient','ablation','wall_s'),
            'quotient_vs_a0_wall':pair('quotient','a0','wall_s'),
            'rows':rows,
          }
          pathlib.Path('results/pi-closed/performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Classify V6
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('results/pi-closed/semantics.json').read_text())
          p=json.loads(pathlib.Path('results/pi-closed/performance.json').read_text())
          ok=all(x['good_pass']==103 and x['bad_reject']==58 for x in s['arms'].values())
          qa=p['quotient_vs_ablation_cpu']; q0=p['quotient_vs_a0_cpu']
          causal=qa['median_delta_pct']<0 and qa['wins']>=12
          net=q0['median_delta_pct']<0 and q0['wins']>=10
          if not ok: v='SEMANTIC_REJECTION'
          elif causal and net: v='VERIFIED_CLOSED_CONSEQUENCE_REUSE_GAIN'
          elif causal: v='VERIFIED_CLOSED_REUSE_CAUSAL_BUT_NET_NEGATIVE'
          else: v='VERIFIED_CLOSED_REUSE_NO_CAUSAL_GAIN'
          out={'verdict':v,'semantic_gate':ok,
               'quotient_vs_ablation_cpu_median_delta_pct':qa['median_delta_pct'],'quotient_vs_ablation_cpu_wins_of_15':qa['wins'],
               'quotient_vs_a0_cpu_median_delta_pct':q0['median_delta_pct'],'quotient_vs_a0_cpu_wins_of_15':q0['wins']}
          pathlib.Path('results/pi-closed/verdict.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          pathlib.Path('results/pi-closed/VERDICT.txt').write_text(v+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          if not ok: raise SystemExit(v)
          PY

      - name: Upload V6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-closed-consequence-reuse
          path: |
            results/pi-closed/
            diagnostics/pi-closed/
            NOVEL_CONSEQUENCE_QUOTIENT_V6.md
