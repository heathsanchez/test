name: Lean direct-map Pi-domain hit classification

on:
  push:
    paths:
      - '.github/workflows/lean-cq-pi-domain-hit-diag.yml'
      - 'scripts/patch_cq_pi_domain_dm_hit_diag.py'
      - 'scripts/patch_cq_pi_domain_dm.py'
      - 'scripts/patch_a6.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a6 results/dm-hit diagnostics/dm-hit
          mkdir -p arena-tests artifact results/dm-hit diagnostics/dm-hit
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct diagnostic V5
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout -q "$SOKO_PIN"
          python3 scripts/patch_a6.py
          python3 scripts/patch_cq_pi_domain_dm_hit_diag.py
          git -C a6 diff --check
          git -C a6 diff > diagnostics/dm-hit/diagnostic.patch
          cat > a6/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON

      - name: Build diagnostic
        shell: bash
        run: |
          set -euo pipefail
          (cd a6 && RUSTFLAGS="-C target-cpu=native" cargo build --release)

      - name: Freeze case sets
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          ds=sorted(pathlib.Path('arena-tests/good').rglob('*grind-ring-5*.ndjson'))
          if len(ds)!=1: raise SystemExit(len(ds))
          d=ds[0].resolve()
          pathlib.Path('diagnostics/dm-hit/discovery.txt').write_text(str(ds[0])+'\n')
          good=[p for p in pathlib.Path('arena-tests/good').rglob('*.ndjson') if p.resolve()!=d]
          held=sorted(good,key=lambda p:(-p.stat().st_size,str(p)))[:24]
          pathlib.Path('diagnostics/dm-hit/heldout.txt').write_text('\n'.join(map(str,held))+'\n')
          PY

      - name: Classify direct-map hits
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          rx=re.compile(r'CQ_DM_HIT total=(\d+) closed=(\d+) canonical=(\d+) lam=(\d+) pi=(\d+) sort=(\d+) nat=(\d+) str=(\d+) rigid=(\d+) unfold=(\d+) thunk=(\d+)')
          fields=['total','closed','canonical','lam','pi','sort','nat','str','rigid','unfold','thunk']
          sets={
            'discovery':[pathlib.Path(pathlib.Path('diagnostics/dm-hit/discovery.txt').read_text().strip())],
            'heldout':[pathlib.Path(x) for x in pathlib.Path('diagnostics/dm-hit/heldout.txt').read_text().splitlines() if x],
          }
          out={}
          for name,cases in sets.items():
              total={k:0 for k in fields}; rows=[]
              for p in cases:
                  with p.open('rb') as f:
                      r=subprocess.run(
                        ['a6/target/release/sokonanoda','a6/config.json'],
                        stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                        env={**os.environ,'SOKONANODA_CQ_DM_HIT_DIAG':'1'},
                      )
                  if r.returncode: raise SystemExit(f'{p} rc={r.returncode}')
                  m=rx.search(r.stderr.decode(errors='replace'))
                  if not m: raise SystemExit(f'missing telemetry {p}')
                  row=dict(zip(fields,map(int,m.groups())))
                  rows.append({'case':str(p),**row})
                  for k in fields: total[k]+=row[k]
              total['closed_fraction']=total['closed']/total['total'] if total['total'] else 0
              total['canonical_fraction']=total['canonical']/total['total'] if total['total'] else 0
              out[name]={'total':total,'rows':rows}
          pathlib.Path('results/dm-hit/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-direct-map-pi-domain-hit-classification
          path: |
            results/dm-hit/
            diagnostics/dm-hit/
