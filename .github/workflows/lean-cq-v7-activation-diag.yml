name: Lean V7 activation funnel diagnostic

on:
  push:
    paths:
      - '.github/workflows/lean-cq-v7-activation-diag.yml'
      - 'scripts/patch_cq_v7_activation_diag.py'
      - 'scripts/patch_cq_pi_recurrence_seed.py'
      - 'scripts/patch_a6.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a6 results/v7-activation diagnostics/v7-activation
          mkdir -p arena-tests artifact results/v7-activation diagnostics/v7-activation
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct diagnostic V7
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout -q "$SOKO_PIN"
          python3 scripts/patch_a6.py
          python3 scripts/patch_cq_v7_activation_diag.py
          git -C a6 diff --check
          git -C a6 diff > diagnostics/v7-activation/diagnostic.patch
          cat > a6/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          (cd a6 && RUSTFLAGS="-C target-cpu=native" cargo build --release)

      - name: Freeze A and B workloads
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          ds=sorted(pathlib.Path('arena-tests/good').rglob('*grind-ring-5*.ndjson'))
          if len(ds)!=1: raise SystemExit(len(ds))
          d=ds[0].resolve()
          good=[p for p in pathlib.Path('arena-tests/good').rglob('*.ndjson') if p.resolve()!=d]
          ordered=sorted(good,key=lambda p:(-p.stat().st_size,str(p)))
          A=ordered[:24]; B=ordered[24:48]
          pathlib.Path('diagnostics/v7-activation/set_a.txt').write_text('\n'.join(map(str,A))+'\n')
          pathlib.Path('diagnostics/v7-activation/set_b.txt').write_text('\n'.join(map(str,B))+'\n')
          PY

      - name: Measure V7 activation funnel
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          rx=re.compile(
            r'V7_ACTIVATION pi_miss=(\d+) seed_none=(\d+) seed_collision=(\d+) same_expr=(\d+) env_eq=(\d+) closed_reuse=(\d+) open_eq=(\d+)'
          )
          fields=['pi_miss','seed_none','seed_collision','same_expr','env_eq','closed_reuse','open_eq']
          sets={
            'A':[pathlib.Path(x) for x in pathlib.Path('diagnostics/v7-activation/set_a.txt').read_text().splitlines() if x],
            'B':[pathlib.Path(x) for x in pathlib.Path('diagnostics/v7-activation/set_b.txt').read_text().splitlines() if x],
          }
          out={}
          for name,cases in sets.items():
              total={k:0 for k in fields}; rows=[]
              for p in cases:
                  with p.open('rb') as f:
                      r=subprocess.run(
                        ['a6/target/release/sokonanoda','a6/config.json'],
                        stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                        env={**os.environ,'SOKONANODA_V7_ACTIVATION_DIAG':'1'},
                      )
                  if r.returncode: raise SystemExit(f'{p} rc={r.returncode}')
                  m=rx.search(r.stderr.decode(errors='replace'))
                  if not m: raise SystemExit(f'missing telemetry {p}')
                  row=dict(zip(fields,map(int,m.groups())))
                  rows.append({'case':str(p),**row})
                  for k in fields: total[k]+=row[k]
              total['same_expr_fraction']=total['same_expr']/total['pi_miss'] if total['pi_miss'] else 0
              total['env_eq_fraction_of_same_expr']=total['env_eq']/total['same_expr'] if total['same_expr'] else 0
              total['closed_reuse_fraction_of_miss']=total['closed_reuse']/total['pi_miss'] if total['pi_miss'] else 0
              total['closed_reuse_fraction_of_env_eq']=total['closed_reuse']/total['env_eq'] if total['env_eq'] else 0
              out[name]={'total':total,'rows':rows}
          pathlib.Path('results/v7-activation/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-v7-activation-funnel
          path: |
            results/v7-activation/
            diagnostics/v7-activation/
