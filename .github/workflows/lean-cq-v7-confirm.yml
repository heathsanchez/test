name: Lean V7 confirmatory consequence reuse

on:
  push:
    paths:
      - '.github/workflows/lean-cq-v7-confirm.yml'
      - 'scripts/patch_cq_pi_recurrence_seed.py'
      - 'scripts/patch_cq_pi_recurrence_seed_ablation.py'
      - 'scripts/patch_a6.py'
      - 'NOVEL_CONSEQUENCE_QUOTIENT_V7_CONFIRMATION.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen external Arena oracle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a0 quotient ablation results/v7-confirm diagnostics/v7-confirm
          mkdir -p arena-tests artifact results/v7-confirm diagnostics/v7-confirm
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct frozen V7 arms
        shell: bash
        run: |
          set -euo pipefail
          for arm in a0 quotient ablation; do
            git clone -q https://github.com/intgrah/sokonanoda.git "$arm"
            git -C "$arm" checkout -q "$SOKO_PIN"
            rm -rf a6 && cp -a "$arm" a6
            python3 scripts/patch_a6.py
            case "$arm" in
              quotient) python3 scripts/patch_cq_pi_recurrence_seed.py ;;
              ablation) python3 scripts/patch_cq_pi_recurrence_seed_ablation.py ;;
              a0) ;;
            esac
            git -C a6 diff --check
            git -C a6 diff > "diagnostics/v7-confirm/$arm.patch"
            rm -rf "$arm" && mv a6 "$arm"
            cat > "$arm/config.json" <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          done
          test -s diagnostics/v7-confirm/quotient.patch
          test -s diagnostics/v7-confirm/ablation.patch

      - name: Build all arms identically
        shell: bash
        run: |
          set -euo pipefail
          for arm in a0 quotient ablation; do
            (cd "$arm" && RUSTFLAGS="-C target-cpu=native" cargo build --release)
            test -x "$arm/target/release/sokonanoda"
          done

      - name: External semantic gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          good=sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          bad=sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          if len(good)!=103 or len(bad)!=58:
              raise SystemExit(f'frozen oracle changed: good={len(good)} bad={len(bad)}')
          out={'arms':{}}
          for arm in ['a0','quotient','ablation']:
              exe=pathlib.Path(arm)/'target/release/sokonanoda'
              cfg=pathlib.Path(arm)/'config.json'
              gp=br=0; failures=[]
              for p in good:
                  with p.open('rb') as f:
                      r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
                  if r.returncode==0: gp+=1
                  elif len(failures)<20:
                      failures.append({'kind':'good_rejected','case':str(p),'rc':r.returncode,'stderr':r.stderr.decode(errors='replace')[-1000:]})
              for p in bad:
                  with p.open('rb') as f:
                      r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
                  if r.returncode!=0: br+=1
                  elif len(failures)<20:
                      failures.append({'kind':'bad_accepted','case':str(p)})
              out['arms'][arm]={'good_pass':gp,'bad_reject':br,'failures':failures}
          pathlib.Path('results/v7-confirm/semantics.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          for arm,x in out['arms'].items():
              if x['good_pass']!=103 or x['bad_reject']!=58:
                  raise SystemExit(f'SEMANTIC_REJECTION {arm}')
          PY

      - name: Freeze replication and disjoint workloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          ds=sorted(pathlib.Path('arena-tests/good').rglob('*grind-ring-5*.ndjson'))
          if len(ds)!=1: raise SystemExit(f'discovery count={len(ds)}')
          d=ds[0].resolve()
          good=[p for p in pathlib.Path('arena-tests/good').rglob('*.ndjson') if p.resolve()!=d]
          ordered=sorted(good,key=lambda p:(-p.stat().st_size,str(p)))
          A=ordered[:24]
          B=ordered[24:48]
          if len(A)!=24 or len(B)!=24 or set(A)&set(B):
              raise SystemExit('invalid confirmation sets')
          pathlib.Path('diagnostics/v7-confirm/set_a.txt').write_text('\n'.join(map(str,A))+'\n')
          pathlib.Path('diagnostics/v7-confirm/set_b.txt').write_text('\n'.join(map(str,B))+'\n')
          out={
            'selection':'remove grind-ring-5; sort by descending bytes/path; A=1..24; B=25..48',
            'set_a':list(map(str,A)),
            'set_b':list(map(str,B)),
          }
          pathlib.Path('results/v7-confirm/workloads.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Confirm paired performance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,random,resource,statistics,subprocess,time

          arms=['a0','quotient','ablation']
          sets={
              'A':[pathlib.Path(x) for x in pathlib.Path('diagnostics/v7-confirm/set_a.txt').read_text().splitlines() if x],
              'B':[pathlib.Path(x) for x in pathlib.Path('diagnostics/v7-confirm/set_b.txt').read_text().splitlines() if x],
          }

          def run_set(name,cases):
              for arm in arms:
                  exe=pathlib.Path(arm)/'target/release/sokonanoda'
                  cfg=pathlib.Path(arm)/'config.json'
                  for p in cases:
                      with p.open('rb') as f:
                          r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      if r.returncode:
                          raise SystemExit(f'warmup failure set={name} arm={arm} case={p} rc={r.returncode}')

              rows=[]; by={}
              for rep in range(60):
                  order=arms.copy()
                  random.Random((0 if name=='A' else 100000)+rep).shuffle(order)
                  by[rep]={}
                  for arm in order:
                      exe=pathlib.Path(arm)/'target/release/sokonanoda'
                      cfg=pathlib.Path(arm)/'config.json'
                      before=resource.getrusage(resource.RUSAGE_CHILDREN)
                      start=time.perf_counter()
                      for p in cases:
                          with p.open('rb') as f:
                              r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                          if r.returncode:
                              raise SystemExit(f'benchmark failure set={name} arm={arm} case={p} rc={r.returncode}')
                      wall=time.perf_counter()-start
                      after=resource.getrusage(resource.RUSAGE_CHILDREN)
                      cpu=(after.ru_utime-before.ru_utime)+(after.ru_stime-before.ru_stime)
                      row={'set':name,'rep':rep,'arm':arm,'cpu_s':cpu,'wall_s':wall}
                      rows.append(row); by[rep][arm]=row

              def pair(candidate,control,metric):
                  ds=[]; wins=0
                  for rep in range(60):
                      c=by[rep][candidate][metric]
                      b=by[rep][control][metric]
                      ds.append(100.0*(c/b-1.0))
                      wins += c < b
                  return {
                      'median_delta_pct':statistics.median(ds),
                      'wins':wins,
                      'losses':60-wins,
                      'deltas_pct':ds,
                  }

              return {
                  'summary':{
                      arm:{
                          'median_cpu_s':statistics.median(r['cpu_s'] for r in rows if r['arm']==arm),
                          'median_wall_s':statistics.median(r['wall_s'] for r in rows if r['arm']==arm),
                      } for arm in arms
                  },
                  'quotient_vs_ablation_cpu':pair('quotient','ablation','cpu_s'),
                  'quotient_vs_a0_cpu':pair('quotient','a0','cpu_s'),
                  'quotient_vs_ablation_wall':pair('quotient','ablation','wall_s'),
                  'quotient_vs_a0_wall':pair('quotient','a0','wall_s'),
                  'rows':rows,
              }

          out={name:run_set(name,cases) for name,cases in sets.items()}
          pathlib.Path('results/v7-confirm/performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Classify confirmatory result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          sem=json.loads(pathlib.Path('results/v7-confirm/semantics.json').read_text())
          p=json.loads(pathlib.Path('results/v7-confirm/performance.json').read_text())
          semantic_ok=all(x['good_pass']==103 and x['bad_reject']==58 for x in sem['arms'].values())

          def passes(s):
              qa=s['quotient_vs_ablation_cpu']
              q0=s['quotient_vs_a0_cpu']
              causal=qa['median_delta_pct']<0 and qa['wins']>=37
              net=q0['median_delta_pct']<0 and q0['wins']>=37
              return causal,net

          a_causal,a_net=passes(p['A'])
          b_causal,b_net=passes(p['B'])

          if not semantic_ok:
              verdict='SEMANTIC_REJECTION'
          elif a_causal and a_net and b_causal and b_net:
              verdict='VERIFIED_RECURRENCE_GATED_CONSEQUENCE_GAIN_GENERALIZED'
          elif a_causal and a_net:
              verdict='VERIFIED_RECURRENCE_GATED_CONSEQUENCE_GAIN_REPLICATED'
          else:
              verdict='DIRECTIONAL_V7_NOT_REPLICATED'

          out={
              'verdict':verdict,
              'semantic_gate':semantic_ok,
              'threshold_wins_of_60':37,
              'set_a':{
                  'causal_pass':a_causal,'net_pass':a_net,
                  'quotient_vs_ablation_cpu_median_delta_pct':p['A']['quotient_vs_ablation_cpu']['median_delta_pct'],
                  'quotient_vs_ablation_cpu_wins_of_60':p['A']['quotient_vs_ablation_cpu']['wins'],
                  'quotient_vs_a0_cpu_median_delta_pct':p['A']['quotient_vs_a0_cpu']['median_delta_pct'],
                  'quotient_vs_a0_cpu_wins_of_60':p['A']['quotient_vs_a0_cpu']['wins'],
              },
              'set_b':{
                  'causal_pass':b_causal,'net_pass':b_net,
                  'quotient_vs_ablation_cpu_median_delta_pct':p['B']['quotient_vs_ablation_cpu']['median_delta_pct'],
                  'quotient_vs_ablation_cpu_wins_of_60':p['B']['quotient_vs_ablation_cpu']['wins'],
                  'quotient_vs_a0_cpu_median_delta_pct':p['B']['quotient_vs_a0_cpu']['median_delta_pct'],
                  'quotient_vs_a0_cpu_wins_of_60':p['B']['quotient_vs_a0_cpu']['wins'],
              }
          }
          pathlib.Path('results/v7-confirm/verdict.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          pathlib.Path('results/v7-confirm/VERDICT.txt').write_text(verdict+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          if not semantic_ok:
              raise SystemExit(verdict)
          PY

      - name: Upload confirmatory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-v7-confirmatory-consequence-reuse
          path: |
            results/v7-confirm/
            diagnostics/v7-confirm/
            NOVEL_CONSEQUENCE_QUOTIENT_V7_CONFIRMATION.md
