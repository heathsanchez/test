name: Lean earned false-split value-class diagnostic

on:
  push:
    paths:
      - '.github/workflows/lean-earned-false-split-kind-diag.yml'
      - 'scripts/patch_earned_false_split_kind_diag.py'
      - 'scripts/patch_a6.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a6 results/kind-diag diagnostics/kind-diag
          mkdir -p arena-tests artifact results/kind-diag diagnostics/kind-diag
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct diagnostic A6
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout -q "$SOKO_PIN"
          python3 scripts/patch_a6.py
          python3 scripts/patch_earned_false_split_kind_diag.py
          git -C a6 diff --check
          git -C a6 diff > diagnostics/kind-diag/diagnostic.patch
          cat > a6/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON

      - name: Build diagnostic
        shell: bash
        run: |
          set -euo pipefail
          (cd a6 && RUSTFLAGS="-C target-cpu=native" cargo build --release)

      - name: Freeze case sets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          discovery=sorted(pathlib.Path('arena-tests/good').rglob('*grind-ring-5*.ndjson'))
          if len(discovery)!=1: raise SystemExit(len(discovery))
          d=discovery[0].resolve()
          pathlib.Path('diagnostics/kind-diag/discovery.txt').write_text(str(discovery[0])+'\n')
          good=[p for p in pathlib.Path('arena-tests/good').rglob('*.ndjson') if p.resolve()!=d]
          held=sorted(good,key=lambda p:(-p.stat().st_size,str(p)))[:24]
          pathlib.Path('diagnostics/kind-diag/heldout.txt').write_text('\n'.join(map(str,held))+'\n')
          PY

      - name: Localize false splits by value class
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          fields=[
            'calls','false_frames','simple_only','structural',
            'elig_lam','elig_pi','elig_sort','elig_nat','elig_str','elig_rigid','elig_unfold','elig_thunk',
            'fs_lam','fs_pi','fs_sort','fs_nat','fs_str','fs_rigid','fs_unfold','fs_thunk',
          ]
          rx=re.compile(
            r'CQ_KIND calls=(\d+) false_frames=(\d+) simple_only=(\d+) structural=(\d+) '
            r'elig_lam=(\d+) elig_pi=(\d+) elig_sort=(\d+) elig_nat=(\d+) elig_str=(\d+) elig_rigid=(\d+) elig_unfold=(\d+) elig_thunk=(\d+) '
            r'fs_lam=(\d+) fs_pi=(\d+) fs_sort=(\d+) fs_nat=(\d+) fs_str=(\d+) fs_rigid=(\d+) fs_unfold=(\d+) fs_thunk=(\d+)'
          )
          sets={
            'discovery':[pathlib.Path(pathlib.Path('diagnostics/kind-diag/discovery.txt').read_text().strip())],
            'heldout':[pathlib.Path(x) for x in pathlib.Path('diagnostics/kind-diag/heldout.txt').read_text().splitlines() if x],
          }
          out={}
          for name,cases in sets.items():
              total={k:0 for k in fields}; rows=[]
              for p in cases:
                  with p.open('rb') as f:
                      r=subprocess.run(
                        ['a6/target/release/sokonanoda','a6/config.json'],
                        stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                        env={**os.environ,'SOKONANODA_CQ_KIND_DIAG':'1'},
                      )
                  if r.returncode!=0: raise SystemExit(f'failed {p}: {r.returncode}')
                  m=rx.search(r.stderr.decode(errors='replace'))
                  if not m: raise SystemExit(f'missing telemetry {p}')
                  row=dict(zip(fields,map(int,m.groups())))
                  rows.append({'case':str(p),**row})
                  for k in fields: total[k]+=row[k]
              total['simple_false_frame_fraction']=(total['simple_only']/total['false_frames'] if total['false_frames'] else 0.0)
              out[name]={'total':total,'rows':rows}
          pathlib.Path('results/kind-diag/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-earned-false-split-kind-diagnostic
          path: |
            results/kind-diag/
            diagnostics/kind-diag/
