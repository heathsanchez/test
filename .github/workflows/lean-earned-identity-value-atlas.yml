name: Lean earned-identity consequence value atlas

on:
  push:
    paths:
      - '.github/workflows/lean-earned-identity-value-atlas.yml'
      - 'scripts/patch_earned_identity_value_atlas.py'
      - 'scripts/patch_a6.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a6 results/earned-atlas diagnostics/earned-atlas
          mkdir -p arena-tests artifact results/earned-atlas diagnostics/earned-atlas
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct diagnostic A6
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout -q "$SOKO_PIN"
          python3 scripts/patch_a6.py
          python3 scripts/patch_earned_identity_value_atlas.py
          git -C a6 diff --check
          git -C a6 diff > diagnostics/earned-atlas/diagnostic.patch
          cat > a6/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          (cd a6 && RUSTFLAGS="-C target-cpu=native" cargo build --release)
          test -x a6/target/release/sokonanoda

      - name: Mine zero-new-identity-cost consequences
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess

          qrx=re.compile(r'EARNED_QUOTE_ATLAS misses=(\d+) earned_identity_misses=(\d+) repeats=(\d+) repeat_calls=(\d+) max_calls=(\d+) repeat_ns=(\d+) max_ns=(\d+)')
          grx=re.compile(r'EARNED_GLOBAL_ATLAS misses=(\d+) earned_identity_misses=(\d+) repeats=(\d+) repeat_calls=(\d+) max_calls=(\d+) repeat_ns=(\d+) max_ns=(\d+)')
          srx=re.compile(r'EARNED_STRUCT_ETA_ATLAS misses=(\d+) earned_identity_misses=(\d+) repeats=(\d+) repeat_ns=(\d+) max_ns=(\d+)')
          qfields=['misses','earned_identity_misses','repeats','repeat_calls','max_calls','repeat_ns','max_ns']
          gfields=qfields
          sfields=['misses','earned_identity_misses','repeats','repeat_ns','max_ns']

          good=sorted(pathlib.Path('arena-tests/good').rglob('*.ndjson'))
          if len(good)!=103: raise SystemExit(f'expected 103 good, got {len(good)}')

          rows=[]
          total={
            'quote':{k:0 for k in qfields},
            'global':{k:0 for k in gfields},
            'struct_eta':{k:0 for k in sfields},
          }
          for p in good:
              with p.open('rb') as f:
                  r=subprocess.run(
                    ['a6/target/release/sokonanoda','a6/config.json'],
                    stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                    env={**os.environ,'SOKONANODA_EARNED_IDENTITY_ATLAS':'1'},
                  )
              if r.returncode!=0:
                  raise SystemExit(f'good rejected {p} rc={r.returncode} stderr={r.stderr.decode(errors="replace")[-1200:]}')
              err=r.stderr.decode(errors='replace')
              qm=qrx.search(err); gm=grx.search(err); sm=srx.search(err)
              if not (qm and gm and sm): raise SystemExit(f'missing telemetry {p}: {err[-2000:]}')
              q=dict(zip(qfields,map(int,qm.groups())))
              g=dict(zip(gfields,map(int,gm.groups())))
              st=dict(zip(sfields,map(int,sm.groups())))
              row={'case':str(p),'quote':q,'global':g,'struct_eta':st}
              rows.append(row)
              for label,data in [('quote',q),('global',g),('struct_eta',st)]:
                  for k,v in data.items():
                      if k.startswith('max_'):
                          total[label][k]=max(total[label][k],v)
                      else:
                          total[label][k]+=v

          for label in ['quote','global']:
              x=total[label]
              x['mean_calls_per_repeat']=x['repeat_calls']/x['repeats'] if x['repeats'] else 0
              x['mean_ns_per_repeat']=x['repeat_ns']/x['repeats'] if x['repeats'] else 0
          x=total['struct_eta']
          x['mean_ns_per_repeat']=x['repeat_ns']/x['repeats'] if x['repeats'] else 0

          def score(row,label):
              x=row[label]
              return (x.get('repeat_ns',0),x.get('repeat_calls',0),x.get('max_ns',0),x.get('max_calls',0))
          tops={label:sorted(rows,key=lambda r:tuple(-v for v in score(r,label))+ (r['case'],))[:15] for label in ['quote','global','struct_eta']}
          out={'total':total,'top':tops,'rows':rows}
          pathlib.Path('results/earned-atlas/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'total':total,'top':{k:v[:8] for k,v in tops.items()}},indent=2,sort_keys=True))
          PY

      - name: Verify frozen bad corpus still rejects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess
          bad=sorted(pathlib.Path('arena-tests/bad').rglob('*.ndjson'))
          if len(bad)!=58: raise SystemExit(f'expected 58 bad, got {len(bad)}')
          accepted=[]
          for p in bad:
              with p.open('rb') as f:
                  r=subprocess.run(['a6/target/release/sokonanoda','a6/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if r.returncode==0: accepted.append(str(p))
          if accepted: raise SystemExit(f'bad accepted: {accepted[:20]}')
          print('bad_reject=58/58')
          PY

      - name: Upload atlas evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-earned-identity-consequence-value-atlas
          path: |
            results/earned-atlas/
            diagnostics/earned-atlas/
