name: Lean Kernel Arena A2 + E0012 public revalidation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-kernel-arena-a2-e0012-public-revalidation.yml'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct A2 and test E0012
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          ARENA_ARTIFACT=8931227426
          SESSION_BUDGET=2621440
          OUT=results/a2-e0012-public
          rm -rf "$OUT" a2 e0012 arena-tests artifact tests.zip
          mkdir -p "$OUT" arena-tests artifact

          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

          git clone https://github.com/intgrah/sokonanoda.git a2
          git -C a2 checkout "$SOKO_REV"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('a2/src/tc.rs'); s=p.read_text()
          old='const SESSION_BUDGET: usize = 1 << 20;'
          assert old in s
          p.write_text(s.replace(old,'const SESSION_BUDGET: usize = 2621440;',1))
          PY
          cp -a a2 e0012

          python3 - <<'PY'
          from pathlib import Path
          p=Path('e0012/src/util.rs'); s=p.read_text()
          old="""pub struct ExprCache<'t> {
    pub(crate) inst_cache: FxHashMap<(ExprPtr<'t>, u16), ExprPtr<'t>>,
    pub(crate) subst_cache: FxHashMap<(ExprPtr<'t>, LevelsPtr<'t>, LevelsPtr<'t>), ExprPtr<'t>>,
    pub(crate) dsubst_cache: FxHashMap<(ExprPtr<'t>, LevelsPtr<'t>, LevelsPtr<'t>), ExprPtr<'t>>,
    pub(crate) simplify_cache: FxHashMap<LevelPtr<'t>, LevelPtr<'t>>,
}"""
          new="""pub struct ExprCache<'t> {
    pub(crate) inst_cache: FxHashMap<(ExprPtr<'t>, u16), ExprPtr<'t>>,
    pub(crate) subst_cache: FxHashMap<(ExprPtr<'t>, LevelsPtr<'t>, LevelsPtr<'t>), ExprPtr<'t>>,
    pub(crate) dsubst_cache: FxHashMap<(ExprPtr<'t>, LevelsPtr<'t>, LevelsPtr<'t>), ExprPtr<'t>>,
    pub(crate) simplify_cache: FxHashMap<LevelPtr<'t>, LevelPtr<'t>>,
    pub(crate) eq_cache: FxHashMap<(LevelPtr<'t>, LevelPtr<'t>), bool>,
}"""
          assert old in s; s=s.replace(old,new,1)
          old="""        shrink_map(&mut self.dsubst_cache);
        shrink_map(&mut self.simplify_cache);"""
          new="""        shrink_map(&mut self.dsubst_cache);
        shrink_map(&mut self.simplify_cache);
        shrink_map(&mut self.eq_cache);"""
          assert old in s; s=s.replace(old,new,1)
          old="""            dsubst_cache: small_fx_hash_map(),
            simplify_cache: small_fx_hash_map(),"""
          new="""            dsubst_cache: small_fx_hash_map(),
            simplify_cache: small_fx_hash_map(),
            eq_cache: small_fx_hash_map(),"""
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('e0012/src/level.rs'); s=p.read_text()
          old="""    pub fn eq_antisymm(&mut self, l: LevelPtr<'t>, r: LevelPtr<'t>) -> bool {
        l == r || (self.leq(l, r) && self.leq(r, l))
    }"""
          new="""    pub fn eq_antisymm(&mut self, l: LevelPtr<'t>, r: LevelPtr<'t>) -> bool {
        if l == r { return true; }
        let key = if l.get_hash() < r.get_hash() { (l, r) } else { (r, l) };
        if let Some(cached) = self.expr_cache.eq_cache.get(&key).copied() { return cached; }
        let eq = self.leq(l, r) && self.leq(r, l);
        self.expr_cache.eq_cache.insert(key, eq);
        eq
    }"""
          assert old in s; p.write_text(s.replace(old,new,1))
          PY

          for d in a2 e0012; do
            cat > "$d/config.json" <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
            (cd "$d" && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          done

          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,json,statistics,random,hashlib
          root=Path.cwd(); out=root/'results/a2-e0012-public'; vs=['a2','e0012']
          bins={v:root/v/'target/release/sokonanoda' for v in vs}; cfgs={v:root/v/'config.json' for v in vs}
          def status(rc): return 'accept' if rc==0 else ('decline' if rc==2 else 'reject')
          cases=[]
          for kind,exp in [('good','accept'),('bad','reject')]:
              for p in (root/'arena-tests'/kind).rglob('*.ndjson'): cases.append((p,exp))
          correctness={}
          for v in vs:
              bad=[]; declines=0
              for p,exp in cases:
                  with p.open('rb') as f:
                      rc=subprocess.run([str(bins[v]),str(cfgs[v])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  got=status(rc); declines += int(got=='decline')
                  if got!=exp: bad.append({'file':str(p.relative_to(root/'arena-tests')),'expected':exp,'got':got,'rc':rc})
              correctness[v]={'correct':len(cases)-len(bad),'total':len(cases),'declines':declines,'failures':bad}
          workload=sorted([p for p,_ in cases],key=lambda p:p.stat().st_size,reverse=True)[:24]
          workload=sorted(workload,key=lambda p:hashlib.sha256(str(p.relative_to(root/'arena-tests')).encode()).hexdigest())
          samples={v:[] for v in vs}; orders=[]
          for seed in range(16):
              order=vs.copy(); random.Random(seed).shuffle(order); orders.append(order)
              for v in order:
                  t=time.perf_counter()
                  for p in workload:
                      with p.open('rb') as f:
                          subprocess.run([str(bins[v]),str(cfgs[v])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
                  samples[v].append(time.perf_counter()-t)
          med={v:statistics.median(samples[v]) for v in vs}
          paired=[(c-b)/b for b,c in zip(samples['a2'],samples['e0012'])]
          summary={'substrate':{'sokonanoda': '9b4ea12f4cd437d00b6bcd0e34743065c58dea08','threads':4,'session_budget':2621440},'correctness':correctness,'median_seconds':med,'speedup_e0012_vs_a2':med['a2']/med['e0012'],'paired_fractional_change_e0012_minus_a2':paired,'paired_median_fractional_change':statistics.median(paired),'samples_seconds':samples,'orders':orders,'workload':[str(p.relative_to(root/'arena-tests')) for p in workload]}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)); print(json.dumps(summary,indent=2,sort_keys=True))
          if any(x['correct']!=x['total'] or x['declines']!=0 for x in correctness.values()): raise SystemExit('semantic regression')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-a2-e0012-public
          path: results/a2-e0012-public/
