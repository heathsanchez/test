name: Lean Kernel Arena A2 prune diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-kernel-arena-a2-prune-diagnostic.yml'
      - 'scripts/patch_a2_prune_diag.py'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/a2-prune-diagnostic
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct and instrument A2
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/intgrah/sokonanoda.git a2
          git -C a2 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          python3 scripts/patch_a2_prune_diag.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > a2/config.json
          (cd a2 && RUSTFLAGS='-C target-cpu=native' cargo build --release)
      - name: Run grind-ring-5 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          a2/target/release/sokonanoda a2/config.json < arena-tests/good/perf/grind-ring-5.ndjson \
            > results/a2-prune-diagnostic/stdout.txt \
            2> results/a2-prune-diagnostic/stderr.txt
          grep 'PRUNE_STATS' results/a2-prune-diagnostic/stderr.txt | tee results/a2-prune-diagnostic/prune_stats.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-a2-prune-diagnostic
          path: results/a2-prune-diagnostic/
