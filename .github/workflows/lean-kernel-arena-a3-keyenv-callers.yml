name: Lean Kernel Arena A3 sampled key_env callers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-kernel-arena-a3-keyenv-callers.yml'
      - 'scripts/patch_a2_e0018.py'
      - 'scripts/patch_a3_keyenv_callers.py'
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/a3-keyenv-callers
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct and instrument A3
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/intgrah/sokonanoda.git a2
          git -C a2 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          cp -a a2 e0018
          python3 scripts/patch_a2_e0018.py
          mv e0018 a3
          rm -rf a2
          python3 scripts/patch_a3_keyenv_callers.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > a3/config.json
          (cd a3 && RUSTFLAGS='-C target-cpu=native' cargo build --release)
      - name: Sample direct key_env callers on grind-ring-5
        shell: bash
        run: |
          set -euo pipefail
          a3/target/release/sokonanoda a3/config.json < arena-tests/good/perf/grind-ring-5.ndjson > results/a3-keyenv-callers/stdout.txt 2> results/a3-keyenv-callers/stderr.txt
          grep '^KEYENV_CALLER ' results/a3-keyenv-callers/stderr.txt | sort | uniq -c | sort -nr > results/a3-keyenv-callers/callers.txt
          cat results/a3-keyenv-callers/callers.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-a3-keyenv-callers
          path: results/a3-keyenv-callers/
