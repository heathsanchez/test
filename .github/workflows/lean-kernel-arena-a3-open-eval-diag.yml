name: Lean Kernel Arena A3 open eval cache diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-kernel-arena-a3-open-eval-diag.yml'
      - 'scripts/patch_a2_e0018.py'
      - 'scripts/patch_a3_open_eval_diag.py'
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/a3-open-eval-diag
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct and instrument A3
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/intgrah/sokonanoda.git a2
          git -C a2 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          cp -a a2 e0018
          python3 scripts/patch_a2_e0018.py
          mv e0018 a3
          rm -rf a2
          python3 scripts/patch_a3_open_eval_diag.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > a3/config.json
          (cd a3 && RUSTFLAGS='-C target-cpu=native' cargo build --release)
      - name: Sample open-eval cache on grind-ring-5
        shell: bash
        run: |
          set -euo pipefail
          a3/target/release/sokonanoda a3/config.json < arena-tests/good/perf/grind-ring-5.ndjson > results/a3-open-eval-diag/stdout.txt 2> results/a3-open-eval-diag/stderr.txt
          grep '^OPEN_EVAL ' results/a3-open-eval-diag/stderr.txt > results/a3-open-eval-diag/samples.txt
          python3 - <<'PY'
          import collections, pathlib
          rows=pathlib.Path('results/a3-open-eval-diag/samples.txt').read_text().splitlines()
          d=collections.defaultdict(lambda:[0,0,0,0,0])
          for r in rows:
              p=dict(x.split('=',1) for x in r.split()[1:])
              k=p['kind']; x=d[k]; x[0]+=1; x[1]+=p['hit']=='true'; x[2]+=p['sameenv']=='true'; x[3]+=int(p['loose']); x[4]+=int(p['maskpop'])
          lines=[]
          for k,x in sorted(d.items(), key=lambda kv:-kv[1][0]):
              n,h,se,lo,mp=x
              lines.append(f'{k} n={n} hit_rate={h/n:.6f} sameenv_rate={se/n:.6f} mean_loose={lo/n:.3f} mean_maskpop={mp/n:.3f}')
          pathlib.Path('results/a3-open-eval-diag/summary.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-a3-open-eval-diag
          path: results/a3-open-eval-diag/
