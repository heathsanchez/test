name: Lean Kernel Arena fresh A3 profile
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-kernel-arena-a3-profile.yml'
      - 'scripts/profile_a3.py'
      - 'scripts/patch_a2_e0018.py'
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/a3-profile
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct A3
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/intgrah/sokonanoda.git a2
          git -C a2 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          cp -a a2 a3
          rm -rf e0018
          cp -a a3 e0018
          python3 scripts/patch_a2_e0018.py
          rm -rf a3
          mv e0018 a3
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > a3/config.json
          (cd a3 && RUSTFLAGS='-C target-cpu=native' cargo build --release)
      - name: Per-case profile and semantic replay
        run: python3 scripts/profile_a3.py
      - name: Callgrind grind-ring-5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          # Valgrind may reject instructions emitted by target-cpu=native on hosted CPUs.
          # Build a separate generic x86-64 profiling binary; use only percentages/call structure from it.
          (cd a3 && CARGO_TARGET_DIR=target-callgrind RUSTFLAGS='-C target-cpu=x86-64' cargo build --release)
          valgrind --tool=callgrind --callgrind-out-file=results/a3-profile/callgrind.out a3/target-callgrind/release/sokonanoda a3/config.json < arena-tests/good/perf/grind-ring-5.ndjson >/dev/null 2>/dev/null
          callgrind_annotate --auto=yes --inclusive=no --threshold=0.05 results/a3-profile/callgrind.out > results/a3-profile/callgrind-self.txt
          callgrind_annotate --auto=yes --inclusive=yes --threshold=0.05 results/a3-profile/callgrind.out > results/a3-profile/callgrind-inclusive.txt
          head -120 results/a3-profile/callgrind-self.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-a3-profile
          path: results/a3-profile/
