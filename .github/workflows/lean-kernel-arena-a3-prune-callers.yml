name: Lean Kernel Arena A3 prune caller tree
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-kernel-arena-a3-prune-callers.yml'
      - 'scripts/patch_a2_e0018.py'
jobs:
  callers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/a3-prune-callers
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct A3 generic profiling build
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/intgrah/sokonanoda.git a2
          git -C a2 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          cp -a a2 e0018
          python3 scripts/patch_a2_e0018.py
          mv e0018 a3
          rm -rf a2
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > a3/config.json
          (cd a3 && RUSTFLAGS='-C target-cpu=x86-64' cargo build --release)
      - name: Callgrind caller tree for prune_env_cold
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --tool=callgrind --collect-jumps=yes --callgrind-out-file=results/a3-prune-callers/callgrind.out a3/target/release/sokonanoda a3/config.json < arena-tests/good/perf/grind-ring-5.ndjson >/dev/null 2>/dev/null
          callgrind_annotate --auto=yes --inclusive=yes --tree=caller --threshold=0.01 results/a3-prune-callers/callgrind.out > results/a3-prune-callers/caller-tree.txt
          grep -n -B25 -A45 'prune_env_cold' results/a3-prune-callers/caller-tree.txt > results/a3-prune-callers/prune-context.txt || true
          cat results/a3-prune-callers/prune-context.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-a3-prune-callers
          path: results/a3-prune-callers/
