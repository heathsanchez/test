name: Lean Kernel Arena A4 + E0025 protected resource gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-kernel-arena-a4-e0025-protected.yml'
      - 'scripts/patch_a4_e0025.py'
      - 'scripts/run_a4_e0025_protected.py'
jobs:
  protected:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/a4-e0025-protected
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct A4 and E0025
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/intgrah/sokonanoda.git a4
          git -C a4 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          cp -a a4 e0025
          python3 scripts/patch_a4_e0025.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > a4/config.json
          cp a4/config.json e0025/config.json
      - name: Arena-style PGO build both arms
        shell: bash
        run: |
          set -euo pipefail
          rustup component add llvm-tools-preview
          LLVM_PROFDATA=$(find "$(rustc --print sysroot)" -type f -name llvm-profdata | head -1)
          test -x "$LLVM_PROFDATA"
          TRAIN="$PWD/arena-tests/good/init-prelude.ndjson"
          for v in a4 e0025; do
            rm -rf "$v/pgo"
            mkdir -p "$v/pgo"
            (cd "$v" && RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release)
            "$v/target/release/sokonanoda" "$v/config.json" < "$TRAIN" >/dev/null
            "$LLVM_PROFDATA" merge -o "$v/pgo/merged.profdata" "$v/pgo"
            (cd "$v" && RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release)
          done
      - name: Protected semantic plus wall CPU RSS gate
        run: python3 scripts/run_a4_e0025_protected.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-a4-e0025-protected
          path: results/a4-e0025-protected/
