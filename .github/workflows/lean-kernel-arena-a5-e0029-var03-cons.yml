name: Lean Kernel Arena A5 + E0029 Var0-3 Cons fast path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-kernel-arena-a5-e0029-var03-cons.yml'
      - 'scripts/patch_a5_e0029_var03_cons.py'
      - 'scripts/run_a5_e0029.py'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/a5-e0029
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct A5 and E0029
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/intgrah/sokonanoda.git a5
          git clone https://github.com/intgrah/sokonanoda.git e0029
          git -C a5 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          git -C e0029 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          python3 scripts/patch_a5_e0029_var03_cons.py
          for d in a5 e0029; do
            printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > "$d/config.json"
          done
      - name: Build both arms
        run: |
          (cd a5 && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          (cd e0029 && RUSTFLAGS='-C target-cpu=native' cargo build --release)
      - name: Semantic replay and paired proxy
        run: python3 scripts/run_a5_e0029.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-a5-e0029
          path: results/a5-e0029/
