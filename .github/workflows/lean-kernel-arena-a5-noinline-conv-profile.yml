name: Lean Kernel Arena A5 noinline conversion profile

on:
  push:
    paths:
      - '.github/workflows/lean-kernel-arena-a5-noinline-conv-profile.yml'

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install profiling tools
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/a5-noinline-conv
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct diagnostic A5
        run: |
          set -euo pipefail
          git clone https://github.com/intgrah/sokonanoda.git a5
          git -C a5 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          python3 scripts/patch_a5.py
          python3 scripts/patch_a5_noinline_diag.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > a5/config.json
      - name: Build diagnostic A5
        run: |
          cd a5
          RUSTFLAGS='-C debuginfo=1 -C target-cpu=native' cargo build --release
      - name: Semantic sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('.'); b=root/'a5/target/release/sokonanoda'; cfg=root/'a5/config.json'
          total=bad=decl=0
          for kind,exp in [('good',0),('bad',1)]:
              for p in (root/'arena-tests'/kind).rglob('*.ndjson'):
                  total += 1
                  with p.open('rb') as f:
                      rc=subprocess.run([str(b),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  decl += (rc==2)
                  if rc != exp: bad += 1
          print({'total':total,'bad':bad,'declines':decl})
          if bad or decl: raise SystemExit(1)
          PY
      - name: Callgrind noinline conversion branches
        run: |
          set -euo pipefail
          P=arena-tests/good/perf/grind-ring-5.ndjson
          valgrind --tool=callgrind --collect-jumps=yes --callgrind-out-file=results/a5-noinline-conv/callgrind.out \
            a5/target/release/sokonanoda a5/config.json < "$P" >/dev/null 2>results/a5-noinline-conv/valgrind.stderr
          callgrind_annotate --inclusive=no --threshold=0.01 results/a5-noinline-conv/callgrind.out > results/a5-noinline-conv/self.txt
          callgrind_annotate --inclusive=yes --threshold=0.01 results/a5-noinline-conv/callgrind.out > results/a5-noinline-conv/inclusive.txt
          grep -E 'unify_no_cache|unify_direct|unify_cold|conv_nat|unify_spine|unfold_pair|spine_probe|try_proof_irrel_at|unify_iota|eval_no_cache|infer_value' results/a5-noinline-conv/self.txt | tee results/a5-noinline-conv/branches-self.txt || true
          grep -E 'unify_no_cache|unify_direct|unify_cold|conv_nat|unify_spine|unfold_pair|spine_probe|try_proof_irrel_at|unify_iota|eval_no_cache|infer_value' results/a5-noinline-conv/inclusive.txt | tee results/a5-noinline-conv/branches-inclusive.txt || true
          head -140 results/a5-noinline-conv/self.txt > results/a5-noinline-conv/top-self.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lean-kernel-arena-a5-noinline-conv
          path: results/a5-noinline-conv/
