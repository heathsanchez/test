name: Lean Kernel Arena A5 fresh profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-kernel-arena-a5-profile.yml'
      - 'scripts/patch_a5.py'
      - 'scripts/profile_a5.py'

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install profiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - name: Fetch frozen Arena corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/a5-profile
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct A5
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/intgrah/sokonanoda.git a5
          git -C a5 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          python3 scripts/patch_a5.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > a5/config.json
      - name: Build A5
        run: cd a5 && RUSTFLAGS='-C target-cpu=native -C debuginfo=1' cargo build --release
      - name: Per-case semantic and wall profile
        run: python3 scripts/profile_a5.py
      - name: Callgrind grind-ring-5
        shell: bash
        run: |
          set -euo pipefail
          valgrind --tool=callgrind --callgrind-out-file=results/a5-profile/callgrind.out --quiet \
            a5/target/release/sokonanoda a5/config.json \
            < arena-tests/good/perf/grind-ring-5.ndjson >/dev/null 2>/dev/null
          callgrind_annotate --auto=yes --inclusive=yes --threshold=0.15 results/a5-profile/callgrind.out \
            > results/a5-profile/callgrind.txt || true
          head -n 220 results/a5-profile/callgrind.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-a5-profile
          path: results/a5-profile/
