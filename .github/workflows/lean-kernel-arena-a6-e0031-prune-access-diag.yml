name: Lean Kernel Arena A6 E0031 prune-access diagnostic

on:
  push:
    paths:
      - '.github/workflows/lean-kernel-arena-a6-e0031-prune-access-diag.yml'
      - 'scripts/patch_a6_e0031_prune_access_diag.py'
      - 'scripts/patch_a6.py'
      - 'RGRS_CANONICAL_ENV_AUDIT.md'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/e0031
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct A6 and diagnostic only
        run: |
          set -euo pipefail
          git clone https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          python3 scripts/patch_a6.py
          python3 scripts/patch_a6_e0031_prune_access_diag.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > a6/config.json
      - name: Build diagnostic
        run: |
          set -euo pipefail
          (cd a6 && RUSTFLAGS="-C target-cpu=native" cargo build --release)
      - name: Run frozen dominant case
        run: |
          set -euo pipefail
          CASE=$(find arena-tests/good -type f -name '*grind-ring-5*.ndjson' | head -1)
          test -n "$CASE"
          echo "case=$CASE"
          set +e
          SOKONANODA_E0031_DIAG=1 a6/target/release/sokonanoda a6/config.json < "$CASE" >results/e0031/stdout.txt 2>results/e0031/stderr.txt
          rc=$?
          set -e
          echo "$rc" > results/e0031/returncode.txt
          test "$rc" -eq 0
          grep 'E0031_STATS' results/e0031/stderr.txt | tail -1 | tee results/e0031/stats.txt
      - name: Derive RGRS interpretation metrics
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          text=Path('results/e0031/stats.txt').read_text().strip()
          vals={k:int(v) for k,v in re.findall(r'(\w+)=(\d+)',text)}
          cold=vals['cold_calls']; hits=vals['frame_hits']; misses=vals['frame_misses']
          hs=vals['hit_slots']; ms=vals['miss_slots']; slots=vals['selected_slots']
          out={
            'raw': vals,
            'frame_hit_rate': hits/cold if cold else 0.0,
            'raw_pair_repeat_rate': vals['raw_pair_repeats']/cold if cold else 0.0,
            'slot_work_on_hits_fraction': hs/slots if slots else 0.0,
            'mean_slots_per_hit': hs/hits if hits else 0.0,
            'mean_slots_per_miss': ms/misses if misses else 0.0,
            'rgrs_question':'Is cold projection materialization often paid before rediscovering an existing canonical frame?'
          }
          Path('results/e0031/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lean-kernel-arena-a6-e0031-prune-access-diag
          path: results/e0031/
