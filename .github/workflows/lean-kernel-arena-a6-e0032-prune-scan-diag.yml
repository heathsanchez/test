name: Lean Kernel Arena A6 E0032 prune-scan diagnostic

on:
  push:
    paths:
      - '.github/workflows/lean-kernel-arena-a6-e0032-prune-scan-diag.yml'
      - 'scripts/patch_a6_e0032_prune_scan_diag.py'
      - 'scripts/patch_a6.py'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/e0032
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Reconstruct A6 and diagnostic only
        run: |
          set -euo pipefail
          git clone https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
          python3 scripts/patch_a6.py
          python3 scripts/patch_a6_e0032_prune_scan_diag.py
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > a6/config.json
      - name: Build diagnostic
        run: |
          set -euo pipefail
          (cd a6 && RUSTFLAGS="-C target-cpu=native" cargo build --release)
      - name: Run frozen dominant case
        run: |
          set -euo pipefail
          CASE=$(find arena-tests/good -type f -name '*grind-ring-5*.ndjson' | head -1)
          test -n "$CASE"
          set +e
          SOKONANODA_E0032_DIAG=1 a6/target/release/sokonanoda a6/config.json < "$CASE" >results/e0032/stdout.txt 2>results/e0032/stderr.txt
          rc=$?
          set -e
          echo "$rc" > results/e0032/returncode.txt
          test "$rc" -eq 0
          grep 'E0032_STATS' results/e0032/stderr.txt | tail -1 | tee results/e0032/stats.txt
      - name: Derive RGRS scan metrics
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          vals={k:int(v) for k,v in re.findall(r'(\w+)=(\d+)',Path('results/e0032/stats.txt').read_text())}
          scanned=vals['cons_scanned']; selected=vals['cons_selected']; skipped=vals['cons_skipped']; cold=vals['cold_calls']
          out={
            'raw':vals,
            'mean_cons_scanned_per_cold_call': scanned/cold if cold else 0.0,
            'cons_skip_fraction': skipped/scanned if scanned else 0.0,
            'cons_select_fraction': selected/scanned if scanned else 0.0,
            'scan_to_selected_ratio': scanned/selected if selected else 0.0,
            'rgrs_question':'Is prune_env_cold dominated by walking structurally irrelevant Cons nodes rather than materializing selected values?'
          }
          Path('results/e0032/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lean-kernel-arena-a6-e0032-prune-scan-diag
          path: results/e0032/
