name: Lean Kernel Arena semantic handoff census V1

on:
  push:
    branches:
      - arena-semantic-handoff-census-v1
    paths:
      - '.github/workflows/lean-kernel-arena-semantic-handoff-census-v1.yml'
      - 'scripts/parse_callgrind_handoffs.py'
      - 'ARENA_SEMANTIC_HANDOFF_CENSUS_V1.md'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/lean-kernel-arena-semantic-handoff-census-v1.yml'
      - 'scripts/parse_callgrind_handoffs.py'
      - 'ARENA_SEMANTIC_HANDOFF_CENSUS_V1.md'
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      KERNEL_REV: 3d7585c21242f29fdaa48ae9a16e16c6afe42238
    steps:
      - uses: actions/checkout@v4
      - name: Install profiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
      - name: Fetch frozen Arena corpus
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/semantic-handoff-v1
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Build frozen MathGraph V2
        run: |
          set -euo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git kernel
          git -C kernel checkout "$KERNEL_REV"
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > kernel/config.json
          cd kernel
          RUSTFLAGS='-C target-cpu=native -C debuginfo=1' cargo build --release
      - name: Full frozen semantic gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json
          root=Path('.'); b=root/'kernel/target/release/sokonanoda'; cfg=root/'kernel/config.json'
          total=bad=decl=0
          details=[]
          for kind,exp in [('good',0),('bad',1)]:
              for p in sorted((root/'arena-tests'/kind).rglob('*.ndjson')):
                  total+=1
                  with p.open('rb') as f:
                      r=subprocess.run([str(b),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  if r.returncode==2: decl+=1
                  if r.returncode!=exp:
                      bad+=1; details.append((str(p),r.returncode,exp))
          out={'total':total,'bad':bad,'declines':decl,'mismatches':details[:20]}
          Path('results/semantic-handoff-v1/semantic_gate.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if bad or decl: raise SystemExit(1)
          PY
      - name: Freeze discriminator paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          perf=sorted((Path('arena-tests')/'good'/'perf').glob('*.ndjson'))
          primary=Path('arena-tests/good/perf/grind-ring-5.ndjson')
          chosen=[]
          if primary.exists(): chosen.append(primary)
          chosen += [p for p in perf if p != primary][:2]
          if not chosen:
              raise SystemExit('NO_PERFORMANCE_DISCRIMINATORS')
          Path('results/semantic-handoff-v1/discriminators.json').write_text(json.dumps([str(p) for p in chosen],indent=2))
          Path('results/semantic-handoff-v1/discriminators.txt').write_text('\n'.join(str(p) for p in chosen)+'\n')
          print('\n'.join(str(p) for p in chosen))
          PY
      - name: Profile semantic handoffs
        run: |
          set -euo pipefail
          i=0
          while IFS= read -r test; do
            i=$((i+1))
            echo "Profiling $test"
            valgrind --tool=callgrind --cache-sim=no --branch-sim=no --collect-jumps=yes \
              --callgrind-out-file="results/semantic-handoff-v1/callgrind.$i.out" \
              kernel/target/release/sokonanoda kernel/config.json \
              < "$test" >/dev/null
          done < results/semantic-handoff-v1/discriminators.txt
          python3 scripts/parse_callgrind_handoffs.py \
            results/semantic-handoff-v1/handoff_census.json \
            results/semantic-handoff-v1/callgrind.*.out \
            | tee results/semantic-handoff-v1/top_edges.txt
      - name: Derive decision summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('results/semantic-handoff-v1/handoff_census.json')
          d=json.loads(p.read_text())
          edges=d['aggregated_edges']
          cross=[e for e in edges if e['workload_count']>=2]
          top=None
          if cross: top=cross[0]
          elif edges: top=edges[0]
          verdict='NO_HIGH_MASS_SEMANTIC_EDGE'
          if top:
              f=top['fraction_of_all_profiles']
              if top['workload_count']>=2 and f>=0.03: verdict='FREEZE_FUSION_SEPARATOR'
              elif f>=0.03: verdict='APPLICABILITY_RESIDUAL_SINGLE_REGIME'
              else: verdict='NO_HIGH_MASS_SEMANTIC_EDGE'
          out={'verdict':verdict,'top_cross_workload_edge':top,'cross_workload_edges_top10':cross[:10]}
          Path('results/semantic-handoff-v1/decision.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-semantic-handoff-census-v1
          path: results/semantic-handoff-v1/
