name: Lean kernel known-consumer closure V1
on:
  workflow_dispatch:
  pull_request:
    branches: [arena-pi-body-premat-identity-v1]
    paths:
      - 'scripts/patch_pi_closure_observed_key.py'
      - '.github/workflows/lean-kernel-known-consumer-closure-v1.yml'
permissions:
  contents: read
  actions: read
jobs:
  closurekey:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KERNEL_REV: 3d7585c21242f29fdaa48ae9a16e16c6afe42238
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/known-consumer-closure-v1
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Build baseline key-only reuse arms
        run: |
          set -euo pipefail
          for mode in baseline keyonly reuse; do
            git clone -q https://github.com/metalogiclabs/mathgraph-lean-kernel.git "kernel-$mode"
            git -C "kernel-$mode" checkout -q "$KERNEL_REV"
            printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > "kernel-$mode/config.json"
          done
          KERNEL_DIR=kernel-keyonly MG_CLOSURE_MODE=keyonly python3 scripts/patch_pi_closure_observed_key.py
          KERNEL_DIR=kernel-reuse MG_CLOSURE_MODE=reuse python3 scripts/patch_pi_closure_observed_key.py
          for mode in baseline keyonly reuse; do
            (cd "kernel-$mode" && cargo test --locked -q && RUSTFLAGS='-C target-cpu=native' cargo build --release -q)
            cp "kernel-$mode/target/release/sokonanoda" "$mode-native"
          done
      - name: Full semantic gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          out={}
          for mode in ['baseline','keyonly','reuse']:
            b=Path(f'kernel-{mode}/target/release/sokonanoda'); cfg=Path(f'kernel-{mode}/config.json')
            total=bad=decl=0; details=[]
            for kind,exp in [('good',0),('bad',1)]:
              for p in sorted(Path('arena-tests',kind).rglob('*.ndjson')):
                total+=1
                with p.open('rb') as f:r=subprocess.run([str(b),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=90)
                decl += r.returncode==2
                if r.returncode!=exp: bad+=1; details.append((str(p),r.returncode,exp))
            out[mode]={'total':total,'mismatches':bad,'declines':decl,'details':details[:20]}
          Path('results/known-consumer-closure-v1/semantic.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if any(v['mismatches'] or v['declines'] for v in out.values()): raise SystemExit(1)
          PY
      - name: Native repeated timing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,json,statistics
          out={}
          for p in sorted(Path('arena-tests/good/perf').glob('*.ndjson')):
            rows={m:[] for m in ['baseline','keyonly','reuse']}
            for rep in range(9):
              order=['baseline','keyonly','reuse'] if rep%2==0 else ['reuse','keyonly','baseline']
              for m in order:
                with p.open('rb') as f:
                  t=time.perf_counter(); r=subprocess.run([f'./{m}-native',f'kernel-{m}/config.json'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); dt=time.perf_counter()-t
                if r.returncode: raise SystemExit((p,m,r.returncode))
                rows[m].append(dt)
            b=statistics.median(rows['baseline']); k=statistics.median(rows['keyonly']); r=statistics.median(rows['reuse'])
            out[p.stem]={'baseline_s':b,'keyonly_s':k,'reuse_s':r,'keyonly_vs_base_pct':100*(k-b)/b,'reuse_vs_base_pct':100*(r-b)/b,'reuse_vs_keyonly_pct':100*(r-k)/k,'raw':rows}
          Path('results/known-consumer-closure-v1/timing.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Deterministic instruction comparison
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind >/dev/null
          for mode in baseline keyonly reuse; do
            (cd "kernel-$mode" && cargo clean -q && RUSTFLAGS='-C target-cpu=x86-64' cargo build --release -q)
          done
          for test in arena-tests/good/perf/*.ndjson; do
            tag=$(basename "$test" .ndjson)
            for mode in baseline keyonly reuse; do
              valgrind --tool=callgrind --callgrind-out-file="results/known-consumer-closure-v1/cg.$tag.$mode" "kernel-$mode/target/release/sokonanoda" "kernel-$mode/config.json" < "$test" >/dev/null 2>/dev/null
              grep '^summary:' "results/known-consumer-closure-v1/cg.$tag.$mode" | awk '{print $2}' > "results/known-consumer-closure-v1/instr.$tag.$mode"
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          out={}
          for p in sorted(Path('arena-tests/good/perf').glob('*.ndjson')):
            tag=p.stem; vals={m:int(Path(f'results/known-consumer-closure-v1/instr.{tag}.{m}').read_text()) for m in ['baseline','keyonly','reuse']}; b=vals['baseline']; k=vals['keyonly']; r=vals['reuse']
            out[tag]={**vals,'keyonly_vs_base_pct':100*(k-b)/b,'reuse_vs_base_pct':100*(r-b)/b,'reuse_vs_keyonly_pct':100*(r-k)/k}
          Path('results/known-consumer-closure-v1/instructions.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Synthesize decision
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('results/known-consumer-closure-v1')
          def load(n):
            p=root/n; return json.loads(p.read_text()) if p.exists() else None
          sem,ins,tim=load('semantic.json'),load('instructions.json'),load('timing.json')
          verdict='UNRESOLVED'
          if sem and not any(v['mismatches'] or v['declines'] for v in sem.values()) and ins:
            g=ins.get('grind-ring-5',{})
            causal=g.get('reuse_vs_keyonly_pct',999)
            broad=sum(v.get('reuse_vs_base_pct',0)<0 for v in ins.values())
            verdict='PROMOTE_CAUSAL_ABLATION' if causal < -0.5 and broad>=2 else ('WEAK_SIGNAL' if causal < 0 else 'REJECT_NO_ECONOMIC_IDENTITY')
          d={'verdict':verdict,'semantic':sem,'instructions':ins,'timing':tim}
          (root/'decision.json').write_text(json.dumps(d,indent=2)); print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-known-consumer-closure-v1
          path: results/known-consumer-closure-v1/
