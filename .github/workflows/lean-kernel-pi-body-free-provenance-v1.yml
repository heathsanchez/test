name: Lean kernel Pi-body free provenance V37
on:
  workflow_dispatch:
  pull_request:
    branches: [arena-pi-body-premat-identity-v1]
    paths:
      - 'scripts/patch_pi_body_free_provenance.py'
      - '.github/workflows/lean-kernel-pi-body-free-provenance-v1.yml'
permissions:
  contents: read
  actions: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KERNEL_REV: 3d7585c21242f29fdaa48ae9a16e16c6afe42238
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/pi-body-free-provenance-v1
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Clone and instrument exact submitted checker
        run: |
          set -euo pipefail
          git clone -q https://github.com/metalogiclabs/mathgraph-lean-kernel.git kernel
          git -C kernel checkout -q "$KERNEL_REV"
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > kernel/config.json
          python3 scripts/patch_pi_body_free_provenance.py
          (cd kernel && cargo test --locked -q && RUSTFLAGS='-C target-cpu=native' cargo build --release -q)
      - name: Full semantic gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          b=Path('kernel/target/release/sokonanoda'); cfg=Path('kernel/config.json'); total=bad=decl=0; details=[]
          for kind,exp in [('good',0),('bad',1)]:
            for p in sorted(Path('arena-tests',kind).rglob('*.ndjson')):
              total+=1
              with p.open('rb') as f:r=subprocess.run([str(b),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=90)
              decl += r.returncode==2
              if r.returncode!=exp: bad+=1; details.append((str(p),r.returncode,exp))
          out={'total':total,'mismatches':bad,'declines':decl,'details':details[:20]}
          Path('results/pi-body-free-provenance-v1/semantic.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if bad or decl: raise SystemExit(1)
          PY
      - name: Run provenance census on perf workloads
        run: |
          set -euo pipefail
          for test in arena-tests/good/perf/*.ndjson; do
            tag=$(basename "$test" .ndjson)
            MG_PI_FREE_PROV=1 kernel/target/release/sokonanoda kernel/config.json < "$test" >/dev/null 2> "results/pi-body-free-provenance-v1/$tag.stderr"
          done
      - name: Analyze free predictors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          keys=['body_same','env_ptr_same','env_hash_same','env_len_same','lsub_ptr_same','ctx_ptr_same','domain_ptr_same','body_hash','body_hash_len','body_hash_len_lsub','body_hash_len_lsub_ctx']
          out={}
          for p in sorted(Path('results/pi-body-free-provenance-v1').glob('*.stderr')):
            d={}
            for line in p.read_text().splitlines():
              m=re.match(r'MG_PI_FREE ([a-z_]+)=(\d+)',line)
              if m:d[m.group(1)]=int(m.group(2))
            n=d.get('enter',0); post=d.get('post_ptr',0)
            for k in keys:
              d[k+'_coverage_pct']=100*d.get(k,0)/n if n else 0
            for k in ['body_hash','body_hash_len','body_hash_len_lsub','body_hash_len_lsub_ctx']:
              denom=d.get(k,0); num=d.get('post_ptr_'+k,0)
              d[k+'_post_ptr_precision_pct']=100*num/denom if denom else 0
              d[k+'_post_ptr_recall_pct']=100*num/post if post else 0
            d['post_ptr_pct']=100*post/n if n else 0
            d['nonptr_true_pct']=100*d.get('nonptr_true',0)/n if n else 0
            out[p.stem]=d
          # Promotion requires an O(1)-field conjunction with >=99.99% empirical precision and material recall.
          verdict='NO_FREE_PROVENANCE_KEY'
          g=out.get('grind-ring-5',{})
          for k in ['body_hash','body_hash_len','body_hash_len_lsub','body_hash_len_lsub_ctx']:
            if g.get(k+'_post_ptr_precision_pct',0)>=99.99 and g.get(k+'_post_ptr_recall_pct',0)>=10:
              verdict='PROMOTE_FREE_PROVENANCE_FASTPATH'; break
          result={'verdict':verdict,'workloads':out}
          Path('results/pi-body-free-provenance-v1/decision.json').write_text(json.dumps(result,indent=2)); print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-pi-body-free-provenance-v1
          path: results/pi-body-free-provenance-v1/
