name: Lean kernel pre-force + Pi-domain 4-arm A/B v1
on:
  workflow_dispatch:
  push:
    branches: [arena-preforce-pi-ab-v1]
permissions:
  contents: read
  actions: read
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KERNEL_REV: 3d7585c21242f29fdaa48ae9a16e16c6afe42238
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/preforce-pi-ab-v1
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
      - name: Build four arms
        run: |
          set -euo pipefail
          for mode in baseline preptr pidomain combined; do
            git clone -q https://github.com/metalogiclabs/mathgraph-lean-kernel.git "kernel-$mode"
            git -C "kernel-$mode" checkout -q "$KERNEL_REV"
            printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > "kernel-$mode/config.json"
            if [ "$mode" != baseline ]; then MG_AB_MODE="$mode" KERNEL_DIR="kernel-$mode" python3 scripts/patch_preforce_pi_ab.py; fi
            (cd "kernel-$mode" && RUSTFLAGS='-C target-cpu=native' cargo build --release -q)
          done
      - name: Semantic gate all arms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          out={}
          for mode in ['baseline','preptr','pidomain','combined']:
            b=Path(f'kernel-{mode}/target/release/sokonanoda'); cfg=Path(f'kernel-{mode}/config.json'); total=bad=decl=0
            for kind,exp in [('good',0),('bad',1)]:
              for p in sorted(Path('arena-tests',kind).rglob('*.ndjson')):
                total+=1
                with p.open('rb') as f:r=subprocess.run([str(b),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                decl += r.returncode==2; bad += r.returncode!=exp
            out[mode]={'total':total,'bad':bad,'declines':decl}
          Path('results/preforce-pi-ab-v1/semantic.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if any(x['bad'] or x['declines'] for x in out.values()): raise SystemExit(1)
          PY
      - name: Deterministic instruction A/B
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind >/dev/null
          for test in arena-tests/good/perf/*.ndjson; do
            tag=$(basename "$test" .ndjson)
            for mode in baseline preptr pidomain combined; do
              valgrind --tool=callgrind --callgrind-out-file="results/preforce-pi-ab-v1/cg.$tag.$mode" "kernel-$mode/target/release/sokonanoda" "kernel-$mode/config.json" < "$test" >/dev/null 2>/dev/null
              grep '^summary:' "results/preforce-pi-ab-v1/cg.$tag.$mode" | awk '{print $2}' > "results/preforce-pi-ab-v1/instr.$tag.$mode"
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          out={}
          for p in sorted(Path('arena-tests/good/perf').glob('*.ndjson')):
            tag=p.stem; base=int(Path(f'results/preforce-pi-ab-v1/instr.{tag}.baseline').read_text())
            out[tag]={}
            for m in ['preptr','pidomain','combined']:
              x=int(Path(f'results/preforce-pi-ab-v1/instr.{tag}.{m}').read_text()); out[tag][m]={'instructions':x,'delta_pct':100*(x-base)/base}
          Path('results/preforce-pi-ab-v1/decision.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-preforce-pi-ab-v1
          path: results/preforce-pi-ab-v1/
