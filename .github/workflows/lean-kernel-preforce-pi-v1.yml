name: Lean kernel pre-force equality + Pi-Pi census v1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - arena-unification-obligation-atlas-v1
    paths:
      - 'scripts/patch_preforce_pi_sniff.py'
      - 'scripts/analyze_preforce_pi_sniff.py'
      - '.github/workflows/lean-kernel-preforce-pi-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KERNEL_REV: 3d7585c21242f29fdaa48ae9a16e16c6afe42238
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/preforce-pi-v1
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          find arena-tests/good/perf -maxdepth 1 -name '*.ndjson' -printf '%f\n' | sort | tee results/preforce-pi-v1/perf_manifest.txt
      - name: Clone and instrument frozen checker
        run: |
          set -euo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git kernel
          git -C kernel checkout "$KERNEL_REV"
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > kernel/config.json
          python3 scripts/patch_preforce_pi_sniff.py
          cd kernel
          RUSTFLAGS='-C target-cpu=native' cargo build --release
      - name: Full semantic gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          root=Path('.'); b=root/'kernel/target/release/sokonanoda'; cfg=root/'kernel/config.json'
          total=bad=decl=0; details=[]
          for kind,exp in [('good',0),('bad',1)]:
              for p in sorted((root/'arena-tests'/kind).rglob('*.ndjson')):
                  total+=1
                  with p.open('rb') as f: r=subprocess.run([str(b),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  if r.returncode==2: decl+=1
                  if r.returncode!=exp: bad+=1; details.append((str(p),r.returncode,exp))
          out={'total':total,'bad':bad,'declines':decl,'mismatches':details[:20]}
          Path('results/preforce-pi-v1/semantic_gate.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if bad or decl: raise SystemExit(1)
          PY
      - name: Run pre-force and Pi-Pi census
        run: |
          set -euo pipefail
          for test in arena-tests/good/perf/*.ndjson; do
            tag="$(basename "$test" .ndjson)"
            echo "CENSUS $tag"
            MG_PREFORCE_PI_SNIFF=1 kernel/target/release/sokonanoda kernel/config.json \
              < "$test" >/dev/null 2> "results/preforce-pi-v1/sniff.$tag.stderr"
          done
      - name: Analyze deciding signals
        run: |
          python3 scripts/analyze_preforce_pi_sniff.py results/preforce-pi-v1 | tee results/preforce-pi-v1/decision_summary.txt
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-kernel-preforce-pi-v1
          path: results/preforce-pi-v1/
