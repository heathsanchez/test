name: Lean kernel unification obligation sniff v1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - arena-semantic-handoff-census-v1
    paths:
      - 'UNIFICATION_OBLIGATION_ATLAS_V1_PRECOMMIT.md'
      - 'scripts/patch_unification_sniff.py'
      - 'scripts/analyze_unification_sniff.py'
      - '.github/workflows/lean-kernel-unification-obligation-sniff-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  sniff:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KERNEL_REV: 3d7585c21242f29fdaa48ae9a16e16c6afe42238
    steps:
      - uses: actions/checkout@v4

      - name: Install profiling tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind

      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p arena-tests artifact results/unification-obligation-v1
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/8931227426/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          find arena-tests/good/perf -maxdepth 1 -name '*.ndjson' -printf '%f\n' | sort | tee results/unification-obligation-v1/perf_manifest.txt

      - name: Clone and instrument pinned checker
        run: |
          set -euo pipefail
          git clone https://github.com/metalogiclabs/mathgraph-lean-kernel.git kernel
          git -C kernel checkout "$KERNEL_REV"
          printf '%s\n' '{"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}' > kernel/config.json
          python3 scripts/patch_unification_sniff.py
          cd kernel
          # Native build is used for semantic/counter collection so the sniff population
          # matches the intended optimized checker as closely as possible.
          CARGO_TARGET_DIR=target-native RUSTFLAGS='-C target-cpu=native -C debuginfo=1' cargo build --release
          # Valgrind 3.22 on hosted runners can SIGILL on host-native instructions.
          # Keep a second instrumented build on the conservative x86-64 baseline solely
          # for Callgrind cost attribution. We never compare absolute timings across builds.
          CARGO_TARGET_DIR=target-valgrind RUSTFLAGS='-C target-cpu=x86-64 -C debuginfo=1' cargo build --release

      - name: Full semantic gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json
          root=Path('.'); b=root/'kernel/target-native/release/sokonanoda'; cfg=root/'kernel/config.json'
          total=bad=decl=0; details=[]
          for kind,exp in [('good',0),('bad',1)]:
              for p in sorted((root/'arena-tests'/kind).rglob('*.ndjson')):
                  total += 1
                  with p.open('rb') as f:
                      r=subprocess.run([str(b),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  if r.returncode == 2: decl += 1
                  if r.returncode != exp:
                      bad += 1; details.append((str(p),r.returncode,exp))
          out={'total':total,'bad':bad,'declines':decl,'mismatches':details[:20]}
          Path('results/unification-obligation-v1/semantic_gate.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if bad or decl: raise SystemExit(1)
          PY

      - name: Run obligation counters on every performance discriminator
        run: |
          set -euo pipefail
          for test in arena-tests/good/perf/*.ndjson; do
            tag="$(basename "$test" .ndjson)"
            echo "SNIFF $tag"
            MG_UNIFY_SNIFF=1 kernel/target-native/release/sokonanoda kernel/config.json \
              < "$test" >/dev/null 2> "results/unification-obligation-v1/sniff.$tag.stderr"
          done

      - name: Validate Valgrind-safe build semantics on performance cases
        run: |
          set -euo pipefail
          for test in arena-tests/good/perf/*.ndjson; do
            kernel/target-valgrind/release/sokonanoda kernel/config.json < "$test" >/dev/null
          done

      - name: Route-separated Callgrind profiles
        id: callgrind
        continue-on-error: true
        run: |
          set -uo pipefail
          : > results/unification-obligation-v1/callgrind_failures.txt
          failures=0
          for test in arena-tests/good/perf/*.ndjson; do
            tag="$(basename "$test" .ndjson)"
            echo "CALLGRIND $tag"
            if valgrind --tool=callgrind --cache-sim=no --branch-sim=no --collect-jumps=yes \
              --callgrind-out-file="results/unification-obligation-v1/callgrind.$tag.out" \
              kernel/target-valgrind/release/sokonanoda kernel/config.json \
              < "$test" >/dev/null 2> "results/unification-obligation-v1/callgrind.$tag.stderr"; then
              callgrind_annotate --inclusive=no --tree=none --threshold=0 \
                "results/unification-obligation-v1/callgrind.$tag.out" \
                > "results/unification-obligation-v1/annotate-self.$tag.txt"
              callgrind_annotate --inclusive=yes --tree=none --threshold=0 \
                "results/unification-obligation-v1/callgrind.$tag.out" \
                > "results/unification-obligation-v1/annotate-inclusive.$tag.txt"
            else
              echo "$tag" | tee -a results/unification-obligation-v1/callgrind_failures.txt
              failures=$((failures+1))
            fi
          done
          echo "CALLGRIND_FAILURE_COUNT=$failures" | tee results/unification-obligation-v1/callgrind_status.txt
          test "$failures" -eq 0

      - name: Analyze all high-impact sniff tests
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/analyze_unification_sniff.py results/unification-obligation-v1 \
            | tee results/unification-obligation-v1/decision_summary.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/unification-obligation-v1/unification_sniff_report.json')
          if not p.exists():
              print('No final report produced; raw counters/profile files are preserved for diagnosis.')
              raise SystemExit(0)
          d=json.loads(p.read_text())
          print('\n=== TOP IMPACT CANDIDATES ===')
          for x in d.get('ranked_candidates',[])[:12]:
              print(f"{x['workload']:20s} {x['candidate']:28s} {x['inclusive_percent']:8.3f}%")
          print('\n=== REWRITE SIGNALS ===')
          print(json.dumps(d.get('rewrite_signals',{}),indent=2))
          PY

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-kernel-unification-obligation-sniff-v1
          path: results/unification-obligation-v1/
