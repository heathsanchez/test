name: Lean already-earned slot quotient RED

on:
  push:
    paths:
      - '.github/workflows/lean-novel-slot-earned-red.yml'
      - 'scripts/patch_novel_slot_earned_red.py'
      - 'scripts/patch_a6.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen Arena discovery case
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a6 results/earned-red diagnostics/earned-red
          mkdir -p arena-tests artifact results/earned-red diagnostics/earned-red
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          find arena-tests/good -type f -name '*grind-ring-5*.ndjson' | sort > diagnostics/earned-red/discovery_candidates.txt
          test "$(wc -l < diagnostics/earned-red/discovery_candidates.txt)" -eq 1

      - name: Reconstruct A6 with diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout -q "$SOKO_PIN"
          python3 scripts/patch_a6.py
          python3 scripts/patch_novel_slot_earned_red.py
          git -C a6 diff --check
          git -C a6 diff > diagnostics/earned-red/diagnostic.patch
          cat > a6/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          grep -q 'CQ_EARNED_FALSE_SPLITS' a6/src/eval.rs
          grep -q 'intern_frame(hash, out_mask, slots, lsub)' a6/src/eval.rs

      - name: Build diagnostic
        shell: bash
        run: |
          set -euo pipefail
          (cd a6 && RUSTFLAGS="-C target-cpu=native" cargo build --release)
          test -x a6/target/release/sokonanoda

      - name: Observe already-earned quotient
        shell: bash
        run: |
          set -euo pipefail
          CASE=$(cat diagnostics/earned-red/discovery_candidates.txt)
          SOKONANODA_CQ_EARNED_RED=1             a6/target/release/sokonanoda a6/config.json             < "$CASE"             > diagnostics/earned-red/stdout.txt             2> diagnostics/earned-red/stderr.txt

          python3 - <<'PY'
          import json, pathlib, re
          text = pathlib.Path('diagnostics/earned-red/stderr.txt').read_text(errors='replace')
          m = re.search(
              r'CQ_EARNED_RED calls=(\d+) slot_total=(\d+) slot_hits=(\d+) frame_changed=(\d+) canon_repeat=(\d+) false_splits=(\d+)',
              text,
          )
          if not m:
              raise SystemExit('missing CQ_EARNED_RED telemetry')
          calls, slot_total, slot_hits, frame_changed, repeat, false_splits = map(int, m.groups())
          result = {
              'calls': calls,
              'slot_total': slot_total,
              'already_earned_slot_substitutions': slot_hits,
              'frames_changed_by_already_earned_representatives': frame_changed,
              'earned_signature_repeats': repeat,
              'earned_false_splits': false_splits,
              'canonicalization_invoked_by_diagnostic': False,
              'production_quotient_enabled': False,
          }
          pathlib.Path('results/earned-red/result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: RED assertion - current frames should already use earned representatives
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          x = json.loads(pathlib.Path('results/earned-red/result.json').read_text())
          if x['earned_false_splits'] > 0:
              raise SystemExit(
                  f"RED: found {x['earned_false_splits']} false splits available from already-earned canonical representatives"
              )
          print('Candidate rejected: no already-earned false split on frozen discovery workload.')
          PY

      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-earned-slot-quotient-red
          path: |
            results/earned-red/
            diagnostics/earned-red/
