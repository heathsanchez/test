name: Lean novel slot quotient RED

on:
  push:
    paths:
      - '.github/workflows/lean-novel-slot-quotient-red.yml'
      - 'scripts/patch_novel_slot_quotient_red.py'
      - 'scripts/patch_a6.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  red:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a6 results/novel-slot-red diagnostics/novel-slot-red
          mkdir -p arena-tests artifact results/novel-slot-red diagnostics/novel-slot-red
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          test -f artifact/lean-arena-tests.tar.gz
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          find arena-tests/good -type f -name '*grind-ring-5*.ndjson' | sort > diagnostics/novel-slot-red/discovery_candidates.txt
          test "$(wc -l < diagnostics/novel-slot-red/discovery_candidates.txt)" -eq 1

      - name: Reconstruct unmodified A6 plus diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout -q "$SOKO_PIN"
          python3 scripts/patch_a6.py
          python3 scripts/patch_novel_slot_quotient_red.py
          git -C a6 diff --check
          git -C a6 diff > diagnostics/novel-slot-red/diagnostic.patch
          cat > a6/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON
          grep -q 'CQ_SLOT_FALSE_SPLITS' a6/src/eval.rs
          grep -q 'intern_frame(hash, out_mask, slots, lsub)' a6/src/eval.rs

      - name: Build RED diagnostic
        shell: bash
        run: |
          set -euo pipefail
          (cd a6 && RUSTFLAGS="-C target-cpu=native" cargo build --release)
          test -x a6/target/release/sokonanoda

      - name: Observe current representation partition
        shell: bash
        run: |
          set -euo pipefail
          CASE=$(cat diagnostics/novel-slot-red/discovery_candidates.txt)
          set +e
          SOKONANODA_CQ_SLOT_RED=1             a6/target/release/sokonanoda a6/config.json             < "$CASE"             > diagnostics/novel-slot-red/stdout.txt             2> diagnostics/novel-slot-red/stderr.txt
          RC=$?
          set -e
          test "$RC" -eq 0

          python3 - <<'PY'
          import json, pathlib, re
          text = pathlib.Path('diagnostics/novel-slot-red/stderr.txt').read_text(errors='replace')
          m = re.search(r'CQ_SLOT_RED calls=(\d+) canon_changed=(\d+) canon_repeat=(\d+) false_splits=(\d+)', text)
          if not m:
              raise SystemExit('missing CQ_SLOT_RED telemetry')
          calls, changed, repeat, false_splits = map(int, m.groups())
          result = {
              'calls': calls,
              'canonicalization_changed_slot_vector': changed,
              'canonical_signature_repeats': repeat,
              'false_splits': false_splits,
              'red_property': 'current A6 should already share all frames equal under existing slot canonicalization',
              'production_quotient_enabled': False,
          }
          pathlib.Path('results/novel-slot-red/result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: RED assertion - no canonical-slot false split should exist
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          x = json.loads(pathlib.Path('results/novel-slot-red/result.json').read_text())
          if x['false_splits'] > 0:
              raise SystemExit(
                  f"RED: found {x['false_splits']} canonical-slot false splits; "
                  "current A6 does not implement the predicted quotient"
              )
          print('Candidate rejected: no false split found on the frozen discovery workload.')
          PY

      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-novel-slot-quotient-red
          path: |
            results/novel-slot-red/
            diagnostics/novel-slot-red/
