name: Lean shadow consequential open-eval identity

on:
  push:
    paths:
      - '.github/workflows/lean-open-eval-shadow-identity.yml'
      - 'scripts/patch_open_eval_shadow_identity_diag.py'
      - 'scripts/patch_a6.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOKO_PIN: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
      ARENA_ARTIFACT: 8931227426
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena-tests artifact tests.zip a6 results/open-shadow diagnostics/open-shadow
          mkdir -p arena-tests artifact results/open-shadow diagnostics/open-shadow
          curl --fail --location --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip"             -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

      - name: Reconstruct diagnostic A6
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/intgrah/sokonanoda.git a6
          git -C a6 checkout -q "$SOKO_PIN"
          python3 scripts/patch_a6.py
          python3 scripts/patch_open_eval_shadow_identity_diag.py
          git -C a6 diff --check
          git -C a6 diff > diagnostics/open-shadow/diagnostic.patch
          cat > a6/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
          JSON

      - name: Build diagnostic
        shell: bash
        run: |
          set -euo pipefail
          (cd a6 && RUSTFLAGS="-C target-cpu=native" cargo build --release)
          test -x a6/target/release/sokonanoda

      - name: Freeze case sets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          discovery=sorted(pathlib.Path('arena-tests/good').rglob('*grind-ring-5*.ndjson'))
          if len(discovery)!=1:
              raise SystemExit(f'expected one discovery case, got {len(discovery)}')
          d=discovery[0].resolve()
          pathlib.Path('diagnostics/open-shadow/discovery.txt').write_text(str(discovery[0])+'\n')
          good=[p for p in pathlib.Path('arena-tests/good').rglob('*.ndjson') if p.resolve()!=d]
          held=sorted(good,key=lambda p:(-p.stat().st_size,str(p)))[:24]
          if len(held)!=24:
              raise SystemExit(f'held-out count {len(held)}')
          pathlib.Path('diagnostics/open-shadow/heldout.txt').write_text('\n'.join(map(str,held))+'\n')
          PY

      - name: Measure shadow identity opportunities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          rx=re.compile(
            r'OPEN_EVAL_SHADOW raw_hit=(\d+) raw_miss=(\d+) shadow_hit=(\d+) shadow_proj=(\d+) shadow_let=(\d+) shadow_pi=(\d+)'
          )
          names=['raw_hit','raw_miss','shadow_hit','shadow_proj','shadow_let','shadow_pi']
          sets={
            'discovery':[pathlib.Path(pathlib.Path('diagnostics/open-shadow/discovery.txt').read_text().strip())],
            'heldout':[pathlib.Path(x) for x in pathlib.Path('diagnostics/open-shadow/heldout.txt').read_text().splitlines() if x],
          }
          out={}
          for set_name,cases in sets.items():
              total={k:0 for k in names}; rows=[]
              for p in cases:
                  with p.open('rb') as f:
                      r=subprocess.run(
                        ['a6/target/release/sokonanoda','a6/config.json'],
                        stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                        env={**os.environ,'SOKONANODA_OPEN_EVAL_SHADOW':'1'},
                      )
                  if r.returncode!=0:
                      raise SystemExit(f'failed {p}: rc={r.returncode}')
                  m=rx.search(r.stderr.decode(errors='replace'))
                  if not m:
                      raise SystemExit(f'missing telemetry for {p}')
                  row=dict(zip(names,map(int,m.groups())))
                  row['shadow_hit_rate_over_raw_misses']=row['shadow_hit']/row['raw_miss'] if row['raw_miss'] else 0.0
                  rows.append({'case':str(p),**row})
                  for k in names: total[k]+=row[k]
              total['shadow_hit_rate_over_raw_misses']=total['shadow_hit']/total['raw_miss'] if total['raw_miss'] else 0.0
              out[set_name]={'total':total,'rows':rows}
          pathlib.Path('results/open-shadow/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-open-eval-shadow-identity
          path: |
            results/open-shadow/
            diagnostics/open-shadow/
