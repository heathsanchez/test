name: LKA G16 PUnit v0

on:
  push:
    branches: [lka-g16-punit-v0]
    paths:
      - ".github/workflows/lka-g16-punit-v0.yml"
      - "metatron-kernel/src/**"
      - "metatron-kernel/tests/**"
      - "metatron-kernel/tests_py/**"
      - "metatron-kernel/evidence/**"
      - "metatron-kernel/formal/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lka-g16-punit-v0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRE_G16_SHA: c70e7a033b3660d3705f6566027f2b75e36cda2e
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source and retained evidence
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          python -m unittest discover -s tests_py -p 'test_*.py' -v
          python scripts/check_ledger.py

      - name: Build sealed pre-G16 oracle and candidate
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/metatron-pre-g16 "$PRE_G16_SHA"
          cargo build --release --locked \
            --manifest-path /tmp/metatron-pre-g16/metatron-kernel/Cargo.toml
          cargo build --release --locked \
            --manifest-path metatron-kernel/Cargo.toml
          METATRON_G16_ORACLE=/tmp/metatron-pre-g16/metatron-kernel/target/release/metatron-kernel \
            cargo test --release --manifest-path metatron-kernel/Cargo.toml --test end_to_end

      - name: Fetch pinned Arena contract
        run: |
          set -euo pipefail
          git init /tmp/lean-kernel-arena
          git -C /tmp/lean-kernel-arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/lean-kernel-arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/lean-kernel-arena checkout --detach FETCH_HEAD
          test "$(git -C /tmp/lean-kernel-arena rev-parse HEAD)" = "$ARENA_SHA"

      - name: Generate pinned tutorials and build IdealLean
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/lean-kernel-tutorial
          cd /tmp/lean-kernel-arena/tutorial
          lake clean
          OUT=/tmp/lean-kernel-tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial
          cd "$GITHUB_WORKSPACE/metatron-kernel/formal"
          lake build

      - name: Protect tutorials 001-041
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out
          python scripts/qualify_tutorial.py \
            --checker target/release/metatron-kernel \
            --tutorial-output /tmp/lean-kernel-tutorial \
            --candidate-sha "$GITHUB_SHA" \
            --arena-sha "$ARENA_SHA" \
            --output evidence-out/protected-qualification.json \
            --oracle /tmp/metatron-pre-g16/metatron-kernel/target/release/metatron-kernel \
            --oracle-sha "$PRE_G16_SHA" \
            --require-equivalence \
            --differential-output evidence-out/protected-differential.json
          python - <<'PY'
          import json
          q=json.load(open("evidence-out/protected-qualification.json"))
          d=json.load(open("evidence-out/protected-differential.json"))
          assert q["qualified"] is True, q
          assert q["counts"] == {"incorrect":0,"matched":41}, q
          assert d["qualified"] is True, d
          assert d["counts"] == {"earned_delta":0,"equal":41,"mismatch":0}, d
          assert d["oracle_sha"] == "c70e7a033b3660d3705f6566027f2b75e36cda2e", d
          PY

      - name: Qualify exact PUnit delta
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path("/tmp/lean-kernel-tutorial")
          candidate=pathlib.Path("target/release/metatron-kernel").resolve()
          oracle=pathlib.Path("/tmp/metatron-pre-g16/metatron-kernel/target/release/metatron-kernel").resolve()

          def case(n):
              ms=list(root.glob(f"*/{n:03d}_*.ndjson"))
              assert len(ms)==1,(n,ms)
              return ms[0]
          def run(bin,path):
              with path.open("rb") as f:
                  return subprocess.run([str(bin)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode

          p42=case(42)
          assert run(oracle,p42)==2
          assert run(candidate,p42)==0

          p43=case(43)
          assert run(oracle,p43)==2
          assert run(candidate,p43)==2

          out={"schema":"lka-g16-exact-v0","case42":{"oracle":2,"candidate":0},"case43":{"oracle":2,"candidate":2}}
          pathlib.Path("evidence-out/g16-exact.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Audit future closure and unintended verdicts
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          from collections import Counter
          root=pathlib.Path("/tmp/lean-kernel-tutorial")
          candidate=pathlib.Path("target/release/metatron-kernel").resolve()
          oracle=pathlib.Path("/tmp/metatron-pre-g16/metatron-kernel/target/release/metatron-kernel").resolve()

          def case(n):
              ms=list(root.glob(f"*/{n:03d}_*.ndjson"))
              assert len(ms)==1,(n,ms)
              return ms[0]
          def run(bin,path):
              with path.open("rb") as f:
                  return subprocess.run([str(bin)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode

          rows=[]
          transitions=Counter()
          bad_deltas=[]
          for n in range(42,142):
              path=case(n)
              expected=0 if path.parent.name=="good" else 1
              before=run(oracle,path)
              after=run(candidate,path)
              transitions[(before,after)]+=1
              row={"case":n,"expected":expected,"oracle":before,"candidate":after,"path":path.name}
              rows.append(row)
              if before != after:
                  # New PUnit authority may turn UNKNOWN into ACCEPT when the
                  # remaining export is already in retained semantics. It may
                  # not create a new conclusive wrong verdict.
                  if after in (0,1) and after != expected:
                      bad_deltas.append(row)

          assert not bad_deltas, bad_deltas
          changed=[r for r in rows if r["oracle"]!=r["candidate"]]
          assert any(r["case"]==42 and r["oracle"]==2 and r["candidate"]==0 for r in changed), changed
          assert all(r["case"] != 43 for r in changed), changed

          out={
            "schema":"lka-g16-future-closure-v0",
            "changed":changed,
            "transitions":{f"{a}->{b}":v for (a,b),v in sorted(transitions.items())},
            "bad_deltas":bad_deltas,
          }
          pathlib.Path("evidence-out/g16-future-closure.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Upload exact-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: lka-g16-punit-v0-${{ github.sha }}
          path: metatron-kernel/evidence-out
          if-no-files-found: error
