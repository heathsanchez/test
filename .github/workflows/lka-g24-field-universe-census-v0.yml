name: LKA G24 Field Universe Census v0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lka-g24-field-universe-census-v0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
      BASE_SHA: 58b08a1b0fc3622a480ec2d72953ba77fdc86265
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify sealed base
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          python -m unittest discover -s tests_py -p 'test_*.py' -v
          python scripts/check_ledger.py

      - name: Build pinned Arena tutorial
        run: |
          set -euo pipefail
          git init /tmp/lean-kernel-arena
          git -C /tmp/lean-kernel-arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/lean-kernel-arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/lean-kernel-arena checkout --detach FETCH_HEAD
          test "$(git -C /tmp/lean-kernel-arena rev-parse HEAD)" = "$ARENA_SHA"
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/lean-kernel-tutorial
          cd /tmp/lean-kernel-arena/tutorial
          lake clean
          OUT=/tmp/lean-kernel-tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial

      - name: Census 056-061 from exact sealed base
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo build --release --locked
          mkdir -p evidence-out/g24-census/fixtures
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess

          root=pathlib.Path('/tmp/lean-kernel-tutorial')
          checker=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]
          wanted=set(range(56,62))
          for expected_dir,expected_exit in [('good',0),('bad',1)]:
              for path in sorted((root/expected_dir).glob('*.ndjson')):
                  try:
                      number=int(path.name.split('_',1)[0])
                  except ValueError:
                      continue
                  if number not in wanted:
                      continue
                  with path.open('rb') as stream:
                      run=subprocess.run(
                          [str(checker)], stdin=stream,
                          stdout=subprocess.DEVNULL, stderr=subprocess.PIPE,
                          check=False,
                      )
                  raw=path.read_bytes()
                  dst=pathlib.Path('evidence-out/g24-census/fixtures')/path.name
                  shutil.copyfile(path,dst)
                  rows.append({
                      'number':number,
                      'input':f'{expected_dir}/{path.name}',
                      'sha256':hashlib.sha256(raw).hexdigest(),
                      'expected_exit':expected_exit,
                      'actual_exit':run.returncode,
                      'matched':run.returncode==expected_exit,
                      'stderr':run.stderr.decode(errors='replace')[-2000:],
                  })
          rows.sort(key=lambda x:x['number'])
          assert [r['number'] for r in rows] == list(range(56,62)), rows
          assert rows[0]['matched'] is True, rows[0]
          assert rows[1]['matched'] is True, rows[1]
          assert rows[2]['number']==58 and rows[2]['expected_exit']==0 and rows[2]['actual_exit']==2, rows[2]
          out={
              'schema':'metatron-kernel-g24-field-universe-census-v0',
              'candidate_sha':os.environ['GITHUB_SHA'],
              'sealed_base_sha':os.environ['BASE_SHA'],
              'arena_sha':os.environ['ARENA_SHA'],
              'rows':rows,
              'first_residual':rows[2],
              'authority':'diagnostic-only; no semantic authority added',
          }
          pathlib.Path('evidence-out/g24-census/census.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Upload G24 census
        uses: actions/upload-artifact@v4
        with:
          name: lka-g24-field-universe-census-${{ github.sha }}
          path: metatron-kernel/evidence-out/g24-census
          if-no-files-found: error
