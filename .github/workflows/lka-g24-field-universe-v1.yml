name: LKA G24 Field Universe Qualification v1

on:
  push:
    branches: [lka-g24-field-universe-v1]
    paths:
      - ".github/workflows/lka-g24-field-universe-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lka-g24-field-universe-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
      BASE_SHA: 58b08a1b0fc3622a480ec2d72953ba77fdc86265
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source and retained evidence
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          python -m unittest discover -s tests_py -p 'test_*.py' -v
          python scripts/check_ledger.py

      - name: Build exact G23Q oracle
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/g23q-oracle "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/g23q-oracle/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Build pinned Arena tutorial
        run: |
          set -euo pipefail
          git init /tmp/lean-kernel-arena
          git -C /tmp/lean-kernel-arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/lean-kernel-arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/lean-kernel-arena checkout --detach FETCH_HEAD
          test "$(git -C /tmp/lean-kernel-arena rev-parse HEAD)" = "$ARENA_SHA"
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/lean-kernel-tutorial
          cd /tmp/lean-kernel-arena/tutorial
          lake clean
          OUT=/tmp/lean-kernel-tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial

      - name: Global tutorial reclosure
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/g24
          python - <<'PY'
          import json, os, pathlib, subprocess

          tutorial=pathlib.Path('/tmp/lean-kernel-tutorial')
          oracle=pathlib.Path('/tmp/g23q-oracle/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]
          for expected_dir,expected_exit in [('good',0),('bad',1)]:
              for path in sorted((tutorial/expected_dir).glob('*.ndjson')):
                  try:
                      number=int(path.name.split('_',1)[0])
                  except ValueError:
                      continue
                  def run(binary):
                      with path.open('rb') as f:
                          return subprocess.run(
                              [str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL,check=False,
                          ).returncode
                  a,b=run(oracle),run(candidate)
                  if b != a:
                      status='earned_delta' if b==expected_exit and a!=expected_exit else 'mismatch'
                  else:
                      status='equal_correct' if b==expected_exit else 'equal_residual'
                  rows.append({
                      'number':number,
                      'input':f'{expected_dir}/{path.name}',
                      'expected_exit':expected_exit,
                      'oracle_exit':a,
                      'candidate_exit':b,
                      'status':status,
                  })
          rows.sort(key=lambda r:r['number'])
          changes=[r for r in rows if r['candidate_exit']!=r['oracle_exit']]
          earned=[r for r in rows if r['status']=='earned_delta']
          mismatches=[r for r in rows if r['status']=='mismatch']
          residuals=[r for r in rows if r['candidate_exit']!=r['expected_exit']]
          required={58:(2,0),59:(2,0),60:(2,0),61:(2,1)}
          by={r['number']:r for r in rows}
          for n,(a,b) in required.items():
              r=by[n]
              assert r['oracle_exit']==a and r['candidate_exit']==b and r['status']=='earned_delta', r
          assert mismatches==[], mismatches
          out={
              'schema':'metatron-kernel-g24-field-universe-qualification-v1',
              'arena_sha':os.environ['ARENA_SHA'],
              'oracle_sha':os.environ['BASE_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'total':len(rows),
              'changes':changes,
              'earned_deltas':earned,
              'mismatches':mismatches,
              'remaining_residuals':residuals,
              'first_remaining_residual':residuals[0] if residuals else None,
              'counts':{
                  'earned_delta':len(earned),
                  'mismatch':len(mismatches),
                  'equal_correct':sum(r['status']=='equal_correct' for r in rows),
                  'equal_residual':sum(r['status']=='equal_residual' for r in rows),
              },
          }
          pathlib.Path('evidence-out/g24/tutorial-reclosure.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps({
              'counts':out['counts'],
              'changes':changes,
              'first_remaining_residual':out['first_remaining_residual'],
          },sort_keys=True))
          PY

      - name: Replay committed broad corpus
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess
          oracle=pathlib.Path('/tmp/g23q-oracle/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()
          paths=sorted(pathlib.Path('tests/fixtures').glob('*.ndjson'))
          paths += sorted(pathlib.Path('evidence/residuals').glob('**/*.ndjson'))
          seen=set(); rows=[]
          for path in paths:
              rp=str(path)
              if rp in seen: continue
              seen.add(rp)
              def run(binary):
                  with path.open('rb') as f:
                      return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
              a,b=run(oracle),run(candidate)
              rows.append({'path':rp,'oracle':a,'candidate':b})
          diffs=[r for r in rows if r['oracle']!=r['candidate']]
          earned_paths={
              'evidence/residuals/G24-001/058_predWithTypeField.ndjson':0,
              'evidence/residuals/G24-001/059_typeWithTypeField.ndjson':0,
              'evidence/residuals/G24-001/060_typeWithTypeFieldPoly.ndjson':0,
              'evidence/residuals/G24-001/061_typeWithTooHighTypeField.mk.ndjson':1,
          }
          unexpected=[]
          for r in diffs:
              expected=earned_paths.get(r['path'])
              if expected is None or r['oracle']!=2 or r['candidate']!=expected:
                  unexpected.append(r)
          for p,expected in earned_paths.items():
              hit=next((r for r in rows if r['path']==p),None)
              assert hit is not None and hit['oracle']==2 and hit['candidate']==expected, (p,hit)
          out={'schema':'metatron-kernel-g24-committed-differential-v2','count':len(rows),'diffs':diffs,'unexpected':unexpected,'rows':rows}
          pathlib.Path('evidence-out/g24/committed-differential.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\\n')
          print(json.dumps({'count':len(rows),'diffs':diffs,'unexpected':unexpected},sort_keys=True))
          assert unexpected==[], unexpected
          PY

      - name: Upload G24 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lka-g24-field-universe-${{ github.sha }}
          path: metatron-kernel/evidence-out/g24
          if-no-files-found: error
