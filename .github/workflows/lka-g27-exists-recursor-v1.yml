name: LKA G27 Exists Recursor Qualification v1

on:
  push:
    branches: [lka-g27-exists-recursor-v1]
    paths:
      - ".github/workflows/lka-g27-exists-recursor-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lka-g27-exists-recursor-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
      BASE_SHA: 587b9706df880ba67bf8f28b7ecb6a3e5417fdd0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source and retained evidence
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          python -m unittest discover -s tests_py -p 'test_*.py' -v
          python scripts/check_ledger.py

      - name: Build exact G26 oracle
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/g26-oracle "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/g26-oracle/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Exact G27 residual and metadata falsifiers
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, tempfile
          src=pathlib.Path('evidence/residuals/G27-001/074_existsRec.ndjson')
          oracle=pathlib.Path('/tmp/g26-oracle/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()
          def run(binary,path):
              with path.open('rb') as f:
                  return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
          assert run(oracle,src)==2
          assert run(candidate,src)==0
          rows=[json.loads(x) for x in src.read_text().splitlines() if x.strip()]
          ind_i=next(i for i,r in enumerate(rows) if "inductive" in r)
          def check(label,mut):
              copy=json.loads(json.dumps(rows))
              mut(copy[ind_i]["inductive"])
              with tempfile.NamedTemporaryFile("w",suffix=".ndjson",delete=False) as f:
                  p=pathlib.Path(f.name)
                  for row in copy: f.write(json.dumps(row,separators=(",",":"))+"\n")
              code=run(candidate,p)
              p.unlink()
              assert code != 0, (label,code)
              print(label,code)
          check("k_true",lambda x:x["recs"][0].__setitem__("k",True))
          check("zero_motives",lambda x:x["recs"][0].__setitem__("numMotives",0))
          check("wrong_rule_fields",lambda x:x["recs"][0]["rules"][0].__setitem__("nfields",1))
          check("missing_recursor_level",lambda x:x["recs"][0].__setitem__("levelParams",[]))
          check("wrong_ctor_fields",lambda x:x["ctors"][0].__setitem__("numFields",1))
          PY

      - name: Build pinned Arena tutorial
        run: |
          set -euo pipefail
          git init /tmp/lean-kernel-arena
          git -C /tmp/lean-kernel-arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/lean-kernel-arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/lean-kernel-arena checkout --detach FETCH_HEAD
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/lean-kernel-tutorial
          cd /tmp/lean-kernel-arena/tutorial
          lake clean
          OUT=/tmp/lean-kernel-tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial

      - name: Global tutorial reclosure
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/g27
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/lean-kernel-tutorial')
          oracle=pathlib.Path('/tmp/g26-oracle/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]
          for expected_dir,expected_exit in [('good',0),('bad',1)]:
              for path in sorted((root/expected_dir).glob('*.ndjson')):
                  try: number=int(path.name.split('_',1)[0])
                  except ValueError: continue
                  def run(binary):
                      with path.open('rb') as f:
                          return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  a,b=run(oracle),run(candidate)
                  status=('earned_delta' if b==expected_exit and a!=expected_exit else 'mismatch') if a!=b else ('equal_correct' if b==expected_exit else 'equal_residual')
                  rows.append({'number':number,'input':f'{expected_dir}/{path.name}','expected_exit':expected_exit,'oracle_exit':a,'candidate_exit':b,'status':status})
          rows.sort(key=lambda r:r['number'])
          changes=[r for r in rows if r['oracle_exit']!=r['candidate_exit']]
          mismatches=[r for r in rows if r['status']=='mismatch']
          by={r['number']:r for r in rows}
          assert by[74]['oracle_exit']==2 and by[74]['candidate_exit']==0 and by[74]['status']=='earned_delta', by[74]
          for n in range(75,78):
              assert by[n]['candidate_exit']==by[n]['oracle_exit']==2, by[n]
          assert changes==[by[74]], changes
          assert mismatches==[], mismatches
          residuals=[r for r in rows if r['candidate_exit']!=r['expected_exit']]
          out={
              'schema':'metatron-kernel-g27-exists-recursor-qualification-v1',
              'arena_sha':os.environ['ARENA_SHA'],'oracle_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
              'changes':changes,'mismatches':mismatches,
              'counts':{
                  'earned_delta':sum(r['status']=='earned_delta' for r in rows),
                  'equal_correct':sum(r['status']=='equal_correct' for r in rows),
                  'equal_residual':sum(r['status']=='equal_residual' for r in rows),
                  'mismatch':len(mismatches),
              },
              'first_remaining_residual':residuals[0] if residuals else None
          }
          pathlib.Path('evidence-out/g27/tutorial-reclosure.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Replay committed corpus against G26
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess
          oracle=pathlib.Path('/tmp/g26-oracle/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()
          paths=sorted(pathlib.Path('tests/fixtures').glob('*.ndjson'))+sorted(pathlib.Path('evidence/residuals').glob('**/*.ndjson'))
          seen=set(); rows=[]
          for path in paths:
              rp=str(path)
              if rp in seen: continue
              seen.add(rp)
              def run(binary):
                  with path.open('rb') as f:
                      return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
              a,b=run(oracle),run(candidate)
              rows.append({'path':rp,'oracle':a,'candidate':b})
          diffs=[r for r in rows if r['oracle']!=r['candidate']]
          expected='evidence/residuals/G27-001/074_existsRec.ndjson'
          assert diffs==[{'path':expected,'oracle':2,'candidate':0}], diffs
          out={'schema':'metatron-kernel-g27-committed-differential-v1','count':len(rows),'diffs':diffs,'rows':rows}
          pathlib.Path('evidence-out/g27/committed-differential.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'count':len(rows),'diffs':diffs},sort_keys=True))
          PY

      - name: Upload G27 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lka-g27-exists-recursor-${{ github.sha }}
          path: metatron-kernel/evidence-out/g27
          if-no-files-found: error
