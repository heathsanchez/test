name: LKA G31 Constructor Iota Atlas v1

on:
  push:
    branches: [lka-g31-constructor-iota-v1]
    paths:
      - ".github/workflows/lka-g31-constructor-iota-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lka-g31-constructor-iota-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
      BASE_SHA: a9eede0277ef51ae6e32acd427aba9476282712a
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Verify zero semantic change from G30
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" -- metatron-kernel/src
          cd metatron-kernel
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release

      - name: Build exact G30 oracle
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/g30-oracle "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/g30-oracle/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Build pinned Arena tutorial
        run: |
          set -euo pipefail
          git init /tmp/lean-kernel-arena
          git -C /tmp/lean-kernel-arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/lean-kernel-arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/lean-kernel-arena checkout --detach FETCH_HEAD
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/lean-kernel-tutorial
          cd /tmp/lean-kernel-arena/tutorial
          lake clean
          OUT=/tmp/lean-kernel-tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial

      - name: Capture exact 078 residual atlas
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/g31
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          path=pathlib.Path('/tmp/lean-kernel-tutorial/good/078_boolRecEqns.ndjson')
          raw=path.read_bytes()
          oracle=pathlib.Path('/tmp/g30-oracle/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()
          def run(binary):
              with path.open('rb') as f:
                  return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
          a,b=run(oracle),run(candidate)
          assert a.returncode==2 and b.returncode==2
          rows=[json.loads(x) for x in raw.decode().splitlines() if x.strip()]
          out={'schema':'metatron-kernel-g31-constructor-iota-atlas-v1',
               'arena_sha':os.environ['ARENA_SHA'],'oracle_sha':os.environ['BASE_SHA'],
               'candidate_sha':os.environ['GITHUB_SHA'],'fixture':'good/078_boolRecEqns.ndjson',
               'expected_exit':0,'oracle_exit':a.returncode,'candidate_exit':b.returncode,
               'sha256':hashlib.sha256(raw).hexdigest(),'line_count':len(rows)}
          pathlib.Path('evidence-out/g31/078_boolRecEqns.ndjson').write_bytes(raw)
          pathlib.Path('evidence-out/g31/atlas.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('G31_ATLAS='+json.dumps(out,sort_keys=True))
          print('----- BEGIN 078_boolRecEqns.ndjson -----')
          print(raw.decode(),end='')
          print('----- END 078_boolRecEqns.ndjson -----')
          PY

      - name: Upload G31 atlas
        uses: actions/upload-artifact@v4
        with:
          name: lka-g31-constructor-iota-atlas-${{ github.sha }}
          path: metatron-kernel/evidence-out/g31
          if-no-files-found: error
