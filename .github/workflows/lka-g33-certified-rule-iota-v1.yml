name: LKA G33 Certified Rule Iota Qualification v1

on:
  push:
    branches: [lka-g33-certified-rule-iota-v1]
    paths:
      - ".github/workflows/lka-g33-certified-rule-iota-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lka-g33-certified-rule-iota-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
      BASE_SHA: 92c45edef35ad33dbb11c03bfb922d4a4f92aa63
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source and retained evidence
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          python -m unittest discover -s tests_py -p 'test_*.py' -v
          python scripts/check_ledger.py

      - name: Build exact G32 oracle
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/g32-oracle "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/g32-oracle/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Build pinned Arena tutorial
        run: |
          set -euo pipefail
          git init /tmp/lean-kernel-arena
          git -C /tmp/lean-kernel-arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/lean-kernel-arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/lean-kernel-arena checkout --detach FETCH_HEAD
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/lean-kernel-tutorial
          cd /tmp/lean-kernel-arena/tutorial
          lake clean
          OUT=/tmp/lean-kernel-tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial

      - name: Exact G33 residual and certified-rule falsifiers
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cmp evidence/residuals/G33-001/080_nRecReduction.ndjson /tmp/lean-kernel-tutorial/good/080_nRecReduction.ndjson
          mkdir -p evidence-out/g33
          sha256sum evidence/residuals/G33-001/080_nRecReduction.ndjson | tee evidence-out/g33/080.sha256
          python - <<'PY'
          import json,pathlib,subprocess,tempfile
          src=pathlib.Path('evidence/residuals/G33-001/080_nRecReduction.ndjson')
          oracle=pathlib.Path('/tmp/g32-oracle/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()

          def run(binary,path):
              with path.open('rb') as f:
                  return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode

          assert run(oracle,src)==2
          assert run(candidate,src)==0
          base=[json.loads(x) for x in src.read_text().splitlines() if x.strip()]

          def structural(label,mut):
              rows=json.loads(json.dumps(base))
              ind=next(r['inductive'] for r in rows if 'inductive' in r and any(
                  t.get('name')==25 for t in r['inductive']['types']))
              mut(ind)
              with tempfile.NamedTemporaryFile('w',suffix='.ndjson',delete=False) as f:
                  p=pathlib.Path(f.name)
                  for row in rows:
                      f.write(json.dumps(row,separators=(',',':'))+'\n')
              code=run(candidate,p); p.unlink()
              assert code != 0, (label,code)
              print(label,code)

          structural('k_true',lambda x:x['recs'][0].__setitem__('k',True))
          structural('wrong_succ_rule_fields',lambda x:x['recs'][0]['rules'][1].__setitem__('nfields',0))
          structural('wrong_succ_rule_ctor',lambda x:x['recs'][0]['rules'][1].__setitem__('ctor',x['ctors'][0]['name']))
          structural('wrong_num_minors',lambda x:x['recs'][0].__setitem__('numMinors',1))
          structural('wrong_succ_ctor_fields',lambda x:x['ctors'][1].__setitem__('numFields',0))

          # Corrupt the certified succ computation rule by pointing it at the
          # zero rule body. The declaration metadata still looks plausible,
          # but the existing Nat rule validator must refuse the semantic lie.
          structural(
              'wrong_succ_rule_rhs',
              lambda x:x['recs'][0]['rules'][1].__setitem__('rhs',x['recs'][0]['rules'][0]['rhs'])
          )
          PY

      - name: Global tutorial reclosure
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/lean-kernel-tutorial')
          oracle=pathlib.Path('/tmp/g32-oracle/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]
          for expected_dir,expected_exit in [('good',0),('bad',1)]:
              for path in sorted((root/expected_dir).glob('*.ndjson')):
                  try:
                      number=int(path.name.split('_',1)[0])
                  except ValueError:
                      continue
                  def run(binary):
                      with path.open('rb') as f:
                          return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  a,b=run(oracle),run(candidate)
                  status=('earned_delta' if b==expected_exit and a!=expected_exit else 'mismatch') if a!=b else ('equal_correct' if b==expected_exit else 'equal_residual')
                  rows.append({'number':number,'input':f'{expected_dir}/{path.name}','expected_exit':expected_exit,'oracle_exit':a,'candidate_exit':b,'status':status})
          rows.sort(key=lambda r:r['number'])
          changes=[r for r in rows if r['oracle_exit']!=r['candidate_exit']]
          mismatches=[r for r in rows if r['status']=='mismatch']
          by={r['number']:r for r in rows}
          assert by[80]['oracle_exit']==2 and by[80]['candidate_exit']==0 and by[80]['status']=='earned_delta', by[80]
          assert changes==[by[80]], changes
          assert mismatches==[], mismatches
          residuals=[r for r in rows if r['candidate_exit']!=r['expected_exit']]
          out={
              'schema':'metatron-kernel-g33-certified-rule-iota-qualification-v1',
              'arena_sha':os.environ['ARENA_SHA'],
              'oracle_sha':os.environ['BASE_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'changes':changes,
              'mismatches':mismatches,
              'counts':{
                  'earned_delta':sum(r['status']=='earned_delta' for r in rows),
                  'equal_correct':sum(r['status']=='equal_correct' for r in rows),
                  'equal_residual':sum(r['status']=='equal_residual' for r in rows),
                  'mismatch':len(mismatches),
              },
              'first_remaining_residual':residuals[0] if residuals else None
          }
          pathlib.Path('evidence-out/g33/tutorial-reclosure.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Replay committed corpus against G32
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess
          oracle=pathlib.Path('/tmp/g32-oracle/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()
          paths=sorted(pathlib.Path('tests/fixtures').glob('*.ndjson'))+sorted(pathlib.Path('evidence/residuals').glob('**/*.ndjson'))
          seen=set(); rows=[]
          for path in paths:
              rp=str(path)
              if rp in seen:
                  continue
              seen.add(rp)
              def run(binary):
                  with path.open('rb') as f:
                      return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
              a,b=run(oracle),run(candidate)
              rows.append({'path':rp,'oracle':a,'candidate':b})
          diffs=[r for r in rows if r['oracle']!=r['candidate']]
          expected='evidence/residuals/G33-001/080_nRecReduction.ndjson'
          assert diffs==[{'path':expected,'oracle':2,'candidate':0}], diffs
          out={'schema':'metatron-kernel-g33-committed-differential-v1','count':len(rows),'diffs':diffs,'rows':rows}
          pathlib.Path('evidence-out/g33/committed-differential.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'count':len(rows),'diffs':diffs},sort_keys=True))
          PY

      - name: Upload G33 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lka-g33-certified-rule-iota-${{ github.sha }}
          path: metatron-kernel/evidence-out/g33
          if-no-files-found: error
