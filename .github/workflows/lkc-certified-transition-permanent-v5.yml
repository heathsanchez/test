name: LKC Certified Transition Permanent v5

on:
  push:
    branches: [lkc-certified-transition-permanent-v5]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Generate certified-transition candidate
        run: |
          python3 -m py_compile experiments/lkc_permanent/full_v5.py
          python3 experiments/lkc_permanent/full_v5.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-permanent-inline-lean4331-d8ea5fc-v1
      - name: Setup exact Permanent environment and rules
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem permanent
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and axiom audit
        run: |
          cp experiments/lkc_permanent/generated/Submission_v5.lean bench/.cache/upstream/evaluation/problems/permanent/Submission_v5.lean
          cd bench/.cache/upstream/evaluation/problems/permanent
          printf '\n#print axioms Submission.impl_correct\n' >> Submission_v5.lean
          /usr/bin/time -v lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_v5.lean
      - name: Canonical acceptance
        run: |
          python3 bench/.cache/upstream/evaluation/run.py --problem permanent             --submission "$GITHUB_WORKSPACE/experiments/lkc_permanent/generated/Submission_v5.lean"             --timeout 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permanent-certified-transition-v5-evidence
          path: experiments/lkc_permanent/generated/

  instructions:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact candidate
        run: |
          python3 experiments/lkc_permanent/full_v5.py
          python3 -m py_compile experiments/lkc_permanent/tournament_v5.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-permanent-inline-lean4331-d8ea5fc-v1
      - name: Setup exact Permanent measurement environment
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem permanent
          python3 benchmark.py doctor --problem permanent --metric callgrind
      - name: Full fifteen-case resource probe
        run: python3 experiments/lkc_permanent/tournament_v5.py resource_probe
      - name: Cross-scale Callgrind tournament
        run: python3 experiments/lkc_permanent/tournament_v5.py instructions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permanent-certified-transition-v5-measurement
          path: permanent-v5-evidence/
