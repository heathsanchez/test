name: LKC Certified Transition SHA v8

on:
  push:
    branches: [lkc-certified-transition-sha-v8]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate direct16-generated48 candidate
        run: |
          python3 -m py_compile experiments/lkc_sha256/generated48_v8.py
          python3 experiments/lkc_sha256/generated48_v8.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-sha256-nozip-lean4331-d8ea5fc-v1
      - name: Setup exact SHA environment and rules
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem sha256
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and axiom audit
        run: |
          cp experiments/lkc_sha256/generated/Submission_v8.lean bench/.cache/upstream/evaluation/problems/sha256/Submission_v8.lean
          cd bench/.cache/upstream/evaluation/problems/sha256
          printf '\n#print axioms Submission.fastStepGenerated_correct\n#print axioms Submission.impl_correct\n' >> Submission_v8.lean
          timeout 120s /usr/bin/time -v lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_v8.lean
      - name: Canonical acceptance
        run: |
          python3 bench/.cache/upstream/evaluation/run.py --problem sha256             --submission "$GITHUB_WORKSPACE/experiments/lkc_sha256/generated/Submission_v8.lean"             --timeout 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sha256-certified-transition-v8-source
          path: experiments/lkc_sha256/generated/

  giant:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        n: [2199121876686, 2199573357346]
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact candidate
        run: python3 experiments/lkc_sha256/generated48_v8.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-sha256-nozip-lean4331-d8ea5fc-v1
      - name: Setup SHA environment
        working-directory: bench
        run: python3 benchmark.py setup --problem sha256
      - name: Giant target-construction diagnostic
        run: |
          cd bench
          python3 benchmark.py diagnostic             --problem sha256             --submission "$GITHUB_WORKSPACE/experiments/lkc_sha256/generated/Submission_v8.lean"             --metric wall-time             --repetitions 1             --timeout 900             --memory-mb 4096             --inputs "${{ matrix.n }}"             --output "$GITHUB_WORKSPACE/sha-v8-case-${{ matrix.n }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sha-v8-case-${{ matrix.n }}
          path: sha-v8-case-${{ matrix.n }}/
