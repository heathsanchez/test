name: LKC Fib BoolPair V7

on:
  push:
    branches: [lkc-fib-boolpair-v7]
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Generate V2 and V7
        run: |
          python3 experiments/lkc_fib/bitwise_v2.py
          python3 experiments/lkc_fib/boolpair_v7.py
          sha256sum experiments/lkc_fib/generated/Submission_v7_boolpair.lean
      - name: Checkout benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-fib-boolpair-v7-lean4331-d8ea5fc
      - name: Setup exact Fib environment
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem fib
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and axiom audit
        run: |
          cp experiments/lkc_fib/generated/Submission_v7_boolpair.lean bench/.cache/upstream/evaluation/problems/fib/Submission_v7.lean
          cd bench/.cache/upstream/evaluation/problems/fib
          printf '\n#print axioms Submission.impl_correct\n' >> Submission_v7.lean
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_v7.lean
      - name: Canonical acceptance
        run: |
          python3 bench/.cache/upstream/evaluation/run.py --problem fib             --submission "$GITHUB_WORKSPACE/experiments/lkc_fib/generated/Submission_v7_boolpair.lean" --timeout 900
      - name: Compare full public plan
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/fib-v7-screen"; mkdir -p "$root"
          for who in v2 v7; do
            if [ "$who" = v2 ]; then sub="$GITHUB_WORKSPACE/experiments/lkc_fib/generated/Submission_v2.lean"; else sub="$GITHUB_WORKSPACE/experiments/lkc_fib/generated/Submission_v7_boolpair.lean"; fi
            python3 bench/benchmark.py diagnostic --problem fib --submission "$sub"               --metric wall-time --repetitions 3 --timeout 600 --memory-mb 4096               --inputs 5000 10000 20000 40000 80000 150000 --output "$root/$who"
          done
      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("fib-v7-screen")
          a=json.loads((r/"v2/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"v7/diagnostic.json").read_text())["totals"]["candidate"]
          out={"v2":a,"v7":b,"ratio":b/a,"improvement_pct":100*(1-b/a)}
          (r/"verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fib-boolpair-v7-evidence
          path: |
            experiments/lkc_fib/generated/Submission_v7_boolpair.lean
            fib-v7-screen/
