name: LKC Fib V5 Function-recursion Screen

on:
  push:
    branches: [lkc-fib-funrec-v5]
    paths:
      - 'experiments/lkc_fib/funrec_v5_probe.py'
      - '.github/workflows/lkc-fib-funrec-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        run: |
          python3 experiments/lkc_fib/bitwise_v2.py
          python3 experiments/lkc_fib/funrec_v5_probe.py
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench && python3 benchmark.py setup --problem fib
      - name: Compare
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/fib-v5-screen"; mkdir -p "$root"
          inputs=(5000 10000 20000 40000 80000 150000)
          for who in v2 v5; do
            if [ "$who" = v2 ]; then
              sub="$GITHUB_WORKSPACE/experiments/lkc_fib/generated/Submission_v2.lean"
            else
              sub="$GITHUB_WORKSPACE/experiments/lkc_fib/generated/Submission_v5_funrec_probe.lean"
            fi
            python3 bench/benchmark.py diagnostic --problem fib --submission "$sub"               --metric wall-time --repetitions 3 --timeout 600 --memory-mb 4096               --inputs "${inputs[@]}" --output "$root/$who"
          done
      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("fib-v5-screen")
          a=json.loads((r/"v2/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"v5/diagnostic.json").read_text())["totals"]["candidate"]
          out={"v2":a,"v5_funrec":b,"ratio":b/a,"improvement_pct":100*(1-b/a),
               "consequence":"PROVE_FUNREC" if b<a else "REJECT"}
          (r/"verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fib-v5-funrec-screen
          path: fib-v5-screen/
