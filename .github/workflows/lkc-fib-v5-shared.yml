name: LKC Fibonacci V5 Shared Pair

on:
  push:
    branches: [lkc-fib-pair-state-v5]
    paths:
      - 'experiments/lkc_fib/shared_v5.py'
      - '.github/workflows/lkc-fib-v5-shared.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Generate V2 and V5
        run: |
          python3 experiments/lkc_fib/bitwise_v2.py
          python3 experiments/lkc_fib/shared_v5.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup exact Fib environment
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem fib
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and canonical acceptance
        run: |
          cp experiments/lkc_fib/generated/Submission_v5_shared.lean bench/.cache/upstream/evaluation/problems/fib/Submission_v5.lean
          cd bench/.cache/upstream/evaluation/problems/fib
          printf '\n#print axioms Submission.impl_correct\n' >> Submission_v5.lean
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_v5.lean
          cd "$GITHUB_WORKSPACE"
          python3 bench/.cache/upstream/evaluation/run.py --problem fib \
            --submission "$GITHUB_WORKSPACE/experiments/lkc_fib/generated/Submission_v5_shared.lean" --timeout 900
      - name: Wall screen V2 versus V5
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/fib-v5-screen"; mkdir -p "$root"
          inputs=(5000 10000 20000 40000 80000 150000)
          for who in v2 v5; do
            if [ "$who" = v2 ]; then sub="$GITHUB_WORKSPACE/experiments/lkc_fib/generated/Submission_v2.lean"; else sub="$GITHUB_WORKSPACE/experiments/lkc_fib/generated/Submission_v5_shared.lean"; fi
            python3 bench/benchmark.py diagnostic --problem fib --submission "$sub" \
              --metric wall-time --repetitions 3 --timeout 600 --memory-mb 4096 \
              --inputs "${inputs[@]}" --output "$root/$who"
          done
      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("fib-v5-screen")
          a=json.loads((r/"v2/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"v5/diagnostic.json").read_text())["totals"]["candidate"]
          out={"baseline_v2":a,"candidate_v5":b,"ratio":b/a,
               "improvement_pct":100*(1-b/a),
               "consequence":"PROMOTE_SCREEN" if b<a else "REJECT"}
          (r/"verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fib-v5-shared-evidence
          path: |
            fib-v5-screen/
            experiments/lkc_fib/generated/
