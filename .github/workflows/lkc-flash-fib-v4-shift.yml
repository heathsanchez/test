name: LKC Flash Fib V4 Shift Probe
on:
  push:
    branches: [lkc-flash2-fib-v4-shift]
    paths:
      - 'experiments/lkc_fib/flash_v4_shift_probe.py'
      - '.github/workflows/lkc-flash-fib-v4-shift.yml'
permissions:
  contents: read
env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 experiments/lkc_fib/flash_v4_shift_probe.py
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem fib
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fib-flash-v4
          cd bench
          for who in champion challenger; do
            if [ "$who" = champion ]; then sub="$GITHUB_WORKSPACE/experiments/lkc_fib/generated/Submission_v2.lean"; else sub="$GITHUB_WORKSPACE/experiments/lkc_fib/generated/Submission_v4_shift_probe.lean"; fi
            python3 benchmark.py diagnostic --problem fib --submission "$sub" --metric wall-time               --repetitions 3 --timeout 600 --memory-mb 4096               --inputs 5000 10000 20000 40000 80000 150000               --output "$GITHUB_WORKSPACE/fib-flash-v4/$who"
          done
      - name: Result
        shell: python
        run: |
          import json,pathlib
          r=pathlib.Path("fib-flash-v4")
          a=json.loads((r/"champion/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"challenger/diagnostic.json").read_text())["totals"]["candidate"]
          out={"champion":a,"challenger":b,"ratio":b/a,"improvement_pct":100*(1-b/a),
               "consequence":"PROMOTE_SCREEN" if b<a else "REFUTED_RESOURCE"}
          (r/"result.json").write_text(json.dumps(out,indent=2)+"\n"); print(json.dumps(out,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: lkc-flash-fib-v4-shift
          path: fib-flash-v4/
