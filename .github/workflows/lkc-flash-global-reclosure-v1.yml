name: LKC Flash Global Reclosure V1

on:
  push:
    branches: [lkc-flash-reclosure-v1]
    paths:
      - 'qckn_lkc/flash_reclosure_v1.json'
      - '.github/workflows/lkc-flash-global-reclosure-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  frontier:
    name: "${{ matrix.problem }} / ${{ matrix.branch }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - problem: ca-rule110
            branch: lkc-flash2-rule110-v64
            generate: python3 experiments/lkc_rule110/flash_v64_probe.py
            champion: experiments/lkc_rule110/generated/Submission_v60.lean
            challenger: experiments/lkc_rule110/generated/Submission_v64_probe.lean
            inputs: "12551916119 10588838281 18550129185 18418222002 34820276714 38244662432"
          - problem: fib
            branch: lkc-flash2-fib-v3
            generate: python3 experiments/lkc_fib/flash_v3.py
            champion: experiments/lkc_fib/generated/Submission_v2.lean
            challenger: experiments/lkc_fib/generated/Submission_v3.lean
            inputs: "5000 10000 20000 40000 80000 150000"
          - problem: mertens
            branch: lkc-flash2-mertens-v8
            generate: python3 experiments/lkc_mertens/structural_v6.py && python3 experiments/lkc_mertens/flash_v8_probe.py
            champion: experiments/lkc_mertens/generated/Submission_v6.lean
            challenger: experiments/lkc_mertens/generated/Submission_v8_probe.lean
            inputs: "25 50 80 150 300 500"
          - problem: partition
            branch: lkc-flash2-partition-v5
            generate: python3 experiments/lkc_partition/rowdp_v4.py && python3 experiments/lkc_partition/flash_v5_probe.py
            champion: experiments/lkc_partition/generated/Submission_v4.lean
            challenger: experiments/lkc_partition/generated/Submission_v5_probe.lean
            inputs: "14 18 22 26 32 36"
          - problem: primecount
            branch: lkc-flash2-primecount-v4
            generate: python3 experiments/lkc_primecount/structural_v3.py && python3 experiments/lkc_primecount/flash_v4_probe.py
            champion: experiments/lkc_primecount/generated/Submission_v3.lean
            challenger: experiments/lkc_primecount/generated/Submission_v4_probe.lean
            inputs: "50 100 150 300 600 1000"
          - problem: polydisc
            branch: lkc-flash2-polydisc-v4
            generate: python3 experiments/lkc_polydisc/flash_v4_probe.py
            champion: experiments/lkc_polydisc/generated/Submission_v3.lean
            challenger: experiments/lkc_polydisc/generated/Submission_v4_probe.lean
            inputs: "19337098 9225987 6476047012455 10487306645701 5042242704654352709 4530401864863699852"
          - problem: permanent
            branch: lkc-flash2-permanent-v6
            generate: python3 experiments/lkc_permanent/flash_v6_reverse_probe.py
            champion: experiments/lkc_permanent/generated/Submission_v5.lean
            challenger: experiments/lkc_permanent/generated/Submission_v6_reverse_probe.lean
            inputs: "28064292647 26230790088 53794586207 54079857374 71077100717 72835838140"
          - problem: sha256
            branch: lkc-flash2-sha-v24
            generate: python3 experiments/lkc_sha256/algebra_fullproof_v21.py && python3 experiments/lkc_sha256/algebra_v24_probe.py
            champion: experiments/lkc_sha256/generated/Submission_algebra_v21_proof.lean
            challenger: experiments/lkc_sha256/generated/Submission_algebra_v24_probe.lean
            inputs: "18860801433 17252521710 138725260120 140599404248 2199121876686 2199573357346"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ matrix.branch }}"
          fetch-depth: 1

      - name: Generate champion and challenger
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.generate }}
          test -f "${{ matrix.champion }}"
          test -f "${{ matrix.challenger }}"
          wc -c "${{ matrix.champion }}" "${{ matrix.challenger }}"

      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned diagnostic benchmark
        shell: bash
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"

      - name: Setup exact problem environment
        working-directory: bench
        shell: bash
        run: |
          python3 benchmark.py setup --problem "${{ matrix.problem }}"
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems

      - name: Paired wall diagnostic against frozen champion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "flash-evidence/${{ matrix.problem }}"
          read -ra INPUTS <<< "${{ matrix.inputs }}"
          cd bench
          python3 benchmark.py diagnostic             --problem "${{ matrix.problem }}"             --submission "$GITHUB_WORKSPACE/${{ matrix.champion }}"             --metric wall-time --repetitions 3 --timeout 900 --memory-mb 4096             --inputs "${INPUTS[@]}"             --output "$GITHUB_WORKSPACE/flash-evidence/${{ matrix.problem }}/champion"
          set +e
          python3 benchmark.py diagnostic             --problem "${{ matrix.problem }}"             --submission "$GITHUB_WORKSPACE/${{ matrix.challenger }}"             --metric wall-time --repetitions 3 --timeout 900 --memory-mb 4096             --inputs "${INPUTS[@]}"             --output "$GITHUB_WORKSPACE/flash-evidence/${{ matrix.problem }}/challenger"
          echo $? > "$GITHUB_WORKSPACE/flash-evidence/${{ matrix.problem }}/challenger-exit.txt"
          exit 0

      - name: Classify Flash consequence
        if: always()
        shell: python
        run: |
          import json, pathlib
          problem="${{ matrix.problem }}"
          root=pathlib.Path("flash-evidence")/problem
          def load(role):
              p=root/role/"diagnostic.json"
              return json.loads(p.read_text()) if p.exists() else None
          champ=load("champion"); chal=load("challenger")
          out={"problem":problem,"branch":"${{ matrix.branch }}",
               "champion":"${{ matrix.champion }}","challenger":"${{ matrix.challenger }}"}
          if champ and chal and champ.get("complete") and chal.get("complete"):
              c0=champ["totals"]["candidate"]; c1=chal["totals"]["candidate"]
              out.update(champion_total=c0,challenger_total=c1,ratio=c1/c0,
                         improvement_pct=100*(1-c1/c0),
                         consequence="PROMOTE_SCREEN" if c1<c0 else "REFUTED_RESOURCE")
          elif chal:
              out.update(consequence="UNKNOWN_OR_INCORRECT",
                         challenger_complete=chal.get("complete"),
                         challenger_runs=chal.get("runs"))
          else:
              out.update(consequence="UNKNOWN_SEARCH",reason="no challenger diagnostic")
          (root/"flash-result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))

      - name: Upload frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "flash-v1-${{ matrix.problem }}"
          path: "flash-evidence/${{ matrix.problem }}/"
          if-no-files-found: warn
