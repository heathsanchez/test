name: LKC Flash Packed Number Theory V1
on:
  push:
    branches:
      - lkc-flash2-primecount-v5-bitset
      - lkc-flash2-mertens-v9-bitset
    paths:
      - 'experiments/lkc_primecount/flash_v5_bitset_probe.py'
      - 'experiments/lkc_mertens/flash_v9_bitset_probe.py'
      - '.github/workflows/lkc-flash-packed-number-theory.yml'
permissions:
  contents: read
env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select frontier
        id: cfg
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *primecount* ]]; then
            echo "problem=primecount" >> "$GITHUB_OUTPUT"
            echo "generate=python3 experiments/lkc_primecount/structural_v3.py && python3 experiments/lkc_primecount/flash_v5_bitset_probe.py" >> "$GITHUB_OUTPUT"
            echo "champion=experiments/lkc_primecount/generated/Submission_v3.lean" >> "$GITHUB_OUTPUT"
            echo "challenger=experiments/lkc_primecount/generated/Submission_v5_bitset_probe.lean" >> "$GITHUB_OUTPUT"
            echo "inputs=50 100 150 300 600 1000" >> "$GITHUB_OUTPUT"
          else
            echo "problem=mertens" >> "$GITHUB_OUTPUT"
            echo "generate=python3 experiments/lkc_mertens/structural_v6.py && python3 experiments/lkc_mertens/flash_v9_bitset_probe.py" >> "$GITHUB_OUTPUT"
            echo "champion=experiments/lkc_mertens/generated/Submission_v6.lean" >> "$GITHUB_OUTPUT"
            echo "challenger=experiments/lkc_mertens/generated/Submission_v9_bitset_probe.lean" >> "$GITHUB_OUTPUT"
            echo "inputs=25 50 80 150 300 500" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate
        shell: bash
        run: eval "${{ steps.cfg.outputs.generate }}"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup
        shell: bash
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem "${{ steps.cfg.outputs.problem }}"
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/packed-nt"; mkdir -p "$root"
          read -ra INPUTS <<< "${{ steps.cfg.outputs.inputs }}"
          cd bench
          for who in champion challenger; do
            if [ "$who" = champion ]; then sub="$GITHUB_WORKSPACE/${{ steps.cfg.outputs.champion }}"; else sub="$GITHUB_WORKSPACE/${{ steps.cfg.outputs.challenger }}"; fi
            python3 benchmark.py diagnostic --problem "${{ steps.cfg.outputs.problem }}" --submission "$sub"               --metric wall-time --repetitions 3 --timeout 600 --memory-mb 4096               --inputs "${INPUTS[@]}" --output "$root/$who"
          done
      - name: Result
        shell: python
        run: |
          import json,pathlib
          r=pathlib.Path("packed-nt")
          a=json.loads((r/"champion/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"challenger/diagnostic.json").read_text())["totals"]["candidate"]
          out={"problem":"${{ steps.cfg.outputs.problem }}","champion":a,"challenger":b,
               "ratio":b/a,"improvement_pct":100*(1-b/a),
               "consequence":"PROMOTE_SCREEN" if b<a else "REFUTED_RESOURCE"}
          (r/"result.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: "flash-packed-${{ steps.cfg.outputs.problem }}"
          path: packed-nt/
