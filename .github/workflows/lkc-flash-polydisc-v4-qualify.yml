name: LKC Flash Polydisc V4 Qualification

on:
  push:
    branches: [lkc-flash2-polydisc-v4]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Generate proof-carrying V4
        run: |
          python3 -m py_compile experiments/lkc_polydisc/flash_v4_full.py
          python3 experiments/lkc_polydisc/flash_v4_full.py
          wc -c experiments/lkc_polydisc/generated/Submission_v4.lean
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup exact environment and rules
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem polydisc
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and axiom audit
        run: |
          cp experiments/lkc_polydisc/generated/Submission_v4.lean bench/.cache/upstream/evaluation/problems/polydisc/Submission_flash_v4.lean
          printf '\n#print axioms Submission.impl_correct\n' >> bench/.cache/upstream/evaluation/problems/polydisc/Submission_flash_v4.lean
          cd bench/.cache/upstream/evaluation/problems/polydisc
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_flash_v4.lean
      - name: Canonical acceptance
        working-directory: bench/.cache/upstream
        run: |
          python3 evaluation/run.py --problem polydisc --submission "$GITHUB_WORKSPACE/experiments/lkc_polydisc/generated/Submission_v4.lean" --timeout 180
