name: LKC Mertens Structural v6-v7

on:
  push:
    branches: [lkc-mertens-structural-v6]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Generate protected baseline and structural candidates
        run: |
          python3 -m py_compile             experiments/lkc_mertens/singlepass_v1.py             experiments/lkc_mertens/representation_v2.py             experiments/lkc_mertens/structural_v6.py             experiments/lkc_mertens/tournament_v6.py
          python3 experiments/lkc_mertens/structural_v6.py

      - name: Checkout pinned benchmark read-only
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-mertens-structural-lean4331-d8ea5fc-deps-v1

      - name: Setup exact Mertens environment and current rules
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem mertens
          python3 benchmark.py doctor --problem mertens --metric wall-time
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code             eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" --             evaluation problems
          git -C .cache/upstream show "$RULES_COMMIT:rules/overview.md" |             grep -A 8 'Precomputed answer'

      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-mertens-structural-lean4331-d8ea5fc-deps-v1

      - name: Universal proofs, axiom audits, and false controls
        run: python3 experiments/lkc_mertens/tournament_v6.py prove

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mertens-v6-proof-evidence
          path: |
            mertens-v6-evidence/
            experiments/lkc_mertens/generated/

      - name: Same-host wall screen, six cases and three repetitions
        run: python3 experiments/lkc_mertens/tournament_v6.py screen

      - name: Canonical acceptance of selected structural challenger
        run: python3 experiments/lkc_mertens/tournament_v6.py qualify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mertens-v6-screen-evidence
          path: |
            mertens-v6-evidence/
            experiments/lkc_mertens/generated/

  instructions:
    needs: develop
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate exact candidate bytes
        run: python3 experiments/lkc_mertens/structural_v6.py

      - name: Checkout pinned benchmark read-only
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"

      - name: Install measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-mertens-structural-lean4331-d8ea5fc-deps-v1

      - name: Verify restored benchmark environment
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem mertens
          python3 benchmark.py doctor --problem mertens --metric callgrind

      - uses: actions/download-artifact@v4
        with:
          name: mertens-v6-screen-evidence
          path: mertens-v6-evidence

      - name: Decisive V1 versus selected structural challenger
        run: python3 experiments/lkc_mertens/tournament_v6.py instructions

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mertens-v6-instruction-evidence
          path: |
            mertens-v6-evidence/
            experiments/lkc_mertens/generated/
