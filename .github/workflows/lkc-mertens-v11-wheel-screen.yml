name: LKC Mertens V11 Wheel Screen

on:
  push:
    branches: [lkc-mertens-wheel-v11]
    paths:
      - 'experiments/lkc_mertens/wheel_v11_probe.py'
      - '.github/workflows/lkc-mertens-v11-wheel-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Generate V6 and V11
        run: |
          python3 experiments/lkc_mertens/structural_v6.py
          python3 experiments/lkc_mertens/wheel_v11_probe.py
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem mertens
      - name: Compile probe
        run: |
          cp experiments/lkc_mertens/generated/Submission_v11_wheel_probe.lean bench/.cache/upstream/evaluation/problems/mertens/V11.lean
          cd bench/.cache/upstream/evaluation/problems/mertens
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 V11.lean
      - name: Compare
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/mertens-v11-screen"; mkdir -p "$root"
          inputs=(25 50 80 150 300 500)
          for who in v6 v11; do
            if [ "$who" = v6 ]; then
              sub="$GITHUB_WORKSPACE/experiments/lkc_mertens/generated/Submission_v6.lean"
            else
              sub="$GITHUB_WORKSPACE/experiments/lkc_mertens/generated/Submission_v11_wheel_probe.lean"
            fi
            python3 bench/benchmark.py diagnostic --problem mertens --submission "$sub" \
              --metric wall-time --repetitions 3 --timeout 600 --memory-mb 4096 \
              --inputs "${inputs[@]}" --output "$root/$who"
          done
      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("mertens-v11-screen")
          a=json.loads((r/"v6/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"v11/diagnostic.json").read_text())["totals"]["candidate"]
          out={"baseline_v6":a,"candidate_v11":b,"ratio":b/a,
               "improvement_pct":100*(1-b/a),
               "consequence":"PROVE_WHEEL" if b<a else "REJECT"}
          print(json.dumps(out,indent=2))
          (r/"verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mertens-v11-wheel-screen
          path: mertens-v11-screen/
