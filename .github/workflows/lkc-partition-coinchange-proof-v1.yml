name: SAIR Partition universal coin-change recurrence Lean proof V1

on:
  push:
    branches: [lkc-partition-coinchange-proof-v1-20261012]
    paths:
      - '.github/workflows/lkc-partition-coinchange-proof-v1.yml'
      - 'experiments/lkc_partition/PartAuxCoinchangeV1.lean'
  workflow_dispatch:

permissions:
  contents: read

env:
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.1 via pinned evaluator
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem partition
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Derive universal additive coin-change recurrence and inspect axioms
        shell: bash
        run: |
          set -euo pipefail
          cd bench/.cache/upstream/evaluation/problems/partition
          cp "$GITHUB_WORKSPACE/experiments/lkc_partition/PartAuxCoinchangeV1.lean" .
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=100000 -DmaxHeartbeats=0 PartAuxCoinchangeV1.lean | tee "$GITHUB_WORKSPACE/partaux-coinchange-result.log"
      - name: Preserve hash and result
        shell: bash
        if: always()
        run: |
          mkdir -p partaux-coinchange-evidence
          sha256sum experiments/lkc_partition/PartAuxCoinchangeV1.lean > partaux-coinchange-evidence/source.sha256
          cp partaux-coinchange-result.log partaux-coinchange-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lkc-partition-coinchange-v1
          path: partaux-coinchange-evidence/
          if-no-files-found: error
