name: SAIR Partition direct paired instructions V1

on:
  push:
    branches: [lkc-partition-direct-ir-v1-20261012]
    paths:
      - '.github/workflows/lkc-partition-direct-ir-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  direct-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Independent finite tests and source pin
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/lkc_partition/packed_phase_v1.py --self-test
          python3 experiments/lkc_partition/euler_sparse_quotient_v1.py
          python3 experiments/lkc_partition/threecompiled_v13.py
          echo 'bcb6325b9d0ca5c7259b0de76d903ba5cb20e05fdb60938b5201745d00491085  experiments/lkc_partition/generated/Submission_v13.lean' | sha256sum -c -
          mkdir -p quick-ir-phase-v1
          sha256sum experiments/lkc_partition/generated/Submission_v13.lean experiments/lkc_partition/generated/Submission_packed_{division,euler_sparse}_probe.lean > quick-ir-phase-v1/source-hashes.txt
      - name: Install Valgrind and Lean
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y valgrind
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned independent kernel replay tools
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem partition
          python3 benchmark.py doctor --problem partition --metric callgrind
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Real kernel replay under Callgrind with exactly qualified V13 control
        shell: bash
        run: |
          set +e
          python3 experiments/lkc_partition/direct_ir_with_v13_baseline.py --arm packed_division --repetitions 1 --inputs 14 22 32 36
          printf 'division_exit=%s\n' "$?" | tee quick-ir-phase-v1/division-exit.txt
          python3 experiments/lkc_partition/direct_ir_with_v13_baseline.py --arm packed_euler_sparse --repetitions 1 --inputs 14 22 32 36
          printf 'euler_exit=%s\n' "$?" | tee quick-ir-phase-v1/euler-exit.txt
          exit 0
      - name: Bounded instruction-economics verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("quick-ir-phase-v1")
          arms={}
          for arm in ("packed_division","packed_euler_sparse"):
              file=root/arm/"diagnostic.json"
              rec={"complete":False,"sum_baseline":None,"sum_candidate":None}
              if file.exists():
                  data=json.loads(file.read_text())
                  rec.update({"complete":data["complete"],
                              "sum_baseline":data["totals"]["baseline"],
                              "sum_candidate":data["totals"]["candidate"],
                              "per_case":[{"n":r["n"],"status":r["status"],"median":r.get("median")}
                                for rr in data["runs"] if rr["role"]=="candidate" for r in rr["cases"]]})
                  if rec["complete"] and rec["sum_candidate"]:
                      rec["candidate_ir_ratio"]=float(rec["sum_candidate"])/float(rec["sum_baseline"])
              arms[arm]=rec
          eligible=[(v["candidate_ir_ratio"],k) for k,v in arms.items() if v.get("candidate_ir_ratio") is not None]
          eligible.sort()
          out={"arms":arms,"best":eligible[0] if eligible else None,
               "status":"PHASE_INSTRUCTION_WIN" if eligible and eligible[0][0]<0.1 else "NO_ORDER_MAGNITUDE_VERDICT",
               "universal_Lean_proof":False,"official_PMU":False,"formal_submission":False,
               "method":"Only qualified V13 source replaces bundled example baseline; independent expected-value oracle and timer unchanged"}
          (root/"decision.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lkc-direct-paired-callgrind-v1
          path: quick-ir-phase-v1/
          if-no-files-found: error
