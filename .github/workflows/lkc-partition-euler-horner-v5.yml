name: SAIR Partition factored Euler Horner V5 instruction tournament

on:
  push:
    branches: [lkc-partition-euler-horner-v5-20261012]
    paths:
      - '.github/workflows/lkc-partition-euler-horner-v5.yml'
      - 'experiments/lkc_partition/euler_horner_v5.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  width-tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Exact independent finite test and source hash freeze
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/lkc_partition/euler_horner_v5.py experiments/lkc_partition/euler_horner_ir_v5.py
          python3 experiments/lkc_partition/euler_sparse_quotient_v1.py
          python3 experiments/lkc_partition/euler_horner_v5.py
          mkdir -p horner-ir-v5
          cp experiments/lkc_partition/generated/packed_euler_sparse_finite.json horner-ir-v5/
          cp experiments/lkc_partition/generated/euler_horner_v5_finite.json horner-ir-v5/
          sha256sum experiments/lkc_partition/generated/Submission_euler_degree_degree_probe.lean \
                    experiments/lkc_partition/generated/Submission_euler_horner_*_probe.lean > horner-ir-v5/verified-sources.sha256
      - name: Install exact Lean kernel and Valgrind
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y valgrind
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Set up source-pinned SAIR judge
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem partition
          python3 benchmark.py doctor --problem partition --metric callgrind
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Pair each variant with identical trusted Euler V1 source
        shell: bash
        run: |
          set +e
          for arm in horner_inline horner_helper flat flat_helper; do
            echo "WIDTH_ARM_BEGIN $arm"
            python3 experiments/lkc_partition/euler_horner_ir_v5.py \
              --arm "$arm" --repetitions 1 --inputs 14 22 36
            status=$?
            printf '%s\n' "$status" > "horner-ir-v5/$arm.exit"
            echo "WIDTH_ARM_EXIT $arm $status"
          done
          exit 0
      - name: Qualify degree-factored Horner arithmetic under independent Callgrind
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("horner-ir-v5")
          arms={}
          for arm in ("horner_inline","horner_helper","flat","flat_helper"):
              p=root/(arm+"-attestation.json")
              arms[arm]=json.loads(p.read_text()) if p.exists() else {"complete":False}
          winners=sorted((v["ratio"],k) for k,v in arms.items() if v.get("complete") and v.get("ratio") is not None)
          report={
              "status":"WARRANTED_LOCAL_IR" if winners else "UNKNOWN_INFRA_OR_UNQUALIFIED",
              "baseline":"degree Euler V4","baseline_n_width":"n+3",
              "cases":[14,22,36],"arms":arms,
              "best_ratio":winners[0][0] if winners else None,
              "best_candidate":winners[0][1] if winners else None,
              "promotion":"CANDIDATE_SPEED_ONLY" if winners and winners[0][0]<0.90 else ("UNKNOWN_NO_QUALIFIED_SOURCE" if not winners else "REJECTED_AS_INSUFFICIENT"),
              "universal_Lean_proof":False,
              "official_SAIR_submission":False}
          (root/"decision.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lkc-euler-horner-v5-causal-qualification
          path: horner-ir-v5/
          if-no-files-found: error
