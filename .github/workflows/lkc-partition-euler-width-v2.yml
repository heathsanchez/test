name: SAIR Partition Euler width V2 paired instructions

on:
  push:
    branches: [lkc-partition-width-quotient-v2-20261012]
    paths:
      - '.github/workflows/lkc-partition-euler-width-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  width-tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Exact independent finite test and source hash freeze
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/lkc_partition/euler_width_v2.py experiments/lkc_partition/euler_width_ir_v2.py
          python3 experiments/lkc_partition/euler_sparse_quotient_v1.py
          python3 experiments/lkc_partition/euler_width_v2.py
          mkdir -p width-ir-v2
          cp experiments/lkc_partition/generated/packed_euler_sparse_finite.json width-ir-v2/
          cp experiments/lkc_partition/generated/euler_width_v2_finite.json width-ir-v2/
          sha256sum experiments/lkc_partition/generated/Submission_packed_euler_sparse_probe.lean \
                    experiments/lkc_partition/generated/Submission_euler_width_*_probe.lean > width-ir-v2/verified-sources.sha256
      - name: Install exact Lean kernel and Valgrind
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y valgrind
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Set up source-pinned SAIR judge
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem partition
          python3 benchmark.py doctor --problem partition --metric callgrind
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Pair each variant with identical trusted Euler V1 source
        shell: bash
        run: |
          set +e
          for arm in half quarter minimum fused; do
            echo "WIDTH_ARM_BEGIN $arm"
            python3 experiments/lkc_partition/euler_width_ir_v2.py \
              --arm "$arm" --repetitions 1 --inputs 14 22 36
            status=$?
            printf '%s\n' "$status" > "width-ir-v2/$arm.exit"
            echo "WIDTH_ARM_EXIT $arm $status"
          done
          exit 0
      - name: Candidate-specific final instruction verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("width-ir-v2")
          arms={}
          for arm in ("half","quarter","minimum","fused"):
              p=root/(arm+"-attestation.json")
              arms[arm]=json.loads(p.read_text()) if p.exists() else {"complete":False}
          winners=sorted((v["ratio"],k) for k,v in arms.items() if v.get("complete") and v.get("ratio") is not None)
          report={
              "status":"WARRANTED_LOCAL_IR" if winners else "UNKNOWN_INFRA_OR_UNQUALIFIED",
              "baseline":"sparse Euler V1","baseline_n_width":"n+3",
              "cases":[14,22,36],"arms":arms,
              "best_ratio":winners[0][0] if winners else None,
              "best_candidate":winners[0][1] if winners else None,
              "promotion":"CANDIDATE_SPEED_ONLY" if winners and winners[0][0]<0.90 else "REJECTED_AS_INSUFFICIENT",
              "universal_Lean_proof":False,
              "official_SAIR_submission":False}
          (root/"decision.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lkc-euler-width-v2-causal-qualification
          path: width-ir-v2/
          if-no-files-found: error
