name: SAIR Partition Hensel modular inverse V1 tournament

on:
  push:
    branches: [lkc-partition-euler-hensel-v1-20261012]
    paths:
      - '.github/workflows/lkc-partition-hensel-v1.yml'
      - 'experiments/lkc_partition/euler_hensel_v1.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  hensel:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: 241 exact independent arithmetic controls, source-generate
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/lkc_partition/euler_hensel_v1.py experiments/lkc_partition/euler_hensel_ir_v1.py
          python3 experiments/lkc_partition/euler_sparse_quotient_v1.py
          python3 experiments/lkc_partition/euler_hensel_v1.py
          mkdir -p hensel-ir-v1
          cp experiments/lkc_partition/generated/euler_hensel_v1_finite.json hensel-ir-v1/
          sha256sum experiments/lkc_partition/generated/Submission_packed_euler_sparse_probe.lean \
                    experiments/lkc_partition/generated/Submission_euler_hensel_*_probe.lean > hensel-ir-v1/verified-sources.sha256
      - name: Install Lean and Valgrind
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y valgrind
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned independent evaluator
        run: |
          set -euo pipefail
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem partition
          python3 benchmark.py doctor --problem partition --metric callgrind
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Compare modular inverse directly to Euler quotient
        run: |
          set +e
          for arm in standard narrow; do
            echo "HENSEL_BEGIN $arm"
            python3 experiments/lkc_partition/euler_hensel_ir_v1.py --arm "$arm" --inputs 14 22 36
            code="$?"
            echo "$code" > "hensel-ir-v1/$arm.exit"
            echo "HENSEL_EXIT $arm $code"
          done
          exit 0
      - name: Reject or promote bounded instruction hypothesis
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('hensel-ir-v1')
          arms={}
          for arm in ('standard','narrow'):
              file=root/(arm+'-attestation.json')
              arms[arm]=json.loads(file.read_text()) if file.exists() else {'complete':False}
          ranked=sorted((v['ratio'],a) for a,v in arms.items() if v.get('complete') and v.get('ratio') is not None)
          best=ranked[0] if ranked else None
          result={'status':'WARRANTED_BOUNDED_COMPARISON' if best else 'UNKNOWN_MEASUREMENT',
                  'best_arm':best[1] if best else None,'best_ratio':best[0] if best else None,
                  'decision':'CANDIDATE_FOR_PROOF' if best and best[0]<0.7 else 'REJECTED_AS_NOT_COMPETITIVE_OR_UNKNOWN',
                  'arms':arms,'universal_Lean_proof':False,'official_SAIR_score':False,'submission':False}
          (root/'decision.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lkc-partition-hensel-inverse-v1
          path: hensel-ir-v1/
          if-no-files-found: error
