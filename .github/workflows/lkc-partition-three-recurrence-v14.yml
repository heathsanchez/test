name: LKC Partition V14 Three-Recurrence

on:
  push:
    branches: [lkc-partition-three-recurrence-v14]
    paths:
      - 'experiments/lkc_partition/three_recurrence_v14.py'
      - '.github/workflows/lkc-partition-three-recurrence-v14.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  qualify-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Generate V13 and proved V14
        run: |
          python3 experiments/lkc_partition/threecompiled_v13.py
          python3 experiments/lkc_partition/three_recurrence_v14.py
          sha256sum experiments/lkc_partition/generated/Submission_v14_three_recurrence.lean
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem partition
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and canonical acceptance
        run: |
          cp experiments/lkc_partition/generated/Submission_v14_three_recurrence.lean bench/.cache/upstream/evaluation/problems/partition/Submission_v14.lean
          cd bench/.cache/upstream/evaluation/problems/partition
          printf '\n#print axioms Submission.impl_correct\n' >> Submission_v14.lean
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_v14.lean
          cd "$GITHUB_WORKSPACE"
          python3 bench/.cache/upstream/evaluation/run.py --problem partition \
            --submission "$GITHUB_WORKSPACE/experiments/lkc_partition/generated/Submission_v14_three_recurrence.lean" \
            --timeout 900
      - name: Compare exact scored shapes
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/partition-v14-recurrence-screen"; mkdir -p "$root"
          inputs=(14 22 32)
          for who in v13 v14; do
            if [ "$who" = v13 ]; then
              sub="$GITHUB_WORKSPACE/experiments/lkc_partition/generated/Submission_v13.lean"
            else
              sub="$GITHUB_WORKSPACE/experiments/lkc_partition/generated/Submission_v14_three_recurrence.lean"
            fi
            python3 bench/benchmark.py diagnostic --problem partition --submission "$sub" \
              --metric wall-time --repetitions 3 --timeout 900 --memory-mb 4096 \
              --inputs "${inputs[@]}" --output "$root/$who"
          done
      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("partition-v14-recurrence-screen")
          a=json.loads((r/"v13/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"v14/diagnostic.json").read_text())["totals"]["candidate"]
          out={"baseline_v13":a,"candidate_v14":b,"ratio":b/a,
               "improvement_pct":100*(1-b/a),
               "consequence":"PROMOTE" if b<a else "REJECT"}
          print(json.dumps(out,indent=2))
          (r/"verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partition-v14-recurrence-evidence
          path: partition-v14-recurrence-screen/
