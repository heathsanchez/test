name: SAIR Partition V13 guarded formal promotion

on:
  push:
    branches: [lkc-partition-v13-guarded-formal-20261012]
    paths: ['.github/workflows/lkc-partition-v13-guarded-formal.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sair-partition-v13-guarded-formal
  cancel-in-progress: false

env:
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}

jobs:
  certify-and-submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate exact official incumbent and V13 challenger
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/lkc_partition/rowdp_v4.py
          python3 experiments/lkc_partition/threecompiled_v13.py
          echo '2a191971ed624b45342a8bdf325887b5c6553fe5ce67f97c719bb239cd2a08b0  experiments/lkc_partition/generated/Submission_v4.lean' | sha256sum -c -
          echo 'bcb6325b9d0ca5c7259b0de76d903ba5cb20e05fdb60938b5201745d00491085  experiments/lkc_partition/generated/Submission_v13.lean' | sha256sum -c -
          test "$(wc -c < experiments/lkc_partition/generated/Submission_v13.lean)" -le 1048576
          mkdir -p lkc-partition-v13-guarded
          sha256sum experiments/lkc_partition/generated/Submission_v{4,13}.lean | tee lkc-partition-v13-guarded/sources.sha256
      - name: Checkout pinned official benchmark
        shell: bash
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install Lean
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Set up exact official Partition and compare frozen rules
        shell: bash
        working-directory: bench
        run: |
          set -euo pipefail
          python3 benchmark.py setup --problem partition
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Kernel universal proof and axiom qualification
        shell: bash
        run: |
          set -euo pipefail
          cp experiments/lkc_partition/generated/Submission_v13.lean bench/.cache/upstream/evaluation/problems/partition/Submission_v13.lean
          cd bench/.cache/upstream/evaluation/problems/partition
          printf '\n#print axioms Submission.impl_correct\n' >> Submission_v13.lean
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_v13.lean
      - name: Canonical official acceptance on full public plan
        shell: bash
        run: |
          set -euo pipefail
          python3 bench/.cache/upstream/evaluation/run.py --problem partition \
            --submission "$GITHUB_WORKSPACE/experiments/lkc_partition/generated/Submission_v13.lean" --timeout 900
      - name: Same-input paired cost screen — no formal submission yet
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/lkc-partition-v13-guarded"
          for who in v4 v13; do
            if [ "$who" = v4 ]; then
              sub="$GITHUB_WORKSPACE/experiments/lkc_partition/generated/Submission_v4.lean"
            else
              sub="$GITHUB_WORKSPACE/experiments/lkc_partition/generated/Submission_v13.lean"
            fi
            python3 bench/benchmark.py diagnostic --problem partition --submission "$sub" \
              --metric wall-time --repetitions 3 --timeout 900 --memory-mb 4096 \
              --inputs 14 22 32 36 --output "$root/$who"
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path("lkc-partition-v13-guarded")
          v4=json.loads((root/"v4/diagnostic.json").read_text())
          v13=json.loads((root/"v13/diagnostic.json").read_text())
          a=float(v4["totals"]["candidate"])
          b=float(v13["totals"]["candidate"])
          assert a>0 and b>0, "Missing positive measured totals"
          ratio=b/a
          verdict={"metric":"wall-time development proxy","candidate":"partition-v13","baseline":"frozen official V4",
                   "inputs":[14,22,32,36],"source_same_as_proof":True,
                   "baseline_total":a,"candidate_total":b,"ratio":ratio,
                   "improvement_pct":100*(1-ratio),"promote":ratio<0.60,
                   "important":"Local wall-time is not hosted retired-instruction rank."}
          (root/"gate.json").write_text(json.dumps(verdict,indent=2)+"\n")
          print(json.dumps(verdict,indent=2))
          if not verdict["promote"]:
              raise SystemExit("No material paired gain; old formal submission retained")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("LKC_VERIFIED_COST_GATE=PASS\n")
          PY
      - name: Formal SAIR submission only after all protected gates
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/lkc_partition/submit_v13_guard.py
          cp lkc-partition-v13-release-receipt.json lkc-partition-v13-guarded/formal-submission-receipt.json
      - name: Archive source-verified evidence and API receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sair-partition-v13-guarded-promotion
          path: lkc-partition-v13-guarded/
          if-no-files-found: warn
