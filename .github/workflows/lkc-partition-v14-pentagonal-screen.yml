name: LKC Partition V14 Pentagonal Screen

on:
  push:
    branches: [lkc-partition-pentagonal-v14]
    paths:
      - 'experiments/lkc_partition/pentagonal_v14_probe.py'
      - '.github/workflows/lkc-partition-v14-pentagonal-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Generate V13 and V14
        run: |
          python3 experiments/lkc_partition/threecompiled_v13.py
          python3 experiments/lkc_partition/pentagonal_v14_probe.py
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem partition
      - name: Compile probe
        run: |
          cp experiments/lkc_partition/generated/Submission_v14_pentagonal_probe.lean bench/.cache/upstream/evaluation/problems/partition/V14.lean
          cd bench/.cache/upstream/evaluation/problems/partition
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 V14.lean
      - name: Compare practice cohort
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/partition-v14-screen"; mkdir -p "$root"
          inputs=(14 22 32)
          for who in v13 v14; do
            if [ "$who" = v13 ]; then
              sub="$GITHUB_WORKSPACE/experiments/lkc_partition/generated/Submission_v13.lean"
            else
              sub="$GITHUB_WORKSPACE/experiments/lkc_partition/generated/Submission_v14_pentagonal_probe.lean"
            fi
            python3 bench/benchmark.py diagnostic --problem partition --submission "$sub" \
              --metric wall-time --repetitions 5 --timeout 600 --memory-mb 4096 \
              --inputs "${inputs[@]}" --output "$root/$who"
          done
      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("partition-v14-screen")
          a=json.loads((r/"v13/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"v14/diagnostic.json").read_text())["totals"]["candidate"]
          out={"baseline_v13":a,"candidate_v14":b,"ratio":b/a,
               "improvement_pct":100*(1-b/a),
               "consequence":"PROVE_PENTAGONAL" if b<a else "REJECT"}
          print(json.dumps(out,indent=2))
          (r/"verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partition-v14-pentagonal-screen
          path: partition-v14-screen/
