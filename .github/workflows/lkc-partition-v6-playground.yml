name: Partition V6 SAIR Playground PMU

on:
  push:
    branches: [lkc-partition-stream-v6]
    paths:
      - '.github/workflows/lkc-partition-v6-playground.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SAIR_API_KEY: ${{ secrets.SAIR_API_KEY }}
      BASE: https://api.sair.foundation/api/public/v1/competitions/lean-kernel-challenge
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact V6 source
        run: |
          set -euo pipefail
          python3 experiments/lkc_partition/stream_v6.py
          sha256sum experiments/lkc_partition/generated/Submission_v6.lean | tee v6.sha256
      - name: Save V6 solution and run PMU playground
        run: |
          set -euo pipefail
          jq -n             --arg problemId "partition"             --arg name "partition-stream-v6"             --rawfile source experiments/lkc_partition/generated/Submission_v6.lean             '{problemId:$problemId,name:$name,files:{"Submission.lean":$source}}'             > save-request.json
          curl -fsS -X POST "$BASE/playground/solutions"             -H "Authorization: Bearer $SAIR_API_KEY"             -H "Content-Type: application/json"             -H "Accept: application/json"             -H "User-Agent: curl/8.5.0"             --data-binary @save-request.json > save-response.json
          cat save-response.json
          solution_id=$(jq -er '.data.solutionId' save-response.json)
          revision=$(jq -er '.data.revision' save-response.json)
          idem=$(python3 - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )
          jq -n             --arg solutionId "$solution_id"             --argjson revision "$revision"             --arg idempotencyKey "$idem"             '{solutionId:$solutionId,revision:$revision,idempotencyKey:$idempotencyKey}'             > run-request.json
          curl -fsS -X POST "$BASE/playground/runs"             -H "Authorization: Bearer $SAIR_API_KEY"             -H "Content-Type: application/json"             -H "Accept: application/json"             -H "User-Agent: curl/8.5.0"             --data-binary @run-request.json > run-response.json
          cat run-response.json
          run_id=$(jq -er '.data.runId' run-response.json)
          echo "$run_id" > run-id.txt
          for i in $(seq 1 120); do
            curl -fsS "$BASE/playground/runs/$run_id"               -H "Authorization: Bearer $SAIR_API_KEY"               -H "Accept: application/json"               -H "User-Agent: curl/8.5.0" > run-status.json
            status=$(jq -r '.data.status' run-status.json)
            echo "poll=$i status=$status"
            if [ "$status" = "done" ] || [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then break; fi
            sleep 5
          done
          jq -e '.data.status == "done" and .data.verdict == "accepted"' run-status.json >/dev/null
          jq '{
            runId:.data.runId,
            solutionId:.data.solutionId,
            solutionRevision:.data.solutionRevision,
            problemId:.data.problemId,
            verdict:.data.verdict,
            finalConclusion:.data.finalConclusion,
            metrics:.data.metrics
          }' run-status.json > partition-v6-pmu.json
          cat partition-v6-pmu.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partition-v6-sair-pmu
          path: |
            v6.sha256
            save-response.json
            run-response.json
            run-id.txt
            run-status.json
            partition-v6-pmu.json
