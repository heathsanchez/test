name: LKC Permanent Inline v1

on:
  push:
    branches: [lkc-permanent-inline-v1]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Generate candidates
        run: |
          python3 -m py_compile             experiments/lkc_permanent/inline_v1.py             experiments/lkc_permanent/tournament_v1.py
          python3 experiments/lkc_permanent/inline_v1.py

      - name: Checkout pinned benchmark read-only
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-permanent-inline-lean4331-d8ea5fc-v1

      - name: Setup exact Permanent environment and current rules
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem permanent
          python3 benchmark.py doctor --problem permanent --metric wall-time
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code             eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" --             evaluation problems

      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-permanent-inline-lean4331-d8ea5fc-v1

      - name: Universal proofs, axiom audits, false controls
        run: python3 experiments/lkc_permanent/tournament_v1.py prove

      - name: Same-host wall screen
        run: python3 experiments/lkc_permanent/tournament_v1.py screen

      - name: Canonical acceptance
        run: python3 experiments/lkc_permanent/tournament_v1.py qualify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permanent-v1-verification-evidence
          path: |
            permanent-v1-evidence/
            experiments/lkc_permanent/generated/

  instructions:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate exact candidate bytes
        run: python3 experiments/lkc_permanent/inline_v1.py

      - name: Checkout pinned benchmark read-only
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"

      - name: Install measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-permanent-inline-lean4331-d8ea5fc-v1

      - name: Verify restored benchmark environment
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem permanent
          python3 benchmark.py doctor --problem permanent --metric callgrind

      - name: Decisive instruction diagnostic
        run: python3 experiments/lkc_permanent/tournament_v1.py instructions

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permanent-v1-instruction-evidence
          path: |
            permanent-v1-evidence/
            experiments/lkc_permanent/generated/
