name: LKC Permanent Sparse v3

on:
  push:
    branches: [lkc-permanent-sparse-v3]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Generate probe and RED submission
        run: |
          python3 -m py_compile experiments/lkc_permanent/sparse_v3.py
          python3 experiments/lkc_permanent/sparse_v3.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-permanent-inline-lean4331-d8ea5fc-v1
      - name: Setup exact Permanent environment and rules
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem permanent
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Exact semantic shell
        run: |
          cp experiments/lkc_permanent/generated/Probe_v3.lean bench/.cache/upstream/evaluation/problems/permanent/Probe_v3.lean
          cd bench/.cache/upstream/evaluation/problems/permanent
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Probe_v3.lean
      - name: Universal proof RED frontier
        run: |
          cp experiments/lkc_permanent/generated/Submission_v3.lean bench/.cache/upstream/evaluation/problems/permanent/Submission_v3.lean
          cd bench/.cache/upstream/evaluation/problems/permanent
          set +e
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_v3.lean > "$GITHUB_WORKSPACE/experiments/lkc_permanent/generated/universal-proof-red.log" 2>&1
          code=$?
          set -e
          cat "$GITHUB_WORKSPACE/experiments/lkc_permanent/generated/universal-proof-red.log"
          test "$code" -ne 0
          grep -q "rfl.*failed\|Tactic.*rfl.*failed" "$GITHUB_WORKSPACE/experiments/lkc_permanent/generated/universal-proof-red.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permanent-sparse-v3-evidence
          path: experiments/lkc_permanent/generated/
