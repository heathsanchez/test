name: LKC Permanent Sparse v4

on:
  push:
    branches: [lkc-permanent-sparse-v4]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Generate universally proved sparse candidate
        run: |
          python3 -m py_compile experiments/lkc_permanent/full_v4.py
          python3 experiments/lkc_permanent/full_v4.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-permanent-inline-lean4331-d8ea5fc-v1
      - name: Setup exact Permanent environment and rules
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem permanent
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and axiom audit
        run: |
          cp experiments/lkc_permanent/generated/Submission_v4.lean bench/.cache/upstream/evaluation/problems/permanent/Submission_v4.lean
          cd bench/.cache/upstream/evaluation/problems/permanent
          printf '\n#print axioms Submission.impl_correct\n' >> Submission_v4.lean
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_v4.lean
      - name: Canonical acceptance
        run: |
          python3 bench/.cache/upstream/evaluation/run.py --problem permanent             --submission "$GITHUB_WORKSPACE/experiments/lkc_permanent/generated/Submission_v4.lean"             --timeout 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permanent-sparse-v4-evidence
          path: experiments/lkc_permanent/generated/
