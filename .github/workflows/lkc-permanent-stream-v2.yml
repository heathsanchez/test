name: LKC Permanent Stream v2

on:
  push:
    branches: [lkc-permanent-stream-v2]

permissions:
  contents: read

env:
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Generate candidate
        run: |
          python3 -m py_compile experiments/lkc_permanent/stream_v2.py
          python3 experiments/lkc_permanent/stream_v2.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-permanent-inline-lean4331-d8ea5fc-v1
      - name: Setup Permanent environment
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem permanent
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and axiom audit
        run: |
          cp experiments/lkc_permanent/generated/Submission_v2.lean bench/.cache/upstream/evaluation/problems/permanent/Submission_v2.lean
          cd bench/.cache/upstream/evaluation/problems/permanent
          printf '\n#print axioms Submission.impl_correct\n' >> Submission_v2.lean
          lake env lean -DautoImplicit=false -DwarningAsError=true Submission_v2.lean
