name: LKC Permanent V7 State Counter Screen

on:
  push:
    branches: [lkc-permanent-state-dp-v7]
    paths:
      - 'experiments/lkc_permanent/state_v7_probe.py'
      - '.github/workflows/lkc-permanent-v7-state-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Generate V5 and V7
        run: |
          python3 experiments/lkc_permanent/full_v5.py
          python3 experiments/lkc_permanent/state_v7_probe.py
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem permanent
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Compare
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/permanent-v7-screen"; mkdir -p "$root"
          inputs=(25769803777 25769803778 51539607553 51539607554 68719476737 68719476738)
          for who in v5 v7; do
            if [ "$who" = v5 ]; then
              sub="$GITHUB_WORKSPACE/experiments/lkc_permanent/generated/Submission_v5.lean"
            else
              sub="$GITHUB_WORKSPACE/experiments/lkc_permanent/generated/Submission_v7_state_probe.lean"
            fi
            python3 bench/benchmark.py diagnostic --problem permanent --submission "$sub" \
              --metric wall-time --repetitions 1 --timeout 900 --memory-mb 8192 \
              --inputs "${inputs[@]}" --output "$root/$who"
          done
      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("permanent-v7-screen")
          a=json.loads((r/"v5/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"v7/diagnostic.json").read_text())["totals"]["candidate"]
          out={"baseline_v5":a,"candidate_v7":b,"ratio":b/a,
               "improvement_pct":100*(1-b/a),
               "consequence":"PROVE_STATE_COUNTER" if b<a else "REJECT"}
          (r/"verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permanent-v7-state-screen
          path: permanent-v7-screen/
