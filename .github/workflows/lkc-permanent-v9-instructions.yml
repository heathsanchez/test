name: LKC Permanent V9 Instruction Gate

on:
  push:
    branches: [lkc-permanent-state-v9-exact-proof]
    paths:
      - '.github/workflows/lkc-permanent-v9-instructions.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  instructions:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Generate V5 and V9
        run: |
          python3 experiments/lkc_permanent/full_v5.py
          python3 experiments/lkc_permanent/state_v9_exact_proof.py
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem permanent
          python3 benchmark.py doctor --problem permanent --metric callgrind
      - name: Exact comparable Callgrind
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/permanent-v9-ir"; mkdir -p "$root"
          inputs=(25769803777 25769803778 51539607553 51539607554 68719476737 68719476738)
          for who in v5 v9; do
            if [ "$who" = v5 ]; then
              sub="$GITHUB_WORKSPACE/experiments/lkc_permanent/generated/Submission_v5.lean"
            else
              sub="$GITHUB_WORKSPACE/experiments/lkc_permanent/generated/Submission_v9_state_exact_proof.lean"
            fi
            python3 bench/benchmark.py diagnostic --problem permanent --submission "$sub" \
              --metric callgrind --repetitions 3 --timeout 1200 --memory-mb 8192 \
              --inputs "${inputs[@]}" --output "$root/$who"
          done
      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("permanent-v9-ir")
          a=json.loads((r/"v5/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"v9/diagnostic.json").read_text())["totals"]["candidate"]
          out={"metric":"callgrind","baseline_v5":a,"candidate_v9":b,"ratio":b/a,
               "improvement_pct":100*(1-b/a),
               "consequence":"PROMOTE_INSTRUCTIONS" if b<a else "RETAIN_V5"}
          print(json.dumps(out,indent=2))
          (r/"verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permanent-v9-instruction-evidence
          path: permanent-v9-ir/
