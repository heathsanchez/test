name: LKC Primecount Bitset Proof V6

on:
  push:
    branches: [lkc-primecount-bitset-proof-v6]
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  bit-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Generate bit proof census
        run: |
          python3 -m py_compile experiments/lkc_primecount/bitset_proof_v6.py
          python3 experiments/lkc_primecount/bitset_proof_v6.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-primecount-bitset-proof-v6-lean4331-d8ea5fc
      - name: Setup exact Primecount environment
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem primecount
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Compile bit semantics
        run: |
          cp experiments/lkc_primecount/generated/PrimeBitCensus_v6.lean bench/.cache/upstream/evaluation/problems/primecount/PrimeBitCensus_v6.lean
          cd bench/.cache/upstream/evaluation/problems/primecount
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 PrimeBitCensus_v6.lean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecount-bitset-proof-v6-census
          path: experiments/lkc_primecount/generated/PrimeBitCensus_v6.lean
