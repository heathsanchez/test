name: LKC Primecount Bulk-mask Proof Census V7

on:
  push:
    branches: [lkc-primecount-bulkmask-proof-v8]
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Generate proof census
        run: |
          python3 experiments/lkc_primecount/bulkmask_proof_v7.py
      - name: Checkout benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-primecount-bulkmask-proof-v7-lean4331-d8ea5fc
      - name: Setup Primecount environment
        working-directory: bench
        run: python3 benchmark.py setup --problem primecount
      - name: Compile progression-mask proof census
        run: |
          cp experiments/lkc_primecount/generated/PrimeBulkMaskCensus_v7.lean bench/.cache/upstream/evaluation/problems/primecount/PrimeBulkMaskCensus_v7.lean
          cd bench/.cache/upstream/evaluation/problems/primecount
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 PrimeBulkMaskCensus_v7.lean
