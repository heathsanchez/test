name: LKC Primecount V6 Bulk-mask Screen

on:
  push:
    branches: [lkc-primecount-bulkmask-v6]
    paths:
      - 'experiments/lkc_primecount/bulkmask_v6_probe.py'
      - '.github/workflows/lkc-primecount-bulkmask-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Generate V5 and V6
        run: |
          python3 experiments/lkc_primecount/flash_v5_bitset_probe.py
          python3 experiments/lkc_primecount/bulkmask_v6_probe.py
          sha256sum experiments/lkc_primecount/generated/Submission_v5_bitset_probe.lean             experiments/lkc_primecount/generated/Submission_v6_bulkmask_probe.lean
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem primecount
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Compare V5 and V6 on full public scale plan
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/prime-v6-screen"; mkdir -p "$root"
          inputs=(50 100 150 300 600 1000)
          for who in v5 v6; do
            if [ "$who" = v5 ]; then
              sub="$GITHUB_WORKSPACE/experiments/lkc_primecount/generated/Submission_v5_bitset_probe.lean"
            else
              sub="$GITHUB_WORKSPACE/experiments/lkc_primecount/generated/Submission_v6_bulkmask_probe.lean"
            fi
            python3 bench/benchmark.py diagnostic --problem primecount --submission "$sub"               --metric wall-time --repetitions 3 --timeout 600 --memory-mb 4096               --inputs "${inputs[@]}" --output "$root/$who"
          done
      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("prime-v6-screen")
          a=json.loads((r/"v5/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"v6/diagnostic.json").read_text())["totals"]["candidate"]
          out={"baseline_v5":a,"candidate_v6":b,"ratio":b/a,
               "improvement_pct":100*(1-b/a),
               "consequence":"PROVE_BULKMASK" if b<a else "REJECT"}
          (r/"verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecount-v6-bulkmask-screen
          path: prime-v6-screen/
