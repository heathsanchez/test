name: LKC Primecount Fast-Prime v2

on:
  push:
    branches: [lkc-primecount-fastprime-v2]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Generate protected V1 and composed V2
        run: |
          python3 -m py_compile             experiments/lkc_primecount/direct_v1.py             experiments/lkc_primecount/fastprime_v2.py             experiments/lkc_primecount/tournament_v2.py
          python3 experiments/lkc_primecount/fastprime_v2.py

      - name: Checkout pinned benchmark read-only
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-primecount-fastprime-lean4331-d8ea5fc-v1

      - name: Setup exact Primecount environment and current rules
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem primecount
          python3 benchmark.py doctor --problem primecount --metric wall-time
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code             eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" --             evaluation problems

      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-primecount-fastprime-lean4331-d8ea5fc-v1

      - name: Universal proof, axiom audit, negative control
        run: python3 experiments/lkc_primecount/tournament_v2.py prove

      - name: Same-host V1 versus V2 wall screen
        run: python3 experiments/lkc_primecount/tournament_v2.py screen

      - name: Canonical acceptance
        run: python3 experiments/lkc_primecount/tournament_v2.py qualify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecount-v2-verification-evidence
          path: |
            primecount-v2-evidence/
            experiments/lkc_primecount/generated/

  instructions:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate exact V1 and V2 bytes
        run: python3 experiments/lkc_primecount/fastprime_v2.py

      - name: Checkout pinned benchmark read-only
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"

      - name: Install measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-primecount-fastprime-lean4331-d8ea5fc-v1

      - name: Verify restored benchmark environment
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem primecount
          python3 benchmark.py doctor --problem primecount --metric callgrind

      - uses: actions/download-artifact@v4
        with:
          name: primecount-v2-verification-evidence
          path: .

      - name: Decisive V1 versus V2 instruction tournament
        run: python3 experiments/lkc_primecount/tournament_v2.py instructions

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecount-v2-instruction-evidence
          path: |
            primecount-v2-evidence/
            experiments/lkc_primecount/generated/
