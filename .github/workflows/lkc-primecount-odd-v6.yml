name: LKC Primecount V6 Odd-Only

on:
  push:
    branches: [lkc-primecount-odd-v6]
    paths:
      - 'experiments/lkc_primecount/odd_v6.py'
      - '.github/workflows/lkc-primecount-odd-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  qualify-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Generate V3, V5 and V6
        run: |
          python3 experiments/lkc_primecount/structural_v3.py
          python3 experiments/lkc_primecount/flash_v5_bitset_probe.py
          python3 experiments/lkc_primecount/odd_v6.py
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem primecount
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and canonical acceptance
        run: |
          cp experiments/lkc_primecount/generated/Submission_v6_odd.lean bench/.cache/upstream/evaluation/problems/primecount/Submission_v6.lean
          cd bench/.cache/upstream/evaluation/problems/primecount
          printf '\n#print axioms Submission.impl_correct\n' >> Submission_v6.lean
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_v6.lean
          cd "$GITHUB_WORKSPACE"
          python3 bench/.cache/upstream/evaluation/run.py --problem primecount \
            --submission "$GITHUB_WORKSPACE/experiments/lkc_primecount/generated/Submission_v6_odd.lean" --timeout 900
      - name: Compare V3 V5 V6
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/primecount-v6-screen"; mkdir -p "$root"
          inputs=(50 100 150 300 600 1000)
          for who in v3 v5 v6; do
            case "$who" in
              v3) sub="$GITHUB_WORKSPACE/experiments/lkc_primecount/generated/Submission_v3.lean" ;;
              v5) sub="$GITHUB_WORKSPACE/experiments/lkc_primecount/generated/Submission_v5_bitset_probe.lean" ;;
              v6) sub="$GITHUB_WORKSPACE/experiments/lkc_primecount/generated/Submission_v6_odd.lean" ;;
            esac
            python3 bench/benchmark.py diagnostic --problem primecount --submission "$sub" \
              --metric wall-time --repetitions 3 --timeout 600 --memory-mb 4096 \
              --inputs "${inputs[@]}" --output "$root/$who"
          done
      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("primecount-v6-screen")
          vals={k:json.loads((r/f"{k}/diagnostic.json").read_text())["totals"]["candidate"] for k in ("v3","v5","v6")}
          out={"totals":vals,
               "v6_vs_v3_improvement_pct":100*(1-vals["v6"]/vals["v3"]),
               "v6_vs_v5_improvement_pct":100*(1-vals["v6"]/vals["v5"]),
               "consequence":"PROMOTE_V6" if vals["v6"] < min(vals["v3"],vals["v5"]) else "RETAIN_OTHER"}
          print(json.dumps(out,indent=2))
          (r/"verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecount-v6-odd-evidence
          path: primecount-v6-screen/
