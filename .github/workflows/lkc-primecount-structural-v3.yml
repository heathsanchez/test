name: LKC Primecount Structural v3

on:
  push:
    branches: [lkc-primecount-structural-v3]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Generate frozen V1 and structural V3
        run: |
          python3 -m py_compile             experiments/lkc_primecount/direct_v1.py             experiments/lkc_primecount/structural_v3.py             experiments/lkc_primecount/tournament_v3.py
          python3 experiments/lkc_primecount/direct_v1.py
          python3 experiments/lkc_primecount/structural_v3.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-primecount-structural-lean4331-d8ea5fc-v1
      - name: Setup exact Primecount environment and rules
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem primecount
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and controls
        run: python3 experiments/lkc_primecount/tournament_v3.py prove
      - name: V1 versus V3 wall screen
        run: python3 experiments/lkc_primecount/tournament_v3.py screen
      - name: Canonical acceptance
        run: python3 experiments/lkc_primecount/tournament_v3.py qualify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecount-v3-verification-evidence
          path: |
            primecount-v3-evidence/
            experiments/lkc_primecount/generated/

  instructions:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate exact V1 and V3
        run: |
          python3 experiments/lkc_primecount/direct_v1.py
          python3 experiments/lkc_primecount/structural_v3.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-primecount-structural-lean4331-d8ea5fc-v1
      - name: Setup exact measurement environment
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem primecount
          python3 benchmark.py doctor --problem primecount --metric callgrind
      - uses: actions/download-artifact@v4
        with:
          name: primecount-v3-verification-evidence
          path: .
      - name: Decisive V1 versus V3 Callgrind
        run: python3 experiments/lkc_primecount/tournament_v3.py instructions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecount-v3-instruction-evidence
          path: primecount-v3-evidence/
