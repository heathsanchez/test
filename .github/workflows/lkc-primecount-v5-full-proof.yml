name: LKC Primecount V5 Full Interaction Proof

on:
  push:
    branches: [lkc-primecount-v5-interaction-v1]
    paths:
      - 'experiments/lkc_primecount/v5_full_interaction_proof.py'
      - '.github/workflows/lkc-primecount-v5-full-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact V5 plus interaction proof
        run: |
          python3 experiments/lkc_primecount/v5_full_interaction_proof.py
          sha256sum experiments/lkc_primecount/generated/Submission_v5_full_interaction_proof.lean
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup exact Primecount environment
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem primecount
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and axiom audit
        run: |
          cp experiments/lkc_primecount/generated/Submission_v5_full_interaction_proof.lean bench/.cache/upstream/evaluation/problems/primecount/Submission_v5.lean
          cd bench/.cache/upstream/evaluation/problems/primecount
          printf '\n#print axioms Submission.impl_correct\n' >> Submission_v5.lean
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_v5.lean
      - name: Canonical acceptance
        run: |
          python3 bench/.cache/upstream/evaluation/run.py --problem primecount \
            --submission "$GITHUB_WORKSPACE/experiments/lkc_primecount/generated/Submission_v5_full_interaction_proof.lean" \
            --timeout 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primecount-v5-full-interaction-proof
          path: experiments/lkc_primecount/generated/Submission_v5_full_interaction_proof.lean
