name: LKC Primecount V5 Bitset Proof Development

on:
  push:
    branches: [lkc-primecount-v5-proof-v1]
    paths:
      - 'experiments/lkc_primecount/v5_bitset_proof_dev.py'
      - '.github/workflows/lkc-primecount-v5-proof-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  proof-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate proof development
        run: python3 experiments/lkc_primecount/v5_bitset_proof_dev.py
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup Primecount
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem primecount
      - name: Compile sieve invariant bank
        run: |
          cp experiments/lkc_primecount/generated/Submission_v5_bitset_proof_dev.lean bench/.cache/upstream/evaluation/problems/primecount/ProofDev.lean
          cd bench/.cache/upstream/evaluation/problems/primecount
          lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 ProofDev.lean
