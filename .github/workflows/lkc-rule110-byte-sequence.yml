name: LKC Rule110 byte sequence proof

on:
  push:
    branches: [lkc-rule110-wide-hierarchy-v39]
    paths:
      - 'experiments/lkc_rule110/DenseByteDefsProof.lean'
      - 'experiments/lkc_rule110/DenseByteSixProof.lean'
      - 'experiments/lkc_rule110/DenseByteDecompProof.lean'
      - 'experiments/lkc_rule110/DenseByteModProof.lean'
      - 'experiments/lkc_rule110/DenseByteBoundProof.lean'
      - 'experiments/lkc_rule110/DenseByteBaseProof.lean'
      - 'experiments/lkc_rule110/DenseByteSeqBoundProof.lean'
      - 'experiments/lkc_rule110/DenseByteSeqAddProof.lean'
      - 'experiments/lkc_rule110/DenseByteSeqTailProof.lean'
      - 'experiments/lkc_rule110/DenseByteSeqPowProof.lean'
      - 'experiments/lkc_rule110/DenseByteFixed16Proof.lean'
      - 'experiments/lkc_rule110/DenseByteFixed32Proof.lean'
      - 'experiments/lkc_rule110/DenseByteFixed64Proof.lean'
      - 'experiments/lkc_rule110/DenseByteFixed128Proof.lean'
      - 'experiments/lkc_rule110/DenseByteFixed256Proof.lean'
      - '.github/workflows/lkc-rule110-byte-sequence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout frozen challenge
        run: |
          git clone https://github.com/SAIRcompetition/lean-kernel-challenge.git lkc
          cd lkc
          git checkout eb5e8850cdec9acf52d615529f9d1d64894e44b9
      - name: Prepare
        working-directory: lkc/problems/ca-rule110
        run: |
          cp "$GITHUB_WORKSPACE/experiments/lkc_rule110/Submission_v27.lean" Submission.lean
          lake build
          for f in GenericPackProof GenericMixProof GatherPairProof WideHierarchyProof WideGatherProof WideDenseByteProof DenseByteDefsProof DenseByteSixProof DenseByteDecompProof DenseByteModProof DenseByteBoundProof DenseByteBaseProof DenseByteSeqBoundProof DenseByteSeqAddProof DenseByteSeqTailProof DenseByteSeqPowProof DenseByteFixed16Proof DenseByteFixed32Proof DenseByteFixed64Proof DenseByteFixed128Proof DenseByteFixed256Proof; do
            cp "$GITHUB_WORKSPACE/experiments/lkc_rule110/$f.lean" .
          done
      - name: Generic pack
        working-directory: lkc/problems/ca-rule110
        run: lake env lean -o GenericPackProof.olean GenericPackProof.lean
      - name: Generic mix
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o GenericMixProof.olean GenericMixProof.lean
      - name: Pair gather
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o GatherPairProof.olean GatherPairProof.lean
      - name: Wide hierarchy
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o WideHierarchyProof.olean WideHierarchyProof.lean
      - name: Wide gather
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o WideGatherProof.olean WideGatherProof.lean
      - name: Dense byte
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o WideDenseByteProof.olean WideDenseByteProof.lean
      - name: Byte defs
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteDefsProof.olean DenseByteDefsProof.lean
      - name: Six-bit bound
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteSixProof.olean DenseByteSixProof.lean
      - name: Byte decomposition
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteDecompProof.olean DenseByteDecompProof.lean
      - name: Byte modulo
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteModProof.olean DenseByteModProof.lean
      - name: Byte bound
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteBoundProof.olean DenseByteBoundProof.lean
      - name: Byte base export
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteBaseProof.olean DenseByteBaseProof.lean
      - name: Sequence bound
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteSeqBoundProof.olean DenseByteSeqBoundProof.lean
      - name: Sequence add
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteSeqAddProof.olean DenseByteSeqAddProof.lean
      - name: Sequence tail
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteSeqTailProof.olean DenseByteSeqTailProof.lean
      - name: Power bridge
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteSeqPowProof.olean DenseByteSeqPowProof.lean
      - name: Fixed 16-bit bridge
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteFixed16Proof.olean DenseByteFixed16Proof.lean
      - name: Fixed 32-bit bridge
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteFixed32Proof.olean DenseByteFixed32Proof.lean
      - name: Fixed 64-bit bridge
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteFixed64Proof.olean DenseByteFixed64Proof.lean
      - name: Fixed 128-bit bridge
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteFixed128Proof.olean DenseByteFixed128Proof.lean
      - name: Fixed 256-bit bridge
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteFixed256Proof.olean DenseByteFixed256Proof.lean
