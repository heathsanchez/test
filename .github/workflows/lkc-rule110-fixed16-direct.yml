name: LKC Rule110 fixed16 direct bridge

on:
  push:
    branches: [lkc-rule110-wide-hierarchy-v39]
    paths:
      - 'experiments/lkc_rule110/DenseByteFixed16DirectProof.lean'
      - '.github/workflows/lkc-rule110-fixed16-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout frozen challenge
        run: |
          git clone https://github.com/SAIRcompetition/lean-kernel-challenge.git lkc
          cd lkc
          git checkout eb5e8850cdec9acf52d615529f9d1d64894e44b9
      - name: Prepare proof stack
        working-directory: lkc/problems/ca-rule110
        shell: bash
        run: |
          cp "$GITHUB_WORKSPACE/experiments/lkc_rule110/Submission_v27.lean" Submission.lean
          lake build
          for f in GenericPackProof GenericMixProof GatherPairProof WideHierarchyProof WideGatherProof WideDenseByteProof DenseByteDefsProof DenseByteSixProof DenseByteDecompProof DenseByteModProof DenseByteBoundProof DenseByteBaseProof DenseByteSeqBoundProof DenseByteSeqAddProof DenseByteFixed16DirectProof; do
            cp "$GITHUB_WORKSPACE/experiments/lkc_rule110/$f.lean" .
          done
          lake env lean -o GenericPackProof.olean GenericPackProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o GenericMixProof.olean GenericMixProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o GatherPairProof.olean GatherPairProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o WideHierarchyProof.olean WideHierarchyProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o WideGatherProof.olean WideGatherProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o WideDenseByteProof.olean WideDenseByteProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteDefsProof.olean DenseByteDefsProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteSixProof.olean DenseByteSixProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteDecompProof.olean DenseByteDecompProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteModProof.olean DenseByteModProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteBoundProof.olean DenseByteBoundProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteBaseProof.olean DenseByteBaseProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteSeqBoundProof.olean DenseByteSeqBoundProof.lean
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o DenseByteSeqAddProof.olean DenseByteSeqAddProof.lean
      - name: Direct fixed16 proof
        working-directory: lkc/problems/ca-rule110
        run: LEAN_PATH=".:$LEAN_PATH" lake env lean DenseByteFixed16DirectProof.lean
