name: LKC Rule110 gather cut sweep v61

on:
  push:
    branches: [lkc-rule110-gather-cut-sweep-v61]
    paths:
      - 'experiments/lkc_rule110/gather_cut_sweep_v61.py'
      - '.github/workflows/lkc-rule110-gather-cut-sweep-v61.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LKC_COMMIT: eb5e8850cdec9acf52d615529f9d1d64894e44b9
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout frozen challenge
        run: |
          git clone https://github.com/SAIRcompetition/lean-kernel-challenge.git lkc
          cd lkc && git checkout "$LKC_COMMIT"
      - name: Generate protected v54
        run: |
          python3 experiments/lkc_rule110/payload_mask_v51.py
          python3 experiments/lkc_rule110/init_bias_v52.py
          python3 experiments/lkc_rule110/mod_gather_v54.py
      - name: RED generate cut candidates
        run: python3 experiments/lkc_rule110/gather_cut_sweep_v61.py
      - name: Prepare evaluator
        working-directory: lkc
        run: bash evaluation/setup.sh --problem ca-rule110
      - name: Universal proof gates
        working-directory: lkc/problems/ca-rule110
        shell: bash
        run: |
          set -euo pipefail
          for v in 61 62 63; do
            cp "$GITHUB_WORKSPACE/experiments/lkc_rule110/generated/Submission_v${v}.lean" Submission.lean
            lake build
          done
      - name: Canonical acceptance gates
        working-directory: lkc
        shell: bash
        run: |
          set -euo pipefail
          for v in 61 62 63; do
            python3 evaluation/run.py --problem ca-rule110 \
              --submission "$GITHUB_WORKSPACE/experiments/lkc_rule110/generated/Submission_v${v}.lean" --timeout 120
          done
      - name: Five balanced four-way replays
        working-directory: lkc
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts-cut-sweep"; mkdir -p "$out"
          for rep in 1 2 3 4 5; do
            case $rep in
              1) order="v54 v61 v62 v63" ;;
              2) order="v61 v62 v63 v54" ;;
              3) order="v62 v63 v54 v61" ;;
              4) order="v63 v54 v61 v62" ;;
              5) order="v54 v63 v62 v61" ;;
            esac
            for who in $order; do
              sub="$GITHUB_WORKSPACE/experiments/lkc_rule110/generated/Submission_${who}.lean"
              python3 evaluation/run.py --problem ca-rule110 --submission "$sub" --timeout 120 2>&1 | tee "$out/${who}-rep${rep}.log"
            done
          done
      - name: Summarize
        if: always()
        shell: python
        run: |
          import json,pathlib,re,statistics
          root=pathlib.Path('artifacts-cut-sweep'); root.mkdir(exist_ok=True); out={}
          for who in ('v54','v61','v62','v63'):
              vals=[]
              for p in sorted(root.glob(f'{who}-rep*.log')):
                  m=re.search(r'Computation replay T: ([0-9.]+) s',p.read_text())
                  if m: vals.append(float(m.group(1)))
              out[who]={'runs':vals,'median':statistics.median(vals) if vals else None}
          med={k:v['median'] for k,v in out.items() if v['median'] is not None}
          if med:
              best=min(med,key=med.get); out['best_wall']=best
              base=med.get('v54')
              if base:
                  out['vs_v54']={k:{'improvement_pct':(1-v/base)*100,'speedup_x':base/v} for k,v in med.items() if k!='v54'}
          (root/'summary.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lkc-rule110-gather-cut-sweep-v61
          path: |
            experiments/lkc_rule110/generated/Submission_v54.lean
            experiments/lkc_rule110/generated/Submission_v61.lean
            experiments/lkc_rule110/generated/Submission_v62.lean
            experiments/lkc_rule110/generated/Submission_v63.lean
            artifacts-cut-sweep/
          if-no-files-found: warn
