name: LKC Rule110 minimal-xor transition v45

on:
  push:
    branches: [lkc-rule110-wide-hierarchy-v39]
    paths:
      - 'experiments/lkc_rule110/transition_tournament.py'
      - '.github/workflows/lkc-rule110-minxor-v45.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lkc-rule110-minxor-v45
  cancel-in-progress: true

jobs:
  verify-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LKC_COMMIT: eb5e8850cdec9acf52d615529f9d1d64894e44b9
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout frozen challenge
        run: |
          git clone https://github.com/SAIRcompetition/lean-kernel-challenge.git lkc
          cd lkc
          git checkout "$LKC_COMMIT"
      - name: Generate minimal XOR candidate
        run: |
          mkdir -p generated-rule110
          python3 experiments/lkc_rule110/transition_tournament.py             minxor generated-rule110/Submission_minxor.lean
          diff -u experiments/lkc_rule110/Submission_v27.lean             generated-rule110/Submission_minxor.lean || true
      - name: Prepare evaluator
        working-directory: lkc
        run: bash evaluation/setup.sh --problem ca-rule110
      - name: Universal Lean proof gate
        working-directory: lkc/problems/ca-rule110
        run: |
          cp "$GITHUB_WORKSPACE/generated-rule110/Submission_minxor.lean" Submission.lean
          lake build
      - name: Seven paired replays
        working-directory: lkc
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts-minxor"
          mkdir -p "$out"
          for rep in 1 2 3 4 5 6 7; do
            for who in v27 minxor; do
              if [ "$who" = v27 ]; then
                sub="$GITHUB_WORKSPACE/experiments/lkc_rule110/Submission_v27.lean"
              else
                sub="$GITHUB_WORKSPACE/generated-rule110/Submission_minxor.lean"
              fi
              python3 evaluation/run.py --problem ca-rule110 --submission "$sub" --timeout 120 2>&1 |
                tee "$out/${who}-rep${rep}.log"
            done
          done
      - name: Summarize
        if: always()
        shell: python
        run: |
          import pathlib,re,statistics,json
          root=pathlib.Path("artifacts-minxor"); root.mkdir(exist_ok=True)
          out={}
          for who in ("v27","minxor"):
              vals=[]
              for p in sorted(root.glob(f"{who}-rep*.log")):
                  m=re.search(r"Computation replay T: ([0-9.]+) s",p.read_text())
                  if m: vals.append(float(m.group(1)))
              out[who]={"runs":vals,"median":statistics.median(vals) if vals else None}
          a=out["v27"]["median"]; b=out["minxor"]["median"]
          if a and b:
              out["improvement_pct"]=(1-b/a)*100
              out["speedup_x"]=a/b
              out["promote_proxy"]=b<a
          (root/"summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lkc-rule110-minxor-v45
          path: artifacts-minxor/
          if-no-files-found: warn
