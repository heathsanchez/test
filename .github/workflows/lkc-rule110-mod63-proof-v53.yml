name: LKC Rule110 mod63 proof v53

on:
  push:
    branches: [lkc-rule110-mod63-proof-v53]
    paths:
      - 'experiments/lkc_rule110/ModGather63Proof.lean'
      - '.github/workflows/lkc-rule110-mod63-proof-v53.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LKC_COMMIT: eb5e8850cdec9acf52d615529f9d1d64894e44b9
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout frozen challenge
        run: |
          git clone https://github.com/SAIRcompetition/lean-kernel-challenge.git lkc
          cd lkc
          git checkout "$LKC_COMMIT"
      - name: Build local Spec dependency
        working-directory: lkc/problems/ca-rule110
        run: lake build Spec
      - name: GREEN core theorem
        working-directory: lkc/problems/ca-rule110
        run: |
          cp "$GITHUB_WORKSPACE/experiments/lkc_rule110/ModGather63Proof.lean" ModGather63Proof.lean
          lake env lean ModGather63Proof.lean
