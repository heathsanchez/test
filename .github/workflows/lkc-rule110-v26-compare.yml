name: LKC Rule110 persistent sixteen-lane v26

on:
  push:
    branches: [lkc-rule110-v26-proof-fix]
    paths:
      - 'experiments/lkc_rule110/Submission_v26.lean'
      - '.github/workflows/lkc-rule110-v26-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lkc-rule110-v26
  cancel-in-progress: true

jobs:
  verify-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LKC_COMMIT: eb5e8850cdec9acf52d615529f9d1d64894e44b9
    steps:
      - uses: actions/checkout@v4
      - name: Prepare proof-fixed V26
        shell: python
        run: |
          from pathlib import Path
          p=Path("experiments/lkc_rule110/Submission_v26.lean")
          s=p.read_text()
          s=s.replace(
              "set_option maxRecDepth 32768 in\ntheorem pack16SWAR16_eq",
              "set_option maxRecDepth 131072 in\ntheorem pack16SWAR16_eq",
              1)
          s=s.replace(
              "      rw [hidx]\n      simp only [packByteTailSWAR8]\n      omega",
              "      rw [hidx]\n      simp only [packByteTailSWAR8]\n      rw [hadv]\n      omega",
              1)
          start=s.index("theorem initPackedHexProgression_eq (n : Nat) :")
          end=s.index("\ndef impl : Nat → Nat := fun n =>", start)
          fixed="\n".join([
              "theorem initPackedHexProgression_eq (n : Nat) :",
              "    initPackedHexProgression (caSeed n) = initPackedSWAR8 (caSeed n) := by",
              "  simp only [initPackedHexProgression, initPackedSWAR8]",
              "  have hs : caSeed n < 2 ^ 32 := by",
              "    unfold caSeed",
              "    exact Nat.and_lt_two_pow n (by decide)",
              "  have hc : (2 ^ 32 - 1) + 256 * stepConst < 2 ^ 64 := by",
              "    unfold stepConst",
              "    decide",
              "  have hb :",
              "      caSeed n + 3 * stepConst + (16 * 15 + 13) * stepConst < 2 ^ 64 := by",
              "    unfold stepConst at *",
              "    omega",
              "  rw [packHexTail_eq (caSeed n + 3 * stepConst) 15 hb]",
              ""
          ])
          s=s[:start]+fixed+s[end:]
          Path("experiments/lkc_rule110/Submission_v26.fixed.lean").write_text(s)
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout frozen challenge
        run: |
          git clone https://github.com/SAIRcompetition/lean-kernel-challenge.git lkc
          cd lkc
          git checkout "$LKC_COMMIT"
      - name: Prepare evaluator
        working-directory: lkc
        run: bash evaluation/setup.sh --problem ca-rule110
      - name: Build v26 universal proof
        working-directory: lkc/problems/ca-rule110
        run: |
          cp "$GITHUB_WORKSPACE/experiments/lkc_rule110/Submission_v26.fixed.lean" Submission.lean
          lake build
      - name: Compare v25 and v26 over five local replays
        working-directory: lkc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts-v25"
          for who in v25 v26; do
            if [ "$who" = v25 ]; then
              sub="$GITHUB_WORKSPACE/experiments/lkc_rule110/Submission_v25.lean"
            else
              sub="$GITHUB_WORKSPACE/experiments/lkc_rule110/Submission_v26.fixed.lean"
            fi
            for rep in 1 2 3 4 5; do
              python3 evaluation/run.py --problem ca-rule110 --submission "$sub" --timeout 120 2>&1 |
                tee "$GITHUB_WORKSPACE/artifacts-v25/${who}-rep${rep}.log"
            done
          done
      - name: Summarize
        if: always()
        shell: python
        run: |
          import glob,re,statistics,pathlib,json
          pathlib.Path("artifacts-v25").mkdir(exist_ok=True)
          out={}
          for who in ("v25","v26"):
              vals=[]
              for p in sorted(glob.glob(f"artifacts-v25/{who}-rep*.log")):
                  m=re.search(r"Computation replay T: ([0-9.]+) s",pathlib.Path(p).read_text())
                  if m: vals.append(float(m.group(1)))
              out[who]={"runs":vals,"median":statistics.median(vals) if vals else None}
          if out["v25"]["median"] and out["v26"]["median"]:
              out["improvement_pct"]=(1-out["v26"]["median"]/out["v25"]["median"])*100
              out["speedup_x"]=out["v25"]["median"]/out["v26"]["median"]
          pathlib.Path("artifacts-v25/summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lkc-rule110-v26-evidence
          path: artifacts-v25/
          if-no-files-found: error
