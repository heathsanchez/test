name: LKC Rule110 V66 Match Dispatch Screen

on:
  push:
    branches: [lkc-rule110-match-dispatch-v66]
    paths:
      - 'experiments/lkc_rule110/flash_v66_match_probe.py'
      - '.github/workflows/lkc-rule110-v66-match-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Generate V64 and V66
        run: |
          python3 experiments/lkc_rule110/flash_v64_probe.py
          python3 experiments/lkc_rule110/flash_v66_match_probe.py
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem ca-rule110
      - name: Compare
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/rule110-v66-screen"; mkdir -p "$root"
          inputs=(8589934593 8589934594 17179869185 17179869186 34359738369 34359738370)
          for who in v64 v66; do
            if [ "$who" = v64 ]; then
              sub="$GITHUB_WORKSPACE/experiments/lkc_rule110/generated/Submission_v64_probe.lean"
            else
              sub="$GITHUB_WORKSPACE/experiments/lkc_rule110/generated/Submission_v66_match_probe.lean"
            fi
            python3 bench/benchmark.py diagnostic --problem ca-rule110 --submission "$sub" \
              --metric wall-time --repetitions 3 --timeout 300 --memory-mb 4096 \
              --inputs "${inputs[@]}" --output "$root/$who"
          done
      - name: Verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("rule110-v66-screen")
          a=json.loads((r/"v64/diagnostic.json").read_text())["totals"]["candidate"]
          b=json.loads((r/"v66/diagnostic.json").read_text())["totals"]["candidate"]
          out={"baseline_v64":a,"candidate_v66":b,"ratio":b/a,
               "improvement_pct":100*(1-b/a),
               "consequence":"PROVE_MATCH_DISPATCH" if b<a else "REJECT"}
          print(json.dumps(out,indent=2))
          (r/"verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rule110-v66-match-screen
          path: rule110-v66-screen/
