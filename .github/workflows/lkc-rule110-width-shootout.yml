name: LKC Rule110 width shootout V21 vs V24

on:
  push:
    branches: [lkc-rule110-fused-v1]
    paths:
      - '.github/workflows/lkc-rule110-width-shootout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lkc-rule110-width-shootout
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LKC_COMMIT: eb5e8850cdec9acf52d615529f9d1d64894e44b9
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout frozen challenge
        run: |
          git clone https://github.com/SAIRcompetition/lean-kernel-challenge.git lkc
          cd lkc
          git checkout "$LKC_COMMIT"
      - name: Prepare evaluator
        working-directory: lkc
        run: bash evaluation/setup.sh --problem ca-rule110
      - name: Build both universal proofs
        working-directory: lkc/problems/ca-rule110
        shell: bash
        run: |
          cp "$GITHUB_WORKSPACE/experiments/lkc_rule110/Submission_v21.lean" Submission.lean
          lake build
          cp "$GITHUB_WORKSPACE/experiments/lkc_rule110/Submission_v24.lean" Submission.lean
          lake build
      - name: Five-run paired width shootout
        working-directory: lkc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts-width"
          for rep in 1 2 3 4 5; do
            for who in v21 v24; do
              sub="$GITHUB_WORKSPACE/experiments/lkc_rule110/Submission_$who.lean"
              python3 evaluation/run.py --problem ca-rule110 --submission "$sub" --timeout 120 2>&1 |
                tee "$GITHUB_WORKSPACE/artifacts-width/${who}-rep${rep}.log"
            done
          done
      - name: Summarize
        if: always()
        shell: python
        run: |
          import glob,re,statistics,pathlib,json
          pathlib.Path("artifacts-width").mkdir(exist_ok=True)
          out={}
          for who in ("v21","v24"):
              vals=[]
              for p in sorted(glob.glob(f"artifacts-width/{who}-rep*.log")):
                  m=re.search(r"Computation replay T: ([0-9.]+) s", pathlib.Path(p).read_text())
                  if m: vals.append(float(m.group(1)))
              out[who]={"runs":vals,"median":statistics.median(vals) if vals else None}
          if out["v21"]["median"] and out["v24"]["median"]:
              out["v24_vs_v21_improvement_pct"]=(1-out["v24"]["median"]/out["v21"]["median"])*100
              out["speedup_x"]=out["v21"]["median"]/out["v24"]["median"]
          pathlib.Path("artifacts-width/summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lkc-rule110-width-shootout
          path: artifacts-width/
          if-no-files-found: error
