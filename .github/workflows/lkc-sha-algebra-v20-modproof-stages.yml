name: LKC SHA Algebra V20 ModProof Stages

on:
  push:
    branches: [lkc-sha-algebra-v20-modproof]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stage: [A_round, B_kbridge, C_finish, D_correct, E_fun]
    steps:
      - uses: actions/checkout@v4
      - name: Generate staged proof
        run: |
          python3 experiments/lkc_sha256/algebra_modproof_stages_v23.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-sha256-algebra-v20-modproof-stages-lean4331-d8ea5fc
      - name: Setup SHA environment
        working-directory: bench
        run: python3 benchmark.py setup --problem sha256
      - name: Check stage
        run: |
          cp "experiments/lkc_sha256/generated/ModProof_${{ matrix.stage }}.lean" bench/.cache/upstream/evaluation/problems/sha256/Stage.lean
          cd bench/.cache/upstream/evaluation/problems/sha256
          /usr/bin/time -v lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Stage.lean
