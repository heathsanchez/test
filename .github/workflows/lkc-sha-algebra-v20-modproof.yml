name: LKC SHA Algebra V20 ModProof

on:
  push:
    branches: [lkc-sha-algebra-v20-modproof]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Generate quotient proof
        run: |
          python3 -m py_compile experiments/lkc_sha256/algebra_modproof_v23.py
          python3 experiments/lkc_sha256/algebra_modproof_v23.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-sha256-algebra-v20-modproof-lean4331-d8ea5fc
      - name: Setup exact SHA environment and rules
        working-directory: bench
        run: |
          python3 benchmark.py setup --problem sha256
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and axiom audit
        run: |
          cp experiments/lkc_sha256/generated/Submission_algebra_v20_modproof.lean bench/.cache/upstream/evaluation/problems/sha256/Submission_modproof.lean
          cd bench/.cache/upstream/evaluation/problems/sha256
          printf '\n#print axioms Submission.roundFast_eq_round\n#print axioms Submission.fastStepAlgebra_correct\n#print axioms Submission.impl_correct\n' >> Submission_modproof.lean
          /usr/bin/time -v lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_modproof.lean
      - name: Canonical acceptance
        run: |
          python3 bench/.cache/upstream/evaluation/run.py --problem sha256             --submission "$GITHUB_WORKSPACE/experiments/lkc_sha256/generated/Submission_algebra_v20_modproof.lean"             --timeout 900
