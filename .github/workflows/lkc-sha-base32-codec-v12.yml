name: LKC SHA Base32 Codec v12 Proof

on:
  push:
    branches: [lkc-sha-base32-machine-v12-proof]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Generate codec proof
        run: |
          python3 -m py_compile experiments/lkc_sha256/base32_codec_v12.py
          python3 experiments/lkc_sha256/base32_codec_v12.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-sha256-base32-codec-v12-lean4331-d8ea5fc
      - name: Setup exact SHA environment
        working-directory: bench
        run: python3 benchmark.py setup --problem sha256
      - name: Check generic codec lemmas
        run: |
          cp experiments/lkc_sha256/generated/Base32_codec_v12.lean bench/.cache/upstream/evaluation/problems/sha256/Base32_codec_v12.lean
          cd bench/.cache/upstream/evaluation/problems/sha256
          /usr/bin/time -v lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Base32_codec_v12.lean
