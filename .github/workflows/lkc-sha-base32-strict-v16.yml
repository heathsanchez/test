name: LKC SHA Base32 Strict v16 Giant

on:
  push:
    branches: [lkc-sha-base32-strict-v16]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  giant:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Generate strict base32 candidate
        run: |
          python3 -m py_compile experiments/lkc_sha256/base32_strict_v16.py
          python3 experiments/lkc_sha256/base32_strict_v16.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-sha256-base32-strict-v16-lean4331-d8ea5fc
      - name: Setup SHA environment
        working-directory: bench
        run: python3 benchmark.py setup --problem sha256
      - name: 512-step strict-state probe
        run: |
          cd bench
          python3 benchmark.py diagnostic             --problem sha256             --submission "$GITHUB_WORKSPACE/experiments/lkc_sha256/generated/Submission_base32_strict_v16.lean"             --metric wall-time --repetitions 1             --timeout 900 --memory-mb 4096             --inputs 2199573357346             --output "$GITHUB_WORKSPACE/sha-base32-strict-v16"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sha-base32-strict-v16
          path: sha-base32-strict-v16/
