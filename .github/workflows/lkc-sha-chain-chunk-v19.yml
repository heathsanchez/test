name: LKC SHA Chain Chunk v19 Giant Separator

on:
  push:
    branches: [lkc-sha-chain-chunk-v19]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  giant:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chunk: [4, 8, 16, 32, 64]
    steps:
      - uses: actions/checkout@v4
      - name: Generate chain-chunk family
        run: |
          python3 -m py_compile experiments/lkc_sha256/chain_chunk_v19.py
          python3 experiments/lkc_sha256/chain_chunk_v19.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-sha256-chain-chunk-v19-lean4331-d8ea5fc
      - name: Setup SHA environment
        working-directory: bench
        run: python3 benchmark.py setup --problem sha256
      - name: 512-step chain-depth probe
        run: |
          cd bench
          python3 benchmark.py diagnostic             --problem sha256             --submission "$GITHUB_WORKSPACE/experiments/lkc_sha256/generated/Submission_chain${{ matrix.chunk }}_v19.lean"             --metric wall-time --repetitions 1             --timeout 900 --memory-mb 4096             --inputs 2199573357346             --output "$GITHUB_WORKSPACE/sha-chain${{ matrix.chunk }}-v19"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sha-chain${{ matrix.chunk }}-v19
          path: sha-chain${{ matrix.chunk }}-v19/
