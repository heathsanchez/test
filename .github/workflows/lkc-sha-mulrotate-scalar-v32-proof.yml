name: LKC SHA MulRotate Scalar V32 Proof

on:
  push:
    branches: [lkc-sha-mulrotate-scalar-v32-proof]
    paths:
      - 'experiments/lkc_sha256/mulrotate_scalar_v32_proof.py'
      - '.github/workflows/lkc-sha-mulrotate-scalar-v32-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Generate V32 proof candidate
        run: |
          python3 experiments/lkc_sha256/mulrotate_scalar_v32_proof.py
          sha256sum experiments/lkc_sha256/generated/Submission_mulrotate_scalar_v32_proof.lean
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup exact SHA environment
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench
          python3 benchmark.py setup --problem sha256
          git -C .cache/upstream fetch origin "$RULES_COMMIT"
          git -C .cache/upstream diff --exit-code eb5e8850cdec9acf52d615529f9d1d64894e44b9 "$RULES_COMMIT" -- evaluation problems
      - name: Universal proof and axiom audit
        run: |
          cp experiments/lkc_sha256/generated/Submission_mulrotate_scalar_v32_proof.lean bench/.cache/upstream/evaluation/problems/sha256/Submission_v32.lean
          cd bench/.cache/upstream/evaluation/problems/sha256
          printf '\n#print axioms Submission.impl_correct\n' >> Submission_v32.lean
          /usr/bin/time -v lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 Submission_v32.lean
      - name: Canonical acceptance
        run: |
          python3 bench/.cache/upstream/evaluation/run.py --problem sha256 \
            --submission "$GITHUB_WORKSPACE/experiments/lkc_sha256/generated/Submission_mulrotate_scalar_v32_proof.lean" \
            --timeout 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sha-v32-proof-evidence
          path: experiments/lkc_sha256/generated/Submission_mulrotate_scalar_v32_proof.lean
