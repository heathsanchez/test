name: LKC SHA V23 Lean-Only Proof

on:
  push:
    branches: [lkc-sha-algebra-v23-proof-friendly]

permissions:
  contents: read

env:
  RULES_COMMIT: 940f0a2ead23ef70ab1387edabb347e629111edd

jobs:
  lean-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate V23 submission
        run: |
          python3 -m py_compile experiments/lkc_sha256/algebra_fullproof_v21.py
          python3 experiments/lkc_sha256/algebra_fullproof_v21.py
          wc -c experiments/lkc_sha256/generated/Submission_algebra_v21_proof.lean

      - name: Install exact Lean 4.33.1
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Prepare pinned trusted Spec
        run: |
          mkdir -p lean-v23-check
          curl --fail --location             "https://raw.githubusercontent.com/SAIRcompetition/lean-kernel-challenge/$RULES_COMMIT/evaluation/problems/sha256/Spec.lean"             -o lean-v23-check/Spec.lean
          cp experiments/lkc_sha256/generated/Submission_algebra_v21_proof.lean             lean-v23-check/Submission.lean

      - name: Compile trusted Spec
        working-directory: lean-v23-check
        run: |
          lean -DautoImplicit=false -DwarningAsError=true             -DmaxRecDepth=4000000 -DmaxHeartbeats=0             -o Spec.olean Spec.lean

      - name: Universal proof and axiom audit
        working-directory: lean-v23-check
        run: |
          printf '\n#print axioms Submission.impl_correct\n' >> Submission.lean
          /usr/bin/time -v lean             -DautoImplicit=false -DwarningAsError=true             -DmaxRecDepth=4000000 -DmaxHeartbeats=0             Submission.lean
