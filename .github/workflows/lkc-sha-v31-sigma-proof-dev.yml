name: LKC SHA V31 Sigma Proof Dev
on:
  push:
    branches: [lkc-sha-v31-interaction-proof-v1]
    paths:
      - 'experiments/lkc_sha256/v31_sigma_proof_dev.py'
      - '.github/workflows/lkc-sha-v31-sigma-proof-dev.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate sigma proof dev
        run: python3 experiments/lkc_sha256/v31_sigma_proof_dev.py
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup SHA
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
          cd bench && python3 benchmark.py setup --problem sha256
      - name: Compile sigma bridge
        run: |
          cp experiments/lkc_sha256/generated/V31SigmaProofDev.lean bench/.cache/upstream/evaluation/problems/sha256/V31SigmaProofDev.lean
          cd bench/.cache/upstream/evaluation/problems/sha256
          /usr/bin/time -v lake env lean -DautoImplicit=false -DwarningAsError=true -DmaxRecDepth=4000000 -DmaxHeartbeats=0 V31SigmaProofDev.lean
