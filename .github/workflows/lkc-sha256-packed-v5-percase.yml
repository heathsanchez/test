name: LKC SHA Packed V5 Per-Case Resource

on:
  push:
    branches: [lkc-sha256-packed-generic-v5]

permissions:
  contents: read

env:
  BENCH_COMMIT: d8ea5fcefefd7f25b9c451d386f449c8f9312e25

jobs:
  case:
    strategy:
      fail-fast: false
      matrix:
        n:
          - 18860801433
          - 17252521710
          - 138725260120
          - 140599404248
          - 2199121876686
          - 2199573357346
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact V5 candidate
        run: python3 experiments/lkc_sha256/packed_generic_v5.py
      - name: Checkout pinned benchmark
        run: |
          git clone https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          git -C bench checkout "$BENCH_COMMIT"
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            bench/.cache
          key: lkc-sha256-packed-core-lean4331-d8ea5fc-v1
      - name: Setup SHA environment
        working-directory: bench
        run: python3 benchmark.py setup --problem sha256
      - name: Single-case wall/resource diagnostic
        run: |
          cd bench
          python3 benchmark.py diagnostic             --problem sha256             --submission "$GITHUB_WORKSPACE/experiments/lkc_sha256/generated/Submission_v5.lean"             --metric wall-time             --repetitions 1             --timeout 240             --memory-mb 4096             --inputs "${{ matrix.n }}"             --output "$GITHUB_WORKSPACE/sha-v5-case-${{ matrix.n }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sha-v5-case-${{ matrix.n }}
          path: sha-v5-case-${{ matrix.n }}/
