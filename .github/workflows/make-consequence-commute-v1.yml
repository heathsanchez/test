name: Make Consequence Commute V1

on:
  push:
    paths:
      - "experiments/make_consequence_commute_v1/FROZEN_CANDIDATE.md"
      - "scripts/make_consequence_commute_v1.py"
      - ".github/workflows/make-consequence-commute-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove frozen candidate unchanged
        run: |
          set -euxo pipefail
          git diff --exit-code 016a7f60d621d9034c47949c0ca37cead56eaed9 --             experiments/make_consequence_commute_v1/FROZEN_CANDIDATE.md
          echo "MCC_V1_FROZEN_CANDIDATE_UNCHANGED"

      - name: Run three-axis developmental test
        run: |
          set -o pipefail
          python scripts/make_consequence_commute_v1.py | tee make-consequence-commute-v1.log
          grep -F "SURVIVED_MAKE_CONSEQUENCE_COMMUTE_V1" make-consequence-commute-v1.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: make-consequence-commute-v1
          path: |
            experiments/make_consequence_commute_v1/FROZEN_CANDIDATE.md
            experiments/make_consequence_commute_v1/evidence.json
            make-consequence-commute-v1.log
          if-no-files-found: warn
