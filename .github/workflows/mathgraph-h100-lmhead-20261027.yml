name: MathGraph LM-Head Architecture Audit - CPU ONLY

# The preceding full-model 1/2-layer fixtures violate the pinned 16-layer
# CUDA barrier contract. No RunPod access or GPU provision is permitted here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0421292fcb28047bbf1b0eedcfd1604c84fa6ab0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run architecture negative and positive controls
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/megakernel_h100 -p 'test_*.py' -v
          mkdir -p audit_evidence
          source_dir="$(mktemp -d)"
          trap 'rm -rf "$source_dir"' EXIT
          git -C "$source_dir" init -q
          git -C "$source_dir" fetch -q --depth 1 https://github.com/HazyResearch/Megakernels.git 7309cec801537b61fea3b50d7dfe454a6cde578e
          git -C "$source_dir" checkout -q --detach FETCH_HEAD
          python experiments/megakernel_h100/h100_architecture_audit.py --repo "$source_dir" --fixture-layers 2 --executed-layers 2 --expect REJECTED_INVALID_LMHEAD_ARCHITECTURE | tee audit_evidence/invalid_fixture.json
          python experiments/megakernel_h100/h100_architecture_audit.py --repo "$source_dir" --fixture-layers 16 --executed-layers 16 --expect ELIGIBLE_FULL_MODEL_COMPATIBILITY_UNPROVEN | tee audit_evidence/eligible_not_verified.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-lmhead-architecture-audit
          path: audit_evidence/
          if-no-files-found: warn
