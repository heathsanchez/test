name: MathGraph finite consequential quotient — h11 original PRs
on:
  push:
    branches:
      - research/mathgraph-minimal-consequential-quotient-h11-20261015
    paths:
      - 'research/mathgraph_minimal_quotient/**'
      - '.github/workflows/mathgraph-h11-observational-quotient-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-quotient:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Inspect preregistration and compile generic source tool
        shell: bash
        run: |
          set -euo pipefail
          test -s research/mathgraph_minimal_quotient/FROZEN_PROTOCOL.md
          python -m py_compile research/mathgraph_minimal_quotient/h11_quotient.py
      - name: Clone original repository and pin exact author PR heads
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/python-hyper/h11.git "$RUNNER_TEMP/h11"
          git -C "$RUNNER_TEMP/h11" fetch --no-tags origin \
            refs/pull/206/head:refs/heads/pinned-206 \
            refs/pull/198/head:refs/heads/pinned-198 \
            refs/pull/207/head:refs/heads/pinned-207
          git -C "$RUNNER_TEMP/h11" fetch --no-tags origin 62c5068c971579d61fa1b55373390e12f25fd856
          test "$(git -C "$RUNNER_TEMP/h11" rev-parse pinned-206)" = "05972a8b34faeb91c22b9a6283da84e45e7f0781"
          test "$(git -C "$RUNNER_TEMP/h11" rev-parse pinned-198)" = "46a076d96fbf9b18868c45ddfd2dcc0e2077f2a5"
          test "$(git -C "$RUNNER_TEMP/h11" rev-parse pinned-207)" = "ec2e2dbbdc61587911dda3dd5f868f14ab0733f4"
          git -C "$RUNNER_TEMP/h11" cat-file -e 62c5068c971579d61fa1b55373390e12f25fd856^{commit}
          printf 'pinned original refs verified\n'
      - name: Derive native future-observation quotient and minimum separating witnesses
        shell: bash
        run: |
          set -euo pipefail
          python research/mathgraph_minimal_quotient/h11_quotient.py \
            "$RUNNER_TEMP/h11" "$RUNNER_TEMP/quotient" | tee "$RUNNER_TEMP/summary.stdout"
          test -s "$RUNNER_TEMP/quotient/summary.json"
          test -s "$RUNNER_TEMP/quotient/REPORT.md"
      - name: Qualify original upstream parser test suites on exact source heads
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          mkdir -p "$RUNNER_TEMP/quotient"
          for name in base 206 198 207; do
            case "$name" in
              base) ref=62c5068c971579d61fa1b55373390e12f25fd856 ;;
              206) ref=05972a8b34faeb91c22b9a6283da84e45e7f0781 ;;
              198) ref=46a076d96fbf9b18868c45ddfd2dcc0e2077f2a5 ;;
              207) ref=ec2e2dbbdc61587911dda3dd5f868f14ab0733f4 ;;
            esac
            git -C "$RUNNER_TEMP/h11" checkout --quiet --detach "$ref"
            PYTHONPATH="$RUNNER_TEMP/h11" python -m pytest -q \
              "$RUNNER_TEMP/h11/h11/tests/test_connection.py" \
              "$RUNNER_TEMP/h11/h11/tests/test_io.py" \
              > "$RUNNER_TEMP/quotient/pytest-$name.log" 2>&1 || {
                cat "$RUNNER_TEMP/quotient/pytest-$name.log"
                echo "ORIGINAL_NATIVE_UPSTREAM_TEST_FAILURE_$name"
                exit 1
              }
            echo "$name @ $ref:"
            tail -n 2 "$RUNNER_TEMP/quotient/pytest-$name.log"
          done
      - name: Retain source-pinned finite and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mathgraph-h11-jpl-consequence-quotient
          path: |
            ${{ runner.temp }}/quotient/
            ${{ runner.temp }}/summary.stdout
          if-no-files-found: warn
