name: MathGraph Check - independent portable issue 872 patch qualification
on:
  push:
    branches:
      - mathgraph-one-consequential-pr958-20261015-v1
    paths:
      - 'research/mathgraph_pr958_one_finding_20261015/issue872_preserve_chomp.patch'
      - 'research/mathgraph_pr958_one_finding_20261015/ONE_FINDING_REPORT.json'
      - '.github/workflows/mathgraph-issue872-apply-diff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - name: Independently apply the portable verified fix to exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/research/mathgraph_pr958_one_finding_20261015/issue872_preserve_chomp.patch"
          TEST="$GITHUB_WORKSPACE/research/mathgraph_pr958_one_finding_20261015/mathgraph_pr958_test.go"
          TMP="$RUNNER_TEMP/pr958-native-patch-qualification"
          mkdir -p "$TMP"
          cd "$TMP"
          git init -q
          git remote add upstream https://github.com/goccy/go-yaml.git
          git fetch -q --depth=1 --no-tags upstream a34b94ecb553bb5a693296c30232a89026db79ca
          git checkout -q --detach a34b94ecb553bb5a693296c30232a89026db79ca
          test "$(git rev-parse HEAD)" = "a34b94ecb553bb5a693296c30232a89026db79ca"
          test "$(git hash-object ast/ast.go)" = "90a21fb64722f57c3610ac46ce525ba54113a9fd"
          git apply --check "$PATCH"
          git apply "$PATCH"
          test "$(git hash-object ast/ast.go)" = "03fd844ff712e2ae04204bde9f547b1ab7b3d3ec"
          test "$(git diff --name-only)" = "ast/ast.go"
          go test -count=1 -timeout=8m ./... >"$RUNNER_TEMP/issue872-original-suite.txt"
          cp "$TEST" ./mathgraph_pr958_test.go
          go test -count=1 -timeout=8m -run '^TestMathGraphNestedByteMarshalerInvariant$' . \
            >"$RUNNER_TEMP/issue872-native-130.txt"
          {
            echo "### Independent portable patch acceptance"
            echo "Source: goccy/go-yaml PR #958 exact head a34b94ecb553bb5a693296c30232a89026db79ca."
            echo "Portable patch applied cleanly to exactly one file; Git blob matches separately qualified repair."
            echo "Original upstream Go suite: PASS. Independent nested YAML tests: 130/130 PASS."
            echo "Issue #872 is inherited, separately scoped; no upstream Git push was attempted."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "MATHGRAPH_ISSUE872_PORTABLE_PATCH=VERIFIED_EXACT_BLOB_AND_NATIVE"
