name: MathGraph Check - one warranted followup repair issue 872
on:
  push:
    branches:
      - mathgraph-one-consequential-pr958-20261015-v1
    paths:
      - 'research/mathgraph_pr958_one_finding_20261015/issue872_native_repair.py'
      - '.github/workflows/mathgraph-issue872-native-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mathgraph-pr958-separate-issue-native-v1
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - name: Test out-of-scope issue 872 original, minimal change, full suite, and source ablation
        run: python3 research/mathgraph_pr958_one_finding_20261015/issue872_native_repair.py
      - name: Preserve source-exact Go witness and failed controls even on red
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mathgraph-issue872-native-followup-repair
          path: ${{ runner.temp }}/mathgraph-go-yaml-issue872-repair/
          if-no-files-found: warn
