name: MathGraph H100 LM-head CPU Gate

on:
  push:
    branches:
      - gpu-developmental-hardware-v1
    paths:
      - experiments/megakernel_h100/**
      - .github/workflows/mathgraph-megakernel-lmhead-cpu.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and unit controls (no GPU, no RunPod secret)
        run: |
          python -m compileall -q experiments/megakernel_h100
          python -m unittest discover -s experiments/megakernel_h100 -p 'test_*.py' -v
          python experiments/megakernel_h100/gpu_megakernel_gate.py --self-test

      - name: Audit pinned upstream compiled architecture without GPU
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          trap 'rm -rf "$source_dir"' EXIT
          git -C "$source_dir" init -q
          git -C "$source_dir" fetch -q --depth 1 https://github.com/HazyResearch/Megakernels.git 7309cec801537b61fea3b50d7dfe454a6cde578e
          git -C "$source_dir" checkout -q --detach FETCH_HEAD
          python experiments/megakernel_h100/h100_architecture_audit.py --repo "$source_dir" --fixture-layers 1 --executed-layers 1 --expect REJECTED_INVALID_LMHEAD_ARCHITECTURE
          python experiments/megakernel_h100/h100_architecture_audit.py --repo "$source_dir" --fixture-layers 2 --executed-layers 2 --expect REJECTED_INVALID_LMHEAD_ARCHITECTURE
          python experiments/megakernel_h100/h100_architecture_audit.py --repo "$source_dir" --fixture-layers 3 --executed-layers 2 --expect PARTIAL_PATH_LMHEAD_NOT_EXECUTED
          python experiments/megakernel_h100/h100_architecture_audit.py --repo "$source_dir" --fixture-layers 16 --executed-layers 16 --expect ELIGIBLE_FULL_MODEL_COMPATIBILITY_UNPROVEN

      - name: Retrieve authentic retained H100 depth artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 40492440974
          github-token: ${{ github.token }}
          name: mathgraph-h100-depth-diagnostic-40492440974
          path: depth_evidence

      - name: Independently audit reported depth evidence (no GPU)
        run: |
          python experiments/megakernel_h100/independent_depth_assurance.py \
            depth_evidence/remote_result.json \
            --out depth_evidence/independent_summary_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("depth_evidence/independent_summary_audit.json").read_text())
          assert r["status"] == "SUMMARY_CONSISTENT_NOT_RAW_NUMERICALLY_REVERIFIED"
          assert r["cases_checked"] == 7
          assert r["first_observed_rr_failure_depth"] == 12
          assert r["full16_top1_equal"] == {"rr_16": True, "dag_16": True}
          print("MATHGRAPH_H100_INDEPENDENT_SUMMARY_CHECK_PASS_RAW_NOT_RECOMPUTED")
          PY

      - name: Retain independent assessment
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-h100-independent-depth-summary-check
          path: depth_evidence/independent_summary_audit.json
          if-no-files-found: warn

      - name: Download independent H100 six-input consequence evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 40573464365
          github-token: ${{ github.token }}
          name: mathgraph-h100-consequence-40573464365
          path: consequence_evidence

      - name: Verify paired witnesses and sufficient ranking margins on CPU
        run: |
          python experiments/megakernel_h100/independent_consequence_assurance.py \
            consequence_evidence/remote_result.json \
            --out consequence_evidence/witness_audit_replayed.json
          python experiments/megakernel_h100/consequence_ranking_certificate.py \
            consequence_evidence/remote_result.json \
            --out consequence_evidence/conditional_ranking_certificate.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("consequence_evidence/conditional_ranking_certificate.json")
          c = json.loads(p.read_text())
          assert c["status"] == "CONDITIONAL_RANKING_CERTIFICATES_RECORDED_NOT_RAW_REVERIFIED"
          assert c["cases_checked"] == 6
          assert c["cases_with_sufficient_ranking_margin"] == 6
          assert c["cases_with_observed_token_disagreement"] == 0
          assert c["raw_full_tensor_independently_replayed"] is False
          assert all(case["conditional_stability_certificate"] is True for case in c["cases"].values())
          print("MATHGRAPH_H100_SIX_OF_SIX_CONDITIONAL_TOKEN_RANKING_CERTIFICATES")
          PY

      - name: Retain CPU-generated H100 ranking certificate
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-h100-six-case-conditional-ranking
          path: |
            consequence_evidence/witness_audit_replayed.json
            consequence_evidence/conditional_ranking_certificate.json
          if-no-files-found: warn

      - name: Download authentic full BF16 logit evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 40597374153
          github-token: ${{ github.token }}
          name: mathgraph-h100-raw-logits-40597374153
          path: raw_logits_evidence

      - name: Independently replay complete vectors and certify exact native rank
        run: |
          python experiments/megakernel_h100/independent_full_logit_replay.py \
            raw_logits_evidence/remote_result.json \
            --out raw_logits_evidence/exhaustive_winner_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("raw_logits_evidence/exhaustive_winner_audit.json").read_text())
          assert r["status"] == "FULL_BF16_LOGIT_VECTOR_REPLAYED_NOT_INDEPENDENT_GPU_EXECUTION"
          assert r["cases_checked"] == 6
          assert r["pairs_of_logits_replayed"] == 6 * 128256
          assert r["top1_agreements"] == 6
          assert r["sufficient_ranking_margins"] == 5
          assert r["exhaustive_strict_winner_certificates"] == 6
          assert all(x["exhaustive_winner_gap"] > 0 for x in r["cases"].values())
          print("MATHGRAPH_FULL_VECTOR_EXHAUSTIVE_SIX_OF_SIX_WINNER_CERTIFICATES")
          PY

      - name: Retain independently generated exhaustive winner audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-h100-exhaustive-winner-audit
          path: raw_logits_evidence/exhaustive_winner_audit.json
          if-no-files-found: warn

      - name: Exhaustively probe counterfactual common-offset decision boundaries
        run: |
          python experiments/megakernel_h100/near_tie_counterfactual.py \
            raw_logits_evidence/remote_result.json \
            --out raw_logits_evidence/near_tie_counterfactual.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("raw_logits_evidence/near_tie_counterfactual.json").read_text())
          assert r["status"] == "COUNTERFACTUAL_DECISION_BOUNDARIES_NOT_GPU_REEXECUTION"
          assert r["cases_checked"] == 6
          assert r["strict_split_witnesses"] == 6
          assert r["budget_split_counts"] == {"0.05": 0, "0.1": 2, "0.2": 5, "0.25": 6}
          for key, case in r["cases"].items():
              assert case["reference_top1"] == case["native_top1"]
              assert case["boosted_winners_differ"] is True
              assert case["boosted_reference_top1"] != case["boosted_native_top1"]
              assert case["earliest_split_infimum"] < case["strict_midpoint_boost"] < case["split_interval_upper"]
          print("MATHGRAPH_COUNTERFACTUAL_ALL_SIX_FINITE_SPLITS_RECORDED_NO_GPU_REEXECUTION")
          PY

      - name: Retain bounded counterfactual threshold assessment
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-h100-counterfactual-near-tie
          path: raw_logits_evidence/near_tie_counterfactual.json
          if-no-files-found: warn

      - name: Retrieve real H100 repeated-execution evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 40599459515
          github-token: ${{ github.token }}
          name: mathgraph-h100-repeatability-40599459515
          path: repeat_evidence

      - name: Recompute pairwise native BF16 drift and decisive-token stability
        run: |
          python experiments/megakernel_h100/independent_repeat_variance.py \
            repeat_evidence/remote_result.json \
            --out repeat_evidence/independent_repeat_variance.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("repeat_evidence/independent_repeat_variance.json").read_text())
          assert d["schema"] == "mathgraph-h100-independent-repeat-variance-v1"
          assert d["status"] == "NATIVE_BF16_OUTPUTS_NONREPEATABLE_TOP1_STABLE"
          assert d["cases_checked"] == 6
          assert d["sampled_initial_states_equal"] is True
          assert d["reference_logit_bits_equal"] is True
          assert d["native_matches_reference_top1_in_all_six"] is True
          assert d["all_six_top1_winners_equal"] is True
          for s in ("rr", "dag"):
              assert d["by_scheduler"][s]["all_pairwise_bitwise_identical"] is False
              assert d["by_scheduler"][s]["pair_count"] == 3
              assert d["by_scheduler"][s]["min_changed_elements"] > 100000
              assert d["by_scheduler"][s]["max_changed_elements"] < 128256
          assert len(d["pairwise"]) == 9
          print("MATHGRAPH_H100_NATIVE_NONBITWISE_REFERENCE_STABLE_SIX_REPEATS")
          print(json.dumps({
              "status": d["status"], "by_scheduler": d["by_scheduler"],
              "all_six_top1_winners_equal": d["all_six_top1_winners_equal"],
              "reference_logit_bits_equal": d["reference_logit_bits_equal"],
          }, sort_keys=True))
          PY

      - name: Retain independent repeated-output variance assessment
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-h100-independent-repeat-variance
          path: repeat_evidence/independent_repeat_variance.json
          if-no-files-found: warn
