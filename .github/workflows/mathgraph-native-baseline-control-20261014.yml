name: MathGraph Check - original native CI blind-spot control
on:
  push:
    branches:
      - mathgraph-native-boundary-eval-20261014-v1
    paths:
      - 'research/mathgraph_native_boundary_20261014/baseline_control.py'
      - '.github/workflows/mathgraph-native-baseline-control-20261014.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mathgraph-original-native-suite-controls
  cancel-in-progress: false
jobs:
  unchanged-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - name: Run unchanged upstream original native package suites at pinned base commits
        run: python3 research/mathgraph_native_boundary_20261014/baseline_control.py
      - name: Retain unchanged native baseline receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mathgraph-native-unchanged-baseline-control
          path: ${{ runner.temp }}/mathgraph-native-original-suite-controls/
          if-no-files-found: warn
