name: MathGraph Check - one consequential finding on real PR 958
on:
  push:
    branches:
      - mathgraph-one-consequential-pr958-20261015-v1
    paths:
      - 'research/mathgraph_pr958_one_finding_20261015/**'
      - '.github/workflows/mathgraph-one-consequential-pr958.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mathgraph-one-real-pr-decision-v1
  cancel-in-progress: false
jobs:
  native-pr-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - name: Verify unchanged upstream Go test suites and 130 native metamorphic PR checks
        run: python3 research/mathgraph_pr958_one_finding_20261015/run.py
      - name: Preserve complete source-bound review evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mathgraph-pr958-one-finding-native-v1
          path: ${{ runner.temp }}/mathgraph-one-consequential-pr958/
          if-no-files-found: warn
