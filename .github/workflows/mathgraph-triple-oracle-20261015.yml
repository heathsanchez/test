name: MathGraph — independent triple-oracle corroboration
on:
  push:
    branches:
      - mathgraph-roundtrip-triple-oracle-20261015-v1
    paths:
      - 'research/mathgraph_roundtrip_triple_oracle_20261015/**'
      - '.github/workflows/mathgraph-triple-oracle-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-native-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - name: Install pinned independent Python YAML oracle
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mathgraph-third-venv"
          "$RUNNER_TEMP/mathgraph-third-venv/bin/python" -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
      - name: Replay unchanged 1088-case original Go native witness experiments
        run: |
          set -euo pipefail
          python3 research/mathgraph_roundtrip_witness_20261014/run.py
      - name: Independently test entire immutable corpus on PyYAML and classify agreements
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mathgraph-third-venv/bin/python" research/mathgraph_roundtrip_triple_oracle_20261015/replay.py --mode original
      - name: Demonstrate typed loss of independent corroboration and evidence withdrawal
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mathgraph-third-venv/bin/python" research/mathgraph_roundtrip_triple_oracle_20261015/replay.py --mode ablate-third
          "$RUNNER_TEMP/mathgraph-third-venv/bin/python" research/mathgraph_roundtrip_triple_oracle_20261015/replay.py --mode withdraw
      - name: Retain complete native and third-oracle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mathgraph-triple-oracle-20261015-native-evidence
          path: |
            ${{ runner.temp }}/mathgraph-roundtrip-native-receipts/
            ${{ runner.temp }}/mathgraph-triple-oracle-20261015/
          if-no-files-found: warn
