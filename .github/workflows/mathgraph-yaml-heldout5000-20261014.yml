name: MathGraph Check - unseen YAML 5000 string metamorphic transfer
on:
  push:
    branches:
      - mathgraph-roundtrip-unseen-witness-20261014-v1
    paths:
      - 'research/mathgraph_roundtrip_witness_20261014/heldout_native.py'
      - '.github/workflows/mathgraph-yaml-heldout5000-20261014.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mathgraph-yaml-unseen-heldout-5000-v1
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - name: Run independent untouched native inputs and original frozen repair on two repositories
        run: python3 research/mathgraph_roundtrip_witness_20261014/heldout_native.py
      - name: Retain complete native input outcomes, residual examples and source readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mathgraph-yaml-heldout5000-native-v1
          path: ${{ runner.temp }}/mathgraph-yaml-heldout-5000-native/
          if-no-files-found: warn
