name: MathGraph Check - issue-informed patch-blind YAML scalar grammar
on:
  push:
    branches:
      - mathgraph-yaml-scalar-grammar-20261014-v1
    paths:
      - 'research/mathgraph_yaml_scalar_20261014/**'
      - '.github/workflows/mathgraph-yaml-scalar-20261014.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mathgraph-patch-blind-numeric-grammar-v1
  cancel-in-progress: false
jobs:
  native-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - name: Run fixed grammar on source base, contributor head and automatic source ablation
        run: python3 research/mathgraph_yaml_scalar_20261014/run.py
      - name: Preserve case-level native Go receipts even on unexpected failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mathgraph-yaml-scalar-grammar-native-v1
          path: ${{ runner.temp }}/mathgraph-yaml-scalar-grammar-native/
          if-no-files-found: warn
