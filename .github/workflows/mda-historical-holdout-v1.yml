name: MDA Historical Holdout V1

on:
  push:
    paths:
      - "experiments/mda_historical_holdout_v1/historical_outcomes_v1.json"
      - ".github/workflows/mda-historical-holdout-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove adjudicator unchanged since blind freeze
        run: |
          set -euxo pipefail
          git diff --exit-code e3edcb5988384d2f67231f9acebaba524f915924 -- scripts/mda_historical_holdout_adjudicator_v1.py
          echo "ADJUDICATOR_UNCHANGED_SINCE_BLIND_FREEZE"

      - name: Run frozen historical holdout adjudicator
        run: |
          set -o pipefail
          python scripts/mda_historical_holdout_adjudicator_v1.py             experiments/mda_historical_holdout_v1/historical_outcomes_v1.json             | tee experiments/mda_historical_holdout_v1/adjudication_output.txt
          grep -F "HISTORICAL_HOLDOUT_ADJUDICATION_PASS" experiments/mda_historical_holdout_v1/adjudication_output.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-historical-holdout-v1
          path: |
            experiments/mda_historical_holdout_v1/FROZEN_MANIFEST.md
            experiments/mda_historical_holdout_v1/historical_outcomes_v1.json
            experiments/mda_historical_holdout_v1/historical_holdout_adjudication_v1.json
            experiments/mda_historical_holdout_v1/adjudication_output.txt
          if-no-files-found: warn
