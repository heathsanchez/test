name: Meta Development Selector V32

on:
  push:
    branches:
      - meta-development-selector-v32
    paths:
      - 'experiments/meta_development_selector_v32/**'
      - '.github/workflows/meta-development-selector-v32.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frozen V32 core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/meta_development_selector_v32/PROTOCOL.md)" = "aa403270feb4520f1fd5e25a8b0daae1825704e5"
          test "$(git hash-object experiments/meta_development_selector_v32/basis.py)" = "02f467a50492b82af7bf941ad6a713f36cff7752"
          test "$(git hash-object experiments/meta_development_selector_v32/kernel.py)" = "94e13b6b5f1469ab96e7b2e8f1beda30db617b88"

      - name: Syntax
        run: |
          python -m py_compile             experiments/meta_development_selector_v32/basis.py             experiments/meta_development_selector_v32/kernel.py             experiments/meta_development_selector_v32/challenge_pack.py             experiments/meta_development_selector_v32/run_v32.py

      - name: Run V32
        shell: bash
        run: |
          set -o pipefail
          cd experiments/meta_development_selector_v32
          python -u run_v32.py | tee run.log

      - name: Summary
        if: always()
        shell: bash
        run: |
          cd experiments/meta_development_selector_v32
          if [ -f evidence.json ]; then
            python - <<'PY'
          import json
          j=json.load(open("evidence.json"))
          print("VERDICT",j.get("verdict"))
          for k,v in j.get("gates",{}).items():
              print(k,v)
          PY
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-development-selector-v32-evidence
          path: |
            experiments/meta_development_selector_v32/evidence.json
            experiments/meta_development_selector_v32/run.log
          if-no-files-found: ignore
