name: MathGraph Check — frozen non-regex method acquisition
on:
  push:
    branches:
      - research/mgcheck-nonregex-method-acquisition-20261015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgcheck-nonregex-acquisition-20261015
  cancel-in-progress: false

jobs:
  original-native-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax/build preflight for fixed generic method learner
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/mg-method-preflight" research/mgcheck_nonregex_genesis_20261015/nonregex_method_learner.go
          go build -o "$RUNNER_TEMP/mg-regex-incumbent-preflight" research/mgcheck_nonregex_genesis_20261015/prior_regex_incumbent.go
          bash -n research/mgcheck_nonregex_genesis_20261015/run_native_experiment.sh
          echo "PRE_FIX_UNTUNED_COMPILATION_SUCCESS"
      - name: Run frozen original-source method acquisition → transfer → independent challenge
        shell: bash
        run: |
          set -euo pipefail
          bash research/mgcheck_nonregex_genesis_20261015/run_native_experiment.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mgcheck-nonregex-native-acquisition-original
          path: nonregex-native-evidence/
          if-no-files-found: warn
