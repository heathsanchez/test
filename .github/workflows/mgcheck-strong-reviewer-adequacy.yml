name: MathGraph Check - Strong Reviewer Patch Adequacy

on:
  push:
    branches: [research/mgcheck-reviewbench-strong-reviewer-value-20261015]
    paths:
      - research/reviewbench_20261015/STRONG_BASELINE_REPAIR_ADEQUACY_FROZEN.md
      - research/reviewbench_20261015/strong_reviewer_pagination_test.go
      - research/reviewbench_20261015/replay_strong_reviewer_adequacy.py
      - .github/workflows/mgcheck-strong-reviewer-adequacy.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  source-native-published-baseline-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Verify pinned audit script source syntax
        run: |
          python3 -m py_compile research/reviewbench_20261015/replay_strong_reviewer_adequacy.py
          python3 -m py_compile research/reviewbench_20261015/replay_semantic.py
      - name: Fetch original ReviewBench mirror at frozen source revision
        run: |
          git init -q /tmp/mgcheck-reviewbench-strong-baseline
          git -C /tmp/mgcheck-reviewbench-strong-baseline remote add origin https://github.com/review-bench/k1LoW_gh-copilot-review.git
          git -C /tmp/mgcheck-reviewbench-strong-baseline fetch -q --depth=1 origin f98281938e63acd1d2df9b89d6af98dcf58c9fa8
          git -C /tmp/mgcheck-reviewbench-strong-baseline checkout -q --detach f98281938e63acd1d2df9b89d6af98dcf58c9fa8
          test "$(git -C /tmp/mgcheck-reviewbench-strong-baseline rev-parse HEAD)" = f98281938e63acd1d2df9b89d6af98dcf58c9fa8
      - name: Test published strong model pagination risks against previously qualified identity repair
        run: |
          python3 research/reviewbench_20261015/replay_strong_reviewer_adequacy.py /tmp/mgcheck-reviewbench-strong-baseline "$GITHUB_WORKSPACE/strong-reviewer-adequacy"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mgcheck-reviewbench-strong-reviewer-adequacy
          path: strong-reviewer-adequacy/
          retention-days: 60
