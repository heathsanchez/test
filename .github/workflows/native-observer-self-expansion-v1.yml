name: Native observer self-expansion causal gate V1

on:
  push:
    branches: [research/observer-self-expansion-20261016-v1]
    paths:
      - .github/workflows/native-observer-self-expansion-v1.yml
      - research/observer_self_expansion/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-observer-self-expansion-v1
  cancel-in-progress: false

jobs:
  observer-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      EXP: research/observer_self_expansion
      FROZEN: 1411485468304932172c845c272e791c7bbd1414
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove experiment protocol predates executable source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FROZEN" HEAD
          git cat-file -e "$FROZEN:$EXP/FROZEN_PROTOCOL.json"
          if git cat-file -e "$FROZEN:$EXP/engine.py" 2>/dev/null; then
            echo "NOT FROZEN BEFORE LEARNER" >&2
            exit 3
          fi
          python - <<'PY'
          import json
          p=json.load(open('research/observer_self_expansion/FROZEN_PROTOCOL.json'))
          assert p['candidate_horizon']==3
          assert p['old_frontier_size']==84
          assert p['extended_frontier_size']==155
          print('PASS_PREIMPLEMENTATION_PROTOCOL_FREEZE')
          PY
      - name: Learn and source-verify both generations ONLY on native deque
        run: |
          set -euo pipefail
          mkdir -p qualification
          python -B "$EXP/engine.py" develop --out qualification/source-development.json | tee qualification/development.log
          python - <<'PY'
          import json
          r=json.load(open('qualification/source-development.json'))
          assert r['G2_cold']['candidate_count']==84
          assert len(r['G2_cold']['winners'])==0
          assert r['G2_promoted']['candidate_count']==155
          assert len(r['G2_promoted']['winners'])==1
          assert 'CALL_O1' in r['O2']['program']
          assert r['full_information_executable_ledger']['outcome']=='TIE'
          print('PASS_GENERATION_DEPENDENT_NATIVE_SOURCE_CERTIFICATE')
          PY
          sha256sum qualification/source-development.json qualification/O1.capability.json qualification/O2.capability.json > qualification/selection-lock.sha256
      - name: Install protected independently maintained NumPy native backend
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: numpy==2.1.3
          python -c "import numpy; assert numpy.__version__ == '2.1.3'"
      - name: Freeze protected seed and run target without reselecting operations
        run: |
          set -euo pipefail
          seed="$GITHUB_SHA-$GITHUB_RUN_ID-observer-protected"
          printf '%s' "$seed" > qualification/protected-seed.txt
          python -B "$EXP/engine.py" target \
            --development qualification/source-development.json \
            --out qualification/target-native.json --seed "$seed" | tee qualification/target.log
          sha256sum -c qualification/selection-lock.sha256
      - name: Run independent interpreter plus exact original-grammar saturation
        run: |
          set -euo pipefail
          seed="$(cat qualification/protected-seed.txt)"
          python -B "$EXP/independent_oracle.py" \
            --development qualification/source-development.json \
            --target qualification/target-native.json \
            --seed "$seed" --out qualification/independent.json | tee qualification/independent.log
      - name: Qualify exact independent new-process cold executable replay
        run: |
          set -euo pipefail
          seed="$(cat qualification/protected-seed.txt)"
          python -B "$EXP/engine.py" restart \
            --development qualification/source-development.json \
            --out qualification/restart.json --seed "$seed" | tee qualification/restart.log
          python - <<'PY'
          import json
          dev=json.load(open('qualification/source-development.json'))
          target=json.load(open('qualification/target-native.json'))
          indep=json.load(open('qualification/independent.json'))
          restart=json.load(open('qualification/restart.json'))
          assert dev['G2_cold']['winner'] is None
          assert dev['G2_promoted']['winner'] is not None
          assert target['G1']['ok'] and target['G2']['ok']
          assert target['protected_count']==54
          assert indep['old_G2_winners']==0
          assert indep['target_first']['passed']==54
          assert indep['target_second']['passed']==54
          assert target['physical_parent_unlink'] and not target['ablation']['ok']
          assert target['source_reverified']['ok'] and target['restored']['ok']
          assert target['full_information_executable_ledger']['outcome']=='TIE'
          assert target['native_direct_index_baseline']['correct']==54
          assert restart['verdict']=='PASS_COLD_PROCESS_RESTART'
          print('PASS_BOUNDED_NATIVE_REPRESENTATION_GROWTH_BASELINE_TIE')
          PY
          git rev-parse HEAD > qualification/commit-sha.txt
      - name: Archive exact source, decisions, costs and counterfactual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-self-expansion-native-v1-evidence
          path: |
            qualification/
            research/observer_self_expansion/FROZEN_PROTOCOL.json
            research/observer_self_expansion/engine.py
            research/observer_self_expansion/independent_oracle.py
            .github/workflows/native-observer-self-expansion-v1.yml
          retention-days: 30
