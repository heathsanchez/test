name: Neighborhood Genesis V36

on:
  push:
    branches:
      - neighborhood-genesis-v36
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V36 core
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=52ce8f19cff4521755e836ea180cda124a886915
          git merge-base --is-ancestor "$FREEZE" HEAD
          changed="$(git diff --name-only "$FREEZE"..HEAD --             experiments/neighborhood_genesis_v36/PROTOCOL.md             experiments/neighborhood_genesis_v36/basis.py             experiments/neighborhood_genesis_v36/kernel.py             experiments/neighborhood_genesis_v36/FREEZE.json)"
          if [ -n "$changed" ]; then
            echo "Frozen V36 core changed after scientific freeze:"
            echo "$changed"
            exit 1
          fi

      - name: Syntax check
        run: |
          python -m py_compile             experiments/neighborhood_genesis_v36/basis.py             experiments/neighborhood_genesis_v36/kernel.py             experiments/neighborhood_genesis_v36/challenge_pack.py             experiments/neighborhood_genesis_v36/run.py

      - name: Run frozen V36 experiment
        working-directory: experiments/neighborhood_genesis_v36
        run: |
          python run.py | tee run.log

      - name: Evidence summary
        if: always()
        working-directory: experiments/neighborhood_genesis_v36
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence.json")
          if not p.exists():
              print("No evidence.json produced")
              raise SystemExit(1)
          e=json.loads(p.read_text())
          print("verdict:",e.get("verdict"))
          print("full_pass:",e.get("full_pass"))
          for k,v in sorted(e.get("gates",{}).items()):
              print(k,v)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-genesis-v36-evidence
          path: |
            experiments/neighborhood_genesis_v36/evidence.json
            experiments/neighborhood_genesis_v36/run.log
            experiments/neighborhood_genesis_v36/FREEZE.json
            experiments/neighborhood_genesis_v36/PROTOCOL.md
