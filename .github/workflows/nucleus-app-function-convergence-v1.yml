name: Nucleus app function convergence v1

on:
  push:
    branches: [nucleus-app-function-convergence-v1]
    paths:
      - ".github/workflows/nucleus-app-function-convergence-v1.yml"
      - "metatron-kernel/src/typecheck.rs"
      - "metatron-kernel/src/checker.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  ARENA_ARTIFACT: "11272848230"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build current candidate
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus

      - name: Fetch immutable Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/a.zip
          unzip -q /tmp/a.zip -d /tmp/a
          tar --no-same-owner -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/tests

      - name: Trace converged application-function-type residuals
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/app-function-convergence-v1
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time

          targets = [
              ("init-prelude", "/tmp/tests/good/init-prelude.ndjson"),
              ("fueled-chain", "/tmp/tests/good/perf/fueled-chain.ndjson"),
              ("magma-list-pair-n7", "/tmp/tests/good/perf/magma-list-pair-n7.ndjson"),
          ]
          results = {}
          env = os.environ | {
              "NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE": "1",
              "NUCLEUS_TRACE_DOWNSTREAM": "1",
          }
          for name, path in targets:
              started = time.monotonic()
              with open(path, "rb") as source:
                  q = subprocess.run(
                      ["/tmp/nucleus"],
                      stdin=source,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,
                      timeout=30,
                      env=env,
                  )
              lines = q.stderr.decode(errors="replace").splitlines()
              results[name] = {
                  "exit": q.returncode,
                  "seconds": time.monotonic() - started,
                  "application_function_type": [
                      line for line in lines
                      if line.startswith("NUCLEUS_APPLICATION_FUNCTION_TYPE:")
                  ][-10:],
                  "application_function_exposure": [
                      line for line in lines
                      if line.startswith("NUCLEUS_APPLICATION_FUNCTION_EXPOSURE:")
                  ][-10:],
                  "downstream": [
                      line for line in lines
                      if line.startswith("NUCLEUS_DOWNSTREAM:")
                  ][-10:],
              }
          out = {
              "schema": "nucleus-app-function-convergence-v1",
              "sha": os.environ["GITHUB_SHA"],
              "results": results,
          }
          print(json.dumps(out, indent=2))
          pathlib.Path(
              "metatron-kernel/evidence-out/app-function-convergence-v1/result.json"
          ).write_text(json.dumps(out, indent=2) + "\n")
          assert all(v["exit"] == 2 for v in results.values()), results
          assert all(v["application_function_type"] for v in results.values()), results
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-app-function-convergence-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/app-function-convergence-v1
          if-no-files-found: error
