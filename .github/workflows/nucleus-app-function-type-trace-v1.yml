name: Nucleus App Function Type Trace v1

on:
  push:
    branches: [nucleus-crystal-app-function-type-trace-v1]
    paths:
      - ".github/workflows/nucleus-app-function-type-trace-v1.yml"
      - "metatron-kernel/src/typecheck.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-app-function-type-trace-v1
  cancel-in-progress: true

env:
  BASE_SHA: 98f87d9e66fb97987427d68180f51a653d626fdb
  ARENA_ARTIFACT: "10712869614"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable

      - name: Build diagnostic candidate and exact authority
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/art /tmp/tests /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Prove instrumentation is verdict-identical and classify frontier
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/app-function-type-trace-v1
          python3 - <<'PY'
          import collections,json,os,pathlib,re,subprocess
          root=pathlib.Path("/tmp/tests")
          base=pathlib.Path("/tmp/base/metatron-kernel/target/release/metatron-kernel")
          cand=pathlib.Path("metatron-kernel/target/release/metatron-kernel").resolve()

          def rr(binary,p,env_extra=None):
              env=os.environ.copy()
              if env_extra: env.update(env_extra)
              with p.open("rb") as f:
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                                   stderr=subprocess.PIPE,timeout=180,env=env)
              return q.returncode,q.stderr.decode(errors="replace")

          rows=[]
          reason_counts=collections.Counter()
          by_reason={}
          for bucket,expected in [("good",0),("bad",1)]:
              for p in sorted((root/bucket).rglob("*.ndjson")):
                  name=str(p.relative_to(root/bucket)).removesuffix(".ndjson")
                  brc,_=rr(base,p)
                  crc,err=rr(cand,p,{"NUCLEUS_TRACE_DOWNSTREAM":"1","NUCLEUS_TRACE_RESIDUAL":"1"})
                  assert crc==brc,(name,brc,crc)
                  reason=None
                  if crc in (2,3):
                      downs=[x for x in err.splitlines() if "NUCLEUS_DOWNSTREAM:" in x]
                      residuals=[x for x in err.splitlines() if "NUCLEUS_RESIDUAL:" in x]
                      terminal=downs[-1] if downs else (residuals[-1] if residuals else "untraced")
                      m=re.search(r"reason=([^:]+)$",terminal)
                      reason=m.group(1) if m else (
                          terminal.split("NUCLEUS_RESIDUAL:",1)[1] if "NUCLEUS_RESIDUAL:" in terminal else "untraced"
                      )
                      reason_counts[reason]+=1
                      by_reason.setdefault(reason,[]).append(name)
                  rows.append({"test":name,"expected":expected,"base":brc,"candidate":crc,"reason":reason})

          assert len(rows)==193
          assert sum(r["candidate"]==0 for r in rows)==103
          assert sum(r["candidate"]==1 for r in rows)==60
          assert sum(r["candidate"] in (2,3) for r in rows)==30
          apps=by_reason.get("application-function-type",[])
          assert len(apps)==11,(len(apps),apps,dict(reason_counts))

          traces={}
          root_classes=collections.Counter()
          root_examples={}
          for name in apps:
              row=next(r for r in rows if r["test"]==name)
              bucket="good" if row["expected"]==0 else "bad"
              p=root/bucket/(name+".ndjson")
              rc,err=rr(cand,p,{
                  "NUCLEUS_TRACE_DOWNSTREAM":"1",
                  "NUCLEUS_TRACE_RESIDUAL":"1",
                  "NUCLEUS_TRACE_APP_FUNCTION_TYPE":"1",
              })
              assert rc==row["candidate"]
              marks=[x for x in err.splitlines() if "NUCLEUS_APP_FUNCTION_TYPE:" in x]
              assert marks,(name,err[-4000:])
              first=marks[0]
              last=marks[-1]

              def classify(line):
                  if "judgment=UNKNOWN:reason=" in line:
                      return "unknown:"+line.split("judgment=UNKNOWN:reason=",1)[1]
                  if ":expose=UNKNOWN:reason=" in line:
                      return "expose-unknown:"+line.split(":expose=UNKNOWN:reason=",1)[1]
                  if ":expose=neutral:" in line:
                      m=re.search(r"head=([^:]+):head_id=([^:]+):spine=(\d+)",line)
                      return "neutral:"+((":".join(m.groups())) if m else "unparsed")
                  if ":expose=sort:" in line: return "rigid-sort"
                  if ":expose=lam:" in line: return "rigid-lam"
                  if ":expose=natlit:" in line: return "rigid-natlit"
                  if "type=sort" in line: return "type-sort"
                  if "judgment=REFUTED:reason=" in line:
                      return "refuted:"+line.split("judgment=REFUTED:reason=",1)[1]
                  return "other"

              root_class=classify(first)
              terminal_class=classify(last)
              root_classes[root_class]+=1
              root_examples.setdefault(root_class,[]).append(name)
              traces[name]={
                  "expected":row["expected"],"rc":rc,
                  "mark_count":len(marks),
                  "root_mark":first,
                  "terminal_mark":last,
                  "root_class":root_class,
                  "terminal_class":terminal_class,
                  "marks":marks[-80:],
              }

          out={
              "schema":"nucleus-app-function-type-trace-v1",
              "base_sha":os.environ["BASE_SHA"],
              "candidate_sha":os.environ["GITHUB_SHA"],
              "verdict_identical":True,
              "counts":{"accept":103,"reject":60,"residual":30},
              "reason_counts":dict(reason_counts),
              "by_reason":by_reason,
              "application_count":len(apps),
              "application_cases":apps,
              "root_class_counts":dict(root_classes),
              "root_class_examples":root_examples,
              "traces":traces,
          }
          pathlib.Path("metatron-kernel/evidence-out/app-function-type-trace-v1/result.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({
              "application_cases":apps,
              "root_class_counts":out["root_class_counts"],
              "root_class_examples":out["root_class_examples"],
              "terminal_classes":{k:v["terminal_class"] for k,v in traces.items()},
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-app-function-type-trace-${{ github.sha }}
          path: metatron-kernel/evidence-out/app-function-type-trace-v1
          if-no-files-found: warn
