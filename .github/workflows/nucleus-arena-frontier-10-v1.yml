name: Nucleus Arena frontier 10 v1

on:
  push:
    branches: [nucleus-lazy-delta-recovery-v3]
    paths:
      - ".github/workflows/nucleus-arena-frontier-10-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test and build candidate
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus

      - name: Fetch pinned Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests

      - name: Reclose exact 196-case frontier
        env:
          NUCLEUS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/arena-frontier-10-v1
          ulimit -s 8192
          python3 - <<'PY'
          import collections, hashlib, json, os, pathlib, subprocess, time

          rows=[]
          for bucket,expected in (("good",0),("bad",1)):
              root=pathlib.Path("/tmp/arena-tests")/bucket
              for fixture in sorted(root.rglob("*.ndjson")):
                  started=time.monotonic()
                  with fixture.open("rb") as source:
                      process=subprocess.run(
                          ["/tmp/nucleus"], stdin=source, stdout=subprocess.DEVNULL,
                          stderr=subprocess.PIPE, timeout=30,
                          env=os.environ|{"NUCLEUS_TRACE_DOWNSTREAM":"1"})
                  rows.append({
                      "test":str(fixture.relative_to(root)),
                      "expected":expected,
                      "actual":process.returncode,
                      "seconds":time.monotonic()-started,
                      "stderr":process.stderr.decode(errors="replace"),
                      "fixture_sha256":hashlib.sha256(fixture.read_bytes()).hexdigest(),
                  })

          counts={
              "accept":sum(r["expected"]==0 and r["actual"]==0 for r in rows),
              "reject":sum(r["expected"]==1 and r["actual"]==1 for r in rows),
              "unknown":sum(r["actual"]==2 for r in rows),
          }
          wrong=[r for r in rows if r["actual"] in (0,1) and r["actual"]!=r["expected"]]
          errors=[r for r in rows if r["actual"] not in (0,1,2)]
          unknowns=sorted(r["test"].removesuffix(".ndjson") for r in rows if r["actual"]==2)
          expected_unknowns=sorted([
              "init-prelude",
              "perf/args-before-unfold",
              "perf/fueled-chain",
              "perf/grind-ring-5",
              "perf/magma-list-deep-n21",
              "perf/magma-list-deep-n36",
              "perf/magma-list-pair-n21",
              "perf/magma-list-pair-n7",
              "perf/shared-subterm",
              "tutorial/082_RBTree.id_spec",
          ])
          report={
              "schema":"nucleus-arena-frontier-10-v1",
              "candidate_sha":os.environ["NUCLEUS_SHA"],
              "arena_sha":"b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42",
              "artifact_id":11272848230,
              "counts":counts,
              "wrong":wrong,
              "errors":errors,
              "unknowns":unknowns,
              "rows":rows,
          }
          output=pathlib.Path("metatron-kernel/evidence-out/arena-frontier-10-v1/result.json")
          output.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps({k:v for k,v in report.items() if k!="rows"},sort_keys=True))

          assert len(rows)==196, len(rows)
          assert counts=={"accept":115,"reject":71,"unknown":10}, counts
          assert not wrong, wrong
          assert not errors, errors
          assert unknowns==expected_unknowns, unknowns
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-arena-frontier-10-${{ github.sha }}
          path: metatron-kernel/evidence-out/arena-frontier-10-v1
          if-no-files-found: error
