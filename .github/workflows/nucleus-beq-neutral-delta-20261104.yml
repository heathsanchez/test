name: Nucleus checked source-neutral delta Nat.beq_refl RED GREEN
on:
  push:
    branches: [research/nucleus-budget4x-qualification-20261104]
    paths:
      - '.github/workflows/nucleus-beq-neutral-delta-20261104.yml'
      - 'experiments/nucleus-beq-neutral-delta-20261104/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin a2578e77079719ff2064f910bd82fd01d8e120b6
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore frozen source and qualified 4x binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/beq-qualified /tmp/beq-source
          gh api repos/heathsanchez/test/actions/artifacts/13269133385/zip > /tmp/binary.zip
          printf '%s  %s\n' 689749feedc5025f0672dd7e7b091944f700f5b15c9a8105753341db38575d22 /tmp/binary.zip | sha256sum -c -
          unzip -q /tmp/binary.zip -d /tmp/beq-qualified
          gh api repos/heathsanchez/test/actions/artifacts/13268572042/zip > /tmp/source.zip
          printf '%s  %s\n' 00ce34eb4e8bb6e9b5fd8d5223bb07ef613364e8ece1f4fcc6cddb24804118b2 /tmp/source.zip | sha256sum -c -
          unzip -q /tmp/source.zip -d /tmp/beq-source
          zstd -d /tmp/beq-source/next-frontier.ndjson.zst -o /tmp/beq-prefix.ndjson
          printf '%s  %s\n' d1c35f6a0de8644817b404e225a16de460e897e0b34c129fcb2a37483e630738 /tmp/beq-prefix.ndjson | sha256sum -c -
      - name: Generate exact native regression fixtures
        run: |
          python3 experiments/nucleus-nat-closure-20261104/generate_fixtures.py --out /tmp/nat-fixtures
          python3 experiments/nucleus-parameter-telescope-20261104/prepare.py
          python3 experiments/nucleus-nullary-enum-20261104/prepare.py
      - name: Baseline RED and one source-neutral delta candidate GREEN
        run: python3 experiments/nucleus-beq-neutral-delta-20261104/runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-beq-neutral-delta-${{ github.sha }}
          path: |
            /tmp/nucleus-beq-neutral-delta/*.json
            /tmp/nucleus-beq-neutral-delta/*.log
            /tmp/nucleus-beq-neutral-delta/candidate/*.patch
            /tmp/nucleus-beq-neutral-delta/candidate/*.log
            /tmp/nucleus-beq-neutral-delta/candidate/nucleus
            /tmp/nucleus-beq-neutral-delta/red/stderr
            /tmp/nucleus-beq-neutral-delta/green/stderr
