name: Nucleus beta entry qualification
on:
  push:
    branches: [research/nucleus-beta-entry-20261126]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      NUCLEUS_EXPERIMENTAL_RELEVANCE: '1'
      NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA: '1'
      NUCLEUS_EXPERIMENTAL_DEMAND_MAJOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify previously qualified source and build
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/nucleus-beta-entry"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$OUT/source-tree.txt"
          test "$(cat "$OUT/source-tree.txt")" = 362242c265ee2b1758645c78ad141ad78bf6f8c2
          python3 -m py_compile metatron-kernel/arena.py metatron-kernel/scripts/qualify_beta_entry_20261126.py
          cargo test --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          sha256sum metatron-kernel/target/release/metatron-kernel metatron-kernel/arena.py metatron-kernel/arena-flags.json > "$OUT/sha256.txt"
      - name: Exact current beta exports and frozen launch configuration
        run: |
          set -euxo pipefail
          python3 metatron-kernel/scripts/qualify_beta_entry_20261126.py "$RUNNER_TEMP/nucleus-beta-entry"
      - name: Preserve all original 212 legacy verdicts through the entry point
        run: |
          set -euxo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/current212.zip" | sha256sum -c -
          python3 metatron-kernel/scripts/c239_full_corpus_stack128.py \
            --archive "$RUNNER_TEMP/current212.zip" \
            --checker "$PWD/metatron-kernel/arena.py" \
            --flags experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json \
            --out "$RUNNER_TEMP/nucleus-beta-entry"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-beta-entry-evidence
          path: ${{ runner.temp }}/nucleus-beta-entry/
          if-no-files-found: error
          retention-days: 30
