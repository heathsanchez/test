name: Nucleus bidirectional Lambda-Pi protected requalification

on:
  push:
    branches: [nucleus-bidirectional-lambda-pi-v1]
    paths:
      - ".github/workflows/nucleus-bidirectional-lambda-pi-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Bind exact certified-projection source tree
        run: |
          set -euo pipefail
          printf 'checker_source_tree=%s\n' "$(git rev-parse HEAD:metatron-kernel)"
          printf 'qualification_commit=%s\n' "$GITHUB_SHA"

      - name: Verify source equation regression first
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml symbolic_nat_sub_succ_zero_is_exact_source_equation -- --exact --nocapture || {
            cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml symbolic_nat_sub_succ_zero_is_exact_source_equation -- --nocapture
            exit 1
          }

      - name: Build and test corrected Nucleus
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus

      - name: Fetch immutable 196-case Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests metatron-kernel/evidence-out/final-qualification-v1
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests

      - name: Require a real Nat.modCore_lt proof rather than a partial repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,os,pathlib,subprocess,sys
          sys.path.insert(0,'.github/scripts')
          from nucleus_succle_separator import extract,false_index
          root=pathlib.Path('/tmp/arena-tests')
          names_to_check={
            'init-prelude':'eac8baf0fd48f5e7ccada755b36823d402a1e980882818995ade19cffe15a2c5',
            'perf/magma-list-pair-n7':'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'}
          rows=[]
          for name,digest in names_to_check.items():
            data=(root/'good'/(name+'.ndjson')).read_bytes()
            assert hashlib.sha256(data).hexdigest()==digest
            namemap={0:''};prefix=[];found=False
            for line in data.splitlines(keepends=True):
              obj=json.loads(line);prefix.append(line)
              if 'in' in obj:
                v=obj.get('str',obj.get('num'))
                ancestor=namemap.get(v['pre'],'')
                namemap[obj['in']]=ancestor+('.' if ancestor else '')+str(v.get('str',v.get('i')))
              if 'thm' in obj and namemap.get(obj['thm']['name'])=='Nat.modCore_lt':
                found=True;break
            assert found,name
            body=b''.join(prefix)
            p=subprocess.run(['/tmp/nucleus'],input=body,stdout=subprocess.DEVNULL,
              stderr=subprocess.PIPE,timeout=45,
              env=os.environ|{'NUCLEUS_TRACE_DOWNSTREAM':'1','NUCLEUS_TRACE_BIDIR_LAMBDA':'1',
                               'NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE':'1'})
            trace=p.stderr.decode(errors='replace').splitlines()
            row={'name':name,'rc':p.returncode,'sha256':hashlib.sha256(body).hexdigest(),
                 'bidir_proven':sum('NUCLEUS_BIDIR_LAMBDA:proved' in s for s in trace),
                 'bidir_attempts':[s for s in trace if 'NUCLEUS_BIDIR_LAMBDA:attempt' in s][-12:],
                 'terminal':[s for s in trace if 'NUCLEUS_DOWNSTREAM:' in s][-3:]}
            print('MODCORE_TEST='+json.dumps(row),flush=True)
            rows.append(row)
            assert p.returncode in (0,2),row
          for name,body,valid in [
             ('false-index',false_index(extract((root/'good/init-prelude.ndjson').read_bytes())),False),
             ('nested-unused-param',(root/'bad/bugs/nested-unused-param.ndjson').read_bytes(),False)]:
            p=subprocess.run(['/tmp/nucleus'],input=body,stdout=subprocess.DEVNULL,timeout=30)
            print('NEGATIVE_TEST='+json.dumps({'name':name,'rc':p.returncode}),flush=True)
            assert p.returncode in ((1,2) if name=='false-index' else (1,))
          path=pathlib.Path('metatron-kernel/evidence-out/final-qualification-v1/modcore-bidir.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(rows,indent=2))
          assert sum(r['rc']==0 for r in rows)>=1, 'No real Nat.modCore_lt proof earned'
          PY

      - name: Reclose corrected 196-case frontier
        run: |
          set -euo pipefail
          ulimit -s 8192
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time

          rows = []
          for bucket, expected in (("good", 0), ("bad", 1)):
              root = pathlib.Path("/tmp/arena-tests") / bucket
              for fixture in sorted(root.rglob("*.ndjson")):
                  started = time.monotonic()
                  with fixture.open("rb") as source:
                      process = subprocess.run(
                          ["/tmp/nucleus"],
                          stdin=source,
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.PIPE,
                          timeout=30,
                          env=os.environ | {"NUCLEUS_TRACE_DOWNSTREAM": "1", "NUCLEUS_TRACE_NAT_SUBZERO": "1"},
                      )
                  rows.append({
                      "test": str(fixture.relative_to(root)),
                      "expected": expected,
                      "actual": process.returncode,
                      "seconds": time.monotonic() - started,
                      "stderr": process.stderr.decode(errors="replace"),
                      "fixture_sha256": hashlib.sha256(fixture.read_bytes()).hexdigest(),
                  })

          counts = {
              "accept": sum(r["expected"] == 0 and r["actual"] == 0 for r in rows),
              "reject": sum(r["expected"] == 1 and r["actual"] == 1 for r in rows),
              "unknown": sum(r["actual"] == 2 for r in rows),
          }
          wrong = [r for r in rows if r["actual"] in (0, 1) and r["actual"] != r["expected"]]
          errors = [r for r in rows if r["actual"] not in (0, 1, 2)]
          unknowns = sorted(r["test"].removesuffix(".ndjson") for r in rows if r["actual"] == 2)
          report = {
              "schema": "nucleus-fueled-inductives-v1-arena",
              "qualification_commit": os.environ["GITHUB_SHA"],
              "source_commit": os.environ["GITHUB_SHA"],
              "source_subtree": subprocess.check_output(["git", "rev-parse", "HEAD:metatron-kernel"], text=True).strip(),
              "arena_sha": os.environ["ARENA_SHA"],
              "artifact_id": int(os.environ["ARENA_ARTIFACT"]),
              "counts": counts,
              "wrong": wrong,
              "errors": errors,
              "unknowns": unknowns,
              "rows": rows,
          }
          output = pathlib.Path("metatron-kernel/evidence-out/final-qualification-v1/arena.json")
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps({k: v for k, v in report.items() if k != "rows"}, sort_keys=True))

          assert len(rows) == 196, len(rows)
          assert counts["accept"] >= 119 and counts["reject"] >= 71 and counts["unknown"] <= 6, counts
          assert not wrong, wrong
          assert not errors, errors
          by_test = {r["test"].removesuffix(".ndjson"): r for r in rows}
          assert by_test["bugs/nested-unused-param"]["actual"] == 1, by_test["bugs/nested-unused-param"]
          PY


      - name: Name every remaining obligation and negative control
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('metatron-kernel/evidence-out/final-qualification-v1/arena.json')
          report=json.loads(p.read_text())
          for r in report['rows']:
            if r['actual']!=2: continue
            trace=[t for t in r['stderr'].splitlines() if t.startswith('NUCLEUS_DOWNSTREAM:')]
            print('CURRENT_UNKNOWN='+json.dumps({'case':r['test'],'terminal':trace[-2:],
              'seconds':round(r['seconds'],5),'sha256':r['fixture_sha256']}),flush=True)
          print('FULL_REPLAY='+json.dumps({k:v for k,v in report.items() if k not in ('rows',)}),flush=True)
          PY

      - name: Protect exact pinned false-index mutant
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,subprocess,sys
          sys.path.insert(0,'.github/scripts')
          from nucleus_succle_separator import extract,false_index
          path=pathlib.Path('/tmp/arena-tests/good/init-prelude.ndjson')
          bad=false_index(extract(path.read_bytes()))
          sha=hashlib.sha256(bad).hexdigest()
          assert sha=='2a090edfcfa2a16191f17a433617aaf045fc9b11cd0e2a93405b705d8a899688',sha
          p=subprocess.run(['/tmp/nucleus'],input=bad,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=30)
          print('FALSE_INDEX_PROTECTED_RC='+str(p.returncode),flush=True)
          assert p.returncode in (1,2),'False-index proof must never be ACCEPTed'
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-bidir-lambda-pi-196-${{ github.sha }}
          path: metatron-kernel/evidence-out/final-qualification-v1
          if-no-files-found: warn
