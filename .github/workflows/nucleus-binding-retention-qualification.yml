name: Independent Nucleus exact binding retention qualification
on:
  push:
    branches: [research/nucleus-exact-binding-retention-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      ARENA_SHA: d7f74a9e67459e2c251d608f524dc5efc6dc223c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: cachix/install-nix-action@v31
      - name: Exact original independent source compile and fixture retrieval
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-retention-evidence /tmp/frozen-pack /tmp/frozen-inputs
          # The candidate source and complete tree are preserved; original baseline is ff003e7.
          git rev-parse HEAD > /tmp/nucleus-retention-evidence/workflow-sha.txt
          git rev-parse HEAD:metatron-kernel > /tmp/nucleus-retention-evidence/kernel-tree.txt
          cp /tmp/nucleus-retention-evidence/kernel-tree.txt /tmp/nucleus-retention-evidence/source-tree.txt
          git diff dad309eb369b9e48c0a896e9d38c383d3e21ef6a HEAD -- metatron-kernel > /tmp/nucleus-retention-evidence/source-delta.patch
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/frozen.zip
          sha256sum /tmp/frozen.zip > /tmp/nucleus-retention-evidence/archive.sha256
          unzip -q /tmp/frozen.zip -d /tmp/frozen-pack
          tar --no-same-owner -xzf /tmp/frozen-pack/lean-arena-tests.tar.gz -C /tmp/frozen-inputs
      - name: Complete native suite and explicitly accounted incumbent closure failure
        run: |
          python3 - <<'PY'
          import os,subprocess,pathlib,json,re
          out=pathlib.Path('/tmp/nucleus-retention-evidence')
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          for f in ('RELEVANCE','CONTEXT_BINDER','TYPED_LINEAGE','SUBSTITUTION_RECLOSURE','TYPED_VALUE_NORMALIZATION','PROJECTION_CONTEXT','PROJECTION_CROSSFRAME_512','TYPED_RECEIVER','SOURCE_PAIR_DEPTH8','POLYMORPHIC_PROP_IRREL','PROP_SINGLETON_2P1F','EXPECTED_LAMBDA'):
            env['NUCLEUS_EXPERIMENTAL_'+f]='1'
          env['NUCLEUS_FROZEN196']='/tmp/frozen-inputs'
          cmd=['cargo','test','--release','--locked','--features','diagnostics','--manifest-path','metatron-kernel/Cargo.toml','--no-fail-fast','--','--include-ignored','--nocapture']
          p=subprocess.run(cmd,env=env,capture_output=True,timeout=900)
          raw=p.stdout+p.stderr
          (out/'native-all-including-ignored.log').write_bytes(raw)
          summary=dict(rc=p.returncode,command=cmd,env={k:v for k,v in env.items() if k.startswith('NUCLEUS_')},summaries=re.findall(r'test result:.*',raw.decode(errors='replace')),failures=[s for s in raw.decode(errors='replace').splitlines() if 'FAILED' in s or 'panicked at' in s],boundary='Failures are preserved as research results, not silently promoted; no skips requested.')
          (out/'native-all-including-ignored.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2),flush=True)
          failures=[line for line in raw.decode(errors='replace').splitlines() if line.startswith('test ') and ' ... FAILED' in line]
          assert failures in ([],['test all_seven_complete_positive_exports_accept ... FAILED']),failures
          PY
      - name: Exact source-owned profile at unchanged budgets
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path("/tmp/frozen-inputs")
          out=pathlib.Path("/tmp/nucleus-retention-evidence")
          manifest=pathlib.Path("metatron-kernel/evidence/performance/owned-environment-2026-10-13/nucleus-owned-environment-frozen196.json")
          rows={r["case"]:r for r in json.loads(manifest.read_text())["modes"]["origin"]["rows"]}
          env={k:v for k,v in os.environ.items() if not k.startswith("NUCLEUS_")}
          for f in ("RELEVANCE","CONTEXT_BINDER","TYPED_LINEAGE","SUBSTITUTION_RECLOSURE","TYPED_VALUE_NORMALIZATION","PROJECTION_CONTEXT","PROJECTION_CROSSFRAME_512","TYPED_RECEIVER","SOURCE_PAIR_DEPTH8","POLYMORPHIC_PROP_IRREL","PROP_SINGLETON_2P1F","EXPECTED_LAMBDA"):
              env["NUCLEUS_EXPERIMENTAL_"+f]="1"
          env["NUCLEUS_ASSURANCE_SOURCE_OWNED_PROBE"]="1"
          env["NUCLEUS_ASSURANCE_REPLAY_PROFILE"]="1"
          for f in ():
              env["NUCLEUS_TRACE_"+f]="1"
          binary=str(pathlib.Path("metatron-kernel/target/release/metatron-kernel").resolve())
          reports=[]
          for case in ("good/init-prelude.ndjson","good/perf/magma-list-pair-n7.ndjson"):
              path=root/case
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest==rows[case]["sha256"],("SOURCE_SHA_MISMATCH",case)
              with path.open("rb") as fd:
                  p=subprocess.run([binary],stdin=fd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=180,env=env)
              assert p.returncode in (rows[case]["rc"],0) and (case.startswith("good/")),("INCORRECT_OR_ERROR",case,p.returncode)
              raw=p.stderr.decode(errors="replace")
              markers=("NUCLEUS_ASSURANCE_PROFILE:","NUCLEUS_APPLICATION_FUNCTION_TYPE:","NUCLEUS_FIRST_TYPED_CONTINUATION:","NUCLEUS_DOWNSTREAM:","NUCLEUS_APP_DOMAIN_OBLIGATION:","NUCLEUS_ASSURANCE_SOURCE:","NUCLEUS_ASSURANCE_CHECK:","NUCLEUS_ASSURANCE_FORMATION:","NUCLEUS_ASSURANCE_DECIDE_EXPOSE:","NUCLEUS_ASSURANCE_DECIDE_CONVERSION:","NUCLEUS_ASSURANCE_DECIDE_MAJOR:","NUCLEUS_ASSURANCE_DECIDE_MAJOR_CHAIN:","NUCLEUS_ASSURANCE_DECIDE_CHECKED_REPLAY:","NUCLEUS_ASSURANCE_LOCAL_BUDGET:")
              events=[line for line in raw.splitlines() if line.startswith(markers)]
              counts={mark:sum(line.startswith(mark) for line in events) for mark in markers}
              # Never infer the causal first missing rule from a truncated terminal trace.
              report=dict(case=case,sha256=digest,verdict=p.returncode,expected=rows[case]["rc"],stderr_bytes=len(p.stderr),counts=counts,first_events=events[:15],last_events=events[-25:],diagnostic_status="OBSERVATION_ONLY_UNPROVED_CAUSE")
              for line in events:
                  if line.startswith(("NUCLEUS_ASSURANCE_PROFILE:","NUCLEUS_ASSURANCE_SOURCE:","NUCLEUS_ASSURANCE_CHECK:","NUCLEUS_ASSURANCE_FORMATION:","NUCLEUS_ASSURANCE_DECIDE_EXPOSE:","NUCLEUS_ASSURANCE_DECIDE_CONVERSION:","NUCLEUS_ASSURANCE_DECIDE_MAJOR:","NUCLEUS_ASSURANCE_DECIDE_MAJOR_CHAIN:","NUCLEUS_ASSURANCE_DECIDE_CHECKED_REPLAY:","NUCLEUS_ASSURANCE_LOCAL_BUDGET:")):print(line,flush=True)
              (out/(case.replace("/","__")+".stderr")).write_bytes(p.stderr)
              reports.append(report)
              print("SOURCE_TYPED_REPLAY="+json.dumps({k:report[k] for k in ("case","sha256","verdict","counts","diagnostic_status")}),flush=True)
              if case.endswith("magma-list-pair-n7.ndjson"):
                  assert counts["NUCLEUS_ASSURANCE_PROFILE:"]==3, "MISSING_PROFILE_TRACE"
          for name in ("protected-false-index.ndjson","protected-eta-ctor-alias.ndjson"):
              path=pathlib.Path("metatron-kernel/tests/fixtures")/name
              with path.open("rb") as fd:
                  p=subprocess.run([binary],stdin=fd,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=40,env=env)
              assert p.returncode in (1,2),("UNSAFE_ACCEPT",name,p.returncode)
          report=dict(qualified_base_sha="dad309eb369b9e48c0a896e9d38c383d3e21ef6a",observed_kernel_tree=(out/"source-tree.txt").read_text().strip(),manifest_sha256=hashlib.sha256(manifest.read_bytes()).hexdigest(),cases=reports,all_verdicts_preserved=True,semantic_rule_added=False,proof_of_missing_rule=False,native_suite="see_native-all-including-ignored.json")
          (out/"magma-application-source-obligations.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
      - name: Exact-source application mutations and raw records
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,hashlib,os
          source=pathlib.Path('/tmp/frozen-inputs/good/perf/magma-list-pair-n7.ndjson')
          out=pathlib.Path('/tmp/nucleus-retention-evidence')
          original=[json.loads(s) for s in source.read_text().splitlines()]
          expr={r['ie']:r for r in original if 'ie' in r}
          (out/'original-application-records.json').write_text(json.dumps({k:expr[k] for k in (8750,8751,8752,8753,8804,8805,8833,8834,8835)},indent=2))
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          for f in ('RELEVANCE','CONTEXT_BINDER','TYPED_LINEAGE','SUBSTITUTION_RECLOSURE','TYPED_VALUE_NORMALIZATION','PROJECTION_CONTEXT','PROJECTION_CROSSFRAME_512','TYPED_RECEIVER','SOURCE_PAIR_DEPTH8','POLYMORPHIC_PROP_IRREL','PROP_SINGLETON_2P1F','EXPECTED_LAMBDA'):
            env['NUCLEUS_EXPERIMENTAL_'+f]='1'
          env['NUCLEUS_TRACE_DOWNSTREAM']='1'
          def change(label):
            rows=json.loads(json.dumps(original));e={r['ie']:r for r in rows if 'ie' in r}
            if label=='wrong-owner':e[8835]['app']['fn']=8753
            if label=='wrong-index':e[8833].clear();e[8833].update(ie=8833,bvar=999)
            if label=='wrong-universe':e[8750]['app']['fn']=e[8750]['app']['fn'] # replace exact And.intro constant below
            if label=='ill-typed-argument':e[8835]['app']['arg']=8751
            if label=='unrelated-proposition':e[8834]['lam']['type']=8752
            if label=='forged-proof':e[8834]['lam']['body']=8751
            if label=='wrong-universe':
              cursor=8750
              while 'app' in e[cursor]:cursor=e[cursor]['app']['fn']
              assert 'const' in e[cursor]
              e[cursor]['const']['us']=[0]
            return rows
          results=[]
          for label in ('wrong-owner','wrong-index','wrong-universe','ill-typed-argument','unrelated-proposition','forged-proof'):
            rows=change(label)
            data=('\n'.join(json.dumps(r,separators=(',',':')) for r in rows)+'\n').encode()
            (out/(label+'.ndjson')).write_bytes(data)
            p=subprocess.run(['metatron-kernel/target/release/metatron-kernel'],input=data,env=env,capture_output=True,timeout=180)
            (out/(label+'.stderr')).write_bytes(p.stderr)
            row=dict(control=label,rc=p.returncode,sha256=hashlib.sha256(data).hexdigest(),boundary='whole export non-ACCEPT only; UNKNOWN is not a strict refutation')
            results.append(row);print(json.dumps(row),flush=True)
          (out/'source-mutation-controls.json').write_text(json.dumps(results,indent=2))
          assert all(r['rc'] in (1,2) for r in results),'UNSAFE_ACCEPT_OR_EXECUTION_ERROR'
          PY
      - name: Replay every original frozen input with source hashes
        run: |
          python3 - <<'PY'
          import pathlib,json,os,hashlib,subprocess,collections
          out=pathlib.Path('/tmp/nucleus-retention-evidence')
          root=pathlib.Path('/tmp/frozen-inputs')
          manifest=pathlib.Path('metatron-kernel/evidence/performance/owned-environment-2026-10-13/nucleus-owned-environment-frozen196.json')
          expected=json.loads(manifest.read_text())['modes']['origin']['rows']
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          for f in ('RELEVANCE','CONTEXT_BINDER','TYPED_LINEAGE','SUBSTITUTION_RECLOSURE','TYPED_VALUE_NORMALIZATION','PROJECTION_CONTEXT','PROJECTION_CROSSFRAME_512','TYPED_RECEIVER','SOURCE_PAIR_DEPTH8','POLYMORPHIC_PROP_IRREL','PROP_SINGLETON_2P1F','EXPECTED_LAMBDA'):
            env['NUCLEUS_EXPERIMENTAL_'+f]='1'
          rows=[]
          for old in expected:
            path=root/old['case'];digest=hashlib.file_digest(path.open('rb'),'sha256').hexdigest()
            assert digest==old['sha256']
            tag='frozen-'+old['case'].replace('/','__')
            with path.open('rb') as fd:
              p=subprocess.run(['/usr/bin/time','-f','wall=%e user=%U system=%S rss_kb=%M','-o',str(out/(tag+'.time')),'metatron-kernel/target/release/metatron-kernel'],stdin=fd,capture_output=True,env=env,timeout=180)
            wanted=0 if old['case'].startswith('good/') else 1
            row=dict(case=old['case'],sha256=digest,rc=p.returncode,expected=wanted,baseline_rc=old['rc'])
            rows.append(row);print(json.dumps(row),flush=True)
            (out/(tag+'.stderr')).write_bytes(p.stderr)
          (out/'frozen196-verdicts.json').write_text(json.dumps(rows,indent=2))
          assert len(rows)==196 and all(r['rc'] in (0,1,2) and (r['rc']==2 or r['rc']==r['expected']) for r in rows),'ORIGINAL_INCORRECT_OR_ERROR'
          PY
      - name: Build all current mandatory portable Arena inputs
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena.git /tmp/current-arena
          git -C /tmp/current-arena checkout -q "$ARENA_SHA"
          export NIX_CONFIG="$(printf 'http-connections = 4\nmax-substitution-jobs = 4\nconnect-timeout = 30\n')"
          cd /tmp/current-arena
          nix develop -c ./lka.py build-test --skip-ci > /tmp/nucleus-retention-evidence/fixture-build.log 2>&1
      - name: Classify current mandatory tests with zero incorrect verdict gate
        run: |
          python3 - <<'PY'
          import pathlib,os,json,subprocess,hashlib,collections
          root=pathlib.Path('/tmp/current-arena/_build/tests')
          out=pathlib.Path('/tmp/nucleus-retention-evidence')
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          for f in ('RELEVANCE','CONTEXT_BINDER','TYPED_LINEAGE','SUBSTITUTION_RECLOSURE','TYPED_VALUE_NORMALIZATION','PROJECTION_CONTEXT','PROJECTION_CROSSFRAME_512','TYPED_RECEIVER','SOURCE_PAIR_DEPTH8','POLYMORPHIC_PROP_IRREL','PROP_SINGLETON_2P1F','EXPECTED_LAMBDA'):
            env['NUCLEUS_EXPERIMENTAL_'+f]='1'
          binary=str(pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve())
          rows=[]
          for stats in sorted(root.rglob('*.stats.json')):
            spec=json.loads(stats.read_text())
            if spec.get('outcome') not in ('accept','reject'):continue
            name=spec['name']
            if name=='perf/magma-list-pair-n21':continue
            path=stats.with_name(stats.name.replace('.stats.json','.ndjson'))
            assert path.exists(),name
            tag=name.replace('/','__')
            with path.open('rb') as fd:
              try:
                p=subprocess.run(['/usr/bin/time','-f','wall=%e user=%U system=%S rss_kb=%M','-o',str(out/(tag+'.time')),binary],stdin=fd,capture_output=True,env=env,timeout=min(int(spec.get('timeout',180)),240))
                rc=p.returncode
                (out/(tag+'.stdout')).write_bytes(p.stdout);(out/(tag+'.stderr')).write_bytes(p.stderr)
              except subprocess.TimeoutExpired:rc=124
            wanted=0 if spec['outcome']=='accept' else 1
            row=dict(case=name,expected=wanted,rc=rc,sha256=hashlib.file_digest(path.open('rb'),'sha256').hexdigest())
            rows.append(row);print(json.dumps(row),flush=True)
            (out/'mandatory-verdicts.json').write_text(json.dumps(rows,indent=2))
          counts=collections.Counter(r['rc'] for r in rows)
          wrong=[r for r in rows if r['rc'] in (0,1) and r['rc']!=r['expected']]
          errors=[r for r in rows if r['rc'] not in (0,1,2)]
          summary=dict(arena_sha=os.environ['ARENA_SHA'],count=len(rows),counts=dict(counts),wrong=wrong,execution_errors=errors,unknown=[r for r in rows if r['rc']==2],excluded_heavy='pair-n21 independently replayed in frozen196')
          (out/'current-summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2),flush=True)
          assert len(rows)==208 and not wrong and not errors,'CURRENT_MANDATORY_QUALIFICATION_RED'
          assert next(r['rc'] for r in rows if r['case']=='other/inductive-undeclared-universe')==1,'SCOPE_REPAIR_NOT_CLOSED'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-binding-retention-qualified-${{ github.sha }}
          path: /tmp/nucleus-retention-evidence
          if-no-files-found: error
