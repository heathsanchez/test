name: Nucleus Bool recursor closure v1
on:
  push:
    branches: [nucleus-dependency-closure-exec-v1]
    paths: [".github/workflows/nucleus-bool-recursor-closure-v1.yml", "metatron-kernel/src/checker.rs", "metatron-kernel/src/environment.rs", "metatron-kernel/src/machine.rs", "metatron-kernel/src/typecheck.rs"]
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: {ARENA_ARTIFACT: 10712869614}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - run: |
          cargo fmt --check --manifest-path metatron-kernel/Cargo.toml
          cargo clippy --all-targets --locked --manifest-path metatron-kernel/Cargo.toml -- -D warnings
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/t.zip
          mkdir -p /tmp/a /tmp/t
          unzip -q /tmp/t.zip -d /tmp/a
          tar -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/t
      - name: Full protected reclosure
        run: |
          python - <<'PY'
          import pathlib,subprocess,json,collections
          root=pathlib.Path('/tmp/t'); b=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          rows=[]
          for kind,expected in [('good',0),('bad',1)]:
            for p in sorted((root/kind).rglob('*.ndjson')):
              with p.open('rb') as f:
                env=None
                if 'magma-list-deep-n21' in str(p) or 'magma-list-deep-n36' in str(p):
                  import os
                  env=os.environ.copy(); env['NUCLEUS_TRACE_APPLICATION_INFER']='1'; env['NUCLEUS_TRACE_CONVERSION']='1'; env['NUCLEUS_TRACE_BOOL_TARGET']='1'; env['NUCLEUS_TRACE_INNER_VERDICT']='1'; env['NUCLEUS_TRACE_POST_CAPABILITY']='1'
                try:
                  q=subprocess.run([str(b)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=90,env=env)
                except subprocess.TimeoutExpired:
                  rows.append((str(p.relative_to(root)),expected,124)); continue
                if env is not None:
                  print('TRACE',p.name); print(q.stderr.decode(errors='replace')[-12000:])
                  names={}
                  for raw in p.read_text().splitlines():
                    try: obj=json.loads(raw)
                    except Exception: continue
                    if isinstance(obj.get('in'),int):
                      ident=obj['in']
                      if 'str' in obj:
                        names[ident]=(obj['str']['pre'],obj['str']['str'])
                      elif 'num' in obj:
                        names[ident]=(obj['num']['pre'],str(obj['num']['i']))
                  def full_name(ident):
                    parts=[]; seen=set()
                    while ident in names and ident not in seen:
                      seen.add(ident); pre,part=names[ident]; parts.append(part); ident=pre
                    return '.'.join(reversed(parts))
                  print('FOCUS_NAMES',json.dumps({str(i):full_name(i) for i in (295,375)},sort_keys=True))
                  focus_exprs={163,162,1558,1557,1667,1666}
                  expr_records={}
                  for raw in p.read_text().splitlines():
                    try: obj=json.loads(raw)
                    except Exception: continue
                    if isinstance(obj.get('ie'),int) and obj['ie'] in focus_exprs:
                      expr_records[obj['ie']]=obj
                  print('DECISIVE_REC_ARGS',json.dumps(expr_records,sort_keys=True))
                  exprs={}
                  for raw in p.read_text().splitlines():
                    try: obj=json.loads(raw)
                    except Exception: continue
                    if isinstance(obj.get('ie'),int): exprs[obj['ie']]=obj
                  def app_spine(eid):
                    args=[]; seen=set()
                    while eid in exprs and eid not in seen:
                      seen.add(eid); obj=exprs[eid]
                      if 'app' not in obj: break
                      args.append(obj['app']['arg']); eid=obj['app']['fn']
                    return eid,list(reversed(args))
                  head,args=app_spine(1667)
                  head_obj=exprs.get(head,{})
                  head_name=None
                  if 'const' in head_obj: head_name=full_name(head_obj['const']['name'])
                  print('DECISIVE_TARGET_SPINE',json.dumps({'head':head,'head_name':head_name,'head_record':head_obj,'args':args,'arg_records':{str(i):exprs.get(i) for i in args}},sort_keys=True))
              rows.append((str(p.relative_to(root)),expected,q.returncode))
          wrong=[x for x in rows if x[2] in (0,1) and x[2]!=x[1]]
          errors=[x for x in rows if x[2] not in (0,1,2)]
          counts=collections.Counter(x[2] for x in rows)
          focus=[x for x in rows if 'magma-list-deep-n21' in x[0] or 'magma-list-deep-n36' in x[0]]
          print(json.dumps({'total':len(rows),'counts':dict(counts),'wrong':wrong,'errors':errors,'focus':focus},indent=2))
          assert len(rows)==193 and not wrong and not errors
          assert all(x[2]==0 for x in focus), focus
          PY
