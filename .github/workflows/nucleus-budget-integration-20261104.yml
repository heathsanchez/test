name: Nucleus qualified fast stack work allowance and complete source replay
on:
  push:
    branches: [research/nucleus-reuse-tournaments-20261104]
    paths: ['.github/workflows/nucleus-budget-integration-20261104.yml','experiments/nucleus-budget-integration-20261104/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nucleus-budget-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - run: git fetch --no-tags --depth=1 origin a2578e77079719ff2064f910bd82fd01d8e120b6
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Reuse protected indexed baseline, independent source truth and exact corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/budget-baseline /tmp/let-oracle /tmp/current208
          gh api repos/heathsanchez/test/actions/artifacts/13268111683/zip > /tmp/baseline.zip
          printf '%s  %s\n' 826a94548f9b95b1c18a173bbaa625d2ed96771b1c1d78fb3e4a9e8431ba77e4 /tmp/baseline.zip | sha256sum -c -
          unzip -q /tmp/baseline.zip -d /tmp/budget-baseline
          gh api repos/heathsanchez/test/actions/artifacts/13261917242/zip > /tmp/oracle.zip
          printf '%s  %s\n' bde62a227167517215d6a011f48cbf211447dba5c476c8eddbc4aff345183d05 /tmp/oracle.zip | sha256sum -c -
          unzip -q /tmp/oracle.zip -d /tmp/let-oracle
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/inputs.zip
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/inputs.zip | sha256sum -c -
          unzip -q /tmp/inputs.zip -d /tmp/current208
      - name: Restore reusable independent oracle and exact proved source boundary
        run: |
          set -euo pipefail
          mkdir -p /tmp/budget-reference /tmp/budget-range
          gh api repos/heathsanchez/test/actions/artifacts/13267462207/zip > /tmp/reference.zip
          printf '%s  %s\n' 9dfaff0a6cb272e6950e301aab75cf99e09a440f5ad881e2e1790019b4add1dd /tmp/reference.zip | sha256sum -c -
          unzip -q /tmp/reference.zip -d /tmp/budget-reference
          gh api repos/heathsanchez/test/actions/artifacts/13259246241/zip > /tmp/range.zip
          printf '%s  %s\n' 8d757fba8ce67f41163281c095e43099eff209cd7d31c902838bc5d8273e405c /tmp/range.zip | sha256sum -c -
          unzip -q /tmp/range.zip -d /tmp/budget-range
          zstd -d /tmp/budget-range/next-frontier.ndjson.zst -o /tmp/range-prefix.ndjson
      - name: Prepare unchanged source controls
        run: |
          python3 experiments/nucleus-nat-closure-20261104/generate_fixtures.py --out /tmp/nat-fixtures
          python3 experiments/nucleus-parameter-telescope-20261104/prepare.py
          python3 experiments/nucleus-nullary-enum-20261104/prepare.py
      - name: Reuse exact complete Mathlib input
        run: |
          set -euo pipefail
          mkdir -p /tmp/mathlib-source
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/input.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/input.zip | sha256sum -c -
          unzip -q /tmp/input.zip -d /tmp/mathlib-source
          zstd -d /tmp/mathlib-source/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib.ndjson | sha256sum -c -
          rm /tmp/input.zip /tmp/mathlib-source/mathlib.ndjson.zst
      - name: Fresh complete qualification, original Range closure, then full Mathlib
        run: python3 experiments/nucleus-budget-integration-20261104/runner.py --out /tmp/budget-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-budget-integration-${{ github.sha }}
          path: |
            /tmp/budget-integration/*.json
            /tmp/budget-integration/candidate/*.json
            /tmp/budget-integration/candidate/*.log
            /tmp/budget-integration/candidate/source.patch
            /tmp/budget-integration/candidate/nucleus
            /tmp/budget-integration/full-input/time.txt
            /tmp/budget-integration/full-input/stderr
            /tmp/budget-integration/*.stderr
            /tmp/budget-integration/next-frontier.ndjson.zst
            /tmp/budget-integration/range-reference/*.stdout
            /tmp/budget-integration/range-reference/*.stderr
            /tmp/budget-integration/candidate/changed-*/*.stdout
            /tmp/budget-integration/candidate/changed-*/*.stderr
            /tmp/budget-integration/captured-controls/inputs.json
            /tmp/budget-integration/captured-controls/*.stderr
            /tmp/budget-integration/captured-controls/*-reference/*.stdout
            /tmp/budget-integration/captured-controls/*-reference/*.stderr
