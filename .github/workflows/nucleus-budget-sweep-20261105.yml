name: Nucleus independent six-case budget falsification
on:
  workflow_dispatch:
  push:
    branches: [research/nucleus-deferred-projection-congruence-20261105]
    paths:
      - '.github/workflows/nucleus-budget-sweep-20261105.yml'
      - 'experiments/nucleus-budget-sweep-20261105.rs'
permissions:
  contents: read
  actions: read
jobs:
  representative:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Rehydrate immutable Nucleus source and exact original 196 corpus
        run: |
          set -euo pipefail
          mkdir -p qualified original196 results
          gh api repos/heathsanchez/test/actions/artifacts/13370874970/zip > qualified.zip
          printf '%s  %s\n' 0fd8a4cd86dcb233b532f59ea8dc853d22480b6ba62ff864049224250613e517 qualified.zip | sha256sum -c -
          unzip -q qualified.zip -d qualified
          tar --no-same-owner -xzf qualified/candidate/source.tar.gz
          printf '%s  %s\n' 1949144e581167be2547bb18a0331d7b34a769f2cff75037b884ce9b2de6c4ac metatron-kernel/src/convert.rs | sha256sum -c -
          printf '%s  %s\n' 633fb3fd4c58def5143e17078d3d188f832dc1a7432dea84a88b8d91676e5d20 metatron-kernel/src/run_flags.rs | sha256sum -c -
          patch -p1 -d metatron-kernel < experiments/nucleus-deferred-projection-congruence-20261105/run_flags.rs.patch
          patch -p1 -d metatron-kernel < experiments/nucleus-deferred-projection-congruence-20261105/convert.rs.patch
          install -Dm644 experiments/nucleus-budget-sweep-20261105.rs metatron-kernel/src/bin/nucleus-budget-sweep.rs
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > original196.zip
          printf '%s  %s\n' f6cd590db7f6fb92b8d1b3ca87231d4b0f521f085d73f93abd005f5caaff86d2 original196.zip | sha256sum -c -
          unzip -p original196.zip lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C original196
          test "$(find original196/good -type f -name '*.ndjson' | wc -l)" -eq 125
      - name: Build research harness through exact source checker
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --bin nucleus-budget-sweep
          sha256sum metatron-kernel/target/release/nucleus-budget-sweep | tee results/binary-sha256.txt
      - name: Test fixed scientific hypothesis, never change inference rules
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r '.candidate.configuration | to_entries[] | "\(.key)=\(.value)"' qualified/qualification.json)
          export "${flags[@]}"
          export NUCLEUS_EXPERIMENTAL_DEFERRED_PROJECTION_CONGRUENCE=1
          printf 'case\tbudget\texit\tseconds\n' | tee results/budget-sweep.tsv
          for case_name in fueled-chain grind-ring-5 magma-list-deep-n21 magma-list-pair-n7; do
            for steps in 262144 524288 1048576; do
              verdict=0
              /usr/bin/time -f '%e' -o results/time.txt timeout --signal=TERM --kill-after=3s 60s \
                metatron-kernel/target/release/nucleus-budget-sweep "$steps" \
                < "original196/good/perf/${case_name}.ndjson" \
                > "results/${case_name}-${steps}.stdout" \
                2> "results/${case_name}-${steps}.stderr" || verdict=$?
              seconds="$(tr -d '\r\n' < results/time.txt)"
              printf '%s\t%s\t%s\t%s\n' "$case_name" "$steps" "$verdict" "$seconds" | tee -a results/budget-sweep.tsv
              test "$verdict" -eq 0 -o "$verdict" -eq 2 -o "$verdict" -eq 124 || {
                printf 'unexpected verdict (%s) for valid %s; test stops without promotion\n' "$verdict" "$case_name"; exit 1;
              }
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-original-six-budget-falsification
          retention-days: 45
          if-no-files-found: warn
          path: |
            results/budget-sweep.tsv
            results/binary-sha256.txt
            results/*.stderr
            qualified/qualification.json
