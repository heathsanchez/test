name: Nucleus 4x judgment frontier source-pinned early diagnostic
on:
  push:
    branches: [research/nucleus-budget4x-qualification-20261104]
    paths: ['.github/workflows/nucleus-budget4x-fast-frontier-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-export-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Restore unchanged 4x source-exact screen binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/budget-fast
          gh api repos/heathsanchez/test/actions/artifacts/13266857833/zip > /tmp/budget-fast.zip
          printf '%s  %s\n' 2d16ba78be1f181ee99ad618f60a9d1f1d394d75d6aa54eaf2686f90b749da46 /tmp/budget-fast.zip | sha256sum -c -
          unzip -q /tmp/budget-fast.zip -d /tmp/budget-fast
          printf '%s  %s\n' 659d68f956fefac853e3b4b9c6a402a317de362588f3ddc7962e950cfce8161a /tmp/budget-fast/budget4x/nucleus | sha256sum -c -
          chmod +x /tmp/budget-fast/budget4x/nucleus
      - name: Reuse pinned whole Mathlib export
        run: |
          set -euo pipefail
          mkdir -p /tmp/mathlib-source
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/input.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/input.zip | sha256sum -c -
          unzip -q /tmp/input.zip -d /tmp/mathlib-source
          zstd -d /tmp/mathlib-source/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib.ndjson | sha256sum -c -
          rm /tmp/input.zip /tmp/mathlib-source/mathlib.ndjson.zst
      - name: Exact 4x candidate complete-source diagnostic (no promotion)
        run: |
          python3 - <<'PY'
          import importlib.util,json,subprocess
          from pathlib import Path
          root=Path('/tmp/budget-fast');out=root/'frontier';out.mkdir(exist_ok=True)
          spec=importlib.util.spec_from_file_location('let_wave','experiments/nucleus-let-preservation-20261104/runner.py')
          L=importlib.util.module_from_spec(spec);spec.loader.exec_module(L)
          R=L.R;t=L.t
          source=Path('/tmp/mathlib.ndjson');assert t.digest(source)==t.INPUT_SHA
          binary=root/'budget4x/nucleus';assert t.digest(binary)=='659d68f956fefac853e3b4b9c6a402a317de362588f3ddc7962e950cfce8161a'
          run=R.N.runtime(True);run['NUCLEUS_TRACE_DOWNSTREAM']='1'
          result=t.measure(binary,source,run,out/'full',timeout=1800,perf=False)
          traces=[x for x in (out/'full/stderr').read_text(errors='replace').splitlines()if x.startswith('NUCLEUS_DOWNSTREAM:')]
          terminal=traces[-1]if traces else None
          frontier=None
          if result['rc']==2 and terminal:
           import re
           match=re.search(r'NUCLEUS_DOWNSTREAM:name=(.*?):stage=',terminal)
           if match and not match.group(1).startswith('<'):
            frontier=R.E.extract(source,out/'next-frontier.ndjson',match.group(1))
            subprocess.run(['zstd','-T0','-3',str(out/'next-frontier.ndjson')],check=True)
            (out/'next-frontier.ndjson').unlink()
          summary=dict(status='CANDIDATE_UNQUALIFIED_FULL',result=result,terminal=terminal,next_frontier=frontier,binary_sha=t.digest(binary),input_sha=t.INPUT_SHA,source_run=41709666161)
          t.write_json(out/'summary.json',summary)
          print('FRONTIER',json.dumps(summary),flush=True)
          assert result['rc']in(0,1,2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-budget4x-early-frontier-${{ github.sha }}
          path: |
            /tmp/budget-fast/frontier/*.json
            /tmp/budget-fast/frontier/full/time.txt
            /tmp/budget-fast/frontier/full/stderr
            /tmp/budget-fast/frontier/next-frontier.ndjson.zst
