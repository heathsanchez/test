name: Nucleus C156 exact expensive source-shape candidate audit

on:
  push:
    branches: [research/nucleus-c156-heavy-shape-audit-20261114]
    paths:
      - .github/workflows/nucleus-c150-exact-c125b-source-gate.yml
      - metatron-kernel/src/convert.rs
      - metatron-kernel/src/machine.rs
      - metatron-kernel/src/typecheck.rs
      - metatron-kernel/examples/nucleus_budget_ladder.rs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-source-and-forgery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      NUCLEUS_EXPERIMENTAL_RELEVANCE: '1'
      NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA: '1'
      NUCLEUS_EXPERIMENTAL_DEMAND_MAJOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Verify recovered C125b source plus the diagnostic-only C156 machine
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            8ab42156172a8c98b8134af74aeb81b7a579d0ed6372f54837a5267430b2422d metatron-kernel/src/machine.rs \
            c3d47f4be05dbdcc1ba99eb668fe4cd32873f4e7d8b1b95480f6c1e943bd7f88 metatron-kernel/src/convert.rs \
            d16b882835a6ccf79adf97191640c37b526ea0d74b7aadcbb6e2a425779c0eb6 metatron-kernel/src/typecheck.rs \
            ad5161dc49851ea5b7be34263496502309fd6f6958df4e3c6b5a1e6d885d7894 metatron-kernel/examples/nucleus_budget_ladder.rs \
            | sha256sum -c -
      - name: Obtain immutable original Arena 196-case input artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c150-original196"
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > "$RUNNER_TEMP/c150-original196.zip"
          printf '%s  %s\n' f6cd590db7f6fb92b8d1b3ca87231d4b0f521f085d73f93abd005f5caaff86d2 "$RUNNER_TEMP/c150-original196.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/c150-original196.zip" lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C "$RUNNER_TEMP/c150-original196"
          printf '%s  %s\n' abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35 "$RUNNER_TEMP/c150-original196/good/perf/magma-list-pair-n7.ndjson" | sha256sum -c -
      - name: Build exact recovered source with diagnostics
        run: |
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics --example nucleus_budget_ladder
      - name: Check same-source N7 low/high and three pinned forgery controls
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/c150-original196/good/perf/magma-list-pair-n7.ndjson" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          binary = Path('metatron-kernel/target/release/examples/nucleus_budget_ladder').resolve()
          source = Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(source).hexdigest() == 'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'
          verdicts = []
          for budget, expected, word in ((65536, 2, 'Unknown'), (14155776, 0, 'Accept')):
              proc = subprocess.run([str(binary), str(budget)], input=source,
                                    capture_output=True, timeout=180, check=False)
              assert proc.returncode == expected, (budget, proc.returncode, proc.stderr[-1000:])
              assert not proc.stdout, (budget, proc.stdout[-1000:])
              assert f'C107_BUDGET:steps={budget}:verdict={word}'.encode() in proc.stderr
              verdicts.append({'budget': budget, 'exit': proc.returncode})

          fixtures = (
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-fields.ndjson',
               '33993418d305e980e224d6102be2fc61ee9c02be1c8c23ccce00a406616ba6d6', 1),
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-motive.ndjson',
               '2eb5034aa01b1591cc99577bacc50095e3d8e80709172175f569e1f481f680de', 2),
              ('nucleus-quotient-reuse-20261104/heldout/mutated.ndjson',
               'a4425142910417814594d555ccec8ac1b29bbe8d18f12993f20fa1c0253fd692', 1),
          )
          for rel, digest, expected in fixtures:
              payload = (Path('experiments') / rel).read_bytes()
              assert hashlib.sha256(payload).hexdigest() == digest, rel
              proc = subprocess.run([str(binary), '65536'], input=payload,
                                    capture_output=True, timeout=90, check=False)
              assert proc.returncode == expected, (rel, proc.returncode, proc.stderr[-1000:])
              assert not proc.stdout, (rel, proc.stdout[-1000:])
              verdicts.append({'forged': rel, 'exit': proc.returncode})
          print(json.dumps({'source': 'exact-C125b d8be1443f2f1352634aaf333a282f32e7ec8a719',
                            'original_input': 'sha256:abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35',
                            'verdicts': verdicts}, sort_keys=True))
          PY
      - name: C151 source-locked exact cache observer ON/OFF parity
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/c150-original196/good/perf/magma-list-pair-n7.ndjson" <<'PY' | tee "$RUNNER_TEMP/c151-cache-receipt.json"
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          original = Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(original).hexdigest() == 'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'
          binary = Path('metatron-kernel/target/release/examples/nucleus_budget_ladder').resolve()
          clean_env = {k: v for k, v in os.environ.items() if k != 'NUCLEUS_C151_EXACT_CACHE'}
          trace_env = dict(clean_env, NUCLEUS_C151_EXACT_CACHE='1')
          receipt = []
          for budget, expected in ((65536, 2), (14155776, 0)):
              plain = subprocess.run([str(binary), str(budget)], input=original,
                                     capture_output=True, env=clean_env, timeout=180, check=False)
              marked = subprocess.run([str(binary), str(budget)], input=original,
                                      capture_output=True, env=trace_env, timeout=180, check=False)
              assert (plain.returncode, marked.returncode) == (expected, expected)
              assert plain.stdout == marked.stdout == b''
              prefix = b'NUCLEUS_C151_CACHE:'
              lines = marked.stderr.splitlines()
              markers = [line.decode() for line in lines if line.startswith(prefix)]
              unchanged = b'\n'.join(line for line in lines if not line.startswith(prefix))
              assert unchanged == b'\n'.join(plain.stderr.splitlines()), budget
              assert markers, f'C151 returned no exact source-cache events at budget {budget}'
              allowed = {'lookup-miss', 'lookup-hit', 'uncached-proven',
                         'uncached-unknown', 'uncached-refuted', 'publication',
                         'publication-skipped'}
              for marker in markers:
                  event = marker.split(':event=', 1)[1].split(':', 1)[0]
                  assert event in allowed, marker
                  assert ':source=8799:env=0:levels=0:' in marker
                  assert ':pending=0:preserve=true:' in marker
              receipt.append({'budget': budget, 'exit': expected, 'events': markers})
          print(json.dumps({'source_commit': 'd8be1443f2f1352634aaf333a282f32e7ec8a719',
                            'original_sha256': 'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35',
                            'receipts': receipt}, sort_keys=True))
          PY
      - name: C152 count exact-source uncached producer work ON/OFF
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/c150-original196/good/perf/magma-list-pair-n7.ndjson" <<'PY' | tee "$RUNNER_TEMP/c152-head-cost.json"
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          source = Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(source).hexdigest() == 'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'
          binary = Path('metatron-kernel/target/release/examples/nucleus_budget_ladder').resolve()
          baseline_env = dict(os.environ, NUCLEUS_C151_EXACT_CACHE='1')
          baseline_env.pop('NUCLEUS_C152_EXACT_HEAD_COST', None)
          metered_env = dict(baseline_env, NUCLEUS_C152_EXACT_HEAD_COST='1')
          receipts = []
          pattern = re.compile(r'^NUCLEUS_C152_HEADS:source=8799:env=0:authority=(\d+):budget=(\d+):outcome=(\w+):head=(\w+):total=(\d+):bvar=(\d+):app=(\d+):lam=(\d+):const=(\d+):proj=(\d+):nat=(\d+):let=(\d+):other=(\d+)$')
          for limit, expected in ((65536, 2), (14155776, 0)):
              base = subprocess.run([str(binary), str(limit)], input=source,
                                    capture_output=True, timeout=180, env=baseline_env, check=False)
              metered = subprocess.run([str(binary), str(limit)], input=source,
                                       capture_output=True, timeout=180, env=metered_env, check=False)
              assert (base.returncode, metered.returncode) == (expected, expected)
              assert base.stdout == metered.stdout == b''
              lines = metered.stderr.splitlines()
              marks = [x.decode() for x in lines if x.startswith(b'NUCLEUS_C152_HEADS:')]
              unmarked = b'\n'.join(x for x in lines if not x.startswith(b'NUCLEUS_C152_HEADS:'))
              assert unmarked == b'\n'.join(base.stderr.splitlines()), limit
              assert marks, f'missing exact C152 source meter at {limit}'
              arm = []
              for line in marks:
                  match = pattern.fullmatch(line)
                  assert match, line
                  authority, budget, outcome, head, total, *kinds = match.groups()
                  assert int(authority) == 386 and int(total) == sum(map(int, kinds)), line
                  arm.append({'budget': int(budget), 'outcome': outcome,
                              'head': head, 'total': int(total),
                              'kinds': list(map(int, kinds))})
              receipts.append({'limit': limit, 'exit': expected, 'calls': arm})
          print(json.dumps({'source': 'recovered-C125b', 'receipts': receipts}, sort_keys=True))
          PY
      - name: C153 count disjoint nested completion leaves without cache mutations
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/c150-original196/good/perf/magma-list-pair-n7.ndjson" <<'PY' | tee "$RUNNER_TEMP/c153-nested-completions.json"
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          source=Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(source).hexdigest()=='abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'
          binary=Path('metatron-kernel/target/release/examples/nucleus_budget_ladder').resolve()
          base_env=dict(os.environ,NUCLEUS_C151_EXACT_CACHE='1',NUCLEUS_C152_EXACT_HEAD_COST='1')
          base_env.pop('NUCLEUS_C153_NESTED_COMPLETIONS',None)
          marked_env=dict(base_env,NUCLEUS_C153_NESTED_COMPLETIONS='1')
          pattern=re.compile(r'^NUCLEUS_C153_NESTED:source=8799:env=0:authority=(\d+):budget=(\d+):calls=(\d+):proven=(\d+):unknown=(\d+):leaf_calls=(\d+):leaf_proven=(\d+):leaf_potentially_cacheable=(\d+):leaf_head_work=(\d+):max_leaf_head_work=(\d+)$')
          receipts=[]
          for budget,expected in ((65536,2),(14155776,0)):
              plain=subprocess.run([str(binary),str(budget)],input=source,capture_output=True,env=base_env,timeout=180,check=False)
              marked=subprocess.run([str(binary),str(budget)],input=source,capture_output=True,env=marked_env,timeout=180,check=False)
              assert (plain.returncode,marked.returncode)==(expected,expected)
              assert plain.stdout==marked.stdout==b''
              lines=marked.stderr.splitlines()
              markers=[line.decode() for line in lines if line.startswith(b'NUCLEUS_C153_NESTED:')]
              stripped=b'\n'.join(line for line in lines if not line.startswith(b'NUCLEUS_C153_NESTED:'))
              assert stripped==b'\n'.join(plain.stderr.splitlines()),budget
              assert markers,('missing C153 source-locked marker',budget)
              calls=[]
              for marker in markers:
                  match=pattern.fullmatch(marker)
                  assert match,marker
                  authority,allowance,count,proven,unknown,leaves,leaf_proven,cacheable,work,maxwork=map(int,match.groups())
                  assert authority==386
                  assert 0<=proven<=count and 0<=unknown<=count
                  assert 0<=cacheable<=leaf_proven<=leaves<=count
                  assert maxwork<=work
                  calls.append({'allowance':allowance,'calls':count,'proven':proven,'unknown':unknown,
                                'leaf_calls':leaves,'leaf_proven':leaf_proven,
                                'leaf_potentially_cacheable':cacheable,
                                'leaf_head_work':work,'max_leaf_head_work':maxwork})
              receipts.append({'budget':budget,'exit':expected,'nested':calls})
          print(json.dumps({'source':'exact C125b d8be1443f2f1352634aaf333a282f32e7ec8a719',
                            'original_sha256':'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35',
                            'receipts':receipts},sort_keys=True))
          PY
      - name: C154 rank complete nonleaf intervals and existing-cache hits ON/OFF
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/c150-original196/good/perf/magma-list-pair-n7.ndjson" <<'PY' | tee "$RUNNER_TEMP/c154-nonleaf-cost.json"
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          source=Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(source).hexdigest()=='abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'
          binary=Path('metatron-kernel/target/release/examples/nucleus_budget_ladder').resolve()
          base_env=dict(os.environ,NUCLEUS_C151_EXACT_CACHE='1',NUCLEUS_C152_EXACT_HEAD_COST='1',NUCLEUS_C153_NESTED_COMPLETIONS='1')
          base_env.pop('NUCLEUS_C154_NONLEAF_COST',None)
          marked_env=dict(base_env,NUCLEUS_C154_NONLEAF_COST='1')
          pattern=re.compile(r'^NUCLEUS_C154_NONLEAF:source=8799:env=0:authority=(\d+):budget=(\d+):nonleaf_calls=(\d+):nonleaf_proven=(\d+):nonleaf_max_head_work=(\d+):ge64=(\d+):ge1024=(\d+):ge65536=(\d+):already_cached_hits=(\d+)$')
          receipts=[]
          for budget,expected in ((65536,2),(14155776,0)):
              plain=subprocess.run([str(binary),str(budget)],input=source,capture_output=True,env=base_env,timeout=180,check=False)
              marked=subprocess.run([str(binary),str(budget)],input=source,capture_output=True,env=marked_env,timeout=180,check=False)
              assert (plain.returncode,marked.returncode)==(expected,expected)
              assert plain.stdout==marked.stdout==b''
              lines=marked.stderr.splitlines()
              markers=[line.decode() for line in lines if line.startswith(b'NUCLEUS_C154_NONLEAF:')]
              stripped=b'\n'.join(line for line in lines if not line.startswith(b'NUCLEUS_C154_NONLEAF:'))
              assert stripped==b'\n'.join(plain.stderr.splitlines()),budget
              assert markers,('missing C154 source-locked marker',budget)
              calls=[]
              for marker in markers:
                  match=pattern.fullmatch(marker)
                  assert match,marker
                  authority,allowance,n,proven,maxwork,ge64,ge1024,ge65536,hits=map(int,match.groups())
                  assert authority==386 and 0<=ge65536<=ge1024<=ge64<=proven<=n
                  assert 0<=hits
                  calls.append({'allowance':allowance,'nonleaf_calls':n,'proven':proven,
                                'max_head_work':maxwork,'ge64':ge64,'ge1024':ge1024,
                                'ge65536':ge65536,'already_cached_hits':hits})
              receipts.append({'budget':budget,'exit':expected,'nonleaf':calls})
          print(json.dumps({'source':'exact C125b d8be1443f2f1352634aaf333a282f32e7ec8a719',
                            'original_sha256':'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35',
                            'receipts':receipts},sort_keys=True))
          PY
      - name: C155 full exact-key expensive nonleaf ON/OFF and disjoint ceiling
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/c150-original196/good/perf/magma-list-pair-n7.ndjson" <<'PY' | tee "$RUNNER_TEMP/c155-exact-heavy-keys.json"
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          source=Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(source).hexdigest()=='abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'
          binary=Path('metatron-kernel/target/release/examples/nucleus_budget_ladder').resolve()
          base_env=dict(os.environ,NUCLEUS_C151_EXACT_CACHE='1',NUCLEUS_C152_EXACT_HEAD_COST='1',
                        NUCLEUS_C153_NESTED_COMPLETIONS='1',NUCLEUS_C154_NONLEAF_COST='1')
          base_env.pop('NUCLEUS_C155_EXPENSIVE_EXACT_KEYS',None)
          marked_env=dict(base_env,NUCLEUS_C155_EXPENSIVE_EXACT_KEYS='1')
          pattern=re.compile(r'^NUCLEUS_C155_EXACT:source=8799:env=0:authority=(\d+):budget=(\d+):calls=(\d+):unique=(\d+):repeated=(\d+):conflicts=(\d+):repeated_work_overlapping=(\d+):max_repeated_work=(\d+):best_disjoint_repeated_work=(\d+)$')
          receipts=[]
          for budget,expected in ((65536,2),(14155776,0)):
              plain=subprocess.run([str(binary),str(budget)],input=source,capture_output=True,env=base_env,timeout=240,check=False)
              marked=subprocess.run([str(binary),str(budget)],input=source,capture_output=True,env=marked_env,timeout=240,check=False)
              assert (plain.returncode,marked.returncode)==(expected,expected)
              assert plain.stdout==marked.stdout==b''
              lines=marked.stderr.splitlines()
              markers=[line.decode() for line in lines if line.startswith(b'NUCLEUS_C155_EXACT:')]
              stripped=b'\n'.join(line for line in lines if not line.startswith(b'NUCLEUS_C155_EXACT:'))
              assert stripped==b'\n'.join(plain.stderr.splitlines()),budget
              assert markers,('missing C155 source-locked marker',budget)
              counts=[]
              for marker in markers:
                  match=pattern.fullmatch(marker)
                  assert match,marker
                  authority,allowance,calls,unique,repeated,conflicts,overlap,maxwork,disjoint=map(int,match.groups())
                  assert authority==386 and unique+repeated==calls and 0<=conflicts<=repeated
                  assert 0<=maxwork<=overlap and 0<=disjoint<=overlap
                  counts.append({'allowance':allowance,'expensive_completed':calls,'unique_exact_keys':unique,
                                 'repeat_exact_keys':repeated,'result_conflicts':conflicts,
                                 'overlapping_repeat_heads':overlap,
                                 'max_single_repeat_heads':maxwork,
                                 'best_disjoint_repeat_heads':disjoint})
              receipts.append({'budget':budget,'exit':expected,'exact_keys':counts})
          print(json.dumps({'source':'exact C125b d8be1443f2f1352634aaf333a282f32e7ec8a719',
                            'original_sha256':'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35',
                            'receipts':receipts},sort_keys=True))
          PY
      - name: C156 source-shape classes of full-key-distinct expensive calls
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/c150-original196/good/perf/magma-list-pair-n7.ndjson" <<'PY' | tee "$RUNNER_TEMP/c156-shape-groups.json"
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          source=Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(source).hexdigest()=='abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'
          binary=Path('metatron-kernel/target/release/examples/nucleus_budget_ladder').resolve()
          base_env=dict(os.environ,NUCLEUS_C151_EXACT_CACHE='1',NUCLEUS_C152_EXACT_HEAD_COST='1',
                        NUCLEUS_C153_NESTED_COMPLETIONS='1',NUCLEUS_C154_NONLEAF_COST='1',
                        NUCLEUS_C155_EXPENSIVE_EXACT_KEYS='1')
          base_env.pop('NUCLEUS_C156_HEAVY_SHAPE_GROUPS',None)
          marked_env=dict(base_env,NUCLEUS_C156_HEAVY_SHAPE_GROUPS='1')
          pattern=re.compile(r'^NUCLEUS_C156_SHAPES:source=8799:env=0:authority=(\d+):budget=(\d+):full_keys=(\d+):shape_groups=(\d+):shape_extras=(\d+):repeated_shape_groups=(\d+):uniform_result_shape_groups=(\d+):conflicting_result_shape_groups=(\d+):largest_shape_group=(\d+):coarse_groups=(\d+):coarse_largest=(\d+)$')
          top_pattern=re.compile(r'^NUCLEUS_C156_TOP:rank=(\d+):expr=(\d+):pending=(\d+):members=(\d+):strict_value_conflicts=(\d+)$')
          receipts=[]
          for budget,expected in ((65536,2),(14155776,0)):
              plain=subprocess.run([str(binary),str(budget)],input=source,capture_output=True,env=base_env,timeout=240,check=False)
              marked=subprocess.run([str(binary),str(budget)],input=source,capture_output=True,env=marked_env,timeout=240,check=False)
              assert (plain.returncode,marked.returncode)==(expected,expected)
              assert plain.stdout==marked.stdout==b''
              lines=marked.stderr.splitlines()
              markers=[line.decode() for line in lines if line.startswith(b'NUCLEUS_C156_SHAPES:')]
              tops=[line.decode() for line in lines if line.startswith(b'NUCLEUS_C156_TOP:')]
              stripped=b'\n'.join(line for line in lines if not line.startswith((b'NUCLEUS_C156_SHAPES:',b'NUCLEUS_C156_TOP:')))
              assert stripped==b'\n'.join(plain.stderr.splitlines()),budget
              assert markers,('missing C156 source-locked marker',budget)
              summary=[]
              for marker in markers:
                  match=pattern.fullmatch(marker)
                  assert match,marker
                  authority,allowance,full,groups,extra,repeated,uniform,conflict,largest,coarse,coarse_largest=map(int,match.groups())
                  assert authority==386 and 0<=groups<=full and extra==full-groups
                  assert 0<=uniform+conflict<=repeated<=groups
                  assert 0<=largest<=full and 0<=coarse<=full and 0<=coarse_largest<=full
                  summary.append({'allowance':allowance,'exact_unique_keys':full,
                                  'shape_groups':groups,'shape_extra':extra,
                                  'repeated_groups':repeated,'uniform_result_groups':uniform,
                                  'conflicting_result_groups':conflict,
                                  'largest_group':largest,'expr_pending_length_groups':coarse,
                                  'largest_coarse_group':coarse_largest})
              top=[]
              for line in tops:
                  match=top_pattern.fullmatch(line)
                  assert match,line
                  rank,expr,pending,members,conflicts=map(int,match.groups())
                  assert 0<=rank<5 and members>=2 and conflicts<members
                  top.append({'rank':rank,'expr':expr,'pending':pending,
                              'members':members,'strict_value_conflicts':conflicts})
              receipts.append({'budget':budget,'exit':expected,'groups':summary,'top':top})
          print(json.dumps({'source':'exact C125b d8be1443f2f1352634aaf333a282f32e7ec8a719',
                            'original_sha256':'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35',
                            'receipts':receipts},sort_keys=True))
