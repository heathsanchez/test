name: Nucleus C166 frozen deep-n36 budget-ladder diagnostic

on:
  push:
    branches: [research/nucleus-c166-deep-n36-budget-ladder-20261114]
    paths:
      - .github/workflows/nucleus-c166-deep-n36-budget-ladder.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-locked-deep-n36:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      NUCLEUS_EXPERIMENTAL_RELEVANCE: '1'
      NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA: '1'
      NUCLEUS_EXPERIMENTAL_DEMAND_MAJOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Retrieve original Arena source with exact hashes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original196"
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > "$RUNNER_TEMP/original196.zip"
          printf '%s  %s\n' f6cd590db7f6fb92b8d1b3ca87231d4b0f521f085d73f93abd005f5caaff86d2 "$RUNNER_TEMP/original196.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/original196.zip" lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C "$RUNNER_TEMP/original196"
          printf '%s  %s\n' 6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac "$RUNNER_TEMP/original196/good/perf/magma-list-deep-n36.ndjson" | sha256sum -c -
          printf '%s  %s\n' abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35 "$RUNNER_TEMP/original196/good/perf/magma-list-pair-n7.ndjson" | sha256sum -c -
      - name: Build unchanged diagnostic checker
        run: cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics --example nucleus_budget_ladder
      - name: Run bounded deep-n36 ladder and negative controls
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/original196/good/perf/magma-list-deep-n36.ndjson" "$RUNNER_TEMP/original196/good/perf/magma-list-pair-n7.ndjson" <<'PY' | tee "$RUNNER_TEMP/c166-deep-n36-budget-ladder.json"
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          deep, n7 = (Path(p).read_bytes() for p in sys.argv[1:])
          digests = (
              '6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac',
              'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35',
          )
          assert [hashlib.sha256(x).hexdigest() for x in (deep, n7)] == list(digests)
          binary = Path('metatron-kernel/target/release/examples/nucleus_budget_ladder').resolve()
          env = dict(os.environ)
          for key in ('NUCLEUS_C151_EXACT_CACHE', 'NUCLEUS_C152_EXACT_HEAD_COST', 'NUCLEUS_C163_NONBETA_HOT'):
              env.pop(key, None)

          def probe(source, budget, timeout=90):
              try:
                  p = subprocess.run([str(binary), str(budget)], input=source, env=env,
                                     capture_output=True, timeout=timeout, check=False)
              except subprocess.TimeoutExpired:
                  return {'budget':budget, 'outcome':'TIMEOUT', 'timeout_seconds':timeout}
              assert p.returncode in (0, 1, 2), (budget, p.returncode)
              return {'budget':budget, 'exit':p.returncode,
                      'outcome':{0:'ACCEPT',1:'REJECT',2:'UNKNOWN'}[p.returncode],
                      'stdout_sha256':hashlib.sha256(p.stdout).hexdigest(),
                      'stderr_sha256':hashlib.sha256(p.stderr).hexdigest(),
                      'stderr_tail':[x.decode(errors='replace')[-250:] for x in p.stderr.splitlines()[-3:]]}

          deep_runs = [probe(deep,b) for b in (65536,262144,1048576,4194304,14155776)]
          n7_runs = [probe(n7,b) for b in (65536,14155776)]
          assert [x.get('exit') for x in n7_runs] == [2,0], n7_runs
          forged=[]
          for rel,digest,expected in (
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-fields.ndjson', '33993418d305e980e224d6102be2fc61ee9c02be1c8c23ccce00a406616ba6d6', 1),
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-motive.ndjson', '2eb5034aa01b1591cc99577bacc50095e3d8e80709172175f569e1f481f680de', 2),
              ('nucleus-quotient-reuse-20261104/heldout/mutated.ndjson', 'a4425142910417814594d555ccec8ac1b29bbe8d18f12993f20fa1c0253fd692', 1),
          ):
              source=(Path('experiments') / rel).read_bytes()
              assert hashlib.sha256(source).hexdigest()==digest
              result=probe(source,65536)
              assert result.get('exit')==expected, (rel,result)
              forged.append({'case':rel,'exit':result['exit']})
          print(json.dumps({'scope':'read-only exact original deep-n36 budget ladder',
                            'source_commit':os.environ.get('GITHUB_SHA'),
                            'checker_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),
                            'sources':{'deep_n36':digests[0],'n7_control':digests[1]},
                            'deep_n36':deep_runs,'n7_controls':n7_runs,'forged_controls':forged},
                           sort_keys=True))
          PY
      - name: Native diagnostics library regression
        run: cargo test --locked --manifest-path metatron-kernel/Cargo.toml --features diagnostics --lib
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-c166-frozen-deep-n36-ladder
          path: ${{ runner.temp }}/c166-deep-n36-budget-ladder.json
