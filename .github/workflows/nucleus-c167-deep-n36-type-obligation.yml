name: Nucleus C167 frozen deep-n36 type-obligation trace

on:
  push:
    branches: [research/nucleus-c167-deep-n36-type-obligation-20261114]
    paths:
      - .github/workflows/nucleus-c167-deep-n36-type-obligation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trace-frozen-deep-n36:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      NUCLEUS_EXPERIMENTAL_RELEVANCE: '1'
      NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA: '1'
      NUCLEUS_EXPERIMENTAL_DEMAND_MAJOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Recover exact original Arena inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original196"
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > "$RUNNER_TEMP/original196.zip"
          printf '%s  %s\n' f6cd590db7f6fb92b8d1b3ca87231d4b0f521f085d73f93abd005f5caaff86d2 "$RUNNER_TEMP/original196.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/original196.zip" lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C "$RUNNER_TEMP/original196"
          printf '%s  %s\n' 6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac "$RUNNER_TEMP/original196/good/perf/magma-list-deep-n36.ndjson" | sha256sum -c -
          printf '%s  %s\n' abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35 "$RUNNER_TEMP/original196/good/perf/magma-list-pair-n7.ndjson" | sha256sum -c -
      - name: Build unchanged checker with existing diagnostics
        run: cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics --example nucleus_budget_ladder
      - name: Trace exact function-type mismatch with observer ON/OFF parity
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/original196/good/perf/magma-list-deep-n36.ndjson" "$RUNNER_TEMP/original196/good/perf/magma-list-pair-n7.ndjson" "$RUNNER_TEMP" <<'PY' | tee "$RUNNER_TEMP/c167-deep-n36-type-obligation.json"
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          deep = Path(sys.argv[1]).read_bytes()
          n7 = Path(sys.argv[2]).read_bytes()
          outdir = Path(sys.argv[3])
          deep_hash = '6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac'
          n7_hash = 'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'
          assert hashlib.sha256(deep).hexdigest() == deep_hash
          assert hashlib.sha256(n7).hexdigest() == n7_hash
          binary = Path('metatron-kernel/target/release/examples/nucleus_budget_ladder').resolve()
          base_env = dict(os.environ)
          for key in list(base_env):
              if key.startswith('NUCLEUS_TRACE_') or key.startswith('NUCLEUS_DIAGNOSTIC_') or key.startswith('NUCLEUS_C1'):
                  base_env.pop(key)
          trace_keys = ('NUCLEUS_TRACE_DOWNSTREAM', 'NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE',
                        'NUCLEUS_TRACE_RIGID_TYPE_MISMATCH')

          def probe(source, budget, observer, case, timeout=120):
              env = dict(base_env)
              if observer:
                  env.update({k:'1' for k in trace_keys})
              p = subprocess.run([str(binary), str(budget)], input=source, env=env,
                                 capture_output=True, timeout=timeout, check=False)
              lines = p.stderr.decode(errors='replace').splitlines()
              if observer and case == 'deep-n36':
                  (outdir / f'c167-deep-{budget}.stderr').write_bytes(p.stderr)
              relevant = [line for line in lines if line.startswith((
                  'NUCLEUS_APPLICATION_FUNCTION_TYPE:', 'NUCLEUS_RIGID_TYPE_MISMATCH:',
                  'NUCLEUS_RIGID_TYPE_MAJOR:', 'NUCLEUS_TYPE_EXPOSURE_UNKNOWN:',
                  'NUCLEUS_DOWNSTREAM:'))]
              targets = [line for line in relevant if 'application=ExprId(18974)' in line]
              first_target = relevant.index(targets[0]) if targets else None
              nearby = relevant[max(0,first_target-8):first_target+2] if first_target is not None else []
              return {'case':case, 'budget':budget, 'observer':observer,
                      'exit':p.returncode, 'outcome':{0:'ACCEPT',1:'REJECT',2:'UNKNOWN'}.get(p.returncode,'ERROR'),
                      'stderr_bytes':len(p.stderr), 'stderr_sha256':hashlib.sha256(p.stderr).hexdigest(),
                      'relevant_count':len(relevant), 'target_app_count':len(targets),
                      'first_target':targets[0][:8000] if targets else None,
                      'near_first_target':[x[:8000] for x in nearby],
                      'first_relevant':[x[:4000] for x in relevant[:5]],
                      'last_relevant':[x[:4000] for x in relevant[-5:]],
                      'stderr_tail':[x[-450:] for x in lines[-3:]]}

          results = [probe(deep,b,on,'deep-n36') for b in (65536,262144,14155776) for on in (False,True)]
          controls = [probe(n7,b,False,'n7-control') for b in (65536,14155776)]
          forged=[]
          for rel,digest,expected in (
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-fields.ndjson','33993418d305e980e224d6102be2fc61ee9c02be1c8c23ccce00a406616ba6d6',1),
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-motive.ndjson','2eb5034aa01b1591cc99577bacc50095e3d8e80709172175f569e1f481f680de',2),
              ('nucleus-quotient-reuse-20261104/heldout/mutated.ndjson','a4425142910417814594d555ccec8ac1b29bbe8d18f12993f20fa1c0253fd692',1)):
              source=(Path('experiments') / rel).read_bytes()
              assert hashlib.sha256(source).hexdigest()==digest
              result=probe(source,65536,False,rel)
              forged.append({'path':rel,'exit':result['exit'],'expected':expected})
          parity=all(results[i]['exit']==results[i+1]['exit'] for i in (0,2,4))
          receipt={'scope':'C167 existing read-only trace hooks only; no proof rule changes',
                   'source_commit':os.environ.get('GITHUB_SHA'),
                   'checker_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),
                   'original_deep_sha256':deep_hash,'original_n7_sha256':n7_hash,
                   'observer_on_off_parity':parity,'deep_n36':results,
                   'n7_controls':controls,'forged_controls':forged}
          print(json.dumps(receipt,sort_keys=True))
          assert parity, 'observer changed deep-n36 verdict'
          assert all(x['exit']==2 for x in results), 'deep-n36 outcome differs from C166'
          assert all(x['target_app_count'] for x in results if x['observer']), 'target application not traced'
          assert [x['exit'] for x in controls] == [2,0], 'N7 controls changed'
          assert all(x['exit']==x['expected'] for x in forged), 'forged negative control changed'
          PY
      - name: Native diagnostics library regression
        run: cargo test --locked --manifest-path metatron-kernel/Cargo.toml --features diagnostics --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c167-frozen-deep-n36-obligation
          path: |
            ${{ runner.temp }}/c167-deep-n36-type-obligation.json
            ${{ runner.temp }}/c167-deep-*.stderr
