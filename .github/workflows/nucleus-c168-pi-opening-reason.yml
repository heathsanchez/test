name: Nucleus C168 exact captured Pi opening reason

on:
  push:
    branches: [research/nucleus-c168-pi-opening-reason-20261114]
    paths:
      - .github/workflows/nucleus-c168-pi-opening-reason.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-locked-captured-opening:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Verify exact original frozen source bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original196"
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > "$RUNNER_TEMP/original196.zip"
          printf '%s  %s\n' f6cd590db7f6fb92b8d1b3ca87231d4b0f521f085d73f93abd005f5caaff86d2 "$RUNNER_TEMP/original196.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/original196.zip" lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C "$RUNNER_TEMP/original196"
          printf '%s  %s\n' 6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac "$RUNNER_TEMP/original196/good/perf/magma-list-deep-n36.ndjson" | sha256sum -c -
          printf '%s  %s\n' abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35 "$RUNNER_TEMP/original196/good/perf/magma-list-pair-n7.ndjson" | sha256sum -c -
      - name: Compile checker with read-only C168 reason hooks
        run: cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics --example nucleus_budget_ladder
      - name: Collect captured-Pi opening reason with control parity
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/original196/good/perf/magma-list-deep-n36.ndjson" "$RUNNER_TEMP/original196/good/perf/magma-list-pair-n7.ndjson" <<'PY' | tee "$RUNNER_TEMP/c168-pi-opening-reason.json"
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          deep,n7=[Path(x).read_bytes() for x in sys.argv[1:]]
          assert hashlib.sha256(deep).hexdigest()=='6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac'
          assert hashlib.sha256(n7).hexdigest()=='abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'
          source_path=Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json')
          flags=json.loads(source_path.read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          base={k:v for k,v in os.environ.items() if not k.startswith(('NUCLEUS_TRACE_','NUCLEUS_DIAGNOSTIC_','NUCLEUS_C1'))}
          base.update(flags)
          binary=Path('metatron-kernel/target/release/examples/nucleus_budget_ladder').resolve()

          def probe(source,budget,observer,case):
              env=dict(base)
              if observer:
                  env['NUCLEUS_C168_OPENING_REASON']='1'
                  env['NUCLEUS_TRACE_DOWNSTREAM']='1'
                  env['NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE']='1'
                  env['NUCLEUS_TRACE_RIGID_TYPE_MISMATCH']='1'
              p=subprocess.run([str(binary),str(budget)],input=source,env=env,capture_output=True,timeout=120)
              lines=p.stderr.decode(errors='replace').splitlines()
              selected=[x for x in lines if x.startswith((
                  'NUCLEUS_C168_OPEN_RESULT:', 'NUCLEUS_C168_OPEN_BLOCK:',
                  'NUCLEUS_RIGID_TYPE_MISMATCH:', 'NUCLEUS_DOWNSTREAM:'))]
              return {'case':case,'budget':budget,'observer':observer,'exit':p.returncode,
                      'sha256_stderr':hashlib.sha256(p.stderr).hexdigest(),
                      'open_results':[x for x in selected if x.startswith('NUCLEUS_C168_OPEN_RESULT:')][:20],
                      'open_blocks':[x for x in selected if x.startswith('NUCLEUS_C168_OPEN_BLOCK:')][:20],
                      'tail':selected[-3:]}

          checks=[probe(deep,b,on,'deep-n36') for b in (65536,262144,14155776) for on in (False,True)]
          controls=[probe(n7,b,False,'n7-control') for b in (65536,14155776)]
          forged=[]
          for rel,digest,expected in (
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-fields.ndjson','33993418d305e980e224d6102be2fc61ee9c02be1c8c23ccce00a406616ba6d6',1),
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-motive.ndjson','2eb5034aa01b1591cc99577bacc50095e3d8e80709172175f569e1f481f680de',2),
              ('nucleus-quotient-reuse-20261104/heldout/mutated.ndjson','a4425142910417814594d555ccec8ac1b29bbe8d18f12993f20fa1c0253fd692',1)):
              payload=(Path('experiments')/rel).read_bytes()
              assert hashlib.sha256(payload).hexdigest()==digest
              result=probe(payload,65536,False,rel)
              forged.append({'path':rel,'exit':result['exit'],'expected':expected})
          print(json.dumps({'scope':'C168 read-only opening reason of frozen deep-n36 Expr15367 FreeId2',
                            'commit':os.environ.get('GITHUB_SHA'),
                            'checker_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),
                            'flags':sorted(flags),'deep_n36':checks,
                            'n7_controls':controls,'forged_controls':forged},sort_keys=True))
          assert all(a['exit']==b['exit']==2 for a,b in zip(checks[::2],checks[1::2]))
          assert all(x['open_results'] and x['open_blocks'] for x in checks[1::2]), 'no targeted opening reason'
          assert [x['exit'] for x in controls]==[2,0]
          assert all(x['exit']==x['expected'] for x in forged)
          PY
      - name: Native diagnostics library regression
        run: cargo test --locked --manifest-path metatron-kernel/Cargo.toml --features diagnostics --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c168-exact-pi-opening-reason
          path: ${{ runner.temp }}/c168-pi-opening-reason.json
