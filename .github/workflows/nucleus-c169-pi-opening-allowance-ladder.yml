name: Nucleus C169 source-gated Pi opening allowance ladder

on:
  push:
    branches: [research/nucleus-c169-pi-opening-ladder-20261114]
    paths:
      - .github/workflows/nucleus-c169-pi-opening-allowance-ladder.yml
      - metatron-kernel/src/convert.rs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-locked-allowance-ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Recover exact original export and validate SHA256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original196"
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > "$RUNNER_TEMP/original196.zip"
          printf '%s  %s\n' f6cd590db7f6fb92b8d1b3ca87231d4b0f521f085d73f93abd005f5caaff86d2 "$RUNNER_TEMP/original196.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/original196.zip" lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C "$RUNNER_TEMP/original196"
          printf '%s  %s\n' 6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac "$RUNNER_TEMP/original196/good/perf/magma-list-deep-n36.ndjson" | sha256sum -c -
          printf '%s  %s\n' abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35 "$RUNNER_TEMP/original196/good/perf/magma-list-pair-n7.ndjson" | sha256sum -c -
      - name: Compile diagnostic checker
        run: cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics --example nucleus_budget_ladder
      - name: Run controlled source-local opening allowance ladder
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/original196/good/perf/magma-list-deep-n36.ndjson" "$RUNNER_TEMP/original196/good/perf/magma-list-pair-n7.ndjson" <<'PY' | tee "$RUNNER_TEMP/c169-opening-allowance-ladder.json"
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          deep,n7=[Path(x).read_bytes() for x in sys.argv[1:]]
          assert hashlib.sha256(deep).hexdigest()=='6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac'
          assert hashlib.sha256(n7).hexdigest()=='abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'
          flags=json.loads(Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          env_base={k:v for k,v in os.environ.items() if not k.startswith(('NUCLEUS_TRACE_','NUCLEUS_DIAGNOSTIC_','NUCLEUS_C1'))}
          env_base.update(flags)
          binary=Path('metatron-kernel/target/release/examples/nucleus_budget_ladder').resolve()
          rx=re.compile(r'allowance=(\d+):spent=(\d+):left=(\d+):safe=(true|false)')

          def probe(source,global_steps,opening_cap,trace=True):
              env=dict(env_base)
              if trace:
                  env.update(NUCLEUS_C168_OPENING_REASON='1',NUCLEUS_TRACE_DOWNSTREAM='1',
                             NUCLEUS_C169_OPENING_ALLOWANCE=str(opening_cap))
              p=subprocess.run([str(binary),str(global_steps)],input=source,env=env,
                               capture_output=True,timeout=120,check=False)
              lines=p.stderr.decode(errors='replace').splitlines()
              opened=[x for x in lines if x.startswith('NUCLEUS_C168_OPEN_RESULT:')]
              blocked=[x for x in lines if x.startswith('NUCLEUS_C168_OPEN_BLOCK:')]
              captures=[{'allowed':int(m.group(1)),'spent':int(m.group(2)),
                         'left':int(m.group(3)),'safe':m.group(4)=='true'}
                        for line in opened if (m:=rx.search(line))]
              return {'global_steps':global_steps,'opening_cap':opening_cap,'exit':p.returncode,
                      'observer':trace,'opening':captures,'blocks':blocked[:8],
                      'terminal':[line for line in lines if line.startswith('NUCLEUS_DOWNSTREAM:')][-3:],
                      'stderr_sha256':hashlib.sha256(p.stderr).hexdigest()}

          ladder=[probe(deep,b,cap) for b in (65536,262144)
                  for cap in (1024,2048,4096,8192,16384)]
          n7_controls=[probe(n7,b,16384,False) for b in (65536,14155776)]
          forged=[]
          for rel,digest in (
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-fields.ndjson','33993418d305e980e224d6102be2fc61ee9c02be1c8c23ccce00a406616ba6d6'),
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-motive.ndjson','2eb5034aa01b1591cc99577bacc50095e3d8e80709172175f569e1f481f680de'),
              ('nucleus-quotient-reuse-20261104/heldout/mutated.ndjson','a4425142910417814594d555ccec8ac1b29bbe8d18f12993f20fa1c0253fd692')):
              payload=(Path('experiments')/rel).read_bytes()
              assert hashlib.sha256(payload).hexdigest()==digest
              r=probe(payload,65536,16384,True)
              forged.append({'path':rel,'exit':r['exit']})
          print(json.dumps({'scope':'source-targeted, caller-charged C169 opening-work experiment; not selected kernel',
                            'commit':os.environ.get('GITHUB_SHA'),
                            'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),
                            'ladder':ladder,'n7_controls':n7_controls,'forged':forged},sort_keys=True))
          assert all(row['opening'] for row in ladder), 'source target never reached'
          assert all(all(x['allowed']==row['opening_cap'] for x in row['opening']) for row in ladder), 'requested opening allowance not applied'
          assert all(row['exit'] in (0,2) for row in ladder), 'valid original was rejected'
          assert [r['exit'] for r in n7_controls]==[2,0]
          assert all(r['exit']!=0 for r in forged)
          PY
      - name: Native diagnostic unit regression
        run: cargo test --locked --manifest-path metatron-kernel/Cargo.toml --features diagnostics --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c169-frozen-opening-ladder
          path: ${{ runner.temp }}/c169-opening-allowance-ladder.json
