name: Nucleus C175 exact Mathlib recOnSwap source-typed prefix probe
on:
  push:
    branches: [research/nucleus-c170-pi-opening-wired-20261115]
    paths: ['.github/workflows/nucleus-c175-reconswap-prefix.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-typed:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Recover exact whole Mathlib export and extract unchanged declaration prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c175"
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > "$RUNNER_TEMP/mathlib-c175.zip"
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b "$RUNNER_TEMP/mathlib-c175.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/mathlib-c175.zip" mathlib.ndjson.zst | zstd -dc > "$RUNNER_TEMP/mathlib-c175.ndjson"
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 "$RUNNER_TEMP/mathlib-c175.ndjson" | sha256sum -c -
          python3 experiments/nucleus-recOnSwap-repair-20261104/extract_prefix.py "$RUNNER_TEMP/mathlib-c175.ndjson" "$RUNNER_TEMP/c175/recOnSwap-prefix.ndjson" | tee "$RUNNER_TEMP/c175/extraction.json"
          rm "$RUNNER_TEMP/mathlib-c175.ndjson" "$RUNNER_TEMP/mathlib-c175.zip"
      - name: Build exact independent diagnostic checker
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics
          sha256sum metatron-kernel/target/release/metatron-kernel > "$RUNNER_TEMP/c175/binary-sha256.txt"
      - name: Observe source-typed failing application in exact prefix under protected flags
        run: |
          python3 - "$RUNNER_TEMP/c175" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          out=pathlib.Path(sys.argv[1]);source=out/'recOnSwap-prefix.ndjson'
          cfg=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(cfg)==24 and set(cfg.values())=={'1'}
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env.update(cfg)
          env.update(NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE='1',NUCLEUS_TRACE_DOWNSTREAM='1')
          t=time.monotonic()
          with source.open('rb') as i,(out/'stdout.txt').open('wb') as stdout,(out/'stderr.txt').open('wb') as stderr:
              try:
                  r=subprocess.run(['metatron-kernel/target/release/metatron-kernel'],stdin=i,stdout=stdout,stderr=stderr,env=env,timeout=900)
                  rc=r.returncode
              except subprocess.TimeoutExpired:rc=124
          lines=(out/'stderr.txt').read_text(errors='replace').splitlines()
          apps=[line for line in lines if line.startswith('NUCLEUS_APPLICATION_FUNCTION_TYPE:')]
          terminals=[line for line in lines if line.startswith('NUCLEUS_DOWNSTREAM:')]
          extract=json.loads((out/'recOnSwap-prefix.json').read_text())
          report={'scope':'exact unmodified Mathlib recOnSwap prefix, read-only typing trace',
                  'commit':os.environ.get('GITHUB_SHA'),'rc':rc,'elapsed_wall_s':round(time.monotonic()-t,2),
                  'prefix_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
                  'prefix_bytes':source.stat().st_size,'source_meta':extract,
                  'application_records':len(apps),'app_first':apps[:6],'app_last':apps[-12:],
                  'downstream':terminals[-12:]}
          (out/'summary.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report)[:24000],flush=True)
          assert rc in (0,2),'valid original prefix rejected or checker failed'
          PY
      - name: Remove large unmodified prefix before uploading bounded receipt
        if: always()
        run: rm -f "$RUNNER_TEMP/c175/recOnSwap-prefix.ndjson"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c175-exact-reconswap-prefix-typed
          path: ${{ runner.temp }}/c175/
          retention-days: 60
