name: Nucleus C176 decode recOnSwap authentic application source
on:
  push:
    branches: [research/nucleus-c170-pi-opening-wired-20261115]
    paths: ['.github/workflows/nucleus-c176-reconswap-app-source.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover SHA-locked full Mathlib and truncate to exact theorem
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c176"
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > "$RUNNER_TEMP/c176/mathlib.zip"
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b "$RUNNER_TEMP/c176/mathlib.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/c176/mathlib.zip" mathlib.ndjson.zst | zstd -dc > "$RUNNER_TEMP/c176/mathlib.ndjson"
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 "$RUNNER_TEMP/c176/mathlib.ndjson" | sha256sum -c -
          python3 experiments/nucleus-recOnSwap-repair-20261104/extract_prefix.py "$RUNNER_TEMP/c176/mathlib.ndjson" "$RUNNER_TEMP/c176/prefix.ndjson"
          printf '%s  %s\n' 856050129c6f620672154aab7df37c2ba73d777034d583739ebcb78a231cfd61 "$RUNNER_TEMP/c176/prefix.ndjson" | sha256sum -c -
          rm "$RUNNER_TEMP/c176/mathlib.zip" "$RUNNER_TEMP/c176/mathlib.ndjson"
      - name: Decode exact typed-obligation expressions and source names
        run: |
          python3 - "$RUNNER_TEMP/c176/prefix.ndjson" "$RUNNER_TEMP/c176/summary.json" <<'PY'
          import json,pathlib,sys,collections
          inp=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2])
          expr={};names={0:None};declarations=[]
          for ln,line in enumerate(inp.open(),1):
              x=json.loads(line)
              if 'ie' in x:expr[x['ie']]=(ln,x)
              if 'in' in x:names[x['in']]=x
              if any(k in x for k in ['axiom','def','thm','opaque','quot','inductive','constructor','recursor']):
                  declarations.append((ln,x))
          def name(i):
              if not i:return ''
              v=names.get(i)
              if not v:return f'<unknown:{i}>'
              if 'str' in v:
                  b=v['str'];return name(b['pre'])+'.'+b['str']
              if 'num' in v:
                  b=v['num'];return name(b['pre'])+'.'+str(b['i'])
              return f'<unknown:{i}>'
          def related(eid,depth=0):
              if depth>=4 or eid not in expr:return {'id':eid}
              ln,x=expr[eid];kind=next((k for k in x if k not in ('ie',)),None);val=x.get(kind)
              d={'id':eid,'line':ln,'kind':kind}
              if kind=='const':d.update(name=name(val.get('name')),levels=val.get('us'))
              elif kind=='app':d.update(fn=related(val['fn'],depth+1),arg=related(val['arg'],depth+1))
              elif kind in ('lam','forallE'):d.update(domain=related(val['type'],depth+1),body=related(val['body'],depth+1))
              elif kind=='bvar':d.update(index=val)
              else:d['source']=val
              return d
          targets=(6350,6336,6349,6389,6319)
          assert all(i in expr for i in targets),'source target missing'
          assert 'app' in expr[6350][1]
          assert expr[6350][1]['app']=={'fn':6336,'arg':6349},'unexpected target expression pairing'
          used_names=set()
          for eid in targets:
              for _,x in expr.items():
                  pass
          output={'scope':'exact source only, no checker semantic changes',
                  'prefix_bytes':inp.stat().st_size,'expression_count':len(expr),
                  'last_declaration':declarations[-1][0] if declarations else None,
                  'targets':{str(i):related(i) for i in targets},
                  'decls_near_target':[{'line':ln,'kind':k,'name':name(v[k].get('name'))}
                      for ln,v in declarations[-12:] for k in v if isinstance(v.get(k),dict)]}
          out.write_text(json.dumps(output,indent=2))
          print(json.dumps(output)[:28000])
          PY
      - name: Clear unchanged extracted input before uploading small decoded witness
        if: always()
        run: rm -f "$RUNNER_TEMP/c176/prefix.ndjson"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c176-authentic-app-source
          path: ${{ runner.temp }}/c176/summary.json
          retention-days: 60
