name: Nucleus C177 exact Mathlib neutral-head witness
on:
  push:
    branches: [research/nucleus-c170-pi-opening-wired-20261115]
    paths: ['.github/workflows/nucleus-c177-reconswap-neutral-heads.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-typed:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Recover exact whole Mathlib export and extract unchanged declaration prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c177"
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > "$RUNNER_TEMP/mathlib-c177.zip"
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b "$RUNNER_TEMP/mathlib-c177.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/mathlib-c177.zip" mathlib.ndjson.zst | zstd -dc > "$RUNNER_TEMP/mathlib-c177.ndjson"
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 "$RUNNER_TEMP/mathlib-c177.ndjson" | sha256sum -c -
          python3 experiments/nucleus-recOnSwap-repair-20261104/extract_prefix.py "$RUNNER_TEMP/mathlib-c177.ndjson" "$RUNNER_TEMP/c177/recOnSwap-prefix.ndjson" | tee "$RUNNER_TEMP/c177/extraction.json"
          rm "$RUNNER_TEMP/mathlib-c177.ndjson" "$RUNNER_TEMP/mathlib-c177.zip"
      - name: Build exact independent diagnostic checker
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics
          sha256sum metatron-kernel/target/release/metatron-kernel > "$RUNNER_TEMP/c177/binary-sha256.txt"
      - name: Trace exact Γ10 neutral-head mismatch without changing checker
        run: |
          python3 - "$RUNNER_TEMP/c177" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          out=pathlib.Path(sys.argv[1]);source=out/'recOnSwap-prefix.ndjson'
          cfg=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(cfg)==24 and set(cfg.values())=={'1'}
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env.update(cfg)
          env.update(NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE='1',NUCLEUS_TRACE_DOWNSTREAM='1')
          cases=[]
          for enabled in (False,True):
              local_env=dict(env)
              if enabled:local_env['NUCLEUS_TRACE_NEUTRAL_HEADS']='1'
              mode='on' if enabled else 'off'
              t=time.monotonic()
              with source.open('rb') as i,(out/(mode+'.stdout')).open('wb') as stdout,(out/(mode+'.stderr')).open('wb') as stderr:
                  try:
                      rc=subprocess.run(['metatron-kernel/target/release/metatron-kernel'],stdin=i,stdout=stdout,stderr=stderr,env=local_env,timeout=100).returncode
                  except subprocess.TimeoutExpired:rc=124
              p=out/(mode+'.stderr')
              mismatches=[];apps=[];terminals=[];counts={}
              with p.open(errors='replace') as f:
                  for line in f:
                      line=line.rstrip('\n')
                      if line.startswith('NUCLEUS_NEUTRAL_HEAD_MISMATCH:'):
                          depth=line.split(':',2)[1:2]
                          if ':depth=10:context_len=10:' in line:
                              mismatches.append(line[:6000])
                          counts['all_mismatch']=counts.get('all_mismatch',0)+1
                      elif line.startswith('NUCLEUS_APPLICATION_FUNCTION_TYPE:') and 'application=ExprId(6350)' in line:
                          apps.append(line[:3000])
                      elif line.startswith('NUCLEUS_DOWNSTREAM:'):
                          terminals.append(line[:500])
              result=dict(trace=mode,rc=rc,elapsed_s=round(time.monotonic()-t,4),
                  stderr_bytes=p.stat().st_size,stderr_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),
                  stdout_sha256=hashlib.sha256((out/(mode+'.stdout')).read_bytes()).hexdigest(),
                  all_neutral_mismatch_count=counts.get('all_mismatch',0),
                  gamma10_records=len(mismatches),gamma10_first=mismatches[:25],
                  gamma10_last=mismatches[-25:],application_target=apps[-8:],terminal=terminals[-2:])
              cases.append(result)
          target=json.loads((out/'recOnSwap-prefix.json').read_text())
          report=dict(scope='C177 source-locked read-only divergent neutral heads in original Γ10',
              commit=os.environ.get('GITHUB_SHA'),source=target,
              prefix_sha256=hashlib.sha256(source.read_bytes()).hexdigest(),cases=cases)
          (out/'summary.json').write_text(json.dumps(report,indent=2))
          print('C177_SUMMARY:'+json.dumps(report)[:30000],flush=True)
          assert [c['rc'] for c in cases]==[2,2], 'tracing changed source verdict'
          assert cases[0]['stdout_sha256']==cases[1]['stdout_sha256'], 'tracing changed output'
          assert cases[1]['gamma10_records']>0,'target Γ10 neutral mismatch was not observed'
          PY
      - name: Remove large unmodified prefix before uploading bounded receipt
        if: always()
        run: rm -f "$RUNNER_TEMP/c177/recOnSwap-prefix.ndjson"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c177-neutral-heads
          path: ${{ runner.temp }}/c177/
          retention-days: 60
