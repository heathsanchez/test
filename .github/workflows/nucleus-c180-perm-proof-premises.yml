name: Nucleus C180 source-typed Perm nil/refl proof-obligation separator
on:
  push:
    branches: [research/nucleus-c170-pi-opening-wired-20261115]
    paths: ['.github/workflows/nucleus-c180-perm-proof-premises.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Recover reused source-pinned Mathlib prefix without re-exporting 6GB
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c180"
          gh api repos/heathsanchez/test/actions/artifacts/14136676807/zip > "$RUNNER_TEMP/c180-prefix.zip"
          printf '%s  %s\n' 3d057e397b67df92a5c0758f1a4e971ac17e14df5e623f2a129a05ddda788453 "$RUNNER_TEMP/c180-prefix.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/c180-prefix.zip" -d "$RUNNER_TEMP/c180"
          printf '%s  %s\n' 856050129c6f620672154aab7df37c2ba73d777034d583739ebcb78a231cfd61 "$RUNNER_TEMP/c180/prefix.ndjson" | sha256sum -c -
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          sha256sum metatron-kernel/target/release/metatron-kernel > "$RUNNER_TEMP/c180/binary.sha256"
      - name: Matched diagnosis and forged-proof non-ACCEPT controls
        run: |
          python3 - "$RUNNER_TEMP/c180" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          out=pathlib.Path(sys.argv[1]);source=(out/'prefix.ndjson').read_bytes()
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          baseline={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          baseline.update(flags)
          baseline.update(NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE='1',NUCLEUS_TRACE_DOWNSTREAM='1')
          checker='metatron-kernel/target/release/metatron-kernel'
          rows=[]
          for trace in (False,True):
              env=dict(baseline)
              if trace:env['NUCLEUS_C180_PERM_TELESCOPE']='1'
              started=time.monotonic()
              p=subprocess.run([checker],input=source,env=env,capture_output=True,timeout=150)
              lines=p.stderr.decode(errors='replace').splitlines()
              tel=[x[:7000] for x in lines if x.startswith('NUCLEUS_C180_PERM_TELESCOPE:')]
              app=[x[:2000] for x in lines if x.startswith('NUCLEUS_APPLICATION_FUNCTION_TYPE:') and 'application=ExprId(6350)' in x]
              rows.append({'trace':trace,'exit':p.returncode,'seconds':round(time.monotonic()-started,3),
                           'telescopes':tel,'target_app':app[-4:],'stdout_sha256':hashlib.sha256(p.stdout).hexdigest(),
                           'stderr_sha256':hashlib.sha256(p.stderr).hexdigest()})
          adversaries=[]
          for path,digest in (
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-fields.ndjson','33993418d305e980e224d6102be2fc61ee9c02be1c8c23ccce00a406616ba6d6'),
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-motive.ndjson','2eb5034aa01b1591cc99577bacc50095e3d8e80709172175f569e1f481f680de'),
              ('nucleus-quotient-reuse-20261104/heldout/mutated.ndjson','a4425142910417814594d555ccec8ac1b29bbe8d18f12993f20fa1c0253fd692')):
              payload=(pathlib.Path('experiments')/path).read_bytes()
              assert hashlib.sha256(payload).hexdigest()==digest
              env=dict(baseline);env['NUCLEUS_C180_PERM_TELESCOPE']='1'
              p=subprocess.run([checker],input=payload,env=env,capture_output=True,timeout=120)
              adversaries.append({'source':path,'sha256':digest,'exit':p.returncode})
          report={'scope':'source-gated C180 isolated diagnostic only; no proof-irrelevance authority',
                  'commit':os.environ.get('GITHUB_SHA'),'source_sha256':hashlib.sha256(source).hexdigest(),
                  'verdicts':rows,'forged':adversaries}
          (out/'c180-summary.json').write_text(json.dumps(report,indent=2))
          print('C180_SUMMARY:'+json.dumps(report)[:28000],flush=True)
          assert [x['exit'] for x in rows]==[2,2],'positive verdict changed under read-only trace'
          assert rows[0]['stdout_sha256']==rows[1]['stdout_sha256'],'stdout changed'
          assert rows[1]['telescopes'],'no source-telescope witness produced'
          assert all(x['exit']!=0 for x in adversaries),'forged control was ACCEPT'
          PY
      - name: Native diagnostics unit tests
        run: cargo test --locked --manifest-path metatron-kernel/Cargo.toml --features diagnostics --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c180-perm-proof-premises
          path: |
            ${{ runner.temp }}/c180/c180-summary.json
            ${{ runner.temp }}/c180/binary.sha256
          retention-days: 60
