name: Nucleus C182 checked proof irrelevance genuine Mathlib prefix A/B
on:
  push:
    branches: [research/nucleus-c182-typed-proof-irrel-20261115]
    paths: ['.github/workflows/nucleus-c182-typed-proof-irrel.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-qualified:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Retrieve pinned actual Mathlib theorem prefix and compile candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c182"
          gh api repos/heathsanchez/test/actions/artifacts/14136676807/zip > "$RUNNER_TEMP/c182-source.zip"
          printf '%s  %s\n' 3d057e397b67df92a5c0758f1a4e971ac17e14df5e623f2a129a05ddda788453 "$RUNNER_TEMP/c182-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/c182-source.zip" -d "$RUNNER_TEMP/c182"
          printf '%s  %s\n' 856050129c6f620672154aab7df37c2ba73d777034d583739ebcb78a231cfd61 "$RUNNER_TEMP/c182/prefix.ndjson" | sha256sum -c -
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          sha256sum metatron-kernel/target/release/metatron-kernel > "$RUNNER_TEMP/c182/binary.sha256"
      - name: Run exact-prefix opt-in A/B and three forged negative controls
        run: |
          python3 - "$RUNNER_TEMP/c182" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          out=pathlib.Path(sys.argv[1])
          source=(out/'prefix.ndjson').read_bytes()
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          env_base={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env_base.update(flags)
          binary='metatron-kernel/target/release/metatron-kernel'
          results=[]
          for candidate in (False,True):
              env=dict(env_base);env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              if candidate:
                  env['NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL']='1'
                  env['NUCLEUS_C182_PROOF_OBSERVE']='1'
              started=time.monotonic()
              p=subprocess.run([binary],input=source,env=env,capture_output=True,timeout=180)
              lines=p.stderr.decode(errors='replace').splitlines()
              results.append({'mode':'candidate' if candidate else 'baseline','exit':p.returncode,
                  'seconds':round(time.monotonic()-started,4),
                  'source_sha256':hashlib.sha256(source).hexdigest(),
                  'terminal':[x for x in lines if x.startswith('NUCLEUS_DOWNSTREAM:')][-4:],
                  'proof_observations':[x[:1500] for x in lines if x.startswith('NUCLEUS_C182_PROOF:')][:14],
                  'stderr_sha256':hashlib.sha256(p.stderr).hexdigest(),
                  'stdout_sha256':hashlib.sha256(p.stdout).hexdigest()})
          negatives=[]
          for path,digest in (
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-fields.ndjson','33993418d305e980e224d6102be2fc61ee9c02be1c8c23ccce00a406616ba6d6'),
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-motive.ndjson','2eb5034aa01b1591cc99577bacc50095e3d8e80709172175f569e1f481f680de'),
              ('nucleus-quotient-reuse-20261104/heldout/mutated.ndjson','a4425142910417814594d555ccec8ac1b29bbe8d18f12993f20fa1c0253fd692')):
              data=(pathlib.Path('experiments')/path).read_bytes()
              assert hashlib.sha256(data).hexdigest()==digest
              env=dict(env_base);env['NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL']='1'
              p=subprocess.run([binary],input=data,env=env,capture_output=True,timeout=120)
              negatives.append({'source':path,'sha256':digest,'exit':p.returncode})
          report={'scope':'C182 isolated semantic candidate, not promoted', 'commit':os.environ.get('GITHUB_SHA'),
              'cases':results,'forged':negatives}
          (out/'summary.json').write_text(json.dumps(report,indent=2))
          print('C182_SUMMARY:'+json.dumps(report)[:16000],flush=True)
          assert results[0]['exit']==2,'baseline must reproduce UNKNOWN'
          assert results[1]['exit'] in (0,2),'candidate incorrectly REJECTED valid source'
          assert all(n['exit']!=0 for n in negatives),'candidate incorrectly ACCEPTED forgery'
          PY
      - name: Native diagnostic unit regression
        run: cargo test --locked --manifest-path metatron-kernel/Cargo.toml --features diagnostics --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c182-source-typed-proof-irrel-trial
          path: |
            ${{ runner.temp }}/c182/summary.json
            ${{ runner.temp }}/c182/binary.sha256
          retention-days: 60
