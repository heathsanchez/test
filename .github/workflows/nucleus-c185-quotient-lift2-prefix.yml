name: Nucleus C185 exact next Mathlib Quotient.lift2 proof-prefix extraction
on:
  push:
    branches: [research/nucleus-c182-typed-proof-irrel-20261115]
    paths: ['.github/workflows/nucleus-c185-quotient-lift2-prefix.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prefix-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Recover exact frozen complete Mathlib and preserve first Quotient target prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c185"
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > "$RUNNER_TEMP/c185/mathlib.zip"
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b "$RUNNER_TEMP/c185/mathlib.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/c185/mathlib.zip" mathlib.ndjson.zst | zstd -dc > "$RUNNER_TEMP/c185/mathlib.ndjson"
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 "$RUNNER_TEMP/c185/mathlib.ndjson" | sha256sum -c -
          python3 experiments/nucleus-c185-quotient-lift2-prefix.py "$RUNNER_TEMP/c185/mathlib.ndjson" "$RUNNER_TEMP/c185/quotient-prefix.ndjson" | tee "$RUNNER_TEMP/c185/extraction.json"
          rm "$RUNNER_TEMP/c185/mathlib.zip" "$RUNNER_TEMP/c185/mathlib.ndjson"
      - name: Build exact C182 independent source checker
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics
          sha256sum metatron-kernel/target/release/metatron-kernel > "$RUNNER_TEMP/c185/binary.sha256"
      - name: Replay same source with C182 candidate OFF and ON; observe next actual failure
        run: |
          python3 - "$RUNNER_TEMP/c185" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          out=pathlib.Path(sys.argv[1]);data=(out/'quotient-prefix.ndjson').read_bytes()
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          env0={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env0.update(flags)
          cases=[]
          for candidate in (False,True):
              env=dict(env0);env.update(NUCLEUS_TRACE_DOWNSTREAM='1',NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE='1')
              if candidate:env['NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL']='1'
              t=time.monotonic()
              p=subprocess.run(['metatron-kernel/target/release/metatron-kernel'],input=data,env=env,capture_output=True,timeout=180)
              lines=p.stderr.decode(errors='replace').splitlines()
              apps=[x for x in lines if x.startswith('NUCLEUS_APPLICATION_FUNCTION_TYPE:')]
              terminal=[x for x in lines if x.startswith('NUCLEUS_DOWNSTREAM:')]
              cases.append({'mode':'candidate' if candidate else 'baseline','exit':p.returncode,
                            'elapsed_s':round(time.monotonic()-t,4),
                            'application_count':len(apps),'application_last':apps[-8:],
                            'terminal':terminal[-5:],
                            'stdout_sha256':hashlib.sha256(p.stdout).hexdigest(),
                            'stderr_sha256':hashlib.sha256(p.stderr).hexdigest()})
          report={'scope':'C185 original Mathlib source-prefix next declaration after C182, no new semantics',
                  'commit':os.environ.get('GITHUB_SHA'),
                  'source_meta':json.loads((out/'quotient-prefix.json').read_text()),
                  'cases':cases}
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print('C185_REPORT:'+json.dumps(report,ensure_ascii=False)[:24000],flush=True)
          assert all(c['exit'] in (0,2) for c in cases),'valid source unexpectedly rejected'
          assert cases[0]['exit']==2,'baseline no longer reproduces expected residual'
          PY
      - name: Remove large export after qualification, retain exact small prefix
        if: always()
        run: rm -f "$RUNNER_TEMP/c185/mathlib.ndjson" "$RUNNER_TEMP/c185/mathlib.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c185-quotient-lift2-exact-prefix
          path: |
            ${{ runner.temp }}/c185/quotient-prefix.ndjson
            ${{ runner.temp }}/c185/quotient-prefix.json
            ${{ runner.temp }}/c185/report.json
            ${{ runner.temp }}/c185/binary.sha256
          retention-days: 60
