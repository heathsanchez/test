name: Nucleus C187 classify C186 actual neutral contexts
on:
  push:
    branches: [research/nucleus-c182-typed-proof-irrel-20261115]
    paths: ['.github/workflows/nucleus-c187-neutral-context-census.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact failed C186 diagnostic artifact and classify all 59 mismatches
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c187"
          gh api repos/heathsanchez/test/actions/artifacts/14136689303/zip > "$RUNNER_TEMP/c187/c186.zip"
          printf '%s  %s\n' 74734ce1701d74c7794d372c06111eb977186d75768ca6297ae00193f6f48b91 "$RUNNER_TEMP/c187/c186.zip" | sha256sum -c -
          unzip -l "$RUNNER_TEMP/c187/c186.zip"
          unzip -q "$RUNNER_TEMP/c187/c186.zip" -d "$RUNNER_TEMP/c187/raw"
          python3 - "$RUNNER_TEMP/c187/raw" "$RUNNER_TEMP/c187/reconciliation.json" <<'PY'
          import collections,json,pathlib,re,sys
          root=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2])
          files=list(root.rglob('on.stderr'))
          assert len(files)==1,f'expected exact trace file; files={files}'
          lines=files[0].read_text(errors='replace').splitlines()
          mismatch=[x for x in lines if x.startswith('NUCLEUS_NEUTRAL_HEAD_MISMATCH:')]
          assert len(mismatch)==59,(len(mismatch),mismatch[:5])
          counts=collections.Counter()
          bykey=collections.defaultdict(list)
          for x in mismatch:
              d=re.search(r':depth=(\d+):context_len=(\d+):',x)
              key=f'{d.group(1)}/{d.group(2)}' if d else 'unknown'
              counts[key]+=1
              bykey[key].append(x)
          r={'scope':'read only C187 annotation of exact C186 failed harness trace; not semantic witness',
             'source_artifact':14136689303,'trace_count':len(mismatch),
             'context_counts':dict(counts),'samples':{k:v[:6] for k,v in bykey.items()},
             'raw_first':mismatch[:12],'raw_last':mismatch[-12:]}
          out.write_text(json.dumps(r,indent=2))
          print('C187_RESULT:'+json.dumps(r)[:25000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c187-source-mismatch-census
          path: ${{ runner.temp }}/c187/reconciliation.json
