name: Nucleus C188 source-decode Quotient recursor heads
on:
  push:
    branches: [research/nucleus-c182-typed-proof-irrel-20261115]
    paths: ['.github/workflows/nucleus-c188-quotient-source-head-names.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  names:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Decode source-owned heads in exact immutable prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c188"
          gh api repos/heathsanchez/test/actions/artifacts/14137666683/zip > "$RUNNER_TEMP/c188/fixture.zip"
          printf '%s  %s\n' 91e2decf7d5e8dc5792ce62e0f47b617cd35ed1857a7227bde3550f5bb55f499 "$RUNNER_TEMP/c188/fixture.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/c188/fixture.zip" -d "$RUNNER_TEMP/c188"
          printf '%s  %s\n' 4883dc9889b546a1117c25c266bae05a344b6609db5cbbfd846a8d7abc92a907 "$RUNNER_TEMP/c188/quotient-prefix.ndjson" | sha256sum -c -
          python3 - "$RUNNER_TEMP/c188" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);data=root/'quotient-prefix.ndjson'
          names={0:('root',None)};decls=[]
          for line,n in enumerate(data.open(),1):
              o=json.loads(n)
              if 'in' in o:
                  if 'str' in o:names[o['in']]=('str',o['str'])
                  elif 'num' in o:names[o['in']]=('num',o['num'])
              for kind in ('axiom','def','thm','opaque','inductive','quot'):
                  if isinstance(o.get(kind),dict):
                      decls.append((line,kind,o[kind]))
          def resolve(i,d=0):
              if i==0:return ''
              if d>64:return '<depth>'
              item=names.get(i)
              if item is None:return f'<missing:{i}>'
              k,b=item
              if k=='str':return resolve(b['pre'],d+1)+'.'+b['str']
              if k=='num':return resolve(b['pre'],d+1)+'.'+str(b['i'])
              return ''
          targets=(55,64)
          d={'scope':'C188 exact source name qualification only',
             'prefix_sha256':hashlib.sha256(data.read_bytes()).hexdigest(),
             'heads':{str(i):resolve(i) for i in targets},
             'declarations':{str(i):[{'record':ln,'kind':kind,'keys':list(row.keys()),
                  'type':row.get('type'),'value':row.get('value'),'levelParams':row.get('levelParams')}
                  for ln,kind,row in decls if row.get('name')==i] for i in targets}}
          (root/'report.json').write_text(json.dumps(d,indent=2))
          print('C188_HEADS:'+json.dumps(d,ensure_ascii=False))
          assert all(not resolve(i).startswith('<missing') for i in targets)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c188-source-quotient-heads
          path: ${{ runner.temp }}/c188/report.json
