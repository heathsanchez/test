name: Nucleus C189 historical quotient proof-rule transfer differential
on:
  push:
    branches: [research/nucleus-c189-quotient-neutral-lambda-20261115]
    paths: ['.github/workflows/nucleus-c189-quotient-proof-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Recover verified exact 978KB source and compile C189 experimental checker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c189"
          gh api repos/heathsanchez/test/actions/artifacts/14137666683/zip > "$RUNNER_TEMP/c189/archive.zip"
          printf '%s  %s\n' 91e2decf7d5e8dc5792ce62e0f47b617cd35ed1857a7227bde3550f5bb55f499 "$RUNNER_TEMP/c189/archive.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/c189/archive.zip" -d "$RUNNER_TEMP/c189"
          printf '%s  %s\n' 4883dc9889b546a1117c25c266bae05a344b6609db5cbbfd846a8d7abc92a907 "$RUNNER_TEMP/c189/quotient-prefix.ndjson" | sha256sum -c -
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          sha256sum metatron-kernel/target/release/metatron-kernel > "$RUNNER_TEMP/c189/binary.sha256"
      - name: Compare C182 vs C182 plus C189, including forged exact theorem and other malformed controls
        run: |
          python3 - "$RUNNER_TEMP/c189" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          out=pathlib.Path(sys.argv[1])
          source=(out/'quotient-prefix.ndjson').read_bytes()
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          env0={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env0.update(flags)
          env0['NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL']='1'
          binary='metatron-kernel/target/release/metatron-kernel'
          cases=[]
          for enabled in (False,True):
              env=dict(env0)
              env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              if enabled:
                  env['NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF']='1'
                  env['NUCLEUS_C189_TRACE']='1'
              started=time.monotonic()
              p=subprocess.run([binary],input=source,env=env,capture_output=True,timeout=180)
              lines=p.stderr.decode(errors='replace').splitlines()
              cases.append({'mode':'C182+C189' if enabled else 'C182',
                  'exit':p.returncode,'seconds':round(time.monotonic()-started,4),
                  'terminal':[x for x in lines if x.startswith('NUCLEUS_DOWNSTREAM:')][-4:],
                  'c189_diagnostics':[x[:2400] for x in lines if x.startswith('NUCLEUS_SOURCE_PROOF_IRREL:')][:30],
                  'stdout_sha256':hashlib.sha256(p.stdout).hexdigest(),
                  'stderr_sha256':hashlib.sha256(p.stderr).hexdigest()})
          lines=source.splitlines(keepends=True)
          found=[i for i,line in enumerate(lines) if isinstance((x:=json.loads(line)).get('thm'),dict) and x['thm'].get('name')==1911]
          assert len(found)==1
          x=json.loads(lines[found[0]]);assert x['thm']['value']==16842
          x['thm']['type']=5
          bad=lines.copy();bad[found[0]]=(json.dumps(x,separators=(',',':'))+'\n').encode()
          forged=b''.join(bad)
          negatives=[('forged-quotient-wrong-type',forged)]
          for rel,digest in (
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-fields.ndjson','33993418d305e980e224d6102be2fc61ee9c02be1c8c23ccce00a406616ba6d6'),
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-motive.ndjson','2eb5034aa01b1591cc99577bacc50095e3d8e80709172175f569e1f481f680de'),
              ('nucleus-quotient-reuse-20261104/heldout/mutated.ndjson','a4425142910417814594d555ccec8ac1b29bbe8d18f12993f20fa1c0253fd692')):
              data=(pathlib.Path('experiments')/rel).read_bytes()
              assert hashlib.sha256(data).hexdigest()==digest
              negatives.append((rel,data))
          bad_rows=[]
          for label,data in negatives:
              env=dict(env0);env['NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF']='1'
              p=subprocess.run([binary],input=data,env=env,capture_output=True,timeout=150)
              bad_rows.append({'case':label,'sha256':hashlib.sha256(data).hexdigest(),'exit':p.returncode})
          report={'scope':'isolated C189 historical rule candidate, no checker promotion',
                  'commit':os.environ.get('GITHUB_SHA'),
                  'source_sha256':hashlib.sha256(source).hexdigest(),
                  'cases':cases,'forged':bad_rows}
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print('C189_RESULT:'+json.dumps(report,ensure_ascii=False)[:24000],flush=True)
          assert cases[0]['exit']==2,'baseline no longer UNKNOWN at original Quotient theorem'
          assert cases[1]['exit'] in (0,2),'candidate REJECTED authentic theorem'
          assert all(row['exit']!=0 for row in bad_rows),'C189 admitted forged source'
          PY
      - name: Native diagnostic regression
        run: cargo test --locked --manifest-path metatron-kernel/Cargo.toml --features diagnostics --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c189-source-typed-quotient-transfer
          path: |
            ${{ runner.temp }}/c189/report.json
            ${{ runner.temp }}/c189/binary.sha256
          retention-days: 60
