name: Nucleus C190 source-qualified Quot.lift iota and contractor four-way differential
on:
  push:
    branches: [research/nucleus-c190-quotient-iota-20261115]
    paths: ['.github/workflows/nucleus-c190-quotient-iota-differential.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-qualified:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Build C190 and restore SHA-pinned real Mathlib Quotient proof prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c190"
          gh api repos/heathsanchez/test/actions/artifacts/14137666683/zip > "$RUNNER_TEMP/c190/archive.zip"
          printf '%s  %s\n' 91e2decf7d5e8dc5792ce62e0f47b617cd35ed1857a7227bde3550f5bb55f499 "$RUNNER_TEMP/c190/archive.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/c190/archive.zip" -d "$RUNNER_TEMP/c190"
          printf '%s  %s\n' 4883dc9889b546a1117c25c266bae05a344b6609db5cbbfd846a8d7abc92a907 "$RUNNER_TEMP/c190/quotient-prefix.ndjson" | sha256sum -c -
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          sha256sum metatron-kernel/target/release/metatron-kernel > "$RUNNER_TEMP/c190/binary.sha256"
      - name: Replay four exact bounded iota/contractor arms and four negatives
        run: |
          python3 - "$RUNNER_TEMP/c190" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          out=pathlib.Path(sys.argv[1]);source=(out/'quotient-prefix.ndjson').read_bytes()
          cfg=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(cfg)==24 and set(cfg.values())=={'1'}
          env0={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env0.update(cfg)
          env0['NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL']='1'
          env0['NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF']='1'
          binary='metatron-kernel/target/release/metatron-kernel'
          cases=[]
          for iota,contractor in ((False,False),(True,False),(False,True),(True,True)):
              env=dict(env0)
              env.update(NUCLEUS_TRACE_DOWNSTREAM='1',NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE='1')
              if iota:env['NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA']='1'
              if contractor:env['NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_CONTRACTOR']='1'
              env['NUCLEUS_C190_TRACE_CONTRACTOR']='1'
              env['NUCLEUS_C190_TRACE_QUOT_IOTA']='1'
              start=time.monotonic()
              p=subprocess.run([binary],input=source,env=env,capture_output=True,timeout=150)
              lines=p.stderr.decode(errors='replace').splitlines()
              cases.append({'iota':iota,'contractor':contractor,'exit':p.returncode,
                  'seconds':round(time.monotonic()-start,4),
                  'terminal':[x for x in lines if x.startswith('NUCLEUS_DOWNSTREAM:')][-4:],
                  'source_iota':[x[:1200] for x in lines if x.startswith('NUCLEUS_QUOTIENT_NEUTRAL_IOTA:')][:12],
                  'contractor_trace':[x[:1200] for x in lines if x.startswith('NUCLEUS_QUOTIENT_CONTRACTOR:')][:12],
                  'target_app':[x[:1100] for x in lines if x.startswith('NUCLEUS_APPLICATION_FUNCTION_TYPE:') and 'application=ExprId(16831)' in x][-4:],
                  'stdout_sha256':hashlib.sha256(p.stdout).hexdigest()})
          lines=source.splitlines(keepends=True)
          target=[i for i,x in enumerate(lines) if isinstance((d:=json.loads(x)).get('thm'),dict) and d['thm'].get('name')==1911]
          assert len(target)==1
          data=json.loads(lines[target[0]]); assert data['thm']['value']==16842
          data['thm']['type']=5
          forged=lines.copy();forged[target[0]]=(json.dumps(data,separators=(',',':'))+'\n').encode()
          bad_inputs=[('forged-quotient-wrong-type',b''.join(forged))]
          for name,sha in (
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-fields.ndjson','33993418d305e980e224d6102be2fc61ee9c02be1c8c23ccce00a406616ba6d6'),
              ('nucleus-universe-reconcile-20261104/inputs/renamed-pprod-forged-motive.ndjson','2eb5034aa01b1591cc99577bacc50095e3d8e80709172175f569e1f481f680de'),
              ('nucleus-quotient-reuse-20261104/heldout/mutated.ndjson','a4425142910417814594d555ccec8ac1b29bbe8d18f12993f20fa1c0253fd692')):
              blob=(pathlib.Path('experiments')/name).read_bytes()
              assert hashlib.sha256(blob).hexdigest()==sha
              bad_inputs.append((name,blob))
          negatives=[]
          for name,blob in bad_inputs:
              env=dict(env0)
              env.update(NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA='1',
                         NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_CONTRACTOR='1')
              p=subprocess.run([binary],input=blob,env=env,capture_output=True,timeout=120)
              negatives.append({'case':name,'sha256':hashlib.sha256(blob).hexdigest(),'exit':p.returncode})
          report={'scope':'source-owned historical quotient iota and checked contractor C190, isolated',
                  'commit':os.environ.get('GITHUB_SHA'),'prefix_sha256':hashlib.sha256(source).hexdigest(),
                  'arms':cases,'negatives':negatives}
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print('C190_REPORT:'+json.dumps(report,ensure_ascii=False)[:26000],flush=True)
          assert cases[0]['exit']==2,'baseline unexpectedly changed'
          assert all(x['exit'] in (0,2) for x in cases),'authentic proof incorrectly REJECTED'
          assert all(x['exit']!=0 for x in negatives),'C190 accepted a mutated or forged input'
          PY
      - name: Native diagnostic unit regressions
        run: cargo test --locked --manifest-path metatron-kernel/Cargo.toml --features diagnostics --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c190-quotient-iota-four-arms
          path: |
            ${{ runner.temp }}/c190/report.json
            ${{ runner.temp }}/c190/binary.sha256
          retention-days: 60
