name: Nucleus C195 exact Nat neutral head causal trace
on:
  push:
    branches: [research/nucleus-c195-nat-neutral-trace-20261115]
    paths:
      - 'metatron-kernel/src/convert.rs'
      - '.github/workflows/nucleus-c195-nat-neutral-source-trace.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Qualify and extract exact C194 source prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c195"
          gh api repos/heathsanchez/test/actions/artifacts/14144179440/zip > "$RUNNER_TEMP/c195/c194.zip"
          printf '%s  %s\n' 704a19eedc757f399d4119babbc550b26b4cf881321aae93d1d4ae27e67acf11 "$RUNNER_TEMP/c195/c194.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/c195/c194.zip" nat-prefix.ndjson > "$RUNNER_TEMP/c195/nat-prefix.ndjson"
          printf '%s  %s\n' 7767e7f90b3e24b30ecb5324f1117d6858b5f40653b31011ad1948eed747e8ea "$RUNNER_TEMP/c195/nat-prefix.ndjson" | sha256sum -c -
          git diff --quiet 7840cdbdb4efadbe24508b53d4d09e04637304a6 HEAD -- metatron-kernel/src/typecheck.rs metatron-kernel/src/machine.rs
          git diff 7840cdbdb4efadbe24508b53d4d09e04637304a6 HEAD -- metatron-kernel/src/convert.rs | tee "$RUNNER_TEMP/c195/diagnostic-diff.txt"
      - name: Build release and diagnostic binaries from same source
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c195/checker-release"
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c195/checker-diagnostics"
          sha256sum "$RUNNER_TEMP/c195/checker-release" "$RUNNER_TEMP/c195/checker-diagnostics" > "$RUNNER_TEMP/c195/binary.sha256"
      - name: Replay C193 baseline with isolated C195 trace
        run: |
          python3 - "$RUNNER_TEMP/c195" <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,sys,time
          out=pathlib.Path(sys.argv[1]);data=(out/'nat-prefix.ndjson').read_bytes()
          assert len(data)==5121623
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          base={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          base.update(flags)
          for key in ('NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL',
                      'NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF',
                      'NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA'):
              base[key]='1'
          cases=[]
          for label,exe in [('release','checker-release'),('diagnostics','checker-diagnostics')]:
              env=dict(base);env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              if label=='diagnostics':
                  env['NUCLEUS_TRACE_NAT_NONHEAD']='1'
                  env['NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE']='1'
              t=time.monotonic()
              p=subprocess.run([str(out/exe)],input=data,env=env,capture_output=True,timeout=300)
              (out/('stderr-'+label+'.txt')).write_bytes(p.stderr)
              lines=p.stderr.decode(errors='replace').splitlines()
              named=lambda pre:[x for x in lines if x.startswith(pre)]
              nonhead=named('NUCLEUS_NAT_NONHEAD:')
              heads=sorted(set((match.group(1),match.group(2)) for line in nonhead
                   if (match:=re.search(r'head=NameId\((\d+)\).*source_definition=(true|false)',line))))
              cases.append({'mode':label,'exit':p.returncode,'elapsed_s':round(time.monotonic()-t,4),
                  'nat_nonhead_count':len(nonhead),
                  'nat_nonhead_unique_heads':heads,
                  'nat_nonhead_first':nonhead[:64],
                  'application_count':len(named('NUCLEUS_APPLICATION_FUNCTION_TYPE:')),
                  'application_last':named('NUCLEUS_APPLICATION_FUNCTION_TYPE:')[-8:],
                  'terminal':named('NUCLEUS_DOWNSTREAM:')[-5:],
                  'stdout_sha256':hashlib.sha256(p.stdout).hexdigest(),
                  'stderr_sha256':hashlib.sha256(p.stderr).hexdigest()})
          report={'scope':'C195 diagnostics-only source-neutral-head classification on C194 authentic prefix',
                  'commit':os.environ.get('GITHUB_SHA'),
                  'prefix_sha256':'7767e7f90b3e24b30ecb5324f1117d6858b5f40653b31011ad1948eed747e8ea',
                  'cases':cases}
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print('C195_REPORT:'+json.dumps(report,ensure_ascii=False)[:28000],flush=True)
          assert all(x['exit']==2 for x in cases),'C195 must preserve C194 UNKNOWN'
          assert all(any('Nat.right_eq_add._proof_1_1' in t and 'application-function-type' in t
                         for t in x['terminal']) for x in cases),'C195 terminal changed'
          assert cases[1]['nat_nonhead_count']>0,'Missing expected Nat conversion diagnostic'
          assert cases[0]['nat_nonhead_count']==0,'C195 leaked trace into release'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c195-nat-neutral-first-source-head
          path: |
            ${{ runner.temp }}/c195/*.txt
            ${{ runner.temp }}/c195/*.json
            ${{ runner.temp }}/c195/binary.sha256
          retention-days: 60
