name: Nucleus C200 unchanged Mathlib Ordering inductive frontier
on:
  push:
    branches: [research/nucleus-c200-ordering-inductive-prefix-20261115]
    paths: ['.github/workflows/nucleus-c200-ordering-prefix.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prefix-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Recover exact frozen complete Mathlib and preserve first Ordering target prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c200"
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > "$RUNNER_TEMP/c200/mathlib.zip"
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b "$RUNNER_TEMP/c200/mathlib.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/c200/mathlib.zip" mathlib.ndjson.zst | zstd -dc > "$RUNNER_TEMP/c200/mathlib.ndjson"
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 "$RUNNER_TEMP/c200/mathlib.ndjson" | sha256sum -c -
          python3 - "$RUNNER_TEMP/c200/mathlib.ndjson" "$RUNNER_TEMP/c200/ordering-prefix.ndjson" <<'PY' | tee "$RUNNER_TEMP/c200/extraction.json"
          #!/usr/bin/env python3
          """C200: preserve unchanged NDJSON through first Ordering inductive group."""
          import hashlib
          import json
          import pathlib
          import sys
          source, output = map(pathlib.Path, sys.argv[1:3])
          names = {0: ""}
          target_name = "Ordering"
          matched = None
          with source.open("rb") as src, output.open("wb") as dst:
              for lineno, raw in enumerate(src, 1):
                  record = json.loads(raw)
                  dst.write(raw)
                  if "in" in record:
                      if "str" in record:
                          item = record["str"]
                          if item["pre"] not in names:
                              raise RuntimeError(f"undeclared prefix at {lineno}")
                          names[record["in"]] = names[item["pre"]] + "." + item["str"]
                      elif "num" in record:
                          item = record["num"]
                          if item["pre"] not in names:
                              raise RuntimeError(f"undeclared prefix at {lineno}")
                          names[record["in"]] = names[item["pre"]] + "." + str(item["i"])
                  inductive = record.get("inductive")
                  if isinstance(inductive, dict):
                      types = inductive.get("types", [])
                      target = next((t for t in types if names.get(t.get("name"), "").lstrip(".") == target_name), None)
                      if target is not None:
                          def with_name(item):
                              return {"resolved_name": names.get(item.get("name"), "<unresolved>"), **item}
                          matched = {
                              "record": lineno, "kind": "inductive", "target": target_name,
                              "target_type_id": target["type"],
                              "group_types": [with_name(t) for t in types],
                              "group_ctors": [with_name(c) for c in inductive.get("ctors", [])],
                              "group_recs": [with_name(r) for r in inductive.get("recs", [])],
                              "line_sha256": hashlib.sha256(raw).hexdigest(),
                          }
                  if matched is not None:
                      break
          if matched is None:
              output.unlink(missing_ok=True)
              raise RuntimeError("C200 target absent from original Mathlib export")
          matched["prefix_bytes"] = output.stat().st_size
          with output.open("rb") as file:
              matched["prefix_sha256"] = hashlib.file_digest(file, "sha256").hexdigest()
          matched["full_source_sha256"] = "22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6"
          output.with_suffix(".json").write_text(json.dumps(matched, indent=2) + "\n")
          print(json.dumps(matched, ensure_ascii=False), flush=True)
          PY
          rm "$RUNNER_TEMP/c200/mathlib.zip" "$RUNNER_TEMP/c200/mathlib.ndjson"
      - name: Build C199 checker in independent release and diagnostic modes
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c200/checker-release"
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c200/checker-diagnostics"
          sha256sum "$RUNNER_TEMP/c200/checker-release" "$RUNNER_TEMP/c200/checker-diagnostics" > "$RUNNER_TEMP/c200/binary.sha256"
      - name: Replay exact Ordering prefix under C199 with and without diagnostics
        run: |
          python3 - "$RUNNER_TEMP/c200" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          out=pathlib.Path(sys.argv[1]);prefix=out/'ordering-prefix.ndjson'
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          base={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          base.update(flags)
          for key in ('NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL',
                      'NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF',
                      'NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA',
                      'NUCLEUS_EXPERIMENTAL_C199_TWO_PARAM_EIGHT_FIELD_RECORD'):
              base[key]='1'
          cases=[]
          for label,exe in [('release','checker-release'),('diagnostics','checker-diagnostics')]:
              env=dict(base);env['NUCLEUS_TRACE_DOWNSTREAM']='1';env['NUCLEUS_TRACE_GENERIC_NONREC']='1'
              env.pop('NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE',None)
              if label=='diagnostics':
                  env['METATRON_KERNEL_DIAGNOSTICS']='1'
                  env['NUCLEUS_TRACE_PARSE_ERROR']='1'
              t=time.monotonic()
              with prefix.open('rb') as stream:
                  p=subprocess.run([str(out/exe)],stdin=stream,env=env,capture_output=True,timeout=720)
              (out/('stderr-'+label+'.txt')).write_bytes(p.stderr)
              lines=p.stderr.decode(errors='replace').splitlines()
              named=lambda pre:[x for x in lines if x.startswith(pre)]
              cases.append({'mode':label,'exit':p.returncode,'elapsed_s':round(time.monotonic()-t,4),
                  'generic_nonrec_last':named('NUCLEUS_GENERIC_NONREC:')[-16:],
                  'generic_ctor_last':named('NUCLEUS_GENERIC_CTOR:')[-16:],
                  'application_count':len(named('NUCLEUS_APPLICATION_FUNCTION_TYPE:')),
                  'application_last':named('NUCLEUS_APPLICATION_FUNCTION_TYPE:')[-16:],
                  'source_proof_count':len(named('NUCLEUS_SOURCE_PROOF_IRREL:')),
                  'source_proof_last':named('NUCLEUS_SOURCE_PROOF_IRREL:')[-12:],
                  'source_iota_count':len(named('NUCLEUS_QUOTIENT_NEUTRAL_IOTA:')),
                  'source_iota_last':named('NUCLEUS_QUOTIENT_NEUTRAL_IOTA:')[-8:],
                  'terminal':named('NUCLEUS_DOWNSTREAM:')[-5:],
                  'stdout_sha256':hashlib.sha256(p.stdout).hexdigest(),
                  'stderr_sha256':hashlib.sha256(p.stderr).hexdigest()})
          report={'scope':'C200 unchanged original Mathlib through Ordering inductive group; no checker semantic changes',
                  'commit':os.environ.get('GITHUB_SHA'),
                  'source_meta':json.loads((out/'ordering-prefix.json').read_text()),
                  'cases':cases}
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print('C200_REPORT:'+json.dumps(report,ensure_ascii=False)[:28000],flush=True)
          assert all(x['exit']==2 for x in cases),'C199 Ordering prefix verdict differed'
          assert all(any('Ordering' in t and 'stage=inductive' in t
                  for t in x['terminal']) for x in cases),'extracted prefix terminal differs from C199 full Mathlib'
          PY
      - name: Compress qualified exact prefix and retain source hash for reuse
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/c200/mathlib.ndjson" "$RUNNER_TEMP/c200/mathlib.zip"
          if [ -f "$RUNNER_TEMP/c200/ordering-prefix.ndjson" ]; then
            zstd -q -T2 -1 "$RUNNER_TEMP/c200/ordering-prefix.ndjson" -o "$RUNNER_TEMP/c200/ordering-prefix.ndjson.zst"
            rm -f "$RUNNER_TEMP/c200/ordering-prefix.ndjson"
            if [ "$(stat -c %s "$RUNNER_TEMP/c200/ordering-prefix.ndjson.zst")" -gt 250000000 ]; then
              echo "Compressed prefix exceeds 250MB; original source can be re-sliced using metadata" >&2
              rm -f "$RUNNER_TEMP/c200/ordering-prefix.ndjson.zst"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c200-ordering-inductive-prefix
          path: |
            ${{ runner.temp }}/c200/ordering-prefix.ndjson.zst
            ${{ runner.temp }}/c200/ordering-prefix.json
            ${{ runner.temp }}/c200/report.json
            ${{ runner.temp }}/c200/stderr-release.txt
            ${{ runner.temp }}/c200/stderr-diagnostics.txt
            ${{ runner.temp }}/c200/binary.sha256
          retention-days: 60
