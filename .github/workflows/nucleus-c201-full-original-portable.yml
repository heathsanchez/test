name: Nucleus C201 source-derived closed nullary enum full Mathlib and protected Arena gate
on:
  push:
    branches: [research/nucleus-c201-closed-nullary-enum-20261115]
    paths: ['.github/workflows/nucleus-c201-full-original-portable.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  portable-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Build independent default checker and source-hash evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nucleus-qualification" "$RUNNER_TEMP/portable"
          git rev-parse HEAD > "$RUNNER_TEMP/nucleus-qualification/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/nucleus-qualification/kernel-tree.txt"
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          sha256sum metatron-kernel/target/release/metatron-kernel > "$RUNNER_TEMP/nucleus-qualification/binary.sha256"
      - name: Recover source-pinned 208 exports and live portable Arena exports
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > "$RUNNER_TEMP/portable/pinned208.zip"
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c "$RUNNER_TEMP/portable/pinned208.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/portable/pinned"
          unzip -q "$RUNNER_TEMP/portable/pinned208.zip" -d "$RUNNER_TEMP/portable/pinned"
          gh api repos/heathsanchez/test/actions/artifacts/14146720891/zip > "$RUNNER_TEMP/portable/c197-verdicts.zip"
          printf '%s  %s\n' f3a912bb6310565d8d1c757d5183da6638176a0b6a1e6cf0a3a58ae06ed824be "$RUNNER_TEMP/portable/c197-verdicts.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/portable/c197-verdicts.zip" verdicts.json > "$RUNNER_TEMP/portable/c197-verdicts.json"
          curl --retry 3 -fLsS https://arena.lean-lang.org/lean-arena-tests.tar.gz -o "$RUNNER_TEMP/portable/current.tar.gz"
          sha256sum "$RUNNER_TEMP/portable/current.tar.gz" > "$RUNNER_TEMP/nucleus-qualification/current-archive.sha256"
          mkdir -p "$RUNNER_TEMP/portable/current"
          tar --no-same-owner -xzf "$RUNNER_TEMP/portable/current.tar.gz" -C "$RUNNER_TEMP/portable/current"
      - name: Replay all good/bad exports and record exact verdicts
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/portable" "$RUNNER_TEMP/nucleus-qualification" <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, subprocess, sys, collections
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          cfg=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(cfg)==24 and set(cfg.values())=={'1'}
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env.update(cfg)
          env['NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL']='1'
          env['NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF']='1'
          env['NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA']='1'
          env['NUCLEUS_EXPERIMENTAL_C199_TWO_PARAM_EIGHT_FIELD_RECORD']='1'
          env['NUCLEUS_EXPERIMENTAL_C201_CLOSED_NULLARY_ENUM']='1'
          checker=str(pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve())
          manifest=json.loads((root/'pinned'/'inputs-manifest.json').read_text())
          assert len(manifest)==208
          tasks=[]
          for m in manifest:
              p=root/'pinned'/'inputs'/m['relative_path']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
              tasks.append(('pinned208',m['case'],p,int(m['expected']),m['sha256']))
          current=root/'current'
          cases=sorted(current.rglob('*.ndjson'))
          assert len(cases)>=208, 'live Arena portable corpus unexpectedly small'
          for p in cases:
              parts=set(p.relative_to(current).parts)
              expected=0 if 'good' in parts else 1 if 'bad' in parts else None
              if expected is None: continue
              tasks.append(('current',str(p.relative_to(current)),p,expected,hashlib.sha256(p.read_bytes()).hexdigest()))
          def check(row):
              group,label,p,expected,digest=row
              try:
                  with p.open('rb') as stream:
                      r=subprocess.run([checker],stdin=stream,capture_output=True,env=env,timeout=180)
                  actual=r.returncode;reason=r.stderr.decode(errors='replace')[-800:]
              except subprocess.TimeoutExpired:actual=124;reason='timeout'
              return dict(corpus=group,case=label,sha256=digest,expected=expected,actual=actual,terminal=reason)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              results=list(pool.map(check,tasks))
          results.sort(key=lambda r:(r['corpus'],r['case']))
          (out/'verdicts.json').write_text(json.dumps(results,indent=2))
          summaries={}
          for corpus in ('pinned208','current'):
              rows=[r for r in results if r['corpus']==corpus]
              wrong=[r for r in rows if r['actual'] in (0,1) and r['actual']!=r['expected']]
              errors=[r for r in rows if r['actual'] not in (0,1,2,124)]
              summaries[corpus]=dict(total=len(rows),actual_counts=dict(collections.Counter(r['actual'] for r in rows)),wrong=wrong,errors=errors)
          baseline=json.loads((root/'c197-verdicts.json').read_text())
          old={(r['corpus'],r['case'],r['sha256']):r['actual'] for r in baseline if r['corpus']=='pinned208'}
          now={(r['corpus'],r['case'],r['sha256']):r['actual'] for r in results if r['corpus']=='pinned208'}
          assert len(old)==208 and len(now)==208 and set(old)==set(now)
          regressions=[{'case':k[1],'old':v,'new':now[k]} for k,v in old.items() if v in (0,1) and now[k]!=v]
          summaries['prior_decisive_regressions']=regressions
          summaries['config']=cfg
          summaries['candidate_flags']=['NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL=1','NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF=1','NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA=1','NUCLEUS_EXPERIMENTAL_C199_TWO_PARAM_EIGHT_FIELD_RECORD=1','NUCLEUS_EXPERIMENTAL_C201_CLOSED_NULLARY_ENUM=1']
          (out/'summary.json').write_text(json.dumps(summaries,indent=2))
          print(json.dumps({k:{'total':v['total'],'counts':v['actual_counts'],'wrong':len(v['wrong']),'errors':len(v['errors'])} for k,v in summaries.items() if isinstance(v,dict) and 'total' in v}))
          assert not regressions, 'C197 protected decisive verdicts regressed'
          assert not any(v['wrong'] or v['errors'] for k,v in summaries.items() if isinstance(v,dict) and 'total' in v)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c201-portable-corpus
          path: ${{ runner.temp }}/nucleus-qualification/
          retention-days: 60
  exact-mathlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Rebuild independent Nucleus and fetch SHA-pinned Mathlib archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mathlib-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/mathlib-evidence/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/mathlib-evidence/kernel-tree.txt"
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          sha256sum metatron-kernel/target/release/metatron-kernel > "$RUNNER_TEMP/mathlib-evidence/binary.sha256"
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > "$RUNNER_TEMP/mathlib.zip"
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b "$RUNNER_TEMP/mathlib.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/mathlib.zip" mathlib.ndjson.zst | zstd -dc > "$RUNNER_TEMP/mathlib.ndjson"
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 "$RUNNER_TEMP/mathlib.ndjson" | sha256sum -c -
          printf '%s\n' 6184415052 > "$RUNNER_TEMP/mathlib-evidence/expected-bytes.txt"
          stat -c %s "$RUNNER_TEMP/mathlib.ndjson" | tee "$RUNNER_TEMP/mathlib-evidence/actual-bytes.txt"
          test "$(stat -c %s "$RUNNER_TEMP/mathlib.ndjson")" -eq 6184415052
      - name: Fresh-process independent Mathlib verdict with 24 pinned flags
        run: |
          python3 - "$RUNNER_TEMP/mathlib.ndjson" "$RUNNER_TEMP/mathlib-evidence" <<'PY'
          import os,pathlib,subprocess,json,sys,time
          inp=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2])
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env.update(flags);env['NUCLEUS_TRACE_DOWNSTREAM']='1'
          env['NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL']='1'
          env['NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF']='1'
          env['NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA']='1'
          env['NUCLEUS_EXPERIMENTAL_C199_TWO_PARAM_EIGHT_FIELD_RECORD']='1'
          env['NUCLEUS_EXPERIMENTAL_C201_CLOSED_NULLARY_ENUM']='1'
          t=time.monotonic()
          with inp.open('rb') as stream,(out/'stdout.txt').open('wb') as stdout,(out/'stderr.txt').open('wb') as stderr:
              try:
                  r=subprocess.run(['/usr/bin/time','-v','-o',str(out/'time.txt'),'metatron-kernel/target/release/metatron-kernel'],stdin=stream,stdout=stdout,stderr=stderr,env=env,timeout=1500)
                  rc=r.returncode
              except subprocess.TimeoutExpired:
                  rc=124
          summary={'verdict':rc,'complete_mathlib_accept':rc==0,'elapsed_wall_s':round(time.monotonic()-t,2),
                   'source_sha256':'22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6',
                   'configuration':flags,'candidate_flags':['NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL=1','NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF=1','NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA=1','NUCLEUS_EXPERIMENTAL_C199_TWO_PARAM_EIGHT_FIELD_RECORD=1','NUCLEUS_EXPERIMENTAL_C201_CLOSED_NULLARY_ENUM=1']}
          (out/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary))
          print('diagnostic_tail:',(out/'stderr.txt').read_text(errors='replace')[-1600:])
          assert rc in (0,2,124),'original source falsely REJECTED by candidate'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c201-exact-mathlib
          path: ${{ runner.temp }}/mathlib-evidence/
          retention-days: 60
