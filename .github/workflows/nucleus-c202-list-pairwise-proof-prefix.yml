name: Nucleus C202 exact Mathlib pairwise_lt_range theorem first residual source prefix
on:
  push:
    branches: [research/nucleus-c202-list-pairwise-proof-prefix-20261115]
    paths: ['.github/workflows/nucleus-c202-list-pairwise-proof-prefix.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prefix-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Recover exact frozen complete Mathlib and preserve first List proof target prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c202"
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > "$RUNNER_TEMP/c202/mathlib.zip"
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b "$RUNNER_TEMP/c202/mathlib.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/c202/mathlib.zip" mathlib.ndjson.zst | zstd -dc > "$RUNNER_TEMP/c202/mathlib.ndjson"
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 "$RUNNER_TEMP/c202/mathlib.ndjson" | sha256sum -c -
          python3 - "$RUNNER_TEMP/c202/mathlib.ndjson" "$RUNNER_TEMP/c202/list-pairwise-prefix.ndjson" <<'PY' | tee "$RUNNER_TEMP/c202/extraction.json"
          #!/usr/bin/env python3
          """C202: copy exact source NDJSON through the first List.pairwise_lt_range theorem failure."""
          import hashlib
          import json
          import pathlib
          import sys
          source, output = map(pathlib.Path, sys.argv[1:3])
          names = {0: ""}
          target_name = "_private.Init.Data.List.Nat.Range.0.List.pairwise_lt_range'._proof_1_4"
          matched = None
          with source.open("rb") as src, output.open("wb") as dst:
              for lineno, raw in enumerate(src, 1):
                  record = json.loads(raw)
                  dst.write(raw)
                  if "in" in record:
                      if "str" in record:
                          item = record["str"]
                          if item["pre"] not in names:
                              raise RuntimeError(f"undeclared prefix at {lineno}")
                          names[record["in"]] = names[item["pre"]] + "." + item["str"]
                      elif "num" in record:
                          item = record["num"]
                          if item["pre"] not in names:
                              raise RuntimeError(f"undeclared prefix at {lineno}")
                          names[record["in"]] = names[item["pre"]] + "." + str(item["i"])
                  for kind in ("thm", "def", "opaque"):
                      value = record.get(kind)
                      if isinstance(value, dict) and names.get(value.get("name"), "").lstrip(".") == target_name:
                          matched = {
                              "record": lineno, "kind": kind, "target": target_name,
                              "name_id": value["name"], "type_id": value["type"],
                              "value_id": value["value"],
                          }
                          break
                  if matched is not None:
                      break
          if matched is None:
              output.unlink(missing_ok=True)
              raise RuntimeError("C202 target absent from original Mathlib export")
          matched["prefix_bytes"] = output.stat().st_size
          with output.open("rb") as file:
              matched["prefix_sha256"] = hashlib.file_digest(file, "sha256").hexdigest()
          matched["full_source_sha256"] = "22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6"
          output.with_suffix(".json").write_text(json.dumps(matched, indent=2) + "\n")
          print(json.dumps(matched, ensure_ascii=False), flush=True)
          PY
          rm "$RUNNER_TEMP/c202/mathlib.zip" "$RUNNER_TEMP/c202/mathlib.ndjson"
      - name: Build C201 independent checker in release and diagnostic modes
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c202/checker-release"
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c202/checker-diagnostics"
          sha256sum "$RUNNER_TEMP/c202/checker-release" "$RUNNER_TEMP/c202/checker-diagnostics" > "$RUNNER_TEMP/c202/binary.sha256"
      - name: Replay exact List pairwise proof prefix under C201 with and without diagnostics
        run: |
          python3 - "$RUNNER_TEMP/c202" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          out=pathlib.Path(sys.argv[1]);data=(out/'list-pairwise-prefix.ndjson').read_bytes()
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          base={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          base.update(flags)
          for key in ('NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL',
                      'NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF',
                      'NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA',
                      'NUCLEUS_EXPERIMENTAL_C199_TWO_PARAM_EIGHT_FIELD_RECORD',
                      'NUCLEUS_EXPERIMENTAL_C201_CLOSED_NULLARY_ENUM'):
              base[key]='1'
          cases=[]
          for label,exe in [('release','checker-release'),('diagnostics','checker-diagnostics')]:
              env=dict(base);env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              env['NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE']='1'
              env['NUCLEUS_TRACE_GENERIC_NONREC']='1'
              if label=='diagnostics':
                  env['NUCLEUS_C189_TRACE']='1'
                  env['NUCLEUS_C190_TRACE_QUOT_IOTA']='1'
              t=time.monotonic()
              p=subprocess.run([str(out/exe)],input=data,env=env,capture_output=True,timeout=240)
              (out/('stderr-'+label+'.txt')).write_bytes(p.stderr)
              lines=p.stderr.decode(errors='replace').splitlines()
              named=lambda pre:[x for x in lines if x.startswith(pre)]
              cases.append({'mode':label,'exit':p.returncode,'elapsed_s':round(time.monotonic()-t,4),
                  'application_count':len(named('NUCLEUS_APPLICATION_FUNCTION_TYPE:')),
                  'application_last':named('NUCLEUS_APPLICATION_FUNCTION_TYPE:')[-16:],
                  'source_proof_count':len(named('NUCLEUS_SOURCE_PROOF_IRREL:')),
                  'source_proof_last':named('NUCLEUS_SOURCE_PROOF_IRREL:')[-12:],
                  'source_iota_count':len(named('NUCLEUS_QUOTIENT_NEUTRAL_IOTA:')),
                  'source_iota_last':named('NUCLEUS_QUOTIENT_NEUTRAL_IOTA:')[-8:],
                  'terminal':named('NUCLEUS_DOWNSTREAM:')[-5:],
                  'stdout_sha256':hashlib.sha256(p.stdout).hexdigest(),
                  'stderr_sha256':hashlib.sha256(p.stderr).hexdigest()})
          report={'scope':'C202 unchanged Mathlib first List pairwise theorem after C201; no new checker semantics',
                  'commit':os.environ.get('GITHUB_SHA'),
                  'source_meta':json.loads((out/'list-pairwise-prefix.json').read_text()),
                  'cases':cases}
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print('C202_REPORT:'+json.dumps(report,ensure_ascii=False)[:28000],flush=True)
          assert all(x['exit']==2 for x in cases),'C201 List pairwise proof prefix verdict differed'
          assert all(any('pairwise_lt_range' in t and 'application-function-type' in t
                  for t in x['terminal']) for x in cases),'first terminal differs from C201'
          PY
      - name: Remove large export after qualification, retain exact small prefix
        if: always()
        run: rm -f "$RUNNER_TEMP/c202/mathlib.ndjson" "$RUNNER_TEMP/c202/mathlib.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c202-list-pairwise-theorem-prefix
          path: |
            ${{ runner.temp }}/c202/list-pairwise-prefix.ndjson
            ${{ runner.temp }}/c202/list-pairwise-prefix.json
            ${{ runner.temp }}/c202/report.json
            ${{ runner.temp }}/c202/stderr-release.txt
            ${{ runner.temp }}/c202/stderr-diagnostics.txt
            ${{ runner.temp }}/c202/binary.sha256
          retention-days: 60
