name: Nucleus C210 exact Nat.beq operands and PProd receiver diagnostic
on:
  push:
    branches: [research/nucleus-c210-nat-beq-operand-source-20261115]
    paths:
      - 'metatron-kernel/src/typecheck.rs'
      - '.github/workflows/nucleus-c210-omega-argument-check.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  causal-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Recover pinned C202 unchanged Lean 4.34.1 source prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c210"
          gh api repos/heathsanchez/test/actions/artifacts/14148325919/zip > "$RUNNER_TEMP/c210/c202.zip"
          printf '%s  %s\n' f66f2e075cbf09b298fbdd156b8d1a2d13bd9ecd27d55dd46b20b2fbb2958e59 "$RUNNER_TEMP/c210/c202.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/c210/c202.zip" list-pairwise-prefix.ndjson > "$RUNNER_TEMP/c210/source.ndjson"
          printf '%s  %s\n' d9d7b1fe7267a0806f65200abc64a9c7114fb8097a9da1f3687f2560a2568bb9 "$RUNNER_TEMP/c210/source.ndjson" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/c210/c202.zip" list-pairwise-prefix.json > "$RUNNER_TEMP/c210/source-meta.json"
          unzip -p "$RUNNER_TEMP/c210/c202.zip" binary.sha256 > "$RUNNER_TEMP/c210/c202-binary.sha256"
          rm "$RUNNER_TEMP/c210/c202.zip"
      - name: Build independent C210 release and diagnostics variants
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c210/checker-release"
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c210/checker-diagnostics"
          sha256sum "$RUNNER_TEMP/c210/checker-release" "$RUNNER_TEMP/c210/checker-diagnostics" > "$RUNNER_TEMP/c210/binary.sha256"
      - name: Trace Nat.beq source operands and PProd receiver without admission
        run: |
          python3 - "$RUNNER_TEMP/c210" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import time

          out = pathlib.Path(sys.argv[1])
          prefix = out / 'source.ndjson'
          flags = json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags) == 24 and set(flags.values()) == {'1'}
          base = {k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          base.update(flags)
          for key in ('NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL',
                      'NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF',
                      'NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA',
                      'NUCLEUS_EXPERIMENTAL_C199_TWO_PARAM_EIGHT_FIELD_RECORD',
                      'NUCLEUS_EXPERIMENTAL_C201_CLOSED_NULLARY_ENUM'):
              base[key] = '1'

          names = {0: ''}
          with prefix.open('rb') as stream:
              for raw in stream:
                  item = json.loads(raw)
                  if 'in' not in item:
                      continue
                  part = item.get('str') or item.get('num')
                  if part:
                      names[item['in']] = (names[part['pre']] + '.' + str(part.get('str',part.get('i')))).lstrip('.')
          cases = []
          for label in ('release', 'diagnostics'):
              env = dict(base)
              env['NUCLEUS_TRACE_DOWNSTREAM'] = '1'
              if label == 'diagnostics':
                  env['METATRON_KERNEL_DIAGNOSTICS'] = '1'
                  env['NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE'] = '1'
                  env['NUCLEUS_C205_ARGUMENT_CHECK'] = '1'
                  env['NUCLEUS_C206_SUBTERM_AUDIT'] = '1'
                  env['NUCLEUS_C207_PAIR_RECEIVER'] = '1'
                  env['NUCLEUS_C208_DECIDABLE_MAJOR'] = '1'
                  env['NUCLEUS_C209_BOOL_MAJOR'] = '1'
                  env['NUCLEUS_C210_NAT_BEQ_OPERANDS'] = '1'
              t = time.monotonic()
              with prefix.open('rb') as source:
                  p = subprocess.run([str(out / ('checker-'+label))],
                                     stdin=source,env=env,capture_output=True,timeout=480)
              (out / ('stderr-'+label+'.txt')).write_bytes(p.stderr)
              lines = p.stderr.decode(errors='replace').splitlines()
              starts = lambda pre: [line for line in lines if line.startswith(pre)]
              mismatch = starts('NUCLEUS_C205_ARGUMENT_CHECK:')
              operands = starts('NUCLEUS_C206_SUBTERM_AUDIT:')
              receivers = starts('NUCLEUS_C207_PAIR_RECEIVER:')
              majors = starts('NUCLEUS_C208_DECIDABLE_MAJOR:')
              bool_major = starts('NUCLEUS_C209_BOOL_MAJOR:')
              nat_operands = starts('NUCLEUS_C210_NAT_BEQ_OPERAND:')
              nat_receivers = starts('NUCLEUS_C210_NAT_BRECON_RECEIVER:')
              nat_receiver_args = starts('NUCLEUS_C210_NAT_BRECON_ARGUMENT:')
              chain = starts('NUCLEUS_C209_RECURSOR_CHAIN:')
              app = starts('NUCLEUS_APPLICATION_FUNCTION_TYPE:')
              all_names = sorted({int(n) for line in mismatch+chain
                                  for n in re.findall(r'NameId\((\d+)\)',line)})
              cases.append({
                  'mode':label,'exit':p.returncode,'elapsed_s':round(time.monotonic()-t,4),
                  'terminal':starts('NUCLEUS_DOWNSTREAM:')[-3:],
                  'application_count':len(app),'application_last':app[-8:],
                  'argument_events_count':len(mismatch),
                  'operand_events_count':len(operands),
                  'pair_receiver_events_count':len(receivers),
                  'decidable_major_events_count':len(majors),
                  'bool_major_events_count':len(bool_major),
                  'nat_operand_events_count':len(nat_operands),
                  'nat_operand_events':nat_operands[:8],
                  'nat_receiver_events_count':len(nat_receivers),
                  'nat_receiver_events':nat_receivers[:4],
                  'nat_receiver_arg_events_count':len(nat_receiver_args),
                  'nat_receiver_arg_events':nat_receiver_args[:8],
                  'bool_major_events':bool_major[:4],
                  'decidable_major_events':majors[:4],
                  'pair_receiver_events':receivers[:8],
                  'operand_events':operands[:24],
                  'argument_events_first':mismatch[:16],
                  'argument_events_last':mismatch[-16:],
                  'recursor_chain_count':len(chain),
                  'recursor_chain_first':chain[:8],
                  'recursor_chain_last':chain[-8:],
                  'resolved_names':{str(n):names.get(n,'<unresolved>') for n in all_names},
                  'stdout_sha256':hashlib.sha256(p.stdout).hexdigest(),
                  'stderr_sha256':hashlib.sha256(p.stderr).hexdigest(),
              })
          report = {
              'scope':'C210 diagnostic-only actual Nat.beq operands and PProd.fst Nat.brecOn.go receiver; unchanged C202 source',
              'commit':os.environ.get('GITHUB_SHA'),
              'source_meta':json.loads((out/'source-meta.json').read_text()),
              'cases':cases,
          }
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print('C210_REPORT:'+json.dumps(report,ensure_ascii=False)[:42000],flush=True)
          assert all(x['exit'] == 2 for x in cases), 'diagnostic-only change altered UNKNOWN verdict'
          assert all(any('pairwise_lt_range' in item and 'application-function-type' in item
                     for item in x['terminal']) for x in cases), 'first residual differs from C202'
          assert cases[1]['argument_events_count'] > 0, 'no original exact typed argument event observed'
          assert cases[1]['operand_events_count'] > 0, 'no prior operand decomposition observed'
          assert cases[1]['pair_receiver_events_count'] >= 2, 'previous source receiver probes absent'
          assert cases[1]['decidable_major_events_count'] >= 1, 'previous Decidable.rec source major probe absent'
          assert cases[1]['bool_major_events_count'] >= 1, 'exact Bool.rec major probe absent'
          assert cases[1]['nat_operand_events_count'] >= 2, 'actual source Nat.beq operand probes absent'
          assert cases[1]['nat_receiver_events_count'] >= 1, 'actual Nat.brecOn PProd receiver probe absent'
          PY
      - name: Drop reused prefix bytes before artifact upload
        if: always()
        run: rm -f "$RUNNER_TEMP/c210/source.ndjson"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c210-omega-argument-source
          path: |
            ${{ runner.temp }}/c210/source-meta.json
            ${{ runner.temp }}/c210/report.json
            ${{ runner.temp }}/c210/stderr-release.txt
            ${{ runner.temp }}/c210/stderr-diagnostics.txt
            ${{ runner.temp }}/c210/binary.sha256
            ${{ runner.temp }}/c210/c202-binary.sha256
          retention-days: 60
