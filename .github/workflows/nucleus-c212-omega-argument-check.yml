name: Nucleus C212 guarded source-certified projection re-exposure experiment
on:
  push:
    branches: [research/nucleus-c212-source-field-reexpose-20261115]
    paths:
      - 'metatron-kernel/src/typecheck.rs'
      - 'metatron-kernel/src/machine.rs'
      - '.github/workflows/nucleus-c212-omega-argument-check.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  causal-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Recover pinned C202 unchanged Lean 4.34.1 source prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c212"
          gh api repos/heathsanchez/test/actions/artifacts/14148325919/zip > "$RUNNER_TEMP/c212/c202.zip"
          printf '%s  %s\n' f66f2e075cbf09b298fbdd156b8d1a2d13bd9ecd27d55dd46b20b2fbb2958e59 "$RUNNER_TEMP/c212/c202.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/c212/c202.zip" list-pairwise-prefix.ndjson > "$RUNNER_TEMP/c212/source.ndjson"
          printf '%s  %s\n' d9d7b1fe7267a0806f65200abc64a9c7114fb8097a9da1f3687f2560a2568bb9 "$RUNNER_TEMP/c212/source.ndjson" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/c212/c202.zip" list-pairwise-prefix.json > "$RUNNER_TEMP/c212/source-meta.json"
          unzip -p "$RUNNER_TEMP/c212/c202.zip" binary.sha256 > "$RUNNER_TEMP/c212/c202-binary.sha256"
          rm "$RUNNER_TEMP/c212/c202.zip"
      - name: Build independent C212 release and diagnostics variants
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c212/checker-release"
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml --features diagnostics
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c212/checker-diagnostics"
          sha256sum "$RUNNER_TEMP/c212/checker-release" "$RUNNER_TEMP/c212/checker-diagnostics" > "$RUNNER_TEMP/c212/binary.sha256"
      - name: Compare guarded source-field replay with unmodified baseline
        run: |
          python3 - "$RUNNER_TEMP/c212" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import time

          out = pathlib.Path(sys.argv[1])
          prefix = out / 'source.ndjson'
          flags = json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags) == 24 and set(flags.values()) == {'1'}
          base = {k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          base.update(flags)
          for key in ('NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL',
                      'NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF',
                      'NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA',
                      'NUCLEUS_EXPERIMENTAL_C199_TWO_PARAM_EIGHT_FIELD_RECORD',
                      'NUCLEUS_EXPERIMENTAL_C201_CLOSED_NULLARY_ENUM'):
              base[key] = '1'

          names = {0: ''}
          with prefix.open('rb') as stream:
              for raw in stream:
                  item = json.loads(raw)
                  if 'in' not in item:
                      continue
                  part = item.get('str') or item.get('num')
                  if part:
                      names[item['in']] = (names[part['pre']] + '.' + str(part.get('str',part.get('i')))).lstrip('.')
          cases = []
          for label in ('baseline', 'candidate', 'diagnostic-candidate'):
              env = dict(base)
              env['NUCLEUS_TRACE_DOWNSTREAM'] = '1'
              if label in ('candidate', 'diagnostic-candidate'):
                  env['NUCLEUS_EXPERIMENTAL_C212_CERTIFIED_FIELD_REEXPOSE'] = '1'
              if label == 'diagnostic-candidate':
                  env['METATRON_KERNEL_DIAGNOSTICS'] = '1'
                  env['NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE'] = '1'
                  env['NUCLEUS_C205_ARGUMENT_CHECK'] = '1'
                  env['NUCLEUS_C206_SUBTERM_AUDIT'] = '1'
                  env['NUCLEUS_C207_PAIR_RECEIVER'] = '1'
                  env['NUCLEUS_C208_DECIDABLE_MAJOR'] = '1'
                  env['NUCLEUS_C209_BOOL_MAJOR'] = '1'
                  env['NUCLEUS_C210_NAT_BEQ_OPERANDS'] = '1'
                  env['NUCLEUS_C211_CLASS_PROJECTION'] = '1'
                  env['NUCLEUS_TRACE_C212_CERTIFIED_FIELD_REEXPOSE'] = '1'
              t = time.monotonic()
              with prefix.open('rb') as source:
                  p = subprocess.run([str(out / ('checker-'+('diagnostics' if label == 'diagnostic-candidate' else 'release')))],
                                     stdin=source,env=env,capture_output=True,timeout=480)
              (out / ('stderr-'+label+'.txt')).write_bytes(p.stderr)
              lines = p.stderr.decode(errors='replace').splitlines()
              starts = lambda pre: [line for line in lines if line.startswith(pre)]
              mismatch = starts('NUCLEUS_C205_ARGUMENT_CHECK:')
              operands = starts('NUCLEUS_C206_SUBTERM_AUDIT:')
              receivers = starts('NUCLEUS_C207_PAIR_RECEIVER:')
              majors = starts('NUCLEUS_C208_DECIDABLE_MAJOR:')
              bool_major = starts('NUCLEUS_C209_BOOL_MAJOR:')
              nat_operands = starts('NUCLEUS_C210_NAT_BEQ_OPERAND:')
              nat_receivers = starts('NUCLEUS_C210_NAT_BRECON_RECEIVER:')
              nat_receiver_args = starts('NUCLEUS_C210_NAT_BRECON_ARGUMENT:')
              class_projections = starts('NUCLEUS_C211_CLASS_PROJECTION:')
              class_heads = starts('NUCLEUS_C211_INSTANCE_HEAD:')
              replayed_fields = starts('NUCLEUS_C212_CERTIFIED_FIELD_REEXPOSE:')
              chain = starts('NUCLEUS_C209_RECURSOR_CHAIN:')
              app = starts('NUCLEUS_APPLICATION_FUNCTION_TYPE:')
              all_names = sorted({int(n) for line in mismatch+chain
                                  for n in re.findall(r'NameId\((\d+)\)',line)})
              cases.append({
                  'mode':label,'exit':p.returncode,'elapsed_s':round(time.monotonic()-t,4),
                  'terminal':starts('NUCLEUS_DOWNSTREAM:')[-3:],
                  'application_count':len(app),'application_last':app[-8:],
                  'argument_events_count':len(mismatch),
                  'operand_events_count':len(operands),
                  'pair_receiver_events_count':len(receivers),
                  'decidable_major_events_count':len(majors),
                  'bool_major_events_count':len(bool_major),
                  'nat_operand_events_count':len(nat_operands),
                  'nat_operand_events':nat_operands[:8],
                  'nat_receiver_events_count':len(nat_receivers),
                  'nat_receiver_events':nat_receivers[:4],
                  'nat_receiver_arg_events_count':len(nat_receiver_args),
                  'nat_receiver_arg_events':nat_receiver_args[:8],
                  'class_projection_events_count':len(class_projections),
                  'class_projection_events':class_projections[:8],
                  'class_head_events_count':len(class_heads),
                  'class_head_events':class_heads[:8],
                  'certified_field_reexpose_count':len(replayed_fields),
                  'certified_field_reexpose_events':replayed_fields[:24],
                  'bool_major_events':bool_major[:4],
                  'decidable_major_events':majors[:4],
                  'pair_receiver_events':receivers[:8],
                  'operand_events':operands[:24],
                  'argument_events_first':mismatch[:16],
                  'argument_events_last':mismatch[-16:],
                  'recursor_chain_count':len(chain),
                  'recursor_chain_first':chain[:8],
                  'recursor_chain_last':chain[-8:],
                  'resolved_names':{str(n):names.get(n,'<unresolved>') for n in all_names},
                  'stdout_sha256':hashlib.sha256(p.stdout).hexdigest(),
                  'stderr_sha256':hashlib.sha256(p.stderr).hexdigest(),
              })
          report = {
              'scope':'C212 opt-in actual source-certified projection replay experiment; unchanged C202 source, paired baseline and candidate',
              'commit':os.environ.get('GITHUB_SHA'),
              'source_meta':json.loads((out/'source-meta.json').read_text()),
              'cases':cases,
          }
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print('C212_REPORT:'+json.dumps(report,ensure_ascii=False)[:42000],flush=True)
          assert cases[0]['exit'] == 2, 'baseline unexpectedly changed from C202 UNKNOWN'
          assert all(x['exit'] in (0, 2) for x in cases), 'candidate produced an invalid or crashed verdict'
          assert any('pairwise_lt_range' in item and 'application-function-type' in item
                     for item in cases[0]['terminal']), 'baseline residual differs from C202'
          assert all((x['exit'] == 0 or any('pairwise_lt_range' in item and 'application-function-type' in item for item in x['terminal'])) for x in cases[1:]), 'candidate retained a different first failure'
          assert cases[2]['argument_events_count'] > 0, 'no original exact typed argument event observed'
          assert cases[2]['operand_events_count'] > 0, 'no prior operand decomposition observed'
          assert cases[2]['pair_receiver_events_count'] >= 2, 'previous source receiver probes absent'
          assert cases[2]['decidable_major_events_count'] >= 1, 'previous Decidable.rec source major probe absent'
          assert cases[2]['bool_major_events_count'] >= 1, 'exact Bool.rec major probe absent'
          assert cases[2]['nat_operand_events_count'] >= 2, 'actual source Nat.beq operand probes absent'
          assert cases[2]['nat_receiver_events_count'] >= 1, 'actual Nat.brecOn PProd receiver probe absent'
          # Successful re-exposure removes the old StuckProjection shape,
          # so the C211 diagnostic does not fire in this candidate by design.
          assert any('slot=1:' in e and 'full=Proven { value: NatLit(BigNat([]))' in e
                     for e in cases[2]['nat_operand_events']), 'OfNat zero field not source-resolved'
          assert any('slot=0:' in e and 'head: Const { name: NameId(2005)' in e
                     for e in cases[2]['nat_operand_events']), 'gcd operand did not advance to Decidable.rec'
          assert cases[2]['certified_field_reexpose_count'] >= 1, 'no source-qualified re-exposure observed'
          assert any('replay=Proven' in e for e in cases[2]['certified_field_reexpose_events']), 'no successful source-qualified field replay'
          assert cases[0]['stdout_sha256'] == cases[1]['stdout_sha256'], 'baseline/candidate stdout differs without source-qualified acceptance'
          PY
      - name: Drop reused prefix bytes before artifact upload
        if: always()
        run: rm -f "$RUNNER_TEMP/c212/source.ndjson"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c212-omega-argument-source
          path: |
            ${{ runner.temp }}/c212/source-meta.json
            ${{ runner.temp }}/c212/report.json
            ${{ runner.temp }}/c212/stderr-baseline.txt
            ${{ runner.temp }}/c212/stderr-candidate.txt
            ${{ runner.temp }}/c212/stderr-diagnostic-candidate.txt
            ${{ runner.temp }}/c212/binary.sha256
            ${{ runner.temp }}/c212/c202-binary.sha256
          retention-days: 60
