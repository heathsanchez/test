name: Nucleus C215 source-pinned original residual separator
on:
  push:
    branches: [research/nucleus-c215-original-residual-audit-20261115]
    paths: ['.github/workflows/nucleus-c215-original-residual-separator-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Build two semantically unchanged Nucleus variants
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c215"
          git rev-parse HEAD > "$RUNNER_TEMP/c215/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/c215/source-tree.txt"
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml --features diagnostics
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c215/nucleus-release"
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c215/nucleus-diagnostics"
          sha256sum "$RUNNER_TEMP/c215"/nucleus-* > "$RUNNER_TEMP/c215/binary-sha256.txt"
      - name: Recover immutable 208-case source corpus
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > "$RUNNER_TEMP/pinned208.zip"
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c "$RUNNER_TEMP/pinned208.zip" | sha256sum -c -
      - name: Replay exact originals and distinguish major-exposure cost from source obstruction
        run: |
          python3 - "$RUNNER_TEMP/pinned208.zip" "$RUNNER_TEMP/c215" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, time, zipfile

          archive=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          cases={
              'bugs/eta-ctor-alias': (1,'fd1a643c6c52efe34ec0cc0c22e53cdae32561ff80fb533b3bee7064dbd85ea3'),
              'perf/fueled-chain': (0,'e5ca34489fc7b8ee13b1e7f09f76247ab7b01dd1a752a13cc8b796c569e1401a'),
              'perf/grind-ring-5': (0,'e9c394e0ff311fd10f60dee2433a530f16e82354c32d6588a8775baa06fd221f'),
              'perf/magma-list-deep-n36': (0,'6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac'),
              'perf/magma-list-pair-n7': (0,'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'),
          }
          clean={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_') and k!='METATRON_KERNEL_DIAGNOSTICS'}
          clean.update(flags)
          clean.update({
              'NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL':'1',
              'NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF':'1',
              'NUCLEUS_EXPERIMENTAL_C190_QUOTIENT_IOTA':'1',
              'NUCLEUS_EXPERIMENTAL_C199_TWO_PARAM_EIGHT_FIELD_RECORD':'1',
              'NUCLEUS_EXPERIMENTAL_C201_CLOSED_NULLARY_ENUM':'1',
          })
          results=[]
          with zipfile.ZipFile(archive) as z:
              manifest=json.loads(z.read('inputs-manifest.json'))
              lookup={m['case']:m for m in manifest}
              assert len(manifest)==208 and len(lookup)==208
              for label,(expected,digest) in cases.items():
                  m=lookup[label]
                  raw=z.read('inputs/'+m['relative_path'])
                  assert m['expected']==expected and m['sha256']==digest
                  assert hashlib.sha256(raw).hexdigest()==digest
                  for variant in ('release','diagnostics'):
                      env=clean.copy()
                      if variant=='diagnostics':
                          env['NUCLEUS_TRACE_DOWNSTREAM']='1'
                          env['NUCLEUS_C96_MAJOR_TRACE']='1'
                          env['NUCLEUS_C97_MAJOR_STEP_TRACE']='1'
                      t=time.monotonic()
                      try:
                          r=subprocess.run([str(out/f'nucleus-{variant}')],input=raw,capture_output=True,env=env,timeout=240)
                          verdict=r.returncode
                          stdout=r.stdout.decode(errors='replace')
                          stderr=r.stderr.decode(errors='replace')
                      except subprocess.TimeoutExpired as e:
                          verdict=124
                          stdout=(e.stdout or b'').decode(errors='replace')
                          stderr=(e.stderr or b'').decode(errors='replace')+'\nTIMEOUT'
                      stem=label.replace('/','-')+'-'+variant
                      (out/f'{stem}.stdout').write_text(stdout)
                      (out/f'{stem}.stderr').write_text(stderr)
                      row={'case':label,'expected':expected,'source_sha256':digest,'variant':variant,
                           'verdict':verdict,'elapsed_s':round(time.monotonic()-t,3),
                           'first_downstream':next((line for line in stderr.splitlines() if line.startswith('NUCLEUS_DOWNSTREAM:')),None),
                           'c96_lines':sum(line.startswith('NUCLEUS_C96_') for line in stderr.splitlines()),
                           'c97_lines':sum(line.startswith('NUCLEUS_C97_') for line in stderr.splitlines())}
                      results.append(row)
                      print(json.dumps(row),flush=True)
          (out/'summary.json').write_text(json.dumps(results,indent=2))
          # Only observational instrumentation differs: neither variant may
          # misclassify genuine source, and both must agree on each verdict.
          for label,(expected,_) in cases.items():
              rows=[r for r in results if r['case']==label]
              assert len(rows)==2
              assert rows[0]['verdict']==rows[1]['verdict'], f'observer changed verdict for {label}'
              assert rows[0]['verdict'] in (expected,2), f'unsound decisive result for {label}'
              assert rows[0]['verdict']!=124, f'timeout for {label}'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c215-original-source-residual-separator
          path: ${{ runner.temp }}/c215/
          retention-days: 60
