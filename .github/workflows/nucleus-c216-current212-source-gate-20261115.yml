name: Nucleus C216 current212 exact-source qualification
on:
  push:
    branches: [research/nucleus-c216-rigid-function-constructor-20261115]
    paths: ['.github/workflows/nucleus-c216-current212-source-gate-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  current212:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Build exact C216 source and capture authority
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c216-current"
          git rev-parse HEAD > "$RUNNER_TEMP/c216-current/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/c216-current/source-tree.txt"
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c216-current/nucleus-release"
          sha256sum "$RUNNER_TEMP/c216-current/nucleus-release" > "$RUNNER_TEMP/c216-current/binary-sha256.txt"
      - name: Recover exact current archive and C201 source verdicts
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14147806559/zip > "$RUNNER_TEMP/c216-current/c201-verdicts.zip"
          printf '%s  %s\n' 4eb569a98cc1f5d0da920408d70741c390469c914900dc9d3ee893013a6612a5 "$RUNNER_TEMP/c216-current/c201-verdicts.zip" | sha256sum -c -
          curl --retry 3 -fLsS https://arena.lean-lang.org/lean-arena-tests.tar.gz -o "$RUNNER_TEMP/c216-current/current.tar.gz"
          printf '%s  %s\n' f6449acdf8dc5bc7b6c6e690f06daa948598d0bdde7d6cadcbb2286a9bfd49b0 "$RUNNER_TEMP/c216-current/current.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/c216-current/inputs"
          tar --no-same-owner -xzf "$RUNNER_TEMP/c216-current/current.tar.gz" -C "$RUNNER_TEMP/c216-current/inputs"
      - name: Replay exactly the 212 current source files, protect all decisives
        run: |
          python3 - "$RUNNER_TEMP/c216-current" <<'PY'
          import collections,concurrent.futures,hashlib,json,os,pathlib,subprocess,sys,zipfile
          root=pathlib.Path(sys.argv[1]); source=root/'inputs'
          prior=json.loads(zipfile.ZipFile(root/'c201-verdicts.zip').read('verdicts.json'))
          prior=[r for r in prior if r['corpus']=='current']
          assert len(prior)==212
          previous={(r['case'],r['sha256']):r for r in prior}
          assert len(previous)==212
          source_paths=sorted(p for p in source.rglob('*.ndjson') if any(part in ('good','bad') for part in p.relative_to(source).parts))
          assert len(source_paths)==212
          inputs=[]
          for p in source_paths:
              label=str(p.relative_to(source));data=p.read_bytes()
              digest=hashlib.sha256(data).hexdigest();previous_row=previous.get((label,digest))
              assert previous_row is not None, f'new or modified source: {label}'
              expected=0 if 'good' in p.relative_to(source).parts else 1
              assert previous_row['expected']==expected
              inputs.append((label,digest,expected,previous_row['actual'],data))
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env.update(flags)
          for feature in ('C182_TYPED_PROOF_IRREL','C189_NEUTRAL_LAMBDA_PROOF','C190_QUOTIENT_IOTA','C199_TWO_PARAM_EIGHT_FIELD_RECORD','C201_CLOSED_NULLARY_ENUM','C216_RIGID_DATA_FUNCTION_CTOR'):
              env['NUCLEUS_EXPERIMENTAL_'+feature]='1'
          binary=str(root/'nucleus-release')
          def replay(row):
              label,digest,expected,old,data=row
              try:
                  p=subprocess.run([binary],input=data,capture_output=True,env=env,timeout=180)
                  actual=p.returncode;reason=p.stderr.decode(errors='replace')[-200:]
              except subprocess.TimeoutExpired: actual=124;reason='timeout'
              return dict(case=label,sha256=digest,expected=expected,prior=old,actual=actual,reason=reason)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              rows=sorted(pool.map(replay,inputs),key=lambda r:r['case'])
          (root/'current212.json').write_text(json.dumps(rows,indent=2))
          wrong=[r for r in rows if r['actual'] in (0,1) and r['actual']!=r['expected']]
          regressions=[r for r in rows if r['prior'] in (0,1) and r['actual']!=r['prior']]
          errors=[r for r in rows if r['actual'] not in (0,1,2)]
          changes=[{k:r[k] for k in ('case','expected','prior','actual')} for r in rows if r['prior']!=r['actual']]
          summary=dict(total=len(rows),counts=dict(collections.Counter(r['actual'] for r in rows)),wrong=wrong,regressions=regressions,errors=errors,changes=changes)
          (root/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary),flush=True)
          assert not wrong and not regressions and not errors
          assert next(r['actual'] for r in rows if r['case']=='bad/bugs/eta-ctor-alias.ndjson')==1
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c216-current212-exact-source
          path: ${{ runner.temp }}/c216-current/
          retention-days: 60
