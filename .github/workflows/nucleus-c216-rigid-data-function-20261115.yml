name: Nucleus C216 source-certified rigid data function constructor trial
on:
  push:
    branches: [research/nucleus-c216-rigid-function-constructor-20261115]
    paths: ['.github/workflows/nucleus-c216-rigid-data-function-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  protected:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Compile unchanged default and C216 opt-in source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c216"
          git rev-parse HEAD > "$RUNNER_TEMP/c216/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/c216/source-tree.txt"
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c216/nucleus-release"
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c216/nucleus-diagnostics"
          sha256sum "$RUNNER_TEMP/c216"/nucleus-* > "$RUNNER_TEMP/c216/binary-sha256.txt"
      - name: Recover immutable source and previous verdict authority
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > "$RUNNER_TEMP/c216/pinned208.zip"
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c "$RUNNER_TEMP/c216/pinned208.zip" | sha256sum -c -
          gh api repos/heathsanchez/test/actions/artifacts/14147806559/zip > "$RUNNER_TEMP/c216/c201-verdicts.zip"
          printf '%s  %s\n' 4eb569a98cc1f5d0da920408d70741c390469c914900dc9d3ee893013a6612a5 "$RUNNER_TEMP/c216/c201-verdicts.zip" | sha256sum -c -
      - name: Execute red-green source pair and eta-regression controls
        run: |
          python3 - "$RUNNER_TEMP/c216" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,zipfile
          root=pathlib.Path(sys.argv[1]); z=zipfile.ZipFile(root/'pinned208.zip')
          manifest=json.loads(z.read('inputs-manifest.json'))
          lookup={m['case']:m for m in manifest}
          assert len(lookup)==208
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          env0={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env0.update(flags)
          for feature in ('C182_TYPED_PROOF_IRREL','C189_NEUTRAL_LAMBDA_PROOF','C190_QUOTIENT_IOTA','C199_TWO_PARAM_EIGHT_FIELD_RECORD','C201_CLOSED_NULLARY_ENUM'):
              env0['NUCLEUS_EXPERIMENTAL_'+feature]='1'
          env1=env0.copy();env1['NUCLEUS_EXPERIMENTAL_C216_RIGID_DATA_FUNCTION_CTOR']='1'
          controls=[
              'bugs/eta-ctor-alias',
              'tutorial/112_structEta','tutorial/114_funEta','tutorial/115_funEtaDep',
              'tutorial/111_indexedUnitEta','tutorial/113_indexedStructEta','tutorial/116_funEtaBad',
              'perf/fueled-chain','perf/magma-list-pair-n7',
          ]
          result=[]
          original=z.read('inputs/'+lookup['bugs/eta-ctor-alias']['relative_path'])
          assert hashlib.sha256(original).hexdigest()=='fd1a643c6c52efe34ec0cc0c22e53cdae32561ff80fb533b3bee7064dbd85ea3'
          # The minimal independent *valid* sibling changes only the asserted
          # right-hand side from Box.mk to the same bound function f. It keeps
          # Eq.refl f and every other source record identical.
          records=[json.loads(line) for line in original.splitlines()]
          target=[rec for rec in records if rec.get('ie')==79]
          assert len(target)==1 and target[0].get('app')=={'arg':25,'fn':78}
          target[0]['app']={'arg':4,'fn':78}
          valid=b'\n'.join(json.dumps(rec,separators=(',',':')).encode() for rec in records)+b'\n'
          assert hashlib.sha256(valid).hexdigest()=='fe42bc6d7dc10e3b53fad00ca3cfbb459814543b155118473a09e80654c06782'
          for label in controls+['valid-f-equals-f']:
              expected=0 if label=='valid-f-equals-f' else lookup[label]['expected']
              data=valid if label=='valid-f-equals-f' else z.read('inputs/'+lookup[label]['relative_path'])
              if label!='valid-f-equals-f':
                  assert hashlib.sha256(data).hexdigest()==lookup[label]['sha256']
              for mode,env in (('off',env0),('on',env1)):
                  use=env.copy()
                  if label=='bugs/eta-ctor-alias':
                      use['NUCLEUS_TRACE_DOWNSTREAM']='1'
                      use['NUCLEUS_TRACE_NEUTRAL_HEADS']='1'
                      if mode=='on': use['NUCLEUS_C216_TRACE']='1'
                  proc=subprocess.run([str(root/'nucleus-diagnostics')],input=data,capture_output=True,env=use,timeout=180)
                  row={'case':label,'mode':mode,'expected':expected,'verdict':proc.returncode,
                       'sha256':hashlib.sha256(data).hexdigest()}
                  (root/(label.replace('/','-')+'-'+mode+'.stderr')).write_bytes(proc.stderr)
                  result.append(row)
                  print(json.dumps(row),flush=True)
          (root/'controls.json').write_text(json.dumps(result,indent=2))
          for label in controls+['valid-f-equals-f']:
              off,on=[r for r in result if r['case']==label]
              if label=='bugs/eta-ctor-alias':
                  assert (off['verdict'],on['verdict'])==(2,1), 'C216 hypothesis not supported'
              else:
                  assert off['verdict']==on['verdict'], f'changed protective control {label}'
                  assert on['verdict'] in (on['expected'],2), f'wrong decisive control {label}'
                  if label=='valid-f-equals-f': assert on['verdict']==0
          PY
      - name: Qualify all 208 source-matched decisive verdicts under C216
        run: |
          python3 - "$RUNNER_TEMP/c216" <<'PY'
          import collections,concurrent.futures,hashlib,json,os,pathlib,subprocess,sys,zipfile
          root=pathlib.Path(sys.argv[1]);z=zipfile.ZipFile(root/'pinned208.zip')
          manifest=json.loads(z.read('inputs-manifest.json'))
          previous=json.loads(zipfile.ZipFile(root/'c201-verdicts.zip').read('verdicts.json'))
          prior={(row['case'],row['sha256']):row['actual'] for row in previous if row['corpus']=='pinned208'}
          assert len(manifest)==208 and len(prior)==208
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env.update(flags)
          for feature in ('C182_TYPED_PROOF_IRREL','C189_NEUTRAL_LAMBDA_PROOF','C190_QUOTIENT_IOTA','C199_TWO_PARAM_EIGHT_FIELD_RECORD','C201_CLOSED_NULLARY_ENUM','C216_RIGID_DATA_FUNCTION_CTOR'):
              env['NUCLEUS_EXPERIMENTAL_'+feature]='1'
          binary=str(root/'nucleus-release')
          def replay(m):
              with zipfile.ZipFile(root/'pinned208.zip') as source:
                  data=source.read('inputs/'+m['relative_path'])
              assert hashlib.sha256(data).hexdigest()==m['sha256']
              try:
                  p=subprocess.run([binary],input=data,capture_output=True,env=env,timeout=180)
                  actual=p.returncode;reason=p.stderr.decode(errors='replace')[-300:]
              except subprocess.TimeoutExpired: actual=124;reason='timeout'
              return dict(case=m['case'],sha256=m['sha256'],expected=m['expected'],actual=actual,prior=prior[(m['case'],m['sha256'])],reason=reason)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              rows=sorted(pool.map(replay,manifest),key=lambda r:r['case'])
          (root/'protected208.json').write_text(json.dumps(rows,indent=2))
          wrong=[r for r in rows if r['actual'] in (0,1) and r['actual']!=r['expected']]
          regressions=[r for r in rows if r['prior'] in (0,1) and r['actual']!=r['prior']]
          errors=[r for r in rows if r['actual'] not in (0,1,2)]
          changes=[{k:r[k] for k in ('case','prior','actual','expected')} for r in rows if r['prior']!=r['actual']]
          summary=dict(total=len(rows),counts=dict(collections.Counter(r['actual'] for r in rows)),wrong=wrong,regressions=regressions,errors=errors,changes=changes)
          (root/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps({k:v for k,v in summary.items() if k not in ('wrong','regressions','errors')}),flush=True)
          assert not wrong and not regressions and not errors
          assert next(r['actual'] for r in rows if r['case']=='bugs/eta-ctor-alias')==1
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c216-rigid-data-function-source-gate
          path: ${{ runner.temp }}/c216/
          retention-days: 60
