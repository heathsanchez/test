name: Nucleus C217 exact-source opening failure census
on:
  push:
    branches: [research/nucleus-c217-binder-source-opening-census-20261115]
    paths: ['.github/workflows/nucleus-c217-source-opening-reason-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Compile read-only diagnostics and unchanged release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c217"
          git rev-parse HEAD > "$RUNNER_TEMP/c217/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/c217/source-tree.txt"
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c217/nucleus-release"
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c217/nucleus-diagnostics"
          sha256sum "$RUNNER_TEMP/c217"/nucleus-* > "$RUNNER_TEMP/c217/binaries.sha256"
      - name: Recover pinned unchanged source and C201 verdict authority
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > "$RUNNER_TEMP/c217/pinned208.zip"
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c "$RUNNER_TEMP/c217/pinned208.zip" | sha256sum -c -
          gh api repos/heathsanchez/test/actions/artifacts/14147806559/zip > "$RUNNER_TEMP/c217/c201-verdicts.zip"
          printf '%s  %s\n' 4eb569a98cc1f5d0da920408d70741c390469c914900dc9d3ee893013a6612a5 "$RUNNER_TEMP/c217/c201-verdicts.zip" | sha256sum -c -
      - name: Count root mechanisms without granting any verdict
        run: |
          python3 - "$RUNNER_TEMP/c217" <<'PY'
          import collections,concurrent.futures,hashlib,json,os,pathlib,re,subprocess,sys,zipfile
          root=pathlib.Path(sys.argv[1]);source=zipfile.ZipFile(root/'pinned208.zip')
          manifest={m['case']:m for m in json.loads(source.read('inputs-manifest.json'))}
          previous=json.loads(zipfile.ZipFile(root/'c201-verdicts.zip').read('verdicts.json'))
          prior={(r['case'],r['sha256']):r for r in previous if r['corpus']=='pinned208'}
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          base={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          base.update(flags)
          for feature in ('C182_TYPED_PROOF_IRREL','C189_NEUTRAL_LAMBDA_PROOF','C190_QUOTIENT_IOTA','C199_TWO_PARAM_EIGHT_FIELD_RECORD','C201_CLOSED_NULLARY_ENUM','C216_RIGID_DATA_FUNCTION_CTOR'):
              base['NUCLEUS_EXPERIMENTAL_'+feature]='1'
          diag=base.copy()
          for flag in ('C217_OPENING_REASON','TRACE_APPLICATION_FUNCTION_TYPE','TRACE_DOWNSTREAM'):
              diag['NUCLEUS_'+flag]='1'
          cases=['perf/fueled-chain','perf/grind-ring-5','perf/magma-list-deep-n36','perf/magma-list-pair-n7','bugs/eta-ctor-alias']
          def replay(label):
              m=manifest[label];data=source.read('inputs/'+m['relative_path'])
              sha=hashlib.sha256(data).hexdigest()
              assert sha==m['sha256'] and (label,sha) in prior
              out=[]
              for kind,environment in (('release',base),('diagnostics',diag)):
                  try:
                      p=subprocess.run([str(root/('nucleus-'+kind))],input=data,capture_output=True,env=environment,timeout=150)
                      code=p.returncode;stderr=p.stderr.decode(errors='replace')
                  except subprocess.TimeoutExpired:
                      code=124;stderr='timeout'
                  (root/(label.replace('/','-')+'-'+kind+'.stderr')).write_text(stderr)
                  out.append((kind,code,stderr))
              text=out[1][2]
              reasons=collections.Counter(re.findall(r'NUCLEUS_C168_OPEN_BLOCK:reason=([^:]+)',text))
              function_reasons=collections.Counter(re.findall(r'NUCLEUS_APPLICATION_FUNCTION_TYPE:[^\n]+function_type=Unknown \{ residual: ResidualId\("([^"]+)"\)',text))
              terminal=[s for s in text.splitlines() if s.startswith('NUCLEUS_DOWNSTREAM:')][-2:]
              return dict(case=label,sha256=sha,expected=m['expected'],prior=prior[(label,sha)]['actual'],
                          release=out[0][1],diagnostics=out[1][1],
                          opening_reasons=dict(reasons),app_function_roots=dict(function_reasons),
                          opening_failures=text.count('NUCLEUS_C217_OPENING_FAILURE:'),terminal=terminal)
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              results=sorted(pool.map(replay,cases),key=lambda r:r['case'])
          (root/'summary.json').write_text(json.dumps(results,indent=2))
          for r in results:
              print(json.dumps(r),flush=True)
              assert r['release']==r['diagnostics'] and r['release'] in (0,1,2)
              assert r['release']==(1 if r['case']=='bugs/eta-ctor-alias' else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c217-binder-opening-causal-census
          path: ${{ runner.temp }}/c217/
          retention-days: 60
