name: Nucleus C221 structural support failure cause census
on:
  push:
    branches: [research/nucleus-c221-support-cause-20261116]
    paths: ['.github/workflows/nucleus-c221-support-failure-cause-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  support-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Compile and test C221 source (no default semantic change)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c221"
          git rev-parse HEAD | tee "$RUNNER_TEMP/c221/commit.txt"
          git rev-parse HEAD:metatron-kernel/src | tee "$RUNNER_TEMP/c221/source-tree.txt"
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c221/nucleus"
          sha256sum "$RUNNER_TEMP/c221/nucleus" > "$RUNNER_TEMP/c221/binary-sha256.txt"
      - name: Recover independently pinned 212 unchanged Arena exports
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/c221/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/c221/current212.zip" | sha256sum -c -
      - name: Same-binary flag OFF/ON, actual support certificates and forged controls
        run: |
          python3 - "$RUNNER_TEMP/c221" <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, time, zipfile
          out=pathlib.Path(sys.argv[1])
          archive=zipfile.ZipFile(out/'current212.zip')
          baseline={r['case']:r for r in json.loads(archive.read('current212.json'))}
          assert len(baseline)==212
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          common={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          common.update(flags)
          for feature in ('C182_TYPED_PROOF_IRREL','C189_NEUTRAL_LAMBDA_PROOF','C190_QUOTIENT_IOTA','C199_TWO_PARAM_EIGHT_FIELD_RECORD','C201_CLOSED_NULLARY_ENUM','C216_RIGID_DATA_FUNCTION_CTOR'):
              common['NUCLEUS_EXPERIMENTAL_'+feature]='1'
          targets=[
             'good/perf/fueled-chain.ndjson',
             'good/perf/magma-list-pair-n7.ndjson',
             'bad/bugs/eta-ctor-alias.ndjson',
             'bad/bugs/rec-rule-proof-irrel.ndjson',
             'bad/bugs/rec-rule-proof-irrel-nested.ndjson',
             'bad/bugs/rec-type-proof-irrel.ndjson',
             'bad/bugs/rec-rule-wrong-arg.ndjson',
             'good/tutorial/119_reduceCtorParamRefl.mk.ndjson',
             'good/tutorial/126_quotMkType.ndjson',
          ]
          rows=[]
          for case in targets:
              entry=baseline[case]
              source=archive.read('inputs/'+case)
              digest=hashlib.sha256(source).hexdigest()
              assert digest==entry['sha256']
              results={}
              for arm in ('baseline','support'):
                  env=common.copy()
                  if arm=='support':
                      env['NUCLEUS_C221_SUPPORT_REASON']='1'
                      env['NUCLEUS_C221_SUPPORT_REASON']='1'
                      env['NUCLEUS_C217_OPENING_REASON']='1'
                  start=time.monotonic()
                  try:
                      p=subprocess.run([str(out/'nucleus')],input=source,env=env,capture_output=True,timeout=180)
                      rc=p.returncode
                      stderr=p.stderr.decode(errors='replace')
                  except subprocess.TimeoutExpired:
                      rc=124
                      stderr='TIMEOUT'
                  (out/(case.replace('/','_')+'_'+arm+'.stderr')).write_text(stderr)
                  results[arm]=dict(verdict=rc,elapsed=round(time.monotonic()-start,3),
                     support_events=stderr.count('NUCLEUS_C221_SUPPORT:'),
                     support_width=stderr.count('NUCLEUS_C221_SUPPORT:reason=wide-support'),
                     support_visit=stderr.count('NUCLEUS_C221_SUPPORT:reason=visit-budget'),
                     support_merge=stderr.count('NUCLEUS_C221_SUPPORT:reason=merge-budget'),
                     support_final=stderr.count('NUCLEUS_C221_SUPPORT:reason=final-charge-budget'),
                     original_opening_failure=stderr.count('NUCLEUS_C168_OPEN_BLOCK:'),
                     terminal=next((line for line in stderr.splitlines() if line.startswith('NUCLEUS_DOWNSTREAM:')),None))
              row=dict(case=case,expected=entry['expected'],prior=entry['actual'],
                 sha256=digest,**results)
              print(json.dumps(row),flush=True)
              rows.append(row)
          (out/'summary.json').write_text(json.dumps(rows,indent=2))
          for row in rows:
              original=row['baseline']['verdict']
              alternate=row['support']['verdict']
              expected=row['expected']
              assert original==row['prior'],f'baseline drift {row["case"]}: {original} vs {row["prior"]}'
              assert alternate==original,f'diagnostic changed verdict {row["case"]}'
              if original==expected:
                  assert alternate==expected,f'regression of protected decisive {row["case"]}'
              assert alternate in (0,1,2) and original in (0,1,2)
          gained=[r['case'] for r in rows if r['expected']==0 and r['baseline']['verdict']==2 and r['support']['verdict']==0]
          counts=dict(observed=sum(r['support']['support_events'] for r in rows),
           wide=sum(r['support']['support_width'] for r in rows),
           visit_budget=sum(r['support']['support_visit'] for r in rows),
           merge_budget=sum(r['support']['support_merge'] for r in rows),
           final_charge=sum(r['support']['support_final'] for r in rows),
           advanced=gained)
          assert counts['observed']>0,'C221 support diagnostic never fired'
          print('C221_BOUNDARY_SUMMARY',json.dumps(counts),flush=True)
          (out/'conclusion.json').write_text(json.dumps(counts,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c221-source-support-causes
          path: ${{ runner.temp }}/c221/
          retention-days: 60
