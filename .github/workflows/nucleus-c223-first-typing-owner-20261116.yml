name: Nucleus C223 first source-owned typing/conversion UNKNOWN
on:
  push:
    branches: [research/nucleus-c223-first-typing-owner-20261116]
    paths: ['.github/workflows/nucleus-c223-first-typing-owner-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  first-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Compile and test C223 source (no default semantic change)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c223"
          git rev-parse HEAD | tee "$RUNNER_TEMP/c223/commit.txt"
          git rev-parse HEAD:metatron-kernel/src | tee "$RUNNER_TEMP/c223/source-tree.txt"
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c223/nucleus"
          sha256sum "$RUNNER_TEMP/c223/nucleus" > "$RUNNER_TEMP/c223/binary-sha256.txt"
      - name: Recover independently pinned 212 unchanged Arena exports
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/c223/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/c223/current212.zip" | sha256sum -c -
      - name: Same-binary original-source C223 typing owner trace and controls
        run: |
          python3 - "$RUNNER_TEMP/c223" <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, time, zipfile
          out=pathlib.Path(sys.argv[1])
          archive=zipfile.ZipFile(out/'current212.zip')
          baseline={r['case']:r for r in json.loads(archive.read('current212.json'))}
          assert len(baseline)==212
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          common={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          common.update(flags)
          for feature in ('C182_TYPED_PROOF_IRREL','C189_NEUTRAL_LAMBDA_PROOF','C190_QUOTIENT_IOTA','C199_TWO_PARAM_EIGHT_FIELD_RECORD','C201_CLOSED_NULLARY_ENUM','C216_RIGID_DATA_FUNCTION_CTOR'):
              common['NUCLEUS_EXPERIMENTAL_'+feature]='1'
          targets=[
             'good/perf/fueled-chain.ndjson',
             'good/perf/magma-list-pair-n7.ndjson',
             'good/perf/grind-ring-5.ndjson',
             'good/perf/magma-list-deep-n36.ndjson',
             'bad/bugs/eta-ctor-alias.ndjson',
             'bad/bugs/rec-rule-proof-irrel.ndjson',
             'bad/bugs/rec-rule-proof-irrel-nested.ndjson',
             'bad/bugs/rec-type-proof-irrel.ndjson',
             'bad/bugs/rec-rule-wrong-arg.ndjson',
             'good/tutorial/119_reduceCtorParamRefl.mk.ndjson',
             'good/tutorial/126_quotMkType.ndjson',
          ]
          rows=[]
          for case in targets:
              entry=baseline[case]
              source=archive.read('inputs/'+case)
              digest=hashlib.sha256(source).hexdigest()
              assert digest==entry['sha256']
              results={}
              for arm in ('baseline','trace'):
                  env=common.copy()
                  if arm=='trace':
                      env['NUCLEUS_C223_FIRST_OWNER']='1'
                      env['NUCLEUS_TRACE_DOWNSTREAM']='1'
                      env['NUCLEUS_C221_SUPPORT_REASON']='1'
                      env['NUCLEUS_C217_OPENING_REASON']='1'
                  start=time.monotonic()
                  try:
                      p=subprocess.run([str(out/'nucleus')],input=source,env=env,capture_output=True,timeout=180)
                      rc=p.returncode
                      stderr=p.stderr.decode(errors='replace')
                  except subprocess.TimeoutExpired:
                      rc=124
                      stderr='TIMEOUT'
                  (out/(case.replace('/','_')+'_'+arm+'.stderr')).write_text(stderr)
                  owner_lines=[line for line in stderr.splitlines() if line.startswith(('NUCLEUS_C223_INFER_UNKNOWN:', 'NUCLEUS_C223_APP_OWNER:', 'NUCLEUS_C223_ARG_INFER_UNKNOWN:', 'NUCLEUS_C223_ARG_CONVERSION_UNKNOWN:'))]
                  results[arm]=dict(verdict=rc,elapsed=round(time.monotonic()-start,3),
                     infer_unknown=stderr.count('NUCLEUS_C223_INFER_UNKNOWN:'),
                     application_owners=stderr.count('NUCLEUS_C223_APP_OWNER:'),
                     argument_infer_unknown=stderr.count('NUCLEUS_C223_ARG_INFER_UNKNOWN:'),
                     conversion_unknown=stderr.count('NUCLEUS_C223_ARG_CONVERSION_UNKNOWN:'),
                     support_budget_events=stderr.count('NUCLEUS_C221_SUPPORT:'),
                     opening_failures=stderr.count('NUCLEUS_C168_OPEN_BLOCK:'),
                     earliest_owner=owner_lines[0][:550] if owner_lines else None,
                     last_owner_events=[line[:550] for line in owner_lines[-12:]],
                     terminal=next((line for line in stderr.splitlines() if line.startswith('NUCLEUS_DOWNSTREAM:')),None))
              row=dict(case=case,expected=entry['expected'],prior=entry['actual'],
                 sha256=digest,**results)
              print(json.dumps(row),flush=True)
              rows.append(row)
          (out/'summary.json').write_text(json.dumps(rows,indent=2))
          for row in rows:
              original=row['baseline']['verdict']
              traced=row['trace']['verdict']
              assert original==row['prior'],f'baseline drift {row["case"]}: {original} vs {row["prior"]}'
              assert traced==original,f'C223 tracing changed verdict {row["case"]}: {original} vs {traced}'
              assert traced in (0,1,2) and original in (0,1,2)
          total=sum(r['trace']['infer_unknown']+r['trace']['application_owners']+r['trace']['argument_infer_unknown']+r['trace']['conversion_unknown'] for r in rows)
          assert total>0,'C223 typed-owner diagnostic never exercised'
          stats=dict(owner_events=total,case_count=len(rows),wrong_verdicts=0,
               unchanged_unknowns=[r['case'] for r in rows if r['expected']==0 and r['trace']['verdict']==2],
               first_owners={r['case']:r['trace']['earliest_owner'] for r in rows if r['trace']['earliest_owner']})
          print('C223_BOUNDARY_SUMMARY',json.dumps(stats),flush=True)
          (out/'conclusion.json').write_text(json.dumps(stats,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c223-original-typing-owner-trace
          path: ${{ runner.temp }}/c223/
          retention-days: 60
