name: Nucleus C230 fresh-process Decidable budget order falsifier
# Each budget trial runs in a fresh process; same source, unchanged checker verdict.
on:
  push:
    branches: [research/nucleus-c230-cold-budget-order-20261116]
    paths: ['.github/workflows/nucleus-c230-fresh-process-threshold-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cold-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Compile and test C230 source (no default semantic change)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c230"
          git rev-parse HEAD | tee "$RUNNER_TEMP/c230/commit.txt"
          git rev-parse HEAD:metatron-kernel/src | tee "$RUNNER_TEMP/c230/source-tree.txt"
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c230/nucleus"
          sha256sum "$RUNNER_TEMP/c230/nucleus" > "$RUNNER_TEMP/c230/binary-sha256.txt"
      - name: Recover independently pinned 212 unchanged Arena exports
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/c230/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/c230/current212.zip" | sha256sum -c -
      - name: Original Decidable conversion cold-process trials and negative controls
        run: |
          python3 - "$RUNNER_TEMP/c230" <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, time, zipfile
          out=pathlib.Path(sys.argv[1])
          archive=zipfile.ZipFile(out/'current212.zip')
          baseline={r['case']:r for r in json.loads(archive.read('current212.json'))}
          assert len(baseline)==212
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          common={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          common.update(flags)
          for feature in ('C182_TYPED_PROOF_IRREL','C189_NEUTRAL_LAMBDA_PROOF','C190_QUOTIENT_IOTA','C199_TWO_PARAM_EIGHT_FIELD_RECORD','C201_CLOSED_NULLARY_ENUM','C216_RIGID_DATA_FUNCTION_CTOR'):
              common['NUCLEUS_EXPERIMENTAL_'+feature]='1'
          main='good/perf/fueled-chain.ndjson'
          target=baseline[main]
          source=archive.read('inputs/'+main)
          assert hashlib.sha256(source).hexdigest()==target['sha256']
          results=[]
          for outer,expected_expr,allowances in [(65536,4771,[28,35,40]),(65600,4777,[26,33,37])]:
              for allowance in allowances:
                  env=common.copy()
                  env['NUCLEUS_TRACE_DOWNSTREAM']='1'
                  env['NUCLEUS_C230_SINGLE_BUDGET']=str(allowance)
                  if outer>65536:
                      env['NUCLEUS_C225_JUDGMENT_STEPS']=str(outer)
                  started=time.monotonic()
                  p=subprocess.run([str(out/'nucleus')],input=source,env=env,capture_output=True,timeout=180)
                  stderr=p.stderr.decode(errors='replace')
                  (out/f'original_outer{outer}_single{allowance}.stderr').write_text(stderr)
                  origin=[l for l in stderr.splitlines() if l.startswith('NUCLEUS_C230_ORIGINAL:')]
                  ladder=[l for l in stderr.splitlines() if l.startswith('NUCLEUS_C230_LADDER:')]
                  assert len(origin)==1 and len(ladder)==1, (outer,allowance,len(origin),len(ladder))
                  assert f'expr=ExprId({expected_expr})' in origin[0],(outer,origin[0])
                  assert f'fresh_budget={allowance}' in ladder[0]
                  assert p.returncode==target['actual']==2,'checker verdict changed'
                  result=dict(outer_budget=outer,expected_expr=expected_expr,probe_budget=allowance,
                      fresh_process=True,original_verdict=p.returncode,trial=ladder[0],
                      source_sha256=target['sha256'],wall_s=round(time.monotonic()-started,3))
                  print('C230_SINGLE',json.dumps(result),flush=True)
                  results.append(result)
          controls=[
              'bad/bugs/eta-ctor-alias.ndjson',
              'bad/bugs/rec-rule-proof-irrel.ndjson',
              'bad/bugs/rec-rule-proof-irrel-nested.ndjson',
              'bad/bugs/rec-type-proof-irrel.ndjson',
              'bad/bugs/rec-rule-wrong-arg.ndjson',
              'good/tutorial/119_reduceCtorParamRefl.mk.ndjson',
              'good/tutorial/126_quotMkType.ndjson']
          protected=[]
          for case in controls:
              row=baseline[case]
              raw=archive.read('inputs/'+case)
              assert hashlib.sha256(raw).hexdigest()==row['sha256']
              for outer in [65536,65600]:
                  env=common.copy()
                  if outer>65536:
                      env['NUCLEUS_C225_JUDGMENT_STEPS']=str(outer)
                  p=subprocess.run([str(out/'nucleus')],input=raw,env=env,capture_output=True,timeout=60)
                  assert p.returncode==row['actual']==row['expected'],(case,outer,p.returncode)
                  protected.append((case,outer,p.returncode))
          assert len(results)==6 and len(protected)==14
          report=dict(results=results,protected_controls=protected,semantic_change=False)
          (out/'conclusion.json').write_text(json.dumps(report,indent=2))
          print('C230_COLD_PROCESS_SUMMARY',json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c230-independent-cold-singles
          path: ${{ runner.temp }}/c230/
          retention-days: 60
