name: Nucleus C232 optional opaque congruence scheduling ablation
# Same original source, paired baseline/skip with protected verdicts; flag only.
on:
  push:
    branches: [research/nucleus-c232-opaque-congruence-ablation-20261116]
    paths: ['.github/workflows/nucleus-c232-opaque-congruence-ab-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  opacity-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Compile and test C232 source (no default semantic change)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c232"
          git rev-parse HEAD | tee "$RUNNER_TEMP/c232/commit.txt"
          git rev-parse HEAD:metatron-kernel/src | tee "$RUNNER_TEMP/c232/source-tree.txt"
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c232/nucleus"
          sha256sum "$RUNNER_TEMP/c232/nucleus" > "$RUNNER_TEMP/c232/binary-sha256.txt"
      - name: Recover independently pinned 212 unchanged Arena exports
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/c232/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/c232/current212.zip" | sha256sum -c -
      - name: Exact original Decidable owner paired scheduling A/B and protected controls
        run: |
          python3 - "$RUNNER_TEMP/c232" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, time, zipfile
          out=pathlib.Path(sys.argv[1])
          archive=zipfile.ZipFile(out/'current212.zip')
          baseline={r['case']:r for r in json.loads(archive.read('current212.json'))}
          assert len(baseline)==212
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          common={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          common.update(flags)
          for feat in ('C182_TYPED_PROOF_IRREL','C189_NEUTRAL_LAMBDA_PROOF','C190_QUOTIENT_IOTA','C199_TWO_PARAM_EIGHT_FIELD_RECORD','C201_CLOSED_NULLARY_ENUM','C216_RIGID_DATA_FUNCTION_CTOR'):
              common['NUCLEUS_EXPERIMENTAL_'+feat]='1'
          main='good/perf/fueled-chain.ndjson'
          target=baseline[main]
          source=archive.read('inputs/'+main)
          assert hashlib.sha256(source).hexdigest()==target['sha256']
          experiments=[]
          for outer,expr,allowance in [(65536,4771,35),(65600,4777,33)]:
              for arm in ('baseline','skip'):
                  env=common.copy()
                  env['NUCLEUS_C230_SINGLE_BUDGET']=str(allowance)
                  env['NUCLEUS_TRACE_DOWNSTREAM']='1'
                  if outer>65536:
                      env['NUCLEUS_C225_JUDGMENT_STEPS']=str(outer)
                  if arm=='skip':
                      env['NUCLEUS_EXPERIMENTAL_C232_SKIP_EAGER_OPAQUE_CONGRUENCE']='1'
                  started=time.monotonic()
                  try:
                      p=subprocess.run([str(out/'nucleus')],input=source,env=env,capture_output=True,timeout=180)
                      verdict=p.returncode
                      stderr=p.stderr.decode(errors='replace')
                  except subprocess.TimeoutExpired:
                      verdict=124
                      stderr='TIMEOUT'
                  (out/f'fueled_outer{outer}_{arm}.stderr').write_text(stderr)
                  ladders=[l for l in stderr.splitlines() if l.startswith('NUCLEUS_C230_LADDER:')]
                  result=dict(outer=outer,expr=expr,allowance=allowance,arm=arm,verdict=verdict,
                       original_sha256=target['sha256'],elapsed=round(time.monotonic()-started,3),
                       ladder=ladders[:3],terminal=next((l for l in stderr.splitlines() if l.startswith('NUCLEUS_DOWNSTREAM:')),None))
                  print('C232_ARM',json.dumps(result),flush=True)
                  experiments.append(result)
                  if arm=='baseline':
                      assert verdict==target['actual']==2
                      assert len(ladders)==1 and 'UNKNOWN:' in ladders[0]
                  else:
                      assert verdict in (0,2),'source-valid forged REJECT or error'
          controls=['bad/bugs/eta-ctor-alias.ndjson',
             'bad/bugs/rec-rule-proof-irrel.ndjson',
             'bad/bugs/rec-rule-proof-irrel-nested.ndjson',
             'bad/bugs/rec-type-proof-irrel.ndjson',
             'bad/bugs/rec-rule-wrong-arg.ndjson',
             'good/tutorial/119_reduceCtorParamRefl.mk.ndjson',
             'good/tutorial/126_quotMkType.ndjson']
          protected=[]
          for case in controls:
              row=baseline[case]
              raw=archive.read('inputs/'+case)
              assert hashlib.sha256(raw).hexdigest()==row['sha256']
              for outer in (65536,65600):
                  for arm in ('baseline','skip'):
                      env=common.copy()
                      if outer>65536:
                          env['NUCLEUS_C225_JUDGMENT_STEPS']=str(outer)
                      if arm=='skip':
                          env['NUCLEUS_EXPERIMENTAL_C232_SKIP_EAGER_OPAQUE_CONGRUENCE']='1'
                      p=subprocess.run([str(out/'nucleus')],input=raw,env=env,capture_output=True,timeout=60)
                      protected.append(dict(case=case,outer=outer,arm=arm,rc=p.returncode))
                      assert p.returncode==row['actual']==row['expected'],(case,outer,arm,p.returncode)
          assert len(experiments)==4 and len(protected)==28
          report=dict(experiments=experiments,protected=protected,flags_no_default_changes=True)
          (out/'conclusion.json').write_text(json.dumps(report,indent=2))
          print('C232_ABLATION_SUMMARY',json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c232-optional-opaque-congruence-ab
          path: ${{ runner.temp }}/c232/
          retention-days: 60
