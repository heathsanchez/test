name: Nucleus C233 first source-owned conversion decision divergence
# Read-only C230 cold probes; preserve exact source, original verdicts and controls.
on:
  push:
    branches: [research/nucleus-c233-conversion-decision-trace-20261117]
    paths:
      - '.github/workflows/nucleus-c233-conversion-decision-trace-20261117.yml'
      - 'metatron-kernel/src/convert.rs'
      - 'metatron-kernel/src/typecheck.rs'
      - 'metatron-kernel/scripts/c233_trace_diff.py'
      - 'metatron-kernel/tests_py/test_c233_trace_diff.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  decision-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: \${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Verify checker and read-only trace comparator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c233"
          git rev-parse HEAD | tee "$RUNNER_TEMP/c233/commit.txt"
          git rev-parse HEAD:metatron-kernel/src | tee "$RUNNER_TEMP/c233/source-tree.txt"
          (cd metatron-kernel && python3 -m unittest discover -s tests_py -v)
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo test --locked --features diagnostics --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c233/nucleus"
          sha256sum "$RUNNER_TEMP/c233/nucleus" > "$RUNNER_TEMP/c233/binary-sha256.txt"
      - name: Recover immutable original 212-case Arena exports
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/c233/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/c233/current212.zip" | sha256sum -c -
      - name: Compare source-owned C230 converter decision paths without changing checking
        run: |
          python3 - "$RUNNER_TEMP/c233" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, time, zipfile
          sys.path.insert(0, str(pathlib.Path('metatron-kernel').resolve()))
          from scripts.c233_trace_diff import compare_trace_lines
          out=pathlib.Path(sys.argv[1])
          archive=zipfile.ZipFile(out/'current212.zip')
          baseline={r['case']:r for r in json.loads(archive.read('current212.json'))}
          assert len(baseline)==212
          flags=json.loads(pathlib.Path('experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json').read_text())['flags']
          assert len(flags)==24 and set(flags.values())=={'1'}
          common={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          common.update(flags)
          for feature in ('C182_TYPED_PROOF_IRREL','C189_NEUTRAL_LAMBDA_PROOF',
              'C190_QUOTIENT_IOTA','C199_TWO_PARAM_EIGHT_FIELD_RECORD',
              'C201_CLOSED_NULLARY_ENUM','C216_RIGID_DATA_FUNCTION_CTOR'):
              common['NUCLEUS_EXPERIMENTAL_'+feature]='1'
          main='good/perf/fueled-chain.ndjson'
          target=baseline[main]
          source=archive.read('inputs/'+main)
          assert hashlib.sha256(source).hexdigest()==target['sha256']
          assert target['sha256']=='e5ca34489fc7b8ee13b1e7f09f76247ab7b01dd1a752a13cc8b796c569e1401a'
          probes=[]
          for outer,expr,allowances in ((65536,4771,(28,35)),(65600,4777,(26,33))):
              for allowance in allowances:
                  env=common.copy()
                  env['NUCLEUS_C230_SINGLE_BUDGET']=str(allowance)
                  env['NUCLEUS_C233_BRANCH_PATH']='1'
                  env['NUCLEUS_TRACE_DOWNSTREAM']='1'
                  if outer>65536:
                      env['NUCLEUS_C225_JUDGMENT_STEPS']=str(outer)
                  started=time.monotonic()
                  p=subprocess.run([str(out/'nucleus')],input=source,env=env,capture_output=True,timeout=180)
                  stderr=p.stderr.decode(errors='replace')
                  stderr_path=out/f'original_outer{outer}_single{allowance}.stderr'
                  stderr_path.write_text(stderr)
                  origin=[l for l in stderr.splitlines() if l.startswith('NUCLEUS_C230_ORIGINAL:')]
                  ladder=[l for l in stderr.splitlines() if l.startswith('NUCLEUS_C230_LADDER:')]
                  events=[l for l in stderr.splitlines() if l.startswith('NUCLEUS_C233_DECISION:')]
                  assert p.returncode==target['actual']==2,(outer,allowance,p.returncode)
                  assert len(origin)==1 and len(ladder)==1 and events,(outer,allowance,len(events))
                  assert f'expr=ExprId({expr})' in origin[0] and f'fresh_budget={allowance}' in ladder[0]
                  row=dict(outer=outer,expr=expr,allowance=allowance,
                      verdict=p.returncode,decision_events=len(events),trial=ladder[0],
                      truncated='NUCLEUS_C233_TRUNCATED' in stderr,
                      original_sha256=target['sha256'],elapsed_s=round(time.monotonic()-started,3))
                  print('C233_COLD_PROBE',json.dumps(row),flush=True)
                  probes.append(row)
          comparisons=[]
          for outer,low,high in ((65536,28,35),(65600,26,33)):
              a=(out/f'original_outer{outer}_single{low}.stderr').read_text().splitlines()
              b=(out/f'original_outer{outer}_single{high}.stderr').read_text().splitlines()
              result=compare_trace_lines(a,b)
              comparisons.append(dict(outer=outer,low_budget=low,high_budget=high,**result))
              print('C233_FIRST_DIVERGENCE',json.dumps(comparisons[-1]),flush=True)
          controls=[
              'bad/bugs/eta-ctor-alias.ndjson',
              'bad/bugs/rec-rule-proof-irrel.ndjson',
              'bad/bugs/rec-rule-proof-irrel-nested.ndjson',
              'bad/bugs/rec-type-proof-irrel.ndjson',
              'bad/bugs/rec-rule-wrong-arg.ndjson',
              'good/tutorial/119_reduceCtorParamRefl.mk.ndjson',
              'good/tutorial/126_quotMkType.ndjson']
          protected=[]
          for case in controls:
              row=baseline[case]
              raw=archive.read('inputs/'+case)
              assert hashlib.sha256(raw).hexdigest()==row['sha256']
              for outer in (65536,65600):
                  env=common.copy()
                  env['NUCLEUS_C233_BRANCH_PATH']='1'
                  if outer>65536:
                      env['NUCLEUS_C225_JUDGMENT_STEPS']=str(outer)
                  p=subprocess.run([str(out/'nucleus')],input=raw,env=env,capture_output=True,timeout=60)
                  assert p.returncode==row['actual']==row['expected'],(case,outer,p.returncode)
                  assert b'NUCLEUS_C233_DECISION:' not in p.stderr
                  protected.append(dict(case=case,outer=outer,verdict=p.returncode))
          assert len(probes)==4 and len(comparisons)==2 and len(protected)==14
          report=dict(probes=probes,comparisons=comparisons,protected=protected,
              original_checker_verdicts_unchanged=True,diagnostic_only=True)
          (out/'conclusion.json').write_text(json.dumps(report,indent=2))
          print('C233_SUMMARY',json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c233-source-owned-decision-paths
          path: \${{ runner.temp }}/c233/
          retention-days: 60
