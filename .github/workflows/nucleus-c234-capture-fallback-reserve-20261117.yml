name: Nucleus C234 speculative capture fallback reserve A/B
# The reserve policy is opt-in and diagnostics-only; source files are untouched.
on:
  push:
    branches: [research/nucleus-c234-capture-fallback-reserve-20261117]
    paths:
      - '.github/workflows/nucleus-c234-capture-fallback-reserve-20261117.yml'
      - 'metatron-kernel/src/convert.rs'
      - 'metatron-kernel/scripts/c234_capture_reserve_replay.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  protected-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Verify opt-in source, unchanged baseline and comparison code
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c234"
          git rev-parse HEAD | tee "$RUNNER_TEMP/c234/commit.txt"
          git rev-parse HEAD:metatron-kernel/src | tee "$RUNNER_TEMP/c234/source-tree.txt"
          (cd metatron-kernel && python3 -m unittest discover -s tests_py -v)
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo test --locked --features diagnostics --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c234/nucleus"
          sha256sum "$RUNNER_TEMP/c234/nucleus" > "$RUNNER_TEMP/c234/binary-sha256.txt"
      - name: Recover original SHA-pinned 212-case archive
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/c234/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/c234/current212.zip" | sha256sum -c -
      - name: A/B local Decidable conversion and protected unchanged exports
        run: |
          set -euo pipefail
          python3 metatron-kernel/scripts/c234_capture_reserve_replay.py \
            --archive "$RUNNER_TEMP/c234/current212.zip" \
            --checker "$RUNNER_TEMP/c234/nucleus" \
            --out "$RUNNER_TEMP/c234" \
            --flags experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c234-capture-fallback-reserve
          path: ${{ runner.temp }}/c234/
          retention-days: 60
