name: Nucleus C235 terminal source-owner lineage (read-only)
on:
  push:
    branches: [research/nucleus-c235-terminal-owner-lineage-20261117]
    paths:
      - '.github/workflows/nucleus-c235-terminal-owner-lineage-20261117.yml'
      - 'metatron-kernel/scripts/c235_terminal_owner_lineage.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact C234 evidence and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c235"
          git rev-parse HEAD > "$RUNNER_TEMP/c235/commit.txt"
          gh api repos/heathsanchez/test/actions/artifacts/14223129213/zip > "$RUNNER_TEMP/c235/c234.zip"
          printf '%s  %s\n' 0b627334d621e0b55400cb5abc6c9430b534401e4780e167814a23d41a19eefc "$RUNNER_TEMP/c235/c234.zip" | sha256sum -c -
      - name: Analyze source-owned terminal UNKNOWN projection, fail closed on missing evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 metatron-kernel/scripts/c235_terminal_owner_lineage.py \
            --artifact "$RUNNER_TEMP/c235/c234.zip" \
            --out "$RUNNER_TEMP/c235/terminal-owner-lineage.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c235-terminal-source-owner-lineage
          path: ${{ runner.temp }}/c235/
          retention-days: 60
