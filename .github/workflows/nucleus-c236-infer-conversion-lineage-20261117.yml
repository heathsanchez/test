name: Nucleus C236 source-inference ancestry and conversion owner replay
on:
  push:
    branches: [research/nucleus-c236-infer-conversion-lineage-20261117]
    paths:
      - '.github/workflows/nucleus-c236-infer-conversion-lineage-20261117.yml'
      - 'metatron-kernel/src/typecheck.rs'
      - 'metatron-kernel/scripts/c236_infer_conversion_lineage.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unchanged-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Qualify unchanged checker semantics and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c236"
          git rev-parse HEAD > "$RUNNER_TEMP/c236/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/c236/source-tree.txt"
          python3 -m py_compile metatron-kernel/scripts/c236_infer_conversion_lineage.py
          (cd metatron-kernel && python3 -m unittest discover -s tests_py -v)
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo test --locked --features diagnostics --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c236/nucleus"
          sha256sum "$RUNNER_TEMP/c236/nucleus" > "$RUNNER_TEMP/c236/binary-sha256.txt"
      - name: Recover exact unchanged 212-case source archive
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/c236/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/c236/current212.zip" | sha256sum -c -
      - name: Compare paired original and protected verdicts; reconstruct inference ancestry
        shell: bash
        run: |
          set -euo pipefail
          python3 metatron-kernel/scripts/c236_infer_conversion_lineage.py \
            --archive "$RUNNER_TEMP/c236/current212.zip" \
            --checker "$RUNNER_TEMP/c236/nucleus" \
            --flags experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json \
            --out "$RUNNER_TEMP/c236"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c236-original-source-inference-ancestry
          path: ${{ runner.temp }}/c236/
          retention-days: 60
