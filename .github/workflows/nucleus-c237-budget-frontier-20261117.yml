name: Nucleus C237 immutable checker budget frontier (read-only)
on:
  push:
    branches: [research/nucleus-c237-budget-frontier-20261117]
    paths:
      - '.github/workflows/nucleus-c237-budget-frontier-20261117.yml'
      - 'metatron-kernel/scripts/c237_budget_frontier.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-budget-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-locked executable, inputs and parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c237"
          git rev-parse HEAD > "$RUNNER_TEMP/c237/workflow-commit.txt"
          python3 -m py_compile metatron-kernel/scripts/c237_budget_frontier.py
          gh api repos/heathsanchez/test/actions/artifacts/14274519112/zip > "$RUNNER_TEMP/c237/c236.zip"
          printf '%s  %s\n' 52ff6dde90bab4a1bf084700287ca0915e0251ad67e4f1f6eab4d1090802fd0c "$RUNNER_TEMP/c237/c236.zip" | sha256sum -c -
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/c237/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/c237/current212.zip" | sha256sum -c -
      - name: Measure 65k to 69k original budget frontier without changing checker semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 metatron-kernel/scripts/c237_budget_frontier.py \
            --c236-artifact "$RUNNER_TEMP/c237/c236.zip" \
            --source-archive "$RUNNER_TEMP/c237/current212.zip" \
            --flags experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json \
            --out "$RUNNER_TEMP/c237"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c237-source-locked-budget-frontier
          path: ${{ runner.temp }}/c237/
          retention-days: 60
