name: Nucleus C237 exact-frame qualified Nat-type proof reuse A/B
on:
  push:
    branches: [research/nucleus-c237-typed-nat-proof-reuse-20261117]
    paths:
      - '.github/workflows/nucleus-c237-typed-nat-proof-reuse-20261117.yml'
      - 'metatron-kernel/src/typecheck.rs'
      - 'metatron-kernel/scripts/c237_typed_nat_reuse_replay.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-and-protected:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Build independent checker and run Rust/Python tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c237"
          git rev-parse HEAD > "$RUNNER_TEMP/c237/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/c237/source-tree.txt"
          python3 -m py_compile metatron-kernel/scripts/c237_typed_nat_reuse_replay.py
          (cd metatron-kernel && python3 -m unittest discover -s tests_py -v)
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo test --locked --features diagnostics --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c237/nucleus"
          sha256sum "$RUNNER_TEMP/c237/nucleus" > "$RUNNER_TEMP/c237/binary-sha256.txt"
      - name: Verify unchanged official source archive digest
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/c237/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/c237/current212.zip" | sha256sum -c -
      - name: A/B original heavy cases and complete 212-case correctness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 metatron-kernel/scripts/c237_typed_nat_reuse_replay.py \
            --archive "$RUNNER_TEMP/c237/current212.zip" \
            --checker "$RUNNER_TEMP/c237/nucleus" \
            --flags experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json \
            --out "$RUNNER_TEMP/c237"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c237-exact-frame-nat-proof-reuse
          path: ${{ runner.temp }}/c237/
          retention-days: 60
