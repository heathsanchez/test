name: Nucleus C238 128-MiB deep-stack full 212 qualification
on:
  push:
    branches: [research/nucleus-c238-stack-capacity-20261117]
    paths:
      - '.github/workflows/nucleus-c238-stack-capacity-20261117.yml'
      - 'metatron-kernel/src/main.rs'
      - 'metatron-kernel/scripts/c238_stack_qualify.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  whole-212:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Compile release and diagnostics and preserve independent regression checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c238"
          git rev-parse HEAD > "$RUNNER_TEMP/c238/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/c238/source-tree.txt"
          python3 -m py_compile metatron-kernel/scripts/c238_stack_qualify.py
          (cd metatron-kernel && python3 -m unittest discover -s tests_py -v)
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo test --locked --features diagnostics --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c238/nucleus-release"
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c238/nucleus-diagnostics"
          sha256sum "$RUNNER_TEMP/c238/nucleus-release" "$RUNNER_TEMP/c238/nucleus-diagnostics" > "$RUNNER_TEMP/c238/binary-sha256.txt"
      - name: Verify original 212-case export archive hash
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/c238/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/c238/current212.zip" | sha256sum -c -
      - name: Source-identical deep application and full 212-case verdict gate
        shell: bash
        run: |
          set -euo pipefail
          python3 metatron-kernel/scripts/c238_stack_qualify.py \
            --archive "$RUNNER_TEMP/c238/current212.zip" \
            --flags experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json \
            --release "$RUNNER_TEMP/c238/nucleus-release" \
            --diagnostics "$RUNNER_TEMP/c238/nucleus-diagnostics" \
            --out "$RUNNER_TEMP/c238"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c238-128mib-full212-qualification
          path: ${{ runner.temp }}/c238/
          retention-days: 60
