name: Nucleus C239 source-authentic Lean proof-irrelevance A/B
on:
  push:
    branches: [research/nucleus-c239-proof-irrel-c189-diagnostic-20261119]
    paths:
      - '.github/workflows/nucleus-c239-authentic-proof-irrel-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authentic-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: leanprover/lean4export
          ref: af5aa64bb914c3c2c781f378088dbd38acf4f804
          path: exporter
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Pin C239 source, authentic Lean target, and exporter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel/src)" = ac74a47a570babe5d7895fb74d2098831aa9a300
          test "$(git rev-parse HEAD:.github/nucleus-c239-proof/ProofIrrel.lean)" = 85a33c72daa9b3b3e5190d5f7e6aad2c62b2340b
          test "$(git -C exporter rev-parse HEAD)" = af5aa64bb914c3c2c781f378088dbd38acf4f804
          mkdir -p "$RUNNER_TEMP/nucleus-c239-authentic"
          git rev-parse HEAD > "$RUNNER_TEMP/nucleus-c239-authentic/replay-head.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/nucleus-c239-authentic/checker-tree.txt"
          sha256sum .github/nucleus-c239-proof/ProofIrrel.lean > "$RUNNER_TEMP/nucleus-c239-authentic/lean-source-sha256.txt"
      - name: Compile actual Lean rfl theorem with historical 4.34 nightly
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:nightly-2026-07-27
          elan default leanprover/lean4:nightly-2026-07-27
          export ELAN_TOOLCHAIN=leanprover/lean4:nightly-2026-07-27
          lean --version | tee "$RUNNER_TEMP/nucleus-c239-authentic/lean-version.txt"
          cd "$GITHUB_WORKSPACE/.github/nucleus-c239-proof"
          lean -o ProofIrrel.olean ProofIrrel.lean
          test -s ProofIrrel.olean
          sha256sum ProofIrrel.olean > "$RUNNER_TEMP/nucleus-c239-authentic/lean-olean-sha256.txt"
      - name: Export genuine theorem and harmless control with pinned official exporter
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export ELAN_TOOLCHAIN=leanprover/lean4:nightly-2026-07-27
          cd exporter
          lake build lean4export
          cd "$GITHUB_WORKSPACE"
          export LEAN_PATH="$GITHUB_WORKSPACE/.github/nucleus-c239-proof"
          "$GITHUB_WORKSPACE/exporter/.lake/build/bin/lean4export" ProofIrrel -- ProofIrrel.app_proof_irrel > "$RUNNER_TEMP/nucleus-c239-authentic/ProofIrrel.ndjson"
          "$GITHUB_WORKSPACE/exporter/.lake/build/bin/lean4export" ProofIrrel -- ProofIrrel.global_app_proof_irrel > "$RUNNER_TEMP/nucleus-c239-authentic/Global.ndjson"
          "$GITHUB_WORKSPACE/exporter/.lake/build/bin/lean4export" ProofIrrel -- ProofIrrel.bound_q_global_f > "$RUNNER_TEMP/nucleus-c239-authentic/BoundQ.ndjson"
          "$GITHUB_WORKSPACE/exporter/.lake/build/bin/lean4export" ProofIrrel -- ProofIrrel.global_q_bound_f > "$RUNNER_TEMP/nucleus-c239-authentic/BoundF.ndjson"
          "$GITHUB_WORKSPACE/exporter/.lake/build/bin/lean4export" ProofIrrel -- ProofIrrel.bound_q_bound_f > "$RUNNER_TEMP/nucleus-c239-authentic/BoundQF.ndjson"
          "$GITHUB_WORKSPACE/exporter/.lake/build/bin/lean4export" ProofIrrel -- ProofIrrel.benign_true > "$RUNNER_TEMP/nucleus-c239-authentic/Benign.ndjson"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "nucleus-c239-authentic"
          for name, theorem in [("ProofIrrel", "app_proof_irrel"), ("Global", "global_app_proof_irrel"), ("BoundQ", "bound_q_global_f"), ("BoundF", "global_q_bound_f"), ("BoundQF", "bound_q_bound_f"), ("Benign", "benign_true")]:
              p = out / (name + ".ndjson")
              records = [json.loads(line) for line in p.open()]
              assert records[0]["meta"]["format"]["version"] == "3.1.0"
              names = {rec["in"]: rec["str"]["str"] for rec in records if "in" in rec and "str" in rec}
              actual = {names.get(rec["thm"]["name"]) for rec in records if "thm" in rec}
              assert theorem in actual, actual
              print(name, "source-authentic", p.stat().st_size, "bytes", theorem, records[0]["meta"])
          PY
          sha256sum "$RUNNER_TEMP/nucleus-c239-authentic/"*.ndjson > "$RUNNER_TEMP/nucleus-c239-authentic/export-sha256.txt"
      - name: Replay source-authentic Lean certificate with C189 off and on
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          checker=metatron-kernel/target/release/metatron-kernel
          out="$RUNNER_TEMP/nucleus-c239-authentic"
          for module in Global BoundQ BoundF BoundQF ProofIrrel Benign; do
            set +e
            NUCLEUS_TRACE_DOWNSTREAM=1 NUCLEUS_TRACE_VALUE_MISMATCH=1 NUCLEUS_TRACE_PARSE_ERROR=1 timeout 180 "$checker" < "$out/$module.ndjson" > "$out/$module-default.log" 2>&1
            normal_rc=$?
            NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF=1 NUCLEUS_C189_TRACE=1 NUCLEUS_TRACE_VALUE_MISMATCH=1 NUCLEUS_TRACE_DOWNSTREAM=1 NUCLEUS_TRACE_PARSE_ERROR=1 timeout 180 "$checker" < "$out/$module.ndjson" > "$out/$module-c189.log" 2>&1
            c189_rc=$?
            set -e
            printf '%s default=%s c189=%s\n' "$module" "$normal_rc" "$c189_rc" | tee -a "$out/verdicts.txt"
            echo "$module DEFAULT termination:"
            grep '^NUCLEUS_DOWNSTREAM:' "$out/$module-default.log" | tail -n 2 || true
            echo "$module C189 termination:"
            grep '^NUCLEUS_DOWNSTREAM:' "$out/$module-c189.log" | tail -n 2 || true
            if [ "$module" = Benign ]; then
              test "$normal_rc" -eq 0
              test "$c189_rc" -eq 0
            fi
          done
      - name: Replay authentic factorial under qualified C239 212-case flags
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json)" = 7b26987e4fc0609f45ef96775659eee145794675
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "nucleus-c239-authentic"
          checker = Path("metatron-kernel/target/release/metatron-kernel").resolve()
          flags = json.loads(Path("experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json").read_text())["flags"]
          assert len(flags) == 24 and set(flags.values()) == {"1"}
          extras = ("C182_TYPED_PROOF_IRREL", "C189_NEUTRAL_LAMBDA_PROOF",
                    "C190_QUOTIENT_IOTA", "C199_TWO_PARAM_EIGHT_FIELD_RECORD",
                    "C201_CLOSED_NULLARY_ENUM", "C216_RIGID_DATA_FUNCTION_CTOR")
          policy = dict(flags)
          policy.update({"NUCLEUS_EXPERIMENTAL_" + flag: "1" for flag in extras})
          policy["NUCLEUS_C234_CAPTURE_FALLBACK_RESERVE"] = "1"
          modes = {
              "default": {},
              "c189": {"NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF": "1"},
              "relevance": {"NUCLEUS_EXPERIMENTAL_RELEVANCE": "1"},
              "relevance_c189": {"NUCLEUS_EXPERIMENTAL_RELEVANCE": "1",
                                "NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF": "1"},
              "qualified": policy,
              "qualified_without_relevance": {k:v for k,v in policy.items() if k != "NUCLEUS_EXPERIMENTAL_RELEVANCE"},
          }
          cases = {
              "Global": [1, 0, 0, 0, 0, 0],
              "BoundQ": [1, 1, 0, 0, 0, 1],
              "BoundF": [1, 0, 1, 0, 0, 0],
              "BoundQF": [1, 1, 1, 1, 1, 1],
              "ProofIrrel": [1, 1, 1, 1, 1, 1],
              "Benign": [0, 0, 0, 0, 0, 0],
          }
          results = []
          for name, expected in cases.items():
              data = (out / (name + ".ndjson")).read_bytes()
              for (mode, override), want in zip(modes.items(), expected):
                  env = {k:v for k,v in os.environ.items() if not k.startswith("NUCLEUS_")}
                  env.update(override)
                  env["NUCLEUS_TRACE_DOWNSTREAM"] = "1"
                  proc = subprocess.run([str(checker)], input=data, capture_output=True,
                                        env=env, timeout=180, check=False)
                  (out / f"{name}-{mode}-qualified.log").write_bytes(proc.stdout + proc.stderr)
                  verdict = "ACCEPT" if proc.returncode == 0 else "REJECT"
                  results.append(f"{name} {mode} rc={proc.returncode} {verdict}")
                  assert proc.returncode == want, f"{name}/{mode}: got {proc.returncode}; expected {want}"
          (out / "verdicts-qualified.txt").write_text("\n".join(results) + "\n")
          print("\n".join(results))
          PY
      - name: Fetch exact 2026-11-19 original Lean forgery exports
        uses: actions/download-artifact@v4
        with:
          name: nucleus-cve72844-original-olean-evidence
          run-id: 44445975266
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nucleus-c239-authentic/original-cve
      - name: Replay pinned forged exports with qualified C239 flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib, os, subprocess
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "nucleus-c239-authentic"
          originals = out / "original-cve"
          checker = Path("metatron-kernel/target/release/metatron-kernel").resolve()
          sha = {"PNP": "4a4078aa0c10b9566537e8e943d9cf8bdd70b7ac068b986432fc16620cc03802",
                 "PNNP": "894f8bd6fd3bd6463408971b9393fbf5dc8b7e3bbf778b35291aee2c746cbe9a",
                 "Benign": "72ee6ab16e9e5142b1e6171b918c422d3ca67f666a441e616f6d0112b0cd37c8"}
          historical = json.loads(Path("experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json").read_text())["flags"]
          extras = ("C182_TYPED_PROOF_IRREL", "C189_NEUTRAL_LAMBDA_PROOF",
                    "C190_QUOTIENT_IOTA", "C199_TWO_PARAM_EIGHT_FIELD_RECORD",
                    "C201_CLOSED_NULLARY_ENUM", "C216_RIGID_DATA_FUNCTION_CTOR")
          qualified = dict(historical)
          qualified.update({"NUCLEUS_EXPERIMENTAL_" + flag: "1" for flag in extras})
          qualified["NUCLEUS_C234_CAPTURE_FALLBACK_RESERVE"] = "1"
          modes = {"default": {}, "c189": {"NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF": "1"},
                   "relevance": {"NUCLEUS_EXPERIMENTAL_RELEVANCE": "1"}, "qualified": qualified}
          results = []
          for name, expected_hash in sha.items():
              data = (originals / (name + ".ndjson")).read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected_hash, name
              for mode, overrides in modes.items():
                  env = {k:v for k,v in os.environ.items() if not k.startswith("NUCLEUS_")}
                  env.update(overrides)
                  env["NUCLEUS_TRACE_DOWNSTREAM"] = "1"
                  proc = subprocess.run([str(checker)], input=data, capture_output=True,
                                        env=env, timeout=180, check=False)
                  (out / f"CVE-{name}-{mode}.log").write_bytes(proc.stdout + proc.stderr)
                  expected = 0 if name == "Benign" else 1
                  results.append(f"original-{name} {mode} rc={proc.returncode}")
                  assert proc.returncode == expected, f"{name}/{mode}: got {proc.returncode}; expected {expected}"
          (out / "verdicts-cve-qualified.txt").write_text("\n".join(results) + "\n")
          print("\n".join(results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c239-source-authentic-irrel-evidence
          path: ${{ runner.temp }}/nucleus-c239-authentic/
          retention-days: 90
# Bounded research spike. Neither kernel source nor production flags are modified.
