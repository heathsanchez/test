name: Nucleus C239 proof-irrelevance source-qualified diagnostic
on:
  push:
    branches: [research/nucleus-c239-proof-irrel-c189-diagnostic-20261119]
    paths:
      - '.github/workflows/nucleus-c239-proof-irrel-diagnostic-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  c239-relevance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Pin qualified checker and unchanged failing source test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel/src)" = ac74a47a570babe5d7895fb74d2098831aa9a300
          test "$(git rev-parse HEAD:metatron-kernel/tests/checked_relevance_signature.rs)" = 77e68efa2635d260819b66fc32c04990ed7a3815
          mkdir -p "$RUNNER_TEMP/nucleus-c239-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/nucleus-c239-proof/head.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/nucleus-c239-proof/source-tree.txt"
          sha256sum metatron-kernel/tests/checked_relevance_signature.rs > "$RUNNER_TEMP/nucleus-c239-proof/test-sha256.txt"
      - name: A/B reproduce default failure and probe separately gated evidence paths
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nucleus-c239-proof"
          manifest=metatron-kernel/Cargo.toml
          set +e
          NUCLEUS_TRACE_VALUE_MISMATCH=1 cargo test --locked --manifest-path "$manifest" --test checked_relevance_signature -- --nocapture > "$out/default.log" 2>&1
          baseline_rc=$?
          NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF=1 cargo test --locked --manifest-path "$manifest" --test checked_relevance_signature -- --nocapture > "$out/c189-enabled.log" 2>&1
          c189_rc=$?
          NUCLEUS_EXPERIMENTAL_C182_TYPED_PROOF_IRREL=1 cargo test --locked --manifest-path "$manifest" --test checked_relevance_signature -- --nocapture > "$out/c182-enabled.log" 2>&1
          c182_rc=$?
          NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF=1 NUCLEUS_C189_TRACE=1 cargo test --locked --features diagnostics --manifest-path "$manifest" --test checked_relevance_signature distinct_proof_arguments_of_same_checked_proposition_are_convertible -- --exact --nocapture > "$out/c189-instrumented.log" 2>&1
          c189_instrumented_rc=$?
          set -e
          printf 'baseline=%s\nc189_enabled=%s\nc182_enabled=%s\nc189_diagnostics=%s\n' "$baseline_rc" "$c189_rc" "$c182_rc" "$c189_instrumented_rc" | tee "$out/results.txt"
          for file in "$out/"*.log; do
            echo "=== $(basename "$file") ==="
            grep -E 'test result:|rigid-value-constructor-mismatch|NUCLEUS_VALUE_MISMATCH:|NUCLEUS_SOURCE_PROOF_IRREL:' "$file" | tail -n 15 || true
          done
          test "$baseline_rc" -eq 101
          grep -Fq '2 passed; 1 failed' "$out/default.log"
          grep -Fq 'rigid-value-constructor-mismatch' "$out/default.log"
      - name: Gate-on release CLI must preserve bad REJECT and good ACCEPT
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          checker=metatron-kernel/target/release/metatron-kernel
          out="$RUNNER_TEMP/nucleus-c239-proof"
          set +e
          NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF=1 "$checker" < metatron-kernel/tests/fixtures/bad-nested-unused-param.ndjson
          bad_rc=$?
          NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF=1 "$checker" < metatron-kernel/tests/fixtures/good-beta-definition.ndjson
          good_rc=$?
          set -e
          printf 'source_shaped_bad=%s\nbenign_beta=%s\n' "$bad_rc" "$good_rc" | tee "$out/c189-cli-results.txt"
          test "$bad_rc" -eq 1
          test "$good_rc" -eq 0
      - name: Full native suite with C189 gate only (not production)
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nucleus-c239-proof"
          set +e
          NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF=1 timeout 600 cargo test --locked --manifest-path metatron-kernel/Cargo.toml --no-fail-fast > "$out/c189-full-native.log" 2>&1
          suite_rc=$?
          set -e
          printf 'c189_full_native=%s\n' "$suite_rc" | tee "$out/c189-full-native-status.txt"
          grep -E 'test result:|FAILED|error: test failed|running [0-9]+ tests' "$out/c189-full-native.log" | tail -n 65 || true
          test "$suite_rc" -eq 0
      - name: Download previously frozen original CVE exports and matched benign control
        uses: actions/download-artifact@v4
        with:
          name: nucleus-cve72844-original-olean-evidence
          run-id: 44445975266
          repository: heathsanchez/test
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nucleus-c239-proof/exact-cve
      - name: C189-enabled checker must still reject exact forged certificates
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nucleus-c239-proof"
          evidence="$out/exact-cve"
          test "$(sha256sum "$evidence/PNP.ndjson" | cut -d' ' -f1)" = 4a4078aa0c10b9566537e8e943d9cf8bdd70b7ac068b986432fc16620cc03802
          test "$(sha256sum "$evidence/PNNP.ndjson" | cut -d' ' -f1)" = 894f8bd6fd3bd6463408971b9393fbf5dc8b7e3bbf778b35291aee2c746cbe9a
          test "$(sha256sum "$evidence/Benign.ndjson" | cut -d' ' -f1)" = 72ee6ab16e9e5142b1e6171b918c422d3ca67f666a441e616f6d0112b0cd37c8
          checker=metatron-kernel/target/release/metatron-kernel
          test -x "$checker"
          for module in PNP PNNP Benign; do
            set +e
            NUCLEUS_EXPERIMENTAL_C189_NEUTRAL_LAMBDA_PROOF=1 NUCLEUS_TRACE_PARSE_ERROR=1 timeout 180 "$checker" < "$evidence/$module.ndjson" > "$out/c189-$module-output.txt" 2>&1
            rc=$?
            set -e
            printf '%s=%s\n' "$module" "$rc" | tee -a "$out/c189-exact-cve-results.txt"
            if [ "$module" = Benign ]; then test "$rc" -eq 0; else test "$rc" -eq 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c239-proof-irrel-ab-evidence
          path: ${{ runner.temp }}/nucleus-c239-proof/
          retention-days: 90
# This is a diagnostic spike; the checker and the three original tests remain unchanged.
# Optional environment gates are probes, not a promoted production fix.
