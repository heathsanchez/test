name: Nucleus C260 opt-in typed body 8192 original Fueled A/B
on:
  push:
    branches: [research/nucleus-c260-typed-body-8192-20261118]
    paths:
      - '.github/workflows/nucleus-c260-typed-body-8192-20261118.yml'
      - 'metatron-kernel/src/typecheck.rs'
      - 'metatron-kernel/scripts/c260_typed_body_8192_replay.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-body:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Verify code and build unchanged independent checker judgments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c260"
          git rev-parse HEAD > "$RUNNER_TEMP/c260/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/c260/source-tree.txt"
          python3 -m py_compile metatron-kernel/scripts/c255_lambda_premise_replay.py metatron-kernel/scripts/c260_typed_body_8192_replay.py
          (cd metatron-kernel && python3 -m unittest discover -s tests_py -v)
          cargo test --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo test --locked --features diagnostics --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel "$RUNNER_TEMP/c260/nucleus"
          sha256sum "$RUNNER_TEMP/c260/nucleus" > "$RUNNER_TEMP/c260/binary-sha256.txt"
      - name: Recover immutable 212-case official source archive
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/14152050888/zip > "$RUNNER_TEMP/c260/current212.zip"
          printf '%s  %s\n' 5bd679fe1f7a6988575ec469264b24cab8ddf465ae064bcb79d99541658acd2f "$RUNNER_TEMP/c260/current212.zip" | sha256sum -c -
      - name: Preserve C255 four original arms and 22 paired soundness controls
        shell: bash
        run: |
          set -euo pipefail
          python3 metatron-kernel/scripts/c255_lambda_premise_replay.py \
            --archive "$RUNNER_TEMP/c260/current212.zip" \
            --checker "$RUNNER_TEMP/c260/nucleus" \
            --flags experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json \
            --out "$RUNNER_TEMP/c260"
      - name: Replay authentic Fueled 4096-vs-8192 checker and 22 controls
        shell: bash
        run: |
          set -euo pipefail
          python3 metatron-kernel/scripts/c260_typed_body_8192_replay.py \
            --archive "$RUNNER_TEMP/c260/current212.zip" \
            --checker "$RUNNER_TEMP/c260/nucleus" \
            --flags experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json \
            --out "$RUNNER_TEMP/c260"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-c260-typed-body-8192-source-pinned
          path: ${{ runner.temp }}/c260/
          retention-days: 60
