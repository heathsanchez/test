# C48: determine the first independently source-owned recursor transition
# that differs between standard UNKNOWN and high-budget diagnostic ACCEPT.
name: Nucleus C48 first source transition
on:
  push:
    branches: [research/nucleus-c48-source-transition-20261109]
    paths: ['.github/workflows/nucleus-c48-first-source-transition.yml']
  workflow_dispatch:
permissions: {contents: write, actions: read}
jobs:
  source-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore source-qualified C37 and exact lineage through C48
        run: |
          set -euo pipefail
          mkdir -p base candidate reports arena207
          gh api repos/heathsanchez/test/actions/artifacts/13609679273/zip > c37-qualified.zip
          printf '%s  %s\n' fceddaca338ca36c2964edf0ec81b9e4acd0b66d938864ec5e7239f766e186c3 c37-qualified.zip | sha256sum -c -
          unzip -p c37-qualified.zip candidate/source.tar.gz > c37-source.tar.gz
          printf '%s  %s\n' bb64f47470f950f78e7fe4c659fbcb2a75d72e96831430ec1eb3562c55175152 c37-source.tar.gz | sha256sum -c -
          unzip -p c37-qualified.zip base/flags.json > base/flags.json
          tar --no-same-owner -xzf c37-source.tar.gz
          for patch_name in c38-early-full-typed-spine.patch c39-typed-failure-stage.patch c40-c42-source-capture.patch c43-deep-exposure-guard.patch c44-exact-source-forwarding.patch c47-inner-work-diagnostics.patch c48-source-branch-divergence.patch; do
            patch --fuzz=0 -p1 -d metatron-kernel < "experiments/nucleus-logos-support-20261108/$patch_name"
            sha256sum "experiments/nucleus-logos-support-20261108/$patch_name" >> reports/patches.sha256
          done
          cargo check --locked --all-targets --features diagnostics --manifest-path metatron-kernel/Cargo.toml > reports/cargo-check.log 2>&1 || { tail -n 120 reports/cargo-check.log; exit 1; }
      - name: Native tests and independent forged-proof guards
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json)
          env "${flags[@]}" cargo test --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml > reports/native-tests.log 2>&1 || { tail -n 120 reports/native-tests.log; exit 1; }
          cargo build --locked --release --features diagnostics --bin nucleus-diagnostic --bin metatron-kernel --manifest-path metatron-kernel/Cargo.toml > reports/release-build.log 2>&1 || { tail -n 120 reports/release-build.log; exit 1; }
          cp metatron-kernel/target/release/nucleus-diagnostic candidate/nucleus-diagnostic
          cp metatron-kernel/target/release/metatron-kernel candidate/metatron-kernel
          sha256sum candidate/* > reports/binaries.sha256
      - name: RED observer-free and C48 differential on frozen n7
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/13276400289/zip > arena207.zip
          printf '%s  %s\n' a9582eadc0d9893cbe39e6bcfccd79bfaec2032838851b8a487c35df16096763 arena207.zip | sha256sum -c -
          unzip -p arena207.zip lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C arena207
          PYTHONPATH=experiments/nucleus-logos-support-20261108 python3 -m unittest experiments/nucleus-logos-support-20261108/test_c48_first_divergence.py -v
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json)
          set +e
          env "${flags[@]}" candidate/metatron-kernel < arena207/good/perf/magma-list-pair-n7.ndjson > reports/c48-observer-off.stdout 2> reports/c48-observer-off.stderr
          off_rc=$?
          set -e
          test "$off_rc" -eq 2
          python3 experiments/nucleus-logos-support-20261108/probe_c48_first_divergence.py \
            --binary candidate/nucleus-diagnostic \
            --input arena207/good/perf/magma-list-pair-n7.ndjson \
            --flags base/flags.json --stderr-dir reports --require-events | tee reports/c48-n7-comparison.json
          python3 -c 'import json; r=json.load(open("reports/c48-n7-comparison.json")); assert r["standard"]["verdict"]=="UNKNOWN"; assert r["accepted_diagnostic"]["verdict"]=="ACCEPT_DIAGNOSTIC_ONLY"; print("C48 first structural divergence", r["first_divergence"])'
      - name: Preserve positive or negative source transition receipt
        continue-on-error: true
        run: |
          set -euo pipefail
          cp reports/c48-n7-comparison.json experiments/nucleus-logos-support-20261108/c48-n7-first-source-transition.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/nucleus-logos-support-20261108/c48-n7-first-source-transition.json
          git commit -m 'C48 source-owned recursor divergence receipt (diagnostic only)'
          git push origin HEAD:refs/heads/research/nucleus-c48-source-transition-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-C48-first-source-transition
          retention-days: 60
          path: |
            reports/
            candidate/
            base/flags.json
