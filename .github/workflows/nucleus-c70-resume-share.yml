name: Nucleus C70 original n7 A/B/C resumable source computation
on:
  push:
    branches:
      - research/nucleus-c70-resume-share-20261109
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore native-qualified source and apply one scoped allowance trial
        run: |
          set -euo pipefail
          mkdir -p base candidate reports arena207
          gh api repos/heathsanchez/test/actions/artifacts/13609679273/zip > c37-qualified.zip
          printf '%s  %s\n' fceddaca338ca36c2964edf0ec81b9e4acd0b66d938864ec5e7239f766e186c3 c37-qualified.zip | sha256sum -c -
          unzip -p c37-qualified.zip candidate/source.tar.gz > c37-source.tar.gz
          printf '%s  %s\n' bb64f47470f950f78e7fe4c659fbcb2a75d72e96831430ec1eb3562c55175152 c37-source.tar.gz | sha256sum -c -
          unzip -p c37-qualified.zip base/flags.json > base/flags.json
          tar --no-same-owner -xzf c37-source.tar.gz
          for patch_name in c38-early-full-typed-spine.patch c39-typed-failure-stage.patch c40-c42-source-capture.patch c43-deep-exposure-guard.patch c44-exact-source-forwarding.patch c47-inner-work-diagnostics.patch c48-source-branch-divergence.patch c49-capture-content-fingerprint.patch c50-worklist-loss-diagnostics.patch; do
            patch --fuzz=0 -p1 -d metatron-kernel < "experiments/nucleus-logos-support-20261108/$patch_name"
            sha256sum "experiments/nucleus-logos-support-20261108/$patch_name" >> reports/patches.sha256
          done
          for patch_name in c55-app-failure-state.patch c56-neutral-pair-classification.patch c58-source-opening-allowance.patch c64-source-instance-observer.patch; do
            patch --fuzz=0 -p1 -d . < "experiments/nucleus-logos-support-20261108/$patch_name"
            sha256sum "experiments/nucleus-logos-support-20261108/$patch_name" >> reports/patches.sha256
          done
          python3 -m py_compile experiments/nucleus-certified-decide-20261109/c69_instrument.py
          python3 experiments/nucleus-certified-decide-20261109/c69_instrument.py
          grep -n -C 9 'expose_uncached_internal_with_pending' metatron-kernel/src/machine.rs | head -n 100
          python3 -m py_compile experiments/nucleus-certified-decide-20261109/c70_resume_share.py
          python3 experiments/nucleus-certified-decide-20261109/c70_resume_share.py
          cargo check --locked --all-targets --features diagnostics --manifest-path metatron-kernel/Cargo.toml > reports/cargo-check.log 2>&1 || { tail -n 120 reports/cargo-check.log; exit 1; }
      - name: Compile observation-only Nucleus diagnostic binary
        run: |
          set -euo pipefail
          cargo build --locked --release --features diagnostics --bin nucleus-diagnostic --manifest-path metatron-kernel/Cargo.toml > reports/release-build.log 2>&1 || { tail -n 120 reports/release-build.log; exit 1; }
          cp metatron-kernel/target/release/nucleus-diagnostic candidate/nucleus-diagnostic
          sha256sum candidate/* > reports/binaries.sha256
      - name: A/B/C same unchanged original, positive control and invalid source controls
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/13276400289/zip > arena207.zip
          printf '%s  %s\n' a9582eadc0d9893cbe39e6bcfccd79bfaec2032838851b8a487c35df16096763 arena207.zip | sha256sum -c -
          unzip -p arena207.zip lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C arena207
          python3 - <<'PY'
          import pathlib,hashlib,os,subprocess,json,time
          root=pathlib.Path("arena207")
          original=(root/"good/perf/magma-list-pair-n7.ndjson").read_bytes()
          digest=hashlib.sha256(original).hexdigest()
          assert digest=="abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35"
          flags=json.loads(pathlib.Path("base/flags.json").read_text())
          assert len(flags)==24 and set(flags.values())=={"1"}
          cases=[
              ("n7","good/perf/magma-list-pair-n7.ndjson","valid"),
              ("n21","good/perf/magma-list-pair-n21.ndjson","valid"),
              ("nat-rec","bad/bugs/nat-rec-rules.ndjson","invalid"),
              ("orphan-rec","bad/bugs/orphan-rec.ndjson","invalid"),
          ]
          rows=[]
          for arm in ("A_baseline","B_resume","C_resume_share"):
            for label,filename,classification in cases:
              src=(root/filename).read_bytes()
              env={k:v for k,v in os.environ.items() if not k.startswith("NUCLEUS_")}
              env.update(flags)
              env.update({"NUCLEUS_C69_SOURCE_COST":"1"})
              if arm!="A_baseline":env["NUCLEUS_C70_RESUME_PREFIX"]="1"
              if arm=="C_resume_share":env["NUCLEUS_C70_SHARE_COMPLETED"]="1"
              ts=time.monotonic()
              p=subprocess.run(["candidate/nucleus-diagnostic","262144"],input=src,capture_output=True,env=env,timeout=120)
              wall=time.monotonic()-ts
              stderr=p.stderr.decode(errors="replace")
              name=f"{arm}_{label}"
              pathlib.Path("reports/"+name+".stderr").write_text(stderr)
              marks=[x for x in stderr.splitlines() if x.startswith("NUCLEUS_C70_COUNTS:")]
              assert len(marks)==1,(arm,label,"C70 marker missing",stderr[-1200:])
              counts=json.loads(marks[0].split(":",1)[1])
              c69=[x for x in stderr.splitlines() if x.startswith("NUCLEUS_C69_COUNTS:")]
              assert len(c69)==1,(arm,label,"C69 marker missing")
              exposure=json.loads(c69[0].split(":",1)[1])
              verdict={0:"ACCEPT",1:"REJECT",2:"UNKNOWN",3:"ERROR"}.get(p.returncode,"ERROR")
              row={"arm":arm,"case":label,"class":classification,"verdict":verdict,
                   "input_sha256":hashlib.sha256(src).hexdigest(),
                   "wall_seconds":round(wall,5),
                   "counts":counts,"source_counts":exposure,
                   "stderr_sha256":hashlib.sha256(p.stderr).hexdigest()}
              print("NUCLEUS_C70_ARM="+json.dumps(row,sort_keys=True),flush=True)
              rows.append(row)
              if classification=="invalid":assert verdict in ("REJECT","UNKNOWN"),"false ACCEPT on "+name
              else:assert verdict in ("ACCEPT","UNKNOWN"),"valid theorem REJECT/ERROR on "+name
          baseline=[r for r in rows if r["arm"]=="A_baseline" and r["case"]=="n7"][0]
          assert baseline["verdict"]=="UNKNOWN","original standard-budget authority drift"
          new_accept=[r for r in rows if r["arm"]!="A_baseline" and r["class"]=="valid" and r["verdict"]=="ACCEPT"]
          print("NUCLEUS_C70_NEW_ORIGINAL_ACCEPTS="+str(len(new_accept)),flush=True)
          pathlib.Path("reports/c70.json").write_text(json.dumps({
              "experiment":"C70 same-source A/B/C with exact immutable owner and no new proof rules",
              "original_sha256":digest,"standard_budget":262144,
              "proof_rules_changed":False,"selected_checker_changed":False,
              "protected_403_run":False,"new_accepts":[r["case"] for r in new_accept],
              "rows":rows},indent=2)+"\n")
          PY
      - name: Full source-native proof and forged-proof regression gate
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json)
          env "${flags[@]}" cargo test --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml > reports/native-tests.log 2>&1 || { tail -n 120 reports/native-tests.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-C70-abc-n7
          retention-days: 60
          path: |
            reports/
            candidate/
            base/flags.json
