name: Nucleus C71 native arithmetic census
on:
  push:
    branches: [research/nucleus-c71-native-arith-census-20261109]
    paths: ['.github/workflows/nucleus-c71-native-arith-census.yml']
  workflow_dispatch:
permissions: {contents: write, actions: read}
jobs:
  native-arith-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore exact selected source and new observer-only patch
        run: |
          set -euo pipefail
          mkdir -p base candidate reports original
          gh api repos/heathsanchez/test/actions/artifacts/13609679273/zip > c37.zip
          printf '%s  %s\n' fceddaca338ca36c2964edf0ec81b9e4acd0b66d938864ec5e7239f766e186c3 c37.zip | sha256sum -c -
          unzip -p c37.zip candidate/source.tar.gz > c37-source.tar.gz
          printf '%s  %s\n' bb64f47470f950f78e7fe4c659fbcb2a75d72e96831430ec1eb3562c55175152 c37-source.tar.gz | sha256sum -c -
          unzip -p c37.zip base/flags.json > base/flags.json
          tar --no-same-owner -xzf c37-source.tar.gz
          for patch_name in c38-early-full-typed-spine.patch c39-typed-failure-stage.patch c40-c42-source-capture.patch c43-deep-exposure-guard.patch c44-exact-source-forwarding.patch c47-inner-work-diagnostics.patch c48-source-branch-divergence.patch c49-capture-content-fingerprint.patch c50-worklist-loss-diagnostics.patch; do
            patch --fuzz=0 -p1 -d metatron-kernel < "experiments/nucleus-logos-support-20261108/$patch_name"
          done
          for patch_name in c55-app-failure-state.patch c56-neutral-pair-classification.patch c58-source-opening-allowance.patch c64-source-instance-observer.patch; do
            patch --fuzz=0 -p1 -d . < "experiments/nucleus-logos-support-20261108/$patch_name"
          done
          patch --fuzz=0 -p1 -d . < experiments/nucleus-logos-support-20261108/c69-pure-major-alias-observer.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c71-ground-arith-census.patch
          cargo check --locked --all-targets --features diagnostics --manifest-path metatron-kernel/Cargo.toml > reports/cargo-check.log 2>&1 || { tail -n 120 reports/cargo-check.log; exit 1; }
      - name: Native soundness controls and diagnostic build
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json)
          env "${flags[@]}" cargo test --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml > reports/native-tests.log 2>&1 || { tail -n 110 reports/native-tests.log; exit 1; }
          cargo build --locked --release --features diagnostics --bin nucleus-diagnostic --manifest-path metatron-kernel/Cargo.toml > reports/release-build.log 2>&1 || { tail -n 110 reports/release-build.log; exit 1; }
          cp metatron-kernel/target/release/nucleus-diagnostic candidate/nucleus-c71
          sha256sum candidate/nucleus-c71 > reports/binaries.sha256
      - name: Frozen pair with C71 arithmetic observer off and on
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/13622452324/zip > c58.zip
          printf '%s  %s\n' 63764179e4cfcd89cac50c8e200977c9169cab47e073086e463c86b3fbcfcadd c58.zip | sha256sum -c -
          unzip -p c58.zip candidate/nucleus-diagnostic > candidate/nucleus-c58
          chmod +x candidate/nucleus-c58
          printf '%s  %s\n' 37b77b125745e7b3eabfbb0adba1da76ea27dac11d13efcc05586f0892b39e6f candidate/nucleus-c58 | sha256sum -c -
          gh api repos/heathsanchez/test/actions/artifacts/13276400289/zip > originals.zip
          printf '%s  %s\n' a9582eadc0d9893cbe39e6bcfccd79bfaec2032838851b8a487c35df16096763 originals.zip | sha256sum -c -
          unzip -p originals.zip lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C original
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          flags=json.loads(Path('base/flags.json').read_text())
          assert len(flags)==24 and set(flags.values())=={'1'}
          cases=[
            ('magma-list-pair-n7',8837,'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35'),
            ('magma-list-pair-n21',8827,'b8279fa9189a203c6c11b04702c27c0f99a650b37f2b0165dd260b1d14e9ef84'),
          ]
          rows=[]
          for case,root,source_hash in cases:
            source=Path('original/good/perf/'+case+'.ndjson').read_bytes()
            assert hashlib.sha256(source).hexdigest()==source_hash
            for variant,binary,observer in [
              ('baseline','nucleus-c58',False),
              ('candidate-off','nucleus-c71',False),
              ('candidate-on','nucleus-c71',True)]:
              env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
              env.update(flags)
              env.update({'NUCLEUS_ASSURANCE_SOURCE_OWNED_PROBE':'1',
                'NUCLEUS_DIAGNOSTIC_C47_PROFILE_EXPR':str(root),
                'NUCLEUS_DIAGNOSTIC_C55_APP_SHAPE':'1',
                'NUCLEUS_DIAGNOSTIC_C56_NEUTRAL_PAIR':'1'})
              if observer:
                env['NUCLEUS_DIAGNOSTIC_C69_PURE_ALIAS']='1'
                env['NUCLEUS_DIAGNOSTIC_C71_ARITH_CENSUS']='1'
              result=subprocess.run([str(Path('candidate/'+binary).resolve()),'262144'],
                input=source,capture_output=True,env=env,timeout=180)
              verdict={0:'ACCEPT',1:'REJECT',2:'UNKNOWN',3:'ERROR'}.get(result.returncode,'ERROR')
              log=result.stderr.decode(errors='replace').splitlines()
              pairs=[x for x in log if x.startswith('NUCLEUS_C56_PAIR:')]
              work=[x for x in log if x.startswith('NUCLEUS_C47_INNER_WORK:')]
              aliases=[x for x in log if x.startswith('NUCLEUS_C69_PURE_ALIAS:')]
              census=[x for x in log if x.startswith('NUCLEUS_C71_ARITH_CENSUS:')]
              assert verdict=='UNKNOWN',(case,variant,verdict)
              assert pairs and len(work)==1,(case,variant,len(pairs),len(work))
              assert bool(aliases)==observer,(case,variant,aliases)
              assert len(census)==int(observer),(case,variant,census)
              assert all('terminal=' in x for x in aliases)
              Path(f'reports/c71-{case}-{variant}.stderr').write_bytes(result.stderr)
              rows.append({'case':case,'variant':variant,'source_sha256':source_hash,
                'exit_code':result.returncode,'verdict':verdict,'first_neutral_pair':pairs[0],
                'work':work[0],'alias_events':aliases,'arith_census':census,'stderr_sha256':hashlib.sha256(result.stderr).hexdigest()})
              print(case,variant,verdict,'arith_census',census,flush=True)
          for case,_,_ in cases:
            baseline,off,on=[row for row in rows if row['case']==case]
            assert baseline['work']==off['work']==on['work'],(case,'diagnostic cost changed')
            def stable_signature(row):
              return re.sub(r':env=\d+',':env=<process-local>',row['first_neutral_pair'])
            assert stable_signature(baseline)==stable_signature(off)==stable_signature(on),(case,'neutral pair changed')
          report={'experiment':'C71 read-only native arithmetic groundness census',
            'status':'WARRANTED_DIAGNOSTIC','budget':262144,'originals_artifact':13276400289,
            'selected_c58_binary_sha256':'37b77b125745e7b3eabfbb0adba1da76ea27dac11d13efcc05586f0892b39e6f',
            'candidate_binary_sha256':hashlib.sha256(Path('candidate/nucleus-c71').read_bytes()).hexdigest(),
            'new_proof_rules':False,'source_inputs_modified':False,'protected_full_corpus':False,
            'standard_accepts':0,'diagnostic_only':True,'records':rows}
          Path('reports/c71-pure-major-alias.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Preserve evidence, including failure receipt
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if test -s reports/c71-pure-major-alias.json; then
            cp reports/c71-pure-major-alias.json experiments/nucleus-logos-support-20261108/c71-ground-arith-census.json
          else
            printf '{"status":"UNKNOWN_CI_FAILURE","qualified":false,"standard_accepts":0}\n' > experiments/nucleus-logos-support-20261108/c71-ground-arith-census.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/nucleus-logos-support-20261108/c71-ground-arith-census.json
          git commit -m 'C71 preserve ground arithmetic diagnostic'
          git push origin HEAD:refs/heads/research/nucleus-c71-native-arith-census-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-C71-native-arith-census
          retention-days: 60
          path: reports/
