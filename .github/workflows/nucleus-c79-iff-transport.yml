name: Nucleus C79 Lean 4.34.1 source iff-transport formal gate
on:
  push:
    branches: [research/nucleus-c79-original-iff-transport-20261109]
    paths:
      - '.github/workflows/nucleus-c79-iff-transport.yml'
      - 'experiments/nucleus-c76-eta/C79Transport.lean'
      - 'experiments/nucleus-c76-eta/ForgedTransport.lean'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install exact original-era Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/nucleus-c76-eta
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
      - name: Check original iff transport constructor rules and axiom footprint
        working-directory: experiments/nucleus-c76-eta
        run: |
          set -euo pipefail
          lean --version
          lake env lean C79Transport.lean 2>&1 | tee c79-axioms.log
          if grep -E 'depends on axioms:|sorryAx|unapproved axiom' c79-axioms.log; then
            echo 'C79_AXIOMS_OR_SORRY'
            exit 1
          fi
          test "$(grep -c 'does not depend on any axioms' c79-axioms.log)" -eq 3
          if lake env lean ForgedTransport.lean > c79-forged.log 2>&1; then
            echo 'C79_WRONG_CONSTRUCTOR_TRANSPORT_ACCEPTED'
            exit 1
          fi
          grep -q 'error:' c79-forged.log
          cat c79-forged.log
          echo 'C79_ORIGINAL_IFF_TRANSPORT_AXIOM_FREE_CONDITIONAL'
          echo 'C79_N7_STANDARD_ACCEPTS=0'
          sha256sum C79Transport.lean ForgedTransport.lean lean-toolchain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-C79-original-iff
          retention-days: 60
          path: |
            experiments/nucleus-c76-eta/c79-axioms.log
            experiments/nucleus-c76-eta/c79-forged.log
