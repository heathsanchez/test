name: Nucleus source-owned projection target cache protected A B qualification
on:
  push:
    branches: [research/nucleus-capability-cache-20261104]
    paths: ['.github/workflows/nucleus-capability-cache-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-source-owned-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore exact frozen inputs and previously qualified source reference
        run: |
          set -euo pipefail
          mkdir -p /tmp/current208
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/ref-inputs.zip
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/ref-inputs.zip | sha256sum -c -
          unzip -q /tmp/ref-inputs.zip -d /tmp/current208
          gh api repos/heathsanchez/test/actions/artifacts/13242401296/zip > /tmp/reference-qualified.zip
          printf '%s  %s\n' 94e80c675907498430bea6f5ce89bfe8eeb40922adf4222f906e3b7267217349 /tmp/reference-qualified.zip | sha256sum -c -
          gh api repos/heathsanchez/test/actions/artifacts/13242616719/zip > /tmp/quotient-frontier.zip
          printf '%s  %s\n' 78183d5b00480e3b3a6bec2346eb07ca99fb268c312d457ebf06df1c8d8722cd /tmp/quotient-frontier.zip | sha256sum -c -
          unzip -p /tmp/quotient-frontier.zip next-frontier.ndjson.zst | zstd -dc -o /tmp/quotient-prefix.ndjson
          printf '%s  %s\n' 4883dc9889b546a1117c25c266bae05a344b6609db5cbbfd846a8d7abc92a907 /tmp/quotient-prefix.ndjson | sha256sum -c -
          gh api repos/heathsanchez/test/actions/artifacts/13252896193/zip > /tmp/core8-qualified.zip
          printf '%s  %s\n' 61c1567c57163cf8f0a6c3266d8bdfa987b1a1fe12f87e5998eefa5a53b658ba /tmp/core8-qualified.zip | sha256sum -c -
          unzip -p /tmp/core8-qualified.zip candidate/nucleus > /tmp/nucleus-core8-baseline
          chmod +x /tmp/nucleus-core8-baseline
      - name: Restore exactly the same complete 6.18GB Mathlib input
        run: |
          set -euo pipefail
          mkdir -p /tmp/mathlib-source
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/full-mathlib.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/full-mathlib.zip | sha256sum -c -
          unzip -q /tmp/full-mathlib.zip -d /tmp/mathlib-source
          zstd -d /tmp/mathlib-source/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib.ndjson | sha256sum -c -
          rm /tmp/full-mathlib.zip /tmp/mathlib-source/mathlib.ndjson.zst
      - name: Prospectively qualify source-local immutable projection target indexing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib,json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('experiments/nucleus-quotient-reuse-20261104').resolve()))
          import qualify
          original_materialize=qualify.runner.materialize
          def indexed_materialize(out,semantic=True):
              kernel=original_materialize(out,semantic=semantic)
              source=kernel/'src/capability.rs'
              original=source.read_text()
              revised=original
              def swap(old,new,n=1):
                  nonlocal revised
                  assert revised.count(old)==n,(old[:100],revised.count(old),n)
                  revised=revised.replace(old,new)
              swap('    let target_names: HashSet<NameId> = projection_types\n        .into_iter()\n        .filter(|type_name| prop_projection_target(export, *type_name).is_some())\n        .collect();',
                   '    // A source-local immutable owner index: no cached verdict or foreign authority.\n    let target_names: HashMap<NameId, PropProjectionTarget> = projection_types\n        .into_iter()\n        .filter_map(|type_name| prop_projection_target(export, type_name).map(|target| (type_name, target)))\n        .collect();')
              swap('    target_names: &HashSet<NameId>,','    target_names: &HashMap<NameId, PropProjectionTarget>,',n=2)
              swap('target_names.contains(type_name)','target_names.contains_key(type_name)',n=2)
              swap('projection_is_definitely_invalid(export, *type_name, *index, structure_ty)',
                   'projection_is_definitely_invalid(export, *type_name, *index, structure_ty, target_names)')
              swap('    structure_ty: ExprId,\n) -> bool {\n    let Some(target) = prop_projection_target(export, type_name) else {',
                   '    structure_ty: ExprId,\n    target_names: &HashMap<NameId, PropProjectionTarget>,\n) -> bool {\n    let Some(target) = target_names.get(&type_name) else {')
              source.write_text(revised)
              (out/'capability-cache.patch').write_text(''.join(difflib.unified_diff(original.splitlines(True),revised.splitlines(True),fromfile='a/metatron-kernel/src/capability.rs',tofile='b/metatron-kernel/src/capability.rs')))
              return kernel
          qualify.runner.materialize=indexed_materialize
          drop={"PROJECTION_CONTEXT","PROJECTION_CROSSFRAME_512","TYPED_RECEIVER","SOURCE_PAIR_DEPTH8","PROP_SINGLETON_2P1F","EXPECTED_LAMBDA","TYPED_DATA_CONGRUENCE","REPLAY_PROJECTION_MAJOR","REPLAY_NEUTRAL_PROJECTION"}
          original=qualify.t.FLAGS
          assert drop.issubset(original)
          qualify.t.FLAGS=tuple(f for f in original if f not in drop)
          out=Path('/tmp/nucleus-capability-cache')
          qualify.do_qualification(out,Path('/tmp/mathlib.ndjson'),include_exact=False)
          (out/'prune-plan.json').write_text(json.dumps(dict(disabled=sorted(drop),original=original,enabled=qualify.t.FLAGS),indent=2)+'\n')
          PY
      - name: Paired cold full-input ABBAAB on identical flags with distinct baseline and index binaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,os,sys
          from pathlib import Path
          root=Path('/tmp/nucleus-capability-cache')
          sys.path.insert(0,str(Path('experiments/nucleus-reuse-20261104').resolve()))
          import tournament as t
          from pathlib import Path
          source=Path('/tmp/mathlib.ndjson')
          assert t.digest(source)==t.INPUT_SHA
          baseline_binary=Path('/tmp/nucleus-core8-baseline')
          candidate_binary=root/'candidate/nucleus'
          assert baseline_binary.is_file() and candidate_binary.is_file()
          drop={"PROJECTION_CONTEXT","PROJECTION_CROSSFRAME_512","TYPED_RECEIVER","SOURCE_PAIR_DEPTH8","PROP_SINGLETON_2P1F","EXPECTED_LAMBDA","TYPED_DATA_CONGRUENCE","REPLAY_PROJECTION_MAJOR","REPLAY_NEUTRAL_PROJECTION"}
          env={k:v for k,v in t.run_env().items() if k not in {'NUCLEUS_EXPERIMENTAL_'+f for f in drop}}
          env.update(NUCLEUS_EXPERIMENTAL_CERTIFIED_QUOT_IOTA='1',NUCLEUS_EXPERIMENTAL_SOURCE_PROOF_IRREL='1',NUCLEUS_TRACE_DOWNSTREAM='1')
          binaries={'baseline':baseline_binary,'candidate':candidate_binary}
          pairs=[]
          for pair,order in enumerate((('baseline','candidate'),('candidate','baseline'),('baseline','candidate'))):
              observations={}
              for arm in order:
                  directory=root/'matched'/f'{pair}-{arm}'
                  measurement=t.measure(binaries[arm],source,env,directory,timeout=600,perf=False)
                  traces=[line for line in (directory/'stderr').read_text().splitlines() if line.startswith('NUCLEUS_DOWNSTREAM:')]
                  terminal=traces[-1] if traces else ''
                  row=dict(arm=arm,pair=pair,measurement=measurement,terminal=terminal)
                  observations[arm]=row
                  print('MATCHED_FULL',json.dumps(row),flush=True)
                  assert measurement['rc']==2 and '_private.Init.Data.Nat.Lemmas.0.Nat.right_eq_add._proof_1_1' in terminal
              pairs.append(observations)
          ratios=[]
          for pair in pairs:
              a=pair['baseline']['measurement'];b=pair['candidate']['measurement']
              ratios.append(b['user']/a['user'])
          report=dict(pairs=pairs,ratios=ratios,geomean_ratio=math.prod(ratios)**(1/len(ratios)),
              screen_won=all(x<1 for x in ratios) and math.prod(ratios)**(1/len(ratios))<=.98,
              note='Only source-local projection owner lookup changed; exact 8-core flags, unchanged first Nat UNKNOWN; no official instruction metric, Mathlib ACCEPT or ranking claim')
          (root/'matched-timing.json').write_text(json.dumps(report,indent=2)+'\n')
          print('MATCHED_SUMMARY',json.dumps(dict(ratios=ratios,geomean=report['geomean_ratio'],screen_won=report['screen_won'])),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-capability-cache-${{ github.sha }}
          path: |
            /tmp/nucleus-capability-cache/*.json
            /tmp/nucleus-capability-cache/*.zst
            /tmp/nucleus-capability-cache/candidate/*.json
            /tmp/nucleus-capability-cache/candidate/*.log
            /tmp/nucleus-capability-cache/candidate/*.patch
            /tmp/nucleus-capability-cache/candidate/nucleus
            /tmp/nucleus-capability-cache/controls/*.stderr
            /tmp/nucleus-capability-cache/mathlib
            /tmp/nucleus-capability-cache/matched/*/time.txt
            /tmp/nucleus-capability-cache/matched/*/stderr
