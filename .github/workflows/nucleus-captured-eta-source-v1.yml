name: Nucleus captured eta source witness audit

on:
  push:
    branches: [nucleus-captured-origin-proof-v1, nucleus-source-proof-discharge-v1, nucleus-projection-source-audit-v1]
    paths: [".github/workflows/nucleus-captured-eta-source-v1.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned immutable Arena exports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ar /tmp/tests research/nucleus-evidence
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/ar.zip
          unzip -q /tmp/ar.zip -d /tmp/ar
          tar --no-same-owner -xzf /tmp/ar/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Extract recursive lambda application forms and eta premises
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,hashlib,os
          cases=[
              ('init-prelude',7091,1899),
              ('perf/grind-ring-5',6845,2068),
              ('perf/magma-list-pair-n7',5676,552),
              ('perf/magma-list-pair-n21',5673,548),
          ]
          results=[]
          for case,source_fun,source_minor in cases:
              b=(pathlib.Path('/tmp/tests/good')/(case+'.ndjson')).read_bytes()
              expr={};names={0:''};decls={}
              for line in b.splitlines():
                  j=json.loads(line)
                  for dk in ('def','thm','axiom'):
                      if dk in j:
                          d=j[dk];decls[d['name']]=(dk,d)
                  if 'in' in j:
                      y=j.get('str',j.get('num'))
                      pre=names.get(y['pre'],'')
                      names[j['in']]=pre+('.' if pre else '')+str(y.get('str',y.get('i')))
                  if 'ie' in j: expr[j['ie']]=j
              def node(x):
                  return expr.get(x)
              walk=[]
              def visit(e,depth=0):
                  if depth>10 or e not in expr:return
                  if any(w['expr']==e for w in walk):return
                  n=expr[e]
                  walk.append({'expr':e,'node':n})
                  for key in ('lam','app','forallE','letE'):
                      if key in n:
                          d=n[key]
                          for k in ('type','body','fn','arg','value'):
                              if isinstance(d.get(k),int):visit(d[k],depth+1)
              visit(source_fun);visit(source_minor)
              rec={'case':case,'sha256':hashlib.sha256(b).hexdigest(),
                   'source_fun':source_fun,'source_minor':source_minor,
                   'fun_node':node(source_fun),'minor_node':node(source_minor),
                   'fun_body_node':node(node(source_fun).get('lam',{}).get('body')),
                   'minor_body_node':node(node(source_minor).get('lam',{}).get('body')),
                   'source_walk':walk}
              results.append(rec)
              print('NUCLEUS_ETA_SOURCE='+json.dumps({k:v for k,v in rec.items()
                   if k!='source_walk'},separators=(',',':')),flush=True)
              fun_body=rec['fun_body_node']
              if 'app' in fun_body:
                  h=fun_body['app']['fn'];a=fun_body['app']['arg']
                  function_chain=[];cur=h
                  for i in range(16):
                      n=node(cur)
                      function_chain.append({'id':cur,'shape':n})
                      if not n or 'app' not in n:break
                      cur=n['app']['fn']
                  head=function_chain[-1]
                  n=head['shape'] or {}
                  cname=n.get('const',{}).get('name')
                  decl=decls.get(cname)
                  telescope=[]
                  if decl:
                      p=decl[1].get('type')
                      for _ in range(12):
                          pn=node(p)
                          if not pn or 'forallE' not in pn:break
                          q=pn['forallE']
                          telescope.append({'domain_id':q['type'],
                                            'domain_shape':node(q['type']),
                                            'binder_info':q.get('binderInfo')})
                          p=q['body']
                  args=[x['shape']['app']['arg'] for x in function_chain
                        if x['shape'] and 'app' in x['shape']][::-1]+[a]
                  print('NUCLEUS_ETA_SOURCE_BODY='+json.dumps({
                      'case':case,'body_fn':h,'body_arg':a,
                      'body_arg_node':node(a),'function_chain':function_chain,
                      'head_name_id':cname,'head_name':names.get(cname),
                      'head_decl_kind':decl[0] if decl else None,
                      'head_type':decl[1].get('type') if decl else None,
                      'source_telescope':telescope,
                      'actual_arg_ids':args,'actual_arg_shapes':[node(z) for z in args]
                  },separators=(',',':'))[:19000],flush=True)
          pathlib.Path('research/nucleus-evidence/captured-eta-source.json').write_text(json.dumps({
              'run_sha':os.environ['GITHUB_SHA'],'artifact':os.environ['ARENA_ARTIFACT'],'cases':results
          },indent=2))
          assert len(results)==4
          PY
      - name: Audit exact syntax ancestry and enclosing checked binder candidates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,json,pathlib
          cases=[
            ('init-prelude',7091,1899),
            ('perf/grind-ring-5',6845,2068),
            ('perf/magma-list-pair-n7',5676,552),
            ('perf/magma-list-pair-n21',5673,548),
          ]
          report=[]
          for case,fun,minor in cases:
              b=(pathlib.Path('/tmp/tests/good')/(case+'.ndjson')).read_bytes()
              expr={};decl=[];names={0:''}
              for line in b.splitlines():
                  row=json.loads(line)
                  if 'ie' in row:expr[row['ie']]=row
                  if 'in' in row:
                      y=row.get('str',row.get('num'))
                      names[row['in']]=names.get(y['pre'],'')+(
                          '.' if names.get(y['pre'],'') else '')+str(y.get('str',y.get('i')))
                  for k in ('def','thm','axiom'):
                      if k in row:
                          d=row[k];decl.append((k,names.get(d['name'],str(d['name'])),d))
              parents=collections.defaultdict(list)
              for p,node in expr.items():
                  for k in ('lam','forallE','letE','app','proj'):
                      z=node.get(k)
                      if not isinstance(z,dict):continue
                      for field in ('type','body','fn','arg','value','struct','structure'):
                          child=z.get(field)
                          if isinstance(child,int) and child in expr:
                              parents[child].append((p,k,field))
              def ancestors(start):
                  found={start:0};paths={start:[]};q=collections.deque([start])
                  while q:
                      c=q.popleft()
                      if found[c]>=75:continue
                      for p,k,field in parents[c]:
                          if p in found:continue
                          found[p]=found[c]+1
                          paths[p]=paths[c]+[(p,k,field)]
                          q.append(p)
                  return found,paths
              df,pf=ancestors(fun);dm,pm=ancestors(minor)
              def owners(ds):
                  out=[]
                  for kind,name,d in decl:
                      for f in ('type','value'):
                          root=d.get(f)
                          if root in ds:
                              out.append(dict(kind=kind,name=name,field=f,expr=root,steps=ds[root]))
                  return sorted(out,key=lambda x:x['steps'])[:7]
              def nearest_binders(dist,paths):
                  relevant=[]
                  for pa,d in dist.items():
                      if pa not in expr:continue
                      node=expr[pa]
                      path=paths[pa]
                      if not path:continue
                      k=path[-1][1];edge=path[-1][2]
                      if k in ('lam','forallE') and edge=='body':
                          q=node[k]
                          relevant.append(dict(expr=pa,distance=d,kind=k,domain=q['type'],
                                               domain_shape=expr.get(q['type'],{}),
                                               binder_name=names.get(q.get('name'),'')))
                  return sorted(relevant,key=lambda x:x['distance'])[:12]
              common=sorted(
                  set(df).intersection(dm),
                  key=lambda x:(df[x]+dm[x],df[x],dm[x])
              )[:6]
              rec=dict(case=case,fun=fun,minor=minor,source_owners=owners(df),
                       minor_owners=owners(dm),source_enclosing_binders=nearest_binders(df,pf),
                       minor_enclosing_binders=nearest_binders(dm,pm),
                       common_syntax_ancestors=[
                           dict(expr=x,dist_fun=df[x],dist_minor=dm[x],
                                shape=expr.get(x,{})) for x in common
                       ])
              print('NUCLEUS_BINDER_ANCESTRY='+json.dumps(rec,separators=(',',':'))[:12000],flush=True)
              report.append(rec)
          dest=pathlib.Path('research/nucleus-evidence/captured-eta-ancestry.json')
          dest.write_text(json.dumps(report,indent=2))
          assert len(report)==4
          PY
      - name: Ground exact projection IDs in pinned expression and name records
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          fixtures=[
            ('init-prelude',[1014,1013,5,1899],[5,142,143,668,26,656,857,952]),
            ('perf/grind-ring-5',[532,531,2,2068],[24,63,98,99,502,160,490,901]),
            ('perf/magma-list-pair-n7',[744,743,1,552],[65,75,147,160,177,180,1010]),
            ('perf/magma-list-pair-n21',[740,739,1,548],[65,75,147,160,177,180,1010]),
            ('perf/magma-list-deep-n21',[662,661,1],[29,46,63,65,74,92,138,139,145,287,296,297,378]),
            ('perf/magma-list-deep-n36',[661,660,1],[29,46,63,65,74,92,138,139,145,287,296,297,378]),
          ]
          for case,eids,nids in fixtures:
              expr={};names={0:''};decls=[]
              for line in (pathlib.Path('/tmp/tests/good')/(case+'.ndjson')).read_bytes().splitlines():
                  z=json.loads(line)
                  if 'in' in z:
                      x=z.get('str',z.get('num'))
                      names[z['in']]=names.get(x['pre'],'')+('.' if names.get(x['pre']) else '')+str(x.get('str',x.get('i')))
                  if 'ie' in z:expr[z['ie']]=z
                  for tag in ('def','thm','axiom','ind'):
                      if tag in z: decls.append((tag,z[tag]))
              def shallow(e):
                  if e not in expr:return None
                  obj=expr[e]
                  if 'app' in obj:
                      fun=obj['app']['fn'];arg=obj['app']['arg']
                      return {'node':obj,'fun':expr.get(fun),'arg':expr.get(arg)}
                  return obj
              print('NUCLEUS_SOURCE_PROJECTION='+json.dumps({
                  'case':case,'names':{str(i):names.get(i) for i in nids},
                  'exprs':{str(i):shallow(i) for i in eids},
                  'decls':[(tag,names.get(d.get('name'),'')) for tag,d in decls
                           if d.get('name') in nids],
              },separators=(',',':'))[:14500],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-captured-eta-source-${{ github.sha }}
          path: research/nucleus-evidence/captured-eta-source.json
          if-no-files-found: error
