name: Nucleus conditional Decidable certificate boundary V0
on:
  push:
    branches: [research/nucleus-certified-decide-boundary-20261109]
    paths:
      - '.github/workflows/nucleus-certified-decide-boundary.yml'
      - 'experiments/nucleus-certified-decide-20261109/**'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  proof-and-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Formal Lean build at pinned exporter-era toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/nucleus-certified-decide-20261109
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
      - name: Independent Lean source and explicit axiom inspection
        working-directory: experiments/nucleus-certified-decide-20261109
        run: |
          set -euo pipefail
          lake build NucleusDecide
          lake env lean NucleusDecide.lean 2>&1 | tee axioms.log
          if grep -E 'sorryAx|unapproved axiom' axioms.log; then
            echo 'INVALID_AXIOM_BOUNDARY'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path("axioms.log").read_text().splitlines()
          required=[
            "isTrue_evaluates_true","isFalse_evaluates_false",
            "checked_decide_true_implies_proof",
            "checked_decide_false_implies_refutation",
            "finite_domain_isTrue","raw_true_cannot_certify_arbitrary_prop",
          ]
          for name in required:
              a="'NucleusDecide."+name+"' does not depend on any axioms"
              if not any(a in line for line in lines):raise AssertionError("core axiom drift: "+name)
          relevant=[line for line in lines if "'NucleusDecide.fin_certificate_sound' depends on axioms:" in line]
          if len(relevant)!=1 or not re.search(r"depends on axioms: \[propext\]",relevant[0]):
              raise AssertionError("fin certificate axiom drift: "+repr(relevant))
          print("CORE_SIX_AXIOM_FREE_AND_FIN_PROPEXT_ONLY")
          PY
          lake env lean NatSourceAdapter.lean 2>&1 | tee adapter-axioms.log
          if grep -E 'sorryAx|unapproved axiom' adapter-axioms.log; then
            echo 'UNAPPROVED_ADAPTER_AXIOM'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path("adapter-axioms.log").read_text()
          lines=[line for line in text.splitlines() if "depends on axioms:" in line]
          assert len(lines)==4,lines
          for line in lines:
              m=re.search(r"depends on axioms: \[([^\]]+)\]",line)
              if not m:raise AssertionError(line)
              axioms={x.strip() for x in m.group(1).split(",")}
              if not axioms <= {"propext","Quot.sound"}:
                  raise AssertionError("unapproved axiom "+repr(axioms))
          print("NATSOURCE_AXIOM_WHITELISTED="+repr(sorted({"propext","Quot.sound"})))
          PY
          sha256sum NucleusDecide.lean NatSourceAdapter.lean ForgedIsFalse.lean ForgedFinite.lean lakefile.lean lean-toolchain
      - name: Forged isFalse constructor must be rejected
        working-directory: experiments/nucleus-certified-decide-20261109
        run: |
          set -euo pipefail
          if lake env lean ForgedIsFalse.lean > forged.log 2>&1; then
            cat forged.log
            echo 'UNSOUND_FORGERY_ACCEPTED'
            exit 1
          fi
          grep -q 'error:' forged.log
          cat forged.log
          echo 'FORGED_NEGATIVE_REJECTED'
      - name: Forged finite-domain certificate must be rejected
        working-directory: experiments/nucleus-certified-decide-20261109
        run: |
          set -euo pipefail
          if lake env lean ForgedFinite.lean > forged-finite.log 2>&1; then
            cat forged-finite.log
            echo 'UNSOUND_FINITE_CERTIFICATE_ACCEPTED'
            exit 1
          fi
          grep -q 'error:' forged-finite.log
          cat forged-finite.log
          echo 'FORGED_FINITE_REJECTED'
      - name: Frozen C64 evidence and five adversarial mutation controls
        run: |
          set -euo pipefail
          python3 -m unittest -v experiments/nucleus-certified-decide-20261109/audit_c64.py
          python3 - <<'PY'
          import importlib.util,json,pathlib
          p=pathlib.Path('experiments/nucleus-certified-decide-20261109/audit_c64.py')
          spec=importlib.util.spec_from_file_location('audit_c64',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          data=json.loads(m.RECEIPT.read_text())
          print('NUCLEUS_C64_BOUNDARY='+json.dumps(m.classify(data),sort_keys=True))
          PY
          sha256sum experiments/nucleus-logos-support-20261108/c64-source-instance.json
      - name: Preserve technical evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-certified-decide-v0
          retention-days: 60
          path: |
            experiments/nucleus-certified-decide-20261109/axioms.log
            experiments/nucleus-certified-decide-20261109/adapter-axioms.log
            experiments/nucleus-certified-decide-20261109/forged.log
            experiments/nucleus-certified-decide-20261109/forged-finite.log
