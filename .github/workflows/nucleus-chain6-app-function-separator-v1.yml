name: Nucleus chain6 app function separator v1

on:
  push:
    branches: [nucleus-chain6-app-function-separator-v1]
    paths:
      - ".github/workflows/nucleus-chain6-app-function-separator-v1.yml"
      - "metatron-kernel/src/typecheck.rs"
      - "metatron-kernel/src/machine.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  ROUND1_ARTIFACT: "10712869614"

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build diagnostic Nucleus
        run: |
          set -euo pipefail
          ulimit -s 65536
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r1 /tmp/a1
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip > /tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a1
          tar -xzf /tmp/a1/lean-arena-tests.tar.gz -C /tmp/r1

      - name: Trace exact application function obstruction
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/chain6-app-function-separator-v1
          python3 - <<'PY'
          import json,pathlib,subprocess,time,os,re

          def prefix(path,target):
              names={0:""}; rows=[]
              for line in pathlib.Path(path).read_text().splitlines():
                  r=json.loads(line); rows.append(line)
                  if "in" in r:
                      v=r.get("str",r.get("num"))
                      if isinstance(v,dict):
                          pre=v.get("pre",0); atom=v.get("str",v.get("i",v.get("num","?")))
                          names[r["in"]]=names.get(pre,f"#{pre}")+("." if pre else "")+str(atom)
                  ds=[]
                  if "inductive" in r:
                      for k in ("types","ctors","recs"): ds.extend(r["inductive"].get(k,[]))
                  for k in ("def","thm","axiom","opaque","quot"):
                      if k in r and isinstance(r[k],dict): ds.append(r[k])
                  if any(names.get(d.get("name"))==target for d in ds if isinstance(d,dict)):
                      return ("\n".join(rows)+"\n").encode()
              raise RuntimeError(target)

          data=prefix("/tmp/r1/good/perf/fueled-chain.ndjson","chain6_datF")
          env=os.environ|{
              "NUCLEUS_EXPOSURE_SUPPORT_CACHE":"1",
              "NUCLEUS_TRACE_APP_FUNCTION_SEPARATOR":"1",
              "NUCLEUS_TRACE_DOWNSTREAM":"1",
          }
          t=time.monotonic()
          q=subprocess.run(["/tmp/nucleus"],input=data,stdout=subprocess.DEVNULL,
                           stderr=subprocess.PIPE,timeout=30,env=env)
          err=q.stderr.decode(errors="replace")
          markers=[x for x in err.splitlines() if x.startswith("NUCLEUS_APP_FUNCTION_SEPARATOR:")]
          downstream=[x for x in err.splitlines() if x.startswith("NUCLEUS_DOWNSTREAM:")]
          cache=[x for x in err.splitlines() if x.startswith("NUCLEUS_EXPOSURE_CACHE:")]
          parsed=[]
          for line in markers:
              parsed.append({
                  "line":line,
                  "full_pi":"full=Proven { value: Pi {" in line,
                  "reducible_pi":"reducible=Proven { value: Pi {" in line,
                  "full_unknown":"full=Unknown" in line,
                  "reducible_unknown":"reducible=Unknown" in line,
              })
          result={
              "candidate_sha":os.environ["GITHUB_SHA"],
              "exit":q.returncode,
              "seconds":time.monotonic()-t,
              "marker_count":len(markers),
              "markers":parsed[-20:],
              "downstream_tail":downstream[-20:],
              "cache_tail":cache[-20:],
          }
          out=pathlib.Path("metatron-kernel/evidence-out/chain6-app-function-separator-v1/result.json")
          out.write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result),flush=True)
          assert q.returncode==2,result
          assert markers,result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-chain6-app-function-separator-${{ github.sha }}
          path: metatron-kernel/evidence-out/chain6-app-function-separator-v1
          if-no-files-found: warn
