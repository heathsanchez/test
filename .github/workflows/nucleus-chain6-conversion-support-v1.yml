name: Nucleus chain6 conversion support quotient v1

on:
  push:
    branches: [nucleus-chain6-app-function-separator-v1]
    paths:
      - ".github/workflows/nucleus-chain6-conversion-support-v1.yml"
      - "metatron-kernel/src/convert.rs"
      - "metatron-kernel/src/machine.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  ROUND1_ARTIFACT: "10712869614"
  CURRENT_TEST_ARTIFACT: "11090525747"

jobs:
  causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Patch diagnostic cap and build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("metatron-kernel/src/checker.rs")
          s=p.read_text()
          old="judgment_steps: 65_536,"
          assert s.count(old)==1
          p.write_text(s.replace(old,"judgment_steps: 66_560,",1))
          PY
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus

      - name: Fetch pinned corpora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip > /tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a1
          tar -xzf /tmp/a1/lean-arena-tests.tar.gz -C /tmp/r1
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/a2
          tar -xzf "$(find /tmp/a2 -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current

      - name: Causal conversion quotient gate
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json,pathlib,subprocess,time,os,hashlib

          def prefix(path,target):
              names={0:""}; rows=[]
              for line in pathlib.Path(path).read_text().splitlines():
                  r=json.loads(line); rows.append(line)
                  if "in" in r:
                      v=r.get("str",r.get("num"))
                      if isinstance(v,dict):
                          pre=v.get("pre",0); atom=v.get("str",v.get("i",v.get("num","?")))
                          names[r["in"]]=names.get(pre,f"#{pre}")+("." if pre else "")+str(atom)
                  ds=[]
                  if "inductive" in r:
                      for k in ("types","ctors","recs"): ds.extend(r["inductive"].get(k,[]))
                  for k in ("def","thm","axiom","opaque","quot"):
                      if k in r and isinstance(r[k],dict): ds.append(r[k])
                  if any(names.get(d.get("name"))==target for d in ds if isinstance(d,dict)):
                      return ("\n".join(rows)+"\n").encode()
              raise RuntimeError(target)

          chain6=prefix("/tmp/r1/good/perf/fueled-chain.ndjson","chain6_datF")
          funext=prefix("/tmp/current/good/perf/fueled-chain.ndjson","funext")
          base_env=os.environ|{
              "NUCLEUS_EXPOSURE_SUPPORT_CACHE":"1",
              "NUCLEUS_CONVERSION_EXPOSURE_FLOOR":"128",
              "NUCLEUS_UNIVERSE_EQUALITY_FLOOR":"128",
              "NUCLEUS_CONVERSION_BUDGET_FLOOR":"512",
              "NUCLEUS_PROJECTION_CONGRUENCE_BUDGET_FLOOR":"48",
              "NUCLEUS_TRACE_APP_FUNCTION_SEPARATOR":"1",
              "NUCLEUS_TRACE_DOWNSTREAM":"1",
          }

          def run(data=None,path=None,timeout=30,support=False):
              env=base_env.copy()
              if support:
                  env["NUCLEUS_CONVERSION_SUPPORT_EQUIV"]="1"
              t=time.monotonic()
              try:
                  if data is not None:
                      q=subprocess.run(["/tmp/nucleus"],input=data,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=timeout,env=env)
                  else:
                      with pathlib.Path(path).open("rb") as f:
                          q=subprocess.run(["/tmp/nucleus"],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=timeout,env=env)
                  rc=q.returncode; err=q.stderr.decode(errors="replace")
              except subprocess.TimeoutExpired as e:
                  rc=124
                  err=e.stderr.decode(errors="replace") if isinstance(e.stderr,(bytes,bytearray)) else (e.stderr or "")
              return {
                  "exit":rc,
                  "seconds":time.monotonic()-t,
                  "app_tail":[x for x in err.splitlines() if x.startswith("NUCLEUS_APP_FUNCTION_SEPARATOR:")][-10:],
                  "downstream_tail":[x for x in err.splitlines() if x.startswith("NUCLEUS_DOWNSTREAM:")][-10:],
              }

          result={
              "sha":os.environ["GITHUB_SHA"],
              "chain6_sha256":hashlib.sha256(chain6).hexdigest(),
              "off_chain6":run(data=chain6,timeout=25,support=False),
              "on_chain6":run(data=chain6,timeout=35,support=True),
              "on_funext":run(data=funext,timeout=15,support=True),
              "on_k_rec_conv":run(path="/tmp/current/bad/bugs/k-rec-conv.ndjson",timeout=8,support=True),
              "on_fun_eta_bad":run(path="/tmp/current/bad/tutorial/116_funEtaBad.ndjson",timeout=8,support=True),
              "on_proj_stuck":run(path="/tmp/current/bad/bugs/proj-of-stuck-prop.ndjson",timeout=8,support=True),
              "on_proj_subst":run(path="/tmp/current/bad/bugs/proj-of-subst-prop.ndjson",timeout=8,support=True),
          }
          pathlib.Path("out/result.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result),flush=True)
          assert result["off_chain6"]["exit"]==2,result
          assert result["on_funext"]["exit"]==0,result
          assert result["on_k_rec_conv"]["exit"]==1,result
          assert result["on_fun_eta_bad"]["exit"]==1,result
          assert result["on_proj_stuck"]["exit"]!=0,result
          assert result["on_proj_subst"]["exit"]!=0,result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-chain6-conversion-support-${{ github.sha }}
          path: out/result.json
          if-no-files-found: error
