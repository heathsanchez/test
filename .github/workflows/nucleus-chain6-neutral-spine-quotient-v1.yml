name: Nucleus chain6 neutral spine quotient v1

on:
  push:
    branches: [nucleus-chain6-neutral-spine-quotient-v1]
    paths:
      - ".github/workflows/nucleus-chain6-neutral-spine-quotient-v1.yml"
      - "metatron-kernel/src/convert.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  ROUND1_ARTIFACT: "10712869614"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          set -euo pipefail
          ulimit -s 65536
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r1 /tmp/a
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip >/tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a
          tar -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/r1

      - name: Test neutral-spine quotient at first blocker
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/chain6-neutral-spine-quotient-v1
          python3 - <<'PY'
          import json,pathlib,subprocess,os,time

          def prefix(path,target):
              names={0:""}; rows=[]
              for line in pathlib.Path(path).read_text().splitlines():
                  r=json.loads(line); rows.append(line)
                  if "in" in r:
                      v=r.get("str",r.get("num"))
                      if isinstance(v,dict):
                          pre=v.get("pre",0); atom=v.get("str",v.get("i",v.get("num","?")))
                          names[r["in"]]=names.get(pre,f"#{pre}")+("." if pre else "")+str(atom)
                  ds=[]
                  if "inductive" in r:
                      for k in ("types","ctors","recs"): ds.extend(r["inductive"].get(k,[]))
                  for k in ("def","thm","axiom","opaque","quot"):
                      if k in r and isinstance(r[k],dict): ds.append(r[k])
                  if any(names.get(d.get("name"))==target for d in ds if isinstance(d,dict)):
                      return ("\n".join(rows)+"\n").encode()
              raise RuntimeError(target)

          data=prefix("/tmp/r1/good/perf/fueled-chain.ndjson","chain6_datF")
          env=os.environ|{
              "NUCLEUS_ZERO_BUDGET_OBSERVABLE_BYPASS":"1",
              "NUCLEUS_TRACE_ZERO_BUDGET_BLOCKER":"1",
              "NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE":"1",
              "NUCLEUS_TRACE_DOWNSTREAM":"1",
          }
          t=time.monotonic()
          q=subprocess.run(["/tmp/nucleus"],input=data,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=30,env=env)
          lines=q.stderr.decode(errors="replace").splitlines()
          target="NUCLEUS_APPLICATION_FUNCTION_TYPE:application=ExprId(5138)"
          app_idx=next((i for i,x in enumerate(lines) if x.startswith(target)),None)
          quotient=[(i,x) for i,x in enumerate(lines) if x.startswith("NUCLEUS_ZERO_BUDGET_NEUTRAL_QUOTIENT:")]
          before=[(i,x) for i,x in quotient if app_idx is not None and i<app_idx]
          result={
              "sha":os.environ["GITHUB_SHA"],"exit":q.returncode,"seconds":time.monotonic()-t,
              "application_index":app_idx,
              "last_neutral_quotient_before_application":before[-1][1] if before else None,
              "previous_neutral_quotients":[x for _,x in before[-10:]],
              "application":lines[app_idx] if app_idx is not None else None,
              "downstream":[x for x in lines if x.startswith("NUCLEUS_DOWNSTREAM:")][-10:],
          }
          print(json.dumps(result),flush=True)
          pathlib.Path("metatron-kernel/evidence-out/chain6-neutral-spine-quotient-v1/result.json").write_text(json.dumps(result,indent=2)+"\n")
          assert q.returncode==2,result
          assert before,result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-chain6-neutral-spine-quotient-${{ github.sha }}
          path: metatron-kernel/evidence-out/chain6-neutral-spine-quotient-v1
          if-no-files-found: error
