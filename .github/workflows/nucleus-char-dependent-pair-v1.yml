name: Nucleus checked Char dependent-pair separator
on:
  push:
    branches: [nucleus-char-dependent-pair-v1]
    paths:
      - "metatron-kernel/**"
      - ".github/workflows/nucleus-char-dependent-pair-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: 34b0e4aadd2684a7868debed1ff06902e703053a
      SOURCE_SUBTREE: 5e1b7ad45c02b2afba9d068130e93061eecc6b68
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bind source and run release tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel)" = "$SOURCE_SUBTREE"
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Retrieve pinned Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/tests.zip
          unzip -q /tmp/tests.zip -d /tmp/a
          tar -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Check complete frozen196 and locate Char frontier
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/char-dependent-pair-v1
          python3 - <<'PY'
          import os, pathlib, subprocess, json
          root=pathlib.Path("/tmp/tests")
          rows=[]
          for folder,expected in [("good",0),("bad",1)]:
            for p in sorted((root/folder).rglob("*.ndjson")):
              with p.open("rb") as src:
                q=subprocess.run(
                  ["metatron-kernel/target/release/metatron-kernel"],
                  stdin=src,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                  timeout=30,env=os.environ|{"NUCLEUS_TRACE_DOWNSTREAM":"1","NUCLEUS_TRACE_GENERIC_NONREC":"1"})
              rows.append({"name":p.relative_to(root).as_posix(),
                "expected":expected,"actual":q.returncode,
                "downstream":[x for x in q.stderr.decode(errors="replace").splitlines() if "NUCLEUS_DOWNSTREAM:" in x][-3:],
                "char_trace":[x for x in q.stderr.decode(errors="replace").splitlines() if "NUCLEUS_GENERIC_NONREC:" in x][:10]})
          counts={"accept":sum(r["expected"]==0 and r["actual"]==0 for r in rows),
                  "reject":sum(r["expected"]==1 and r["actual"]==1 for r in rows),
                  "unknown":sum(r["actual"]==2 for r in rows)}
          wrong=[r for r in rows if r["actual"] in (0,1) and r["actual"]!=r["expected"]]
          errors=[r for r in rows if r["actual"] not in (0,1,2)]
          char=next(r for r in rows if r["name"]=="good/perf/grind-ring-5.ndjson")
          out={"source":os.environ["SOURCE_COMMIT"],"subtree":os.environ["SOURCE_SUBTREE"],
               "qualification":os.environ["GITHUB_SHA"],"counts":counts,
               "wrong":wrong,"errors":errors,"char":char}
          pathlib.Path("metatron-kernel/evidence-out/char-dependent-pair-v1/report.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,sort_keys=True))
          assert len(rows)==196
          assert not wrong and not errors
          assert counts["reject"]==71 and counts["accept"]>=115
          assert not any("name=Char:stage=inductive" in x for x in char["downstream"]),char
          PY
      - name: Protect Char constructor and recursor metadata against mutations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, hashlib, json, os, pathlib, subprocess
          fixture = pathlib.Path("/tmp/tests/good/perf/grind-ring-5.ndjson")
          digest = hashlib.sha256(fixture.read_bytes()).hexdigest()
          assert digest == "e9c394e0ff311fd10f60dee2433a530f16e82354c32d6588a8775baa06fd221f", digest
          lines = fixture.read_bytes().splitlines(keepends=True)
          found = [(i, json.loads(line)) for i, line in enumerate(lines)
                   if b'"inductive"' in line]
          found = [(i, row) for i, row in found if row.get("inductive", {}).get("types", [{}])[0].get("name") == 282]
          assert len(found) == 1, found
          index, original = found[0]
          assert original["inductive"]["ctors"][0]["name"] == 283
          assert original["inductive"]["recs"][0]["name"] == 285
          assert original["inductive"]["ctors"][0]["numFields"] == 2
          changes = {
            "wrong-constructor-owner": ("ctors", 0, "induct", 285),
            "wrong-constructor-ordinal": ("ctors", 0, "cidx", 1),
            "wrong-constructor-arity": ("ctors", 0, "numFields", 3),
            "wrong-recursor-rule-constructor": ("recs", 0, "rules", None),
            "wrong-recursor-rule-arity": ("recs", 0, "rules", None),
          }
          outputs = []
          for name, (section, position, key, value) in changes.items():
            variant = copy.deepcopy(original)
            block = variant["inductive"]
            if name == "wrong-recursor-rule-constructor":
              block["recs"][0]["rules"][0]["ctor"] = 285
            elif name == "wrong-recursor-rule-arity":
              block["recs"][0]["rules"][0]["nfields"] = 3
            else:
              block[section][position][key] = value
            candidate = lines.copy()
            candidate[index] = (json.dumps(variant, separators=(",", ":")) + "\n").encode()
            trial = subprocess.run(
              ["metatron-kernel/target/release/metatron-kernel"],
              input=b"".join(candidate), stdout=subprocess.DEVNULL,
              stderr=subprocess.PIPE, timeout=30,
              env=os.environ | {"NUCLEUS_TRACE_DOWNSTREAM": "1"},
            )
            row = {
              "mutant": name, "exit": trial.returncode,
              "downstream": [x for x in trial.stderr.decode(errors="replace").splitlines()
                             if "NUCLEUS_DOWNSTREAM:" in x][-2:],
            }
            outputs.append(row)
            assert trial.returncode in (1, 2), row
          target = pathlib.Path("metatron-kernel/evidence-out/char-dependent-pair-v1")
          target.mkdir(parents=True, exist_ok=True)
          record = {
            "fixture_sha256": digest, "char_name_id": 282, "constructor_name_id": 283,
            "recursor_name_id": 285, "source": os.environ["SOURCE_COMMIT"],
            "qualification": os.environ["GITHUB_SHA"], "mutants": outputs
          }
          (target / "char-negative-separator.json").write_text(json.dumps(record, indent=2))
          print(json.dumps(record, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-char-dependent-pair-${{ github.sha }}
          path: metatron-kernel/evidence-out/char-dependent-pair-v1
          if-no-files-found: warn
