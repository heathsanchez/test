name: Nucleus checked Char dependent-pair separator
on:
  push:
    branches: [nucleus-char-dependent-pair-v1]
    paths:
      - "metatron-kernel/**"
      - ".github/workflows/nucleus-char-dependent-pair-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: 34b0e4aadd2684a7868debed1ff06902e703053a
      SOURCE_SUBTREE: 5e1b7ad45c02b2afba9d068130e93061eecc6b68
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bind source and run release tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel)" = "$SOURCE_SUBTREE"
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Retrieve pinned Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/tests.zip
          unzip -q /tmp/tests.zip -d /tmp/a
          tar -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Check complete frozen196 and locate Char frontier
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/char-dependent-pair-v1
          python3 - <<'PY'
          import os, pathlib, subprocess, json
          root=pathlib.Path("/tmp/tests")
          rows=[]
          for folder,expected in [("good",0),("bad",1)]:
            for p in sorted((root/folder).rglob("*.ndjson")):
              with p.open("rb") as src:
                q=subprocess.run(
                  ["metatron-kernel/target/release/metatron-kernel"],
                  stdin=src,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                  timeout=30,env=os.environ|{"NUCLEUS_TRACE_DOWNSTREAM":"1","NUCLEUS_TRACE_GENERIC_NONREC":"1"})
              rows.append({"name":p.relative_to(root).as_posix(),
                "expected":expected,"actual":q.returncode,
                "downstream":[x for x in q.stderr.decode(errors="replace").splitlines() if "NUCLEUS_DOWNSTREAM:" in x][-3:],
                "char_trace":[x for x in q.stderr.decode(errors="replace").splitlines() if "NUCLEUS_GENERIC_NONREC:" in x][:10]})
          counts={"accept":sum(r["expected"]==0 and r["actual"]==0 for r in rows),
                  "reject":sum(r["expected"]==1 and r["actual"]==1 for r in rows),
                  "unknown":sum(r["actual"]==2 for r in rows)}
          wrong=[r for r in rows if r["actual"] in (0,1) and r["actual"]!=r["expected"]]
          errors=[r for r in rows if r["actual"] not in (0,1,2)]
          char=next(r for r in rows if r["name"]=="good/perf/grind-ring-5.ndjson")
          out={"source":os.environ["SOURCE_COMMIT"],"subtree":os.environ["SOURCE_SUBTREE"],
               "qualification":os.environ["GITHUB_SHA"],"counts":counts,
               "wrong":wrong,"errors":errors,"char":char}
          pathlib.Path("metatron-kernel/evidence-out/char-dependent-pair-v1/report.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,sort_keys=True))
          assert len(rows)==196
          assert not wrong and not errors
          assert counts["reject"]==71 and counts["accept"]>=115
          assert not any("name=Char:stage=inductive" in x for x in char["downstream"]),char
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-char-dependent-pair-${{ github.sha }}
          path: metatron-kernel/evidence-out/char-dependent-pair-v1
          if-no-files-found: warn
