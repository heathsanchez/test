name: Nucleus three-parameter proof singleton admission qualification

on:
  push:
    branches: [nucleus-checked-prop3-singleton-v1]
    paths:
      - ".github/workflows/nucleus-checked-prop3-singleton-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      ARENA_ARTIFACT: "11272848230"
      NUCLEUS_EXPERIMENTAL_RELEVANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require red-green typed proof argument relevance and protected data negatives
        run: |
          set -euo pipefail
          set +e
          env -u NUCLEUS_EXPERIMENTAL_RELEVANCE cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml --test checked_relevance_signature distinct_proof_arguments_of_same_checked_proposition_are_convertible -- --nocapture > /tmp/relevance-red.log 2>&1
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            cat /tmp/relevance-red.log
            echo 'ERROR: original conversion unexpectedly proves the new relevance positive'
            exit 1
          fi
          grep -q 'f (fun a : A => a) and f q must be defeq' /tmp/relevance-red.log || {
            cat /tmp/relevance-red.log
            echo 'ERROR: relevance RED failed for another reason'
            exit 1
          }
          echo 'CHECKED_RELEVANCE_RED: absent proof-argument discharge is witnessed'
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml --test checked_relevance_signature -- --nocapture
          echo 'CHECKED_RELEVANCE_GREEN: exact typed Prop proof and two negatives qualified'

      - name: Independent Rust unit tests and diagnostics binary
        run: |
          set -euo pipefail
          printf 'candidate_commit=%s\n' "$GITHUB_SHA"
          printf 'candidate_tree=%s\n' "$(git rev-parse HEAD:metatron-kernel)"
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml --test checked_relevance_signature -- --nocapture
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus

      - name: Obtain exact source-authoritative frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests metatron-kernel/evidence-out/prop3-singleton
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests

      - name: Qualify source-derived three-parameter singleton prefixes and adversarial metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,os,pathlib,subprocess,copy
          root=pathlib.Path('/tmp/arena-tests/good')
          out=pathlib.Path('metatron-kernel/evidence-out/prop3-singleton')
          expected={
              'perf/magma-list-pair-n7':'abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35',
              'perf/magma-list-pair-n21':'b8279fa9189a203c6c11b04702c27c0f99a650b37',
          }
          results=[]
          for name,digest in expected.items():
              data=(root/(name+'.ndjson')).read_bytes()
              assert hashlib.sha256(data).hexdigest()==digest,(name,'corpus drift')
              names={0:''}; lines=[]; block=None; position=None
              for raw in data.splitlines(keepends=True):
                  x=json.loads(raw); lines.append(raw)
                  if 'in' in x:
                      p=x.get('str',x.get('num'))
                      pre=names.get(p['pre'],'')
                      names[x['in']]=pre+('.' if pre else '')+str(p.get('str',p.get('i')))
                  if 'inductive' in x and any(names.get(q['name'])=='NeZero' for q in x['inductive']['types']):
                      block=x; position=len(lines)-1; break
              assert block is not None,(name,'missing source NeZero')
              ind=block['inductive']; t=ind['types'][0]; c=ind['ctors'][0]; rec=ind['recs'][0]
              assert (t['numParams'],t['numIndices'],t['numNested'],len(ind['ctors']),c['numFields'],
                      rec['numParams'],rec['numMinors'],rec['numMotives'],len(rec['rules']))==(3,0,0,1,1,3,1,1,1)
              env=os.environ|{'NUCLEUS_TRACE_DOWNSTREAM':'1','NUCLEUS_TRACE_PROP_SINGLETON':'1',
                              'NUCLEUS_TRACE_GENERIC_NONREC':'1','NUCLEUS_TRACE_PROP_SMALL':'1'}
              def run(payload):
                  p=subprocess.run(['/tmp/nucleus'],input=payload,stdout=subprocess.DEVNULL,
                                   stderr=subprocess.PIPE,timeout=100,env=env)
                  stderr=p.stderr.decode(errors='replace').splitlines()
                  return p.returncode, [l for l in stderr if 'NUCLEUS_DOWNSTREAM:' in l][-2:], [
                      l for l in stderr if any(z in l for z in ('NUCLEUS_PROP_SINGLETON:','NUCLEUS_PROP_SMALL:','NUCLEUS_GENERIC_NONREC:'))
                  ][-10:]
              original=b''.join(lines)
              rc,last,diagnostic=run(original)
              row={'case':name,'sha256':hashlib.sha256(original).hexdigest(),
                   'first_contract_return_code':rc,'last':last,'semantic_gates':diagnostic,'mutants':[]}
              print('NUCLEUS_PROP3_SOURCE_POSITIVE='+json.dumps(row),flush=True)
              for label,mutator in [
                  ('bad_constructor_fields',lambda o:o['inductive']['ctors'][0].__setitem__('numFields',2)),
                  ('bad_constructor_owner',lambda o:o['inductive']['ctors'][0].__setitem__('induct',0)),
                  ('bad_recursor_minor_count',lambda o:o['inductive']['recs'][0].__setitem__('numMinors',2)),
                  ('bad_rule_field_count',lambda o:o['inductive']['recs'][0]['rules'][0].__setitem__('nfields',2)),
                  ('wrong_recursor_rule_constructor',lambda o:o['inductive']['recs'][0]['rules'][0].__setitem__('ctor',0)),
                  ('wrong_recursor_universe_arity',lambda o:o['inductive']['recs'][0].__setitem__('levelParams',[ind['recs'][0]['levelParams'][0]])),
              ]:
                  mutated=copy.deepcopy(block);mutator(mutated)
                  newlines=lines.copy()
                  newlines[position]=(json.dumps(mutated,separators=(',',':'))+'\n').encode()
                  code,term,diag=run(b''.join(newlines))
                  row['mutants'].append({'mutation':label,'rc':code,'terminal':term[-1:]})
                  assert code in (1,2),(name,label,'invalid inductive accepted',code)
              results.append(row)
              print('NUCLEUS_PROP3_SOURCE_MUTANTS='+json.dumps({
                  'case':name,'return_code':rc,'mutants':row['mutants'],
                  'last':last,'semantic_gates':diagnostic
              }),flush=True)
              assert rc in (0,2),('valid source declared REJECT',row)
          (out/'nezero-prefix-and-mutants.json').write_text(json.dumps({
              'source_commit':os.environ['GITHUB_SHA'],'arena':os.environ['ARENA_SHA'],
              'artifact':os.environ['ARENA_ARTIFACT'],'rows':results
          },indent=2))
          assert all(x['first_contract_return_code']==0 for x in results),(
              'SOURCE_DERIVED_PROP_SINGLETON_NOT_ADMITTED_YET',
              [(x['case'],x['first_contract_return_code'],x['last'],x['semantic_gates']) for x in results]
          )
          print('SOURCE_DERIVED_PROP_SINGLETON_ADMISSION_CERTIFIED_BOUNDED')
          PY

      - name: Replay the seven residual exports and pinned soundness negatives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time
          sys.path.insert(0,'.github/scripts')
          from nucleus_succle_separator import extract,false_index
          root=pathlib.Path('/tmp/arena-tests')
          out=pathlib.Path('metatron-kernel/evidence-out/prop3-singleton')
          names=['init-prelude','perf/grind-ring-5','perf/magma-list-pair-n7',
                 'perf/magma-list-pair-n21','perf/magma-list-deep-n21',
                 'perf/magma-list-deep-n36','perf/fueled-chain']
          rows=[]
          for name in names:
              data=(root/'good'/(name+'.ndjson')).read_bytes()
              t=time.monotonic()
              env=os.environ|{'NUCLEUS_TRACE_DOWNSTREAM':'1',
                   'NUCLEUS_TRACE_EXACT_PROJECTION':'1',
                   'NUCLEUS_TRACE_CHECKED_RELEVANCE':'1',
                   'NUCLEUS_TRACE_PROP_SINGLETON':'1'}
              p=subprocess.run(['/tmp/nucleus'],input=data,stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,timeout=150,env=env)
              lines=p.stderr.decode(errors='replace').splitlines()
              row={'case':name,'sha256':hashlib.sha256(data).hexdigest(),
                   'rc':p.returncode,'seconds':round(time.monotonic()-t,3),
                   'last':[s for s in lines if 'NUCLEUS_DOWNSTREAM:' in s][-3:],
                   'certified_projection_typing':len(
                       [s for s in lines if 'NUCLEUS_EXACT_PROJECTION:' in s]),
                   'checked_relevance_certificates':len(
                       [s for s in lines if 'NUCLEUS_CHECKED_RELEVANCE:' in s]),
                   'prop_singleton_gates':[s for s in lines if 'NUCLEUS_PROP_SINGLETON:' in s][-5:],
                   'sample':[s for s in lines if 'NUCLEUS_EXACT_PROJECTION:' in s][:2]}
              print('NUCLEUS_PROJECTED_NEUTRAL_CASE='+json.dumps(row),flush=True)
              rows.append(row)
              assert p.returncode in (0,2),('wrongly rejected good export',name,p.returncode)
          baseline=(root/'good/init-prelude.ndjson').read_bytes()
          negative=false_index(extract(baseline))
          assert hashlib.sha256(negative).hexdigest()=='2a090edfcfa2a16191f17a433617aaf045fc9b11cd0e2a93405b705d8a899688'
          false_rc=subprocess.run(['/tmp/nucleus'],input=negative,
              stdout=subprocess.DEVNULL,timeout=90).returncode
          bad_rc=subprocess.run(['/tmp/nucleus'],
              input=(root/'bad/bugs/nested-unused-param.ndjson').read_bytes(),
              stdout=subprocess.DEVNULL,timeout=90).returncode
          assert false_rc in (1,2),('invalid false index ACCEPT',false_rc)
          assert bad_rc==1,('invalid nested recursor not REJECT',bad_rc)
          (out/'seven.json').write_text(json.dumps({
              'commit':os.environ['GITHUB_SHA'],'arena_sha':os.environ['ARENA_SHA'],
              'cases':rows,'false_index':false_rc,'malformed_nested':bad_rc
          },indent=2))
          print('NUCLEUS_SEVEN_PROP3_SUMMARY='+json.dumps({
             'complete_case_accepts':sum(r['rc']==0 for r in rows),
             'captured_projection_certificates':sum(r['certified_projection_typing'] for r in rows),
             'relevance_certificates':sum(r['checked_relevance_certificates'] for r in rows),
             'false_index':false_rc,'malformed_nested':bad_rc
          }),flush=True)
          PY

      - name: Requalify exact 125 positive and 71 negative exports
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures,json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/arena-tests')
          out=pathlib.Path('metatron-kernel/evidence-out/prop3-singleton')
          positive=sorted((root/'good').rglob('*.ndjson'))
          negative=sorted((root/'bad').rglob('*.ndjson'))
          assert (len(positive),len(negative))==(125,71)
          items=[('good',p) for p in positive]+[('bad',p) for p in negative]
          def check(item):
              label,path=item
              p=subprocess.run(['/tmp/nucleus'],input=path.read_bytes(),
                   stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=150)
              return {'type':label,'file':str(path.relative_to(root)),'rc':p.returncode}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              rows=list(pool.map(check,items))
          assert all(r['rc'] in (0,1,2) for r in rows),'checker process error'
          wrong=[r for r in rows if (r['type']=='good' and r['rc']==1)
                 or (r['type']=='bad' and r['rc']==0)]
          report={'commit':os.environ['GITHUB_SHA'],'artifact':os.environ['ARENA_ARTIFACT'],
                  'arena_sha':os.environ['ARENA_SHA'],
                  'accepted':sum(r['type']=='good' and r['rc']==0 for r in rows),
                  'rejected':sum(r['type']=='bad' and r['rc']==1 for r in rows),
                  'unknown':sum(r['rc']==2 for r in rows),
                  'wrong':wrong,'rows':rows}
          (out/'full196.json').write_text(json.dumps(report,indent=2))
          print('NUCLEUS_FULL196='+json.dumps({k:v for k,v in report.items() if k!='rows'}),flush=True)
          assert not wrong,'INCORRECT_CHECKER_VERDICT'
          assert report['rejected']==71,'REJECT_REGRESSION'
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-prop3-singleton-${{ github.sha }}
          path: metatron-kernel/evidence-out/prop3-singleton
          if-no-files-found: warn

      - name: Strict complete-case promotion boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('metatron-kernel/evidence-out/prop3-singleton/full196.json'))
          assert d['accepted']>=119 and d['unknown']<=6 and d['rejected']==71 and not d['wrong'],\
               ('NO_NEW_COMPLETE_CASE_ACCEPT__CANDIDATE_NOT_PROMOTED',d['accepted'],d['rejected'],d['unknown'])
          print('CANDIDATE_COMPLETE_CASE_GAIN__STILL_REQUIRES_CURRENT_LARGE_AND_MATHLIB_VALIDATION')
          PY
