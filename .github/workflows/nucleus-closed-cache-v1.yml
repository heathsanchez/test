name: Nucleus closed cache v1

on:
  push:
    branches: [nucleus-closed-cache-v1]
    paths:
      - ".github/workflows/nucleus-closed-cache-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  ROUND1_ARTIFACT: "10712869614"
  CURRENT_TEST_ARTIFACT: "11090525747"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build and unit-test
        run: |
          set -euo pipefail
          ulimit -s 65536
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus

      - name: Fetch pinned corpora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip > /tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a1
          tar -xzf /tmp/a1/lean-arena-tests.tar.gz -C /tmp/r1
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/a2
          tar -xzf "$(find /tmp/a2 -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current

      - name: Exact semantic and cost separator
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/closed-cache-v1
          python3 - <<'PY'
          import json,pathlib,subprocess,time,os,hashlib

          def prefix(path,target):
              names={0:""}; rows=[]; found=False
              for line in pathlib.Path(path).read_text().splitlines():
                  rec=json.loads(line); rows.append(line)
                  if "in" in rec:
                      v=rec.get("str",rec.get("num"))
                      names[rec["in"]]=names[v["pre"]]+("." if v["pre"] else "")+str(v.get("str",v.get("i")))
                  decls=[]
                  if "inductive" in rec:
                      for kind in ("types","ctors","recs"): decls.extend(rec["inductive"][kind])
                  for kind in ("def","thm","axiom","opaque"):
                      if kind in rec: decls.append(rec[kind])
                  if any(names.get(d["name"])==target for d in decls):
                      found=True; break
              assert found,target
              return ("\n".join(rows)+"\n").encode()

          current="/tmp/current/good/perf/fueled-chain.ndjson"
          frozen="/tmp/r1/good/perf/fueled-chain.ndjson"
          cases={
            "funext": (prefix(current,"funext"),15),
            "r1_before_chain6": (prefix(frozen,"Fueled.atF_ite"),15),
            "r1_chain6": (prefix(frozen,"chain6_datF"),30),
            "k_rec_conv": (pathlib.Path("/tmp/current/bad/bugs/k-rec-conv.ndjson").read_bytes(),10),
            "fun_eta_bad": (pathlib.Path("/tmp/current/bad/tutorial/116_funEtaBad.ndjson").read_bytes(),10),
          }
          result={}
          for name,(data,timeout) in cases.items():
              t=time.monotonic()
              try:
                  q=subprocess.run(["/tmp/nucleus"],input=data,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=timeout)
                  result[name]={"exit":q.returncode,"seconds":time.monotonic()-t,"stderr":q.stderr.decode(errors="replace")[-3000:],"sha256":hashlib.sha256(data).hexdigest()}
              except subprocess.TimeoutExpired as e:
                  result[name]={"exit":124,"seconds":time.monotonic()-t,"stderr":"TIMEOUT","sha256":hashlib.sha256(data).hexdigest()}
              print(name,json.dumps(result[name]),flush=True)

          out={"schema":"nucleus-closed-cache-v1","candidate_sha":os.environ["GITHUB_SHA"],"result":result}
          pathlib.Path("metatron-kernel/evidence-out/closed-cache-v1/result.json").write_text(json.dumps(out,indent=2)+"\n")

          assert result["funext"]["exit"]==0,result
          assert result["k_rec_conv"]["exit"]==1,result
          assert result["fun_eta_bad"]["exit"]==1,result
          assert result["r1_before_chain6"]["exit"]==0,result
          assert result["r1_chain6"]["exit"]!=124,result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-closed-cache-${{ github.sha }}
          path: metatron-kernel/evidence-out/closed-cache-v1
          if-no-files-found: error
