name: Nucleus Closed Proof Irrelevance Micro v1

on:
  push:
    branches: [nucleus-closed-proof-irrel-micro-v1]
    paths:
      - ".github/workflows/nucleus-closed-proof-irrel-micro-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  micro:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: metatron-kernel
        run: cargo build --release --locked
      - name: Fetch corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Check irrelevance-before-evaluation
        working-directory: metatron-kernel
        run: |
          python - <<'PY'
          import pathlib,subprocess,time
          p=pathlib.Path('/tmp/tests/good/perf/irrelevance-before-evaluation.ndjson')
          b=pathlib.Path('target/release/metatron-kernel').resolve()
          t=time.perf_counter()
          with p.open('rb') as f:
              q=subprocess.run([str(b)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=10)
          print("RC",q.returncode,"SECONDS",time.perf_counter()-t)
          print(q.stderr.decode(errors='replace')[-4000:])
          PY
