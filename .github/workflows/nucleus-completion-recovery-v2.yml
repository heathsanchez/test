name: Nucleus Indexed Prop Mathlib Gate v1

on:
  push:
    branches: [nucleus-completion-recovery-v2]
    paths:
      - ".github/workflows/nucleus-completion-recovery-v2.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARENA_SHA: 4c30c4ac4f14a3a899116beb3ea6131880e79a98
      NUCLEUS_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: cachix/install-nix-action@v31

      - name: Build exact qualified rewritten Nucleus
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          metatron-kernel/target/release/metatron-kernel < metatron-kernel/tests/fixtures/good-list-perm-v434.ndjson
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus

      - name: Reclose immutable current Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-tests /tmp/arena-artifact metatron-kernel/evidence-out/indexed-prop-v1
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/arena-tests.zip
          unzip -q /tmp/arena-tests.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
          ulimit -s unlimited
          python3 - <<'PY'
          import collections,json,os,pathlib,subprocess,time
          rows=[]
          for bucket,expected in [("good",0),("bad",1)]:
              root=pathlib.Path("/tmp/arena-tests")/bucket
              for p in sorted(root.rglob("*.ndjson")):
                  start=time.monotonic()
                  with p.open("rb") as f:
                      q=subprocess.run(["/tmp/nucleus"],stdin=f,capture_output=True,timeout=240)
                  rows.append({"test":str(p.relative_to(root)),"expected":expected,"actual":q.returncode,"seconds":time.monotonic()-start})
          report={"candidate_sha":os.environ["NUCLEUS_SHA"],"arena_sha":"b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42","artifact_id":11272848230,"stack_limit":"unlimited","counts":dict(collections.Counter(str(r["actual"]) for r in rows)),"wrong":[r for r in rows if r["actual"] in (0,1) and r["actual"]!=r["expected"]],"errors":[r for r in rows if r["actual"] not in (0,1,2)],"rows":rows}
          pathlib.Path("metatron-kernel/evidence-out/indexed-prop-v1/arena-reclosure.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({k:v for k,v in report.items() if k!="rows"}))
          assert len(rows)==196 and report["counts"]=={"0":107,"1":59,"2":30}
          assert not report["wrong"] and not report["errors"]
          PY

      - uses: actions/cache@v4
        id: export-cache
        with:
          path: /tmp/arena/_build/tests/mathlib.ndjson
          key: nucleus-mathlib-export-arena4c30c4ac-mathlibd13f23b7-exporter66f1fb4b
      - name: Build exact Arena Mathlib 4.34.1 export
        if: steps.export-cache.outputs.cache-hit != 'true'
        timeout-minutes: 150
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q "$ARENA_SHA"
          cd /tmp/arena
          nix develop -c ./lka.py build-test mathlib
          test -f _build/tests/mathlib.ndjson
          stat -c 'mathlib_bytes=%s' _build/tests/mathlib.ndjson
          wc -l _build/tests/mathlib.ndjson
          sha256sum _build/tests/mathlib.ndjson

      - name: Verify immutable export identity
        run: |
          echo '22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6  /tmp/arena/_build/tests/mathlib.ndjson' | sha256sum -c -
      - name: Replay rewritten Nucleus after Indexed Prop transport
        timeout-minutes: 30
        run: |
          set -euo pipefail
          out=metatron-kernel/evidence-out/indexed-prop-v1
          mkdir -p "$out"
          stat -c '%s' /tmp/arena/_build/tests/mathlib.ndjson > "$out/mathlib-bytes.txt"
          wc -l < /tmp/arena/_build/tests/mathlib.ndjson > "$out/mathlib-lines.txt"
          sha256sum /tmp/arena/_build/tests/mathlib.ndjson > "$out/mathlib-sha256.txt"

          ulimit -s unlimited
          set +e
          NUCLEUS_TRACE_DOWNSTREAM=1 \
          /usr/bin/time -f 'real_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M' \
            -o "$out/time.txt" \
            /tmp/nucleus \
            < /tmp/arena/_build/tests/mathlib.ndjson \
            > "$out/stdout.txt" \
            2> "$out/stderr.txt"
          rc=$?
          set -e

          echo "$rc" > "$out/exit.txt"
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path("metatron-kernel/evidence-out/indexed-prop-v1")
          rc=int((out/"exit.txt").read_text().strip())
          stderr=(out/"stderr.txt").read_text(errors="replace").splitlines()
          downstream=[x for x in stderr if "NUCLEUS_DOWNSTREAM:" in x]
          summary={
            "schema":"nucleus-completion-recovery-v2",
            "candidate_sha":os.environ["NUCLEUS_SHA"],
            "arena_sha":os.environ["ARENA_SHA"],
            "mathlib_ref":"v4.34.1",
            "mathlib_rev":"d13f23b723b8a846827a245b89c10fc7d3f11612",
            "rc":rc,
            "verdict":{0:"ACCEPT",1:"REJECT",2:"UNKNOWN",3:"ERROR"}.get(rc,"ERROR"),
            "downstream_tail":downstream[-30:],
          }
          (out/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,sort_keys=True))
          assert rc in (0,2),summary
          PY
          cat "$out/time.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-indexed-prop-${{ github.sha }}
          path: metatron-kernel/evidence-out/indexed-prop-v1
          if-no-files-found: warn
