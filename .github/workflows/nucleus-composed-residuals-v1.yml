name: Nucleus combined ten residual census
on:
  push:
    branches: [nucleus-native-ble-constructors-v1]
    paths: [".github/workflows/nucleus-composed-residuals-v1.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 7481eef6e3c595cdc505bd41903bdbcf831a2ab2
      SOURCE_SUBTREE: 9ce5f70d709fa4fd35b547dbdebe18ea5edbf34a
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bind and build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel)" = "$SOURCE_SUBTREE"
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Download frozen export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/a.zip
          unzip -q /tmp/a.zip -d /tmp/a
          tar -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Replay exact eleven-witness list
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/composed-census-v1
          python3 - <<'PY'
          import os, pathlib, subprocess, json, hashlib
          tests=[
            ("good","init-prelude"),
            ("good","perf/folded-constant-first"),
            ("good","perf/folded-constant-last"),
            ("good","perf/fueled-chain"),
            ("good","perf/grind-ring-5"),
            ("good","perf/magma-list-deep-n21"),
            ("good","perf/magma-list-deep-n36"),
            ("good","perf/magma-list-pair-n21"),
            ("good","perf/magma-list-pair-n7"),
            ("good","perf/shared-subterm"),
            ("bad","bugs/nested-unused-param"),
          ]
          rows=[]
          for bucket,name in tests:
            p=pathlib.Path("/tmp/tests")/bucket/(name+".ndjson")
            with p.open("rb") as source:
              run=subprocess.run(
                ["metatron-kernel/target/release/metatron-kernel"],
                stdin=source,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=35,
                env=os.environ|{"NUCLEUS_TRACE_DOWNSTREAM":"1","NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE":"1"})
            lines=run.stderr.decode(errors="replace").splitlines()
            row={"test":name,"expected":0 if bucket=="good" else 1,
                 "rc":run.returncode,"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                 "downstream":[x for x in lines if "NUCLEUS_DOWNSTREAM:" in x][-2:],
                 "application":[x[:900] for x in lines if "NUCLEUS_APPLICATION_FUNCTION_TYPE:" in x][:2]}
            rows.append(row)
            assert run.returncode in (0,1,2),row
            assert run.returncode != (1 if bucket=="good" else 0),row
          assert rows[-1]["rc"]==1,rows[-1]
          report={"source":os.environ["SOURCE_COMMIT"],"subtree":os.environ["SOURCE_SUBTREE"],
                  "qualification":os.environ["GITHUB_SHA"],"rows":rows}
          pathlib.Path("metatron-kernel/evidence-out/composed-census-v1/report.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-composed-residuals-${{ github.sha }}
          path: metatron-kernel/evidence-out/composed-census-v1
          if-no-files-found: warn
