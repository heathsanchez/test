name: Nucleus conversion allocation tournament
on:
  push:
    branches: [research/nucleus-reuse-tournaments-20261104]
    paths: ['.github/workflows/nucleus-conversion-allocation-20261104.yml', 'experiments/nucleus-conversion-allocation-20261104/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        phase: [corpus, full]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Reuse hash-pinned inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/current208 /tmp/input
          if [ '${{ matrix.phase }}' = corpus ]; then
            gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/input.zip
            printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/input.zip | sha256sum -c -
            unzip -q /tmp/input.zip -d /tmp/current208
          else
            gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/input.zip
            printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/input.zip | sha256sum -c -
            unzip -q /tmp/input.zip -d /tmp/input
            zstd -d /tmp/input/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
            printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib.ndjson | sha256sum -c -
            rm /tmp/input/mathlib.ndjson.zst
          fi
          rm /tmp/input.zip
      - name: Conversion context controls and paired structural experiment
        run: |
          phase='${{ matrix.phase }}'
          if [ "$phase" = full ]; then phase=fullfirst; fi
          python3 experiments/nucleus-conversion-allocation-20261104/wave.py "$phase" --out /tmp/structural --inputs /tmp/current208
      - uses: actions/upload-artifact@v4
        if: matrix.phase == 'full'
        with:
          name: nucleus-conversion-first-round-${{ github.sha }}
          path: |
            /tmp/structural/*.json
            /tmp/structural/*/*.json
            /tmp/structural/*/*.log
            /tmp/structural/*/round-*
      - name: Repeat paired full-input observations
        if: matrix.phase == 'full'
        run: python3 experiments/nucleus-conversion-allocation-20261104/wave.py fullrest --out /tmp/structural
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-conversion-${{ matrix.phase }}-${{ github.sha }}
          path: |
            /tmp/structural/*.json
            /tmp/structural/*/*.json
            /tmp/structural/*/*.log
            /tmp/structural/*/*.patch
            /tmp/structural/*/nucleus
            /tmp/structural/*/observer
            /tmp/structural/*/round-*
            /tmp/structural/*/cohort-*
          if-no-files-found: error
          compression-level: 1
