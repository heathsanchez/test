name: Nucleus conversion floor tournament v1

on:
  push:
    branches: [nucleus-conversion-floor-tournament-v1]
    paths:
      - ".github/workflows/nucleus-conversion-floor-tournament-v1.yml"
      - "metatron-kernel/src/typecheck.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  ROUND1_ARTIFACT: "10712869614"
  CURRENT_TEST_ARTIFACT: "11090525747"

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build candidate
        run: |
          set -euo pipefail
          ulimit -s 65536
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus

      - name: Fetch pinned corpora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip >/tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a1
          tar -xzf /tmp/a1/lean-arena-tests.tar.gz -C /tmp/r1
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip >/tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/a2
          tar -xzf "$(find /tmp/a2 -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current

      - name: Tournament conversion floors
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/conversion-floor-tournament-v1
          python3 - <<'PY'
          import json,pathlib,subprocess,os,time,hashlib
          def prefix(path,target):
              names={0:""}; rows=[]
              for line in pathlib.Path(path).read_text().splitlines():
                  r=json.loads(line); rows.append(line)
                  if "in" in r:
                      v=r.get("str",r.get("num"))
                      if isinstance(v,dict):
                          pre=v.get("pre",0); atom=v.get("str",v.get("i",v.get("num","?")))
                          names[r["in"]]=names.get(pre,f"#{pre}")+("." if pre else "")+str(atom)
                  ds=[]
                  if "inductive" in r:
                      for k in ("types","ctors","recs"): ds.extend(r["inductive"].get(k,[]))
                  for k in ("def","thm","axiom","opaque","quot"):
                      if k in r and isinstance(r[k],dict): ds.append(r[k])
                  if any(names.get(d.get("name"))==target for d in ds if isinstance(d,dict)):
                      return ("\n".join(rows)+"\n").encode()
              raise RuntimeError(target)

          chain6=prefix("/tmp/r1/good/perf/fueled-chain.ndjson","chain6_datF")
          funext=prefix("/tmp/current/good/perf/fueled-chain.ndjson","funext")
          bad1=pathlib.Path("/tmp/current/bad/bugs/k-rec-conv.ndjson").read_bytes()
          bad2=pathlib.Path("/tmp/current/bad/tutorial/116_funEtaBad.ndjson").read_bytes()

          def run(data,floor,timeout=30):
              env=os.environ|{
                  "NUCLEUS_CONVERSION_FLOOR":str(floor),
                  "NUCLEUS_TRACE_DOWNSTREAM":"1",
              }
              t=time.monotonic()
              q=subprocess.run(["/tmp/nucleus"],input=data,stdout=subprocess.DEVNULL,
                               stderr=subprocess.PIPE,timeout=timeout,env=env)
              return {
                  "exit":q.returncode,
                  "seconds":time.monotonic()-t,
                  "tail":q.stderr.decode(errors="replace").splitlines()[-20:],
              }

          rows=[]
          for floor in [0,4,8,16,32,64]:
              row={
                  "floor":floor,
                  "chain6":run(chain6,floor),
                  "funext":run(funext,floor),
                  "k_rec_conv":run(bad1,floor),
                  "fun_eta_bad":run(bad2,floor),
              }
              rows.append(row)
              print(json.dumps(row),flush=True)

          result={
              "candidate_sha":os.environ["GITHUB_SHA"],
              "chain6_sha256":hashlib.sha256(chain6).hexdigest(),
              "rows":rows,
          }
          out=pathlib.Path("metatron-kernel/evidence-out/conversion-floor-tournament-v1/result.json")
          out.write_text(json.dumps(result,indent=2)+"\n")

          assert rows[0]["chain6"]["exit"]==2,result
          for row in rows:
              assert row["funext"]["exit"]==0,row
              assert row["k_rec_conv"]["exit"]==1,row
              assert row["fun_eta_bad"]["exit"]==1,row
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-conversion-floor-tournament-${{ github.sha }}
          path: metatron-kernel/evidence-out/conversion-floor-tournament-v1
          if-no-files-found: error
