name: Nucleus Crystal 37 Inductive Quotient v1

on:
  push:
    branches: [nucleus-crystal-37-inductive-quotient-v1]
    paths:
      - ".github/workflows/nucleus-crystal-37-inductive-quotient-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build diagnostic authority
        run: |
          set -euo pipefail
          cargo fmt --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Quotient twelve untraced inductive residuals
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-37-inductive-quotient-v1
          python3 - <<'PY'
          import json, pathlib, subprocess, os, collections, re

          targets=[
            ('good','perf/fueled-chain'),
            ('good','perf/grind-ring-5'),
            ('good','tutorial/089_projProp1'),
            ('good','tutorial/091_projProp3'),
            ('good','tutorial/095_projDataIndexRec'),
            ('bad','bugs/large-elim-param'),
            ('bad','bugs/large-elim-prop-bool'),
            ('bad','bugs/proj-of-imax-prop'),
            ('bad','bugs/rec-missing-ih'),
            ('bad','other/proj-of-prop'),
            ('bad','tutorial/111_indexedUnitEta'),
            ('bad','tutorial/113_indexedStructEta'),
          ]
          root=pathlib.Path('/tmp/tests')
          binary=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          rows=[]
          classes=collections.defaultdict(list)

          for d,name in targets:
              p=root/d/(name+'.ndjson')
              assert p.exists(), p
              env=os.environ.copy()
              env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              env['NUCLEUS_TRACE_RESIDUAL']='1'
              env['NUCLEUS_TRACE_INDUCTIVE_QUOTIENT']='1'
              env['NUCLEUS_TRACE_GENERIC_NONREC']='1'
              with p.open('rb') as f:
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=120,env=env)
              err=q.stderr.decode(errors='replace')
              markers=[line for line in err.splitlines() if 'NUCLEUS_INDUCTIVE_QUOTIENT:' in line]
              downstream=[line for line in err.splitlines() if 'NUCLEUS_DOWNSTREAM:' in line]
              generic=[line for line in err.splitlines() if 'NUCLEUS_GENERIC_' in line]
              marker=markers[-1] if markers else None
              if marker:
                  signature=marker.split('NUCLEUS_INDUCTIVE_QUOTIENT:',1)[1]
                  # quotient away the declaration name but retain constructor/recursor contracts
                  signature=re.sub(r'^name=[^:]+:','',signature)
                  signature=re.sub(r'constructors=\[[^]]*\]',lambda m:re.sub(r'^[^:]+:', '', m.group(0)),signature)
                  signature=re.sub(r'recursors=\[[^]]*\]',lambda m:re.sub(r'^[^:]+:', '', m.group(0)),signature)
              else:
                  signature='no-inductive-marker'
              classes[signature].append(name)
              rows.append({
                  'test':name,
                  'expected':0 if d=='good' else 1,
                  'rc':q.returncode,
                  'marker':marker,
                  'signature':signature,
                  'downstream':downstream[-3:],
                  'generic':generic[-20:],
              })

          out={
              'schema':'nucleus-crystal-37-inductive-quotient-v1',
              'source_sha':os.environ['GITHUB_SHA'],
              'rows':rows,
              'classes':dict(classes),
          }
          path=pathlib.Path('metatron-kernel/evidence-out/crystal-37-inductive-quotient-v1/result.json')
          path.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'classes':out['classes'],'rows':rows},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-37-inductive-quotient-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-37-inductive-quotient-v1
          if-no-files-found: error
