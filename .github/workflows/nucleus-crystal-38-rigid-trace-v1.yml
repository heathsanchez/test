name: Nucleus Crystal 38 Rigid Trace v1

on:
  push:
    branches: [nucleus-crystal-38-rigid-trace-v1]
    paths:
      - ".github/workflows/nucleus-crystal-38-rigid-trace-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}
      - name: Build diagnostic
        run: cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Fetch corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip >/tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Trace seven rigid-head residuals
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-38-rigid-trace-v1
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          targets={
            "perf/args-before-unfold","perf/folded-constant-first","perf/folded-constant-last",
            "tutorial/099_ruleK","perf/refute-cheap-first","tutorial/100_ruleKbad",
            "tutorial/105_proofIrrelevanceBad"
          }
          root=pathlib.Path('/tmp/tests')
          binary=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          rows=[]
          for d,expected in [('good',0),('bad',1)]:
            for p in sorted((root/d).rglob('*.ndjson')):
              name=str(p.relative_to(root/d)).removesuffix('.ndjson')
              if name not in targets: continue
              env=os.environ.copy()
              env['NUCLEUS_TRACE_NEUTRAL_HEADS']='1'
              env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              with p.open('rb') as f:
                q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=120,env=env)
              err=q.stderr.decode(errors='replace').splitlines()
              mismatches=[x for x in err if 'NUCLEUS_NEUTRAL_HEAD_MISMATCH:' in x]
              down=[x for x in err if 'NUCLEUS_DOWNSTREAM:' in x]
              rows.append({'test':name,'expected':expected,'rc':q.returncode,'mismatches':mismatches[-8:],'downstream':down[-2:]})
          assert len(rows)==7,len(rows)
          out={'schema':'nucleus-crystal-38-rigid-trace-v1','rows':rows}
          pathlib.Path('metatron-kernel/evidence-out/crystal-38-rigid-trace-v1/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-38-rigid-trace-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-38-rigid-trace-v1
          if-no-files-found: error
