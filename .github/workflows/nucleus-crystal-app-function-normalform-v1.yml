name: Nucleus Crystal App Function Normal Form v1

on:
  push:
    branches: [nucleus-crystal-app-function-normalform-v1]
    paths:
      - ".github/workflows/nucleus-crystal-app-function-normalform-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-crystal-app-function-normalform-v1
  cancel-in-progress: true

env:
  AUTHORITY_SHA: 98f87d9e66fb97987427d68180f51a653d626fdb
  ARENA_ARTIFACT: 10712869614

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build exact 30-case authority
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Requotient exact residual frontier
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-independent-30-trace-v1
          python3 - <<'PY'
          import collections,json,os,pathlib,re,subprocess

          root=pathlib.Path('/tmp/tests')
          binary=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          rows=[]
          counts=collections.Counter()
          by_reason={}

          trace_keys=[
              'NUCLEUS_TRACE_DOWNSTREAM',
              'NUCLEUS_TRACE_RESIDUAL',
              'NUCLEUS_TRACE_GENERIC_NONREC',
              'NUCLEUS_TRACE_PROP_SMALL',
              'NUCLEUS_TRACE_PROP_SINGLETON',
              'NUCLEUS_TRACE_NEUTRAL_HEADS',
              'NUCLEUS_TRACE_SINGLE_FIELD',
              'NUCLEUS_TRACE_CAPABILITY',
              'NUCLEUS_TRACE_APP_FUNCTION_TYPE',
          ]

          for d,e in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  env=os.environ.copy()
                  for key in trace_keys:
                      env[key]='1'
                  with p.open('rb') as f:
                      q=subprocess.run(
                          [str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                          stderr=subprocess.PIPE,timeout=120,env=env
                      )
                  if q.returncode not in (2,3):
                      continue

                  err=q.stderr.decode(errors='replace')
                  lines=err.splitlines()
                  downs=[x for x in lines if 'NUCLEUS_DOWNSTREAM:' in x]
                  residuals=[x for x in lines if 'NUCLEUS_RESIDUAL:' in x]
                  neutral=[x for x in lines if 'NUCLEUS_NEUTRAL_HEAD_MISMATCH:' in x]
                  generic=[x for x in lines if 'NUCLEUS_GENERIC_' in x]
                  prop=[x for x in lines if 'NUCLEUS_PROP_SMALL:' in x or 'NUCLEUS_PROP_SINGLETON:' in x]
                  single=[x for x in lines if 'NUCLEUS_SINGLE_FIELD:' in x]
                  cap=[x for x in lines if 'NUCLEUS_CAPABILITY' in x]
                  app=[x for x in lines if 'NUCLEUS_APP_FUNCTION_' in x]

                  terminal=downs[-1] if downs else (residuals[-1] if residuals else 'untraced')
                  reason='untraced'
                  m=re.search(r'reason=([^:]+)$',terminal)
                  if m:
                      reason=m.group(1)
                  elif 'NUCLEUS_RESIDUAL:' in terminal:
                      reason=terminal.split('NUCLEUS_RESIDUAL:',1)[1]

                  counts[reason]+=1
                  by_reason.setdefault(reason,[]).append(name)
                  rows.append({
                      'test':name,
                      'expected':e,
                      'rc':q.returncode,
                      'reason':reason,
                      'terminal':terminal,
                      'neutral':neutral[-8:],
                      'generic':generic[-8:],
                      'prop':prop[-8:],
                      'single_field':single[-8:],
                      'capability':cap[-8:],
                      'app_function':app[-24:],
                  })

          assert len(rows)==30, len(rows)
          out={
              'schema':'nucleus-crystal-app-function-normalform-v1',
              'authority_sha':os.environ['AUTHORITY_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'residual_count':len(rows),
              'reason_counts':dict(counts),
              'by_reason':by_reason,
              'rows':rows,
          }
          pathlib.Path(
              'metatron-kernel/evidence-out/crystal-independent-30-trace-v1/result.json'
          ).write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'authority_sha':out['authority_sha'],
              'residual_count':out['residual_count'],
              'reason_counts':out['reason_counts'],
              'by_reason':out['by_reason'],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-independent-30-trace-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-independent-30-trace-v1
          if-no-files-found: error

# retrigger after trace-format repair
