name: Nucleus Crystal App Head Trace v1

on:
  push:
    branches: [nucleus-crystal-app-head-trace-v1]
    paths:
      - ".github/workflows/nucleus-crystal-app-head-trace-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 43f051a5be4577f6f317e949dd1ca930f1b801be
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}

      - name: Prove independent runtime boundary
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs

      - name: Build trace and exact base
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Prove verdict identity and classify application heads
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-app-head-trace-v1
          python3 - <<'PY'
          import json, os, pathlib, subprocess, collections

          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          def rr(binary,p,trace=False):
              env=os.environ.copy()
              if trace:
                  env['NUCLEUS_TRACE_APPLICATION_INFER']='1'
                  env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              with p.open('rb') as f:
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=120,env=env)
              return q.returncode,q.stderr.decode(errors='replace')

          rows=[]
          for d,expected in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  a,_=rr(base,p)
                  b,_=rr(cand,p)
                  assert a==b,(name,a,b)
                  rows.append({'test':name,'expected':expected,'rc':b})

          assert len(rows)==193
          assert sum(r['rc'] in (2,3) for r in rows)==40

          targets={
              'perf/magma-list-deep-n21',
              'perf/magma-list-deep-n36',
              'tutorial/082_RBTree.id_spec',
              'tutorial/112_structEta',
              'tutorial/124_accRecReduction',
              'bugs/k-rec-conv',
              'tutorial/101_ruleKAcc',
              'tutorial/125_accRecNoEta',
          }
          traces=[]
          shapes=collections.Counter()
          for d,expected in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  if name not in targets:
                      continue
                  rc,err=rr(cand,p,True)
                  marks=[line for line in err.splitlines() if 'NUCLEUS_APP_INFER:' in line or 'NUCLEUS_DOWNSTREAM:' in line]
                  for m in marks:
                      if 'NUCLEUS_APP_INFER:' in m:
                          shapes[m.split('NUCLEUS_APP_INFER:',1)[1]]+=1
                  traces.append({'test':name,'expected':expected,'rc':rc,'marks':marks[-120:]})

          out={
              'schema':'nucleus-crystal-app-head-trace-v1',
              'base_sha':os.environ['BASE_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'verdict_identity':True,
              'residual_count':sum(r['rc'] in (2,3) for r in rows),
              'shape_counts':dict(shapes),
              'traces':traces,
          }
          p=pathlib.Path('metatron-kernel/evidence-out/crystal-app-head-trace-v1/result.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-app-head-trace-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-app-head-trace-v1
          if-no-files-found: error
