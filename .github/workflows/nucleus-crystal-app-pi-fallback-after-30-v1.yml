name: Nucleus Crystal App Pi Fallback After 30 v1

on:
  push:
    branches: [nucleus-crystal-app-pi-fallback-after-30-v1]
    paths:
      - ".github/workflows/nucleus-crystal-app-pi-fallback-after-30-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-crystal-app-pi-fallback-after-30-v1
  cancel-in-progress: true

env:
  BASE_SHA: 98f87d9e66fb97987427d68180f51a653d626fdb
  ARENA_ARTIFACT: "10712869614"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable

      - name: Build independent candidate and exact 30-case base
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs
          cargo fmt --manifest-path metatron-kernel/Cargo.toml
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          rm -rf /tmp/art /tmp/tests
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Full 193-case causal reclosure
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/app-pi-fallback-after-30-v1
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          def rr(binary,p,trace=False):
              env=os.environ.copy()
              if trace:
                  env.update({
                    'NUCLEUS_TRACE_DOWNSTREAM':'1',
                    'NUCLEUS_TRACE_NEUTRAL_HEADS':'1',
                    'NUCLEUS_TRACE_RESIDUAL':'1',
                  })
              with p.open('rb') as f:
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                                   stderr=subprocess.PIPE if trace else subprocess.DEVNULL,
                                   timeout=180,env=env)
              return q.returncode, q.stderr.decode(errors='replace') if trace else ''

          rows=[]
          for bucket,expected in [('good',0),('bad',1)]:
              for p in sorted((root/bucket).rglob('*.ndjson')):
                  name=str(p.relative_to(root/bucket)).removesuffix('.ndjson')
                  brc,_=rr(base,p); crc,_=rr(cand,p)
                  rows.append({'test':name,'expected':expected,'base':brc,'candidate':crc})

          assert len(rows)==193
          assert sum(r['base']==0 for r in rows)==103
          assert sum(r['base']==1 for r in rows)==60
          assert sum(r['base'] in (2,3) for r in rows)==30

          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          false_accepts=[r for r in rows if r['expected']==1 and r['candidate']==0]
          false_rejects=[r for r in rows if r['expected']==0 and r['candidate']==1]
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]
          changes=[r for r in rows if r['base']!=r['candidate']]

          assert not wrong,wrong
          assert not regressions,regressions
          assert not errors,errors
          assert not false_accepts,false_accepts
          assert not false_rejects,false_rejects

          app_targets={
            'init-prelude','perf/app-lam','perf/magma-list-deep-n21',
            'perf/magma-list-deep-n36','perf/magma-list-pair-n21',
            'perf/magma-list-pair-n7','tutorial/082_RBTree.id_spec',
            'tutorial/112_structEta','tutorial/124_accRecReduction',
            'tutorial/101_ruleKAcc','tutorial/125_accRecNoEta',
          }
          app_earned=[r for r in earned if r['test'] in app_targets]

          traces={}
          for name in sorted(app_targets):
              row=next(r for r in rows if r['test']==name)
              if row['base'] not in (2,3):
                  continue
              bucket='good' if row['expected']==0 else 'bad'
              p=root/bucket/(name+'.ndjson')
              rc,err=rr(cand,p,True)
              traces[name]={'rc':rc,'marks':[x for x in err.splitlines() if 'NUCLEUS_' in x][-80:]}

          out={
            'schema':'nucleus-crystal-app-pi-fallback-after-30-v1',
            'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
            'base_residual':sum(r['base'] in (2,3) for r in rows),
            'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
            'native_accept':sum(r['expected']==0 and r['candidate']==0 for r in rows),
            'native_reject':sum(r['expected']==1 and r['candidate']==1 for r in rows),
            'earned':[r['test'] for r in earned],
            'app_earned':[r['test'] for r in app_earned],
            'changes':changes,'traces':traces,
            'wrong':wrong,'regressions':regressions,'errors':errors,
            'false_accepts':false_accepts,'false_rejects':false_rejects,
          }
          pathlib.Path('metatron-kernel/evidence-out/app-pi-fallback-after-30-v1/result.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps({
            'base_residual':out['base_residual'],
            'candidate_residual':out['candidate_residual'],
            'native_accept':out['native_accept'],
            'native_reject':out['native_reject'],
            'earned':out['earned'],
            'app_earned':out['app_earned'],
            'changes':[(r['test'],r['base'],r['candidate']) for r in changes],
          },sort_keys=True))
          assert app_earned, 'guarded Pi fallback still earns no application terminal consequence'
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-app-pi-fallback-after-30-${{ github.sha }}
          path: metatron-kernel/evidence-out/app-pi-fallback-after-30-v1
          if-no-files-found: warn
