name: Nucleus Crystal Beta Zeta Iota Trace v1

on:
  push:
    branches: [nucleus-crystal-beta-zeta-iota-trace-v1]
    paths:
      - ".github/workflows/nucleus-crystal-beta-zeta-iota-trace-v1.yml"
      - "metatron-kernel/**"
  pull_request:
    branches: [nucleus-crystal-beta-zeta-after-iota-v1]
    paths:
      - ".github/workflows/nucleus-crystal-beta-zeta-iota-trace-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build diagnostic
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Fetch corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Trace beta zeta exposure
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-beta-zeta-iota-trace-v1
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/tests')
          b=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          targets=[
            ('good','perf/args-before-unfold'),
            ('good','perf/folded-constant-first'),
            ('bad','perf/refute-cheap-first'),
          ]
          rows=[]
          for d,n in targets:
              p=root/d/(n+'.ndjson')
              env=os.environ.copy()
              env['NUCLEUS_TRACE_BETA_ZETA_CONSTRUCTOR']='1'
              env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              env['NUCLEUS_TRACE_NEUTRAL_HEADS']='1'
              with p.open('rb') as f:
                  q=subprocess.run([str(b)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=120,env=env)
              marks=[
                  x for x in q.stderr.decode(errors='replace').splitlines()
                  if 'NUCLEUS_BETA_ZETA_CONSTRUCTOR:' in x
                  or 'NUCLEUS_NEUTRAL_HEAD_MISMATCH:' in x
                  or 'NUCLEUS_DOWNSTREAM:' in x
              ]
              rows.append({'test':n,'expected':0 if d=='good' else 1,'rc':q.returncode,'marks':marks[-240:]})
          out={'schema':'nucleus-crystal-beta-zeta-iota-trace-v1','source_sha':os.environ['GITHUB_SHA'],'rows':rows}
          pathlib.Path('metatron-kernel/evidence-out/crystal-beta-zeta-iota-trace-v1/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          for row in rows: print(json.dumps(row,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-beta-zeta-iota-trace-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-beta-zeta-iota-trace-v1
          if-no-files-found: error
