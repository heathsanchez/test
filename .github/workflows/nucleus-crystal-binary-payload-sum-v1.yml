name: Nucleus Crystal Binary Payload Sum v1

on:
  push:
    branches: [nucleus-crystal-binary-payload-sum-v1]
    paths:
      - ".github/workflows/nucleus-crystal-binary-payload-sum-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-crystal-binary-payload-sum-v1
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 74f59b40763e8240914b72c7b4bfaa8d1ef35f1b
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable

      - name: Prove independent runtime boundary
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs

      - name: Build candidate and exact 37-case base
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Causal global qualification
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-binary-payload-sum-v1
          python3 - <<'PY'
          import json,os,pathlib,subprocess

          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          def rr(binary,p,trace=False):
              env=os.environ.copy()
              if trace:
                  for k in [
                      'NUCLEUS_TRACE_DOWNSTREAM',
                      'NUCLEUS_TRACE_RESIDUAL',
                      'NUCLEUS_TRACE_GENERIC_NONREC',
                      'NUCLEUS_TRACE_APPLICATION_INFER',
                      'NUCLEUS_TRACE_NEUTRAL_HEADS',
                  ]:
                      env[k]='1'
              with p.open('rb') as f:
                  q=subprocess.run(
                      [str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,timeout=120,env=env
                  )
              return q.returncode,q.stderr.decode(errors='replace')

          rows=[]
          for d,expected in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  a,_=rr(base,p)
                  b,_=rr(cand,p)
                  rows.append({'test':name,'expected':expected,'base':a,'candidate':b})

          assert len(rows)==193
          assert sum(r['base'] in (2,3) for r in rows)==37
          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          assert not wrong,wrong
          assert not regressions,regressions
          assert not errors,errors
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]
          changes=[r for r in rows if r['base']!=r['candidate']]

          target=root/'good'/'perf/fueled-chain.ndjson'
          base_rc,base_err=rr(base,target,True)
          cand_rc,cand_err=rr(cand,target,True)
          def terminal(err):
              marks=[line for line in err.splitlines() if 'NUCLEUS_' in line]
              downs=[line for line in marks if 'NUCLEUS_DOWNSTREAM:' in line]
              residuals=[line for line in marks if 'NUCLEUS_RESIDUAL:' in line]
              return (downs[-1] if downs else (residuals[-1] if residuals else 'untraced'),marks[-120:])
          base_terminal,base_marks=terminal(base_err)
          cand_terminal,cand_marks=terminal(cand_err)
          progress=(base_terminal!=cand_terminal) or (base_rc!=cand_rc)

          out={
              'schema':'nucleus-crystal-binary-payload-sum-v1',
              'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
              'base_residual':sum(r['base'] in (2,3) for r in rows),
              'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
              'native_accept':sum(r['expected']==0 and r['candidate']==0 for r in rows),
              'native_reject':sum(r['expected']==1 and r['candidate']==1 for r in rows),
              'earned':[r['test'] for r in earned],
              'changes':changes,
              'wrong':wrong,'regressions':regressions,'errors':errors,
              'fueled_chain':{
                  'base_rc':base_rc,'candidate_rc':cand_rc,
                  'base_terminal':base_terminal,'candidate_terminal':cand_terminal,
                  'progress':progress,'base_marks':base_marks,'candidate_marks':cand_marks,
              },
          }
          p=pathlib.Path('metatron-kernel/evidence-out/crystal-binary-payload-sum-v1/result.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'base_residual':out['base_residual'],
              'candidate_residual':out['candidate_residual'],
              'native_accept':out['native_accept'],
              'native_reject':out['native_reject'],
              'earned':out['earned'],
              'changes':[(r['test'],r['base'],r['candidate']) for r in changes],
              'fueled_chain':{
                  'base_rc':base_rc,'candidate_rc':cand_rc,
                  'base_terminal':base_terminal,'candidate_terminal':cand_terminal,
                  'progress':progress,
              },
          },sort_keys=True))
          assert earned or progress, 'No terminal gain and no consequential residual progress.'
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-binary-payload-sum-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-binary-payload-sum-v1
          if-no-files-found: warn
