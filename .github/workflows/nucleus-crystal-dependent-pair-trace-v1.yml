name: Nucleus Crystal Dependent Pair Trace v1

on:
  push:
    branches: [nucleus-crystal-exact-nonrecursive-reuse-v1]
    paths:
      - ".github/workflows/nucleus-crystal-dependent-pair-trace-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build candidate
        run: cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Fetch corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Trace PSigma dependency chain
        run: |
          set -euo pipefail
          target="$(find /tmp/tests/good -type f -path '*/tutorial/086_PSigma.snd.ndjson' | head -1)"
          test -n "$target"
          set +e
          NUCLEUS_TRACE_GENERIC_NONREC=1 NUCLEUS_TRACE_DOWNSTREAM=1 NUCLEUS_TRACE_RESIDUAL=1             metatron-kernel/target/release/metatron-kernel < "$target" >/tmp/out 2>/tmp/err
          rc=$?
          set -e
          echo "psigma_rc=$rc"
          grep -E 'NUCLEUS_GENERIC_|NUCLEUS_DOWNSTREAM:|NUCLEUS_RESIDUAL:' /tmp/err || true
          mkdir -p metatron-kernel/evidence-out/crystal-dependent-pair-trace-v1
          cp /tmp/err metatron-kernel/evidence-out/crystal-dependent-pair-trace-v1/stderr.txt
          printf '{"schema":"nucleus-crystal-dependent-pair-trace-v1","rc":%s}\n' "$rc" > metatron-kernel/evidence-out/crystal-dependent-pair-trace-v1/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-crystal-dependent-pair-trace-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-dependent-pair-trace-v1
