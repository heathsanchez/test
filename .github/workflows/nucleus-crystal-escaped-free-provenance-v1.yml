name: Nucleus Crystal Escaped Free Provenance v1

on:
  push:
    branches: [nucleus-crystal-escaped-free-provenance-v1]
    paths:
      - ".github/workflows/nucleus-crystal-escaped-free-provenance-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  AUTHORITY_SHA: 16d34375af9ff7af41f341077628f5a1b0847292
  ARENA_ARTIFACT: "10712869614"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}

      - name: Verify diagnostic-only ancestry and build
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$AUTHORITY_SHA" HEAD
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs
          cargo fmt --manifest-path metatron-kernel/Cargo.toml
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip >/tmp/tests.zip
          rm -rf /tmp/art /tmp/tests
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Trace escaped free births on Acc separator
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/escaped-free-provenance-v1
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess

          root=pathlib.Path('/tmp/tests')
          binary=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          specs=[
              ('good','tutorial/124_accRecReduction',0),
              ('bad','tutorial/101_ruleKAcc',1),
              ('bad','tutorial/125_accRecNoEta',1),
          ]

          rows=[]
          for bucket,name,expected in specs:
              p=root/bucket/(name+'.ndjson')
              env=os.environ.copy()
              env.update({
                  'NUCLEUS_TRACE_FREE_PROVENANCE':'1',
                  'NUCLEUS_TRACE_NEUTRAL_HEADS':'1',
                  'NUCLEUS_TRACE_DOWNSTREAM':'1',
                  'NUCLEUS_TRACE_RULE_K':'1',
              })
              with p.open('rb') as f:
                  q=subprocess.run(
                      [str(binary)], stdin=f, stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE, timeout=120, env=env
                  )
              text=q.stderr.decode(errors='replace')
              marks=[x for x in text.splitlines() if 'NUCLEUS_' in x]
              births=[x for x in marks if 'NUCLEUS_FREE_BIND:' in x]
              escaped=[x for x in births if re.search(r':free=(7|9):',x)]
              mismatches=[x for x in marks if 'NUCLEUS_NEUTRAL_HEAD_MISMATCH:' in x]
              rows.append({
                  'test':name,
                  'expected':expected,
                  'rc':q.returncode,
                  'free7_9_births':escaped,
                  'last_mismatch':mismatches[-1] if mismatches else None,
                  'marks':marks[-800:],
              })

          assert all(r['rc'] in (2,3) for r in rows), rows
          assert all(r['free7_9_births'] for r in rows), rows

          def summarize_birth(line):
              out={}
              for key in ('kind','free','context_depth','domain_expr','frame'):
                  m=re.search(rf'{key}=([^:]+)',line)
                  if m: out[key]=m.group(1)
              m=re.search(r':domain=(.*):frame=',line)
              if m: out['domain']=m.group(1)
              return out

          summaries=[]
          for r in rows:
              ss=[summarize_birth(x) for x in r['free7_9_births']]
              summaries.append({'test':r['test'],'births':ss})

          out={
              'schema':'nucleus-crystal-escaped-free-provenance-v1',
              'authority_sha':os.environ['AUTHORITY_SHA'],
              'rows':rows,
              'birth_summaries':summaries,
          }
          dest=pathlib.Path('metatron-kernel/evidence-out/escaped-free-provenance-v1/result.json')
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'birth_summaries':summaries},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-escaped-free-provenance-${{ github.sha }}
          path: metatron-kernel/evidence-out/escaped-free-provenance-v1
          if-no-files-found: error
