name: Nucleus Crystal Exact Nonrecursive Reuse v1

on:
  push:
    branches: [nucleus-crystal-exact-nonrecursive-reuse-v1]
    paths:
      - ".github/workflows/nucleus-crystal-exact-nonrecursive-reuse-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-crystal-exact-nonrecursive-reuse-v1
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 3ba1d1100ecfa98784420b224f3a5668ebf1a3db
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}

      - name: Prove independent runtime boundary
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs

      - name: Build candidate and exact base
        run: |
          set -euo pipefail
          # Candidate authority intentionally supersedes old name-seal end-to-end
          # assertions only if the frozen Arena differential earns it. Keep the
          # kernel/library unit suite active here.
          cargo test --release --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Trace fueled-chain separator
        run: |
          set -euo pipefail
          target="$(find /tmp/tests/good -type f -path '*/perf/fueled-chain.ndjson' | head -1)"
          test -n "$target"
          set +e
          NUCLEUS_TRACE_GENERIC_NONREC=1 metatron-kernel/target/release/metatron-kernel < "$target" >/tmp/fueled.out 2>/tmp/fueled.err
          rc=$?
          set -e
          echo "fueled_chain_rc=$rc"
          grep 'NUCLEUS_GENERIC_NONREC:' /tmp/fueled.err || true

      - name: Causal 193-case qualification
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-exact-nonrecursive-reuse-v1
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          def rr(binary,p):
              with p.open('rb') as f:
                  return subprocess.run(
                      [str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,timeout=120
                  ).returncode
          rows=[]
          for d,expected in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  rows.append({'test':name,'expected':expected,'base':rr(base,p),'candidate':rr(cand,p)})
          assert len(rows)==193
          assert sum(r['base'] in (2,3) for r in rows)==38
          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          assert not wrong,wrong
          assert not regressions,regressions
          assert not errors,errors
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]
          changes=[r for r in rows if r['base']!=r['candidate']]
          inductive_targets={
              'perf/fueled-chain','perf/grind-ring-5','tutorial/086_PSigma.snd',
              'tutorial/089_projProp1','tutorial/091_projProp3','tutorial/095_projDataIndexRec',
              'bugs/large-elim-param','bugs/large-elim-prop-bool','bugs/proj-of-imax-prop',
              'bugs/rec-missing-ih','other/proj-of-prop','tutorial/111_indexedUnitEta',
              'tutorial/113_indexedStructEta'
          }
          out={
              'schema':'nucleus-crystal-exact-nonrecursive-reuse-v1',
              'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
              'base_residual':sum(r['base'] in (2,3) for r in rows),
              'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
              'native_accept':sum(r['expected']==0 and r['candidate']==0 for r in rows),
              'native_reject':sum(r['expected']==1 and r['candidate']==1 for r in rows),
              'earned':[r['test'] for r in earned],
              'changes':changes,
              'inductive_targets':[r for r in rows if r['test'] in inductive_targets],
              'wrong':wrong,'regressions':regressions,'errors':errors,
          }
          path=pathlib.Path('metatron-kernel/evidence-out/crystal-exact-nonrecursive-reuse-v1/result.json')
          path.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          assert earned, 'Exact nonrecursive validator earned no current terminal consequence.'
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-exact-nonrecursive-reuse-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-exact-nonrecursive-reuse-v1
          if-no-files-found: warn
