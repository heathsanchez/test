name: Nucleus Crystal Exact Nonrecursive Trace v1

on:
  push:
    branches: [nucleus-crystal-exact-nonrecursive-trace-v1]
    paths:
      - ".github/workflows/nucleus-crystal-exact-nonrecursive-trace-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}

      - name: Build diagnostic
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests

      - name: Trace valid and malformed single-type contracts
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-exact-nonrecursive-trace-v1
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path('/tmp/tests')
          binary=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          targets=[
              ('good','perf/fueled-chain',0),
              ('good','perf/grind-ring-5',0),
              ('good','tutorial/086_PSigma.snd',0),
              ('bad','bugs/rec-missing-ih',1),
              ('bad','other/proj-of-prop',1),
          ]
          rows=[]
          for side,name,expected in targets:
              p=next((root/side).rglob(name+'.ndjson'))
              env=os.environ.copy()
              env['NUCLEUS_TRACE_GENERIC_NONREC']='1'
              env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              with p.open('rb') as f:
                  q=subprocess.run(
                      [str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,timeout=120,env=env
                  )
              stderr=q.stderr.decode(errors='replace')
              marks=[
                  line for line in stderr.splitlines()
                  if 'NUCLEUS_GENERIC_NONREC:' in line or 'NUCLEUS_DOWNSTREAM:' in line
              ]
              rows.append({
                  'test':name,'expected':expected,'rc':q.returncode,'marks':marks
              })
          out={'schema':'nucleus-crystal-exact-nonrecursive-trace-v1','rows':rows}
          p=pathlib.Path('metatron-kernel/evidence-out/crystal-exact-nonrecursive-trace-v1/result.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-exact-nonrecursive-trace-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-exact-nonrecursive-trace-v1
          if-no-files-found: error
