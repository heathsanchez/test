name: Nucleus Crystal General Infer Cache v1

on:
  push:
    branches: [nucleus-crystal-general-infer-cache-v1]
    paths:
      - ".github/workflows/nucleus-crystal-general-infer-cache-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 3ba1d1100ecfa98784420b224f3a5668ebf1a3db
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}

      - name: Prove independent runtime boundary
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs

      - name: Build candidate and exact base
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path metatron-kernel/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path metatron-kernel/Cargo.toml -- -D warnings
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip >/tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Global 193-case reclosure
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-general-infer-cache-v1
          python3 - <<'PY'
          import json,os,pathlib,subprocess,time
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          def rr(b,p):
              t=time.monotonic()
              try:
                  with p.open('rb') as f:
                      q=subprocess.run([str(b)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=120)
                  return q.returncode,time.monotonic()-t
              except subprocess.TimeoutExpired:
                  return 124,time.monotonic()-t

          rows=[]
          for d,e in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  n=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  a,at=rr(base,p); b,bt=rr(cand,p)
                  rows.append({'test':n,'expected':e,'base':a,'candidate':b,'base_s':at,'candidate_s':bt})
          assert len(rows)==193
          assert sum(r['base'] in (2,3) for r in rows)==38

          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          assert not wrong,wrong
          assert not regressions,regressions
          assert not errors,errors
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]
          changes=[r for r in rows if r['base']!=r['candidate']]
          target=next(r for r in rows if r['test']=='perf/app-lam')

          out={
            'schema':'nucleus-crystal-general-infer-cache-v1',
            'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
            'base_residual':38,
            'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
            'native_accept':sum(r['expected']==0 and r['candidate']==0 for r in rows),
            'native_reject':sum(r['expected']==1 and r['candidate']==1 for r in rows),
            'earned':[r['test'] for r in earned],
            'changes':changes,
            'wrong':wrong,'regressions':regressions,'errors':errors,
            'app_lam':target,
          }
          pathlib.Path('metatron-kernel/evidence-out/crystal-general-infer-cache-v1/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          assert any(r['test']=='perf/app-lam' and r['candidate']==0 for r in earned), earned
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-general-infer-cache-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-general-infer-cache-v1
          if-no-files-found: warn
