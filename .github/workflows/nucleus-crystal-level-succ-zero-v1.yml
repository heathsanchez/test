name: Nucleus Crystal Level Succ Zero v1

on:
  push:
    branches: [nucleus-crystal-level-succ-zero-v1]
    paths:
      - ".github/workflows/nucleus-crystal-level-succ-zero-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-crystal-level-succ-zero-v1
  cancel-in-progress: true

env:
  BASE_SHA: d2bdeadceb1bb6d0695f15126fb23b50f732c4ce
  ARENA_ARTIFACT: 10712869614

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build independent candidate and exact 31-case base
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs
          cargo fmt --manifest-path metatron-kernel/Cargo.toml
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen 193-case corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Exact let-ladder separator
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-level-succ-zero-v1
          python3 - <<'PY'
          import json,os,pathlib,subprocess

          root=pathlib.Path('/tmp/tests')
          target=root/'good/perf/let-ladder.ndjson'
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          def rr(binary, trace=False):
              env=os.environ.copy()
              if trace:
                  env['NUCLEUS_TRACE_LEVEL_RESOLVE']='1'
                  env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              with target.open('rb') as f:
                  q=subprocess.run(
                      [str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,timeout=120,env=env
                  )
              return q.returncode,q.stderr.decode(errors='replace')

          brc,berr=rr(base,True)
          crc,cerr=rr(cand,True)
          out={
              'schema':'nucleus-crystal-level-succ-zero-separator-v1',
              'base_sha':os.environ['BASE_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'test':'perf/let-ladder',
              'expected':0,
              'base_rc':brc,
              'candidate_rc':crc,
              'base_trace':[x for x in berr.splitlines() if 'NUCLEUS_' in x][-100:],
              'candidate_trace':[x for x in cerr.splitlines() if 'NUCLEUS_' in x][-100:],
          }
          pathlib.Path(
              'metatron-kernel/evidence-out/crystal-level-succ-zero-v1/separator.json'
          ).write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          assert brc in (2,3), out
          assert crc == 0, out
          PY

      - name: Full 193-case causal reclosure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess

          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          def rr(binary,p):
              with p.open('rb') as f:
                  return subprocess.run(
                      [str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,timeout=120
                  ).returncode

          rows=[]
          for d,e in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  rows.append({
                      'test':name,'expected':e,
                      'base':rr(base,p),'candidate':rr(cand,p)
                  })

          assert len(rows)==193
          assert sum(r['base'] in (2,3) for r in rows)==31

          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          false_accepts=[r for r in rows if r['expected']==1 and r['candidate']==0]
          false_rejects=[r for r in rows if r['expected']==0 and r['candidate']==1]
          changes=[r for r in rows if r['base']!=r['candidate']]
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]

          assert not wrong,wrong
          assert not regressions,regressions
          assert not errors,errors
          assert not false_accepts,false_accepts
          assert not false_rejects,false_rejects
          assert [(r['test'],r['base'],r['candidate']) for r in changes] == [
              ('perf/let-ladder',2,0)
          ], changes

          out={
              'schema':'nucleus-crystal-level-succ-zero-v1',
              'base_sha':os.environ['BASE_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'base_residual':sum(r['base'] in (2,3) for r in rows),
              'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
              'native_accept':sum(r['expected']==0 and r['candidate']==0 for r in rows),
              'native_reject':sum(r['expected']==1 and r['candidate']==1 for r in rows),
              'earned':[r['test'] for r in earned],
              'changes':changes,
              'wrong':wrong,'regressions':regressions,'errors':errors,
              'false_accepts':false_accepts,'false_rejects':false_rejects,
          }
          pathlib.Path(
              'metatron-kernel/evidence-out/crystal-level-succ-zero-v1/result.json'
          ).write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          assert out['candidate_residual']==30,out
          assert out['native_accept']==104,out
          assert out['native_reject']==59,out
          assert out['earned']==['perf/let-ladder'],out
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-level-succ-zero-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-level-succ-zero-v1
          if-no-files-found: error
