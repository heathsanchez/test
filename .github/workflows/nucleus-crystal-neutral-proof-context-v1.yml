name: Nucleus Crystal Neutral Proof Context v1

on:
  push:
    branches: [nucleus-crystal-neutral-proof-context-v1]
    paths:
      - ".github/workflows/nucleus-crystal-neutral-proof-context-v1.yml"
      - "metatron-kernel/src/typecheck.rs"
      - "metatron-kernel/src/convert.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-crystal-neutral-proof-context-v1
  cancel-in-progress: true

env:
  BASE_SHA: 98f87d9e66fb97987427d68180f51a653d626fdb
  ARENA_ARTIFACT: "10712869614"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build candidate and exact base
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path metatron-kernel/Cargo.toml
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Full 193-case causal reclosure
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-neutral-proof-context-v1
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          def rr(binary,p):
              with p.open('rb') as f:
                  q=subprocess.run(
                      [str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,timeout=120
                  )
              return q.returncode

          rows=[]
          for d,e in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  a=rr(base,p); b=rr(cand,p)
                  rows.append({'test':name,'expected':e,'base':a,'candidate':b})

          assert len(rows)==193
          assert sum(r['base'] in (2,3) for r in rows)==30

          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          false_accepts=[r for r in rows if r['expected']==1 and r['candidate']==0]
          false_rejects=[r for r in rows if r['expected']==0 and r['candidate']==1]
          assert not wrong,wrong
          assert not regressions,regressions
          assert not errors,errors
          assert not false_accepts,false_accepts
          assert not false_rejects,false_rejects

          earned=[
              r for r in rows
              if r['base'] in (2,3) and r['candidate']==r['expected']
          ]
          changes=[r for r in rows if r['base']!=r['candidate']]
          by={r['test']:r for r in rows}

          targets=[
              'tutorial/124_accRecReduction',
              'tutorial/101_ruleKAcc',
              'tutorial/125_accRecNoEta',
              'tutorial/107_proofIrrelevanceUnderBinder',
          ]
          out={
              'schema':'nucleus-crystal-neutral-proof-context-v1',
              'base_sha':os.environ['BASE_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'base_residual':sum(r['base'] in (2,3) for r in rows),
              'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
              'native_accept':sum(r['expected']==0 and r['candidate']==0 for r in rows),
              'native_reject':sum(r['expected']==1 and r['candidate']==1 for r in rows),
              'earned':[r['test'] for r in earned],
              'changes':changes,
              'targets':{n:by[n] for n in targets},
              'wrong':wrong,
              'regressions':regressions,
              'errors':errors,
              'false_accepts':false_accepts,
              'false_rejects':false_rejects,
          }
          pathlib.Path(
              'metatron-kernel/evidence-out/crystal-neutral-proof-context-v1/result.json'
          ).write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'base_residual':out['base_residual'],
              'candidate_residual':out['candidate_residual'],
              'native_accept':out['native_accept'],
              'native_reject':out['native_reject'],
              'earned':out['earned'],
              'changes':[(r['test'],r['base'],r['candidate']) for r in changes],
              'targets':out['targets'],
          },sort_keys=True))

          assert earned, 'context-aware neutral proof irrelevance earned no protected consequence'
          assert by['tutorial/124_accRecReduction']['candidate'] == 0, by['tutorial/124_accRecReduction']
          assert by['tutorial/101_ruleKAcc']['candidate'] != 0, by['tutorial/101_ruleKAcc']
          assert by['tutorial/125_accRecNoEta']['candidate'] != 0, by['tutorial/125_accRecNoEta']
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-neutral-proof-context-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-neutral-proof-context-v1
          if-no-files-found: warn
