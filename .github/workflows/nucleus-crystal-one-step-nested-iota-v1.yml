name: Nucleus Crystal One Step Nested Iota v1

on:
  push:
    branches: [nucleus-crystal-one-step-nested-iota-v1]
    paths:
      - ".github/workflows/nucleus-crystal-one-step-nested-iota-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-crystal-one-step-nested-iota-v1
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 161c80fd0c11ae9c1ee49bc01e9ebbcb16dcbbb5
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}

      - name: Prove independent runtime boundary
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs

      - name: Build candidate and exact base
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path metatron-kernel/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path metatron-kernel/Cargo.toml -- -D warnings
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Causal 193-case reclosure
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-one-step-nested-iota-v1
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          def rr(binary,p,trace=False):
              env=os.environ.copy()
              if trace:
                  env['NUCLEUS_TRACE_DOWNSTREAM']='1'
                  env['NUCLEUS_TRACE_RESIDUAL']='1'
                  env['NUCLEUS_TRACE_APPLICATION_INFER']='1'
                  env['NUCLEUS_TRACE_NEUTRAL_HEADS']='1'
              with p.open('rb') as f:
                  q=subprocess.run(
                      [str(binary)], stdin=f, stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE, timeout=120, env=env
                  )
              return q.returncode,q.stderr.decode(errors='replace')

          rows=[]
          for d,expected in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  a,_=rr(base,p)
                  b,_=rr(cand,p)
                  rows.append({'test':name,'expected':expected,'base':a,'candidate':b})

          assert len(rows)==193
          assert sum(r['base'] in (2,3) for r in rows)==37

          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          false_accepts=[r for r in rows if r['expected']==1 and r['candidate']==0]
          false_rejects=[r for r in rows if r['expected']==0 and r['candidate']==1]
          assert not wrong,wrong
          assert not regressions,regressions
          assert not errors,errors
          assert not false_accepts,false_accepts
          assert not false_rejects,false_rejects

          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]
          changes=[r for r in rows if r['base']!=r['candidate']]
          by={r['test']:r for r in rows}

          target_names=[
              'perf/args-before-unfold',
              'perf/folded-constant-first',
              'perf/folded-constant-last',
              'perf/refute-cheap-first',
              'perf/refute-cheap-last',
              'tutorial/082_RBTree.id_spec',
              'perf/magma-list-deep-n21',
              'perf/magma-list-deep-n36',
              'tutorial/112_structEta',
          ]
          traces={}
          for d in ['good','bad']:
              for p in (root/d).rglob('*.ndjson'):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  if name in target_names:
                      rc,err=rr(cand,p,True)
                      traces[name]={
                          'rc':rc,
                          'marks':[line for line in err.splitlines() if 'NUCLEUS_' in line][-120:]
                      }

          out={
              'schema':'nucleus-crystal-one-step-nested-iota-v1',
              'base_sha':os.environ['BASE_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'base_residual':sum(r['base'] in (2,3) for r in rows),
              'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
              'native_accept':sum(r['expected']==0 and r['candidate']==0 for r in rows),
              'native_reject':sum(r['expected']==1 and r['candidate']==1 for r in rows),
              'earned':[r['test'] for r in earned],
              'changes':changes,
              'targets':{t:by.get(t) for t in target_names},
              'traces':traces,
              'wrong':wrong,'regressions':regressions,'errors':errors,
              'false_accepts':false_accepts,'false_rejects':false_rejects,
          }
          path=pathlib.Path('metatron-kernel/evidence-out/crystal-one-step-nested-iota-v1/result.json')
          path.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'base_residual':out['base_residual'],
              'candidate_residual':out['candidate_residual'],
              'native_accept':out['native_accept'],
              'native_reject':out['native_reject'],
              'earned':out['earned'],
              'changes':[(r['test'],r['base'],r['candidate']) for r in changes],
              'targets':out['targets'],
          },sort_keys=True))

          assert earned, 'One-step nested iota earned no protected terminal consequence.'
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-one-step-nested-iota-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-one-step-nested-iota-v1
          if-no-files-found: warn
