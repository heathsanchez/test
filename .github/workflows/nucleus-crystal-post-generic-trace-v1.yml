name: Nucleus Crystal Post Generic Trace v1

on:
  push:
    branches: [nucleus-crystal-exact-nonrecursive-reuse-v1]
    paths:
      - ".github/workflows/nucleus-crystal-post-generic-trace-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build counterfactual kernel
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Requotient all residuals after exact generic interface
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-post-generic-trace-v1
          python3 - <<'PY'
          import json,os,pathlib,subprocess,re,collections
          root=pathlib.Path('/tmp/tests')
          binary=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          rows=[]; counts=collections.Counter(); by_reason={}
          for d,e in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  env=os.environ.copy()
                  env['NUCLEUS_TRACE_DOWNSTREAM']='1'
                  env['NUCLEUS_TRACE_RESIDUAL']='1'
                  env['NUCLEUS_TRACE_GENERIC_NONREC']='1'
                  with p.open('rb') as f:
                      q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=120,env=env)
                  if q.returncode not in (2,3):
                      continue
                  err=q.stderr.decode(errors='replace')
                  downs=[line for line in err.splitlines() if 'NUCLEUS_DOWNSTREAM:' in line]
                  residuals=[line for line in err.splitlines() if 'NUCLEUS_RESIDUAL:' in line]
                  generic=[line for line in err.splitlines() if 'NUCLEUS_GENERIC_NONREC:' in line]
                  terminal=downs[-1] if downs else (residuals[-1] if residuals else 'untraced')
                  reason='untraced'
                  m=re.search(r'reason=([^:]+)$',terminal)
                  if m: reason=m.group(1)
                  elif 'NUCLEUS_RESIDUAL:' in terminal: reason=terminal.split('NUCLEUS_RESIDUAL:',1)[1]
                  counts[reason]+=1
                  by_reason.setdefault(reason,[]).append(name)
                  rows.append({'test':name,'expected':e,'rc':q.returncode,'terminal':terminal,'generic':generic[-2:]})
          assert len(rows)==38,len(rows)
          out={'schema':'nucleus-crystal-post-generic-trace-v1','source_sha':os.environ['GITHUB_SHA'],
               'residual_count':len(rows),'reason_counts':dict(counts),'by_reason':by_reason,'rows':rows}
          pathlib.Path('metatron-kernel/evidence-out/crystal-post-generic-trace-v1/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:out[k] for k in ['residual_count','reason_counts','by_reason']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-crystal-post-generic-trace-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-post-generic-trace-v1
