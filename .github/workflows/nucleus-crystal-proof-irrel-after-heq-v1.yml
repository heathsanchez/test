name: Nucleus Crystal Proof Irrel After HEq v1

on:
  push:
    branches: [nucleus-crystal-proof-irrel-after-heq-v1]
    paths:
      - ".github/workflows/nucleus-crystal-proof-irrel-after-heq-v1.yml"
      - "metatron-kernel/**"
  pull_request:
    branches: [nucleus-structure-natle-reclosure-v1]
    paths:
      - ".github/workflows/nucleus-crystal-proof-irrel-after-heq-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-crystal-proof-irrel-after-heq-v1
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 43f051a5be4577f6f317e949dd1ca930f1b801be
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}

      - name: Prove independent runtime boundary
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs

      - name: Build candidate and exact base
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Global 193-case reclosure
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-proof-irrel-after-heq-v1
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          def rr(binary,p):
              with p.open('rb') as f:
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=120)
              return q.returncode
          rows=[]
          for d,expected in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  rows.append({'test':name,'expected':expected,'base':rr(base,p),'candidate':rr(cand,p)})
          assert len(rows)==193
          assert sum(r['base'] in (2,3) for r in rows)==40
          fa=[r for r in rows if r['expected']==1 and r['candidate']==0]
          fr=[r for r in rows if r['expected']==0 and r['candidate']==1]
          reg=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          assert not fa,fa; assert not fr,fr; assert not reg,reg; assert not wrong,wrong; assert not errors,errors
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]
          changes=[r for r in rows if r['base']!=r['candidate']]
          targets=['tutorial/124_accRecReduction','tutorial/101_ruleKAcc','tutorial/125_accRecNoEta','tutorial/107_proofIrrelevanceUnderBinder']
          by={r['test']:r for r in rows}
          out={
            'schema':'nucleus-crystal-proof-irrel-after-heq-v1',
            'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
            'base_residual':sum(r['base'] in (2,3) for r in rows),
            'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
            'native_accept':sum(r['expected']==0 and r['candidate']==0 for r in rows),
            'native_reject':sum(r['expected']==1 and r['candidate']==1 for r in rows),
            'earned':[r['test'] for r in earned],
            'changes':changes,
            'targets':{t:by.get(t) for t in targets},
            'false_accepts':fa,'false_rejects':fr,'regressions':reg,'wrong':wrong,'errors':errors,
          }
          p=pathlib.Path('metatron-kernel/evidence-out/crystal-proof-irrel-after-heq-v1/result.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          assert earned, 'No terminal gain: reject proof-irrelevance transplant.'
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-proof-irrel-after-heq-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-proof-irrel-after-heq-v1
          if-no-files-found: warn
