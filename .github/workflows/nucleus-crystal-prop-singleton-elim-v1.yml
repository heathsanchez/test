name: Nucleus Crystal Prop Singleton Elim v1

on:
  push:
    branches: [nucleus-crystal-prop-singleton-elim-v1]
    paths:
      - ".github/workflows/nucleus-crystal-prop-singleton-elim-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-crystal-prop-singleton-elim-v1
  cancel-in-progress: true

env:
  BASE_SHA: a12353b7cce96c48d9a0c684c3e9d81031168e1b
  ARENA_ARTIFACT: "10712869614"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable

      - name: Prove independent runtime and build candidate/base
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs
          cargo fmt --manifest-path metatron-kernel/Cargo.toml
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen 193-case corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          rm -rf /tmp/art /tmp/tests
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Three-case separator screen
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/prop-singleton-elim-v1
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          specs=[
              ('good','tutorial/095_projDataIndexRec',0),
              ('bad','bugs/rec-missing-ih',1),
              ('bad','other/proj-of-prop',1),
          ]

          def rr(binary,p,trace=False):
              env=os.environ.copy()
              if trace:
                  env.update({
                      'NUCLEUS_TRACE_PROP_SINGLETON':'1',
                      'NUCLEUS_TRACE_PROP_SMALL':'1',
                      'NUCLEUS_TRACE_DOWNSTREAM':'1',
                      'NUCLEUS_TRACE_CAPABILITY':'1',
                  })
              with p.open('rb') as f:
                  q=subprocess.run(
                      [str(binary)], stdin=f, stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE, timeout=180, env=env
                  )
              return q.returncode,q.stderr.decode(errors='replace')

          rows=[]
          for bucket,name,expected in specs:
              p=root/bucket/(name+'.ndjson')
              brc,_=rr(base,p)
              crc,err=rr(cand,p,True)
              rows.append({
                  'test':name,'expected':expected,'base':brc,'candidate':crc,
                  'trace':[x for x in err.splitlines() if 'NUCLEUS_' in x][-300:],
              })

          by={r['test']:r for r in rows}
          assert by['tutorial/095_projDataIndexRec']['base'] in (2,3), rows
          assert by['tutorial/095_projDataIndexRec']['candidate'] == 0, rows
          assert by['bugs/rec-missing-ih']['candidate'] != 0, rows
          assert by['other/proj-of-prop']['candidate'] != 0, rows

          p=pathlib.Path('metatron-kernel/evidence-out/prop-singleton-elim-v1/screen.json')
          p.write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          print(json.dumps(rows,sort_keys=True))
          PY

      - name: Full 193-case causal reclosure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          def rr(binary,p):
              with p.open('rb') as f:
                  return subprocess.run(
                      [str(binary)], stdin=f, stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL, timeout=180
                  ).returncode

          rows=[]
          for bucket,expected in [('good',0),('bad',1)]:
              for p in sorted((root/bucket).rglob('*.ndjson')):
                  name=str(p.relative_to(root/bucket)).removesuffix('.ndjson')
                  rows.append({
                      'test':name,'expected':expected,
                      'base':rr(base,p),'candidate':rr(cand,p),
                  })

          assert len(rows)==193
          assert sum(r['base']==0 for r in rows)==102
          assert sum(r['base']==1 for r in rows)==58
          assert sum(r['base'] in (2,3) for r in rows)==33

          base_wrong=[r for r in rows if r['base'] in (0,1) and r['base']!=r['expected']]
          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          false_accepts=[r for r in rows if r['expected']==1 and r['candidate']==0]
          false_rejects=[r for r in rows if r['expected']==0 and r['candidate']==1]
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]
          changes=[r for r in rows if r['base']!=r['candidate']]

          assert not base_wrong,base_wrong
          assert not wrong,wrong
          assert not regressions,regressions
          assert not errors,errors
          assert not false_accepts,false_accepts
          assert not false_rejects,false_rejects
          assert any(r['test']=='tutorial/095_projDataIndexRec' for r in earned), earned
          assert earned, 'candidate earned no protected consequence'

          out={
              'schema':'nucleus-crystal-prop-singleton-elim-v1',
              'base_sha':os.environ['BASE_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'base_residual':sum(r['base'] in (2,3) for r in rows),
              'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
              'native_accept':sum(r['expected']==0 and r['candidate']==0 for r in rows),
              'native_reject':sum(r['expected']==1 and r['candidate']==1 for r in rows),
              'earned':[r['test'] for r in earned],
              'changes':changes,
              'wrong':wrong,'regressions':regressions,'errors':errors,
              'false_accepts':false_accepts,'false_rejects':false_rejects,
          }
          pathlib.Path('metatron-kernel/evidence-out/prop-singleton-elim-v1/result.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-prop-singleton-elim-${{ github.sha }}
          path: metatron-kernel/evidence-out/prop-singleton-elim-v1
          if-no-files-found: warn
