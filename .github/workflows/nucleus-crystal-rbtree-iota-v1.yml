name: Nucleus Crystal RBTree Iota v1
on:
  push:
    branches: [nucleus-crystal-rbtree-iota-v1]
    paths: [".github/workflows/nucleus-crystal-rbtree-iota-v1.yml","metatron-kernel/**"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 841a4c4d79287a3b22f7453893593fad3f5f52d2
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}
      - name: Prove independent runtime boundary
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs
      - name: Build candidate and base
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path metatron-kernel/Cargo.toml
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml
      - name: Fetch corpus
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193
      - name: Reclose
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/crystal-rbtree-iota-v1
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          def rr(b,p):
            with p.open('rb') as f:return subprocess.run([str(b)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=120).returncode
          rows=[]
          for d,e in [('good',0),('bad',1)]:
            for p in sorted((root/d).rglob('*.ndjson')):
              n=str(p.relative_to(root/d)).removesuffix('.ndjson'); a,b=rr(base,p),rr(cand,p)
              rows.append({'test':n,'expected':e,'base':a,'candidate':b})
          assert len(rows)==193 and sum(r['base'] in (2,3) for r in rows)==39
          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          reg=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          err=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]
          changes=[r for r in rows if r['base']!=r['candidate']]
          assert not wrong and not reg and not err,(wrong,reg,err)
          assert any(r['test']=='tutorial/082_RBTree.id_spec' and r['candidate']==0 for r in earned),earned
          out={'schema':'nucleus-crystal-rbtree-iota-v1','base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
               'base_residual':sum(r['base'] in (2,3) for r in rows),'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
               'native_accept':sum(r['expected']==0 and r['candidate']==0 for r in rows),
               'native_reject':sum(r['expected']==1 and r['candidate']==1 for r in rows),
               'earned':[r['test'] for r in earned],'changes':changes,'wrong':wrong,'regressions':reg,'errors':err}
          pathlib.Path('metatron-kernel/evidence-out/crystal-rbtree-iota-v1/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-crystal-rbtree-iota-${{ github.sha }}
          path: metatron-kernel/evidence-out/crystal-rbtree-iota-v1
          if-no-files-found: error
