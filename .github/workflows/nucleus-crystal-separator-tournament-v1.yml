name: Nucleus Crystal separator tournament v1
on:
  push:
    branches: [nucleus-dependency-closure-exec-v1]
    paths: [".github/workflows/nucleus-crystal-separator-tournament-v1.yml"]
permissions: {contents: read}
jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: {ARENA_ARTIFACT: 10712869614}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip >/tmp/t.zip
          mkdir -p /tmp/a /tmp/t && unzip -q /tmp/t.zip -d /tmp/a && tar -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/t
      - name: Compile minimal protected separators
        run: |
          python - <<'PY'
          import pathlib,subprocess,os,re,json,collections,itertools
          root=pathlib.Path('/tmp/t'); b=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          env=os.environ.copy(); env.update(NUCLEUS_TRACE_DOWNSTREAM='1',NUCLEUS_TRACE_APPLICATION_INFER='1',NUCLEUS_TRACE_CONVERSION='1',NUCLEUS_TRACE_POST_CAPABILITY='1',NUCLEUS_TRACE_INNER_VERDICT='1')
          rows=[]
          for p in sorted(root.rglob('*.ndjson')):
            expected=0 if p.relative_to(root).parts[0]=='good' else 1
            with p.open('rb') as f:
              try:q=subprocess.run([str(b)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=90,env=env)
              except subprocess.TimeoutExpired: continue
            if q.returncode!=2: continue
            log=q.stderr.decode(errors='replace')
            downstream=tuple(sorted(set(re.findall(r'NUCLEUS_DOWNSTREAM:name=[^:]*:stage=([^:]*):verdict=UNKNOWN:reason=([^\n]+)',log))))
            app=tuple(sorted(set(x[0] for x in re.findall(r'NUCLEUS_APP_INFER:unknown:([^:]+):fun_expr=ExprId\((\d+)\)',log))))
            conv=tuple(sorted(set((re.sub(r'NameId\(\d+\)','NameId(*)',l),re.sub(r'NameId\(\d+\)','NameId(*)',r),int(ls),int(rs)) for l,r,ls,rs in re.findall(r'NUCLEUS_CONV_HEAD_MISMATCH left=(.*?) right=(.*?) left_spine=(\d+) right_spine=(\d+)',log))))
            post=tuple(sorted(set(re.findall(r'NUCLEUS_POST_CAPABILITY infer_unknown=([^ ]+)',log))))
            features={
              'downstream':downstream,
              'app':app,
              'conv':conv,
              'post':post,
              'has_conv':bool(conv),
              'has_app':bool(app),
              'stage':tuple(sorted(set(x[0] for x in downstream))),
              'reason':tuple(sorted(set(x[1] for x in downstream))),
            }
            rows.append({'path':str(p.relative_to(root)),'expected':expected,'features':features})
          # Candidate observations are individual atomic feature/value pairs. Find those pure for one outcome.
          atoms=collections.defaultdict(lambda:{0:[],1:[]})
          for row in rows:
            for key,val in row['features'].items():
              if isinstance(val,tuple):
                for item in val: atoms[(key,repr(item))][row['expected']].append(row['path'])
              else: atoms[(key,repr(val))][row['expected']].append(row['path'])
          pure=[]
          for (k,v),by in atoms.items():
            outs=[o for o in (0,1) if by[o]]
            if len(outs)==1:
              o=outs[0]; pure.append({'feature':k,'value':v,'outcome':o,'coverage':len(by[o]),'members':by[o]})
          pure.sort(key=lambda x:(-x['coverage'],x['outcome'],x['feature'],x['value']))
          # Also find minimal two-atom conjunctions that are pure and cover >=2 residuals.
          rowatoms=[]
          for row in rows:
            aa=set()
            for key,val in row['features'].items():
              if isinstance(val,tuple):
                aa|={(key,repr(item)) for item in val}
              else: aa.add((key,repr(val)))
            rowatoms.append((row,aa))
          pairs=[]
          candidates=sorted(atoms)
          for a,b in itertools.combinations(candidates,2):
            hits={0:[],1:[]}
            for row,aa in rowatoms:
              if a in aa and b in aa: hits[row['expected']].append(row['path'])
            outs=[o for o in (0,1) if hits[o]]
            if len(outs)==1 and len(hits[outs[0]])>=2:
              o=outs[0]; pairs.append({'features':[a,b],'outcome':o,'coverage':len(hits[o]),'members':hits[o]})
          pairs.sort(key=lambda x:(-x['coverage'],x['outcome'],repr(x['features'])))
          out={'unknown_count':len(rows),'pure_atomic':pure[:30],'pure_pairs':pairs[:30]}
          pathlib.Path('/tmp/nucleus-crystal-separator-tournament-v1.json').write_text(json.dumps(out,indent=2,default=list))
          print(json.dumps(out,indent=2,default=list))
          assert len(rows)==40
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-crystal-separator-tournament-v1
          path: /tmp/nucleus-crystal-separator-tournament-v1.json
