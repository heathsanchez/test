name: Nucleus Current Arena Correctness v1

on:
  push:
    branches: [nucleus-current-arena-correctness-v1]
    paths:
      - ".github/workflows/nucleus-current-arena-correctness-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-current-arena-correctness-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ARENA_SHA: 74745e5a848c71d99121e811ae86f24d13dea785
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build exact Nucleus candidate
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus

      - name: Build current upstream Arena corpus
        timeout-minutes: 115
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q "$ARENA_SHA"
          cd /tmp/arena
          nix develop -c ./lka.py build-test

      - name: Run exact Arena correctness classification
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/current-arena
          python - <<'PY'
          import json, pathlib, subprocess, os
          root=pathlib.Path('/tmp/arena/_build/tests')
          binary=pathlib.Path('/tmp/nucleus')
          rows=[]
          for stats in sorted(root.rglob('*.stats.json')):
              data=json.loads(stats.read_text())
              ndjson=stats.parent/(stats.name.replace('.stats.json','.ndjson'))
              if not ndjson.exists():
                  rows.append({'test':data.get('name'),'outcome':data.get('outcome'),'status':'missing','correctness':'error'})
                  continue
              with ndjson.open('rb') as f:
                  p=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              rc=p.returncode
              status={0:'accepted',1:'rejected',2:'declined'}.get(rc,'error')
              expected=data.get('outcome')
              if status=='declined':
                  correctness='declined'
              elif status=='error':
                  correctness='error'
              elif expected=='either':
                  correctness='either'
              elif expected=='accept' and status=='accepted':
                  correctness='correct'
              elif expected=='reject' and status=='rejected':
                  correctness='correct'
              else:
                  correctness='incorrect'
              rows.append({
                  'test':data.get('name'),
                  'outcome':expected,
                  'status':status,
                  'correctness':correctness,
                  'exit_code':rc,
                  'stderr_tail':p.stderr.decode(errors='replace')[-500:] if status=='error' else ''
              })
          counts={}
          status_counts={}
          for r in rows:
              counts[r['correctness']]=counts.get(r['correctness'],0)+1
              status_counts[r['status']]=status_counts.get(r['status'],0)+1
          incorrect=[r for r in rows if r['correctness']=='incorrect']
          errors=[r for r in rows if r['correctness']=='error']
          declined=[r for r in rows if r['correctness']=='declined']
          out={
            'schema':'nucleus-current-arena-correctness-v1',
            'arena_sha':os.environ['ARENA_SHA'],
            'candidate_sha':os.environ['GITHUB_SHA'],
            'total':len(rows),
            'correctness_counts':counts,
            'status_counts':status_counts,
            'incorrect':incorrect,
            'errors':errors,
            'declined':declined,
            'rows':rows
          }
          dest=pathlib.Path('metatron-kernel/evidence-out/current-arena/result.json')
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:out[k] for k in ['total','correctness_counts','status_counts']},sort_keys=True))
          print('INCORRECT',json.dumps(incorrect,sort_keys=True))
          print('ERRORS',json.dumps(errors,sort_keys=True))
          print('DECLINED_FIRST_30',json.dumps(declined[:30],sort_keys=True))
          # Soundness/completeness qualification is explicit: any incorrect is a hard failure.
          assert not incorrect, incorrect
          PY

      - name: Upload current Arena evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-current-arena-${{ github.sha }}
          path: metatron-kernel/evidence-out/current-arena
          if-no-files-found: warn
