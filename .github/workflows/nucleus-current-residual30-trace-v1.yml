name: Nucleus Current Residual 30 Trace
on:
  push:
    branches: [nucleus-current-residual30-trace-v1]
    paths: [".github/workflows/nucleus-current-residual30-trace-v1.yml", "metatron-kernel/**"]
  workflow_dispatch:
permissions:
  contents: read
env:
  BASE_SHA: c362f35db5a2efe5c629e64c1a3b71e392b473fb
  CURRENT_TEST_ARTIFACT: "11090525747"
  ROUND1_ARTIFACT: "10712869614"
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact base and diagnostic variant
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git fetch -q origin "$BASE_SHA" --depth=1
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml
          mkdir -p evidence/logs offline
          cp metatron-kernel/target/release/metatron-kernel offline/nucleus-trace
          cp /tmp/base/metatron-kernel/target/release/metatron-kernel offline/nucleus-base
      - name: Fetch exact current and frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p offline/current offline/round1 /tmp/current-art /tmp/r1-art
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/current-art
          tar -xzf /tmp/current-art/lean-arena-tests.tar.gz -C offline/current
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip > /tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/r1-art
          tar -xzf /tmp/r1-art/lean-arena-tests.tar.gz -C offline/round1
      - name: Classify every current residual and verify trace preserves verdicts
        run: |
          python3 - <<'PY'
          import os,json,pathlib,subprocess,time,hashlib
          root=pathlib.Path("offline/current")
          base=pathlib.Path("offline/nucleus-base").resolve()
          trace=pathlib.Path("offline/nucleus-trace").resolve()
          rows=[]; residuals=[]
          for bucket,expected in [("good",0),("bad",1)]:
              for p in sorted((root/bucket).rglob("*.ndjson")):
                  name=str(p.relative_to(root/bucket)).removesuffix(".ndjson")
                  with p.open("rb") as f:
                      q=subprocess.run([str(base)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=30)
                  row={"test":name,"expected":expected,"rc":q.returncode}
                  rows.append(row)
                  if q.returncode==2:
                      log=pathlib.Path("evidence/logs")/(name.replace("/","__")+".log")
                      env=dict(os.environ,NUCLEUS_TRACE_DOWNSTREAM="1",NUCLEUS_TRACE_NEUTRAL_HEADS="1",NUCLEUS_TRACE_CONVERSION_EXPOSURE="1",NUCLEUS_TRACE_PROP_SINGLETON="1",NUCLEUS_TRACE_PROP_SMALL="1",NUCLEUS_TRACE_GENERIC_NONREC="1",NUCLEUS_TRACE_SINGLE_FIELD="1")
                      with p.open("rb") as f,log.open("wb") as err:
                          t=time.perf_counter_ns()
                          tq=subprocess.run([str(trace)],stdin=f,stdout=subprocess.DEVNULL,stderr=err,timeout=60,env=env)
                      lines=log.read_text(errors="replace").splitlines()
                      item={**row,"trace_rc":tq.returncode,"ns":time.perf_counter_ns()-t,"input_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"boundary":[l for l in lines if "NUCLEUS_DOWNSTREAM:" in l][-5:],"exposure":[l for l in lines if "NUCLEUS_CONVERSION_EXPOSURE:" in l][-5:],"neutral":[l for l in lines if "NUCLEUS_NEUTRAL_HEAD_MISMATCH:" in l][-4:],"tail":lines[-8:],"log_bytes":log.stat().st_size}
                      residuals.append(item)
                      print(json.dumps(item),flush=True)
          summary={"base_sha":os.environ["BASE_SHA"],"diagnostic_sha":os.environ["GITHUB_SHA"],"tests":len(rows),"accept":sum(r["rc"]==0 for r in rows),"reject":sum(r["rc"]==1 for r in rows),"unknown":sum(r["rc"]==2 for r in rows),"errors":[r for r in rows if r["rc"] not in (0,1,2)],"wrong":[r for r in rows if r["rc"] in (0,1) and r["rc"]!=r["expected"]],"residuals":residuals}
          pathlib.Path("evidence/residuals.json").write_text(json.dumps(summary,indent=2)+"\n")
          assert (summary["tests"],summary["accept"],summary["reject"],summary["unknown"])==(194,105,59,30),summary
          assert not summary["wrong"] and not summary["errors"],summary
          assert all(r["trace_rc"]==2 for r in residuals),residuals
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-residual30-trace-${{ github.sha }}
          path: evidence
      - name: Prepare offline source, inputs and compiler for continued repair
        run: |
          set -euo pipefail
          cp -a /tmp/base/metatron-kernel offline/metatron-kernel
          rm -rf offline/metatron-kernel/target
          mkdir -p offline/.cargo
          cargo vendor --locked --manifest-path offline/metatron-kernel/Cargo.toml offline/vendor > /tmp/vendor-config
          sed 's|directory = "offline/vendor"|directory = "vendor"|' /tmp/vendor-config > offline/.cargo/config.toml
          tar -czf nucleus-offline.tar.gz offline
          RUST_SDK_ROOT="$(rustc --print sysroot)"
          tar --exclude=./share --exclude=./lib/rustlib/src -czf rust-sdk.tar.gz -C "$RUST_SDK_ROOT" .
          sha256sum nucleus-offline.tar.gz rust-sdk.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-offline-workspace-${{ github.sha }}
          path: nucleus-offline.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-offline-rust-sdk
          path: rust-sdk.tar.gz
          compression-level: 0
