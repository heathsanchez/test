name: Nucleus CVE-2026-72844 original certificate export probe
on:
  push:
    branches: [research/nucleus-cve72844-static-replay-20261119]
    paths:
      - '.github/workflows/nucleus-cve72844-authentic-olean-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-olean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: endrazine/owning-the-truth
          ref: 0746387e8ed929e85f3f8a6753b0bff4040b008c
          path: brossard
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: leanprover/lean4export
          ref: af5aa64bb914c3c2c781f378088dbd38acf4f804
          path: exporter
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Pin unchanged checker, original certificates, and official exporter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel/src)" = ac74a47a570babe5d7895fb74d2098831aa9a300
          test "$(git rev-parse HEAD:.github/nucleus-cve72844/Benign.lean)" = f36166bd267267f3a0ecc5c0c37685dc5a6caaeb
          test "$(git -C brossard rev-parse HEAD)" = 0746387e8ed929e85f3f8a6753b0bff4040b008c
          test "$(git -C exporter rev-parse HEAD)" = af5aa64bb914c3c2c781f378088dbd38acf4f804
          test "$(git -C brossard rev-parse HEAD:millennium/lean4-p-is-np-certificate/PNP.olean)" = 35c830bf4edaf463d7d8dd57136fcc15643530cf
          test "$(git -C brossard rev-parse HEAD:millennium/lean4-p-is-not-np-certificate/PNNP.olean)" = cbeb6df55a45e2b6f6301e76100b5e09a28b651b
          test "$(cat brossard/millennium/lean4-p-is-np-certificate/lean-toolchain)" = 'leanprover/lean4:nightly-2026-07-27'
          mkdir -p "$RUNNER_TEMP/cve-authentic"
          git rev-parse HEAD > "$RUNNER_TEMP/cve-authentic/replay-commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/cve-authentic/checker-source-tree.txt"
          sha256sum brossard/millennium/lean4-p-is-np-certificate/PNP.olean brossard/millennium/lean4-p-is-not-np-certificate/PNNP.olean > "$RUNNER_TEMP/cve-authentic/olean-sha256.txt"
      - name: Install pinned vulnerable nightly and build source-pinned official exporter
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:nightly-2026-07-27
          elan default leanprover/lean4:nightly-2026-07-27
          export ELAN_TOOLCHAIN=leanprover/lean4:nightly-2026-07-27
          lean --version | tee "$RUNNER_TEMP/cve-authentic/lean-version.txt"
          cd exporter
          lake build lean4export
          test -x .lake/build/bin/lean4export
          cd "$GITHUB_WORKSPACE/.github/nucleus-cve72844"
          lean -o Benign.olean Benign.lean
          test -s Benign.olean
      - name: Build minimal sandbox dependencies (before untrusted certificate import)
        shell: bash
        run: |
          set -euo pipefail
          docker build -t nucleus-lean-export-sandbox:local -f - . <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends libgmp10 libstdc++6 ca-certificates && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
      - name: Export exact original OLEANs offline, as unprivileged read-only process
        shell: bash
        run: |
          set -euo pipefail
          chmod 777 "$RUNNER_TEMP/cve-authentic"
          docker run --rm \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 6g --pids-limit 256 --cpus 2 --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,size=128m \
            --volume "$HOME/.elan:/elan:ro" \
            --volume "$GITHUB_WORKSPACE/exporter/.lake/build/bin:/exporter:ro" \
            --volume "$GITHUB_WORKSPACE/brossard/millennium/lean4-p-is-np-certificate:/pnp:ro" \
            --volume "$GITHUB_WORKSPACE/brossard/millennium/lean4-p-is-not-np-certificate:/pnnp:ro" \
            --volume "$GITHUB_WORKSPACE/.github/nucleus-cve72844:/benign:ro" \
            --volume "$RUNNER_TEMP/cve-authentic:/out:rw" \
            --env ELAN_HOME=/elan \
            --env ELAN_TOOLCHAIN=leanprover/lean4:nightly-2026-07-27 \
            --env LEAN_PATH=/pnp:/pnnp:/benign \
            --env PATH=/elan/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env HOME=/tmp \
            nucleus-lean-export-sandbox:local \
            /bin/bash -c 'set -euo pipefail; timeout 180 /exporter/lean4export PNP -- boom Complexity.bogus_P_eq_NP > /out/PNP.ndjson; timeout 180 /exporter/lean4export PNNP -- boom Complexity.bogus_P_neq_NP_direct Complexity.bogus_P_neq_NP > /out/PNNP.ndjson; timeout 180 /exporter/lean4export Benign -- benign_true > /out/Benign.ndjson'
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          for module in ("PNP", "PNNP", "Benign"):
              p = Path(os.environ["RUNNER_TEMP"]) / "cve-authentic" / (module + ".ndjson")
              assert p.stat().st_size > 0
              records = [json.loads(line) for line in p.open()]
              first = records[0]
              assert first["meta"]["format"]["version"].startswith("3.")
              names = {rec["in"]: rec["str"]["str"] for rec in records if "in" in rec and "str" in rec}
              theorem_names = {names.get(rec["thm"]["name"]) for rec in records if "thm" in rec}
              if module == "Benign":
                  assert "benign_true" in theorem_names, theorem_names
                  print(module, "exported", p.stat().st_size, "bytes; benign theorem present; metadata", first["meta"])
              else:
                  final_theorem = "bogus_P_eq_NP" if module == "PNP" else "bogus_P_neq_NP"
                  assert {"boom", "bad", final_theorem}.issubset(theorem_names), theorem_names
                  assert {"P", "C", "W", "E"}.issubset(set(names.values()))
                  assert any("proj" in rec for rec in records)
                  print(module, "exported", p.stat().st_size, "bytes; terminal theorem", final_theorem, "present; metadata", first["meta"])
          PY
          sha256sum "$RUNNER_TEMP/cve-authentic/"*.ndjson > "$RUNNER_TEMP/cve-authentic/export-sha256.txt"
      - name: Replay exported original certificates against unchanged Nucleus
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path metatron-kernel/Cargo.toml
          checker=metatron-kernel/target/release/metatron-kernel
          for module in PNP PNNP; do
            set +e
            NUCLEUS_TRACE_PARSE_ERROR=1 timeout 180 "$checker" < "$RUNNER_TEMP/cve-authentic/$module.ndjson" > "$RUNNER_TEMP/cve-authentic/$module-checker-output.txt" 2>&1
            rc=$?
            set -e
            printf '%s original certificate export: checker exit %s (0=ACCEPT,1=REJECT,2=UNKNOWN,3=ERROR)\n' "$module" "$rc" | tee -a "$RUNNER_TEMP/cve-authentic/verdicts.txt"
            if [ "$rc" -ne 1 ]; then
              echo "NOT WARRANTED: expected strict REJECT; see recorded verdict and output"
              exit 1
            fi
          done
          set +e
          NUCLEUS_TRACE_PARSE_ERROR=1 timeout 180 "$checker" < "$RUNNER_TEMP/cve-authentic/Benign.ndjson" > "$RUNNER_TEMP/cve-authentic/Benign-checker-output.txt" 2>&1
          benign_rc=$?
          set -e
          printf 'Benign historical-nightly control: checker exit %s (ACCEPT=0)\\n' "$benign_rc" | tee -a "$RUNNER_TEMP/cve-authentic/verdicts.txt"
          test "$benign_rc" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-cve72844-original-olean-evidence
          path: ${{ runner.temp }}/cve-authentic/
          retention-days: 90
# This probes whether the pinned official exporter can serialize the source author's
# original binary artifacts and whether Nucleus can replay their proof DAGs.
# Any failed export or UNKNOWN/ERROR remains UNKNOWN; never count it as REJECT.
