name: Nucleus DecidableEq IMax Trace v1

on:
  push:
    branches: [nucleus-decidableeq-imax-trace-v1]
    paths:
      - ".github/workflows/nucleus-decidableeq-imax-trace-v1.yml"
      - "metatron-kernel/src/level.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ARENA_ARTIFACT: 10712869614

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build diagnostic
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo build --release --locked

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests

      - name: Trace DecidableEq imax obligations
        env:
          NUCLEUS_TRACE_IMAX: "1"
          NUCLEUS_TRACE_DOWNSTREAM: "1"
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/decidableeq-imax-trace-v1
          python - <<'PY'
          import json,pathlib,subprocess,os
          root=pathlib.Path('/tmp/tests')
          binary=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          rows=[]
          for name in ['perf/magma-list-deep-n21','perf/magma-list-deep-n36']:
              p=root/'good'/(name+'.ndjson')
              with p.open('rb') as f:
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=180,env=os.environ)
              stderr=q.stderr.decode(errors='replace')
              marks=[line for line in stderr.splitlines()
                     if line.startswith('NUCLEUS_IMAX:') or line.startswith('NUCLEUS_DOWNSTREAM:')]
              rows.append({'test':name,'rc':q.returncode,'marks':marks})
          out={'schema':'nucleus-decidableeq-imax-trace-v1','candidate_sha':os.environ['GITHUB_SHA'],'rows':rows}
          pathlib.Path('metatron-kernel/evidence-out/decidableeq-imax-trace-v1/result.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          assert all(any(m.startswith('NUCLEUS_IMAX:') for m in r['marks']) for r in rows), rows
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-decidableeq-imax-trace-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/decidableeq-imax-trace-v1
          if-no-files-found: warn
