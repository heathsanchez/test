name: Nucleus deferred projection independent Arena 196+207 qualification
on:
  push:
    branches: [research/nucleus-deferred-projection-congruence-20261105]
    paths:
      - '.github/workflows/nucleus-deferred-projection-qualification-20261105.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  protected-corpora:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore immutable qualified Rust source and guarded candidate patches
        run: |
          set -euo pipefail
          mkdir -p qualified original196 arena-current candidate
          gh api repos/heathsanchez/test/actions/artifacts/13370874970/zip > qualified.zip
          printf '%s  %s\n' 0fd8a4cd86dcb233b532f59ea8dc853d22480b6ba62ff864049224250613e517 qualified.zip | sha256sum -c -
          unzip -q qualified.zip -d qualified
          tar --no-same-owner -xzf qualified/candidate/source.tar.gz
          printf '%s  %s\n' 1949144e581167be2547bb18a0331d7b34a769f2cff75037b884ce9b2de6c4ac metatron-kernel/src/convert.rs | sha256sum -c -
          printf '%s  %s\n' 633fb3fd4c58def5143e17078d3d188f832dc1a7432dea84a88b8d91676e5d20 metatron-kernel/src/run_flags.rs | sha256sum -c -
          patch -p1 -d metatron-kernel < experiments/nucleus-deferred-projection-congruence-20261105/run_flags.rs.patch
          patch -p1 -d metatron-kernel < experiments/nucleus-deferred-projection-congruence-20261105/convert.rs.patch
          sha256sum metatron-kernel/src/convert.rs metatron-kernel/src/run_flags.rs | tee candidate-source-sha256.txt
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > original196.zip
          printf '%s  %s\n' f6cd590db7f6fb92b8d1b3ca87231d4b0f521f085d73f93abd005f5caaff86d2 original196.zip | sha256sum -c -
          unzip -p original196.zip lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C original196
          test "$(find original196 -name '*.ndjson' -type f | wc -l)" -eq 196
          test "$(find original196/good -name '*.ndjson' -type f | wc -l)" -eq 125
          test "$(find original196/bad -name '*.ndjson' -type f | wc -l)" -eq 71
          curl -fLsS --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o arena-current.tar.gz
          printf '%s  %s\n' 9a6ef995a4cff1fff0e15bf46fde67ccbc4754dc023b9a61ee9b46bfe252fd75 arena-current.tar.gz | sha256sum -c -
          tar --no-same-owner -xzf arena-current.tar.gz -C arena-current
          test "$(find arena-current -name '*.ndjson' -type f | wc -l)" -eq 207
          test "$(find arena-current/good -name '*.ndjson' -type f | wc -l)" -eq 127
          test "$(find arena-current/bad -name '*.ndjson' -type f | wc -l)" -eq 80
      - name: Build source-owned experimental checker without altering production candidate
        run: |
          set -euo pipefail
          cd metatron-kernel
          cargo build --locked --release
          cp target/release/metatron-kernel ../candidate/nucleus
          sha256sum ../candidate/nucleus | tee ../candidate-binary-sha256.txt
      - name: Replay original Arena 196 and current Arena 207 with protected negative control
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r '.candidate.configuration | to_entries[] | "\(.key)=\(.value)"' qualified/qualification.json)
          export "${flags[@]}"
          export NUCLEUS_EXPERIMENTAL_DEFERRED_PROJECTION_CONGRUENCE=1
          for corpus in original196 arena-current; do
            find "$corpus" -type f -name '*.ndjson' -print0 | xargs -0 -P 4 -n 1 bash -c '
              file="$1"
              label="${file#*/}"
              if [[ "$label" == good/* ]]; then expected=0; else expected=1; fi
              actual=0
              timeout 200 candidate/nucleus < "$file" >/dev/null 2>/dev/null || actual=$?
              printf "%s\t%s\t%s\n" "$label" "$expected" "$actual"
            ' _ > "$corpus.unsorted.tsv"
            LC_ALL=C sort -t $'\t' -k1,1 "$corpus.unsorted.tsv" > "$corpus.verdicts.tsv"
            sha256sum "$corpus.verdicts.tsv"
            awk -F '\t' -v corpus="$corpus" '{
              total++;
              if ($2==0 && $3==0) accept++;
              else if ($2==1 && $3==1) reject++;
              else if ($3==2 || $3==124) unknown++;
              else {wrong++;print "WRONG",corpus,$1,$2,$3;}
            } END {
              printf "%s: total=%d ACCEPT=%d REJECT=%d DECLINE_OR_TIMEOUT=%d WRONG=%d\n", corpus,total,accept,reject,unknown,wrong;
              if (wrong!=0) exit 1;
            }' "$corpus.verdicts.tsv" | tee "$corpus.summary.txt"
            awk -F '\t' '$2!=$3 {print $1, "expected=" $2, "actual=" $3}' "$corpus.verdicts.tsv" | tee "$corpus.residuals.txt"
          done
          test "$(wc -l < original196.verdicts.tsv)" -eq 196
          test "$(wc -l < arena-current.verdicts.tsv)" -eq 207
          case "$(awk -F '\t' '$1=="bad/bugs/eta-ctor-alias.ndjson" { print $3 }' arena-current.verdicts.tsv)" in 1|2|124) ;; *) echo 'UNSAFE: constructor eta alias accepted' >&2; exit 1;; esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-deferred-projection-protected-corpora-qualification
          retention-days: 60
          if-no-files-found: warn
          path: |
            candidate/nucleus
            candidate-binary-sha256.txt
            candidate-source-sha256.txt
            qualified/qualification.json
            original196.verdicts.tsv
            original196.summary.txt
            original196.residuals.txt
            arena-current.verdicts.tsv
            arena-current.summary.txt
            arena-current.residuals.txt
