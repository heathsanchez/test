name: Nucleus Dependent Structure Trace v1

on:
  push:
    branches: [nucleus-dependent-structure-trace-v1]
    paths:
      - ".github/workflows/nucleus-dependent-structure-trace-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build diagnostic candidate
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests

      - name: Trace exact dependent-structure targets
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/dependent-structure-trace-v1
          python - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('/tmp/tests/good')
          names=[
            'init-prelude',
            'perf/magma-list-deep-n21',
            'perf/magma-list-deep-n36',
            'perf/magma-list-pair-n21',
            'perf/magma-list-pair-n7',
          ]
          rows=[]
          for name in names:
              p=root/(name+'.ndjson')
              with p.open('rb') as f:
                  q=subprocess.run(['/tmp/nucleus'],stdin=f,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=180)
              stderr=q.stderr.decode(errors='replace')
              trace=[line for line in stderr.splitlines() if 'DEPSTRUCT' in line]
              rows.append({'test':name,'status':q.returncode,'trace':trace,'stderr_tail':stderr[-3000:]})
              print(name,q.returncode)
              for line in trace: print(line)
          out={'schema':'nucleus-dependent-structure-trace-v1','rows':rows}
          pathlib.Path('metatron-kernel/evidence-out/dependent-structure-trace-v1/result.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-dependent-structure-trace-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/dependent-structure-trace-v1
          if-no-files-found: error
