name: Nucleus Lean.Name first inductive-contract audit

on:
  push:
    branches: [nucleus-lean-name-inductive-contract-census-v1]
    paths:
      - ".github/workflows/nucleus-depth5-applied-telescope-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Bind exact certified-projection source tree
        run: |
          set -euo pipefail
          printf 'checker_source_tree=%s\n' "$(git rev-parse HEAD:metatron-kernel)"
          printf 'qualification_commit=%s\n' "$GITHUB_SHA"

      - name: Require typed telescope positive and adversarial negatives
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml --test typecheck captured_two_argument_relation_requires_checked_domains -- --nocapture

      - name: Qualify dependent let-wrapped lambda red-green regression
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml --test typecheck dependent_let_wrapped_lambda -- --nocapture

      - name: Build and test corrected Nucleus
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus

      - name: Fetch immutable 196-case Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests metatron-kernel/evidence-out/final-qualification-v1
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests

      - name: Demand admitted Substring.Raw prefix and invalid metadata negatives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess,hashlib
          root=pathlib.Path('/tmp/arena-tests/good')
          rows=[]
          for name in ('init-prelude','perf/grind-ring-5'):
              data=(root/(name+'.ndjson')).read_bytes()
              names={0:''}
              prefix=[]
              chosen=None
              for raw in data.splitlines(keepends=True):
                  j=json.loads(raw)
                  prefix.append(raw)
                  if 'in' in j:
                      z=j.get('str',j.get('num'))
                      parent=names.get(z['pre'],'')
                      names[j['in']]=parent+('.' if parent else '')+str(z.get('str',z.get('i')))
                  if 'inductive' in j and any(
                      names.get(t.get('name'))=='Substring.Raw'
                      for t in j['inductive'].get('types',[])
                  ):
                      chosen=j
                      break
              assert chosen is not None, name
              def invoke(body):
                  p=subprocess.run(['/tmp/nucleus'],input=body,
                                   stdout=subprocess.DEVNULL,
                                   stderr=subprocess.DEVNULL,timeout=90)
                  return p.returncode
              positive=invoke(b''.join(prefix))
              failures=[]
              for label,edit in [
                  ('constructor-numFields',('ctors',0,'numFields')),
                  ('recursor-rule-fields',('recs',0,'rules',0,'nfields')),
              ]:
                  obj=json.loads(json.dumps(chosen))
                  node=obj['inductive']
                  for k in edit[:-1]:
                      node=node[k]
                  key=edit[-1]
                  assert isinstance(node[key],int)
                  node[key]+=1
                  mutated=b''.join(prefix[:-1])+json.dumps(obj,separators=(',',':')).encode()+b'\n'
                  failures.append({'label':label,'rc':invoke(mutated)})
              row={'case':name,'prefix_sha256':hashlib.sha256(b''.join(prefix)).hexdigest(),
                   'positive_rc':positive,'negative_controls':failures}
              print('NUCLEUS_CLOSED_THREE_FIELD='+json.dumps(row),flush=True)
              rows.append(row)
              assert positive==0, ('record not yet admitted',row)
              assert all(x['rc'] in (1,2) for x in failures), ('unsafe record metadata admitted',row)
          out=pathlib.Path('metatron-kernel/evidence-out/contextual-rigid/closed-three-field-report.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(rows,indent=2))
          PY

      - name: Qualify source-certified three-constructor SourceInfo and malformed neighbors
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess,hashlib
          root=pathlib.Path('/tmp/arena-tests/good')
          rows=[]
          for case in ('init-prelude','perf/grind-ring-5'):
              names={0:''};prefix=[];found=None
              for line in (root/(case+'.ndjson')).read_bytes().splitlines(keepends=True):
                  d=json.loads(line);prefix.append(line)
                  if 'in' in d:
                      z=d.get('str',d.get('num'))
                      parent=names.get(z['pre'],'')
                      names[d['in']]=parent+('.' if parent else '')+str(z.get('str',z.get('i')))
                  if 'inductive' in d and any(
                      names.get(t['name'])=='Lean.SourceInfo'
                      for t in d['inductive'].get('types',[])
                  ):
                      found=d;break
              assert found is not None,case
              def verdict(source):
                  return subprocess.run(['/tmp/nucleus'],input=source,stdout=subprocess.DEVNULL,
                                        stderr=subprocess.DEVNULL,timeout=90).returncode
              original=b''.join(prefix)
              accepted=verdict(original)
              import os
              diagnostics=subprocess.run(
                  ['/tmp/nucleus'],input=original,stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,timeout=90,
                  env=os.environ|{'NUCLEUS_TRACE_THREE_CTOR_REC_SHAPE':'1',
                                  'NUCLEUS_TRACE_GENERIC_NONREC':'1',
                                  'NUCLEUS_TRACE_DOWNSTREAM':'1'}
              )
              trace=[line for line in diagnostics.stderr.decode(errors='replace').splitlines()
                     if 'NUCLEUS_GENERIC' in line or 'NUCLEUS_THREE_CTOR_REC_SHAPE' in line or 'NUCLEUS_DOWNSTREAM' in line or 'NUCLEUS_CHECKED_SECOND_ARG_ERASURE' in line][-40:]
              controls=[]
              for label,field_path in (
                  ('first-ctor-field-count',('ctors',0,'numFields')),
                  ('second-rule-field-count',('recs',0,'rules',1,'nfields')),
                  ('inductive-forged-recursion',('types',0,'isRec')),
              ):
                  modified=json.loads(json.dumps(found))
                  sub=modified['inductive']
                  for k in field_path[:-1]:
                      sub=sub[k]
                  key=field_path[-1]
                  if isinstance(sub[key],bool):sub[key]=not sub[key]
                  else:sub[key]+=1
                  payload=b''.join(prefix[:-1])+json.dumps(modified,separators=(',',':')).encode()+b'\n'
                  controls.append(dict(name=label,rc=verdict(payload)))
              record=dict(case=case,sha256=hashlib.sha256(original).hexdigest(),
                          positive=accepted,negatives=controls,trace=trace)
              print('NUCLEUS_THREE_CONSTRUCTOR='+json.dumps(record),flush=True)
              rows.append(record)
              assert accepted==0,('source-certified field alias did not admit the constructor block',record)
              assert any('NUCLEUS_THREE_CTOR_REC_SHAPE:' in line for line in trace), ('recursor trace missing',record)
              assert any('NUCLEUS_CHECKED_SECOND_ARG_ERASURE:' in line for line in trace), ('checked beta-delta field witness missing',record)
              assert all(x['rc'] in (1,2) for x in controls),('unsafe induction admitted',record)
          p=pathlib.Path('metatron-kernel/evidence-out/contextual-rigid/three-constructor-report.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(rows,indent=2))
          PY

      - name: Inspect exact synthetic third field and recursor-minor source aliases
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('/tmp/arena-tests/good')
          for case,synthetic_field,minor_field in (
              ('init-prelude',8060,879),
              ('perf/grind-ring-5',7726,2135),
          ):
              names={0:''};exprs={};definitions={};levels={}
              for raw in (root/(case+'.ndjson')).read_bytes().splitlines():
                  obj=json.loads(raw)
                  if 'in' in obj:
                      z=obj.get('str',obj.get('num'))
                      names[obj['in']]=names.get(z['pre'],'')+('.' if names.get(z['pre'],'') else '')+str(z.get('str',z.get('i')))
                  if 'ie' in obj:exprs[obj['ie']]=obj
                  if 'il' in obj:levels[obj['il']]=obj
                  if 'def' in obj:
                      z=obj['def'];definitions[z['name']]=z
              def node(i,d=0):
                  if d>7:return {'truncated':i}
                  obj=exprs.get(i)
                  if obj is None:return {'missing':i}
                  r={'id':i}
                  for key in ('const','app','bvar','forallE','lam','sort','natVal','proj'):
                      if key not in obj:continue
                      z=obj[key]
                      if key=='const':
                          r['const']={'name':names.get(z['name'],str(z['name'])),'id':z['name'],'universes':z.get('us')}
                          r['declaration']=definitions.get(z['name'])
                          if z['name'] in definitions:
                              r['definition_rhs']=node(definitions[z['name']]['value'],d+1)
                      elif key=='app':r['app']={'fn':node(z['fn'],d+1),'arg':node(z['arg'],d+1)}
                      elif key in ('forallE','lam'):
                          r[key]={'type':node(z['type'],d+1),'body':node(z['body'],d+1)}
                      else:r[key]=z
                  return r
              left=node(synthetic_field);right=node(minor_field)
              print('NUCLEUS_SYNTHETIC_FIELD_ALIAS='+json.dumps({'case':case,'constructor_field':left,'minor_field':right},separators=(',',':')),flush=True)
          PY

      - name: Identify exact next Lean.Name inductive contract after SourceInfo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,pathlib,subprocess,os
          root=pathlib.Path('/tmp/arena-tests/good')
          results=[]
          for case in ('init-prelude','perf/grind-ring-5'):
              names={0:''};exprs={};prefix=[];found=None
              for raw in (root/(case+'.ndjson')).read_bytes().splitlines(keepends=True):
                  row=json.loads(raw);prefix.append(raw)
                  if 'in' in row:
                      n=row.get('str',row.get('num'))
                      parent=names.get(n['pre'],'')
                      names[row['in']]=parent+('.' if parent else '')+str(n.get('str',n.get('i')))
                  if 'ie' in row:
                      exprs[row['ie']]=row
                  if 'inductive' in row and any(
                      names.get(t['name'])=='Lean.Name'
                      for t in row['inductive'].get('types',[])
                  ):
                      found=row
                      break
              assert found is not None,('Lean.Name not found',case)
              def source_name(n):return names.get(n,str(n))
              def term(i,d=0):
                  if d>4:return {'expr':i,'more':True}
                  obj=exprs.get(i,{})
                  if 'const' in obj:
                      z=obj['const'];return {'const':source_name(z['name']),'us':z.get('us',[])}
                  if 'app' in obj:
                      z=obj['app'];return {'app':[term(z['fn'],d+1),term(z['arg'],d+1)]}
                  if 'forallE' in obj:
                      z=obj['forallE'];return {'Pi':[term(z['type'],d+1),term(z['body'],d+1)]}
                  if 'bvar' in obj:return {'bvar':obj['bvar']}
                  if 'sort' in obj:return {'sort':obj['sort']}
                  return {'expr':i,'keys':list(obj.keys())}
              def pi_type(i,count):
                  domains=[]
                  for _ in range(min(16,count)):
                      z=exprs.get(i,{})
                      if 'forallE' not in z:break
                      domains.append(z['forallE']['type'])
                      i=z['forallE']['body']
                  return domains,i
              block=found['inductive']
              ctor_records=[]
              for c in block.get('ctors',[]):
                  p=c.get('numParams',0);fields=c.get('numFields',0)
                  domains,result=pi_type(c['type'],p+fields)
                  ctor_records.append({
                      'name':source_name(c['name']),'num_params':p,'num_fields':fields,
                      'declared_type':c['type'],'domain_count':len(domains),
                      'fields':[term(x) for x in domains[p:]],
                      'result':term(result),'metadata':{k:v for k,v in c.items() if k not in ('type','name')}
                  })
              rec_records=[]
              for rec in block.get('recs',[]):
                  domains,result=pi_type(rec['type'],16)
                  rec_records.append({
                      'name':source_name(rec['name']),'signature_binders_at_most_16':len(domains),
                      'rules':[{'constructor':source_name(z.get('ctor',z.get('constructor'))),'nfields':z.get('nfields'),'rhs':z.get('rhs')} for z in rec.get('rules',[])],
                      'metadata':{k:v for k,v in rec.items() if k not in ('type','name','rules')}
                  })
              payload=b''.join(prefix)
              run=subprocess.run(['/tmp/nucleus'],input=payload,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=90,
                                 env=os.environ|{'NUCLEUS_TRACE_DOWNSTREAM':'1'})
              downstream=[x for x in run.stderr.decode(errors='replace').splitlines() if 'NUCLEUS_DOWNSTREAM:' in x][-3:]
              record={
                  'case':case,'prefix_sha256':hashlib.sha256(payload).hexdigest(),
                  'verdict':run.returncode,'last':downstream,
                  'types':[{'name':source_name(t['name']), 'metadata':t} for t in block['types']],
                  'constructors':ctor_records,'recursors':rec_records
              }
              print('NUCLEUS_LEAN_NAME_CONTRACT='+json.dumps(record,separators=(',',':')),flush=True)
              assert run.returncode==2, ('Lean.Name unexpected verdict',record)
              assert any('name=Lean.Name:' in x for x in downstream),('unexpected first residual',record)
              results.append(record)
          out=pathlib.Path('metatron-kernel/evidence-out/contextual-rigid/lean-name-contract-census.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(results,indent=2))
          PY

      - name: Require new contextual proof with exact negative controls
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/contextual-rigid
          python3 - <<'PY'
          import json,hashlib,pathlib,subprocess,os,sys
          sys.path.insert(0,'.github/scripts')
          from nucleus_succle_separator import extract,false_index
          root=pathlib.Path('/tmp/arena-tests')
          protected={
            'init-prelude':('eac8baf0fd48f5e7ccada755b36823d402a1e980882818995ade19cffe15a2c5','bbc3222de771d71ee3213c45509f4c629ff7bdd66c8890ca0234e4bc59a39211'),
            'perf/magma-list-pair-n7':('abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35','152821725732781c9fca2855aab7001dfd16b77477f85f6fde76c13edcdc897f')}
          rows=[]
          for name,(whole_digest,prefix_digest) in protected.items():
              data=(root/'good'/(name+'.ndjson')).read_bytes()
              assert hashlib.sha256(data).hexdigest()==whole_digest,name
              names={0:''};prefix=[];found=False
              for line in data.splitlines(keepends=True):
                  j=json.loads(line);prefix.append(line)
                  if 'in' in j:
                      z=j.get('str',j.get('num'))
                      parent=names.get(z['pre'],'')
                      names[j['in']]=parent+('.' if parent else '')+str(z.get('str',z.get('i')))
                  if 'thm' in j and names.get(j['thm']['name'])=='Nat.modCore_lt':
                      found=True;break
              assert found,name
              body=b''.join(prefix)
              assert hashlib.sha256(body).hexdigest()==prefix_digest,name
              p=subprocess.run(['/tmp/nucleus'],input=body,stdout=subprocess.DEVNULL,
                 stderr=subprocess.PIPE,timeout=45,
                 env=os.environ|{'NUCLEUS_TRACE_DOWNSTREAM':'1','NUCLEUS_TRACE_LOCAL_PROOF_IRREL':'1'})
              lines=p.stderr.decode(errors='replace').splitlines()
              row={'case':name,'rc':p.returncode,'sha256':prefix_digest,
                 'last':[x for x in lines if 'NUCLEUS_DOWNSTREAM:' in x][-3:],
                 'local_proofs':[x for x in lines if 'NUCLEUS_LOCAL_PROOF_IRREL:' in x][-8:],
                 'local_premises':[x for x in lines if 'NUCLEUS_LOCAL_PROOF_PREMISES:' in x][-45:],
                 'depth5_telescope':[x for x in lines if 'NUCLEUS_DEPTH5_APPLIED_TELESCOPE:' in x][-8:],
                 'typed_certificate':[x for x in lines if 'NUCLEUS_TYPED_TELESCOPE:' in x][-8:]}
              rows.append(row)
              print('CONTEXTUAL_RIGID='+json.dumps({k:v for k,v in row.items() if k!='mismatches'}),flush=True)
              assert p.returncode in (0,2),row
          negative=false_index(extract((root/'good/init-prelude.ndjson').read_bytes()))
          assert hashlib.sha256(negative).hexdigest()=='2a090edfcfa2a16191f17a433617aaf045fc9b11cd0e2a93405b705d8a899688'
          neg=subprocess.run(['/tmp/nucleus'],input=negative,stdout=subprocess.DEVNULL,timeout=25)
          malformed=subprocess.run(['/tmp/nucleus'],input=(root/'bad/bugs/nested-unused-param.ndjson').read_bytes(),stdout=subprocess.DEVNULL,timeout=25)
          report={'source':os.environ['GITHUB_SHA'],'rows':rows,'false_index':neg.returncode,'malformed':malformed.returncode}
          pathlib.Path('metatron-kernel/evidence-out/contextual-rigid/report.json').write_text(json.dumps(report,indent=2))
          print('NEGATIVES='+json.dumps({'false_index':neg.returncode,'malformed':malformed.returncode}),flush=True)
          assert neg.returncode in (1,2) and malformed.returncode==1
          assert all(r.get('depth5_telescope') for r in rows),'Depth5 witness missing'
          print('TYPED_TELESCOPE_CANDIDATE_AWAITS_FULL_REPLAY',flush=True)
          PY

      - name: Census exact post-iota first semantic residuals
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/arena-tests/good')
          rows=[]
          for name in ['perf/magma-list-pair-n7','perf/magma-list-pair-n21',
                       'init-prelude','perf/grind-ring-5']:
              extra={'NUCLEUS_TRACE_DOWNSTREAM':'1',
                     'NUCLEUS_TRACE_LOCAL_PROOF_IRREL':'1',
                     'NUCLEUS_TRACE_DEPENDENCY_GAP':'1'}
              if 'magma-list-pair' in name:
                  extra['NUCLEUS_TRACE_NEUTRAL_HEADS']='1'
                  extra['NUCLEUS_TRACE_VALUE_MISMATCH']='1'
              else:
                  extra['NUCLEUS_TRACE_PROJECTION_NORMALFORM']='1'
                  extra['NUCLEUS_TRACE_MULPOS_REC_CONGRUENCE']='1'
                  extra['NUCLEUS_TRACE_REC_ARG_OBLIGATIONS']='1'
                  extra['NUCLEUS_TRACE_PROJECTION_REC_MAJOR']='1'
                  extra['NUCLEUS_TRACE_PROJECTION_ACTUAL_HEAD']='1'
                  extra['NUCLEUS_TRACE_PROJECTION_LAST_FAILURE']='1'
                  extra['NUCLEUS_TRACE_PROJECTION_FIELD_FAILURE']='1'
                  extra['NUCLEUS_TRACE_PROJECTION_CHEAP']='1'
              p=subprocess.run(
                  ['/tmp/nucleus'],
                  input=(root/(name+'.ndjson')).read_bytes(),
                  stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                  timeout=120,
                  env=os.environ|extra)
              lines=p.stderr.decode(errors='replace').splitlines()
              downstream=[x for x in lines if 'NUCLEUS_DOWNSTREAM:' in x]
              local=[x for x in lines if 'NUCLEUS_TYPED_TELESCOPE:' in x]
              app=[x for x in lines if 'NUCLEUS_APPLICATION_FUNCTION_TYPE:' in x]
              major=[x for x in lines if 'NUCLEUS_NATREC_MAJOR_AUTHORITY:' in x]
              row={'case':name,'return_code':p.returncode,'downstream_last':downstream[-8:],
                   'typed_proofs':local[-4:],'app_errors':app[-4:],'major_census':major[-4:],
                   'neutral_mismatch':[x for x in lines if 'NUCLEUS_NEUTRAL_HEAD_MISMATCH:' in x][-25:],
                   'value_mismatch':[x for x in lines if 'NUCLEUS_VALUE_MISMATCH:' in x][-8:],
                   'projection_failure':[x for x in lines if 'NUCLEUS_PROJECTION_FIELD_PROBE:' in x][-8:],
                   'projection_exact_gap':[x for x in lines if 'NUCLEUS_POST_IOTA_PROJECTION_GAP:' in x][-8:],
                   'actual_head':[x for x in lines if 'NUCLEUS_PROJECTION_ACTUAL_HEAD:' in x][-8:],
                   'recursor_major':[x for x in lines if 'NUCLEUS_PROJECTION_REC_MAJOR:' in x][-6:],
                   'recursor_arg_obligations':[x for x in lines if 'NUCLEUS_MULPOS_REC_ARG_OBLIGATIONS:' in x][-8:],
                   'recursor_congruence':[x for x in lines if 'NUCLEUS_MULPOS_REC_CONGRUENCE:' in x][-24:],
                   'source_normalform':[x for x in lines if 'NUCLEUS_PROJECTION_NORMALFORM:' in x][-24:],
                   'projection_cheap':[x for x in lines if 'NUCLEUS_PROJECTION_CHEAP:' in x][-6:],
                   'dependency_gap':[x for x in lines if 'NUCLEUS_DEPENDENCY_GAP:' in x][-6:]}
              idx={0:''}
              for raw in (root/(name+'.ndjson')).read_bytes().splitlines():
                  j=json.loads(raw)
                  if 'in' not in j:
                      continue
                  z=j.get('str',j.get('num'))
                  prefix=idx.get(z['pre'],'')
                  idx[j['in']]=prefix+('.' if prefix else '')+str(z.get('str',z.get('i')))
              if 'magma-list-pair' in name:
                  row['neutral_head_names']={str(k):idx.get(k,'') for k in (169,147,75,62)}
              else:
                  import re
                  ids=set()
                  for line in row['actual_head']:
                      ids.update(int(v) for v in re.findall(r'NameId\((\d+)\)',line))
                  row['actual_head_names']={str(k):idx.get(k,'') for k in sorted(ids)}
              if name in ('init-prelude','perf/grind-ring-5'):
                  assert row['recursor_arg_obligations'], ('no comparable Nat.rec receiver obligations',name)
              print('POST_TELESCOPE_FIRST_BOUNDARY='+json.dumps(row),flush=True)
              rows.append(row)
          pathlib.Path('metatron-kernel/evidence-out/contextual-rigid/post-telescope-boundary.json').write_text(json.dumps(rows,indent=2))
          PY

      - name: Require unchanged full196 for three-constructor residual census
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures,collections,json,pathlib,subprocess,os
          root=pathlib.Path('/tmp/arena-tests')
          good=sorted((root/'good').rglob('*.ndjson'))
          bad=sorted((root/'bad').rglob('*.ndjson'))
          assert len(good)==125,(len(good),'good')
          assert len(bad)==71,(len(bad),'bad')
          def check(item):
              expected,path=item
              p=subprocess.run(
                  ['/tmp/nucleus'], input=path.read_bytes(),
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  timeout=120)
              assert p.returncode in (0,1,2), (expected,str(path),p.returncode)
              return {'expected':expected,'case':str(path.relative_to(root)),
                      'rc':p.returncode,'verdict':{0:'ACCEPT',1:'REJECT',2:'UNKNOWN'}[p.returncode]}
          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for row in pool.map(check,[('good',p) for p in good]+[('bad',p) for p in bad]):
                  rows.append(row)
          counts=dict(collections.Counter((r['expected'],r['verdict']) for r in rows))
          accepted=sum(r['expected']=='good' and r['rc']==0 for r in rows)
          rejected=sum(r['expected']=='bad' and r['rc']==1 for r in rows)
          unknown=sum(r['rc']==2 for r in rows)
          wrong=[r for r in rows if (r['expected']=='good' and r['rc']==1) or
                                    (r['expected']=='bad' and r['rc']==0)]
          out={'commit':os.environ['GITHUB_SHA'],'corpus':'11272848230',
               'arena_sha':'b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42',
               'accepted':accepted,'rejected':rejected,'unknown':unknown,
               'wrong':wrong,'rows':rows}
          path=pathlib.Path('metatron-kernel/evidence-out/final-qualification-v1/telescope-replay.json')
          path.write_text(json.dumps(out,indent=2))
          print('NUCLEUS_FULL196='+json.dumps({k:v for k,v in out.items() if k!='rows'}),flush=True)
          assert not wrong, 'UNSAFE_VERDICT_REGRESSION'
          assert rejected==71, 'EXPECTED_REJECT_REGRESSION'
          assert accepted==118 and unknown==7, 'LEAN_NAME_DIAGNOSTIC_CHANGED_FROZEN196'
          print('LEAN_NAME_FIRST_CONTRACT_DIAGNOSTIC_ONLY',flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-sourceinfo-synthetic-alias-${{ github.sha }}
          path: metatron-kernel/evidence-out
          if-no-files-found: warn

      - name: Publish exact commit-status and Actions run link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=failure
          if [ "${{ job.status }}" = "success" ]; then state=success; fi
          report=metatron-kernel/evidence-out/final-qualification-v1/telescope-replay.json
          description="Nucleus checked erasure full196: ${{ job.status }}"
          if [ -s "$report" ]; then
            description="$(python3 - "$report" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(f"typed telescope: {d['accepted']}A/{d['rejected']}R/{d['unknown']}U; wrong={len(d['wrong'])}")
          PY
          )"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="nucleus/sourceinfo-synthetic-alias" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
