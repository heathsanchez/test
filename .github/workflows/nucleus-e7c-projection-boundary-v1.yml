name: Nucleus Exact Cheap and Lazy Projection Boundary v1
on:
  push:
    branches: [nucleus-e7c-projection-boundary-v1]
    paths: [".github/workflows/nucleus-e7c-projection-boundary-v1.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projection-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NUCLEUS_SHA: e7c4855177eb2086c14e90b851be99062ee8c959
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      NUCLEUS_TRACE_DOWNSTREAM: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Build unchanged exact independent candidate
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$NUCLEUS_SHA"..HEAD -- metatron-kernel)"
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-e7c
          mkdir -p /tmp/projection-evidence
          sha256sum /tmp/nucleus-e7c > /tmp/projection-evidence/binary-sha256.txt
      - name: Export exactly the two new tests
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q "$ARENA_SHA"
          cd /tmp/arena
          nix develop -c ./lka.py build-test 'perf/proj-*-struct'
          cp _build/tests/perf/proj-*-struct.ndjson /tmp/projection-evidence/
          cp _build/tests/perf/proj-*-struct.stats.json /tmp/projection-evidence/
          sha256sum _build/tests/perf/proj-*-struct.ndjson > /tmp/projection-evidence/fixture-sha256.txt
      - name: Run exact pair through unchanged pinned lka.py
        run: |
          set -euo pipefail
          cd /tmp/arena
          cat > checkers/nucleus-e7c.yaml <<'YAML'
          version: "e7c4855177eb2086c14e90b851be99062ee8c959"
          description: Exact independent Nucleus projection compatibility diagnostic.
          run: /tmp/nucleus-e7c < "$IN"
          YAML
          nix develop -c ./lka.py -v run --checker nucleus-e7c --test 'perf/proj-*-struct'
          cp _results/nucleus-e7c_perf_proj-*-struct.json /tmp/projection-evidence/
          python3 - <<'PY'
          import pathlib,json,os
          rows=[json.loads(p.read_text()) for p in sorted(pathlib.Path("_results").glob("nucleus-e7c_perf_proj-*-struct.json"))]
          summary={"candidate_sha":os.environ["NUCLEUS_SHA"],"arena_sha":os.environ["ARENA_SHA"],"rows":rows,"accepted":sum(r["status"]=="accepted" for r in rows),"unknown":sum(r["status"]=="declined" for r in rows),"errors":sum(r["status"] in ("error","timeout") for r in rows)}
          pathlib.Path("/tmp/projection-evidence/summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,sort_keys=True))
          assert {r["test"] for r in rows}=={"perf/proj-cheap-struct","perf/proj-lazy-struct"}
          assert summary["accepted"]==2 and summary["unknown"]==0 and summary["errors"]==0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-e7c-projection-boundary-${{ github.sha }}
          path: /tmp/projection-evidence
