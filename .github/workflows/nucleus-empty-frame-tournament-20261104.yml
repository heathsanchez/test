name: Nucleus empty-frame composition tournament
on:
  push:
    branches: [research/nucleus-reuse-tournaments-20261104]
    paths: ['.github/workflows/nucleus-empty-frame-tournament-20261104.yml', 'experiments/nucleus-empty-frame-20261104/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore exact inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/current208 /tmp/tournament
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/inputs.zip
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/inputs.zip | sha256sum -c -
          unzip -q /tmp/inputs.zip -d /tmp/current208
      - name: Compare empty-frame reuse alone and stacked with both source experiments
        run: |
          python3 experiments/nucleus-empty-frame-20261104/wave2.py corpus --repo . --out /tmp/tournament --inputs /tmp/current208
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/tournament/state.json');s=json.loads(p.read_text())
          for name,row in s.items():row['additional_axis']='shared-empty-frame';row['actual_variant']=name+'-empty'
          p.write_text(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-empty-frame-tournament-${{ github.sha }}
          path: /tmp/tournament
          if-no-files-found: error
          compression-level: 1
