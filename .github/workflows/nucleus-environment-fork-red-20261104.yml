name: Nucleus staged environment allocation hypothesis RED
on:
  push:
    branches: [research/nucleus-environment-forks-20261104]
    paths:
      - '.github/workflows/nucleus-environment-fork-red-20261104.yml'
      - 'experiments/nucleus-environment-forks-20261104/red.py'
      - 'experiments/nucleus-environment-forks-20261104/red-test.patch'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expected-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin a2578e77079719ff2064f910bd82fd01d8e120b6
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Materialize exact qualified source and test-only allocation witness
        run: |
          set -euo pipefail
          mkdir -p /tmp/ac-qualified /tmp/dense-qualified
          gh api repos/heathsanchez/test/actions/artifacts/13276242300/zip > /tmp/ac-qualified.zip
          printf '%s  %s\n' a891c75dbcabd6fddfbbcc5b9ea6826a68b53cf51ae1fbc6e50fdae5d23c104e /tmp/ac-qualified.zip | sha256sum -c -
          unzip -q /tmp/ac-qualified.zip -d /tmp/ac-qualified
          gh api repos/heathsanchez/test/actions/artifacts/13269133385/zip > /tmp/dense-qualified.zip
          printf '%s  %s\n' 689749feedc5025f0672dd7e7b091944f700f5b15c9a8105753341db38575d22 /tmp/dense-qualified.zip | sha256sum -c -
          unzip -q /tmp/dense-qualified.zip -d /tmp/dense-qualified
      - name: Prepare source materializer fixtures
        run: |
          python3 experiments/nucleus-nat-closure-20261104/generate_fixtures.py --out /tmp/nat-fixtures
          python3 experiments/nucleus-parameter-telescope-20261104/prepare.py
          python3 experiments/nucleus-nullary-enum-20261104/prepare.py
      - name: Verify actual allocation assertion failure
        run: python3 experiments/nucleus-environment-forks-20261104/red.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-environment-fork-red-${{ github.sha }}
          path: /tmp/nucleus-environment-fork-red
