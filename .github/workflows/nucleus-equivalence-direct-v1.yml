name: Nucleus Equivalence direct export v1

on:
  push:
    branches: [nucleus-f682-iff-port-v1]
    paths:
      - ".github/workflows/nucleus-equivalence-direct-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: "d13f23b723b8a846827a245b89c10fc7d3f11612"
  LEAN4EXPORT_SHA: "66f1fb4bc256072069767fce52d39480e4524869"
  NUCLEUS_SHA: "5bc7193e750c0c61567ea99e1d6088ee6d2875c3"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Build rewritten authority
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$NUCLEUS_SHA"..HEAD -- metatron-kernel)"
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus

      - name: Export exact Init.Core Equivalence
        run: |
          set -euo pipefail
          git init -q /tmp/mathlib
          cd /tmp/mathlib
          git remote add origin https://github.com/leanprover-community/mathlib4
          git fetch --depth 1 origin "$MATHLIB_SHA"
          git checkout -q FETCH_HEAD
          TOOLCHAIN="$(cat lean-toolchain)"

          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          elan toolchain install "$TOOLCHAIN"
          elan default "$TOOLCHAIN"

          git init -q /tmp/lean4export
          cd /tmp/lean4export
          git remote add origin https://github.com/leanprover/lean4export
          git fetch --depth 1 origin "$LEAN4EXPORT_SHA"
          git checkout -q FETCH_HEAD
          printf '%s\n' "$TOOLCHAIN" > lean-toolchain
          lake build

          mkdir -p "$GITHUB_WORKSPACE/metatron-kernel/evidence-out/equivalence-direct-v1"
          lake env .lake/build/bin/lean4export Init.Core -- Equivalence \
            > "$GITHUB_WORKSPACE/metatron-kernel/evidence-out/equivalence-direct-v1/Equivalence.ndjson"

      - name: Summarize exact block and Nucleus verdict
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess,os,hashlib
          out=pathlib.Path("metatron-kernel/evidence-out/equivalence-direct-v1")
          p=out/"Equivalence.ndjson"
          names={0:""}; block=None
          for line in p.read_text().splitlines():
              r=json.loads(line)
              if "in" in r:
                  v=r.get("str",r.get("num"))
                  names[r["in"]]=names[v["pre"]]+("." if v["pre"] else "")+str(v.get("str",v.get("i")))
              if "inductive" in r:
                  for d in r["inductive"].get("types",[]):
                      if names.get(d["name"])=="Equivalence":
                          block=r["inductive"]; break
              if block is not None: break
          assert block is not None
          def named(d):
              z=dict(d); z["resolved_name"]=names.get(d.get("name")); return z
          q=subprocess.run(["/tmp/nucleus"],input=p.read_bytes(),stdout=subprocess.DEVNULL,
                           stderr=subprocess.PIPE,timeout=60,env=os.environ|{"NUCLEUS_TRACE_DOWNSTREAM":"1"})
          summary={
            "schema":"nucleus-equivalence-direct-v1",
            "authority_sha":os.environ["NUCLEUS_SHA"],
            "mathlib_sha":os.environ["MATHLIB_SHA"],
            "lean4export_sha":os.environ["LEAN4EXPORT_SHA"],
            "bytes":p.stat().st_size,
            "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "types":[named(x) for x in block.get("types",[])],
            "ctors":[named(x) for x in block.get("ctors",[])],
            "recs":[named(x) for x in block.get("recs",[])],
            "nucleus_exit":q.returncode,
            "stderr_tail":q.stderr.decode(errors="replace").splitlines()[-60:],
          }
          (out/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,sort_keys=True))
          assert q.returncode==2,summary
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-equivalence-direct-${{ github.sha }}
          path: metatron-kernel/evidence-out/equivalence-direct-v1
          if-no-files-found: error
