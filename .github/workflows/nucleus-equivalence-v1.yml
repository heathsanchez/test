name: Nucleus Equivalence v1

on:
  push:
    branches: [nucleus-equivalence-v1]
    paths:
      - ".github/workflows/nucleus-equivalence-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: "5bc7193e750c0c61567ea99e1d6088ee6d2875c3"
  ROUND1_ARTIFACT: "10712869614"
  CURRENT_TEST_ARTIFACT: "11090525747"
  MATHLIB_SHA: "d13f23b723b8a846827a245b89c10fc7d3f11612"
  LEAN4EXPORT_SHA: "66f1fb4bc256072069767fce52d39480e4524869"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build candidate and exact Iff-qualified base
        run: |
          set -euo pipefail
          ulimit -s 65536
          cargo fmt --manifest-path metatron-kernel/Cargo.toml
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-candidate
          git worktree add --detach /tmp/nucleus-base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/nucleus-base/metatron-kernel/Cargo.toml
          cp /tmp/nucleus-base/metatron-kernel/target/release/metatron-kernel /tmp/nucleus-base-bin

      - name: Export exact Init.Core Equivalence witness
        run: |
          set -euo pipefail
          git init -q /tmp/mathlib
          cd /tmp/mathlib
          git remote add origin https://github.com/leanprover-community/mathlib4
          git fetch --depth 1 origin "$MATHLIB_SHA"
          git checkout -q FETCH_HEAD
          TOOLCHAIN="$(cat lean-toolchain)"

          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          elan toolchain install "$TOOLCHAIN"
          elan default "$TOOLCHAIN"

          git init -q /tmp/lean4export
          cd /tmp/lean4export
          git remote add origin https://github.com/leanprover/lean4export
          git fetch --depth 1 origin "$LEAN4EXPORT_SHA"
          git checkout -q FETCH_HEAD
          printf '%s\n' "$TOOLCHAIN" > lean-toolchain
          lake build

          mkdir -p "$GITHUB_WORKSPACE/metatron-kernel/evidence-out/equivalence-v1"
          lake env .lake/build/bin/lean4export Init.Core -- Equivalence \
            > "$GITHUB_WORKSPACE/metatron-kernel/evidence-out/equivalence-v1/Equivalence.ndjson"

      - name: Causal Equivalence gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess,hashlib,os
          out=pathlib.Path("metatron-kernel/evidence-out/equivalence-v1")
          p=out/"Equivalence.ndjson"
          b=subprocess.run(["/tmp/nucleus-base-bin"],input=p.read_bytes(),stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=60)
          c=subprocess.run(["/tmp/nucleus-candidate"],input=p.read_bytes(),stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=60,env=os.environ|{"NUCLEUS_TRACE_DOWNSTREAM":"1","NUCLEUS_TRACE_PROP_SINGLETON":"1"})
          result={
            "schema":"nucleus-equivalence-v1",
            "base_sha":os.environ["BASE_SHA"],
            "candidate_sha":os.environ["GITHUB_SHA"],
            "witness_bytes":p.stat().st_size,
            "witness_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "base_exit":b.returncode,
            "candidate_exit":c.returncode,
            "candidate_stderr_tail":c.stderr.decode(errors="replace").splitlines()[-120:],
          }
          (out/"causal.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,sort_keys=True))
          assert (b.returncode,c.returncode)==(2,0),result
          PY

      - name: Fetch pinned 194 and 193 corpora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          mkdir -p /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip > /tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a1
          tar -xzf /tmp/a1/lean-arena-tests.tar.gz -C /tmp/r1
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/a2
          tar -xzf "$(find /tmp/a2 -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current

      - name: Differential 194 and 193 zero-wrong reclosure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess,hashlib,os
          base=pathlib.Path("/tmp/nucleus-base-bin"); cand=pathlib.Path("/tmp/nucleus-candidate")
          def one(binary,p):
              try:
                  with p.open("rb") as f:
                      q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=240)
                  return q.returncode
              except subprocess.TimeoutExpired:return 124
          def corpus(root):
              root=pathlib.Path(root); rows=[]
              for bucket,expected in [("good",0),("bad",1)]:
                  for p in sorted((root/bucket).rglob("*.ndjson")):
                      rows.append({"test":str(p.relative_to(root/bucket)).removesuffix(".ndjson"),
                          "expected":expected,"base":one(base,p),"candidate":one(cand,p),
                          "sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
              return rows
          def analyze(rows):
              wrong=[r for r in rows if r["candidate"] in (0,1) and r["candidate"]!=r["expected"]]
              regress=[r for r in rows if r["base"] in (0,1) and r["candidate"]!=r["base"]]
              errors=[r for r in rows if r["candidate"] not in (0,1,2,3)]
              changes=[r for r in rows if r["base"]!=r["candidate"]]
              return {"tests":len(rows),
                "base_accept":sum(r["expected"]==0 and r["base"]==0 for r in rows),
                "base_reject":sum(r["expected"]==1 and r["base"]==1 for r in rows),
                "base_residual":sum(r["base"] in (2,3) for r in rows),
                "candidate_accept":sum(r["expected"]==0 and r["candidate"]==0 for r in rows),
                "candidate_reject":sum(r["expected"]==1 and r["candidate"]==1 for r in rows),
                "candidate_residual":sum(r["candidate"] in (2,3) for r in rows),
                "wrong":wrong,"regressions":regress,"errors":errors,"changes":changes}
          r1=corpus("/tmp/r1"); cur=corpus("/tmp/current")
          a1=analyze(r1); ac=analyze(cur)
          result={"schema":"nucleus-equivalence-v1","base_sha":os.environ["BASE_SHA"],"candidate_sha":os.environ["GITHUB_SHA"],"round1":a1,"current":ac}
          pathlib.Path("metatron-kernel/evidence-out/equivalence-v1/reclosure.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,sort_keys=True))
          assert (a1["tests"],a1["base_accept"],a1["base_reject"],a1["base_residual"])==(193,103,60,30),a1
          assert (ac["tests"],ac["base_accept"],ac["base_reject"],ac["base_residual"])==(194,105,59,30),ac
          for a in (a1,ac):
              assert not a["wrong"],a["wrong"]
              assert not a["regressions"],a["regressions"]
              assert not a["errors"],a["errors"]
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-equivalence-${{ github.sha }}
          path: metatron-kernel/evidence-out/equivalence-v1
          if-no-files-found: error
