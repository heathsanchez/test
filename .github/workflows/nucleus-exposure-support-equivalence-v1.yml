name: Nucleus exposure support equivalence v1

on:
  push:
    branches: [nucleus-exposure-support-equivalence-v1]
    paths:
      - ".github/workflows/nucleus-exposure-support-equivalence-v1.yml"
      - "metatron-kernel/src/machine.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  ROUND1_ARTIFACT: "10712869614"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build diagnostic Nucleus
        run: |
          set -euo pipefail
          ulimit -s 65536
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r1 /tmp/a1
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip > /tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a1
          tar -xzf /tmp/a1/lean-arena-tests.tar.gz -C /tmp/r1

      - name: Measure support-equivalent exposure collisions
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/exposure-support-equivalence-v1
          python3 - <<'PY'
          import json,pathlib,subprocess,time,os,re

          def prefix(path,target):
              names={0:""}; rows=[]
              for line in pathlib.Path(path).read_text().splitlines():
                  r=json.loads(line); rows.append(line)
                  if "in" in r:
                      v=r.get("str",r.get("num"))
                      if isinstance(v,dict):
                          pre=v.get("pre",0); atom=v.get("str",v.get("i",v.get("num","?")))
                          names[r["in"]]=names.get(pre,f"#{pre}")+("." if pre else "")+str(atom)
                  ds=[]
                  if "inductive" in r:
                      for k in ("types","ctors","recs"): ds.extend(r["inductive"].get(k,[]))
                  for k in ("def","thm","axiom","opaque","quot"):
                      if k in r and isinstance(r[k],dict): ds.append(r[k])
                  if any(names.get(d.get("name"))==target for d in ds if isinstance(d,dict)):
                      return ("\n".join(rows)+"\n").encode()
              raise RuntimeError(target)

          data=prefix("/tmp/r1/good/perf/fueled-chain.ndjson","chain6_datF")
          env=os.environ|{"NUCLEUS_TRACE_EXPOSURE_SUPPORT":"1","NUCLEUS_TRACE_DOWNSTREAM":"1"}
          t=time.monotonic()
          try:
              q=subprocess.run(["/tmp/nucleus"],input=data,stdout=subprocess.DEVNULL,
                               stderr=subprocess.PIPE,timeout=10,env=env)
              exit_code=q.returncode
              err=q.stderr.decode(errors="replace")
          except subprocess.TimeoutExpired as e:
              exit_code=124
              err=e.stderr.decode(errors="replace") if isinstance(e.stderr,(bytes,bytearray)) else (e.stderr or "")
          seconds=time.monotonic()-t
          all_lines=err.splitlines()
          markers=[x for x in all_lines if x.startswith("NUCLEUS_EXPOSURE_SUPPORT:")]
          expression_markers=[x for x in all_lines if x.startswith("NUCLEUS_EXPOSURE_EXPR:")]
          parsed=[]
          for line in markers:
              row={}
              for key in ("collisions","exact_value","support_value","support_difference","seen"):
                  m=re.search(rf"{key}=(\d+)",line)
                  row[key]=int(m.group(1)) if m else None
              parsed.append(row)
          last=parsed[-1] if parsed else None
          per_expr={}
          for line in expression_markers:
              def field(name):
                  m=re.search(rf"{name}=([^:]+)",line)
                  return m.group(1) if m else None
              expr=int(field("expr"))
              row={
                  "transparency":int(field("transparency")),
                  "expr":expr,
                  "kind":field("kind"),
                  "collisions":int(field("collisions")),
                  "exact_value":int(field("exact_value")),
                  "support_value":int(field("support_value")),
                  "support_difference":int(field("support_difference")),
              }
              per_expr[(row["transparency"],expr)]=row
          ranked=sorted(per_expr.values(),key=lambda x:x["collisions"],reverse=True)
          zero_difference=[x for x in ranked if x["support_difference"]==0]
          result={
              "candidate_sha":os.environ["GITHUB_SHA"],
              "chain6_exit":exit_code,
              "seconds":seconds,
              "marker_count":len(markers),
              "expression_marker_count":len(expression_markers),
              "last":last,
              "top_zero_difference":zero_difference[:30],
              "top_all":ranked[:30],
              "tail":markers[-20:],
          }
          out=pathlib.Path("metatron-kernel/evidence-out/exposure-support-equivalence-v1/result.json")
          out.write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result),flush=True)
          assert markers,result
          assert last["collisions"]>0,result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-exposure-support-equivalence-${{ github.sha }}
          path: metatron-kernel/evidence-out/exposure-support-equivalence-v1
          if-no-files-found: warn
