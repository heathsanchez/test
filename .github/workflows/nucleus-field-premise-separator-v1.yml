name: Nucleus field argument left-right-defeq triad separator

on:
  push:
    branches: [nucleus-argument-premise-triad-v1]
    paths:
      - ".github/scripts/nucleus_field_premise_trace_patch_v1.py"
      - ".github/scripts/nucleus_argument_premise_triad_patch_v1.py"
      - ".github/workflows/nucleus-field-premise-separator-v1.yml"
      - ".github/scripts/nucleus_field_application_patch_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-first-premise:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      ARENA_ARTIFACT: "11272848230"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_NET_RETRY: "8"
      CARGO_HTTP_LOW_SPEED_LIMIT: "0"
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test unmodified source with bounded instrumented candidate
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-field-premise-evidence
          git rev-parse HEAD > /tmp/nucleus-field-premise-evidence/source-commit.txt
          sha256sum .github/scripts/nucleus_*patch_v1.py > /tmp/nucleus-field-premise-evidence/patches.sha256
          cargo fetch --locked --manifest-path metatron-kernel/Cargo.toml
          python3 .github/scripts/nucleus_contextual_capability_patch_v1.py metatron-kernel
          python3 .github/scripts/nucleus_field_application_patch_v1.py metatron-kernel
          python3 .github/scripts/nucleus_field_premise_trace_patch_v1.py metatron-kernel
          python3 .github/scripts/nucleus_argument_premise_triad_patch_v1.py metatron-kernel
          git diff --check
          git diff -- metatron-kernel/src/typecheck.rs metatron-kernel/src/convert.rs > /tmp/nucleus-field-premise-evidence/diagnostic-patch.diff
          NUCLEUS_EXPERIMENTAL_RELEVANCE=1 NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION=1 cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml 2>&1 | tee /tmp/nucleus-field-premise-evidence/tests.txt
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-field-premise
          sha256sum /tmp/nucleus-field-premise > /tmp/nucleus-field-premise-evidence/binary.sha256
      - name: Acquire source-pinned frozen196 authoritative fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-field-arena-artifact /tmp/nucleus-field-arena-tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/nucleus-field-arena.zip
          unzip -q /tmp/nucleus-field-arena.zip -d /tmp/nucleus-field-arena-artifact
          tar --no-same-owner -xzf /tmp/nucleus-field-arena-artifact/lean-arena-tests.tar.gz -C /tmp/nucleus-field-arena-tests

      - name: Diagnose first failing true kernel premise on exact seven positives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,hashlib,json,os,pathlib,re,subprocess
          root=pathlib.Path("/tmp/nucleus-field-arena-tests/good")
          evidence=pathlib.Path("/tmp/nucleus-field-premise-evidence")
          controls={
            "NUCLEUS_EXPERIMENTAL_RELEVANCE":"1",
            "NUCLEUS_EXPERIMENTAL_CONTEXT_BINDER":"1",
            "NUCLEUS_EXPERIMENTAL_TYPED_LINEAGE":"1",
            "NUCLEUS_EXPERIMENTAL_SUBSTITUTION_RECLOSURE":"1",
            "NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION":"1",
            "NUCLEUS_EXPERIMENTAL_CERTIFIED_FIELD_APPLICATION":"1",
            "NUCLEUS_TRACE_FIELD_APP_FIRST_FAIL":"1",
            "NUCLEUS_TRACE_CERTIFIED_FIELD_APPLICATION":"1",
          }
          names=[
            "init-prelude","perf/grind-ring-5",
            "perf/magma-list-pair-n7","perf/magma-list-pair-n21",
            "perf/magma-list-deep-n21","perf/magma-list-deep-n36",
            "perf/fueled-chain",
          ]
          rows=[]
          for name in names:
            p=root/(name+".ndjson")
            with p.open("rb") as f:
              result=subprocess.run(["/tmp/nucleus-field-premise"],stdin=f,
                  stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                  env=os.environ|controls,timeout=180)
            lines=result.stderr.decode(errors="replace").splitlines()
            matches=[s for s in lines if "NUCLEUS_FIELD_APP_FIRST_FAIL:stage=" in s]
            counts=collections.Counter(int(re.search(r"stage=(\d+)",s).group(1)) for s in matches)
            successes=sum("NUCLEUS_FIELD_APP_PROVEN:" in s for s in lines)
            row={"case":name,"verdict":result.returncode,"source_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
              "failure_stages_logged":dict(sorted(counts.items())),"field_app_successes_logged":successes}
            print("NUCLEUS_FIRST_PREMISE="+json.dumps(row),flush=True)
            assert result.returncode in (0,2),row
            rows.append(row)
          (evidence/"exact-first-premise.json").write_text(json.dumps({
            "source_commit":os.environ["GITHUB_SHA"],
            "arena_source":os.environ["ARENA_SHA"],
            "artifact":os.environ["ARENA_ARTIFACT"],
            "verifier_scope":"Diagnostics only; no rule changed versus full protected field experiment",
            "rows":rows},indent=2)+"\n")
          assert len(rows)==7
          PY
      - name: Retain exact source and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-field-first-premise-${{ github.sha }}
          path: /tmp/nucleus-field-premise-evidence/
          if-no-files-found: warn
