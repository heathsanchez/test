name: Nucleus Fin Val v1

on:
  push:
    branches: [nucleus-fin-val-v1]
    paths:
      - ".github/workflows/nucleus-fin-val-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-fin-val-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      BASE_SHA: 57115bfbde93b55824991a6800182cc3c75fa5a4
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prove independent runtime boundary
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs

      - name: Build and test candidate
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --release --locked
          cargo build --release --locked

      - name: Build exact independent base
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Global 193-case reclosure and downstream trace
        working-directory: metatron-kernel
        timeout-minutes: 70
        run: |
          set -euo pipefail
          mkdir -p evidence-out/fin-val-v1
          python - <<'PY'
          import json, os, pathlib, subprocess, time
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('target/release/metatron-kernel').resolve()

          def rr(binary,p,trace=False):
              env=dict(os.environ)
              if trace:
                  env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              start=time.perf_counter()
              try:
                  with p.open('rb') as f:
                      q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,env=env,timeout=180)
                  return q.returncode,time.perf_counter()-start,q.stderr.decode(errors='replace')
              except subprocess.TimeoutExpired:
                  return 124,time.perf_counter()-start,'timeout'

          rows=[]
          for kind,expected in [('good',0),('bad',1)]:
              for p in sorted((root/kind).rglob('*.ndjson')):
                  name=str(p.relative_to(root/kind)).removesuffix('.ndjson')
                  a,asec,ae=rr(base,p); b,bsec,be=rr(cand,p)
                  rows.append({'test':name,'expected':expected,'base':a,'candidate':b,
                               'base_seconds':asec,'candidate_seconds':bsec,
                               'candidate_stderr':be[-1000:] if b not in (0,1,2,3) else ''})
          assert len(rows)==193
          assert sum(r['base'] in (2,3) for r in rows)==41
          fa=[r for r in rows if r['expected']==1 and r['candidate']==0]
          fr=[r for r in rows if r['expected']==0 and r['candidate']==1]
          reg=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          wrong=[r for r in rows if r['base'] in (2,3) and r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]

          targets=[
            ('good','perf/magma-list-deep-n21',0),
            ('good','perf/magma-list-deep-n36',0),
            ('bad','bugs/proj-of-stuck-prop',1),
            ('bad','bugs/proj-of-subst-prop',1),
            ('bad','bugs/rec-of-subst-prop',1),
          ]
          traces=[]
          for kind,name,expected in targets:
              p=root/kind/(name+'.ndjson')
              rc,sec,stderr=rr(cand,p,True)
              events=[line for line in stderr.splitlines()
                      if line.startswith('NUCLEUS_DECL:') or line.startswith('NUCLEUS_RESIDUAL:')]
              decls=[x.split('NUCLEUS_DECL:',1)[1] for x in events if x.startswith('NUCLEUS_DECL:')]
              residuals=[x.split('NUCLEUS_RESIDUAL:',1)[1] for x in events if x.startswith('NUCLEUS_RESIDUAL:')]
              traces.append({'test':name,'expected':expected,'rc':rc,'seconds':sec,
                             'terminal_decl':decls[-1] if decls else None,
                             'terminal_residual':residuals[-1] if residuals else None,
                             'events':events})

          out={
            'schema':'nucleus-fin-val-v1',
            'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
            'base_residual':sum(r['base'] in (2,3) for r in rows),
            'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
            'candidate_accept':sum(r['candidate']==0 for r in rows),
            'candidate_reject':sum(r['candidate']==1 for r in rows),
            'earned':[r['test'] for r in earned],
            'changes':[r for r in rows if r['base']!=r['candidate']],
            'false_accepts':fa,'false_rejects':fr,'regressions':reg,'wrong_deltas':wrong,'errors':errors,
            'target_traces':traces,
          }
          pathlib.Path('evidence-out/fin-val-v1/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
            'base_residual':out['base_residual'],'candidate_residual':out['candidate_residual'],
            'earned':out['earned'],
            'changes':[(r['test'],r['base'],r['candidate']) for r in out['changes']],
            'target_traces':[{'test':t['test'],'rc':t['rc'],'terminal_decl':t['terminal_decl'],
                              'terminal_residual':t['terminal_residual']} for t in traces],
          },sort_keys=True))
          assert not fa,fa
          assert not fr,fr
          assert not reg,reg
          assert not wrong,wrong
          assert not errors,errors
          assert earned, "exact Fin.val law earned no protected consequence"
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-fin-val-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/fin-val-v1
          if-no-files-found: warn
