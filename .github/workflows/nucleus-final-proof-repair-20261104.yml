name: Nucleus final-proof congruence repair qualification
on:
  push:
    branches: [research/nucleus-reuse-tournaments-20261104]
    paths: ['.github/workflows/nucleus-final-proof-repair-20261104.yml', 'experiments/nucleus-final-proof-spine-20261104/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/nucleus-final-proof-spine-20261104/lean-reference
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Independent Lean kernel positive and forged controls
        working-directory: experiments/nucleus-final-proof-spine-20261104/lean-reference
        run: |
          set -euo pipefail
          mkdir -p /tmp/reference
          lean --version > /tmp/reference/version.txt
          lake build Reference > /tmp/reference/positive.log 2>&1
          lake env leanchecker Reference > /tmp/reference/recheck.log 2>&1
          for file in WrongData WrongHead DataSlot WrongProp; do
            if lake env lean "$file.lean" > "/tmp/reference/$file.log" 2>&1; then
              echo "Forged control unexpectedly compiled: $file"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-final-proof-lean-reference-${{ github.sha }}
          path: /tmp/reference
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Preserve reusable exact source snapshot
        run: git archive a2578e77079719ff2064f910bd82fd01d8e120b6 metatron-kernel | zstd -T0 -3 -o /tmp/nucleus-source-a2578e7.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-source-a2578e7
          path: /tmp/nucleus-source-a2578e7.tar.zst
          compression-level: 0
      - name: Restore exact corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/current208
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/inputs.zip
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/inputs.zip | sha256sum -c -
          unzip -q /tmp/inputs.zip -d /tmp/current208
      - name: Native, source-prefix, property and exact corpus qualification
        run: python3 experiments/nucleus-final-proof-spine-20261104/runner.py qualify --out /tmp/repair-qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-final-proof-qualification-${{ github.sha }}
          path: |
            /tmp/repair-qualification/*.json
            /tmp/repair-qualification/*/*.json
            /tmp/repair-qualification/*/*.log
            /tmp/repair-qualification/*/source.patch
            /tmp/repair-qualification/*/nucleus
  mathlib:
    needs: [reference, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Reuse the exact complete Mathlib input
        run: |
          set -euo pipefail
          mkdir -p /tmp/input
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/input.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/input.zip | sha256sum -c -
          unzip -q /tmp/input.zip -d /tmp/input
          zstd -d /tmp/input/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib.ndjson | sha256sum -c -
          rm /tmp/input.zip /tmp/input/mathlib.ndjson.zst
      - name: Complete independent Mathlib check and retain any next frontier
        run: python3 experiments/nucleus-final-proof-spine-20261104/runner.py full --out /tmp/repair-mathlib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-final-proof-mathlib-${{ github.sha }}
          path: |
            /tmp/repair-mathlib/*.json
            /tmp/repair-mathlib/*.zst
            /tmp/repair-mathlib/full-input
            /tmp/repair-mathlib/candidate/build.log
            /tmp/repair-mathlib/candidate/source.patch
