name: Nucleus independent Flash semantic separator census

on:
  push:
    branches: [nucleus-flash-semantic-separator-v1]
    paths:
      - ".github/workflows/nucleus-flash-semantic-separator-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      ARENA_ARTIFACT: "11272848230"
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      FLASH_SOURCE: 78c7502bac8a5ba000057b3f083bc0595ac65750
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch immutable Arena witnesses and separate frozen MathGraph Flash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests research/nucleus-evidence
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
          git clone --branch flash --depth 1 https://github.com/metalogiclabs/mathgraph-lean-kernel.git /tmp/flash
          git -C /tmp/flash fetch --depth 1 origin "$FLASH_SOURCE"
          git -C /tmp/flash checkout --detach "$FLASH_SOURCE"
          test "$(git -C /tmp/flash rev-parse HEAD)" = "$FLASH_SOURCE"
          printf 'flash_source=%s\n' "$FLASH_SOURCE"
          printf 'audit_source=%s\n' "$GITHUB_SHA"
          sha256sum /tmp/flash/Cargo.lock

      - name: Build independent pinned development oracle
        run: |
          set -euo pipefail
          cd /tmp/flash
          cargo build --release --locked
          test -x target/release/sokonanoda
          cat > config.json <<'JSON'
          {
            "use_stdin":true,
            "nat_extension":true,
            "string_extension":true,
            "unpermitted_axiom_hard_error":false,
            "unsafe_permit_all_axioms":true,
            "num_threads":2
          }
          JSON
          sha256sum target/release/sokonanoda config.json

      - name: Independently replay exact seven and protected malformed controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,time
          src=pathlib.Path('/tmp/arena-tests')
          binary='/tmp/flash/target/release/sokonanoda'
          config='/tmp/flash/config.json'
          positives=['init-prelude','perf/grind-ring-5','perf/magma-list-pair-n7',
              'perf/magma-list-pair-n21','perf/magma-list-deep-n21',
              'perf/magma-list-deep-n36','perf/fueled-chain']
          cases=[('good',n,src/'good'/(n+'.ndjson')) for n in positives]
          cases.append(('bad','bugs/nested-unused-param',src/'bad/bugs/nested-unused-param.ndjson'))
          result=[]
          for kind,name,path in cases:
              start=time.monotonic()
              data=path.read_bytes()
              try:
                  p=subprocess.run([binary,config],cwd='/tmp/flash',input=data,
                      stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=240)
                  rc=p.returncode
                  err=p.stderr.decode(errors='replace')[-800:]
              except subprocess.TimeoutExpired:
                  rc=124
                  err='TIMEOUT'
              row={'source':name,'kind':kind,'rc':rc,
                   'elapsed_s':round(time.monotonic()-start,3),
                   'sha256':hashlib.sha256(data).hexdigest(),
                   'stderr_tail':err}
              result.append(row)
              print('NUCLEUS_FLASH_INDEPENDENT='+json.dumps(row),flush=True)
          summary={'source':os.environ['FLASH_SOURCE'],'arena':os.environ['ARENA_SHA'],
                   'artifact':os.environ['ARENA_ARTIFACT'],'checks':result,
                   'accepted_good':sum(x['kind']=='good' and x['rc']==0 for x in result),
                   'accepted_bad':sum(x['kind']=='bad' and x['rc']==0 for x in result)}
          pathlib.Path('research/nucleus-evidence/flash-semantic-separator.json').write_text(
              json.dumps(summary,indent=2))
          print('NUCLEUS_FLASH_SEMANTIC_SEPARATOR='+json.dumps({
              'accepted_good':summary['accepted_good'],
              'accepted_bad':summary['accepted_bad'],
              'results':[(x['source'],x['rc']) for x in result],
          }),flush=True)
          assert summary['accepted_bad']==0,'INDEPENDENT_ORACLE_INVALID_ACCEPT'
          print('REFERENCE_ORACLE_ONLY__NUCLEUS_SCORE_UNCHANGED',flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-flash-semantic-separator-${{ github.sha }}
          path: research/nucleus-evidence/flash-semantic-separator.json
          if-no-files-found: warn
