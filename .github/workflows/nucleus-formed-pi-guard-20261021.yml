name: Nucleus source-formed Pi guarded conversion A/B
on:
  push:
    branches: [research/nucleus-formed-pi-guard-20261021]
    paths:
      - 'metatron-kernel/src/typecheck.rs'
      - '.github/scripts/nucleus_formed_pi_guard_gate_20261021.py'
      - '.github/workflows/nucleus-formed-pi-guard-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-source-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Freeze original and candidate independent source
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-pi-guard-evidence /tmp/nucleus-pi-guard-artifact /tmp/nucleus-pi-guard-corpus
          git rev-parse HEAD > /tmp/nucleus-pi-guard-evidence/candidate-research-sha.txt
          git fetch --no-tags --depth=1 origin ff003e7fad888d39a40cfd2375885fe20e3209fa
          git worktree add --detach /tmp/nucleus-pi-guard-control ff003e7fad888d39a40cfd2375885fe20e3209fa
          test "$(git -C /tmp/nucleus-pi-guard-control rev-parse HEAD:metatron-kernel)" = 5e7d65b1b6abc3f6380bc7a37ffb153284d7faf1
          git diff --check ff003e7fad888d39a40cfd2375885fe20e3209fa
          git diff --name-only ff003e7fad888d39a40cfd2375885fe20e3209fa -- metatron-kernel > /tmp/nucleus-pi-guard-evidence/semantic-paths.txt
          test "$(cat /tmp/nucleus-pi-guard-evidence/semantic-paths.txt)" = "metatron-kernel/src/typecheck.rs" || {
             echo "UNEXPECTED_CHECKER_SOURCE_CHANGES"; cat /tmp/nucleus-pi-guard-evidence/semantic-paths.txt; exit 1;
          }
          git diff ff003e7fad888d39a40cfd2375885fe20e3209fa -- metatron-kernel/src/typecheck.rs > /tmp/nucleus-pi-guard-evidence/source-candidate.diff
          rustc -vV > /tmp/nucleus-pi-guard-evidence/compiler.txt
      - name: Check Rust unit tests and compile both actual source variants
        run: |
          set -euo pipefail
          NUCLEUS_EXPERIMENTAL_RELEVANCE=1 NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA=1 \
            cargo test --release --locked --features diagnostics \
              --manifest-path metatron-kernel/Cargo.toml \
              > /tmp/nucleus-pi-guard-evidence/native-tests.log 2>&1 || {
                tail -80 /tmp/nucleus-pi-guard-evidence/native-tests.log; exit 1;
              }
          CARGO_TARGET_DIR=/tmp/nucleus-pi-guard-control-build \
            cargo build --release --locked --features diagnostics \
              --manifest-path /tmp/nucleus-pi-guard-control/metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp /tmp/nucleus-pi-guard-control-build/release/metatron-kernel /tmp/nucleus-pi-guard-control-bin
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-pi-guard-candidate-bin
          sha256sum /tmp/nucleus-pi-guard-{control,candidate}-bin > /tmp/nucleus-pi-guard-evidence/binaries.sha256
      - name: Obtain original SHA-frozen Arena cases
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/nucleus-pi-guard-original.zip
          sha256sum /tmp/nucleus-pi-guard-original.zip > /tmp/nucleus-pi-guard-evidence/original-archive.sha256
          unzip -q /tmp/nucleus-pi-guard-original.zip -d /tmp/nucleus-pi-guard-artifact
          tar --no-same-owner -xzf /tmp/nucleus-pi-guard-artifact/lean-arena-tests.tar.gz -C /tmp/nucleus-pi-guard-corpus
          test -s /tmp/nucleus-pi-guard-corpus/good/perf/magma-list-deep-n21.ndjson
      - name: Causal frozen196 source-valid and adversarial negative gate
        run: |
          set -euo pipefail
          python3 .github/scripts/nucleus_formed_pi_guard_gate_20261021.py \
            /tmp/nucleus-pi-guard-corpus /tmp/nucleus-pi-guard-control-bin \
            /tmp/nucleus-pi-guard-candidate-bin /tmp/nucleus-pi-guard-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-source-formed-pi-guard-${{ github.sha }}
          path: /tmp/nucleus-pi-guard-evidence/
          if-no-files-found: warn
