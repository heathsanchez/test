name: Nucleus Lean.Syntax nested separator v1

on:
  push:
    branches: [nucleus-symbolic-ble-subsucc-defeq-v1]
    paths:
      - ".github/workflows/nucleus-fueled-inductives-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_COMMIT: 70305b761aaee001c2efb06fe7022a1086bc35e4
      SOURCE_SUBTREE: d4c97dc8360da14aa60b9f588cd1675ce20a7d47
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      ARENA_ARTIFACT: "11272848230"
      MATHLIB_ARENA_SHA: 4c30c4ac4f14a3a899116beb3ea6131880e79a98
      MATHLIB_SHA256: 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Bind exact corrected source tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel)" = "$SOURCE_SUBTREE"
          printf '%s\n' "source_commit=$SOURCE_COMMIT" "source_subtree=$SOURCE_SUBTREE" "qualification_commit=$GITHUB_SHA"

      - name: Build and test corrected Nucleus
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus

      - name: Fetch immutable 196-case Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests metatron-kernel/evidence-out/final-qualification-v1
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests

      - name: Reclose corrected 196-case frontier
        run: |
          set -euo pipefail
          ulimit -s 8192
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time

          rows = []
          for bucket, expected in (("good", 0), ("bad", 1)):
              root = pathlib.Path("/tmp/arena-tests") / bucket
              for fixture in sorted(root.rglob("*.ndjson")):
                  started = time.monotonic()
                  with fixture.open("rb") as source:
                      process = subprocess.run(
                          ["/tmp/nucleus"],
                          stdin=source,
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.PIPE,
                          timeout=30,
                          env=os.environ | {"NUCLEUS_TRACE_DOWNSTREAM": "1"},
                      )
                  rows.append({
                      "test": str(fixture.relative_to(root)),
                      "expected": expected,
                      "actual": process.returncode,
                      "seconds": time.monotonic() - started,
                      "stderr": process.stderr.decode(errors="replace"),
                      "fixture_sha256": hashlib.sha256(fixture.read_bytes()).hexdigest(),
                  })

          counts = {
              "accept": sum(r["expected"] == 0 and r["actual"] == 0 for r in rows),
              "reject": sum(r["expected"] == 1 and r["actual"] == 1 for r in rows),
              "unknown": sum(r["actual"] == 2 for r in rows),
          }
          wrong = [r for r in rows if r["actual"] in (0, 1) and r["actual"] != r["expected"]]
          errors = [r for r in rows if r["actual"] not in (0, 1, 2)]
          unknowns = sorted(r["test"].removesuffix(".ndjson") for r in rows if r["actual"] == 2)
          report = {
              "schema": "nucleus-fueled-inductives-v1-arena",
              "qualification_commit": os.environ["GITHUB_SHA"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_subtree": os.environ["SOURCE_SUBTREE"],
              "arena_sha": os.environ["ARENA_SHA"],
              "artifact_id": int(os.environ["ARENA_ARTIFACT"]),
              "counts": counts,
              "wrong": wrong,
              "errors": errors,
              "unknowns": unknowns,
              "rows": rows,
          }
          output = pathlib.Path("metatron-kernel/evidence-out/final-qualification-v1/arena.json")
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps({k: v for k, v in report.items() if k != "rows"}, sort_keys=True))

          assert len(rows) == 196, len(rows)
          assert counts == {"accept": 115, "reject": 71, "unknown": 10}, counts
          assert not wrong, wrong
          assert not errors, errors
          by_test = {r["test"].removesuffix(".ndjson"): r for r in rows}
          assert by_test["bugs/nested-unused-param"]["actual"] == 1, by_test["bugs/nested-unused-param"]
          PY

      - uses: cachix/install-nix-action@v31

      - uses: actions/cache@v4
        id: export-cache
        with:
          path: /tmp/arena/_build/tests/mathlib.ndjson
          key: nucleus-mathlib-export-arena4c30c4ac-mathlibd13f23b7-exporter66f1fb4b

      - name: Build immutable Mathlib export
        if: steps.export-cache.outputs.cache-hit != 'true'
        timeout-minutes: 150
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q "$MATHLIB_ARENA_SHA"
          cd /tmp/arena
          nix develop -c ./lka.py build-test mathlib

      - name: Verify Mathlib export identity
        run: |
          set -euo pipefail
          test -f /tmp/arena/_build/tests/mathlib.ndjson
          echo "$MATHLIB_SHA256  /tmp/arena/_build/tests/mathlib.ndjson" | sha256sum -c -
          stat -c 'mathlib_bytes=%s' /tmp/arena/_build/tests/mathlib.ndjson
          wc -l /tmp/arena/_build/tests/mathlib.ndjson

      - name: Replay full Mathlib after List.Perm
        timeout-minutes: 30
        run: |
          set -euo pipefail
          out=metatron-kernel/evidence-out/final-qualification-v1
          set +e
          ulimit -s unlimited
          NUCLEUS_TRACE_DOWNSTREAM=1 \
          /usr/bin/time -f 'real_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M' \
            -o "$out/mathlib-time.txt" \
            /tmp/nucleus \
            < /tmp/arena/_build/tests/mathlib.ndjson \
            > "$out/mathlib-stdout.txt" \
            2> "$out/mathlib-stderr.txt"
          rc=$?
          set -e
          echo "$rc" > "$out/mathlib-exit.txt"
          python3 - <<'PY'
          import json, os, pathlib

          out = pathlib.Path("metatron-kernel/evidence-out/final-qualification-v1")
          rc = int((out / "mathlib-exit.txt").read_text().strip())
          stderr = (out / "mathlib-stderr.txt").read_text(errors="replace").splitlines()
          downstream = [line for line in stderr if "NUCLEUS_DOWNSTREAM:" in line]
          report = {
              "schema": "nucleus-fueled-inductives-v1-mathlib",
              "qualification_commit": os.environ["GITHUB_SHA"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_subtree": os.environ["SOURCE_SUBTREE"],
              "mathlib_ref": "v4.34.1",
              "mathlib_rev": "d13f23b723b8a846827a245b89c10fc7d3f11612",
              "export_sha256": os.environ["MATHLIB_SHA256"],
              "rc": rc,
              "verdict": {0: "ACCEPT", 1: "REJECT", 2: "UNKNOWN", 3: "ERROR"}.get(rc, "ERROR"),
              "downstream_tail": downstream[-50:],
          }
          (out / "mathlib.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, sort_keys=True))
          assert rc in (0, 2), report
          PY
          cat "$out/mathlib-time.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-fueled-inductives-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/final-qualification-v1
          if-no-files-found: error
