name: Nucleus full Mathlib first-UNKNOWN evidence retrieval
on:
  push:
    branches: [research/nucleus-deferred-projection-congruence-20261105]
    paths:
      - '.github/workflows/nucleus-full-mathlib-residual-retrieval-20261105.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the immutable Mathlib replay artifact without rerunning or altering the checker
        run: |
          set -euo pipefail
          mkdir -p causal
          gh api repos/heathsanchez/test/actions/artifacts/13377771876/zip > full-mathlib-evidence.zip
          printf '%s  %s\n' 699da072ffc367c84cc168d7e1c7eec48e6572c6316ac33d43cc17944816cf65 full-mathlib-evidence.zip | sha256sum -c -
          unzip -Z -1 full-mathlib-evidence.zip | tee causal/entry-list.txt
          for entry in mathlib.status mathlib-record-count.txt mathlib-sha256.txt generated-prefix-sha256.txt prefix-comparison.txt candidate-binary-sha256.txt; do
            unzip -p full-mathlib-evidence.zip "$entry" > "causal/$entry"
            test -s "causal/$entry"
          done
          unzip -p full-mathlib-evidence.zip mathlib.stderr.zst | zstd -dc > causal/mathlib.stderr
          unzip -p full-mathlib-evidence.zip mathlib.stdout > causal/mathlib.stdout
          sha256sum causal/mathlib.stderr | tee causal/stderr-sha256.txt
          wc -c causal/mathlib.stderr causal/mathlib.stdout
          printf 'FIRST LINES OF CAUSAL STDERR\n'
          head -n 35 causal/mathlib.stderr | cut -c1-1000
          printf 'LAST LINES OF CAUSAL STDERR\n'
          tail -n 55 causal/mathlib.stderr | cut -c1-1000
          printf 'TOP-LEVEL FULL MATHLIB VERDICT\n'
          cat causal/mathlib.status
          zstd -q -3 -f causal/mathlib.stderr -o causal/mathlib.stderr.zst
      - name: Replay archived identical Mathlib and checker with source-owned terminal trace
        run: |
          set -euo pipefail
          unzip -p full-mathlib-evidence.zip candidate/nucleus > causal/nucleus
          chmod +x causal/nucleus
          printf '%s  %s\n' "$(cut -d ' ' -f1 causal/candidate-binary-sha256.txt)" causal/nucleus | sha256sum -c -
          unzip -p full-mathlib-evidence.zip qualified/qualification.json > causal/qualification.json
          test -s causal/qualification.json
          mapfile -t flags < <(jq -r '.candidate.configuration | to_entries[] | "\(.key)=\(.value)"' causal/qualification.json)
          set +e
          unzip -p full-mathlib-evidence.zip mathlib-full.ndjson.zst | zstd -dc | \
            env "${flags[@]}" NUCLEUS_EXPERIMENTAL_DEFERRED_PROJECTION_CONGRUENCE=1 NUCLEUS_TRACE_DOWNSTREAM=1 \
            timeout 1500 causal/nucleus > causal/trace.stdout 2> causal/trace.stderr
          results=("${PIPESTATUS[@]}")
          set -e
          printf 'zip_read=%s\tzstd=%s\tchecker=%s\n' "${results[0]}" "${results[1]}" "${results[2]}" | tee causal/trace-status.tsv
          test "${results[0]}" -eq 0
          test "${results[1]}" -eq 0
          test "${results[2]}" -eq 2
          printf 'FIRST CAUSAL UNKNOWN IN EXACT-ARCHIVE REPLAY\n'
          grep 'NUCLEUS_DOWNSTREAM' causal/trace.stderr | tail -n 18 | cut -c1-1500 || true
          zstd -q -3 -f causal/trace.stderr -o causal/trace.stderr.zst
      - name: Capture only bounded last neutral-head mismatch lines at the known Finsupp frontier
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r '.candidate.configuration | to_entries[] | "\(.key)=\(.value)"' causal/qualification.json)
          mkfifo causal/mismatch.fifo
          (grep --line-buffered -E 'NUCLEUS_NEUTRAL_HEAD_MISMATCH|NUCLEUS_DOWNSTREAM' < causal/mismatch.fifo | cut -c1-1500 | tail -n 90 > causal/neutral-tail.txt) &
          sink_pid=$!
          set +e
          unzip -p full-mathlib-evidence.zip mathlib-full.ndjson.zst | zstd -dc | \
            env "${flags[@]}" NUCLEUS_EXPERIMENTAL_DEFERRED_PROJECTION_CONGRUENCE=1 \
            NUCLEUS_TRACE_DOWNSTREAM=1 NUCLEUS_TRACE_NEUTRAL_HEADS=1 \
            timeout 600 causal/nucleus > causal/neutral.stdout 2> causal/mismatch.fifo
          results=("${PIPESTATUS[@]}")
          wait "$sink_pid"
          set -e
          printf 'zip_read=%s\tzstd=%s\tchecker=%s\n' "${results[0]}" "${results[1]}" "${results[2]}" | tee causal/neutral-status.tsv
          test "${results[0]}" -eq 0
          test "${results[1]}" -eq 0
          test "${results[2]}" -eq 2
          tail -n 12 causal/neutral-tail.txt | cut -c1-900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-full-mathlib-next-causal-frontier
          retention-days: 45
          if-no-files-found: warn
          path: |
            causal/mathlib.status
            causal/mathlib-record-count.txt
            causal/mathlib-sha256.txt
            causal/generated-prefix-sha256.txt
            causal/prefix-comparison.txt
            causal/candidate-binary-sha256.txt
            causal/stderr-sha256.txt
            causal/mathlib.stderr.zst
            causal/mathlib.stdout
            causal/entry-list.txt
            causal/trace-status.tsv
            causal/trace.stderr.zst
            causal/trace.stdout
            causal/neutral-status.tsv
            causal/neutral-tail.txt
