name: Nucleus exact full Mathlib input and independent check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nucleus-full-mathlib.yml'

permissions:
  contents: read

concurrency:
  group: nucleus-full-mathlib-${{ github.ref }}
  cancel-in-progress: false

env:
  NUCLEUS_SHA: 1d641496131cf689066c958883b9b61273536322
  ARENA_SHA: cd2dd0244b9ed5e704463a26fbbe5fc67ba16108
  MATHLIB_REV: d13f23b723b8a846827a245b89c10fc7d3f11612
  EXPORTER_SHA: 66f1fb4bc256072069767fce52d39480e4524869
  LEAN_TOOLCHAIN: leanprover/lean4:v4.34.1
  MATHLIB_BYTES: '6184415052'
  MATHLIB_SHA256: 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6

jobs:
  input:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact compressed input cache
        id: input-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nucleus-input/mathlib.ndjson.gz
          key: nucleus-full-mathlib-cd2dd024-d13f23b7-66f1fb4b-22c5de834-v1

      - uses: cachix/install-nix-action@v31
        if: steps.input-cache.outputs.cache-hit != 'true'

      - name: Generate official Mathlib export with pinned exporter
        if: steps.input-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-input
          python3 - <<'PY'
          import shutil
          free = shutil.disk_usage('/tmp').free
          assert free >= 25 * 1024**3, ('insufficient generation disk', free)
          PY
          git init -q /tmp/nucleus-arena
          git -C /tmp/nucleus-arena remote add origin https://github.com/leanprover/lean-kernel-arena
          git -C /tmp/nucleus-arena fetch -q --depth=1 origin "$ARENA_SHA"
          git -C /tmp/nucleus-arena checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/nucleus-arena rev-parse HEAD)" = "$ARENA_SHA"
          cd /tmp/nucleus-arena
          nix develop -c python3 - <<'PY'
          import os, pathlib, yaml
          spec = yaml.safe_load(pathlib.Path('tests/mathlib.yaml').read_text())
          assert spec['rev'] == os.environ['MATHLIB_REV'], spec
          assert spec['ref'] == 'v4.34.1' and spec['module'] == 'Mathlib', spec
          PY
          exporter=/tmp/nucleus-arena/_build/lean4export/leanprover_lean4_v4.34.1
          mkdir -p "$exporter"
          git -C "$exporter" init -q
          git -C "$exporter" remote add origin https://github.com/leanprover/lean4export
          git -C "$exporter" fetch -q --depth=1 origin "$EXPORTER_SHA"
          git -C "$exporter" checkout -q --detach FETCH_HEAD
          test "$(git -C "$exporter" rev-parse HEAD)" = "$EXPORTER_SHA"
          printf '%s\n' "$LEAN_TOOLCHAIN" > "$exporter/lean-toolchain"
          nix develop -c bash -c 'cd "$1" && lake build' _ "$exporter"
          test -x "$exporter/.lake/build/bin/lean4export"
          nix develop -c ./lka.py build-test mathlib
          input=/tmp/nucleus-arena/_build/tests/mathlib.ndjson
          test "$(stat -c '%s' "$input")" = "$MATHLIB_BYTES"
          printf '%s  %s\n' "$MATHLIB_SHA256" "$input" | sha256sum -c -
          gzip -n -1 -c "$input" > /tmp/nucleus-input/mathlib.ndjson.gz

      - name: Verify cached or generated bytes and write provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib
          root = pathlib.Path('/tmp/nucleus-input')
          h = hashlib.sha256(); size = 0; lines = 0
          with gzip.open(root / 'mathlib.ndjson.gz', 'rb') as f:
              while chunk := f.read(8 * 1024 * 1024):
                  h.update(chunk); size += len(chunk); lines += chunk.count(b'\n')
          assert size == int(os.environ['MATHLIB_BYTES']), size
          assert h.hexdigest() == os.environ['MATHLIB_SHA256'], h.hexdigest()
          provenance = {
              'schema': 'nucleus-full-mathlib-input-v1',
              'arena_sha': os.environ['ARENA_SHA'],
              'mathlib_rev': os.environ['MATHLIB_REV'],
              'mathlib_ref': 'v4.34.1',
              'exporter_sha': os.environ['EXPORTER_SHA'],
              'lean_toolchain': os.environ['LEAN_TOOLCHAIN'],
              'bytes': size, 'lines': lines, 'sha256': h.hexdigest(),
              'generation_workflow_sha': os.environ['GITHUB_SHA'],
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'checker_acceptance': 'NOT_CHECKED_BY_INPUT_JOB',
              'original_authority_run': 'https://github.com/metalogiclabs/mathgraph-lean-kernel/actions/runs/38104339104',
          }
          (root / 'provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          print(json.dumps(provenance))
          PY

      - name: Split exact compressed input for bounded connector retrieval
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-parts
          split -b 320m /tmp/nucleus-input/mathlib.ndjson.gz /tmp/nucleus-parts/mathlib.ndjson.gz.part-
          sha256sum /tmp/nucleus-parts/* > /tmp/nucleus-input/parts.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-mathlib-part-aa-22c5de834
          path: /tmp/nucleus-parts/mathlib.ndjson.gz.part-aa
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-mathlib-part-ab-22c5de834
          path: /tmp/nucleus-parts/mathlib.ndjson.gz.part-ab
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-mathlib-part-ac-22c5de834
          path: /tmp/nucleus-parts/mathlib.ndjson.gz.part-ac
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-mathlib-part-ad-22c5de834
          path: /tmp/nucleus-parts/mathlib.ndjson.gz.part-ad
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Publish actual compressed Mathlib input
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-full-mathlib-input-22c5de834
          path: /tmp/nucleus-input/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Save verified compressed input cache
        if: steps.input-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/nucleus-input/mathlib.ndjson.gz
          key: nucleus-full-mathlib-cd2dd024-d13f23b7-66f1fb4b-22c5de834-v1

  nucleus:
    needs: input
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NUCLEUS_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: nucleus-full-mathlib-input-22c5de834
          path: /tmp/nucleus-input

      - name: Build and test independent Nucleus
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-evidence
          git rev-parse HEAD > /tmp/nucleus-evidence/source-commit.txt
          git rev-parse HEAD:metatron-kernel > /tmp/nucleus-evidence/source-subtree.txt
          NUCLEUS_EXPERIMENTAL_RELEVANCE=1 NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA=1 cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          sha256sum metatron-kernel/target/release/metatron-kernel > /tmp/nucleus-evidence/binary-sha256.txt

      - name: Verify input and record independent full Mathlib verdict
        run: |
          set -euo pipefail
          gzip -d -c /tmp/nucleus-input/mathlib.ndjson.gz > /tmp/nucleus-input/mathlib.ndjson
          test "$(stat -c '%s' /tmp/nucleus-input/mathlib.ndjson)" = "$MATHLIB_BYTES"
          printf '%s  %s\n' "$MATHLIB_SHA256" /tmp/nucleus-input/mathlib.ndjson | sha256sum -c -
          cp /tmp/nucleus-input/provenance.json /tmp/nucleus-evidence/input-provenance.json
          ulimit -s unlimited
          export NUCLEUS_EXPERIMENTAL_RELEVANCE=1
          export NUCLEUS_EXPERIMENTAL_CONTEXT_BINDER=1
          export NUCLEUS_EXPERIMENTAL_TYPED_LINEAGE=1
          export NUCLEUS_EXPERIMENTAL_SUBSTITUTION_RECLOSURE=1
          export NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION=1
          export NUCLEUS_EXPERIMENTAL_PROJECTION_CONTEXT=1
          export NUCLEUS_EXPERIMENTAL_PROJECTION_CROSSFRAME_512=1
          export NUCLEUS_EXPERIMENTAL_TYPED_RECEIVER=1
          export NUCLEUS_EXPERIMENTAL_SOURCE_PAIR_DEPTH8=1
          export NUCLEUS_EXPERIMENTAL_POLYMORPHIC_PROP_IRREL=1
          export NUCLEUS_EXPERIMENTAL_PROP_SINGLETON_2P1F=1
          export NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA=1
          export NUCLEUS_TRACE_DOWNSTREAM=1
          set +e
          /usr/bin/time -f 'wall_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M' \
            -o /tmp/nucleus-evidence/time.txt \
            timeout --kill-after=30s 1500s metatron-kernel/target/release/metatron-kernel \
            < /tmp/nucleus-input/mathlib.ndjson \
            > /tmp/nucleus-evidence/stdout.txt 2> /tmp/nucleus-evidence/stderr.txt
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/nucleus-evidence/exit.txt
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path('/tmp/nucleus-evidence')
          rc = int((out / 'exit.txt').read_text())
          verdict = {0: 'ACCEPT', 1: 'REJECT', 2: 'UNKNOWN', 124: 'TIMEOUT'}.get(rc, 'ERROR')
          report = {
              'schema': 'nucleus-independent-full-mathlib-v1',
              'source_commit': (out / 'source-commit.txt').read_text().strip(),
              'workflow_commit': os.environ['GITHUB_SHA'], 'mode': 'origin',
              'source_subtree': (out / 'source-subtree.txt').read_text().strip(),
              'checker': 'metatron-kernel', 'exit_code': rc, 'verdict': verdict,
              'export_sha256': os.environ['MATHLIB_SHA256'],
              'full_mathlib_acceptance_qualified': rc == 0,
              'official_arena_rank_qualified': False,
              'measurement': 'Linux time; no hardware retired-instruction claim',
          }
          (out / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"Independent Nucleus full Mathlib verdict: **{verdict}**, exit {rc}.\n\n")
              f.write('Input generation and hash qualification are separate from checker acceptance.\n')
          print(json.dumps(report))
          PY

      - name: Publish independent Nucleus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-full-mathlib-evidence-${{ env.NUCLEUS_SHA }}
          path: /tmp/nucleus-evidence/
          retention-days: 30
          if-no-files-found: warn

      - name: Require actual Nucleus ACCEPT for qualification success
        run: |
          set -euo pipefail
          rc=$(cat /tmp/nucleus-evidence/exit.txt)
          if [ "$rc" != 0 ]; then
            echo "::error::Nucleus full Mathlib remains unqualified (exit $rc); input and verdict evidence were retained."
            exit 1
          fi
