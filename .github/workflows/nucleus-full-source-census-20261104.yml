name: Nucleus one-pass Mathlib inductive family census
on:
  push:
    branches: [research/nucleus-full-source-census-20261104]
    paths:
      - '.github/workflows/nucleus-full-source-census-20261104.yml'
      - 'experiments/nucleus-family-census-20261104/source_census.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact previously independently pinned complete Mathlib
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-source-census /tmp/mathlib-source
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/mathlib-source.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/mathlib-source.zip | sha256sum -c -
          unzip -q /tmp/mathlib-source.zip -d /tmp/mathlib-source
          zstd -dq /tmp/mathlib-source/mathlib.ndjson.zst -o /tmp/mathlib-source/mathlib.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib-source/mathlib.ndjson | sha256sum -c -
      - name: One-pass source-family count and exact source digest
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/nucleus-family-census-20261104/source_census.py
          python3 experiments/nucleus-family-census-20261104/source_census.py \
            /tmp/mathlib-source/mathlib.ndjson \
            --expected-sha256 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 \
            --after-record 130802 > /tmp/nucleus-source-census/full-source-census.json
          jq -c '{status,source_sha256,records,distinct_shapes,counts,after_record,after_inductive_types,after_distinct_shapes,after_top_shapes: .after_top_shapes[:12]}' \
            /tmp/nucleus-source-census/full-source-census.json
          sha256sum /tmp/nucleus-source-census/full-source-census.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-full-source-census-${{ github.sha }}
          path: /tmp/nucleus-source-census/*.json
