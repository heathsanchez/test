name: Nucleus funext repair v1

on:
  push:
    branches: [nucleus-funext-repair-v1]
    paths:
      - ".github/workflows/nucleus-funext-repair-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CURRENT_TEST_ARTIFACT: "11090525747"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Nucleus
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
      - name: Fetch current Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/current /tmp/a
          mkdir -p /tmp/current /tmp/a
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/a
          tar -xzf "$(find /tmp/a -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current
      - name: Probe evaluated eta repair and expose next frontier
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/funext-repair-v1
          python3 - <<'PY'
          import pathlib,subprocess,os,json,hashlib
          src=pathlib.Path("/tmp/current/good/perf/fueled-chain.ndjson")
          names={0:""}; rows=[]; found=False
          for line in src.read_text().splitlines():
              record=json.loads(line); rows.append(line)
              if "in" in record:
                  value=record.get("str",record.get("num"))
                  names[record["in"]]=names[value["pre"]]+("." if value["pre"] else "")+str(value.get("str",value.get("i")))
              decls=[]
              if "inductive" in record:
                  for kind in ("types","ctors","recs"): decls.extend(record["inductive"][kind])
              for kind in ("def","thm","axiom","opaque"):
                  if kind in record: decls.append(record[kind])
              if any(names.get(d["name"])=="funext" for d in decls):
                  found=True; break
          assert found
          data=("\n".join(rows)+"\n").encode()
          out=pathlib.Path("metatron-kernel/evidence-out/funext-repair-v1")
          (out/"funext-complete-prefix.ndjson").write_bytes(data)
          env=os.environ|{"NUCLEUS_TRACE_VALUE_MISMATCH":"1","NUCLEUS_TRACE_DOWNSTREAM":"1"}
          r=subprocess.run(["/tmp/nucleus"],input=data,capture_output=True,env=env,timeout=30)
          rec={"candidate_sha":os.environ["GITHUB_SHA"],"input_sha256":hashlib.sha256(data).hexdigest(),"input_bytes":len(data),"exit":r.returncode,"stderr":r.stderr.decode(errors="replace")}
          (out/"diagnostic.json").write_text(json.dumps(rec,indent=2)+"\n")
          print(json.dumps(rec),flush=True)
          assert "name=funext:stage=theorem.value:verdict=REJECT:reason=rigid-value-constructor-mismatch" not in rec["stderr"],rec
          assert r.returncode in (0,1,2),rec
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-funext-repair-${{ github.sha }}
          path: metatron-kernel/evidence-out/funext-repair-v1
          if-no-files-found: error
