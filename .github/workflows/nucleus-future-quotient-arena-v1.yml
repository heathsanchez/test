name: Nucleus Future Quotient Arena v1

on:
  push:
    branches: [nucleus-future-quotient-arena-v1]
    paths:
      - ".github/workflows/nucleus-future-quotient-arena-v1.yml"
      - "metatron-kernel/tools/residual_future_quotient.py"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-future-quotient-arena-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  future-quotient:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build unchanged current Nucleus
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-current

      - name: Build exact intervention panel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe-bin /tmp/probe-target
          declare -A PROBES=(
            [application_pi]="202501344fb884872c74beb1111064868fc37ff0"
            [nested_iota]="188adbab041dec9fb55f7d1c063a69f0f8aa6f3f"
            [projection_apply]="a1e4fae048c8099bebedbfac026221ca21062092"
            [projection_under_app]="25c967b350d3b481d9e2dae7ba0f23abf83f5771"
            [generic_fields]="d798bc6719e0693b2b788c81a5a3872c291c38a6"
            [major_whnf]="d39720d458410e615199710e1399a0af58dcf622"
            [field_conversion]="ac14100d7f89dcc24e03de91dafbc9ead356f0c0"
            [field_recursor]="03e1a267055e9972a7f7b73c67e987a9ef24690d"
            [native_whnf0]="0e0b72b7c7c1bd96c97cb69c0dc352eda0b5f29f"
            [proof_app]="5d6dc44e9e6cd155969e9e2768d47a708d17934b"
            [generic_nonrecursive]="73da871e743065b911803ecdac4e149c5565f989"
            [projection_compound]="dce688d137acbb07a9685e6203af67057d8e85e3"
          )
          for label in "${!PROBES[@]}"; do
            sha="${PROBES[$label]}"
            dir="/tmp/probe-${label}"
            git worktree add --detach "$dir" "$sha"
            CARGO_TARGET_DIR=/tmp/probe-target cargo build --release --locked \
              --manifest-path "$dir/metatron-kernel/Cargo.toml"
            cp /tmp/probe-target/release/metatron-kernel "/tmp/probe-bin/$label"
          done

      - name: Fetch exact frozen 193-case corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Discover consequence-native residual quotient
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/future-quotient-arena-v1
          python metatron-kernel/tools/residual_future_quotient.py \
            --corpus /tmp/tests \
            --current /tmp/nucleus-current \
            --current-label decidable_current \
            --probe application_pi=/tmp/probe-bin/application_pi \
            --probe nested_iota=/tmp/probe-bin/nested_iota \
            --probe projection_apply=/tmp/probe-bin/projection_apply \
            --probe projection_under_app=/tmp/probe-bin/projection_under_app \
            --probe generic_fields=/tmp/probe-bin/generic_fields \
            --probe major_whnf=/tmp/probe-bin/major_whnf \
            --probe field_conversion=/tmp/probe-bin/field_conversion \
            --probe field_recursor=/tmp/probe-bin/field_recursor \
            --probe native_whnf0=/tmp/probe-bin/native_whnf0 \
            --probe proof_app=/tmp/probe-bin/proof_app \
            --probe generic_nonrecursive=/tmp/probe-bin/generic_nonrecursive \
            --probe projection_compound=/tmp/probe-bin/projection_compound \
            --out metatron-kernel/evidence-out/future-quotient-arena-v1/result.json

      - name: Guard V1 scientific boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('metatron-kernel/evidence-out/future-quotient-arena-v1/result.json')
          d=json.loads(p.read_text())
          assert d['schema']=='nucleus-future-quotient-arena-v1'
          assert d['total_cases']==193
          assert d['current_residual_count']==40, d['current_residual_count']
          assert 1 <= d['quotient_class_count'] <= d['current_residual_count']
          assert d['safe_probe_order'], 'all exploratory probes were unsafe'
          print(json.dumps({
            'residual':d['current_residual_count'],
            'classes':d['quotient_class_count'],
            'collapse_ratio':d['collapse_ratio'],
            'safe_probes':d['safe_probe_order'],
            'excluded_unsafe':[
              (x['probe'],x['wrong_count'],x['invalid_count'])
              for x in d['excluded_unsafe_probes']
            ],
            'separator_sequence':d['separator_sequence'],
            'best_next_probe':d['best_next_probe'],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-future-quotient-arena-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/future-quotient-arena-v1
          if-no-files-found: warn

  current-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ARENA_SHA: 5e5685cef9e4793a0abba24604d873d068e6428e
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build exact Nucleus candidate
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus

      - name: Build latest pinned upstream Arena corpus
        timeout-minutes: 115
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q "$ARENA_SHA"
          cd /tmp/arena
          nix develop -c ./lka.py build-test

      - name: Run latest Arena correctness classification
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/future-quotient-arena-v1/current-arena
          python - <<'PY'
          import json, pathlib, subprocess, os
          root=pathlib.Path('/tmp/arena/_build/tests')
          binary=pathlib.Path('/tmp/nucleus')
          rows=[]
          for stats in sorted(root.rglob('*.stats.json')):
              data=json.loads(stats.read_text())
              ndjson=stats.parent/(stats.name.replace('.stats.json','.ndjson'))
              if not ndjson.exists():
                  rows.append({
                    'test':data.get('name'),
                    'outcome':data.get('outcome'),
                    'status':'missing',
                    'correctness':'error',
                  })
                  continue
              with ndjson.open('rb') as f:
                  p=subprocess.run(
                    [str(binary)],
                    stdin=f,
                    stdout=subprocess.DEVNULL,
                    stderr=subprocess.PIPE,
                    timeout=180,
                  )
              rc=p.returncode
              status={0:'accepted',1:'rejected',2:'declined'}.get(rc,'error')
              expected=data.get('outcome')
              if status=='declined':
                  correctness='declined'
              elif status=='error':
                  correctness='error'
              elif expected=='either':
                  correctness='either'
              elif expected=='accept' and status=='accepted':
                  correctness='correct'
              elif expected=='reject' and status=='rejected':
                  correctness='correct'
              else:
                  correctness='incorrect'
              rows.append({
                'test':data.get('name'),
                'outcome':expected,
                'status':status,
                'correctness':correctness,
                'exit_code':rc,
                'stderr_tail':p.stderr.decode(errors='replace')[-500:] if status=='error' else '',
              })
          counts={}
          status_counts={}
          for row in rows:
              counts[row['correctness']]=counts.get(row['correctness'],0)+1
              status_counts[row['status']]=status_counts.get(row['status'],0)+1
          incorrect=[r for r in rows if r['correctness']=='incorrect']
          errors=[r for r in rows if r['correctness']=='error']
          out={
            'schema':'nucleus-future-quotient-arena-v1-current-arena',
            'arena_sha':os.environ['ARENA_SHA'],
            'candidate_sha':os.environ['GITHUB_SHA'],
            'total':len(rows),
            'correctness_counts':counts,
            'status_counts':status_counts,
            'incorrect':incorrect,
            'errors':errors,
            'rows':rows,
          }
          dest=pathlib.Path(
            'metatron-kernel/evidence-out/future-quotient-arena-v1/current-arena/result.json'
          )
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
            'total':out['total'],
            'correctness_counts':counts,
            'status_counts':status_counts,
          },sort_keys=True))
          assert not incorrect, incorrect
          assert not errors, errors
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-future-quotient-current-arena-${{ github.sha }}
          path: metatron-kernel/evidence-out/future-quotient-arena-v1/current-arena
          if-no-files-found: warn
