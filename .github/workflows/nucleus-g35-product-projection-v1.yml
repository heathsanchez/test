name: Nucleus G35 Product Projection v1

on:
  push:
    branches: [nucleus-g35-product-projection-v1]
    paths:
      - ".github/workflows/nucleus-g35-product-projection-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-g35-product-projection-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
      BASE_SHA: 56b748bae0466423158679b88de5406bf57bee35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Verify source
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          python -m unittest discover -s tests_py -p 'test_*.py' -v
          python scripts/check_ledger.py

      - name: Build exact G34 oracle and candidate
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/g34 "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/g34/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Build pinned tutorial
        run: |
          set -euo pipefail
          git init /tmp/arena
          git -C /tmp/arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/arena checkout --detach FETCH_HEAD
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/tutorial
          cd /tmp/arena/tutorial
          lake clean
          OUT=/tmp/tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial

      - name: Exact global reclosure
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/g35
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/tutorial')
          base=pathlib.Path('/tmp/g34/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]; manifest=[]
          for d,e in [('good',0),('bad',1)]:
              for p in sorted((root/d).glob('*.ndjson')):
                  try:n=int(p.name.split('_',1)[0])
                  except ValueError:continue
                  def run(b):
                      with p.open('rb') as f:return subprocess.run([str(b)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  a,b=run(base),run(cand)
                  status=('earned_delta' if b==e and a!=e else 'mismatch') if a!=b else ('equal_correct' if b==e else 'equal_residual')
                  rows.append({'number':n,'path':f'{d}/{p.name}','expected':e,'base':a,'candidate':b,'status':status})
                  if a==e:manifest.append(f"{e}\t{p}")
          rows.sort(key=lambda r:r['number'])
          by={r['number']:r for r in rows}
          earned=[r for r in rows if r['status']=='earned_delta']
          mismatches=[r for r in rows if r['status']=='mismatch']
          expected_nums=[83,84,85,87,98]
          assert [r['number'] for r in earned]==expected_nums,earned
          assert not mismatches,mismatches
          for n in expected_nums: assert by[n]['candidate']==by[n]['expected'],by[n]
          residual=[r for r in rows if r['candidate']!=r['expected']]
          assert residual and residual[0]['number']==82,residual[:5]
          assert len(manifest)==87,len(manifest)
          pathlib.Path('/tmp/g34-correct87.tsv').write_text('\n'.join(manifest)+'\n')
          out={'schema':'nucleus-g35-product-projection-v1','arena_sha':os.environ['ARENA_SHA'],'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],'counts':{'earned_delta':len(earned),'equal_correct':sum(r['status']=='equal_correct' for r in rows),'equal_residual':sum(r['status']=='equal_residual' for r in rows),'mismatch':len(mismatches)},'earned':earned,'first_residual':residual[0],'rows':rows}
          pathlib.Path('evidence-out/g35/reclosure.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:out[k] for k in ['counts','earned','first_residual']},sort_keys=True))
          PY

      - name: Performance retention on frozen G34-correct cohort
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          for root in . /tmp/g34/metatron-kernel; do mkdir -p "$root/examples"; done
          cat >/tmp/cohort.rs <<'RS'
          use std::{env,fs,io::Cursor};
          use metatron_kernel::run;
          fn main(){let m=env::var("NUCLEUS_MANIFEST").unwrap();let n:usize=env::var("NUCLEUS_BENCH_ITERS").unwrap().parse().unwrap();let cs:Vec<(i32,Vec<u8>)>=fs::read_to_string(m).unwrap().lines().map(|l|{let(e,p)=l.split_once('\t').unwrap();(e.parse().unwrap(),fs::read(p).unwrap())}).collect();let mut s=0usize;for _ in 0..n{for(e,b)in &cs{let v=run(Cursor::new(b.as_slice()));assert_eq!(v.exit_code(),*e);s=s.wrapping_add(v.exit_code() as usize+1)}}println!("{s}");}
          RS
          cp /tmp/cohort.rs examples/g35_perf.rs
          cp /tmp/cohort.rs /tmp/g34/metatron-kernel/examples/g35_perf.rs
          cargo build --release --locked --example g35_perf
          cargo build --release --locked --manifest-path /tmp/g34/metatron-kernel/Cargo.toml --example g35_perf
          python - <<'PY'
          import json,os,pathlib,statistics,subprocess,time
          bins={'base':pathlib.Path('/tmp/g34/metatron-kernel/target/release/examples/g35_perf'),'candidate':pathlib.Path('target/release/examples/g35_perf').resolve()}
          env=dict(os.environ);env['NUCLEUS_MANIFEST']='/tmp/g34-correct87.tsv';env['NUCLEUS_BENCH_ITERS']='180'
          rows=[]
          for i,order in enumerate([['base','candidate'],['candidate','base']]*3+[['base','candidate']],1):
              vals={}
              for k in order:
                  t=time.perf_counter_ns();subprocess.check_output([str(bins[k])],env=env);vals[k]=time.perf_counter_ns()-t
              rows.append({'round':i,**{f'{k}_ns':v for k,v in vals.items()},'ratio':vals['candidate']/vals['base']})
          med={k:statistics.median(r[f'{k}_ns'] for r in rows) for k in bins};ratio=med['candidate']/med['base']
          out={'schema':'nucleus-g35-performance-v1','medians_ns':med,'candidate_over_base':ratio,'paired_median_ratio':statistics.median(r['ratio'] for r in rows),'rows':rows}
          pathlib.Path('evidence-out/g35/performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          assert ratio <= 1.05, out
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-g35-product-projection-${{ github.sha }}
          path: metatron-kernel/evidence-out/g35
          if-no-files-found: error
