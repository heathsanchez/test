name: Nucleus G36 Mathlib RSS v1

on:
  push:
    branches: [nucleus-g36-mathlib-rss-v1]
    paths:
      - ".github/workflows/nucleus-g36-mathlib-rss-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARENA_SHA: 74745e5a848c71d99121e811ae86f24d13dea785
      NUCLEUS_SHA: 32e8e0e39234a4497b078dc1188f42994d559879
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: cachix/install-nix-action@v31

      - name: Build exact qualified G36
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$NUCLEUS_SHA" HEAD
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-g36
          sha256sum /tmp/nucleus-g36
          stat -c 'binary_bytes=%s' /tmp/nucleus-g36

      - name: Prepare current Arena and build Mathlib export
        timeout-minutes: 150
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q "$ARENA_SHA"
          cat > /tmp/arena/checkers/nucleus-g36.yaml <<'YAML'
          description: |
            Qualified native Nucleus G36 literal/projection authority.
          version: "g36-32e8e0e"
          url: https://github.com/heathsanchez/test
          rev: 32e8e0e39234a4497b078dc1188f42994d559879
          build: cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          run: ./metatron-kernel/target/release/metatron-kernel < $IN
          YAML
          cd /tmp/arena
          nix develop -c ./lka.py build-checker nucleus-g36
          nix develop -c ./lka.py build-test mathlib

      - name: Record prior Mathlib surface warrant
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/g36-mathlib
          cat > metatron-kernel/evidence-out/g36-mathlib/surface-warrant.json <<'JSON'
          {
            "schema": "nucleus-g36-mathlib-surface-warrant-v1",
            "source_run": 35892643934,
            "source_artifact": 10766360562,
            "arena_sha": "74745e5a848c71d99121e811ae86f24d13dea785",
            "bytes": 5636308621,
            "lines": 100001405,
            "unsupported_expr_counts": {}
          }
          JSON

      - name: Measure native Nucleus directly on current Mathlib
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/g36-mathlib
          set +e
          /usr/bin/time -f 'real_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M' \
            -o metatron-kernel/evidence-out/g36-mathlib/time.txt \
            /tmp/nucleus-g36 \
            < /tmp/arena/_build/tests/mathlib.ndjson \
            > metatron-kernel/evidence-out/g36-mathlib/stdout.txt \
            2> metatron-kernel/evidence-out/g36-mathlib/stderr.txt
          rc=$?
          set -e
          echo "$rc" > metatron-kernel/evidence-out/g36-mathlib/exit.txt
          echo "MATHLIB_RC=$rc"
          cat metatron-kernel/evidence-out/g36-mathlib/time.txt
          cat metatron-kernel/evidence-out/g36-mathlib/stderr.txt
          test "$rc" -ne 3

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-g36-mathlib-rss-${{ github.sha }}
          path: metatron-kernel/evidence-out/g36-mathlib
          if-no-files-found: warn
