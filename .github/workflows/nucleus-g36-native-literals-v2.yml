name: Nucleus G36 Native Literals Qualification v2

on:
  push:
    branches: [nucleus-g36-native-literals-v2]
    paths:
      - ".github/workflows/nucleus-g36-native-literals-v2.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-g36-native-literals-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SHA: b8b580876facfb092c754fb5b1e47a4b22267ad0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked

      - name: Build exact G35 oracle
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/g35 "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/g35/metatron-kernel/Cargo.toml

      - name: Fetch frozen official 193-file Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/10712869614/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Global fixed-outcome differential
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/g36-native-literals
          python - <<'PY'
          import json,pathlib,subprocess,os
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/g35/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]
          for d,expected in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  def run(binary):
                      env=dict(os.environ); env['NUCLEUS_TRACE_PARSE_ERROR']='1'
                      with p.open('rb') as f:
                          q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,env=env)
                      return q.returncode,q.stderr.decode(errors='replace')[-400:]
                  a,_=run(base); b,err=run(cand)
                  rows.append({'test':name,'expected':expected,'base':a,'candidate':b,'stderr_tail':err})
          regressions=[r for r in rows if r['base']==r['expected'] and r['candidate']!=r['expected']]
          false_accepts=[r for r in rows if r['expected']==1 and r['candidate']==0]
          parser_errors=[r for r in rows if r['candidate']==3]
          earned=[r for r in rows if r['base']!=r['expected'] and r['candidate']==r['expected']]
          progress=[r for r in rows if r['base']==3 and r['candidate']==2]
          out={
            'schema':'nucleus-g36-native-literals-v2',
            'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
            'counts':{
              'rows':len(rows),
              'candidate_accept':sum(r['candidate']==0 for r in rows),
              'candidate_reject':sum(r['candidate']==1 for r in rows),
              'candidate_decline':sum(r['candidate']==2 for r in rows),
              'candidate_error':sum(r['candidate']==3 for r in rows),
              'earned':len(earned),'parser_progress':len(progress),
              'regressions':len(regressions),'false_accepts':len(false_accepts),
            },
            'earned':earned,'parser_progress':progress,
            'regressions':regressions,'false_accepts':false_accepts,
            'rows':rows,
          }
          pathlib.Path('evidence-out/g36-native-literals/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:out[k] for k in ['counts','earned','parser_progress','regressions','false_accepts']},sort_keys=True))
          assert not regressions, regressions
          assert not false_accepts, false_accepts
          assert not parser_errors, parser_errors
          # Already-qualified literal milestones must remain exact.
          by={r['test']:r for r in rows}
          assert by['tutorial/102_aNatLit']['candidate']==0,by['tutorial/102_aNatLit']
          assert by['tutorial/103_natLitEq']['candidate']==0,by['tutorial/103_natLitEq']
          assert by['init-prelude']['candidate']!=3,by['init-prelude']
          PY

      - name: Measure frozen init-prelude parse/check footprint
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -f 'real_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M'             -o evidence-out/g36-native-literals/init-prelude-time.txt             target/release/metatron-kernel             < /tmp/tests/good/init-prelude.ndjson             > /dev/null 2> evidence-out/g36-native-literals/init-prelude-stderr.txt
          rc=$?
          set -e
          echo "$rc" > evidence-out/g36-native-literals/init-prelude-exit.txt
          cat evidence-out/g36-native-literals/init-prelude-time.txt
          echo "INIT_PRELUDE_RC=$rc"
          test "$rc" -ne 3

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-g36-native-literals-${{ github.sha }}
          path: metatron-kernel/evidence-out/g36-native-literals
          if-no-files-found: warn
