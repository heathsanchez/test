name: Independent Nucleus exact GetElem codomain investigation
on:
  push:
    branches: [research/nucleus-getelem-typed-codomain-20261102]
    paths: [".github/workflows/nucleus-getelem-codomain-20261102.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50a34f406df0ad55e7d8900ea274d119157a4573
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Bind unchanged qualified source and build verifier
        run: |
          set -euo pipefail
          mkdir -p /tmp/getelem/evidence /tmp/getelem/source /tmp/getelem/mutants
          git rev-parse HEAD > /tmp/getelem/evidence/source-sha.txt
          git rev-parse HEAD:metatron-kernel > /tmp/getelem/evidence/kernel-tree.txt
          test "$(cat /tmp/getelem/evidence/kernel-tree.txt)" = 2a693fffd8b7d0f5fe873130419da683da672217
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-plain
      - name: Restore exact authentic source and independently falsified mutations
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/12722408982/zip > /tmp/getelem/source.zip
          gh api repos/heathsanchez/test/actions/artifacts/12766696440/zip > /tmp/getelem/mutants.zip
          printf '%s  %s\n' 8f3fe62d60740fae640ed716b58ce1671a558fd88dd14723d758934e49197b31 /tmp/getelem/source.zip | sha256sum -c -
          printf '%s  %s\n' 94f78d49378c5cf5a8ecb229eb70fa8dd9b02a090112974b12d40af13fac397a /tmp/getelem/mutants.zip | sha256sum -c -
          unzip -q /tmp/getelem/source.zip -d /tmp/getelem/source
          unzip -q /tmp/getelem/mutants.zip -d /tmp/getelem/mutants
          mkdir -p /tmp/getelem/frozen-pack /tmp/getelem/frozen
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/getelem/frozen.zip
          unzip -q /tmp/getelem/frozen.zip -d /tmp/getelem/frozen-pack
          tar --no-same-owner -xzf /tmp/getelem/frozen-pack/lean-arena-tests.tar.gz -C /tmp/getelem/frozen
      - name: Add observation-only source-motive diagnostics
        run: |
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path("metatron-kernel/src/typecheck.rs")
          s=p.read_text()
          needle='''                if !domain_check.is_proven() {
                              #[cfg(feature = "diagnostics")]
                              self.record_capture_source_failure'''
          assert s.count(needle)==1
          s=s.replace(needle,'''                if !domain_check.is_proven() {
          '''+"                    #[cfg(feature = \"diagnostics\")]\n                    if std::env::var_os(\"NUCLEUS_TRACE_GETELEM_EQ_TRANSPORT\").is_some()\n                        && context.len() == 11 && matches!(term.expr.0, 84286 | 68310 | 68309)\n                    {\n                        let exposure = |ty: &TypeValue| match ty {\n                            TypeValue::Term(c) => Some(\n                                self.machine().expose_for_conversion(\n                                    c.clone(), Transparency::Full, (*remaining).min(512),\n                                )\n                            ),\n                            _ => None,\n                        };\n                        eprintln!(\n                            \"NUCLEUS_GETELEM_EQ_TRANSPORT:source={term:?}:original_argument={argument:?}:context_len={}:fuel={}:inferred={argument_ty:?}:expected_domain={domain:?}:conversion={domain_check:?}:actual_exposed={:?}:expected_exposed={:?}\",\n                            context.len(), *remaining, exposure(&argument_ty), exposure(&domain),\n                        );\n                        if let (TypeValue::Pi { domain: inferred_domain, .. },\n                                TypeValue::Term(expected_pi)) = (&argument_ty, &domain)\n                        {\n                            if let Judgment::Proven {\n                                value: Value::Pi { domain: expected_domain, .. }, ..\n                            } = self.machine().expose_for_conversion(\n                                expected_pi.clone(), Transparency::Full, (*remaining).min(512),\n                            ) {\n                                let domains = crate::convert::convert_with_policy_in_context(\n                                    self, inferred_domain.as_ref(),\n                                    &TypeValue::Term(expected_domain.clone()),\n                                    (*remaining).min(256),\n                                    crate::convert::DeltaPolicy::PreferredOnly,\n                                    context.len(), context,\n                                );\n                                eprintln!(\n                                    \"NUCLEUS_GETELEM_PI_DOMAIN:source={term:?}:inferred_domain={inferred_domain:?}:expected_domain={expected_domain:?}:domain_conversion={domains:?}:remaining={}\",\n                                    *remaining,\n                                );\n                                if domains.is_proven() {\n                                    if let TypeValue::Pi {\n                                        body: inferred_body, binder: actual_binder, ..\n                                    } = &argument_ty {\n                                        let fresh = FreeId(context.len() as u64);\n                                        let mut alpha_fuel = (*remaining).min(512);\n                                        let opened = self.reopen_fixed_pi_body(\n                                            inferred_body, *actual_binder, fresh,\n                                            &mut alpha_fuel,\n                                        );\n                                        let expected_opened = expected_domain; // Source Pi-domain already proven.\n                                        let _ = expected_opened;\n                                        let expected_pi = self.machine().expose_for_conversion(\n                                            expected_pi.clone(), Transparency::Full, (*remaining).min(512)\n                                        );\n                                        if let Judgment::Proven {\n                                            value: Value::Pi { body: expected_body, .. }, ..\n                                        } = expected_pi {\n                                            let mut gamma = context.to_vec();\n                                            gamma.push((**inferred_domain).clone());\n                                            let result = opened.as_ref().map(|left_body| {\n                                                crate::convert::convert_with_policy_in_context(\n                                                    self, left_body,\n                                                    &TypeValue::Term(expected_body.under_free(fresh)),\n                                                    alpha_fuel.min(256),\n                                                    crate::convert::DeltaPolicy::PreferredOnly,\n                                                    gamma.len(), &gamma,\n                                                )\n                                            });\n                                            eprintln!(\n                                                \"NUCLEUS_GETELEM_PI_CODOMAIN:source={term:?}:binder={actual_binder:?}:fresh={fresh:?}:alpha_fuel={alpha_fuel}:opened={opened:?}:codomain_conversion={result:?}\",\n                                            );\n                                        }\n                                    }\n                                }\n                            }\n                        }\n                    }\n"+'''                    #[cfg(feature = "diagnostics")]
                              self.record_capture_source_failure''')
          p.write_text(s)
          p=pathlib.Path("metatron-kernel/src/convert.rs")
          s=p.read_text()
          needle='''            // Congruence requires equal receiver values, not identical'''
          replacement='''            #[cfg(feature = "diagnostics")]
                      if std::env::var_os("NUCLEUS_TRACE_GETELEM_RECEIVER_LEDGER").is_some() {
                          use std::sync::atomic::{AtomicUsize, Ordering};
                          static OBSERVED: AtomicUsize = AtomicUsize::new(0);
                          if depth >= 11 && OBSERVED.fetch_add(1, Ordering::Relaxed) < 32 {
                              eprintln!("NUCLEUS_RECEIVER_LEDGER:owner={left_type:?}:field={left_index}:depth={depth}:budget={budget}:left={left_structure:?}:right={right_structure:?}:context={context:?}");
                          }
                      }
                      // Congruence requires equal receiver values, not identical'''
          assert s.count(needle)==1
          p.write_text(s.replace(needle,replacement))
          
          p=pathlib.Path("metatron-kernel/src/typecheck.rs")
          s=p.read_text()
          needle='''                #[cfg(feature = "diagnostics")]
                          if std::env::var_os("NUCLEUS_TRACE_FAILED_RECEIVER_CONVERSION").is_some()'''
          assert s.count(needle)==1
          s=s.replace(needle,"                #[cfg(feature=\"diagnostics\")]\n                if std::env::var_os(\"NUCLEUS_TRACE_GETELEM_SOURCE_PAIR\").is_some()\n                    && expression.0 == 68307 && context.len() == 12 && !conversion.is_proven()\n                {\n                    use std::sync::atomic::{AtomicBool, Ordering};\n                    static DONE: AtomicBool = AtomicBool::new(false);\n                    if !DONE.swap(true, Ordering::Relaxed) {\n                        eprintln!(\"NUCLEUS_GETELEM_SOURCE_PAIR:expression={expression:?}:frame={}:actual={value:?}:expected={expected:?}:context={context:?}:relation={conversion:?}\", frame.id());\n                        if let (TypeValue::Term(a),TypeValue::Term(b))=(&value,expected) {\n                            let av=self.machine().expose_for_conversion(a.clone(),Transparency::Full,4096);\n                            let bv=self.machine().expose_for_conversion(b.clone(),Transparency::Full,4096);\n                            eprintln!(\"NUCLEUS_GETELEM_SOURCE_VALUES:left={av:?}:right={bv:?}\");\n                            if let (Some(Value::Neutral(l)),Some(Value::Neutral(r)))=(av.proven_value(),bv.proven_value()) {\n                                for (index,(lhs,rhs)) in l.spine.iter().zip(&r.spine).enumerate() {\n                                    let left_type=self.infer_exact_closure_in_context(lhs,context,&mut 8192,0);\n                                    let right_type=self.infer_exact_closure_in_context(rhs,context,&mut 8192,0);\n                                    let left_value=self.machine().expose_for_conversion(lhs.clone(),Transparency::Full,4096);\n                                    let right_value=self.machine().expose_for_conversion(rhs.clone(),Transparency::Full,4096);\n                                    let guarded=crate::convert::convert_with_policy_in_context(self,&TypeValue::Term(lhs.clone()),&TypeValue::Term(rhs.clone()),4096,crate::convert::DeltaPolicy::GuardedSemanticFallback,context.len(),context);\n                                    let typed=self.checked_source_conversion(lhs,rhs,context,8192);\n                                    if index==2 {\n                                        if let (Some(Value::Neutral(a)),Some(Value::Neutral(b)))=(left_value.proven_value(),right_value.proven_value()) {\n                                            if let (Some(x),Some(y))=(a.spine.get(1),b.spine.get(1)) {\n                                                let xv=self.machine().expose_for_conversion(x.clone(),Transparency::Full,8192);\n                                                let yv=self.machine().expose_for_conversion(y.clone(),Transparency::Full,8192);\n                                                eprintln!(\"NUCLEUS_GETELEM_PAYLOAD:left={x:?}:right={y:?}:left_value={xv:?}:right_value={yv:?}\");\n                                                if let (Some(Value::StuckProjection {type_name:lt,index:li,structure:ls,spine:la}),Some(Value::StuckProjection {type_name:rt,index:ri,structure:rs,spine:ra}))=(xv.proven_value(),yv.proven_value()) {\n                                                    for (side,t,i,s,args) in [(\"left\",lt,li,ls,la),(\"right\",rt,ri,rs,ra)] {\n                                                        let result=self.machine().projection_value_for_conversion(s.clone(),*t,*i,args,16384);\n                                                        let mut current=result.proven_value().cloned();\n                                                        eprintln!(\"NUCLEUS_GETELEM_REDUCTION_STEP:side={side}:step=0:value={result:?}\");\n                                                        for step in 1..=8 {\n                                                            let Some(value)=current.take() else {break};\n                                                            match value {\n                                                                Value::StuckProjection {type_name,index,structure,spine} => {\n                                                                    let next=self.machine().projection_value_for_conversion(structure.clone(),type_name,index,&spine,16384);\n                                                                    eprintln!(\"NUCLEUS_GETELEM_REDUCTION_STEP:side={side}:step={step}:type={type_name:?}:index={index}:source={structure:?}:pending={spine:?}:next={next:?}\");\n                                                                    current=next.proven_value().cloned();\n                                                                }\n                                                                Value::Neutral(n) => {\n                                                                    eprintln!(\"NUCLEUS_GETELEM_REDUCTION_NEUTRAL:side={side}:step={step}:value={n:?}:major_chain={}\",self.diagnostic_captured_recursor_major_chain(&n,4096));\n                                                                    if let NeutralHead::Projection {structure,..}=&n.head {\n                                                                        eprintln!(\"NUCLEUS_GETELEM_REDUCTION_RECEIVER:side={side}:receiver={structure:?}:major_chain={}\",self.diagnostic_captured_recursor_major_chain(structure,4096));\n                                                                    }\n                                                                    break;\n                                                                }\n                                                                other => {eprintln!(\"NUCLEUS_GETELEM_REDUCTION_VALUE:side={side}:step={step}:value={other:?}\");break}\n                                                            }\n                                                        }\n                                                    }\n                                                }\n                                                if let (Some(Value::Neutral(an)),Some(Value::Neutral(bn)))=(xv.proven_value(),yv.proven_value()) {\n                                                    eprintln!(\"NUCLEUS_GETELEM_PAYLOAD_HEADS:left={:?}:right={:?}\",an.head,bn.head);\n                                                    for (j,(aa,bb)) in an.spine.iter().zip(&bn.spine).enumerate() {\n                                                        let av=self.machine().expose_for_conversion(aa.clone(),Transparency::Full,2048);\n                                                        let bv=self.machine().expose_for_conversion(bb.clone(),Transparency::Full,2048);\n                                                        let relation=crate::convert::convert_with_policy_in_context(self,&TypeValue::Term(aa.clone()),&TypeValue::Term(bb.clone()),2048,crate::convert::DeltaPolicy::GuardedSemanticFallback,context.len(),context);\n                                                        let proof=self.checked_proof_pair_in_bounded_context(aa,bb,context,2048);\n                                                        eprintln!(\"NUCLEUS_GETELEM_PAYLOAD_ARG:index={j}:left={aa:?}:right={bb:?}:left_whnf={av:?}:right_whnf={bv:?}:relation={relation:?}:checked_proof_pair={proof}\");\n                                                    }\n                                                }\n                                            }\n                                        }\n                                    }\n                                    eprintln!(\"NUCLEUS_GETELEM_SOURCE_ARG:index={index}:left={lhs:?}:right={rhs:?}:left_type={left_type:?}:right_type={right_type:?}:left_whnf={left_value:?}:right_whnf={right_value:?}:guarded={guarded:?}:typed={typed:?}\");\n                                }\n                            }\n                        }\n                    }\n                }\n"+needle)
          p.write_text(s)
          PY
          git diff -- metatron-kernel/src > /tmp/getelem/evidence/diagnostic-only.patch
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-diagnostic
          sha256sum /tmp/nucleus-plain /tmp/nucleus-diagnostic > /tmp/getelem/evidence/binaries.sha256
      - name: Replay exact prefix controls and whole source with diagnostic verdict parity
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess,json,hashlib,copy
          out=pathlib.Path("/tmp/getelem/evidence");out.mkdir(parents=True,exist_ok=True)
          data=pathlib.Path("/tmp/getelem/source/path_reachable.ndjson").read_bytes()
          assert hashlib.sha256(data).hexdigest()=="96918fb408e535b34b50780d6b8fcbae51e5340659ec5a782d0cded926eae479"
          original=b"".join(data.splitlines(keepends=True)[:95635])
          samples={"authentic":(original,"fa21f2a48d84f66aeffc252e988d370634db1ad0706ebc717efdd7d5d379b71a",0),"wrong-receiver":(pathlib.Path("/tmp/getelem/mutants/forged-dependent-motive.ndjson").read_bytes(),"4883556bc4956db44688d560a472940837a3defa40cdad77d3b6caeda7773332",1),"wrong-index":(pathlib.Path("/tmp/getelem/mutants/forged-dependent-index.ndjson").read_bytes(),"3653b131393012eb60b6b749ebc3c652b79a3b7601981cbacaff0106919e9263",1)}
          flags=("RELEVANCE","CONTEXT_BINDER","TYPED_LINEAGE","SUBSTITUTION_RECLOSURE","TYPED_VALUE_NORMALIZATION","PROJECTION_CONTEXT","PROJECTION_CROSSFRAME_512","TYPED_RECEIVER","SOURCE_PAIR_DEPTH8","POLYMORPHIC_PROP_IRREL","PROP_SINGLETON_2P1F","EXPECTED_LAMBDA")
          base={k:v for k,v in os.environ.items() if not k.startswith("NUCLEUS_")}
          origin=base|{"NUCLEUS_EXPERIMENTAL_"+f:"1" for f in flags}
          source=origin|{"NUCLEUS_EXPERIMENTAL_"+f:"1" for f in ("CERTIFIED_QUOT_IOTA","SOURCE_PROOF_IRREL","NEUTRAL_PAIR_PROOF_IRREL")}
          rows=[]
          for label,(raw,pin,wanted) in samples.items():
           assert hashlib.sha256(raw).hexdigest()==pin,label
           path=out/(label+".ndjson");path.write_bytes(raw)
           for mode,env in (("origin",origin),("origin-source-proof",source)):
            for binary,trace in (("/tmp/nucleus-plain",False),("/tmp/nucleus-diagnostic",True)):
             active=env.copy()
             if trace:
              active.update({"NUCLEUS_TRACE_"+f:"1" for f in ("DOWNSTREAM","APPLICATION_FUNCTION_TYPE","GETELEM_EQ_TRANSPORT","GETELEM_RECEIVER_LEDGER","FAILED_RECEIVER_CONVERSION","APP_DOMAIN_OBLIGATION")})
             tag=label+"-"+mode+("-traced" if trace else "-plain")
             cmd=["/usr/bin/time","-f","wall=%e user=%U system=%S rss_kb=%M","-o",str(out/(tag+".time")),binary]
             p=subprocess.run(cmd,input=raw,env=active,capture_output=True,timeout=240)
             (out/(tag+".stderr")).write_bytes(p.stderr)
             row=dict(case=label,mode=mode,traced=trace,rc=p.returncode,expected=wanted,sha256=pin,env={k:v for k,v in active.items() if k.startswith("NUCLEUS_")})
             rows.append(row);print(json.dumps(row),flush=True)
             for line in p.stderr.decode(errors="replace").splitlines():
              if line.startswith(("NUCLEUS_GETELEM","NUCLEUS_RECEIVER_LEDGER","NUCLEUS_DOWNSTREAM")):print(line[:14000],flush=True)
             assert p.returncode in (wanted,2),row
            assert rows[-1]["rc"]==rows[-2]["rc"],("DIAGNOSTIC_VERDICT_CHANGED",rows[-2:])
          (out/"prefix-verdicts.json").write_text(json.dumps(rows,indent=2))
          # Full source remains an independent transfer test; a prefix gain alone is insufficient.
          p=subprocess.run(["/usr/bin/time","-f","wall=%e user=%U system=%S rss_kb=%M","-o",str(out/"whole-path.time"),"/tmp/nucleus-plain"],input=data,env=source,capture_output=True,timeout=300)
          (out/"whole-path.stderr").write_bytes(p.stderr)
          (out/"whole-path.json").write_text(json.dumps(dict(rc=p.returncode,sha256=hashlib.sha256(data).hexdigest(),configuration="origin-source-proof"),indent=2))
          assert p.returncode in (0,2)
          
          # Diagnose current original Grind in its own expression/context namespace.
          root=pathlib.Path("/tmp/getelem/frozen")
          fixture=root/"good/perf/grind-ring-5.ndjson"
          raw=fixture.read_bytes()
          manifest=json.loads(pathlib.Path("metatron-kernel/evidence/performance/owned-environment-2026-10-13/nucleus-owned-environment-frozen196.json").read_text())
          pin=next(r["sha256"] for r in manifest["modes"]["origin"]["rows"] if r["case"]=="good/perf/grind-ring-5.ndjson")
          assert hashlib.sha256(raw).hexdigest()==pin
          (out/"grind-original.ndjson").write_bytes(raw)
          for mode,active in (("origin",origin),):
           for binary,trace in (("/tmp/nucleus-plain",False),("/tmp/nucleus-diagnostic",True)):
            env=active.copy()
            if trace:env.update({"NUCLEUS_TRACE_"+f:"1" for f in ("DOWNSTREAM","APPLICATION_FUNCTION_TYPE","GETELEM_SOURCE_PAIR")})
            tag="grind-"+mode+("-traced" if trace else "-plain")
            p=subprocess.run(["/usr/bin/time","-f","wall=%e user=%U system=%S rss_kb=%M","-o",str(out/(tag+".time")),binary],input=raw,env=env,capture_output=True,timeout=240)
            (out/(tag+".stderr")).write_bytes(p.stderr)
            print("CURRENT_GRIND",tag,p.returncode,flush=True)
            assert p.returncode in (0,2)
            for line in p.stderr.decode(errors="replace").splitlines():
             if line.startswith(("NUCLEUS_GETELEM","NUCLEUS_DOWNSTREAM")):print(line[:18000],flush=True)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-getelem-codomain-source50
          path: |
            /tmp/getelem/evidence
            /tmp/nucleus-plain
            /tmp/nucleus-diagnostic
          if-no-files-found: error
