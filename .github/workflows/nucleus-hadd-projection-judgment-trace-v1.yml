name: Nucleus HAdd Projection Judgment Trace v1

on:
  push:
    branches: [nucleus-hadd-projection-judgment-trace-v1]
    paths:
      - ".github/workflows/nucleus-hadd-projection-judgment-trace-v1.yml"
      - "metatron-kernel/src/checker.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build diagnostic
        run: cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Trace projection definition judgments
        env:
          NUCLEUS_TRACE_PROJECTION_DEF: "1"
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/hadd-projection-judgment-trace-v1
          python - <<'PY'
          import json,pathlib,subprocess,os
          root=pathlib.Path('/tmp/tests')
          binary=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          targets=[
            ('good','perf/magma-list-deep-n21',0),
            ('good','perf/magma-list-deep-n36',0),
            ('bad','bugs/proj-of-stuck-prop',1),
            ('bad','bugs/proj-of-subst-prop',1),
            ('bad','bugs/rec-of-subst-prop',1),
          ]
          rows=[]
          for kind,name,expected in targets:
              p=root/kind/(name+'.ndjson')
              with p.open('rb') as f:
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=240)
              marks=[line for line in q.stderr.decode(errors='replace').splitlines()
                     if 'NUCLEUS_PROJECTION_DEF:' in line]
              rows.append({'test':name,'expected':expected,'rc':q.returncode,'marks':marks[:20]})
          out={'schema':'nucleus-hadd-projection-judgment-trace-v1','candidate_sha':os.environ['GITHUB_SHA'],'rows':rows}
          pathlib.Path('metatron-kernel/evidence-out/hadd-projection-judgment-trace-v1/result.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          assert all(r['marks'] for r in rows), rows
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-hadd-projection-judgment-trace-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/hadd-projection-judgment-trace-v1
          if-no-files-found: error
