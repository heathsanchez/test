name: Nucleus Hybrid Complete v1

on:
  push:
    branches: [nucleus-hybrid-complete-v1]
    paths:
      - ".github/workflows/nucleus-hybrid-complete-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FAST_SHA: 143a195a846e5625474f31786c68fc68379106fa
      WHOLESALE_SHA: a997bafa022153e3789efa14cf752bcb171e8b2f
      COMPLETE_SHA: 78c7502bac8a5ba000057b3f083bc0595ac65750
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - name: Build hybrid candidate
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --release --locked
          cargo build --release --locked
      - name: Build exact fast and wholesale controls
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/fast "$FAST_SHA"
          cargo build --release --locked --manifest-path /tmp/fast/metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/wholesale "$WHOLESALE_SHA"
          cargo build --release --locked --manifest-path /tmp/wholesale/metatron-kernel/Cargo.toml
      - name: Fetch exact frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193
      - name: Prove complete hybrid closure
        working-directory: metatron-kernel
        timeout-minutes: 35
        run: |
          set -euo pipefail
          mkdir -p evidence-out/hybrid-complete-v1
          python - <<'PY'
          import json, os, pathlib, statistics, subprocess, time
          root=pathlib.Path('/tmp/tests')
          cand=pathlib.Path('target/release/metatron-kernel').resolve()
          fast=pathlib.Path('/tmp/fast/metatron-kernel/target/release/metatron-kernel')
          wholesale=pathlib.Path('/tmp/wholesale/metatron-kernel/target/release/metatron-kernel')

          def rr(binary,p):
              with p.open('rb') as f:
                  t=time.perf_counter_ns()
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=180)
                  return q.returncode,time.perf_counter_ns()-t

          rows=[]
          for d,expected in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  frc,ft=rr(fast,p)
                  crc,ct=rr(cand,p)
                  wrc,wt=rr(wholesale,p)
                  rows.append({'test':name,'expected':expected,'fast_rc':frc,'candidate_rc':crc,'wholesale_rc':wrc,
                               'fast_ns':ft,'candidate_ns':ct,'wholesale_ns':wt})
          assert len(rows)==193

          wrong=[r for r in rows if r['candidate_rc']!=r['expected']]
          undecided=[r for r in rows if r['candidate_rc'] not in (0,1)]
          wholesale_wrong=[r for r in rows if r['wholesale_rc']!=r['expected']]
          fast_wrong=[r for r in rows if r['fast_rc'] in (0,1) and r['fast_rc']!=r['expected']]
          fast_res=[r for r in rows if r['fast_rc'] in (2,3)]
          fast_dec=[r for r in rows if r['fast_rc'] in (0,1)]
          fast_disagreement=[r for r in fast_dec if r['candidate_rc']!=r['fast_rc']]

          assert not wrong,wrong
          assert not undecided,undecided
          assert not wholesale_wrong,wholesale_wrong
          assert not fast_wrong,fast_wrong
          assert not fast_disagreement,fast_disagreement
          assert len(fast_res)==46,len(fast_res)
          assert len(fast_dec)==147,len(fast_dec)

          def med_ratio(rs):
              return statistics.median(r['candidate_ns']/r['wholesale_ns'] for r in rs)

          summary={
            'schema':'nucleus-hybrid-complete-v1',
            'candidate_sha':os.environ['GITHUB_SHA'],
            'fast_sha':os.environ['FAST_SHA'],
            'wholesale_sha':os.environ['WHOLESALE_SHA'],
            'complete_semantics_sha':os.environ['COMPLETE_SHA'],
            'fixed_outcome_tests':len(rows),
            'accept':sum(r['candidate_rc']==0 for r in rows),
            'reject':sum(r['candidate_rc']==1 for r in rows),
            'delegated':len(undecided),
            'wrong':wrong,
            'fast_native_decisions':len(fast_dec),
            'fast_residual':len(fast_res),
            'fast_accept':sum(r['fast_rc']==0 for r in rows),
            'fast_reject':sum(r['fast_rc']==1 for r in rows),
            'fast_path_disagreement':fast_disagreement,
            'candidate_binary_bytes':cand.stat().st_size,
            'wholesale_binary_bytes':wholesale.stat().st_size,
            'median_candidate_over_wholesale_all':med_ratio(rows),
            'median_candidate_over_wholesale_fast_decided':med_ratio(fast_dec),
            'median_candidate_over_wholesale_residual':med_ratio(fast_res),
            'candidate_total_ns':sum(r['candidate_ns'] for r in rows),
            'wholesale_total_ns':sum(r['wholesale_ns'] for r in rows),
            'residual_tests':[r['test'] for r in fast_res],
          }
          assert summary['accept']==122,summary
          assert summary['reject']==71,summary
          assert summary['delegated']==0,summary

          out=pathlib.Path('evidence-out/hybrid-complete-v1')
          (out/'result.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (out/'rows.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-hybrid-complete-${{ github.sha }}
          path: metatron-kernel/evidence-out/hybrid-complete-v1
          if-no-files-found: error
