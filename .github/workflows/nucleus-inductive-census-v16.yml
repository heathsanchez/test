name: Nucleus Inductive Census v16

on:
  push:
    branches: [nucleus-inductive-census-v16]
    paths:
      - ".github/workflows/nucleus-inductive-census-v16.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - name: Build diagnostic
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked
      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Census terminal inductive blockers
        working-directory: metatron-kernel
        env:
          NUCLEUS_TRACE_INDUCTIVE_CENSUS: "1"
        run: |
          set -euo pipefail
          mkdir -p evidence-out/inductive-census-v16
          python - <<'PY'
          import json,pathlib,subprocess,os
          root=pathlib.Path('/tmp/tests')
          binary=pathlib.Path('target/release/metatron-kernel').resolve()
          targets=[
            ('good','init-prelude'),('good','perf/app-lam'),('good','perf/fueled-chain'),
            ('good','perf/grind-ring-5'),('good','perf/magma-list-deep-n21'),
            ('good','perf/magma-list-deep-n36'),('good','perf/magma-list-pair-n21'),
            ('good','perf/magma-list-pair-n7'),('good','tutorial/086_PSigma.snd'),
            ('good','tutorial/089_projProp1'),('good','tutorial/091_projProp3'),
            ('good','tutorial/095_projDataIndexRec'),
            ('bad','bugs/ctor-num-fields'),('bad','bugs/large-elim-param'),
            ('bad','bugs/large-elim-prop-bool'),('bad','bugs/proj-of-imax-prop'),
            ('bad','bugs/proj-of-stuck-prop'),('bad','bugs/proj-of-subst-prop'),
            ('bad','bugs/rec-missing-ih'),('bad','bugs/rec-of-subst-prop'),
            ('bad','other/proj-of-prop'),('bad','tutorial/111_indexedUnitEta'),
            ('bad','tutorial/113_indexedStructEta'),
          ]
          rows=[]
          for d,name in targets:
              p=root/d/(name+'.ndjson')
              with p.open('rb') as f:
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,env=dict(os.environ),timeout=120)
              marks=[x.split('NUCLEUS_INDUCTIVE_CENSUS:',1)[1] for x in q.stderr.decode(errors='replace').splitlines() if 'NUCLEUS_INDUCTIVE_CENSUS:' in x]
              rows.append({'test':name,'expected':0 if d=='good' else 1,'rc':q.returncode,'terminal':marks[-1] if marks else None,'count':len(marks)})
          out={'schema':'nucleus-inductive-census-v16','candidate_sha':os.environ['GITHUB_SHA'],'rows':rows}
          dest=pathlib.Path('evidence-out/inductive-census-v16')
          (dest/'result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-inductive-census-v16-${{ github.sha }}
          path: metatron-kernel/evidence-out/inductive-census-v16
          if-no-files-found: error
