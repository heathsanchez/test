name: Nucleus exact inductive frontier extraction
on:
  push:
    branches: [research/nucleus-reuse-tournaments-20261104]
    paths: ['.github/workflows/nucleus-inductive-frontier-20261104.yml', 'experiments/nucleus-inductive-frontier-20261104/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact complete Mathlib source
        run: |
          set -euo pipefail
          mkdir -p /tmp/mathlib-source
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/input.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/input.zip | sha256sum -c -
          unzip -q /tmp/input.zip -d /tmp/mathlib-source
          zstd -d /tmp/mathlib-source/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
          rm /tmp/input.zip /tmp/mathlib-source/mathlib.ndjson.zst
      - name: Preserve original bundled inductive declaration and source prefix
        run: python3 experiments/nucleus-inductive-frontier-20261104/extract.py --source /tmp/mathlib.ndjson --target LocallyFiniteOrder --out /tmp/inductive-frontier
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-locally-finite-source-${{ github.sha }}
          path: /tmp/inductive-frontier
          compression-level: 0
