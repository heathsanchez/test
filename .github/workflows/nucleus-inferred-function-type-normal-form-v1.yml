name: Nucleus Inferred Function Type Normal Form v1

on:
  push:
    branches: [nucleus-inferred-function-type-normal-form-v1]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 98f87d9e66fb97987427d68180f51a653d626fdb
  ARENA_ARTIFACT: "10712869614"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build diagnostic candidate and frozen authority
        run: |
          set -euo pipefail
          rustfmt --check --edition 2024 metatron-kernel/src/typecheck.rs
          cargo test --release --locked --lib --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          rm -rf /tmp/art /tmp/tests
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Full verdict-parity reclosure and frozen 11-case normal-form trace
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/inferred-function-type-normal-form-v1
          python3 - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path('/tmp/tests')
          base = pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand = pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          targets = [
              'init-prelude',
              'perf/app-lam',
              'perf/magma-list-deep-n21',
              'perf/magma-list-deep-n36',
              'perf/magma-list-pair-n21',
              'perf/magma-list-pair-n7',
              'tutorial/082_RBTree.id_spec',
              'tutorial/112_structEta',
              'tutorial/124_accRecReduction',
              'tutorial/101_ruleKAcc',
              'tutorial/125_accRecNoEta',
          ]

          corpus = {}
          for bucket, expected in [('good', 0), ('bad', 1)]:
              for p in sorted((root / bucket).rglob('*.ndjson')):
                  name = str(p.relative_to(root / bucket)).removesuffix('.ndjson')
                  assert name not in corpus, name
                  corpus[name] = (p, expected)

          assert len(corpus) == 193, len(corpus)
          assert all(name in corpus for name in targets), [
              name for name in targets if name not in corpus
          ]

          def rr(binary, path, trace=False):
              env = os.environ.copy()
              if trace:
                  env['NUCLEUS_TRACE_APP_FUNCTION_TYPE'] = '1'
                  env['NUCLEUS_TRACE_DOWNSTREAM'] = '1'
              with path.open('rb') as f:
                  q = subprocess.run(
                      [str(binary)],
                      stdin=f,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE if trace else subprocess.DEVNULL,
                      timeout=180,
                      env=env,
                  )
              return q.returncode, q.stderr.decode(errors='replace') if trace else ''

          parity = []
          for name, (path, expected) in sorted(corpus.items()):
              brc, _ = rr(base, path)
              crc, _ = rr(cand, path)
              parity.append({
                  'test': name,
                  'expected': expected,
                  'base': brc,
                  'candidate': crc,
              })

          mismatches = [r for r in parity if r['base'] != r['candidate']]
          assert not mismatches, mismatches
          assert sum(r['candidate'] in (2, 3) for r in parity) == 30

          pattern = re.compile(
              r'NUCLEUS_APP_FUNCTION_TYPE:'
              r'fun_expr=(?P<fun_expr>[^:]+):'
              r'type=(?P<type>[^:]+):'
              r'exposed=(?P<exposed>[^:]+):'
              r'head=(?P<head>.*?):'
              r'spine=(?P<spine>\d+):'
              r'result_type=(?P<result_type>[^:]+):'
              r'context_depth=(?P<context_depth>\d+):'
              r'budget=(?P<budget>\d+)'
          )

          rows = []
          coarse_counts = collections.Counter()
          full_counts = collections.Counter()
          for name in targets:
              path, expected = corpus[name]
              rc, err = rr(cand, path, True)
              assert rc in (2, 3), (name, rc)
              lines = [line for line in err.splitlines()
                       if 'NUCLEUS_APP_FUNCTION_TYPE:' in line]
              assert lines, (name, err[-4000:])
              terminal = lines[-1]
              match = pattern.search(terminal)
              assert match, (name, terminal)
              d = match.groupdict()
              head_family = d['head'].split(':', 1)[0]
              coarse = (
                  d['fun_expr'],
                  d['type'],
                  d['exposed'],
                  head_family,
                  d['result_type'],
              )
              full = coarse + (d['head'], d['spine'])
              coarse_counts[coarse] += 1
              full_counts[full] += 1
              rows.append({
                  'test': name,
                  'expected': expected,
                  'rc': rc,
                  'trace_count': len(lines),
                  'terminal_trace': terminal,
                  'normal_form': d,
                  'coarse_signature': list(coarse),
              })

          out = {
              'schema': 'nucleus-inferred-function-type-normal-form-v1',
              'prospective_selection_run': 36650933990,
              'prospective_experiment': 'nucleus-inferred-function-type-normal-form',
              'base_sha': os.environ['BASE_SHA'],
              'candidate_sha': os.environ['GITHUB_SHA'],
              'protected_corpus_cases': len(parity),
              'verdict_mismatches': mismatches,
              'residual_before': 30,
              'application_function_type_before': 11,
              'application_function_type_after': 11,
              'verified_residual_contraction': 0,
              'coarse_signature_count': len(coarse_counts),
              'full_signature_count': len(full_counts),
              'coarse_signatures': [
                  {'signature': list(k), 'count': v}
                  for k, v in sorted(coarse_counts.items(), key=lambda kv: (-kv[1], kv[0]))
              ],
              'full_signatures': [
                  {'signature': list(k), 'count': v}
                  for k, v in sorted(full_counts.items(), key=lambda kv: (-kv[1], kv[0]))
              ],
              'rows': rows,
          }
          pathlib.Path(
              'metatron-kernel/evidence-out/inferred-function-type-normal-form-v1/result.json'
          ).write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'verdict_mismatches': len(mismatches),
              'application_function_type_before': 11,
              'application_function_type_after': 11,
              'verified_residual_contraction': 0,
              'coarse_signature_count': len(coarse_counts),
              'coarse_signatures': out['coarse_signatures'],
              'full_signature_count': len(full_counts),
              'full_signatures': out['full_signatures'],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-inferred-function-type-normal-form-${{ github.sha }}
          path: metatron-kernel/evidence-out/inferred-function-type-normal-form-v1
          if-no-files-found: error
