name: Nucleus init-prelude app-function probe v1\n\non:\n  push:\n    branches: [nucleus-init-prelude-app-function-v1]\n    paths:\n      - ".github/workflows/nucleus-init-prelude-app-function-v1.yml"\n      - "metatron-kernel/**"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  diagnose:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 30\n    env:\n      ARENA_ARTIFACT: "11272848230"\n    steps:\n      - uses: actions/checkout@v4\n      - uses: dtolnay/rust-toolchain@stable\n\n      - name: Build diagnostic Nucleus\n        run: |\n          set -euo pipefail\n          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml\n          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml\n          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus\n\n      - name: Fetch immutable Arena corpus\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          set -euo pipefail\n          mkdir -p /tmp/a /tmp/tests\n          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip\n          unzip -q /tmp/arena.zip -d /tmp/a\n          tar --no-same-owner -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/tests\n\n      - name: Trace init-prelude shared blocker\n        run: |\n          set -euo pipefail\n          out=metatron-kernel/evidence-out/init-prelude-app-function-v1\n          mkdir -p "$out"\n          set +e\n          NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE=1 NUCLEUS_TRACE_DOWNSTREAM=1 \\n            /tmp/nucleus < /tmp/tests/good/init-prelude.ndjson \\n            > "$out/stdout.txt" 2> "$out/stderr.txt"\n          rc=$?\n          set -e\n          echo "$rc" > "$out/exit.txt"\n          python3 - <<'PY'\n          import json, pathlib, os\n          out=pathlib.Path("metatron-kernel/evidence-out/init-prelude-app-function-v1")\n          stderr=(out/"stderr.txt").read_text(errors="replace").splitlines()\n          d={\n            "schema":"nucleus-init-prelude-app-function-v1",\n            "qualification_commit":os.environ["GITHUB_SHA"],\n            "rc":int((out/"exit.txt").read_text().strip()),\n            "application_function_type":[x for x in stderr if "NUCLEUS_APPLICATION_FUNCTION_TYPE:" in x],\n            "application_function_exposure":[x for x in stderr if "NUCLEUS_APPLICATION_FUNCTION_EXPOSURE:" in x],\n            "downstream":[x for x in stderr if "NUCLEUS_DOWNSTREAM:" in x],\n          }\n          (out/"result.json").write_text(json.dumps(d,indent=2)+"\n")\n          print(json.dumps(d,indent=2))\n          assert d["rc"] == 2, d\n          assert d["application_function_type"], d\n          assert any("_private.Init.Prelude.0.noConfusion_of_Nat.aux._f" in x for x in d["downstream"]), d\n          PY\n\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: nucleus-init-prelude-app-function-v1-${{ github.sha }}\n          path: metatron-kernel/evidence-out/init-prelude-app-function-v1\n          if-no-files-found: error\n