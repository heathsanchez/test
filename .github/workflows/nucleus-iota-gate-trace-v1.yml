name: Nucleus Iota Gate Trace v1

on:
  push:
    branches: [nucleus-iota-gate-trace-v1]
    paths:
      - ".github/workflows/nucleus-iota-gate-trace-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - name: Prove independent runtime boundary
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs
      - name: Build diagnostic
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked
      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Trace recursor iota gate
        working-directory: metatron-kernel
        env:
          NUCLEUS_TRACE_IOTA: "1"
        run: |
          set -euo pipefail
          mkdir -p evidence-out/iota-gate-trace-v1
          python - <<'PY'
          import json,pathlib,subprocess,os
          root=pathlib.Path('/tmp/tests')
          binary=pathlib.Path('target/release/metatron-kernel').resolve()
          targets=[
            ('good','perf/args-before-unfold'),
            ('good','perf/folded-constant-first'),
            ('good','perf/folded-constant-last'),
            ('bad','perf/refute-cheap-first'),
            ('bad','perf/refute-cheap-last'),
          ]
          rows=[]
          for d,name in targets:
              p=root/d/(name+'.ndjson')
              env=dict(os.environ)
              with p.open('rb') as f:
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,env=env,timeout=120)
              lines=[x for x in q.stderr.decode(errors='replace').splitlines() if 'NUCLEUS_IOTA:' in x]
              rows.append({'test':name,'expected':0 if d=='good' else 1,'rc':q.returncode,'iota':lines})
          out={'schema':'nucleus-iota-gate-trace-v1','candidate_sha':os.environ['GITHUB_SHA'],'rows':rows}
          dest=pathlib.Path('evidence-out/iota-gate-trace-v1')
          (dest/'result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-iota-gate-trace-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/iota-gate-trace-v1
          if-no-files-found: error
