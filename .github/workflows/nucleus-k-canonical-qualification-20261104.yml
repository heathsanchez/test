name: Nucleus canonical nullary Prop K differential qualification
on:
  push:
    branches: [research/nucleus-k-canonical-metadata-20261104]
    paths:
      - '.github/workflows/nucleus-k-canonical-qualification-20261104.yml'
      - 'experiments/nucleus-k-canonical-20261104/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-and-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin a2578e77079719ff2064f910bd82fd01d8e120b6
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore SHA-pinned qualified ancestor, baseline and comparator
        run: |
          set -euo pipefail
          mkdir -p /tmp/dense-qualified /tmp/delta-qualified /tmp/base-dense /tmp/current208 /tmp/source-receipt /tmp/let-oracle /tmp/beq-source /tmp/std-source
          gh api repos/heathsanchez/test/actions/artifacts/13269133385/zip > /tmp/prior.zip
          printf '%s  %s\n' 689749feedc5025f0672dd7e7b091944f700f5b15c9a8105753341db38575d22 /tmp/prior.zip | sha256sum -c -
          unzip -q /tmp/prior.zip -d /tmp/dense-qualified
          gh api repos/heathsanchez/test/actions/artifacts/13271488438/zip > /tmp/delta.zip
          printf '%s  %s\n' 92c000926197c7e961ebf470aa7ed1b40d7584c48cc8fc2bfe8512fcd3471663 /tmp/delta.zip | sha256sum -c -
          unzip -q /tmp/delta.zip -d /tmp/delta-qualified
          zstd -dq /tmp/delta-qualified/next-frontier.ndjson.zst -o /tmp/std-prefix.ndjson
          printf '%s  %s\n' 282a7cf85e897f1e246fc25bc0cf6a6b69afdce72856f2fb500299504b8488ef /tmp/std-prefix.ndjson | sha256sum -c -
          gh api repos/heathsanchez/test/actions/artifacts/13268111683/zip > /tmp/dense-base.zip
          printf '%s  %s\n' 826a94548f9b95b1c18a173bbaa625d2ed96771b1c1d78fb3e4a9e8431ba77e4 /tmp/dense-base.zip | sha256sum -c -
          unzip -q /tmp/dense-base.zip -d /tmp/base-dense
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/inputs.zip
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/inputs.zip | sha256sum -c -
          unzip -q /tmp/inputs.zip -d /tmp/current208
          gh api repos/heathsanchez/test/actions/artifacts/13264820032/zip > /tmp/source-receipt.zip
          printf '%s  %s\n' 9fc805f01dc7525e14d7905c3bbaf9361e947eed420295e5e7e9d9a50155d7b9 /tmp/source-receipt.zip | sha256sum -c -
          unzip -q /tmp/source-receipt.zip -d /tmp/source-receipt
          grep -F 'Accepted 2004 declarations.' /tmp/source-receipt/reference-kernel.stdout
          gh api repos/heathsanchez/test/actions/artifacts/13261917242/zip > /tmp/let-oracle.zip
          printf '%s  %s\n' bde62a227167517215d6a011f48cbf211447dba5c476c8eddbc4aff345183d05 /tmp/let-oracle.zip | sha256sum -c -
          unzip -q /tmp/let-oracle.zip -d /tmp/let-oracle
          test -f /tmp/let-oracle/reference.json
          gh api repos/heathsanchez/test/actions/artifacts/13268572042/zip > /tmp/beq.zip
          printf '%s  %s\n' 00ce34eb4e8bb6e9b5fd8d5223bb07ef613364e8ece1f4fcc6cddb24804118b2 /tmp/beq.zip | sha256sum -c -
          unzip -q /tmp/beq.zip -d /tmp/beq-source
          zstd -dq /tmp/beq-source/next-frontier.ndjson.zst -o /tmp/beq-prefix.ndjson
          printf '%s  %s\n' d1c35f6a0de8644817b404e225a16de460e897e0b34c129fcb2a37483e630738 /tmp/beq-prefix.ndjson | sha256sum -c -
      - name: Restore pinned portable official Lean checker
        run: |
          set -euo pipefail
          mkdir -p /tmp/k-reference
          gh api repos/heathsanchez/test/actions/artifacts/13267462207/zip > /tmp/k-reference.zip
          printf '%s  %s\n' 9dfaff0a6cb272e6950e301aab75cf99e09a440f5ad881e2e1790019b4add1dd /tmp/k-reference.zip | sha256sum -c -
          unzip -q /tmp/k-reference.zip -d /tmp/k-reference
          chmod +x /tmp/k-reference/bundle/kernel /tmp/k-reference/bundle/run
      - name: Restore independently pinned complete Mathlib export
        run: |
          set -euo pipefail
          mkdir -p /tmp/mathlib-source
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/mathlib.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/mathlib.zip | sha256sum -c -
          unzip -q /tmp/mathlib.zip -d /tmp/mathlib-source
          zstd -dq /tmp/mathlib-source/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib.ndjson | sha256sum -c -
      - name: Prepare native protected controls
        run: |
          python3 -m py_compile experiments/nucleus-k-canonical-20261104/qualify.py
          python3 experiments/nucleus-nat-closure-20261104/generate_fixtures.py --out /tmp/nat-fixtures
          python3 experiments/nucleus-parameter-telescope-20261104/prepare.py
          python3 experiments/nucleus-nullary-enum-20261104/prepare.py
      - name: Exact native, source, Arena, negative, and complete Mathlib replay
        run: python3 experiments/nucleus-k-canonical-20261104/qualify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-k-canonical-protected-${{ github.sha }}
          path: |
            /tmp/nucleus-k-canonical-qualified/*.json
            /tmp/nucleus-k-canonical-qualified/candidate/*.json
            /tmp/nucleus-k-canonical-qualified/candidate/*.patch
            /tmp/nucleus-k-canonical-qualified/candidate/*.log
            /tmp/nucleus-k-canonical-qualified/candidate/nucleus
            /tmp/nucleus-k-canonical-qualified/red/stderr
            /tmp/nucleus-k-canonical-qualified/full/stderr
            /tmp/nucleus-k-canonical-qualified/full/time.txt
            /tmp/nucleus-k-canonical-qualified/red-std/stderr
            /tmp/nucleus-k-canonical-qualified/differential/**/*
            /tmp/nucleus-k-canonical-qualified/differential-inputs/inputs.json
            /tmp/nucleus-k-canonical-qualified/differential-inputs/closed/inputs.json
            /tmp/nucleus-k-canonical-qualified/next-frontier.ndjson.zst

