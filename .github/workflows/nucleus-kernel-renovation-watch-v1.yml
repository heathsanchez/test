name: Nucleus Kernel Renovation Watch v1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches: [nucleus-kernel-renovation-watch-v1]
    paths:
      - ".github/workflows/nucleus-kernel-renovation-watch-v1.yml"
      - "metatron-kernel/evidence/kernel-renovation-baseline-v1.json"

permissions:
  contents: read

concurrency:
  group: nucleus-kernel-renovation-watch-v1
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      interface_changed: ${{ steps.detect.outputs.interface_changed }}
      arena_sha: ${{ steps.detect.outputs.arena_sha }}
      lean_sha: ${{ steps.detect.outputs.lean_sha }}
      exporter_sha: ${{ steps.detect.outputs.exporter_sha }}
      format_version: ${{ steps.detect.outputs.format_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect renovation/interface movement
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/kernel-renovation-watch-v1
          python - <<'PY'
          import json, os, pathlib, re, subprocess

          root = pathlib.Path(".")
          baseline = json.loads(
              (root / "metatron-kernel/evidence/kernel-renovation-baseline-v1.json").read_text()
          )

          def gh(path):
              raw = subprocess.check_output(["gh", "api", path], text=True)
              return json.loads(raw)

          issue = gh("repos/leanprover/lean4/issues/14977")
          lean = gh("repos/leanprover/lean4/branches/master")
          decl = gh(
              "repos/leanprover/lean4/contents/src/Lean/Declaration.lean"
              f"?ref={lean['commit']['sha']}"
          )
          exporter = gh("repos/leanprover/lean4export/branches/master")
          format_file = gh(
              "repos/leanprover/lean4export/contents/format_ndjson.md"
              f"?ref={exporter['commit']['sha']}"
          )
          arena = gh("repos/leanprover/lean-kernel-arena/branches/master")

          import base64
          format_text = base64.b64decode(format_file["content"]).decode()
          m = re.search(r"version\s+([0-9]+\.[0-9]+\.[0-9]+)", format_text)
          format_version = m.group(1) if m else "UNKNOWN"

          labels = sorted(x["name"] for x in issue.get("labels", []))
          b_issue = baseline["lean_kernel_renovation"]
          b_export = baseline["lean4export"]
          b_arena = baseline["arena"]

          issue_changed = (
              issue["updated_at"] != b_issue["updated_at"]
              or issue["state"] != b_issue["state"]
              or b_issue["priority_label"] not in labels
          )
          declaration_changed = decl["sha"] != b_issue["declaration_blob_sha"]
          format_changed = format_version != b_export["format_version"]

          # Exporter/Arena/master movement is useful context but not by itself
          # treated as a kernel-interface change.
          ecosystem_changed = any([
              lean["commit"]["sha"] != b_issue["master_sha"],
              exporter["commit"]["sha"] != b_export["master_sha"],
              arena["commit"]["sha"] != b_arena["master_sha"],
          ])
          interface_changed = issue_changed or declaration_changed or format_changed

          report = {
              "schema": "nucleus-kernel-renovation-watch-v1",
              "baseline_file": "metatron-kernel/evidence/kernel-renovation-baseline-v1.json",
              "nucleus_base": baseline["independent_nucleus"],
              "current": {
                  "issue": {
                      "number": issue["number"],
                      "state": issue["state"],
                      "updated_at": issue["updated_at"],
                      "labels": labels,
                      "html_url": issue["html_url"],
                  },
                  "lean_master_sha": lean["commit"]["sha"],
                  "declaration_blob_sha": decl["sha"],
                  "lean4export_master_sha": exporter["commit"]["sha"],
                  "ndjson_format_version": format_version,
                  "arena_master_sha": arena["commit"]["sha"],
              },
              "changes": {
                  "issue_changed": issue_changed,
                  "declaration_changed": declaration_changed,
                  "format_changed": format_changed,
                  "ecosystem_changed": ecosystem_changed,
                  "interface_changed": interface_changed,
              },
              "epistemic_status": (
                  "RENOVATION_INTERFACE_CHANGED"
                  if interface_changed
                  else "BASELINE_INTERFACE_UNCHANGED"
              ),
              "boundary": (
                  "A change signal triggers replay; it does not itself authorize "
                  "new Nucleus semantics or imply Lean/FRO endorsement."
              ),
          }

          out = root / "metatron-kernel/evidence-out/kernel-renovation-watch-v1/detect.json"
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, sort_keys=True))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"interface_changed={str(interface_changed).lower()}\n")
              f.write(f"arena_sha={arena['commit']['sha']}\n")
              f.write(f"lean_sha={lean['commit']['sha']}\n")
              f.write(f"exporter_sha={exporter['commit']['sha']}\n")
              f.write(f"format_version={format_version}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-kernel-renovation-detect-${{ github.run_id }}
          path: metatron-kernel/evidence-out/kernel-renovation-watch-v1/detect.json
          if-no-files-found: error

  replay:
    needs: detect
    if: needs.detect.outputs.interface_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      ARENA_SHA: ${{ needs.detect.outputs.arena_sha }}
      INDEPENDENT_BASE_SHA: 143a195a846e5625474f31786c68fc68379106fa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@stable

      - name: Prove checker runtime is unchanged from independent authority
        run: |
          set -euo pipefail
          git diff "$INDEPENDENT_BASE_SHA"...HEAD --             metatron-kernel/src             metatron-kernel/Cargo.toml             metatron-kernel/Cargo.lock > /tmp/runtime.diff
          test ! -s /tmp/runtime.diff

      - name: Build independent Nucleus
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus

      - name: Build live upstream Arena corpus
        timeout-minutes: 125
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q "$ARENA_SHA"
          cd /tmp/arena
          nix develop -c ./lka.py build-test

      - name: Replay independent Nucleus on renovated/live interface
        timeout-minutes: 35
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/kernel-renovation-watch-v1
          python - <<'PY'
          import json, os, pathlib, subprocess

          root = pathlib.Path("/tmp/arena/_build/tests")
          binary = pathlib.Path("/tmp/nucleus")
          rows = []

          # Arena fixed good/bad sets are the protected correctness boundary.
          for kind, expected in (("good", 0), ("bad", 1)):
              for p in sorted((root / kind).rglob("*.ndjson")):
                  name = str(p.relative_to(root / kind)).removesuffix(".ndjson")
                  try:
                      with p.open("rb") as f:
                          q = subprocess.run(
                              [str(binary)],
                              stdin=f,
                              stdout=subprocess.DEVNULL,
                              stderr=subprocess.PIPE,
                              timeout=180,
                          )
                      rc = q.returncode
                      stderr = q.stderr.decode(errors="replace")[-1000:]
                  except subprocess.TimeoutExpired:
                      rc = 124
                      stderr = "timeout"

                  rows.append({
                      "test": name,
                      "kind": kind,
                      "expected": expected,
                      "status": rc,
                      "stderr_tail": stderr if rc not in (0, 1, 2, 3) else "",
                  })

          wrong = [
              r for r in rows
              if r["status"] in (0, 1) and r["status"] != r["expected"]
          ]
          errors = [r for r in rows if r["status"] not in (0, 1, 2)]
          counts = {}
          for r in rows:
              counts[str(r["status"])] = counts.get(str(r["status"]), 0) + 1

          out = {
              "schema": "nucleus-kernel-renovation-replay-v1",
              "arena_sha": os.environ["ARENA_SHA"],
              "independent_base_sha": os.environ["INDEPENDENT_BASE_SHA"],
              "candidate_sha": os.environ["GITHUB_SHA"],
              "total": len(rows),
              "status_counts": counts,
              "wrong": wrong,
              "errors": errors,
              "rows": rows,
              "epistemic_status": (
                  "COMPATIBLE_ZERO_WRONG"
                  if not wrong and not errors
                  else "RENOVATION_INCOMPATIBLE"
              ),
          }
          p = pathlib.Path(
              "metatron-kernel/evidence-out/kernel-renovation-watch-v1/replay.json"
          )
          p.write_text(json.dumps(out, indent=2, sort_keys=True) + "\n")
          print(json.dumps({
              "total": out["total"],
              "status_counts": counts,
              "wrong": len(wrong),
              "errors": len(errors),
              "epistemic_status": out["epistemic_status"],
          }, sort_keys=True))

          assert rows, "no Arena fixed-outcome tests found"
          assert not wrong, wrong
          assert not errors, errors
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-kernel-renovation-replay-${{ github.run_id }}
          path: metatron-kernel/evidence-out/kernel-renovation-watch-v1/replay.json
          if-no-files-found: warn
