name: Nucleus Latest Arena Fast v1

on:
  push:
    branches: [nucleus-future-quotient-arena-v1]
    paths:
      - ".github/workflows/nucleus-latest-arena-fast-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  latest-arena-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARENA_SHA: 5e5685cef9e4793a0abba24604d873d068e6428e
      ARENA_RUN: "35999444447"
      TEST_ARTIFACT: "10808579876"
      TEST_ARTIFACT_DIGEST: sha256:6929dda35ef93f925299034c61f614d642f134a692793fa4e94dbc8bb3bee193
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build exact Nucleus candidate
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus

      - name: Fetch exact latest upstream Arena test artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/art /tmp/tests
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$TEST_ARTIFACT/zip > /tmp/tests.zip
          unzip -q /tmp/tests.zip -d /tmp/art
          test -f /tmp/art/lean-arena-tests.tar.gz
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Replay latest Arena correctness boundary
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/latest-arena-fast-v1
          python - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path('/tmp/tests')
          binary='/tmp/nucleus'
          rows=[]
          for kind, expected in [('good',0),('bad',1)]:
              for path in sorted((root/kind).rglob('*.ndjson')):
                  with path.open('rb') as f:
                      p=subprocess.run(
                          [binary],
                          stdin=f,
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.PIPE,
                          timeout=180,
                      )
                  rc=p.returncode
                  rows.append({
                      'test':str(path.relative_to(root/kind)).removesuffix('.ndjson'),
                      'kind':kind,
                      'expected':expected,
                      'status':rc,
                      'correct':rc==expected,
                      'residual':rc in (2,3),
                      'stderr_tail':p.stderr.decode(errors='replace')[-500:] if rc not in (0,1,2,3) else '',
                  })
          wrong=[r for r in rows if r['status'] in (0,1) and not r['correct']]
          errors=[r for r in rows if r['status'] not in (0,1,2,3)]
          counts={}
          for r in rows: counts[r['status']]=counts.get(r['status'],0)+1
          out={
              'schema':'nucleus-latest-arena-fast-v1',
              'arena_sha':os.environ['ARENA_SHA'],
              'arena_run':int(os.environ['ARENA_RUN']),
              'test_artifact':int(os.environ['TEST_ARTIFACT']),
              'test_artifact_digest':os.environ['TEST_ARTIFACT_DIGEST'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'total':len(rows),
              'status_counts':counts,
              'wrong':wrong,
              'errors':errors,
              'rows':rows,
          }
          dest=pathlib.Path('metatron-kernel/evidence-out/latest-arena-fast-v1/result.json')
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'total':len(rows),
              'status_counts':counts,
              'wrong':len(wrong),
              'errors':len(errors),
          },sort_keys=True))
          assert len(rows)==193
          assert not wrong, wrong
          assert not errors, errors
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-latest-arena-fast-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/latest-arena-fast-v1
          if-no-files-found: error
