name: Nucleus let metadata repair and qualified index tournament
on:
  push:
    branches: [research/nucleus-reuse-tournaments-20261104]
    paths: ['.github/workflows/nucleus-let-preservation-20261104.yml','experiments/nucleus-let-preservation-20261104/**','experiments/nucleus-let-index-stack-20261104/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nucleus-let-preservation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.receipt.outputs.artifact-id }}
      artifact_digest: ${{ steps.receipt.outputs.artifact-digest }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Fetch exact source base
        run: git fetch --no-tags --depth=1 origin a2578e77079719ff2064f910bd82fd01d8e120b6
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore exact corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/current208
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/inputs.zip
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/inputs.zip | sha256sum -c -
          unzip -q /tmp/inputs.zip -d /tmp/current208
      - name: Prepare pinned source controls
        run: |
          python3 experiments/nucleus-nat-closure-20261104/generate_fixtures.py --out /tmp/nat-fixtures
          python3 experiments/nucleus-parameter-telescope-20261104/prepare.py
          python3 experiments/nucleus-nullary-enum-20261104/prepare.py
      - name: Reuse independent source truth and prior complete native receipts
        run: |
          set -euo pipefail
          mkdir -p /tmp/let-baseline /tmp/let-oracle
          gh api repos/heathsanchez/test/actions/artifacts/13258536280/zip > /tmp/baseline.zip
          printf '%s  %s\n' 6921c1f2145b4f4561d6139bc3ac66cbc62c609bebe6542ea3d4ac5f3e369045 /tmp/baseline.zip | sha256sum -c -
          unzip -q /tmp/baseline.zip -d /tmp/let-baseline
          gh api repos/heathsanchez/test/actions/artifacts/13261917242/zip > /tmp/oracle.zip
          printf '%s  %s\n' bde62a227167517215d6a011f48cbf211447dba5c476c8eddbc4aff345183d05 /tmp/oracle.zip | sha256sum -c -
          unzip -q /tmp/oracle.zip -d /tmp/let-oracle
      - name: Causal RED then complete repaired candidate qualification
        run: python3 experiments/nucleus-let-preservation-20261104/runner.py qualify --out /tmp/let-qualification
      - uses: actions/upload-artifact@v4
        id: receipt
        if: always()
        with:
          name: nucleus-let-qualified-${{ github.sha }}
          path: |
            /tmp/let-qualification/*.json
            /tmp/let-qualification/*.log
            /tmp/let-qualification/candidate/*.json
            /tmp/let-qualification/candidate/*.log
            /tmp/let-qualification/candidate/source.patch
            /tmp/let-qualification/candidate/nucleus
  mathlib:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFIED_ARTIFACT: ${{ needs.qualify.outputs.artifact_id }}
      QUALIFIED_DIGEST: ${{ needs.qualify.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Fetch exact source base
        run: git fetch --no-tags --depth=1 origin a2578e77079719ff2064f910bd82fd01d8e120b6
      - name: Reuse exact qualified binary, source and verifier receipts
        run: |
          set -euo pipefail
          mkdir -p /tmp/let-qualified /tmp/let-oracle
          gh api repos/heathsanchez/test/actions/artifacts/$QUALIFIED_ARTIFACT/zip > /tmp/qualified.zip
          printf '%s  %s\n' "$QUALIFIED_DIGEST" /tmp/qualified.zip | sha256sum -c -
          unzip -q /tmp/qualified.zip -d /tmp/let-qualified
          cp /tmp/let-qualified/oracle-reference.json /tmp/let-oracle/reference.json
      - name: Restore exact complete Mathlib source
        run: |
          set -euo pipefail
          mkdir -p /tmp/full-source
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/input.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/input.zip | sha256sum -c -
          unzip -q /tmp/input.zip -d /tmp/full-source
          zstd -d /tmp/full-source/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib.ndjson | sha256sum -c -
          rm /tmp/input.zip /tmp/full-source/mathlib.ndjson.zst
      - name: Check full source using the exact newly qualified binary
        run: python3 experiments/nucleus-let-preservation-20261104/runner.py full --out /tmp/let-mathlib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-let-mathlib-${{ github.sha }}
          path: /tmp/let-mathlib
  index:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFIED_ARTIFACT: ${{ needs.qualify.outputs.artifact_id }}
      QUALIFIED_DIGEST: ${{ needs.qualify.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Fetch exact source base
        run: git fetch --no-tags --depth=1 origin a2578e77079719ff2064f910bd82fd01d8e120b6
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Reuse exact qualified binary, source and verifier receipts
        run: |
          set -euo pipefail
          mkdir -p /tmp/let-qualified /tmp/let-oracle
          gh api repos/heathsanchez/test/actions/artifacts/$QUALIFIED_ARTIFACT/zip > /tmp/qualified.zip
          printf '%s  %s\n' "$QUALIFIED_DIGEST" /tmp/qualified.zip | sha256sum -c -
          unzip -q /tmp/qualified.zip -d /tmp/let-qualified
          cp /tmp/let-qualified/oracle-reference.json /tmp/let-oracle/reference.json
      - name: Restore exact corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/current208
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/inputs.zip
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/inputs.zip | sha256sum -c -
          unzip -q /tmp/inputs.zip -d /tmp/current208
      - name: Prepare pinned source controls
        run: |
          python3 experiments/nucleus-nat-closure-20261104/generate_fixtures.py --out /tmp/nat-fixtures
          python3 experiments/nucleus-parameter-telescope-20261104/prepare.py
          python3 experiments/nucleus-nullary-enum-20261104/prepare.py
      - name: Restore exact complete Mathlib source
        run: |
          set -euo pipefail
          mkdir -p /tmp/full-source
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/input.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/input.zip | sha256sum -c -
          unzip -q /tmp/input.zip -d /tmp/full-source
          zstd -d /tmp/full-source/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib.ndjson | sha256sum -c -
          rm /tmp/input.zip /tmp/full-source/mathlib.ndjson.zst
      - name: Fresh index candidate validation and paired ABBAAB
        run: python3 experiments/nucleus-let-index-stack-20261104/runner.py --out /tmp/let-index
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-let-index-${{ github.sha }}
          path: |
            /tmp/let-index/*.json
            /tmp/let-index/candidate/*.json
            /tmp/let-index/candidate/*.log
            /tmp/let-index/candidate/source.patch
            /tmp/let-index/candidate/nucleus
            /tmp/let-index/matched/*/time.txt
            /tmp/let-index/matched/*/stderr
