name: Nucleus Lean PR 15924 smoke gate
on:
  push:
    branches:
      - exp/nucleus-lia-pr15924-20261026
    paths:
      - "compat/lean-pr15924/**"
      - "compat/arena-nested-recursor/**"
      - ".github/workflows/nucleus-lia-pr15924.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-arena-fixture-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify byte-identical upstream Arena regression source
        shell: bash
        run: |
          set -euo pipefail
          p=compat/arena-nested-recursor/nested-rec-rule-nfields.lean
          actual=$(git hash-object "$p")
          expected=780a8cc425874e85a27f0095d680eb016148eccb
          test "$actual" = "$expected"
          echo "Arena f0a0d057 fixture Git blob: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE INTEGRITY ONLY; not an exported checker verdict." >> "$GITHUB_STEP_SUMMARY"

  lean-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install and resolve Lean toolchain explicitly
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:nightly
          "$HOME/.elan/bin/lean" --version
      - name: Compile all five upstream-derived certificates
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/lean" compat/lean-pr15924/lia_divmod_direct_nucleus.lean
      - name: Report evidence boundary
        if: always()
        run: |
          echo "This job checks only Lean compilation on resolved nightly, not pinned PR bytes." >> "$GITHUB_STEP_SUMMARY"
          echo "It does NOT produce an NDJSON export or establish Nucleus acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "Exact PR commit to compare: 9e118e97309ae41cba636cd0b5027dbfcc58f115." >> "$GITHUB_STEP_SUMMARY"

  nucleus-unit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: metatron-kernel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Focused proof-irrelevance reproduction
        id: focused
        continue-on-error: true
        env:
          NUCLEUS_TRACE_LOCAL_PROOF_IRREL: "1"
          NUCLEUS_TRACE_VALUE_MISMATCH: "1"
        run: |
          set -o pipefail
          cargo test --locked --features diagnostics --test checked_relevance_signature -- --nocapture 2>&1 | tee ../focused-proof-irrelevance.log
      - name: Existing kernel tests — fail on any red, including proof irrelevance
        id: full
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --locked --all-targets 2>&1 | tee ../all-kernel-tests.log
      - name: Retain actual diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-pr15924-kernel-logs
          path: |
            focused-proof-irrelevance.log
            all-kernel-tests.log
          if-no-files-found: warn
      - name: Enforce both test gates
        if: always()
        run: |
          echo "focused=${{ steps.focused.outcome }} full=${{ steps.full.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          test "${{ steps.focused.outcome }}" = success
          test "${{ steps.full.outcome }}" = success
      - name: Record scope
        if: always()
        run: |
          echo "Full kernel unit suite; proof relevance failure stays red." >> "$GITHUB_STEP_SUMMARY"
          echo "Not the original frozen196 byte-pinned corpus." >> "$GITHUB_STEP_SUMMARY"
