name: Nucleus Lean PR 15924 smoke gate
on:
  push:
    branches:
      - exp/nucleus-lia-pr15924-20261026
    paths:
      - "compat/lean-pr15924/**"
      - ".github/workflows/nucleus-lia-pr15924.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install and resolve Lean toolchain explicitly
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:nightly
          "$HOME/.elan/bin/lean" --version
      - name: Compile all five upstream-derived certificates
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/lean" compat/lean-pr15924/lia_divmod_direct_nucleus.lean
      - name: Report evidence boundary
        if: always()
        run: |
          echo "This job checks only Lean compilation on resolved nightly, not pinned PR bytes." >> "$GITHUB_STEP_SUMMARY"
          echo "It does NOT produce an NDJSON export or establish Nucleus acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "Exact PR commit to compare: 9e118e97309ae41cba636cd0b5027dbfcc58f115." >> "$GITHUB_STEP_SUMMARY"

  nucleus-unit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: metatron-kernel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Focused proof-irrelevance reproduction\n        env:\n          NUCLEUS_TRACE_LOCAL_PROOF_IRREL: "1"\n        run: cargo test --locked --test checked_relevance_signature -- --nocapture\n      - name: Existing kernel tests — fail on any red, including proof irrelevance
        run: cargo test --locked --all-targets
      - name: Record scope
        if: always()
        run: |
          echo "Full kernel unit suite; proof relevance failure stays red." >> "$GITHUB_STEP_SUMMARY"
          echo "Not the original frozen196 byte-pinned corpus." >> "$GITHUB_STEP_SUMMARY"
