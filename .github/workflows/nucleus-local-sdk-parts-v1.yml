name: Nucleus Local SDK Parts
on:
  push:
    branches: [nucleus-local-sdk-parts-v1]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Split SDK into transferable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/heathsanchez/test/actions/artifacts/11124984683/zip > sdk.zip
          unzip -q sdk.zip
          split -b 24M -d rust-sdk.tar.gz sdk-part-
          sha256sum rust-sdk.tar.gz sdk-part-*
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-sdk-part-00
          path: sdk-part-00
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-sdk-part-01
          path: sdk-part-01
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-sdk-part-02
          path: sdk-part-02
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-sdk-part-03
          path: sdk-part-03
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-sdk-part-04
          path: sdk-part-04
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-sdk-part-05
          path: sdk-part-05
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-sdk-part-06
          path: sdk-part-06
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-sdk-part-07
          path: sdk-part-07
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-sdk-part-08
          path: sdk-part-08
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-sdk-part-09
          path: sdk-part-09
          if-no-files-found: ignore
          compression-level: 0
