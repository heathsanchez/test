# C18 plus C25–C37: test full remaining-owner source recursor replay.
# No original input, global budget or default kernel flag changes.
name: Nucleus C37 full-owner recursor audit
on:
  push:
    branches: [research/nucleus-logos-support-20261108, research/nucleus-c36-crosshead-20261108, research/nucleus-c37-full-owner-20261108]
    paths: ['.github/workflows/nucleus-logos-support-20261108.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  source-qualified-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore exact selected source and apply source-qualified C11–C18 and C25–C33 patches
        run: |
          set -euo pipefail
          mkdir -p base candidate reports original196 arena207
          gh api repos/heathsanchez/test/actions/artifacts/13520537513/zip > source.zip
          printf '%s  %s\n' f8dc913015842af9a923c6b419f29d9b2fad14e269ea8bfbbbbcce9ffd7a9b0f source.zip | sha256sum -c -
          unzip -q source.zip -d base
          printf '%s  %s\n' f1614835294c40a206f58accf9835ceeaae646eedb5cd4bebfac1d7c85d89ae4 base/candidate/source.tar.gz | sha256sum -c -
          tar --no-same-owner -xzf base/candidate/source.tar.gz
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/logos-projection-shadow.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c12-caller-site.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c13-large-replay-residual.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c14-projection-major-boundary.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c15-bounded-projection-major.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c16-metered-projection-borrow.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c17-diagnostic-projection-cap.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c18-projection-worklist-continuation.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c25-source-checked-keyless-worklist.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c26-source-major-chain-census.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c27-pre-iota-source-congruence-observer.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c28-source-certified-pre-iota-congruence.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c29-source-state-worklist-observer.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c30-exact-worklist-exposure-cache.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c31-source-projection-transition-observer.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c32-source-major-grant-diagnostic.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c33-source-congruence-grant-diagnostic.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c34-fallback-reserve-scheduling.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c35-source-owned-metered-recursor-trials.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c36-source-certified-cross-head-replay.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-logos-support-20261108/c37-full-owner-replay-reason.patch
          sha256sum experiments/nucleus-logos-support-20261108/logos-projection-shadow.patch experiments/nucleus-logos-support-20261108/c12-caller-site.patch experiments/nucleus-logos-support-20261108/c13-large-replay-residual.patch experiments/nucleus-logos-support-20261108/c14-projection-major-boundary.patch experiments/nucleus-logos-support-20261108/c15-bounded-projection-major.patch experiments/nucleus-logos-support-20261108/c16-metered-projection-borrow.patch experiments/nucleus-logos-support-20261108/c17-diagnostic-projection-cap.patch experiments/nucleus-logos-support-20261108/c18-projection-worklist-continuation.patch experiments/nucleus-logos-support-20261108/c25-source-checked-keyless-worklist.patch experiments/nucleus-logos-support-20261108/c26-source-major-chain-census.patch experiments/nucleus-logos-support-20261108/c27-pre-iota-source-congruence-observer.patch experiments/nucleus-logos-support-20261108/c28-source-certified-pre-iota-congruence.patch experiments/nucleus-logos-support-20261108/c29-source-state-worklist-observer.patch experiments/nucleus-logos-support-20261108/c30-exact-worklist-exposure-cache.patch experiments/nucleus-logos-support-20261108/c31-source-projection-transition-observer.patch experiments/nucleus-logos-support-20261108/c32-source-major-grant-diagnostic.patch experiments/nucleus-logos-support-20261108/c33-source-congruence-grant-diagnostic.patch experiments/nucleus-logos-support-20261108/c34-fallback-reserve-scheduling.patch experiments/nucleus-logos-support-20261108/c35-source-owned-metered-recursor-trials.patch experiments/nucleus-logos-support-20261108/c36-source-certified-cross-head-replay.patch experiments/nucleus-logos-support-20261108/c37-full-owner-replay-reason.patch > reports/patch.sha256
          find metatron-kernel/src -type f -print0 | sort -z | xargs -0 sha256sum > reports/source.sha256
          cargo check --locked --all-targets --features diagnostics --manifest-path metatron-kernel/Cargo.toml > reports/plain-build.log 2>&1 || { tail -n 100 reports/plain-build.log; exit 1; }
      - name: Native proof-obligation and adversarial controls
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json)
          env "${flags[@]}" cargo test --manifest-path metatron-kernel/Cargo.toml --locked --features diagnostics > reports/native.log 2>&1 || { tail -n 100 reports/native.log; exit 1; }
          cargo build --locked --release --features diagnostics --bin metatron-kernel --manifest-path metatron-kernel/Cargo.toml > reports/release-build.log 2>&1 || { tail -n 100 reports/release-build.log; exit 1; }
          cp metatron-kernel/target/release/metatron-kernel candidate/
          sha256sum base/candidate/metatron-kernel candidate/metatron-kernel > reports/binaries.sha256
          tar --exclude=target --exclude=.git -czf candidate/source.tar.gz metatron-kernel
      - name: Restore two unchanged original test corpora
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > original196.zip
          printf '%s  %s\n' f6cd590db7f6fb92b8d1b3ca87231d4b0f521f085d73f93abd005f5caaff86d2 original196.zip | sha256sum -c -
          unzip -p original196.zip lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C original196
          gh api repos/heathsanchez/test/actions/artifacts/13276400289/zip > arena207.zip
          printf '%s  %s\n' a9582eadc0d9893cbe39e6bcfccd79bfaec2032838851b8a487c35df16096763 arena207.zip | sha256sum -c -
          unzip -p arena207.zip lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C arena207
      - name: C18 red-green projection continuation on frozen original Magma n7
        run: |
          set -euo pipefail
          python3 experiments/nucleus-logos-support-20261108/probe_c18_projection_worklist.py \
            --binary candidate/metatron-kernel \
            --input arena207/good/perf/magma-list-pair-n7.ndjson \
            --flags base/flags.json | tee reports/c18-projection-worklist.json
      - name: C25 source-confirmed keyless recursor replay on four unchanged Magma originals
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json)
          printf 'name\tsha256\trc\tkeyless_records\n' > reports/c25-four-magma.tsv
          for name in magma-list-pair-n7 magma-list-pair-n21 magma-list-deep-n21 magma-list-deep-n36; do
            case "$name" in
              magma-list-pair-n7)  digest='abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35' ;;
              magma-list-pair-n21) digest='b8279fa9189a203c6c11b04702c27c0f99a650b37f2b0165dd260b1d14e9ef84' ;;
              magma-list-deep-n21) digest='b7a211699ab32a5d2397319702e2d5552f5796a6bdac990efa69fb186039f526' ;;
              magma-list-deep-n36) digest='6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac' ;;
            esac
            original="arena207/good/perf/$name.ndjson"
            printf '%s  %s\n' "$digest" "$original" | sha256sum -c -
            set +e
            env "${flags[@]}" NUCLEUS_DIAGNOSTIC_NO_REPLAY_KEYS=1 \
              timeout --signal=TERM --kill-after=3s 120s candidate/metatron-kernel \
              < "$original" > "reports/c25-$name.stdout" 2> "reports/c25-$name.stderr"
            rc=$?
            set -e
            case "$rc" in 0|2|124) ;; *) echo "Unexpected keyless native result: $name rc=$rc"; exit 1 ;; esac
            records=$(grep -c '^NUCLEUS_REPLAY_KEYLESS_SOURCE:' "reports/c25-$name.stderr" || true)
            test "$records" -gt 0 || { echo "Keyless source branch not exercised for $name"; exit 1; }
            printf '%s\t%s\t%s\t%s\n' "$name" "$digest" "$rc" "$records" >> reports/c25-four-magma.tsv
          done
          sed -n '1,5p' reports/c25-four-magma.tsv
      - name: C26 observe actual lexical major chain on unchanged Magma originals, with and without key lookup
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json)
          printf 'name\tcache_mode\tsha256\trc\tmajor_failures\tchain_records\n' > reports/c26-source-major-chain.tsv
          for name in magma-list-pair-n7 magma-list-pair-n21 magma-list-deep-n21 magma-list-deep-n36; do
            original="arena207/good/perf/$name.ndjson"
            case "$name" in
              magma-list-pair-n7)  digest='abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35' ;;
              magma-list-pair-n21) digest='b8279fa9189a203c6c11b04702c27c0f99a650b37f2b0165dd260b1d14e9ef84' ;;
              magma-list-deep-n21) digest='b7a211699ab32a5d2397319702e2d5552f5796a6bdac990efa69fb186039f526' ;;
              magma-list-deep-n36) digest='6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac' ;;
            esac
            printf '%s  %s\n' "$digest" "$original" | sha256sum -c -
            for mode in keyed keyless; do
              mode_flag=()
              if test "$mode" = keyless; then mode_flag=(NUCLEUS_DIAGNOSTIC_NO_REPLAY_KEYS=1); fi
              set +e
              env "${flags[@]}" "${mode_flag[@]}" NUCLEUS_DIAGNOSTIC_MAJOR_CHAIN=1 \
                NUCLEUS_TRACE_NESTED_RECURSOR_IOTA_FAILURE=1 \
                timeout --signal=TERM --kill-after=3s 120s candidate/metatron-kernel \
                < "$original" > "reports/c26-$name-$mode.stdout" 2> "reports/c26-$name-$mode.stderr"
              rc=$?
              set -e
              case "$rc" in 0|2|124) ;; *) echo "Unexpected diagnostic result: $name $mode rc=$rc"; exit 1 ;; esac
              failures=$(grep -c '^NUCLEUS_NESTED_REPLAY_FAILURE:stage=major:' "reports/c26-$name-$mode.stderr" || true)
              records=$(grep -c '^NUCLEUS_SOURCE_MAJOR_CHAIN:' "reports/c26-$name-$mode.stderr" || true)
              limit=$failures
              if test "$limit" -gt 16; then limit=16; fi
              test "$limit" -eq "$records" || { echo "Incomplete bounded source-chain census: $name $mode $failures/$records"; exit 1; }
              if test "$name" = magma-list-pair-n7; then test "$records" -gt 0; fi
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$name" "$mode" "$digest" "$rc" "$failures" "$records" >> reports/c26-source-major-chain.tsv
            done
          done
          sed -n '1,9p' reports/c26-source-major-chain.tsv
      - name: C27 observe pure relational source congruence before recursor iota on four original Magma cases
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json)
          printf 'name\tsha256\trc\tpre_iota_trials\tpre_iota_proven\n' > reports/c27-pre-iota-source-congruence.tsv
          for name in magma-list-pair-n7 magma-list-pair-n21 magma-list-deep-n21 magma-list-deep-n36; do
            original="arena207/good/perf/$name.ndjson"
            case "$name" in
              magma-list-pair-n7)  digest='abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35' ;;
              magma-list-pair-n21) digest='b8279fa9189a203c6c11b04702c27c0f99a650b37f2b0165dd260b1d14e9ef84' ;;
              magma-list-deep-n21) digest='b7a211699ab32a5d2397319702e2d5552f5796a6bdac990efa69fb186039f526' ;;
              magma-list-deep-n36) digest='6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac' ;;
            esac
            printf '%s  %s\n' "$digest" "$original" | sha256sum -c -
            set +e
            env "${flags[@]}" NUCLEUS_DIAGNOSTIC_PRE_IOTA_CONGRUENCE=1 \
              timeout --signal=TERM --kill-after=3s 120s candidate/metatron-kernel \
              < "$original" > "reports/c27-$name.stdout" 2> "reports/c27-$name.stderr"
            rc=$?
            set -e
            test "$rc" -eq 2 || { echo "C27 observer changed native UNKNOWN: $name rc=$rc"; exit 1; }
            trials=$(grep -c '^NUCLEUS_PRE_IOTA_CONGRUENCE:' "reports/c27-$name.stderr" || true)
            proved=$(grep -c '^NUCLEUS_PRE_IOTA_CONGRUENCE:.*:proved=true:' "reports/c27-$name.stderr" || true)
            test "$trials" -gt 0 || { echo "No C27 observation on original $name"; exit 1; }
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$digest" "$rc" "$trials" "$proved" >> reports/c27-pre-iota-source-congruence.tsv
          done
          sed -n '1,5p' reports/c27-pre-iota-source-congruence.tsv
      - name: C28 source-certified congruence-first opt-in on all six unchanged valid originals
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json)
          printf 'name\tsha256\trc\ttrials\tproved\n' > reports/c28-six-originals.tsv
          for name in fueled-chain grind-ring-5 magma-list-pair-n7 magma-list-pair-n21 magma-list-deep-n21 magma-list-deep-n36; do
            original="arena207/good/perf/$name.ndjson"
            case "$name" in
              fueled-chain) digest='e5ca34489fc7b8ee13b1e7f09f76247ab7b01dd1a752a13cc8b796c569e1401a' ;;
              grind-ring-5) digest='e9c394e0ff311fd10f60dee2433a530f16e82354c32d6588a8775baa06fd221f' ;;
              magma-list-pair-n7) digest='abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35' ;;
              magma-list-pair-n21) digest='b8279fa9189a203c6c11b04702c27c0f99a650b37f2b0165dd260b1d14e9ef84' ;;
              magma-list-deep-n21) digest='b7a211699ab32a5d2397319702e2d5552f5796a6bdac990efa69fb186039f526' ;;
              magma-list-deep-n36) digest='6669cee92ad330dada351ac9e63656f7e9e848dd70376f17030d64677f8c81ac' ;;
            esac
            printf '%s  %s\n' "$digest" "$original" | sha256sum -c -
            set +e
            env ""${flags[@]}"" NUCLEUS_EXPERIMENTAL_PRE_IOTA_SOURCE_CONGRUENCE=1 \
              timeout --signal=TERM --kill-after=3s 120s candidate/metatron-kernel \
              < "$original" > "reports/c28-$name.stdout" 2> "reports/c28-$name.stderr"
            rc=$?
            set -e
            case "$rc" in 0|2) ;; *) echo "Unexpected C28 native result: $name rc=$rc"; exit 1 ;; esac
            trials=$(grep -c '^NUCLEUS_C28_SOURCE_CONGRUENCE:' "reports/c28-$name.stderr" || true)
            proved=$(grep -c '^NUCLEUS_C28_SOURCE_CONGRUENCE:.*:proved=true:' "reports/c28-$name.stderr" || true)
            if test "$name" = magma-list-pair-n7; then test "$trials" -gt 0 || { echo "C28 opt-in path not exercised"; exit 1; }; fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$digest" "$rc" "$trials" "$proved" >> reports/c28-six-originals.tsv
          done
          sed -n '1,7p' reports/c28-six-originals.tsv
      - name: C30 exact source-major cache on six unchanged original valid proofs
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json)
          printf 'name\tsha256\trc\tstores_power2\thits_power2\n' > reports/c30-six-originals.tsv
          for name in fueled-chain grind-ring-5 magma-list-pair-n7 magma-list-pair-n21 magma-list-deep-n21 magma-list-deep-n36; do
            original="arena207/good/perf/$name.ndjson"
            digest=$(awk -F '\t' -v n="$name" '$1==n {print $2}' reports/c28-six-originals.tsv)
            test -n "$digest" || exit 1
            printf '%s  %s\n' "$digest" "$original" | sha256sum -c -
            set +e
            env "${flags[@]}" NUCLEUS_DIAGNOSTIC_C30_EXACT_MAJOR_CACHE=1 \
              timeout --signal=TERM --kill-after=3s 120s candidate/metatron-kernel \
              < "$original" > "reports/c30-$name.stdout" 2> "reports/c30-$name.stderr"
            rc=$?
            set -e
            case "$rc" in 0|2) ;; *) echo "Unexpected C30 native result: $name rc=$rc"; exit 1 ;; esac
            stores=$(grep -c '^NUCLEUS_C30_EXACT_MAJOR_CACHE:store_count=' "reports/c30-$name.stderr" || true)
            hits=$(grep -c '^NUCLEUS_C30_EXACT_MAJOR_CACHE:hit_count=' "reports/c30-$name.stderr" || true)
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$digest" "$rc" "$stores" "$hits" >> reports/c30-six-originals.tsv
          done
          sed -n '1,7p' reports/c30-six-originals.tsv
      - name: C31 frozen n7 actual PProd projection transitions, keyed and keyless observers
        run: |
          set -euo pipefail
          python3 experiments/nucleus-logos-support-20261108/probe_c31_projection_transitions.py \
            --binary candidate/metatron-kernel \
            --input arena207/good/perf/magma-list-pair-n7.ndjson \
            --flags base/flags.json \
            --stderr reports/c31-n7-keyed.stderr | tee reports/c31-n7-keyed.json
          python3 experiments/nucleus-logos-support-20261108/probe_c31_projection_transitions.py \
            --binary candidate/metatron-kernel \
            --input arena207/good/perf/magma-list-pair-n7.ndjson \
            --flags base/flags.json \
            --keyless --stderr reports/c31-n7-keyless.stderr | tee reports/c31-n7-keyless.json
      - name: C32 frozen source-major local grant sweep under unchanged global owner
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/nucleus-logos-support-20261108 -p 'test_c32_*.py' -v
          for cap in 512 768 1024 1536 2048 4096 8192 16384; do
            python3 experiments/nucleus-logos-support-20261108/probe_c32_major_grants.py \
              --binary candidate/metatron-kernel \
              --input arena207/good/perf/magma-list-pair-n7.ndjson \
              --flags base/flags.json \
              --cap "$cap" --require-markers \
              --stderr "reports/c32-cap-$cap.stderr" | tee "reports/c32-cap-$cap.json"
          done
          set +e
          env $(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json) NUCLEUS_DIAGNOSTIC_C32_RECURSOR_MAJOR_GRANT=invalid candidate/metatron-kernel \
            < arena207/good/perf/magma-list-pair-n7.ndjson > reports/c32-invalid.stdout 2> reports/c32-invalid.stderr
          rc="$?"
          set -e
          test "$rc" -eq 2
          test ! -s reports/c32-invalid.stdout
          echo "C32 malformed local cap failed closed (UNKNOWN)"

      - name: C33 frozen source-certified pre-iota congruence grant sweep
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/nucleus-logos-support-20261108 -p 'test_c33_*.py' -v
          for cap in 512 768 1024 1536 2048 4096 8192; do
            python3 experiments/nucleus-logos-support-20261108/probe_c33_source_congruence.py \
              --binary candidate/metatron-kernel \
              --input arena207/good/perf/magma-list-pair-n7.ndjson \
              --flags base/flags.json \
              --cap "$cap" --require-cap-effect \
              --stderr "reports/c33-cap-$cap.stderr" | tee "reports/c33-cap-$cap.json"
          done
          set +e
          env $(jq -r 'to_entries[] | "\(.key)=\(.value)"' base/flags.json) NUCLEUS_EXPERIMENTAL_PRE_IOTA_SOURCE_CONGRUENCE=1 NUCLEUS_DIAGNOSTIC_C33_SOURCE_CONGRUENCE_GRANT=invalid candidate/metatron-kernel \
            < arena207/good/perf/magma-list-pair-n7.ndjson > reports/c33-invalid.stdout 2> reports/c33-invalid.stderr
          rc="$?"
          set -e
          test "$rc" -eq 2
          test ! -s reports/c33-invalid.stdout
          echo "C33 malformed source-congruence cap failed closed (UNKNOWN)"

      - name: C34 source-owned fallback reservation on unchanged Magma n7
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/nucleus-logos-support-20261108 -p 'test_c34_*.py' -v
          for arm in 2048:2 2048:3 2048:4 2048:8 1024:2 512:2; do
            IFS=: read -r cap divisor <<< "$arm"
            python3 experiments/nucleus-logos-support-20261108/probe_c34_fallback_reserve.py \
              --binary candidate/metatron-kernel \
              --input arena207/good/perf/magma-list-pair-n7.ndjson \
              --flags base/flags.json \
              --cap "$cap" --divisor "$divisor" \
