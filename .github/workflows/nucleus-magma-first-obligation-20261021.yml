name: Nucleus first shared Magma obligation source diagnostic
on:
  push:
    branches: [research/nucleus-magma-first-obligation-20261021]
    paths:
      - '.github/scripts/nucleus_first_magma_obligation_20261021.py'
      - '.github/workflows/nucleus-magma-first-obligation-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Establish unchanged qualified independent Nucleus source
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-magma-evidence /tmp/nucleus-magma-testpack /tmp/nucleus-magma-corpus
          git rev-parse HEAD > /tmp/nucleus-magma-evidence/research-commit.txt
          git rev-parse HEAD:metatron-kernel > /tmp/nucleus-magma-evidence/qualified-source-tree.txt
          EXPECTED_SOURCE_TREE=5e7d65b1b6abc3f6380bc7a37ffb153284d7faf1
          ACTUAL_SOURCE_TREE=$(git rev-parse HEAD:metatron-kernel)
          test "$ACTUAL_SOURCE_TREE" = "$EXPECTED_SOURCE_TREE" || {
            echo "UNAUTHORIZED_SEMANTIC_SOURCE_TREE:$ACTUAL_SOURCE_TREE expected:$EXPECTED_SOURCE_TREE"
            exit 1
          }
          printf '%s\n' "qualified_subtree=$EXPECTED_SOURCE_TREE" > /tmp/nucleus-magma-evidence/immutable-source-proof.txt
          rustc -vV > /tmp/nucleus-magma-evidence/rustc.txt
      - name: Compile original checker and run all required native Rust tests
        run: |
          set -euo pipefail
          NUCLEUS_EXPERIMENTAL_RELEVANCE=1 NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA=1 \
            cargo test --release --locked --features diagnostics \
              --manifest-path metatron-kernel/Cargo.toml \
              > /tmp/nucleus-magma-evidence/rust-tests.log 2>&1 || {
                tail -100 /tmp/nucleus-magma-evidence/rust-tests.log; exit 1;
              }
          cargo build --release --locked --features diagnostics \
            --manifest-path metatron-kernel/Cargo.toml
          sha256sum metatron-kernel/target/release/metatron-kernel > /tmp/nucleus-magma-evidence/binary.sha256
      - name: Download immutable original 196-case source authority
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/nucleus-magma-corpus.zip
          sha256sum /tmp/nucleus-magma-corpus.zip > /tmp/nucleus-magma-evidence/arena-artifact.sha256
          unzip -q /tmp/nucleus-magma-corpus.zip -d /tmp/nucleus-magma-testpack
          tar --no-same-owner -xzf /tmp/nucleus-magma-testpack/lean-arena-tests.tar.gz -C /tmp/nucleus-magma-corpus
          test -s /tmp/nucleus-magma-corpus/good/perf/magma-list-pair-n7.ndjson
          test -s /tmp/nucleus-magma-corpus/good/perf/magma-list-deep-n21.ndjson
      - name: Find source-owned first unproved obligation without changing a verdict
        run: |
          set -euo pipefail
          python3 .github/scripts/nucleus_first_magma_obligation_20261021.py \
            /tmp/nucleus-magma-corpus \
            metatron-kernel/target/release/metatron-kernel \
            /tmp/nucleus-magma-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-first-magma-obligation-${{ github.sha }}
          path: /tmp/nucleus-magma-evidence/
          if-no-files-found: warn
