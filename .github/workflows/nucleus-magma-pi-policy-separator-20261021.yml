name: Nucleus original-source dependent Pi policy separator
on:
  push:
    branches: [research/nucleus-magma-pi-policy-separator-20261021]
    paths:
      - '.github/scripts/nucleus_magma_pi_policy_separator_20261021.py'
      - '.github/workflows/nucleus-magma-pi-policy-separator-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-causal-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove retained independent kernel is byte-identical to qualified source
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-pi-evidence /tmp/nucleus-pi-artifact /tmp/nucleus-pi-inputs
          git rev-parse HEAD > /tmp/nucleus-pi-evidence/research-head.txt
          test "$(git rev-parse HEAD:metatron-kernel)" = 5e7d65b1b6abc3f6380bc7a37ffb153284d7faf1
          rustc -vV > /tmp/nucleus-pi-evidence/rust-version.txt
      - name: Build original and require existing Rust soundness controls
        run: |
          set -euo pipefail
          NUCLEUS_EXPERIMENTAL_RELEVANCE=1 NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA=1 \
            cargo test --release --locked --features diagnostics \
            --manifest-path metatron-kernel/Cargo.toml > /tmp/nucleus-pi-evidence/rust-tests.log 2>&1 || {
               tail -90 /tmp/nucleus-pi-evidence/rust-tests.log; exit 1;
            }
          cargo build --release --locked --features diagnostics \
            --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-original-checker
      - name: Compile feature-only isolated policy observation variant
        run: |
          set -euo pipefail
          python3 .github/scripts/nucleus_magma_pi_policy_separator_20261021.py metatron-kernel/src/typecheck.rs
          git diff --check
          git diff -- metatron-kernel/src/typecheck.rs > /tmp/nucleus-pi-evidence/diagnostic-only.diff
          test -s /tmp/nucleus-pi-evidence/diagnostic-only.diff
          cargo build --release --locked --features diagnostics \
            --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-pi-diagnostic-checker
          sha256sum /tmp/nucleus-{original,pi-diagnostic}-checker > /tmp/nucleus-pi-evidence/binaries.sha256
      - name: Recover byte-pinned original Lean Arena exports
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/nucleus-pi-original.zip
          unzip -q /tmp/nucleus-pi-original.zip -d /tmp/nucleus-pi-artifact
          tar --no-same-owner -xzf /tmp/nucleus-pi-artifact/lean-arena-tests.tar.gz -C /tmp/nucleus-pi-inputs
          test -s /tmp/nucleus-pi-inputs/good/perf/magma-list-deep-n21.ndjson
      - name: Separate Pi-type recovery under exact source Γ; no semantic promotion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/nucleus-pi-inputs')
          dest=pathlib.Path('/tmp/nucleus-pi-evidence')
          pinned=json.loads(pathlib.Path('metatron-kernel/evidence/performance/owned-environment-2026-10-13/nucleus-owned-environment-frozen196.json').read_text())['modes']['origin']['rows']
          baseline={r['case']:r for r in pinned}
          cases=[
            'good/perf/magma-list-deep-n21.ndjson',
            'good/perf/magma-list-deep-n36.ndjson',
            'good/perf/magma-list-pair-n7.ndjson',
            'good/perf/magma-list-pair-n21.ndjson',
          ]
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          for flag in ('RELEVANCE','CONTEXT_BINDER','TYPED_LINEAGE','SUBSTITUTION_RECLOSURE','TYPED_VALUE_NORMALIZATION','PROJECTION_CONTEXT','PROJECTION_CROSSFRAME_512','TYPED_RECEIVER','SOURCE_PAIR_DEPTH8','POLYMORPHIC_PROP_IRREL','PROP_SINGLETON_2P1F','EXPECTED_LAMBDA'):
            env['NUCLEUS_EXPERIMENTAL_'+flag]='1'
          env['NUCLEUS_TRACE_DOWNSTREAM']='1'
          rows=[]
          for name in cases:
            source=root/name
            assert hashlib.sha256(source.read_bytes()).hexdigest()==baseline[name]['sha256'],('BAD_SOURCE_BYTES',name)
            for arm,binary in (('original','/tmp/nucleus-original-checker'),('diagnostic','/tmp/nucleus-pi-diagnostic-checker')):
              trial_env=env.copy()
              if arm=='diagnostic':
                trial_env['NUCLEUS_TRACE_FIRST_TYPED_CONTINUATION']='1'
                trial_env['NUCLEUS_TRACE_PI_POLICY_SEPARATOR']='1'
              with source.open('rb') as f:
                p=subprocess.run([binary],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                                 env=trial_env,timeout=160)
              assert p.returncode==baseline[name]['rc']==2,(name,arm,p.returncode)
              lines=p.stderr.decode(errors='replace').splitlines()
              sep=[x for x in lines if x.startswith('NUCLEUS_PI_POLICY_SEPARATOR:')]
              continuation=[x for x in lines if x.startswith('NUCLEUS_FIRST_TYPED_CONTINUATION:')]
              term=[x for x in lines if x.startswith('NUCLEUS_DOWNSTREAM:')][-1:]
              (dest/(name.split('/')[-1]+'.'+arm+'.stderr')).write_text(
                   p.stderr.decode(errors='replace')[:2000000])
              row={'case':name,'arm':arm,'rc':p.returncode,'first_pi_separator':sep[:10],
                   'typed_continuations':[x[:8000] for x in continuation[:6]],'terminal':term,
                   'sha256':baseline[name]['sha256']}
              rows.append(row)
              print('NUCLEUS_PI_SOURCE_GATE='+json.dumps({'case':name,'arm':arm,'rc':p.returncode,
                    'separator_count':len(sep),'typed_continuations':len(continuation),
                    'terminal':term},ensure_ascii=False),flush=True)
          for source in ('protected-false-index.ndjson','protected-eta-ctor-alias.ndjson'):
            pth=pathlib.Path('metatron-kernel/tests/fixtures')/source
            for arm,binary in (('original','/tmp/nucleus-original-checker'),('diagnostic','/tmp/nucleus-pi-diagnostic-checker')):
              with pth.open('rb') as f:
                p=subprocess.run([binary],stdin=f,stdout=subprocess.DEVNULL,
                                 stderr=subprocess.PIPE,env=env,timeout=40)
              assert p.returncode in (1,2),(source,arm,p.returncode)
          assert any(r['first_pi_separator'] for r in rows if r['arm']=='diagnostic'), 'NO_PI_SEPARATOR_TRIGGERED'
          dest.joinpath('pi-policy-comparison.json').write_text(json.dumps(
             {'source_tree_sha':'5e7d65b1b6abc3f6380bc7a37ffb153284d7faf1',
              'rows':rows,'semantic_modification':False,
              'decision':'DIAGNOSTIC_ONLY_NO_NEW_ACCEPT'},indent=2,ensure_ascii=False)+'\n')
          print('NUCLEUS_PI_POLICY_DECISION=DIAGNOSTIC_ONLY_NO_NEW_ACCEPT',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-source-pi-policy-${{ github.sha }}
          path: /tmp/nucleus-pi-evidence/
          if-no-files-found: warn
