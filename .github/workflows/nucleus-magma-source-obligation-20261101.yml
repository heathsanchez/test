name: Nucleus exact Magma application witness (non-authoritative)
on:
  push:
    branches: [research/nucleus-magma-source-obligation-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-obligation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify immutable independent checker and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-evidence /tmp/nucleus-cases /tmp/nucleus-pack
          test "$(git rev-parse HEAD:metatron-kernel)" = "5e7d65b1b6abc3f6380bc7a37ffb153284d7faf1"
          git rev-parse HEAD > /tmp/nucleus-evidence/commit.txt
          git rev-parse HEAD:metatron-kernel > /tmp/nucleus-evidence/source-tree.txt
          cargo test --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml >/tmp/nucleus-evidence/native-tests.log 2>&1 || { tail -100 /tmp/nucleus-evidence/native-tests.log; exit 1; }
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          sha256sum metatron-kernel/target/release/metatron-kernel >/tmp/nucleus-evidence/binary-sha256.txt
      - name: Retrieve exact original Arena fixtures and witness application boundary
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip >/tmp/nucleus-cases.zip
          sha256sum /tmp/nucleus-cases.zip >/tmp/nucleus-evidence/artifact-sha256.txt
          unzip -q /tmp/nucleus-cases.zip -d /tmp/nucleus-pack
          tar --no-same-owner -xzf /tmp/nucleus-pack/lean-arena-tests.tar.gz -C /tmp/nucleus-cases
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path("/tmp/nucleus-cases")
          out=pathlib.Path("/tmp/nucleus-evidence")
          manifest=pathlib.Path("metatron-kernel/evidence/performance/owned-environment-2026-10-13/nucleus-owned-environment-frozen196.json")
          rows={r["case"]:r for r in json.loads(manifest.read_text())["modes"]["origin"]["rows"]}
          env={k:v for k,v in os.environ.items() if not k.startswith("NUCLEUS_")}
          for f in ("RELEVANCE","CONTEXT_BINDER","TYPED_LINEAGE","SUBSTITUTION_RECLOSURE","TYPED_VALUE_NORMALIZATION","PROJECTION_CONTEXT","PROJECTION_CROSSFRAME_512","TYPED_RECEIVER","SOURCE_PAIR_DEPTH8","POLYMORPHIC_PROP_IRREL","PROP_SINGLETON_2P1F","EXPECTED_LAMBDA"):
              env["NUCLEUS_EXPERIMENTAL_"+f]="1"
          for f in ("DOWNSTREAM","APPLICATION_FUNCTION_TYPE","FIRST_TYPED_CONTINUATION","APP_DOMAIN_OBLIGATION"):
              env["NUCLEUS_TRACE_"+f]="1"
          binary=str(pathlib.Path("metatron-kernel/target/release/metatron-kernel").resolve())
          reports=[]
          for case in ("good/init-prelude.ndjson","good/perf/magma-list-pair-n7.ndjson"):
              path=root/case
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest==rows[case]["sha256"],("SOURCE_SHA_MISMATCH",case)
              with path.open("rb") as fd:
                  p=subprocess.run([binary],stdin=fd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=180,env=env)
              assert p.returncode==rows[case]["rc"],("VERDICT_REGRESSION",case,p.returncode)
              raw=p.stderr.decode(errors="replace")
              markers=("NUCLEUS_APPLICATION_FUNCTION_TYPE:","NUCLEUS_FIRST_TYPED_CONTINUATION:","NUCLEUS_DOWNSTREAM:","NUCLEUS_APP_DOMAIN_OBLIGATION:")
              events=[line for line in raw.splitlines() if line.startswith(markers)]
              counts={mark:sum(line.startswith(mark) for line in events) for mark in markers}
              # Never infer the causal first missing rule from a truncated terminal trace.
              report=dict(case=case,sha256=digest,verdict=p.returncode,expected=rows[case]["rc"],stderr_bytes=len(p.stderr),counts=counts,first_events=events[:15],last_events=events[-25:],diagnostic_status="OBSERVATION_ONLY_UNPROVED_CAUSE")
              reports.append(report)
              print("SOURCE_TYPED_REPLAY="+json.dumps({k:report[k] for k in ("case","sha256","verdict","counts","diagnostic_status")}),flush=True)
              if case.endswith("magma-list-pair-n7.ndjson"):
                  assert counts["NUCLEUS_APPLICATION_FUNCTION_TYPE:"]>0, "MISSING_APPLICATION_TRACE"
          for name in ("protected-false-index.ndjson","protected-eta-ctor-alias.ndjson"):
              path=pathlib.Path("metatron-kernel/tests/fixtures")/name
              with path.open("rb") as fd:
                  p=subprocess.run([binary],stdin=fd,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=40,env=env)
              assert p.returncode in (1,2),("UNSAFE_ACCEPT",name,p.returncode)
          report=dict(source_tree="5e7d65b1b6abc3f6380bc7a37ffb153284d7faf1",manifest_sha256=hashlib.sha256(manifest.read_bytes()).hexdigest(),cases=reports,all_verdicts_preserved=True,semantic_rule_added=False,proof_of_missing_rule=False)
          (out/"magma-application-source-obligations.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-magma-source-obligation-${{ github.sha }}
          path: /tmp/nucleus-evidence
          if-no-files-found: warn
