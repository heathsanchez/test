name: Nucleus source-authorized recursor major work allocation
on:
  push:
    branches: [research/nucleus-major-work-budget-20261022]
    paths:
      - 'metatron-kernel/src/machine.rs'
      - '.github/scripts/nucleus_major_work_ab_20261022.py'
      - '.github/workflows/nucleus-major-work-ab-20261022.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-work-factorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Freeze source provenance and exactly one source-file change
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-major /tmp/nucleus-major-evidence /tmp/nucleus-major-micro /tmp/nucleus-major-control
          git rev-parse HEAD > /tmp/nucleus-major-evidence/research-head.txt
          git fetch --no-tags --depth=1 origin ff003e7fad888d39a40cfd2375885fe20e3209fa
          git worktree add --detach /tmp/nucleus-major-control ff003e7fad888d39a40cfd2375885fe20e3209fa
          test "$(git -C /tmp/nucleus-major-control rev-parse HEAD:metatron-kernel)" = 5e7d65b1b6abc3f6380bc7a37ffb153284d7faf1
          git diff --check ff003e7fad888d39a40cfd2375885fe20e3209fa
          git diff --name-only ff003e7fad888d39a40cfd2375885fe20e3209fa -- metatron-kernel > /tmp/nucleus-major-evidence/changed-source.txt
          test "$(cat /tmp/nucleus-major-evidence/changed-source.txt)" = 'metatron-kernel/src/machine.rs'
          git diff ff003e7fad888d39a40cfd2375885fe20e3209fa -- metatron-kernel/src/machine.rs > /tmp/nucleus-major-evidence/commit-source.diff
          rustc -vV > /tmp/nucleus-major-evidence/compiler.txt
      - name: Build and native-test both independent checkers with flags OFF
        run: |
          set -euo pipefail
          NUCLEUS_EXPERIMENTAL_RELEVANCE=1 NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA=1 \
            cargo test --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml > /tmp/nucleus-major-evidence/rust-tests.log 2>&1 || {
              tail -100 /tmp/nucleus-major-evidence/rust-tests.log; exit 1;
            }
          CARGO_TARGET_DIR=/tmp/nucleus-major-original-target \
            cargo build --release --locked --features diagnostics --manifest-path /tmp/nucleus-major-control/metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp /tmp/nucleus-major-original-target/release/metatron-kernel /tmp/nucleus-major/baseline
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-major/candidate
          sha256sum /tmp/nucleus-major/{baseline,candidate} > /tmp/nucleus-major-evidence/binaries.sha256
      - name: Obtain independently Lean-verified true and false source claims
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/12336209253/zip > /tmp/nucleus-major-verified.zip
          echo '6727b4ba0de9f4b12642307d1749fcf220047134bfbb6e6a5a789bec092dfaa4  /tmp/nucleus-major-verified.zip' | sha256sum -c -
          unzip -q /tmp/nucleus-major-verified.zip -d /tmp/nucleus-major-micro
      - name: Compare local major work without changing overall checker allowance
        run: |
          set -euo pipefail
          python3 .github/scripts/nucleus_major_work_ab_20261022.py \
            /tmp/nucleus-major-micro /tmp/nucleus-major-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-source-major-budget-${{ github.sha }}
          path: /tmp/nucleus-major-evidence/
          if-no-files-found: warn
