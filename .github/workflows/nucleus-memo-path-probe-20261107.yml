name: Nucleus exact memo path observation v2
on:
  push:
    branches: [research/nucleus-obligation-census-20261107]
    paths: ['.github/workflows/nucleus-memo-path-probe-20261107.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Full native suite and matched ordinary replay
        run: python experiments/nucleus-capture-substitution-20261107/qualify-memo-path-probe.py > driver.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-memo-path-probe-OBSERVATION
          retention-days: 60
          path: |
            reports/
            candidate/
            driver.log
