name: Nucleus first truly missing typed judgment

on:
  push:
    branches: [nucleus-minimal-typed-obligation-v1]
    paths:
      - ".github/workflows/nucleus-minimal-typed-obligation-v1.yml"
      - "metatron-kernel/src/typecheck.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-premise:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_ARTIFACT: "11272848230"
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      NUCLEUS_EXPERIMENTAL_RELEVANCE: "1"
      NUCLEUS_EXPERIMENTAL_CONTEXT_BINDER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify independent guarded checker
        run: |
          set -euo pipefail
          echo "NUCLEUS_EXACT_JUDGMENT_SOURCE=$GITHUB_SHA"
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml --test relation_record
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml --lib minimal_context_binder_tests -- --ignored
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
      - name: Fetch frozen exact source exports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests research/nucleus-evidence
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
      - name: Recover first failing dependent judgment and compare negative controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path('/tmp/arena-tests')
          rows=[]
          for name in ['perf/magma-list-pair-n7','perf/magma-list-pair-n21','perf/fueled-chain']:
              source=(root/'good'/(name+'.ndjson')).read_bytes()
              env=os.environ|{
                  'NUCLEUS_TRACE_MINIMAL_TYPED_OBLIGATION':'1',
                  'NUCLEUS_TRACE_DOWNSTREAM':'1',
                  'NUCLEUS_TRACE_CONTEXT_BINDER':'1',
              }
              result=subprocess.run(['/tmp/nucleus'],input=source,
                  stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                  timeout=100,env=env)
              logs=result.stderr.decode(errors='replace').splitlines()
              first=[x for x in logs if x.startswith('NUCLEUS_TYPED_OBLIGATION:')]
              last=[x for x in logs if x.startswith('NUCLEUS_DOWNSTREAM:')]
              row={'case':name,'sha256':hashlib.sha256(source).hexdigest(),
                   'rc':result.returncode,'typed_obligations':first,
                   'terminal':last[-3:]}
              rows.append(row)
              print('NUCLEUS_MINIMAL_TYPED_PREMISE='+json.dumps({
                  'case':name,'rc':result.returncode,
                  'first_three':[x[:4200] for x in first[:3]],
                  'typed_count':len(first),'terminal':last[-2:]
              }),flush=True)
              assert result.returncode==2,(name,'valid source wrongly rejected',row)
              if name.startswith('perf/magma-list-pair'):
                  assert first,(name,'no typed mismatch captured at actual source')
          sys.path.insert(0,'.github/scripts')
          from nucleus_succle_separator import extract,false_index
          altered=false_index(extract((root/'good/init-prelude.ndjson').read_bytes()))
          rc=subprocess.run(['/tmp/nucleus'],input=altered,
              stdout=subprocess.DEVNULL,timeout=90).returncode
          malformed=subprocess.run(['/tmp/nucleus'],input=
              (root/'bad/bugs/nested-unused-param.ndjson').read_bytes(),
              stdout=subprocess.DEVNULL,timeout=90).returncode
          assert rc in (1,2) and malformed==1,(rc,malformed)
          path=pathlib.Path('research/nucleus-evidence/minimal-typed-first-premise.json')
          path.write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],
              'arena':os.environ['ARENA_SHA'],'artifact':os.environ['ARENA_ARTIFACT'],
              'status':'DIAGNOSTIC_NOT_NEW_CONVERSION','rows':rows,
              'protected_false_index_rc':rc,'malformed_nested_rc':malformed},indent=2))
          print('NUCLEUS_TYPED_PREMISE_DIAGNOSTIC_GREEN:protected=true,no_new_ACCEPT_claim')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-minimal-typed-premise-${{ github.sha }}
          path: research/nucleus-evidence/minimal-typed-first-premise.json
          if-no-files-found: warn
