name: Nucleus MSI Demand Projection
on:
  push:
    branches: [nucleus-msi-demand-projection-v1]
    paths: ["metatron-kernel/**", ".github/workflows/nucleus-msi-demand-projection-v1.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
      - name: Download exact Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-export /tmp/arena-tests
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-export
          tar -xzf /tmp/arena-export/lean-arena-tests.tar.gz -C /tmp/arena-tests
      - name: A B verdicts and timing
        run: |
          python3 - <<'PY'
          import os,json,pathlib,subprocess,time
          root=pathlib.Path('/tmp/arena-tests')
          bin='metatron-kernel/target/release/metatron-kernel'
          opts=('NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION','NUCLEUS_EXPERIMENTAL_RELEVANCE',
            'NUCLEUS_EXPERIMENTAL_CONTEXT_BINDER','NUCLEUS_EXPERIMENTAL_TYPED_LINEAGE',
            'NUCLEUS_EXPERIMENTAL_SUBSTITUTION_RECLOSURE','NUCLEUS_EXPERIMENTAL_PROJECTION_CONTEXT',
            'NUCLEUS_EXPERIMENTAL_PROJECTION_CROSSFRAME_512','NUCLEUS_EXPERIMENTAL_POLYMORPHIC_PROP_IRREL',
            'NUCLEUS_EXPERIMENTAL_PROP_SINGLETON_2P1F','NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA')
          cases=[(bucket,p) for bucket in ('good','bad') for p in sorted((root/bucket).rglob('*.ndjson'))]
          assert len(cases)==196
          results={}
          for mode in ('baseline','demand'):
            env=os.environ.copy()
            for x in opts: env[x]='1'
            if mode=='demand':env['NUCLEUS_EXPERIMENTAL_DEMAND_PROJECTION']='1'
            verdicts=[]
            for bucket,p in cases:
              t=time.monotonic()
              proc=subprocess.run([bin],input=p.read_bytes(),env=env,
                 stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=55)
              sec=time.monotonic()-t
              actual=proc.returncode
              assert actual in (0,1,2)
              assert not (bucket=='bad' and actual==0) and not (bucket=='good' and actual==1)
              verdicts.append({'case':str(p.relative_to(root)),'rc':actual,'seconds':round(sec,4)})
            results[mode]=verdicts
            counts={'accept':sum(x['rc']==0 for x in verdicts),
              'reject':sum(x['rc']==1 for x in verdicts),
              'unknown':sum(x['rc']==2 for x in verdicts)}
            assert counts['reject']==71
            if mode=='baseline':assert counts=={'accept':118,'reject':71,'unknown':7}
            print('NUCLEUS_DEMAND_COUNTS='+json.dumps({'mode':mode,'counts':counts}),flush=True)
          diff=[{'case':a['case'],'before':a['rc'],'after':b['rc']}
            for a,b in zip(results['baseline'],results['demand']) if a['rc']!=b['rc']]
          print('NUCLEUS_DEMAND_DIFF='+json.dumps(diff),flush=True)
          pathlib.Path('nucleus-demand-report.json').write_text(json.dumps(
            {'head':os.environ['GITHUB_SHA'],'rows':results,'diff':diff},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-demand-${{ github.sha }}
          path: nucleus-demand-report.json
          if-no-files-found: warn
