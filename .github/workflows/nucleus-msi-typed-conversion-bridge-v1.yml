name: Nucleus MSI typed bridge speed and seven-case source-authority A/B

on:
  push:
    branches: [nucleus-msi-typed-conversion-bridge-v1]
    paths:
      - ".github/workflows/nucleus-msi-typed-conversion-bridge-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

concurrency:
  group: nucleus-msi-typed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      ARENA_ARTIFACT: "11272848230"
      NUCLEUS_EXPERIMENTAL_RELEVANCE: "1"
      NUCLEUS_EXPERIMENTAL_CONTEXT_BINDER: "1"
      NUCLEUS_EXPERIMENTAL_TYPED_LINEAGE: "1"
      NUCLEUS_EXPERIMENTAL_SUBSTITUTION_RECLOSURE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned tree and use available Rust toolchain
        run: |
          set -euo pipefail
          echo "NUCLEUS_CANDIDATE_SOURCE=$GITHUB_SHA"
          git rev-parse HEAD:metatron-kernel
          command -v cargo
          rustc --version
          cargo --version
      - name: Fetch locked dependencies
        env:
          CARGO_HTTP_TIMEOUT: "120"
          CARGO_NET_RETRY: "8"
          CARGO_HTTP_LOW_SPEED_LIMIT: "0"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5; do
            if cargo fetch --locked --manifest-path metatron-kernel/Cargo.toml; then ok=1; break; fi
            sleep 5
          done
          test "$ok" -eq 1
      - name: Test entire Rust source and build diagnostics binary
        run: |
          set -euo pipefail
          NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION=1 cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus
      - name: Get fixed Arena authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests metatron-kernel/evidence-out/origin-replay
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
      - name: Compare complete semantic branch against exact no-copy transfer
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/nucleus-msi-typed-base b49afed100e2d6ea5a51094bc5809de5b06cb310
          CARGO_TARGET_DIR=/tmp/nucleus-msi-typed-base-target cargo build --release --locked --features diagnostics \
            --manifest-path /tmp/nucleus-msi-typed-base/metatron-kernel/Cargo.toml
          cp /tmp/nucleus-msi-typed-base-target/release/metatron-kernel /tmp/nucleus-msi-typed-baseline
          python3 - <<'PY'
          import hashlib,json,os,pathlib,statistics,subprocess,tempfile,time
          root=pathlib.Path('/tmp/arena-tests/good')
          out=pathlib.Path('metatron-kernel/evidence-out/origin-replay/msi-typed-ab.json')
          seven=['init-prelude','perf/grind-ring-5','perf/magma-list-pair-n7',
                 'perf/magma-list-pair-n21','perf/magma-list-deep-n21',
                 'perf/magma-list-deep-n36','perf/fueled-chain']
          binaries={'before':'/tmp/nucleus-msi-typed-baseline','after':'/tmp/nucleus'}
          # Activate exactly the same independently tested conversion extensions on both sides.
          env=os.environ.copy()
          for flag in ('NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION',
            'NUCLEUS_EXPERIMENTAL_PROJECTION_CONTEXT',
            'NUCLEUS_EXPERIMENTAL_PROJECTION_CROSSFRAME_512',
            'NUCLEUS_EXPERIMENTAL_POLYMORPHIC_PROP_IRREL',
            'NUCLEUS_EXPERIMENTAL_PROP_SINGLETON_2P1F',
            'NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA'):
            env[flag]='1'
          rows=[]
          for case in seven:
            src=root/(case+'.ndjson')
            data=src.read_bytes()
            timings={'before':[],'after':[]}
            for trial in range(2):
              # Alternate order; minimize systematic compile-cache/time drift.
              for key in (('before','after') if trial%2==0 else ('after','before')):
                with tempfile.TemporaryDirectory() as d:
                  meter=pathlib.Path(d)/'meter'
                  start=time.monotonic()
                  p=subprocess.run(['/usr/bin/time','-f','%U %S %M','-o',str(meter),binaries[key]],
                    input=data,env=env,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=90)
                  elapsed=time.monotonic()-start
                  u,v,rss=map(float,meter.read_text().strip().splitlines()[-1].split()[:3])
                timings[key].append({'rc':p.returncode,'cpu':u+v,'wall':elapsed,'rss_kb':int(rss)})
            assert len({x['rc'] for v in timings.values() for x in v})==1, (case,timings)
            row={'case':case,'sha256':hashlib.sha256(data).hexdigest(),
                 'before_cpu':statistics.median(x['cpu'] for x in timings['before']),
                 'after_cpu':statistics.median(x['cpu'] for x in timings['after']),
                 'before_wall':statistics.median(x['wall'] for x in timings['before']),
                 'after_wall':statistics.median(x['wall'] for x in timings['after']),
                 'verdict':timings['before'][0]['rc'],'runs':timings}
            rows.append(row)
            print('NUCLEUS_MSI_TYPED_CASE='+json.dumps({k:v for k,v in row.items() if k!='runs'}),flush=True)
          cpu_before=sum(r['before_cpu'] for r in rows)
          cpu_after=sum(r['after_cpu'] for r in rows)
          report={'baseline':'b49afed100e2d6ea5a51094bc5809de5b06cb310',
                  'candidate':os.environ['GITHUB_SHA'],'scope':'7 unknown valid exports',
                  'measurement':'same-run Linux user+system CPU seconds, NOT Arena retired instructions',
                  'cpu_before':cpu_before,'cpu_after':cpu_after,
                  'speedup':cpu_before/cpu_after if cpu_after else None,'rows':rows}
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('NUCLEUS_MSI_TYPED_SUMMARY='+json.dumps({
            'n':len(rows),'before':cpu_before,'after':cpu_after,'speedup':report['speedup']}),flush=True)
          PY

      - name: Compare seven, protected controls and full immutable 196
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,os,pathlib,subprocess,sys,time
          sys.path.insert(0,'.github/scripts')
          from nucleus_succle_separator import extract,false_index
          root=pathlib.Path('/tmp/arena-tests')
          out=pathlib.Path('metatron-kernel/evidence-out/origin-replay')
          seven=['init-prelude','perf/grind-ring-5','perf/magma-list-pair-n7',
                 'perf/magma-list-pair-n21','perf/magma-list-deep-n21',
                 'perf/magma-list-deep-n36','perf/fueled-chain']
          def env_for(mode,trace=False):
              env=os.environ.copy()
              env['NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION']='1'
              if mode in ('origin_replay','support'):
                  env['NUCLEUS_EXPERIMENTAL_PROJECTION_CONTEXT']='1'
                  env['NUCLEUS_EXPERIMENTAL_PROJECTION_CROSSFRAME_512']='1'
                  env['NUCLEUS_EXPERIMENTAL_POLYMORPHIC_PROP_IRREL']='1'
                  env['NUCLEUS_EXPERIMENTAL_PROP_SINGLETON_2P1F']='1'
                  env['NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA']='1'
              if mode in ('origin_replay','support') and trace:
                  env['NUCLEUS_TRACE_PROJECTION_CONTEXT']='1'
                  env['NUCLEUS_TRACE_PROJECTION_CROSSFRAME_512']='1'
                  env['NUCLEUS_TRACE_POLYMORPHIC_PROP_IRREL']='1'
                  env['NUCLEUS_TRACE_PROP_SINGLETON']='1'
                  env['NUCLEUS_TRACE_APP_DOMAIN_OBLIGATION']='1'
                  env['NUCLEUS_TRACE_EXPECTED_LAMBDA']='1'
                  env['NUCLEUS_TRACE_BIDIR_BODY_GAP']='1'
                  env['NUCLEUS_TRACE_FINAL_CODOMAIN']='1'
                  env['NUCLEUS_TRACE_ARITHMETIC_INSTANCE']='1'
                  env['NUCLEUS_TRACE_FIRST_TYPED_CONTINUATION']='1'
                  env['NUCLEUS_TRACE_ORIGIN_REPLAY']='1'
                  env['NUCLEUS_TRACE_SOURCE_PROOF_BETA']='1'
                  env['NUCLEUS_TRACE_PROJECTION_LAST_FAILURE']='1'
              if mode=='support':
                  env['NUCLEUS_EXPERIMENTAL_EXACT_SUPPORT_EQ']='1'
                  if trace: env['NUCLEUS_TRACE_EXACT_SUPPORT_EQ']='1'
              if trace: env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              return env
          rows=[]
          for name in seven:
              data=(root/'good'/(name+'.ndjson')).read_bytes()
              for mode in ('baseline','origin_replay','support'):
                  t=time.monotonic()
                  p=subprocess.run(['/tmp/nucleus'],input=data,stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,timeout=150,env=env_for(mode,True))
                  logs=p.stderr.decode(errors='replace').splitlines()
                  row={'case':name,'mode':mode,'rc':p.returncode,
                       'seconds':round(time.monotonic()-t,3),
                       'origin_replay_count':sum('NUCLEUS_ORIGIN_REPLAY:' in s for s in logs),
                       'origin_replays':[s for s in logs
                           if 'NUCLEUS_ORIGIN_REPLAY:' in s][:8],
                       'outer_replays':[s for s in logs
                           if 'NUCLEUS_OUTER_ORIGIN_REPLAY:' in s][:8],
                       'source_beta':[s for s in logs
                           if 'NUCLEUS_SOURCE_BETA:' in s][:80],
                       'source_introductions':[s for s in logs
                           if 'NUCLEUS_SOURCE_BINDER_INTRO:' in s][:80],
                       'projection_failures':[s for s in logs
                           if 'NUCLEUS_POST_IOTA_PROJECTION_GAP:' in s][-24:],
                       'contextual_proofs':[s for s in logs
                           if 'NUCLEUS_CONTEXTUAL_PROJECTION:' in s][-24:],
                       'crossframe_proofs':[s for s in logs
                           if 'NUCLEUS_CROSSFRAME_512_PROVEN:' in s][-24:],
                       'polymorphic_proofs':[s for s in logs
                           if 'NUCLEUS_POLYMORPHIC_PROP_IRREL:' in s][-24:],
                       'prop_singletons':[s for s in logs
                           if 'NUCLEUS_PROP_SINGLETON:' in s][-24:],
                       'app_domains':[s for s in logs
                           if 'NUCLEUS_APP_DOMAIN_OBLIGATION:' in s][-36:],
                       'expected_lambdas':[s for s in logs
                           if 'NUCLEUS_EXPECTED_LAMBDA:' in s][-36:],
                       'body_infer':[s for s in logs
                           if 'NUCLEUS_BIDIR_BODY_INFER:' in s][-24:],
                       'body_convert':[s for s in logs
                           if 'NUCLEUS_BIDIR_BODY_CONVERT:' in s][-24:],
                       'final_codomains':[s for s in logs
                           if 'NUCLEUS_FINAL_CODOMAIN:' in s][-16:],
                       'paired_premises':[s for s in logs
                           if 'NUCLEUS_CODOMAIN_PAIRS:' in s][-16:],
                       'arith_instances':[s for s in logs
                           if 'NUCLEUS_ARITHMETIC_INSTANCE:' in s][-20:],
                       'downstream':[s for s in logs if 'NUCLEUS_DOWNSTREAM:' in s][-2:],
                       'support_reuses':sum(s.startswith('NUCLEUS_EXACT_SUPPORT_EQ:PROVEN') for s in logs)}
                  print('NUCLEUS_ORIGIN_SEVEN='+json.dumps(row),flush=True)
                  assert p.returncode in (0,2),('valid became rejected',row)
                  if mode=='baseline': assert p.returncode==2,('baseline moved',row)
                  if name=='init-prelude' and mode in ('origin_replay','support'):
                      assert row['origin_replay_count']>0 and row['outer_replays'],(
                          'missing complete origin or outer telescope witness',row)
                  if mode in ('origin_replay','support') and name in seven[:4]:
                      assert any('source-context=7:opened-context=8:' in s
                                 for s in row['outer_replays']),(
                          'captured source binder scope was not reconstructed',row)
                      assert any('caller-proof-candidates=' in s and
                                 'captured-proof-candidates=' in s and
                                 'proof-parametricity=' in s and
                                 'joined_source_depth=' in s and
                                 'major_obligation=' in s
                                 for s in row['outer_replays']),(
                          'transitive source-origin join was not exercised',row)
                  rows.append(row)
          source=(root/'good/init-prelude.ndjson').read_bytes()
          forged=false_index(extract(source))
          assert hashlib.sha256(forged).hexdigest()=='2a090edfcfa2a16191f17a433617aaf045fc9b11cd0e2a93405b705d8a899688'
          protected=[]
          for mode in ('baseline','origin_replay','support'):
              f=subprocess.run(['/tmp/nucleus'],input=forged,stdout=subprocess.DEVNULL,
                  timeout=90,env=env_for(mode)).returncode
              n=subprocess.run(['/tmp/nucleus'],
                  input=(root/'bad/bugs/nested-unused-param.ndjson').read_bytes(),
                  stdout=subprocess.DEVNULL,timeout=90,env=env_for(mode)).returncode
              assert f in (1,2) and n==1,('protected false case promoted',mode,f,n)
              protected.append({'mode':mode,'false_index_rc':f,'nested_rc':n})
          items=[('good',p) for p in sorted((root/'good').rglob('*.ndjson'))]+[
                 ('bad',p) for p in sorted((root/'bad').rglob('*.ndjson'))]
          assert len(items)==196 and sum(x[0]=='bad' for x in items)==71
          counts={}
          mode_rows={}
          for mode in ('baseline','origin_replay','support'):
              env=env_for(mode)
              def check(item):
                  expected,path=item
                  p=subprocess.run(['/tmp/nucleus'],input=path.read_bytes(),
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,
                      timeout=150,env=env)
                  return {'case':str(path.relative_to(root)),'expected':expected,'rc':p.returncode}
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  verdicts=list(pool.map(check,items))
              bad=[v for v in verdicts if v['rc'] not in (0,1,2)
                   or (v['expected']=='good' and v['rc']==1)
                   or (v['expected']=='bad' and v['rc']==0)]
              report={'accepted':sum(v['expected']=='good' and v['rc']==0 for v in verdicts),
                      'rejected':sum(v['expected']=='bad' and v['rc']==1 for v in verdicts),
                      'unknown':sum(v['rc']==2 for v in verdicts),
                      'wrong':bad}
              counts[mode]=report
              mode_rows[mode]=verdicts
              print('NUCLEUS_ORIGIN_FULL196='+json.dumps({'mode':mode,**report}),flush=True)
              assert not bad and report['rejected']==71,('unsound candidate',report)
              if mode=='baseline':
                  assert (report['accepted'],report['unknown'])==(118,7),'baseline drift'
          changes=[{'case':b['case'],'baseline_rc':b['rc'],'candidate_rc':c['rc']}
                 for b,c in zip(mode_rows['baseline'],mode_rows['origin_replay']) if b['rc']!=c['rc']]
          support_diffs=[{'case':b['case'],'origin_rc':b['rc'],'support_rc':c['rc']}
               for b,c in zip(mode_rows['origin_replay'],mode_rows['support']) if b['rc']!=c['rc']]
          result={'source':os.environ['GITHUB_SHA'],'arena_sha':os.environ['ARENA_SHA'],
                  'artifact':os.environ['ARENA_ARTIFACT'],'seven':rows,
                  'protected':protected,'full196':counts,'verdict_diffs':changes,
                   'support_diffs':support_diffs}
          (out/'result.json').write_text(json.dumps(result,indent=2))
          print('NUCLEUS_ORIGIN_DIFFS='+json.dumps(changes),flush=True)
          print('NUCLEUS_SUPPORT_DIFFS='+json.dumps(support_diffs),flush=True)
          if max(counts[m]['accepted'] for m in ('origin_replay','support'))>118:
              print('NEW_COMPLETE_CASE_GAIN_PENDING_CURRENT_ARENA_AND_MATHLIB')
          else: print('NO_COMPLETE_CASE_GAIN__KEEP_ISOLATED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-origin-replay-${{ github.sha }}
          path: metatron-kernel/evidence-out/origin-replay
          if-no-files-found: warn
