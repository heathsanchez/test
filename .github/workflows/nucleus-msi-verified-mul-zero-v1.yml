name: Nucleus kernel-certified Nat.mul zero A/B
on:
  push:
    branches: [nucleus-msi-verified-mul-zero-v1]
    paths:
      - ".github/workflows/nucleus-msi-verified-mul-zero-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

concurrency:
  group: nucleus-msi-mulzero-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      ARENA_ARTIFACT: "11272848230"
      NUCLEUS_EXPERIMENTAL_RELEVANCE: "1"
      NUCLEUS_EXPERIMENTAL_CONTEXT_BINDER: "1"
      NUCLEUS_EXPERIMENTAL_TYPED_LINEAGE: "1"
      NUCLEUS_EXPERIMENTAL_SUBSTITUTION_RECLOSURE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Test source and build
        run: |
          set -euo pipefail
          NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION=1 cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus
      - name: Bind immutable Arena tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests metatron-kernel/evidence-out/mulzero
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
      - name: A/B source-certified zero rule and protected 196
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,statistics,subprocess,tempfile,time,sys
          sys.path.insert(0,'.github/scripts')
          from nucleus_succle_separator import extract,false_index
          root=pathlib.Path('/tmp/arena-tests')
          out=pathlib.Path('metatron-kernel/evidence-out/mulzero/ab.json')
          seven=['init-prelude','perf/grind-ring-5','perf/magma-list-pair-n7',
                 'perf/magma-list-pair-n21','perf/magma-list-deep-n21',
                 'perf/magma-list-deep-n36','perf/fueled-chain']
          def env_for(mode,trace=False):
              env=os.environ.copy()
              for key in ('NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION',
                  'NUCLEUS_EXPERIMENTAL_PROJECTION_CONTEXT',
                  'NUCLEUS_EXPERIMENTAL_PROJECTION_CROSSFRAME_512',
                  'NUCLEUS_EXPERIMENTAL_POLYMORPHIC_PROP_IRREL',
                  'NUCLEUS_EXPERIMENTAL_PROP_SINGLETON_2P1F',
                  'NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA'):
                  env[key]='1'
              if mode=='mulzero':
                  env['NUCLEUS_EXPERIMENTAL_VERIFIED_MUL_ZERO']='1'
              if trace:
                  env['NUCLEUS_TRACE_DOWNSTREAM']='1'
                  env['NUCLEUS_TRACE_VERIFIED_MUL_ZERO']='1'
              return env
          pairs=[]
          for case in seven:
              data=(root/'good'/(case+'.ndjson')).read_bytes()
              timings={'baseline':[],'mulzero':[]}
              for repetition in range(2):
                  for mode in (('baseline','mulzero') if repetition==0 else ('mulzero','baseline')):
                      with tempfile.TemporaryDirectory() as d:
                          meter=pathlib.Path(d)/'meter'
                          started=time.monotonic()
                          p=subprocess.run(['/usr/bin/time','-f','%U %S %M',
                                '-o',str(meter),'/tmp/nucleus'],input=data,
                                stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
                                timeout=90,env=env_for(mode,True))
                          cpu=map(float,meter.read_text().strip().splitlines()[-1].split()[:3])
                          user,sys_time,rss=cpu
                          timings[mode].append({
                              'rc':p.returncode,
                              'cpu':user+sys_time,
                              'wall':time.monotonic()-started,
                              'rss_kb':int(rss),
                              'certified':sum(s.startswith('NUCLEUS_MUL_ZERO_ADMISSION:certified=true')
                                  for s in p.stderr.decode(errors='replace').splitlines()),
                              'hits':sum(s.startswith('NUCLEUS_VERIFIED_MUL_ZERO:PROVEN')
                                  for s in p.stderr.decode(errors='replace').splitlines()),
                              'unknown':[s for s in p.stderr.decode(errors='replace').splitlines()
                                  if s.startswith('NUCLEUS_DOWNSTREAM:')][-1:],
                          })
              assert len({x['rc'] for mode in timings.values() for x in mode})==1,(case,timings)
              row={'case':case,'sha256':hashlib.sha256(data).hexdigest(),
                   'status':timings['baseline'][0]['rc'],
                   'baseline_cpu':statistics.median(t['cpu'] for t in timings['baseline']),
                   'mulzero_cpu':statistics.median(t['cpu'] for t in timings['mulzero']),
                   'certificate_count':timings['mulzero'][0]['certified'],
                   'reduction_hits':timings['mulzero'][0]['hits'],
                   'observations':timings}
              pairs.append(row)
              print('NUCLEUS_MULZERO_CASE='+json.dumps({k:v for k,v in row.items()
                  if k!='observations'}),flush=True)
          rows={}
          for mode in ('baseline','mulzero'):
              observed=[]
              for folder in ('good','bad'):
                  for path in sorted((root/folder).rglob('*.ndjson')):
                      p=subprocess.run(['/tmp/nucleus'],input=path.read_bytes(),
                          stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,
                          timeout=45,env=env_for(mode))
                      observed.append((folder,str(path.relative_to(root)),p.returncode))
              assert len(observed)==196
              false=[r for r in observed if r[2] not in (0,1,2)
                     or (r[0]=='bad' and r[2]!=1)
                     or (r[0]=='good' and r[2]==1)]
              assert not false,false
              counts={'accepted':sum(r[0]=='good' and r[2]==0 for r in observed),
                      'rejected':sum(r[0]=='bad' and r[2]==1 for r in observed),
                      'unknown':sum(r[2]==2 for r in observed)}
              rows[mode]={'counts':counts,'verdicts':observed}
              print('NUCLEUS_MULZERO_FROZEN196='+json.dumps({'mode':mode,**counts}),flush=True)
              if mode=='baseline':
                  assert counts=={'accepted':118,'rejected':71,'unknown':7}
          verdict_diffs=[dict(case=b[1],before=b[2],after=a[2])
             for b,a in zip(rows['baseline']['verdicts'],rows['mulzero']['verdicts'])
             if b[2]!=a[2]]
          false_source=false_index(extract((root/'good/init-prelude.ndjson').read_bytes()))
          for mode in ('baseline','mulzero'):
              p=subprocess.run(['/tmp/nucleus'],input=false_source,
                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,
                  timeout=45,env=env_for(mode))
              assert p.returncode in (1,2),(mode,p.returncode)
          print('NUCLEUS_MULZERO_DIFFS='+json.dumps(verdict_diffs),flush=True)
          report={'commit':os.environ['GITHUB_SHA'],'arena_sha':os.environ['ARENA_SHA'],
                  'fixture_artifact':os.environ['ARENA_ARTIFACT'],
                  'cpu_measurement':'Linux user+system CPU, not Arena instructions',
                  'pairs':pairs,'rows':rows,'verdict_diffs':verdict_diffs}
          out.write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-msi-mulzero-${{ github.sha }}
          path: metatron-kernel/evidence-out/mulzero
          if-no-files-found: warn
