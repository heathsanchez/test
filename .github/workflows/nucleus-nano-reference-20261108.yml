# C19: external reference observation only. No Nucleus kernel authority change.
name: Nucleus C19 pinned nano-lean reference comparison
on:
  push:
    branches: [research/nucleus-logos-support-20261108]
    paths: ['.github/workflows/nucleus-nano-reference-20261108.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  reference-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sdiehl/nano-lean
          ref: 54ce971a5ac2513a1bac0ac9bca73f672196c0f2
          path: nano-reference
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Rebuild external reference at its exact SHA; preserve separate trust model
        run: |
          set -euo pipefail
          mkdir -p reports original196 arena207
          test "$(git -C nano-reference rev-parse HEAD)" = '54ce971a5ac2513a1bac0ac9bca73f672196c0f2'
          cargo build --locked --release --manifest-path nano-reference/Cargo.toml --bin nl-fast > reports/reference-build.log 2>&1 || { tail -n 100 reports/reference-build.log; exit 1; }
          sha256sum nano-reference/target/release/nl-fast > reports/reference-binary.sha256
          nano-reference/target/release/nl-fast --help > reports/reference-cli.txt
      - name: Restore frozen original valid and forged exports
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > original196.zip
          printf '%s  %s\n' f6cd590db7f6fb92b8d1b3ca87231d4b0f521f085d73f93abd005f5caaff86d2 original196.zip | sha256sum -c -
          unzip -p original196.zip lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C original196
          gh api repos/heathsanchez/test/actions/artifacts/13276400289/zip > arena207.zip
          printf '%s  %s\n' a9582eadc0d9893cbe39e6bcfccd79bfaec2032838851b8a487c35df16096763 arena207.zip | sha256sum -c -
          unzip -p arena207.zip lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C arena207
      - name: Revalidate harness guards and compare 6 valid with 4 forged
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/nucleus-logos-support-20261108 -p 'test_*.py' -v > reports/harness-tests.log 2>&1 || { tail -n 100 reports/harness-tests.log; exit 1; }
          python3 experiments/nucleus-logos-support-20261108/probe_c19_reference.py \
            --binary nano-reference/target/release/nl-fast \
            --valid-root arena207 \
            --bad-root original196 \
            --steps 262144 --timeout 60 | tee reports/c19-reference-results.json
      - name: C20 value-versus-term core ablation on the same ten frozen exports
        run: |
          set -euo pipefail
          python3 experiments/nucleus-logos-support-20261108/probe_c19_reference.py \
            --binary nano-reference/target/release/nl-fast \
            --valid-root arena207 \
            --bad-root original196 \
            --steps 262144 --timeout 60 --core term \
            | tee reports/c20-term-core-results.json
      - name: C21 observe source-pinned value-core activity without changing checking rules
        run: |
          set -euo pipefail
          printf '%s  %s\n' e5ca34489fc7b8ee13b1e7f09f76247ab7b01dd1a752a13cc8b796c569e1401a arena207/good/perf/fueled-chain.ndjson | sha256sum -c -
          cargo build --locked --release --features vstats --manifest-path nano-reference/Cargo.toml --bin nl-fast > reports/c21-vstats-build.log 2>&1 || { tail -n 100 reports/c21-vstats-build.log; exit 1; }
          NL_VSTATS=1 nano-reference/target/release/nl-fast --steps 262144 -j1 -q \
            arena207/good/perf/fueled-chain.ndjson > reports/c21-vstats.stdout 2> reports/c21-vstats.stderr
          grep -q '^vstats chain12_datF Stats ' reports/c21-vstats.stderr
          grep -E '^vstats (chain6_datF|chain9_datF|chain12|chain12_datF) Stats ' reports/c21-vstats.stderr > reports/c21-vstats-selected.txt
          python3 experiments/nucleus-logos-support-20261108/vstats_contract.py \
            --stats reports/c21-vstats.stderr --declaration chain12_datF --counter inst_hit --expect positive \
            > reports/c21-inst-hit-contract.json
          python3 experiments/nucleus-logos-support-20261108/vstats_contract.py \
            --stats reports/c21-vstats.stderr --declaration chain12_datF --counter closed_hit --expect positive \
            > reports/c21-closed-hit-contract.json
      - name: C22 ablate only untyped Pi instantiation memoization in reference
        run: |
          set -euo pipefail
          test "$(git -C nano-reference rev-parse HEAD)" = '54ce971a5ac2513a1bac0ac9bca73f672196c0f2'
          git -C nano-reference apply --check "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c22-nano-no-inst-pi-memo.patch"
          git -C nano-reference apply "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c22-nano-no-inst-pi-memo.patch"
          cargo build --locked --release --features vstats --manifest-path nano-reference/Cargo.toml --bin nl-fast > reports/c22-build.log 2>&1 || { tail -n 100 reports/c22-build.log; exit 1; }
          set +e
          NL_VSTATS=1 timeout --signal=TERM --kill-after=3s 60s nano-reference/target/release/nl-fast --steps 262144 -j1 -q \
            arena207/good/perf/fueled-chain.ndjson > reports/c22-fueled-chain.stdout 2> reports/c22-fueled-chain.stderr
          c22_code=$?
          set -e
          printf '%s\n' "$c22_code" > reports/c22-fueled-chain.exit
          case "$c22_code" in 0|2|124) ;; *) echo 'Unexpected failure of unchanged valid source under memo-free reference'; exit 1 ;; esac
          if test "$c22_code" -ne 124; then
            python3 experiments/nucleus-logos-support-20261108/vstats_contract.py \
              --stats reports/c22-fueled-chain.stderr --declaration chain12_datF --counter inst_hit --expect zero \
              > reports/c22-inst-hit-contract.json
          fi
      - name: C23 ablate only closed-expression type inference memo in pristine reference
        run: |
          set -euo pipefail
          test "$(git -C nano-reference rev-parse HEAD)" = '54ce971a5ac2513a1bac0ac9bca73f672196c0f2'
          git -C nano-reference apply --reverse --check "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c22-nano-no-inst-pi-memo.patch"
          git -C nano-reference apply --reverse "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c22-nano-no-inst-pi-memo.patch"
          git -C nano-reference diff --exit-code
          git -C nano-reference apply --check "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c23-nano-no-closed-type-memo.patch"
          git -C nano-reference apply "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c23-nano-no-closed-type-memo.patch"
          git -C nano-reference diff -- src/value_checker/infer.rs > reports/c23-source-diff.patch
          cargo build --locked --release --features vstats --manifest-path nano-reference/Cargo.toml --bin nl-fast > reports/c23-build.log 2>&1 || { tail -n 100 reports/c23-build.log; exit 1; }
          set +e
          NL_VSTATS=1 timeout --signal=TERM --kill-after=3s 60s nano-reference/target/release/nl-fast --steps 262144 -j1 -q \
            arena207/good/perf/fueled-chain.ndjson > reports/c23-fueled-chain.stdout 2> reports/c23-fueled-chain.stderr
          c23_code=$?
          set -e
          printf '%s\n' "$c23_code" > reports/c23-fueled-chain.exit
          case "$c23_code" in 0|2|124) ;; *) echo 'Unexpected failure of frozen valid source under closed-memo-free reference'; exit 1 ;; esac
          if test "$c23_code" -ne 124; then
            python3 experiments/nucleus-logos-support-20261108/vstats_contract.py \
              --stats reports/c23-fueled-chain.stderr --counter closed_hit --expect zero \
              > reports/c23-closed-hit-contract.json
          fi
      - name: C24 test the two independent reference memo ablations together
        run: |
          set -euo pipefail
          test "$(git -C nano-reference rev-parse HEAD)" = '54ce971a5ac2513a1bac0ac9bca73f672196c0f2'
          git -C nano-reference apply --reverse --check "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c23-nano-no-closed-type-memo.patch"
          git -C nano-reference apply --reverse "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c23-nano-no-closed-type-memo.patch"
          git -C nano-reference diff --exit-code
          git -C nano-reference apply --check "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c22-nano-no-inst-pi-memo.patch"
          git -C nano-reference apply "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c22-nano-no-inst-pi-memo.patch"
          git -C nano-reference apply --check "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c23-nano-no-closed-type-memo.patch"
          git -C nano-reference apply "$GITHUB_WORKSPACE/experiments/nucleus-logos-support-20261108/c23-nano-no-closed-type-memo.patch"
          git -C nano-reference diff -- src/value_checker/infer.rs > reports/c24-combined-source-diff.patch
          cargo build --locked --release --features vstats --manifest-path nano-reference/Cargo.toml --bin nl-fast > reports/c24-build.log 2>&1 || { tail -n 100 reports/c24-build.log; exit 1; }
          set +e
          NL_VSTATS=1 timeout --signal=TERM --kill-after=3s 60s nano-reference/target/release/nl-fast --steps 262144 -j1 -q \
            arena207/good/perf/fueled-chain.ndjson > reports/c24-fueled-chain.stdout 2> reports/c24-fueled-chain.stderr
          c24_code=$?
          set -e
          printf '%s\n' "$c24_code" > reports/c24-fueled-chain.exit
          case "$c24_code" in 0|2|124) ;; *) echo 'Unexpected failure of unchanged valid original under combined reference memo ablations'; exit 1 ;; esac
          if test "$c24_code" -ne 124; then
            python3 experiments/nucleus-logos-support-20261108/vstats_contract.py \
              --stats reports/c24-fueled-chain.stderr --counter inst_hit --expect zero \
              > reports/c24-inst-hit-contract.json
            python3 experiments/nucleus-logos-support-20261108/vstats_contract.py \
              --stats reports/c24-fueled-chain.stderr --counter closed_hit --expect zero \
              > reports/c24-closed-hit-contract.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-C19-nano-reference-UNQUALIFIED
          retention-days: 60
          path: reports/
