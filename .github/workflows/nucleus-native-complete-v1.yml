name: Nucleus Native Complete v1

on:
  push:
    branches: [nucleus-native-complete-v1]
    paths:
      - ".github/workflows/nucleus-native-complete-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-native-complete-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEGACY_FAST_SHA: 9e9b8e5c583696794d9b29ec42d5d57b31285749
      COMPLETE_SHA: 78c7502bac8a5ba000057b3f083bc0595ac65750
      ARENA_ARTIFACT: 10712869614

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build exact native-complete Nucleus
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --release --locked
          cargo build --release --locked

      - name: Build legacy residual-grown accelerator for accounting only
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/legacy-fast "$LEGACY_FAST_SHA"
          cargo build --release --locked --manifest-path /tmp/legacy-fast/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Prove native completion
        working-directory: metatron-kernel
        timeout-minutes: 35
        run: |
          set -euo pipefail
          mkdir -p evidence-out/native-complete-v1
          python - <<'PY'
          import json, os, pathlib, subprocess, time

          root = pathlib.Path('/tmp/tests')
          native = pathlib.Path('target/release/metatron-kernel').resolve()
          legacy = pathlib.Path('/tmp/legacy-fast/metatron-kernel/target/release/metatron-kernel')

          rows = []
          for d, expected in [('good', 0), ('bad', 1)]:
              for p in sorted((root / d).rglob('*.ndjson')):
                  name = str(p.relative_to(root / d)).removesuffix('.ndjson')

                  def rr(binary):
                      with p.open('rb') as f:
                          t = time.perf_counter_ns()
                          q = subprocess.run(
                              [str(binary)],
                              stdin=f,
                              stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL,
                              timeout=180,
                          )
                          return q.returncode, time.perf_counter_ns() - t

                  nrc, nt = rr(native)
                  lrc, lt = rr(legacy)
                  rows.append({
                      'test': name,
                      'expected': expected,
                      'native_rc': nrc,
                      'legacy_rc': lrc,
                      'native_ns': nt,
                      'legacy_ns': lt,
                  })

          assert len(rows) == 193

          native_wrong = [r for r in rows if r['native_rc'] != r['expected']]
          native_undecided = [r for r in rows if r['native_rc'] not in (0, 1)]
          legacy_wrong = [
              r for r in rows
              if r['legacy_rc'] in (0, 1) and r['legacy_rc'] != r['expected']
          ]
          legacy_residual = [r for r in rows if r['legacy_rc'] in (2, 3)]

          assert not native_wrong, native_wrong
          assert not native_undecided, native_undecided
          assert not legacy_wrong, legacy_wrong
          assert len(legacy_residual) == 49, len(legacy_residual)

          summary = {
              'schema': 'nucleus-native-complete-v1',
              'candidate_sha': os.environ['GITHUB_SHA'],
              'complete_semantics_sha': os.environ['COMPLETE_SHA'],
              'legacy_fast_sha': os.environ['LEGACY_FAST_SHA'],
              'fixed_outcome_tests': len(rows),
              'native_accept': sum(r['native_rc'] == 0 for r in rows),
              'native_reject': sum(r['native_rc'] == 1 for r in rows),
              'native_undecided': len(native_undecided),
              'native_wrong': native_wrong,
              'delegated': 0,
              'legacy_fast_accept': sum(r['expected'] == 0 and r['legacy_rc'] == 0 for r in rows),
              'legacy_fast_reject': sum(r['expected'] == 1 and r['legacy_rc'] == 1 for r in rows),
              'legacy_fast_residual': len(legacy_residual),
              'legacy_fast_residual_tests': [r['test'] for r in legacy_residual],
              'binary_bytes': native.stat().st_size,
          }

          out = pathlib.Path('evidence-out/native-complete-v1')
          (out / 'result.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          (out / 'rows.json').write_text(json.dumps(rows, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, sort_keys=True))

          assert summary['native_accept'] == 122, summary
          assert summary['native_reject'] == 71, summary
          assert summary['native_undecided'] == 0, summary
          assert summary['delegated'] == 0, summary
          PY

      - name: Upload finish evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-native-complete-${{ github.sha }}
          path: metatron-kernel/evidence-out/native-complete-v1
          if-no-files-found: error
