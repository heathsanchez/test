name: Nucleus native Nat.beq microgate v1

on:
  push:
    branches: [nucleus-native-nat-beq-v1]
    paths:
      - ".github/workflows/nucleus-native-nat-beq-microgate-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SUBTREE: 77f46b1bba9d05118fa3d3edc6cd14b1acca30be
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bind build and test
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel)" = "$SOURCE_SUBTREE"
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/tests evidence
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/a.zip
          unzip -q /tmp/a.zip -d /tmp/a
          tar --no-same-owner -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Run decisive separator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess, os
          def run(bucket,name,timeout=30):
              p=pathlib.Path("/tmp/tests")/bucket/(name+".ndjson")
              q=subprocess.run(["/tmp/nucleus"],stdin=p.open("rb"),stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,timeout=timeout,
                  env=os.environ|{"NUCLEUS_TRACE_DOWNSTREAM":"1","NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE":"1"})
              return {"exit":q.returncode,"stderr":q.stderr.decode(errors="replace").splitlines()[-40:]}
          rows={
            "init-prelude":run("good","init-prelude"),
            "nested-unused-param":run("bad","bugs/nested-unused-param"),
            "proj-stuck-prop":run("bad","bugs/proj-of-stuck-prop"),
            "rec-subst-prop":run("bad","bugs/rec-of-subst-prop"),
          }
          print(json.dumps(rows,indent=2))
          pathlib.Path("evidence/result.json").write_text(json.dumps(rows,indent=2)+"\n")
          assert rows["init-prelude"]["exit"] == 2, rows
          assert any("NUCLEUS_APPLICATION_FUNCTION_TYPE:" in line for line in rows["init-prelude"]["stderr"]), rows
          assert rows["nested-unused-param"]["exit"] == 1, rows
          assert rows["proj-stuck-prop"]["exit"] != 0, rows
          assert rows["rec-subst-prop"]["exit"] != 0, rows
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-native-nat-beq-microgate-${{ github.sha }}
          path: evidence
          if-no-files-found: error
