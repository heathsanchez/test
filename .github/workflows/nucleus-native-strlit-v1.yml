name: Nucleus Native String Literal v1

on:
  push:
    branches: [nucleus-native-strlit-v1]
    paths:
      - ".github/workflows/nucleus-native-strlit-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-native-strlit-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: 20e8e98f6f1b86dcd437cb6f1e5ed3bd61a19302
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}

      - name: Build candidate and exact 51-case base
        run: |
          set -euo pipefail
          cd metatron-kernel
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked
          cd ..
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Full 193-case parser-progress reclosure
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/native-strlit-v1
          python - <<'PY'
          import json,pathlib,subprocess,os
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]
          for d,expected in [('good',0),('bad',1)]:
            for p in sorted((root/d).rglob('*.ndjson')):
              name=str(p.relative_to(root/d)).removesuffix('.ndjson')
              def rr(binary):
                with p.open('rb') as f:
                  return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                                        stderr=subprocess.DEVNULL,timeout=120).returncode
              a,b=rr(base),rr(cand)
              rows.append({'test':name,'expected':expected,'base':a,'candidate':b})
          assert len(rows)==193
          false_accept=[r for r in rows if r['expected']==1 and r['candidate']==0]
          false_reject=[r for r in rows if r['expected']==0 and r['candidate']==1]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          wrong=[r for r in rows if r['base'] in (2,3) and r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          assert not false_accept,false_accept
          assert not false_reject,false_reject
          assert not regressions,regressions
          assert not wrong,wrong
          changes=[r for r in rows if r['base']!=r['candidate']]
          base_errors=sum(r['base']==3 for r in rows)
          cand_errors=sum(r['candidate']==3 for r in rows)
          assert base_errors==4,base_errors
          assert cand_errors==0,cand_errors
          assert all(r['base']==3 and r['candidate']==2 for r in changes),changes
          assert len(changes)==4,changes
          out={
            'schema':'nucleus-native-strlit-v1',
            'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
            'base_accept':sum(r['base']==0 for r in rows),
            'base_reject':sum(r['base']==1 for r in rows),
            'base_unknown':sum(r['base']==2 for r in rows),
            'base_error':base_errors,
            'candidate_accept':sum(r['candidate']==0 for r in rows),
            'candidate_reject':sum(r['candidate']==1 for r in rows),
            'candidate_unknown':sum(r['candidate']==2 for r in rows),
            'candidate_error':cand_errors,
            'changes':changes,
            'false_accepts':false_accept,'false_rejects':false_reject,
            'regressions':regressions,'wrong_deltas':wrong,
          }
          pathlib.Path('evidence-out/native-strlit-v1/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-native-strlit-${{ github.sha }}
          path: metatron-kernel/evidence-out/native-strlit-v1
          if-no-files-found: error
