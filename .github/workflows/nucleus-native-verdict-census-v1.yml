name: Nucleus Native Verdict Census v1

on:
  push:
    branches: [nucleus-native-verdict-census-v1]
    paths:
      - ".github/workflows/nucleus-native-verdict-census-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build exact retained Nucleus
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked
      - name: Fetch exact official 193-file Arena tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/10712869614/zip > /tmp/test-tarball.zip
          mkdir -p /tmp/test-artifact /tmp/arena-tests
          unzip -q /tmp/test-tarball.zip -d /tmp/test-artifact
          tar -xzf /tmp/test-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
          test "$(find /tmp/arena-tests -type f -name '*.ndjson' | wc -l)" -eq 193
      - name: Census native verdicts
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/native-verdict-census
          python - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('/tmp/arena-tests')
          binary=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          rows=[]
          for outcome_dir,expected in [('good','accept'),('bad','reject')]:
              for p in sorted((root/outcome_dir).rglob('*.ndjson')):
                  name=str(p.relative_to(root/outcome_dir)).removesuffix('.ndjson')
                  with p.open('rb') as f:
                      rc=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  rows.append({'test':name,'expected':expected,'rc':rc})
          assert len(rows)==193
          buckets={
              'good_accept':[r['test'] for r in rows if r['expected']=='accept' and r['rc']==0],
              'good_reject':[r['test'] for r in rows if r['expected']=='accept' and r['rc']==1],
              'good_unknown':[r['test'] for r in rows if r['expected']=='accept' and r['rc']==2],
              'good_error':[r['test'] for r in rows if r['expected']=='accept' and r['rc']==3],
              'bad_accept':[r['test'] for r in rows if r['expected']=='reject' and r['rc']==0],
              'bad_reject':[r['test'] for r in rows if r['expected']=='reject' and r['rc']==1],
              'bad_unknown':[r['test'] for r in rows if r['expected']=='reject' and r['rc']==2],
              'bad_error':[r['test'] for r in rows if r['expected']=='reject' and r['rc']==3],
          }
          summary={'schema':'nucleus-native-verdict-census-v1','candidate_sha':'${GITHUB_SHA}','counts':{k:len(v) for k,v in buckets.items()},'buckets':buckets}
          pathlib.Path('metatron-kernel/evidence-out/native-verdict-census/result.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          pathlib.Path('metatron-kernel/evidence-out/native-verdict-census/rows.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          assert not buckets['bad_accept'], buckets['bad_accept']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-native-verdict-census-${{ github.sha }}
          path: metatron-kernel/evidence-out/native-verdict-census
          if-no-files-found: warn
