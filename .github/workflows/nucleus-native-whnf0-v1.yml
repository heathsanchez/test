name: Nucleus Native WHNF0 v1

on:
  push:
    branches: [nucleus-native-whnf0-v1]
    paths:
      - ".github/workflows/nucleus-native-whnf0-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-native-whnf0-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BASE_SHA: a997bafa022153e3789efa14cf752bcb171e8b2f
      FROZEN_ARENA_ARTIFACT: 10712869614
      CURRENT_ARENA_SHA: 95496f5376b089dfd5889d88c73e390a9d98653d

    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: cachix/install-nix-action@v31

      - name: Build candidate and exact native-complete control
        run: |
          set -euo pipefail
          cd metatron-kernel
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --release --locked
          cargo build --release --locked
          cp target/release/metatron-kernel /tmp/candidate
          cd ..
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml
          cp /tmp/base/metatron-kernel/target/release/metatron-kernel /tmp/base-bin
          sha256sum /tmp/candidate /tmp/base-bin | tee /tmp/binaries.sha256
          stat -c 'candidate_bytes=%s' /tmp/candidate | tee /tmp/size.txt
          stat -c 'base_bytes=%s' /tmp/base-bin | tee -a /tmp/size.txt

      - name: Fetch exact frozen 193-case corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$FROZEN_ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/frozen
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/frozen
          test "$(find /tmp/frozen -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Frozen native-complete parity and speed
        timeout-minutes: 45
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/native-whnf0-v1
          python - <<'PY' | tee /tmp/frozen-summary.txt
          import json, pathlib, statistics, subprocess, time
          root=pathlib.Path('/tmp/frozen')
          arms={'base':pathlib.Path('/tmp/base-bin'),'candidate':pathlib.Path('/tmp/candidate')}
          tests=[]
          for d,expected in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  tests.append((str(p.relative_to(root/d)).removesuffix('.ndjson'),p,expected))
          assert len(tests)==193
          rows=[]
          totals={a:[] for a in arms}
          for rep in range(2):
              for arm,binary in arms.items():
                  start=time.perf_counter_ns()
                  for name,p,expected in tests:
                      with p.open('rb') as f:
                          q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=180)
                      if rep==0:
                          rows.append({'arm':arm,'test':name,'expected':expected,'rc':q.returncode})
                  totals[arm].append(time.perf_counter_ns()-start)
          bad=[r for r in rows if r['rc']!=r['expected']]
          assert not bad,bad[:20]
          by={(r['arm'],r['test']):r['rc'] for r in rows}
          mismatches=[name for name,_,_ in tests if by[('base',name)]!=by[('candidate',name)]]
          assert not mismatches,mismatches
          med={a:statistics.median(v) for a,v in totals.items()}
          out={
              'schema':'nucleus-native-whnf0-v1-frozen',
              'tests':193,
              'mismatches':mismatches,
              'wrong':bad,
              'totals_ns':totals,
              'median_ns':med,
              'candidate_over_base':med['candidate']/med['base'],
          }
          dest=pathlib.Path('metatron-kernel/evidence-out/native-whnf0-v1/frozen.json')
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Build full current Arena corpus
        timeout-minutes: 120
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q "$CURRENT_ARENA_SHA"
          cd /tmp/arena
          nix develop -c ./lka.py build-test
          test "$(find _build/tests -type f -name '*.stats.json' | wc -l)" -gt 193

      - name: Classify candidate on current Arena
        timeout-minutes: 40
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/current-summary.txt
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/arena/_build/tests')
          rows=[]
          for stats in sorted(root.rglob('*.stats.json')):
              data=json.loads(stats.read_text())
              ndjson=stats.parent/(stats.name.replace('.stats.json','.ndjson'))
              if not ndjson.exists():
                  rows.append({'test':data.get('name'),'outcome':data.get('outcome'),'status':'missing','correctness':'error'})
                  continue
              with ndjson.open('rb') as f:
                  p=subprocess.run(['/tmp/candidate'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=300)
              rc=p.returncode
              status={0:'accepted',1:'rejected',2:'declined'}.get(rc,'error')
              expected=data.get('outcome')
              if status=='declined': correctness='declined'
              elif status=='error': correctness='error'
              elif expected=='either': correctness='either'
              elif expected=='accept' and status=='accepted': correctness='correct'
              elif expected=='reject' and status=='rejected': correctness='correct'
              else: correctness='incorrect'
              rows.append({'test':data.get('name'),'outcome':expected,'status':status,'correctness':correctness,'exit_code':rc,
                           'stderr_tail':p.stderr.decode(errors='replace')[-500:] if status=='error' else ''})
          counts={}
          for r in rows: counts[r['correctness']]=counts.get(r['correctness'],0)+1
          out={
              'schema':'nucleus-native-whnf0-v1-current-arena',
              'arena_sha':os.environ['CURRENT_ARENA_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'total':len(rows),
              'counts':counts,
              'incorrect':[r for r in rows if r['correctness']=='incorrect'],
              'errors':[r for r in rows if r['correctness']=='error'],
              'declined':[r for r in rows if r['correctness']=='declined'],
              'rows':rows,
          }
          dest=pathlib.Path('metatron-kernel/evidence-out/native-whnf0-v1/current-arena.json')
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:out[k] for k in ['total','counts']},sort_keys=True))
          print('INCORRECT',json.dumps(out['incorrect'][:30],sort_keys=True))
          print('ERRORS',json.dumps(out['errors'][:30],sort_keys=True))
          print('DECLINED',json.dumps(out['declined'][:30],sort_keys=True))
          assert not out['incorrect'], out['incorrect'][:20]
          assert not out['errors'], out['errors'][:20]
          assert not out['declined'], out['declined'][:20]
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-native-whnf0-${{ github.sha }}
          path: |
            metatron-kernel/evidence-out/native-whnf0-v1
            /tmp/binaries.sha256
            /tmp/size.txt
            /tmp/frozen-summary.txt
            /tmp/current-summary.txt
          if-no-files-found: warn
