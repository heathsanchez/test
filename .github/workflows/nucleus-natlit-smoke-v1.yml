name: Nucleus NatLit Smoke v1

on:
  push:
    branches: [nucleus-semantic-closure-natlit-v1]
    paths:
      - "metatron-kernel/**"
      - ".github/workflows/nucleus-natlit-smoke-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-natlit-smoke-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - name: Verify and build
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked
      - name: Fetch exact Arena tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/10712869614/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Run six-case literal census
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('/tmp/tests')
          bin=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          cases=[
            ('tutorial/102_aNatLit',0),
            ('tutorial/103_natLitEq',0),
            ('other/nat-lit-add',0),
            ('other/nat-lit-add-bad',1),
            ('other/nat-lit-ble',0),
            ('other/nat-lit-sub',0),
          ]
          rows=[]
          for name,expected in cases:
              d='bad' if name=='other/nat-lit-add-bad' else 'good'
              p=root/d/(name+'.ndjson')
              env=dict(__import__('os').environ)
              env['NUCLEUS_TRACE_PARSE_ERROR']='1'
              with p.open('rb') as f:
                  proc=subprocess.run([str(bin)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,env=env)
              rows.append({'test':name,'expected':expected,'rc':proc.returncode,'stderr':proc.stderr.decode(errors='replace')[-1000:]})
          print(json.dumps(rows,sort_keys=True))
          by={r['test']:r for r in rows}
          assert by['tutorial/102_aNatLit']['rc']==0,by
          assert by['tutorial/103_natLitEq']['rc']==0,by

          # Declaration-prefix census: name the first semantic boundary in
          # each arithmetic stream without changing checker behavior.
          import json as _json, tempfile
          for name in ['other/nat-lit-add','other/nat-lit-add-bad','other/nat-lit-ble','other/nat-lit-sub']:
              d='bad' if name=='other/nat-lit-add-bad' else 'good'
              p=root/d/(name+'.ndjson')
              raw=p.read_bytes().splitlines(keepends=True)
              decl_points=[]
              for idx,line in enumerate(raw):
                  try:o=_json.loads(line)
                  except Exception:continue
                  kind=next((k for k in ('axiom','def','thm','inductive') if k in o),None)
                  if kind:
                      label=kind
                      payload=o[kind]
                      if kind=='inductive':
                          label='inductive'
                      decl_points.append((idx,label,payload))
              first=None
              for idx,kind,payload in decl_points:
                  proc=subprocess.run([str(bin)],input=b''.join(raw[:idx+1]),stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  if proc.returncode != 0:
                      first={'line':idx+1,'kind':kind,'rc':proc.returncode,'payload':payload}
                      break
              print('PREFIX_FIRST',name,json.dumps(first,sort_keys=True))
          PY
