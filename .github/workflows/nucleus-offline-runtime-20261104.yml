name: Nucleus reusable pinned offline Rust runtime
on:
  push:
    branches: [research/nucleus-universe-records-20261104]
    paths:
      - '.github/workflows/nucleus-offline-runtime-20261104.yml'
      - 'experiments/nucleus-offline-runtime-20261104/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore complete qualified source
        run: |
          mkdir -p /tmp/qualified-stack
          gh api repos/heathsanchez/test/actions/artifacts/13285618199/zip > /tmp/qualified-stack.zip
          printf '%s  %s\n' 9a5a38454c3c689601580e92c49147d88ba6c9918b45a8d2cba32207aeca0705 /tmp/qualified-stack.zip | sha256sum -c -
          unzip -q /tmp/qualified-stack.zip -d /tmp/qualified-stack
      - name: Seal portable compiler and verify offline exact rebuild
        run: python3 experiments/nucleus-offline-runtime-20261104/prepare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-offline-runtime-${{ github.sha }}
          compression-level: 0
          retention-days: 90
          path: |
            /tmp/nucleus-offline-runtime/*.json
            /tmp/nucleus-offline-runtime/*.tar.gz
            /tmp/nucleus-offline-runtime/*.log
