name: Nucleus six valid original Arena UNKNOWN causal profile

on:
  push:
    branches: [research/nucleus-cross-checker-trace-20261105]
    paths: ['.github/workflows/nucleus-original-six-unknown-profile-20261105.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Restore and verify immutable source and frontier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trace-parent /tmp/trace-current /tmp/trace-source /tmp/trace-evidence
          gh api repos/heathsanchez/test/actions/artifacts/13325481741/zip > /tmp/trace-parent.zip
          unzip -q /tmp/trace-parent.zip -d /tmp/trace-parent
          printf '%s  %s\n' ce6bdc5eb50757d2b624fefed8e48289d933eeaffdbeba9815d277aa31c4d7de /tmp/trace-parent/candidate/source.tar.gz | sha256sum -c -
          gh api repos/heathsanchez/test/actions/artifacts/13359400422/zip > /tmp/trace-current.zip
          printf '%s  %s\n' 79a49583b5e9c4742c4280075b41cdd89ba44f2d96b402af8f90ef4750897e8d /tmp/trace-current.zip | sha256sum -c -
          unzip -q /tmp/trace-current.zip -d /tmp/trace-current
          python3 - <<'PY'
          import tarfile
          with tarfile.open('/tmp/trace-parent/candidate/source.tar.gz') as t:
              t.extractall('/tmp/trace-source', filter='data')
          PY
          patch --batch --fuzz=0 -p1 -d /tmp/trace-source -i "$GITHUB_WORKSPACE/experiments/nucleus-quotient-result-projection-20261104/quotient-result-projection.patch"
          patch --batch --fuzz=0 -p1 -d /tmp/trace-source -i "$GITHUB_WORKSPACE/experiments/nucleus-universe-parametric-source-20261104/universe-parametric-source.patch"
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('/tmp/trace-source/metatron-kernel')
          manifest=json.loads(pathlib.Path('/tmp/trace-current/candidate/source-manifest.json').read_text())
          errors=[n for n,sha in manifest.items() if not (root/n).is_file() or hashlib.sha256((root/n).read_bytes()).hexdigest()!=sha]
          assert not errors, ('qualified source manifest mismatch',errors[:12])
          print('QUALIFIED_SOURCE_MATCH',len(manifest),flush=True)
          PY
          find /tmp/trace-current -name next-frontier.ndjson.zst -type f -print
          python3 - <<'PY'
          import pathlib, subprocess, hashlib
          files=list(pathlib.Path('/tmp/trace-current').rglob('next-frontier.ndjson.zst'))
          assert len(files)==1,('ambiguous first frontier',[str(x) for x in files])
          with open('/tmp/trace-evidence/frontier.ndjson','wb') as out:
              subprocess.run(['zstd','-dc',str(files[0])],stdout=out,check=True)
          got=hashlib.sha256(pathlib.Path('/tmp/trace-evidence/frontier.ndjson').read_bytes()).hexdigest()
          assert got=='ca6ba58a99ca074dc45d975ab982fd119193fa05a6d12e20f08c53cb7dd786f2',got
          print('EXACT_FRONTIER_SHA256',got,flush=True)
          PY
      - name: Apply source-scoped semantic capture congruence trial
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --fuzz=0 -p1 -d /tmp/trace-source -i "$GITHUB_WORKSPACE/experiments/nucleus-cross-checker-trace-20261105/typed-semantic-captures-formed-v3.patch"
      - name: Qualify positive and forged semantic-capture unit controls
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path /tmp/trace-source/metatron-kernel/Cargo.toml --features diagnostics typed_semantic_captures_preserve_value_equality_and_reject_changed_data -- --nocapture
      - name: Compile exact checker with semantic capture trial
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          config=json.loads(pathlib.Path('/tmp/trace-current/qualification.json').read_text())['candidate']['configuration']
          assert config and all(k.startswith('NUCLEUS_') for k in config), 'qualified Nucleus runtime configuration missing'
          env=os.environ.copy()
          env.update(config)
          cmd=['cargo','build','--release','--locked','--features','diagnostics','--manifest-path','/tmp/trace-source/metatron-kernel/Cargo.toml']
          subprocess.run(cmd, env=env, check=True)
          print('DIAGNOSTIC_BUILD_QUALIFIED_CONFIG',sorted(config),flush=True)
          print('TEST_GATE_REUSED_FROM_EXACT_SOURCE_RUN',41908748112,flush=True)
          PY
      - name: Replay six original valid UNKNOWNs with raw causal traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests /tmp/trace-evidence/six
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/original-six-corpus.zip
          unzip -q /tmp/original-six-corpus.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,time
          root=pathlib.Path('/tmp/arena-tests/good/perf')
          out=pathlib.Path('/tmp/trace-evidence/six')
          conf=json.loads(pathlib.Path('/tmp/trace-current/qualification.json').read_text())['candidate']['configuration']
          env=os.environ.copy();env.update(conf)
          env.update(NUCLEUS_PROBE_TYPED_CAPTURE_CONGRUENCE='1',NUCLEUS_TRACE_DOWNSTREAM='1',NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE='1',NUCLEUS_TRACE_DEPENDENCY_GAP='1')
          binary='/tmp/trace-source/metatron-kernel/target/release/metatron-kernel'
          names=['fueled-chain','grind-ring-5','magma-list-deep-n21','magma-list-deep-n36','magma-list-pair-n21','magma-list-pair-n7']
          rows=[]
          for name in names:
              source=root/(name+'.ndjson')
              assert source.exists(),str(source)
              t=time.monotonic()
              with source.open('rb') as f:
                  p=subprocess.run([binary],stdin=f,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,timeout=240)
              elapsed=time.monotonic()-t
              (out/(name+'.stderr')).write_bytes(p.stderr)
              (out/(name+'.stdout')).write_bytes(p.stdout)
              errorlines=p.stderr.decode(errors='replace').splitlines()
              reasons=[s[:1900] for s in errorlines if s.startswith(('NUCLEUS_DOWNSTREAM:','NUCLEUS_APPLICATION_FUNCTION_TYPE:','NUCLEUS_DEPENDENCY_GAP:'))]
              rows.append(dict(case=name,sha256=hashlib.sha256(source.read_bytes()).hexdigest(),rc=p.returncode,wall_seconds=round(elapsed,3),stderr_bytes=len(p.stderr),causal_count=len(reasons),causal_first=reasons[:4],causal_last=reasons[-6:],stderr_tail=errorlines[-4:]))
          report=dict(source_sha=os.environ['GITHUB_SHA'],qualified_input_source='leanprover/lean-kernel-arena artifact11272848230',cases=rows)
          (out/'report.json').write_text(json.dumps(report,indent=2)+'\\n')
          print('SIX_CAUSAL_PROFILE',json.dumps(report,sort_keys=True)[:15000],flush=True)
          assert all(row['rc'] in (0,2) for row in rows), 'Wrong verdict or crash on valid case'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-original-six-unknown-profile-${{ github.sha }}
          retention-days: 30
          path: /tmp/trace-evidence/six
          if-no-files-found: warn
