name: Nucleus P2 Universe Hotpath v1

on:
  push:
    branches: [nucleus-p2-universe-hotpath-v1]
    paths:
      - ".github/workflows/nucleus-p2-universe-hotpath-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-p2-universe-hotpath-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
      G25_SHA: 4b257ea8442a7905af8b894144288864b16fb81a
      P1_SHA: 398aa45fb6bc6bfda1147ee635ea6d4adfaa35bf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify candidate source
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          python -m unittest discover -s tests_py -p 'test_*.py' -v
          python scripts/check_ledger.py

      - name: Build G25, P1, and P2
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/g25 "$G25_SHA"
          git worktree add --detach /tmp/p1 "$P1_SHA"
          cargo build --release --locked --manifest-path /tmp/g25/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path /tmp/p1/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Build pinned Arena tutorial
        run: |
          set -euo pipefail
          git init /tmp/arena
          git -C /tmp/arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/arena checkout --detach FETCH_HEAD
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/tutorial
          cd /tmp/arena/tutorial
          lake clean
          OUT=/tmp/tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial

      - name: Exact semantic differential
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/p2
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/tutorial')
          g25=pathlib.Path('/tmp/g25/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]
          manifest=[]
          for expected_dir,expected in [('good',0),('bad',1)]:
              for p in sorted((root/expected_dir).glob('*.ndjson')):
                  try: n=int(p.name.split('_',1)[0])
                  except ValueError: continue
                  def run(binary):
                      with p.open('rb') as f:
                          return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  a,b=run(g25),run(cand)
                  rows.append({'number':n,'path':str(p),'expected':expected,'g25':a,'candidate':b})
                  if a==expected:
                      manifest.append(f"{expected}\t{p}")
          rows.sort(key=lambda r:r['number'])
          diffs=[r for r in rows if r['g25']!=r['candidate']]
          assert not diffs, diffs
          assert len(manifest)==78, len(manifest)
          pathlib.Path('/tmp/correct78.tsv').write_text('\n'.join(manifest)+'\n')
          committed=sorted(pathlib.Path('tests/fixtures').glob('*.ndjson'))+sorted(pathlib.Path('evidence/residuals').glob('**/*.ndjson'))
          seen=set(); cdiffs=[]; count=0
          for p in committed:
              rp=str(p)
              if rp in seen: continue
              seen.add(rp); count+=1
              def run2(binary):
                  with p.open('rb') as f:
                      return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
              a,b=run2(g25),run2(cand)
              if a!=b: cdiffs.append({'path':rp,'g25':a,'candidate':b})
          assert not cdiffs, cdiffs
          out={'schema':'nucleus-p2-semantic-v1','arena_sha':os.environ['ARENA_SHA'],'g25_sha':os.environ['G25_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],'tutorial_count':len(rows),'tutorial_diffs':diffs,'correct_cohort':len(manifest),'committed_count':count,'committed_diffs':cdiffs}
          pathlib.Path('evidence-out/p2/semantic.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: In-process 78-case cohort benchmark
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          for root in . /tmp/g25/metatron-kernel /tmp/p1/metatron-kernel; do mkdir -p "$root/examples"; done
          cat >/tmp/nucleus_cohort.rs <<'RS'
          use std::{env, fs, io::Cursor};
          use metatron_kernel::run;
          fn main() {
              let manifest=env::var("NUCLEUS_MANIFEST").expect("manifest");
              let iters:usize=env::var("NUCLEUS_BENCH_ITERS").ok().and_then(|s|s.parse().ok()).unwrap_or(200);
              let cases:Vec<(i32,Vec<u8>)>=fs::read_to_string(manifest).unwrap().lines().map(|line|{
                  let (e,p)=line.split_once('\t').unwrap();
                  (e.parse().unwrap(),fs::read(p).unwrap())
              }).collect();
              let mut checksum=0usize;
              for _ in 0..iters {
                  for (expected,bytes) in &cases {
                      let verdict=run(Cursor::new(bytes.as_slice()));
                      assert_eq!(verdict.exit_code(),*expected);
                      checksum=checksum.wrapping_add(verdict.exit_code() as usize + 1);
                  }
              }
              println!("{checksum}");
          }
          RS
          cp /tmp/nucleus_cohort.rs examples/nucleus_cohort.rs
          cp /tmp/nucleus_cohort.rs /tmp/g25/metatron-kernel/examples/nucleus_cohort.rs
          cp /tmp/nucleus_cohort.rs /tmp/p1/metatron-kernel/examples/nucleus_cohort.rs
          cargo build --release --locked --example nucleus_cohort
          cargo build --release --locked --manifest-path /tmp/g25/metatron-kernel/Cargo.toml --example nucleus_cohort
          cargo build --release --locked --manifest-path /tmp/p1/metatron-kernel/Cargo.toml --example nucleus_cohort
          python - <<'PY'
          import json,os,pathlib,statistics,subprocess,time
          bins={
            'g25':pathlib.Path('/tmp/g25/metatron-kernel/target/release/examples/nucleus_cohort'),
            'p1':pathlib.Path('/tmp/p1/metatron-kernel/target/release/examples/nucleus_cohort'),
            'p2':pathlib.Path('target/release/examples/nucleus_cohort').resolve(),
          }
          env=dict(os.environ); env['NUCLEUS_MANIFEST']='/tmp/correct78.tsv'; env['NUCLEUS_BENCH_ITERS']='200'
          orders=[['g25','p1','p2'],['p2','p1','g25'],['p1','g25','p2'],['p2','g25','p1'],['g25','p2','p1'],['p1','p2','g25'],['g25','p1','p2']]
          rows=[]
          for i,order in enumerate(orders,1):
              vals={}
              for name in order:
                  t=time.perf_counter_ns(); subprocess.check_output([str(bins[name])],env=env); vals[name]=time.perf_counter_ns()-t
              row={'round':i,**{f'{k}_ns':v for k,v in vals.items()}}; rows.append(row); print(row)
          med={k:statistics.median(r[f'{k}_ns'] for r in rows) for k in bins}
          out={'schema':'nucleus-p2-cohort-benchmark-v1','iterations':200,'cases':78,'medians_ns':med,'p1_over_g25':med['p1']/med['g25'],'p2_over_g25':med['p2']/med['g25'],'p2_over_p1':med['p2']/med['p1'],'rounds':rows}
          pathlib.Path('evidence-out/p2/cohort.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Polymorphic universe exposure benchmark
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cat >/tmp/nucleus_universe.rs <<'RS'
          use std::{collections::HashMap, env, hint::black_box};
          use metatron_kernel::id::{ExprId, IdTable, LevelId, NameId};
          use metatron_kernel::level::LevelTerm;
          use metatron_kernel::machine::{AuthorityId, Machine, Transparency};
          use metatron_kernel::syntax::{Expr, Level};
          use metatron_kernel::value::{Closure, EnvFrame, LevelSubstitution, Value};
          fn main() {
              let mut levels=IdTable::default();
              levels.insert(LevelId(0),Level::Zero).unwrap();
              levels.insert(LevelId(1),Level::Param(NameId(1))).unwrap();
              levels.insert(LevelId(2),Level::Succ(LevelId(1))).unwrap();
              levels.insert(LevelId(3),Level::Max(LevelId(2),LevelId(1))).unwrap();
              levels.insert(LevelId(4),Level::Succ(LevelId(3))).unwrap();
              let mut exprs=IdTable::default();
              exprs.insert(ExprId(0),Expr::Sort(LevelId(4))).unwrap();
              let machine=Machine::new(AuthorityId(0),&exprs,&levels,HashMap::new());
              let root=Closure::with_levels(ExprId(0),EnvFrame::empty(),LevelSubstitution::new(vec![(NameId(1),LevelTerm::Zero)]));
              let iters:usize=env::var("NUCLEUS_BENCH_ITERS").ok().and_then(|s|s.parse().ok()).unwrap_or(2_000_000);
              let mut checksum=0usize;
              for _ in 0..iters {
                  let j=black_box(machine.expose(root.clone(),Transparency::Opaque,64));
                  if matches!(j.proven_value(),Some(Value::Sort(_))) {checksum+=1;} else {panic!("bad exposure");}
              }
              println!("{checksum}");
          }
          RS
          cp /tmp/nucleus_universe.rs examples/nucleus_universe.rs
          cp /tmp/nucleus_universe.rs /tmp/g25/metatron-kernel/examples/nucleus_universe.rs
          cp /tmp/nucleus_universe.rs /tmp/p1/metatron-kernel/examples/nucleus_universe.rs
          cargo build --release --locked --example nucleus_universe
          cargo build --release --locked --manifest-path /tmp/g25/metatron-kernel/Cargo.toml --example nucleus_universe
          cargo build --release --locked --manifest-path /tmp/p1/metatron-kernel/Cargo.toml --example nucleus_universe
          python - <<'PY'
          import json,os,pathlib,statistics,subprocess,time
          bins={'g25':pathlib.Path('/tmp/g25/metatron-kernel/target/release/examples/nucleus_universe'),'p1':pathlib.Path('/tmp/p1/metatron-kernel/target/release/examples/nucleus_universe'),'p2':pathlib.Path('target/release/examples/nucleus_universe').resolve()}
          env=dict(os.environ); env['NUCLEUS_BENCH_ITERS']='2000000'
          orders=[['g25','p1','p2'],['p2','p1','g25'],['p1','g25','p2'],['p2','g25','p1'],['g25','p2','p1'],['p1','p2','g25'],['g25','p1','p2']]
          rows=[]
          for i,order in enumerate(orders,1):
              vals={}
              for name in order:
                  t=time.perf_counter_ns(); out=subprocess.check_output([str(bins[name])],env=env,text=True).strip(); vals[name]=time.perf_counter_ns()-t; assert out=='2000000'
              row={'round':i,**{f'{k}_ns':v for k,v in vals.items()}}; rows.append(row); print(row)
          med={k:statistics.median(r[f'{k}_ns'] for r in rows) for k in bins}
          out={'schema':'nucleus-p2-universe-benchmark-v1','iterations':2000000,'medians_ns':med,'p1_over_g25':med['p1']/med['g25'],'p2_over_g25':med['p2']/med['g25'],'p2_over_p1':med['p2']/med['p1'],'rounds':rows}
          pathlib.Path('evidence-out/p2/universe.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Upload P2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-p2-universe-${{ github.sha }}
          path: metatron-kernel/evidence-out/p2
          if-no-files-found: error
