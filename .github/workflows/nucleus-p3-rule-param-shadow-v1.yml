name: Nucleus P3 Rule Param Shadow v1

on:
  push:
    branches: [nucleus-p3-rule-param-shadow-v1]
    paths:
      - ".github/workflows/nucleus-p3-rule-param-shadow-v1.yml"
      - "metatron-kernel/src/checker.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SHA: 57115bfbde93b55824991a6800182cc3c75fa5a4
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove independent runtime boundary
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs
      - name: Build shadow and exact base
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml
      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193
      - name: Full differential
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/p3-rule-param-shadow-v1
          python - <<'PY'
          import json,pathlib,subprocess,os
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          rows=[]
          def rr(binary,p):
              try:
                  with p.open('rb') as f:
                      q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=180)
                  return q.returncode,q.stderr.decode(errors='replace')[-500:]
              except subprocess.TimeoutExpired:
                  return 124,'timeout'
          for kind,expected in [('good',0),('bad',1)]:
              for p in sorted((root/kind).rglob('*.ndjson')):
                  name=str(p.relative_to(root/kind)).removesuffix('.ndjson')
                  a,ae=rr(base,p); b,be=rr(cand,p)
                  rows.append({'test':name,'expected':expected,'base':a,'candidate':b,
                               'candidate_stderr':be if b not in (0,1,2,3) else ''})
          assert len(rows)==193
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]
          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          changes=[r for r in rows if r['base']!=r['candidate']]
          out={
            'schema':'nucleus-p3-rule-param-shadow-v1',
            'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
            'base_residual':sum(r['base'] in (2,3) for r in rows),
            'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
            'candidate_accept':sum(r['candidate']==0 for r in rows),
            'candidate_reject':sum(r['candidate']==1 for r in rows),
            'earned':earned,'wrong':wrong,'regressions':regressions,'errors':errors,
            'changes':changes,'rows':rows
          }
          pathlib.Path('metatron-kernel/evidence-out/p3-rule-param-shadow-v1/result.json').write_text(
            json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
            'base_residual':out['base_residual'],'candidate_residual':out['candidate_residual'],
            'earned':[x['test'] for x in earned],
            'wrong':[(x['test'],x['expected'],x['candidate']) for x in wrong],
            'regressions':[(x['test'],x['base'],x['candidate']) for x in regressions],
            'errors':[x['test'] for x in errors],
            'changes':[(x['test'],x['base'],x['candidate']) for x in changes],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-p3-rule-param-shadow-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/p3-rule-param-shadow-v1
          if-no-files-found: error
