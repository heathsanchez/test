name: Nucleus P4 plus G32 Integration v1

on:
  push:
    branches: [nucleus-p4-g32-integration-v1]
    paths:
      - ".github/workflows/nucleus-p4-g32-integration-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-p4-g32-integration-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
      G32_SHA: 92c45edef35ad33dbb11c03bfb922d4a4f92aa63
      P4_SHA: 55d4ecea29bd1ed6e85226076d5c09bfb6f0a291
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify integrated source
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          python -m unittest discover -s tests_py -p 'test_*.py' -v

      - name: Build G32 semantic oracle P4 baseline and candidate
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/g32 "$G32_SHA"
          git worktree add --detach /tmp/p4 "$P4_SHA"
          cargo build --release --locked --manifest-path /tmp/g32/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path /tmp/p4/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Build pinned Arena tutorial
        run: |
          set -euo pipefail
          git init /tmp/arena
          git -C /tmp/arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/arena checkout --detach FETCH_HEAD
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/tutorial
          cd /tmp/arena/tutorial
          lake clean
          OUT=/tmp/tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial

      - name: Exact G32 semantic parity
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/p4-g32
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/tutorial')
          oracle=pathlib.Path('/tmp/g32/metatron-kernel/target/release/metatron-kernel')
          p4=pathlib.Path('/tmp/p4/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]; p4_manifest=[]
          for expected_dir,expected in [('good',0),('bad',1)]:
              for p in sorted((root/expected_dir).glob('*.ndjson')):
                  try:n=int(p.name.split('_',1)[0])
                  except ValueError:continue
                  def run(binary):
                      with p.open('rb') as f:
                          return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  o,c,b=run(oracle),run(candidate),run(p4)
                  rows.append({'number':n,'path':f'{expected_dir}/{p.name}','expected':expected,'g32':o,'candidate':c,'p4':b})
                  if b==expected:
                      p4_manifest.append(f"{expected}\t{p}")
          rows.sort(key=lambda r:r['number'])
          diffs=[r for r in rows if r['g32']!=r['candidate']]
          assert not diffs,diffs
          correct=[r for r in rows if r['candidate']==r['expected']]
          residual=[r for r in rows if r['candidate']!=r['expected']]
          assert len(rows)==141,len(rows)
          assert len(correct)==85,len(correct)
          assert residual and residual[0]['number']==80,residual[:3]
          assert len(p4_manifest)==78,len(p4_manifest)
          pathlib.Path('/tmp/p4-correct78.tsv').write_text('\n'.join(p4_manifest)+'\n')
          out={'schema':'nucleus-p4-g32-semantic-parity-v1','arena_sha':os.environ['ARENA_SHA'],'g32_sha':os.environ['G32_SHA'],'p4_sha':os.environ['P4_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],'tutorial_count':len(rows),'semantic_diffs':diffs,'correct_count':len(correct),'residual_count':len(residual),'first_residual':residual[0]}
          pathlib.Path('evidence-out/p4-g32/semantic.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: P4 performance retention on frozen overlap
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          for root in . /tmp/p4/metatron-kernel; do mkdir -p "$root/examples"; done
          cat >/tmp/cohort.rs <<'RS'
          use std::{env,fs,io::Cursor};
          use metatron_kernel::run;
          fn main() {
              let manifest=env::var("NUCLEUS_MANIFEST").unwrap();
              let iters:usize=env::var("NUCLEUS_BENCH_ITERS").ok().and_then(|s|s.parse().ok()).unwrap_or(200);
              let cases:Vec<(i32,Vec<u8>)>=fs::read_to_string(manifest).unwrap().lines().map(|line|{
                  let (e,p)=line.split_once('\t').unwrap();
                  (e.parse().unwrap(),fs::read(p).unwrap())
              }).collect();
              let mut checksum=0usize;
              for _ in 0..iters {
                  for (expected,bytes) in &cases {
                      let v=run(Cursor::new(bytes.as_slice()));
                      assert_eq!(v.exit_code(),*expected);
                      checksum=checksum.wrapping_add(v.exit_code() as usize+1);
                  }
              }
              println!("{checksum}");
          }
          RS
          cp /tmp/cohort.rs examples/p4g32_perf.rs
          cp /tmp/cohort.rs /tmp/p4/metatron-kernel/examples/p4g32_perf.rs
          cargo build --release --locked --example p4g32_perf
          cargo build --release --locked --manifest-path /tmp/p4/metatron-kernel/Cargo.toml --example p4g32_perf
          python - <<'PY'
          import json,os,pathlib,statistics,subprocess,time
          bins={'p4':pathlib.Path('/tmp/p4/metatron-kernel/target/release/examples/p4g32_perf'),'candidate':pathlib.Path('target/release/examples/p4g32_perf').resolve()}
          env=dict(os.environ);env['NUCLEUS_MANIFEST']='/tmp/p4-correct78.tsv';env['NUCLEUS_BENCH_ITERS']='200'
          orders=[['p4','candidate'],['candidate','p4'],['p4','candidate'],['candidate','p4'],['p4','candidate'],['candidate','p4'],['p4','candidate']]
          rows=[]
          for i,order in enumerate(orders,1):
              vals={}
              for name in order:
                  t=time.perf_counter_ns();subprocess.check_output([str(bins[name])],env=env);vals[name]=time.perf_counter_ns()-t
              rows.append({'round':i,'p4_ns':vals['p4'],'candidate_ns':vals['candidate'],'candidate_over_p4':vals['candidate']/vals['p4']})
          med={k:statistics.median(r[f'{k}_ns'] for r in rows) for k in bins}
          ratio=med['candidate']/med['p4']
          out={'schema':'nucleus-p4-g32-performance-v1','cases':78,'iterations':200,'medians_ns':med,'candidate_over_p4':ratio,'paired_median_ratio':statistics.median(r['candidate_over_p4'] for r in rows),'rows':rows}
          pathlib.Path('evidence-out/p4-g32/performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          assert ratio <= 1.15, ratio
          PY

      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-p4-g32-${{ github.sha }}
          path: metatron-kernel/evidence-out/p4-g32
          if-no-files-found: warn
