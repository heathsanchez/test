name: Nucleus P4 plus G33 Integration v1

on:
  push:
    branches: [nucleus-p4-g33-integration-v1]
    paths:
      - ".github/workflows/nucleus-p4-g33-integration-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-p4-g33-integration-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
      G33_SHA: 9aab307f8c9de66de3c0a8927fbed1b5e1597a0e
      PARENT_SHA: c63d7369472a96d296a370b1f4cb842e70991cbe
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Verify integrated source
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          python -m unittest discover -s tests_py -p 'test_*.py' -v

      - name: Build G33 oracle parent and candidate
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/g33 "$G33_SHA"
          git worktree add --detach /tmp/parent "$PARENT_SHA"
          cargo build --release --locked --manifest-path /tmp/g33/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path /tmp/parent/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Build pinned Arena tutorial
        run: |
          set -euo pipefail
          git init /tmp/arena
          git -C /tmp/arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/arena checkout --detach FETCH_HEAD
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/tutorial
          cd /tmp/arena/tutorial
          lake clean
          OUT=/tmp/tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial

      - name: Exact G33 semantic parity
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/p4-g33
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/tutorial')
          oracle=pathlib.Path('/tmp/g33/metatron-kernel/target/release/metatron-kernel')
          parent=pathlib.Path('/tmp/parent/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]; manifest=[]
          for expected_dir,expected in [('good',0),('bad',1)]:
              for p in sorted((root/expected_dir).glob('*.ndjson')):
                  try:n=int(p.name.split('_',1)[0])
                  except ValueError:continue
                  def rr(binary):
                      with p.open('rb') as f:
                          return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  o,c,b=rr(oracle),rr(candidate),rr(parent)
                  rows.append({'number':n,'path':f'{expected_dir}/{p.name}','expected':expected,'g33':o,'candidate':c,'parent':b})
                  if b==expected:
                      manifest.append(f"{expected}\t{p}")
          rows.sort(key=lambda r:r['number'])
          diffs=[r for r in rows if r['g33']!=r['candidate']]
          assert not diffs,diffs
          correct=[r for r in rows if r['candidate']==r['expected']]
          residual=[r for r in rows if r['candidate']!=r['expected']]
          assert len(rows)==141
          assert len(correct)==86,len(correct)
          assert residual and residual[0]['number']==81,residual[:3]
          assert len(manifest)==85,len(manifest)
          pathlib.Path('/tmp/parent85.tsv').write_text('\n'.join(manifest)+'\n')
          out={'schema':'nucleus-p4-g33-semantic-parity-v1','arena_sha':os.environ['ARENA_SHA'],'g33_sha':os.environ['G33_SHA'],'parent_sha':os.environ['PARENT_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],'tutorial_count':len(rows),'semantic_diffs':diffs,'correct_count':len(correct),'residual_count':len(residual),'first_residual':residual[0]}
          pathlib.Path('evidence-out/p4-g33/semantic.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Parent performance retention
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          for root in . /tmp/parent/metatron-kernel; do mkdir -p "$root/examples"; done
          cat >/tmp/cohort.rs <<'RS'
          use std::{env,fs,io::Cursor};
          use metatron_kernel::run;
          fn main() {
              let manifest=env::var("NUCLEUS_MANIFEST").unwrap();
              let iters:usize=env::var("NUCLEUS_BENCH_ITERS").ok().and_then(|s|s.parse().ok()).unwrap_or(200);
              let cases:Vec<(i32,Vec<u8>)>=fs::read_to_string(manifest).unwrap().lines().map(|line|{
                  let (e,p)=line.split_once('\t').unwrap();
                  (e.parse().unwrap(),fs::read(p).unwrap())
              }).collect();
              let mut checksum=0usize;
              for _ in 0..iters {
                  for (expected,bytes) in &cases {
                      let v=run(Cursor::new(bytes.as_slice()));
                      assert_eq!(v.exit_code(),*expected);
                      checksum=checksum.wrapping_add(v.exit_code() as usize+1);
                  }
              }
              println!("{checksum}");
          }
          RS
          cp /tmp/cohort.rs examples/p4g33_perf.rs
          cp /tmp/cohort.rs /tmp/parent/metatron-kernel/examples/p4g33_perf.rs
          cargo build --release --locked --example p4g33_perf
          cargo build --release --locked --manifest-path /tmp/parent/metatron-kernel/Cargo.toml --example p4g33_perf
          python - <<'PY'
          import json,os,pathlib,statistics,subprocess,time
          bins={'parent':pathlib.Path('/tmp/parent/metatron-kernel/target/release/examples/p4g33_perf'),'candidate':pathlib.Path('target/release/examples/p4g33_perf').resolve()}
          env=dict(os.environ);env['NUCLEUS_MANIFEST']='/tmp/parent85.tsv';env['NUCLEUS_BENCH_ITERS']='200'
          orders=[['parent','candidate'],['candidate','parent'],['parent','candidate'],['candidate','parent'],['parent','candidate'],['candidate','parent'],['parent','candidate']]
          rows=[]
          for i,order in enumerate(orders,1):
              vals={}
              for name in order:
                  t=time.perf_counter_ns();subprocess.check_output([str(bins[name])],env=env);vals[name]=time.perf_counter_ns()-t
              rows.append({'round':i,'parent_ns':vals['parent'],'candidate_ns':vals['candidate'],'candidate_over_parent':vals['candidate']/vals['parent']})
          med={k:statistics.median(r[f'{k}_ns'] for r in rows) for k in bins}
          ratio=med['candidate']/med['parent']
          out={'schema':'nucleus-p4-g33-performance-v1','cases':85,'iterations':200,'medians_ns':med,'candidate_over_parent':ratio,'paired_median_ratio':statistics.median(r['candidate_over_parent'] for r in rows),'rows':rows}
          pathlib.Path('evidence-out/p4-g33/performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          assert ratio <= 1.15,ratio
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-p4-g33-${{ github.sha }}
          path: metatron-kernel/evidence-out/p4-g33
          if-no-files-found: warn
