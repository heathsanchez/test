name: Nucleus P7 plus G32 Integration v1

on:
  push:
    branches: [nucleus-p7-g32-integration-v1]
    paths:
      - ".github/workflows/nucleus-p7-g32-integration-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
      G32_SHA: 92c45edef35ad33dbb11c03bfb922d4a4f92aa63
      BASE_SHA: c63d7369472a96d296a370b1f4cb842e70991cbe
      P4_SHA: 55d4ecea29bd1ed6e85226076d5c09bfb6f0a291
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Verify integrated source
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          python -m unittest discover -s tests_py -p 'test_*.py' -v

      - name: Build semantic oracle baselines and candidate
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/g32 "$G32_SHA"
          git worktree add --detach /tmp/base "$BASE_SHA"
          git worktree add --detach /tmp/p4 "$P4_SHA"
          for root in /tmp/g32 /tmp/base /tmp/p4; do
            cargo build --release --locked --manifest-path "$root/metatron-kernel/Cargo.toml"
          done
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Build pinned Arena tutorial
        run: |
          set -euo pipefail
          git init /tmp/arena
          git -C /tmp/arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/arena checkout --detach FETCH_HEAD
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/tutorial
          cd /tmp/arena/tutorial
          lake clean
          OUT=/tmp/tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial

      - name: Exact G32 semantic parity
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/p7-g32
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/tutorial')
          oracle=pathlib.Path('/tmp/g32/metatron-kernel/target/release/metatron-kernel')
          candidate=pathlib.Path('target/release/metatron-kernel').resolve()
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          p4=pathlib.Path('/tmp/p4/metatron-kernel/target/release/metatron-kernel')
          rows=[]; base_manifest=[]
          for d,e in [('good',0),('bad',1)]:
              for p in sorted((root/d).glob('*.ndjson')):
                  try:n=int(p.name.split('_',1)[0])
                  except ValueError:continue
                  def run(b):
                      with p.open('rb') as f:return subprocess.run([str(b)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  o,c,b,p4r=run(oracle),run(candidate),run(base),run(p4)
                  rows.append({'number':n,'path':f'{d}/{p.name}','expected':e,'g32':o,'candidate':c,'base':b,'p4':p4r})
                  if b==e:base_manifest.append(f'{e}\t{p}')
          rows.sort(key=lambda r:r['number'])
          diffs=[r for r in rows if r['g32']!=r['candidate']]
          assert not diffs,diffs
          correct=[r for r in rows if r['candidate']==r['expected']]
          residual=[r for r in rows if r['candidate']!=r['expected']]
          assert len(correct)==85,len(correct)
          assert len(base_manifest)==85,len(base_manifest)
          pathlib.Path('/tmp/base-correct85.tsv').write_text('\n'.join(base_manifest)+'\n')
          out={'schema':'nucleus-p7-g32-semantic-v1','arena_sha':os.environ['ARENA_SHA'],'g32_sha':os.environ['G32_SHA'],'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],'tutorial_count':len(rows),'semantic_diffs':diffs,'correct_count':len(correct),'residual_count':len(residual),'first_residual':residual[0]}
          pathlib.Path('evidence-out/p7-g32/semantic.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: P7 performance transfer on G32 cohort
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          for root in . /tmp/base/metatron-kernel /tmp/p4/metatron-kernel; do mkdir -p "$root/examples"; done
          cat >/tmp/cohort.rs <<'RS'
          use std::{env,fs,io::Cursor};use metatron_kernel::run;
          fn main(){let m=env::var("NUCLEUS_MANIFEST").unwrap();let n:usize=env::var("NUCLEUS_BENCH_ITERS").unwrap().parse().unwrap();let cs:Vec<(i32,Vec<u8>)>=fs::read_to_string(m).unwrap().lines().map(|l|{let(e,p)=l.split_once('\t').unwrap();(e.parse().unwrap(),fs::read(p).unwrap())}).collect();let mut s=0usize;for _ in 0..n{for(e,b)in &cs{let v=run(Cursor::new(b.as_slice()));assert_eq!(v.exit_code(),*e);s=s.wrapping_add(v.exit_code() as usize+1)}}println!("{s}");}
          RS
          cp /tmp/cohort.rs examples/p7g32_perf.rs
          cp /tmp/cohort.rs /tmp/base/metatron-kernel/examples/p7g32_perf.rs
          cp /tmp/cohort.rs /tmp/p4/metatron-kernel/examples/p7g32_perf.rs
          cargo build --release --locked --example p7g32_perf
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml --example p7g32_perf
          cargo build --release --locked --manifest-path /tmp/p4/metatron-kernel/Cargo.toml --example p7g32_perf
          python - <<'PY'
          import json,os,pathlib,statistics,subprocess,time
          bins={'base':pathlib.Path('/tmp/base/metatron-kernel/target/release/examples/p7g32_perf'),'candidate':pathlib.Path('target/release/examples/p7g32_perf').resolve(),'p4':pathlib.Path('/tmp/p4/metatron-kernel/target/release/examples/p7g32_perf')}
          env=dict(os.environ);env['NUCLEUS_MANIFEST']='/tmp/base-correct85.tsv';env['NUCLEUS_BENCH_ITERS']='250'
          orders=[['base','candidate','p4'],['candidate','p4','base'],['p4','base','candidate'],['candidate','base','p4'],['base','p4','candidate'],['p4','candidate','base'],['base','candidate','p4']]
          rows=[]
          for i,o in enumerate(orders,1):
              vals={}
              for k in o:
                  t=time.perf_counter_ns();subprocess.check_output([str(bins[k])],env=env);vals[k]=time.perf_counter_ns()-t
              rows.append({'round':i,**{f'{k}_ns':v for k,v in vals.items()},'candidate_over_base':vals['candidate']/vals['base'],'candidate_over_p4':vals['candidate']/vals['p4']})
          med={k:statistics.median(r[f'{k}_ns'] for r in rows) for k in bins}
          out={'schema':'nucleus-p7-g32-performance-v1','cases':85,'iterations':250,'medians_ns':med,'candidate_over_base':med['candidate']/med['base'],'candidate_over_p4':med['candidate']/med['p4'],'paired_median_base_ratio':statistics.median(r['candidate_over_base'] for r in rows),'rows':rows}
          pathlib.Path('evidence-out/p7-g32/performance.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-p7-g32-${{ github.sha }}
          path: metatron-kernel/evidence-out/p7-g32
          if-no-files-found: error
