name: Nucleus P7 ID Hasher v1

on:
  push:
    branches: [nucleus-p7-id-hasher-v1]
    paths:
      - ".github/workflows/nucleus-p7-id-hasher-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-p7-id-hasher-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ARENA_SHA: f5e1bce6e2dc9c60479b3001b76e01722b403799
      P4_SHA: 55d4ecea29bd1ed6e85226076d5c09bfb6f0a291
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Verify source
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          python -m unittest discover -s tests_py -p 'test_*.py' -v
          python scripts/check_ledger.py

      - name: Build exact P4 and P7
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/p4 "$P4_SHA"
          cargo build --release --locked --manifest-path /tmp/p4/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Build pinned tutorial
        run: |
          set -euo pipefail
          git init /tmp/arena
          git -C /tmp/arena remote add origin https://github.com/leanprover/lean-kernel-arena.git
          git -C /tmp/arena fetch --depth 1 origin "$ARENA_SHA"
          git -C /tmp/arena checkout --detach FETCH_HEAD
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/tutorial
          cd /tmp/arena/tutorial
          lake clean
          OUT=/tmp/tutorial LEAN_ABORT_ON_PANIC=1 lake build Tutorial

      - name: Exact semantic parity
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/p7
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/tutorial');p4=pathlib.Path('/tmp/p4/metatron-kernel/target/release/metatron-kernel');cand=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[];manifest=[]
          for d,e in [('good',0),('bad',1)]:
            for p in sorted((root/d).glob('*.ndjson')):
              try:n=int(p.name.split('_',1)[0])
              except ValueError:continue
              def run(b):
                with p.open('rb') as f:return subprocess.run([str(b)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
              a,b=run(p4),run(cand);rows.append({'number':n,'path':str(p),'expected':e,'p4':a,'candidate':b})
              if a==e:manifest.append(f'{e}\t{p}')
          rows.sort(key=lambda r:r['number']);diffs=[r for r in rows if r['p4']!=r['candidate']];assert not diffs,diffs;assert len(manifest)==78,len(manifest)
          pathlib.Path('/tmp/correct78.tsv').write_text('\n'.join(manifest)+'\n')
          paths=sorted(pathlib.Path('tests/fixtures').glob('*.ndjson'))+sorted(pathlib.Path('evidence/residuals').glob('**/*.ndjson'));seen=set();cdiffs=[];count=0
          for p in paths:
            rp=str(p)
            if rp in seen:continue
            seen.add(rp);count+=1
            def rr(b):
              with p.open('rb') as f:return subprocess.run([str(b)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
            a,b=rr(p4),rr(cand)
            if a!=b:cdiffs.append({'path':rp,'p4':a,'candidate':b})
          assert not cdiffs,cdiffs
          out={'schema':'nucleus-p7-semantic-v1','candidate_sha':os.environ['GITHUB_SHA'],'tutorial_count':len(rows),'tutorial_diffs':diffs,'committed_count':count,'committed_diffs':cdiffs,'correct_cohort':78}
          pathlib.Path('evidence-out/p7/semantic.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps(out,sort_keys=True))
          PY

      - name: End-to-end in-process cohort
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          for root in . /tmp/p4/metatron-kernel; do mkdir -p "$root/examples"; done
          cat >/tmp/cohort.rs <<'RS'
          use std::{env,fs,io::Cursor};use metatron_kernel::run;
          fn main(){let m=env::var("NUCLEUS_MANIFEST").unwrap();let n:usize=env::var("NUCLEUS_BENCH_ITERS").unwrap().parse().unwrap();let cs:Vec<(i32,Vec<u8>)>=fs::read_to_string(m).unwrap().lines().map(|l|{let(e,p)=l.split_once('\t').unwrap();(e.parse().unwrap(),fs::read(p).unwrap())}).collect();let mut s=0usize;for _ in 0..n{for(e,b)in &cs{let v=run(Cursor::new(b.as_slice()));assert_eq!(v.exit_code(),*e);s=s.wrapping_add(v.exit_code() as usize+1)}}println!("{s}");}
          RS
          cp /tmp/cohort.rs examples/p7_cohort.rs
          cp /tmp/cohort.rs /tmp/p4/metatron-kernel/examples/p7_cohort.rs
          cargo build --release --locked --example p7_cohort
          cargo build --release --locked --manifest-path /tmp/p4/metatron-kernel/Cargo.toml --example p7_cohort
          python - <<'PY'
          import json,os,pathlib,statistics,subprocess,time
          bins={'p4':pathlib.Path('/tmp/p4/metatron-kernel/target/release/examples/p7_cohort'),'p7':pathlib.Path('target/release/examples/p7_cohort').resolve()}
          env=dict(os.environ);env['NUCLEUS_MANIFEST']='/tmp/correct78.tsv';env['NUCLEUS_BENCH_ITERS']='300';orders=[['p4','p7'],['p7','p4'],['p4','p7'],['p7','p4'],['p4','p7'],['p7','p4'],['p4','p7']];rows=[]
          for i,o in enumerate(orders,1):
            vals={}
            for k in o:t=time.perf_counter_ns();subprocess.check_output([str(bins[k])],env=env);vals[k]=time.perf_counter_ns()-t
            rows.append({'round':i,**{f'{k}_ns':v for k,v in vals.items()},'p7_over_p4':vals['p7']/vals['p4']})
          med={k:statistics.median(r[f'{k}_ns'] for r in rows) for k in bins};out={'schema':'nucleus-p7-cohort-v1','cases':78,'iterations':300,'medians_ns':med,'p7_over_p4':med['p7']/med['p4'],'paired_median_ratio':statistics.median(r['p7_over_p4'] for r in rows),'rows':rows}
          pathlib.Path('evidence-out/p7/cohort.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps(out,sort_keys=True))
          PY

      - name: Parse and resolve only benchmark
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cat >/tmp/parse.rs <<'RS'
          use std::{env,fs,io::Cursor};use metatron_kernel::parser::parse;
          fn main(){let m=env::var("NUCLEUS_MANIFEST").unwrap();let n:usize=env::var("NUCLEUS_BENCH_ITERS").unwrap().parse().unwrap();let cs:Vec<Vec<u8>>=fs::read_to_string(m).unwrap().lines().map(|l|{let(_,p)=l.split_once('\t').unwrap();fs::read(p).unwrap()}).collect();let mut s=0usize;for _ in 0..n{for b in &cs{let e=parse(Cursor::new(b.as_slice())).unwrap().resolve().unwrap();s=s.wrapping_add(e.exprs.len()+e.levels.len()+e.names.len())}}println!("{s}");}
          RS
          cp /tmp/parse.rs examples/p7_parse.rs
          cp /tmp/parse.rs /tmp/p4/metatron-kernel/examples/p7_parse.rs
          cargo build --release --locked --example p7_parse
          cargo build --release --locked --manifest-path /tmp/p4/metatron-kernel/Cargo.toml --example p7_parse
          python - <<'PY'
          import json,os,pathlib,statistics,subprocess,time
          bins={'p4':pathlib.Path('/tmp/p4/metatron-kernel/target/release/examples/p7_parse'),'p7':pathlib.Path('target/release/examples/p7_parse').resolve()};env=dict(os.environ);env['NUCLEUS_MANIFEST']='/tmp/correct78.tsv';env['NUCLEUS_BENCH_ITERS']='500';orders=[['p4','p7'],['p7','p4'],['p4','p7'],['p7','p4'],['p4','p7'],['p7','p4'],['p4','p7']];rows=[]
          for i,o in enumerate(orders,1):
            vals={}
            for k in o:t=time.perf_counter_ns();subprocess.check_output([str(bins[k])],env=env);vals[k]=time.perf_counter_ns()-t
            rows.append({'round':i,**{f'{k}_ns':v for k,v in vals.items()},'p7_over_p4':vals['p7']/vals['p4']})
          med={k:statistics.median(r[f'{k}_ns'] for r in rows) for k in bins};out={'schema':'nucleus-p7-parse-v1','cases':78,'iterations':500,'medians_ns':med,'p7_over_p4':med['p7']/med['p4'],'paired_median_ratio':statistics.median(r['p7_over_p4'] for r in rows),'rows':rows}
          pathlib.Path('evidence-out/p7/parse.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps(out,sort_keys=True))
          PY

      - name: Upload P7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-p7-id-hasher-${{ github.sha }}
          path: metatron-kernel/evidence-out/p7
          if-no-files-found: error
