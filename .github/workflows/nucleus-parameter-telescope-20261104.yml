name: Nucleus dependent parameter record qualification
on:
  push:
    branches: [research/nucleus-reuse-tournaments-20261104]
    paths: ['.github/workflows/nucleus-parameter-telescope-20261104.yml', 'experiments/nucleus-parameter-telescope-20261104/**']
  workflow_dispatch:
concurrency:
  group: nucleus-parameter-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact original and forged Nat source controls
        run: python3 experiments/nucleus-nat-closure-20261104/generate_fixtures.py --out /tmp/nat-fixtures
      - name: Prepare exact record prefix and structural controls
        run: python3 experiments/nucleus-parameter-telescope-20261104/prepare.py
      - name: Build independent pinned Lean kernel reference
        run: |
          set -euo pipefail
          mkdir -p /tmp/nat-reference
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git init -q /tmp/arena-reference
          git -C /tmp/arena-reference remote add origin https://github.com/leanprover/lean-kernel-arena
          git -C /tmp/arena-reference fetch -q --depth=1 origin cd2dd0244b9ed5e704463a26fbbe5fc67ba16108
          git -C /tmp/arena-reference checkout -q --detach FETCH_HEAD
          git -C /tmp/arena-reference rev-parse HEAD > /tmp/nat-reference/source-commit.txt
          cd /tmp/arena-reference/checkers/official
          "$HOME/.elan/bin/lean" --version > /tmp/nat-reference/version.txt
          "$HOME/.elan/bin/lake" build > /tmp/nat-reference/build.log 2>&1
      - name: Independent parse and original proof checking
        run: |
          cp /tmp/record-fixtures/manifest.json /tmp/nat-reference/inputs.json
          python3 experiments/nucleus-parameter-telescope-20261104/reference.py --checker /tmp/arena-reference/checkers/official/.lake/build/bin/kernel --fixtures /tmp/record-fixtures --out /tmp/nat-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-parameter-reference-${{ github.sha }}
          path: /tmp/nat-reference
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Fetch only the exact reusable base object
        run: git fetch --no-tags --depth=1 origin a2578e77079719ff2064f910bd82fd01d8e120b6
      - name: Generate exact original and forged Nat source controls
        run: python3 experiments/nucleus-nat-closure-20261104/generate_fixtures.py --out /tmp/nat-fixtures
      - name: Prepare exact record prefix and structural controls
        run: python3 experiments/nucleus-parameter-telescope-20261104/prepare.py
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Preserve reusable exact source snapshot
        run: git archive a2578e77079719ff2064f910bd82fd01d8e120b6 metatron-kernel | zstd -T0 -3 -o /tmp/nucleus-source-a2578e7.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-source-a2578e7
          path: /tmp/nucleus-source-a2578e7.tar.zst
          compression-level: 0
      - name: Restore exact corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/current208
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/inputs.zip
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/inputs.zip | sha256sum -c -
          unzip -q /tmp/inputs.zip -d /tmp/current208
      - name: Native, source-prefix, property and exact corpus qualification
        run: python3 experiments/nucleus-parameter-telescope-20261104/runner.py qualify --out /tmp/repair-qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-parameter-qualification-${{ github.sha }}
          path: |
            /tmp/repair-qualification/*.json
            /tmp/repair-qualification/*/*.json
            /tmp/repair-qualification/*/*.log
            /tmp/repair-qualification/*/source.patch
            /tmp/repair-qualification/*/nucleus
  mathlib:
    needs: [reference, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Fetch only the exact reusable base object
        run: git fetch --no-tags --depth=1 origin a2578e77079719ff2064f910bd82fd01d8e120b6
      - name: Generate exact original and forged Nat source controls
        run: python3 experiments/nucleus-nat-closure-20261104/generate_fixtures.py --out /tmp/nat-fixtures
      - name: Prepare exact record prefix and structural controls
        run: python3 experiments/nucleus-parameter-telescope-20261104/prepare.py
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Reuse the exact complete Mathlib input
        run: |
          set -euo pipefail
          mkdir -p /tmp/input
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/input.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/input.zip | sha256sum -c -
          unzip -q /tmp/input.zip -d /tmp/input
          zstd -d /tmp/input/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib.ndjson | sha256sum -c -
          rm /tmp/input.zip /tmp/input/mathlib.ndjson.zst
      - name: Complete independent Mathlib check and retain any next frontier
        run: python3 experiments/nucleus-parameter-telescope-20261104/runner.py full --out /tmp/repair-mathlib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-parameter-mathlib-${{ github.sha }}
          path: |
            /tmp/repair-mathlib/*.json
            /tmp/repair-mathlib/*.zst
            /tmp/repair-mathlib/full-input
            /tmp/repair-mathlib/candidate/build.log
            /tmp/repair-mathlib/candidate/source.patch
