name: Nucleus source-pinned parser resolve checker phase profile
on:
  push:
    branches: [research/nucleus-phase-profile-20261104]
    paths: ['.github/workflows/nucleus-phase-profile-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-phases:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore source-pinned exact failure-ending prefix and entire Mathlib
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-phase
          gh api repos/heathsanchez/test/actions/artifacts/13248500779/zip > /tmp/nucleus-phase/qualified.zip
          printf '%s  %s\n' decd3ad80437eb5b47a7b66effb2594a9b6dd69cca8ff3360226bc3aa95a6b89 /tmp/nucleus-phase/qualified.zip | sha256sum -c -
          unzip -p /tmp/nucleus-phase/qualified.zip next-frontier.ndjson.zst | zstd -dc -o /tmp/nucleus-phase/prefix.ndjson
          printf '%s  %s\n' 7767e7f90b3e24b30ecb5324f1117d6858b5f40653b31011ad1948eed747e8ea /tmp/nucleus-phase/prefix.ndjson | sha256sum -c -
          mkdir -p /tmp/nucleus-phase/full-source
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/nucleus-phase/full.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/nucleus-phase/full.zip | sha256sum -c -
          unzip -q /tmp/nucleus-phase/full.zip -d /tmp/nucleus-phase/full-source
          zstd -d /tmp/nucleus-phase/full-source/mathlib.ndjson.zst -o /tmp/nucleus-phase/full.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/nucleus-phase/full.ndjson | sha256sum -c -
          rm /tmp/nucleus-phase/full.zip /tmp/nucleus-phase/full-source/mathlib.ndjson.zst
      - name: Compile identical semantic rules with observation-only three-phase clocks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('experiments/nucleus-final-proof-spine-20261104').resolve()))
          import runner
          sys.path.insert(0,str(Path('experiments/nucleus-quotient-reuse-20261104').resolve()))
          from port import port
          out=Path('/tmp/nucleus-phase/candidate');out.mkdir(exist_ok=True)
          kernel=runner.materialize(out,semantic=True)
          port(Path.cwd(),kernel,out/'quotient-port.patch',include_exact=False)
          source=kernel/'src/lib.rs'
          original=source.read_text()
          start=original.index('/// Check one Arena export stream.\n')
          end=original.index('/// Run with deterministic operation counters.',start)
          updated='''/// Check one Arena export stream; optional timing only observes phases.
          pub fn run<R: BufRead>(reader: R) -> Verdict {
              let start = std::time::Instant::now();
              let parsed = parse(reader);
              let parse_done = start.elapsed();
              let resolved = parsed.and_then(|export| export.resolve());
              let resolve_done = start.elapsed();
              let verdict = match resolved {
                  Ok(export) => check_export(export, Limits::default()),
                  Err(error) => {
                      if std::env::var_os("NUCLEUS_TRACE_PARSE_ERROR").is_some() {
                          eprintln!("NUCLEUS_PARSE_ERROR: {error}");
                      }
                      Verdict::Error
                  }
              };
              let check_done = start.elapsed();
              if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() {
                  eprintln!("NUCLEUS_PHASES:parse_ms={:.3}:resolve_ms={:.3}:check_ms={:.3}:total_ms={:.3}",
                      parse_done.as_secs_f64()*1000.0,
                      (resolve_done-parse_done).as_secs_f64()*1000.0,
                      (check_done-resolve_done).as_secs_f64()*1000.0,
                      check_done.as_secs_f64()*1000.0);
              }
              verdict
          }

          '''
          changed=original[:start]+updated+original[end:]
          source.write_text(changed)
          (out/'phases.patch').write_text(''.join(difflib.unified_diff(original.splitlines(True),changed.splitlines(True),fromfile='a/metatron-kernel/src/lib.rs',tofile='b/metatron-kernel/src/lib.rs')))
          checker_source=kernel/'src/checker.rs'
          checker_original=checker_source.read_text()
          checker_changed=checker_original
          def replace_exact(old,new):
              global checker_changed
              assert checker_changed.count(old)==1,(old,checker_changed.count(old))
              checker_changed=checker_changed.replace(old,new,1)
          replace_exact('pub fn check_export(export: ResolvedExport, limits: Limits) -> Verdict {\n',
              'pub fn check_export(export: ResolvedExport, limits: Limits) -> Verdict {\n    let check_start=std::time::Instant::now();\n')
          replace_exact('    let verdict = check_export_with_policy(export, limits, DeltaPolicy::GuardedSemanticFallback);\n',
              '    let string_prelude=check_start.elapsed();\n    let verdict = check_export_with_policy(export, limits, DeltaPolicy::GuardedSemanticFallback);\n    if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() { eprintln!("NUCLEUS_CHECK_DETAIL:string_prelude_ms={:.3}:policy_ms={:.3}", string_prelude.as_secs_f64()*1000.0,(check_start.elapsed()-string_prelude).as_secs_f64()*1000.0); }\n')
          replace_exact(') -> Verdict {\n    if !quotient_source_ownership_is_well_ordered(&export) {',
              ') -> Verdict {\n    let preflight_start=std::time::Instant::now();\n    if !quotient_source_ownership_is_well_ordered(&export) {')
          replace_exact('    let mut environment = Environment::empty();\n\n    // Preserve the immutable source catalogue',
              '    if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() { eprintln!("NUCLEUS_CHECK_DETAIL:global_preflight_ms={:.3}",preflight_start.elapsed().as_secs_f64()*1000.0); }\n    let mut environment = Environment::empty();\n\n    // Preserve the immutable source catalogue')
          replace_exact('    let preflight_start=std::time::Instant::now();\n    if !quotient_source_ownership_is_well_ordered(&export) {',
              '    let preflight_start=std::time::Instant::now();\n    let mut stage_start=std::time::Instant::now();\n    if !quotient_source_ownership_is_well_ordered(&export) {')
          def stage(label,anchor):
              stamp='    if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() { eprintln!("NUCLEUS_PREFLIGHT_STAGE:stage='+label+':elapsed_ms={:.3}",stage_start.elapsed().as_secs_f64()*1000.0); }\n    stage_start=std::time::Instant::now();\n'
              replace_exact(anchor,stamp+anchor)
          stage('quotient_source_ownership','    if let Some(verdict) = crate::capability::execute(&export) {')
          stage('capability','    if let Some((owner, recursor, constructor)) = export.declarations.iter().find_map(|declaration| {')
          stage('external_recursor_constructor','    if export.declarations.iter().any(|declaration| {\n        matches!(declaration, Declaration::Inductive(block)\n            if recursor_rule_drops_required_minor_argument(&export, block))')
          stage('required_minor','    if export.declarations.iter().any(|declaration| {\n        matches!(declaration, Declaration::Inductive(block)\n            if proof_dependent_result_sort_is_definitely_malformed(&export, block))')
          stage('proof_dependent_sort','    // Universe parameters belong to the individual imported signature.')
          stage('unbound_universe','    if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() { eprintln!("NUCLEUS_CHECK_DETAIL:global_preflight_ms={:.3}",preflight_start.elapsed().as_secs_f64()*1000.0); }')
          checker_source.write_text(checker_changed)
          (out/'check-phases.patch').write_text(''.join(difflib.unified_diff(checker_original.splitlines(True),checker_changed.splitlines(True),fromfile='a/metatron-kernel/src/checker.rs',tofile='b/metatron-kernel/src/checker.rs')))
          capability_source=kernel/'src/capability.rs'
          capability_original=capability_source.read_text()
          capability_old='    for capability in CAPABILITIES {\n        if let Some(verdict) = (capability.apply)(export) {\n'
          capability_new='    for capability in CAPABILITIES {\n        let stage_start=std::time::Instant::now();\n        let decision=(capability.apply)(export);\n        if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() { eprintln!("NUCLEUS_CAPABILITY_STAGE:id={}:elapsed_ms={:.3}",capability.id,stage_start.elapsed().as_secs_f64()*1000.0); }\n        if let Some(verdict) = decision {\n'
          assert capability_original.count(capability_old)==1
          capability_changed=capability_original.replace(capability_old,capability_new,1)
          def capability_replace(old,new):
              global capability_changed
              assert capability_changed.count(old)==1,(old[:90],capability_changed.count(old))
              capability_changed=capability_changed.replace(old,new,1)
          capability_replace('fn prop_projection_safety(export: &ResolvedExport) -> Option<Verdict> {',
              'fn prop_projection_safety(export: &ResolvedExport) -> Option<Verdict> {\n    let prop_start=std::time::Instant::now();')
          capability_replace('    if projection_types.is_empty() {\n        return None;\n    }',
              '    if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() {eprintln!("NUCLEUS_PROP_STAGE:phase=projection_scan:ms={:.3}",prop_start.elapsed().as_secs_f64()*1000.0);}\n    let target_start=std::time::Instant::now();\n    if projection_types.is_empty() {\n        return None;\n    }')
          capability_replace('    if target_names.is_empty() {\n        return None;\n    }',
              '    if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() {eprintln!("NUCLEUS_PROP_STAGE:phase=target_discovery:ms={:.3}",target_start.elapsed().as_secs_f64()*1000.0);}\n    let traverse_start=std::time::Instant::now();\n    if target_names.is_empty() {\n        return None;\n    }')
          capability_replace('    None\n}\n\nfn expression_may_contain_target_projection(',
              '    if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() {eprintln!("NUCLEUS_PROP_STAGE:phase=recursive_traversal:ms={:.3}",traverse_start.elapsed().as_secs_f64()*1000.0);}\n    None\n}\n\nfn expression_may_contain_target_projection(')
          capability_source.write_text(capability_changed)
          (out/'capability-phases.patch').write_text(''.join(difflib.unified_diff(capability_original.splitlines(True),capability_changed.splitlines(True),fromfile='a/metatron-kernel/src/capability.rs',tofile='b/metatron-kernel/src/capability.rs')))
          sys.path.insert(0,str(Path('experiments/nucleus-reuse-20261104').resolve()))
          import tournament
          binary,_=tournament.build(kernel,out)
          assert binary is not None,(out/'build.log').read_text()[-6000:]
          PY
          sha256sum /tmp/nucleus-phase/candidate/{source.patch,quotient-port.patch,phases.patch,check-phases.patch,capability-phases.patch,nucleus} > /tmp/nucleus-phase/provenance.sha256
      - name: Verify exact same first obstruction and capture parse resolve check times
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,sys
          from pathlib import Path
          root=Path('/tmp/nucleus-phase')
          sys.path.insert(0,str(Path('experiments/nucleus-reuse-20261104').resolve()))
          import tournament as t
          env=t.run_env()
          for flag in ('CERTIFIED_QUOT_IOTA','SOURCE_PROOF_IRREL'):
              env['NUCLEUS_EXPERIMENTAL_'+flag]='1'
          env['NUCLEUS_TRACE_DOWNSTREAM']='1'
          env['NUCLEUS_TRACE_PHASES']='1'
          rows={}
          for kind in ('prefix','full'):
              path=root/kind
              metrics=t.measure(root/'candidate/nucleus',root/f'{kind}.ndjson',env,path,timeout=600,perf=False)
              log=(path/'stderr').read_text()
              boundary=[line for line in log.splitlines() if line.startswith('NUCLEUS_DOWNSTREAM:')][-1]
              phases=[line for line in log.splitlines() if line.startswith('NUCLEUS_PHASES:')]
              assert len(phases)==1 and metrics['rc']==2
              assert '_private.Init.Data.Nat.Lemmas.0.Nat.right_eq_add._proof_1_1' in boundary
              steps={name:float(value) for name,value in re.findall(r'(parse_ms|resolve_ms|check_ms|total_ms)=([\d.]+)',phases[0])}
              detail={name:float(value) for name,value in re.findall(r'(string_prelude_ms|policy_ms|global_preflight_ms)=([\d.]+)',log)}
              assert set(detail)=={'string_prelude_ms','policy_ms','global_preflight_ms'},detail
              stages={name:float(value) for name,value in re.findall(r'NUCLEUS_PREFLIGHT_STAGE:stage=([a-z_]+):elapsed_ms=([\d.]+)',log)}
              assert len(stages)==6,stages
              capability_stages={name:float(value) for name,value in re.findall(r'NUCLEUS_CAPABILITY_STAGE:id=([^:\s]+):elapsed_ms=([\d.]+)',log)}
              assert len(capability_stages)==6,capability_stages
              prop_stages={name:float(value) for name,value in re.findall(r'NUCLEUS_PROP_STAGE:phase=([^:\s]+):ms=([\d.]+)',log)}
              assert 'projection_scan' in prop_stages,prop_stages
              rows[kind]=dict(measured=metrics,phases=steps,check_detail=detail,preflight_stages=stages,capability_stages=capability_stages,prop_stages=prop_stages,boundary=boundary)
              print('PHASE_PROFILE',kind,json.dumps(rows[kind]),flush=True)
          summary=dict(source_binary_sha=t.digest(root/'candidate/nucleus'),rows=rows,
                       semantic_note='No proof rule changed, full Mathlib remains UNKNOWN')
          (root/'phase-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-phase-profile-${{ github.sha }}
          path: |
            /tmp/nucleus-phase/phase-summary.json
            /tmp/nucleus-phase/provenance.sha256
            /tmp/nucleus-phase/candidate/*.patch
            /tmp/nucleus-phase/candidate/build.log
            /tmp/nucleus-phase/prefix/stderr
            /tmp/nucleus-phase/prefix/time.txt
            /tmp/nucleus-phase/full/stderr
            /tmp/nucleus-phase/full/time.txt
