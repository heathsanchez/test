name: Nucleus exact prefix native qualification
on:
  push:
    branches: [research/nucleus-obligation-census-20261107]
    paths: ['.github/workflows/nucleus-prefix-weakening-20261107.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Full native controls and canonical original replay
        run: python experiments/nucleus-capture-substitution-20261107/qualify-prefix-weakening.py > driver.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-prefix-weakening-CANDIDATE
          retention-days: 60
          path: |
            reports/
            candidate/
            driver.log
