name: Nucleus pre-WHNF proof relation v1

on:
  push:
    branches: [nucleus-prewhnf-proof-relation-v1]
    paths:
      - ".github/workflows/nucleus-prewhnf-proof-relation-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      ARENA_ARTIFACT: "11272848230"
      ARENA_PR261_HEAD: 8a0674357fbae0fd1960c17eafc23555949acfb9
      ARENA_PR261_ARTIFACT: "11440969096"
      LEAN_PR15103_HEAD: 952534325580eb2eab4bc46c62a0d7db512c5db6
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build and run candidate unit boundary
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo test --release --locked --test prewhnf_proof_refute -- --nocapture
          cargo test --release --locked
          cargo build --release --locked
          cp target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus

      - name: Fetch protected Arena 196 corpus and PR261 candidate witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests /tmp/pr261-artifact /tmp/pr261-tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
          test "$(find /tmp/arena-tests -type f -name '*.ndjson' | wc -l)" -eq 196

          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_PR261_ARTIFACT/zip" > /tmp/pr261.zip
          unzip -q /tmp/pr261.zip -d /tmp/pr261-artifact
          tar --no-same-owner -xzf /tmp/pr261-artifact/lean-arena-tests.tar.gz -C /tmp/pr261-tests
          test -f /tmp/pr261-tests/good/perf/irrelevance-refutes.ndjson
          sha256sum /tmp/pr261-tests/good/perf/irrelevance-refutes.ndjson

      - name: Reclose protected 196-case frontier
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/prewhnf-proof-relation-v1
          python3 - <<'PY'
          import json, pathlib, subprocess, os, time, hashlib

          binary=pathlib.Path("/tmp/nucleus")
          rows=[]
          for bucket,expected in (("good",0),("bad",1)):
              root=pathlib.Path("/tmp/arena-tests")/bucket
              for fixture in sorted(root.rglob("*.ndjson")):
                  with fixture.open("rb") as source:
                      try:
                          p=subprocess.run([str(binary)],stdin=source,stdout=subprocess.DEVNULL,
                                           stderr=subprocess.PIPE,timeout=30)
                          actual=p.returncode
                      except subprocess.TimeoutExpired:
                          actual=2
                  rows.append({
                      "test":str(fixture.relative_to(root)).removesuffix(".ndjson"),
                      "expected":expected,
                      "actual":actual,
                  })

          counts={
              "accept":sum(r["expected"]==0 and r["actual"]==0 for r in rows),
              "reject":sum(r["expected"]==1 and r["actual"]==1 for r in rows),
              "unknown":sum(r["actual"]==2 for r in rows),
          }
          wrong=[r for r in rows if r["actual"] in (0,1) and r["actual"]!=r["expected"]]
          errors=[r for r in rows if r["actual"] not in (0,1,2)]

          pr=pathlib.Path("/tmp/pr261-tests/good/perf/irrelevance-refutes.ndjson")
          started=time.monotonic()
          p=subprocess.run([str(binary)],input=pr.read_bytes(),stdout=subprocess.DEVNULL,
                           stderr=subprocess.PIPE,timeout=50,
                           env=os.environ|{"NUCLEUS_TRACE_PREWHNF_PROOF_REFUTE":"1"})
          pr_seconds=time.monotonic()-started

          report={
              "schema":"nucleus-prewhnf-proof-relation-v1",
              "epistemic_state":"CANDIDATE",
              "candidate_sha":os.environ["GITHUB_SHA"],
              "arena_sha":os.environ["ARENA_SHA"],
              "lean_pr15103_head":os.environ["LEAN_PR15103_HEAD"],
              "arena_pr261_head":os.environ["ARENA_PR261_HEAD"],
              "counts":counts,
              "wrong":wrong,
              "errors":errors,
              "pr261":{
                  "fixture_sha256":hashlib.sha256(pr.read_bytes()).hexdigest(),
                  "returncode":p.returncode,
                  "seconds":pr_seconds,
                  "prewhnf_trace":[line for line in p.stderr.decode(errors="replace").splitlines()
                                   if "NUCLEUS_PREWHNF_PROOF_REFUTE" in line][-20:],
              },
          }
          out=pathlib.Path("metatron-kernel/evidence-out/prewhnf-proof-relation-v1/result.json")
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,sort_keys=True))

          assert len(rows)==196, len(rows)
          assert counts=={"accept":118,"reject":71,"unknown":7}, counts
          assert not wrong, wrong
          assert not errors, errors
          assert p.returncode==0, report["pr261"]
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-prewhnf-proof-relation-${{ github.sha }}
          path: metatron-kernel/evidence-out/prewhnf-proof-relation-v1
          if-no-files-found: warn
