name: Nucleus projected inference cache v1

on:
  push:
    branches: [nucleus-projected-inference-cache-v1]
    paths:
      - ".github/workflows/nucleus-projected-inference-cache-v1.yml"
      - "metatron-kernel/src/typecheck.rs"
      - "metatron-kernel/src/value.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: "cb5d9edbbd5a9136c852094b3941e20e6fe9844e"
  ROUND1_ARTIFACT: "10712869614"
  CURRENT_TEST_ARTIFACT: "11090525747"

jobs:
  causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Build candidate and exact base
        run: |
          set -euo pipefail
          ulimit -s 65536
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-candidate
          git worktree add --detach /tmp/nucleus-base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/nucleus-base/metatron-kernel/Cargo.toml
          cp /tmp/nucleus-base/metatron-kernel/target/release/metatron-kernel /tmp/nucleus-base-bin

      - name: Fetch pinned corpora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip > /tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a1
          tar -xzf /tmp/a1/lean-arena-tests.tar.gz -C /tmp/r1
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/a2
          tar -xzf "$(find /tmp/a2 -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current

      - name: Causal chain6 gate
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/projected-inference-cache-v1
          python3 - <<'PY'
          import json,pathlib,subprocess,time,os,hashlib

          def prefix(path,target):
              names={0:""}; rows=[]
              for line in pathlib.Path(path).read_text().splitlines():
                  r=json.loads(line); rows.append(line)
                  if "in" in r:
                      v=r.get("str",r.get("num"))
                      if isinstance(v,dict):
                          pre=v.get("pre",0); atom=v.get("str",v.get("i",v.get("num","?")))
                          names[r["in"]]=names.get(pre,f"#{pre}")+("." if pre else "")+str(atom)
                  ds=[]
                  if "inductive" in r:
                      for k in ("types","ctors","recs"): ds.extend(r["inductive"].get(k,[]))
                  for k in ("def","thm","axiom","opaque","quot"):
                      if k in r and isinstance(r[k],dict): ds.append(r[k])
                  if any(names.get(d.get("name"))==target for d in ds if isinstance(d,dict)):
                      return ("\n".join(rows)+"\n").encode()
              raise RuntimeError(target)

          frozen=pathlib.Path("/tmp/r1/good/perf/fueled-chain.ndjson")
          current=pathlib.Path("/tmp/current/good/perf/fueled-chain.ndjson")
          chain6=prefix(frozen,"chain6_datF")
          funext=prefix(current,"funext")
          env=os.environ|{"NUCLEUS_TRACE_DOWNSTREAM":"1"}

          def run(binary,data=None,path=None,timeout=20):
              t=time.monotonic()
              try:
                  if data is not None:
                      q=subprocess.run([binary],input=data,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=timeout,env=env)
                  else:
                      with pathlib.Path(path).open("rb") as f:
                          q=subprocess.run([binary],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=timeout,env=env)
                  return {"exit":q.returncode,"seconds":time.monotonic()-t,"stderr":q.stderr.decode(errors="replace")}
              except subprocess.TimeoutExpired as e:
                  err=e.stderr.decode(errors="replace") if isinstance(e.stderr,(bytes,bytearray)) else (e.stderr or "")
                  return {"exit":124,"seconds":time.monotonic()-t,"stderr":err}

          result={
            "candidate_sha":os.environ["GITHUB_SHA"],
            "base_sha":os.environ["BASE_SHA"],
            "chain6_sha256":hashlib.sha256(chain6).hexdigest(),
            "base_chain6":run("/tmp/nucleus-base-bin",data=chain6,timeout=8),
            "candidate_chain6":run("/tmp/nucleus-candidate",data=chain6,timeout=30),
            "candidate_funext":run("/tmp/nucleus-candidate",data=funext,timeout=12),
            "k_rec_conv":run("/tmp/nucleus-candidate",path="/tmp/current/bad/bugs/k-rec-conv.ndjson",timeout=5),
            "fun_eta_bad":run("/tmp/nucleus-candidate",path="/tmp/current/bad/tutorial/116_funEtaBad.ndjson",timeout=5),
          }
          result["cache_hits"]="not_traced_in_timing_run"
          for x in result.values():
              if isinstance(x,dict) and "stderr" in x:
                  x["stderr_tail"]=x["stderr"].splitlines()[-40:]
                  del x["stderr"]
          out=pathlib.Path("metatron-kernel/evidence-out/projected-inference-cache-v1/result.json")
          out.write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result),flush=True)

          assert result["base_chain6"]["exit"]==124,result
          assert result["candidate_chain6"]["exit"] in (0,1,2),result
          assert result["candidate_funext"]["exit"]==0,result
          assert result["k_rec_conv"]["exit"]==1,result
          assert result["fun_eta_bad"]["exit"]==1,result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-projected-inference-cache-${{ github.sha }}
          path: metatron-kernel/evidence-out/projected-inference-cache-v1
          if-no-files-found: warn
