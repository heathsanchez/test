name: Nucleus Projection Defeq Reclosure v1
on:
  push:
    branches: [nucleus-projection-defeq-v1]
    paths: ["metatron-kernel/**", ".github/workflows/nucleus-projection-defeq-v1.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reclosure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build candidate and prior qualified head
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          mkdir -p /tmp/evidence
          cp metatron-kernel/target/release/metatron-kernel /tmp/evidence/nucleus
          git worktree add --detach /tmp/base 9c9658b1110449b597a8a14ef2e95ebdc247fdb3
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml
          cp /tmp/base/metatron-kernel/target/release/metatron-kernel /tmp/base-nucleus
      - name: Fetch immutable Arena b1d6 corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-tests /tmp/arena-artifact
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/arena-tests.zip
          unzip -q /tmp/arena-tests.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
      - name: Reclose all 196 Arena tests
        run: |
          set -euo pipefail
          ulimit -s unlimited
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          rows=[]
          for bucket,expected in [("good",0),("bad",1)]:
              root=pathlib.Path("/tmp/arena-tests")/bucket
              for path in sorted(root.rglob("*.ndjson")):
                  row={"test":str(path.relative_to(root)),"expected":expected}
                  for name,binary in [("base","/tmp/base-nucleus"),("candidate","/tmp/evidence/nucleus")]:
                      with path.open("rb") as stream:
                          start=time.monotonic()
                          run=subprocess.run([binary],stdin=stream,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=240,env=os.environ|{"NUCLEUS_TRACE_DOWNSTREAM":"1"})
                      row[name]=run.returncode
                      row[name+"_seconds"]=time.monotonic()-start
                      row[name+"_trace"]=run.stderr.decode(errors="replace").splitlines()[-8:]
                  rows.append(row)
          report={
              "candidate_sha":os.environ["GITHUB_SHA"],
              "base_sha":"9c9658b1110449b597a8a14ef2e95ebdc247fdb3",
              "arena_sha":"b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42",
              "arena_artifact":11272848230,
              "tests":len(rows),
              "counts":{str(code):sum(row["candidate"]==code for row in rows) for code in (0,1,2)},
              "wrong":[row for row in rows if row["candidate"] in (0,1) and row["candidate"]!=row["expected"]],
              "regressions":[row for row in rows if row["base"] in (0,1) and row["candidate"]!=row["base"]],
              "errors":[row for row in rows if row["candidate"] not in (0,1,2)],
              "rows":rows,
          }
          pathlib.Path("/tmp/evidence/arena-b1d6-reclosure.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({key:value for key,value in report.items() if key!="rows"},sort_keys=True))
          assert report["tests"]==196
          assert report["counts"]=={"0":107,"1":59,"2":30}
          assert not report["wrong"] and not report["regressions"] and not report["errors"]
          PY
      - uses: cachix/install-nix-action@v31
      - name: Run exact projection pair through pinned lka.py
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout -q b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
          cd /tmp/arena
          nix develop -c ./lka.py build-test perf/proj-cheap-struct
          nix develop -c ./lka.py build-test perf/proj-lazy-struct
          cat > checkers/nucleus-projection-defeq.yaml <<'YAML'
          version: "projection-defeq-v1"
          description: Independent Nucleus with cheap projection and lazy selected-field conversion.
          run: /tmp/evidence/nucleus < "$IN"
          YAML
          nix develop -c ./lka.py -v run --checker nucleus-projection-defeq --test perf/proj-cheap-struct
          nix develop -c ./lka.py -v run --checker nucleus-projection-defeq --test perf/proj-lazy-struct
          cp _results/nucleus-projection-defeq_perf_proj-*.json /tmp/evidence/
          cp _build/tests/perf/proj-cheap-struct.ndjson /tmp/evidence/
          cp _build/tests/perf/proj-lazy-struct.ndjson /tmp/evidence/
          python3 - <<'PY'
          import json, os, pathlib
          rows=[json.loads(path.read_text()) for path in sorted(pathlib.Path("_results").glob("nucleus-projection-defeq_perf_proj-*.json"))]
          summary={"candidate_sha":os.environ["GITHUB_SHA"],"arena_sha":"b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42","rows":rows}
          pathlib.Path("/tmp/evidence/projection-pair.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,sort_keys=True))
          assert {row["test"] for row in rows}=={"perf/proj-cheap-struct","perf/proj-lazy-struct"}
          assert all(row["exit_code"]==0 and row["status"]=="accepted" and row["correctness"]=="correct" for row in rows)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-projection-defeq-${{ github.sha }}
          path: /tmp/evidence
