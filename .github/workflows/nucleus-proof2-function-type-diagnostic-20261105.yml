name: Nucleus exact-source proof2 application typing diagnostic
on:
  push:
    branches: [research/nucleus-proof2-function-type-diagnostic-20261105]
    paths:
      - '.github/workflows/nucleus-proof2-function-type-diagnostic-20261105.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualified-source-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Restore immutable qualified release and first unknown prefix
        run: |
          set -euo pipefail
          mkdir -p qualified
          gh api repos/heathsanchez/test/actions/artifacts/13370874970/zip > qualified.zip
          printf '%s  %s\n' 0fd8a4cd86dcb233b532f59ea8dc853d22480b6ba62ff864049224250613e517 qualified.zip | sha256sum -c -
          unzip -q qualified.zip -d qualified
          printf '%s  %s\n' 2003c831c32a8249e8524349bc169f3e491e9c84fb71b5fc8db9bce2a8583d01 qualified/candidate/nucleus | sha256sum -c -
          tar --no-same-owner -xzf qualified/candidate/source.tar.gz
          zstd -dq qualified/next-frontier.ndjson.zst -o next-frontier.ndjson
          printf '%s  %s\n' 61b130d9e864c99afd4111b662f884827be98a87f27277c42a5949b025fc0d6b next-frontier.ndjson | sha256sum -c -
          test "$(wc -l < next-frontier.ndjson)" -eq 303563
      - name: Control replay under qualified release binary
        run: |
          set -euo pipefail
          chmod +x qualified/candidate/nucleus
          mapfile -t flags < <(jq -r '.candidate.configuration | to_entries[] | select(.key|test("^NUCLEUS_EXPERIMENTAL_[A-Z0-9_]+$")) | "\(.key)=\(.value)"' qualified/qualification.json)
          set +e
          env "${flags[@]}" NUCLEUS_TRACE_DOWNSTREAM=1 timeout 180 qualified/candidate/nucleus < next-frontier.ndjson > control.stdout 2> control.stderr
          status=$?
          set -e
          printf 'CONTROL_RC=%s\n' "$status"
          grep -F 'AddMonoidAlgebra.nonUnitalNonAssocSemiring._proof_2:stage=theorem.value:verdict=UNKNOWN:reason=application-function-type' control.stderr
          test "$status" -eq 2
      - name: Build exact source with diagnostic-only feature
        run: |
          set -euo pipefail
          cd metatron-kernel
          cargo build --locked --release --features diagnostics
          sha256sum target/release/metatron-kernel
      - name: Trace the actual first unproved Pi premise
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r '.candidate.configuration | to_entries[] | select(.key|test("^NUCLEUS_EXPERIMENTAL_[A-Z0-9_]+$")) | "\(.key)=\(.value)"' qualified/qualification.json)
          set +e
          env "${flags[@]}" NUCLEUS_TRACE_DOWNSTREAM=1 NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE=1 NUCLEUS_TRACE_FAILED_RECEIVER_CONVERSION=1 timeout 220 metatron-kernel/target/release/metatron-kernel < next-frontier.ndjson > diagnostic.stdout 2> diagnostic.stderr
          status=$?
          set -e
          printf 'DIAGNOSTIC_RC=%s\n' "$status"
          test "$status" -eq 2
          grep -F 'AddMonoidAlgebra.nonUnitalNonAssocSemiring._proof_2:stage=theorem.value:verdict=UNKNOWN:reason=application-function-type' diagnostic.stderr
          printf 'TRACE_LOG_BYTES=%s\n' "$(wc -c < diagnostic.stderr)"
          grep -F 'NUCLEUS_APPLICATION_FUNCTION_TYPE:' diagnostic.stderr | tail -n 6 | cut -c 1-900 || true
          grep -F 'NUCLEUS_FAILED_RECEIVER_CONVERSION:' diagnostic.stderr | tail -n 3 | cut -c 1-1150 || true
          zstd -q -f -1 diagnostic.stderr -o diagnostic.stderr.zst
      - name: Store bounded exact-source diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-proof2-exact-source-application-type-trace
          path: |
            qualified/qualification.json
            control.stderr
            diagnostic.stderr.zst
            diagnostic.stdout
            qualified/next-frontier.ndjson.zst
          retention-days: 60
          if-no-files-found: warn
