name: Nucleus guarded quotient projection bridge native GREEN
on:
  push:
    branches: [research/nucleus-deferred-projection-congruence-20261105]
    paths:
      - '.github/workflows/nucleus-quotient-projection-bridge-green-20261105.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore sealed original and exact candidate plus test and bridge
        run: |
          set -euo pipefail
          mkdir -p qualified native
          gh api repos/heathsanchez/test/actions/artifacts/13370874970/zip > qualified.zip
          printf '%s  %s\n' 0fd8a4cd86dcb233b532f59ea8dc853d22480b6ba62ff864049224250613e517 qualified.zip | sha256sum -c -
          unzip -q qualified.zip -d qualified
          tar --no-same-owner -xzf qualified/candidate/source.tar.gz
          printf '%s  %s\n' 64ca8590e663ec33c5a1a242f7c2dafcd9652b58795334300841c21ecc34b26d metatron-kernel/src/machine.rs | sha256sum -c -
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-distinct-const-proof-20261105/next-finsupp-inner-quotient-replay-diag.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-distinct-const-proof-20261105/quotient-projection-bridge-regression-red-v2.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-distinct-const-proof-20261105/guarded-quotient-projection-bridge-candidate.patch
          sha256sum metatron-kernel/src/{machine,convert,run_flags,typecheck}.rs | tee native/source-sha256.txt
      - name: Source-owned synthetic projection bridge and wrong-owner controls
        run: |
          set -euo pipefail
          (cd metatron-kernel && cargo test --locked --release --lib delta_hidden_quotient_iota_supplies_only_a_registered_constructor_field -- --nocapture) 2>&1 | tee native/bridge-test.log
      - name: Entire native checker test suite with bridge enabled
        run: |
          set -euo pipefail
          (cd metatron-kernel && env NUCLEUS_EXPERIMENTAL_QUOTIENT_PROJECTION_BRIDGE=1 cargo test --locked --release) 2>&1 | tee native/full-cargo-test.log
      - name: Build qualified independent binary
        run: |
          set -euo pipefail
          (cd metatron-kernel && cargo build --locked --release) 2>&1 | tee native/cargo-build.log
          sha256sum metatron-kernel/target/release/metatron-kernel | tee native/binary-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-quotient-projection-bridge-native-green
          retention-days: 60
          if-no-files-found: warn
          path: native/
