name: Nucleus recOnSwap exact residual extraction
on:
  push:
    branches: [research/nucleus-reuse-tournaments-20261104]
    paths: ['.github/workflows/nucleus-recOnSwap-extract-20261104.yml', 'experiments/nucleus-recOnSwap-repair-20261104/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Reuse exact Mathlib export and retain target prefix
        run: |
          set -euo pipefail
          mkdir -p /tmp/input
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/input.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/input.zip | sha256sum -c -
          unzip -q /tmp/input.zip -d /tmp/input
          zstd -d /tmp/input/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib.ndjson | sha256sum -c -
          python3 experiments/nucleus-recOnSwap-repair-20261104/extract_prefix.py /tmp/mathlib.ndjson /tmp/recOnSwap-prefix.ndjson
          rm /tmp/mathlib.ndjson /tmp/input.zip /tmp/input/mathlib.ndjson.zst
          zstd -T0 -3 --keep /tmp/recOnSwap-prefix.ndjson
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-recOnSwap-source-prefix
          path: |
            /tmp/recOnSwap-prefix.ndjson.zst
            /tmp/recOnSwap-prefix.json
          compression-level: 0
      - name: Observe exact residual without changing typing
        run: python3 experiments/nucleus-recOnSwap-repair-20261104/observe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-recOnSwap-observation
          path: |
            /tmp/repair-observation/summary.json
            /tmp/repair-observation/build.log
            /tmp/repair-observation/stdout
            /tmp/repair-observation/stderr
