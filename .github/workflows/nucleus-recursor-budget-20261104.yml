name: Nucleus source-certified recursor major budget tournament
on:
  push:
    branches: [research/nucleus-app-frontier-20261104]
    paths:
      - '.github/workflows/nucleus-recursor-budget-20261104.yml'
      - 'experiments/nucleus-app-frontier-20261104/budget_tournament.py'
      - 'experiments/nucleus-app-frontier-20261104/major-budget-8192.patch'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore source-pinned and independently qualified controls
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin a2578e77079719ff2064f910bd82fd01d8e120b6
          mkdir -p /tmp/nucleus-source /tmp/nucleus-eval-artifact /tmp/reference /tmp/nucleus-budget-tournament
          git archive a2578e77079719ff2064f910bd82fd01d8e120b6 | tar -xf - -C /tmp/nucleus-source
          gh api repos/heathsanchez/test/actions/artifacts/13281925554/zip > /tmp/eval-artifact.zip
          printf '%s  %s\n' 42d9ad0e3e65abd8223f95cd96f6ff2c08caf085b703016c490c8de48c39dd63 /tmp/eval-artifact.zip | sha256sum -c -
          unzip -q /tmp/eval-artifact.zip -d /tmp/nucleus-eval-artifact
          printf '%s  %s\n' ffbb9636623f9c4a56e32b89749fea996cb6097912eb83f80f1a54a99e0393e1 /tmp/nucleus-eval-artifact/candidate/source.patch | sha256sum -c -
          zstd -dq /tmp/nucleus-eval-artifact/next-frontier.ndjson.zst -o /tmp/nucleus-budget-tournament/next-frontier.ndjson
          printf '%s  %s\n' 5b7a6b7ad11f5683937e8258322d47f09a9daf6d254bd921e6d23b0d1ee3b494 /tmp/nucleus-budget-tournament/next-frontier.ndjson | sha256sum -c -
          gh api repos/heathsanchez/test/actions/artifacts/13267462207/zip > /tmp/ref-artifact.zip
          printf '%s  %s\n' 9dfaff0a6cb272e6950e301aab75cf99e09a440f5ad881e2e1790019b4add1dd /tmp/ref-artifact.zip | sha256sum -c -
          unzip -q /tmp/ref-artifact.zip -d /tmp/reference
          chmod +x /tmp/reference/bundle/kernel /tmp/nucleus-eval-artifact/candidate/nucleus
      - name: Apply exactly one bounded exposure limit change and compile
        run: |
          set -euo pipefail
          cd /tmp/nucleus-source
          cp "$GITHUB_WORKSPACE/experiments/nucleus-let-preservation-20261104/let_metadata.rs" metatron-kernel/tests/let_metadata.rs
          patch --batch --fuzz=0 -p1 -i /tmp/nucleus-eval-artifact/candidate/source.patch
          printf '%s  %s\n' 6175be8154b56ff7e6fd9f5daa142d225f03381b3f04d141d2b606892603973a "$GITHUB_WORKSPACE/experiments/nucleus-app-frontier-20261104/major-budget-8192.patch" | sha256sum -c -
          patch --batch --fuzz=0 -p1 -i "$GITHUB_WORKSPACE/experiments/nucleus-app-frontier-20261104/major-budget-8192.patch"
          cargo build --release --manifest-path metatron-kernel/Cargo.toml
      - name: Compare official reference, unchanged candidate and bounded variant
        run: python3 experiments/nucleus-app-frontier-20261104/budget_tournament.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-recursor-budget-${{ github.sha }}
          path: |
            /tmp/nucleus-budget-tournament/summary.json
            /tmp/nucleus-budget-tournament/*.stdout
            /tmp/nucleus-budget-tournament/*.stderr
