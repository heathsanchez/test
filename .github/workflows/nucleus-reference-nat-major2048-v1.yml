name: Nucleus source-sized Nat-major2048 microgate
on:
  push:
    branches: [nucleus-reference-nat-major2048-v1]
    paths: ["metatron-kernel/**", ".github/workflows/nucleus-reference-nat-major2048-v1.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bind checker and run release tests
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
      - name: Fetch frozen Arena input authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/a.zip
          unzip -q /tmp/a.zip -d /tmp/a
          tar -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Expose first and terminal neutral split for small remaining family
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/nat-major2048-v1
          python3 - <<'PY'
          import os,json,pathlib,hashlib,subprocess,time
          root=pathlib.Path('/tmp/tests')
          names=[('good','perf/shared-subterm',2),
                 ('good','perf/folded-constant-first',2),
                 ('good','perf/folded-constant-last',2),
                 ('bad','bugs/nested-unused-param',1)]
          rows=[]
          for bucket,name,expected in names:
            path=root/bucket/(name+'.ndjson')
            start=time.monotonic()
            p=subprocess.run(['metatron-kernel/target/release/metatron-kernel'],
              input=path.read_bytes(),stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,
              timeout=35,env=os.environ|{'NUCLEUS_TRACE_NEUTRAL_HEADS':'1','NUCLEUS_TRACE_DOWNSTREAM':'1','NUCLEUS_TRACE_RECURSOR_MAJOR':'1','NUCLEUS_TRACE_UNARY_MAJOR':'1'})
            lines=p.stderr.decode(errors='replace').splitlines()
            mismatches=[x for x in lines if 'NUCLEUS_NEUTRAL_HEAD_MISMATCH:' in x]
            row={'case':name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
                 'rc':p.returncode,'expected':expected,
                 'elapsed_sec':round(time.monotonic()-start,3),
                 'mismatch_count':len(mismatches),
                 'first_mismatch':mismatches[:3],
                 'last_mismatch':mismatches[-3:],
                 'major_values':[x for x in lines if 'NUCLEUS_RECURSOR_MAJOR_VALUE:' in x][:4],
                 'unary_probe_count':sum('NUCLEUS_CERTIFIED_UNARY_MAJOR:' in x for x in lines),
                 'unary_major_values':[x[:1500] for x in lines if 'NUCLEUS_UNARY_MAJOR_VALUE:' in x][:8],
                 'terminal':[x for x in lines if 'NUCLEUS_DOWNSTREAM:' in x][-4:]}
            rows.append(row)
            pathlib.Path('metatron-kernel/evidence-out/nat-major2048-v1',name.replace('/','__')+'.txt').write_text('\n'.join(lines))
            print(json.dumps(row,sort_keys=True))
            assert (p.returncode in (0,2) if bucket=='good' else p.returncode==expected),row
          report={'source':os.environ['GITHUB_SHA'],'source_subtree':subprocess.check_output(['git','rev-parse','HEAD:metatron-kernel'],text=True).strip(),
                  'qualification':os.environ['GITHUB_SHA'],'rows':rows}
          pathlib.Path('metatron-kernel/evidence-out/nat-major2048-v1/report.json').write_text(json.dumps(report,indent=2))
          print('new_accepts='+str(sum(r['rc']==0 and r['expected']==2 for r in rows)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-nat-major2048-${{ github.sha }}
          path: metatron-kernel/evidence-out/nat-major2048-v1
          if-no-files-found: warn
