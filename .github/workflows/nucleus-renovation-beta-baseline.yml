name: Nucleus renovation beta exact baseline
on:
  push:
    branches: [research/nucleus-renovation-beta-baseline-20261125]
    paths:
      - .github/workflows/nucleus-renovation-beta-baseline.yml
      - metatron-kernel/scripts/renovation_beta_baseline_20261125.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Confirm unchanged independent checker source and build
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/beta-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/beta-evidence/commit.txt"
          git rev-parse HEAD:metatron-kernel/src > "$RUNNER_TEMP/beta-evidence/source-tree.txt"
          git diff --exit-code 5245b3b365e4f4293c570f615c6bcc4ee5e37518 -- metatron-kernel/src metatron-kernel/Cargo.toml metatron-kernel/Cargo.lock
          python3 -m py_compile metatron-kernel/scripts/renovation_beta_baseline_20261125.py
          cargo build --locked --release --features diagnostics --manifest-path metatron-kernel/Cargo.toml
      - name: Replay exact beta bytes with actual format and verdict separation
        run: |
          set -euxo pipefail
          python3 metatron-kernel/scripts/renovation_beta_baseline_20261125.py \
            --checker "$PWD/metatron-kernel/target/release/metatron-kernel" \
            --flags experiments/nucleus-capture-substitution-20261107/alias-result-canonical-off-replay.json \
            --out "$RUNNER_TEMP/beta-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-renovation-beta-baseline
          path: ${{ runner.temp }}/beta-evidence/
          if-no-files-found: error
