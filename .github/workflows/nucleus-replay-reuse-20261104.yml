name: Nucleus bounded replay reuse elimination tournament
on:
  push:
    branches: [research/nucleus-universe-records-20261104]
    paths:
      - '.github/workflows/nucleus-replay-reuse-20261104.yml'
      - 'experiments/nucleus-replay-reuse-20261104/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore qualified complete source and exact source inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/universe-qualified /tmp/current208
          gh api repos/heathsanchez/test/actions/artifacts/13284067853/zip > /tmp/universe-qualified.zip
          printf '%s  %s\n' ec5db42c2843d66ec6e5540da79a88bbdd4f4843adbfdfd5f00439a852561856 /tmp/universe-qualified.zip | sha256sum -c -
          unzip -q /tmp/universe-qualified.zip -d /tmp/universe-qualified
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/corpus.zip
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/corpus.zip | sha256sum -c -
          unzip -q /tmp/corpus.zip -d /tmp/current208
      - name: Collect bounded source-owned application traces
        run: python3 experiments/nucleus-replay-reuse-20261104/tournament.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-replay-reuse-${{ github.sha }}
          retention-days: 90
          path: |
            /tmp/nucleus-replay-reuse/*.json
            /tmp/nucleus-replay-reuse/*/*.json
            /tmp/nucleus-replay-reuse/*/*.log
            /tmp/nucleus-replay-reuse/*/*.patch
            /tmp/nucleus-replay-reuse/*/source.tar.gz
            /tmp/nucleus-replay-reuse/*/nucleus
            /tmp/nucleus-replay-reuse/*/*/stderr
            /tmp/nucleus-replay-reuse/*/*/stdout
            /tmp/nucleus-replay-reuse/*/*/time.txt
