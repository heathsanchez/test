name: Nucleus Residual Capability Prop Projection v1

on:
  push:
    branches: [nucleus-residual-capability-prop-projection-v1]
    paths:
      - ".github/workflows/nucleus-residual-capability-prop-projection-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-residual-capability-prop-projection-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: 35dfbc340f0b17adb5a496e8d0eda1cb6b6213be
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build candidate and exact qualified base
        run: |
          set -euo pipefail
          cd metatron-kernel
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked
          cd ..
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen official corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193
          sha256sum /tmp/art/lean-arena-tests.tar.gz

      - name: Global reclosure of Prop projection safety capability
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/residual-prop-projection-v1
          python - <<'PY'
          import json, os, pathlib, subprocess

          root = pathlib.Path('/tmp/tests')
          base = pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand = pathlib.Path('target/release/metatron-kernel').resolve()
          rows = []

          for directory, expected in [('good', 0), ('bad', 1)]:
              for path in sorted((root / directory).rglob('*.ndjson')):
                  test = str(path.relative_to(root / directory)).removesuffix('.ndjson')

                  def rr(binary, trace=False):
                      env = dict(os.environ)
                      if trace:
                          env['NUCLEUS_TRACE_CAPABILITY'] = '1'
                      with path.open('rb') as f:
                          q = subprocess.run(
                              [str(binary)], stdin=f, stdout=subprocess.DEVNULL,
                              stderr=subprocess.PIPE, env=env
                          )
                      return q.returncode, q.stderr.decode('utf-8', errors='replace')

                  base_rc, _ = rr(base)
                  candidate_rc, stderr = rr(cand, trace=True)
                  rows.append({
                      'test': test,
                      'expected': expected,
                      'base': base_rc,
                      'candidate': candidate_rc,
                      'capability_hit': 'NUCLEUS_CAPABILITY_HIT:projection.prop-dependent-safety.v0:Reject' in stderr,
                  })

          assert len(rows) == 193
          by = {r['test']: r for r in rows}
          target = [
              'tutorial/090_projProp2',
              'tutorial/092_projProp4',
              'tutorial/093_projProp5',
              'tutorial/094_projProp6',
          ]
          protected_good = ['tutorial/089_projProp1', 'tutorial/091_projProp3']

          false_accept = [r for r in rows if r['expected'] == 1 and r['candidate'] == 0]
          false_reject = [r for r in rows if r['expected'] == 0 and r['candidate'] == 1]
          regressions = [
              r for r in rows
              if r['base'] in (0, 1) and r['candidate'] != r['base']
          ]
          wrong_delta = [
              r for r in rows
              if r['base'] in (2, 3)
              and r['candidate'] in (0, 1)
              and r['candidate'] != r['expected']
          ]
          earned = [
              r for r in rows
              if r['base'] in (2, 3) and r['candidate'] == r['expected']
          ]
          changes = [r for r in rows if r['base'] != r['candidate']]
          hits = [r['test'] for r in rows if r['capability_hit']]

          assert not false_accept, false_accept
          assert not false_reject, false_reject
          assert not regressions, regressions
          assert not wrong_delta, wrong_delta
          assert sorted(r['test'] for r in earned) == sorted(target), earned
          assert sorted(r['test'] for r in changes) == sorted(target), changes
          assert sorted(hits) == sorted(target), hits

          for name in target:
              assert by[name]['base'] in (2, 3), by[name]
              assert by[name]['candidate'] == 1, by[name]
          for name in protected_good:
              assert by[name]['candidate'] == by[name]['base'], by[name]
              assert not by[name]['capability_hit'], by[name]

          base_residual = sum(r['base'] in (2, 3) for r in rows)
          candidate_residual = sum(r['candidate'] in (2, 3) for r in rows)
          assert base_residual == 76, base_residual
          assert candidate_residual == 72, candidate_residual

          out = {
              'schema': 'nucleus-residual-capability-prop-projection-v1',
              'base_sha': os.environ['BASE_SHA'],
              'candidate_sha': os.environ['GITHUB_SHA'],
              'fixed_outcome_tests': len(rows),
              'base_residual': base_residual,
              'candidate_residual': candidate_residual,
              'earned_count': len(earned),
              'earned': [r['test'] for r in earned],
              'capability_hits': hits,
              'changes': changes,
              'false_accepts': false_accept,
              'false_rejects': false_reject,
              'regressions': regressions,
              'wrong_deltas': wrong_delta,
              'protected_good': {name: by[name] for name in protected_good},
          }
          dest = pathlib.Path('evidence-out/residual-prop-projection-v1/result.json')
          dest.write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, sort_keys=True))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-residual-capability-prop-projection-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/residual-prop-projection-v1
          if-no-files-found: warn
