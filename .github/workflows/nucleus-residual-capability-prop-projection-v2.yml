name: Nucleus Residual Capability Prop Projection v2

on:
  push:
    branches: [nucleus-residual-capability-prop-projection-v2]
    paths:
      - ".github/workflows/nucleus-residual-capability-prop-projection-v2.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-residual-capability-prop-projection-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: 86fbfa31bf5359a791928edaf6aa0482c29bc233
      ARENA_ARTIFACT: 10712869614
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build candidate and exact current warranted base
        run: |
          set -euo pipefail
          cd metatron-kernel
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked
          cd ..
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch exact frozen official corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193
          sha256sum /tmp/art/lean-arena-tests.tar.gz

      - name: Six-case protected separator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, subprocess

          root = pathlib.Path('/tmp/tests')
          base = pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand = pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          targets = {
              'tutorial/089_projProp1': 0,
              'tutorial/090_projProp2': 1,
              'tutorial/091_projProp3': 0,
              'tutorial/092_projProp4': 1,
              'tutorial/093_projProp5': 1,
              'tutorial/094_projProp6': 1,
          }

          def locate(name):
              stem = name.split('/')[-1]
              hits = list(root.rglob(stem + '.ndjson'))
              assert len(hits) == 1, (name, hits)
              return hits[0]

          def rr(binary, path, trace=False):
              env = dict(os.environ)
              if trace:
                  env['NUCLEUS_TRACE_CAPABILITY'] = '1'
              with path.open('rb') as f:
                  q = subprocess.run(
                      [str(binary)], stdin=f, stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE, env=env, timeout=60
                  )
              return q.returncode, q.stderr.decode('utf-8', errors='replace')

          rows = []
          for test, expected in targets.items():
              path = locate(test)
              brc, _ = rr(base, path)
              crc, stderr = rr(cand, path, True)
              hit = 'NUCLEUS_CAPABILITY_HIT:projection.prop-dependent-safety.v0:Reject' in stderr
              rows.append((test, expected, brc, crc, hit))

          by = {r[0]: r for r in rows}
          neg = ['tutorial/090_projProp2','tutorial/092_projProp4',
                 'tutorial/093_projProp5','tutorial/094_projProp6']
          pos = ['tutorial/089_projProp1','tutorial/091_projProp3']
          assert all(by[n][2] in (2,3) for n in targets), rows
          assert all(by[n][3] == 1 and by[n][4] for n in neg), rows
          assert all(by[n][3] in (2,3) and not by[n][4] for n in pos), rows
          print('SIX_CASE_SEPARATOR_PASS', rows)
          PY

      - name: Full 193-case protected reclosure
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/residual-prop-projection-v2
          python - <<'PY'
          import json, os, pathlib, subprocess, time

          root = pathlib.Path('/tmp/tests')
          base = pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand = pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          rows = []

          def rr(binary, path, trace=False):
              env = dict(os.environ)
              if trace:
                  env['NUCLEUS_TRACE_CAPABILITY'] = '1'
              with path.open('rb') as f:
                  t=time.perf_counter_ns()
                  q = subprocess.run(
                      [str(binary)], stdin=f, stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE, env=env, timeout=120
                  )
              return q.returncode, q.stderr.decode('utf-8', errors='replace'), time.perf_counter_ns()-t

          for directory, expected in [('good', 0), ('bad', 1)]:
              for path in sorted((root / directory).rglob('*.ndjson')):
                  test = str(path.relative_to(root / directory)).removesuffix('.ndjson')
                  base_rc, _, base_ns = rr(base, path)
                  candidate_rc, stderr, candidate_ns = rr(cand, path, True)
                  rows.append({
                      'test': test,
                      'expected': expected,
                      'base': base_rc,
                      'candidate': candidate_rc,
                      'base_ns': base_ns,
                      'candidate_ns': candidate_ns,
                      'capability_hit':
                          'NUCLEUS_CAPABILITY_HIT:projection.prop-dependent-safety.v0:Reject' in stderr,
                  })

          assert len(rows) == 193
          by = {r['test']: r for r in rows}
          target = [
              'tutorial/090_projProp2',
              'tutorial/092_projProp4',
              'tutorial/093_projProp5',
              'tutorial/094_projProp6',
          ]
          protected_good = ['tutorial/089_projProp1', 'tutorial/091_projProp3']

          false_accept = [r for r in rows if r['expected'] == 1 and r['candidate'] == 0]
          false_reject = [r for r in rows if r['expected'] == 0 and r['candidate'] == 1]
          regressions = [
              r for r in rows if r['base'] in (0,1) and r['candidate'] != r['base']
          ]
          wrong_delta = [
              r for r in rows
              if r['base'] in (2,3)
              and r['candidate'] in (0,1)
              and r['candidate'] != r['expected']
          ]
          earned = [
              r for r in rows
              if r['base'] in (2,3) and r['candidate'] == r['expected']
          ]
          changes = [r for r in rows if r['base'] != r['candidate']]
          hits = [r['test'] for r in rows if r['capability_hit']]

          assert not false_accept, false_accept
          assert not false_reject, false_reject
          assert not regressions, regressions
          assert not wrong_delta, wrong_delta
          assert sorted(r['test'] for r in earned) == sorted(target), earned
          assert sorted(r['test'] for r in changes) == sorted(target), changes
          assert all(by[name]['capability_hit'] for name in target), hits

          for name in protected_good:
              assert by[name]['candidate'] == by[name]['base'], by[name]
              assert not by[name]['capability_hit'], by[name]

          base_residual = sum(r['base'] in (2,3) for r in rows)
          candidate_residual = sum(r['candidate'] in (2,3) for r in rows)
          base_accept = sum(r['base'] == 0 for r in rows)
          base_reject = sum(r['base'] == 1 for r in rows)
          candidate_accept = sum(r['candidate'] == 0 for r in rows)
          candidate_reject = sum(r['candidate'] == 1 for r in rows)

          assert base_residual == 71, base_residual
          assert candidate_residual == 67, candidate_residual
          assert base_accept == 83, base_accept
          assert base_reject == 39, base_reject
          assert candidate_accept == 83, candidate_accept
          assert candidate_reject == 43, candidate_reject

          summary = {
              'schema': 'nucleus-residual-capability-prop-projection-v2',
              'base_sha': os.environ['BASE_SHA'],
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'fixed_outcome_tests': len(rows),
              'base_native_accept': base_accept,
              'base_native_reject': base_reject,
              'base_residual': base_residual,
              'candidate_native_accept': candidate_accept,
              'candidate_native_reject': candidate_reject,
              'candidate_residual': candidate_residual,
              'earned_count': len(earned),
              'earned': [r['test'] for r in earned],
              'capability_hits': hits,
              'changes': [r['test'] for r in changes],
              'false_accepts': false_accept,
              'false_rejects': false_reject,
              'regressions': regressions,
              'wrong_deltas': wrong_delta,
              'protected_good': {name: by[name] for name in protected_good},
          }
          out = pathlib.Path('metatron-kernel/evidence-out/residual-prop-projection-v2')
          (out/'result.json').write_text(json.dumps(summary, indent=2, sort_keys=True)+'\n')
          (out/'rows.json').write_text(json.dumps(rows, indent=2, sort_keys=True)+'\n')
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-residual-capability-prop-projection-v2-${{ github.sha }}
          path: metatron-kernel/evidence-out/residual-prop-projection-v2
          if-no-files-found: warn
