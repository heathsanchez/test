name: Nucleus bounded source-prefix resumption RED regression
on:
  push:
    branches: [research/nucleus-deferred-projection-congruence-20261105]
    paths:
      - '.github/workflows/nucleus-resumable-source-prefix-red-20261105.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Rebuild exactly pinned and independently qualified candidate
        run: |
          set -euo pipefail
          mkdir -p qualified
          gh api repos/heathsanchez/test/actions/artifacts/13370874970/zip > qualified.zip
          printf '%s  %s\n' 0fd8a4cd86dcb233b532f59ea8dc853d22480b6ba62ff864049224250613e517 qualified.zip | sha256sum -c -
          unzip -q qualified.zip -d qualified
          tar --no-same-owner -xzf qualified/candidate/source.tar.gz
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-distinct-const-proof-20261105/next-finsupp-inner-quotient-replay-diag.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-distinct-const-proof-20261105/quotient-projection-bridge-regression-red-v2.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-distinct-const-proof-20261105/guarded-quotient-projection-bridge-candidate.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-resumable-source-prefix-20261105/source-prefix-red-regression.patch
          sha256sum metatron-kernel/src/{machine,run_flags}.rs > source-sha256.txt
      - name: RED must fail at the intended finite-progress assertion
        run: |
          set -euo pipefail
          set +e
          (cd metatron-kernel && cargo test --locked --lib --features diagnostics exact_bounded_source_prefix_eventually_completes_without_publishing_partial_proof -- --nocapture) > red.stdout 2> red.stderr
          rc=$?
          set -e
          printf '%s\n' "test_exit=$rc" > red.status
          sed -n '/running 1 test/,$p' red.stdout | tail -n 45
          tail -n 20 red.stderr
          test "$rc" -ne 0
          grep -Fq 'exact immutable source prefix must resume across bounded attempts' red.stdout red.stderr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-bounded-source-prefix-red
          retention-days: 60
          if-no-files-found: warn
          path: |
            source-sha256.txt
            red.stdout
            red.stderr
            red.status
