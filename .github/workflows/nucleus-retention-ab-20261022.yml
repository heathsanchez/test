name: Nucleus source-exact recursor retention factorial
on:
  push:
    branches: [research/nucleus-recursor-retention-ab-20261022]
    paths:
      - '.github/scripts/nucleus_retention_ab_patch_20261022.py'
      - '.github/scripts/nucleus_retention_ab_gate_20261022.py'
      - '.github/workflows/nucleus-retention-ab-20261022.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin unchanged original independent kernel and original subproofs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel)" = 5e7d65b1b6abc3f6380bc7a37ffb153284d7faf1
          mkdir -p /tmp/nucleus-retention-src /tmp/nucleus-retention /tmp/nucleus-retention-evidence /tmp/nucleus-retention-fixtures
          git rev-parse HEAD > /tmp/nucleus-retention-evidence/research-head.txt
          rustc -vV > /tmp/nucleus-retention-evidence/compiler.txt
          gh api repos/heathsanchez/test/actions/artifacts/12336209253/zip > /tmp/nucleus-retention-original.zip
          echo '6727b4ba0de9f4b12642307d1749fcf220047134bfbb6e6a5a789bec092dfaa4  /tmp/nucleus-retention-original.zip' | sha256sum -c -
          unzip -q /tmp/nucleus-retention-original.zip -d /tmp/nucleus-retention-fixtures
          test -s /tmp/nucleus-retention-fixtures/magma-list-pair-n7.ndjson-positive.ndjson
      - name: Build five source-controlled variants of original Nucleus
        run: |
          set -euo pipefail
          for arm in baseline bindings replays both fuel4x; do
            cp -a metatron-kernel /tmp/nucleus-retention-src/$arm
            python3 .github/scripts/nucleus_retention_ab_patch_20261022.py /tmp/nucleus-retention-src/$arm "$arm"
            diff -u metatron-kernel/src/machine.rs /tmp/nucleus-retention-src/$arm/src/machine.rs > /tmp/nucleus-retention-evidence/$arm-machine.diff || test "$?" = 1
            diff -u metatron-kernel/src/checker.rs /tmp/nucleus-retention-src/$arm/src/checker.rs > /tmp/nucleus-retention-evidence/$arm-checker.diff || test "$?" = 1
            CARGO_TARGET_DIR=/tmp/nucleus-retention-target \
              cargo build --release --locked --features diagnostics \
                --manifest-path /tmp/nucleus-retention-src/$arm/Cargo.toml
            cp /tmp/nucleus-retention-target/release/metatron-kernel /tmp/nucleus-retention/$arm
          done
          sha256sum /tmp/nucleus-retention/{baseline,bindings,replays,both,fuel4x} > /tmp/nucleus-retention-evidence/binaries.sha256
      - name: Require native Rust regressions for the full cache uplift
        run: |
          set -euo pipefail
          NUCLEUS_EXPERIMENTAL_RELEVANCE=1 NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA=1 \
            CARGO_TARGET_DIR=/tmp/nucleus-retention-target \
            cargo test --release --locked --features diagnostics \
              --manifest-path /tmp/nucleus-retention-src/both/Cargo.toml \
              > /tmp/nucleus-retention-evidence/rust-tests.log 2>&1 || {
                tail -120 /tmp/nucleus-retention-evidence/rust-tests.log; exit 1;
              }
      - name: Test original source valid finite decisions versus false Bool controls
        run: |
          set -euo pipefail
          python3 .github/scripts/nucleus_retention_ab_gate_20261022.py \
            /tmp/nucleus-retention-fixtures /tmp/nucleus-retention-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-recursor-retention-ab-${{ github.sha }}
          path: /tmp/nucleus-retention-evidence
          if-no-files-found: warn
