name: Nucleus source reuse tournament
on:
  push:
    branches: [research/nucleus-reuse-tournaments-20261104]
    paths: ['.github/workflows/nucleus-reuse-tournament-20261104.yml', 'experiments/nucleus-reuse-20261104/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Test fail-closed tournament admission
        working-directory: experiments/nucleus-reuse-20261104
        run: python3 -m unittest test_tournament -v
      - name: Restore hash-pinned 208-case corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/current208 /tmp/tournament
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/inputs.zip
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/inputs.zip | sha256sum -c -
          unzip -q /tmp/inputs.zip -d /tmp/current208
      - name: Run individual and composed source experiments
        run: python3 experiments/nucleus-reuse-20261104/tournament.py corpus --repo . --out /tmp/tournament --inputs /tmp/current208
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-reuse-source-tournament-${{ github.sha }}
          path: /tmp/tournament
          if-no-files-found: error
          compression-level: 1
