name: Nucleus Nat.succ_le_succ Rule-K audit
on:
  push:
    branches: [nucleus-succle-typed-projection-probe-v1]
    paths: [".github/workflows/nucleus-rule-k-residual-v1.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SUBTREE: 24776b0e2003d65464f4623a008cb98b193d05e6
      SOURCE_COMMIT: e2e5e84790ce8641c2020c7cd6a40dc683b03627
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify source tree and build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel)" = "$SOURCE_SUBTREE"
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Fetch immutable Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/a.zip
          unzip -q /tmp/a.zip -d /tmp/a
          tar -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Audit existing typed Rule-K attempts without semantic change
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/rule-k-residual-v1
          python3 - <<'PY'
          import os,subprocess,json,pathlib,hashlib
          root=pathlib.Path('/tmp/tests')
          rows=[]
          for folder,name,want in [
              ('good','init-prelude',2),
              ('good','perf/magma-list-pair-n7',2),
              ('bad','bugs/nested-unused-param',1)]:
            p=root/folder/(name+'.ndjson')
            with p.open('rb') as f:
              a=subprocess.run(['metatron-kernel/target/release/metatron-kernel'],
                stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=65,
                env=os.environ|{'NUCLEUS_TRACE_RULE_K':'1','NUCLEUS_TRACE_DOWNSTREAM':'1',
                                'NUCLEUS_TRACE_TYPED_PROJECTION':'1'})
            raw=a.stderr.decode(errors='replace')
            lines=raw.splitlines()
            dest=pathlib.Path('metatron-kernel/evidence-out/rule-k-residual-v1')
            (dest/(name.replace('/','__')+'.txt')).write_text(raw)
            rul=[v for v in lines if 'NUCLEUS_RULE_K:' in v]
            row={'test':name,'returncode':a.returncode,'expected':want,
                 'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                 'rulek_count':len(rul),'rulek_first':rul[:30],'rulek_last':rul[-30:],
                 'downstream':[v for v in lines if 'NUCLEUS_DOWNSTREAM:' in v][-3:]}
            rows.append(row)
            print(json.dumps(row,sort_keys=True))
            assert a.returncode==want,row
          (pathlib.Path('metatron-kernel/evidence-out/rule-k-residual-v1')/'report.json').write_text(
              json.dumps({'source':os.environ['SOURCE_COMMIT'],'subtree':os.environ['SOURCE_SUBTREE'],
                          'qualification':os.environ['GITHUB_SHA'],'rows':rows},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-rule-k-residual-${{ github.sha }}
          path: metatron-kernel/evidence-out/rule-k-residual-v1
          if-no-files-found: warn
