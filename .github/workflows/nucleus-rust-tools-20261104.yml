name: Nucleus reusable Rust experiment tools
on:
  push:
    branches: [research/nucleus-reuse-tournaments-20261104]
    paths: ['.github/workflows/nucleus-rust-tools-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Prepare exact offline compiler and dependency inputs
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path metatron-kernel/Cargo.toml
          compiler_root=$(rustc --print sysroot)
          tar -C "$compiler_root" -I 'zstd -T0 -3' -cf /tmp/nucleus-rust-tools.tar.zst bin lib
          tar -C "$HOME/.cargo" -I 'zstd -T0 -3' -cf /tmp/nucleus-rust-registry.tar.zst registry
          sha256sum /tmp/nucleus-rust-tools.tar.zst /tmp/nucleus-rust-registry.tar.zst > /tmp/nucleus-rust-tools.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-rust-tools-1.99.1
          path: |
            /tmp/nucleus-rust-tools.tar.zst
            /tmp/nucleus-rust-registry.tar.zst
            /tmp/nucleus-rust-tools.sha256
          compression-level: 0
          retention-days: 30
