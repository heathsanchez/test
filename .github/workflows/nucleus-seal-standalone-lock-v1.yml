name: Nucleus Seal Standalone Lock v1

on:
  push:
    branches: [nucleus-standalone-complete-v1]
    paths:
      - ".github/workflows/nucleus-seal-standalone-lock-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nucleus-standalone-complete-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate and commit exact dependency lock
        run: |
          set -euo pipefail
          cd metatron-kernel
          cargo generate-lockfile
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metatron-kernel/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already sealed"
            exit 0
          fi
          git commit -m "build(nucleus): seal standalone dependency graph"
          git push origin HEAD:nucleus-standalone-complete-v1
