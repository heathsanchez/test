name: Nucleus Semantic Closure G35 v1

on:
  push:
    branches: [nucleus-semantic-closure-g35-v1]
    paths:
      - ".github/workflows/nucleus-semantic-closure-g35-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-semantic-closure-g35-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARENA_SHA: ae76435a5fb439571a28e19d74cd1e2e3ab69667
      FLASH_SHA: 78c7502bac8a5ba000057b3f083bc0595ac65750
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
 
      - name: Verify and build Nucleus
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked

      - name: Build pinned MathGraph fallback
        run: |
          set -euo pipefail
          git clone -q https://github.com/metalogiclabs/mathgraph-lean-kernel /tmp/mathgraph
          git -C /tmp/mathgraph checkout -q "$FLASH_SHA"
          cat >/tmp/mathgraph/config.json <<'JSON'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 2
          }
          JSON
          cargo build --release --locked --manifest-path /tmp/mathgraph/Cargo.toml

      - name: Fetch exact official 193-file Arena tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/10712869614/zip > /tmp/test-tarball.zip
          mkdir -p /tmp/test-artifact /tmp/arena-tests
          unzip -q /tmp/test-tarball.zip -d /tmp/test-artifact
          tar -xzf /tmp/test-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
          test "$(find /tmp/arena-tests -type f -name '*.ndjson' | wc -l)" -eq 193
          sha256sum /tmp/test-artifact/lean-arena-tests.tar.gz

      - name: Qualify 193-file fixed-outcome closure
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/semantic-closure
          python - <<'PY'
          import json, os, pathlib, subprocess, time

          root=pathlib.Path('/tmp/arena-tests')
          nucleus=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          wrapper=pathlib.Path('metatron-kernel/scripts/nucleus-semantic-closure').resolve()
          flash=pathlib.Path('/tmp/mathgraph/target/release/sokonanoda')
          config=pathlib.Path('/tmp/mathgraph/config.json')
          excluded={'perf/magma-string-n4','perf/magma-string-pair-n9'}

          env=dict(os.environ)
          env.update({
              'NUCLEUS_BIN':str(nucleus),
              'FLASH_BIN':str(flash),
              'FLASH_CONFIG':str(config),
          })

          rows=[]
          cases=[]
          for outcome_dir,expected,exp_rc in [('good','accept',0),('bad','reject',1)]:
              for ndjson in sorted((root/outcome_dir).rglob('*.ndjson')):
                  name=str(ndjson.relative_to(root/outcome_dir)).removesuffix('.ndjson')
                  cases.append((name,expected,exp_rc,ndjson))
          for name,expected,exp_rc,ndjson in cases:

              def run(cmd):
                  with ndjson.open('rb') as f:
                      t=time.perf_counter_ns()
                      p=subprocess.run(cmd,stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,env=env)
                      return p.returncode,time.perf_counter_ns()-t

              nrc,nt=run([str(nucleus)])
              frc,ft=run([str(flash),str(config)])
              hrc,ht=run(['bash',str(wrapper),str(ndjson)])

              # Arena's MathGraph integration maps all nonzero checker exits to reject.
              fcanon=0 if frc==0 else 1
              hcanon=0 if hrc==0 else 1
              rows.append({
                  'test':name,'expected':expected,'expected_rc':exp_rc,
                  'nucleus_rc':nrc,'flash_raw_rc':frc,'flash_rc':fcanon,'hybrid_rc':hcanon,
                  'nucleus_ns':nt,'flash_ns':ft,'hybrid_ns':ht,
              })

          assert len(rows)==193, len(rows)
          flash_bad=[r for r in rows if r['flash_rc']!=r['expected_rc']]
          hybrid_bad=[r for r in rows if r['hybrid_rc']!=r['expected_rc']]
          false_accepts=[r for r in rows if r['expected_rc']==1 and r['nucleus_rc']==0]
          fast_accepts=[r for r in rows if r['expected_rc']==0 and r['nucleus_rc']==0]
          fallback_rows=[r for r in rows if r['nucleus_rc']!=0]

          summary={
              'schema':'nucleus-semantic-closure-g35-v1',
              'arena_sha':os.environ['ARENA_SHA'],
              'flash_sha':os.environ['FLASH_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'fixed_outcome_tests':len(rows),
              'hybrid_correct':len(rows)-len(hybrid_bad),
              'hybrid_incorrect':len(hybrid_bad),
              'flash_correct':len(rows)-len(flash_bad),
              'flash_incorrect':len(flash_bad),
              'nucleus_false_accepts':len(false_accepts),
              'nucleus_fast_accepts':len(fast_accepts),
              'fallback_invocations':len(fallback_rows),
              'excluded_uploaded_large_string_perf':sorted(excluded),
              'hybrid_bad':hybrid_bad,
              'flash_bad':flash_bad,
              'false_accepts':false_accepts,
              'fast_accept_tests':[r['test'] for r in fast_accepts],
              'fallback_tests':[r['test'] for r in fallback_rows],
          }
          out=pathlib.Path('metatron-kernel/evidence-out/semantic-closure/result.json')
          out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          pathlib.Path('metatron-kernel/evidence-out/semantic-closure/rows.json').write_text(
              json.dumps(rows,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(summary,sort_keys=True))
          assert not flash_bad, flash_bad
          assert not false_accepts, false_accepts
          assert not hybrid_bad, hybrid_bad
          PY

      - name: Upload semantic closure evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-semantic-closure-${{ github.sha }}
          path: metatron-kernel/evidence-out/semantic-closure
          if-no-files-found: warn
