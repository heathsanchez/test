name: Nucleus Semantic Contract Graph v1

on:
  push:
    branches: [nucleus-semantic-contract-graph-v1]
    paths:
      - ".github/workflows/nucleus-semantic-contract-graph-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 57115bfbde93b55824991a6800182cc3c75fa5a4
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - name: Build and test contract graph
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          mkdir -p evidence-out/semantic-contract-graph-v1
          cargo test --release contract_graph::tests::emits_deterministic_contract_closure_evidence -- --nocapture             2>&1 | tee evidence-out/semantic-contract-graph-v1/closure.txt
      - name: Build exact independent base and candidate
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193
      - name: Prove zero semantic authority
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]
          for d,expected in [('good',0),('bad',1)]:
            for p in sorted((root/d).rglob('*.ndjson')):
              name=str(p.relative_to(root/d)).removesuffix('.ndjson')
              def rr(binary):
                with p.open('rb') as f:
                  return subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=120).returncode
              a,b=rr(base),rr(cand)
              rows.append({'test':name,'expected':expected,'base':a,'candidate':b})
          assert len(rows)==193
          changes=[r for r in rows if r['base']!=r['candidate']]
          assert not changes,changes
          out={
            'schema':'nucleus-semantic-contract-graph-v1',
            'base_sha':os.environ['BASE_SHA'],
            'candidate_sha':os.environ['GITHUB_SHA'],
            'verdict_identity':True,
            'cases':len(rows),
            'changes':changes,
            'contract_semantics':'diagnostic-only',
          }
          dest=pathlib.Path('evidence-out/semantic-contract-graph-v1')
          (dest/'result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-semantic-contract-graph-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/semantic-contract-graph-v1
          if-no-files-found: error
