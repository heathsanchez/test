name: Nucleus independent first typed semantic divergence

on:
  push:
    branches: [nucleus-semantic-first-divergence-v1]
    paths:
      - ".github/workflows/nucleus-semantic-first-divergence-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      ARENA_ARTIFACT: "11272848230"
      NUCLEUS_EXPERIMENTAL_RELEVANCE: "1"
      NUCLEUS_EXPERIMENTAL_CONTEXT_BINDER: "1"
      NUCLEUS_EXPERIMENTAL_TYPED_LINEAGE: "1"
      NUCLEUS_EXPERIMENTAL_SUBSTITUTION_RECLOSURE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact source and Rust dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD:metatron-kernel
          rustc --version
          cargo --version
      - name: Reproduce reference checker
        env:
          CARGO_HTTP_TIMEOUT: "120"
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_LOW_SPEED_LIMIT: "0"
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            if cargo fetch --locked --manifest-path metatron-kernel/Cargo.toml; then ok=1; break; fi
            sleep 5
          done
          test "$ok" -eq 1
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus
          sha256sum /tmp/nucleus
      - name: Fetch exact frozen source fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests metatron-kernel/evidence-out/semantic-first-divergence
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
      - name: Capture first typed premises and adversarial control
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib,pathlib,subprocess,sys
          sys.path.insert(0,'.github/scripts')
          from nucleus_succle_separator import extract,false_index
          root=pathlib.Path('/tmp/arena-tests')
          out=pathlib.Path('metatron-kernel/evidence-out/semantic-first-divergence')
          problems=[
              ('init-prelude', ['NUCLEUS_TRACE_PROJECTION_LAST_FAILURE',
                                'NUCLEUS_TRACE_DEPENDENCY_GAP']),
              ('perf/magma-list-pair-n7',['NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE',
                                          'NUCLEUS_TRACE_DEPENDENCY_GAP']),
              ('perf/magma-list-deep-n21',['NUCLEUS_TRACE_NEUTRAL_HEADS',
                                          'NUCLEUS_TRACE_VALUE_MISMATCH']),
              ('perf/fueled-chain',['NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE'])
          ]
          report=[]
          for i,(case,flags) in enumerate(problems):
              fixture=(root/'good'/(case+'.ndjson')).read_bytes()
              env=os.environ.copy()
              env['NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION']='1'
              env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              for flag in flags: env[flag]='1'
              log=out/('trace-%d.log'%i)
              with log.open('wb') as f:
                  p=subprocess.run(['/tmp/nucleus'],input=fixture,
                      stdout=subprocess.DEVNULL,stderr=f,env=env,timeout=120)
              sample=[]
              seen=set()
              with log.open('r',errors='replace') as f:
                  for line in f:
                      if any(x in line for x in (
                          'NUCLEUS_POST_IOTA_PROJECTION_GAP:',
                          'NUCLEUS_DEPENDENCY_GAP:',
                          'NUCLEUS_NEUTRAL_HEAD_MISMATCH:',
                          'NUCLEUS_VALUE_MISMATCH:',
                          'NUCLEUS_APPLICATION_FUNCTION_TYPE:',
                          'NUCLEUS_DOWNSTREAM:'
                      )):
                          kind=line.split('NUCLEUS_',1)[-1].split(':',1)[0]
                          if sum(a['kind']==kind for a in sample)<6:
                              sample.append({'kind':kind,'line':line.strip()[:3200]})
              row={'case':case,'sha256':hashlib.sha256(fixture).hexdigest(),
                   'return_code':p.returncode,'trace_bytes':log.stat().st_size,
                   'trace_sha256':hashlib.sha256(log.read_bytes()).hexdigest(),
                   'events':sample}
              print('NUCLEUS_TYPED_FIRST_DIVERGENCE='+json.dumps(row),flush=True)
              assert p.returncode==2,('baseline drift',case,p.returncode)
              report.append(row)
              if log.stat().st_size>2000000:
                  # Keep hashed full log outside this compressed evidence report.
                  log.write_bytes(log.read_bytes()[:2000000])
          forged=false_index(extract((root/'good/init-prelude.ndjson').read_bytes()))
          assert hashlib.sha256(forged).hexdigest()=='2a090edfcfa2a16191f17a433617aaf045fc9b11cd0e2a93405b705d8a899688'
          f=subprocess.run(['/tmp/nucleus'],input=forged,stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,timeout=120,env=env).returncode
          n=subprocess.run(['/tmp/nucleus'],input=(root/'bad/bugs/nested-unused-param.ndjson').read_bytes(),
              stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=120,env=env).returncode
          assert f in (1,2) and n==1
          (out/'summary.json').write_text(json.dumps({
              'commit':os.environ['GITHUB_SHA'],
              'arena_sha':os.environ['ARENA_SHA'],
              'artifact_id':os.environ['ARENA_ARTIFACT'],
              'cases':report,'protected':{'false_index_rc':f,'nested_rc':n}
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-semantic-first-divergence-${{ github.sha }}
          path: metatron-kernel/evidence-out/semantic-first-divergence
          if-no-files-found: warn
