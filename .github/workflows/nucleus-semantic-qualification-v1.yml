name: Nucleus independent semantic qualification
on:
  push:
    branches: [nucleus-semantic-qualification-v1]
    paths:
      - "metatron-kernel/**"
      - ".github/workflows/nucleus-semantic-qualification-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test only the independent Nucleus source
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-independent-evidence
          git rev-parse HEAD > /tmp/nucleus-independent-evidence/commit.txt
          git rev-parse HEAD:metatron-kernel > /tmp/nucleus-independent-evidence/tree.txt
          NUCLEUS_EXPERIMENTAL_RELEVANCE=1 NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION=1 cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-independent
          sha256sum /tmp/nucleus-independent > /tmp/nucleus-independent-evidence/binary.sha256
      - name: Fetch immutable original protected Arena tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
      - name: Reproduce complete 196 verdict vector without masking errors
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,hashlib,json,collections
          root=pathlib.Path('/tmp/arena-tests')
          rows=[]
          for group in ('good','bad'):
              for p in sorted((root/group).rglob('*.ndjson')):
                  with p.open('rb') as inp:
                      r=subprocess.run(['/tmp/nucleus-independent'],stdin=inp,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=90)
                  rows.append(dict(group=group,case=str(p.relative_to(root)),rc=r.returncode,sha256=hashlib.sha256(p.read_bytes()).hexdigest(),stderr_tail=r.stderr.decode(errors='replace')[-300:]))
          assert len(rows)==196,len(rows)
          bad=[x for x in rows if (x['group']=='bad' and x['rc']==0) or (x['group']=='good' and x['rc']==1) or x['rc'] not in (0,1,2)]
          counts=dict(accept=sum(x['group']=='good' and x['rc']==0 for x in rows),reject=sum(x['group']=='bad' and x['rc']==1 for x in rows),unknown=sum(x['rc']==2 for x in rows),wrong=len(bad))
          print('INDEPENDENT_NUCLEUS_BASELINE='+json.dumps(counts),flush=True)
          (pathlib.Path('/tmp/nucleus-independent-evidence')/'protected196.json').write_text(json.dumps(dict(counts=counts,rows=rows),indent=2))
          assert counts==dict(accept=118,reject=71,unknown=7,wrong=0),counts
          PY
      - name: Preserve all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-nucleus-baseline-${{ github.sha }}
          path: /tmp/nucleus-independent-evidence
          if-no-files-found: warn
