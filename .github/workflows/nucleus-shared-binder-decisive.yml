name: Nucleus shared-binder decisive qualification
on:
  push:
    branches: [research/nucleus-shared-binder-decisive-20261015]
    paths: ['.github/workflows/nucleus-shared-binder-decisive.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build immutable qualified independent checker
        run: |
          set -euo pipefail
          mkdir -p /tmp/receipt
          git rev-parse HEAD:metatron-kernel | tee /tmp/receipt/source-tree.txt
          cargo test --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
      - name: Acquire pinned 196 cases
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/inputs
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/frozen.zip
          sha256sum /tmp/frozen.zip | tee /tmp/receipt/frozen-archive-sha256.txt
          unzip -q /tmp/frozen.zip -d /tmp/a
          tar -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/inputs
      - name: Replay source-scoped Fueled with origin and demand, plus all negatives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess,json,hashlib
          root=pathlib.Path('/tmp/inputs')
          bin='metatron-kernel/target/release/metatron-kernel'
          flags=['RELEVANCE','CONTEXT_BINDER','TYPED_LINEAGE','SUBSTITUTION_RECLOSURE','TYPED_VALUE_NORMALIZATION','PROJECTION_CONTEXT','PROJECTION_CROSSFRAME_512','TYPED_RECEIVER','SOURCE_PAIR_DEPTH8','POLYMORPHIC_PROP_IRREL','PROP_SINGLETON_2P1F','EXPECTED_LAMBDA']
          results={}
          for mode in ('origin','demand'):
              env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
              env.update({'NUCLEUS_EXPERIMENTAL_'+f:'1' for f in flags})
              if mode=='demand':env['NUCLEUS_EXPERIMENTAL_DEMAND_MAJOR']='1'
              env['NUCLEUS_TRACE_DOWNSTREAM']='1'
              rows=[]
              for group in ('good','bad'):
                  for p in sorted((root/group).rglob('*.ndjson')):
                      with p.open('rb') as f:
                          try:
                              r=subprocess.run([bin],stdin=f,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,timeout=180)
                              rc=r.returncode; tail=r.stderr.decode(errors='replace')[-900:]
                          except subprocess.TimeoutExpired:
                              rc=124;tail='TIMEOUT'
                      rows.append({'case':str(p.relative_to(root)),'rc':rc,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'terminal':tail})
              assert len(rows)==196
              wrong=[x for x in rows if (x['case'].startswith('bad/') and x['rc']==0) or (x['case'].startswith('good/') and x['rc']==1)]
              controls=[]
              for name in ('protected-false-index.ndjson','protected-eta-ctor-alias.ndjson'):
                  p=pathlib.Path('metatron-kernel/tests/fixtures')/name
                  with p.open('rb') as f:rc=subprocess.run([bin],stdin=f,env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=90).returncode
                  controls.append({'case':name,'rc':rc})
              counts={'accept':sum(x['rc']==0 for x in rows),'reject':sum(x['rc']==1 for x in rows),'unknown':sum(x['rc']==2 for x in rows),'wrong':len(wrong),'errors':sum(x['rc'] not in (0,1,2) for x in rows)}
              fueled=[x for x in rows if 'fueled' in x['case'].lower()]
              results[mode]={'counts':counts,'fueled':fueled,'controls':controls,'rows':rows}
              print('DECISIVE='+json.dumps({'mode':mode,'counts':counts,'fueled':fueled,'controls':controls}),flush=True)
          pathlib.Path('/tmp/receipt/report.json').write_text(json.dumps(results,indent=2))
          assert all(v['counts']=={'accept':119,'reject':71,'unknown':6,'wrong':0,'errors':0} for v in results.values())
          assert all(all(c['rc'] in (1,2) for c in v['controls']) for v in results.values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-shared-binder-decisive-${{ github.sha }}
          path: /tmp/receipt/
