name: Nucleus checked singleton recursor budget scheduling
on:
  push:
    branches: [research/nucleus-single-recursor-budget-20261022]
    paths:
      - 'metatron-kernel/src/convert.rs'
      - '.github/scripts/nucleus_single_recursor_budget_gate_20261022.py'
      - '.github/workflows/nucleus-single-recursor-budget-20261022.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-source-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Source freeze, independent baseline and exact semantic diff
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-single-rec-evidence /tmp/nucleus-single-rec-portable-pack /tmp/nucleus-single-rec-portable /tmp/nucleus-single-rec-micro
          git rev-parse HEAD > /tmp/nucleus-single-rec-evidence/candidate-research-head.txt
          git fetch --no-tags --depth=1 origin ff003e7fad888d39a40cfd2375885fe20e3209fa
          git worktree add --detach /tmp/nucleus-single-rec-original ff003e7fad888d39a40cfd2375885fe20e3209fa
          test "$(git -C /tmp/nucleus-single-rec-original rev-parse HEAD:metatron-kernel)" = 5e7d65b1b6abc3f6380bc7a37ffb153284d7faf1
          git diff --check ff003e7fad888d39a40cfd2375885fe20e3209fa
          git diff --name-only ff003e7fad888d39a40cfd2375885fe20e3209fa -- metatron-kernel > /tmp/nucleus-single-rec-evidence/changed-semantic-files.txt
          test "$(cat /tmp/nucleus-single-rec-evidence/changed-semantic-files.txt)" = 'metatron-kernel/src/convert.rs' || {
            echo "UNAUTHORIZED_CHECKER_SOURCE_DIFF"; cat /tmp/nucleus-single-rec-evidence/changed-semantic-files.txt; exit 1;
          }
          git diff ff003e7fad888d39a40cfd2375885fe20e3209fa -- metatron-kernel/src/convert.rs > /tmp/nucleus-single-rec-evidence/isolated-source.diff
          rustc -vV > /tmp/nucleus-single-rec-evidence/compiler.txt
      - name: Native Rust qualification and build both source-faithful binaries
        run: |
          set -euo pipefail
          NUCLEUS_EXPERIMENTAL_RELEVANCE=1 NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA=1 \
            cargo test --release --locked --features diagnostics \
            --manifest-path metatron-kernel/Cargo.toml > /tmp/nucleus-single-rec-evidence/native-tests.log 2>&1 || {
              tail -100 /tmp/nucleus-single-rec-evidence/native-tests.log; exit 1;
            }
          CARGO_TARGET_DIR=/tmp/nucleus-single-rec-control-target cargo build --release --locked --features diagnostics \
            --manifest-path /tmp/nucleus-single-rec-original/metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp /tmp/nucleus-single-rec-control-target/release/metatron-kernel /tmp/nucleus-single-rec-base
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-single-rec-candidate
          sha256sum /tmp/nucleus-single-rec-{base,candidate} > /tmp/nucleus-single-rec-evidence/binaries.sha256
      - name: Recover exact original Arena corpus and authentic Lean positive/negative decision exports
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/nucleus-single-rec-original196.zip
          unzip -q /tmp/nucleus-single-rec-original196.zip -d /tmp/nucleus-single-rec-portable-pack
          tar --no-same-owner -xzf /tmp/nucleus-single-rec-portable-pack/lean-arena-tests.tar.gz -C /tmp/nucleus-single-rec-portable
          test -s /tmp/nucleus-single-rec-portable/good/perf/magma-list-pair-n7.ndjson
          gh api repos/heathsanchez/test/actions/artifacts/12336209253/zip > /tmp/nucleus-single-rec-decide-micro.zip
          echo '6727b4ba0de9f4b12642307d1749fcf220047134bfbb6e6a5a789bec092dfaa4  /tmp/nucleus-single-rec-decide-micro.zip' | sha256sum -c -
          unzip -q /tmp/nucleus-single-rec-decide-micro.zip -d /tmp/nucleus-single-rec-micro
          test -s /tmp/nucleus-single-rec-micro/magma-list-pair-n7.ndjson-positive.ndjson
          test -s /tmp/nucleus-single-rec-micro/magma-list-pair-n21.ndjson-negative.ndjson
      - name: Exact source-authorized 196 and four independent original-Boolean proof trials
        run: |
          set -euo pipefail
          python3 .github/scripts/nucleus_single_recursor_budget_gate_20261022.py \
            /tmp/nucleus-single-rec-portable /tmp/nucleus-single-rec-micro \
            /tmp/nucleus-single-rec-base /tmp/nucleus-single-rec-candidate /tmp/nucleus-single-rec-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-single-rec-rec-projection-${{ github.sha }}
          path: /tmp/nucleus-single-rec-evidence/
          if-no-files-found: warn
