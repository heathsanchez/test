name: Nucleus winning stack source-pinned phase hot-profile
on:
  push:
    branches: [research/nucleus-stacked-hot-profile-20261104]
    paths: ['.github/workflows/nucleus-stacked-hot-profile-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-winning-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore exact frozen inputs and previously qualified source reference
        run: |
          set -euo pipefail
          mkdir -p /tmp/current208
          gh api repos/heathsanchez/test/actions/artifacts/13126161718/zip > /tmp/ref-inputs.zip
          printf '%s  %s\n' 462e31e21379054490570b465b46ece4fff878490d9ad7de6bbc73149d587f4c /tmp/ref-inputs.zip | sha256sum -c -
          unzip -q /tmp/ref-inputs.zip -d /tmp/current208
          gh api repos/heathsanchez/test/actions/artifacts/13242401296/zip > /tmp/reference-qualified.zip
          printf '%s  %s\n' 94e80c675907498430bea6f5ce89bfe8eeb40922adf4222f906e3b7267217349 /tmp/reference-qualified.zip | sha256sum -c -
          gh api repos/heathsanchez/test/actions/artifacts/13242616719/zip > /tmp/quotient-frontier.zip
          printf '%s  %s\n' 78183d5b00480e3b3a6bec2346eb07ca99fb268c312d457ebf06df1c8d8722cd /tmp/quotient-frontier.zip | sha256sum -c -
          unzip -p /tmp/quotient-frontier.zip next-frontier.ndjson.zst | zstd -dc -o /tmp/quotient-prefix.ndjson
          printf '%s  %s\n' 4883dc9889b546a1117c25c266bae05a344b6609db5cbbfd846a8d7abc92a907 /tmp/quotient-prefix.ndjson | sha256sum -c -
          gh api repos/heathsanchez/test/actions/artifacts/13255900977/zip > /tmp/owner-qualified.zip
          printf '%s  %s\n' 0d8c169f6695e4e83f4be615b059a617f442b5c31cac976584c200298ffaaf6b /tmp/owner-qualified.zip | sha256sum -c -
          unzip -p /tmp/owner-qualified.zip candidate/nucleus > /tmp/nucleus-owner-baseline
          chmod +x /tmp/nucleus-owner-baseline
      - name: Restore exactly the same complete 6.18GB Mathlib input
        run: |
          set -euo pipefail
          mkdir -p /tmp/mathlib-source
          gh api repos/heathsanchez/test/actions/artifacts/13231986845/zip > /tmp/full-mathlib.zip
          printf '%s  %s\n' 3dd3fbb522816bdaa9d9cd2808196e075bfa27e3d6c82648731140594f87ce2b /tmp/full-mathlib.zip | sha256sum -c -
          unzip -q /tmp/full-mathlib.zip -d /tmp/mathlib-source
          zstd -d /tmp/mathlib-source/mathlib.ndjson.zst -o /tmp/mathlib.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 /tmp/mathlib.ndjson | sha256sum -c -
          rm /tmp/full-mathlib.zip /tmp/mathlib-source/mathlib.ndjson.zst
      - name: Prospectively requalify winning indexed and dense source with observation-only phase clocks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib,json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('experiments/nucleus-quotient-reuse-20261104').resolve()))
          import qualify
          original_materialize=qualify.runner.materialize
          def dense_materialize(out,semantic=True):
              kernel=original_materialize(out,semantic=semantic)
              source=kernel/'src/capability.rs'
              original=source.read_text()
              revised=original
              def swap(old,new,n=1):
                  nonlocal revised
                  assert revised.count(old)==n,(old[:100],revised.count(old),n)
                  revised=revised.replace(old,new)
              dense_impl='\n'.join([
                  '/// Exact per-export memo for the Boolean relevance predicate.',
                  '/// 0 = absent, 1 = false, 2 = true. Sparse/extreme IDs remain sparse.',
                  'struct RelevanceMemo {',
                  '    dense: Vec<u8>,',
                  '    sparse: HashMap<ExprId, bool>,',
                  '}',
                  'impl RelevanceMemo {',
                  '    fn new(export: &ResolvedExport) -> Self {',
                  '        let max_id = export.exprs.iter_raw().map(|(id,_)| id).max().unwrap_or(0);',
                  '        let source_bound = export.exprs.len().saturating_mul(2).min(128_000_000);',
                  '        let max_bound = usize::try_from(max_id).unwrap_or(usize::MAX).saturating_add(1);',
                  '        let dense_len = max_bound.min(source_bound);',
                  '        Self { dense: vec![0u8; dense_len], sparse: HashMap::new() }',
                  '    }',
                  '    fn get(&self, expression: ExprId) -> Option<bool> {',
                  '        if let Ok(index) = usize::try_from(expression.0) {',
                  '            match self.dense.get(index).copied() {',
                  '                Some(1) => return Some(false),',
                  '                Some(2) => return Some(true),',
                  '                _ => {}',
                  '            }',
                  '        }',
                  '        self.sparse.get(&expression).copied()',
                  '    }',
                  '    fn insert(&mut self, expression: ExprId, value: bool) {',
                  '        if let Ok(index) = usize::try_from(expression.0) {',
                  '            if let Some(slot) = self.dense.get_mut(index) {',
                  '                *slot = if value { 2 } else { 1 };',
                  '                return;',
                  '            }',
                  '        }',
                  '        self.sparse.insert(expression, value);',
                  '    }',
                  '}',
                  '#[cfg(test)]',
                  'mod dense_relevance_guards {',
                  '    use super::*;',
                  '    #[test] fn absent_false_true_overwrite_and_extreme_sparse() {',
                  '        let mut memo=RelevanceMemo { dense: vec![0; 3], sparse: HashMap::new() };',
                  '        assert_eq!(memo.get(ExprId(0)),None);',
                  '        memo.insert(ExprId(0),false); memo.insert(ExprId(1),true);',
                  '        assert_eq!(memo.get(ExprId(0)),Some(false));',
                  '        assert_eq!(memo.get(ExprId(1)),Some(true));',
                  '        memo.insert(ExprId(0),true); memo.insert(ExprId(u64::MAX),false);',
                  '        assert_eq!(memo.get(ExprId(0)),Some(true));',
                  '        assert_eq!(memo.get(ExprId(2)),None);',
                  '        assert_eq!(memo.get(ExprId(u64::MAX)),Some(false));',
                  '    }',
                  '}',
                  '',
                  ''])
              swap('fn prop_projection_safety(export: &ResolvedExport) -> Option<Verdict> {',
                   dense_impl+'fn prop_projection_safety(export: &ResolvedExport) -> Option<Verdict> {')
              swap('    let mut relevance = HashMap::<ExprId, bool>::new();',
                   '    let mut relevance = RelevanceMemo::new(export);')
              swap('    memo: &mut HashMap<ExprId, bool>,','    memo: &mut RelevanceMemo,')
              swap('    relevance: &mut HashMap<ExprId, bool>,','    relevance: &mut RelevanceMemo,')
              swap('    if let Some(cached) = memo.get(&expression) {\n        return *cached;\n    }',
                   '    if let Some(cached) = memo.get(expression) {\n        return cached;\n    }')
              swap('    let target_names: HashSet<NameId> = projection_types\n        .into_iter()\n        .filter(|type_name| prop_projection_target(export, *type_name).is_some())\n        .collect();',
                   '    // A source-local immutable target memo: no cached verdict.\n    let target_names: HashMap<NameId, PropProjectionTarget> = projection_types\n        .into_iter()\n        .filter_map(|type_name| prop_projection_target(export, type_name).map(|target| (type_name, target)))\n        .collect();')
              swap('    target_names: &HashSet<NameId>,','    target_names: &HashMap<NameId, PropProjectionTarget>,',n=2)
              swap('target_names.contains(type_name)','target_names.contains_key(type_name)',n=2)
              swap('projection_is_definitely_invalid(export, *type_name, *index, structure_ty)',
                   'projection_is_definitely_invalid(export, *type_name, *index, structure_ty, target_names)')
              swap('    structure_ty: ExprId,\n) -> bool {\n    let Some(target) = prop_projection_target(export, type_name) else {',
                   '    structure_ty: ExprId,\n    target_names: &HashMap<NameId, PropProjectionTarget>,\n) -> bool {\n    let Some(target) = target_names.get(&type_name) else {')
              swap('    let target_names: HashMap<NameId, PropProjectionTarget> = projection_types',
                   '    // Index exact declaration ownership once per source; no foreign memo.\n    let mut source_owner_index=HashMap::<NameId,Vec<usize>>::new();\n    for (declaration_index,declaration) in export.declarations.iter().enumerate() {\n        if let Declaration::Inductive(block)=declaration {\n            for inductive in &block.types {\n                source_owner_index.entry(inductive.name).or_default().push(declaration_index);\n            }\n        }\n    }\n    let target_names: HashMap<NameId, PropProjectionTarget> = projection_types')
              swap('prop_projection_target(export, type_name).map(|target|',
                   'prop_projection_target(export, type_name, &source_owner_index).map(|target|')
              swap('    type_name: NameId,\n) -> Option<PropProjectionTarget> {\n    for declaration in &export.declarations {',
                   '    type_name: NameId,\n    source_owner_index: &HashMap<NameId,Vec<usize>>,\n) -> Option<PropProjectionTarget> {\n    for declaration_index in source_owner_index.get(&type_name)? {\n        let Some(declaration)=export.declarations.get(*declaration_index) else {continue;};')
              swap('    for capability in CAPABILITIES {\n        if let Some(verdict) = (capability.apply)(export) {',
                   '    for capability in CAPABILITIES {\n        let cap_start=std::time::Instant::now();\n        let decision=(capability.apply)(export);\n        if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() { eprintln!("NUCLEUS_HOT_CAP:id={}:ms={:.3}",capability.id,cap_start.elapsed().as_secs_f64()*1000.0); }\n        if let Some(verdict) = decision {')
              swap('fn prop_projection_safety(export: &ResolvedExport) -> Option<Verdict> {',
                   'fn prop_projection_safety(export: &ResolvedExport) -> Option<Verdict> {\n    let prop_start=std::time::Instant::now();')
              swap('    if projection_types.is_empty() {\n        return None;\n    }',
                   '    if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() {eprintln!("NUCLEUS_HOT_PROP:phase=scan:ms={:.3}",prop_start.elapsed().as_secs_f64()*1000.0);}\n    let target_start=std::time::Instant::now();\n    if projection_types.is_empty() {\n        return None;\n    }')
              swap('    if target_names.is_empty() {\n        return None;\n    }',
                   '    if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() {eprintln!("NUCLEUS_HOT_PROP:phase=target:ms={:.3}",target_start.elapsed().as_secs_f64()*1000.0);}\n    let traverse_start=std::time::Instant::now();\n    if target_names.is_empty() {\n        return None;\n    }')
              swap('    None\n}\n\nfn expression_may_contain_target_projection(',
                   '    if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() {eprintln!("NUCLEUS_HOT_PROP:phase=traverse:ms={:.3}",traverse_start.elapsed().as_secs_f64()*1000.0);}\n    None\n}\n\nfn expression_may_contain_target_projection(')
              source.write_text(revised)
              (out/'stacked-index-dense.patch').write_text(''.join(difflib.unified_diff(original.splitlines(True),revised.splitlines(True),fromfile='a/metatron-kernel/src/capability.rs',tofile='b/metatron-kernel/src/capability.rs')))
              lib=kernel/'src/lib.rs'
              lib_before=lib.read_text()
              start=lib_before.index('/// Check one Arena export stream.\n')
              end=lib_before.index('/// Run with deterministic operation counters.',start)
              lib_run='''/// Check one Arena export stream; phase clocks only observe.
          pub fn run<R: BufRead>(reader: R) -> Verdict {
              let start = std::time::Instant::now();
              let parsed = parse(reader);
              let parsed_at = start.elapsed();
              let resolved = parsed.and_then(|export| export.resolve());
              let resolved_at = start.elapsed();
              let verdict = match resolved {
                  Ok(export) => check_export(export, Limits::default()),
                  Err(error) => {
                      if std::env::var_os("NUCLEUS_TRACE_PARSE_ERROR").is_some() {
                          eprintln!("NUCLEUS_PARSE_ERROR: {error}");
                      }
                      Verdict::Error
                  }
              };
              let checked_at = start.elapsed();
              if std::env::var_os("NUCLEUS_TRACE_PHASES").is_some() {
                  eprintln!("NUCLEUS_HOT_TOTAL:parse_ms={:.3}:resolve_ms={:.3}:check_ms={:.3}:total_ms={:.3}",
                      parsed_at.as_secs_f64()*1000.0,
                      (resolved_at-parsed_at).as_secs_f64()*1000.0,
                      (checked_at-resolved_at).as_secs_f64()*1000.0,
                      checked_at.as_secs_f64()*1000.0);
              }
              verdict
          }

          '''
              lib_after=lib_before[:start]+lib_run+lib_before[end:]
              lib.write_text(lib_after)
              (out/'stacked-hot-lib.patch').write_text(''.join(difflib.unified_diff(lib_before.splitlines(True),lib_after.splitlines(True),fromfile='a/metatron-kernel/src/lib.rs',tofile='b/metatron-kernel/src/lib.rs')))
              return kernel
          qualify.runner.materialize=dense_materialize
          drop={"PROJECTION_CONTEXT","PROJECTION_CROSSFRAME_512","TYPED_RECEIVER","SOURCE_PAIR_DEPTH8","PROP_SINGLETON_2P1F","EXPECTED_LAMBDA","TYPED_DATA_CONGRUENCE","REPLAY_PROJECTION_MAJOR","REPLAY_NEUTRAL_PROJECTION"}
          original=qualify.t.FLAGS
          assert drop.issubset(original)
          qualify.t.FLAGS=tuple(f for f in original if f not in drop)
          out=Path('/tmp/nucleus-stacked-hot-profile')
          qualify.do_qualification(out,Path('/tmp/mathlib.ndjson'),include_exact=False)
          (out/'prune-plan.json').write_text(json.dumps(dict(disabled=sorted(drop),original=original,enabled=qualify.t.FLAGS),indent=2)+'\n')
          PY
      - name: Cold complete Mathlib phase profile on previously qualified fast representation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,sys
          from pathlib import Path
          root=Path('/tmp/nucleus-stacked-hot-profile')
          sys.path.insert(0,str(Path('experiments/nucleus-reuse-20261104').resolve()))
          import tournament as t
          source=Path('/tmp/mathlib.ndjson')
          assert t.digest(source)==t.INPUT_SHA
          candidate_binary=root/'candidate/nucleus'
          assert candidate_binary.is_file()
          drop={"PROJECTION_CONTEXT","PROJECTION_CROSSFRAME_512","TYPED_RECEIVER","SOURCE_PAIR_DEPTH8","PROP_SINGLETON_2P1F","EXPECTED_LAMBDA","TYPED_DATA_CONGRUENCE","REPLAY_PROJECTION_MAJOR","REPLAY_NEUTRAL_PROJECTION"}
          env={k:v for k,v in t.run_env().items() if k not in {'NUCLEUS_EXPERIMENTAL_'+f for f in drop}}
          env.update(NUCLEUS_EXPERIMENTAL_CERTIFIED_QUOT_IOTA='1',NUCLEUS_EXPERIMENTAL_SOURCE_PROOF_IRREL='1',NUCLEUS_TRACE_DOWNSTREAM='1',NUCLEUS_TRACE_PHASES='1')
          directory=root/'profile'
          measurement=t.measure(candidate_binary,source,env,directory,timeout=600,perf=False)
          log=(directory/'stderr').read_text()
          traces=[line for line in log.splitlines() if line.startswith('NUCLEUS_DOWNSTREAM:')]
          terminal=traces[-1] if traces else ''
          assert measurement['rc']==2 and '_private.Init.Data.Nat.Lemmas.0.Nat.right_eq_add._proof_1_1' in terminal
          totals={key:float(value) for key,value in re.findall(r'(parse_ms|resolve_ms|check_ms|total_ms)=([\d.]+)',next(x for x in log.splitlines() if x.startswith('NUCLEUS_HOT_TOTAL:')))}
          capabilities={key:float(value) for key,value in re.findall(r'NUCLEUS_HOT_CAP:id=([^:]+):ms=([\d.]+)',log)}
          prop={key:float(value) for key,value in re.findall(r'NUCLEUS_HOT_PROP:phase=([^:]+):ms=([\d.]+)',log)}
          assert len(capabilities)==6 and set(prop)=={'scan','target','traverse'},(capabilities,prop)
          result=dict(measurement=measurement,totals_ms=totals,capabilities_ms=capabilities,prop_ms=prop,terminal=terminal,source_sha=t.INPUT_SHA,
                      note='Observation-only clocks on qualified stacked source; one complete cold source run; no performance superiority or Mathlib ACCEPT claim')
          (root/'hot-phase-summary.json').write_text(json.dumps(result,indent=2)+'\n')
          print('HOT_PROFILE',json.dumps(result),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-stacked-hot-profile-${{ github.sha }}
          path: |
            /tmp/nucleus-stacked-hot-profile/*.json
            /tmp/nucleus-stacked-hot-profile/*.patch
            /tmp/nucleus-stacked-hot-profile/candidate/*.json
            /tmp/nucleus-stacked-hot-profile/candidate/*.log
            /tmp/nucleus-stacked-hot-profile/candidate/*.patch
            /tmp/nucleus-stacked-hot-profile/candidate/nucleus
            /tmp/nucleus-stacked-hot-profile/controls/*.stderr
            /tmp/nucleus-stacked-hot-profile/profile/time.txt
            /tmp/nucleus-stacked-hot-profile/profile/stderr
