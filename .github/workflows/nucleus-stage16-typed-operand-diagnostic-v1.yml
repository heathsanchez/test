name: Nucleus typed operand diagnostic
on:
  push:
    branches: [codex/nucleus-stage16-diagnostic-repair]
    paths:
      - ".github/workflows/nucleus-stage16-typed-operand-diagnostic-v1.yml"
      - ".github/scripts/nucleus_stage16_typed_operand_patch_v1.py"
      - ".github/scripts/nucleus_field_premise_trace_patch_v1.py"
      - ".github/scripts/nucleus_argument_premise_triad_patch_v1.py"
      - ".github/scripts/nucleus_stage16_environment_separator_v1.py"
      - ".github/scripts/nucleus_stage16_typed_operand_patch_v1.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-operand:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Source-bound diagnostic only
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-stage16
          python3 .github/scripts/nucleus_contextual_capability_patch_v1.py metatron-kernel
          python3 .github/scripts/nucleus_field_application_patch_v1.py metatron-kernel
          python3 .github/scripts/nucleus_field_premise_trace_patch_v1.py metatron-kernel
          python3 .github/scripts/nucleus_argument_premise_triad_patch_v1.py metatron-kernel
          python3 .github/scripts/nucleus_stage16_typed_operand_patch_v1.py metatron-kernel
          python3 .github/scripts/nucleus_stage16_environment_separator_v1.py metatron-kernel
          git diff --check
          git diff -- metatron-kernel/src/typecheck.rs > /tmp/nucleus-stage16/diagnostic.patch
          NUCLEUS_EXPERIMENTAL_RELEVANCE=1 NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION=1 cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-stage16/checker
      - name: Acquire exact protected source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-stage16/arena /tmp/nucleus-stage16/archive
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/nucleus-stage16/source.zip
          unzip -q /tmp/nucleus-stage16/source.zip -d /tmp/nucleus-stage16/archive
          tar --no-same-owner -xzf /tmp/nucleus-stage16/archive/lean-arena-tests.tar.gz -C /tmp/nucleus-stage16/arena
      - name: Reproduce source-typed stage16 without changing verdict
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess,hashlib,json
          p=pathlib.Path('/tmp/nucleus-stage16/arena/good/init-prelude.ndjson')
          with p.open('rb') as f:
              r=subprocess.run(['/tmp/nucleus-stage16/checker'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=180,env=os.environ|{'NUCLEUS_EXPERIMENTAL_RELEVANCE':'1','NUCLEUS_EXPERIMENTAL_CONTEXT_BINDER':'1','NUCLEUS_EXPERIMENTAL_TYPED_LINEAGE':'1','NUCLEUS_EXPERIMENTAL_SUBSTITUTION_RECLOSURE':'1','NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION':'1','NUCLEUS_EXPERIMENTAL_CERTIFIED_FIELD_APPLICATION':'1','NUCLEUS_TRACE_FIELD_APP_FIRST_FAIL':'1','NUCLEUS_TRACE_STAGE16_TYPED_OPERAND':'1','NUCLEUS_TRACE_STAGE16_ENV_SEPARATOR':'1','NUCLEUS_TRACE_STAGE16_CONVERSION_OUTCOME':'1'})
          logs=r.stderr.decode(errors='replace').splitlines()
          observations=[x for x in logs if x.startswith('NUCLEUS_STAGE16_TYPED_OPERAND:')]
          env_observations=[x for x in logs if x.startswith('NUCLEUS_STAGE16_ENV_SEPARATOR:')]
          conversion_observations=[x for x in logs if x.startswith('NUCLEUS_STAGE16_CONVERSION_OUTCOME:')]
          source_context_observations=[x for x in logs if x.startswith('NUCLEUS_STAGE16_SOURCE_CONTEXT:')]
          whnf_observations=[x for x in logs if x.startswith('NUCLEUS_STAGE16_WHNF:')]
          assert r.returncode==2,r.returncode
          assert observations, 'NO_STAGE16_OBSERVATIONS'
          assert env_observations, 'NO_ENV_SEPARATOR_OBSERVATIONS'
          assert conversion_observations, 'NO_CONVERSION_OUTCOME_OBSERVATIONS'
          assert source_context_observations, 'NO_SOURCE_CONTEXT_OBSERVATIONS'
          assert whnf_observations, 'NO_WHNF_OBSERVATIONS'
          report={'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'verdict':r.returncode,'observations':observations[:8],'env_observations':env_observations[:8],'conversion_observations':conversion_observations[:8],'source_context_observations':source_context_observations[:8],'whnf_observations':whnf_observations[:8]}
          print('NUCLEUS_STAGE16_TYPED_REPORT='+json.dumps(report),flush=True)
          pathlib.Path('/tmp/nucleus-stage16/report.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Capture the same source-context boundary across all seven residuals
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess,hashlib,json
          seven=['init-prelude','perf/grind-ring-5','perf/magma-list-pair-n7',
                 'perf/magma-list-pair-n21','perf/magma-list-deep-n21',
                 'perf/magma-list-deep-n36','perf/fueled-chain']
          flags=['NUCLEUS_EXPERIMENTAL_RELEVANCE','NUCLEUS_EXPERIMENTAL_CONTEXT_BINDER',
                 'NUCLEUS_EXPERIMENTAL_TYPED_LINEAGE','NUCLEUS_EXPERIMENTAL_SUBSTITUTION_RECLOSURE',
                 'NUCLEUS_EXPERIMENTAL_TYPED_VALUE_NORMALIZATION','NUCLEUS_EXPERIMENTAL_CERTIFIED_FIELD_APPLICATION',
                 'NUCLEUS_TRACE_FIELD_APP_FIRST_FAIL','NUCLEUS_TRACE_STAGE16_TYPED_OPERAND',
                 'NUCLEUS_TRACE_STAGE16_ENV_SEPARATOR','NUCLEUS_TRACE_STAGE16_CONVERSION_OUTCOME']
          prefixes=['NUCLEUS_STAGE16_TYPED_OPERAND:','NUCLEUS_STAGE16_SOURCE_CONTEXT:',
                    'NUCLEUS_STAGE16_WHNF:','NUCLEUS_STAGE16_CONVERSION_OUTCOME:',
                    'NUCLEUS_FIELD_APP_FIRST_FAIL:']
          rows=[]
          for name in seven:
              p=pathlib.Path('/tmp/nucleus-stage16/arena/good')/(name+'.ndjson')
              with p.open('rb') as f:
                  r=subprocess.run(['/tmp/nucleus-stage16/checker'],stdin=f,stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,timeout=180,env=os.environ|dict.fromkeys(flags,'1'))
              logs=r.stderr.decode(errors='replace').splitlines()
              row={'case':name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'verdict':r.returncode,
                   'observations':{prefix:[x for x in logs if x.startswith(prefix)][:8] for prefix in prefixes}}
              rows.append(row)
              print('SEVEN_STAGE16_CASE='+json.dumps({'case':name,'verdict':r.returncode,
                    'witness_counts':{k:len(v) for k,v in row['observations'].items()}}),flush=True)
          pathlib.Path('/tmp/nucleus-stage16/seven.json').write_text(json.dumps(rows,indent=2))
          assert all(row['verdict']==2 for row in rows), 'DIAGNOSTIC_VERDICT_CHANGED'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-stage16-typed-operand-${{ github.sha }}
          path: |
            /tmp/nucleus-stage16/report.json
            /tmp/nucleus-stage16/seven.json
          if-no-files-found: warn
