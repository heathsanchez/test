name: Nucleus exact staged recursor iota A/B
on:
  push:
    branches: [research/nucleus-staged-recursor-20261022]
    paths:
      - 'metatron-kernel/src/machine.rs'
      - '.github/scripts/nucleus_staged_recursor_gate_20261022.py'
      - '.github/workflows/nucleus-staged-recursor-20261022.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-valid-staged-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Freeze exact original independent source and candidate code changes
        run: |
          set -euo pipefail
          mkdir -p /tmp/nucleus-staged-evidence /tmp/nucleus-staged-pack /tmp/nucleus-staged-frozen /tmp/nucleus-staged-micro
          git rev-parse HEAD > /tmp/nucleus-staged-evidence/candidate-source-sha.txt
          git fetch --no-tags --depth=1 origin ff003e7fad888d39a40cfd2375885fe20e3209fa
          git worktree add --detach /tmp/nucleus-staged-original ff003e7fad888d39a40cfd2375885fe20e3209fa
          test "$(git -C /tmp/nucleus-staged-original rev-parse HEAD:metatron-kernel)" = 5e7d65b1b6abc3f6380bc7a37ffb153284d7faf1
          git diff --check ff003e7fad888d39a40cfd2375885fe20e3209fa
          git diff --name-only ff003e7fad888d39a40cfd2375885fe20e3209fa -- metatron-kernel > /tmp/nucleus-staged-evidence/changed-native-source.txt
          test "$(cat /tmp/nucleus-staged-evidence/changed-native-source.txt)" = 'metatron-kernel/src/machine.rs'
          git diff ff003e7fad888d39a40cfd2375885fe20e3209fa -- metatron-kernel/src/machine.rs > /tmp/nucleus-staged-evidence/source.diff
          rustc -vV > /tmp/nucleus-staged-evidence/compiler.txt
      - name: Run native Rust tests and build both unchanged and staged source
        run: |
          set -euo pipefail
          NUCLEUS_EXPERIMENTAL_RELEVANCE=1 NUCLEUS_EXPERIMENTAL_EXPECTED_LAMBDA=1 \
            cargo test --release --locked --features diagnostics \
              --manifest-path metatron-kernel/Cargo.toml > /tmp/nucleus-staged-evidence/rust-tests.log 2>&1 || {
                tail -100 /tmp/nucleus-staged-evidence/rust-tests.log; exit 1;
              }
          CARGO_TARGET_DIR=/tmp/nucleus-staged-original-target \
            cargo build --release --locked --features diagnostics \
              --manifest-path /tmp/nucleus-staged-original/metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
          cp /tmp/nucleus-staged-original-target/release/metatron-kernel /tmp/nucleus-staged-original-bin
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-staged-candidate-bin
          sha256sum /tmp/nucleus-staged-{original,candidate}-bin > /tmp/nucleus-staged-evidence/binaries.sha256
      - name: Recover byte-identical reference proof and false-proof control exports
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/12336209253/zip > /tmp/nucleus-staged-micro.zip
          echo '6727b4ba0de9f4b12642307d1749fcf220047134bfbb6e6a5a789bec092dfaa4  /tmp/nucleus-staged-micro.zip' | sha256sum -c -
          unzip -q /tmp/nucleus-staged-micro.zip -d /tmp/nucleus-staged-micro
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/nucleus-staged-frozen.zip
          sha256sum /tmp/nucleus-staged-frozen.zip > /tmp/nucleus-staged-evidence/frozen-archive.sha256
          unzip -q /tmp/nucleus-staged-frozen.zip -d /tmp/nucleus-staged-pack
          tar --no-same-owner -xzf /tmp/nucleus-staged-pack/lean-arena-tests.tar.gz -C /tmp/nucleus-staged-frozen
      - name: Exact source A/B and protected frozen196 verdicts, no unchecked proof acceptance
        run: |
          set -euo pipefail
          python3 .github/scripts/nucleus_staged_recursor_gate_20261022.py \
            /tmp/nucleus-staged-frozen /tmp/nucleus-staged-micro \
            /tmp/nucleus-staged-original-bin /tmp/nucleus-staged-candidate-bin \
            /tmp/nucleus-staged-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-staged-recursor-${{ github.sha }}
          path: /tmp/nucleus-staged-evidence/
          if-no-files-found: warn
