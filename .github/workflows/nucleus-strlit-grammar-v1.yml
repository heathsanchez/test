name: Nucleus String Literal Grammar v1

on:
  push:
    branches: [nucleus-semantic-closure-strlit-v1]
    paths:
      - ".github/workflows/nucleus-strlit-grammar-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-semantic-closure-strlit-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 653e9d3270f9f02ca141c45d3078e9d59f622a72
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify source
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked

      - name: Build exact NatLit oracle
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch frozen official Arena tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/10712869614/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Qualify grammar-only string literal progress
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/strlit
          python - <<'PY'
          import json,pathlib,subprocess,os
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]
          for d,expected in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  def run(binary,trace=False):
                      env=dict(os.environ)
                      if trace: env['NUCLEUS_TRACE_PARSE_ERROR']='1'
                      with p.open('rb') as f:
                          q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,env=env)
                      return q.returncode,q.stderr.decode(errors='replace')[-500:]
                  a,_=run(base)
                  b,err=run(cand,True)
                  rows.append({'test':name,'expected':expected,'base':a,'candidate':b,'stderr_tail':err})
          init=next(r for r in rows if r['test']=='init-prelude')
          assert init['base']==3,init
          assert init['candidate']!=3,init
          false_accepts=[r for r in rows if r['expected']==1 and r['candidate']==0]
          assert not false_accepts,false_accepts
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate'] not in (r['base'],2)]
          assert not regressions,regressions
          changes=[r for r in rows if r['base']!=r['candidate']]
          out={'schema':'nucleus-strlit-grammar-v1','base_sha':os.environ['BASE_SHA'],
               'candidate_sha':os.environ['GITHUB_SHA'],'init_prelude':init,
               'changes':changes,'false_accepts':false_accepts,'regressions':regressions,
               'counts':{'rows':len(rows),'changes':len(changes),
                         'candidate_error':sum(r['candidate']==3 for r in rows),
                         'candidate_decline':sum(r['candidate']==2 for r in rows),
                         'candidate_accept':sum(r['candidate']==0 for r in rows),
                         'candidate_reject':sum(r['candidate']==1 for r in rows)}}
          pathlib.Path('evidence-out/strlit/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Measure init-prelude after string grammar
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          set +e
          NUCLEUS_TRACE_PARSE_ERROR=1 /usr/bin/time -f 'real_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M'             -o evidence-out/strlit/init-prelude-time.txt             target/release/metatron-kernel             < /tmp/tests/good/init-prelude.ndjson             > evidence-out/strlit/init-prelude-stdout.txt             2> evidence-out/strlit/init-prelude-stderr.txt
          rc=$?
          set -e
          echo "$rc" > evidence-out/strlit/init-prelude-exit.txt
          echo "INIT_PRELUDE_RC=$rc"
          cat evidence-out/strlit/init-prelude-time.txt
          cat evidence-out/strlit/init-prelude-stderr.txt
          test "$rc" -ne 3

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-strlit-grammar-${{ github.sha }}
          path: metatron-kernel/evidence-out/strlit
          if-no-files-found: warn
