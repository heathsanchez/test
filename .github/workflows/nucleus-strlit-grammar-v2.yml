name: Nucleus String Literal Grammar v2

on:
  push:
    branches: [nucleus-strlit-grammar-v2]
    paths:
      - ".github/workflows/nucleus-strlit-grammar-v2.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: 20e8e98f6f1b86dcd437cb6f1e5ed3bd61a19302
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - name: Build and test candidate
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked
      - name: Build exact 51-case base
        run: |
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml
      - name: Fetch corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Global parser reclosure
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/strlit-v2
          python - <<'PY'
          import json,pathlib,subprocess,os
          root=pathlib.Path('/tmp/tests'); base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel'); cand=pathlib.Path('target/release/metatron-kernel').resolve()
          rows=[]
          for d,e in [('good',0),('bad',1)]:
            for p in sorted((root/d).rglob('*.ndjson')):
              name=str(p.relative_to(root/d)).removesuffix('.ndjson')
              def rr(b):
                with p.open('rb') as f:return subprocess.run([str(b)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
              a,b=rr(base),rr(cand); rows.append({'test':name,'expected':e,'base':a,'candidate':b})
          assert len(rows)==193
          fa=[r for r in rows if r['expected']==1 and r['candidate']==0]; fr=[r for r in rows if r['expected']==0 and r['candidate']==1]
          reg=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          wrong=[r for r in rows if r['base'] in (2,3) and r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          assert not fa and not fr and not reg and not wrong,(fa,fr,reg,wrong)
          targets=['init-prelude','perf/grind-ring-5','perf/magma-list-deep-n21','perf/magma-list-deep-n36']
          by={r['test']:r for r in rows}
          for n in targets:
            assert by[n]['base']==3 and by[n]['candidate']==2,by[n]
          out={'schema':'nucleus-strlit-grammar-v2','base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['GITHUB_SHA'],
               'changes':[r for r in rows if r['base']!=r['candidate']],
               'base_errors':sum(r['base']==3 for r in rows),'candidate_errors':sum(r['candidate']==3 for r in rows),
               'base_residual':sum(r['base'] in (2,3) for r in rows),'candidate_residual':sum(r['candidate'] in (2,3) for r in rows)}
          pathlib.Path('evidence-out/strlit-v2/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-strlit-v2-${{ github.sha }}
          path: metatron-kernel/evidence-out/strlit-v2
          if-no-files-found: warn
