name: Nucleus source-prefix structural inquiry DIAGNOSTIC ONLY
on:
  push:
    branches: [research/nucleus-obligation-census-20261107]
    paths: ['.github/workflows/nucleus-structural-inquiry-20261107.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  census:
    strategy:
      fail-fast: false
      matrix: {scope: [mathlib]}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - name: Restore exact qualified source and reviewed diagnostic-only patch
        run: |
          set -euo pipefail
          mkdir -p base candidate reports original196 arena207
          gh api repos/heathsanchez/test/actions/artifacts/13493335083/zip > base.zip
          printf '%s  %s\n' d7f860e0f4af0360f40359dbe3ec284991d62775e74f2d2ac0aeb62792e636ea base.zip | sha256sum -c -
          unzip -q base.zip -d base
          tar --no-same-owner -xzf base/candidate/source.tar.gz
          cp base/flags.json flags.json
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-obligation-census-20261107/qualified-diagnostics.patch
          patch --fuzz=0 -p1 -d metatron-kernel < experiments/nucleus-structural-inquiry-20261107/structural-observer.patch
          find metatron-kernel/src -type f -print0 | sort -z | xargs -0 sha256sum > reports/source.sha256
          cargo check --manifest-path metatron-kernel/Cargo.toml --locked --all-targets > reports/plain-build.log 2>&1
      - name: Native suite and all authoritative targets unchanged
        if: matrix.scope == 'six'
        run: |
          set -euo pipefail
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' flags.json)
          env "${flags[@]}" cargo test --manifest-path metatron-kernel/Cargo.toml --locked --features diagnostics > reports/native.log 2>&1
      - name: Build separate census and ordinary executables
        run: |
          set -euo pipefail
          cargo build --manifest-path metatron-kernel/Cargo.toml --locked --release --features diagnostics
          cp metatron-kernel/target/release/{metatron-kernel,nucleus-census} candidate/
          sha256sum candidate/* > reports/binaries.sha256
          tar --exclude=target -czf candidate/source.tar.gz metatron-kernel
      - name: Both complete corpora parity and six source-assumption censuses
        if: matrix.scope == 'six'
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > original196.zip
          printf '%s  %s\n' f6cd590db7f6fb92b8d1b3ca87231d4b0f521f085d73f93abd005f5caaff86d2 original196.zip | sha256sum -c -
          unzip -p original196.zip lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C original196
          gh api repos/heathsanchez/test/actions/artifacts/13276400289/zip > arena207.zip
          printf '%s  %s\n' a9582eadc0d9893cbe39e6bcfccd79bfaec2032838851b8a487c35df16096763 arena207.zip | sha256sum -c -
          unzip -p arena207.zip lean-arena-tests.tar.gz | tar --no-same-owner -xzf - -C arena207
          python experiments/nucleus-obligation-census-20261107/qualify.py normal
          python experiments/nucleus-obligation-census-20261107/qualify.py six
          python experiments/nucleus-obligation-census-20261107/probe_qualified.py
      - name: Exact full Mathlib source with bounded post-failure census
        if: matrix.scope == 'mathlib'
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/13377771876/zip > full-mathlib-evidence.zip
          printf '%s  %s\n' 699da072ffc367c84cc168d7e1c7eec48e6572c6316ac33d43cc17944816cf65 full-mathlib-evidence.zip | sha256sum -c -
          unzip -p full-mathlib-evidence.zip mathlib-full.ndjson.zst | zstd -dc > mathlib-full.ndjson
          printf '%s  %s\n' 22c5de83469408950005589a3bc5ef5157c65549b5a802f85d567c29151306a6 mathlib-full.ndjson | sha256sum -c -
          python experiments/nucleus-structural-inquiry-20261107/extract_prefix.py
          NUCLEUS_DIAGNOSTIC_STRUCTURAL_OWNER=LinearMap NUCLEUS_TRACE_GENERIC_NONREC=1 python experiments/nucleus-obligation-census-20261107/qualify.py mathlib
          gzip -dc reports/mathlib-through-LinearMap.ndjson.gz > prefix.ndjson
          set +e
          mapfile -t flags < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' flags.json)
          env "${flags[@]}" NUCLEUS_DIAGNOSTIC_STRUCTURAL_OWNER=LinearMap NUCLEUS_TRACE_GENERIC_NONREC=1 candidate/nucleus-census --source-assumptions-only 262144 64 256 < prefix.ndjson > reports/prefix-census.json 2> reports/prefix-census.stderr
          result=$?
          set -e
          test "$result" = 2
          python - <<'PYCODE'
          import json
          a=json.load(open('reports/mathlib-census.json'));b=json.load(open('reports/prefix-census.json'))
          for report in (a,b):
              assert report['stopping_declaration'] is not None
              assert report['stopping_declaration']['name']=='LinearMap'
              assert report['stopping_declaration']['declaration_index']==4851
              assert report['stopping_declaration']['stage']=='inductive'
              assert report['stop_reason']=='unsupported-metadata-or-structural-obligation'
              assert report['visited_declarations']==4852
              assert report['finished_all_declarations'] is False
          assert a['stopping_declaration']==b['stopping_declaration']
          assert a['failures']==b['failures']
          assert b['total_declarations']==4852
          print('PREFIX_REPRODUCES_FULL_SOURCE_FRONTIER')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-structural-inquiry-DIAGNOSTIC-ONLY
          retention-days: 60
          path: |
            reports/
            candidate/
            flags.json
