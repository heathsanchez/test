name: Nucleus Crystal App Residual v1

on:
  push:
    branches: [nucleus-crystal-app-residual-v1]
    paths:
      - ".github/workflows/nucleus-structure-natle-reclosure-v1.yml"
      - "metatron-kernel/src/checker.rs"
      - "metatron-kernel/src/typecheck.rs"
      - "metatron-kernel/src/convert.rs"
      - "metatron-kernel/src/machine.rs"
      - "metatron-kernel/src/environment.rs"
      - "metatron-kernel/src/level.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reclose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARENA_ARTIFACT: 10712869614
      BASE_SHA: aa430901d51f54a3926741bab3a32cac363dc251

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build candidate
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo build --release --locked

      - name: Build exact independent base
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml

      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193

      - name: Reclose and trace next interface
        env:
          NUCLEUS_TRACE_SINGLE_FIELD: "1"
          NUCLEUS_TRACE_DOWNSTREAM: "1"
          NUCLEUS_TRACE_IMAX: "1"
          NUCLEUS_TRACE_CRYSTAL_APP_RESIDUAL: "1"
          NUCLEUS_TRACE_CRYSTAL_NEUTRAL_HEAD: "1"
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/structure-natle-reclosure-v1
          python - <<'PY'
          import json, pathlib, subprocess, os
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()

          def rr(binary,p,trace=False):
              env=os.environ.copy()
              if not trace:
                  env.pop('NUCLEUS_TRACE_SINGLE_FIELD',None)
                  env.pop('NUCLEUS_TRACE_DOWNSTREAM',None)
                  env.pop('NUCLEUS_TRACE_IMAX',None)
                  env.pop('NUCLEUS_TRACE_CRYSTAL_APP_RESIDUAL',None)
                  env.pop('NUCLEUS_TRACE_CRYSTAL_NEUTRAL_HEAD',None)
              try:
                  with p.open('rb') as f:
                      q=subprocess.run(
                          [str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                          stderr=subprocess.PIPE,timeout=180,env=env
                      )
                  return q.returncode,q.stderr.decode(errors='replace')
              except subprocess.TimeoutExpired:
                  return 124,'timeout'

          rows=[]
          for kind,expected in [('good',0),('bad',1)]:
              for p in sorted((root/kind).rglob('*.ndjson')):
                  name=str(p.relative_to(root/kind)).removesuffix('.ndjson')
                  a,_=rr(base,p,False)
                  b,_=rr(cand,p,False)
                  rows.append({'test':name,'expected':expected,'base':a,'candidate':b})

          assert len(rows)==193
          assert sum(r['base'] in (2,3) for r in rows)==40
          wrong=[r for r in rows if r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          errors=[r for r in rows if r['candidate'] not in (0,1,2,3)]
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]
          changes=[r for r in rows if r['base']!=r['candidate']]
          assert not wrong, wrong
          assert not regressions, regressions
          assert not errors, errors
          assert earned, "Crystal candidate earned no terminal consequence"
          assert sum(r['candidate'] in (2,3) for r in rows) < 40, "residual did not shrink"

          targets=[
            ('good','perf/magma-list-deep-n21',0),
            ('good','perf/magma-list-deep-n36',0),
            ('bad','bugs/proj-of-stuck-prop',1),
            ('bad','bugs/proj-of-subst-prop',1),
            ('bad','bugs/rec-of-subst-prop',1),
          ]
          traces=[]
          for kind,name,expected in targets:
              p=root/kind/(name+'.ndjson')
              rc,stderr=rr(cand,p,True)
              marks=[
                  line for line in stderr.splitlines()
                  if 'NUCLEUS_SINGLE_FIELD:' in line or 'NUCLEUS_DOWNSTREAM:' in line or 'NUCLEUS_IMAX ' in line or 'NUCLEUS_CRYSTAL_APP_RESIDUAL:' in line or 'NUCLEUS_CRYSTAL_NEUTRAL_HEAD:' in line
              ]
              traces.append({'test':name,'expected':expected,'rc':rc,'marks':marks})

          out={
              'schema':'nucleus-structure-natle-reclosure-v1',
              'base_sha':os.environ['BASE_SHA'],
              'candidate_sha':os.environ['GITHUB_SHA'],
              'base_residual':sum(r['base'] in (2,3) for r in rows),
              'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
              'candidate_accept':sum(r['candidate']==0 for r in rows),
              'candidate_reject':sum(r['candidate']==1 for r in rows),
              'earned':[r['test'] for r in earned],
              'changes':changes,
              'traces':traces,
          }
          pathlib.Path(
              'metatron-kernel/evidence-out/structure-natle-reclosure-v1/result.json'
          ).write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          # Fin source census: representation only, zero semantic authority.
          def name_table(p):
              names={}
              records=[]
              for raw in p.read_text().splitlines():
                  try:o=json.loads(raw)
                  except Exception:continue
                  records.append(o)
                  if isinstance(o.get('in'),int):
                      if 'str' in o:names[o['in']]=(o['str']['pre'],o['str']['str'])
                      elif 'num' in o:names[o['in']]=(o['num']['pre'],str(o['num']['i']))
              def full(i):
                  parts=[];seen=set()
                  while i in names and i not in seen:
                      seen.add(i);pre,part=names[i];parts.append(part);i=pre
                  return '.'.join(reversed(parts))
              return records,full
          # Exact Fin telescope decoder: recursively retain only the reachable
          # expression graph for type / constructor / recursor / rule.
          def expr_map(p):
              m={}
              for raw in p.read_text().splitlines():
                  try:o=json.loads(raw)
                  except Exception:continue
                  if isinstance(o.get('ie'),int): m[o['ie']]=o
              return m
          def children(o):
              out=[]
              for key in ('app','forallE','lam','letE','proj'):
                  v=o.get(key)
                  if not isinstance(v,dict): continue
                  for k in ('fn','arg','type','body','value','struct'):
                      if isinstance(v.get(k),int): out.append(v[k])
              return out
          fin_exact=[]
          for kind,name,_ in targets[:2]:
              p=root/kind/(name+'.ndjson')
              records,full=name_table(p)
              em=expr_map(p)
              fin_decl=next(o['inductive'] for o in records if 'inductive' in o and any(full(t['name'])=='Fin' for t in o['inductive']['types']))
              typ=next(t for t in fin_decl['types'] if full(t['name'])=='Fin')
              ctor=next(c for c in fin_decl['ctors'] if full(c['name'])=='Fin.mk')
              rec=next(x for x in fin_decl['recs'] if full(x['name'])=='Fin.rec')
              roots=[typ['type'],ctor['type'],rec['type'],rec['rules'][0]['rhs']]
              seen=set(); stack=list(roots)
              while stack:
                  eid=stack.pop()
                  if eid in seen or eid not in em: continue
                  seen.add(eid); stack.extend(children(em[eid]))
              fin_exact.append({'test':name,'roots':roots,'exprs':{str(i):em[i] for i in sorted(seen)}})
          pathlib.Path('metatron-kernel/evidence-out/structure-natle-reclosure-v1/fin-exact.json').write_text(json.dumps(fin_exact,indent=2,sort_keys=True)+'\n')
          print('FIN_EXACT',json.dumps(fin_exact,sort_keys=True))
          # Exact HEq telescope decoder: evidence only.
          heq_exact=[]
          for kind,name,_ in targets[:2]:
              p=root/kind/(name+'.ndjson')
              records,full=name_table(p)
              em=expr_map(p)
              decls=[o['inductive'] for o in records if 'inductive' in o and any(full(t['name'])=='HEq' for t in o['inductive']['types'])]
              if decls:
                  heq=decls[0]
                  typ=next(t for t in heq['types'] if full(t['name'])=='HEq')
                  ctor=next(c for c in heq['ctors'] if full(c['name']).startswith('HEq.'))
                  rec=next(x for x in heq['recs'] if full(x['name']).startswith('HEq.'))
                  roots=[typ['type'],ctor['type'],rec['type']]+[rule['rhs'] for rule in rec['rules']]
                  seen=set(); stack=list(roots)
                  while stack:
                      eid=stack.pop()
                      if eid in seen or eid not in em: continue
                      seen.add(eid); stack.extend(children(em[eid]))
                  heq_exact.append({
                      'test':name,
                      'meta':{'type':typ,'ctor':ctor,'rec':rec},
                      'roots':roots,
                      'exprs':{str(i):em[i] for i in sorted(seen)}
                  })
          pathlib.Path('metatron-kernel/evidence-out/structure-natle-reclosure-v1/heq-exact.json').write_text(json.dumps(heq_exact,indent=2,sort_keys=True)+'\n')
          print('HEQ_EXACT',json.dumps(heq_exact,sort_keys=True))
          fin_census=[]
          for kind,name,_ in targets[:2]:
              p=root/kind/(name+'.ndjson')
              records,full=name_table(p)
              fin_ids={i for i in range(2000) if full(i)=='Fin' or full(i).startswith('Fin.')}
              related=[]
              for o in records:
                  blob=json.dumps(o,sort_keys=True)
                  if any(str(i) in blob for i in fin_ids):
                      related.append(o)
              fin_census.append({'test':name,'fin_names':{str(i):full(i) for i in sorted(fin_ids)},'records':related})
          out['fin_census']=fin_census
          pathlib.Path('metatron-kernel/evidence-out/structure-natle-reclosure-v1/fin-census.json').write_text(json.dumps(fin_census,indent=2,sort_keys=True)+'\n')
          print('FIN_CENSUS',json.dumps(fin_census,sort_keys=True))
          print(json.dumps({
              'base_residual':out['base_residual'],
              'candidate_residual':out['candidate_residual'],
              'earned':out['earned'],
              'changes':[(r['test'],r['base'],r['candidate']) for r in changes],
              'traces':traces,
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-structure-natle-reclosure-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/structure-natle-reclosure-v1
          if-no-files-found: warn
