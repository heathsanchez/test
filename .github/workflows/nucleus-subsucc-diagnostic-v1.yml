name: Nucleus symbolic Nat.sub successor diagnostic
on:
  push:
    branches: [nucleus-symbolic-ble-subsucc-defeq-v1]
    paths: [".github/workflows/nucleus-subsucc-diagnostic-v1.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reclose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: 6f6386a316c9acfdef44fbe14714d419fd008c97
      SOURCE_SUBTREE: a8c52e869621226c802854c2ae46f314fbc6a4b7
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bind immutable source and release tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel)" = "$SOURCE_SUBTREE"
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --features diagnostics --manifest-path metatron-kernel/Cargo.toml
      - name: Fetch frozen Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/a.zip
          unzip -q /tmp/a.zip -d /tmp/a
          tar -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Replay exact Nat.sub_le positive prefixes and protected negatives
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/sub-succ-checked-v1
          python3 - <<'PY'
          import os,json,time,subprocess,pathlib,hashlib,copy
          root=pathlib.Path('/tmp/tests')
          out=pathlib.Path('metatron-kernel/evidence-out/sub-succ-checked-v1')
          rows=[]
          def runner(name,body,expected=None):
            t=time.monotonic()
            p=subprocess.run(['metatron-kernel/target/release/metatron-kernel'],
              input=body,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=45,
              env=os.environ|{'NUCLEUS_TRACE_DOWNSTREAM':'1','NUCLEUS_TRACE_NAT_SUB_SUCC_DEFEQ':'1','NUCLEUS_TRACE_DEPENDENCY_GAP':'1','NUCLEUS_TRACE_APPLICATION_FUNCTION_TYPE':'1'})
            log=p.stderr.decode(errors='replace').splitlines()
            item={'test':name,'rc':p.returncode,'elapsed':round(time.monotonic()-t,3),
              'sha256':hashlib.sha256(body).hexdigest(),
              'compiled_law_uses':sum('NUCLEUS_NAT_SUB_SUCC_DEFEQ:' in s for s in log),
              'downstream':[s for s in log if 'NUCLEUS_DOWNSTREAM:' in s][-3:],
              'gaps':[s[:1800] for s in log if 'NUCLEUS_DEPENDENCY_GAP:' in s][:6],
              'apps':[s[:1500] for s in log if 'NUCLEUS_APPLICATION_FUNCTION_TYPE:' in s][:6]}
            rows.append(item);print(json.dumps(item,sort_keys=True))
            assert p.returncode in (0,2) if expected==0 else p.returncode !=0,item
            return item
          sources=[('init-prelude','eac8baf0fd48f5e7ccada755b36823d402a1e980882818995ade19cffe15a2c5'),
                   ('perf/magma-list-pair-n7','abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35')]
          for name,digest in sources:
            raw=(root/'good'/(name+'.ndjson')).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==digest
            names={0:''};prefix=[]
            for line in raw.splitlines(keepends=True):
              j=json.loads(line);prefix.append(line)
              if 'in' in j:
                v=j.get('str',j.get('num'));pre=names.get(v['pre'],'')
                names[j['in']]=pre+('.' if pre else '')+str(v.get('str',v.get('i')))
              if 'thm' in j and names.get(j['thm']['name'])=='Nat.sub_le':
                break
            body=b''.join(prefix)
            (out/(name.replace('/','__')+'-suble.ndjson')).write_bytes(body)
            runner(name+'-through-suble',body,0)
          for name in ['init-prelude','perf/grind-ring-5','perf/magma-list-deep-n21',
              'perf/magma-list-deep-n36','perf/magma-list-pair-n21','perf/magma-list-pair-n7']:
            runner(name+'-full',(root/'good'/(name+'.ndjson')).read_bytes(),0)
          bad=(root/'bad/bugs/nested-unused-param.ndjson').read_bytes()
          p=subprocess.run(['metatron-kernel/target/release/metatron-kernel'],
               input=bad,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=25)
          assert p.returncode==1,p.returncode
          # Previously pinned false Nat.succ_le_succ proposition must never pass.
          raw=(root/'good/init-prelude.ndjson').read_bytes()
          names={0:''};prefix=[];expr={}
          for line in raw.splitlines(keepends=True):
            j=json.loads(line);prefix.append(line)
            if 'in' in j:
              v=j.get('str',j.get('num'));pre=names.get(v['pre'],'')
              names[j['in']]=pre+('.' if pre else '')+str(v.get('str',v.get('i')))
            if 'ie' in j:expr[j['ie']]={k:v for k,v in j.items() if k!='ie'}
            if 'thm' in j and names.get(j['thm']['name'])=='Nat.succ_le_succ':break
          new=copy.deepcopy(json.loads(prefix[-1]))
          assert new['thm']['type']==4174 and new['thm']['value']==4241
          additions=[(4242,{'app':{'fn':4170,'arg':8}})]
          for fresh,old,body in [(4243,4172,4242),(4244,4173,4243),(4245,4174,4244)]:
            node=copy.deepcopy(expr[old]);node['forallE']['body']=body;additions.append((fresh,node))
          new['thm']['type']=4245
          variant=b''.join(prefix[:-1]+[(json.dumps({'ie':i}|j,separators=(',',':'))+'\n').encode()
                         for i,j in additions]+[(json.dumps(new,separators=(',',':'))+'\n').encode()])
          assert hashlib.sha256(variant).hexdigest()=='2a090edfcfa2a16191f17a433617aaf045fc9b11cd0e2a93405b705d8a899688'
          runner('false-index-unchanged-proof',variant,-1)
          result={'source':os.environ['SOURCE_COMMIT'],'subtree':os.environ['SOURCE_SUBTREE'],
                  'qualification':os.environ['GITHUB_SHA'],'rows':rows,'malformed_rc':p.returncode}
          (out/'report.json').write_text(json.dumps(result,indent=2))
          assert all(r['rc'] in (0,2) for r in rows[:8]),rows
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-sub-succ-checked-${{ github.sha }}
          path: metatron-kernel/evidence-out/sub-succ-checked-v1
          if-no-files-found: warn
