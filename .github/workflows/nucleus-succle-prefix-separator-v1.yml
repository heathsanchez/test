name: Nucleus byte-exact successor-index prefix witnesses
on:
  push:
    branches: [nucleus-checked-beq-major-exposure-v1]
    paths: [".github/workflows/nucleus-succle-prefix-separator-v1.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 7e9d1a5cb14c9b47dea0d9b07e215f4aafc75e33
      SOURCE_SUBTREE: d1f6bf92ffb4f954c7b880ca35425328f843e0d6
      ARENA_ARTIFACT: "11272848230"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bind existing qualified source and run release tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:metatron-kernel)" = "$SOURCE_SUBTREE"
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
      - name: Download pinned frozen Arena inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a /tmp/tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/a.zip
          unzip -q /tmp/a.zip -d /tmp/a
          tar -xzf /tmp/a/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Replay exact prefixes and protected negative
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/succle-prefix
          python3 - <<'PY'
          import json,hashlib,pathlib,subprocess,os,time
          root=pathlib.Path('/tmp/tests')
          out=pathlib.Path('metatron-kernel/evidence-out/succle-prefix')
          targets=[
            ('good/init-prelude.ndjson','eac8baf0fd48f5e7ccada755b36823d402a1e980882818995ade19cffe15a2c5','5a4964190480cea9be1e17bc5f611394fcea1c523fb52fdf205ff0d8c220400b'),
            ('good/perf/magma-list-pair-n7.ndjson','abce636f6a7dd529c0dc6bbad8e7c8e2eaecfdda0d04c191d7f868e3a4468d35','ca63a82309e2e8fa16b447714d9183c945b0ddc0d3c59ef7aaac8b1951f218e2')]
          rows=[]
          for name,expected_source,expected_prefix in targets:
            raw=(root/name).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==expected_source
            names={0:''};prefix=[]
            for line in raw.splitlines(keepends=True):
              obj=json.loads(line); prefix.append(line)
              if 'in' in obj:
                d=obj.get('str',obj.get('num'))
                parent=names.get(d['pre'],'')
                label=str(d.get('str',d.get('i')))
                names[obj['in']]=parent+('.' if parent else '')+label
              if 'thm' in obj and names.get(obj['thm']['name'])=='Nat.succ_le_succ':
                break
            body=b''.join(prefix)
            digest=hashlib.sha256(body).hexdigest()
            assert digest==expected_prefix,(name,digest)
            fixture=out/(name.replace('/','__')+'.ndjson')
            fixture.write_bytes(body)
            begin=time.monotonic()
            result=subprocess.run(['metatron-kernel/target/release/metatron-kernel'],
               input=body,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=45,
               env=os.environ|{'NUCLEUS_TRACE_DOWNSTREAM':'1'})
            tail=[s for s in result.stderr.decode(errors='replace').splitlines()
                  if 'NUCLEUS_DOWNSTREAM:' in s][-4:]
            row={'test':name,'prefix_sha256':digest,'lines':len(prefix),
                 'runtime_sec':round(time.monotonic()-begin,3),
                 'returncode':result.returncode,'downstream':tail}
            rows.append(row);print(json.dumps(row,sort_keys=True))
            assert result.returncode==2,row
            assert any('name=Nat.succ_le_succ:stage=theorem.value:verdict=UNKNOWN' in s for s in tail),row
          bad=root/'bad/bugs/nested-unused-param.ndjson'
          assert hashlib.sha256(bad.read_bytes()).hexdigest()=='25afcc9267523cfd26edf94ca01ebe34ca0e8a24954e4b4e3d397a61688b8778'
          p=subprocess.run(['metatron-kernel/target/release/metatron-kernel'],input=bad.read_bytes(),stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=20)
          assert p.returncode==1,p.returncode
          report={'source':os.environ['SOURCE_COMMIT'],'subtree':os.environ['SOURCE_SUBTREE'],
                  'qualification':os.environ['GITHUB_SHA'],'rows':rows,'negative_rc':p.returncode}
          (out/'report.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-succle-prefix-${{ github.sha }}
          path: metatron-kernel/evidence-out/succle-prefix
          if-no-files-found: warn
