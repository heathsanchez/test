name: Nucleus True Downstream Trace v1

on:
  push:
    branches: [nucleus-true-downstream-trace-v1]
    paths:
      - ".github/workflows/nucleus-true-downstream-trace-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: 143a195a846e5625474f31786c68fc68379106fa
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - name: Build diagnostic and exact independent base
        run: |
          set -euo pipefail
          cd metatron-kernel
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked
          cd ..
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml
      - name: Fetch exact frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
          test "$(find /tmp/tests -type f -name '*.ndjson' | wc -l)" -eq 193
      - name: Protect 193 and trace True downstream residuals
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          mkdir -p evidence-out/true-downstream-v1
          python - <<'PY'
          import json,pathlib,subprocess,os,re
          root=pathlib.Path('/tmp/tests')
          base=pathlib.Path('/tmp/base/metatron-kernel/target/release/metatron-kernel')
          cand=pathlib.Path('target/release/metatron-kernel').resolve()

          def rr(binary,p,trace=False):
              env=dict(os.environ)
              if trace:
                  env['NUCLEUS_TRACE_RESIDUAL']='1'
              with p.open('rb') as f:
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,env=env)
              return q.returncode,q.stderr.decode(errors='replace')

          rows=[]
          for d,expected in [('good',0),('bad',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  a,_=rr(base,p)
                  b,_=rr(cand,p)
                  rows.append({'test':name,'expected':expected,'base':a,'candidate':b})
          assert len(rows)==193
          false_accept=[r for r in rows if r['expected']==1 and r['candidate']==0]
          false_reject=[r for r in rows if r['expected']==0 and r['candidate']==1]
          regressions=[r for r in rows if r['base'] in (0,1) and r['candidate']!=r['base']]
          wrong=[r for r in rows if r['base'] in (2,3) and r['candidate'] in (0,1) and r['candidate']!=r['expected']]
          assert not false_accept,false_accept
          assert not false_reject,false_reject
          assert not regressions,regressions
          assert not wrong,wrong

          targets=[
            ('good','perf/irrelevance-before-evaluation'),
            ('good','tutorial/095_projDataIndexRec'),
            ('bad','bugs/constlevels'),
            ('bad','bugs/large-elim-param'),
            ('bad','bugs/level-imax-normalization'),
            ('bad','tutorial/113_indexedStructEta'),
          ]
          trace=[]
          for d,name in targets:
              p=root/d/(name+'.ndjson')
              rc,err=rr(cand,p,True)
              marks=re.findall(r'NUCLEUS_RESIDUAL:([^\r\n]+)',err)
              trace.append({
                'test':name,'expected':0 if d=='good' else 1,'rc':rc,
                'residuals':marks,'terminal':marks[-1] if marks else None
              })

          changes=[r for r in rows if r['base']!=r['candidate']]
          earned=[r for r in rows if r['base'] in (2,3) and r['candidate']==r['expected']]
          out={
            'schema':'nucleus-true-downstream-trace-v1',
            'base_sha':os.environ['BASE_SHA'],
            'candidate_sha':os.environ['GITHUB_SHA'],
            'base_residual':sum(r['base'] in (2,3) for r in rows),
            'candidate_residual':sum(r['candidate'] in (2,3) for r in rows),
            'changes':changes,'earned':[r['test'] for r in earned],
            'true_trace':trace,
            'false_accepts':false_accept,'false_rejects':false_reject,
            'regressions':regressions,'wrong_deltas':wrong,
          }
          dest=pathlib.Path('evidence-out/true-downstream-v1')
          (dest/'result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-true-downstream-v1-${{ github.sha }}
          path: metatron-kernel/evidence-out/true-downstream-v1
          if-no-files-found: error
