name: Nucleus archived typed substitution transfer to Pairwise
on:
  push:
    branches: [research/nucleus-typed-substitution-pairwise-transfer-20261019]
    paths: [".github/workflows/nucleus-typed-substitution-pairwise-transfer.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore existing independently checked whole-type substitution source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/experiment /tmp/evidence
          SRC=metatron-kernel/evidence/residuals/typed-judgments-2026-10-17/typed-substitution/source
          test -s "$SRC/src/typecheck.rs"
          cp -a "$SRC"/. /tmp/experiment/
          sha256sum "$SRC"/src/*.rs > /tmp/evidence/archived-source-sha256.txt
          cargo test --release --locked --manifest-path /tmp/experiment/Cargo.toml > /tmp/evidence/library-tests.log 2>&1
          cargo build --release --locked --manifest-path /tmp/experiment/Cargo.toml
          sha256sum /tmp/experiment/target/release/metatron-kernel > /tmp/evidence/binary.sha256.txt
      - name: Acquire exact previously unseen theorem source and frozen protection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pairwise /tmp/perm
          gh api repos/heathsanchez/test/actions/artifacts/12081878830/zip > /tmp/pairwise.zip
          gh api repos/heathsanchez/test/actions/artifacts/12077748490/zip > /tmp/perm.zip
          unzip -oq /tmp/pairwise.zip -d /tmp/pairwise
          unzip -oq /tmp/perm.zip -d /tmp/perm
          printf '%s\n' \
            'e48fd06172e653cad2f4a15a7b454280f8bf00c16e0eba41a3d18265a5012c69  /tmp/pairwise/List.pairwise_middle.ndjson' \
            '5ec75f541dd6dad0ee707feb7a3d52000918735f633a9bc189c1c0f68021b714  /tmp/pairwise/List.pairwise_append_comm.ndjson' \
            '6feb6fdc9ec8190efeee6bc37bbda217d9a1ef60cbb5664c9642bb4a6885a107  /tmp/perm/list-perm-reconswap.ndjson' | sha256sum -c -
      - name: Run original-scope typed transport on new source-distinct theorem
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,pathlib,subprocess,hashlib,time
          paths={
             'pairwise_middle':pathlib.Path('/tmp/pairwise/List.pairwise_middle.ndjson'),
             'pairwise_append_comm':pathlib.Path('/tmp/pairwise/List.pairwise_append_comm.ndjson'),
             'List.Perm.recOnSwap':pathlib.Path('/tmp/perm/list-perm-reconswap.ndjson'),
             'false-index':pathlib.Path('metatron-kernel/tests/fixtures/protected-false-index.ndjson'),
             'eta-ctor-alias':pathlib.Path('metatron-kernel/tests/fixtures/protected-eta-ctor-alias.ndjson'),
          }
          pin=json.loads(pathlib.Path('metatron-kernel/evidence/performance/owned-environment-2026-10-13/nucleus-owned-environment-frozen196.json').read_text())
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env.update({'NUCLEUS_EXPERIMENTAL_'+f:'1' for f in pin['origin_flags']})
          env['NUCLEUS_TRACE_DOWNSTREAM']='1'
          results={}
          for name,p in paths.items():
              start=time.monotonic()
              with p.open('rb') as f:
                  try:r=subprocess.run(['/tmp/experiment/target/release/metatron-kernel'],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,env=env,timeout=90); rc=r.returncode; trace=r.stderr.decode(errors='replace')[-1600:]
                  except subprocess.TimeoutExpired:rc=124;trace='TIMEOUT'
              results[name]={'rc':rc,'seconds':round(time.monotonic()-start,4),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'trace':trace}
              print('TYPED_SOURCE_TRANSFER='+json.dumps({'case':name,**results[name]}),flush=True)
          pathlib.Path('/tmp/evidence/transfer.json').write_text(json.dumps(results,indent=2))
          assert results['false-index']['rc'] in (1,2) and results['eta-ctor-alias']['rc'] in (1,2), 'UNSAFE_NEGATIVE'
          if results['pairwise_middle']['rc']!=0:
              print('SCIENTIFIC_RED_NO_TRANSFER; no 196-case promotion inferred',flush=True)
          else:
              pathlib.Path('/tmp/evidence/eligible-for-full196').write_text('true')
          PY
      - name: If source-distinct theorem ACCEPTs, replay exact protected196
        shell: bash
        run: |
          set -euo pipefail
          if ! test -e /tmp/evidence/eligible-for-full196; then exit 0; fi
          mkdir -p /tmp/oldzip /tmp/frozen
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/11272848230/zip > /tmp/frozen.zip
          unzip -oq /tmp/frozen.zip -d /tmp/oldzip
          tar -xzf /tmp/oldzip/lean-arena-tests.tar.gz -C /tmp/frozen
          python3 - <<'PY'
          import os,pathlib,subprocess,json,hashlib
          pinned=json.loads(pathlib.Path('metatron-kernel/evidence/performance/owned-environment-2026-10-13/nucleus-owned-environment-frozen196.json').read_text())
          env={k:v for k,v in os.environ.items() if not k.startswith('NUCLEUS_')}
          env.update({'NUCLEUS_EXPERIMENTAL_'+f:'1' for f in pinned['origin_flags']})
          reference={r['case']:r for r in pinned['modes']['origin']['rows']}
          rows=[]
          for group in ['good','bad']:
              for path in sorted((pathlib.Path('/tmp/frozen')/group).rglob('*.ndjson')):
                  with path.open('rb') as fd:
                      try:res=subprocess.run(['/tmp/experiment/target/release/metatron-kernel'],stdin=fd,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=180,env=env);rc=res.returncode
                      except subprocess.TimeoutExpired:rc=124
                  row={'case':str(path.relative_to('/tmp/frozen')),'rc':rc,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
                  rows.append(row)
          failures=[x for x in rows if x['case'] not in reference or x['sha256']!=reference[x['case']]['sha256'] or (reference[x['case']]['rc'] in (0,1) and x['rc']!=reference[x['case']]['rc'])]
          counts={'accept':sum(x['rc']==0 for x in rows),'reject':sum(x['rc']==1 for x in rows),'unknown':sum(x['rc']==2 for x in rows),'wrong':sum((x['case'].startswith('good/') and x['rc']==1) or (x['case'].startswith('bad/') and x['rc']==0) for x in rows)}
          pathlib.Path('/tmp/evidence/full196.json').write_text(json.dumps({'rows':rows,'counts':counts,'failures':failures},indent=2))
          print('TYPED_SOURCE_FULL196='+json.dumps({'counts':counts,'regressions':failures[:3]}),flush=True)
          assert not failures and counts=={'accept':119,'reject':71,'unknown':6,'wrong':0}
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-typed-source-pairwise-${{ github.sha }}
          path: /tmp/evidence/
          if-no-files-found: warn
