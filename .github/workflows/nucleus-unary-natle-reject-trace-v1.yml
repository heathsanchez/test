name: Nucleus Unary NatLe Reject Trace v1

on:
  push:
    branches: [nucleus-unary-natle-reject-trace-v1]
    paths:
      - ".github/workflows/nucleus-unary-natle-reject-trace-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARENA_ARTIFACT: 10712869614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}
      - name: Build diagnostic
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo test --release
          cargo build --release --locked
      - name: Fetch frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip > /tmp/tests.zip
          mkdir -p /tmp/art /tmp/tests
          unzip -q /tmp/tests.zip -d /tmp/art
          tar -xzf /tmp/art/lean-arena-tests.tar.gz -C /tmp/tests
      - name: Trace deep vs pair exits
        working-directory: metatron-kernel
        env:
          NUCLEUS_TRACE_REJECT_BLOCK: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess,os
          root=pathlib.Path('/tmp/tests/good/perf')
          binary=pathlib.Path('target/release/metatron-kernel').resolve()
          names=['magma-list-deep-n21','magma-list-deep-n36','magma-list-pair-n21','magma-list-pair-n7']
          rows=[]
          for name in names:
              p=root/(name+'.ndjson')
              with p.open('rb') as f:
                  q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,env=os.environ,timeout=120)
              marks=[x for x in q.stderr.decode(errors='replace').splitlines() if 'NUCLEUS_BLOCK_EXIT:' in x]
              rows.append({'test':name,'rc':q.returncode,'exits':marks})
          print(json.dumps(rows,sort_keys=True))
          PY
