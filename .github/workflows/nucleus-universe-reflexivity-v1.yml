name: Nucleus universe reflexivity v1

on:
  push:
    branches: [nucleus-chain6-universe-reflexivity-v1]
    paths:
      - ".github/workflows/nucleus-universe-reflexivity-v1.yml"
      - "metatron-kernel/src/level.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: "12d2c6caf5d769e2192842eca180e8c741274376"
  ROUND1_ARTIFACT: "10712869614"
  CURRENT_TEST_ARTIFACT: "11090525747"

jobs:
  microgate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Build candidate and exact base
        run: |
          set -euo pipefail
          ulimit -s 65536
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/candidate
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml
          cp /tmp/base/metatron-kernel/target/release/metatron-kernel /tmp/base-bin

      - name: Fetch corpora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip >/tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a1
          tar -xzf /tmp/a1/lean-arena-tests.tar.gz -C /tmp/r1
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip >/tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/a2
          tar -xzf "$(find /tmp/a2 -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current

      - name: Test cheapest universe reflexivity law
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/universe-reflexivity-v1
          python3 - <<'PY'
          import json,pathlib,subprocess,time,os,hashlib

          def prefix(path,target):
              names={0:""}; rows=[]
              for line in pathlib.Path(path).read_text().splitlines():
                  r=json.loads(line); rows.append(line)
                  if "in" in r:
                      v=r.get("str",r.get("num"))
                      if isinstance(v,dict):
                          pre=v.get("pre",0); atom=v.get("str",v.get("i",v.get("num","?")))
                          names[r["in"]]=names.get(pre,f"#{pre}")+("." if pre else "")+str(atom)
                  ds=[]
                  if "inductive" in r:
                      for k in ("types","ctors","recs"): ds.extend(r["inductive"].get(k,[]))
                  for k in ("def","thm","axiom","opaque","quot"):
                      if k in r and isinstance(r[k],dict): ds.append(r[k])
                  if any(names.get(d.get("name"))==target for d in ds if isinstance(d,dict)):
                      return ("\n".join(rows)+"\n").encode()
              raise RuntimeError(target)

          chain6=prefix("/tmp/r1/good/perf/fueled-chain.ndjson","chain6_datF")
          funext=prefix("/tmp/current/good/perf/fueled-chain.ndjson","funext")
          env=os.environ|{"NUCLEUS_TRACE_DOWNSTREAM":"1"}

          def run(bin,data=None,path=None,timeout=30):
              t=time.monotonic()
              if data is not None:
                  q=subprocess.run([bin],input=data,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=timeout,env=env)
              else:
                  with pathlib.Path(path).open("rb") as f:
                      q=subprocess.run([bin],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=timeout,env=env)
              return {"exit":q.returncode,"seconds":time.monotonic()-t,"tail":q.stderr.decode(errors="replace").splitlines()[-20:]}

          result={
            "candidate_sha":os.environ["GITHUB_SHA"],
            "base_sha":os.environ["BASE_SHA"],
            "chain6_sha256":hashlib.sha256(chain6).hexdigest(),
            "base_chain6":run("/tmp/base-bin",data=chain6),
            "candidate_chain6":run("/tmp/candidate",data=chain6),
            "funext":run("/tmp/candidate",data=funext),
            "k_rec_conv":run("/tmp/candidate",path="/tmp/current/bad/bugs/k-rec-conv.ndjson"),
            "fun_eta_bad":run("/tmp/candidate",path="/tmp/current/bad/tutorial/116_funEtaBad.ndjson"),
          }
          pathlib.Path("metatron-kernel/evidence-out/universe-reflexivity-v1/result.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result),flush=True)
          assert result["funext"]["exit"]==0,result
          assert result["k_rec_conv"]["exit"]==1,result
          assert result["fun_eta_bad"]["exit"]==1,result
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-universe-reflexivity-${{ github.sha }}
          path: metatron-kernel/evidence-out/universe-reflexivity-v1
          if-no-files-found: error
