name: Nucleus upstream parser hardening v1

on:
  push:
    branches: [nucleus-upstream-parser-hardening-v1]
    paths:
      - ".github/workflows/nucleus-upstream-parser-hardening-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARENA_SHA: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42
      ARENA_ARTIFACT: "11272848230"
      UPSTREAM_LEAN_COMMIT: 8fc4172a7f2bdae17e2685149767936336b54f35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify strict parser patch
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo test --release --locked strict_json_tests -- --nocapture
          cargo test --release --locked
          cargo build --release --locked

      - name: Replay Lean upstream malformed NDJSON witnesses
        run: |
          set -euo pipefail
          BIN=metatron-kernel/target/release/metatron-kernel
          META='{"meta":{"format":{"version":"3.1.0"}}}'
          mkdir -p /tmp/nucleus-parser-witnesses

          cat > /tmp/nucleus-parser-witnesses/duplicate-top.ndjson <<EOF
          $META
          {"in":1,"in":2,"str":{"pre":0,"str":"a"}}
          EOF
          cat > /tmp/nucleus-parser-witnesses/duplicate-nested.ndjson <<EOF
          $META
          {"in":1,"str":{"pre":0,"pre":1,"str":"a"}}
          EOF
          cat > /tmp/nucleus-parser-witnesses/duplicate-escaped.ndjson <<EOF
          $META
          {"in":1,"str":{"pre":0,"\u0070re":1,"str":"a"}}
          EOF
          cat > /tmp/nucleus-parser-witnesses/name-zero.ndjson <<EOF
          $META
          {"in":0,"str":{"pre":0,"str":"a"}}
          EOF
          cat > /tmp/nucleus-parser-witnesses/trailing.ndjson <<EOF
          $META
          {"in":1,"str":{"pre":0,"str":"a"}}{"in":2,"str":{"pre":0,"str":"b"}}
          EOF

          for f in /tmp/nucleus-parser-witnesses/*.ndjson; do
            set +e
            NUCLEUS_TRACE_PARSE_ERROR=1 "$BIN" < "$f" > /tmp/out 2> /tmp/err
            rc=$?
            set -e
            echo "$(basename "$f"): rc=$rc"
            cat /tmp/err
            test "$rc" -eq 3
          done

      - name: Fetch immutable 196-case Arena corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-artifact /tmp/arena-tests
          gh api "repos/leanprover/lean-kernel-arena/actions/artifacts/$ARENA_ARTIFACT/zip" > /tmp/arena.zip
          unzip -q /tmp/arena.zip -d /tmp/arena-artifact
          tar --no-same-owner -xzf /tmp/arena-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
          test "$(find /tmp/arena-tests -type f -name '*.ndjson' | wc -l)" -eq 196

      - name: Reclose protected Arena frontier
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/upstream-parser-hardening-v1
          python3 - <<'PY'
          import json, pathlib, subprocess, os

          rows=[]
          binary=pathlib.Path("metatron-kernel/target/release/metatron-kernel").resolve()
          for bucket,expected in (("good",0),("bad",1)):
              root=pathlib.Path("/tmp/arena-tests")/bucket
              for fixture in sorted(root.rglob("*.ndjson")):
                  with fixture.open("rb") as source:
                      try:
                          p=subprocess.run([str(binary)],stdin=source,stdout=subprocess.DEVNULL,
                                           stderr=subprocess.PIPE,timeout=30)
                          actual=p.returncode
                      except subprocess.TimeoutExpired:
                          actual=2
                  rows.append({
                      "test":str(fixture.relative_to(root)).removesuffix(".ndjson"),
                      "expected":expected,
                      "actual":actual,
                  })

          counts={
              "accept":sum(r["expected"]==0 and r["actual"]==0 for r in rows),
              "reject":sum(r["expected"]==1 and r["actual"]==1 for r in rows),
              "unknown":sum(r["actual"]==2 for r in rows),
          }
          wrong=[r for r in rows if r["actual"] in (0,1) and r["actual"]!=r["expected"]]
          errors=[r for r in rows if r["actual"] not in (0,1,2)]
          report={
              "schema":"nucleus-upstream-parser-hardening-v1",
              "candidate_sha":os.environ["GITHUB_SHA"],
              "upstream_lean_commit":os.environ["UPSTREAM_LEAN_COMMIT"],
              "arena_sha":os.environ["ARENA_SHA"],
              "counts":counts,
              "wrong":wrong,
              "errors":errors,
          }
          pathlib.Path("metatron-kernel/evidence-out/upstream-parser-hardening-v1/result.json").write_text(
              json.dumps(report,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          assert len(rows)==196, len(rows)
          assert counts=={"accept":118,"reject":71,"unknown":7}, counts
          assert not wrong, wrong
          assert not errors, errors
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-upstream-parser-hardening-${{ github.sha }}
          path: metatron-kernel/evidence-out/upstream-parser-hardening-v1
          if-no-files-found: warn
