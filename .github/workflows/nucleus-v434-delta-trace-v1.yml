name: Nucleus v4.34 Delta Trace v1

on:
  push:
    branches: [nucleus-v434-delta-trace-v1]
    paths:
      - ".github/workflows/nucleus-v434-delta-trace-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  NUCLEUS_SHA: 98f87d9e66fb97987427d68180f51a653d626fdb
  ROUND1_ARTIFACT: "10712869614"
  CURRENT_TEST_ARTIFACT: "11090525747"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build exact independent authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = "$NUCLEUS_SHA"
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Fetch old and current small corpora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          mkdir -p /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip > /tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a1
          tar -xzf /tmp/a1/lean-arena-tests.tar.gz -C /tmp/r1
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/a2
          tar -xzf "$(find /tmp/a2 -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current

      - name: Trace exact delta objects
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/v434-delta-trace-v1
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          binary=pathlib.Path("metatron-kernel/target/release/metatron-kernel").resolve()
          targets=[
              ("bugs/nested-unused-param", "bad"),
              ("tutorial/124_accRecReduction", "good"),
              ("perf/proj-stuck-struct", "good"),
          ]
          env=os.environ.copy()
          env.update({
              "NUCLEUS_TRACE_DOWNSTREAM":"1",
              "NUCLEUS_TRACE_RESIDUAL":"1",
              "NUCLEUS_TRACE_NEUTRAL_HEADS":"1",
              "NUCLEUS_TRACE_GENERIC_NONREC":"1",
              "NUCLEUS_TRACE_PROP_SMALL":"1",
              "NUCLEUS_TRACE_PROP_SINGLETON":"1",
              "NUCLEUS_TRACE_SINGLE_FIELD":"1",
          })

          rows=[]
          for corpus,root in [("round1",pathlib.Path("/tmp/r1")),("current",pathlib.Path("/tmp/current"))]:
              for name,bucket in targets:
                  p=root/bucket/(name+".ndjson")
                  if not p.exists():
                      rows.append({"corpus":corpus,"test":name,"present":False})
                      continue
                  with p.open("rb") as f:
                      q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                                       stderr=subprocess.PIPE,env=env,timeout=240)
                  stderr=q.stderr.decode(errors="replace")
                  marks=[ln for ln in stderr.splitlines() if "NUCLEUS_" in ln]
                  rows.append({
                      "corpus":corpus,"test":name,"present":True,"rc":q.returncode,
                      "marks":marks[-300:],
                      "stderr_tail":stderr.splitlines()[-80:],
                  })

          out={
              "schema":"nucleus-v434-delta-trace-v1",
              "nucleus_authority_sha":os.environ["NUCLEUS_SHA"],
              "rows":rows,
          }
          pathlib.Path("metatron-kernel/evidence-out/v434-delta-trace-v1/result.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          for r in rows:
              print(json.dumps(r,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-v434-delta-trace-${{ github.sha }}
          path: metatron-kernel/evidence-out/v434-delta-trace-v1
          if-no-files-found: error
