name: Nucleus v4.34 Exposure Inner Trace v1

on:
  push:
    branches: [nucleus-v434-exposure-inner-trace-v1]
    paths:
      - ".github/workflows/nucleus-v434-exposure-inner-trace-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 98f87d9e66fb97987427d68180f51a653d626fdb
  CURRENT_TEST_ARTIFACT: "11090525747"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify diagnostic-only semantic diff
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE_SHA" --depth=1
          git diff "$BASE_SHA" HEAD -- metatron-kernel/src | grep -q 'NUCLEUS_TRACE_CONVERSION_EXPOSURE'
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml

      - name: Fetch current v4.34 public corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/current /tmp/art
          mkdir -p /tmp/current /tmp/art
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/art
          tar -xzf "$(find /tmp/art -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current

      - name: Zero-wrong replay plus seven-case inner trace
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/v434-exposure-inner-trace-v1
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path("/tmp/current")
          binary=pathlib.Path("metatron-kernel/target/release/metatron-kernel").resolve()
          targets={
            "perf/church-numerals","perf/shared-subterm","perf/unroll-versus-evaluate",
            "bugs/proj-of-stuck-prop","bugs/proj-of-subst-prop","bugs/rec-of-subst-prop",
            "perf/proj-stuck-struct",
          }
          rows=[]
          traced=[]
          for bucket,expected in [("good",0),("bad",1)]:
            for p in sorted((root/bucket).rglob("*.ndjson")):
              name=str(p.relative_to(root/bucket)).removesuffix(".ndjson")
              with p.open("rb") as f:
                q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                                 stderr=subprocess.PIPE,timeout=240)
              rc=q.returncode
              rows.append({"test":name,"expected":expected,"rc":rc})
              if name in targets:
                env=os.environ.copy()
                env["NUCLEUS_TRACE_CONVERSION_EXPOSURE"]="1"
                env["NUCLEUS_TRACE_DOWNSTREAM"]="1"
                with p.open("rb") as f:
                  tq=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                                    stderr=subprocess.PIPE,timeout=240,env=env)
                lines=tq.stderr.decode(errors="replace").splitlines()
                traced.append({
                  "test":name,"expected":expected,"rc":tq.returncode,
                  "exposures":[x for x in lines if "NUCLEUS_CONVERSION_EXPOSURE:" in x][-12:],
                  "downstream":[x for x in lines if "NUCLEUS_DOWNSTREAM:" in x][-4:],
                })
          wrong=[r for r in rows if r["rc"] in (0,1) and r["rc"]!=r["expected"]]
          abnormal=[r for r in rows if r["rc"] not in (0,1,2,3)]
          summary={
            "tests":len(rows),
            "accept":sum(r["expected"]==0 and r["rc"]==0 for r in rows),
            "reject":sum(r["expected"]==1 and r["rc"]==1 for r in rows),
            "residual":sum(r["rc"] in (2,3) for r in rows),
            "wrong":len(wrong),"abnormal":len(abnormal)
          }
          assert len(rows)==194,summary
          assert not wrong,wrong
          assert not abnormal,abnormal
          assert len(traced)==7,[r["test"] for r in traced]
          assert all(r["rc"]==2 for r in traced),traced
          out={
            "schema":"nucleus-v434-exposure-inner-trace-v1",
            "base_sha":os.environ["BASE_SHA"],
            "current_test_artifact":int(os.environ["CURRENT_TEST_ARTIFACT"]),
            "summary":summary,
            "traced":sorted(traced,key=lambda x:x["test"]),
          }
          pathlib.Path("metatron-kernel/evidence-out/v434-exposure-inner-trace-v1/result.json").write_text(
            json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-v434-exposure-inner-trace-${{ github.sha }}
          path: metatron-kernel/evidence-out/v434-exposure-inner-trace-v1
          if-no-files-found: error
