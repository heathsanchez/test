name: Nucleus v4.34 Stuck Projection Close v2

on:
  push:
    branches: [nucleus-v434-stuck-projection-close-v2]
    paths:
      - ".github/workflows/nucleus-v434-stuck-projection-close-v2.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 98f87d9e66fb97987427d68180f51a653d626fdb
  CURRENT_TEST_ARTIFACT: "11090525747"
  ROUND1_ARTIFACT: "10712869614"

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Build candidate and exact base
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/candidate
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml
          cp /tmp/base/metatron-kernel/target/release/metatron-kernel /tmp/base-bin

      - name: Fetch current public corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/current /tmp/art
          mkdir -p /tmp/current /tmp/art
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/art
          tar -xzf "$(find /tmp/art -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current

      - name: Four-case separator
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/v434-conversion-stuck-projection-v1
          python3 - <<'PY'
          import json,pathlib,subprocess,os,time
          targets={
            "perf/proj-stuck-struct":("good",0),
            "bugs/proj-of-stuck-prop":("bad",1),
            "bugs/proj-of-subst-prop":("bad",1),
            "bugs/rec-of-subst-prop":("bad",1),
          }
          def run(bin,p):
            with p.open("rb") as f:
              t=time.perf_counter_ns()
              q=subprocess.run([str(bin)],stdin=f,stdout=subprocess.DEVNULL,
                               stderr=subprocess.PIPE,timeout=240)
            return q.returncode,time.perf_counter_ns()-t,q.stderr.decode(errors="replace").splitlines()[-30:]
          rows=[]
          for name,(bucket,expected) in targets.items():
            p=pathlib.Path("/tmp/current")/bucket/(name+".ndjson")
            br,bt,be=run(pathlib.Path("/tmp/base-bin"),p)
            cr,ct,ce=run(pathlib.Path("/tmp/candidate"),p)
            rows.append({"test":name,"expected":expected,"base":br,"candidate":cr,
                         "base_ns":bt,"candidate_ns":ct,
                         "base_stderr":be,"candidate_stderr":ce})
          by={r["test"]:r for r in rows}
          assert by["perf/proj-stuck-struct"]["base"]==2,by
          assert by["perf/proj-stuck-struct"]["candidate"]==0,by
          for n in ["bugs/proj-of-stuck-prop","bugs/proj-of-subst-prop","bugs/rec-of-subst-prop"]:
            assert by[n]["candidate"]!=0,by[n]
          out={"schema":"nucleus-v434-stuck-projection-close-v2-separator",
               "base_sha":os.environ["BASE_SHA"],"candidate_sha":os.environ["GITHUB_SHA"],
               "rows":sorted(rows,key=lambda x:x["test"])}
          pathlib.Path("metatron-kernel/evidence-out/v434-conversion-stuck-projection-v1/separator.json").write_text(
            json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-v434-stuck-projection-close-separator-${{ github.sha }}
          path: metatron-kernel/evidence-out/v434-conversion-stuck-projection-v1
          if-no-files-found: warn

  reclose:
    needs: separator
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Build candidate and exact base
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/candidate
          git worktree add --detach /tmp/base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/base/metatron-kernel/Cargo.toml
          cp /tmp/base/metatron-kernel/target/release/metatron-kernel /tmp/base-bin

      - name: Fetch both public corpora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          mkdir -p /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip > /tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a1
          tar -xzf /tmp/a1/lean-arena-tests.tar.gz -C /tmp/r1
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/a2
          tar -xzf "$(find /tmp/a2 -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current

      - name: Exact dual-corpus differential reclosure
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/v434-conversion-stuck-projection-v1
          python3 - <<'PY'
          import json,pathlib,subprocess,os
          base=pathlib.Path("/tmp/base-bin"); cand=pathlib.Path("/tmp/candidate")
          def one(bin,p):
            with p.open("rb") as f:
              try:
                q=subprocess.run([str(bin)],stdin=f,stdout=subprocess.DEVNULL,
                                 stderr=subprocess.PIPE,timeout=240)
                return q.returncode
              except subprocess.TimeoutExpired:
                return 124
          def corpus(root):
            root=pathlib.Path(root); rows=[]
            for bucket,expected in [("good",0),("bad",1)]:
              for p in sorted((root/bucket).rglob("*.ndjson")):
                n=str(p.relative_to(root/bucket)).removesuffix(".ndjson")
                rows.append({"test":n,"expected":expected,"base":one(base,p),"candidate":one(cand,p)})
            return rows
          def analyze(rows):
            wrong=[r for r in rows if r["candidate"] in (0,1) and r["candidate"]!=r["expected"]]
            regress=[r for r in rows if r["base"] in (0,1) and r["candidate"]!=r["base"]]
            errors=[r for r in rows if r["candidate"] not in (0,1,2,3)]
            earned=[r for r in rows if r["base"] in (2,3) and r["candidate"]==r["expected"]]
            return {
              "tests":len(rows),
              "base_accept":sum(r["expected"]==0 and r["base"]==0 for r in rows),
              "base_reject":sum(r["expected"]==1 and r["base"]==1 for r in rows),
              "base_residual":sum(r["base"] in (2,3) for r in rows),
              "candidate_accept":sum(r["expected"]==0 and r["candidate"]==0 for r in rows),
              "candidate_reject":sum(r["expected"]==1 and r["candidate"]==1 for r in rows),
              "candidate_residual":sum(r["candidate"] in (2,3) for r in rows),
              "wrong":wrong,"regressions":regress,"errors":errors,
              "earned":[r["test"] for r in earned],
              "changes":[r for r in rows if r["base"]!=r["candidate"]],
            }
          r1=corpus("/tmp/r1"); cur=corpus("/tmp/current")
          a1=analyze(r1); ac=analyze(cur)
          assert (a1["tests"],a1["base_accept"],a1["base_reject"],a1["base_residual"])==(193,103,60,30),a1
          assert (ac["tests"],ac["base_accept"],ac["base_reject"],ac["base_residual"])==(194,104,59,31),ac
          for a in (a1,ac):
            assert not a["wrong"],a["wrong"]
            assert not a["regressions"],a["regressions"]
            assert not a["errors"],a["errors"]
          assert ac["earned"] == ["perf/proj-stuck-struct"],ac
          assert ac["changes"] == [{"test":"perf/proj-stuck-struct","expected":0,"base":2,"candidate":0}],ac["changes"]
          assert not a1["changes"],a1["changes"]
          out={"schema":"nucleus-v434-stuck-projection-close-v2",
               "base_sha":os.environ["BASE_SHA"],"candidate_sha":os.environ["GITHUB_SHA"],
               "round1":a1,"current":ac}
          pathlib.Path("metatron-kernel/evidence-out/v434-conversion-stuck-projection-v1/result.json").write_text(
            json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-v434-stuck-projection-close-reclosure-${{ github.sha }}
          path: metatron-kernel/evidence-out/v434-conversion-stuck-projection-v1
          if-no-files-found: warn
