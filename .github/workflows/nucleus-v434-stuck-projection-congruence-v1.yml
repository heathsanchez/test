name: Nucleus v4.34 Stuck Projection Congruence v1

on:
  push:
    branches: [nucleus-v434-stuck-projection-congruence-v1]
    paths:
      - ".github/workflows/nucleus-v434-stuck-projection-congruence-v1.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 98f87d9e66fb97987427d68180f51a653d626fdb
  ROUND1_ARTIFACT: "10712869614"
  CURRENT_TEST_ARTIFACT: "11090525747"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build candidate and exact base
        run: |
          set -euo pipefail
          ! grep -R "sokonanoda\|mathgraph-lean-kernel" metatron-kernel/Cargo.toml metatron-kernel/src/main.rs
          grep -q "metatron_kernel::run" metatron-kernel/src/main.rs
          cargo test --release --locked --manifest-path metatron-kernel/Cargo.toml
          cargo build --release --locked --manifest-path metatron-kernel/Cargo.toml
          cp metatron-kernel/target/release/metatron-kernel /tmp/nucleus-candidate

          git worktree add --detach /tmp/nucleus-base "$BASE_SHA"
          cargo build --release --locked --manifest-path /tmp/nucleus-base/metatron-kernel/Cargo.toml
          cp /tmp/nucleus-base/metatron-kernel/target/release/metatron-kernel /tmp/nucleus-base-bin

      - name: Fetch frozen Round 1 and current v4.34 public corpora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          mkdir -p /tmp/r1 /tmp/current /tmp/a1 /tmp/a2
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$ROUND1_ARTIFACT/zip > /tmp/r1.zip
          unzip -q /tmp/r1.zip -d /tmp/a1
          tar -xzf /tmp/a1/lean-arena-tests.tar.gz -C /tmp/r1

          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/$CURRENT_TEST_ARTIFACT/zip > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/a2
          tar -xzf "$(find /tmp/a2 -name lean-arena-tests.tar.gz -print -quit)" -C /tmp/current

      - name: Differential reclosure on both round boundaries
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/v434-stuck-projection-congruence-v1
          python3 - <<'PY'
          import json, pathlib, subprocess, time, os

          base=pathlib.Path("/tmp/nucleus-base-bin")
          cand=pathlib.Path("/tmp/nucleus-candidate")

          def rc(binary,p):
              with p.open("rb") as f:
                  t0=time.perf_counter_ns()
                  try:
                      q=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,
                                       stderr=subprocess.PIPE,timeout=240)
                      return q.returncode,time.perf_counter_ns()-t0,q.stderr.decode(errors="replace").splitlines()[-20:]
                  except subprocess.TimeoutExpired as e:
                      return 124,time.perf_counter_ns()-t0,["TIMEOUT"]

          def corpus(root):
              rows=[]
              root=pathlib.Path(root)
              for bucket,expected in [("good",0),("bad",1)]:
                  for p in sorted((root/bucket).rglob("*.ndjson")):
                      name=str(p.relative_to(root/bucket)).removesuffix(".ndjson")
                      br,bt,be=rc(base,p)
                      cr,ct,ce=rc(cand,p)
                      rows.append({
                        "test":name,"expected":expected,
                        "base":br,"candidate":cr,
                        "base_ns":bt,"candidate_ns":ct,
                        "base_stderr":be,"candidate_stderr":ce,
                      })
              return rows

          r1=corpus("/tmp/r1")
          cur=corpus("/tmp/current")

          def analyze(rows):
              wrong=[r for r in rows if r["candidate"] in (0,1) and r["candidate"]!=r["expected"]]
              regressions=[r for r in rows if r["base"] in (0,1) and r["candidate"]!=r["base"]]
              errors=[r for r in rows if r["candidate"] not in (0,1,2,3)]
              earned=[r for r in rows if r["base"] in (2,3) and r["candidate"]==r["expected"]]
              return {
                "tests":len(rows),
                "base_accept":sum(r["expected"]==0 and r["base"]==0 for r in rows),
                "base_reject":sum(r["expected"]==1 and r["base"]==1 for r in rows),
                "base_residual":sum(r["base"] in (2,3) for r in rows),
                "candidate_accept":sum(r["expected"]==0 and r["candidate"]==0 for r in rows),
                "candidate_reject":sum(r["expected"]==1 and r["candidate"]==1 for r in rows),
                "candidate_residual":sum(r["candidate"] in (2,3) for r in rows),
                "wrong":wrong,"regressions":regressions,"errors":errors,
                "earned":[r["test"] for r in earned],
                "changes":[r for r in rows if r["base"]!=r["candidate"]],
              }

          r1a=analyze(r1); cura=analyze(cur)
          assert (r1a["tests"],r1a["base_accept"],r1a["base_reject"],r1a["base_residual"])==(193,103,60,30),r1a
          assert (cura["tests"],cura["base_accept"],cura["base_reject"],cura["base_residual"])==(194,104,59,31),cura
          for a in (r1a,cura):
              assert not a["wrong"],a["wrong"]
              assert not a["regressions"],a["regressions"]
              assert not a["errors"],a["errors"]

          current_by={r["test"]:r for r in cur}
          target=current_by["perf/proj-stuck-struct"]
          assert target["base"]==2,target
          assert target["candidate"]==0,target
          for name in ["bugs/proj-of-stuck-prop","bugs/proj-of-subst-prop","bugs/rec-of-subst-prop"]:
              assert current_by[name]["candidate"]!=0,current_by[name]

          out={
            "schema":"nucleus-v434-stuck-projection-congruence-v1",
            "base_sha":os.environ["BASE_SHA"],
            "candidate_sha":os.environ["GITHUB_SHA"],
            "round1":r1a,"current":cura,
            "target":target,
            "protected_negatives":[current_by[n] for n in
              ["bugs/proj-of-stuck-prop","bugs/proj-of-subst-prop","bugs/rec-of-subst-prop"]],
          }
          pathlib.Path("metatron-kernel/evidence-out/v434-stuck-projection-congruence-v1/result.json").write_text(
            json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-v434-stuck-projection-congruence-${{ github.sha }}
          path: metatron-kernel/evidence-out/v434-stuck-projection-congruence-v1
          if-no-files-found: warn
