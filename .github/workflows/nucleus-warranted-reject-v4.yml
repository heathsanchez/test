name: Nucleus Warranted Reject v4

on:
  push:
    branches: [nucleus-warranted-reject-v4]
    paths:
      - ".github/workflows/nucleus-warranted-reject-v4.yml"
      - "metatron-kernel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify and build
        working-directory: metatron-kernel
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo build --release --locked
      - name: Fetch exact 193-file corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena/actions/artifacts/10712869614/zip > /tmp/test-tarball.zip
          mkdir -p /tmp/test-artifact /tmp/arena-tests
          unzip -q /tmp/test-tarball.zip -d /tmp/test-artifact
          tar -xzf /tmp/test-artifact/lean-arena-tests.tar.gz -C /tmp/arena-tests
          test "$(find /tmp/arena-tests -type f -name '*.ndjson' | wc -l)" -eq 193
      - name: Qualify native accept and reject authority
        run: |
          set -euo pipefail
          mkdir -p metatron-kernel/evidence-out/warranted-reject-v4
          python - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('/tmp/arena-tests')
          binary=pathlib.Path('metatron-kernel/target/release/metatron-kernel').resolve()
          rows=[]
          for d,expected,erc in [('good','accept',0),('bad','reject',1)]:
              for p in sorted((root/d).rglob('*.ndjson')):
                  name=str(p.relative_to(root/d)).removesuffix('.ndjson')
                  with p.open('rb') as f:
                      rc=subprocess.run([str(binary)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  rows.append({'test':name,'expected':expected,'expected_rc':erc,'rc':rc})
          assert len(rows)==193
          false_accept=[r for r in rows if r['expected_rc']==1 and r['rc']==0]
          false_reject=[r for r in rows if r['expected_rc']==0 and r['rc']==1]
          native_accept=[r for r in rows if r['expected_rc']==0 and r['rc']==0]
          native_reject=[r for r in rows if r['expected_rc']==1 and r['rc']==1]
          unknown=[r for r in rows if r['rc']==2]
          error=[r for r in rows if r['rc']==3]
          summary={
            'schema':'nucleus-warranted-reject-v4',
            'candidate_sha':'${GITHUB_SHA}',
            'counts':{
              'native_accept':len(native_accept),
              'native_reject':len(native_reject),
              'native_decisions':len(native_accept)+len(native_reject),
              'false_accept':len(false_accept),
              'false_reject':len(false_reject),
              'unknown':len(unknown),
              'error':len(error),
              'fallback_needed':len(unknown)+len(error),
            },
            'false_accept':false_accept,
            'false_reject':false_reject,
            'unknown_tests':[r['test'] for r in unknown],
            'error_tests':[r['test'] for r in error],
            'native_reject_tests':[r['test'] for r in native_reject],
          }
          pathlib.Path('metatron-kernel/evidence-out/warranted-reject-v4/result.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          assert not false_accept, false_accept
          assert not false_reject, false_reject
          assert len(native_accept)==74, len(native_accept)
          assert len(native_reject)>=40, len(native_reject)
          assert len(unknown)+len(error) < 119, (len(unknown),len(error))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-warranted-reject-v4-${{ github.sha }}
          path: metatron-kernel/evidence-out/warranted-reject-v4
          if-no-files-found: warn
