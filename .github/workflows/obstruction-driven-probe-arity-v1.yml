name: Obstruction Driven Probe Arity V1

on:
  push:
    paths:
      - "experiments/obstruction_driven_probe_arity_v1/FROZEN_CANDIDATE.md"
      - "scripts/obstruction_driven_probe_arity_v1.py"
      - ".github/workflows/obstruction-driven-probe-arity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove frozen candidate unchanged
        run: |
          set -euxo pipefail
          git diff --exit-code f62846cc4ab66d8ec9bc921513184b880d3a7772 --             experiments/obstruction_driven_probe_arity_v1/FROZEN_CANDIDATE.md
          echo "PROBE_ARITY_V1_FROZEN_UNCHANGED"
      - name: Run obstruction-driven arity test
        run: |
          set -o pipefail
          python scripts/obstruction_driven_probe_arity_v1.py | tee obstruction-driven-probe-arity-v1.log
          grep -F "SURVIVED_OBSTRUCTION_DRIVEN_PROBE_ARITY_V1" obstruction-driven-probe-arity-v1.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obstruction-driven-probe-arity-v1
          path: obstruction-driven-probe-arity-v1.log
