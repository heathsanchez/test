name: Opaque Factor Genesis V41

on:
  push:
    branches:
      - opaque-factor-genesis-v41
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V41 core
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=2ced9a3317583e433c5da08afa6a6df089c113f8
          git merge-base --is-ancestor "$FREEZE" HEAD
          changed="$(git diff --name-only "$FREEZE"..HEAD --             experiments/opaque_factor_genesis_v41/PROTOCOL.md             experiments/opaque_factor_genesis_v41/basis.py             experiments/opaque_factor_genesis_v41/kernel.py             experiments/opaque_factor_genesis_v41/FREEZE.json)"
          if [ -n "$changed" ]; then
            echo "Frozen V41 core changed after scientific freeze:"
            echo "$changed"
            exit 1
          fi

      - name: Syntax check
        run: |
          python -m py_compile             experiments/opaque_factor_genesis_v41/basis.py             experiments/opaque_factor_genesis_v41/kernel.py             experiments/opaque_factor_genesis_v41/challenge_pack.py             experiments/opaque_factor_genesis_v41/run.py

      - name: Run frozen V41 experiment
        working-directory: experiments/opaque_factor_genesis_v41
        run: |
          python run.py | tee run.log

      - name: Evidence summary
        if: always()
        working-directory: experiments/opaque_factor_genesis_v41
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence.json")
          if not p.exists():
              print("No evidence.json produced")
              raise SystemExit(1)
          e=json.loads(p.read_text())
          print("verdict:",e.get("verdict"))
          print("full_pass:",e.get("full_pass"))
          for k,v in sorted(e.get("gates",{}).items()):
              print(k,v)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opaque-factor-genesis-v41-evidence
          path: |
            experiments/opaque_factor_genesis_v41/evidence.json
            experiments/opaque_factor_genesis_v41/run.log
            experiments/opaque_factor_genesis_v41/FREEZE.json
            experiments/opaque_factor_genesis_v41/PROTOCOL.md
