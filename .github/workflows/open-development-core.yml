name: Open Development Core

on:
  push:
    branches: [open-development-core-v1]
  pull_request:
    paths:
      - 'open_development/**'
      - '.github/workflows/open-development-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python contract tests
        run: python -m unittest discover -s open_development/tests -v
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check pinned MSI kernel and developmental bridge
        run: bash open_development/lean/check.sh
      - name: Verify retained finite development through Lean
        run: |
          python - <<'PYDEMO'
          import json, tempfile
          from pathlib import Path
          from open_development import Developer, EvidenceStore, Obligation
          from open_development.finite import FiniteAdapter
          from open_development.lean_gate import LeanGate
          spec = json.loads(Path('open_development/examples/finite.json').read_text())
          with tempfile.TemporaryDirectory() as tmp:
              store = EvidenceStore(Path(tmp) / 'state.sqlite')
              gate = LeanGate()
              adapter = FiniteAdapter(spec, gate)
              dev = Developer(store, adapter)
              first = dev.run(Obligation('finite', {'task': 'first', 'actual_world': '1'}, 1))
              assert first.verdict == 'verified' and len(first.retained) == 1, {
                  'verdict': first.verdict, 'residual': first.evidence.residual,
                  'lean_error': gate.last_error}
              cert = store.state()['capabilities'][first.retained[0]]['evidence']['certificate']['lean']
              assert cert['theorems'] == ['candidate_refines', 'candidate_admitted']
              second = dev.run(Obligation('finite', {'task': 'second', 'actual_world': '1'}, 0))
              assert second.verdict == 'verified' and not second.retained
              store.revoke(first.retained[0], 'exact ancestor ablation')
              cold = dev.run(Obligation('finite', {'task': 'first', 'actual_world': '1'}, 0))
              assert cold.verdict == 'unknown'
              Path('open-development-result.json').write_text(json.dumps({
                  'first': first.verdict, 'retained': first.retained,
                  'second': second.verdict, 'second_new_capabilities': second.retained,
                  'ablated': cold.verdict, 'lean': cert['verifier'],
                  'evidence_head': store.events()[-1]['type']}, indent=2))
              store.close()
          PYDEMO
      - name: Qualify proof-procedure self-application
        run: |
          python - <<'PYPROOF'
          import json, tempfile
          from pathlib import Path
          from open_development import Developer, EvidenceStore, Obligation, ProofProcedureAdapter
          stages = json.loads(Path('open_development/examples/proof.json').read_text())['stages']
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / 'proof.sqlite'
              store = EvidenceStore(path)
              adapter = ProofProcedureAdapter()
              cold_first = Developer(store, adapter).run(Obligation('proof-procedure', stages[0], 0, 'method'))
              first = Developer(store, adapter).run(Obligation('proof-procedure', stages[0], 3, 'method'))
              store.close()
              store = EvidenceStore(path)
              cold_second = Developer(store, adapter).run(Obligation('proof-procedure', stages[1], 0, 'method'))
              second = Developer(store, adapter).run(Obligation('proof-procedure', stages[1], 3, 'method'))
              assert (cold_first.verdict, first.verdict, cold_second.verdict, second.verdict) == (
                  'unknown', 'verified', 'unknown', 'verified')
              procedures = [store.state()['capabilities'][rid]['attachment']['procedure']
                            for rid in first.retained + second.retained]
              assert procedures == ['half_line_square', 'interval_affine']
              store.revoke(second.retained[0], 'exact held-out procedure ablation')
              ablated = Developer(store, adapter).run(Obligation('proof-procedure', stages[1], 0, 'method'))
              assert ablated.verdict == 'unknown'
              Path('proof-procedure-result.json').write_text(json.dumps({
                  'claim': 'bounded verifier-guided proof-procedure development',
                  'cold': [cold_first.verdict, cold_second.verdict],
                  'warm': [first.verdict, second.verdict],
                  'procedures': procedures, 'restart': True,
                  'exact_ablation': ablated.verdict,
                  'verifier': adapter.verifier_id,
                  'limitations': ['supplied finite constructor grammar',
                                  'exact rational polynomial domain only',
                                  'not unrestricted self-development']}, indent=2))
              store.close()
          PYPROOF
      - name: Qualify constructor-enabled capability growth
        run: |
          python - <<'PYGROWTH'
          import json, tempfile
          from pathlib import Path
          from open_development import Developer, EvidenceStore, Obligation, ProofCompositionAdapter
          stages = json.loads(Path('open_development/examples/proof.json').read_text())['stages']
          def obligation(stage, budget):
              return Obligation('proof-composition', stage, budget, 'method')
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / 'growth.sqlite'
              store = EvidenceStore(path)
              adapter = ProofCompositionAdapter()
              cold = Developer(store, adapter).run(obligation(stages[1], 0))
              first = Developer(store, adapter).run(obligation(stages[0], 2))
              store.close()
              store = EvidenceStore(path)
              second = Developer(store, adapter).run(obligation(stages[1], 1))
              assert cold.verdict == 'unknown' and first.verdict == 'verified'
              assert second.verdict == 'verified' and len(second.retained) == 1
              program_record = store.state()['capabilities'][second.retained[0]]
              assert program_record['repair']['dependencies'] == [first.retained[0]]
              third = {'polynomial': {'0': '-6', '1': '5', '2': '-1'},
                       'domain': ['interval', '2', '3']}
              store.close()
              store = EvidenceStore(path)
              third_result = Developer(store, adapter).run(obligation(third, 0))
              assert third_result.verdict == 'verified' and not third_result.retained
              assert third_result.evidence.certificate['retained_program'] == second.retained[0]
              removed = store.revoke(first.retained[0], 'constructor removal ablation')
              ablated = Developer(store, adapter).run(obligation(third, 0))
              assert ablated.verdict == 'unknown'
              assert set(removed) == set(first.retained + second.retained)
              Path('capability-growth-result.json').write_text(json.dumps({
                  'claim': 'bounded three-generation constructor-enabled capability growth',
                  'cold_O2': cold.verdict, 'O1': first.verdict,
                  'retained_constructor': first.retained[0],
                  'retained_O1_program': first.retained[1],
                  'O2': second.verdict, 'retained_O2_program': second.retained[0],
                  'O2_program_dependency': program_record['repair']['dependencies'],
                  'second_restart': True,
                  'unlisted_O3_zero_acquisition_budget': third_result.verdict,
                  'O3_reused_program': third_result.evidence.certificate['retained_program'],
                  'removal_ablation': ablated.verdict,
                  'limitations': ['supplied primitive nodes', 'binary product only',
                                  'exact rational polynomial domain']}, indent=2))
              store.close()
          PYGROWTH
      - name: Build and validate release evidence
        run: |
          python -m open_development.release \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --finite open-development-result.json \
            --proof proof-procedure-result.json \
            --growth capability-growth-result.json \
            --output release-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-development-core-v1
          path: |
            open-development-result.json
            proof-procedure-result.json
            capability-growth-result.json
            release-evidence.json
          if-no-files-found: ignore

  proof-program-semantics:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit
      - uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          path: upstream
          persist-credentials: false
      - name: Check typed proof-program semantics in Lean
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence" .open-development
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/open-development-elan.sh
          sh /tmp/open-development-elan.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"
          if ! lake exe cache get > "$GITHUB_WORKSPACE/evidence/cache-first.log" 2>&1; then
            grep -q 'Dependency Mathlib uses a different lean-toolchain' "$GITHUB_WORKSPACE/evidence/cache-first.log"
            cp .lake/packages/mathlib/lean-toolchain lean-toolchain
            elan toolchain install "$(cat lean-toolchain)"
            elan default "$(cat lean-toolchain)"
            lake exe cache get > "$GITHUB_WORKSPACE/evidence/cache.log" 2>&1
          fi
          cp "$GITHUB_WORKSPACE/audit/open_development/lean_mathlib/"*.lean .open-development/
          lake env bash -c 'export LEAN_PATH="$1:$LEAN_PATH"; lean -o "$1/ProcedureRules.olean" "$1/ProcedureRules.lean"' bash "$PWD/.open-development" > "$GITHUB_WORKSPACE/evidence/procedure-rules.log" 2>&1
          lake env bash -c 'export LEAN_PATH="$1:$LEAN_PATH"; lean -o "$1/ProgramRules.olean" "$1/ProgramRules.lean"' bash "$PWD/.open-development" > "$GITHUB_WORKSPACE/evidence/program-rules.log" 2>&1
          lake env bash -c 'export LEAN_PATH="$1:$LEAN_PATH"; lean "$1/TypedProgramSemantics.lean"' bash "$PWD/.open-development" > "$GITHUB_WORKSPACE/evidence/typed-program.log" 2>&1
          cat "$GITHUB_WORKSPACE/evidence/"*-rules.log "$GITHUB_WORKSPACE/evidence/typed-program.log"
          python - <<'PYLEAN'
          import pathlib,re
          root=pathlib.Path.cwd().parent/'evidence'
          text='\n'.join(p.read_text() for p in root.glob('*.log'))
          names=[
            'OpenDevelopment.ProcedureRules.intervalAffine_sound',
            'OpenDevelopment.ProcedureRules.product_sound',
            'OpenDevelopment.ProgramRules.sound',
            'OpenDevelopment.TypedProgramSemantics.o2_commutes',
            'OpenDevelopment.TypedProgramSemantics.o3_commutes',
            'OpenDevelopment.TypedProgramSemantics.o2_sound',
            'OpenDevelopment.TypedProgramSemantics.o3_sound']
          allowed={'propext','Quot.sound','Classical.choice'}
          records={name:{x.strip() for x in raw.split(',') if x.strip()}
                   for name,raw in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",text)}
          records.update({name:set() for name in re.findall(r"'([^']+)' does not depend on any axioms",text)})
          for name in names:
            assert name in records,(name,sorted(records))
            assert records[name] <= allowed,(name,records[name])
            print(name,'AXIOMS_PASS')
          print('TYPED_PROGRAM_SEMANTICS_LEAN_PASS')
          PYLEAN
          lean --version > "$GITHUB_WORKSPACE/evidence/lean-version.txt"
          git -C .lake/packages/mathlib rev-parse HEAD > "$GITHUB_WORKSPACE/evidence/mathlib-commit.txt"
          sha256sum "$GITHUB_WORKSPACE/audit/open_development/lean_mathlib/"*.lean > "$GITHUB_WORKSPACE/evidence/source-hashes.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-program-semantics
          path: evidence/
          if-no-files-found: error
