name: One-time Open Development source import
on:
  push:
    branches: [open-development-core-v1]
    paths: ['.source-import/**', '.github/workflows/open-development-import.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack exact source
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, io, pathlib, tarfile
          root = pathlib.Path.cwd()
          parts = sorted((root / '.source-import').glob('chunk-*.b64'))
          assert [p.name for p in parts] == [f'chunk-{i:02d}.b64' for i in range(7)]
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == '6fd874e9c1e0608ee581ac6d30cb6a41eefe5f7f7aca319e8eacc4d8075e7f10'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert member.isfile() or member.isdir()
                  assert member.name == '.gitignore' or member.name.startswith('open_development/') or member.name in ('.github/', '.github/workflows/') or member.name == '.github/workflows/open-development-core.yml'
                  if member.isfile():
                      assert not (root / member.name).exists()
              archive.extractall(root, filter='data')
          parts = sorted((root / '.source-import').glob('runtime-*.b64'))
          assert [p.name for p in parts] == ['runtime-00.b64', 'runtime-01.b64']
          packed = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '918e9f16b6685c7237653d43d932dd0f0c59951bf5cc9e9750f8bce7b06cdb94'
          runtime = gzip.decompress(packed)
          assert hashlib.sha256(runtime).hexdigest() == 'f51154faeb9be490de4a5031da1fb3ef15564cf9877f8b9503be31c45babfe7d'
          (root / 'open_development/runtime.py').write_bytes(runtime)
          print('SOURCE_IMPORT_VERIFIED')
          PY
      - name: Commit reviewable source and remove transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .source-import
          rm .github/workflows/open-development-import.yml
          git add -A
          git commit -m 'Install bounded executable open-development core'
          git push origin HEAD:open-development-core-v1
      - name: Python contract tests
        run: python -m unittest discover -s open_development/tests -v
      - name: Install pinned Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check Lean core and certificates
        run: bash open_development/lean/check.sh
      - name: Run persistent Lean-gated lineage
        run: |
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from open_development import Developer, EvidenceStore, Obligation
          from open_development.finite import FiniteAdapter
          from open_development.lean_gate import LeanGate
          spec = json.loads(Path('open_development/examples/finite.json').read_text())
          with tempfile.TemporaryDirectory() as tmp:
              store = EvidenceStore(Path(tmp) / 'state.sqlite')
              dev = Developer(store, FiniteAdapter(spec, LeanGate()))
              first = dev.run(Obligation('finite', {'task': 'first', 'actual_world': '1'}, 1))
              assert first.verdict == 'verified' and len(first.retained) == 1
              second = dev.run(Obligation('finite', {'task': 'second', 'actual_world': '1'}, 0))
              assert second.verdict == 'verified' and not second.retained
              store.revoke(first.retained[0], 'exact ancestor ablation')
              cold = dev.run(Obligation('finite', {'task': 'first', 'actual_world': '1'}, 0))
              assert cold.verdict == 'unknown'
              Path('open-development-result.json').write_text(json.dumps({'first': first.verdict, 'retained': first.retained, 'second': second.verdict, 'ablated': cold.verdict}, indent=2))
              store.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-development-import-result
          path: open-development-result.json
          if-no-files-found: ignore
