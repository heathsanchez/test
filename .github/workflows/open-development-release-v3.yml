name: Open Development Release V3 External Validity

on:
  push:
    branches: [open-development-core-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  release-v3-external:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run v3 authority tests
        run: |
          python -m unittest open_development.tests.test_release_v3 -v

      - name: Wait for same-commit v2 and external authorities
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          wait_for_run() {
            local workflow="$1"
            local label="$2"
            local run_id=""
            for _ in $(seq 1 120); do
              payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=10")"
              failed="$(jq -r '[.workflow_runs[] | select(.head_sha==env.GITHUB_SHA and .status=="completed" and .conclusion!="success")] | length' <<<"$payload")"
              if [ "$failed" -gt 0 ]; then
                jq -r '.workflow_runs[] | select(.head_sha==env.GITHUB_SHA) | [.id,.status,.conclusion] | @tsv' <<<"$payload"
                echo "$label authority failed"
                return 1
              fi
              run_id="$(jq -r '.workflow_runs[] | select(.head_sha==env.GITHUB_SHA and .status=="completed" and .conclusion=="success") | .id' <<<"$payload" | head -n1)"
              if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
                printf '%s' "$run_id"
                return 0
              fi
              sleep 10
            done
            echo "$label authority timed out" >&2
            return 1
          }

          v2_id="$(wait_for_run open-development-release-v2.yml release-v2)"
          external_id="$(wait_for_run external-minif2f-exaptation-v1.yml external-minif2f)"
          test -n "$v2_id" && test -n "$external_id"
          echo "v2_run_id=$v2_id" >> "$GITHUB_OUTPUT"
          echo "external_run_id=$external_id" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$v2_id" > v2-run-id.txt
          printf '%s\n' "$external_id" > external-run-id.txt

          gh run download "$v2_id" -n open-development-release-v2 -D v2-authority
          gh run download "$external_id" -n external-minif2f-post-freeze-v1 -D external-authority
          test -f v2-authority/release-evidence-v2.json
          test -f external-authority/external-minif2f-result.json
          test -f external-authority/external-source-freeze.json
          test -f external-authority/external-test-sha256.txt

      - name: Build one fail-closed external-validity release
        run: |
          python -m open_development.release_v3 \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --v2-run-id "${{ steps.upstream.outputs.v2_run_id }}" \
            --external-run-id "${{ steps.upstream.outputs.external_run_id }}" \
            --v2-release v2-authority/release-evidence-v2.json \
            --external external-authority/external-minif2f-result.json \
            --output release-evidence-v3.json

      - name: Verify frozen v3 release identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from open_development.release_v3 import validate_release_v3
          m = json.loads(Path('release-evidence-v3.json').read_text())
          validate_release_v3(m)
          assert m['source_commit'] == '${{ github.sha }}'
          assert m['v2_run_id'] == int('${{ steps.upstream.outputs.v2_run_id }}')
          assert m['external_run_id'] == int('${{ steps.upstream.outputs.external_run_id }}')
          print('OPEN_DEVELOPMENT_RELEASE_V3_EXTERNAL_VALIDITY_PASS', m['evidence_digest'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: open-development-release-v3-external-validity
          path: |
            release-evidence-v3.json
            v2-run-id.txt
            external-run-id.txt
            v2-authority/release-evidence-v2.json
            external-authority/external-minif2f-result.json
            external-authority/external-source-freeze.json
            external-authority/external-test-sha256.txt
          if-no-files-found: error
