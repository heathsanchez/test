name: Pinned OpenAI Math full Kakeya root Lean replay
on:
  push:
    branches: [research/openai-kakeya-full-root-replay-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      OPENAI_MATH_SHA: 7ef5c0cc5ca4b0e072b7a050fca09ab24bc6fa3a
      GLIBC_TUNABLES: glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1
      LEAN_NUM_THREADS: 2
    steps:
      - name: Capture runner environment
        run: |
          mkdir -p evidence
          { uname -a; lscpu; free -h; df -h; } > evidence/environment.txt
      - name: Install exact Lean 4.34.1
        run: |
          set -euxo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Pin authentic OpenAI source
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/openai/math.git upstream
          git -C upstream sparse-checkout set lean
          git -C upstream fetch --depth 1 origin "$OPENAI_MATH_SHA"
          git -C upstream checkout --detach "$OPENAI_MATH_SHA"
          test "$(git -C upstream rev-parse HEAD)" = "$OPENAI_MATH_SHA"
          echo "$OPENAI_MATH_SHA" > evidence/source_commit.txt
          sha256sum upstream/lean/lakefile.lean upstream/lean/lean-toolchain upstream/lean/OAI/MeasureTheory/Kakeya/Definitions.lean upstream/lean/OAI/MeasureTheory/Kakeya/Main.lean upstream/lean/OAI/MeasureTheory/Kakeya/Hausdorff.lean upstream/lean/OAI/Analysis/Fourier/LocalSmoothing/Main.lean > evidence/source_hashes.txt
          lean --version > evidence/lean_version.txt
          lake --version > evidence/lake_version.txt
      - name: Resolve pinned Lean dependencies
        working-directory: upstream/lean
        run: |
          set -euo pipefail
          lake update 2>&1 | tee "$GITHUB_WORKSPACE/evidence/lake_update.log"
          lake exe cache get 2>&1 | tee "$GITHUB_WORKSPACE/evidence/cache_get.log"
          sha256sum lake-manifest.json > "$GITHUB_WORKSPACE/evidence/manifest_hash.txt"
      - name: Build full Kakeya source and inspect exact root and axioms
        working-directory: upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.MeasureTheory.Kakeya.Main 2>&1 | tee "$GITHUB_WORKSPACE/evidence/root_build.log"
          cat > ReplayRoot.lean <<'LEAN'
          import OAI.MeasureTheory.Kakeya.Main
          #check OAI.MeasureTheory.Kakeya.KakeyaConjecture
          #check OAI.MeasureTheory.Kakeya.kakeya
          example : OAI.MeasureTheory.Kakeya.KakeyaConjecture :=
            OAI.MeasureTheory.Kakeya.kakeya
          #print axioms OAI.MeasureTheory.Kakeya.kakeya
          LEAN
          sha256sum ReplayRoot.lean > "$GITHUB_WORKSPACE/evidence/replay_root_hash.txt"
          lake env lean ReplayRoot.lean 2>&1 | tee "$GITHUB_WORKSPACE/evidence/root_axioms.log"
          ! grep -Eq 'sorryAx|Lean\.ofReduceBool|error:' "$GITHUB_WORKSPACE/evidence/root_axioms.log"
          grep -F "OAI.MeasureTheory.Kakeya.kakeya : OAI.MeasureTheory.Kakeya.KakeyaConjecture" "$GITHUB_WORKSPACE/evidence/root_axioms.log"
      - name: Retain complete technical evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-math-pinned-full-kakeya-root-replay
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
