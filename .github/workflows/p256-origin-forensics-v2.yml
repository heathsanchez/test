name: P-256 historical FreeLIP V2 exact source audit
on:
  push:
    branches:
      - research/p256-origin-forensics-20261017
    paths:
      - 'research/p256_origin_20261017/**'
      - '.github/workflows/p256-origin-forensics-v2.yml'
  workflow_dispatch:

jobs:
  requalify-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen protocol and original-source mirror
        shell: bash
        run: |
          set -euo pipefail
          test -f research/p256_origin_20261017/V2_SOURCE_FROZEN_PROTOCOL.md
          git clone --quiet https://github.com/lrobot/freelip.git "$RUNNER_TEMP/freelip"
          git -C "$RUNNER_TEMP/freelip" checkout --quiet 00898a4814d2cc1244bf348682be6ed10dda35f0
          test "$(git -C "$RUNNER_TEMP/freelip" rev-parse HEAD)" = 00898a4814d2cc1244bf348682be6ed10dda35f0
          test "$(git -C "$RUNNER_TEMP/freelip" hash-object lip.c)" = a86ce8ae5be49e0f35999a2c87f52e1718ebdb81
          test "$(git -C "$RUNNER_TEMP/freelip" hash-object lip.h)" = 080cda8aec8c0939348452ea3beb9f1afad845ef
          test "$(git -C "$RUNNER_TEMP/freelip" hash-object README)" = 2b5551522548107e3021b39a6cdddce6fdebb34e
          sed -n '590,600p' "$RUNNER_TEMP/freelip/lip.h"
      - name: Compile and test 1997 FreeLIP native sampler
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/native_freelip.c" <<'C'
          #include "lip.h"
          #include <stdio.h>
          int main(void) {
            verylong seed = 0;
            int i;
            zintoz(20000L, &seed);
            zrstart(seed);
            for(i = 0; i < 20; i++) printf("%ld\n", zrandom(1L << NBITS));
            return 0;
          }
          C
          gcc -std=gnu89 -O2 -w -I"$RUNNER_TEMP/freelip" "$RUNNER_TEMP/native_freelip.c" "$RUNNER_TEMP/freelip/lip.c" -lm -o "$RUNNER_TEMP/old_freelip30"
          "$RUNNER_TEMP/old_freelip30" > "$RUNNER_TEMP/native_freelip30.txt"
          NBITS=30 python3 - <<'PY'
          import os
          from pathlib import Path
          from research.p256_origin_20261017.run_v2 import py_limb
          target=py_limb(20000,30,20)[0]
          actual=[int(x) for x in (Path(os.environ["RUNNER_TEMP"])/"native_freelip30.txt").read_text().splitlines()]
          assert actual==target,(actual,target)
          print("Native 1997 FreeLIP NBITS=30 matches independent Python 20/20")
          PY
          # SINGLE_MUL is paired with its own preprocessor configuration in the
          # historical source.  The 26-bit path is independently calibrated by
          # the previous V1 native-free Python/C++ positive witness; no unqualified
          # 26-bit upstream binary comparison is asserted in this V2 job.
      - name: Install Boost multiprecision header dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libboost-dev
          test -f /usr/include/boost/multiprecision/cpp_int.hpp
      - name: Replay seven prospective finite search families and all controls
        shell: bash
        run: |
          set -euo pipefail
          cd research/p256_origin_20261017
          python3 run_v2.py --out V2_RESULTS_CI.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path("V2_RESULTS.json").read_text())
          new=json.loads(Path("V2_RESULTS_CI.json").read_text())
          for field in ("code_sha256","runner_sha256","total_exact_candidate_windows","matches","status"):
            assert old[field]==new[field],(field,old[field],new[field])
          for a,b in zip(old["searches"],new["searches"]):
            for key in ("mode","seeds","prng_outputs","exact_candidate_windows","rejected_raw_steps","hits"):
              assert a[key]==b[key],(a["mode"],key,a[key],b[key])
          assert new["total_exact_candidate_windows"]==337667590
          print("REQUALIFIED_BOUNDED_FREE_LIP_SOURCE_GRAMMAR_NEGATIVE")
          PY
      - name: Upload exact source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p256-origin-v2-source-pinned-evidence
          path: |
            research/p256_origin_20261017/V2_SOURCE_FROZEN_PROTOCOL.md
            research/p256_origin_20261017/p256_v2_source_scan.cpp
            research/p256_origin_20261017/run_v2.py
            research/p256_origin_20261017/V2_RESULTS.json
            research/p256_origin_20261017/V2_RESULTS_CI.json
            research/p256_origin_20261017/controls.json
            research/p256_origin_20261017/f*.json
            research/p256_origin_20261017/l31.json
            research/p256_origin_20261017/chain30.json
