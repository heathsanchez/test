name: Persistence Correspondence V39

on:
  push:
    branches:
      - persistence-correspondence-v39
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V39 core
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=1d939fe83a7351ec04ec8f96971f1bcc30a89155
          git merge-base --is-ancestor "$FREEZE" HEAD
          changed="$(git diff --name-only "$FREEZE"..HEAD --             experiments/persistence_correspondence_v39/PROTOCOL.md             experiments/persistence_correspondence_v39/basis.py             experiments/persistence_correspondence_v39/kernel.py             experiments/persistence_correspondence_v39/FREEZE.json)"
          if [ -n "$changed" ]; then
            echo "Frozen V39 core changed after scientific freeze:"
            echo "$changed"
            exit 1
          fi

      - name: Syntax check
        run: |
          python -m py_compile             experiments/persistence_correspondence_v39/basis.py             experiments/persistence_correspondence_v39/kernel.py             experiments/persistence_correspondence_v39/challenge_pack.py             experiments/persistence_correspondence_v39/run.py

      - name: Run frozen V39 experiment
        working-directory: experiments/persistence_correspondence_v39
        run: |
          python run.py | tee run.log

      - name: Evidence summary
        if: always()
        working-directory: experiments/persistence_correspondence_v39
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence.json")
          if not p.exists():
              print("No evidence.json produced")
              raise SystemExit(1)
          e=json.loads(p.read_text())
          print("verdict:",e.get("verdict"))
          print("full_pass:",e.get("full_pass"))
          for k,v in sorted(e.get("gates",{}).items()):
              print(k,v)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistence-correspondence-v39-evidence
          path: |
            experiments/persistence_correspondence_v39/evidence.json
            experiments/persistence_correspondence_v39/run.log
            experiments/persistence_correspondence_v39/FREEZE.json
            experiments/persistence_correspondence_v39/PROTOCOL.md
