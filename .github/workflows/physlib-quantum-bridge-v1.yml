name: Physlib quantum bridge probe
on:
  push:
    branches:
      - experiment/physlib-quantum-bridge-v1
    paths:
      - '.github/workflows/physlib-quantum-bridge-v1.yml'
  workflow_dispatch:
jobs:
  physlib-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned Physlib
        run: |
          git clone https://github.com/leanprover-community/physlib.git /tmp/physlib
          cd /tmp/physlib
          git checkout 215aefe06c59d45c1ebcc8c845fb6a5551e2087a
          cat lean-toolchain
      - name: Install pinned Lean toolchain
        working-directory: /tmp/physlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lake" --version
      - name: Compile Physlib native Stinespring and CPTP modules
        working-directory: /tmp/physlib
        run: |
          lake exe cache get
          lake build QuantumInfo.Channels.CPTP PhyslibAlpha.QuantumMechanics.StinespringDilation
      - name: Verify reusable Stinespring bridge and held-out composition
        working-directory: /tmp/physlib
        run: |
          cat > PhyslibQuantumBridgeProbe.lean <<'LEAN'
          import PhyslibAlpha.QuantumMechanics.StinespringDilation
          import QuantumInfo.Channels.CPTP

          open CPTPMap

          /-- Reuse the native Kraus/partial-trace correspondence at a new input. -/
          example {m r : ℕ} (K : Fin r → Matrix (Fin m) (Fin m) ℂ)
              (ρ : Matrix (Fin m) (Fin m) ℂ) :
              tr₂ (stinespringDilation K ρ) = krausApply K ρ :=
            stinespringForm_eq K ρ

          /-- Held-out compositional channel equality using the bundled representation. -/
          example {a b c d : Type*} [Fintype a] [Fintype b]
              [Fintype c] [Fintype d]
              (f : CPTPMap a b) (g : CPTPMap b c) (h : CPTPMap c d) :
              (h ∘ₘ g) ∘ₘ f = h ∘ₘ (g ∘ₘ f) :=
            CPTPMap.compose_assoc h g f

          /-- Native purification reconstruction, independent of the Kraus representation. -/
          example {a b : Type*} [Fintype a] [Fintype b]
              [DecidableEq a] [DecidableEq b] [Inhabited b]
              (f : CPTPMap a b) :
              f = (let zero_prep : CPTPMap Unit (b × b) :=
                      CPTPMap.replacement (MState.pure (Ket.basis default))
                    let prep := (CPTPMap.id ⊗ᶜᵖ zero_prep)
                    let append : CPTPMap a (a × Unit) :=
                      CPTPMap.ofEquiv (Equiv.prodPUnit a).symm
                    CPTPMap.traceLeft ∘ₘ CPTPMap.traceLeft ∘ₘ f.purify ∘ₘ prep ∘ₘ append) :=
            CPTPMap.purify_trace f
          LEAN
          lake env lean PhyslibQuantumBridgeProbe.lean
      - name: Record proof declarations and duplication
        working-directory: /tmp/physlib
        run: |
          grep -nE '^(theorem|lemma|def) (stinespringForm_eq|stinespringGeneralForm_works|stinespringUnitaryForm_works|purify|krausApply)' PhyslibAlpha/QuantumMechanics/StinespringDilation.lean QuantumInfo/Channels/CPTP.lean || true
          grep -n 'There is a different version' PhyslibAlpha/QuantumMechanics/StinespringDilation.lean
