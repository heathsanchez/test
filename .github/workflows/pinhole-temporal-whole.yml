name: Pinhole whole-time continuation qualification
on:
  push:
    branches: [whole-construction-flash-mda-v1]
    paths:
      - 'open_development/pinhole_temporal_whole_v1.py'
      - 'open_development/pinhole_whole_time_major.py'
      - 'open_development/pinhole_cost_future_separator.py'
      - 'open_development/pinhole_mda_future_value.py'
      - 'open_development/flash_whole_future_major_stress.py'
      - 'open_development/WHOLE_FUTURE_GAMBLE_PROTOCOL.md'
      - 'open_development/whole_future_twelve_gambles.py'
      - '.github/workflows/pinhole-temporal-whole.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whole-continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact whole-history future quotient and ablations
        run: |
          set -euo pipefail
          python -m open_development.pinhole_temporal_whole_v1 | tee temporal_evidence.json
      - name: Exhaustive whole-time major experiment
        run: |
          set -euo pipefail
          python -m open_development.pinhole_whole_time_major | tee whole_time_major.json
          python - <<'PY'
          import json
          d=json.load(open('whole_time_major.json'))
          assert d['status']=='PASS_EXACT_BOUNDED_WHOLE_TIME'
          assert d['mda_exact_revocation_shadows']==6
          assert d['mda_protected_future_replays']==16
          PY
      - name: Test cost-sensitive future identity separator
        run: |
          set -euo pipefail
          python -m open_development.pinhole_cost_future_separator | tee cost_future_separator.json
      - name: Source-exact MDA future reachability under causal ablation
        run: |
          set -euo pipefail
          python -m open_development.pinhole_mda_future_value | tee mda_future_value.json
      - name: Exhaustive real-ledger all-subsets and revocation stress
        run: |
          set -euo pipefail
          python -m open_development.flash_whole_future_major_stress | tee flash_major_stress.json
          python - <<'PY'
          import json
          d=json.load(open('flash_major_stress.json'))
          assert d['status']=='PASS_EXACT_REAL_LEDGER_STRESS'
          assert d['all_capability_subsets']==64
          assert d['single_and_pair_revocation_scenarios']==21
          assert d['protected_source_proofs']==16
          PY
      - name: Integrated source-backed development economics and role transport
        run: |
          set -euo pipefail
          python -m open_development.whole_construction_suite > integrated_gamble_evidence.json
          python - <<'PY'
          import json
          d=json.load(open('integrated_gamble_evidence.json'))
          assert d['status']=='PASS_SOURCE_EXACT_INTEGRATED_RUNTIME'
          assert d['global_optimiser']=='NOT_IMPLEMENTED'
          PY
      - name: Execute twelve-gamble qualification matrix and 100 whole-time permutations
        run: |
          set -euo pipefail
          python -m open_development.whole_future_twelve_gambles | tee twelve_gamble_evidence.json
          python - <<'PY'
          import json
          d=json.load(open('twelve_gamble_evidence.json'))
          assert d['status']=='PASS_TWELVE_GAMBLE_CONTROL_MATRIX'
          assert len(d['tests'])==12
          assert d['whole_future_permutation_controls']==100
          assert d['strict_global_economic_win']=='UNKNOWN'
          PY
      - name: Requalify three-world shared construction
        run: |
          set -euo pipefail
          python -m open_development.pinhole_major_v4 | tee three_world_evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinhole-whole-time-evidence
          path: |
            temporal_evidence.json
            whole_time_major.json
            cost_future_separator.json
            mda_future_value.json
            flash_major_stress.json
            integrated_gamble_evidence.json
            twelve_gamble_evidence.json
            three_world_evidence.json
          if-no-files-found: warn
