name: Prospective Continuation Genesis V1
on:
  push:
    branches: [prospective-continuation-genesis-v1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test protocol before external scoring checkout
        run: python -m unittest discover -s open_development/tests -v
      - name: Preserve existing Lean core authority
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          bash open_development/lean/check.sh
      - name: Independently bind immutable release-v4 artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/heathsanchez/test/actions/artifacts/10141699676/zip -o release-v4.zip
          test "$(sha256sum release-v4.zip | cut -d' ' -f1)" = 7594ac85ef51238f1198c51f73f337a7d0f03218e4e7f724ea8ea4c069b95de6
      - name: Freeze source, substrate, and initial ledger while corpus is absent
        run: |
          test ! -e external
          python -m open_development.prospective_genesis freeze \
            --source-commit "$GITHUB_SHA" --nonce "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-continuation-freeze
          path: |
            prospective-freeze.json
            prospective-state.sqlite
          if-no-files-found: error

  administrator:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: prospective-continuation-freeze}
      - name: Assert post-freeze external chronology
        run: test ! -e external
      - uses: actions/checkout@v4
        with:
          repository: fchollet/ARC-AGI
          ref: 399030444e0ab0cc8b4e199870fb20b863846f34
          path: external
          persist-credentials: false
      - name: Commit complete route-neutral stream before task one
        run: python -m open_development.prospective_genesis admin --source-commit "$GITHUB_SHA" --nonce "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-unlabelled-stream
          path: |
            prospective-freeze.json
            prospective-state.sqlite
            prospective-stream.json
          if-no-files-found: error

  developer:
    needs: administrator
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: prospective-unlabelled-stream}
      - name: Run unchanged developer over the entire sealed stream
        run: |
          test ! -e external
          python -m open_development.prospective_genesis develop --source-commit "$GITHUB_SHA" --nonce "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-immutable-decisions
          path: |
            prospective-freeze.json
            prospective-state.sqlite
            prospective-stream.json
            prospective-decisions.json
          if-no-files-found: error

  evaluator:
    needs: developer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: prospective-immutable-decisions}
      - name: Confirm decisions predate evaluator checkout
        run: test ! -e external
      - uses: actions/checkout@v4
        with:
          repository: fchollet/ARC-AGI
          ref: 399030444e0ab0cc8b4e199870fb20b863846f34
          path: external
          persist-credentials: false
      - name: Independently evaluate generation, chronology, continuation, and controls
        run: python -m open_development.prospective_genesis evaluate --source-commit "$GITHUB_SHA" --nonce "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-continuation-genesis-v1
          path: |
            prospective-freeze.json
            prospective-stream.json
            prospective-decisions.json
            prospective-evaluation.json
          if-no-files-found: error
