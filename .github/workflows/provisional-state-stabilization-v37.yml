name: Provisional State Stabilization V37

on:
  push:
    branches:
      - provisional-state-stabilization-v37
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V37 core
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=8d7325a3eacf348510e220477fbd11ae57fa3511
          git merge-base --is-ancestor "$FREEZE" HEAD
          changed="$(git diff --name-only "$FREEZE"..HEAD --             experiments/provisional_state_stabilization_v37/PROTOCOL.md             experiments/provisional_state_stabilization_v37/basis.py             experiments/provisional_state_stabilization_v37/kernel.py             experiments/provisional_state_stabilization_v37/FREEZE.json)"
          if [ -n "$changed" ]; then
            echo "Frozen V37 core changed after scientific freeze:"
            echo "$changed"
            exit 1
          fi

      - name: Syntax check
        run: |
          python -m py_compile             experiments/provisional_state_stabilization_v37/basis.py             experiments/provisional_state_stabilization_v37/kernel.py             experiments/provisional_state_stabilization_v37/challenge_pack.py             experiments/provisional_state_stabilization_v37/run.py

      - name: Run frozen V37 experiment
        working-directory: experiments/provisional_state_stabilization_v37
        shell: bash
        run: |
          set -o pipefail
          python run.py | tee run.log

      - name: Evidence summary
        if: always()
        working-directory: experiments/provisional_state_stabilization_v37
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence.json")
          if not p.exists():
              print("No evidence.json produced")
              raise SystemExit(1)
          e=json.loads(p.read_text())
          print("verdict:",e.get("verdict"))
          print("full_pass:",e.get("full_pass"))
          for k,v in sorted(e.get("gates",{}).items()):
              print(k,v)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisional-state-stabilization-v37-evidence
          path: |
            experiments/provisional_state_stabilization_v37/evidence.json
            experiments/provisional_state_stabilization_v37/run.log
            experiments/provisional_state_stabilization_v37/FREEZE.json
            experiments/provisional_state_stabilization_v37/PROTOCOL.md
