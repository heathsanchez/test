name: PSI AA independent normalization experiment

on:
  push:
    branches:
      - audit/psi-aa-normalization-20261113

permissions:
  contents: read

concurrency:
  group: psi-aa-normalization
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact pull-request sources
        shell: bash
        run: |
          git clone --quiet https://github.com/metalogiclabs/aaronson-ambainis.git psi
          git -C psi checkout --quiet --detach c1fa338fb0381934b96737e9ebb90e3a534dbf57
          test "$(git -C psi rev-parse HEAD)" = c1fa338fb0381934b96737e9ebb90e3a534dbf57
          test "$(git -C psi hash-object audit/OriginalConjecture6.lean)" = c1b267957a28a14fec5fb8d087b6f1fb4eccb2e6
          test "$(git -C psi hash-object Makefile)" = 889c286a1120b2061e10c8c63a19921a3048e6dd
          git -C psi status --short
          python3 psi/scripts/source_digest.py psi AaronsonAmbainis

      - name: Configure pinned Lean and Mathlib caches
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psi
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Compile exact PR bridge and replay the project
        working-directory: psi
        shell: bash
        run: |
          lean --version
          make imports
          make audit
          make build
          make axioms
          make replay

      - name: Preserve source and axiom reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi-aa-normalization-reports
          if-no-files-found: warn
          path: |
            psi/axiom-report.txt
            psi/notes/source-audit.json
