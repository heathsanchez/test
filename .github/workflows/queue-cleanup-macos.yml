name: Actions Queue Cleanup macOS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/queue-cleanup-macos.yml'
      - 'QUEUE_CLEANUP_TRIGGER.txt'
  pull_request:
    branches: [main]
    paths:
      - 'QUEUE_CLEANUP_TRIGGER.txt'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cancel-stale:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale queued test-repo runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 32683638017 32684042667 32684188783 32683633274; do
            echo "Cancelling $id"
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/heathsanchez/test/actions/runs/$id/cancel")
            cat /tmp/resp || true
            echo "HTTP $code"
            case "$code" in
              202|409) ;;
              *) exit 1 ;;
            esac
          done
