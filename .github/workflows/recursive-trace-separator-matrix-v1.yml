name: Recursive trace separator matrix v1

on:
  push:
    branches: [verified-model-basis-v1]
    paths:
      - '.github/workflows/recursive-trace-separator-matrix-v1.yml'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clone frozen corpus
        run: |
          git clone -q https://github.com/YanbiaoLab/Order5-Austin-Law-Proofs.git /tmp/austin
          cd /tmp/austin
          git checkout -q b984287a1e5283e67b3709fe1e43f7734b360342

      - name: Interpret recursive Code-Step models
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/recursive_matrix.py <<'PY'
          import json,re,pathlib,itertools,functools,sys
          root=pathlib.Path('/tmp/austin')
          idx=json.loads((root/'proofs/index.json').read_text())
          formulas={e['equation']:e['formula'] for e in idx['equations']}

          E=('e',)
          def K(x): return ('k',x)
          def P(x,y): return ('p',x,y)

          tok_re=re.compile(r'[A-Za-z_][A-Za-z0-9_]*|[()]')
          def parse_one(tokens,i=0):
              if i>=len(tokens): raise ValueError('EOF')
              t=tokens[i]; i+=1
              if t=='(':
                  q,i=parse_one(tokens,i)
                  if i>=len(tokens) or tokens[i]!=')':
                      raise ValueError(('missing )',tokens[i:i+12]))
                  return q,i+1
              if t=='p':
                  a,i=parse_one(tokens,i); b,i=parse_one(tokens,i); return ('p',a,b),i
              if t=='k':
                  a,i=parse_one(tokens,i); return ('k',a),i
              if t=='e': return ('e',),i
              return ('v',t),i
          def parse_terms(s,n):
              toks=tok_re.findall(s); i=0; out=[]
              for _ in range(n):
                  q,i=parse_one(toks,i); out.append(q)
              return out,toks[i:]

          def vars_in(p):
              if p[0]=='v': return {p[1]}
              if p[0]=='e': return set()
              if p[0]=='k': return vars_in(p[1])
              return vars_in(p[1])|vars_in(p[2])

          def match(pat,val,env):
              if pat[0]=='v':
                  n=pat[1]
                  if n in env: return env[n]==val
                  env[n]=val; return True
              if pat[0]!=val[0]: return False
              if pat[0]=='e': return True
              if pat[0]=='k': return match(pat[1],val[1],env)
              return match(pat[1],val[1],env) and match(pat[2],val[2],env)
          def inst(p,env):
              if p[0]=='v':
                  if p[1] not in env: raise KeyError(p[1])
                  return env[p[1]]
              if p[0]=='e': return E
              if p[0]=='k': return K(inst(p[1],env))
              return P(inst(p[1],env),inst(p[2],env))

          def extract_code_block(s):
              i=s.index('inductive Code')
              # include mutual Step declaration but stop at first theorem following mutual end.
              # Constructors all appear before the first theorem.
              j=s.find('\ntheorem ',i)
              return s[i:j if j>=0 else i+10000]

          def extract_rules(block):
              starts=[m.start() for m in re.finditer(r'(?m)^\s*\|\s*[A-Za-z_][A-Za-z0-9_]*',block)]
              rules=[]; errors=[]
              for a,b in zip(starts,starts[1:]+[len(block)]):
                  frag=block[a:b]
                  m=re.search(r':\s*Code\s+(.+)',frag,re.S)
                  if not m: continue
                  rhs=m.group(1).strip()
                  try:
                      main,rest=parse_terms(rhs,3)
                      if rest:
                          errors.append(('main-rest',frag[:500],rest[:20])); continue
                      steps=[]
                      for sm in re.finditer(r'\([A-Za-z_][A-Za-z0-9_]*\s*:\s*Step\s+([^\)]*(?:\([^\)]*\)[^\)]*)*)\)',frag):
                          try:
                              ts,srest=parse_terms(sm.group(1),3)
                              if srest: raise ValueError(('step-rest',srest))
                              steps.append(tuple(ts))
                          except Exception as ex:
                              errors.append(('step-parse',sm.group(0),repr(ex)))
                      # More robust fallback: simple balanced extraction of every ': Step ' binder.
                      if ': Step ' in frag and not steps:
                          pos=0
                          while True:
                              k=frag.find(': Step ',pos)
                              if k<0: break
                              start=k+7
                              depth=0; z=start
                              while z<len(frag):
                                  ch=frag[z]
                                  if ch=='(': depth+=1
                                  elif ch==')':
                                      if depth==0: break
                                      depth-=1
                                  z+=1
                              ts,srest=parse_terms(frag[start:z],3)
                              if srest: errors.append(('step-rest2',frag[start:z],srest))
                              steps.append(tuple(ts)); pos=z+1
                      mainvars=vars_in(main[0])|vars_in(main[1])
                      needed=set()
                      for st in steps: needed |= vars_in(st[0])|vars_in(st[1])|vars_in(st[2])
                      needed |= vars_in(main[2])
                      if not needed <= mainvars:
                          # outputs like H0 are normally bound in the main second argument; if not, unsupported.
                          errors.append(('unbound',sorted(needed-mainvars),frag[:700])); continue
                      rules.append({'main':tuple(main),'steps':steps})
                  except Exception as ex:
                      errors.append(('rule-parse',frag[:700],repr(ex)))
              return rules,errors

          def parse_formula(formula):
              rhs=formula.split('=',1)[1].replace(' ',''); i=0
              def atom():
                  nonlocal i
                  if i<len(rhs) and rhs[i] in 'xyzw':
                      q=('v',rhs[i]); i+=1; return q
                  if i<len(rhs) and rhs[i]=='(':
                      i+=1;q=expr();assert rhs[i]==')';i+=1;return q
                  raise ValueError((formula,i,rhs[i:]))
              def expr():
                  nonlocal i
                  q=atom()
                  while i<len(rhs) and rhs[i]=='◇':
                      i+=1;q=('o',q,atom())
                  return q
              q=expr();assert i==len(rhs),(formula,i,rhs[i:]);return q
          asts={n:parse_formula(f) for n,f in formulas.items()}

          def build_model(rules):
              memo={}; active=set()
              def op(a,b):
                  key=(a,b)
                  if key in memo: return memo[key]
                  if key in active: raise RuntimeError(('recursive_cycle',key))
                  active.add(key)
                  outs=[]
                  try:
                      for r in rules:
                          pa,pb,po=r['main']; env={}
                          if not (match(pa,a,env) and match(pb,b,env)): continue
                          ok=True
                          for x,y,z in r['steps']:
                              try: xx,yy,zz=inst(x,env),inst(y,env),inst(z,env)
                              except KeyError: ok=False; break
                              if op(xx,yy)!=zz:
                                  ok=False;break
                          if ok: outs.append(inst(po,env))
                      if not outs: res=P(a,b)
                      else:
                          if any(x!=outs[0] for x in outs[1:]):
                              raise RuntimeError(('nonfunctional',a,b,outs))
                          res=outs[0]
                      memo[key]=res
                      return res
                  finally:
                      active.discard(key)
              return op

          def ev(ast,env,op):
              return env[ast[1]] if ast[0]=='v' else op(ev(ast[1],env,op),ev(ast[2],env,op))

          pool=[E,K(E),K(K(E)),K(K(K(E)))]
          rows=[];unsupported=[]
          for e in idx['equations']:
              ip=e.get('infinite_model_proof')
              if not ip: continue
              s=(root/ip['path']).read_text(errors='replace')
              if 'inductive Code' not in s: continue
              block=extract_code_block(s)
              if ': Step ' not in block and 'inductive Step' not in block: continue
              rules,errs=extract_rules(block)
              if errs or not rules:
                  unsupported.append({'equation':e['equation'],'errors':errs[:10],'rule_count':len(rules),'block':block[:2500]})
                  continue
              op=build_model(rules)
              src=e['equation']; ast=asts[src]
              vs=sorted(set(re.findall(r'[xyzw]',e['formula'])),key='xyzw'.index)
              bad=None
              try:
                  for xs in itertools.product(pool,repeat=len(vs)):
                      env=dict(zip(vs,xs))
                      if env['x']!=ev(ast,env,op):
                          bad={v:pool.index(env[v]) for v in vs};break
              except Exception as ex:
                  unsupported.append({'equation':src,'errors':[repr(ex)],'rule_count':len(rules)});continue
              if bad:
                  unsupported.append({'equation':src,'errors':['source_probe_failed',bad],'rule_count':len(rules)});continue

              refs=[];surv=[];wits={}
              try:
                  for t in idx['equations']:
                      n=t['equation']; a=asts[n]
                      tv=sorted(set(re.findall(r'[xyzw]',t['formula'])),key='xyzw'.index)
                      w=None
                      for xs in itertools.product(pool,repeat=len(tv)):
                          env=dict(zip(tv,xs))
                          if env['x']!=ev(a,env,op):
                              w={v:pool.index(env[v]) for v in tv};break
                      if w is None: surv.append(n)
                      else: refs.append(n);wits[n]=w
              except Exception as ex:
                  unsupported.append({'equation':src,'errors':['sweep',repr(ex)],'rule_count':len(rules)});continue
              rows.append({'source':src,'rule_count':len(rules),'refuted_count':len(refs),'survivors':surv,'refuted':refs,'witnesses':wits})
              print('ROW',src,'rules',len(rules),'refuted',len(refs),'survivors',','.join(surv))

          out={'corpus_commit':'b984287a1e5283e67b3709fe1e43f7734b360342','probe_pool':['e','k(e)','k2(e)','k3(e)'],'rows':rows,'unsupported':unsupported}
          pathlib.Path('/tmp/recursive_matrix.json').write_text(json.dumps(out,indent=2))
          print('SUPPORTED_ROWS',len(rows))
          print('UNSUPPORTED',len(unsupported))
          print('SOURCE_ONLY_ROWS',sum(r['survivors']==[r['source']] for r in rows))
          print('REFUTATION_TOTAL',sum(r['refuted_count'] for r in rows))
          for u in unsupported:
              print('UNSUPPORTED_ROW',u['equation'],str(u['errors'])[:900])
          PY
          python3 /tmp/recursive_matrix.py | tee /tmp/recursive_matrix.log

      - uses: actions/upload-artifact@v4
        with:
          name: recursive-trace-separator-matrix-v1
          path: |
            /tmp/recursive_matrix.json
            /tmp/recursive_matrix.log
