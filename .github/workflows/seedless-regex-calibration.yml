name: MathGraph source-only seedless regex constructor — original validator calibration
on:
  push:
    branches:
      - mathgraph-seedless-regex-transfer-20261015-v1
    paths:
      - 'research/seedless_regex/**'
      - '.github/workflows/seedless-regex-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: go-playground/validator
          ref: a37c290428207fcaf419d295cde1fc432fa37c9e
          path: source/validator/head
          fetch-depth: 2
          persist-credentials: false
      - name: Reconstruct frozen original base source, untouched
        run: |
          set -euo pipefail
          git -C source/validator/head worktree add --detach ../base df91dfdd9abdbb838739d13a70550efb7f730d3e
          test "$(git -C source/validator/base rev-parse HEAD)" = df91dfdd9abdbb838739d13a70550efb7f730d3e
          test "$(git -C source/validator/head rev-parse HEAD)" = a37c290428207fcaf419d295cde1fc432fa37c9e
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Qualify seedless source regex witness and negative controls
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/regex"
          P=(--base source/validator/base --head source/validator/head --base-sha df91dfdd9abdbb838739d13a70550efb7f730d3e --head-sha a37c290428207fcaf419d295cde1fc432fa37c9e --repo go-playground/validator)
          go run research/seedless_regex/seedless.go "${P[@]}" --out "$RUNNER_TEMP/regex/calibration.json" > "$RUNNER_TEMP/regex/calibration.log"
          go run research/seedless_regex/seedless.go "${P[@]}" --identical --out "$RUNNER_TEMP/regex/identical.json" > /dev/null
          go run research/seedless_regex/seedless.go "${P[@]}" --ablate --out "$RUNNER_TEMP/regex/ablation.json" > /dev/null
          go run research/seedless_regex/seedless.go "${P[@]}" --withdraw --out "$RUNNER_TEMP/regex/withdrawal.json" > /dev/null
          go run research/seedless_regex/seedless.go "${P[@]}" --swap --out "$RUNNER_TEMP/regex/swap.json" > /dev/null
          python3 - "$RUNNER_TEMP/regex" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1]);get=lambda name:json.loads((p/(name+'.json')).read_text())
          a,b,c,d,e=[get(x) for x in ('calibration','identical','ablation','withdrawal','swap')]
          assert a['positive_example_seed']=='NONE' and a['original_author_test_samples_used'] is False
          assert a['result']=='WARRANTED_BOUNDED_SOURCE_REGEX_DELTA_WITNESS',a
          assert a['old_only_count']+a['new_only_count']>0
          assert b['result']=='UNKNOWN_NO_SOURCE_REGEX_WITNESS_IN_BOUND'
          assert c['result']=='UNKNOWN_REFERENCE_REMOVED'
          assert d['result']=='STALE_EVIDENCE_WITHDRAWN'
          assert e['result']=='WARRANTED_BOUNDED_SOURCE_REGEX_DELTA_WITNESS'
          assert a['old_only_count']==e['new_only_count'] and a['new_only_count']==e['old_only_count']
          for z in (a,b,c,d,e):assert z['action_authorization']=='NONE'
          print('SOURCE_ONLY_SEEDLESS_VALIDATOR_CALIBRATION',a['result'],
                'old',a['old_only_count'],'new',a['new_only_count'],
                'minimum_old',a.get('old_only_shortest',{}).get('input'),
                'minimum_new',a.get('new_only_shortest',{}).get('input'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seedless-original-source-regex-calibration
          path: ${{ runner.temp }}/regex/
          if-no-files-found: ignore
