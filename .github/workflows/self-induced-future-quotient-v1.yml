name: Self-Induced Future Quotient V1

on:
  push:
    paths:
      - 'experiments/self_induced_future_quotient_v1/**'
      - '.github/workflows/self-induced-future-quotient-v1.yml'
      - '.github/trigger-self-induced-future-quotient-v1.txt'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    env:
      UVRM_MODEL: gpt-4.1-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen benchmark
        run: python experiments/self_induced_future_quotient_v1/validate.py
      - name: Run protected self-induced quotient benchmark
        run: python experiments/self_induced_future_quotient_v1/run_openai.py
      - name: Score externally
        run: python experiments/self_induced_future_quotient_v1/score.py experiments/self_induced_future_quotient_v1/answers.json | tee experiments/self_induced_future_quotient_v1/score_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: self-induced-future-quotient-v1-protected
          path: |
            experiments/self_induced_future_quotient_v1/tasks.json
            experiments/self_induced_future_quotient_v1/answers.json
            experiments/self_induced_future_quotient_v1/run_metadata.json
            experiments/self_induced_future_quotient_v1/scores.json
            experiments/self_induced_future_quotient_v1/score_output.txt
          retention-days: 30
