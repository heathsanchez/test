name: Separator Construction V1
on:
  push:
    branches: [main]
    paths:
      - 'experiments/separator_construction_v1/TRIGGER.txt'
concurrency:
  group: separator-construction-v1
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    env:
      UVRM_MODEL: gpt-4.1-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen benchmark
        run: python experiments/separator_construction_v1/validate.py
      - name: Run protected 24-call construction benchmark
        run: python experiments/separator_construction_v1/run_openai.py
      - name: Score executable separators
        run: python experiments/separator_construction_v1/score.py experiments/separator_construction_v1/answers.json | tee experiments/separator_construction_v1/score_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: separator-construction-v1-protected
          path: |
            experiments/separator_construction_v1/answers.json
            experiments/separator_construction_v1/run_metadata.json
            experiments/separator_construction_v1/scores.json
            experiments/separator_construction_v1/score_output.txt
          retention-days: 30
