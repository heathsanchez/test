name: Separator Selection V1

on:
  push:
    paths:
      - 'experiments/separator_selection_v1/TRIGGER'
  workflow_dispatch:

concurrency:
  group: separator-selection-v1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UVRM_MODEL: gpt-4.1-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen benchmark
        run: python experiments/separator_selection_v1/validate.py
      - name: Run protected 30-call separator benchmark
        run: python experiments/separator_selection_v1/run_openai.py
      - name: Score protected answers
        run: python experiments/separator_selection_v1/score.py experiments/separator_selection_v1/answers.json | tee experiments/separator_selection_v1/score_output.txt
      - name: Upload protected artifacts
        uses: actions/upload-artifact@v4
        with:
          name: separator-selection-v1-protected
          path: |
            experiments/separator_selection_v1/answers.json
            experiments/separator_selection_v1/run_metadata.json
            experiments/separator_selection_v1/scores.json
            experiments/separator_selection_v1/score_output.txt
          if-no-files-found: error
          retention-days: 30
