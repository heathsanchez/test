name: Spatial Structure Without Coordinates V10

on:
  push:
    branches:
      - spatial-structure-without-coordinates-v10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V10 core
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=f470fcd693f710cc838e3aa3330bc5f4bf10eabd
          git merge-base --is-ancestor "$FREEZE" HEAD
          git diff --exit-code "$FREEZE" HEAD --             experiments/spatial_structure_without_coordinates_v10/PROTOCOL.md             experiments/spatial_structure_without_coordinates_v10/basis.py             experiments/spatial_structure_without_coordinates_v10/kernel.py
          echo "V10 FROZEN CORE UNCHANGED"

      - name: Syntax check
        shell: bash
        run: |
          python -m py_compile             experiments/spatial_structure_without_coordinates_v10/basis.py             experiments/spatial_structure_without_coordinates_v10/kernel.py             experiments/spatial_structure_without_coordinates_v10/challenge_pack.py             experiments/spatial_structure_without_coordinates_v10/run.py

      - name: Run post-freeze coordinate-free spatial suite
        shell: bash
        run: |
          set -o pipefail
          cd experiments/spatial_structure_without_coordinates_v10
          python -u run.py 2>&1 | tee run.log

      - name: Evidence summary
        if: always()
        shell: bash
        run: |
          cd experiments/spatial_structure_without_coordinates_v10
          test -f evidence.json
          python - <<'PY'
          import json
          e=json.load(open("evidence.json"))
          print("VERDICT", e["verdict"])
          print("FULL_PASS", e["full_pass"])
          for k,v in e["gates"].items():
              print(f"GATE {k}={v}")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-structure-without-coordinates-v10-evidence
          path: |
            experiments/spatial_structure_without_coordinates_v10/evidence.json
            experiments/spatial_structure_without_coordinates_v10/run.log
            experiments/spatial_structure_without_coordinates_v10/FREEZE.json
            experiments/spatial_structure_without_coordinates_v10/PROTOCOL.md
          if-no-files-found: error
