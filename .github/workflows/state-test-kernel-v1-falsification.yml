name: State Test Kernel V1 Falsification

on:
  push:
    paths:
      - "experiments/state_test_kernel_v1/FROZEN_CANDIDATE.md"
      - "scripts/state_test_kernel_v1_falsification.py"
      - ".github/workflows/state-test-kernel-v1-falsification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove frozen candidate unchanged
        run: |
          set -euxo pipefail
          git diff --exit-code 9e6102ab8e1b1f2b3e10ae663a56d8178c975d3a --             experiments/state_test_kernel_v1/FROZEN_CANDIDATE.md
          echo "STATE_TEST_KERNEL_V1_FROZEN_UNCHANGED"

      - name: Run exhaustive falsification suite
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/state_test_kernel_v1_falsification.py | tee state-test-kernel-v1.log

      - name: Classify candidate result
        run: |
          set -euo pipefail
          if grep -Fq "FALSIFIED_STATE_TEST_KERNEL_V1" state-test-kernel-v1.log; then
            echo "STATE_TEST_KERNEL_V1_FALSIFICATION_RECORDED"
            exit 0
          fi
          grep -F "SURVIVED_STATE_TEST_KERNEL_V1_EXHAUSTIVE_SUITE" state-test-kernel-v1.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-test-kernel-v1-falsification
          path: |
            experiments/state_test_kernel_v1/FROZEN_CANDIDATE.md
            state-test-kernel-v1.log
          if-no-files-found: warn
