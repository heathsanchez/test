name: State Test Kernel V2 Falsification

on:
  push:
    paths:
      - "experiments/state_test_kernel_v2/FROZEN_CANDIDATE.md"
      - "scripts/state_test_kernel_v2_falsification.py"
      - ".github/workflows/state-test-kernel-v2-falsification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove frozen V2 unchanged
        run: |
          set -euxo pipefail
          git diff --exit-code 558ec58938b64fd63326bbf127566ee729bba40b --             experiments/state_test_kernel_v2/FROZEN_CANDIDATE.md
          echo "STATE_TEST_KERNEL_V2_FROZEN_UNCHANGED"

      - name: Run exhaustive V2 suite
        run: |
          set -o pipefail
          python scripts/state_test_kernel_v2_falsification.py | tee state-test-kernel-v2.log
          grep -F "SURVIVED_STATE_TEST_KERNEL_V2_EXHAUSTIVE_SUITE" state-test-kernel-v2.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-test-kernel-v2-evidence
          path: |
            experiments/state_test_kernel_v2/FROZEN_CANDIDATE.md
            state-test-kernel-v2.log
          if-no-files-found: warn
