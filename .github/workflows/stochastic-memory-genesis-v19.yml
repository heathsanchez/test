name: Stochastic Memory Genesis V19
on:
  push:
    branches: [stochastic-memory-genesis-v19]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen V19 core
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=27a7cf4eb11af34ef111cd614483882b2aef1b86
          git merge-base --is-ancestor "$FREEZE" HEAD
          git diff --exit-code "$FREEZE" HEAD --             experiments/stochastic_memory_genesis_v19/PROTOCOL.md             experiments/stochastic_memory_genesis_v19/basis.py             experiments/stochastic_memory_genesis_v19/kernel.py
      - name: Syntax
        run: python -m py_compile experiments/stochastic_memory_genesis_v19/{basis.py,kernel.py,challenge_pack.py,run.py}
      - name: Run V19
        shell: bash
        run: |
          set -o pipefail
          cd experiments/stochastic_memory_genesis_v19
          python -u run.py 2>&1 | tee run.log
      - name: Evidence summary
        if: always()
        shell: bash
        run: |
          cd experiments/stochastic_memory_genesis_v19
          test -f evidence.json
          python - <<'PY'
          import json
          e=json.load(open("evidence.json"))
          print("VERDICT",e["verdict"])
          print("FULL_PASS",e["full_pass"])
          for k,v in e["gates"].items(): print(f"GATE {k}={v}")
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stochastic-memory-genesis-v19-evidence
          path: |
            experiments/stochastic_memory_genesis_v19/evidence.json
            experiments/stochastic_memory_genesis_v19/run.log
            experiments/stochastic_memory_genesis_v19/FREEZE.json
            experiments/stochastic_memory_genesis_v19/PROTOCOL.md
          if-no-files-found: error
