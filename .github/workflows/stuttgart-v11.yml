name: Stuttgart V11 real Fig2 and quantum equivalence (Fig3b sealed)
on:
  push:
    branches: ['research/stuttgart-quantum-boundary-v11']
    paths: ['research/stuttgart_v11/**', '.github/workflows/stuttgart-v11.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  full-calibration-and-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check sealed protocol and no Fig3b raw access
        run: |
          sha256sum research/stuttgart_v11/PREREGISTERED_PROTOCOL.md
          grep 'SEALED HOLDOUT' research/stuttgart_v11/PREREGISTERED_PROTOCOL.md
          ! grep -R 'DARUS-3262/13' research/stuttgart_v11/*.py
      - name: Install numeric verifier
        run: python -m pip install --quiet numpy scipy
      - name: Mathematical joint-to-instrument and cut equivalence
        run: python research/stuttgart_v11/verify_quantum_equivalence.py
      - name: Fetch and verify only calibration data
        run: python research/stuttgart_v11/fetch_calibration.py
      - name: Source-mapped FID ODMR and selective Kraus calibration
        run: python research/stuttgart_v11/reproduce_calibration.py
      - name: Fetch published Figure 2 for audit (not held-out Figure 3)
        run: python research/stuttgart_v11/fetch_figure2.py
      - name: Save original calibration, source figure and calculation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stuttgart-v11-source-corrected-qualification
          path: |
            research/stuttgart_v11/calibration_data/
            research/stuttgart_v11/source_figures/
            research/stuttgart_v11/calibration_reproduction_results.json
            research/stuttgart_v11/quantum_equivalence_results.json
          if-no-files-found: warn
