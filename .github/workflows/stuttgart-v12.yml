name: Stuttgart V12 published-quantum history quotient and inverse gate
on:
  push:
    branches: ['research/stuttgart-boundary-v12']
    paths: ['research/stuttgart_v12/**', '.github/workflows/stuttgart-v12.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preserve and check V11 sealed experimental holdout
        run: |
          sha256sum research/stuttgart_v11/PREREGISTERED_PROTOCOL.md
          grep "SEALED HOLDOUT" research/stuttgart_v11/PREREGISTERED_PROTOCOL.md
          if grep -R 'DARUS-3262/13\|Fig3bdata' research/stuttgart_v12/*.py; then exit 1; fi
      - name: Install pinned numeric library versions
        run: python -m pip install --quiet numpy==2.2.6 scipy==1.15.3
      - name: Independently retrieve the published Supplementary Information
        run: python research/stuttgart_v12/fetch_supplement.py
      - name: Verify independent public metadata inventory only
        run: python research/stuttgart_v12/fetch_public_inventory.py
      - name: Acquire only published Figure 2 calibration with source checksums
        run: python research/stuttgart_v11/fetch_calibration.py
      - name: Quantum history count sufficiency and noncommutation falsifier
        run: python research/stuttgart_v12/quantum_history_quotient.py
      - name: Real-data inverse feasibility and two extreme physically admissible spectral witnesses
        run: OPENBLAS_NUM_THREADS=1 python research/stuttgart_v12/real_data_identifiability.py
      - name: Preserve source, exact input data and verifiable outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stuttgart-v12-source-frozen-evidence
          path: |
            research/stuttgart_v12/supplement_source/
            research/stuttgart_v12/public_inventory.json
            research/stuttgart_v12/history_quotient_results.json
            research/stuttgart_v12/identifiability_results.json
            research/stuttgart_v11/calibration_data/
          if-no-files-found: warn
