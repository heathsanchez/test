name: Target Quotient Right Question V1
on:
  push:
    paths:
      - 'experiments/target_quotient_right_question_v1/**'
      - '.github/workflows/target-quotient-right-question-v1.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    env:
      UVRM_MODEL: gpt-4.1-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen benchmark
        run: python experiments/target_quotient_right_question_v1/validate.py
      - name: Run protected target-quotient benchmark
        run: python experiments/target_quotient_right_question_v1/run_openai.py
      - name: Score externally
        run: python experiments/target_quotient_right_question_v1/score.py experiments/target_quotient_right_question_v1/answers.json | tee experiments/target_quotient_right_question_v1/score_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: target-quotient-right-question-v1-protected
          path: |
            experiments/target_quotient_right_question_v1/tasks.json
            experiments/target_quotient_right_question_v1/answers.json
            experiments/target_quotient_right_question_v1/run_metadata.json
            experiments/target_quotient_right_question_v1/scores.json
            experiments/target_quotient_right_question_v1/score_output.txt
          retention-days: 30
