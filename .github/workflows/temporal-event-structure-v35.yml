name: Temporal Event Structure Genesis V35

on:
  push:
    branches:
      - temporal-event-structure-v35
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V35 core
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=17e656af253f440980fdf71588ae5b4a1c913b11
          git merge-base --is-ancestor "$FREEZE" HEAD
          changed="$(git diff --name-only "$FREEZE"..HEAD --             experiments/temporal_event_structure_v35/PROTOCOL.md             experiments/temporal_event_structure_v35/basis.py             experiments/temporal_event_structure_v35/kernel.py             experiments/temporal_event_structure_v35/FREEZE.json)"
          if [ -n "$changed" ]; then
            echo "Frozen V35 core changed after scientific freeze:"
            echo "$changed"
            exit 1
          fi

      - name: Syntax check
        run: |
          python -m py_compile             experiments/temporal_event_structure_v35/basis.py             experiments/temporal_event_structure_v35/kernel.py             experiments/temporal_event_structure_v35/challenge_pack.py             experiments/temporal_event_structure_v35/run.py

      - name: Run frozen V35 experiment
        working-directory: experiments/temporal_event_structure_v35
        shell: bash
        run: |
          set -o pipefail
          python run.py | tee run.log

      - name: Evidence summary
        if: always()
        working-directory: experiments/temporal_event_structure_v35
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence.json")
          if not p.exists():
              print("No evidence.json produced")
              raise SystemExit(1)
          e=json.loads(p.read_text())
          print("verdict:",e.get("verdict"))
          print("full_pass:",e.get("full_pass"))
          for k,v in sorted(e.get("gates",{}).items()):
              print(k,v)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-event-structure-v35-evidence
          path: |
            experiments/temporal_event_structure_v35/evidence.json
            experiments/temporal_event_structure_v35/run.log
            experiments/temporal_event_structure_v35/FREEZE.json
            experiments/temporal_event_structure_v35/PROTOCOL.md
