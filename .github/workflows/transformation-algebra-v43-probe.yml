name: Transformation Algebra V43 Probe

on:
  push:
    branches:
      - transformation-algebra-v43
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen core
        run: |
          set -euo pipefail
          FREEZE=bb03759eb9cd753799df1b08e262c5e07f89a60b
          git merge-base --is-ancestor "$FREEZE" HEAD
          changed="$(git diff --name-only "$FREEZE"..HEAD --             experiments/transformation_algebra_v43/PROTOCOL.md             experiments/transformation_algebra_v43/basis.py             experiments/transformation_algebra_v43/kernel.py             experiments/transformation_algebra_v43/FREEZE.json)"
          test -z "$changed" || { echo "$changed"; exit 1; }
      - name: Probe
        working-directory: experiments/transformation_algebra_v43
        run: |
          python probe.py
