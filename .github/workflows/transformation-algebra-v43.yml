name: Transformation Algebra Genesis V43

on:
  push:
    branches:
      - transformation-algebra-v43
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V43 core
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=bb03759eb9cd753799df1b08e262c5e07f89a60b
          git merge-base --is-ancestor "$FREEZE" HEAD
          changed="$(git diff --name-only "$FREEZE"..HEAD --             experiments/transformation_algebra_v43/PROTOCOL.md             experiments/transformation_algebra_v43/basis.py             experiments/transformation_algebra_v43/kernel.py             experiments/transformation_algebra_v43/FREEZE.json)"
          if [ -n "$changed" ]; then
            echo "Frozen V43 core changed after scientific freeze:"
            echo "$changed"
            exit 1
          fi

      - name: Syntax check
        run: |
          python -m py_compile             experiments/transformation_algebra_v43/basis.py             experiments/transformation_algebra_v43/kernel.py             experiments/transformation_algebra_v43/challenge_pack.py             experiments/transformation_algebra_v43/run.py

      - name: Run frozen V43 experiment
        working-directory: experiments/transformation_algebra_v43
        run: |
          set -o pipefail
          python run.py | tee run.log

      - name: Evidence summary
        if: always()
        working-directory: experiments/transformation_algebra_v43
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence.json")
          if not p.exists():
              print("No evidence.json produced")
              raise SystemExit(1)
          e=json.loads(p.read_text())
          print("verdict:",e.get("verdict"))
          print("full_pass:",e.get("full_pass"))
          for k,v in sorted(e.get("gates",{}).items()):
              print(k,v)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transformation-algebra-v43-evidence
          path: |
            experiments/transformation_algebra_v43/evidence.json
            experiments/transformation_algebra_v43/run.log
            experiments/transformation_algebra_v43/FREEZE.json
            experiments/transformation_algebra_v43/PROTOCOL.md
