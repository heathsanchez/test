name: Transformation Quotient V42 Probe

on:
  push:
    branches:
      - transformation-quotient-genesis-v42
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen core
        run: |
          set -euo pipefail
          FREEZE=2028f974258daae395d095ac6a57e57185360ce3
          git merge-base --is-ancestor "$FREEZE" HEAD
          changed="$(git diff --name-only "$FREEZE"..HEAD --             experiments/transformation_quotient_v42/PROTOCOL.md             experiments/transformation_quotient_v42/basis.py             experiments/transformation_quotient_v42/kernel.py             experiments/transformation_quotient_v42/FREEZE.json)"
          test -z "$changed" || { echo "$changed"; exit 1; }
      - name: Probe
        working-directory: experiments/transformation_quotient_v42
        run: |
          python probe.py
