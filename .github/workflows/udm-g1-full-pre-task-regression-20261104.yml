name: UDM G1 complete pre-task pilot regression
on:
  push:
    branches: [research/udm-g1-native-case-coverage-20261104, research/udm-casebound-successor-20261104]
    paths:
      - 'research/sustained_refactory_pilot/pilot.py'
      - 'research/sustained_refactory_pilot/audit.py'
      - 'research/sustained_refactory_pilot/test_pilot.py'
      - '.github/workflows/udm-g1-full-pre-task-regression-20261104.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-unopened-pilot-unit-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/triskelion
          ref: 426c54f7c774560e0fabe7213c5ef333b1327c71
          path: components/triskelion
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed unit-test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 packaging==26.3
      - name: Historical frozen runner remains independently verifiable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,hashlib,importlib.util
          from pathlib import Path
          p='research/sustained_refactory_pilot/pilot.py'
          old=subprocess.check_output(['git','show','f917955b2f83d3f21d598a81634aeeb60a7c0af5:'+p])
          successor=Path(p).read_bytes()
          assert old!=successor,'SUCCESSOR_MUST_NOT_REWRITE_ORIGINAL_RUNNER'
          spec=importlib.util.spec_from_file_location('historical_audit','research/sustained_refactory_pilot/audit.py')
          audit=importlib.util.module_from_spec(spec);spec.loader.exec_module(audit)
          assert audit.sha(old)==hashlib.sha256(old).hexdigest()
          print('HISTORICAL_FROZEN_RUNNER_SEPARATE_FROM_SUCCESSOR')
          PY
      - name: Native V104 and protected fixture-ID controls without opening task bodies
        shell: bash
        env:
          UDM_V104_SOURCE: ${{ github.workspace }}/components/triskelion
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git -C components/triskelion rev-parse HEAD)" = 426c54f7c774560e0fabe7213c5ef333b1327c71
          python -B -m pytest -q --import-mode=importlib research/sustained_refactory_pilot/test_pilot.py 2>&1 | tee /tmp/all-pilot-unit-tests.log
          grep -q '16 passed' /tmp/all-pilot-unit-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udm-g1-full-pilot-pre-task-unit-test-evidence
          path: /tmp/all-pilot-unit-tests.log
          retention-days: 60
