name: UDM AnyIO mutable-closure equivalence fix V2

on:
  push:
    branches:
      - research/udm-anyio-mutable-closure-equivalence-fix-v2-20261018
    paths:
      - research/unified_consequence_runtime/G2_MUTABLE_CLOSURE_EQUIVALENCE_FIX_PROTOCOL_V2.json
      - research/unified_consequence_runtime/g2_mutable_closure_trace_plugin_v2.py
      - research/unified_consequence_runtime/g2_anyio_mutable_closure_equivalence_fix_v2.py
      - research/unified_consequence_runtime/qualify_g2_anyio_mutable_closure_equivalence_fix_v2.py
      - research/unified_consequence_runtime/run_g2_anyio_mutable_closure_equivalence_fix_v2.sh
      - .github/workflows/udm-g2-anyio-mutable-closure-equivalence-fix-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute frozen observer repair and class-selection protocol
        run: bash research/unified_consequence_runtime/run_g2_anyio_mutable_closure_equivalence_fix_v2.sh
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udm-anyio-mutable-closure-equivalence-fix-v2
          retention-days: 90
          if-no-files-found: warn
          path: evidence/g2-anyio-v2/
