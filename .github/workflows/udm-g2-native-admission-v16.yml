name: UDM V16 independently checked native admission (calibration only)
on:
  push:
    branches:
      - research/udm-g2-admission-v16-20261018
    paths:
      - .github/workflows/udm-g2-native-admission-v16.yml
      - research/unified_consequence_runtime/g2_native_admission_v2.py
      - research/unified_consequence_runtime/test_g2_native_admission_v2.py
      - research/unified_consequence_runtime/audit_g2_native_admission_v16.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependency
        run: python -m pip install pytest==9.0.2
      - name: Execute source-native adversarial contracts
        run: python -m unittest -v research.unified_consequence_runtime.test_g2_native_admission_v2
  source-owned-calibration:
    needs: adversarial-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin source, original test selector and upstream lock before native execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/g2-v16
          git clone --filter=blob:none --no-checkout https://github.com/pallets/itsdangerous.git /tmp/g2-itsdangerous
          git -C /tmp/g2-itsdangerous checkout --detach 096c8d42545d3b68ea21a4f890fb2b2d8979c0bd
          test "$(git -C /tmp/g2-itsdangerous rev-parse HEAD)" = 096c8d42545d3b68ea21a4f890fb2b2d8979c0bd
          test "$(git -C /tmp/g2-itsdangerous rev-parse HEAD:requirements/tests.txt)" = 1d21920f4a1670e552e822270139855e4e7ed949
          python - <<'PY'
          import json
          from pathlib import Path
          pin={
            "repository":"pallets/itsdangerous",
            "sha":"096c8d42545d3b68ea21a4f890fb2b2d8979c0bd",
            "requirements_blob":"1d21920f4a1670e552e822270139855e4e7ed949",
            "test_paths":["tests"],
            "required_test_prefixes":["tests/test_itsdangerous/test_signer.py::TestSigner::test_signer"],
            "scope":"CALIBRATION_ONLY"}
          Path("evidence/g2-v16/pin.json").write_text(json.dumps(pin,sort_keys=True,indent=2)+"\n")
          PY
      - name: Install original complete pin set, not guessed pytest-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r /tmp/g2-itsdangerous/requirements/tests.txt
          python -m pip install -e /tmp/g2-itsdangerous
          python -m pip freeze > evidence/g2-v16/pip-freeze.txt
          python - <<'PY'
          import pytest
          assert pytest.__version__ == "8.1.1",pytest.__version__
          PY
      - name: Run original suite and separately retain protected native call evidence
        shell: bash
        run: |
          set -euo pipefail
          python research/unified_consequence_runtime/g2_native_admission_v2.py /tmp/g2-itsdangerous evidence/g2-v16
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("evidence/g2-v16/admission.json").read_text())
          assert result["status"]=="ADMITTED_NATIVE_PASS_CALIBRATION",result
          assert result["G2"]=="UNKNOWN",result
          assert result["native_calls"]==1,result
          assert result["counts"]["cases"]>0,result
          PY
      - name: Independent admission-packet audit and forged-packet controls
        shell: bash
        run: |
          set -euo pipefail
          python -m research.unified_consequence_runtime.audit_g2_native_admission_v16 \
            evidence/g2-v16 evidence/g2-v16/independent_audit.json
          python - <<'PY'
          import json
          import shutil
          import tempfile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from research.unified_consequence_runtime.audit_g2_native_admission_v16 import audit
          baseline=Path('evidence/g2-v16').resolve()
          controls={}
          for change in ('wrong_pin','forged_G2','forged_case_count','forged_calls',
                         'forged_source_manifest','forged_skipped_test'):
              with tempfile.TemporaryDirectory() as directory:
                  trial=Path(directory)/'packet'
                  shutil.copytree(baseline,trial)
                  if change in ('wrong_pin','forged_G2','forged_case_count',
                                'forged_calls','forged_source_manifest'):
                      file={'wrong_pin':'pin.json','forged_G2':'admission.json',
                            'forged_case_count':'admission.json','forged_calls':'events.json',
                            'forged_source_manifest':'admission.json'}[change]
                      target=trial/file
                      value=json.loads(target.read_text())
                      if change=='wrong_pin':value['sha']='f'*40
                      elif change=='forged_G2':value['G2']='WARRANTED'
                      elif change=='forged_case_count':value['counts']['cases']+=1
                      elif change=='forged_calls':value['calls'][0]['outcome']='failed'
                      elif change=='forged_source_manifest':
                          value['source_identity']['entries'][0]['oid']='f'*40
                      target.write_text(json.dumps(value,sort_keys=True)+'\n')
                  else:
                      tree=ET.parse(trial/'native.xml')
                      first=next(tree.getroot().iter('testcase'))
                      ET.SubElement(first,'skipped')
                      tree.write(trial/'native.xml',encoding='utf-8',xml_declaration=True)
                  try:
                      audit(trial)
                  except (ValueError,ET.ParseError):
                      controls[change]='REJECTED_AS_REQUIRED'
                  else:
                      raise AssertionError('forged packet was accepted: '+change)
          (baseline/'AUDIT_NEGATIVE_CONTROLS.json').write_text(
              json.dumps(controls,sort_keys=True,indent=2)+'\n')
          assert len(controls)==6
          PY
      - name: Archive real-source PASS or original UNKNOWN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udm-v16-native-calibration-source-and-junit
          path: evidence/g2-v16/
          if-no-files-found: error
