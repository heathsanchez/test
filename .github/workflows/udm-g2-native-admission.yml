name: UDM G2 pinned native admission remediation (G2 UNKNOWN)
on:
  push:
    branches:
      - research/udm-g2-native-admission-repair-20261018
    paths:
      - '.github/workflows/udm-g2-native-admission.yml'
      - 'research/unified_consequence_runtime/g2_native_admission.py'
      - 'research/unified_consequence_runtime/G2_ADMISSION_REPAIR_20261018.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-native-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze upstream commit before reading target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/g2
          git ls-remote https://github.com/pallets/itsdangerous.git refs/tags/2.2.0 refs/tags/2.2.0^{} > evidence/g2/upstream-refs.txt
          python - <<'PY'
          import json,pathlib,re
          lines=pathlib.Path('evidence/g2/upstream-refs.txt').read_text().splitlines()
          refs=dict(line.split('\t',1)[::-1] for line in lines)
          sha=refs.get('refs/tags/2.2.0^{}') or refs.get('refs/tags/2.2.0')
          assert sha == '096c8d42545d3b68ea21a4f890fb2b2d8979c0bd', 'FROZEN_UPSTREAM_SHA_DRIFT'
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          pathlib.Path('evidence/g2/pin.json').write_text(json.dumps({'url':'https://github.com/pallets/itsdangerous.git','ref':'refs/tags/2.2.0','sha':sha},sort_keys=True,indent=2))
          PY
      - name: Clone only exact frozen source and install native tests
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c "import json;print(json.load(open('evidence/g2/pin.json'))['sha'])")"
          git clone --filter=blob:none --no-checkout https://github.com/pallets/itsdangerous.git /tmp/g2-native
          git -C /tmp/g2-native checkout --detach "$sha"
          test "$(git -C /tmp/g2-native rev-parse HEAD)" = "$sha"
          # The archived RED omitted the upstream-authored tests lock; freezegun was missing.
          python -m pip install -r /tmp/g2-native/requirements/tests.txt
          python -m pip install --no-deps -e /tmp/g2-native
          python -m pip check
          python - <<'PY'
          import importlib.metadata as md, json, pathlib
          expected={'pytest':'8.1.1','freezegun':'1.4.0','iniconfig':'2.0.0',
                    'packaging':'24.0','pluggy':'1.4.0','python-dateutil':'2.9.0.post0','six':'1.16.0'}
          actual={name: md.version(name) for name in expected}
          assert actual == expected, f'FROZEN_TEST_PROFILE_MISMATCH {actual}'
          pathlib.Path('evidence/g2/test-profile.json').write_text(
              json.dumps({'status':'PINNED_SOURCE_TEST_REQUIREMENTS','versions':actual},
                         sort_keys=True,indent=2))
          PY
          python -m pip freeze > evidence/g2/pip-freeze.txt
      - name: Require genuine native test assertions
        shell: bash
        run: |
          set -euo pipefail
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python research/unified_consequence_runtime/g2_native_admission.py /tmp/g2-native evidence/g2
      - name: Test fail-closed authority negatives without another native run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, sys
          root=pathlib.Path('evidence/g2')
          original=json.loads((root/'pin.json').read_text())
          adversaries={}
          bad=root/'negative-wrong-commit'
          bad.mkdir()
          (bad/'pin.json').write_text(json.dumps({**original,'sha':'0'*40}))
          cmd=[sys.executable,'research/unified_consequence_runtime/g2_native_admission.py',
               '/tmp/g2-native',str(bad)]
          p=subprocess.run(cmd,text=True,capture_output=True)
          assert p.returncode!=0 and 'SOURCE_IDENTITY_MISMATCH' in p.stderr, (p.returncode,p.stderr)
          adversaries['wrong_commit']='REFUSED_BEFORE_TESTS'
          mutation=pathlib.Path('/tmp/g2-native/__g2_unauthorized_source')
          try:
              mutation.write_text('unauthorized')
              good=root/'negative-dirty-tree';good.mkdir()
              (good/'pin.json').write_text(json.dumps(original))
              p=subprocess.run([*cmd[:-1],str(good)],text=True,capture_output=True)
              assert p.returncode!=0 and 'DIRTY_SOURCE' in p.stderr, (p.returncode,p.stderr)
              adversaries['dirty_tree']='REFUSED_BEFORE_TESTS'
          finally:
              mutation.unlink(missing_ok=True)
          assert not subprocess.check_output(['git','-C','/tmp/g2-native','status','--porcelain']).strip()
          (root/'negative-authority.json').write_text(json.dumps(adversaries,indent=2,sort_keys=True))
          PY
      - name: Record precisely what clean native admission did and did not establish
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('evidence/g2');p.mkdir(parents=True,exist_ok=True)
          a=json.loads((p/'admission.json').read_text()) if (p/'admission.json').is_file() else {}
          status=a.get('status','UNKNOWN_APPARATUS_NO_ADMISSION')
          verdict={'schema':'UDM_CLEAN_NATIVE_ADMISSION_BOUNDARY_V1',
                   'source_commit':os.environ['GITHUB_SHA'],
                   'admission':status,
                   'original_native_tests':a.get('tests',0),
                   'protected_failing_obligation':'NOT_SUPPLIED_CLEAN_RELEASE_SUITE',
                   'G2':'UNKNOWN','G3':'UNKNOWN','G4':'UNKNOWN','G5':'UNKNOWN','G6':'UNKNOWN',
                   'method_acquisition':'NOT_EXECUTED',
                   'native_developmental_comparator':'NOT_EXECUTED',
                   'next_gate':'Freeze a new authentic source-distinct protected failing obligation before developmental selection'}
          (p/'SCIENTIFIC_BOUNDARY.json').write_text(json.dumps(verdict,indent=2,sort_keys=True)+'\n')
          PY
      - name: Archive evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-independent-native-admission
          path: evidence/g2/
          if-no-files-found: error

  inherited-machinery-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_OPTIONAL_LOCKS: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      UDM_V15_EXPOSED: 'EXPOSED_COMPOSITION_NOT_G2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Assert unchanged V15 and V6 frozen tests
        run: |
          set -euo pipefail
          mkdir -p evidence/g2-preservation
          git rev-parse HEAD > evidence/g2-preservation/RESEARCH_HEAD.txt
          test "$(git rev-parse HEAD:research/unified_consequence_runtime/test_observation_composition_v15.py)" = 83557a8f5f6a9ac9c6cb0d5a16804297d913619e
          test "$(git rev-parse HEAD:research/unified_consequence_runtime/test_typed_native_authority_v6.py)" = 0489cd0eebdd9880eb8065c2fbe8a554ea248a0d
          git diff --name-only ef32d67166f7c0e7a6b9f9d6f6e1bcce15a860be HEAD > evidence/g2-preservation/CHANGED_SOURCE_PATHS.txt
          if grep -Ev '^(\.github/workflows/udm-g2-native-admission.yml|research/unified_consequence_runtime/g2_native_admission.py|research/unified_consequence_runtime/G2_ADMISSION_REPAIR_20261018.md)$' evidence/g2-preservation/CHANGED_SOURCE_PATHS.txt | grep .; then exit 1; fi
      - name: Install the existing exact V15 method-test interpreter profile
        run: |
          set -euo pipefail
          python -B -m pip install --disable-pip-version-check --no-input pytest==8.3.5 pytest-cov==6.2.1 pluggy==1.6.0 coverage==7.10.6 packaging==26.3 attrs==24.3.0 hypothesis==6.122.3 typing_extensions==4.12.2 colorama==0.4.6 rich==13.9.4 click==8.2.0 tenacity==9.1.2 markupsafe==3.0.2
          git fetch --quiet --no-tags --depth=1 origin 6031466188046f56b4660d772d13ad731ed4c0f2
          mkdir -p components
          git init -q components/triskelion
          git -C components/triskelion fetch -q --depth=1 https://github.com/heathsanchez/triskelion.git 426c54f7c774560e0fabe7213c5ef333b1327c71
          git -C components/triskelion checkout -q --detach 426c54f7c774560e0fabe7213c5ef333b1327c71
          git init -q components/msi
          git -C components/msi fetch -q --depth=1 https://github.com/heathsanchez/Minimal-Sufficient-Interface.git 56cfd7b523e3592cae4eafa5468f437ccb94dbe9
          git -C components/msi checkout -q --detach 56cfd7b523e3592cae4eafa5468f437ccb94dbe9
      - name: Execute all frozen and inherited V15 V13 V10 V6 V5 authority tests
        run: |
          set -euo pipefail
          export UDM_V7_MSI="$GITHUB_WORKSPACE/components/msi"
          export UDM_V7_TRISKELION="$GITHUB_WORKSPACE/components/triskelion"
          export UDM_V15_OUT="$GITHUB_WORKSPACE/evidence/g2-preservation/exposed-only"
          python -B -m unittest research.unified_consequence_runtime.test_observation_composition_v15 research.unified_consequence_runtime.test_observed_branch_v13 research.unified_consequence_runtime.test_typed_native_authority_v10 research.unified_consequence_runtime.test_typed_native_authority_v6 research.unified_consequence_runtime.test_typed_source_inventory_v5 research.unified_consequence_runtime.test_native_suite_authority -v 2>&1 | tee evidence/g2-preservation/CONTRACTS.log
      - name: Archive regression and scientific boundary
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('evidence/g2-preservation');p.mkdir(parents=True,exist_ok=True)
          v={'source':os.environ['GITHUB_SHA'],'G2':'UNKNOWN',
             'scope':'Inherited frozen contract tests, not new prospective development',
             'V15':'SOURCE_EXPOSED_CAUSAL_NATIVE_RESULT_PRESERVED',
             'external_tasks':'NOT_CONSTRUCTED_IN_THIS_JOB'}
          (p/'SCIENTIFIC_BOUNDARY.json').write_text(json.dumps(v,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-admission-inherited-machinery-regression
          path: evidence/g2-preservation/
          if-no-files-found: warn
