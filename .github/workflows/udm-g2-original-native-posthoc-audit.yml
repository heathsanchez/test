name: Independently audit original G2 V104 AnyIO native evidence
on:
  push:
    branches:
      - research/udm-g2-anyio-native-posthoc-audit-20261018
    paths:
      - research/unified_consequence_runtime/g2_v104_native_posthoc_archive_audit_v1.py
      - .github/workflows/udm-g2-original-native-posthoc-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audited-native-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact frozen original Actions artifact, never the sealed future
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/g2-posthoc
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12118690451/zip" -o "$RUNNER_TEMP/original_g2.zip"
          echo '7ec7f9922aa3925f8d0d455f79eba414f4512c6210762e7731d442e746972680  '${RUNNER_TEMP}/original_g2.zip" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/original_g2.zip" > evidence/g2-posthoc/ARCHIVE_SHA256.txt
      - name: Independently replay frozen AST locality and native outcomes
        run: |
          set -euo pipefail
          python research/unified_consequence_runtime/g2_v104_native_posthoc_archive_audit_v1.py "$RUNNER_TEMP/original_g2.zip" | tee evidence/g2-posthoc/POSTHOC_AUDIT.json
      - name: Preserve source, provenance and scientific boundary even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udm-g2-anyio-original-native-posthoc-independent-audit
          if-no-files-found: warn
          retention-days: 90
          path: |
            research/unified_consequence_runtime/g2_v104_native_posthoc_archive_audit_v1.py
            research/unified_consequence_runtime/G2_ANYIO_V104_NATIVE_POSTHOC_LOCALITY_REPORT_V1.md
            evidence/g2-posthoc/
