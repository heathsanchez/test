name: UDM V5 independent original archive audit
on:
  push:
    branches:
      - research/udm-g2-v5-independent-evidence-audit-20261018
    paths:
      - .github/workflows/udm-g2-v5-independent-original-audit.yml
      - research/unified_consequence_runtime/audit_g2_v5_external_native_archive_v1.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve immutable original V5 native evidence by artifact ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/v5-independent-audit
          curl --fail --location --silent --show-error --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output evidence/v5-independent-audit/original.zip \
            https://api.github.com/repos/heathsanchez/test/actions/artifacts/12130707189/zip
      - name: Independently recheck ZIP, frozen protocol, real JUnit and source blobs
        shell: bash
        run: |
          set -euo pipefail
          python -B research/unified_consequence_runtime/audit_g2_v5_external_native_archive_v1.py \
            evidence/v5-independent-audit/original.zip "$GITHUB_WORKSPACE" \
            evidence/v5-independent-audit/AUDIT_RESULT.json
          cat evidence/v5-independent-audit/AUDIT_RESULT.json
      - name: Preserve independent audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udm-v5-independent-source-bound-audit
          path: evidence/v5-independent-audit/
          if-no-files-found: warn
