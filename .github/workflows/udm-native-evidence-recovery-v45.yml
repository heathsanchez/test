name: Recover exact V45 failed evidence without native re-execution

on:
  push:
    branches: [research/udm-native-namespace-v45-20261029]
  workflow_dispatch:
    inputs:
      artifact_id:
        type: string
        default: '12857138267'
        required: true
      original_run_id:
        type: string
        default: '40778435124'
        required: true
      expected_bytes:
        type: string
        default: '585195900'
        required: true
      expected_sha256:
        type: string
        default: '97897f543dee0be0f09f6c5492f2e4c383b757d0ce4a891327ca06348e126fdc'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  recover-existing-artifact:
    if: github.ref == 'refs/heads/research/udm-native-namespace-v45-20261029' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[recover-v45]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download only the existing failed-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id || '12857138267' }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id || '40778435124' }}
          EXPECTED_BYTES: ${{ inputs.expected_bytes || '585195900' }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 || '97897f543dee0be0f09f6c5492f2e4c383b757d0ce4a891327ca06348e126fdc' }}
        run: |
          set -euo pipefail
          mkdir -p recovery
          python - <<'PY'
          import json,os,re,subprocess
          for key in ('ARTIFACT_ID','ORIGINAL_RUN_ID','EXPECTED_BYTES'):
              assert re.fullmatch('[0-9]+',os.environ[key])
          assert re.fullmatch('[0-9a-f]{64}',os.environ['EXPECTED_SHA256'])
          metadata=json.loads(subprocess.check_output(['gh','api','repos/heathsanchez/test/actions/artifacts/'+os.environ['ARTIFACT_ID']]))
          assert metadata['workflow_run']['id']==int(os.environ['ORIGINAL_RUN_ID'])
          assert metadata['workflow_run']['head_branch']=='research/udm-native-namespace-v45-20261029'
          assert metadata['size_in_bytes']==int(os.environ['EXPECTED_BYTES'])
          assert metadata['digest']=='sha256:'+os.environ['EXPECTED_SHA256']
          open('recovery/ORIGINAL_ARTIFACT_API.json','w').write(json.dumps(metadata,sort_keys=True,indent=2)+'\n')
          PY
          gh api "repos/heathsanchez/test/actions/artifacts/$ARTIFACT_ID/zip" > recovery/ORIGINAL.zip
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path('recovery'); archive=root/'ORIGINAL.zip'
          expected=os.environ['EXPECTED_SHA256']
          digest=hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()
          assert archive.stat().st_size==int(os.environ['EXPECTED_BYTES']) and digest==expected
          manifest={'schema':'UDM_V45_EXACT_FAILED_ARTIFACT_TRANSPORT','native_execution':False,
                    'original_run_id':int(os.environ['ORIGINAL_RUN_ID']),'original_artifact_id':int(os.environ['ARTIFACT_ID']),
                    'original_zip_bytes':archive.stat().st_size,'original_zip_sha256':digest,'parts':[]}
          with archive.open('rb') as stream:
              for i in range(3):
                  raw=stream.read(192*1024*1024); assert raw
                  name=f'ORIGINAL.zip.part-{i:03d}'; (root/name).write_bytes(raw)
                  manifest['parts'].append({'name':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              assert not stream.read(1)
          diagnostic=root/'diagnostic'; diagnostic.mkdir()
          with zipfile.ZipFile(archive) as z:
              manifest['members']=[{'name':i.filename,'bytes':i.file_size,'compressed_bytes':i.compress_size,'crc32':i.CRC} for i in z.infolist()]
              for info in z.infolist():
                  path=Path(info.filename)
                  if (info.file_size<10*1024*1024 and not path.is_absolute() and '..' not in path.parts
                      and path.name in ('receipt.json','CHILD_NATIVE_ATTEMPTS.json','RESULT.json','contracts.xml','stdout.log','stderr.log','PYTEST_INVENTORY.json')):
                      target=diagnostic/path; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(z.read(info))
          (root/'TRANSPORT.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print(json.dumps({k:v for k,v in manifest.items() if k!='members'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v45-failed-evidence-diagnostic
          path: |
            recovery/TRANSPORT.json
            recovery/diagnostic/
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v45-failed-evidence-part-000
          path: |
            recovery/TRANSPORT.json
            recovery/ORIGINAL.zip.part-000
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v45-failed-evidence-part-001
          path: |
            recovery/TRANSPORT.json
            recovery/ORIGINAL.zip.part-001
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v45-failed-evidence-part-002
          path: |
            recovery/TRANSPORT.json
            recovery/ORIGINAL.zip.part-002
          compression-level: 0
          retention-days: 90
