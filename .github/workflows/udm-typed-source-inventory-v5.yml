name: UDM typed Git source inventory V5 qualification
on:
  push:
    branches:
      - research/udm-typed-source-inventory-v5-20261017
    paths:
      - .github/workflows/udm-typed-source-inventory-v5.yml
      - research/unified_consequence_runtime/typed_source_inventory_v5.py
      - research/unified_consequence_runtime/test_typed_source_inventory_v5.py
      - research/unified_consequence_runtime/archaeology/typed-source-v5/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: udm-typed-source-inventory-v5-${{ github.ref }}
  cancel-in-progress: false
jobs:
  typed-source-inventory-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 12
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install independently fixed qualification packages
        run: |
          set -euo pipefail
          python -B -m pip install --disable-pip-version-check --no-input packaging==26.3 pytest==8.3.5
      - name: Freeze source and independently check original verifier and V4.1 identity
        run: |
          set -euo pipefail
          mkdir -p qualification/typed-source-v5
          git rev-parse HEAD > qualification/typed-source-v5/SOURCE_COMMIT.txt
          git show HEAD:research/unified_consequence_runtime/test_typed_source_inventory_v5.py > qualification/typed-source-v5/TESTS_FROZEN.py
          for path in \
            research/unified_consequence_runtime/decisive_native_verify.py \
            research/unified_consequence_runtime/native_environment_selection_v4.py \
            research/unified_consequence_runtime/native_environment_selection_v41.py \
            research/unified_consequence_runtime/native_environment_v41.py \
            research/unified_consequence_runtime/qualify_native_frontier_v41.py \
            research/unified_consequence_runtime/capability_index.json; do
            before=$(git rev-parse dc59c8fcee6efede520c531eba5e42e7b84a1a9f:"$path")
            after=$(git rev-parse HEAD:"$path")
            test "$before" = "$after"
            printf '%s %s\n' "$path" "$after" >> qualification/typed-source-v5/PRESERVED_ORIGINAL_BLOBS.txt
          done
          git status --porcelain > qualification/typed-source-v5/PRETEST_GIT_STATUS.txt
      - name: Execute Git mode obligations and inherited native authority tests
        run: |
          set -euo pipefail
          python -B -m unittest \
            research.unified_consequence_runtime.test_typed_source_inventory_v5 \
            research.unified_consequence_runtime.test_native_environment_selection_v3 \
            research.unified_consequence_runtime.test_native_suite_authority \
            -v 2>&1 | tee qualification/typed-source-v5/CONTRACTS.log
      - name: Independent inventory replay and explicit refusal to promote
        run: |
          set -euo pipefail
          python -B - <<'PY' | tee qualification/typed-source-v5/VERDICT.json
          import hashlib,json,subprocess
          from pathlib import Path
          from research.unified_consequence_runtime import typed_source_inventory_v5 as typed
          from research.unified_consequence_runtime import decisive_native_verify as old
          import tempfile,os
          with tempfile.TemporaryDirectory(prefix='v5-native-inventory-') as folder:
              root=Path(folder).resolve()
              def git(*args):
                  return subprocess.check_output(['git','-C',str(root),*args],stderr=subprocess.PIPE).decode().strip()
              git('init','-q')
              git('config','user.name','V5 Evidence')
              git('config','user.email','ci-v5@example.invalid')
              (root/'docs').mkdir()
              (root/'docs/README.txt').write_bytes(b'real pinned content')
              (root/'README.rst').symlink_to('docs/README.txt')
              git('add','-A')
              git('commit','-qm','exact typed source')
              commit=git('rev-parse','HEAD')
              value=typed.snapshot(root,commit)
              assert value['status']=='TYPED_INVENTORY_ONLY'
              assert value['counts']=={'regular':1,'symlink':1,'gitlink':0}
              assert value['links'][0]['resolution']=='INTERNAL_REGULAR_FILE'
              try:old._snapshot(root,commit)
              except ValueError:pass
              else:raise AssertionError('the original verifier was weakened')
              print(json.dumps({
                  'status':'PASS_BOUNDED_TYPED_SOURCE_INVENTORY_ONLY',
                  'G2':'UNKNOWN','G3':'UNKNOWN','G4':'UNKNOWN','G5':'UNKNOWN','G6':'UNKNOWN',
                  'original_verifier_preserved':True,
                  'synthetic_source_commit':commit,
                  'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'result_manifest_sha256':value['manifest_sha256'],
                  'native_test_calls_on_real_frontier':0,
              },sort_keys=True))
          PY
      - name: Read-only typed inventory of pinned exposed real wcwidth Git history
        timeout-minutes: 4
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/wcwidth-v5-source"
          mkdir -p "$source_dir"
          git -C "$source_dir" init -q
          git -C "$source_dir" fetch --quiet --no-tags --depth=1 \
            https://github.com/jquast/wcwidth.git \
            784d08c6cf6b67e19f34ae5ddb9bb8b4aa4f17fe
          export UDM_V5_EXPOSED_SOURCE="$source_dir"
          python -B - <<'PY' | tee qualification/typed-source-v5/EXPOSED_REAL_GIT_DIAGNOSTIC.json
          import hashlib,json,os
          from pathlib import Path
          from research.unified_consequence_runtime import typed_source_inventory_v5 as typed
          from research.unified_consequence_runtime import decisive_native_verify as original
          commit='784d08c6cf6b67e19f34ae5ddb9bb8b4aa4f17fe'
          root=Path(os.environ['UDM_V5_EXPOSED_SOURCE']).absolute()
          result=typed.snapshot(root,commit)
          modes={m['path']:m['mode'] for m in result['manifest']}
          assert result['status']=='TYPED_INVENTORY_ONLY'
          assert modes.get('README.rst')=='120000'
          assert result['counts']['regular']>0
          assert result['counts']['symlink']>0
          assert result['counts']['gitlink']>0
          assert len(result['manifest'])==sum(result['counts'].values())
          try:
              original._snapshot(root,commit)
          except ValueError as e:
              assert 'only regular tracked files' in str(e)
          else:
              raise AssertionError('original native verifier unexpectedly admitted nonregular source')
          report={
            'status':'EXPOSED_REAL_SOURCE_TYPED_INVENTORY_ONLY',
            'repository':'jquast/wcwidth',
            'original_source_commit':commit,
            'mode_counts':result['counts'],
            'mode_120000_readme':'README.rst',
            'git_tree':result['git_tree'],
            'manifest_sha256':result['manifest_sha256'],
            'original_native_verifier_still_refuses':True,
            'native_test_calls':0,'agent_calls':0,
            'G2':'UNKNOWN','G3':'UNKNOWN','G4':'UNKNOWN','G5':'UNKNOWN','G6':'UNKNOWN',
          }
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Archive reproducible source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-source-inventory-v5-${{ github.sha }}
          path: qualification/typed-source-v5/
          retention-days: 90
          if-no-files-found: warn
