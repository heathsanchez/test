name: V7 typed V104 + original MSI bridge qualification
on:
  push:
    branches: [research/udm-typed-v104-prospective-v7-20261017]
    paths:
      - .github/workflows/udm-typed-v104-bridge-v7.yml
      - research/unified_consequence_runtime/typed_v104_msi_bridge_v7.py
      - research/unified_consequence_runtime/test_typed_v104_msi_bridge_v7.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: udm-v7-bridge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-method-typed-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_OPTIONAL_LOCKS: '0'
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Freeze V7 test source and original V5 V6/verifier identities before any execution
        run: |
          set -euo pipefail
          mkdir -p qualification/v7-bridge
          test "$(git rev-parse HEAD:research/unified_consequence_runtime/test_typed_v104_msi_bridge_v7.py)" = \
               "fe8d5a62151c57ff43d5b051a62099d5f31681f3"
          git rev-parse HEAD > qualification/v7-bridge/SOURCE_COMMIT.txt
          for path in \
            research/unified_consequence_runtime/typed_native_authority_v6.py \
            research/unified_consequence_runtime/typed_source_inventory_v5.py \
            research/unified_consequence_runtime/decisive_native_verify.py \
            research/unified_consequence_runtime/decisive_native.py \
            research/unified_consequence_runtime/native_meta_decision.py \
            research/unified_consequence_runtime/capability_index.json; do
            test "$(git rev-parse HEAD:"$path")" = \
                 "$(git rev-parse 50cc3e1d35a6bb94c3ee84c57237ed6487663a5a:"$path")"
            printf '%s\t%s\n' "$path" "$(git rev-parse HEAD:"$path")" >> qualification/v7-bridge/ORIGINAL_BLOBS.txt
          done
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=Path('research/unified_consequence_runtime/archaeology/typed-v104-v7')
          for p in ('PROTOCOL.json','FROZEN_AUTHOR_TEST_REFS.json'):
              b=(r/p).read_bytes()
              print(json.dumps({'file':p,'sha256':hashlib.sha256(b).hexdigest()},sort_keys=True))
          PY
      - name: Fetch authenticated original V104 and MSI policies (no historical runner)
        run: |
          set -euo pipefail
          mkdir -p components
          git fetch --no-tags --depth=1 origin 6031466188046f56b4660d772d13ad731ed4c0f2
          git clone -q --no-checkout https://github.com/heathsanchez/triskelion.git components/triskelion
          git -C components/triskelion fetch -q --depth=1 origin 426c54f7c774560e0fabe7213c5ef333b1327c71
          git -C components/triskelion checkout -q --detach 426c54f7c774560e0fabe7213c5ef333b1327c71
          git clone -q --no-checkout https://github.com/heathsanchez/Minimal-Sufficient-Interface.git components/msi
          git -C components/msi fetch -q --depth=1 origin 56cfd7b523e3592cae4eafa5468f437ccb94dbe9
          git -C components/msi checkout -q --detach 56cfd7b523e3592cae4eafa5468f437ccb94dbe9
          git rev-parse 6031466188046f56b4660d772d13ad731ed4c0f2^{commit}
          git -C components/triskelion rev-parse HEAD
          git -C components/msi rev-parse HEAD
      - name: Install exact finite Python/test dependencies
        run: |
          set -euo pipefail
          python -B -m pip install --disable-pip-version-check --no-input \
              pytest==8.3.5 pytest-cov==6.2.1 pluggy==1.6.0 coverage==7.10.6 packaging==26.3
      - name: Native original-method and V6 authority regression qualification
        env:
          UDM_V7_MSI: ${{ github.workspace }}/components/msi
          UDM_V7_TRISKELION: ${{ github.workspace }}/components/triskelion
        run: |
          set -euo pipefail
          python -B -m unittest \
            research.unified_consequence_runtime.test_typed_v104_msi_bridge_v7 \
            research.unified_consequence_runtime.test_typed_native_authority_v6 \
            research.unified_consequence_runtime.test_typed_source_inventory_v5 \
            -v 2>&1 | tee qualification/v7-bridge/CONTRACTS.log
      - name: Preserve explicit G2 negative evidence boundary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          p=Path('research/unified_consequence_runtime/typed_v104_msi_bridge_v7.py')
          r={'schema':'UDM_TYPED_V104_V7_BRIDGE_QUALIFICATION',
             'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'bridge_source_sha256':hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None,
             'frozen_contract_git_oid':'fe8d5a62151c57ff43d5b051a62099d5f31681f3',
             'training_source_unopened':True,
             'source_science':'NO_PROSPECTIVE_TASKS_EXECUTED',
             'G2':'UNKNOWN','G3':'UNKNOWN','G4':'UNKNOWN',
             'agent_comparator':'NOT_RUN','economic_advantage':'UNKNOWN',
             'original_verifiers_unchanged':True}
          (Path('qualification/v7-bridge')/'BOUNDARY.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udm-v7-typed-v104-bridge-${{ github.sha }}-${{ github.run_attempt }}
          path: qualification/v7-bridge/
          retention-days: 90
          if-no-files-found: warn
