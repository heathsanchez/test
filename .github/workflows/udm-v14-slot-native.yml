name: V14 source-observed original V104 slot native qualification (exposed only)
on:
  push:
    branches: [research/udm-v14-slot-native-qualification-20261017]
    paths:
      - .github/workflows/udm-v14-slot-native.yml
      - research/unified_consequence_runtime/observed_site_v14.py
      - research/unified_consequence_runtime/qualify_observed_site_v14.py
      - research/unified_consequence_runtime/test_observed_site_v14.py
      - research/unified_consequence_runtime/archaeology/typed-v104-v14/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: udm-v14-slot-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-exposed-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_OPTIONAL_LOCKS: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      UDM_V14_EXPOSED: 'SOURCE_EXPOSED_ORIGINAL_ONLY'
      UDM_V14_OUT: ${{ github.workspace }}/qualification/v14/native
      UDM_V7_TRISKELION: ${{ github.workspace }}/components/triskelion
      UDM_V7_MSI: ${{ github.workspace }}/components/msi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Preserve original V104 source, V13 observation and frozen V14 tests
        run: |
          set -euo pipefail
          mkdir -p qualification/v14
          git rev-parse HEAD > qualification/v14/SOURCE_COMMIT.txt
          test "$(git rev-parse HEAD:research/unified_consequence_runtime/test_observed_site_v14.py)" = \
            ea1b7099fb5fd5aade82ab3bd90681c6338c59fd
          test "$(git rev-parse HEAD:research/unified_consequence_runtime/archaeology/typed-v104-v14/FROZEN_PROTOCOL.json)" = \
            f7ce15386ffa6a1a368fa3b5467365131673c9f5
          test "$(git rev-parse HEAD:research/unified_consequence_runtime/V13_EXPOSED_BRANCH_OBSERVATION_RESULT.json)" = \
            b2abfda202753a5a2dfc51fa66de69f17c8a2d1c
          for name in typed_native_authority_v6.py typed_native_authority_v10.py \
            observed_branch_v13.py typed_v104_msi_bridge_v7.py qualify_source_bound_g2_v9.py \
            decisive_native.py capability_index.json; do
            path="research/unified_consequence_runtime/$name"
            test "$(git rev-parse HEAD:"$path")" = \
                 "$(git rev-parse 1532d2ec982bcc8879c5a88f9ffcd26f96083fa2:"$path")"
          done
      - name: Install exact native interpreter requirements and fetch original operations
        run: |
          set -euo pipefail
          python -B -m pip install --disable-pip-version-check --no-input \
            pytest==8.3.5 pytest-cov==6.2.1 pluggy==1.6.0 coverage==7.10.6 \
            packaging==26.3 attrs==24.3.0 hypothesis==6.122.3 \
            typing_extensions==4.12.2 colorama==0.4.6 rich==13.9.4 \
            click==8.2.0 tenacity==9.1.2 markupsafe==3.0.2
          git fetch --quiet --no-tags --depth=1 origin \
            6031466188046f56b4660d772d13ad731ed4c0f2
          mkdir -p components
          git init -q components/triskelion
          git -C components/triskelion fetch -q --depth=1 \
            https://github.com/heathsanchez/triskelion.git 426c54f7c774560e0fabe7213c5ef333b1327c71
          git -C components/triskelion checkout -q --detach 426c54f7c774560e0fabe7213c5ef333b1327c71
          git init -q components/msi
          git -C components/msi fetch -q --depth=1 \
            https://github.com/heathsanchez/Minimal-Sufficient-Interface.git \
            56cfd7b523e3592cae4eafa5468f437ccb94dbe9
          git -C components/msi checkout -q --detach 56cfd7b523e3592cae4eafa5468f437ccb94dbe9
      - name: Execute frozen V14 source-slot contracts and inherited V13/V10 tests
        run: |
          set -euo pipefail
          python -B -m unittest \
            research.unified_consequence_runtime.test_observed_site_v14 \
            research.unified_consequence_runtime.test_observed_branch_v13 \
            research.unified_consequence_runtime.test_typed_native_authority_v10 \
            -v 2>&1 | tee qualification/v14/CONTRACTS.log
      - name: Source-exposed native baseline and eight V104 preselected original builders
        timeout-minutes: 12
        run: |
          set +e
          env -u GH_TOKEN -u GITHUB_TOKEN \
            python -B -m research.unified_consequence_runtime.qualify_observed_site_v14 \
            > qualification/v14/SCIENCE.log 2>&1
          state=$?
          printf '%s\n' "$state" > qualification/v14/SCIENCE_EXIT.txt
          tail -n 55 qualification/v14/SCIENCE.log
          exit "$state"
      - name: Check G2/G3/G4 remain unknown even when source-exposed candidate succeeds
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("qualification/v14/native/RESULT.json")
          if p.is_file():
              r=json.loads(p.read_text())
              assert r["packaging_source_opened"] is False
              assert r["source_exposed"] is True
              assert all(r[g]=="UNKNOWN" for g in ("G2","G3","G4","G5","G6"))
              assert r["native_calls"]<=18
              print("V14_SCOPE_AND_VERDICT",r.get("status"),r.get("catalog"),r.get("measured"))
          else:print("V14_UNKNOWN_NO_RESULT")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udm-v14-exposed-native-${{ github.sha }}-${{ github.run_attempt }}
          path: qualification/v14/
          retention-days: 90
