name: V15 exposed source-observed compositional AST acquisition (G2 UNKNOWN)
on:
  push:
    branches: [research/udm-v15-compositional-source-growth-20261017]
    paths:
      - .github/workflows/udm-v15-native-composition.yml
      - research/unified_consequence_runtime/observation_composition_v15.py
      - research/unified_consequence_runtime/test_observation_composition_v15.py
      - research/unified_consequence_runtime/qualify_observation_composition_v15.py
      - research/unified_consequence_runtime/archaeology/typed-v104-v15/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: udm-v15-source-composition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-source-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_OPTIONAL_LOCKS: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      UDM_V15_EXPOSED: 'EXPOSED_COMPOSITION_NOT_G2'
      UDM_V15_OUT: ${{ github.workspace }}/qualification/v15/native
      UDM_V7_TRISKELION: ${{ github.workspace }}/components/triskelion
      UDM_V7_MSI: ${{ github.workspace }}/components/msi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Bind frozen V15 grammar/tests, V13 source observation, V14 negative and original native authorities
        run: |
          set -euo pipefail
          mkdir -p qualification/v15
          git rev-parse HEAD > qualification/v15/SOURCE_COMMIT.txt
          test "$(git rev-parse HEAD:research/unified_consequence_runtime/test_observation_composition_v15.py)" = \
            83557a8f5f6a9ac9c6cb0d5a16804297d913619e
          test "$(git rev-parse HEAD:research/unified_consequence_runtime/archaeology/typed-v104-v15/FROZEN_COMPOSITION_PROTOCOL.json)" = \
            02f92d6fdc013774f9947313384e63d6f8a66d5d
          test "$(git rev-parse HEAD:research/unified_consequence_runtime/V13_EXPOSED_BRANCH_OBSERVATION_RESULT.json)" = \
            b2abfda202753a5a2dfc51fa66de69f17c8a2d1c
          test "$(git rev-parse HEAD:research/unified_consequence_runtime/V14_EXPOSED_SOURCE_SLOT_RESULT.json)" = \
            7189ec0689e54e8bb713dc950aca817ef12a7663
          for name in typed_native_authority_v6.py typed_native_authority_v10.py \
            observed_branch_v13.py typed_v104_msi_bridge_v7.py qualify_source_bound_g2_v9.py \
            decisive_native.py capability_index.json; do
            path="research/unified_consequence_runtime/$name"
            test "$(git rev-parse HEAD:"$path")" = \
                 "$(git rev-parse 1532d2ec982bcc8879c5a88f9ffcd26f96083fa2:"$path")"
          done
      - name: Install fixed original interpreter/pytest requirements and method Git pins
        run: |
          set -euo pipefail
          python -B -m pip install --disable-pip-version-check --no-input \
            pytest==8.3.5 pytest-cov==6.2.1 pluggy==1.6.0 coverage==7.10.6 \
            packaging==26.3 attrs==24.3.0 hypothesis==6.122.3 \
            typing_extensions==4.12.2 colorama==0.4.6 rich==13.9.4 \
            click==8.2.0 tenacity==9.1.2 markupsafe==3.0.2
          git fetch --quiet --no-tags --depth=1 origin \
            6031466188046f56b4660d772d13ad731ed4c0f2
          mkdir -p components
          git init -q components/triskelion
          git -C components/triskelion fetch -q --depth=1 \
            https://github.com/heathsanchez/triskelion.git 426c54f7c774560e0fabe7213c5ef333b1327c71
          git -C components/triskelion checkout -q --detach 426c54f7c774560e0fabe7213c5ef333b1327c71
          git init -q components/msi
          git -C components/msi fetch -q --depth=1 \
            https://github.com/heathsanchez/Minimal-Sufficient-Interface.git \
            56cfd7b523e3592cae4eafa5468f437ccb94dbe9
          git -C components/msi checkout -q --detach 56cfd7b523e3592cae4eafa5468f437ccb94dbe9
      - name: Execute all frozen compositional and inherited native adversarial contracts
        run: |
          set -euo pipefail
          python -B -m unittest \
            research.unified_consequence_runtime.test_observation_composition_v15 \
            research.unified_consequence_runtime.test_observed_branch_v13 \
            research.unified_consequence_runtime.test_typed_native_authority_v10 \
            -v 2>&1 | tee qualification/v15/CONTRACTS.log
      - name: Native source-exposed automatic constructor choice, physical withdrawal and fresh restoration
        timeout-minutes: 16
        run: |
          set +e
          env -u GH_TOKEN -u GITHUB_TOKEN \
            python -B -m research.unified_consequence_runtime.qualify_observation_composition_v15 \
            > qualification/v15/SCIENCE.log 2>&1
          code=$?
          echo "$code" > qualification/v15/SCIENCE_EXIT.txt
          tail -n 45 qualification/v15/SCIENCE.log
          exit "$code"
      - name: Preserve no G2 promotion and archive exact counted negative status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("qualification/v15/native/RESULT.json")
          if not r.is_file():
              print("V15_UNKNOWN_NO_NATIVE_RESULT")
          else:
              v=json.loads(r.read_text())
              assert v["source_exposed"] is True
              assert v["packaging_source_opened"] is False
              assert v["original_repaired_head_fetched"] is False
              assert v["native_calls"]<=54
              assert all(v[g]=="UNKNOWN" for g in ("G2","G3","G4","G5","G6"))
              print("V15_EXPOSED_ONLY",v["status"],
                    len(v["candidate_results"]),v.get("selected"),
                    "native",v["native_calls"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udm-v15-exposed-compositional-${{ github.sha }}-${{ github.run_attempt }}
          path: qualification/v15/
          retention-days: 90
