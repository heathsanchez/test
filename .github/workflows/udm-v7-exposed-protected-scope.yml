name: V7.1 exposed author-test scoped native diagnostic (never G2)
on:
  push:
    branches: [research/udm-v7-exposed-protected-scope-20261017]
    paths:
      - .github/workflows/udm-v7-exposed-protected-scope.yml
      - research/unified_consequence_runtime/qualify_v7_exposed_protected_scope.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: udm-v7-exposed-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scoped-original-native-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_OPTIONAL_LOCKS: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      UDM_V7_TRISKELION: ${{ github.workspace }}/components/triskelion
      UDM_V7_MSI: ${{ github.workspace }}/components/msi
      UDM_V7_EXPOSED_OUT: ${{ github.workspace }}/qualification/v7-exposed/diagnostic
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Freeze previous RED and all source-pinned original methods
        run: |
          set -euo pipefail
          mkdir -p qualification/v7-exposed
          for path in \
            research/unified_consequence_runtime/typed_native_authority_v6.py \
            research/unified_consequence_runtime/typed_source_inventory_v5.py \
            research/unified_consequence_runtime/typed_v104_msi_bridge_v7.py \
            research/unified_consequence_runtime/qualify_typed_v104_prospective_v7.py \
            research/unified_consequence_runtime/archaeology/typed-v104-v7/PROTOCOL.json \
            research/unified_consequence_runtime/archaeology/typed-v104-v7/FROZEN_AUTHOR_TEST_REFS.json; do
            test "$(git rev-parse HEAD:"$path")" = \
                 "$(git rev-parse abbbb4d2b7cad8bccb9d45b5f02eb50254b8f3d6:"$path")"
          done
          git rev-parse HEAD > qualification/v7-exposed/SOURCE_COMMIT.txt
      - name: Fetch unchanged original method bodies only
        run: |
          set -euo pipefail
          mkdir -p components
          git fetch --no-tags --depth=1 origin 6031466188046f56b4660d772d13ad731ed4c0f2
          git init -q components/triskelion
          git -C components/triskelion fetch -q --depth=1 https://github.com/heathsanchez/triskelion.git 426c54f7c774560e0fabe7213c5ef333b1327c71
          git -C components/triskelion checkout -q --detach 426c54f7c774560e0fabe7213c5ef333b1327c71
          git init -q components/msi
          git -C components/msi fetch -q --depth=1 https://github.com/heathsanchez/Minimal-Sufficient-Interface.git 56cfd7b523e3592cae4eafa5468f437ccb94dbe9
          git -C components/msi checkout -q --detach 56cfd7b523e3592cae4eafa5468f437ccb94dbe9
      - name: Use same previous original source/native packages
        run: |
          set -euo pipefail
          python -B -m pip install --disable-pip-version-check --no-input \
            pytest==8.3.5 pytest-cov==6.2.1 pluggy==1.6.0 coverage==7.10.6 \
            packaging==26.3 attrs==24.3.0 hypothesis==6.122.3 \
            typing_extensions==4.12.2 colorama==0.4.6 rich==13.9.4 \
            click==8.2.0 tenacity==9.1.2 markupsafe==3.0.2
      - name: Native source-exact protected-test module and original V104 cold prefix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -B -m research.unified_consequence_runtime.qualify_v7_exposed_protected_scope \
             > qualification/v7-exposed/DIAGNOSTIC.log 2>&1
          exitcode=$?
          echo "$exitcode" > qualification/v7-exposed/DIAGNOSTIC_EXIT.txt
          cat qualification/v7-exposed/DIAGNOSTIC.log
          exit "$exitcode"
      - name: Verify evidence label does not promote original prospective RED
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('qualification/v7-exposed')
          path=root/'diagnostic/RESULT.json'
          if not path.exists():
              print("UNKNOWN_NO_EXPOSED_SCOPED_RECEIPT")
          else:
              data=json.loads(path.read_text())
              assert data['G2']==data['G3']==data['G4']=='UNKNOWN'
              assert data['role']=='EXPOSED_DIAGNOSTIC_ONLY'
              assert data['prior_scientific_red_run']==38977284706
              assert data['original_full_suite_claim']=='NOT_WARRANTED'
              assert data['untouched_futures']==['jd/tenacity','pypa/packaging']
              print('EXPOSED_SCOPED_VERDICT',data['status'],data.get('native_calls'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udm-v7-exposed-scoped-${{ github.sha }}-${{ github.run_attempt }}
          path: qualification/v7-exposed/
          retention-days: 90
          if-no-files-found: warn
