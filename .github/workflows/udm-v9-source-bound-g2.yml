name: V9 source-bound prospective G2 (Tenacity to Packaging)
on:
  push:
    branches: [research/udm-v9-prospective-source-bound-20261017]
    paths:
      - .github/workflows/udm-v9-source-bound-g2.yml
      - research/unified_consequence_runtime/qualify_source_bound_g2_v9.py
      - research/unified_consequence_runtime/test_source_bound_g2_v9.py
      - research/unified_consequence_runtime/archaeology/typed-v104-v9/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: udm-v9-g2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-source-bound-g2:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_OPTIONAL_LOCKS: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      UDM_V7_TRISKELION: ${{ github.workspace }}/components/triskelion
      UDM_V7_MSI: ${{ github.workspace }}/components/msi
      UDM_V9_RESULT_OUT: ${{ github.workspace }}/qualification/v9/native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Freeze exact science source and unchanged original V7 native authority
        run: |
          set -euo pipefail
          mkdir -p qualification/v9
          git rev-parse HEAD > qualification/v9/SOURCE_COMMIT.txt
          for path in \
            research/unified_consequence_runtime/typed_native_authority_v6.py \
            research/unified_consequence_runtime/typed_source_inventory_v5.py \
            research/unified_consequence_runtime/typed_v104_msi_bridge_v7.py \
            research/unified_consequence_runtime/qualify_typed_v104_prospective_v7.py \
            research/unified_consequence_runtime/native_meta_decision.py \
            research/unified_consequence_runtime/developmental_choice.py \
            research/unified_consequence_runtime/decisive_native_verify.py \
            research/unified_consequence_runtime/archaeology/typed-v104-v7/PROTOCOL.json \
            research/unified_consequence_runtime/archaeology/typed-v104-v7/FROZEN_AUTHOR_TEST_REFS.json; do
            original="$(git rev-parse e3ac262c379fc90687e25eba9ba4a2249db02f4c:"$path")"
            current="$(git rev-parse HEAD:"$path")"
            test "$original" = "$current"
            printf '%s\t%s\n' "$path" "$current" >> qualification/v9/PRESERVED_ORIGINALS.txt
          done
          python - <<'PY' | tee qualification/v9/FROZEN_SOURCE_RECORD.json
          from pathlib import Path
          import hashlib,json,subprocess
          protocol=Path('research/unified_consequence_runtime/archaeology/typed-v104-v9/FROZEN_PROTOCOL.json')
          tests=Path('research/unified_consequence_runtime/test_source_bound_g2_v9.py')
          print(json.dumps({'protocol_sha256':hashlib.sha256(protocol.read_bytes()).hexdigest(),
             'tests_sha256':hashlib.sha256(tests.read_bytes()).hexdigest(),
             'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'source_access':'NOT_YET_EXECUTED',
             'historical_role_change':'DISCLOSED_V7_FUTURE_A_NOW_V9_TRAINING',
             'future_b_unopened':True,'G2':'UNKNOWN','G3':'UNKNOWN','G4':'UNKNOWN'},sort_keys=True))
          PY
      - name: Fetch authenticated unchanged Triskelion V104 and MSI V10 definitions
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 6031466188046f56b4660d772d13ad731ed4c0f2
          mkdir -p components
          git init -q components/triskelion
          git -C components/triskelion fetch -q --depth=1 https://github.com/heathsanchez/triskelion.git 426c54f7c774560e0fabe7213c5ef333b1327c71
          git -C components/triskelion checkout -q --detach 426c54f7c774560e0fabe7213c5ef333b1327c71
          git init -q components/msi
          git -C components/msi fetch -q --depth=1 https://github.com/heathsanchez/Minimal-Sufficient-Interface.git 56cfd7b523e3592cae4eafa5468f437ccb94dbe9
          git -C components/msi checkout -q --detach 56cfd7b523e3592cae4eafa5468f437ccb94dbe9
      - name: Install fixed transparent native environment
        run: |
          set -euo pipefail
          python -B -m pip install --disable-pip-version-check --no-input \
            pytest==8.3.5 pytest-cov==6.2.1 pluggy==1.6.0 coverage==7.10.6 \
            packaging==26.3 attrs==24.3.0 hypothesis==6.122.3 \
            typing_extensions==4.12.2 colorama==0.4.6 rich==13.9.4 \
            click==8.2.0 tenacity==9.1.2 markupsafe==3.0.2
      - name: Execute frozen V9 no-warrant and MSI profile contracts before source access
        run: |
          set -euo pipefail
          python -B -m unittest \
            research.unified_consequence_runtime.test_source_bound_g2_v9 \
            research.unified_consequence_runtime.test_typed_v104_msi_bridge_v7 \
            -v 2>&1 | tee qualification/v9/CONTRACTS.log
      - name: Execute genuinely source-unopened V9 prospective training and conditional heldout
        timeout-minutes: 43
        run: |
          set +e
          # Do not give upstream pytest process GH_TOKEN or any App secrets.
          env -u GH_TOKEN -u GITHUB_TOKEN UDM_V9_EXPLICIT_SOURCE_ACCESS=YES_AFTER_FROZEN_CI \
            python -B -m research.unified_consequence_runtime.qualify_source_bound_g2_v9 \
            > qualification/v9/SCIENCE.log 2>&1
          exitcode=$?
          printf '%s\n' "$exitcode" > qualification/v9/SCIENCE_EXIT.txt
          tail -n 45 qualification/v9/SCIENCE.log
          exit "$exitcode"
      - name: Independently refuse unsatisfied scientific G2 status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('qualification/v9/native/RESULT.json')
          if not p.exists():
              print('NOT_RUN_NO_SOURCE_NATIVE_RECEIPT')
          else:
              r=json.loads(p.read_text())
              assert r['schema']=='UDM_V9_SOURCE_BOUND_G2_PROSPECTIVE_RUN'
              assert r['G3']==r['G4']==r['G5']==r['G6']=='UNKNOWN'
              assert r.get('unopened_heldout',False) or r.get('training_verified_choice',False)
              print(json.dumps({'status':r['status'],'G2':r['G2'],
                 'native_calls':r['native_calls'],
                 'unopened_heldout':r['unopened_heldout']},sort_keys=True))
          PY
      - name: Archive actual source and unpromoted negative evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          folder=Path('qualification/v9');folder.mkdir(parents=True,exist_ok=True)
          output={'schema':'UDM_V9_EVIDENCE_BOUNDARY',
                  'source_commit':Path('qualification/v9/SOURCE_COMMIT.txt').read_text().strip(),
                  'source_bytes_compared':True,
                  'historical_frozen_Red':'PRESERVED',
                  'G2':'UNKNOWN_UNLESS_ACTUAL_G2_RESULT_WARRANTED',
                  'G3':'UNKNOWN','G4':'UNKNOWN','G5':'UNKNOWN','G6':'UNKNOWN'}
          (folder/'EVIDENCE_BOUNDARY.json').write_text(json.dumps(output,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udm-v9-prospective-g2-${{ github.sha }}-${{ github.run_attempt }}
          path: qualification/v9/
          retention-days: 90
          if-no-files-found: warn
