name: Native V54 developmental machine qualification

on:
  push:
    branches: [research/universal-developmental-machine-v54-20261015]
    paths:
      - 'research/unified_consequence_runtime/**'
      - '.github/workflows/universal-developmental-machine-v54.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-v54-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      UDM_COMPONENTS: ${{ github.workspace }}/components
      UDM_EVALUATOR: ${{ github.workspace }}/components/evaluator
      UDM_ASSETS: ${{ github.workspace }}/originals/base-udm/qualification/original-depth5
      UDM_BASE_STATE: ${{ github.workspace }}/originals/base-udm/qualified-state
      UDM_SOURCE_REPOS: ${{ github.workspace }}/components/selection-sources
      UDM_PYTHON: ${{ github.workspace }}/.venv-udm/bin/python
      V54_SOURCE: ${{ github.workspace }}/components/v54-source
      V54_WORLDS: ${{ github.workspace }}/native-worlds
      V54_PYTHON: ${{ github.workspace }}/.venv-v54/bin/python
      V54_LEAN: ${{ github.workspace }}/.v54-lean/lean-4.28.0-linux/bin/lean
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/test
          ref: c9092fa57c8943e638f95689cd36e6a63310f41e
          path: components/development
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/metatron
          ref: b9d1b5cc10477188be6e55617699be60e70f6dad
          path: components/metatron
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/realitygraph
          ref: 50c43b14e7272469bc51ff7204dec07682a996d7
          path: components/flash
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ServiceNow/webarena-verified
          ref: 6473f72db5dcefc97b5725b59e734504edc28a21
          fetch-depth: 0
          path: components/evaluator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/triskelion
          ref: 2dd5f41b6c7cec1004b8deaee4f976dd2a9ed21c
          fetch-depth: 0
          path: components/v54-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/Minimal-Sufficient-Interface
          ref: 5d448c0ecc82ff3945d009963064ebbb67d2f308
          path: components/selection-sources/msi
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover and authenticate canonical qualified state and original V54 result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p originals qualification
          gh api /repos/heathsanchez/test/actions/runs/38674836927 > originals/udm-run.json
          gh api /repos/heathsanchez/test/actions/artifacts/11944924864 > originals/udm-artifact.json
          gh api /repos/heathsanchez/test/actions/artifacts/11944924864/zip > originals/udm-green.zip
          gh api /repos/heathsanchez/triskelion/actions/runs/31761530951 > originals/v54-run.json
          gh api /repos/heathsanchez/triskelion/actions/artifacts/9205105768 > originals/v54-artifact.json
          gh api /repos/heathsanchez/triskelion/actions/artifacts/9205105768/zip > originals/v54-original.zip
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import zipfile
          root = Path('originals')
          pins = [
              ('udm', 'udm-green.zip', 'base-udm', 38674836927, 11944924864,
               '10269fa87dacd47b7d0036935bc8b006e5041adc',
               'c024b3dfb8cfd18b8ae7c657d2f12b7366b6e081ce0b01549de9587839a20563'),
              ('v54', 'v54-original.zip', 'original-v54', 31761530951, 9205105768,
               '2dd5f41b6c7cec1004b8deaee4f976dd2a9ed21c',
               '6cd5ae4796ce58b266506e2cfce80b31688a11f9b80d0521487267bfeeb649bf'),
          ]
          receipts = []
          for name, archive, destination, run_id, artifact_id, commit, expected in pins:
              run = json.loads((root/(name+'-run.json')).read_text())
              artifact = json.loads((root/(name+'-artifact.json')).read_text())
              actual = hashlib.sha256((root/archive).read_bytes()).hexdigest()
              assert run['id'] == run_id and run['head_sha'] == commit
              assert run['status'] == 'completed' and run['conclusion'] == 'success'
              assert artifact['id'] == artifact_id and artifact['workflow_run']['id'] == run_id
              assert artifact['workflow_run']['head_sha'] == commit
              assert artifact['digest'] == 'sha256:'+expected and actual == expected
              with zipfile.ZipFile(root/archive) as z:
                  names = z.namelist()
                  assert len(names) == len(set(names))
                  assert all(not Path(n).is_absolute() and '..' not in Path(n).parts for n in names)
                  z.extractall(root/destination)
              receipts.append({'artifact_id': artifact_id, 'run_id': run_id,
                               'source_commit': commit, 'sha256': actual,
                               'archive': str(root/archive), 'extracted': str(root/destination)})
          state = root/'base-udm/qualified-state'
          ledger = state/'metatron-ledger.jsonl'
          qualification = json.loads((root/'base-udm/qualification/qualification.json').read_text())
          assert len(ledger.read_text().splitlines()) == 101
          assert hashlib.sha256(ledger.read_bytes()).hexdigest() == qualification['final_ledger_sha256']
          assert qualification['original_active_capabilities_retained'] == 11
          assert all(hashlib.sha256(p.read_bytes()).hexdigest() == p.name for p in (state/'objects').iterdir())
          Path('qualification/original-evidence-recovery.json').write_text(json.dumps(receipts, indent=2)+'\n')
          PY

      - name: Bind exact original JPL and MSI selection sources
        run: |
          git cat-file -e '52eb1e7995bd877a2b698efe1883ae2b80a03737^{commit}'
          ln -s "${GITHUB_WORKSPACE}" "${UDM_SOURCE_REPOS}/test"
          test "$(git -C "${UDM_SOURCE_REPOS}/msi" rev-parse HEAD)" = 5d448c0ecc82ff3945d009963064ebbb67d2f308
          git show 52eb1e7995bd877a2b698efe1883ae2b80a03737:research/mathgraph_minimal_quotient/h11_quotient.py \
            | sha256sum > qualification/jpl-selection-source-sha256.txt

      - name: Install isolated UDM evaluator environment
        run: |
          python -m venv .venv-udm
          "${UDM_PYTHON}" -m pip install ./components/evaluator playwright jinja2
          "${UDM_PYTHON}" -VV > qualification/python-udm.txt
          "${UDM_PYTHON}" -m pip freeze --all > qualification/environment-udm.txt

      - name: Provision original pinned native worlds and check pristine baselines
        run: |
          bash research/unified_consequence_runtime/setup_v54_worlds.sh \
            "${V54_WORLDS}" "${GITHUB_WORKSPACE}/.venv-v54" qualification/native-setup
          echo "${GITHUB_WORKSPACE}/.venv-v54/bin" >> "${GITHUB_PATH}"

      - name: Acquire, execute, verify, withdraw, restore and cold restart native V54
        run: |
          "${UDM_PYTHON}" -B -m research.unified_consequence_runtime.qualify_v54_machine \
            --source "${V54_SOURCE}" --worlds "${V54_WORLDS}" \
            --components "${UDM_COMPONENTS}" \
            --base-state originals/base-udm/qualified-state \
            --config "${UDM_ASSETS}/config.json" --evaluator "${UDM_EVALUATOR}" \
            --out qualification/v54 --native-python "${V54_PYTHON}" \
            2>&1 | tee qualification/v54-run.log

      - name: Check native authority, source adapter, routing and selection contracts after V54
        run: |
          "${UDM_PYTHON}" -B -m unittest discover \
            -s research/unified_consequence_runtime -p 'test_*.py' -v \
            2>&1 | tee qualification/contract-tests.log
          "${UDM_PYTHON}" -B -m unittest discover \
            -s research/unified_consequence_runtime/v54_formal -p 'test_*.py' -v \
            2>&1 | tee qualification/formal-evidence-tests.log

      - name: Install exact original Lean 4.28.0 compiler
        run: |
          mkdir -p .v54-lean
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.28.0/lean-4.28.0-linux.tar.zst \
            --output .v54-lean/lean-4.28.0-linux.tar.zst
          echo 'ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd  .v54-lean/lean-4.28.0-linux.tar.zst' \
            | sha256sum --check | tee qualification/lean-release-sha256.txt
          tar --zstd -xf .v54-lean/lean-4.28.0-linux.tar.zst -C .v54-lean
          "${V54_LEAN}" --version > qualification/lean-version.txt

      - name: Bind actual native traces and compile bounded V54 certificate
        run: |
          "${UDM_PYTHON}" -B research/unified_consequence_runtime/v54_formal/generate.py \
            --native-calls qualification/v54/native/native-calls.jsonl \
            --broken qualification/v54/native/state-double-broken.json \
            --warm qualification/v54/native/state-warm-after-O1.json \
            --final qualification/v54/native/state-final.json \
            --output-dir qualification/v54/formal \
            2>&1 | tee qualification/formal-generation.log
          "${UDM_PYTHON}" -B research/unified_consequence_runtime/v54_formal/check.py \
            --lean "${V54_LEAN}" \
            --certificate qualification/v54/formal/GeneratedV54.lean \
            --output-dir qualification/v54/formal/build \
            --receipt qualification/v54/formal/lean-verification.json \
            2>&1 | tee qualification/formal-check.log

      - name: Select and execute retained methods from a copy of qualified V54 state
        run: |
          "${UDM_PYTHON}" -B -m research.unified_consequence_runtime.consequence_selection \
            --state qualification/v54/state --assets "${UDM_ASSETS}" \
            --components "${UDM_COMPONENTS}" --evaluator "${UDM_EVALUATOR}" \
            --out qualification/consequence-selection.json \
            2>&1 | tee qualification/consequence-selection.log

      - name: Upload native V54 evidence including failed qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v54-developmental-machine-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            qualification
            originals
            .github/workflows/universal-developmental-machine-v54.yml
            research/unified_consequence_runtime
