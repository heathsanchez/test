name: Live executable developmental machine qualification
on:
  push:
    branches: [research/universal-developmental-machine-20261015]
    paths:
      - 'research/unified_consequence_runtime/**'
      - '.github/workflows/universal-developmental-machine.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-causal-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/test
          ref: c9092fa57c8943e638f95689cd36e6a63310f41e
          path: components/development
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/metatron
          ref: b9d1b5cc10477188be6e55617699be60e70f6dad
          path: components/metatron
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/realitygraph
          ref: 50c43b14e7272469bc51ff7204dec07682a996d7
          path: components/flash
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ServiceNow/webarena-verified
          ref: 6473f72db5dcefc97b5725b59e734504edc28a21
          fetch-depth: 0
          path: components/evaluator
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install original native verifier and executable dependencies
        run: python -m pip install ./components/evaluator playwright jinja2
      - name: Recover exact original qualified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p originals
          gh api /repos/heathsanchez/test/actions/artifacts/11517107016/zip > originals/depth5.zip
          gh api /repos/heathsanchez/test/actions/artifacts/11865380348/zip > originals/runtime.zip
      - name: Execute, independently verify, withdraw, restore and cold restart
        run: |
          python -B -m research.unified_consequence_runtime.qualify_developmental_machine --depth5-archive originals/depth5.zip --runtime-archive originals/runtime.zip --components components --evaluator components/evaluator --state qualified-state --out qualification
          python -m pip freeze > qualification/environment.txt
      - name: Check native authority and executable causal contracts
        env:
          UDM_ASSETS: ${{ github.workspace }}/qualification/original-depth5
          UDM_COMPONENTS: ${{ github.workspace }}/components
          UDM_EVALUATOR: ${{ github.workspace }}/components/evaluator
        run: python -B -m unittest discover -s research/unified_consequence_runtime -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-developmental-machine-${{ github.sha }}
          path: |
            qualification
            qualified-state
            originals
            research/unified_consequence_runtime/DEVELOPMENTAL_PROTOCOL.md
            research/unified_consequence_runtime/developmental_sources.json
            research/unified_consequence_runtime/capability_index.json
            research/unified_consequence_runtime/FORMAL_CORRESPONDENCE.md
            research/unified_consequence_runtime/RESEARCH_REPORT.md
            research/unified_consequence_runtime/QUALIFICATION_RECEIPT.json
            research/unified_consequence_runtime/archaeology
