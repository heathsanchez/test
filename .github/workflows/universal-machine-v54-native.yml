name: Universal machine V54 native developmental integration
on:
  push:
    branches: [research/universal-machine-native-v1]
    paths:
      - "research/unified_consequence_runtime/v54_native_admission.py"
      - "research/unified_consequence_runtime/test_v54_native_admission.py"
      - ".github/workflows/universal-machine-v54-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v54-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: coordinator
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/triskelion
          ref: 2dd5f41b6c7cec1004b8deaee4f976dd2a9ed21c
          path: original-triskelion
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/metatron
          ref: b9d1b5cc10477188be6e55617699be60e70f6dad
          path: original-metatron
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision frozen original native V54 worlds
        run: |
          set -euo pipefail
          git clone -q https://github.com/django/django.git /tmp/v54_django
          cd /tmp/v54_django && git checkout -q c6be0bf3bb744d234947cefd6def9f31d9655800 && python -m pip install -q -e .
          git clone -q https://github.com/psf/requests.git /tmp/v54_requests
          cd /tmp/v54_requests && git checkout -q 8068356288978c4f54661ae6f95afe0e0831885e && python -m pip install -q -e . 'pytest<8'
          git clone -q https://github.com/Textualize/rich.git /tmp/v54_rich
          cd /tmp/v54_rich && git checkout -q 9d8f9a372cc5916fd4781fec207ced7ddac2f08f && python -m pip install -q -e . 'pytest<8' pytest-cov attrs 'typing-extensions<5'
      - name: Run ORIGINAL source-native V54 acquisition and O1 to O2 causal test
        working-directory: original-triskelion
        run: python experiments/METALOGIC_TWO_GENERATION_COMPOUNDING_V54.py
      - name: Admit actual discovered operators to ORIGINAL Metatron causal log
        env:
          PYTHONPATH: ${{ github.workspace }}/coordinator:${{ github.workspace }}/original-metatron/runtime
        run: |
          set -euo pipefail
          cd coordinator
          python -m unittest -v research.unified_consequence_runtime.test_v54_native_admission
          python -m research.unified_consequence_runtime.v54_native_admission --result ../original-triskelion/artifacts/v54/RESULT.json --out artifacts/universal/v54_native_admission.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v54-to-metatron-native
          path: |
            original-triskelion/artifacts/v54/
            coordinator/artifacts/universal/
