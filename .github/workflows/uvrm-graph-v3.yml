name: UVRM Graph V3

on:
  push:
    paths:
      - 'experiments/uvrm_graph_v3/**'
      - '.github/workflows/uvrm-graph-v3.yml'
  workflow_dispatch:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate leakage and ablation invariants
        run: python experiments/uvrm_graph_v3/test_protocol.py
      - name: Render benchmark inputs
        run: python experiments/uvrm_graph_v3/render_inputs.py
