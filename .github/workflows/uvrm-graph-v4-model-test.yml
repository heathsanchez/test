name: UVRM Graph V4 Model Test

on:
  push:
    paths:
      - 'experiments/uvrm_graph_v4/run_github_models.py'
      - '.github/workflows/uvrm-graph-v4-model-test.yml'
  workflow_dispatch:

concurrency:
  group: uvrm-graph-v4-model-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UVRM_MODEL: gpt-4.1-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen benchmark
        run: python experiments/uvrm_graph_v4/validate.py
      - name: Run matched 20-call model benchmark
        run: python experiments/uvrm_graph_v4/run_github_models.py
      - name: Score answers
        run: python experiments/uvrm_graph_v4/score.py experiments/uvrm_graph_v4/answers_github_models.json | tee experiments/uvrm_graph_v4/score_output.txt
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uvrm-graph-v4-model-test
          path: |
            experiments/uvrm_graph_v4/answers_github_models.json
            experiments/uvrm_graph_v4/run_metadata.json
            experiments/uvrm_graph_v4/score_output.txt
          if-no-files-found: error
          retention-days: 30

