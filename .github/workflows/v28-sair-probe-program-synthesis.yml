name: V28 SAIR Probe Program Synthesis

on:
  pull_request:
    branches: [v27-sair-commitment-router]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v28-probe-program-synthesis:
    if: github.event_name != 'pull_request' || github.head_ref == 'v28-sair-probe-program-synthesis'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: pip install z3-solver
      - name: Clone official external SAIR corpus
        run: git clone --depth 1 https://github.com/teorth/equational_theories.git /tmp/sair
      - name: Run V28 natural probe-program synthesis
        run: |
          rm -rf results/v28-sair-probe-program-synthesis
          python scripts/sair_probe_program_synthesis_v28.py \
            --sair-root /tmp/sair \
            --out-dir results/v28-sair-probe-program-synthesis
      - uses: actions/upload-artifact@v4
        with:
          name: v28-sair-probe-program-synthesis
          path: results/v28-sair-probe-program-synthesis/
