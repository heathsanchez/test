name: V3 variance localization

on:
  push:
    branches:
      - experiment/v3-variance-localization
  workflow_dispatch:

jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run paired prefix and hardware-counter localization
        run: bash scripts/run_v3_variance_localization.sh
      - name: Upload variance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-variance-localization
          path: v3-variance/
          if-no-files-found: warn
