name: V30 Developmental Runtime Integration

on:
  pull_request:
    branches: [v29-sair-probe-operator-induction]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v30-runtime-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: pip install z3-solver
      - name: Clone official SAIR corpus
        run: git clone --depth 1 https://github.com/SAIRcompetition/equational-theories-lean-stage2.git /tmp/sair
      - name: Run one-machine V30 integration
        run: |
          rm -rf results/v30-developmental-runtime-integration
          python experiments/sair_recursive_development_v30.py \
            --sair-root /tmp/sair \
            --out-dir results/v30-developmental-runtime-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v30-developmental-runtime-integration
          path: results/v30-developmental-runtime-integration/
