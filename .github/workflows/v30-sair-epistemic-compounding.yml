name: V30 SAIR Epistemic Compounding

on:
  pull_request:
    branches: [v29-sair-probe-operator-induction]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v30-epistemic-compounding:
    if: github.event_name != 'pull_request' || github.head_ref == 'v30-sair-epistemic-compounding'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: pip install z3-solver
      - name: Clone official external SAIR corpus
        run: git clone --depth 1 https://github.com/SAIRcompetition/equational-theories-lean-stage2.git /tmp/sair
      - name: Run V30 epistemic compounding
        run: |
          rm -rf results/v30-sair-epistemic-compounding
          python scripts/sair_epistemic_compounding_v30.py \
            --sair-root /tmp/sair \
            --out-dir results/v30-sair-epistemic-compounding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v30-sair-epistemic-compounding
          path: results/v30-sair-epistemic-compounding/
