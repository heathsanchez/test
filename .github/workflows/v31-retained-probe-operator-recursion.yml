name: V31 Retained Probe Operator Recursion

on:
  pull_request:
    branches:
      - v30-developmental-runtime-integration
  workflow_dispatch:

jobs:
  v31-retained-probe-operator-recursion:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: pip install z3-solver
      - name: Clone official external SAIR corpus
        run: git clone --depth 1 https://github.com/SAIRcompetition/equational-theories-lean-stage2.git /tmp/sair
      - name: Run V31 retained probe-operator recursion
        run: |
          rm -rf results/v31-retained-probe-operator-recursion
          python experiments/sair_recursive_operator_retention_v31.py \
            --sair-root /tmp/sair \
            --out-dir results/v31-retained-probe-operator-recursion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31-retained-probe-operator-recursion
          path: results/v31-retained-probe-operator-recursion/
