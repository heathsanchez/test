name: V34 AST Metadata Separation

on:
  pull_request:
    branches:
      - v33-corrected-raw-transformer-basis-run

jobs:
  v34-ast-metadata-separation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Z3
        run: pip install z3-solver
      - name: Clone official SAIR corpus
        run: git clone --depth 1 https://github.com/SAIRcompetition/equational-theories-lean-stage2.git /tmp/sair
      - name: Run V34
        run: |
          rm -rf results/v34-ast-metadata-separation
          python experiments/sair_ast_metadata_separation_v34.py \
            --sair-root /tmp/sair \
            --out-dir results/v34-ast-metadata-separation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v34-ast-metadata-separation
          path: results/v34-ast-metadata-separation/
