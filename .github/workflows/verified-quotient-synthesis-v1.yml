name: Verified Quotient Synthesis V1

on:
  push:
    branches: [main]
    paths:
      - 'experiments/verified_quotient_synthesis_v1/**'
      - '.github/workflows/verified-quotient-synthesis-v1.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UVRM_MODEL: gpt-4.1-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen benchmark
        run: python experiments/verified_quotient_synthesis_v1/validate.py
      - name: Run protected verified quotient synthesis benchmark
        run: python experiments/verified_quotient_synthesis_v1/run_openai.py
      - name: Score externally
        run: python experiments/verified_quotient_synthesis_v1/score.py experiments/verified_quotient_synthesis_v1/answers.json | tee experiments/verified_quotient_synthesis_v1/score_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-quotient-synthesis-v1-protected
          path: |
            experiments/verified_quotient_synthesis_v1/tasks.json
            experiments/verified_quotient_synthesis_v1/answers.json
            experiments/verified_quotient_synthesis_v1/run_metadata.json
            experiments/verified_quotient_synthesis_v1/scores.json
            experiments/verified_quotient_synthesis_v1/score_output.txt
          retention-days: 30
