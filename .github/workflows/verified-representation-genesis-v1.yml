name: Verified Representation Genesis V1
on:
  workflow_dispatch:
  push:
    branches: [verified-representation-genesis-v1]
    paths:
      - 'experiments/verified_representation_genesis_v1/**'
      - 'experiments/typed_residual_kernel_v1/TypedResidualKernel.lean'
      - '.github/workflows/verified-representation-genesis-v1.yml'
jobs:
  genesis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run exhaustive representation-genesis episode
        run: python experiments/verified_representation_genesis_v1/run.py
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify formal boundary
        run: |
          set -o pipefail
          lean -o /tmp/TypedResidualKernel.olean experiments/typed_residual_kernel_v1/TypedResidualKernel.lean 2>&1 | tee /tmp/kernel.log
          LEAN_PATH=/tmp lean experiments/verified_representation_genesis_v1/RepresentationGenesis.lean 2>&1 | tee /tmp/genesis.log
          ! grep -q sorry /tmp/kernel.log
          ! grep -q sorry /tmp/genesis.log
      - name: Freeze evidence
        run: |
          cd experiments/verified_representation_genesis_v1
          sha256sum PROTOCOL.md RepresentationGenesis.lean run.py results/evidence.json results/snapshot.json > results/SHA256SUMS
          git rev-parse HEAD > results/RUN_COMMIT
          cp /tmp/kernel.log /tmp/genesis.log results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-representation-genesis-v1
          path: experiments/verified_representation_genesis_v1/results
          retention-days: 90
