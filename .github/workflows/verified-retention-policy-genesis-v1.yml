name: verified-retention-policy-genesis-v1
on:
  push:
    branches: [verified-retention-policy-genesis-v1]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Run qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/verified_retention_policy_genesis_v1/run.py | tee experiments/verified_retention_policy_genesis_v1/results/run.log
          grep -q 'NEGATIVE_OR_PARTIAL' experiments/verified_retention_policy_genesis_v1/results/run.log
          grep -q '"prospective_beats_hand_geometry": false' experiments/verified_retention_policy_genesis_v1/results/run.log
      - name: Check Lean kernel fragment
        shell: bash
        run: |
          set -euo pipefail
          lake env lean experiments/verified_retention_policy_genesis_v1/RetentionPolicy.lean 2>&1 | tee experiments/verified_retention_policy_genesis_v1/results/lean.log
          ! grep -R --line-number --include='*.lean' -E '\bsorry\b|\badmit\b' experiments/verified_retention_policy_genesis_v1
      - uses: actions/upload-artifact@v4
        with:
          name: verified-retention-policy-genesis-v1-evidence
          path: experiments/verified_retention_policy_genesis_v1/results/
