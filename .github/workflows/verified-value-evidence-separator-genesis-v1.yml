name: Verified Value Evidence Separator Genesis V1
on: {workflow_dispatch: {}, push: {branches: [verified-value-evidence-separator-genesis-v1]}}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run evidence qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/verified_value_evidence_separator_genesis_v1/run.py | tee /tmp/evidence.json
          grep -q 'VERIFIED_VALUE_EVIDENCE_SEPARATOR_GENESIS' /tmp/evidence.json
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check evidence types
        shell: bash
        run: |
          set -euo pipefail
          lean experiments/verified_value_evidence_separator_genesis_v1/EvidenceSeparator.lean 2>&1 | tee /tmp/evidence-lean.log
          ! grep -q sorry /tmp/evidence-lean.log
      - name: Seal evidence
        shell: bash
        run: |
          cd experiments/verified_value_evidence_separator_genesis_v1
          sha256sum PROTOCOL.md RESULTS.md EvidenceSeparator.lean run.py results/evidence.json results/snapshot.json > results/SHA256SUMS
          git rev-parse HEAD > results/RUN_COMMIT
          cp /tmp/evidence.json results/
          cp /tmp/evidence-lean.log results/
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: verified-value-evidence-separator-genesis-v1, path: experiments/verified_value_evidence_separator_genesis_v1/results, retention-days: 90}
