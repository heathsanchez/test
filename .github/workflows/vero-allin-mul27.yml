name: Vero all-in multiplication 27

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-allin-mul27.yml'
      - '.github/scripts/vero_allin_mul26.py'
      - '.github/scripts/vero_allin_mul27.py'

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download baseline ratchet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32926602836
          name: vero-galoistools-developmental-v1
          path: baseline
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Run multiplication harvest against full ratchet
        working-directory: vero
        run: uv run python ../.github/scripts/vero_allin_mul27.py
      - name: Upload full ratchet result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-allin-mul27
          path: vero/galoistools_allin/
          if-no-files-found: warn
