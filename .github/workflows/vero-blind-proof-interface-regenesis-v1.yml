name: Vero blind proof-interface regenesis V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/vero_blind_proof_interface_regenesis_v1.py'
      - '.github/workflows/vero-blind-proof-interface-regenesis-v1.yml'

permissions:
  actions: read
  contents: read

jobs:
  regenesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download clean independent 48-proof state
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33154946001
          name: vero-galoistools-full48-decontaminated-v1
          path: full48
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Codex
        run: npm install -g @openai/codex
      - name: Run blind amputation and regeneration gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python .github/scripts/vero_blind_proof_interface_regenesis_v1.py
      - name: Publish gate summary
        if: always()
        run: |
          if [ -f blind_regenesis_v1/result.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('blind_regenesis_v1/result.json'))
          print('# Blind proof-interface regenesis V1')
          print('')
          print('**PASS**' if d['passed'] else '**FAIL / RESIDUAL**')
          print('')
          for k,v in d['gates'].items(): print(f'- {k}: {v}')
          PY
          fi
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-blind-proof-interface-regenesis-v1
          path: blind_regenesis_v1
          if-no-files-found: error
