name: Vero division add structure V3
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-div-add-structure-v3.yml'
      - '.github/scripts/vero_div_add_structure_v2.py'
      - '.github/scripts/vero_div_add_structure_v3.py'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download certified 27 ratchet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33053705380
          name: vero-galoistools-mul-promote-v1
          path: baseline27
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Run finished cancellation probe
        working-directory: vero
        run: uv run python ../.github/scripts/vero_div_add_structure_v3.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-div-add-structure-v3
          path: vero/div_add_structure_v3/
          if-no-files-found: warn
