name: Vero divCore semantic transition V10
on:
  push:
    paths:
      - '.github/scripts/vero_div_semantic_transition_v10.py'
      - '.github/workflows/vero-div-semantic-transition-v10.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33159291952
          name: vero-cold-source-certification-v1
          path: coldcert
      - run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python .github/scripts/vero_div_semantic_transition_v10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vero-div-semantic-transition-v10
          path: vero_div_semantic_transition_v10_result.json
