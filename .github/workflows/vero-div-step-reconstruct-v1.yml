name: Vero division step reconstruct V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-div-step-reconstruct-v1.yml'
      - '.github/scripts/vero_div_step_reconstruct_v1.py'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download certified 27 ratchet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33053705380
          name: vero-galoistools-mul-promote-v1
          path: baseline27
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Run division step reconstruction separator
        working-directory: vero
        run: uv run python ../.github/scripts/vero_div_step_reconstruct_v1.py
      - name: Upload separator census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-div-step-reconstruct-v1
          path: vero/div_step_reconstruct_v1/
          if-no-files-found: warn
