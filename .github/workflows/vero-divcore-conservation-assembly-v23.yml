name: Vero divCore conservation assembly V23

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/vero_divcore_conservation_assembly_v23.py'
      - '.github/workflows/vero-divcore-conservation-assembly-v23.yml'
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33159291952
          name: vero-cold-source-certification-v1
          path: coldcert
      - run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python .github/scripts/vero_divcore_conservation_assembly_v23.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vero-divcore-conservation-assembly-v23
          path: vero_divcore_conservation_assembly_v23
