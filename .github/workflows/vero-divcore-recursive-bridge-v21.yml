name: Vero divCore recursive bridge V21

on:
  push:
    paths:
      - '.github/scripts/vero_divcore_recursive_bridge_v21.py'
      - '.github/workflows/vero-divcore-recursive-bridge-v21.yml'
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33159291952
          name: vero-cold-source-certification-v1
          path: coldcert
      - run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python .github/scripts/vero_divcore_recursive_bridge_v21.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-divcore-recursive-bridge-v21
          path: vero_divcore_recursive_bridge_v21
