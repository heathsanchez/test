name: Vero Division blocker quarantine V1
on:
  push:
    paths:
      - '.github/scripts/vero_division_blocker_quarantine_v1.py'
      - '.github/workflows/vero-division-blocker-quarantine-v1.yml'
  workflow_dispatch:
jobs:
  quarantine:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download certified cold source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33159291952
          name: vero-cold-source-certification-v1
          path: coldcert
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Quarantine four GCD blockers and compile Division
        run: python .github/scripts/vero_division_blocker_quarantine_v1.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-division-blocker-quarantine-v1
          path: division_blocker_quarantine_v1
          if-no-files-found: error
