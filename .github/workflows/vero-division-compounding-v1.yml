name: Vero Division interface compounding V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/vero_division_compounding_v1.py'
      - '.github/workflows/vero-division-compounding-v1.yml'

permissions:
  actions: read
  contents: read

jobs:
  compound:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download independent 48-proof source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33154946001
          name: vero-galoistools-full48-decontaminated-v1
          path: full48
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run Division compounding intervention matrix
        run: python .github/scripts/vero_division_compounding_v1.py
      - name: Publish matrix summary
        if: always()
        run: |
          if [ -f division_compounding_v1/result.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('division_compounding_v1/result.json'))
          print('# Vero Division interface compounding V1')
          print('')
          print('**PASS**' if d['passed'] else '**RESIDUAL**')
          print('')
          for k,v in d['gates'].items(): print(f'- {k}: {v}')
          print('')
          for name,v in d['matrix'].items(): print(f"- {name}: exit={v['exit']}, errors={v['error_count']}")
          PY
          fi
      - name: Upload complete matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-division-interface-compounding-v1
          path: division_compounding_v1
          if-no-files-found: error

