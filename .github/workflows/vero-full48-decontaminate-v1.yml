name: Vero full48 decontaminate V1
on:
  push:
    paths:
      - '.github/scripts/vero_full48_decontaminate_v1.py'
      - '.github/workflows/vero-full48-decontaminate-v1.yml'
  workflow_dispatch:
jobs:
  decontaminate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download certified full48 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33153874263
          name: vero-galoistools-full48-promote-v1
          path: full48
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Remove cross-target dependencies and rebuild
        run: python .github/scripts/vero_full48_decontaminate_v1.py
      - name: Upload decontaminated full48
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-full48-decontaminated-v1
          path: |
            full48_decontaminated_v1
            full48_decontaminate_result.json
          if-no-files-found: error
