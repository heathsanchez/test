name: Vero full48 independence audit V1
on:
  push:
    paths:
      - '.github/scripts/vero_full48_independence_audit_v1.py'
      - '.github/workflows/vero-full48-independence-audit-v1.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download promoted full48 source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33153874263
          name: vero-galoistools-full48-promote-v1
          path: full48
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Audit proof independence and clean rebuild
        run: python .github/scripts/vero_full48_independence_audit_v1.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-full48-independence-audit-v1
          path: full48_independence_audit.json
          if-no-files-found: error
