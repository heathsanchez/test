name: Vero galoistools baseline v1

on:
  push:
    paths:
      - '.github/workflows/vero-galoistools-baseline-v1.yml'
  workflow_dispatch:

jobs:
  galoistools:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Patch Vero for current Codex CLI
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/vero/generation/agents/codex.py')
          s = p.read_text()
          old = 'cmd.append("--full-auto")'
          new = 'cmd.extend(["--sandbox", "workspace-write"])'
          if old not in s:
              raise SystemExit('expected --full-auto call not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Check credential presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret is not configured in this repository.'
            exit 2
          fi

      - name: Run galoistools code+proof baseline
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" > .env
          uv run vero run benchmark=galoistools agent=codex credentials=openai mode=codeproof name=galoistools-codex-baseline-v1 agent.timeout_seconds=5400
          python - <<'PY'
          import json
          from pathlib import Path
          events = Path('agent_runs/galoistools-codex-baseline-v1/source/agent_events.jsonl')
          ended_ok = False
          for line in events.read_text().splitlines():
              try:
                  obj = json.loads(line)
              except Exception:
                  continue
              if obj.get('type') == 'run_end' or obj.get('event') == 'run_end':
                  payload = obj.get('payload', obj)
                  ended_ok = payload.get('ok') is True
          if not ended_ok:
              raise SystemExit('Codex agent did not complete successfully')
          PY

      - name: Summarize report
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero galoistools baseline' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs -path '*/eval/*/report.md' -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo >> "$GITHUB_STEP_SUMMARY"
          find agent_runs -maxdepth 4 -type f \( -name 'report.md' -o -name 'artifact.json' -o -name 'run.yaml' -o -name 'agent.log' -o -name 'agent_events.jsonl' \) -print || true

      - name: Upload Vero run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-baseline-v1
          path: vero/agent_runs/galoistools-codex-baseline-v1/
          if-no-files-found: warn
