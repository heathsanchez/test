name: Vero galoistools developmental v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified 15/48 developmental artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32897362275
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for local modular congruence primitive probe
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# ECONOMICAL local modular-congruence primitive probe\n\nYou begin from the materialized independently Vero-verified 15/48 artifact. Preserve it. This run is NOT a benchmark-score attempt and NOT a Horner/zipAddPad proof attempt.\n\nVerified residual from the prior probe:\n- `Nat.ModEq` is unavailable in this benchmark dependency set.\n- Replacing it by `NatModEq p a b := a % p = b % p` is viable in principle, but naïve simp-based closure expands back into nested `%` arithmetic.\n- Therefore the missing constructor language is a tiny local congruence algebra with carefully oriented closure lemmas.\n\nTarget exactly THREE primitives in the editable Ring `global_aux` slot:\n1. a local modular congruence relation (reuse the prior `%`-equality definition or an equally small equivalent),\n2. reflexivity / remainder-normalization support sufficient to introduce reduced terms,\n3. `add` and `mul` congruence closure lemmas.\n\nThe essential success criterion is that the closure lemmas COMPILE without using broad `simp` that recursively expands `Nat.add_mod` / `Nat.mul_mod`. Prefer short directed `rw`, `calc`, `trans`, and explicitly oriented equalities. Prove each primitive in isolation before composing anything.\n\nRules:\n1. Inspect only `Galoistools/Proof/Ring.lean` around `global_aux` and the exact core Nat remainder lemmas needed. Do not read the whole repo.\n2. Do NOT attempt `refPolyEvalRevAux`, `zipAddPad`, `add_assoc_eval`, `mul_eval_hom`, or any benchmark theorem.\n3. Do NOT invent additional abstractions. We are testing whether the minimal congruence algebra itself is expressible.\n4. Compile `Galoistools/Proof/Ring.lean` after the first candidate. Allow at most one focused repair.\n5. If the primitives compile, stop immediately and write `RESIDUAL_REPORT.md` with their exact theorem names and the single cheapest next composition test.\n6. If they do not compile after one repair, revert completely to the 15/48 seed and record the exact remaining arithmetic identity.\n7. Never leave any previously verified proof slot modified or broken.\n8. Do not run a full `lake build`; focused Ring compilation is sufficient for this capability probe.\n\nBe extremely economical. Success is compiled reusable congruence primitives, not a score increase.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify 15/48 seed artifact exists
        run: |
          test -s baseline/iter-2/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/iter-2/source/artifact.json)"

      - name: Run economical modular congruence primitive probe
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/iter-2/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=120 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero galoistools local modular-congruence primitive probe' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
