name: Vero galoistools developmental v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'
      - '.github/scripts/vero_batch_harvest.py'
      - '.github/scripts/vero_galoistools_allin.py'
      - '.github/scripts/vero_gcd_boundary_separator.py'
      - '.github/scripts/vero_div_boundary_separator.py'
      - '.github/scripts/vero_divcore_step.py'
      - '.github/scripts/vero_div_identity_recursive.py'
      - '.github/scripts/vero_div_identity_lift.py'
      - '.github/scripts/vero_div_identity_invariant.py'
      - '.github/scripts/vero_div_eval_invariant.py'
      - '.github/scripts/vero_divcore_coeff_bound.py'
      - '.github/scripts/vero_quotient_bridge.py'
      - '.github/scripts/vero_quotient_bridge_v2.py'
      - '.github/scripts/vero_mul_structural.py'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download gcd-zero ratchet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32926602836
          name: vero-galoistools-developmental-v1
          path: baseline
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Prime-field division invariant census
        working-directory: vero
        run: uv run python ../.github/scripts/vero_batch_harvest.py
      - name: Recursive divCore step probes
        working-directory: vero
        run: uv run python ../.github/scripts/vero_divcore_step.py
      - name: Division identity recursive probes
        working-directory: vero
        run: uv run python ../.github/scripts/vero_div_identity_recursive.py
      - name: Division identity strip lift probes
        working-directory: vero
        run: uv run python ../.github/scripts/vero_div_identity_lift.py
      - name: Division identity reconstruction invariant probes
        working-directory: vero
        run: uv run python ../.github/scripts/vero_div_identity_invariant.py
      - name: Division evaluation invariant probes
        working-directory: vero
        run: uv run python ../.github/scripts/vero_div_eval_invariant.py
      - name: Recursive remainder coefficient probes
        working-directory: vero
        run: uv run python ../.github/scripts/vero_divcore_coeff_bound.py
      - name: Quotient term bridge probes
        working-directory: vero
        run: uv run python ../.github/scripts/vero_quotient_bridge.py
      - name: Verified quotient bridge reuse probes
        working-directory: vero
        run: uv run python ../.github/scripts/vero_quotient_bridge_v2.py
      - name: Multiplication structural probes
        working-directory: vero
        run: uv run python ../.github/scripts/vero_mul_structural.py
      - name: All-in frontier attempt
        working-directory: vero
        run: uv run python ../.github/scripts/vero_galoistools_allin.py
      - name: Division boundary separator
        working-directory: vero
        run: uv run python ../.github/scripts/vero_div_boundary_separator.py
      - name: GCD boundary separator
        working-directory: vero
        run: uv run python ../.github/scripts/vero_gcd_boundary_separator.py
      - name: Upload invariant census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-invariants
          path: vero/batch_harvest/
          if-no-files-found: warn
      - name: Upload divCore step census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-divcore-step
          path: vero/divcore_step/
          if-no-files-found: warn
      - name: Upload division identity recursive census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-div-identity-recursive
          path: vero/div_identity_recursive/
          if-no-files-found: warn
      - name: Upload division identity strip lift census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-div-identity-lift
          path: vero/div_identity_lift/
          if-no-files-found: warn
      - name: Upload division identity invariant census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-div-identity-invariant
          path: vero/div_identity_invariant/
          if-no-files-found: warn
      - name: Upload division evaluation invariant census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-div-eval-invariant
          path: vero/div_eval_invariant/
          if-no-files-found: warn
      - name: Upload recursive remainder coefficient census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-divcore-coeff
          path: vero/divcore_coeff/
          if-no-files-found: warn
      - name: Upload quotient bridge census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-quotient-bridge
          path: vero/quotient_bridge/
          if-no-files-found: warn
      - name: Upload verified quotient bridge reuse census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-quotient-bridge-v2
          path: vero/quotient_bridge_v2/
          if-no-files-found: warn
      - name: Upload multiplication structural census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-mul-structural
          path: vero/mul_structural/
          if-no-files-found: warn
      - name: Upload all-in result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-allin
          path: vero/galoistools_allin/
          if-no-files-found: warn
