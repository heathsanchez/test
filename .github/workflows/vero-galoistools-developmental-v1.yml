name: Vero galoistools developmental v1

# Causal transfer retry after verified strip-evaluation constructor.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified strip bridge artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32906932000
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for add-associativity causal retry
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# CAUSAL RETRY: spec_add_assoc_eval after verified strip-evaluation bridge\n\nStart from the independently Vero-verified 15/48 artifact from run 32906932000. It contains the accumulated modular/Horner capability stack plus the newly verified theorem equivalent to:\n\n`refPolyEval_gfStrip (p x : Nat) (xs : List Nat) :\n  Galoistools.refPolyEval p (Galoistools.gfStrip xs) x =\n  Galoistools.refPolyEval p xs x`.\n\nThe previous scored transfer already showed that the only structural obstruction was the strip/evaluation boundary. That boundary is now closed. Retry exactly ONE benchmark theorem: `spec_add_assoc_eval`.\n\nRules:\n1. Inspect only the proof slot for `spec_add_assoc_eval`, `gfAdd`, and the retained Horner/strip helpers. No repo inventory.\n2. Fill ONLY the `sorry` body for `prove_add_assoc_eval` / the theorem corresponding to `spec_add_assoc_eval`. Do not change any statement or any other scored proof.\n3. Use `refPolyEval_gfStrip` to eliminate strip bookkeeping and `natModEq_refPolyEvalRevAux_zipAddPad` to expose modular addition semantics.\n4. Keep the modular relation abstract until the final equality; finish by Nat addition associativity modulo p.\n5. Compile `Galoistools/Proof/Ring.lean` immediately. Allow at most ONE focused repair.\n6. If it compiles, STOP and retain it. Do not attempt another benchmark theorem.\n7. If it fails after one repair, revert only this scored proof and record the exact residual; preserve all verified helpers.\n8. No full build; Vero evaluation is authoritative.\n\nSuccess criterion is exact: Vero moves from 15/48 to 16/48, 0 failures.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify seed exists
        run: |
          test -s baseline/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/source/artifact.json)"

      - name: Run add-associativity causal retry
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=90 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero causal retry: spec_add_assoc_eval' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
