name: Vero galoistools developmental v1

# Residual-induced constructor probe: stripping leading zeros preserves evaluation.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified Horner bridge artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32906063909
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for strip-evaluation constructor probe
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# ECONOMICAL strip-evaluation residual probe\n\nStart from the independently Vero-verified 15/48 artifact containing the full modular/Horner capability stack. The last scored transfer failed for one exact boundary reason: `gfAdd` strips leading zeros before reversing, and we lack a reusable theorem that this stripping preserves the reference polynomial evaluation.\n\nDo NOT retry `spec_add_assoc_eval`. Prove exactly ONE reusable theorem in Ring `global_aux` equivalent to:\n\n`theorem refPolyEval_gfStrip (p x : Nat) (xs : List Nat) :\n  Galoistools.refPolyEval p (Galoistools.gfStrip xs) x =\n  Galoistools.refPolyEval p xs x`\n\nYou may choose an equivalent theorem stated directly at `refPolyEvalRevAux` over reversed lists if that makes the induction structurally exact, but the retained result must immediately imply the displayed theorem.\n\nRules:\n1. Inspect only `gfStrip`, `refPolyEval`, `refPolyEvalRevAux`, and the nearby retained helpers. No benchmark theorem and no repo inventory.\n2. The previous failed induction mismatch is the clue: do not formulate the induction hypothesis at a level that unfolds away before recursive use. Prefer proving the smallest reversed-Horner append-zero fact first inside the proof if needed, then the strip theorem. Do not add unrelated helpers.\n3. Add only this constructor to `global_aux`.\n4. Compile `Galoistools/Proof/Ring.lean` immediately. At most ONE focused syntactic/orientation repair.\n5. If it compiles, STOP. Preserve it and record that the next run should retry only `spec_add_assoc_eval` from this artifact.\n6. If it fails after one repair, revert only this new constructor and record the exact residual.\n7. No full build; Vero evaluation independently verifies the artifact.\n\nSuccess is a compiled strip-evaluation invariance constructor while the externally verified benchmark state stays 15/48, 0 failed.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify seed exists
        run: |
          test -s baseline/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/source/artifact.json)"

      - name: Run strip-evaluation constructor probe
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=70 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero strip-evaluation constructor probe' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
