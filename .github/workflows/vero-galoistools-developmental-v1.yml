name: Vero galoistools developmental v1
# zero-agent residual push: stabilize gcd-value invariant proof surface

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download 21/48 ratchet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32920029678
          name: vero-galoistools-developmental-v1
          path: baseline
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Stabilize gcd-value invariant and expose final residue
        working-directory: vero
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          from vero.generation.extractor import read_artifact
          from vero.generation.sandbox import create_sandbox

          bench_dir = Path('benchmarks/galoistools').resolve()
          seed = read_artifact(Path('../baseline/source/artifact.json').resolve())
          source = Path('monic_probe/source').resolve()
          create_sandbox(bench_dir, source, mode='codeproof', overwrite=True, seed_artifact=seed)

          ring = source / 'Galoistools/Proof/Ring.lean'
          text = ring.read_text()
          start = '-- !benchmark @start proof def=prove_monic_leadCoeff_one kind=prove target=spec_monic_leadCoeff_one\n'
          end = '-- !benchmark @end proof def=prove_monic_leadCoeff_one\n'
          i = text.index(start) + len(start)
          j = text.index(end, i)
          proof = r'''  intro f p hp hne hcop
            have egcd_bezout : ∀ fuel a b,
                let r := Galoistools.egcdInt fuel a b
                a * r.2.1 + b * r.2.2 = r.1 := by
              intro fuel
              induction fuel with
              | zero =>
                  intro a b
                  simp [Galoistools.egcdInt]
              | succ fuel ih =>
                  intro a b
                  simp only [Galoistools.egcdInt]
                  by_cases hb : b = 0
                  · simp [hb]
                  · simp only [hb, ↓reduceIte]
                    let r := Galoistools.egcdInt fuel b (a % b)
                    have hr := ih b (a % b)
                    change a * r.2.2 + b * (r.2.1 - (a / b) * r.2.2) = r.1
                    have halg :
                        a * r.2.2 + b * (r.2.1 - (a / b) * r.2.2) =
                          b * r.2.1 + (a - b * (a / b)) * r.2.2 := by
                      simp only [Int.sub_eq_add_neg, Int.mul_add, Int.add_mul,
                        Int.mul_neg, Int.neg_mul, Int.mul_assoc]
                      ac_rfl
                    rw [halg, ← Int.emod_def]
                    exact hr
            have egcd_gcd : ∀ fuel m n : Nat, n < fuel →
                (Galoistools.egcdInt fuel (Int.ofNat m) (Int.ofNat n)).1 =
                  Int.ofNat (Nat.gcd m n) := by
              intro fuel
              induction fuel with
              | zero =>
                  intro m n h
                  exact (Nat.not_lt_zero n h).elim
              | succ fuel ih =>
                  intro m n h
                  by_cases hn : n = 0
                  · subst n
                    simp [Galoistools.egcdInt]
                  · have hnpos : 0 < n := Nat.pos_of_ne_zero hn
                    have hnfuel : n ≤ fuel := Nat.le_of_lt_succ h
                    have hmod : m % n < fuel := by
                      have hm := Nat.mod_lt m hnpos
                      omega
                    rw [Galoistools.egcdInt]
                    have hnI : (Int.ofNat n) ≠ 0 := by omega
                    rw [if_neg hnI]
                    have hr := ih n (m % n) hmod
                    simpa [Nat.gcd_comm, Nat.gcd_rec] using hr
            simp only [canonical]
            cases f with
            | nil => contradiction
            | cons a as =>
              simp only [Galoistools.refLeadCoeff] at hcop
              change Galoistools.refLeadCoeff (Galoistools.gfMonic (a :: as) p).2 = 1
              by_cases ha : a = 1
              · simp [Galoistools.gfMonic, ha, Galoistools.refLeadCoeff]
              · rw [Galoistools.gfMonic]
                simp only [ha, ↓reduceIte, Galoistools.gfQuoGround, List.map_cons,
                  Galoistools.refLeadCoeff]
                unfold Galoistools.invMod
                let r := Galoistools.egcdInt (a + p + 1) (Int.ofNat (a % p)) (Int.ofNat p)
                have hbez := egcd_bezout (a + p + 1) (Int.ofNat (a % p)) (Int.ofNat p)
                have hfuel : p < a + p + 1 := by omega
                have hg := egcd_gcd (a + p + 1) (a % p) p hfuel
                have hgp : Nat.gcd (a % p) p = 1 := by
                  rw [← Nat.gcd_rec p a, Nat.gcd_comm]
                  exact hcop
                have hr1 : r.1 = 1 := by
                  dsimp [r]
                  simpa [hgp] using hg
                change a * ((r.2.1 % (Int.ofNat p)).toNat) % p = 1
          '''
          ring.write_text(text[:i] + proof + text[j:])
          cp = subprocess.run(['lake','lean','Galoistools/Proof/Ring.lean'], cwd=source, text=True, capture_output=True)
          print(cp.stdout)
          print(cp.stderr)
          print('EGCD_GCD_STABLE_EXIT', cp.returncode)
          if cp.returncode != 0:
              raise SystemExit(cp.returncode)
          PY
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/monic_probe/
          if-no-files-found: warn
