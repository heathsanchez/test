name: Vero galoistools developmental v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified 15/48 developmental artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32897362275
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for seeded economical residual probe
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Single-shot mode (iterate.max=0) bypasses cli_iterate, so inject the
          # verified seed into the direct dispatch path itself.
          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# ECONOMICAL seeded residual probe\n\nYou begin from a materialized, independently Vero-verified 15/48 artifact (0 failed, 33 unfilled). Preserve every verified slot. This is one bounded scientific probe, not a general solve attempt.\n\nTarget exactly ONE obstruction: the modular-normalization/evaluation bridge around refPolyEvalRevAux, zipAddPad, coefficient map-mod, scalar multiplication, and convolution. Seek the smallest reusable lemma/refactor that can discharge at least one ring evaluation-homomorphism spec.\n\nRules:\n1. Confirm the 15/48 seed is visibly present, then inspect only the relevant Ring implementation/spec/proof region. Do not re-inventory the repository.\n2. Push existing lawful composition first.\n3. Make one candidate refinement at a time and test the focused Lean file immediately.\n4. After at most two focused repairs without progress, revert and stop.\n5. Never leave an already verified slot broken.\n6. Run full `lake build` once only if the focused file succeeds.\n7. Success = preserve all 15 verified specs with 0 failures and add at least one spec.\n8. On bounded failure, preserve the seed and write RESIDUAL_REPORT.md naming the exact obstruction and cheapest next separator.\n\nBe economical with context reads and proof search. Stop on verified gain or crisp bounded failure.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify 15/48 seed artifact exists
        run: |
          test -s baseline/iter-2/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/iter-2/source/artifact.json)"

      - name: Run economical single-separator probe
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/iter-2/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=240 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero galoistools economical seeded residual probe' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
