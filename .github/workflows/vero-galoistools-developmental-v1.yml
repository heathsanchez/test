name: Vero galoistools developmental v1
# deterministic closure step: mul_eval_hom -> mul_comm_eval

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download 18/48 ratchet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32917493030
          name: vero-galoistools-developmental-v1
          path: baseline
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Derive multiplication commutativity semantically
        working-directory: vero
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          from vero.generation.benchmark import Benchmark
          from vero.generation.extractor import read_artifact, extract, write_artifact
          from vero.generation.sandbox import create_sandbox
          from vero.evaluation.runner import run_evaluation

          bench_dir = Path('benchmarks/galoistools').resolve()
          bench = Benchmark(bench_dir)
          seed = read_artifact(Path('../baseline/source/artifact.json').resolve())
          source = Path('mul_comm/source').resolve()
          create_sandbox(bench_dir, source, mode='codeproof', overwrite=True, seed_artifact=seed)

          ring = source / 'Galoistools/Proof/Ring.lean'
          text = ring.read_text()
          if 'theorem prove_mul_eval_hom' not in text:
              raise SystemExit('18/48 ratchet missing prove_mul_eval_hom')

          start = '-- !benchmark @start proof def=prove_mul_comm_eval kind=prove target=spec_mul_comm_eval\n'
          end = '-- !benchmark @end proof def=prove_mul_comm_eval\n'
          i = text.index(start) + len(start)
          j = text.index(end, i)
          proof = r'''  intro f g p x hp
            have hfg := prove_mul_eval_hom f g p x hp
            have hgf := prove_mul_eval_hom g f p x hp
            calc
              Galoistools.refPolyEval p (Galoistools.gfMul f g p) x =
                  (Galoistools.refPolyEval p f x * Galoistools.refPolyEval p g x) % p := hfg
              _ = (Galoistools.refPolyEval p g x * Galoistools.refPolyEval p f x) % p := by
                    rw [Nat.mul_comm]
              _ = Galoistools.refPolyEval p (Galoistools.gfMul g f p) x := hgf.symm
          '''
          ring.write_text(text[:i] + proof + text[j:])
          subprocess.run(['lake','lean','Galoistools/Proof/Ring.lean'], cwd=source, check=True)

          artifact = extract(source, bench, mode='codeproof')
          write_artifact(artifact, source / 'artifact.json')
          result = run_evaluation(
              benchmark_dir=bench_dir,
              artifact=artifact,
              mode='codeproof',
              eval_sandbox_dir=Path('mul_comm/eval/sandbox').resolve(),
              report_dir=Path('mul_comm/eval').resolve(),
              lake_timeout=180,
          )
          print(result.md_path.read_text())
          print('MUL_COMM_CLOSURE_COMPLETE', result.report.summary)
          PY
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/mul_comm/
          if-no-files-found: warn
