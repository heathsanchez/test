name: Vero galoistools developmental v1

# Deterministic zero-API score retry: verified negation evaluation -> subtraction evaluation.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified negation-evaluation artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32912246633
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Recompose spec_sub_eval_hom and evaluate
        working-directory: vero
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          from vero.generation.benchmark import Benchmark
          from vero.generation.extractor import read_artifact, extract, write_artifact
          from vero.generation.sandbox import create_sandbox
          from vero.evaluation.runner import run_evaluation

          bench_dir = Path('benchmarks/galoistools').resolve()
          bench = Benchmark(bench_dir)
          seed_path = Path('../baseline/source/artifact.json').resolve()
          if not seed_path.is_file():
              raise SystemExit(f'negation seed missing: {seed_path}')
          seed = read_artifact(seed_path)
          source = Path('score_retry/source').resolve()
          create_sandbox(bench_dir, source, mode='codeproof', overwrite=True, seed_artifact=seed)

          ring = source / 'Galoistools/Proof/Ring.lean'
          text = ring.read_text()
          required = [
              'theorem natModEq_add_eq_zero_right_neg',
              'theorem natModEq_refPolyEvalRevAux_map_neg',
              'theorem natModEq_refPolyEvalRevAux_zipAddPad',
              'theorem refPolyEval_gfStrip',
              'theorem zipSubPad_eq_add_neg',
          ]
          for name in required:
              if name not in text:
                  raise SystemExit(f'missing retained capability: {name}')

          start = '-- !benchmark @start proof def=prove_sub_eval_hom kind=prove target=spec_sub_eval_hom\n'
          end = '-- !benchmark @end proof def=prove_sub_eval_hom\n'
          i = text.index(start) + len(start)
          j = text.index(end, i)
          proof = r'''  intro f g p x hp
          simp only [canonical, Galoistools.gfSub]
          rw [refPolyEval_gfStrip]
          simp only [Galoistools.refPolyEval, List.reverse_reverse]
          rw [zipSubPad_eq_add_neg]
          have hadd := natModEq_refPolyEvalRevAux_zipAddPad p x f.reverse
            (g.reverse.map (fun c => (p - c % p) % p))
          have hneg := natModEq_refPolyEvalRevAux_map_neg p x hp g.reverse
          unfold NatModEq at hadd hneg
          have eval_mod (xs : List Nat) :
              Galoistools.refPolyEvalRevAux p x xs % p =
                Galoistools.refPolyEvalRevAux p x xs := by
            cases xs <;> simp [Galoistools.refPolyEvalRevAux]
          have hp0 : 0 < p := by omega
          have hb_le : Galoistools.refPolyEvalRevAux p x g.reverse % p ≤ p :=
            Nat.le_of_lt (Nat.mod_lt _ hp0)
          calc
            Galoistools.refPolyEvalRevAux p x
                (Galoistools.zipAddPad p f.reverse
                  (g.reverse.map (fun c => (p - c % p) % p))) =
              Galoistools.refPolyEvalRevAux p x
                (Galoistools.zipAddPad p f.reverse
                  (g.reverse.map (fun c => (p - c % p) % p))) % p :=
                (eval_mod _).symm
            _ = (Galoistools.refPolyEvalRevAux p x f.reverse +
                  Galoistools.refPolyEvalRevAux p x
                    (g.reverse.map (fun c => (p - c % p) % p))) % p := hadd
            _ = (Galoistools.refPolyEvalRevAux p x f.reverse % p +
                  Galoistools.refPolyEvalRevAux p x
                    (g.reverse.map (fun c => (p - c % p) % p)) % p) % p := by
                  rw [Nat.add_mod]
            _ = (Galoistools.refPolyEvalRevAux p x f.reverse % p +
                  ((p - Galoistools.refPolyEvalRevAux p x g.reverse % p) % p) % p) % p := by
                  rw [hneg]
            _ = (Galoistools.refPolyEvalRevAux p x f.reverse + p -
                  Galoistools.refPolyEvalRevAux p x g.reverse % p) % p := by
                  rw [Nat.mod_mod]
                  rw [Nat.add_sub_assoc hb_le]
                  rw [Nat.add_mod]
          '''
          ring.write_text(text[:i] + proof + text[j:])
          subprocess.run(['lake', 'lean', 'Galoistools/Proof/Ring.lean'], cwd=source, check=True)

          artifact = extract(source, bench, mode='codeproof')
          write_artifact(artifact, source / 'artifact.json')
          result = run_evaluation(
              benchmark_dir=bench_dir,
              artifact=artifact,
              mode='codeproof',
              eval_sandbox_dir=Path('score_retry/eval/sandbox').resolve(),
              report_dir=Path('score_retry/eval').resolve(),
              lake_timeout=180,
          )
          print(result.md_path.read_text())
          summary = result.report.summary
          print('SUB_EVAL_SCORE_RETRY_COMPLETE', summary)
          PY

      - name: Upload score retry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/score_retry/
          if-no-files-found: warn
