name: Vero galoistools developmental v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified 15/48 developmental artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32897362275
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for seeded Nat.ModEq probe
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# ECONOMICAL Nat.ModEq separator probe\n\nYou begin from the materialized independently Vero-verified 15/48 artifact. Preserve it exactly unless the new capability compiles. This is a capability-construction probe, NOT a benchmark-score attempt.\n\nThe previous bounded run established a sharper residual: proving the recursive Horner/zipAddPad bridge by literal Nat equality is the wrong relation because nested `% p` reductions obscure distributivity. The proposed separator is modular congruence.\n\nTarget exactly ONE thing:\nConstruct the smallest reusable `Nat.ModEq p` lemma (or equivalent modular-congruence lemma already in Lean) showing that little-endian Horner evaluation respects `zipAddPad`. It should express that evaluating `zipAddPad p xs ys` is congruent modulo `p` to the sum of the evaluations of `xs` and `ys`. Carry only the minimal positivity/nonzero hypothesis on `p` actually needed.\n\nRules:\n1. Confirm the seeded Ring helpers are present. Inspect only definitions/theorems needed for `refPolyEvalRevAux`, `zipAddPad`, and `Nat.ModEq` API usage.\n2. Do NOT attempt `add_assoc_eval`, `mul_eval_hom`, or any other benchmark proof in this run. We are testing whether the missing capability itself is expressible and compilable.\n3. Prefer existing `Nat.ModEq` lemmas for addition, multiplication, and remainder over manual `%` normalization.\n4. Put the candidate in an editable Ring proof auxiliary/global auxiliary slot so it will survive artifact extraction.\n5. Compile `Galoistools/Proof/Ring.lean` immediately. Allow at most two focused repairs.\n6. If it compiles, stop. Do not spend tokens transferring it yet. Write `RESIDUAL_REPORT.md` naming the exact theorem constructed and the cheapest benchmark theorem to test next.\n7. If it does not compile after two repairs, revert completely to the 15/48 seed and record the smallest remaining obstruction.\n8. Do not run full `lake build` unless needed to validate artifact integrity after a successful focused compile.\n\nSuccess for this run is NOT 16/48. Success is a compiled reusable modular-congruence evaluation bridge while preserving the existing 15 verified specs.\n\nBe extremely economical with context reads and tool calls.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify 15/48 seed artifact exists
        run: |
          test -s baseline/iter-2/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/iter-2/source/artifact.json)"

      - name: Run economical Nat.ModEq separator probe
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/iter-2/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=180 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero galoistools Nat.ModEq separator probe' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
