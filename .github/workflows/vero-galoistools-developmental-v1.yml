name: Vero galoistools developmental v1

# Residual-induced relation-management probe: absorb one extra outer modulo.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified map-mod bridge artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32904668523
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for minimal relation-normalization probe
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# ECONOMICAL relation-management constructor probe\n\nStep back. Do NOT retry the Horner theorem. The last verified failure already isolated the exact residual: `NatModEq` unfolds to equality of remainders, and an already-reduced Horner expression acquires one redundant outer `% p`. The representation is fine; we are missing the smallest relation law that absorbs that normalization boundary.\n\nYou begin from the independently Vero-verified 15/48 artifact containing `NatModEq`, `natModEq_mod`, `natModEq_add`, `natModEq_mul`, and `natModEq_refPolyEvalRevAux_map_mod`. Preserve all of it.\n\nTarget exactly ONE tiny theorem in Ring `global_aux` equivalent to:\n\n`theorem natModEq_mod_left {p a b : Nat} (h : NatModEq p a b) : NatModEq p (a % p) b`\n\n(or the opposite orientation if that is strictly more useful for absorbing the extra outer modulo). It should be essentially `Nat.mod_mod` plus `h`.\n\nRules:\n1. Inspect only the definition of `NatModEq` and `Nat.mod_mod` orientation if necessary. No repo inventory.\n2. Do not touch Horner, `zipAddPad`, or any benchmark theorem.\n3. Add only this relation-management lemma to Ring `global_aux`.\n4. Compile `Galoistools/Proof/Ring.lean` immediately. At most ONE syntactic/orientation repair.\n5. If it compiles, stop immediately and write `RESIDUAL_REPORT.md`: next experiment is to compose the existing failed Horner paired branch WITHOUT unfolding `NatModEq` early, using this normalization lemma at the boundary.\n6. If it fails, revert only the new lemma and record the exact type mismatch.\n7. No full build.\n\nThis should be easy. Success is one compiled normalization law while Vero remains 15/48 with 0 failures.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify seed exists
        run: |
          test -s baseline/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/source/artifact.json)"

      - name: Run minimal relation-normalization probe
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=60 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero NatModEq normalization bridge probe' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
