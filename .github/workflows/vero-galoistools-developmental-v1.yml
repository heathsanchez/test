name: Vero galoistools developmental v1
# zero-agent residual push: reuse verified monic theorem against gcd output

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download gcd-zero ratchet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32926602836
          name: vero-galoistools-developmental-v1
          path: baseline
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Probe gcd monic residual
        working-directory: vero
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          from vero.generation.extractor import read_artifact
          from vero.generation.sandbox import create_sandbox

          bench_dir = Path('benchmarks/galoistools').resolve()
          seed = read_artifact(Path('../baseline/ratchet/artifact.json').resolve())
          source = Path('gcd_monic_probe/source').resolve()
          create_sandbox(bench_dir, source, mode='codeproof', overwrite=True, seed_artifact=seed)

          div = source / 'Galoistools/Proof/Division.lean'
          text = div.read_text()
          istart = '-- !benchmark @start imports\n'
          iend = '-- !benchmark @end imports\n'
          i = text.index(istart) + len(istart)
          j = text.index(iend, i)
          text = text[:i] + 'import Galoistools.Proof.Ring\n' + text[j:]

          start = '-- !benchmark @start proof def=prove_gcd_monic kind=prove target=spec_gcd_monic\n'
          end = '-- !benchmark @end proof def=prove_gcd_monic\n'
          i = text.index(start) + len(start)
          j = text.index(end, i)
          proof = "  intro f g p hp hf hg\n  simp only [canonical]\n  let h := Galoistools.gcdLoop p (f.length + g.length + 1) f g\n  by_cases hz : h = []\n  · left\n    simp [Galoistools.gfGcd, h, hz]\n  · right\n    change Galoistools.refLeadCoeff (Galoistools.gfMonic h p).2 = 1\n    apply prove_monic_leadCoeff_one h p hp.1 hz\n    omega\n"
          div.write_text(text[:i] + proof + text[j:])
          cp = subprocess.run(['lake','lean','Galoistools/Proof/Division.lean'], cwd=source, text=True, capture_output=True)
          print(cp.stdout)
          print(cp.stderr)
          print('GCD_MONIC_REUSE_EXIT', cp.returncode)
          if cp.returncode != 0:
              raise SystemExit(cp.returncode)
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/gcd_monic_probe/
          if-no-files-found: warn
