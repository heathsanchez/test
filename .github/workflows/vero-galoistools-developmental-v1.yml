name: Vero galoistools developmental v1
# zero-agent ratchet: persist verified monic proof into artifact and clean rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download green monic source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32925947744
          name: vero-galoistools-developmental-v1
          path: green
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Extract ratchet and replay clean
        working-directory: vero
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          from vero.generation.benchmark import Benchmark
          from vero.generation.extractor import extract, write_artifact
          from vero.generation.sandbox import create_sandbox

          bench_dir = Path('benchmarks/galoistools').resolve()
          bench = Benchmark(bench_dir)
          green = Path('../green/source').resolve()
          art = extract(green, bench, mode='codeproof')
          out = Path('ratchet/source')
          out.mkdir(parents=True, exist_ok=True)
          write_artifact(art, out / 'artifact.json')

          target = [s for s in art.slots if s.def_name == 'prove_monic_leadCoeff_one' and s.key == 'proof']
          assert len(target) == 1, target
          assert target[0].found and not target[0].is_empty and not target[0].contains_sorry
          print('MONIC_RATCHET_SLOT_OK', target[0].body_hash)

          replay = Path('ratchet/replay').resolve()
          create_sandbox(bench_dir, replay, mode='codeproof', overwrite=True, seed_artifact=art)
          cp = subprocess.run(['lake','lean','Galoistools/Proof/Ring.lean'], cwd=replay, text=True, capture_output=True)
          print(cp.stdout)
          print(cp.stderr)
          print('MONIC_RATCHET_REPLAY_EXIT', cp.returncode)
          if cp.returncode != 0:
              raise SystemExit(cp.returncode)
          PY
      - name: Upload ratchet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/ratchet/
          if-no-files-found: warn
