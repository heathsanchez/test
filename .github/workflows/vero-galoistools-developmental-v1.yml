name: Vero galoistools developmental v1
# zero-agent theorem-surface probe: inspect Int division identities needed for egcdInt

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.29.1
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.29.1
      - name: Inspect Int division theorem surface
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$HOME/.elan/toolchains/leanprover--lean4---v4.29.1/src/lean/Init/Data/Int"
          grep -R -n -E 'emod.*ediv|ediv.*emod|div.*mod|mod.*div|mul.*ediv|ediv.*mul' "$ROOT" | head -n 180 || true
          cat > /tmp/Probe.lean <<'EOF'
          import Init.Data.Int.DivModLemmas
          #check Int.ediv_add_emod
          #check Int.ediv_mul_add_emod
          #check Int.ediv_mul_add_emod_self
          #check Int.emod_add_ediv
          #check Int.ediv_mul_le
          #check Int.emod_def
          #check Int.ediv_def
          EOF
          "$HOME/.elan/bin/elan" run leanprover/lean4:v4.29.1 lean /tmp/Probe.lean || true
