name: Vero galoistools developmental v1

# Isolate the exact subtraction residual: Horner evaluation under coefficient-wise modular negation.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified 16-of-48 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32907148895
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for negation-evaluation constructor probe
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# NEGATION-EVALUATION CONSTRUCTOR PROBE\n\nStart from the independently Vero-verified 16/48 artifact from run 32907148895. Do not touch any scored theorem. The failed subtraction transfer isolated one exact residual: evaluation of coefficient-wise modular negation.\n\nProve exactly ONE reusable global_aux theorem, with a name such as `natModEq_refPolyEvalRevAux_map_neg`, expressing that for p > 1:\n\n`NatModEq p\n  (Galoistools.refPolyEvalRevAux p x\n    (xs.map (fun c => (p - c % p) % p)))\n  ((p - Galoistools.refPolyEvalRevAux p x xs % p) % p)`\n\nAn equivalent NatModEq formulation is fine if it composes directly with `natModEq_refPolyEvalRevAux_zipAddPad` and the subtraction target.\n\nRules:\n1. Inspect only the retained NatModEq primitives, Horner evaluator, coefficient-negation expression, and any already-retained cancellation/additive helper that can prove this law. No repo inventory.\n2. Do not retry `prove_sub_eval_hom`; do not fill any scored `sorry`.\n3. Push existing algebra first. Prefer induction on `xs` plus `natModEq_add`/`natModEq_mul`, or derive the negation law via verified cancellation if that is shorter.\n4. Add exactly one global_aux theorem. No second helper unless the theorem literally cannot typecheck without a tiny local fact inside its proof.\n5. Immediately run `lake lean Galoistools/Proof/Ring.lean`. Allow at most ONE focused repair.\n6. If it compiles, STOP and retain it. Vero should remain exactly 16/48, 0 failed.\n7. If it fails after one repair, revert only this new theorem and report the smallest exact residual.\n8. No full build; Vero evaluation is authoritative.\n\nThis is a constructor probe, not a score attempt.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify seed exists
        run: |
          test -s baseline/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/source/artifact.json)"

      - name: Run negation-evaluation constructor probe
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=65 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero constructor probe: coefficient-negation evaluation' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
