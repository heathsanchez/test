name: Vero galoistools developmental v1

# Residual-driven retry: Horner/zipAddPad congruence using verified map-mod bridge.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified map-mod bridge artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32904668523
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for bounded Horner retry
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# ECONOMICAL Horner / zipAddPad retry after verified structural separator\n\nYou begin from the independently Vero-verified 15/48 artifact containing:\n- `NatModEq`\n- `natModEq_mod`\n- `natModEq_add`\n- `natModEq_mul`\n- `natModEq_refPolyEvalRevAux_map_mod`\n\nThe previous Horner attempt failed because empty-side branches normalized to `List.map (fun a => a % p) xs`. That exact residual has now been discharged by the verified map-mod evaluation bridge. Preserve all existing verified state.\n\nTarget exactly ONE theorem in Ring `global_aux`, equivalent to:\n\n`NatModEq p\n  (Galoistools.refPolyEvalRevAux p x (Galoistools.zipAddPad p xs ys))\n  (Galoistools.refPolyEvalRevAux p x xs + Galoistools.refPolyEvalRevAux p x ys)`\n\nfor all `p x xs ys`, with no unnecessary hypotheses.\n\nRules:\n1. Reuse `natModEq_refPolyEvalRevAux_map_mod` immediately for both empty-side branches. Do not rediscover or re-prove map-mod normalization.\n2. For the paired branch, use the existing congruence algebra compositionally. Isolate only the remaining distributive/associative alignment between `(a+b)+x*(A+B)` and `(a+x*A)+(b+x*B)` before modulo.\n3. Inspect only the relevant global_aux helpers plus definitions of `zipAddPad` and `refPolyEvalRevAux`. No repo-wide search.\n4. Do NOT attempt any benchmark theorem (`add_assoc_eval`, `mul_eval_hom`, etc.) in this run.\n5. Compile `Galoistools/Proof/Ring.lean` immediately. Allow at most ONE focused repair.\n6. If it compiles, stop immediately, retain the theorem, and write `RESIDUAL_REPORT.md` naming the cheapest benchmark transfer target.\n7. If it fails after one repair, revert only the new theorem, preserve the verified 15/48 + helper state, and record the exact surviving paired-branch identity.\n8. No full `lake build`; focused Ring compilation only.\n\nBe extremely economical. Success is the compiled Horner/zipAddPad congruence bridge while preserving 15/48 with 0 failures.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify map-mod bridge seed exists
        run: |
          test -s baseline/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/source/artifact.json)"

      - name: Run bounded Horner retry
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=90 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero galoistools Horner retry with map-mod bridge' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
