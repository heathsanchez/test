name: Vero galoistools developmental v1

# Frozen residual-induced constructor test: map-mod evaluation bridge.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified congruence-capability artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32904147519
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for map-mod evaluation bridge probe
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# ECONOMICAL map-mod evaluation separator probe\n\nYou begin from the independently Vero-verified 15/48 artifact containing the compiled local modular-congruence capability:\n- `NatModEq`\n- `natModEq_mod`\n- `natModEq_add`\n- `natModEq_mul`\nThe previous Horner/zipAddPad composition attempt was correctly reverted. Preserve all 15 verified specs and the four congruence helpers.\n\nThe verified residual is now structural: empty-side `zipAddPad` branches normalize to `List.map (fun a => a % p) xs`, while the recursive goal wants the original list. Before retrying the main theorem, test the smallest separator that directly removes that mismatch.\n\nTarget exactly ONE theorem in Ring `global_aux`, equivalent to:\n\n`NatModEq p\n  (Galoistools.refPolyEvalRevAux p x (xs.map (fun a => a % p)))\n  (Galoistools.refPolyEvalRevAux p x xs)`\n\nfor all `p x xs`, with no unnecessary hypotheses.\n\nRules:\n1. Inspect only the four existing congruence helpers and `refPolyEvalRevAux`. Do not inspect unrelated benchmark targets or re-inventory the repo.\n2. Prove by the smallest structural induction on `xs`. Reuse `natModEq_mod`, `natModEq_add`, and `natModEq_mul`; avoid broad `simp` over remainder arithmetic.\n3. Do NOT attempt `zipAddPad`, `add_assoc_eval`, `mul_eval_hom`, or any benchmark theorem in this run.\n4. Put the theorem in editable Ring `global_aux` so artifact extraction retains it.\n5. Compile `Galoistools/Proof/Ring.lean` immediately. Allow at most ONE focused repair.\n6. If it compiles, stop immediately and write `RESIDUAL_REPORT.md` with the theorem name and state that the next deciding experiment is to retry the Horner/zipAddPad congruence theorem using this bridge.\n7. If it fails after one repair, revert only the new theorem, preserve all existing verified state, and record the exact remaining proof-shape obstruction.\n8. Do not run a full `lake build`; focused Ring compilation is sufficient.\n\nBe extremely economical. Success is this one compiled structural bridge while Vero remains 15/48 with 0 failures.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify congruence seed artifact exists
        run: |
          test -s baseline/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/source/artifact.json)"

      - name: Run economical map-mod evaluation bridge probe
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=90 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero galoistools map-mod evaluation separator probe' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
