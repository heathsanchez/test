name: Vero galoistools developmental v1

# Zero-API constructor probe from the verified 17/48 ratchet.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download verified 17-of-48 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32916731196
          name: vero-galoistools-developmental-v1
          path: baseline
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Prove scalar-map evaluation constructor
        working-directory: vero
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          from vero.generation.benchmark import Benchmark
          from vero.generation.extractor import read_artifact, extract, write_artifact
          from vero.generation.sandbox import create_sandbox

          bench_dir = Path('benchmarks/galoistools').resolve()
          bench = Benchmark(bench_dir)
          seed = read_artifact(Path('../baseline/source/artifact.json').resolve())
          source = Path('constructor/source').resolve()
          create_sandbox(bench_dir, source, mode='codeproof', overwrite=True, seed_artifact=seed)
          ring = source / 'Galoistools/Proof/Ring.lean'
          text = ring.read_text()
          required = ['theorem natModEq_refPolyEvalRevAux_zipAddPad', 'theorem refPolyEval_gfStrip']
          for name in required:
              if name not in text:
                  raise SystemExit(f'missing retained capability: {name}')

          marker = '-- !benchmark @start proof def=prove_mul_eval_hom kind=prove target=spec_mul_eval_hom\n'
          k = text.index(marker)
          theorem = r'''
-- Developmental constructor: Horner evaluation commutes with coefficientwise scalar multiplication.
theorem natModEq_refPolyEvalRevAux_map_mul
    (p x a : Nat) (ys : List Nat) :
    NatModEq p
      (Galoistools.refPolyEvalRevAux p x (ys.map (fun y => (a * y) % p)))
      ((a % p) * Galoistools.refPolyEvalRevAux p x ys) := by
  induction ys with
  | nil => simp [NatModEq, Galoistools.refPolyEvalRevAux]
  | cons y ys ih =>
      unfold NatModEq at ih ⊢
      simp only [List.map_cons, Galoistools.refPolyEvalRevAux]
      simp [Nat.add_mod, Nat.mul_mod, Nat.mul_add, Nat.add_mul,
        Nat.mul_assoc, Nat.mul_left_comm, Nat.mul_comm, ih]

'''
          ring.write_text(text[:k] + theorem + text[k:])
          subprocess.run(['lake', 'lean', 'Galoistools/Proof/Ring.lean'], cwd=source, check=True)
          artifact = extract(source, bench, mode='codeproof')
          write_artifact(artifact, source / 'artifact.json')
          print('SCALAR_MAP_EVAL_COMPILED')
          PY
      - name: Upload constructor artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/constructor/
          if-no-files-found: warn
