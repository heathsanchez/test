name: Vero galoistools developmental v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download 17/48 ratchet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32916731196
          name: vero-galoistools-developmental-v1
          path: baseline
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Prove multiplication evaluation homomorphism
        working-directory: vero
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          from vero.generation.benchmark import Benchmark
          from vero.generation.extractor import read_artifact, extract, write_artifact
          from vero.generation.sandbox import create_sandbox
          from vero.evaluation.runner import run_evaluation
          bench_dir = Path('benchmarks/galoistools').resolve()
          bench = Benchmark(bench_dir)
          seed = read_artifact(Path('../baseline/source/artifact.json').resolve())
          source = Path('mul_eval/source').resolve()
          create_sandbox(bench_dir, source, mode='codeproof', overwrite=True, seed_artifact=seed)
          ring = source / 'Galoistools/Proof/Ring.lean'
          text = ring.read_text()
          aux_start = '-- !benchmark @start proof_aux def=prove_mul_eval_hom\n'
          aux_end = '-- !benchmark @end proof_aux def=prove_mul_eval_hom\n'
          ai = text.index(aux_start) + len(aux_start)
          aj = text.index(aux_end, ai)
          aux = r'''theorem natModEq_refPolyEvalRevAux_map_mul (p x a : Nat) (ys : List Nat) :
              NatModEq p
                (Galoistools.refPolyEvalRevAux p x (ys.map (fun y => (a * y) % p)))
                (a * Galoistools.refPolyEvalRevAux p x ys) := by
            induction ys with
            | nil => rfl
            | cons y ys ih =>
                simp only [List.map_cons, Galoistools.refPolyEvalRevAux]
                have hhead : NatModEq p ((a * y) % p) (a * y) := natModEq_mod_left (by rfl)
                have htail : NatModEq p
                    (x * Galoistools.refPolyEvalRevAux p x (ys.map (fun z => (a * z) % p)))
                    (x * (a * Galoistools.refPolyEvalRevAux p x ys)) := natModEq_mul (by rfl) ih
                have hsum := natModEq_mod_left (natModEq_add hhead htail)
                have halg : a * y + x * (a * Galoistools.refPolyEvalRevAux p x ys) =
                    a * (y + x * Galoistools.refPolyEvalRevAux p x ys) := by
                  simp [Nat.mul_add, Nat.mul_assoc, Nat.mul_left_comm, Nat.mul_comm]
                rw [halg] at hsum
                have hfactor : NatModEq p
                    (a * ((y + x * Galoistools.refPolyEvalRevAux p x ys) % p))
                    (a * (y + x * Galoistools.refPolyEvalRevAux p x ys)) :=
                  natModEq_mul (by rfl) (natModEq_mod_left (by rfl))
                exact hsum.trans hfactor.symm

          theorem natModEq_refPolyEvalRevAux_convolve (p x : Nat) (xs ys : List Nat) :
              NatModEq p
                (Galoistools.refPolyEvalRevAux p x (Galoistools.convolve p xs ys))
                (Galoistools.refPolyEvalRevAux p x xs * Galoistools.refPolyEvalRevAux p x ys) := by
            induction xs with
            | nil => rfl
            | cons a xs ih =>
                simp only [Galoistools.convolve]
                let head := ys.map (fun y => (a * y) % p)
                let tail := 0 :: Galoistools.convolve p xs ys
                have hzip := natModEq_refPolyEvalRevAux_zipAddPad p x head tail
                have hhead : NatModEq p (Galoistools.refPolyEvalRevAux p x head)
                    (a * Galoistools.refPolyEvalRevAux p x ys) := by
                  simpa [head] using natModEq_refPolyEvalRevAux_map_mul p x a ys
                have htail : NatModEq p (Galoistools.refPolyEvalRevAux p x tail)
                    (x * (Galoistools.refPolyEvalRevAux p x xs * Galoistools.refPolyEvalRevAux p x ys)) := by
                  simp only [tail, Galoistools.refPolyEvalRevAux, Nat.zero_add]
                  exact natModEq_mod_left (natModEq_mul (by rfl) ih)
                have hchain := hzip.trans (natModEq_add hhead htail)
                have halg : a * Galoistools.refPolyEvalRevAux p x ys +
                    x * (Galoistools.refPolyEvalRevAux p x xs * Galoistools.refPolyEvalRevAux p x ys) =
                    (a + x * Galoistools.refPolyEvalRevAux p x xs) * Galoistools.refPolyEvalRevAux p x ys := by
                  simp [Nat.add_mul, Nat.mul_assoc]
                rw [halg] at hchain
                have hfactor : NatModEq p
                    (Galoistools.refPolyEvalRevAux p x (a :: xs) * Galoistools.refPolyEvalRevAux p x ys)
                    ((a + x * Galoistools.refPolyEvalRevAux p x xs) * Galoistools.refPolyEvalRevAux p x ys) := by
                  simp only [Galoistools.refPolyEvalRevAux]
                  exact natModEq_mul (natModEq_mod_left (by rfl)) (by rfl)
                exact hchain.trans hfactor.symm
          '''
          text = text[:ai] + aux + text[aj:]
          start = '-- !benchmark @start proof def=prove_mul_eval_hom kind=prove target=spec_mul_eval_hom\n'
          end = '-- !benchmark @end proof def=prove_mul_eval_hom\n'
          i = text.index(start) + len(start)
          j = text.index(end, i)
          proof = r'''  intro f g p x hp
            simp only [canonical, Galoistools.gfMul]
            by_cases hzero : f = [] ∨ g = []
            · rw [if_pos hzero]
              rcases hzero with rfl | rfl <;> simp [Galoistools.refPolyEval, Galoistools.refPolyEvalRevAux]
            · rw [if_neg hzero, refPolyEval_gfStrip]
              simp only [Galoistools.refPolyEval, List.reverse_reverse]
              have hconv := natModEq_refPolyEvalRevAux_convolve p x f.reverse g.reverse
              unfold NatModEq at hconv
              simpa only [Nat.mod_mod] using hconv
          '''
          ring.write_text(text[:i] + proof + text[j:])
          subprocess.run(['lake','lean','Galoistools/Proof/Ring.lean'], cwd=source, check=True)
          artifact = extract(source, bench, mode='codeproof')
          write_artifact(artifact, source / 'artifact.json')
          result = run_evaluation(benchmark_dir=bench_dir, artifact=artifact, mode='codeproof', eval_sandbox_dir=Path('mul_eval/eval/sandbox').resolve(), report_dir=Path('mul_eval/eval').resolve(), lake_timeout=180)
          print(result.md_path.read_text())
          print('MUL_EVAL_PROBE_COMPLETE', result.report.summary)
          PY
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/mul_eval/
          if-no-files-found: warn
