name: Vero galoistools developmental v1

# Deterministic zero-API recomposition: scalar cancellation -> negation evaluation.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download scalar-cancellation artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32909525290
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Recompose negation-evaluation constructor
        working-directory: vero
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          from vero.generation.benchmark import Benchmark
          from vero.generation.extractor import read_artifact, extract, write_artifact
          from vero.generation.sandbox import create_sandbox

          bench_dir = Path('benchmarks/galoistools').resolve()
          bench = Benchmark(bench_dir)
          seed_path = Path('../baseline/source/artifact.json').resolve()
          if not seed_path.is_file():
              raise SystemExit(f'scalar seed missing: {seed_path}')
          seed = read_artifact(seed_path)
          source = Path('manual_probe/source').resolve()
          create_sandbox(bench_dir, source, mode='codeproof', overwrite=True, seed_artifact=seed)

          ring = source / 'Galoistools/Proof/Ring.lean'
          text = ring.read_text()
          scalar = 'theorem natModEq_add_eq_zero_right_neg'
          if scalar not in text:
              raise SystemExit('verified scalar cancellation theorem missing from seed')
          marker = 'theorem ring_gfStrip_eq_ref (f : List Nat) :'
          if marker not in text:
              raise SystemExit('insertion marker not found')

          lemma = r'''
          theorem natModEq_refPolyEvalRevAux_map_neg (p x : Nat) (hp : 1 < p)
              (xs : List Nat) :
              NatModEq p
                (Galoistools.refPolyEvalRevAux p x
                  (xs.map (fun c => (p - c % p) % p)))
                ((p - Galoistools.refPolyEvalRevAux p x xs % p) % p) := by
            let negs := xs.map (fun c => (p - c % p) % p)
            have hzip := natModEq_refPolyEvalRevAux_zipAddPad p x xs negs
            have hshape : Galoistools.zipAddPad p xs negs = xs.map (fun _ => 0) := by
              simpa [negs] using zipAddPad_neg_self p hp xs
            rw [hshape] at hzip
            have hzero : Galoistools.refPolyEvalRevAux p x (xs.map (fun _ => 0)) = 0 := by
              induction xs with
              | nil => rfl
              | cons a xs ih =>
                  simp [Galoistools.refPolyEvalRevAux, ih]
            have hsum : NatModEq p
                (Galoistools.refPolyEvalRevAux p x xs +
                  Galoistools.refPolyEvalRevAux p x negs) 0 := by
              rw [hzero] at hzip
              exact hzip.symm
            simpa [negs] using natModEq_add_eq_zero_right_neg p
              (Galoistools.refPolyEvalRevAux p x xs)
              (Galoistools.refPolyEvalRevAux p x negs) hp hsum

          '''
          ring.write_text(text.replace(marker, lemma + marker, 1))
          subprocess.run(['lake', 'lean', 'Galoistools/Proof/Ring.lean'], cwd=source, check=True)

          artifact = extract(source, bench, mode='codeproof')
          write_artifact(artifact, source / 'artifact.json')
          print('NEGATION_EVAL_COMPILED')
          PY

      - name: Upload deterministic probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/manual_probe/
          if-no-files-found: warn
