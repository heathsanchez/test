name: Vero galoistools developmental v1

# Recompose after verified residual-induced normalization law.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified normalization artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32905860354
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for constrained Horner recomposition
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# ECONOMICAL Horner recomposition after exact residual law\n\nYou begin from the independently Vero-verified 15/48 artifact containing the accumulated residual-induced capability stack:\n- `NatModEq`\n- `natModEq_mod`\n- `natModEq_add`\n- `natModEq_mul`\n- `natModEq_refPolyEvalRevAux_map_mod`\n- `natModEq_mod_left`\n\nThe previous Horner attempt already established that the empty-list branches are solved. Its only failure came from unfolding `NatModEq` too early in the paired branch, creating a redundant outer `% p`. That exact residual now has a verified constructor, `natModEq_mod_left`.\n\nRECOMPOSE now. Target exactly ONE theorem in Ring `global_aux` equivalent to:\n\n`NatModEq p\n  (Galoistools.refPolyEvalRevAux p x (Galoistools.zipAddPad p xs ys))\n  (Galoistools.refPolyEvalRevAux p x xs + Galoistools.refPolyEvalRevAux p x ys)`\n\nfor all `p x xs ys`.\n\nRules:\n1. Reuse `natModEq_refPolyEvalRevAux_map_mod` for both empty-side branches.\n2. In the paired branch, keep `NatModEq` ABSTRACT. Do NOT globally `unfold NatModEq`. Compose `natModEq_mul`, `natModEq_add`, and `natModEq_mod_left` at the exact normalization boundary.\n3. The only raw Nat equality you may prove is the distributive/associative rearrangement `(a+b)+x*(A+B) = (a+x*A)+(b+x*B)` (or an equivalent orientation), then transport it into `NatModEq` by rewriting.\n4. Inspect only the accumulated helpers and the two definitions. No repo inventory, no benchmark targets.\n5. Compile `Galoistools/Proof/Ring.lean` immediately. Allow at most ONE focused repair.\n6. If it compiles, STOP and retain it. Write `RESIDUAL_REPORT.md` naming exactly one cheapest transfer target among the unfilled Ring specs; prefer an addition/evaluation theorem that directly consumes this bridge.\n7. If it still fails, revert only the new Horner theorem and record the exact residual expression. Do not invent another abstraction in this run.\n8. No full build; Vero evaluation will independently check the artifact.\n\nThis is recomposition, not search. Be economical. Success is the compiled Horner/zipAddPad congruence bridge with the verified 15/48 state preserved.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify seed exists
        run: |
          test -s baseline/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/source/artifact.json)"

      - name: Run constrained Horner recomposition
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=75 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero Horner recomposition with normalization bridge' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
