name: Vero galoistools developmental v1
# zero-agent theorem-surface probe: inspect Lean 4.29.1 Nat extended-gcd API

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.29.1
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.29.1
      - name: Inspect extended-gcd theorem surface
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$HOME/.elan/toolchains/leanprover--lean4---v4.29.1/src/lean/Init/Data/Nat/Gcd.lean"
          grep -n -E 'xgcd|gcdA|gcdB|gcd_eq.*gcd' "$SRC" | tail -n 120
          cat > /tmp/Probe.lean <<'EOF'
          import Init.Data.Nat.Gcd
          #check Nat.xgcd
          #check Nat.gcdA
          #check Nat.gcdB
          #check Nat.gcd_eq_gcdA_mul_add_gcdB_mul
          #check Nat.gcd_eq_gcdA_mul_add_gcdB_mul
          EOF
          "$HOME/.elan/bin/lean" /tmp/Probe.lean || true
