name: Vero galoistools developmental v1

# Deterministic zero-API probe for the scalar modular cancellation law.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified 16-of-48 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32907148895
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Materialize 16-of-48 ratchet and test scalar lemma
        working-directory: vero
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          from vero.generation.benchmark import Benchmark
          from vero.generation.extractor import read_artifact, extract, write_artifact
          from vero.generation.sandbox import create_sandbox

          bench_dir = Path('benchmarks/galoistools').resolve()
          bench = Benchmark(bench_dir)
          seed = read_artifact(Path('../baseline/source/artifact.json').resolve())
          source = Path('manual_probe/source').resolve()
          create_sandbox(bench_dir, source, mode='codeproof', overwrite=True, seed_artifact=seed)

          ring = source / 'Galoistools/Proof/Ring.lean'
          text = ring.read_text()
          marker = 'theorem ring_gfStrip_eq_ref (f : List Nat) :'
          if marker not in text:
              raise SystemExit('insertion marker not found')

          lemma = r'''
          theorem natModEq_add_eq_zero_right_neg (p a b : Nat) (hp : 1 < p)
              (h : NatModEq p (a + b) 0) :
              NatModEq p b ((p - a % p) % p) := by
            unfold NatModEq at h ⊢
            simp only [Nat.zero_mod] at h
            rw [Nat.add_mod] at h
            have hp0 : 0 < p := by omega
            have ha_lt : a % p < p := Nat.mod_lt _ hp0
            have hb_lt : b % p < p := Nat.mod_lt _ hp0
            by_cases ha0 : a % p = 0
            · simpa [ha0, Nat.mod_mod] using h
            · have ha_pos : 0 < a % p := Nat.pos_of_ne_zero ha0
              by_cases hsum_ge : p ≤ a % p + b % p
              · have hsum_lt2 : a % p + b % p < p + p := by omega
                have hsub_lt : a % p + b % p - p < p := by omega
                have hmod : (a % p + b % p) % p =
                    (a % p + b % p - p) % p := Nat.mod_eq_sub_mod hsum_ge
                rw [hmod, Nat.mod_eq_of_lt hsub_lt] at h
                have hsum_eq : a % p + b % p = p := by omega
                have hcomp_lt : p - a % p < p := by omega
                have hb_eq : b % p = p - a % p := by omega
                rw [hb_eq]
                simp [Nat.mod_eq_of_lt hcomp_lt]
              · have hsum_lt : a % p + b % p < p := Nat.lt_of_not_ge hsum_ge
                rw [Nat.mod_eq_of_lt hsum_lt] at h
                omega

          '''
          ring.write_text(text.replace(marker, lemma + marker, 1))
          subprocess.run(['lake', 'lean', 'Galoistools/Proof/Ring.lean'], cwd=source, check=True)

          artifact = extract(source, bench, mode='codeproof')
          write_artifact(artifact, source / 'artifact.json')
          print('SCALAR_CANCELLATION_COMPILED')
          PY

      - name: Upload deterministic probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/manual_probe/
          if-no-files-found: warn
