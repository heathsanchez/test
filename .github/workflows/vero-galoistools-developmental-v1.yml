name: Vero galoistools developmental v1

# Cheapest direct transfer from verified Horner-addition bridge.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified Horner bridge artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32906063909
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for direct add-associativity transfer
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# ECONOMICAL benchmark transfer from verified Horner-addition capability\n\nYou begin from the independently Vero-verified 15/48 artifact containing the accumulated residual-induced stack, including the now-compiled theorem equivalent to:\n\n`natModEq_refPolyEvalRevAux_zipAddPad (p x) (xs ys) :\n  NatModEq p\n    (Galoistools.refPolyEvalRevAux p x (Galoistools.zipAddPad p xs ys))\n    (Galoistools.refPolyEvalRevAux p x xs + Galoistools.refPolyEvalRevAux p x ys)`\n\nThis run is the first external-capability transfer test. Target exactly ONE existing unfilled Ring benchmark theorem: the proof of `spec_add_assoc_eval`. Do not add another helper unless the theorem is literally unreachable without one; the hypothesis is that the retained Horner bridge is already sufficient.\n\nRules:\n1. Inspect only the statement/proof slot for `spec_add_assoc_eval`, the definition of `gfAdd`, and the retained Horner/addition helpers.\n2. Fill ONLY the `sorry` body for `spec_add_assoc_eval`. Do not change its statement and do not touch any other benchmark proof.\n3. Reuse `natModEq_refPolyEvalRevAux_zipAddPad` compositionally. Reduce the `gfAdd`/reverse/strip bookkeeping only as much as needed to expose evaluation of `zipAddPad`; reuse existing strip/reverse evaluation helpers if present.\n4. The target semantic law is exactly associativity of addition under `refPolyEval`; once both sides are reduced via the Horner bridge, finish with ordinary Nat modular-addition associativity.\n5. Compile `Galoistools/Proof/Ring.lean` immediately. Allow at most ONE focused repair.\n6. If `spec_add_assoc_eval` compiles, STOP. Do not attempt a second benchmark theorem. Record that the residual-induced constructor stack transferred into a previously unfilled scored spec.\n7. If it fails after one repair, restore only that benchmark proof to `sorry`, preserve all retained helpers, and record the exact remaining bookkeeping residual.\n8. No repo-wide search and no full build; Vero evaluation independently decides whether the scored slot moved from unfilled to passed.\n\nSuccess criterion: Vero moves from 15/48 to 16/48 with 0 failures because `spec_add_assoc_eval` is now verified.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify seed exists
        run: |
          test -s baseline/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/source/artifact.json)"

      - name: Run direct add-associativity transfer
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=75 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero direct transfer: spec_add_assoc_eval' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
