name: Vero galoistools developmental v1

# Transfer test from the verified 16/48 additive semantic capability stack.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-galoistools-developmental-v1.yml'

jobs:
  developmental:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Clone Vero
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero

      - name: Download verified 16-of-48 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32907148895
          name: vero-galoistools-developmental-v1
          path: baseline

      - name: Patch Vero for subtraction-evaluation transfer
        working-directory: vero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/vero/cli.py')
          s = p.read_text()
          old = '            gen_result = dispatch_generation(cfg, run_root)\n'
          new = '            gen_result = dispatch_generation(cfg, run_root, seed_artifact_path=__import__("os").environ.get("VERO_INITIAL_SEED"))\n'
          if old not in s:
              raise SystemExit('direct seed patch target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/vero/generation/prompt.py')
          s = p.read_text()
          old = '    return template.render(\n'
          new = '    base = template.render(\n'
          if old not in s:
              raise SystemExit('prompt render patch target not found')
          s = s.replace(old, new, 1)
          marker = '        upstream_source=upstream_source,\n    )\n'
          replacement = '''        upstream_source=upstream_source,\n    )\n    developmental = r"""\n\n# ECONOMICAL TRANSFER: subtraction evaluation\n\nStart from the independently Vero-verified 16/48 artifact from run 32907148895. This is the intact ratchet, not the ablation artifact. It contains the verified modular-congruence stack, `natModEq_refPolyEvalRevAux_zipAddPad`, `refPolyEval_gfStrip`, and the nearby subtraction bridge `zipSubPad_eq_add_neg`.\n\nTest exactly ONE sibling scored theorem: `spec_sub_eval_hom` (the corresponding `prove_sub_eval_hom` slot). This is a transfer test: determine whether the representation learned from additive evaluation makes subtraction semantics reachable with the existing retained language.\n\nRules:\n1. Inspect only `prove_sub_eval_hom`, `gfSub`, `zipSubPad`, `zipSubPad_eq_add_neg`, `gfNeg`, and the retained modular/Horner/strip helpers. No repo inventory.\n2. Push the strongest existing composition first. Do NOT invent a new helper unless the compile leaves one exact constructor-level residual that cannot be expressed from the retained helpers.\n3. Fill only the `prove_sub_eval_hom` scored proof. Do not touch any other scored slot.\n4. Prefer rewriting `zipSubPad` through `zipSubPad_eq_add_neg`, stripping with `refPolyEval_gfStrip`, and reusing the zip-add evaluation congruence.\n5. Compile `Galoistools/Proof/Ring.lean` immediately. Allow at most ONE focused repair.\n6. If it compiles, STOP. Preserve the proof and let Vero evaluate; success is 17/48, 0 failed.\n7. If it does not compile after one repair, revert only this scored proof, preserve the 16/48 capability stack, and report the smallest exact residual (for example a missing evaluation law for coefficient-wise negation). Do not keep searching.\n8. No full build; Vero evaluation is authoritative.\n\nThis run decides transfer versus the next residual.\n"""\n    return base + developmental\n'''
          if marker not in s:
              raise SystemExit('prompt tail patch target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Vero
        working-directory: vero
        run: uv sync

      - name: Verify seed exists
        run: |
          test -s baseline/source/artifact.json
          echo "seed artifact bytes: $(wc -c < baseline/source/artifact.json)"

      - name: Run subtraction-evaluation transfer
        working-directory: vero
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AGENT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERO_INITIAL_SEED: ${{ github.workspace }}/baseline/source/artifact.json
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret missing'
            exit 2
          fi
          printf 'OPENAI_API_KEY=%s\nCODEX_API_KEY=%s\nCODEX_AGENT_API_KEY=%s\n' "$OPENAI_API_KEY" "$CODEX_API_KEY" "$CODEX_AGENT_API_KEY" > .env
          uv run vero run \
            benchmark=galoistools \
            agent=codex \
            credentials=none \
            mode=codeproof \
            name=galoistools-developmental-v1 \
            agent.timeout_seconds=80 \
            agent.sandbox_mode=danger-full-access \
            iterate.max=0

      - name: Summarize result
        if: always()
        working-directory: vero
        shell: bash
        run: |
          echo '## Vero transfer: spec_sub_eval_hom' >> "$GITHUB_STEP_SUMMARY"
          find agent_runs/galoistools-developmental-v1 -name report.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          find agent_runs/galoistools-developmental-v1 -name RESIDUAL_REPORT.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-developmental-v1
          path: vero/agent_runs/galoistools-developmental-v1/
          if-no-files-found: warn
