name: Vero monic mul direct V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/vero_monic_mul_direct_v1.py'
      - '.github/workflows/vero-monic-mul-direct-v1.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download certified 27 ratchet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33053705380
          name: vero-galoistools-mul-promote-v1
          path: baseline27
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Run direct monic theorem probe
        working-directory: vero
        run: uv run python ../.github/scripts/vero_monic_mul_direct_v1.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-monic-mul-direct-v1
          path: vero/monic_mul_direct_v1/
          if-no-files-found: warn
