name: Vero MSI Certified GCD Revision V4

on:
  push:
    paths:
      - '.github/scripts/vero_msi_certified_gcd_revision_v4.py'
      - '.github/workflows/vero-msi-certified-gcd-revision-v4.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  certified-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33151050152
          name: vero-galoistools-monic-mul-associate-promote-v1
          path: baseline28
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Residual-forced certified GCD revision
        run: python .github/scripts/vero_msi_certified_gcd_revision_v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vero-msi-certified-gcd-revision-v4
          path: |
            certified_gcd_revision_v4.json
            vero_msi_certified_gcd_revision_v4/Galoistools/Impl/Division.lean
            vero_msi_certified_gcd_revision_v4/Galoistools/Proof/Division.lean
