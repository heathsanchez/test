name: Vero MSI Cross-Family Compounding V1
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/vero_msi_cross_family_compounding_v1.py'
      - '.github/workflows/vero-msi-cross-family-compounding-v1.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Vero benchmark harness
        run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download certified baseline artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33053705380
          name: vero-galoistools-mul-promote-v1
          path: baseline27
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Run source-distinct Lean compounding gate
        working-directory: vero
        run: uv run python ../.github/scripts/vero_msi_cross_family_compounding_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vero-msi-cross-family-compounding-v1
          path: vero/msi_cross_family_compounding_v1/result.json
          if-no-files-found: warn
