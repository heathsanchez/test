name: Vero MSI interface compilation V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/vero_msi_interface_compilation_v1.py'
      - '.github/workflows/vero-msi-interface-compilation-v1.yml'

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download certified cold source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33159291952
          name: vero-cold-source-certification-v1
          path: coldcert
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Measure cold warm sham Division frontiers
        run: python .github/scripts/vero_msi_interface_compilation_v1.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: vero-msi-interface-compilation-v1
          path: vero_msi_interface_compilation_v1
