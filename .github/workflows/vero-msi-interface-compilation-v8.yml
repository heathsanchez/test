name: Vero MSI interface compilation V8

on:
  push:
    paths:
      - '.github/scripts/vero_msi_interface_compilation_v8.py'
      - '.github/workflows/vero-msi-interface-compilation-v8.yml'
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download certified cold source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33159291952
          name: vero-cold-source-certification-v1
          path: coldcert
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Measure evaluation interface
        run: python .github/scripts/vero_msi_interface_compilation_v8.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-msi-interface-compilation-v8
          path: vero_msi_interface_compilation_v8
          if-no-files-found: warn
