name: Vero MSI quotient-step V11
on:
  push:
    paths:
      - '.github/scripts/vero_msi_quotient_step_v11.py'
      - '.github/workflows/vero-msi-quotient-step-v11.yml'
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33159291952
          name: vero-cold-source-certification-v1
          path: coldcert
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run V11
        run: python .github/scripts/vero_msi_quotient_step_v11.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-msi-quotient-step-v11
          path: vero_msi_quotient_step_v11
