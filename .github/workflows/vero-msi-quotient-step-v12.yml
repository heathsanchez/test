name: Vero MSI quotient-step V12
on:
  push:
    paths:
      - '.github/scripts/vero_msi_quotient_step_v12.py'
      - '.github/workflows/vero-msi-quotient-step-v12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33159291952
          name: vero-cold-source-certification-v1
          path: coldcert
      - run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python .github/scripts/vero_msi_quotient_step_v12.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vero-msi-quotient-step-v12
          path: vero_msi_quotient_step_v12
