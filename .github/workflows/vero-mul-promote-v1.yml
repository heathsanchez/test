name: Vero multiplication promotion V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vero-mul-promote-v1.yml'
      - '.github/scripts/vero_mul_promote_v1.py'
      - '.github/scripts/vero_galoistools_allin.py'
      - '.github/scripts/vero_mul_leading_v1.py'

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download gcd-zero ratchet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 32926602836
          name: vero-galoistools-developmental-v1
          path: baseline
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Promote multiplication proofs and certify full census
        working-directory: vero
        run: uv run python ../.github/scripts/vero_mul_promote_v1.py
      - name: Upload promoted all-in result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-mul-promote-v1
          path: |
            vero/galoistools_allin/
            vero/allin_artifact.json
          if-no-files-found: warn
