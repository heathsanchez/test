name: Vero official grade full48 V1
on:
  push:
    paths:
      - '.github/scripts/vero_official_grade_full48_v1.py'
      - '.github/workflows/vero-official-grade-full48-v1.yml'
  workflow_dispatch:
jobs:
  grade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download decontaminated full48 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33154946001
          name: vero-galoistools-full48-decontaminated-v1
          path: decontaminated
      - name: Checkout Vero benchmark and grader
        uses: actions/checkout@v4
        with:
          repository: sunblaze-ucb/vero
          path: vero
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        run: python -m pip install -e ./vero
      - name: Run fresh anti-cheat rerender and axiom grader
        run: python .github/scripts/vero_official_grade_full48_v1.py
      - name: Upload official-grade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-official-grade-full48-v1
          path: official_grade_full48_v1
          if-no-files-found: error
