name: Vero remaining 20 promotion V1
on:
  push:
    paths:
      - '.github/scripts/vero_remaining20_promote_v1.py'
      - '.github/workflows/vero-remaining20-promote-v1.yml'
  workflow_dispatch:
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download certified 28-proof baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33151050152
          name: vero-galoistools-monic-mul-associate-promote-v1
          path: baseline28
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Promote all 20 and full build
        run: python .github/scripts/vero_remaining20_promote_v1.py
      - name: Upload full promoted source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-galoistools-full48-promote-v1
          path: |
            remaining20_promote_v1
            remaining20_promote_result.json
          if-no-files-found: error
