name: Vero selected unit mul modeq V1

on:
  push:
    paths:
      - '.github/scripts/vero_selected_unit_mul_modeq_v1.py'
      - '.github/workflows/vero-selected-unit-mul-modeq-v1.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/sunblaze-ucb/vero.git vero
      - name: Download certified 27 ratchet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: heathsanchez/test
          run-id: 33053705380
          name: vero-galoistools-mul-promote-v1
          path: baseline27
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Vero
        working-directory: vero
        run: uv sync
      - name: Run selected-unit separator
        working-directory: vero
        run: uv run python ../.github/scripts/vero_selected_unit_mul_modeq_v1.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vero-selected-unit-mul-modeq-v1
          path: vero/selected_unit_mul_modeq_v1/
