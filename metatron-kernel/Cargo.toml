[package]
name = "metatron-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Residual-grown Lean Kernel Arena checker"

[features]
diagnostics = []
semantic-witness = []

[dependencies]
serde_json = "1"
sha2 = "0.10"

[lib]
name = "metatron_kernel"
path = "src/lib.rs"

[[bin]]
name = "metatron-kernel"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
