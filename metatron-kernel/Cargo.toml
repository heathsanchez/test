[package]
name = "metatron-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Residual-grown Lean Kernel Arena checker"

[features]
diagnostics = []

[dependencies]
serde_json = "1"
stumpalo = "=0.5.1"
sokonanoda = { git = "https://github.com/metalogiclabs/mathgraph-lean-kernel", rev = "78c7502bac8a5ba000057b3f083bc0595ac65750" }

[lib]
name = "metatron_kernel"
path = "src/lib.rs"

[[bin]]
name = "metatron-kernel"
path = "src/main.rs"
