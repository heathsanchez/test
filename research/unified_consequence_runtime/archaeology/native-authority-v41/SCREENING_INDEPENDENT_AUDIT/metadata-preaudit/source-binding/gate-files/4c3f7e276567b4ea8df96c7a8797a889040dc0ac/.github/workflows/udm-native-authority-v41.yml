name: Literal dependency includes native admission v4.1
on:
  workflow_dispatch:
  push:
    branches: [research/udm-native-authority-v4-includes-20261016]
permissions:
  contents: read
  actions: read
concurrency:
  group: udm-native-authority-v41-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify-admission:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qualify-authority-v41]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Prepare controller and original catalog runtimes in new paths
        run: |
          set -euo pipefail
          python -B -m venv "$RUNNER_TEMP/v41-controller"
          "$RUNNER_TEMP/v41-controller/bin/python" -B -m pip install --disable-pip-version-check --no-input pytest==8.3.5 packaging==26.3 2>&1 | tee "$RUNNER_TEMP/v41-controller-install.log"
          "$RUNNER_TEMP/v41-controller/bin/python" -B research/unified_consequence_runtime/archaeology/native-environment-v3/bootstrap/prepare_runtimes.py --catalog research/unified_consequence_runtime/archaeology/native-environment-v3/ENVIRONMENT_CATALOG.json --dest-root "$RUNNER_TEMP/v41-original-runtimes" --out "$RUNNER_TEMP/v41-original-runtime-paths.json" 2>&1 | tee "$RUNNER_TEMP/v41-original-bootstrap.log"
      - name: Prepare independently pinned complete modern V41 profile
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v41-controller/bin/python" -B research/unified_consequence_runtime/archaeology/native-authority-v41/bootstrap/prepare_profile.py --catalog research/unified_consequence_runtime/archaeology/native-authority-v41/ENVIRONMENT_CATALOG.json --runtimes "$RUNNER_TEMP/v41-original-runtime-paths.json" --dest-root "$RUNNER_TEMP/v41-modern-profile" --runtime-out "$RUNNER_TEMP/v41-runtime-paths.json" --out "$RUNNER_TEMP/v41-profile-preparation.json" 2>&1 | tee "$RUNNER_TEMP/v41-profile-bootstrap.log"
      - name: Freeze exact committed source and both runtime authorities
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v41-controller/bin/python" -B -m research.unified_consequence_runtime.qualify_environment_selection_v41 --write-freeze --repo "$GITHUB_WORKSPACE" --runtimes "$RUNNER_TEMP/v41-runtime-paths.json" --out qualification/FREEZE.json 2>&1 | tee "$RUNNER_TEMP/v41-source-freeze.log"
          cp "$RUNNER_TEMP/v41-runtime-paths.json" qualification/RUNTIMES.json
          cp "$RUNNER_TEMP/v41-profile-preparation.json" qualification/PROFILE_PREPARATION.json
      - name: Verify source-only integration and preserved index-audit contracts
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v41-controller/bin/python" -B -m unittest research.unified_consequence_runtime.test_native_environment_v4 research.unified_consequence_runtime.test_native_environment_v41 research.unified_consequence_runtime.test_audit_index_v4 research.unified_consequence_runtime.test_qualify_environment_v4_retention research.unified_consequence_runtime.test_qualify_native_frontier_v41 -v 2>&1 | tee qualification/binding-contracts.log
      - name: Execute both new native controls under the exact legacy profile
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v41-controller/bin/python" -B -m research.unified_consequence_runtime.qualify_environment_selection_v41 --legacy-native-controls --repo "$GITHUB_WORKSPACE" --freeze qualification/FREEZE.json --out "$GITHUB_WORKSPACE/qualification/legacy-v41"
      - name: Execute all 27 acceptance and 20 original native preservation controls
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v41-controller/bin/python" -B -m research.unified_consequence_runtime.qualify_environment_selection_v41 --repo "$GITHUB_WORKSPACE" --freeze qualification/FREEZE.json --out "$GITHUB_WORKSPACE/qualification/admission-v41"
      - name: Require separately retained native executions and admission-only result
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          legacy=json.loads(Path('qualification/legacy-v41/RESULT.json').read_text())
          assert legacy['status']=='LEGACY_NATIVE_CONTROLS_VERIFIED'
          assert legacy['contracts']['run']==2 and legacy['contracts']['successful']
          assert legacy['first_task_gate']['status']=='UNKNOWN'
          r=json.loads(Path('qualification/admission-v41/RESULT.json').read_text())
          assert r['status']=='ADMISSION_ONLY_QUALIFIED' and r['first_task_gate']['status']=='PASS'
          assert r['contracts']['run']==47 and len(r['contracts']['ids'])==47
          assert r['contracts']['successful'] and not r['contracts']['skipped']
          for result in (legacy,r):
              assert result['attempt_costs']['native_calls']>0 and result['attempt_costs']['collection_calls']>0
              assert not result['index_audit']['changes']
              assert all(result['verdicts'][f'G{i}']=='UNKNOWN' for i in range(2,7))
              pair=result['positive_independent_native']['executions']
              assert len(pair)==2 and all(row['status']=='PASS_NATIVE' and row['junit']['passed']==2 for row in pair)
          assert r['verdicts']['G0_G1']=='PRESERVED_EXACT_PRIOR_SOURCE_AUTHORITY'
          print(json.dumps({'status':r['status'],'contracts':r['contracts']['run'],'attempt_costs':r['attempt_costs'],'verdicts':r['verdicts']},sort_keys=True))
          PY
      - name: Retain final original-runtime byte audit
        if: ${{ always() && hashFiles('qualification/FREEZE.json') != '' }}
        run: |
          "$RUNNER_TEMP/v41-controller/bin/python" -B research/unified_consequence_runtime/archaeology/native-environment-v3/bootstrap/prepare_runtimes.py --audit-freeze qualification/FREEZE.json --out qualification/POST_CONTROL_RUNTIME_AUDIT.json
      - name: Archive exact committed source and all retained success or failure evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p qualification
          python -B - <<'PY'
          import hashlib,json,os,subprocess,tarfile
          from pathlib import Path
          from research.unified_consequence_runtime.audit_index_v4 import snapshot_indexes,compare_indexes
          def retain(snapshot,path):
              path.mkdir()
              for index,row in enumerate(snapshot['indexes']):
                  if row['exists']:
                      raw=Path(row['path']).read_bytes()
                      if hashlib.sha256(raw).hexdigest()!=row['sha256']:raise ValueError('index changed during archival snapshot')
                      (path/('index-'+str(index)+'.bytes')).write_bytes(raw)
              (path/'SNAPSHOT.json').write_text(json.dumps(snapshot,sort_keys=True)+'\n')
          root=Path('qualification');before=snapshot_indexes('.')
          retain(before,root/'archive-index-before')
          try:
              subprocess.run(['git','archive','--format=tar.gz','--output='+str(root/'SOURCE.tar.gz'),os.environ['GITHUB_SHA']],check=True)
          finally:
              after=snapshot_indexes('.');retain(after,root/'archive-index-after')
              audit={'before':before,'after':after,'changes':compare_indexes(before,after)}
              (root/'ARCHIVE_INDEX_AUDIT.json').write_text(json.dumps(audit,sort_keys=True)+'\n')
          entries={}
          for name in ('v41-controller-install.log','v41-original-bootstrap.log','v41-profile-bootstrap.log','v41-source-freeze.log','v41-profile-preparation.json','v41-runtime-paths.json','v41-original-runtime-paths.json'):
              path=Path(os.environ['RUNNER_TEMP'])/name
              if path.is_file():entries['preparation/'+name]=path
          for origin,prefix in [(root,''),(Path(os.environ['RUNNER_TEMP'])/'v41-original-runtimes','original-runtime-bootstrap/'),(Path(os.environ['RUNNER_TEMP'])/'v41-modern-profile','modern-profile-preparation/')]:
              if not origin.exists():continue
              for folder,dirs,names in os.walk(origin,followlinks=False):
                  dirs[:]=sorted(n for n in dirs if n not in {'venv','.git','source','metadata-source','base-build','miniconda-base','wheels'} and not (Path(folder)/n).is_symlink())
                  for name in sorted(names):
                      path=Path(folder)/name
                      if path.is_file() and not path.is_symlink() and name not in {'MANIFEST.json','NATIVE_AUTHORITY_V41_EVIDENCE.tar.gz','SOURCE.tar.gz'}:
                          entries[prefix+path.relative_to(origin).as_posix()]=path
          files={name:hashlib.sha256(path.read_bytes()).hexdigest() for name,path in sorted(entries.items())}
          archive=root/'NATIVE_AUTHORITY_V41_EVIDENCE.tar.gz'
          with tarfile.open(archive,'w:gz') as packet:
              for name,path in sorted(entries.items()):packet.add(path,arcname=name,recursive=False)
          files[archive.name]=hashlib.sha256(archive.read_bytes()).hexdigest()
          files['SOURCE.tar.gz']=hashlib.sha256((root/'SOURCE.tar.gz').read_bytes()).hexdigest()
          (root/'MANIFEST.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'files':files},sort_keys=True)+'\n')
          if audit['changes']:raise ValueError('Git index changed during source archival; evidence retained')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-authority-v41-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            qualification/
            ${{ runner.temp }}/v41-*.json
            ${{ runner.temp }}/v41-*.log
            ${{ runner.temp }}/v41-original-runtimes/**/*.json
            ${{ runner.temp }}/v41-original-runtimes/**/*.log
            ${{ runner.temp }}/v41-modern-profile/*.json
            ${{ runner.temp }}/v41-modern-profile/*.log
            ${{ runner.temp }}/v41-modern-profile/pins.txt
          include-hidden-files: true
          retention-days: 90
